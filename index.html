<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

const D = {"gerado_em": "25/07/2026 02:19", "stats": {"noticias_novas": 809, "resumos_gerados": 250}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Partido dos Trabalhadores (PT) intensificou sua campanha para as eleições de 2026, com foco especial no estado de São Paulo. Lula lidera as pesquisas com 48% das intenções de voto contra Flávio Bolsonaro, que tem 43%, conforme a pesquisa Datafolha divulgada em setembro. A campanha petista contará com o apoio do tempo de televisão para ampliar sua vantagem. O PL anunciou Clariana Barão como candidata à Presidência após o candidato anterior, Barbosa, desistir da disputa. Além disso, a defesa de Jair Bolsonaro recorreu contra as restrições impostas pelo ministro Alexandre de Moraes ao seu regime de prisão domiciliar, argumentando que elas limitam sua liberdade de pensamento. Em outra notícia política, o governador do Piauí, Rafael Fonteles (PT), descartou qualquer acordo para evitar a participação de Ciro Nogueira na campanha eleitoral.", "mundo": "Taiwan enfrenta pressões diplomáticas e econômicas da parte de Pequim. O país está intensificando os planos para garantir a continuidade do abastecimento de combustíveis e outros importados essenciais, enquanto navios do governo chinês realizam manobras que poderiam ser usadas em um bloqueio futuro. Paralelamente, o presidente dos Estados Unidos, Donald Trump, entrou com uma ação judicial logo após implementar novas tarifas sobre importações brasileiras e ameaçar tarifas canadenses, levantando dúvidas sobre sua validade legal. Em outro desenvolvimento, a USTR notificou que aplicará uma tarifa de 10% sobre Taiwan sob a seção 301, parte de uma investigação comercial mais ampla conduzida pelos EUA.\n\nA Unesco incluiu o sítio arqueológico de Sebastia, na Cisjordânia (ocupada por Israel), tanto no Patrimônio Mundial quanto no Patrimônio em Perigo, apesar das objeções israelitas. Esta decisão ocorreu após uma reunião emergencial e reflete o crescente conflito entre as posições israelita e palestiniana sobre a preservação do patrimônio cultural da região. No outro desenvolvimento geopolítico, o presidente dos Estados Unidos, Donald Trump, retornou a um gala de imprensa na Casa Branca após uma tentativa de assalto com tiros em abril, onde fez piadas e criticou seus adversários políticos. As tensões na região do Oriente Médio continuam elevadas, com o Irã acusado de enviar drones, mísseis e ouro para os houthis no Iêmen, aumentando as tensões no Mar Vermelho. Além disso, a Arábia Saudita realizou ataques contra alvos hutíes em Hodeida, após o grupo rebelde anunciar um bloqueio marítimo à Arábia Saudita e atacar navios da coalizão liderada por Riad, ameaçando um cessar-fogo que havia expirado mas se mantido até então. Estes eventos refletem a complexidade das relações internacionais e os desafios persistentes na região.", "economia": "A economia brasileira enfrenta pressões com a implementação de novas tarifas de 37,5% nos Estados Unidos. Essas tarifas afetarão quase 4.000 produtos e R$ 55 bilhões em exportações, conforme informou a Confederação Nacional da Indústria (CNI). A medida, anunciada após multas pesadas às grandes empresas de tecnologia americanas, pode levar a uma escalada nas tensões comerciais entre os dois países. No cenário internacional, o iene atingiu um novo nível baixo histórico, chegando perto do patamar de ¥165 por dólar. Na economia doméstica, a Embraer encerrou o segundo trimestre com uma carteira de encomendas avaliada em 34,5 bilhões de dólares, representando um crescimento de 16% em comparação com o período anterior. Além disso, o dólar ficou estável em R$ 5,081 na sexta-feira, após uma semana de queda de 0,58%. O Ibovespa, por sua vez, desvalorizou mais de 1% devido a preocupações com o cenário fiscal brasileiro.", "tecnologia": "A indústria de semicondutores está expandindo significativamente suas operações e parcerias, com planos para a construção de cerca de 89 fábricas até 2030 e mais 50 entre 2030 e 2035. Este crescimento é impulsionado pela crescente demanda por chips de inteligência artificial (IA), levando a investimentos globais em infraestrutura de IA que podem chegar a US$1 trilhão até 2026, expandindo o mercado para US$1,5 trilhão até 2030. A Taiwan está ampliando suas parcerias além das fábricas para incluir áreas como inteligência artificial, fotônica e quântica, enquanto a Coreia do Sul se posiciona como um centro crucial para o desenvolvimento, utilização e compartilhamento da IA, com anúncios de parcerias bilionárias com empresas globais como a Nvidia. Além disso, a SpaceX realizou com sucesso seu primeiro voo de teste do Starship desde sua oferta pública inicial (IPO) da empresa, enquanto a NASA enfrenta danos em seus centros de comunicação espacial devido a incêndios florestais na Espanha.", "ciencia": "A SpaceX realizou com sucesso o décimo terceiro voo de teste do Starship, um avanço significativo para a empresa no desenvolvimento de um veículo de transporte totalmente reutilizável. O voo ocorreu em 24 de julho e demonstrou as habilidades necessárias para futuros voos orbitais. Paralelamente, pesquisadores da Vrije Universiteit Brussel estão utilizando ossos exumados de cidadãos medievais para dar rostos e vozes aos anônimos de Ypres através de uma exposição interdisciplinar que combina arqueologia, genética e história. Em outro desenvolvimento científico, pesquisadores da Universidade de Amsterdã descobriram estados longevos de íons de ytterbium, o que promete avanços em computação quântica e relógios atômicos. Estes avanços tecnológicos e científicos demonstram a importância contínua da inovação no campo da ciência.", "cultura": "A Festa Literária Internacional de Paraty (Flip) enfrentou um orçamento reduzido de 48% entre os anos de 2025 e 2026, mas manteve a estrutura do evento sem alterações perceptíveis. Durante o encontro na Flip, escritoras como Nathacha Appanah alertaram sobre os perigos aos direitos das mulheres, enquanto Djamila Ribeiro discutiu conceitos como 'lugar de fala' e 'identitarismo'. No cenário cultural, a cantora Anitta decidiu abandonar o projeto do álbum 'Equilibrium 2', voltado para seu público internacional. Outros eventos incluem a apresentação das quatro sinfonias de Johannes Brahms pelo Festival de Campos do Jordão, além da exibição gratuita do novo álbum de Jão no vale do Anhangabaú em São Paulo e sessões gratuitas da animação 'Persépolis' no IMS Paulista.", "sociedade": "O jornalismo destaca casos significativos na sociedade. Em Ribeirão Preto, após um temporal que deixou uma morte e mais de 250 ocorrências, o governo do estado de São Paulo enviou ajuda humanitária à cidade. Na área da saúde, a Organização Pan-Americana da Saúde (PAHO) apoia a transição para a recuperação à longo prazo na região afetada por um terremoto, buscando garantir serviços sustentáveis. No campo social, mulheres negras buscam estabilidade e segurança profissional, sonhando com uma vida sem medo de escassez. Em Goiânia, o jornalista Delson Carlos foi encontrado morto em seu apartamento, com as circunstâncias do caso ainda sendo investigadas.", "meio_ambiente": "A França e a Espanha enfrentam um período intenso de incêndios florestais, com mais de 200 mil pessoas evacuadas nos dois países. Em particular, a península de Cap Ferret na França foi completamente esvaziada para combater as chamas que consumiram 10.000 hectares e ameaçaram o turismo local. Na Espanha, uma onda histórica de calor declarou estado de emergência nacional, intensificando os incêndios florestais na região central de Madrid e no sul da França, obrigando ao menos 80 mil pessoas a serem evacuadas. Essas situações ocorrem durante um verão extremamente quente em toda a Europa, com modelos meteorológicos indicando que uma onda de calor atingirá a França a partir do próximo fim de semana. Paralelamente, o El Niño está se desenvolvendo rapidamente, aumentando as chances de 2026 ser o ano mais quente desde registros meteorológicos.", "direitos_humanos": "A Assembleia Geral das Nações Unidas aprovou uma extensão de quatro anos no mandato do Alto Comissário para os Direitos Humanos, Volker Turk. A proposta foi apoiada por uma ampla maioria, mas enfrentou oposição de países como Rússia, Israel e Estados Unidos. Em outro desenvolvimento, a abordagem multilateralista na questão dos direitos humanos foi testada com a decisão do governo americano de notificar mais de 100 mil pessoas para pagar uma multa ou sair do país, em um esforço para acelerar o retorno de imigrantes. No Brasil, o Dia Internacional da Mulher Negra foi celebrado com discussões sobre avanços e desafios na luta antirracista e pelo direito das mulheres negras. Além disso, o ex-fiscal Guerra está sob vigilância atenta em relação ao seu caso, embora não haja detalhes adicionais sobre o estado ou as implicações deste caso. No cenário internacional, a morte de uma menina chinesa após uma terapia genética experimental levou à investigação da Science e da Retraction Watch, destacando questões éticas na pesquisa médica."}, "resumo_do_dia": {"politica_nacional": [{"id": 70963, "titulo": "Trump brinca e diz que vai concorrer ao 3º mandato: \"Será ainda melhor\"", "url": "https://www.metropoles.com/mundo/trump-brinca-e-diz-que-vai-concorrer-ao-3o-mandato-sera-ainda-melhor", "fonte_id": "metropoles", "data_pub": "2026-07-25T04:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Constituição dos Estados Unidos limita o presidente a dois mandatos, e Donald Trump está atualmente no segundo deles. No entanto, ele brincou sobre a possibilidade de concorrer para um terceiro mandato.", "titulo_pt": "Trump brinca com a ideia de disputar um terceiro mandato", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 70891, "titulo": "'Efeito Gabrielli' mostra o velho na política de Lula", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/adriana-fernandes/2026/07/efeito-gabrielli-mostra-o-velho-na-politica-de-lula.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-25T03:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dario Durigan, substituto de Fernando Haddad na Fazenda, atuou como mediador durante a campanha para a reeleição de Lula, buscando contornar problemas causados por conversas entre representantes da Faria Lima e Sérgio Gabrielli.", "titulo_pt": "Efeito Gabrielli: dario durigan atuou como bombeiro na campanha de Lula", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 70967, "titulo": "TJSP prorroga prisão de vereador do PT por suspeita de elo com o PCC", "url": "https://www.metropoles.com/sao-paulo/tjsp-prorroga-prisao-de-vereador-do-pt-por-suspeita-de-elo-com-o-pcc", "fonte_id": "metropoles", "data_pub": "2026-07-25T02:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal de Justiça do Estado de São Paulo (TJSP) prorrogou a prisão preventiva do vereador Senival Moura (PT), acusado de lavagem de dinheiro em favor da facção criminosa PCC, através de uma empresa de ônibus.", "titulo_pt": "TJSP prorroga prisão de vereador do PT por suspeita de ligação com o PCC", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 70892, "titulo": "'Minha Casa, Minha Vida é tão bem estruturado que está acima de qualquer governo', diz CEO da Patrimar", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/minha-casa-minha-vida-e-tao-bem-estruturado-que-esta-acima-de-qualquer-governo-diz-ceo-da-patrimar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-25T02:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2022, a construtora Patrimar decidiu expandir sua presença na capital paulista e lançou seu primeiro projeto de Minha Casa, Minha Vida sob a marca Novolar em 2026.", "titulo_pt": "Minha Casa, Minha Vida é tão bem estruturado que está acima de qualquer governo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 70896, "titulo": "Em alta, mercado de aluguel se prepara para novas regras da reforma tributária", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/em-alta-mercado-de-aluguel-se-prepara-para-novas-regras-da-reforma-tributaria.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-25T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A família de Malise Máximo administra oito imóveis para aluguel na zona leste de São Paulo, incluindo residências e comércio. O patrimônio foi construído pelo sogro dela, um imigrante português, seguindo um modelo típico do bairro com comércio embaixo e sobradinhos acima.", "titulo_pt": "Mercado de aluguel se prepara para novas regras da reforma tributária", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 70934, "titulo": "Haddad prioriza segurança pública e interior em pré-campanha ao Governo de SP", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/haddad-prioriza-seguranca-publica-e-interior-em-pre-campanha-ao-governo-de-sp.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-25T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fernando Haddad, do PT, prioriza a segurança pública e o interior de São Paulo em sua pré-campanha para governador. Os focos temáticos também incluem educação e privatização da Sabesp.", "titulo_pt": "Haddad destaca segurança pública e interior em pré-campanha ao Governo de SP", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 70935, "titulo": "Lula prioriza campanha em São Paulo, e PT direciona anúncios para cidades-chave no estado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/lula-prioriza-campanha-em-sao-paulo-e-pt-direciona-anuncios-para-cidades-chave-no-estado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-25T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido dos Trabalhadores (PT) está priorizando o estado de São Paulo para a campanha do presidente Lula à reeleição, com grandes eventos já nos próximos dias e uma intensa publicidade online direcionada a cidades-chave no estado.", "titulo_pt": "PT prioriza São Paulo na campanha de lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 70936, "titulo": "Datafolha revela que eleitores de centro seguem sem candidato definido", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/datafolha-revela-que-eleitores-de-centro-seguem-sem-candidato-definido.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-25T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha revela que o eleitorado de centro ainda não tem um candidato preferido. Os nomes que buscam evitar a polarização têm baixa pontuação nesse segmento.", "titulo_pt": "Datafolha mostra que eleitores de centro seguem sem candidato definido", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 70984, "titulo": "Nova pesquisa Quaest mostra disputa ao governo estadual no reduto de Ronaldo Caiado", "url": "https://veja.abril.com.br/politica/nova-pesquisa-quaest-mostra-disputa-ao-governo-estadual-no-reduto-de-ronaldo-caiado/", "fonte_id": "veja", "data_pub": "2026-07-25T01:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa Quaest será divulgada no dia 30 de outubro, levantando informações sobre a corrida pelo governo do estado de Goiás. O estudo focará especialmente na região tradicionalmente controlada por Ronaldo Caiado.", "titulo_pt": "Nova pesquisa Quaest medirá disputa pelo governo estadual em reduto de Ronaldo Caiado", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 71097, "titulo": "Governo reduz previsão de déficit primário de estatais em 2026 para R$ 95,1 milhões", "url": "https://www.infomoney.com.br/politica/governo-reduz-previsao-de-deficit-primario-de-estatais-em-2026-para-r-951-milhoes/", "fonte_id": "infomoney", "data_pub": "2026-07-25T01:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo reduziu a previsão de déficit primário das estatais para R$ 95,1 milhões em 2026. Essa estimativa já considera os R$ 10 bilhões que foram excluídos da meta das estatais por causa do plano de reestruturação dos Correios.", "titulo_pt": "Governo reduz previsão de déficit primário de estatais em 2026 para R$ 95,1 milhões", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 71080, "titulo": "Eleições 2026: PT aposta em tempo de TV para ampliar vantagem de Lula", "url": "https://www.cnnbrasil.com.br/eleicoes/eleicoes-2026-pt-aposta-em-tempo-de-tv-para-ampliar-vantagem-de-lula/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-25T01:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Datafolha indica que Lula lidera com 48% contra 43% de Flávio Bolsonaro no segundo turno das eleições. O Partido dos Trabalhadores comemora a estabilidade desses números.", "titulo_pt": "Eleições 2026: PT celebra estabilidade dos números em vantagem de Lula", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 70937, "titulo": "Após desistência de Barbosa, DC anuncia advogada como candidata a presidente", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/apos-desistencia-de-barbosa-dc-anuncia-advogada-como-candidata-a-presidente.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-25T00:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O partido Democracia Cristã anunciou que a advogada Clariana Barão será sua candidata à Presidência da República. A decisão foi tomada após a desistência do candidato anterior, Barbosa.", "titulo_pt": "DC anuncia advogada como candidata a presidente", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 70938, "titulo": "Dois lados da polêmica sobre caravanas de juízes a Portugal", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/frederico-vasconcelos/2026/07/dois-lados-da-polemica-sobre-caravanas-de-juizes-a-portugal.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-24T23:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A imagem da 'arrogância do silêncio' foi utilizada para descrever o comportamento de alguns líderes envolvidos em caravanas de juízes a Portugal. Esta expressão, atribuída ao jurista Joaquim Falcão, sugere que essas figuras evitam explicar suas ações à população e permanecem em seus cargos sem transparência.", "titulo_pt": "Dois lados da polêmica sobre caravanas de juízes a Portugal", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 70989, "titulo": "O argumento de Bolsonaro em recurso contra decisão de Alexandre de Moraes", "url": "https://veja.abril.com.br/politica/o-argumento-de-bolsonaro-em-recurso-contra-decisao-de-alexandre-de-moraes/", "fonte_id": "veja", "data_pub": "2026-07-24T23:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Jair Bolsonaro apresentou um recurso contra a decisão do ministro Alexandre de Moraes, que impôs novas restrições ao seu prisional domiciliar.", "titulo_pt": "Recurso de Bolsonaro contesta novas restrições na prisão domiciliar", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 70939, "titulo": "Datafolha: Inferno astral de Flávio mantém vantagem de Lula, mas petista testa seu teto", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/datafolha-inferno-astral-de-flavio-mantem-vantagem-de-lula-mas-petista-testa-seu-teto.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-24T23:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha indica que Lula (PT) mantém uma vantagem sobre seus concorrentes, especialmente após a recente crise política envolvendo Flávio Bolsonaro (PL). O senador tem enfrentado dificuldades contínuas desde o escândalo 'Dark Horse'.", "titulo_pt": "Datafolha: vantagem de Lula persiste após crises de Flávio", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 70940, "titulo": "Justiça absolve jornalista Barbara Gancia em processo de injúria contra filha de Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/justica-absolve-jornalista-barbara-gancia-em-processo-de-injuria-contra-filha-de-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-24T22:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A jornalista Barbara Gancia foi absolve da condenação por injúria contra Laura Bolsonaro, filha do ex-presidente Jair Bolsonaro. A absolvição ocorreu após o deferimento de um recurso na primeira instância em dezembro de 2025, e ainda cabe recurso.", "titulo_pt": "Justiça absolve jornalista Barbara Gancia em processo de injúria contra filha de Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 71262, "titulo": "Taiwan Tests How It Would Resist a Chinese Siege at Sea", "url": "https://www.nytimes.com/2026/07/25/world/asia/taiwan-china-ships-blockade.html", "fonte_id": "nyt_world", "data_pub": "2026-07-25T04:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Taiwan está intensificando os planos para garantir combustíveis e outros importados essenciais, enquanto navios do governo chinês realizam manobras que poderiam ser usadas em um bloqueio no futuro.", "titulo_pt": "Taiwan aumenta planos de segurança marítima em face de exercícios chineses", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 71154, "titulo": "Honduras bajo Asfura: entre recortes al Estado, violencia y la sombra de Juan Orlando Hernández", "url": "https://elpais.com/america/2026-07-25/honduras-bajo-asfura-entre-recortes-al-estado-violencia-y-la-sombra-de-juan-orlando-hernandez.html", "fonte_id": "elpais_america", "data_pub": "2026-07-25T04:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Seis meses de cortes orçamentários, crise sanitária e insegurança marcam o início do governo de Nasry Asfura na Honduras. O país está sob a sombra da volta do ex-presidente Juan Orlando Hernández, indultado por Donald Trump após ter sido condenado pelo tráfico de drogas.", "titulo_pt": "Honduras sob Asfura: entre cortes orçamentários, violência e o retorno de Juan Orlando Hernández", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 71155, "titulo": "Didier Blanco, el influencer que llama “zurdos de mierda” a la oposición, será el jefe de escoltas en Colombia", "url": "https://elpais.com/america-colombia/2026-07-25/didier-blanco-el-influencer-que-llama-zurdos-de-mierda-a-la-oposicion-sera-el-jefe-de-escoltas-en-colombia.html", "fonte_id": "elpais_america", "data_pub": "2026-07-25T04:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Didier Blanco, conhecido por chamar 'zurdos de mierda' à oposição, foi nomeado para liderar a Unidade Nacional de Proteção em Colombia. Esta unidade é responsável pela proteção de políticos, jornalistas e líderes sociais.", "titulo_pt": "Didier Blanco, que chamava ‘zurdos de merda’ à oposição, será chefe de escoltas na colômbia", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 71156, "titulo": "¿Está en riesgo de ser abolido el derecho al voto de las mujeres? La nueva cruzada de la extrema derecha", "url": "https://elpais.com/us/2026-07-25/esta-en-riesgo-de-ser-abolido-el-derecho-al-voto-de-las-mujeres-la-nueva-cruzada-de-la-extrema-derecha.html", "fonte_id": "elpais_america", "data_pub": "2026-07-25T04:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Nos meses recentes, influenciadores conservadores têm promovido o voto por domicílio, uma medida que poderia limitar o direito de votar ao patriarca familiar. Essa iniciativa está sendo vista como parte de uma nova campanha da extrema-direita para abalar o direito ao voto das mulheres.", "titulo_pt": "Está em risco o direito ao voto das mulheres? Nova campanha da extrema-direita promove voto por domicílio", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 71157, "titulo": "Siete periodistas asesinados en siete meses en México: “Los matan porque se puede”", "url": "https://elpais.com/mexico/2026-07-25/siete-periodistas-asesinados-en-siete-meses-en-mexico-los-matan-porque-se-puede.html", "fonte_id": "elpais_america", "data_pub": "2026-07-25T04:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Sete jornalistas foram assassinados em sete meses no México, com o último caso ocorrido em Oaxaca. Esses assassinatos evidenciam a impunidade e a vulnerabilidade dos comunicadores, especialmente os de meios locais.", "titulo_pt": "Sete jornalistas mortos em sete meses no México: 'eles são assassinados porque podem ser'", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 71158, "titulo": "Una investigación revela que el Niño del cerro El Plomo murió por un trauma craneal durante un ritual inca, y no por hipotermia", "url": "https://elpais.com/chile/2026-07-25/una-investigacion-revela-que-el-nino-del-cerro-el-plomo-murio-por-un-trauma-craneal-durante-un-ritual-inca-y-no-por-hipotermia.html", "fonte_id": "elpais_america", "data_pub": "2026-07-25T04:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A antropóloga física chilena Verónica Silva reescreveu a história do Menino do Cerro El Plomo, sugerindo que ele não morreu por hipotermia, mas por um trauma cranial durante um ritual inca. Segundo ela, o menino teria viajado por nove meses com uma grande comitiva pelos Andes antes de ser oferecido aos deuses em uma cerimônia chamada Capacocha.", "titulo_pt": "Investigação sugere que menino do cerro El Plomo morreu durante ritual inca, não por hipotermia", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 71161, "titulo": "Una comunidad de Luisiana se rebela contra un nuevo centro del ICE para encerrar y deportar familias", "url": "https://elpais.com/us/migracion/2026-07-25/una-comunidad-de-luisiana-se-rebela-contra-un-nuevo-centro-del-ice-para-encerrar-y-deportar-familias.html", "fonte_id": "elpais_america", "data_pub": "2026-07-25T04:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os moradores de Alexandria, Luisiana, estão se opondo à construção de um novo centro do ICE para abrigar e deportar famílias. Eles não permitem que as autoridades silenciem suas reclamações contra a instalação.", "titulo_pt": "Comunidade de louisiana se opõe a novo centro do ICE para encerrar e deportar famílias", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 71162, "titulo": "Una gota de sangre resuelve un asesinato 14 años después: a la mexicana Irasema Chávez la mató su amiga", "url": "https://elpais.com/mexico/2026-07-25/una-gota-de-sangre-resuelve-un-asesinato-14-anos-despues-a-la-mexicana-irasema-chavez-la-mato-su-amiga.html", "fonte_id": "elpais_america", "data_pub": "2026-07-25T04:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Fiscalia de Texas, nos Estados Unidos, comparou novas amostras genéticas com a identidade de Mayra Velásquez, que já foi detida e acusada como suspeita do assassinato cometido em 2012. O caso envolve Irasema Chávez, que foi morta por sua amiga.", "titulo_pt": "Uma gota de sangue resolve um assassinato 14 anos depois: a mexicana Irasema Chávez foi morta pela amiga", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 71163, "titulo": "El Gobierno de Paz en Bolivia despoja al Estado de los símbolos indígenas", "url": "https://elpais.com/america/2026-07-25/el-gobierno-de-paz-en-bolivia-despoja-al-estado-de-los-simbolos-indigenas.html", "fonte_id": "elpais_america", "data_pub": "2026-07-25T04:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo de paz na Bolívia removeu retratos de líderes indígenas e tirou a wiphala da fachada do palácio presidencial para se diferenciar da gestão anterior.", "titulo_pt": "Governo de Paz em Bolivia remove símbolos indígenas", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 71166, "titulo": "La Fortuna de Costa Rica: cuando la comunidad toma su parte en la industria del turismo", "url": "https://elpais.com/america-futura/2026-07-25/la-fortuna-de-costa-rica-cuando-la-comunidad-toma-su-parte-en-la-industria-del-turismo.html", "fonte_id": "elpais_america", "data_pub": "2026-07-25T04:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma catarata localizada na selva, gerida por uma associação comunitária, é um dos principais destinos turísticos do mundo. Um líder local afirma que outros povoados também poderiam replicar esse modelo.", "titulo_pt": "A Fortuna de Costa Rica: qu
