url": "https://www.metropoles.com/colunas/mirelle-pinheiro/homem-e-preso-por-abrir-fogo-contra-carro-e-atirar-na-cabeca-de-crianca", "fonte_id": "metropoles", "data_pub": "2026-11-03T09:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem foi preso após abrir fogo contra um carro e atirar na cabeça de uma criança em 2022, na Baixada Fluminense, no Rio de Janeiro. A vítima, a criança, sobreviveu após ser socorrida.", "titulo_pt": "Homem é preso após atirar em carro e na cabeça de criança", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 241971, "titulo": "Agências do trabalhador do DF oferecem 1,2 mil vagas nesta terça-feira", "url": "https://www.metropoles.com/distrito-federal/agencias-do-trabalhador-do-df-oferecem-12-mil-vagas-nesta-terca-feira", "fonte_id": "metropoles", "data_pub": "2026-11-03T09:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As agências do trabalhador do Distrito Federal oferecem 1,2 mil vagas nesta terça-feira, com salários que podem chegar a R$ 2,8 mil. O cargo de operador de caixa é o que apresenta mais oportunidades, totalizando 223 postos disponíveis.", "titulo_pt": "Agências do trabalhador do DF oferecem 1,2 mil vagas nesta terça-feira", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 242393, "titulo": "Singapore hit-and-run: organiser of fund for orphaned boy vows transparency", "url": "https://www.scmp.com/week-asia/people/article/3373119/singapore-hit-and-run-organiser-fund-orphaned-boy-vows-transparency", "fonte_id": "scmp", "data_pub": "2026-11-03T08:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma organizadora de uma campanha de arrecadação de fundos para um menino cujos pais supostamente morreram em um acidente de trânsito em Singapura prometeu transparência e agradeceu aos doadores. A declaração foi feita após debates sobre a autenticidade da campanha.", "titulo_pt": "Singapura: organizadora de campanha para órfão promete transparência", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 242101, "titulo": "Incidentes de segurança e responsabilidade civil: por que a prevenção deve contar", "url": "https://www.jota.info/opiniao-e-analise/artigos/incidentes-de-seguranca-e-responsabilidade-civil-por-que-a-prevencao-deve-contar", "fonte_id": "jota", "data_pub": "2026-11-03T07:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Decisões judiciais devem avaliar incidentes de segurança e responsabilidade civil de forma individualizada, considerando a diligência do agente em mitigar riscos.", "titulo_pt": "Incidentes de segurança e responsabilidade civil: por que a prevenção deve contar", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 242610, "titulo": "Waste Crisis Blights Kosovo’s Capital and its Mayor’s Political Ambitions", "url": "https://balkaninsight.com/2026/11/03/waste-crisis-blights-kosovos-capital-and-its-mayors-political-ambitions/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-03T06:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O prefeito de Pristina e o governo de Kosovo estão trocando acusações sobre a crise de lixo que afeta a capital; o problema ameaça prejudicar as aspirações políticas do prefeito.", "titulo_pt": "Crisis de lixo maculam as ambições políticas do prefeito de pristina e do governo de Kosovo", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 242404, "titulo": "Outrage in Philippines as pet remains found dumped in sacks on vacant plot", "url": "https://www.scmp.com/week-asia/people/article/3373098/outrage-philippines-cremated-pets-found-dumped-sacks-vacant-plot", "fonte_id": "scmp", "data_pub": "2026-11-03T06:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A descoberta de dezenas de restos de animais de estimação, enterrados em sacos ao longo de uma estrada na Filíppinas, gerou indignação pública e levantou dúvidas sobre se as leis de bem-estar animal do país protegem adequadamente os pets após a morte. Uma cremação de animais em Bacoor, província de Cavite, foi ordenada a fechar após reclamações de donos de animais de estimação, enquanto a polícia investiga acusações de que o negócio teria descartado animais de forma inadequada.", "titulo_pt": "Ira na filíppinas após descoberta de restos de animais de estimação enterrados em sacos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 242434, "titulo": "Korea selects 43 regions for education reform drive", "url": "https://www.koreaherald.com/article/10924185", "fonte_id": "korea_herald", "data_pub": "2026-11-03T05:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul selecionou 43 regiões para uma nova iniciativa de reforma educacional com o objetivo de melhorar as pequenas escolas, reduzir disparidades educacionais e fortalecer a cooperação entre escolas, universidades e indústrias locais. As regiões selecionadas receberão financiamento, apoio administrativo e isenções regulatórias durante cinco anos, a partir de 2027, com o objetivo de melhorar as oportunidades educacionais em comunidades com uma população estudantil em declínio.", "titulo_pt": "Coreia do sul seleciona 43 regiões para iniciativa de reforma educacional", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 242259, "titulo": "French high school protests: 'Today, public spending allocates €2 to pensions for every €1 invested in the future'", "url": "https://www.lemonde.fr/en/opinion/article/2026/11/03/high-school-student-protests-today-public-spending-allocates-two-euros-to-pensions-for-every-one-euro-invested-in-the-future_6769798_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-03T03:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alunos de escolas secundárias francesas estão insatisfeitos porque uma grande parte do orçamento nacional para educação é gasta em aposentadorias de ex-funcionários do governo, não beneficiando os estudantes.", "titulo_pt": "Protestos de escolas francesas: 'hoje, o orçamento público destina €2 para aposentadorias por cada €1 investido no futuro'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 241519, "titulo": "Decretan prisión preventiva para dos detenidos por ataque a disparos que dejó un muerto en Cerro Navia", "url": "https://www.latercera.com/nacional/noticia/decretan-prision-preventiva-para-dos-detenidos-por-ataque-a-disparos-que-dejo-un-muerto-en-cerro-navia/", "fonte_id": "la_tercera", "data_pub": "2026-11-02T21:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria ECOH decidiu manter a prisão preventiva de dois detidos suspeitos de participar em um ataque armado a dois homens em movimento, ocorrido no domingo à tarde. Uma das vítimas faleceu em um hospital, enquanto a outra sobreviveu após ser atingida no abdômen.", "titulo_pt": "Prisão preventiva de dois suspeitos de ataque a disparos que deixou um morto em Cerro Navia", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 241310, "titulo": "A educação combate ou perpetua desigualdades?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/michael-franca/2026/11/a-educacao-combate-ou-perpetua-desigualdades.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-02T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Martin Carnoy, professor da Universidade de Stanford, afirmou que a educação pode auxiliar, mas não corrige as desigualdades raciais significativas. O autor menciona ter nascido em uma família de baixa renda e que a educação foi crucial para sua ascensão social.", "titulo_pt": "A educação combate ou perpetua desigualdades?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 241459, "titulo": "Filha de brasileiros era copilota do avião que caiu na Flórida e deixou 9 mortos; o que se sabe", "url": "https://www.bbc.com/portuguese/articles/cqe8rl260ep2o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-02T19:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nathalia Gadelha Filgueiras, uma brasileira de 20 anos que acumulava 1.300 horas de voo, era copilota do avião que caiu na Flórida no domingo, deixando nove mortos. Ela havia tirado licença para pilotar avião aos 17 anos e pediu socorro pelo rádio antes do acidente.", "titulo_pt": "Filha de brasileiros era copilota do avião que caiu na Flórida e deixou 9 mortos; o que se sabe", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 240515, "titulo": "Médico é assaltado enquanto trabalhava em UPA no litoral de São Paulo", "url": "https://www.metropoles.com/sao-paulo/medico-e-assaltado-enquanto-trabalhava-em-upa-no-litoral-de-sao-paulo", "fonte_id": "metropoles", "data_pub": "2026-11-02T17:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um médico foi assaltado na madrugada de 1º de novembro no Guarujá, São Paulo. Os criminosos levaram seu telefone celular, relógio e uma corrente de ouro.", "titulo_pt": "Médico é assaltado durante trabalho em UPA no litoral de São Paulo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 240518, "titulo": "Jovem que teve a garganta cortada após vitória de Lula apresenta melhora", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/jovem-que-teve-a-garganta-cortada-apos-vitoria-de-lula-apresenta-melhora", "fonte_id": "metropoles", "data_pub": "2026-11-02T17:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Clara Thaís, uma jovem que teve a garganta cortada após a vitória de Lula nas eleições, está apresentando melhora. O ataque ocorreu no dia 25 de outubro na casa do namorado, em Umarizal (RN).", "titulo_pt": "Jovem que teve a garganta cortada após vitória de Lula apresenta melhora", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 240519, "titulo": "Mulher é presa ao confessar ter matado namorado para se defender de ataque", "url": "https://www.metropoles.com/distrito-federal/na-mira/mulher-e-presa-apos-confessar-ter-assassinado-o-namorado-para-se-defender", "fonte_id": "metropoles", "data_pub": "2026-11-02T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher foi presa após confessar ter matado seu namorado durante uma discussão, quando ele a atacou com uma arma branca. Um amigo presenciou o incidente fatal.", "titulo_pt": "Mulher é presa após confessar ter matado namorado em defesa pessoal", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 241973, "titulo": "Clima: país registra chuvas e temperaturas elevadas nesta terça; confira", "url": "https://www.metropoles.com/brasil/clima-pais-registra-chuvas-e-temperaturas-elevadas-nesta-terca-confira", "fonte_id": "metropoles", "data_pub": "2026-11-03T09:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Massas de ar úmido estão causando chuvas e temperaturas elevadas em várias regiões do país nesta terça-feira. Pancadas de chuva foram registradas em diversos pontos.", "titulo_pt": "Clima: país registra chuvas e temperaturas elevadas nesta terça; confira", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 242285, "titulo": "Rhodes floods: Cars swept away after torrential rain in Greece", "url": "https://www.euronews.com/video/2026/11/03/rhodes-floods-cars-swept-away-after-torrential-rain-in-greece", "fonte_id": "euronews", "data_pub": "2026-11-03T07:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Águas de cheias levaram veículos e detritos pela cidade de Archangelos, em Rodas, danificando várias residências e estabelecimentos comerciais. Mais tempestades são esperadas.", "titulo_pt": "Cheias em rodas: veículos arrastados por enxurradas na Grécia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 242102, "titulo": "Overshoot: o aquecimento global acima de 1,5°C", "url": "https://www.jota.info/opiniao-e-analise/colunas/direito-e-clima/overshoot-o-aquecimento-global-acima-de-15c", "fonte_id": "jota", "data_pub": "2026-11-03T07:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O documento discute a meta de longo prazo do Acordo de Paris em relação ao aquecimento global. O título traduzido para português brasileiro é: 'O superaquecimento: o aquecimento global acima de 1,5°C'", "titulo_pt": "O superaquecimento: o aquecimento global acima de 1,5°C", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 241956, "titulo": "Aquecimento acima de 1,5°C pode provocar perda irreversível de geleiras, alerta estudo", "url": "https://exame.com/esg/aquecimento-acima-de-15c-pode-provocar-perda-irreversivel-de-geleiras-alerta-estudo/", "fonte_id": "exame", "data_pub": "2026-11-03T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um novo relatório da ONU e da ICCI indica que o derretimento das calotas polares está se acelerando, com a perda de gelo ocorrendo seis vezes mais rapidamente do que na década de 1990, mesmo que as temperaturas globais voltem a diminuir.", "titulo_pt": "Aquecimento acima de 1,5°C pode causar perda irreversível de geleiras, avisa estudo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 242257, "titulo": "'Super El Niño' continues to intensify: 'It has already reached unprecedented levels'", "url": "https://www.lemonde.fr/en/environment/article/2026/11/03/super-el-nino-continues-to-intensify-it-has-already-reached-unprecedented-levels_6769600_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-03T00:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O fenômeno natural cíclico 'Super El Niño' está intensificando e já atingiu níveis inéditos. Indicadores sugerem que uma grande ocorrência está por vir, com eventos climáticos extremos sendo disparados, como a declaração de estado de emergência no Bolívia no sábado.", "titulo_pt": "Super El Niño continua a intensificar: já atingiu níveis inéditos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 241499, "titulo": "El Niño: anticipan focos de 200 milímetros en una región del país", "url": "https://www.lanacion.com.ar/economia/campo/el-nino-anticipan-focos-de-200-milimetros-en-una-region-del-pais-nid01112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-02T21:35:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Bolsa de Cereais de Buenos Aires prevê duas semanas de instabilidade climática na região pampeana, com possíveis chuvas de 200 milímetros. No norte do país, estão previstas temperaturas acima de 40 graus e fortes tormentas em Corrientes.", "titulo_pt": "Niño: previsão de focos de 200 milímetros em região do país", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 240480, "titulo": "O alerta da ONU para danos ‘irreversíveis’ do aquecimento global em geleiras e banquisas", "url": "https://veja.abril.com.br/agenda-verde/o-alerta-da-onu-para-danos-irreversiveis-do-aquecimento-global-em-geleiras-e-banquisas/", "fonte_id": "veja", "data_pub": "2026-11-02T17:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relatório da ONU alerta que um aquecimento global acima de 1,5ºC aumentará os riscos de inundações, danos econômicos e ecológicos, além da escassez de água.", "titulo_pt": "Alerta da ONU sobre danos 'irreversíveis' do aquecimento global em geleiras e banquisas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 240678, "titulo": "Reduzir emissões da aviação evitaria prejuízos bilionários ao clima", "url": "https://www.dw.com/pt-br/reduzir-emissões-da-aviação-evitaria-prejuízos-bilionários-ao-clima/a-79831627?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-02T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A aviação é um dos principais responsáveis pelas emissões de CO2, sendo um dos meios de transporte mais prejudiciais ao clima. Alterações nas rotas de voo e o uso de combustíveis sustentáveis podem significativamente reduzir esses impactos ambientais.", "titulo_pt": "Reduzir emissões da aviação evitaria prejuízos bilionários ao clima", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 241175, "titulo": "Interactive: Who wants what at the COP31 climate change summit", "url": "https://www.carbonbrief.org/interactive-who-wants-what-at-the-cop31-climate-change-summit", "fonte_id": "carbon_brief", "data_pub": "2026-11-02T16:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Delegados se reunirão em Antalya, uma cidade turística, para negociações climáticas da ONU, em um cenário de guerra. O post Interactive: Quem quer o que na COP31 sobre mudanças climáticas apareceu primeiro no Carbon Brief.", "titulo_pt": "Interactive: quem quer o que na COP31 sobre mudanças climáticas", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 240759, "titulo": "Europe could face colder weather as polar vortex weakens", "url": "https://www.theguardian.com/environment/2026/nov/02/polar-vortex-disruption-colder-weather-europe", "fonte_id": "guardian_world", "data_pub": "2026-11-02T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O vórtice polar estratosférico sobre o hemisfério norte pode enfrentar uma possível desestabilização antecipada, o que pode alterar os padrões climáticos na Europa nas próximas semanas. Isso aumenta a probabilidade de áreas de alta pressão persistentes e condições mais frias mais adiante.", "titulo_pt": "Europa pode enfrentar climas mais frios devido à debilidade do vórtice polar", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 239865, "titulo": "Clima: feriado de Finados terá temporais em diferentes regiões do Brasil", "url": "https://www.metropoles.com/brasil/feriado-finados-sera-chuva-tempestades-parte-brasil", "fonte_id": "metropoles", "data_pub": "2026-11-02T09:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Inmet emitiu alertas de perigo e perigo potencial para diferentes regiões do Brasil, com previsão de chuvas e baixa umidade do ar durante o feriado de Finados.", "titulo_pt": "Feriado de Finados terá temporais em diferentes regiões do Brasil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 239898, "titulo": "Ebola tem letalidade de 52% na República Democrática do Congo", "url": "https://www.cnnbrasil.com.br/internacional/ebola-tem-letalidade-de-52-na-republica-democratica-do-congo/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-02T09:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O surto de Ebola na República Democrática do Congo, causado pelo vírus Ebola Bundibugyo, tem uma letalidade de 52% e é o segundo maior surto de Ebola do mundo, atrás apenas da epidemia ocorrida entre 2014 e 2016 na África Ocidental.", "titulo_pt": "Ebola tem letalidade de 52% na República Democrática do Congo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 240006, "titulo": "ACV: cómo reconocer sus señales y por qué actuar rápido es clave", "url": "https://www.latercera.com/tendencias/noticia/acv-como-reconocer-sus-senales-y-por-que-actuar-rapido-es-clave/", "fonte_id": "la_tercera", "data_pub": "2026-11-02T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O acidente cerebrovascular pode causar danos graves se não for tratado rapidamente. É crucial identificar os sintomas e procurar atendimento médico imediatamente para melhorar o prognóstico.", "titulo_pt": "ACV: como reconhecer seus sinais e por que agir rápido é fundamental", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 242394, "titulo": "2 Pakistani police officers guarding polio workers killed by suspected militants", "url": "https://www.scmp.com/news/asia/south-asia/article/3373114/2-pakistani-police-officers-guarding-polio-workers-killed-suspected-militants", "fonte_id": "scmp", "data_pub": "2026-11-03T08:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois policiais paquistaneses foram mortos a tiros por suspeitos de militantes enquanto protegiam trabalhadores contra a poliomielite durante uma campanha de vacinação porta-a-porta em Mohmand, uma região do distrito de Khyber Pakhtunkhwa que fronteira com o Afeganistão. Um terceiro policial ficou ferido.", "titulo_pt": "Dois policiais protegendo trabalhadores de vacinação contra a poliomielite são mortos a tiros por suspeitos de militantes no paquistão", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 242608, "titulo": "Albanian Journalists Complain of Police Violence, Abuse During Anti-Govt Protests", "url": "https://balkaninsight.com/2026/11/03/albanian-journalists-complain-of-police-violence-abuse-during-anti-govt-protests/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-03T06:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nos últimos dois semanas, jornalistas e vigilantes da mídia relataram dezenas de casos de abuso verbal e violência física contra profissionais de imprensa cobrindo protestos anti-governamentais em Albania. Na maioria das vezes, os policiais eram os agressores.", "titulo_pt": "Jornalistas albaneses relatam abuso policial durante protestos anti-governo", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 242454, "titulo": "S. Korea to hold separate memorial for Sado mine forced labor victims for 3rd straight year", "url": "https://en.yna.co.kr/view/AEN20261103009600315", "fonte_id": "yonhap_news", "data_pub": "2026-11-03T06:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul realizará uma cerimônia de memorial separada para vítimas de trabalho forçado no mineiro de Sado pela terceira vez consecutiva.", "titulo_pt": "Coreia do sul realizará memorial separado para vítimas do trabalho forçado no mineiro de Sado pela terceira vez consecutiva", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 242319, "titulo": "‘Going hungry’: Garment workers in Bangladesh say wages barely cover needs", "url": "https://www.aljazeera.com/news/2026/11/3/going-hungry-garment-workers-in-bangladesh-say-wages-barely-cover-needs?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-03T05:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores da indústria de vestuário em Bangladesh, um dos principais exportadores mundiais de vestuário, realizaram manifestações para pedir aumentos salariais mais significativos. Eles afirmam que os salários actuais são insuficientes para atender às suas necessidades básicas.", "titulo_pt": "Faminto: trabalhadores da indústria de vestuário em Bangladesh exigem salários melhores", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 242256, "titulo": "Depression: Gender inequality is at the root of women's vulnerability", "url": "https://www.lemonde.fr/en/france/article/2026/11/03/depression-gender-inequality-is-at-the-root-of-women-s-vulnerability_6769666_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-03T01:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma relatório publicado pelo Alto Conselho para a Igualdade entre Mulheres e Homens na França, divulgado em 2 de novembro, indica que o risco maior de depressão entre mulheres é resultado de condições sociais, com as mulheres expostas a maior desigualdade e violência ao longo de suas vidas.", "titulo_pt": "Depressão: a desigualdade de gênero está no cerne da vulnerabilidade feminina", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 241759, "titulo": "[Vitit Muntarbhorn] Preparing for Thailand’s fourth periodic rights review", "url": "https://www.koreaherald.com/article/10923137", "fonte_id": "korea_herald", "data_pub": "2026-11-02T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2005, com as reformas significativas das Nações Unidas, foi criado o Conselho de Direitos Humanos das Nações Unidas, que introduziu uma nova métrica de monitoramento mais universal: a Revisão Periódica Universal. Essa revisão visa avaliar todos os países de forma consensual e menos confrontacional.", "titulo_pt": "[Vitit Muntarbhorn] preparando para a quarta revisão periódica dos direitos humanos da tailândia", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 241697, "titulo": "HRW calls on Zambia to halt post-election crackdown", "url": "https://www.aljazeera.com/news/2026/11/2/hrw-calls-on-zambia-to-halt-post-election-crackdown?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-02T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Figuras da oposição foram detidas e desaparecidas desde que o presidente Hakainde Hichilema reivindicou a vitória nas eleições de agosto.", "titulo_pt": "HRW pede a zâmbia para suspender repressão pós-eleição", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 241698, "titulo": "Protester’s ‘I support genocide’ sign appears to face no police action", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/2/protesters-i-support-genocide-sign-appears-to-face-no-police-action?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-02T19:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Seguir uma pessoa com uma bandeira que apoia genocídio não é, por si só, motivo para prisão conforme a lei do Reino Unido. Isso sugere que a ação policial não foi tomada contra o protesto mencionado.", "titulo_pt": "Bandeira de apoio a genocídio não resulta em ação policial no reino unido", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 240555, "titulo": "Reino Unido obrigará parte dos migrantes a esperar 10 anos para direito a residência", "url": "https://www.infomoney.com.br/mundo/reino-unido-obrigara-parte-dos-migrantes-a-esperar-10-anos-para-direito-a-residencia/", "fonte_id": "infomoney", "data_pub": "2026-11-02T17:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Reino Unido implementará novas regras que obrigam parte dos migrantes a esperar 10 anos para obter o direito de residência. Essas mudanças são parte de uma série de medidas mais rigorosas adotadas pelo governo após um aumento súbito no número de chegadas de imigrantes.", "titulo_pt": "Reino Unido obrigará parte dos migrantes a esperar 10 anos para direito a residência", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 240686, "titulo": "Lindsay Clancy busca que retiren los cargos por el asesinato de sus tres hijos en Massachusetts tras el juicio anulado", "url": "https://www.clarin.com/estados-unidos/lindsay-clancy-busca-retiren-cargos-asesinato-hijos-massachusetts-juicio-anulado_0_TbriRmIDE8.html", "fonte_id": "clarin", "data_pub": "2026-11-02T17:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Lindsay Clancy reapareceu perante a justiça após um júri não conseguir chegar a um veredicto. Seus advogados argumentam que submeter a ela a um novo julgamento violaria sua proteção constitucional contra o julgamento duplo.", "titulo_pt": "Lindsay Clancy busca que sejam retirados os cargos por assassinato de seus três filhos em Massachusetts após julgamento anulado", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 240888, "titulo": "Calls mount to ban French TV channel CNews after racist killing", "url": "https://www.lemonde.fr/en/france/article/2026/11/02/calls-mount-to-ban-french-tv-channel-after-racist-killing_6769451_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-02T16:54:00Z", "idioma": "en", "provavel const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}

       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
