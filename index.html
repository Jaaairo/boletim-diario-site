<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<main id="main"></main>

</div>

<div class="modal-overlay" id="modal-flag">

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

const D = {"gerado_em": "31/08/2026 15:22", "stats": {"noticias_novas": 958, "resumos_gerados": 239}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O governo de Jair Bolsonaro está preparando um pacote para estimular a pecuária, que inclui reduzir a concentração do setor e aliviar os preços da carne bovina. Em outro desenvolvimento, o ministro Bruno Dantas renunciou ao Tribunal de Contas da União (TCU), abrindo espaço para a indicação do senador Rodrigo Pacheco. A campanha de Lula planeja solicitar ao Tribunal Superior Eleitoral (TSE) que reconsiderasse a decisão de suspender a propaganda eleitoral que apresenta acusações contra Flávio Bolsonaro. Além disso, o governador de São Paulo, Tarcísio de Freitas, prometeu renovar o benefício fiscal para o transporte de cargas e defendeu a expansão do sistema de pedágio eletrônico free flow nas rodovias paulistas, reagindo a críticas de Fernando Haddad, seu principal adversário nas eleições.", "mundo": "O Irã enfrenta pressões econômicas a medida que as sanções dos Estados Unidos elevam os preços e diminuem o comércio. No entanto, o presidente Masoud Pezeshkian declarou que Teerã deseja o fim da guerra. Em outro desenvolvimento, a Suécia assinou um acordo de 4,3 bilhões de euros para comprar quatro navios de frigates franceses, intensificando seus esforços de rearmamento. Na América do Sul, a ex-presidente chilena Michelle Bachelet viaja ao Brasil em busca de uma reunião crucial com Lula, que pode ser decisiva para sua candidatura à ONU. No Cazaquistão, o novo parlamento votou a favor da nomeação do líder do partido Adilet como seu primeiro presidente. Em contraste, a Suíça se prepara para a cerimônia do Met Gala, onde o designer de moda John Galliano cancelou sua exposição após enfrentar críticas por comentários antissemitas feitos em 2011.\n\nOs Estados Unidos e o Irã trocaram ataques pela primeira vez em mais de um mês. Washington realizou um ataque ao Irã, o primeiro desde julho, e Teerã respondeu com o lançamento de mísseis contra bases na Jordânia. Este confronto direto entre as duas nações, após a publicação de um vídeo de inteligência artificial por parte dos Estados Unidos sugerindo a destruição de instalações iranianas, levou a uma escalada de tensões na região. O Irã advertiu que responderá de forma mais severa a qualquer ataque adicional dos Estados Unidos. Além disso, o Irã lançou mísseis contra bases dos Estados Unidos na Jordânia como retaliação ao ataque em Ormuz, o que intensificou a crise humanitária no país, com relatos de inflação de 70% e atrasos na chegada de mercadorias. Em meio a esses eventos, a cúpula entre Xi, Putin e o Irã, sob pressão das novas sanções dos EUA contra Teerã, expôs as divisões entre os membros da Organização de Cooperação de Xangai.", "economia": "O mercado global de chips deve ultrapassar 2 trilhões de dólares até 2030, de acordo com a SEMI. Em contraste, o Brasil e a União Europeia estão adotando caminhos diferentes no comércio internacional: enquanto o Brasil busca alívio nas tarifas sobre produtos importados, a Europa estabelece novas tarifas. No Brasil, as ações das petrolíferas subiram com o aumento do preço do petróleo, e a Superbet lançou uma campanha de R$ 60 milhões com o ex-jogador Cafu para combater o vício em jogos. A Receita Federal pagou o último lote das restituições do Imposto de Renda 2026, e a Caixa concluiu o pagamento do Bolsa Família para os beneficiários com NIS final 0. O Conselho Administrativo de Recursos Fiscais (Carf) manteve o IPI de 12% sobre o protetor solar da Johnson, classificando-o como bronzeador. O ministro da Fazenda, Fernando Haddad, afirmou que o Brasil deverá registrar superávits primários a partir de 2027.", "tecnologia": "A Taiwan planeja treinar 500.000 profissionais em inteligência artificial até 2040, com o objetivo de fortalecer a indústria local e manter a competitividade no campo da IA. Por outro lado, a Nvidia investirá 3,5 bilhões de dólares no MediaTek, visando fortalecer a parceria entre as duas empresas no mercado de semicondutores e tecnologia móvel. A Cielo implementou um agente de inteligência artificial, reduzindo em 52,2% o número de chamados ao Service Desk e passando a atuar 24 horas por dia. A OpenAI transformou o ChatGPT em uma empresa avaliada em 1 bilhão de dólares em menos de 200 dias, com a plataforma já alcançando dezenas de milhares de anunciantes em mais de 40 países. A empresa de telecomunicações Telefónica incluiu o risco climático em seu plano global de sustentabilidade após sofrer danos estimados em 97 milhões de euros. A inteligência artificial também está sendo usada para melhorar o processo de aprendizagem, com tutores de IA potencialmente melhorando a experiência dos alunos. No entanto, a utilização de IA enfrenta desafios, como a preocupação com a privacidade e os riscos cibernéticos, bem como a necessidade de regulamentação mais rigorosa, especialmente na União Europeia.", "ciencia": "A NASA lançou o Telescópio Espacial Nancy Grace Roman, um evento crucial na ciência espacial. Este telescópio, que será usado para mapear bilhões de estrelas e galáxias, foi lançado em 30 de agosto de 2026, a bordo de um foguete Falcon Heavy da SpaceX, do Centro Espacial Kennedy na Flórida. Este lançamento marca um avanço significativo na exploração do universo e na compreensão da energia escura e de distantes mundos. Além disso, a indústria espacial comercial avança com a adição de duas novas empresas a uma federação que trabalha em plataformas satelitais reutilizáveis e adaptação. Em um desenvolvimento relacionado, cientistas estão utilizando inteligência artificial para analisar fatores que levam ao sucesso ou fracasso na ciência, enquanto pesquisas em astrofísica revelam novas descobertas sobre neutrinos e a energia escura.", "cultura": "Em Las Vegas, um julgamento está ouvindo as conclusões dos argumentos em um caso contra Duane 'Keffe D' Davis, de 63 anos, acusado de ordenar o assassinato do rapper Tupac Shakur em 1996. Davis nega a acusação. Em outro desenvolvimento cultural, a exposição 'John Galliano: Horizons', planejada para o Met Gala da Metrópolis, foi cancelada após gerar controvérsia por homenagear um profissional condenado por crime de ódio após fazer comentários antissemitas em 2011. A Netflix lançou o elenco de 'Casamento Aberto e Outras Coisas que Não Existem', uma nova série de comédia nacional, que estrela Camila Pitanga e Sérgio Guizé, já em fase de gravação em São Paulo. A Sociedade Brasileira de Endocrinologia e Metabolismo (SBEM) e a Federação Brasileira de Ginecologia e Obstetrícia (Febrasgo) lançaram uma recomendação adaptada para o Brasil sobre a suplementação de iodo durante a gravidez e o exame de TSH, baseada em evidências coletadas pela Associação Americana da Tireoide.", "sociedade": "A sociedade enfrenta diversos desafios em diferentes partes do mundo, conforme evidenciado nos artigos. O Ministério da Saúde de Taiwan expandiu as categorias de subsídio de saúde, incluindo novos serviços e tratamentos, com o objetivo de melhorar o acesso à assistência médica. Em Hong Kong, um bar central organizou uma reunião para arrecadar fundos para vítimas das cheias e deslizamentos de terra em Nepal, refletindo a solidariedade global. Na China, a Receita Federal liberou o quarto e último lote de restituição do Imposto de Renda 2026, totalizando R$ 1,2 bilhão para 521.935 contribuintes. Em Seul, a Coreia do Sul planeja criar contas de poupança a longo prazo para ajudar os residentes na meia-idade a superar um período potencialmente difícil entre o último salário e o primeiro pagamento de aposentadoria. Estas iniciativas demonstram a diversidade de problemas sociais e as medidas adotadas para enfrentá-los em diferentes regiões do mundo.", "meio_ambiente": "Mais de 1.000 pessoas morreram e milhares estão desaparecidas após inundações letais que atingiram a fronteira entre Nepal e China, conforme informou o Brasil de Fato. No desastre de um deslizamento de lama na região do posto fronteiriço de Gyirong, no Tibete, 16 pessoas morreram e 546 desapareceram em 26 de agosto. A China alertou que o nível do lago formado após o deslizamento pode aumentar com a chuva, informou a CNN Brasil.", "direitos_humanos": "Um comitê da ONU declarou que os países estão legalmente obrigados a considerar indenizações pelo comércio transatlântico de escravos e a adotar medidas para combater a persistente discriminação racial, conforme estabelecido pelo Convenio de 1965 sobre discriminação racial. Este documento, aprovado pela Comissão da ONU contra a Discriminação Racial, visa fortalecer os argumentos para reparações abrangentes pela escravidão. Além disso, foram publicadas imagens históricas inéditas do ataque a La Moneda, capturadas pela câmera de um dos aviões Hawker Hunter. Em Hong Kong, um homem foi levado de volta à prisão filipina, conforme criticado por sua equipe legal como 'detenção ilegal', após o atraso na deportação devido a uma tempestade. Na Grécia, Israel fechou um acordo de 3,5 bilhões de dólares para a defesa aérea do país, incluindo mísseis, aeronaves e drones. No Chile, a Corte de Talca condenou o conservador Najle por emitir certificados que permitiram a venda de imóveis embargados."}, "resumo_do_dia": {"politica_nacional": [{"id": 135157, "titulo": "Carne bovina americana terá preferência em prisões, hospitais e escolas; veja medidas do pacote de Trump", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/carne-bovina-americana-tera-preferencia-em-prisoes-hospitais-e-escolas-veja-medidas-do-pacote-de-trump.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo de Donald Trump apresentou um novo pacote de medidas para estimular a pecuária e aumentar a capacidade de processamento de carne nos Estados Unidos. As ações visam reduzir a concentração do setor e aliviar os preços elevados da carne bovina.", "titulo_pt": "Carne bovina americana terá preferência em instituições públicas; veja medidas do pacote de Trump", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 135465, "titulo": "Bruno Dantas renuncia ao TCU e abre caminho para indicação de Rodrigo Pacheco", "url": "https://www.jota.info/legislativo/bruno-dantas-renuncia-ao-tcu-e-abre-caminho-para-indicacao-de-rodrigo-pacheco", "fonte_id": "jota", "data_pub": "2026-08-31T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado Bruno Dantas renunciou ao cargo no Tribunal de Contas da União (TCU) e isso libera o caminho para a indicação do senador Rodrigo Pacheco para o posto. A Constituição estabelece uma quarentena de três anos para ex-membros do TCU, mas permite que eles exerçam advocacia em outros tribunais durante esse período.", "titulo_pt": "Bruno Dantas renuncia ao TCU e abre caminho para indicação de Rodrigo Pacheco", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 135213, "titulo": "Campanha de Lula deve pedir que TSE reconsidere suspensão de propaganda com 'currículo de Flávio'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/08/campanha-de-lula-deve-pedir-que-tse-reconsidere-suspensao-de-propaganda-com-curriculo-de-flavio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-31T17:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de Lula pretende solicitar ao TSE que reconsidere a decisão de suspender a propaganda eleitoral que apresenta acusações contra Flávio Bolsonaro em formato de currículo.", "titulo_pt": "Campanha de Lula quer que TSE reavalie suspensão de propaganda com 'currículo de Flávio'", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 135466, "titulo": "Quem são os candidatos ao governo de Pernambuco (PE) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-os-candidatos-ao-governo-de-pernambuco-pe-nas-eleicoes-2026-31-agosto", "fonte_id": "jota", "data_pub": "2026-08-31T17:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Raquel Lyra concorre à reeleição para o governo de Pernambuco contra João Campos e mais seis candidatos. A lista completa dos candidatos não foi detalhada no trecho fornecido.", "titulo_pt": "Quem são os candidatos ao governo de Pernambuco nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 135182, "titulo": "Toffoli suspende campanha de Renan Santos à Presidência da República", "url": "https://g1.globo.com/politica/noticia/2026/08/31/toffoli-suspende-propaganda-eleitoral-de-renan-santos.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-31T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Dias Toffoli do Tribunal Superior Eleitoral suspendeu a campanha de Renan Santos, do partido Missão, à Presidência da República após identificar perfis irregulares divulgando conteúdo favorável ao candidato. A decisão proíbe a realização de propaganda eleitoral, uso do Fundo Eleitoral e participação em debates de rádio, televisão e podcasts.", "titulo_pt": "Toffoli suspende campanha de Renan Santos à Presidência da República", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 135183, "titulo": "Governo quer padronizar uso de biometria em portos e aeroportos", "url": "https://g1.globo.com/economia/noticia/2026/08/31/governo-quer-padronizar-uso-de-biometria-em-portos-e-aeroportos.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-31T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério dos Portos e Aeroportos lançou uma política para padronizar o uso de biometria em aeroportos, portos e hidrovias, com o objetivo de reforçar a segurança e agilizar a identificação de passageiros e trabalhadores. As diretrizes incluem a padronização dos procedimentos de identificação biométrica e a integração entre sistemas de informação.", "titulo_pt": "Governo quer padronizar uso de biometria em portos e aeroportos", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 135214, "titulo": "Morre o jornalista Carlos Monforte, 1º apresentador do Bom Dia, Brasil, aos 77", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/morre-o-jornalista-carlos-monforte-1o-apresentador-do-bom-dia-brasil-aos-77.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-31T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Carlos Monforte, o primeiro editor-chefe e apresentador do telejornal Bom Dia, Brasil, da TV Globo, faleceu aos 77 anos. A informação foi confirmada pela família à emissora onde ele trabalhou por 36 anos.", "titulo_pt": "Morre o jornalista Carlos Monforte, primeiro apresentador do Bom Dia, Brasil, aos 77", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 135215, "titulo": "Governo de SP cria sistema para monitorar obras, plano de metas e emendas parlamentares", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/governo-de-sp-cria-sistema-para-monitorar-obras-plano-de-metas-e-emendas-parlamentares.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-31T17:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Casa Civil, sob a gestão de Tarcísio de Freitas, planeja lançar uma plataforma que reunirá informações sobre 645 municípios paulistas, incluindo planos de metas, andamento de obras, cronogramas de entregas estaduais e execução de emendas parlamentares.", "titulo_pt": "Governo de SP cria plataforma para monitorar obras, metas e emendas parlamentares", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 135184, "titulo": "Cleitinho Azevedo propõe IPVA para aviões e revisão de pedágios em MG", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/31/cleitinho-defende-cobrar-ipva-de-avioes-e-rever-contratos-de-pedagio-em-mg.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-31T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cleitinho Azevedo, candidato ao governo de Minas Gerais pelo Republicanos, propôs revisão dos contratos das empresas que administram as rodovias mineiras e a implantação do IPVA para veículos aéreos para ajudar na conservação das estradas.", "titulo_pt": "Cleitinho Azevedo sugere IPVA para aviões e revisão de pedágios em MG", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 135365, "titulo": "Anunciado por Flávio, médico fez doações para Bolsonaro e vereadora do Novo", "url": "https://www.metropoles.com/colunas/vinicius-passarelli/anunciado-por-flavio-medico-fez-doacoes-para-bolsonaro-e-vereadora-do-novo", "fonte_id": "metropoles", "data_pub": "2026-08-31T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O médico Claudio Lottenberg fez doações de R$ 20 mil para a campanha de Jair Bolsonaro em 2022 e de R$ 10 mil para uma vereadora do Novo em 2020.", "titulo_pt": "Médico fez doações para Bolsonaro e vereadora do Novo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 135185, "titulo": "Após queda do sistema Cantareira para 33% em agosto, Tarcísio descarta rodízio ou racionamento de água em SP durante estiagem", "url": "https://g1.globo.com/sp/sao-paulo/noticia/2026/08/31/apos-queda-do-sistema-cantareira-para-33percent-em-agosto-tarcisio-descarta-rodizio-ou-racionamento-de-agua-em-sp-durante-estiagem.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-31T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador de São Paulo, Tarcísio de Freitas, afirmou que a queda do nível de armazenamento do Sistema Cantareira para 33% em agosto não levará a racionamento ou rodízio de água até o fim da estiagem. A Sabesp informa que o nível do sistema passou de 36% no início de agosto para 33% até a data da declaração do governador.", "titulo_pt": "Tarcísio descarta racionamento ou rodízio de água em SP durante estiagem", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 135186, "titulo": "Tarcísio promete renovar benefício fiscal para transporte de cargas em SP e defende pedágio free flow", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/08/31/tarcisio-promete-renovar-beneficio-fiscal-para-transporte-de-cargas-em-sp-e-defende-pedagio-free-flow.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-31T16:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tarcísio de Freitas, governador de São Paulo, promete renovar o benefício fiscal para o transporte de cargas e defende a expansão do sistema de pedágio eletrônico free flow nas rodovias paulistas. Durante um encontro com empresários do setor, ele rebateu críticas de Fernando Haddad, seu principal adversário nas eleições.", "titulo_pt": "Tarcísio promete renovar benefício fiscal e defender pedágio free flow para transporte de cargas em SP", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 135161, "titulo": "Governo avaliará impacto de fim 'taxa das blusinhas' para empresas a cada 6 meses, diz relatora", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/governo-avaliara-impacto-de-fim-taxa-das-blusinhas-para-empresas-a-cada-6-meses-diz-relatora.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T16:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relator da Medida Provisória que elimina a 'taxa das blusinhas', Reginaldo Lopes (PT-MG), e a relatora, Leila do Vôlei (PDT-DF), afirmaram que o Congresso Nacional e o governo irão avaliar periodicamente os impactos da isenção do tributo nas empresas a cada 6 meses.", "titulo_pt": "Governo avaliará impacto do fim da 'taxa das blusinhas' para empresas a cada 6 meses, diz relatora", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 135216, "titulo": "Alcolumbre quer indicar Pacheco ao TCU sem sabatina e com aprovação em plenário até quarta", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/alcolumbre-quer-indicar-pacheco-ao-tcu-sem-sabatina-e-com-aprovacao-em-plenario-ate-quarta.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-31T16:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Davi Alcolumbre pretende indicar Rodrigo Pacheco para o TCU sem uma sabatina e com aprovação direta pelo plenário até quarta-feira. A indicação surge após a renúncia do ministro Bruno Dantas.", "titulo_pt": "Alcolumbre quer indicar Pacheco ao TCU sem sabatina e com aprovação em plenário até quarta", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 135217, "titulo": "Augusto Cury nega ter manipulado redes e fala em 'revolução silenciosa' após subir em pesquisa", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/augusto-cury-nega-ter-manipulado-redes-e-fala-em-revolucao-silenciosa-apos-subir-em-pesquisa.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-31T16:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Augusto Cury, candidato à Presidência pelo partido Avante, expressou alegria com os resultados de uma pesquisa, mas continuou preocupado com o futuro do Brasil em 2027.", "titulo_pt": "Augusto Cury nega ter manipulado redes e fala em 'revolução silenciosa' após subir em pesquisa", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 135468, "titulo": "Gilmar Mendes barra cobrança do Sindmagis sobre juízes que não aderirem ao sindicato", "url": "https://www.jota.info/stf/do-supremo/gilmar-mendes-barra-cobranca-do-sindmagis-sobre-juizes-que-nao-aderirem-a-entidade", "fonte_id": "jota", "data_pub": "2026-08-31T16:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes concedeu uma decisão liminar barrando a cobrança do Sindmagis sobre juízes que não aderirem ao sindicato. O Supremo Tribunal Federal ainda analisará o registro da entidade e a sindicalização de magistrados.", "titulo_pt": "Gilmar Mendes impede cobrança do Sindmagis sobre juízes não filiados", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 135887, "titulo": "Iran president says more war not in Tehran’s interest", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/01/2003863470", "fonte_id": "taipei_times", "data_pub": "2026-09-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente do Irã afirmou que uma guerra adicional não está no interesse de Teerã. Ele sinalizou que o país não busca conflitos mais amplos.", "titulo_pt": "Presidente do Irã diz que mais guerra não está no interesse de teerã", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 135842, "titulo": "Sondaggio, Vannacci sale al 7,5% e scavalca Forza Italia", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/31/sondaggio-vannacci-sale-al-75-e-scavalca-forza-italia_975553f3-2e29-455c-8676-c2cfa5627b8e.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-31T17:53:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O general Vannacci obteve uma elevação de 7,5% nas pesquisas de opinião. Forza Italia ficou em primeiro lugar, mas teve uma queda para 26,8%. O Partido Democrático (Pd) teve uma elevação para 20,7%.", "titulo_pt": "Pesquisa: Vannacci sobe para 7,5% e passa a liderar, Forza Italia cai para 26,8%", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 135505, "titulo": "‘The Nest of Snakes’: Warring Cartels Target Women in Mexico", "url": "https://www.nytimes.com/2026/08/31/world/americas/warring-cartels-target-women-in-mexico.html", "fonte_id": "nyt_world", "data_pub": "2026-08-31T17:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma guerra de dois anos entre facções rivais do Cartel de Sinaloa está levando a um aumento no número de assassinatos e desaparecimentos de mulheres no México.", "titulo_pt": "A cova das cobras: cartéis em guerra alvo de mulheres no México", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 136024, "titulo": "Iran, accustomed to sanctions, cites pain of new U.S. pressure but doesn’t bend", "url": "https://www.washingtonpost.com/world/2026/08/31/irans-economy-long-accustomed-sanctions-feels-new-us-pressure/", "fonte_id": "washington_post_world", "data_pub": "2026-08-31T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente iraniano Masoud Pezeshkian admitiu que as sanções dos Estados Unidos aumentaram os preços e reduziram o comércio. Ele afirmou que Teerã deseja o fim da guerra.", "titulo_pt": "Irã, acostumado com sanções, reconhece efeitos das novas pressões dos EUA, mas não se rende", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 135773, "titulo": "A billion galaxies, two cosmic mysteries: Inside NASA’s Nancy Grace Roman telescope", "url": "https://english.elpais.com/science-tech/2026-08-31/nancy-grace-roman-the-telescope-that-will-survey-a-billion-galaxies-in-a-bid-to-solve-the-universes-two-greatest-mysteries.html", "fonte_id": "elpais_en", "data_pub": "2026-08-31T17:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA lançou sua mais ambiciosa telescope espacial até o momento, com o objetivo de ajudar a responder duas das maiores questões da astrofísica: a natureza da matéria escura e da energia escura.", "titulo_pt": "Um bilhão de galáxias, duas mistérios cósmicos: dentro da telescope espacial Nancy Grace Roman da NASA", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 135804, "titulo": "Sudan's RSF and Israel held discreet meetings over last two years: Report", "url": "https://www.middleeasteye.net/news/sudan-rsf-and-israel-held-discreet-meetings-over-last-two-years-report", "fonte_id": "middle_east_eye", "data_pub": "2026-08-31T17:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Segundo uma investigação, delegações do Força de Suporte Rápido (RSF) de Sudão realizaram encontros discretos com Israel em 2025 e 2026. Essas delegações foram recebidas em Tel Aviv durante esse período.", "titulo_pt": "RSF de sudão e Israel realizaram encontros discretos nos últimos dois anos: relatório", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 135721, "titulo": "Galliano pulls his Met Gala exhibition after antisemitism backlash", "url": "https://www.lemonde.fr/en/international/article/2026/08/31/galliano-pulls-his-met-gala-exhibition-after-antisemitism-backlash_6757022_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-31T17:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O designer de moda John Galliano cancelou uma exposição de seu trabalho que estava programada para o Met Gala da primavera, após enfrentar críticas relacionadas a comentários antissemitas feitos em 2011.", "titulo_pt": "Galliano cancela exposição após reação antissemita", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 135843, "titulo": "Il prezzo del gas si conferma oltre i 70 euro con tensioni Usa-Iran", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/31/il-prezzo-del-gas-si-conferma-oltre-i-70-euro-con-tensioni-usa-iran_a76c446f-731f-49ff-b740-9aa953d66f5a.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-31T17:31:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O preço do gás natural continuou acima de 70 euros por megawatt-hora, e há tensões entre Estados Unidos e Irã.", "titulo_pt": "Preço do gás supera 70 euros com tensões entre EUA e Irã", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 135677, "titulo": "Nepal rescuers blast hillside in search of hydropower workers as families wait anxiously", "url": "https://www.bbc.co.uk/news/articles/c5ylvgq9q71o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-31T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rescue workers estão usando explosivos para tentar acessar trabalhadores presos, enquanto o número de mortes por inundações chega a 939. As famílias dos trabalhadores esperam ansiosamente.", "titulo_pt": "Resgatadores usam explosivos em busca de trabalhadores da hidrelétrica, enquanto mortes por inundações chegam a 939", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 135509, "titulo": "China Is the Star at a Summit With the Leaders of Russia, India and Iran", "url": "https://www.nytimes.com/2026/08/31/world/asia/putin-xi-modi-sco.html", "fonte_id": "nyt_world", "data_pub": "2026-08-31T17:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O encontro de dois dias do Organização de Cooperação de Shanghai, composta por 10 países, na Cazaquistão, demonstra os limites das sanções econômicas dos Estados Unidos. A reunião incluiu líderes da Rússia, Índia e Irã.", "titulo_pt": "China é a estrela em cimeira com líderes da Rússia, Índia e Irã", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 135779, "titulo": "War on Iran: US bombs Iran", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/31/war-on-iran-us-bombs-iran?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-31T17:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O título sugere que os Estados Unidos bombardearam o Irã, o que pode indicar uma operação militar. No entanto, não há detalhes adicionais sobre o contexto ou as consequências dessas ações.", "titulo_pt": "Guerra ao Irã: EUA bombardeiam o Irã", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 135731, "titulo": "Trump reportedly plans to announce new drug pricing deals with nearly a dozen drugmakers", "url": "https://www.cnbc.com/2026/08/31/trump-drug-pricing-deals.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-31T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Trump planeja anunciar novos acordos de preços de medicamentos com cerca de uma dúzia de fabricantes de medicamentos. Estes acordos fazem parte da campanha do governo Trump de vincular os preços dos medicamentos nos Estados Unidos aos menores preços internacionais.", "titulo_pt": "Trump planeja anunciar novos acordos de preços de medicamentos com dezenas de fabricantes", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 135775, "titulo": "Federal probe closes in on ‘Lawyer of Miracles’ after 54,000 immigration cases left in limbo", "url": "https://english.elpais.com/usa/2026-08-31/federal-probe-closes-in-on-lawyer-of-miracles-after-54000-immigration-cases-left-in-limbo.html", "fonte_id": "elpais_en", "data_pub": "2026-08-31T17:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores do FDNS começaram a entrevistar ex-clientes da advogada de imigração Alexandra Lozano como parte de uma investigação em Seattle. Mais de 54.000 casos de imigração ficaram em suspenso.", "titulo_pt": "Inquérito federal se aproxima do 'advogado dos milagres' após 54.000 casos de imigração ficarem em suspenso", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 135631, "titulo": "Paperwork, lines, hours on hold: There's a 'Time Tax' on Americans who need help most", "url": "https://www.npr.org/2026/08/31/nx-s1-5946449/time-tax-annie-lowrey-government-assistance-unemployment", "fonte_id": "npr_news", "data_pub": "2026-08-31T17:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Annie Lowrey investiga os desafios burocráticos enfrentados pelas pessoas ao se candidatar a benefícios governamentais. Ela destaca que o tempo gasto nesses processos não é apenas uma perda de tempo, mas também um impacto na confiança no governo.", "titulo_pt": "Taxa de tempo: os desafios burocráticos enfrentados pelos americanos na busca por benefícios governamentais", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 135860, "titulo": "Xi, Putin vow to deepen strategic ties after Shanghai Cooperation Organisation summit meet", "url": "https://www.scmp.com/news/china/diplomacy/article/3365890/xi-putin-vow-deepen-strategic-ties-after-meeting-sco-summit?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-31T17:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Xi Jinping e Vladimir Putin prometeram fortalecer o papel da Organização do Tratado de Cooperação de Shanghai (SCO) durante sua reunião no lado de fora da cúpula SCO em Bishkek, Cazaquistão. Os dois líderes buscam aprofundar a coordenação estratégica enquanto enfrentam tensões crescentes com Washington e seus aliados.", "titulo_pt": "Xi e Putin prometem fortalecer laços estratégicos após encontro da cúpula da organização do tratado de cooperação de Shanghai", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 135784, "titulo": "Iran could face economic collapse in months, US Treasury’s Bessent warns", "url": "https://www.aljazeera.com/economy/2026/8/31/iran-could-face-economic-collapse-in-months-us-treasurys-bessent-warns?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-31T17:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário do Tesouro dos EUA, Scott Bessent, alertou sobre o risco de colapso econômico do Irã devido à pressão econômica dos EUA durante uma reunião de ministros de finanças do G20.", "titulo_pt": "EUA podem levar à colapso econômico do Irã, avisa secretário do tesouro", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 135908, "titulo": "Global chip market to exceed US$2tn by 2030: SEMI", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/01/2003863453", "fonte_id": "taipei_times", "data_pub": "2026-09-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mercado de chips global deve ultrapassar os 2 trilhões de dólares até 2030, de acordo com a SEMI.", "titulo_pt": "Mercado de chips global atingirá US$2tn até 2030, diz SEMI", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 135467, "titulo": "Brasil e UE em direções opostas no comércio cross-border", "url": "https://www.jota.info/opiniao-e-analise/artigos/brasil-e-ue-em-direcoes-opostas-no-comercio-cross-border", "fonte_id": "jota", "data_pub": "2026-08-31T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O debate sobre o fim da taxa das blusinhas coincidiu com a criação de uma taxa semelhante no bloco europeu.", "titulo_pt": "Brasil e UE em direções opostas no comércio cross-border", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 135532, "titulo": "Photos: The Aftermath of Nepal’s Flash Floods", "url": "https://www.theatlantic.com/photography/2026/08/photos-the-aftermath-of-nepals-flash-floods/688472/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-08-31T17:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Imagens de vilarejos montanhosos afetados, onde as operações de resgate e recuperação continuam. Mais de 900 mortes foram confirmadas, enquanto cerca de 4.000 pessoas permanecem desaparecidas após inundações poderosas causadas por um colapso de geleira em 26 de agosto.", "titulo_pt": "Imagens: os efeitos das inundações após o colapso de uma geleira no Nepal", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 135159, "titulo": "Ações de petrolíferas brasileiras sobem em bloco com avanço do petróleo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/08/01/6556-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466781", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações das empresas petrolíferas brasileiras Petrobras, Prio e PetroReconcavo subiram nesta segunda-feira (31), contribuindo para a alta do Ibovespa em mais de 1%. O avanço foi acompanhado do aumento dos preços do petróleo, que subiram mais de 2% durante a sessão.", "titulo_pt": "Ações de petrolíferas brasileiras subem em conjunto com o aumento dos preços do petróleo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 135160, "titulo": "Superbet lança serviço para viciados em jogos em campanha de R$ 60 mi com Cafu", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/superbet-lanca-servico-para-viciados-em-jogos-em-campanha-de-r-60-mi.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T17:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Superbet, um dos três maiores sites de apostas do Brasil, lançou uma linha de acolhimento 24 horas, via telefone e WhatsApp, em resposta aos relatos sobre o vício em jogos. O anúncio foi feito na segunda-feira (31) e l": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/justica-do-rj-decreta-falencia-da-refit-alvo-de-operacoes-sobre-fraude-em-combustiveis.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T16:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça do Rio de Janeiro decretou a falência do grupo Refit, que estava em recuperação judicial e foi alvo de operações contra fraudes no mercado de combustíveis. O empresário Ricardo Magro está envolvido no grupo que enfrentava problemas financeiros.", "titulo_pt": "Justiça do RJ decreta falência da Refit, alvo de operações sobre fraudes em combustíveis", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 135164, "titulo": "Justiça do Trabalho condena Droga Raia a pagar R$ 4 mi por assédio e discriminação", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/justica-do-trabalho-condena-droga-raia-a-pagar-r-4-mi-por-assedio-e-discriminacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T16:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A rede de farmácias Droga Raia foi condenada a pagar R$ 4 milhões por dano moral coletivo devido a práticas de assédio, sexual e materno, e discriminação no ambiente de trabalho.", "titulo_pt": "Justiça do Trabalho condena Droga Raia a pagar R$ 4 mi por assédio e discriminação", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 135290, "titulo": "Brasil e EUA retomam negociações sobre tarifaço imposto a produtos brasileiros", "url": "https://www.brasildefato.com.br/2026/08/31/brasil-e-eua-retomam-negociacoes-sobre-tarifaco-imposto-a-produtos-brasileiros/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-31T15:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Representantes do Brasil e dos Estados Unidos se reúnem por videoconferência para discutir o tarifaço imposto pela Casa Branca contra exportações brasileiras. Este encontro é a primeira rodada oficial após um telefonema entre os presidentes Luiz Inácio Lula da Silva e Joe Biden.", "titulo_pt": "Brasil e EUA retomam negociações sobre tarifaço imposto a produtos brasileiros", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 135166, "titulo": "Ações da Casas Bahia disparam mais de 40% após suspensão de cobranças contra varejista", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/acoes-da-casas-bahia-disparam-mais-de-40-apos-suspensao-de-cobrancas-contra-varejista.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T15:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações da Casas Bahia subiram mais de 40% após a empresa comunicar a suspensão temporária de ações judiciais e cobranças de dívidas por 180 dias. O valor das ações atingiu R$ 0,59 no máximo durante a sessão de negociação de segunda-feira (31).", "titulo_pt": "Ações da Casas Bahia ganham mais de 40% após suspensão de ações judiciais e cobranças", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 135167, "titulo": "Contrabando cresce na Argentina após Milei abrir economia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/contrabando-cresce-na-argentina-apos-milei-abrir-economia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T15:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As importações de produtos contrabandeados, como uísque, roupas e celulares, estão aumentando na Argentina, aproveitando as medidas do presidente libertário Javier Milei para fortalecer a moeda e liberalizar a economia.", "titulo_pt": "Contrabando aumenta na Argentina após Milei abrir economia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 135168, "titulo": "Escassez de whey protein pode fazer empresas buscarem novas fontes, avalia associação", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/escassez-de-whey-protein-pode-fazer-empresas-buscarem-novas-fontes-avalia-associacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas de whey protein no Brasil podem precisar buscar alternativas de proteína, como a de carne, levedura, vegetais e produzida em laboratório, para atender à demanda, segundo avaliação do presidente da Abenutri. A proteína de laboratório já permite obter um produto com alto valor biológico fora do soro do leite.", "titulo_pt": "Falta de whey protein pode levar empresas a buscarem novas fontes, diz associação", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 135169, "titulo": "Dono do Pão de Açúcar diz que Justiça estipulou prazo para MP-SP apresentar provas sobre retirada de credores", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/dono-do-pao-de-acucar-diz-que-justica-estipulou-prazo-para-mp-sp-apresentar-provas-sobre-retirada-de-credores.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T14:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O GPA, dono do Pão de Açúcar, recebeu prazo de cinco dias para que o MP-SP e os credores que impugnaram o plano de recuperação extrajudicial apresentem provas sobre a suposta retirada indevida de créditos do plano.", "titulo_pt": "Gpa recebe prazo para apresentar provas sobre suposta retirada indevida de créditos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 135470, "titulo": "9 casos no STJ que podem impactar estratégias de empresas", "url": "https://www.jota.info/justica/9-casos-no-stj-que-podem-impactar-estrategias-de-empresas",
