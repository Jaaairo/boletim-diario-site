<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

const D = {"gerado_em": "22/08/2026 19:15", "stats": {"noticias_novas": 339, "resumos_gerados": 204}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "As pesquisas eleitorais indicam uma disputa apertada entre Lula e Flávio Bolsonaro, com variações regionais. Em São Paulo, Flávio Bolsonaro lidera com 37% das intenções de voto, seguido por Lula com 33%. Em Pernambuco, Lula tem 56% das intenções de voto, contra 24% de Flávio Bolsonaro. No Distrito Federal, a liderança é de Flávio Bolsonaro com 39%, seguido por Lula com 31%. Em Minas Gerais, Lula e Flávio Bolsonaro estão tecnicamente empatados com 37% e 31% respectivamente. A avaliação positiva de Lula varia entre 46% em Pernambuco e 27% no Distrito Federal. Em um cenário de segundo turno, Flávio Bolsonaro lidera com 47% das intenções de voto contra 42% de Lula em São Paulo. A disputa eleitoral também envolve outros candidatos, como Ronaldo Caiado, Renan Santos e Romeu Zema, que têm intenções de voto entre 2% e 10%. Além disso, o INSS autorizou a liberação de empréstimos consignados sem a necessidade de biometria facial, e Lula prometeu criar o Ministério da Segurança no Rio de Janeiro e expulsar bandidos de territórios.", "mundo": "Os Estados Unidos enfrentam tensões internacionais e regionais em vários frentes. O Irã ameaçou retaliar países que apoiam as sanções americanas, enquanto o Canadá e os Estados Unidos entraram em guerra comercial após falhas nas negociações. O Canadá anunciou tarifas retaliatórias em diversos setores dos EUA, com o primeiro-ministro Justin Trudeau declarando que o país está em guerra comercial. A Alemanha também enfrenta a possibilidade histórica de uma extrema-direita alcançar o poder pela primeira vez desde a Segunda Guerra Mundial, com campanhas contra a AfD focando em estratégias eleitorais. O fenômeno climático El Niño já está ocorrendo no Oceano Pacífico, com possíveis efeitos intensos na América Latina.\n\nO Estreito de Taiwan foi palco de uma demonstração de força dos Estados Unidos, com um voo de um avião de transporte, na véspera do encontro entre Xi Jinping e Donald Trump, reforçando a presença militar americana na região. Paralelamente, o Canadá reagiu com tarifas após fracassadas negociações com os EUA, enquanto a China também reagiu, exigindo a retirada de tarifas sobre drones e abrindo uma rota semanal ártica para a Europa. Em outra frente geopolítica, Israel intensificou suas atividades militares, atacando o sul da Síria e causando feridos, enquanto a Rússia condenou o ataque e ameaçou os setores econômicos mais vulneráveis da Ucrânia. A Ucrânia, por sua vez, intensificou seus ataques com drones contra a infraestrutura econômica russa, levando Putin a afirmar que Kiev havia aberto uma 'caixa de Pandora'.", "economia": "Os Estados Unidos impuseram tarifas de 50% sobre produtos canadenses após falhas nas negociações comerciais, aumentando a tensão entre os dois países. O Canadá planeja retaliar essas tarifas, que entram em vigor em 8 de setembro. Paralelamente, o Canadá tenta reduzir sua dependência dos EUA, enquanto os Estados Unidos buscam manter sua independência econômica. No Brasil, as vendas de soja aceleraram, com US$ 11 bilhões ainda por comercializar. Além disso, a estiagem afetou a navegabilidade dos rios na Amazônia, levando a aplicação de sobretaxas. O rendimento médio das famílias aumentou em 3,3%, e o governo projeta reduzir os subsídios energéticos para cumprir metas de redução do PIB. O mercado de marmitas também cresceu, adaptando-se às necessidades dos usuários de canetas emagrecedoras. Por fim, o governo brasileiro anunciou a campanha de vacinação nacional contra o sarampo.", "tecnologia": "A Nvidia informou aos seus clientes que os preços dos servidores equipados com seus chips de inteligência artificial (AI) aumentarão em mais de 15%, devido ao aumento dos custos de chips de memória. Essa mudança será implementada a partir do início do próximo ano, afetando os servidores com os chips flagship Vera Rubin e Grace Blackwell. Em outro desenvolvimento, a OpenAI solicitou que as leis de segurança de IA na Califórnia sejam fortalecidas, com o objetivo de garantir maior monitoramento e controle sobre os modelos avançados de inteligência artificial. Além disso, a Inherent, uma empresa britânica fundada por ex-alunos de DeepMind, lançou o Faraday, um agente de IA capaz de replicar artigos científicos, superando o Anthropic e a OpenAI em replicar pesquisas. Esses avanços tecnológicos refletem a crescente importância da IA em diversos setores, desde a automação de processos industriais até a criação de conteúdo digital.", "ciencia": "A Europa registrou mais de 30.000 mortes a mais durante o verão, segundo a primeira estimativa, devido a ondas de calor e seca, que os cientistas atribuem ao aquecimento global. Em um avanço na pesquisa sobre câncer, o oncologista Luiz Henrique Araújo afirmou que o câncer de pulmão deixou de ser considerado uma sentença de morte devido a novos tratamentos. O rover Curiosity da NASA descobriu um extenso campo de polígonos na superfície de Marte, enquanto a NASA planeja enviar o drone Dragonfly para explorar a lua Titã de Saturno em busca de sinais de vida. Além disso, uma nova espécie de cobra foi descoberta na Nova Guiné e recebeu o nome de um guitarrista, e um novo estudo usando o JWST revelou que galáxias antigas podem ser três a quatro vezes mais massivas do que se pensava, o que dificulta a explicação sobre a formação de galáxias enormes logo após o Big Bang.", "cultura": "O Festival de Cinema de Gramado em 2026 abordou temas sensíveis para mulheres, com o filme 'De Antártida a Pele de Rinoceronte' entre os longas que exploraram esse tema. Maria Fernanda Cândido ganhou o Kikito de Cristal no evento, reforçando o prestígio do cinema brasileiro internacionalmente. A cantora Carminho está em turnê para promover seu sétimo álbum, 'Eu Vou Morrer de Amor ou Resistir', e fará dois shows em São Paulo. Além disso, a série 'Matéria Escura' está em sua segunda temporada, retratando a adaptação dos personagens em um mundo mais estável após períodos de instabilidade, enquanto a série 'Quem Ama Cuida' realizou uma festa temática de peruca em comemoração a um evento recente no Rio de Janeiro.", "sociedade": "Em Copacabana, no Rio de Janeiro, duas pessoas foram detidas temporariamente por suspeita de envolvimento no linchamento que resultou na morte de um ciclista. O incidente expôs tensões sociais e sublinhou a necessidade de uma investigação aprofundada. Na Argentina, a queda da taxa de natalidade foi vista como uma oportunidade pelo demographer Carola Della Paolera, embora a situação tenha levantado preocupações sobre a composição demográfica do país.", "meio_ambiente": "A China está avaliando a possibilidade de sediar as negociações climáticas da ONU em 2028, conforme informaram fontes. Em outro desenvolvimento, a Conaf denunciou a presença de motos de neve em atividades ilegais na Reserva Nacional Malalcalegüello, no Chile, levando à denúncia ao Juzgado de Polícia Local de Curacautín. O fenômeno 'Super El Niño' levou a Organização Não-Governamental Habitat para a Humanidade Brasil a alertar para o aumento do risco de eventos como enchentes e deslizamentos de terra no Brasil. O paleoclimatologista Jean Jouzel expressou preocupação com a falta de compreensão dos candidatos presidenciais franceses sobre a gravidade do aquecimento global. Além disso, uma remessa de 1,2 tonelada de ossos de elefante contrabandeados foi apreendida na Alfândega de Hong Kong, enquanto a Europa registrou mais de 32.000 mortes a mais devido a um calor extremo entre julho e agosto.", "direitos_humanos": "Trabalhadores indonésios acusam empregadores de práticas abusivas, como trabalho forçado e redução salarial, em operações de empregos temporários. Essas acusações, segundo relatos, revelam violações significativas dos direitos trabalhistas. O artigo destaca a necessidade de maior regulamentação e proteção para os trabalhadores temporários, enfatizando a importância de garantir seus direitos e prevenir a exploração laboral."}, "resumo_do_dia": {"politica_nacional": [{"id": 118403, "titulo": "Lula x Flávio: A diferença na intenção de votos nos dois maiores colégios eleitorais, segundo o Datafolha", "url": "https://veja.abril.com.br/politica/lula-x-flavio-a-diferenca-na-intencao-de-votos-nos-dois-maiores-colegios-eleitorais-segundo-o-datafolha/", "fonte_id": "veja", "data_pub": "2026-08-22T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Datafolha registrou que o senador Flávio Bolsonaro está à frente do ex-presidente Lula em São Paulo, enquanto Lula aparece numericamente à frente em Minas Gerais, em um cenário de empate técnico.", "titulo_pt": "Lula x Flávio: a diferença na intenção de votos nos dois maiores colégios eleitorais, segundo o Datafolha", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 118358, "titulo": "Datafolha: Avaliação positiva de Lula vai de 46% em PE a 27% em SP, RJ e DF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/datafolha-avaliacao-positiva-de-lula-vai-de-46-em-pe-a-27-em-sp-rj-e-df.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-22T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha divulgada neste sábado (22) mostra que Pernambuco é o estado com a avaliação mais positiva para o governo Lula, com 46% considerando o governo ótimo ou bom. Já o Distrito Federal tem o pior índice, com 51% de avaliação negativa.", "titulo_pt": "Avaliação positiva de Lula varia de 46% em PE a 27% em SP, RJ e DF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 118359, "titulo": "Datafolha: Flávio tem 47%, e Lula, 42% em SP no 2º turno; MG marca empate", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/datafolha-flavio-tem-47-e-lula-42-em-sp-no-2o-turno-mg-marca-empate.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-22T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No estado de São Paulo, Flávio Bolsonaro lidera com 47% das intenções de voto contra 42% de Lula em um cenário de segundo turno para a Presidência da República.", "titulo_pt": "Flávio tem 47%, e Lula, 42% em SP no 2º turno; MG marca empate", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 118453, "titulo": "Raquel acusa adversários de tentar “ganhar no tapetão” em Pernambuco", "url": "https://www.cnnbrasil.com.br/eleicoes/raquel-acusa-adversarios-de-tentar-ganhar-no-tapetao-em-pernambuco/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-22T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A governadora Raquel revelou que seus adversários estão tentando ganhar de forma irregular na campanha em Pernambuco. Durante uma visita à cidade de Camaragibe, ela também abordou fake news e mencionou investimentos no município.", "titulo_pt": "Raquel acusa adversários de tentar ganhar de forma irregular em Pernambuco", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 118405, "titulo": "Como está disputa Lula x Flávio, segundo as pesquisas desta semana", "url": "https://veja.abril.com.br/politica/como-esta-disputa-lula-x-flavio-segundo-as-pesquisas-da-semana-sobre-a-corrida-ao-planalto/", "fonte_id": "veja", "data_pub": "2026-08-22T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As pesquisas Datafolha e BTG/Nexus indicam que Lula está numericamente à frente de Flávio Bolsonaro tanto no primeiro quanto no segundo turno, mas os dois candidatos estão tecnicamente empatados.", "titulo_pt": "Como está a disputa Lula x Flávio, segundo as pesquisas desta semana", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 118360, "titulo": "Renan Santos ganha chance na TV com debate, e aliados dizem que ele não será nova versão de Marçal", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/renan-santos-ganha-chance-na-tv-com-debate-e-aliados-dizem-que-ele-nao-sera-nova-versao-de-marcal.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-22T20:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Renan Santos, candidato à Presidência da República pelo partido Missão, ganhou mais visibilidade na TV após um debate. Seus aliados afirmam que ele não será a nova versão de Marçal, um candidato anterior. Renan explica que, como candidato digital, precisa gravar muitos vídeos.", "titulo_pt": "Renan Santos ganha chance na TV após debate, dizem não ser nova versão de Marçal", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 118413, "titulo": "INSS autoriza consignado sem biometria: quem pode contratar e como funciona", "url": "https://veja.abril.com.br/economia/inss-aprova-emprestimo-consignado-sem-biometria-quem-pode-contratar-e-como-funciona/", "fonte_id": "veja", "data_pub": "2026-08-22T19:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A regra permite que aposentados e pensionistas contratem crédito consignado pelo Meu INSS mesmo quando a biometria não estiver disponível nas bases do governo. Isso se aplica a situações em que a biometria não pode ser realizada.", "titulo_pt": "INSS autoriza consignado sem biometria: quem pode contratar e como funciona", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 118414, "titulo": "No Rio, Lula promete Ministério da Segurança e tirar bandidos de territórios", "url": "https://veja.abril.com.br/politica/no-rio-lula-promete-ministerio-da-seguranca-e-tirar-bandidos-de-territorios/", "fonte_id": "veja", "data_pub": "2026-08-22T19:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula prometeu criar o Ministério da Segurança no Rio e expulsar bandidos de territórios. Ele considerou o prefeito Paes como uma 'necessidade' para o Rio.", "titulo_pt": "Lula promete Ministério da Segurança e expulsar bandidos do Rio, dizendo que paes é uma 'necessidade'", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 118440, "titulo": "Lulinha e Dark Horse trazem PF e Mendonça para a disputa eleitoral", "url": "https://www.metropoles.com/brasil/lulinha-e-dark-horse-trazem-pf-e-mendonca-para-a-disputa-eleitoral", "fonte_id": "metropoles", "data_pub": "2026-08-22T19:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Investigações relacionadas a Lulinha e Dark Horse ganham novos desdobramentos com o avanço da campanha eleitoral. O ministro do STF, Fachin, acumula a relatoria dos dois processos.", "titulo_pt": "Lulinha e Dark Horse trazem fachin para a disputa eleitoral", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 118364, "titulo": "Irmãos Batista dizem ao Cade que compra da Avibras é entrada em defesa nacional", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/irmaos-batista-dizem-ao-cade-que-compra-da-avibras-e-entrada-em-defesa-nacional.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-22T18:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Grupo J&F, liderado pelos irmãos Wesley e Joesley Batista, informou a asse": "A"}], "politica_nacional__eventos": [{"titulo": "Datafolha em PE: lula com 56%; Flávio Bolsonaro com 24%", "sumario": "A pesquisa Datafolha divulgada neste sábado (22) mostra que Lula lidera a corrida presidencial em Pernambuco com 56% das intenções de voto, seguido por Flávio Bolsonaro com 24%. A pesquisa Datafolha, divulgada no Distrito Federal, indica que Flávio Bolsonaro lidera com 39% das intenções de voto, seguido por Lula com 31%. A pesquisa Datafolha, divulgada no sábado (22), indica que Flávio Bolsonaro lidera a intenção de voto para presidente no estado de São Paulo com 37%, seguido por Luiz Inácio Lula da Silva com 33%.", "artigos": [{"id": 118370, "titulo": "Datafolha em PE: Lula, 56%; Flávio Bolsonaro, 24%; Caiado; 2%; Renan; 2%; Zema, 1%; Cury, 1%", "url": "https://g1.globo.com/pe/pernambuco/eleicoes/2026/noticia/2026/08/22/datafolha-pe-presidente-agostoghtml.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-22T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha divulgada neste sábado (22) mostra que Lula lidera a corrida presidencial em Pernambuco com 56% das intenções de voto, seguido por Flávio Bolsonaro com 24%. Ronaldo Caiado e Renan Santos têm 2% cada, enquanto João Zema e João Cury têm 1% cada.", "titulo_pt": "Datafolha em PE: lula com 56%; Flávio Bolsonaro com 24%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 118371, "titulo": "Datafolha no DF: Flávio Bolsonaro, 39%; Lula, 31%; Caiado; 10%; Renan, 3%; Zema, 2%; Cury, 1%", "url": "https://g1.globo.com/df/distrito-federal/eleicoes/2026/noticia/2026/08/22/datafolha-flavio-bolsonaro-39percent-lula-31percent-ronaldo-caiado-10percent-renan-santos-3percent-zema-2percent-augusto-cury-1percent.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-22T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha, divulgada no Distrito Federal, indica que Flávio Bolsonaro lidera com 39% das intenções de voto, seguido por Lula com 31%. Ronaldo Caiado tem 10%, enquanto Renan Santos, Romeu Zema e Augusto Cury têm 3%, 2% e 1% respectivamente. Samara Martins e Clariana Barão têm 1% cada.", "titulo_pt": "Pesquisa datafolha no DF: flávio Bolsonaro e Lula lideram com 39% e 31%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 118372, "titulo": "Datafolha em SP: Flávio Bolsonaro, 37%; Lula, 33%; Renan, 5%; Caiado, 4%; Zema, 3%; Cury, 3%", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/08/22/datafolha-flavio-bolsonaro-tem-37percent-e-lula-33percent-entre-eleitores-de-sp-no-1o-turno.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-22T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha, divulgada no sábado (22), indica que Flávio Bolsonaro lidera a intenção de voto para presidente no estado de São Paulo com 37%, seguido por Luiz Inácio Lula da Silva com 33%. Renan Santos, Ronaldo Caiado, Romeu Zema e Cury têm 5%, 4%, 3% e 3%, respectivamente.", "titulo_pt": "Datafolha em SP: flávio Bolsonaro, 37%; Lula, 33%; Renan, 5%; Caiado, 3%; Zema, 3%; Cury, 3%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 118373, "titulo": "Datafolha em MG: Lula, 37%; Flávio Bolsonaro, 31%; Zema, 10%", "url": "https://g1.globo.com/mg/minas-gerais/eleicoes/2026/noticia/2026/08/22/datafolha-mg-presidente-agosto.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-22T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Datafolha divulgou uma pesquisa mostrando as intenções de voto para a Presidência da República em Minas Gerais. Lula (PT) lidera com 37%, seguido por Flávio Bolsonaro (PL) com 31%, e Romeu Zema (Novo) com 10%.", "titulo_pt": "Datafolha em MG: lula, 37%; Flávio Bolsonaro, 31%; Zema, 10%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}]}], "mundo": [{"id": 118256, "titulo": "US aircraft transits Strait ahead of Xi-Trump meet", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/23/2003862966", "fonte_id": "taipei_times", "data_pub": "2026-08-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um avião dos Estados Unidos realizou um voo de transito pelo Estreito de Taiwan antes do encontro entre Xi Jinping e Donald Trump.", "titulo_pt": "Avião dos EUA transita pelo estreito de taiwan antes do encontro Xi-Trump", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 118263, "titulo": "Defense budget proposal sending US signals: expert", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/23/2003862980", "fonte_id": "taipei_times", "data_pub": "2026-08-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um plano de orçamento de defesa está sendo usado para enviar sinais para os Estados Unidos, de acordo com um especialista. O plano parece indicar que Taiwan está disposta a aumentar sua capacidade defensiva.", "titulo_pt": "Plano de orçamento de defesa enviando sinais para os estados unidos: especialista", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 118396, "titulo": "Canadá responde com tarifas após fracasso da negociação com Trump", "url": "https://www.cartacapital.com.br/mundo/canada-responde-com-tarifas-apos-fracasso-da-negociacao-com-trump/", "fonte_id": "cartacapital", "data_pub": "2026-08-22T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Canadá implementou tarifas em resposta às negociações fracassadas com o presidente dos Estados Unidos, Donald Trump. O primeiro-ministro canadense, Mark Carney, criticou as propostas dos EUA, afirmando que eles pediram muito e ofereceram pouco.", "titulo_pt": "Canadá responde com tarifas após falência de negociação com Trump", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 118421, "titulo": "Secretário do Irã ameça retaliar países vizinhos que apoiarem Trump", "url": "https://www.metropoles.com/mundo/secretario-do-ira-ameca-retaliar-paises-vizinhos-que-apoiarem-trump", "fonte_id": "metropoles", "data_pub": "2026-08-22T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O chefe da segurança do Irã ameaçou retaliar países vizinhos que colaborarem com a 'guerra econômica' dos EUA, afirmando que o estreito de Ormuz será afetado.", "titulo_pt": "Secretário do Irã ameaça retaliar países vizinhos que apoiarem Trump", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 118673, "titulo": "Iran condemns US plans to announce new sanctions", "url": "https://www.scmp.com/news/world/middle-east/article/3364944/iran-condemns-us-plans-announce-new-sanctions?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-22T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Irã rejeitou as intenções dos Estados Unidos de anunciar novas sanções que poderiam agravar a economia do Irã e afetar seus principais parceiros comerciais, incluindo a China. O Irã advertiu países contra participar nesta 'guerra econômica' dos Estados Unidos, afirmando que consideraria tais países inimigos.", "titulo_pt": "Irã condena planos dos EUA de anunciar novas sanções", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 118475, "titulo": "Justiça dos EUA derruba ato de Trump que suspendia vistos de residência para brasileiros e cidadãos de outros 74 países", "url": "https://www.brasildefato.com.br/2026/08/22/justica-dos-eua-derruba-ato-de-trump-que-suspendia-vistos-de-residencia-para-brasileiros-e-cidadaos-de-outros-74-paises/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-22T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A justiça dos Estados Unidos derrubou uma política de Trump que suspendia vistos de residência permanente para cidadãos de 75 países, incluindo o Brasil. A juíza federal Jeannette Vargas considerou a medida ilegal e afirmou que ela extrapolava a autoridade do governo.", "titulo_pt": "Justiça dos EUA derruba ato de Trump que suspendia vistos de residência para brasileiros e cidadãos de outros 75 países", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 118568, "titulo": "Ceuta duplica esfuerzos para templar ánimos y ubicar a los migrantes", "url": "https://elpais.com/espana/2026-08-22/los-migrantes-de-ceuta-aceptan-los-espacios-de-acogida-pero-aun-recelan-de-que-sean-una-trampa.html", "fonte_id": "elpais_america", "data_pub": "2026-08-22T21:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Ceuta está duplicando esforços para encontrar alojamento para migrantes e acalmar a população local, que manifesta recelo. O temor é de que a tensão social aumente à medida que se aproxima o início do ano letivo.", "titulo_pt": "Ceuta duplica esforços para acolher migrantes e aliviar tensões", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 118596, "titulo": "Trump’s Top Trade Representative Details Offer That Canada Refused", "url": "https://www.nytimes.com/2026/08/22/business/economy/greer-us-canada-trade-deal.html", "fonte_id": "nyt_world", "data_pub": "2026-08-22T21:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jamieson Greer, representante comercial de Trump, detalhou os termos da oferta comercial feita ao Canadá antes de as negociações falirem.", "titulo_pt": "Representante comercial de trump detalha oferta rejeitada pelo canadá", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 118648, "titulo": "Israeli army and settlers injure several Palestinians across West Bank", "url": "https://www.aljazeera.com/news/2026/8/22/israeli-army-and-settlers-injure-several-palestinians-across-west-bank?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-22T21:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Palestinos são feridos em ataques e forcidos a se mudarem enquanto colonos israelenses expandem seu controle, apoiados por operações militares e inação.", "titulo_pt": "Exército israelense e colonos ferem vários palestinos em todo o cisjordânia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 118642, "titulo": "France promises interceptor missiles to Ukraine after latest deadly Russian drone strikes", "url": "https://www.lemonde.fr/en/international/article/2026/08/22/france-promises-interceptor-missiles-to-ukraine-after-latest-deadly-russian-drone-strikes_6756768_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-22T20:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente francês, Macron, prometeu fornecer mísseis interceptores à Ucrânia após os últimos ataques mortíferos de drones russos. Essa ação visa fornecer às autoridades ucranianas os meios necessários para contrapor a agressão.", "titulo_pt": "França promete mísseis interceptores à Ucrânia após ataques de drones russos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 118620, "titulo": "Trump administration's 75-country visa ban was illegal, judge rules", "url": "https://www.npr.org/2026/08/22/nx-s1-5941765/trump-immigration-visa-ban-75-countries", "fonte_id": "npr_news", "data_pub": "2026-08-22T20:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos suspendeu o expediente de vistos para cidadãos de 75 países, alegando que esses cidadãos provavelmente precisariam de assistência pública. Um juiz declarou que a política discriminava ilegalmente baseada em nacionalidade.", "titulo_pt": "Juiz decide que banimento de vistos de 75 países pelo governo trump era ilegal", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 118567, "titulo": "Cientos de haitianos protestan en embajada de Haití en Chile por problemas con los trámites migratorios", "url": "https://elpais.com/chile/2026-08-22/cientos-de-haitianos-protestan-en-embajada-de-haiti-en-chile-por-problemas-con-los-tramites-migratorios.html", "fonte_id": "elpais_america", "data_pub": "2026-08-22T20:50:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Centenas de haitianos protestaram na embaixada de Haiti no Chile por problemas com os trâmites migratórios. Agentes da Carabineros foram chamados para controlar a situação após um forcejeio que resultou na derrubada da porta principal.", "titulo_pt": "Centenas de haitianos protestam na embaixada de haiti no Chile por problemas com trâmites migratórios", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 118354, "titulo": "Serviço Postal dos EUA atende pedido de Trump e publica plano para restringir voto pelo correio", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/08/servico-postal-dos-eua-atende-pedido-de-trump-e-publica-plano-para-restringir-voto-pelo-correio.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-22T20:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O USPS publicou normas que restringiriam o voto pelo correio, em resposta a um pedido do presidente Donald Trump, poucos meses antes das eleições legislativas de meio de mandato.", "titulo_pt": "Servidor Postal dos EUA publica plano para limitar voto pelo correio", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 118476, "titulo": "EUA elevam tarifas sobre drones a até 100%; China exige retirada", "url": "https://www.brasildefato.com.br/colunista/noticias-da-china/2026/08/22/eua-elevam-tarifas-sobre-drones-a-ate-100-china-exige-retirada/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-22T20:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A China reagiu ao protecionismo dos EUA, exigindo a retirada das tarifas sobre drones e retomando o diálogo com a Coreia do Sul. Além disso, a China abriu uma rota semanal ártica para a Europa.", "titulo_pt": "China responde protecionismo EUA exigindo retirada de tarifas sobre drones", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 118461, "titulo": "Países que aderirem à guerra de Trump serão alvos, diz autoridade do Irã", "url": "https://www.cnnbrasil.com.br/internacional/paises-que-aderirem-a-guerra-de-trump-serao-alvos-diz-autoridade-do-ira/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-22T20:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O chefe de segurança do Irã afirmou que o Estreito de Ormuz permanecerá fechado até os EUA cumprirem seus compromissos. Autoridades iranianas ameaçaram retaliar se outros países aderirem à guerra proposta pelo presidente americano, Donald Trump.", "titulo_pt": "Autoridade iraniana diz que países que aderirem à guerra de Trump serão alvos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 118355, "titulo": "El Niño já começou, e a tragédia não é inevitável", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/colunas/sylvia-colombo/2026/08/el-nino-ja-comecou-e-a-tragedia-nao-e-inevitavel.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-22T20:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O fenômeno climático El Niño já está ocorrendo no oceano Pacífico. Este ano pode ser uma das passagens mais intensas do El Niño pela América Latina.", "titulo_pt": "El Niño já começou, e a tragédia não é inevitável", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 118258, "titulo": "Trump tariffs hit as Canada tries to curb US reliance", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/23/2003862968", "fonte_id": "taipei_times", "data_pub": "2026-08-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As tarifas impostas pelo governo dos Estados Unidos estão causando problemas, enquanto o Canadá tenta reduzir a dependência dos EUA.", "titulo_pt": "Tarifas de trump afetam enquanto canadá busca diminuir dependência dos EUA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 118265, "titulo": "Average household income up 3.3%", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/23/2003862982", "fonte_id": "taipei_times", "data_pub": "2026-08-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O rendimento médio das famílias aumentou em 3,3%.", "titulo_pt": "Rendimento médio das famílias up 3,3%", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 118489, "titulo": "‘Profunda desconfiança’ sobre líderes da Boeing continua, diz sindicato", "url": "https://www.infomoney.com.br/business/profunda-desconfianca-sobre-lideres-da-boeing-continua-diz-sindicato/", "fonte_id": "infomoney", "data_pub": "2026-08-22T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Funcionários da Boeing expressam uma profunda desconfiança em relação aos líderes da empresa, citando problemas como transferência de empregos para outros estados dos EUA ou terceirizados no exterior, prioridade dada à velocidade em detrimento da qualidade, engenharia ignorada e salários desatualizados.", "titulo_pt": "Profunda desconfiança em relação aos líderes da Boeing persiste, diz sindicato", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 118361, "titulo": "Fundo pede arbitragem para evitar oferta pública de ações de mais de R$ 6 bilhões da Oncoclínicas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/fundo-pede-arbitragem-para-evitar-ofera-publica-de-acoes-de-mais-de-r-6-bilhoes-da-oncoclinicas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-22T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O fundo Josephina 3, gerenciado pela Centaurus Capital, apresentou um pedido de arbitragem contra a gestora Latache na B3. O objetivo é evitar uma oferta pública de ações da Oncoclínicas com valor superior a R$ 6 bilhões.", "titulo_pt": "Fundo pede arbitragem para evitar oferta pública de ações da Oncoclínicas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 118362, "titulo": "Por que profissionais de investimentos costumam errar mais do que eu?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/08/por-que-profissionais-de-investimentos-costumam-errar-mais-do-que-eu.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-22T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Profissionais de investimentos tendem a receber críticas diferentes quando recomendam investimentos que não rendem bem. Quando os clientes escolhem investimentos que não dão resultados, as explicações são geralmente mais positivas. No entanto, quando os profissionais recomendam os mesmos investimentos, as conversas tendem a ser mais críticas e focadas em encontrar alternativas.", "titulo_pt": "Por que profissionais de investimentos são criticados mais quando recomendam investimentos que não rendem?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 118523, "titulo": "Los subsidios energéticos saltaron en invierno y el Gobierno apuesta a una baja para cumplir la meta", "url": "https://www.clarin.com/economia/subsidios-energeticos-saltaron-invierno-gobierno-apuesta-baja-cumplir-meta_0_X5WN7zm1rF.html", "fonte_id": "clarin", "data_pub": "2026-08-22T20:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os subsídios energéticos alcançaram o maior desembolso mensal desde 2026 em julho, devido ao aumento do custo da eletricidade no inverno. O governo projeta reduzir essas despesas e mantém como meta inegociável a redução de 0,56% do PIB.", "titulo_pt": "Subsídios energéticos atingiram recorde em julho e governo projeta redução para cumprir meta", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 118492, "titulo": "Zel NN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 117947, "titulo": "“A Odisseia” se torna o filme classificado para adultos de maior bilheteria mundial", "url": "https://www.infomoney.com.br/business/a-odisseia-se-torna-o-filme-classificado-para-adultos-de-maior-bilheteria-mundial/", "fonte_id": "infomoney", "data_pub": "2026-08-22T16:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O filme 'A Odisseia', classificado para adultos, se tornou o filme de maior bilheteria mundial até o momento. Antes, o recorde estava com o filme Deadpool & Wolverine, lançado em 2024.", "titulo_pt": "A Odisseia se torna o filme para adultos de maior bilheteria mundial", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 118039, "titulo": "Tiene 40 años: quién es el empresario que convenció a Sigman a invertir US$20 millones y busca revolucionar la construcción con un material de lujo", "url": "https://www.lanacion.com.ar/economia/campo/tiene-40-anos-quien-es-el-empresario-que-convencio-a-sigman-a-invertir-us20-millones-y-busca-nid22082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-22T16:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Pablo Baldoma convenceu a Insud a entrar na produção de painéis resistentes, muito utilizados ao ar livre. Ele valoriza a madeira como material de luxo com potencial para revolucionar a construção.", "titulo_pt": "Tem 40 anos: quem é o empresário que convenceu a insud a investir US$20 milhões e busca revolucionar a construção com um material de luxo", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 118042, "titulo": "El mejor precio en un año: se aceleraron las ventas de soja y todavía quedan US$11.000 millones en grano por comercializar", "url": "https://www.lanacion.com.ar/economia/campo/el-mejor-precio-en-un-ano-se-aceleraron-las-ventas-de-soja-y-todavia-quedan-us11000-millones-en-nid21082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-22T16:17:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As vendas de soja aceleraram em apenas três dias, duplicando o ritmo diário do mercado. O movimento também afetou o comércio de milho, e ainda há US$ 11 bilhões em grãos por comercializar.", "titulo_pt": "Melhor preço do ano: vendas de soja se aceleraram e ainda há US$ 11 bilhões em grãos por comercializar", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 118482, "titulo": "O futuro chegou: ITMOS e a hora de o Brasil monetizar sua transformação ecológica", "url": "https://exame.com/esg/o-futuro-chegou-itmos-e-a-hora-de-o-brasil-monetizar-sua-transformacao-ecologica/", "fonte_id": "exame", "data_pub": "2026-08-22T16:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil possui ativos ambientais que países desenvolvidos buscam adquirir. No entanto, enquanto Gana, Tailândia e Quênia já monetizam suas reduções de emissões, o Brasil ainda debate como autorizar essas ações. A combinação dos Artigos 6.2 e 6.4 do Acordo de Paris pode ser uma solução para financiar a transformação ecológica.", "titulo_pt": "O futuro chegou: ITMOS e a hora de o Brasil monetizar sua transformação ecológica", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 118671, "titulo": "Nvidia customers notified of AI-related price rises above 15%", "url": "https://www.scmp.com/tech/big-tech/article/3364945/nvidia-customers-notified-ai-related-price-rises-above-15?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-22T21:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alguns dos principais clientes da Nvidia foram informados de que os preços de servidores que contêm seus chips de inteligência artificial aumentarão em mais de 15% em muitos casos, devido ao aumento dos custos de chips de memória. O aumento entrará em vigor nas sistemas enviados no início do próximo ano e afetará servidores com os chips flagship Vera Rubin e Grace Blackwell.", "titulo_pt": "Nvidia avisa clientes sobre aumento superior a 15% nos preços de servidores com chips de IA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 118679, "titulo": "Harvard’s $699 startup bootcamp offers AI avatars of its instructors", "url": "https://techcrunch.com/2026/08/22/harvards-699-startup-bootcamp-offers-ai-avatars-of-its-instructors/", "fonte_id": "techcrunch", "data_pub": "2026-08-22T21:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O programa de empreendedorismo da Harvard Business School (HBS) Foundry oferece avatares de inteligência artificial (IA) dos instrutores para fornecer feedback durante as apresentações de prática e reuniões do conselho de administração.", "titulo_pt": "Harvard’s startup bootcamp oferece avatares de IA dos instrutores", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 118496, "titulo": "10 melhores adaptações de games para ver na Netflix antes do evento de GTA 6", "url": "https://canaltech.com.br/entretenimento/melhores-adaptacoes-games-na-netflix/", "fonte_id": "canaltech", "data_pub": "2026-08-22T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Rockstar Games anunciou que irá revelar novidades de GTA 6 na Netflix em 27 de agosto. A Netflix oferece um catálogo robusto de produções, incluindo adaptações de videogames.", "titulo_pt": "10 Melhores adaptações de games para ver na Netflix antes do evento de GTA 6", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 118504, "titulo": "OpenAI muda posição e pede reforço em lei de segurança de IA", "url": "https://olhardigital.com.br/2026/08/22/inteligencia-artificial/openai-muda-posicao-e-pede-reforco-em-lei-de-seguranca-de-ia/", "fonte_id": "olhar_digital", "data_pub": "2026-08-22T20:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OpenAI alterou sua posição sobre as regras de IA na Califórnia e agora está solicitando mais monitoramento e segurança para modelos avançados de IA. A empresa pede um reforço nas leis atuais para garantir maior segurança e controle.", "titulo_pt": "Openai altera posição e pede reforço em lei de segurança de IA na califórnia", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 118644, "titulo": "Nvidia customers reportedly warned about AI-related price hikes", "url": "https://www.cnbc.com/2026/08/22/nvidia-customers-reportedly-warned-about-ai-related-price-hikes-.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-22T20:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia teria informado alguns de seus maiores clientes que os preços de servidores que contêm suas placas de inteligência artificial podem aumentar mais do que 15%. De acordo com relatos da Bloomberg.", "titulo_pt": "Nvidia alerta clientes sobre aumentos de preços relacionados à IA", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 118680, "titulo": "Will the DOJ’s investigation into a16z spook other VCs?", "url": "https://techcrunch.com/2026/08/22/will-the-dojs-investigation-into-a16z-spook-other-vcs/", "fonte_id": "techcrunch", "data_pub": "2026-08-22T20:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Equity discute por que o Departamento de Justiça (DOJ) está investigando as cadeiras de conselheiros de startups. O programa questiona se essa investigação pode assustar outros investidores-anjo (VCs).", "titulo_pt": "A investigação do DOJ sobre cadeiras de conselheiros de startups assusta outros investidores?", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 118505, "titulo": "Nvidia sobe preços de servidores de IA por alta da memória", "url": "https://olhardigital.com.br/2026/08/22/pro/nvidia-sobe-precos-de-servidores-de-ia-por-alta-da-memoria/", "fonte_id": "olhar_digital", "data_pub": "2026-08-22T20:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": " tech.com.br/inteligencia-artificial/o-que-e-muse-spark-aprenda-usar-nova-ia-meta/", "fonte_id": "canaltech", "data_pub": "2026-08-22T19:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Muse Spark é um modelo de inteligência artificial desenvolvido pela Meta para ser integrado em diversos produtos da empresa, como WhatsApp, Instagram, Messenger e Threads, além dos óculos inteligentes. A tecnologia foi criada com foco em velocidade, raciocínio e compreensão de diferentes tipos de conteúdo, como textos e imagens, com a finalidade de tornar a Meta AI mais útil no dia a dia dos usuários.", "titulo_pt": "O que é o Muse Spark? Entenda a nova IA da Meta", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 118507, "titulo": "Salve a galáxia, sobreviva ao apocalipse e explore o continente: uma seleção de jogos Xbox em promoção", "url": "https://olhardigital.com.br/2026/08/22/reviews/salve-a-galaxia-sobreviva-ao-apocalipse-e-explore-o-continente-uma-selecao-de-jogos-xbox-em-promocao/", "fonte_id": "olhar_digital", "data_pub": "2026-08-22T19:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A seleção inclui três jogos Xbox em oferta na Amazon, variando de aventura espacial a survival cooperativo e RPG de mundo aberto. Os títulos são recomendados para quem ainda não experimentou alguns dos jogos mais aclamados recentemente.", "titulo_pt": "Salve a galáxia, sobreviva ao apocalipse e explore o continente: uma seleção de jogos Xbox em promoção", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 118499, "titulo": "Sem GPU dedicada? Sem problemas! 15 jogos para rodar em PC fraco", "url": "https://canaltech.com.br/games/melhores-jogos-para-rodar-pc-fraco-sem-placa-de-video/", "fonte_id": "canaltech", "data_pub": "2026-08-22T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto sugere que, mesmo sem uma placa de vídeo dedicada, é possível jogar muitos títulos, especialmente jogos menos e % das emissões de gases de efeito estufa, o que tem motivado a busca por métodos mais sustentáveis de produção.", "titulo_pt": "Modelos computacionais identificam catalisadores para substituir a produção de amônia fósil", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 118491, "titulo": "Terremoto de magnitude 5,9 sacode leste do Japão; não há alerta de tsunami", "url": "https://www.infomoney.com.br/mundo/terremoto-de-magnitude-59-sacode-leste-do-japao-nao-ha-alerta-de-tsunami/", "fonte_id": "infomoney", "data_pub": "2026-08-22T20:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um terremoto de magnitude 5,9 sacudiu o leste do Japão, mas não há alerta de tsunami. A TV pública NHK mostrou o tráfego nas estradas próximas, incluindo Mito e Saitama, aparentemente normal.", "titulo_pt": "Terremoto de magnitude 5,9 sacode leste do Japão; não há alerta de tsunami", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 118465, "titulo": "Câncer de pulmão deixa de ser “sentença de morte” com novos tratamentos", "url": "https://www.cnnbrasil.com.br/saude/cancer-de-pulmao-deixa-de-ser-sentenca-de-morte-com-novos-tratamentos/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-22T20:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Segundo o relatório Cancer Statistics 2026, do American Cancer Society, o câncer de pulmão deixou de ser considerado uma sentença de morte devido a novos tratamentos. O médico-oncologista Luiz Henrique Araújo, diretor regional da Oncologia, explica os avanços nessa área.", "titulo_pt": "Câncer de pulmão deixa de ser ‘sentença de morte’ com novos tratamentos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 118357, "titulo": "A Terra está passando por um período de maior atividade sísmica?", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/a-terra-esta-passando-por-um-periodo-de-maior-atividade-sismica.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-22T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nos últimos meses, foram registrados vários terremotos de grande magnitude em diferentes regiões do mundo, incluindo dois terremotos de magnitude 7,2 e 7,5 na Venezuela em 24 de junho. Esses eventos sismológicos têm ocorrido com intervalos curtos de tempo.", "titulo_pt": "A Terra está passando por um período de maior atividade sísmica?", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 118683, "titulo": "The dynamic duo: 'Weaving' hierarchical DNA materials with two classes of biomolecular nanomachines", "url": "https://phys.org/news/2026-08-dynamic-duo-hierarchical-dna-materials.html", "fonte_id": "phys_org", "data_pub": "2026-08-22T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Biomoléculas nanomáquinas, como enzimas e motores moleculares, são responsáveis pela síntese e organização de materiais complexos na vida. Eles construem, transportam e organizam biomoléculas, permitindo que os sistemas vivos criem e mantenham estruturas altamente ordenadas longe do equilíbrio termodinâmico.", "titulo_pt": "O duo dinâmico: 'tejiendo' materiais hierárquicos de DNA com duas classes de nanomáquinas biomoleculares", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 118308, "titulo": "Mars Curiosity rover discovers massive field of polygons", "url": "https://phys.org/news/2026-08-mars-curiosity-rover-massive-field.html", "fonte_id": "phys_org", "data_pub": "2026-08-22T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O rover Curiosity da NASA descobriu um campo extenso de polígonos na superfície de Marte. A superfície do planeta vermelho carece de processos de renovação da superfície encontrados na Terra, como tectonicidade placa, vulcanismo e água líquida em movimento.", "titulo_pt": "Curiosity da nasa descobre vasto campo de polígonos em marte", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 118309, "titulo": "AI mapping reveals hidden stage of Arctic freeze with climate implications", "url": "https://phys.org/news/2026-08-ai-reveals-hidden-stage-arctic.html", "fonte_id": "phys_org", "data_pub": "2026-08-22T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A fase chamada de 'curtina zero' no Ártico, onde o solo permanece próximo ao ponto de congelamento por dias ou semanas, foi mapeada com alta resolução em um novo estudo liderado pela NASA. Esses mapas revelam um estágio oculto do congelamento no Ártico com implicações climáticas.", "titulo_pt": "Mapeamento de inteligência artificial revela estágio oculto do congelamento no ártico com implicações climáticas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 118038, "titulo": "Por qué un equipo de científicos pidió extraer 3500 corales de Florida y trasladarlos al norte: “Están en peligro”", "url": "https://www.lanacion.com.ar/ciencia/por-que-un-equipo-de-cientificos-pidio-extraer-3500-corales-de-florida-y-trasladarlos-al-norte-estan-nid22082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-22T16:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um grupo de cientistas planeja remover 3500 corais de Florida e transferi-los para o norte em uma estratégia para proteger essas espécies da elevação da temperatura marinha. Os corais estão em risco devido ao aquecimento das águas.", "titulo_pt": "Por que um time de cientistas moveu 3500 corais de Florida para o norte: 'estão em perigo'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 118025, "titulo": "Descubren por qué los hombres tienen el doble de probabilidades de contraer tuberculosis que las mujeres", "url": "https://www.clarin.com/internacional/descubren-hombres-doble-probabilidades-contraer-tuberculosis-mujeres_0_RSbdkTJK67.html", "fonte_id": "clarin", "data_pub": "2026-08-22T16:22:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo global descobriu que os homens têm o dobro de chances de contrair tuberculose em comparação com as mulheres, mas isso não está relacionado a diferenças biológicas. O verdadeiro motivo para essa diferença ainda não foi identificado.", "titulo_pt": "Por que os homens têm o dobro de chances de contrair tuberculose que as mulheres?", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 118310, "titulo": "Heat wave-hit Europe logs over 30,000 excess summer deaths: First figures", "url": "https://phys.org/news/2026-08-europe-excess-summer-deaths-figures.html", "fonte_id": "phys_org", "data_pub": "2026-08-22T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Europa registrou mais de 30.000 mortes excessivas durante o verão, influenciado por uma série de ondas de calor consecutivas e seca, que os cientistas atribuíram ao aquecimento global causado pelo homem.", "titulo_pt": "Europa registra mais de 30.000 mortes excessivas no verão devido a ondas de calor e seca", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 118323, "titulo": "How will NASA's astronaut training hub change with commercial space stations?", "url": "https://www.space.com/space-exploration/international-space-station/how-will-nasas-astronaut-training-hub-change-with-commercial-space-stations", "fonte_id": "space_com", "data_pub": "2026-08-22T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A visita à Johnson Space Center em Houston demonstra como NASA e indústria privada já colaboram no futuro dos voos espaciais humanos. O hub de treinamento de astronautas da NASA está se adaptando para trabalhar com estações espaciais comerciais futuras.", "titulo_pt": "Como o hub de treinamento de astronautas da NASA vai mudar com as estações espaciais comerciais?", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 118311, "titulo": "AI decodes DNA initiator sequence found in about 60% of human genes", "url": "https://phys.org/news/2026-08-ai-decodes-dna-sequence-human.html", "fonte_id": "phys_org", "data_pub": "2026-08-22T15:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A precisão na ativação de dezenas de milhares de genes é crucial para o desenvolvimento e crescimento saudáveis. Seções específicas do DNA desempenham um papel importante na regulação dos genes que resultam na produção de enzimas, hormônios, proteínos e outros componentes essenciais para a estrutura e função celular.", "titulo_pt": "IA decodifica sequência DNA que inicia a ativação de aproximadamente 60% dos genes humanos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 118312, "titulo": "Arctic shipping a daunting prospect in hotly contested region", "url": "https://phys.org/news/2026-08-arctic-shipping-daunting-prospect-hotly.html", "fonte_id": "phys_org", "data_pub": "2026-08-22T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A instabilidade no Golfo está reduzindo o tráfego no Canal de Suez, levando as empresas de navegação a considerar o Ártico como uma alternativa para viagens mais rápidas entre a Europa e a Ásia, embora as perspectivas comerciais não estejam alinhadas com as aspirações estratégicas dos países em relação ao Polo Norte.", "titulo_pt": "Marítimo no ártico: uma proposta tentadora, mas com limitadas perspectivas comerciais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 118313, "titulo": "Thawing Arctic riverbeds may erode up to 10 times faster than unfrozen ground", "url": "https://phys.org/news/2026-08-arctic-riverbeds-erode-faster-unfrozen.html", "fonte_id": "phys_org", "data_pub": "2026-08-22T15:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa mostrou que os leitos de rios no Ártico estão erosionando até 10 vezes mais rápido do que o solo não congelado, algo inesperado para os pesquisadores.", "titulo_pt": "Leitos de rios no ártico podem erodir até 10 vezes mais rápido que o s -con-certificados-de-antecedentes/", "fonte_id": "la_tercera", "data_pub": "2026-08-22T18:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "David Antoine, porta-voz da Comunidade Haitiana em Chile, disse que a Ser mig e o governo estão pressionando os haitianos a obterem certificados de antecedentes, mas que a embaixada haitiana não tem capacidade para fornecê-los. Os haitianos estão enfrentando dificuldades para regularizar seus documentos.", "titulo_pt": "Protesto na embaixada de haiti: porta-voz da comunidade aponta dificuldades para obter certificados de antecedentes", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 118597, "titulo": "Seventeen-year-old girl killed in sword attack at school in Sweden", "url": "https://www.theguardian.com/world/2026/aug/22/seventeen-year-old-girl-killed-in-sword-attack-at-school-in-sweden", "fonte_id": "guardian_world", "data_pub": "2026-08-22T18:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma adolescente de 17 anos foi morta e três outras pessoas, incluindo dois garotos de 12 e 17 anos, ficaram feridas após um jovem de 18 anos com uma espada atacar estudantes em uma escola da cidade sueca de Fagersta.", "titulo_pt": "Menina de 17 anos morta em ataque com espada em escola da suécia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 118090, "titulo": "Investigan homicidio de hombre de 35 años tras ataque a balazos contra domicilio en Coquimbo", "url": "https://www.latercera.com/nacional/noticia/investigan-homicidio-de-hombre-de-35-anos-tras-ataque-a-balazos-contra-domicilio-en-coquimbo/", "fonte_id": "la_tercera", "data_pub": "2026-08-22T17:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um homem de 35 anos foi morto a tiros durante a madrugada em um imóvel familiar na região de Punta Mira, Coquimbo. A Polícia Civil está investigando o caso para identificar os suspeitos.", "titulo_pt": "Investigação sobre morte de homem de 35 anos após ataque a tiros em domicílio em Coquimbo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 117883, "titulo": "Corregedoria prende policial suspeito de sequestro com falsa viatura em SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/corregedoria-prende-policial-suspeito-de-sequestro-com-falsa-viatura-em-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-22T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um policial foi preso após uma ação policial que cumpriu mandados de busca e prisão temporária em cinco municípios de São Paulo relacionados a um sequestro cometido em agosto. A prisão ocorreu com a utilização de uma viatura falsa.", "titulo_pt": "Corregedoria prende policial suspeito de sequestro com viatura falsa em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 117843, "titulo": "Carros-bomba e barricadas explosivas: entenda as novas armadilhas do tráfico", "url": "https://veja.abril.com.br/brasil/carros-bomba-e-barricadas-explosivas-entenda-as-novas-armadilhas-do-trafico/", "fonte_id": "veja", "data_pub": "2026-08-22T17:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Artefatos explosivos encontrados pela PM do Rio no Complexo de Israel podiam ser acionados por controle remoto. Essas novas armadilhas do tráfico incluem carros-bomba e barricadas explosivas.", "titulo_pt": "Carros-bomba e barricadas explosivas: entenda as novas armadilhas do tráfico", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 117888, "titulo": "Veterinária atacada por cão do Senado morre após quatro dias internada", "url": "https://www.cnnbrasil.com.br/politica/veterinaria-atacada-por-cao-do-senado-morte-apos-quatro-dias-internada/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-22T17:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A veterinária Vitória Valle de Oliveira Pinha, que trabalhava como tratadora de animais terceirizada no Serviço de Cin
