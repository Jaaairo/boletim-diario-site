<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

um referendo simbólico para sair do Reino Unido, em protesto contra a política de acolhimento de refugiados. Na Ucrânia, pelo menos 14 pessoas estão desaparecidas após um drone russo atingir um prédio residencial em Kiev. Na América do Sul, o presidente uruguaio solicitou à Real Academia Espanhola que ampliasse a definição da palavra 'quilombo', diferenciando seu uso no Brasil de outros países. No Japão, o governo considera incluir químicos orgânicos em uma lista de produtos críticos. Em um evento histórico, os presidentes dos Estados Unidos, da China e da Rússia se reuniram em Shenzhen, remetendo a um encontro histórico de 1945, criando um paralelo surpreendente. Durante seu discurso no Fórum CEO da APEC, o presidente Xi Jinping, citou uma expressão chinesa para enfatizar a importância de adaptar esforços aos tempos atuais.\n\nO Irã realizou ataques contra instalações militares americanas em Bahrain, enquanto o Irã e os hutis continuaram seus ataques, mantendo o estado de alerta no Oriente Médio. Em um desenvolvimento geopolítico significativo, a China está prestes a lançar um novo submarino nuclear, o que pode representar um novo desafio diplomático para Pequim na tentativa de obter sua primeira sede na ONU. As tensões entre Israel e o Líbano aumentaram, com o presidente do Líbano pedindo a retirada de Israel do país e condenando a interferência da Irã. Além disso, a Ucrânia enfrenta ataques na ponte de Crimeia, aumentando a pressão sobre um sistema logístico já sobrecarregado. Em outro conflito, a Ucrânia registrou um ataque com drones contra um navio ruso no Mar Báltico, levando a Finlândia a adotar restrições temporárias ao tráfego aéreo e marítimo na região.", "economia": "Os recentes desenvolvimentos na economia global e brasileira têm sido variados e complexos. A decisão do CARF (Conselho Administrativo de Recursos Fiscais) em validar o IRPJ (Imposto sobre a Renda de Pessoas Jurídicas) e CSLL (Contribuição Social sobre o Lucro Líquido) contra a Caixa Econômica Federal em uma operação de incorporação da Cetip pela Bovespa reflete as nuances da tributação corporativa no Brasil. Em contraste, o México tem se destacado como uma alternativa favorita entre os emergentes, enquanto o Brasil enfrenta preocupações com o crescimento econômico, juros e cenário fiscal, como refletido em rebaixamentos de instituições financeiras. O Brasil está buscando expandir sua presença no Sudeste Asiático, apesar de enfrentar barreiras regulatórias e protecionismo. Além disso, o Banco Central do Brasil (Bacen) realiza a pesquisa Focus, coletando previsões dos economistas sobre a inflação e outras variáveis econômicas importantes. Em termos internacionais, a Coreia do Sul enfrenta pressões para implementar tarifas por carbono em importações de eletrodomésticos, enquanto a Argentina enfrenta aumentos nos custos de empréstimos devido à diminuição da popularidade do candidato libertarian Milei. O Brasil também enfrenta desafios logísticos na Foz do Amazonas, onde a Petrobras transporta pessoal e equipamentos com dificuldades. A dívida pública do país não cai por decreto, exigindo medidas fiscais para a realização de metas fiscais. Por fim, o Brasil disputa a liderança na atração de data centers, de acordo com The Economist, investindo em uma matriz elétrica renovável e em um mercado em expansão para atrair investimentos de grandes empresas de tecnologia globais.", "tecnologia": "Um evento significativo mencionado é o hack do Departamento de Agricultura dos EUA e do FBI, relatado pela The Verge e The Japan Times. Essas informações surgem em um momento de crescente preocupação com falhas tecnológicas em instituições americanas importantes. No outro destaque, a Anthropic, empresa de inteligência artificial, realizou a maior oferta pública inicial (IPO) da história, movimentando US$ 93,5 bilhões, mas as ações caíram após a estreia na bolsa, refletindo a cautela dos investidores, conforme relatado pelo Olhar Digital. No campo da tecnologia de computação quântica, empresas estão testando a otimização de redes de energia e materiais solares em busca de usos práticos, como informado pelo CNBC International. Além disso, a Rockstar Games, responsável por Grand Theft Auto, revelou detalhes sobre a criação de Vice City, inspirada em Miami, em uma entrevista para o Digitaltrends. Ainda, a revista The Economist projeta que o Brasil pode se tornar um polo global de data centers devido à presença de energia renovável e cabos submarinos, apesar de problemas na rede elétrica e da disputa entre EUA e China, conforme publicado pela Folha de S. Paulo.", "ciencia": "Um dos eventos mais importantes mencionados nos artigos é a possível resolução da hipótese de Riemann, uma das conjecturas mais famosas da matemática, proposta em 1859 por Bernhard Riemann. Um matemático da Anthropic, Levent Alpöge, em colaboração com o assistente de inteligência artificial Claude, alega ter encontrado uma solução para a hipótese, que permite caracterizar o comportamento dos números primos. No entanto, a validade dessa solução ainda está sendo avaliada e pode levar semanas para ser compreendida completamente. Outros avanços científicos incluem a descoberta de uma nova espécie de réptil com chifres nos Estados Unidos, a observação de uma colisão cósmica pelo telescópio espacial James Webb, que revelou detalhes sobre a fusão de duas estrelas, e a proposta de uma reescrita radical da árvore genealógica humana, sugerindo que espécies como Australopithecus e Paranthropus sejam reclassificadas no gênero Homo. Além disso, a China planeja testar a produção de água ou oxigênio na Lua até 2030, enquanto pesquisas sobre inteligência artificial questionam sua confiabilidade na pesquisa neurocientífica e a reescrita da teoria da evolução de bactérias e levaduras é proposta por estudos recentes.", "cultura": "A cultura global continua a evoluir com diversos eventos e tendências. Primeiramente, a renovação do principal salão da Cidade Real de Shuri, em Okinawa, Japão, após sete anos de incêndio, representa um esforço significativo para preservar a herança arquitetônica local. Em seguida, o Festival República Folklore, que ocorre em São Paulo, foi renovado com a participação de artistas como Soledad Pastorutti e Chaqueño Palavecino, destacando a importância da música popular no cenário cultural brasileiro. No contexto cultural, a renovação do serviço de transporte da Região Metropolitana em 21 de novembro, com todas as estações disponíveis, garante a continuidade do fluxo de pessoas durante os eventos culturais. Outros destinos culturais incluem a mostra 'Milton Santos e Cidadania', que explora o pensamento do geógrafo negro no Rio de Janeiro, e a renovação do Design Museum em Londres, com posters criados por designers renomados, incluindo Jony Ive e Margaret Calvert, celebrando seus 10 anos. Notáveis também são as performances artísticas, como a de Ed Sheeran no Chile, que se destacou pelo seu show ao vivo, e a de Jennifer Lopez e Eddie Vedder em São Paulo, que reuniu fãs de rock e blues. Além disso, a renovação do Festival de Dança Strictly Come Dancing, interrompido por supostos sons sexuais, e a polêmica em torno da série 'O Corpo' da Netflix, criticada por cristãos, refletem os desafios atuais na produção e recepção de conteúdo cultural.", "sociedade": "Milhares de pessoas marcharam por Lisboa, Portugal, no sábado, 21 de novembro de 2026, enfrentando forte chuva para exigir aumentos salariais, melhorias nas aposentadorias e medidas para combater o aumento dos custos de vida. Essa demonstração ocorreu alguns dias antes do voto do orçamento parlamentar em Portugal. Em França, protestos contra o aumento dos custos de vida e serviços públicos ocorreram pela sexta semana consecutiva, com milhares de pessoas nas ruas. Em Tupanciretã, Rio Grande do Sul, um temporal destruiu quase 8 mil casas, deixando 162 feridos, 3 mortos e afetando 99% dos moradores. O número de mortos subiu para cinco no total. O ex-presidente Jair Bolsonaro, internado na UTI com um novo quadro de abdômen agudo obstrutivo, permanece sem previsão de alta. Em Tucumán, a Olimpíada de Filosofia corre risco de não ocorrer devido à falta de fundos. Na Virgínia, EUA, uma criança de 0 a 4 anos morreu de sarampo, elevando o número de óbitos no estado em 2026 para 12. Um homem sobreviveu após ter uma faca cravada na nuca em Machado, Minas Gerais, e foi submetido a um procedimento cirúrgico. Um policial civil aposentado foi preso suspeito de matar a vítima, de 36 anos, em frente a um bar em Contagem. O governo da Queensland, Austrália, enfrenta críticas por um sistema de saúde que está sendo questionado sobre a responsabilidade pelas mortes evitáveis. Um homem teve uma faca atravessada no pescoço, mas sobreviveu a uma cirurgia bem-sucedida.", "meio_ambiente": "O evento mais importante dos artigos é a COP31, que está enfrentando dificuldades para chegar a um consenso sobre combustíveis fósseis. As negociações, que deveriam ter terminado no prazo oficial, ainda não chegaram a um acordo, com representantes de 130 países ausentes e os sauditas em posição contrária. O conflito sobre a transição das energias fósseis para energias renováveis persiste, com várias nações, incluindo França e Panamá, reiterando a necessidade de um acordo que inclua uma transição clara e firme. O Brasil e Argentina discutem as ações já implementadas, como a adoção de uma gasolina com 30% de etanol a partir de agosto de 2025, mas a demora na atualização da legislação no Brasil resulta em prejuízos para a sociedade. Além disso, a falta de resolução sobre combustíveis fósseis aumenta o risco de fracasso das negociações, com a plenária agendada para apresentar a versão final do texto às 9h no domingo em Belém.", "direitos_humanos": "Os direitos humanos continuam sendo ameaçados em vários lugares do mundo, conforme evidenciado por diversos eventos recentes. Na França, houve controvérsias relacionadas à violência policial, com três policiais condenados por um ataque racista contra um produtor musical negro, Michel Zecler. Além disso, o Senado francês aprovou uma lei que concede um benefício de dúvida aos policiais em casos de mortes por disparos, o que levanta preocupações sobre a possibilidade de impunidade. Na Nicarágua, os cidadãos enfrentam dificuldades para retornar ao país, refletindo a repressão política e social. Na Cisjordânia, ocupada, a violência dos colonos aumenta devido à impunidade, enquanto a França investiga policiais por violência contra manifestantes, incluindo supostas agressões sexuais. Em um caso no Brasil, uma empresa foi condenada por racismo após um auxiliar de limpeza sofrer ofensas comparando negros a macacos. Por fim, a situação humanitária no Afeganistão se agrava devido às políticas do Taliban e à falta de financiamento, com as crianças sendo as primeiras vítimas. A Agência de Imigração dos Estados Unidos (ICE) expandiu suas operações em Texas, estendendo sua colaboração com condados. Esses eventos demonstram a necessidade contínua de proteção e defesa dos direitos humanos em diversos contextos globais."}, "resumo_do_dia": {"politica_nacional": [{"id": 280011, "titulo": "Lei amplia penas para abandono e maus-tratos contra idosos", "url": "https://www.poder360.com.br/poder-congresso/lei-amplia-penas-para-abandono-e-maus-tratos-contra-idosos/", "fonte_id": "poder360", "data_pub": "2026-11-22T09:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A lei sancionada em 2025 aumentou as penas para abandono, maus-tratos e exposição de idosos a situações perigosas. O objetivo é endurecer as medidas contra esses crimes.", "titulo_pt": "Lei endurece penas para abandono, maus-tratos e exposição de idosos a situações de perigo", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 280012, "titulo": "CAS aprova cordão de identificação para pessoas com Parkinson", "url": "https://www.poder360.com.br/poder-congresso/cas-aprova-cordao-de-identificacao-para-pessoas-com-parkinson/", "fonte_id": "poder360", "data_pub": "2026-11-22T09:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho Administrativo de Serviços (CAS) aprovou um projeto que cria um acessório opcional com desenhos de tulipas vermelhas para facilitar a identificação e o atendimento de pessoas com Parkinson.", "titulo_pt": "CAS aprova cordão de identificação para pessoas com Parkinson", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 280013, "titulo": "Dino reacende debate sobre imunidade parlamentar no caso van Hattem", "url": "https://www.poder360.com.br/poder-justica/dino-reacende-debate-sobre-imunidade-parlamentar-no-caso-van-hattem/", "fonte_id": "poder360", "data_pub": "2026-11-22T09:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro votou a favor da acolhida da denúncia da Procuradoria-Geral da República contra o deputado por calúnia e injúria; Moraes seguiu a decisão e Zanin pediu destaque no processo.", "titulo_pt": "Dino reaviva debate sobre imunidade parlamentar no caso van Hattem", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 279982, "titulo": "Senadoras articulam resolução para punir violência política de gênero com perda de mandato", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/senadoras-articulam-resolucao-para-punir-violencia-politica-de-genero-com-perda-de-mandato.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-22T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Senadoras Leany Lemos (PSB-DF) e Eliziane Gama (PT-MA) estão articulando a aprovação de um projeto de resolução que prevê a perda de mandato para senadores que cometerem violência política de gênero e raça contra colegas de parlamento.", "titulo_pt": "Senadoras buscam punir violência política de gênero com perda de mandato", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 280014, "titulo": "Grokipedia tem erros, mas pode ensinar à Wikipédia, diz autor", "url": "https://www.poder360.com.br/nieman/grokipedia-tem-erros-mas-pode-ensinar-a-wikipedia-diz-autor/", "fonte_id": "poder360", "data_pub": "2026-11-22T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um jornalista identificou 32 erros em sua biografia na Grokipedia, uma enciclopédia criada por Elon Musk. O autor defende o uso de inteligência artificial com supervisão humana.", "titulo_pt": "Grokipedia tem erros, mas pode ensinar à Wikipédia, diz jornalista", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 280015, "titulo": "Moraes concentra 44% dos processos criminais do Supremo", "url": "https://www.poder360.com.br/poder-justica/moraes-concentra-44-dos-processos-criminais-do-supremo/", "fonte_id": "poder360", "data_pub": "2026-11-22T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Supremo Tribunal Federal (STF) Alexandre Moraes está responsável por 44% dos processos criminais no tribunal. Este volume de casos demonstra a concentração das decisões em suas mãos, mesmo após o término do inquérito das fake news.", "titulo_pt": "Moraes concentra 44% dos processos criminais do Supremo", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 280016, "titulo": "Comissão do Senado aprova acesso a alívio da dor no parto", "url": "https://www.poder360.com.br/poder-congresso/comissao-do-senado-aprova-acesso-a-alivio-da-dor-no-parto/", "fonte_id": "poder360", "data_pub": "2026-11-22T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A comissão do Senado aprovou um texto que assegura às gestantes informações sobre métodos de alívio da dor durante o parto e prevê ampliar a oferta desses serviços pelo Sistema Único de Saúde (SUS).", "titulo_pt": "Comissão do Senado aprova acesso a alívio da dor no parto", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 280031, "titulo": "A defesa e os bolsonaristas", "url": "https://www.metropoles.com/blog-do-noblat/enquetes/a-defesa-e-os-bolsonaristas", "fonte_id": "metropoles", "data_pub": "2026-11-22T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A enquete se refere à defesa e aos bolsonaristas. O texto original não fornece detalhes adicionais sobre a enquete.", "titulo_pt": "A defesa e os bolsonaristas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 280049, "titulo": "Câmara abre semana com previsão de votação do ajuste fiscal e negociações sobre Orçamento", "url": "https://www.brasildefato.com.br/2026/11/22/camara-abre-semana-com-previsao-de-votacao-do-ajuste-fiscal-e-negociacoes-sobre-orcamento/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-22T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara dos Deputados planeja votar na segunda-feira (23) o pacote de ajuste fiscal aprovado pelo Senado. O presidente da Casa, Hugo Motta, convocou uma sessão extraordinária para discutir o Projeto de Lei Complementar (PLP) 299/2026, que inclui medidas de contenção de despesas e aumento da arrecadação.", "titulo_pt": "Câmara inicia semana com votação do ajuste fiscal e negociações sobre Orçamento", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 280091, "titulo": "As urnas falaram. E agora?", "url": "https://www.jota.info/opiniao-e-analise/artigos/as-urnas-falaram-e-agora", "fonte_id": "jota", "data_pub": "2026-11-22T08:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Foi uma vitória eleitoral clara e histórica, mas é importante não confundir essa vitória com uma opinião social unânime. A frase destaca a necessidade de considerar a diversidade de opiniões na sociedade após uma eleição.", "titulo_pt": "As urnas falaram. E agora?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 280092, "titulo": "Impugnação administrativa não interrompe prescrição para repetição de indébito", "url": "https://www.jota.info/opiniao-e-analise/artigos/impugnacao-administrativa-nao-interrompe-prescricao-para-repeticao-de-indebito", "fonte_id": "jota", "data_pub": "2026-11-22T08:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A impugnação administrativa não interrompe a prescrição para repetição de indébito. No caso do IRPF, a jurisprudência estabelece que o marco inicial para a contagem do prazo prescricional é a entrega da declaração de ajuste anual.", "titulo_pt": "Impugnação administrativa não interrompe prescrição para repetição de indébito", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 280032, "titulo": "CPI do Master vira omissão dupla do Congresso e do STF", "url": "https://www.metropoles.com/colunas/igor-gadelha/cpi-do-master-vira-omissao-dupla-do-congresso-e-do-stf", "fonte_id": "metropoles", "data_pub": "2026-11-22T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Congresso Nacional não avançou com a CPI do Master enquanto o presidente da Câmara, Davi Alcolumbre, mantém a proposta emcheck. Além disso, o Supremo Tribunal Federal (STF) não se manifestou sobre o direito da minoria para abrir uma comissão de inquérito.", "titulo_pt": "CPI do Master se torna omissão do Congresso e do STF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 280035, "titulo": "As estratégias que levaram à virada de Raquel Lyra sobre João Campos", "url": "https://www.metropoles.com/colunas/vinicius-passarelli/as-estrategias-que-levaram-a-virada-de-raquel-lyra-sobre-joao-campos", "fonte_id": "metropoles", "data_pub": "2026-11-22T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A estratégia focou em humanizar Raquel Lyra e criar o conceito de 'pernambuquismo' para apresentar a eleição como um tema estadual. Isso buscou fortalecer a candidatura de Raquel Lyra em relação a João Campos.", "titulo_pt": "As estratégias que levaram à virada de Raquel Lyra sobre João Campos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 280036, "titulo": "Alcolumbre insiste em Pacheco para vaga no STF e espera reunião com Lula", "url": "https://www.metropoles.com/brasil/alcolumbre-insiste-em-pacheco-para-vaga-no-stf-e-espera-reuniao-com-lula", "fonte_id": "metropoles", "data_pub": "2026-11-22T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Senado, Alcolumbre, insiste na indicação de Pacheco para uma vaga no STF. Além disso, Alcolumbre busca uma reunião com Lula para discutir espaço no novo governo e menciona apoio a medidas do Planalto para justificar sua busca por maior participação.", "titulo_pt": "Alcolumbre persiste na indicação de Pacheco para STF e aguarda encontro com Lula", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 280065, "titulo": "Há um ano, Bolsonaro era preso preventivamente após violar tornozeleira", "url": "https://www.cnnbrasil.com.br/politica/ha-um-ano-bolsonaro-era-preso-preventivamente-apos-violar-tornozeleira/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-22T07:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em novembro de 2025, o ex-presidente Bolsonaro tentou abrir sua tornozeleira usando um ferro de solda, o que levou ao decreto de prisão preventiva por parte do ministro Moraes devido ao risco de fuga. Como resultado, ele foi transferido para a Superintendência da PF em Brasília.", "titulo_pt": "Há um ano, Bolsonaro era preso preventivamente após tentar abrir tornozeleira", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 279983, "titulo": "Documentos da PF acirram disputa no STF sobre relatoria do caso Master", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/documentos-da-pf-acirram-disputa-no-stf-sobre-relatoria-do-caso-master.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-22T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os documentos da Polícia Federal foram enviados à Procuradoria-Geral da República e abriram uma nova disputa no Supremo Tribunal Federal sobre quem será o relator do caso Banco Master. Essa seleção de relatórios contém menções a ministros do STF.", "titulo_pt": "Documentos da PF intensificam disputa no STF sobre relatoria do caso Master", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 280299, "titulo": "Tracking site says Iranian tanker reportedly sailing through Strait of Hormuz does not exist", "url": "https://www.euronews.com/2026/11/22/tracking-site-says-iranian-tanker-reportedly-sailing-through-strait-of-hormuz-does-not-exi", "fonte_id": "euronews", "data_pub": "2026-11-22T09:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O US Navy anunciou que o bloqueio naval contra a Irã durou 130 dias consecutivos. De acordo com as autoridades americanas, essa medida visa impedir a exportação de bilhões de dólares em petróleo pelo Corpo de Guardas Revolucionários Islâmicos.", "titulo_pt": "Site de rastreamento afirma que navio iraniano supostamente navegando pelo estreito de Ormuz não existe", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 280279, "titulo": "Europe sees new protests over rising costs, inequality and public services", "url": "https://www.france24.com/en/europe-sees-new-protests-over-rising-costs-inequality-and-public-services", "fonte_id": "france24", "data_pub": "2026-11-22T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Protestos ocorrem pela terceira dia consecutivo em várias partes da Europa, focando na elevação dos custos de vida e no acesso à habitação acessível. Em França, manifestações se estendem há seis finais de semana seguidos.", "titulo_pt": "Europa assiste a novos protestos sobre custos de vida crescentes, desigualdade e serviços públicos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 280097, "titulo": "Por dentro do  buscam agora a custódia legal dos bebês nascidos de suas gestações. As mulheres buscam proteger os filhos que criaram durante o período de gestação.", "titulo_pt": "Luta das mulheres que gestaram crianças na ‘casa dos horrores’ de Los angeles por guarda legal", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 280180, "titulo": "México asesta otro duro golpe al narco con la captura del Chapo Isidro", "url": "https://elpais.com/mexico/2026-11-22/mexico-asesta-otro-duro-golpe-al-narco-con-la-captura-del-chapo-isidro.html", "fonte_id": "elpais_america", "data_pub": "2026-11-22T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A detenção de Chapo Isidro no estado de Sinaloa fortalece as ações de Sheinbaum na luta contra o crime organizado, após as prisões de Mencho, Jardinero e outros.", "titulo_pt": "México dá outro duro golpe no narco com a captura do Chapo Isidro", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 280181, "titulo": "Las voces del exilio nicaragüense: “Quedarte sin nada es doloroso, pero este calvario tiene fin”", "url": "https://elpais.com/america/2026-11-22/las-voces-del-exilio-nicaraguense-quedarte-sin-nada-es-doloroso-pero-este-calvario-tiene-fin.html", "fonte_id": "elpais_america", "data_pub": "2026-11-22T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Quatro nicaragüenses exilados em Costa Rica, Espanha e México contam as dificuldades de começar de zero e expressam suas esperanças de mudança para o seu país. O título traduzido para português brasileiro é: 'Vozes do exílio nicaraguense: “Ficar sem nada é doloroso, mas este calvário tem fim”'", "titulo_pt": "Vozes do exílio nicaraguense: “ficar sem nada é doloroso, mas este calvário tem fim”", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 280183, "titulo": "Las fotos olvidadas en un cajón que ahora cuentan la historia de Tierra del Fuego", "url": "https://elpais.com/america-futura/2026-11-22/las-fotos-olvidadas-en-un-cajon-que-ahora-cuentan-la-historia-de-tierra-del-fuego.html", "fonte_id": "elpais_america", "data_pub": "2026-11-22T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O projeto Arquivo Fotográfico Fueguino reúne mais de 450 imagens familiares para retratar a vida cotidiana da província mais jovem da Argentina, Tierra del Fuego. Essas fotos, guardadas em um gavete, agora contam a história do local.", "titulo_pt": "As fotos esquecidas em um gavete que agora contam a história de Tierra del Fuego", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 280185, "titulo": "Emmy Rossum, actriz: “Cuando el arte es entretenido y tiene sentido, puede moldear el debate social y hacernos sentir menos solas”", "url": "https://elpais.com/us/entretenimiento/2026-11-22/emmy-rossum-actriz-cuando-el-arte-es-entretenido-y-tiene-sentido-puede-moldear-el-debate-social-y-hacernos-sentir-menos-solas.html", "fonte_id": "elpais_america", "data_pub": "2026-11-22T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Emmy Rossum, atriz, afirma que quando o arte é entretenimento e tem significado, pode moldar debates sociais e nos fazer sentir menos sozinhos. Ela interpreta uma policial em 'Furia', que expõe falhas no sistema de justiça e retrata uma mulher trabalhadora de maneira realista.", "titulo_pt": "Emmy Rossum, atriz: 'quando o arte é entretenimento e tem sentido, pode moldar debates sociais e nos fazer sentir menos sozinhas'", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 280189, "titulo": "Tres generaciones de españoles en el extranjero, divididas por el voto: “Mi abuelo y mi padre votaron en urna, yo en una caja de cartón”", "url": "https://elpais.com/argentina/2026-11-22/tres-generaciones-de-espanoles-en-el-extranjero-divididas-por-el-voto-mi-abuelo-y-mi-padre-votaron-en-urna-yo-en-una-caja-de-carton.html", "fonte_id": "elpais_america", "data_pub": "2026-11-22T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Residentes no exterior criticam a decisão do Supremo Tribunal de diferenciar os votos de cidadãos naturalizados pela 'Ley de nietos' dos demais espanhóis. A carta que anunciou a medida causou indignação e malestar entre a comunidade de expatriados.", "titulo_pt": "Três gerações de espanhóis no exterior divididas pelo voto: 'meu avô e meu pai votaram em urna, eu em uma caixa de papelão'", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 280191, "titulo": "Diez mexicanos quieren decidir cómo morir", "url": "https://elpais.com/mexico/2026-11-22/diez-mexicanos-quieren-decidir-como-morir.html", "fonte_id": "elpais_america", "data_pub": "2026-11-22T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em México, dez pacientes com doenças degenerativas e terminais estão pressionando as autoridades para regular a eutanasia, uma prática atualmente penalizada que força os doentes a lidar com tratamentos exaustivos e buscar alternativas ilegais.", "titulo_pt": "Dez mexicanos querem decidir como morrer", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 280192, "titulo": "Fiorella Ycaza, la esposa del alcalde de Guayaquil que busca vengar políticamente a su marido preso", "url": "https://elpais.com/america/2026-11-22/fiorella-ycaza-la-esposa-del-alcalde-de-guayaquil-que-busca-vengar-politicamente-a-su-marido-preso.html", "fonte_id": "elpais_america", "data_pub": "2026-11-22T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Fiorella Ycaza, esposa do prefeito de Guayaquil, está concorrendo à prefeitura nas eleições de 29 de novembro. Sua candidatura é uma resposta ao governo de Noboa, que ela acusa de perseguir sua família.", "titulo_pt": "Fiorella Ycaza, a esposa do prefeito de Guayaquil que busca vingar políticamente sua família presa", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 280193, "titulo": "De la Espriella se muestra como auditor de su propio Gobierno", "url": "https://elpais.com/america-colombia/2026-11-22/de-la-espriella-se-muestra-como-auditor-de-su-propio-gobierno.html", "fonte_id": "elpais_america", "data_pub": "2026-11-22T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente revoga decisões econômicas propostas por seus ministros, lhe faz advertências através de cartas e demite publicamente funcionários do governo. De la Espriella se mostra como auditor de seu próprio governo.", "titulo_pt": "De la Espriella se mostra como auditor de seu próprio governo", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 280090, "titulo": "Carf valida IRPJ e CSLL contra a Caixa por ganho em troca de ações da Bolsa", "url": "https://www.jota.info/tributos/carf-valida-irpj-e-csll-contra-a-caixa-por-ganho-em-troca-de-acoes-da-bolsa", "fonte_id": "jota", "data_pub": "2026-11-22T09:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Junta Fiscal do Conselho Administrativo de Recursos Fiscais (Carf) validou o Imposto de Renda e Contribuição Social sobre o Lucro Líquido (IRPJ e CSLL) referentes a ganhos da Caixa Econômica Federal em uma operação de incorporação da Cetip pela Bovespa, por meio da Companhia São José Holding, que resultou na criação da B3.", "titulo_pt": "Carf confirma IRPJ e CSLL sobre ganhos na incorporação da cetip pela bovespa", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 280052, "titulo": "Enquanto Brasil perde preferência dos bancões, México ganha espaço entre emergentes", "url": "https://www.infomoney.com.br/mercados/mexico-ganha-espaco-entre-emergentes-enquanto-brasil-perde-preferencia-dos-bancoes/", "fonte_id": "infomoney", "data_pub": "2026-11-22T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Rebaixamentos em série de instituições financeiras refletem preocupações com o crescimento, juros e cenário fiscal do Brasil. O México tem se destacado como uma alternativa favorita entre os emergentes.", "titulo_pt": "Enquanto Brasil perde preferência dos bancões, México ganha espaço entre emergentes", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 280053, "titulo": "Estamos usando as métricas corretas de atendimento ao cliente?", "url": "https://www.infomoney.com.br/business/global/estamos-usando-as-metricas-corretas-de-atendimento-ao-cliente/", "fonte_id": "infomoney", "data_pub": "2026-11-22T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um artigo da Harvard Business Review destaca que algumas chamadas de suporte ao cliente podem exigir mais atenção, discernimento e construção de confiança, sugerindo que as métricas de atendimento ao cliente atualmente usadas podem não ser suficientemente abrangentes.", "titulo_pt": "Estamos usando as métricas corretas para avaliação do atendimento ao cliente?", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 280054, "titulo": "Os custos ocultos de delegar tarefas para a IA", "url": "https://www.infomoney.com.br/business/global/os-custos-ocultos-de-delegar-tarefas-para-a-ia/", "fonte_id": "infomoney", "data_pub": "2026-11-22T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Gestores de empresas em diversos setores estão avaliando a implementação da inteligência artificial (IA) e buscando equilibrar os benefícios com os custos associados. O post original aborda os custos ocultos relacionados à delegação de tarefas para a IA.", "titulo_pt": "Os custos ocultos de delegar tarefas para a IA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 280055, "titulo": "Novo teto do MEI pode gerar economia de R$ 9,5 mil por ano; entenda mudanças", "url": "https://www.infomoney.com.br/minhas-financas/novo-teto-do-mei-pode-gerar-economia-de-r-95-mil-por-ano-entenda-mudancas/", "fonte_id": "infomoney", "data_pub": "2026-11-22T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A lei que aumentou o teto de faturamento para o Microempreendedor Individual (MEI) para R$ 110 mil em 2027 e R$ 140 mil em 2028 pode resultar em economias tributárias de até R$ 9,5 mil por ano para os empreendedores.", "titulo_pt": "Novo teto do MEI pode gerar economia de R$ 9,5 mil por ano; entenda as mudanças", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 280218, "titulo": "Highly lucrative: Bank of England directors illegally profited from post-abolition enslavement in Cuba", "url": "https://www.theguardian.com/news/2026/nov/22/bank-of-england-directors-illegally-profited-enslavement-cuba", "fonte_id": "guardian_world", "data_pub": "2026-11-22T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisas mostram que diretores antigos da Bank of England lucraram ilegalmente com a escravidão nas minas de cobre em Cuba, mesmo após a abolição da escravidão no império britânico. Estes diretores estavam envolvidos com a Cobre Mining Company, que explorava escravos em condições prisionais para fornecer minérios para a Indústria Revolucionária britânica.", "titulo_pt": "Lucrativo: diretores da bank of England lucraram ilegalmente com escravidão pós-abolição em Cuba", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 280437, "titulo": "Major corporations' profits jump, but donations decrease", "url": "https://www.koreaherald.com/article/10945179", "fonte_id": "korea_herald", "data_pub": "2026-11-22T07:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As maiores conglomeradas sul-coreanas registraram aumento significativo nos lucros nos primeiros três quartos de 2025, mas suas doações coletivas diminuíram em 2% em comparação com o mesmo período do ano anterior, segundo análise de uma plataforma de rastreamento corporativo.", "titulo_pt": "Lucros das grandes empresas sul-coreanas aumentam, mas doações caem", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 280444, "titulo": "BOK likely to hike interest rate on resilient growth, inflation", "url": "https://www.koreaherald.com/article/10945119", "fonte_id": "korea_herald", "data_pub": "2026-11-22T05:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Reserva Federal da Coreia (BOK) provavelmente aumentará a taxa básica de juros em 0,25 ponto percentual nesta quinta-feira, devido à inflação crescente impulsionada pelo boom das semicondutores e ao crescimento econômico resiliente. No encontro de outubro, a BOK manteve a taxa básica em 3%, citando a necessidade de avaliar os efeitos das elevações de julho e maio.", "titulo_pt": "BOK provavelmente aumentará taxa de juros devido a crescimento resiliente e inflação", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 280094, "titulo": "Relações entre União Europeia e Brasil: duas perspectivas sobre uma parceria em transformação", "url": "https://www.jota.info/opiniao-e-analise/artigos/relacoes-entre-uniao-europeia-e-brasil-duas-perspectivas-sobre-uma-parceria-em-transformacao", "fonte_id": "jota", "data_pub": "2026-11-22T05:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil continuará buscando uma aproximação com a Europa, enquanto a União Europeia (UE) necessita do Brasil para diversificar seu comércio e cadeia de suprimentos.", "titulo_pt": "Relações entre União Europeia e Brasil: duas perspectivas sobre uma parceria em transformação", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 280027, "titulo": "Intraempreendedorismo na prática: como criar novos negócios dentro da sua empresa", "url": "https://exame.com/carreira/ntraempreendedorismo-na-pratica-como-criar-novos-negocios-dentro-da-sua-empresa/", "fonte_id": "exame", "data_pub": "2026-11-22T05:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O intraempreendedorismo permite que profissionais desenvolvam novos produtos e identifiquem oportunidades comerciais dentro da própria empresa sem precisar deixar o emprego. Esta prática oferece uma oportunidade para ampliar a atuação profissional sem riscos significativos.", "titulo_pt": "Intraempreendedorismo na prática: como criar novos negócios dentro da sua empresa", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 280044, "titulo": "Queda de serviços de nuvem pode afetar hospitais, bancos e órgãos públicos", "url": "https://www.metropoles.com/ciencia/queda-de-servicos-de-nuvem-pode-afetar-hospitais-bancos-e-orgaos-publicos", "fonte_id": "metropoles", "data_pub": "2026-11-22T05:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Falhas prolongadas nos serviços de nuvem podem dificultar consultas médicas, pagamentos e atendimentos. Especialistas alertam sobre os riscos e orientam sobre como se preparar.", "titulo_pt": "Falhas nos serviços de nuvem podem impactar hospitais, bancos e órgãos públicos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 280345, "titulo": "Argentina’s borrowing costs jump as Milei’s falling popularity rattles investors", "url": "https://www.ft.com/content/f3ecede4-74a3-431a-89c5-a06fcd30812a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-22T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os custos de empréstimo da Argentina aumentaram devido à diminuição da popularidade do candidato libertarian Milei, o que abalou os investidores. Os planos de financiamento de Milei e sua baixa aprovação afetaram o ânimo antes de sua candidatura à reeleição.", "titulo_pt": "Custos de empréstimo da argentina aumentam com declínio de popularidade de Milei", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 280346, "titulo": "Private equity backers flag fresh concerns about sell-to-yourself deals", "url": "https://www.ft.com/content/d299785f-dc83-4850-95b8-e08b9a643f98?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-22T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores privados expressaram preocupações sobre acordos de venda autosservida, frustrando-se com a exclusão deles quando ativos são transferidos para veículos de continuação.", "titulo_pt": "Investidores privados manifestam novas preocupações sobre acordos de venda autosservida", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 280347, "titulo": "Cheap Chinese ecommerce parcels flood the UK", "url": "https://www.ft.com/content/2b2824e2-16b9-4621-85a0-7dad220644d5?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-22T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O valor das pequenas importações postais aumentou quatro vezes nos últimos dois anos, devido ao aumento das compras de plataformas de comércio eletrônico asiáticas no Reino Unido.", "titulo_pt": "Carrinhos de compras chinesas baratas invadem o reino unido", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 280095, "titulo": "O REIDI sobreviveu à reforma tributária, e a matriz de risco define quem captura o ganho", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-reidi-sobreviveu-a-reforma-tributaria-e-a-matriz-de-risco-define-quem-captura-o-ganho", "fonte_id": "jota", "data_pub": "2026-11-22T04:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A REIDI passou a ser uma componente crucial do equilíbrio econômico do contrato fiscal, além de um simples benefício tributário. A matriz de risco determina quem captura os ganhos resultantes desta mudança.", "titulo_pt": "O REIDI sobreviveu à reforma tributária, e a matriz de risco define quem captura o ganho", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 280453, "titulo": "Samsung, LG face risk of higher costs as EU appliance makers seek carbon levies on imports", "url": "https://www.koreaherald.com/article/10945073", "fonte_id": "korea_herald", "data_pub": "2026-11-22T04:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fabricantes europeus de eletrodomésticos estão pressionando a União Europeia para que implante tarifas por carbono em importações de refrigeradores, lavadoras e outros produtos domésticos, visando proteger suas fábricas da concorrência com produtos asiáticos que não estão sujeitos às mesmas taxas ambientais. Uma associação da indústria apressou a adoção de um plano de ação até 2027 antes de uma reunião de ministros europeus da competitividade em dezembro.", "titulo_pt": "Samsung e LG correm risco de aumentos de custos com tarifas por carbono sobre importações europeias", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 280200, "titulo": "5 melhores séries pós-apocalípticas para assistir na Netflix", "url": "https://canaltech.com.br/entretenimento/netflix-melhores-series-pos-apocalipticas-para-assistir/", "fonte_id": "canaltech", "data_pub": "2026-11-22T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Netflix oferece diversas séries pós-apocalípticas que exploram situações extremas, como surtos virais e desastres ambientais, focando nos conflitos humanos e dilemas morais que surgem durante a luta pela sobrevivência.", "titulo_pt": "5 Melhores séries pós-apocalípticas para assistir na Netflix", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 280051, "titulo": "EUA dominam infraestrutura de IA, mas isso tem ajudado os modelos chineses", "url": "https://www.infomoney.com.br/business/global/eua-dominam-infraestrutura-de-ia-mas-isso-tem-ajudado-os-modelos-chineses/", "fonte_id": "infomoney", "data_pub": "2026-11-22T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas americanas dominam a infraestrutura de inteligência artificial, mas estão alugando capacidade para provedores que usam esses recursos para oferecer modelos de linguagem chineses globais. Isso sugere que a infraestrutura americana está apoiando o desenvolvimento de modelos de IA chineses.", "titulo_pt": "EUA dominam infraestrutura de IA, mas beneficiam modelos chineses", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 280442, "titulo": "Anti-cheating apron", "url": "https://www.koreaherald.com/article/10945129", "fonte_id": "korea_herald", "data_pub": "2026-11-22T06:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades sul-coreanas distribuíram aventais durante a prova dissertativa do processo de admissão à universidade este fim de semana, como medida antifraude. Alguns campus usaram detetores de metais e pediram que as estudantes soltassem o cabelo para prevenir o uso de câmeras microscópicas.", "titulo_pt": "Aventais anti-fraude", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 280225, "titulo": "‘Serious error of judgment’: outrage over military AI event at Berlin arts complex", "url": "https://www.theguardian.com/world/2026/nov/22/military-ai-event-berlin-kraftwerk-arts-complex", "fonte_id": "guardian_world", "data_pub": "2026-11-22T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um evento realizado no Kraftwerk Berlin, um complexo de arte localizado no mesmo desenvolvimento do famoso club techno Tresor, transformou a sua grande sala central em algo que os visitantes descreveram como semelhante a um quartel-general de guerra. O evento, realizado em 11 de novembro, foi criticado por parecer muito sombrio para um local associado à cultura techno.", "titulo_pt": "Erro sério de julgamento: indignação com evento militar de IA no complexo de arte de berlim", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 280306, "titulo": "Quantum computing’s first real-world payoff may come in energy, not drug discovery", "url": "https://www.cnbc.com/2026/11/22/quantum-computing-energy-applications.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-22T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas de computação quântica estão testando otimização de redes de energia, materiais solares e catalisadores de hidrogênio em busca de usos práticos.", "titulo_pt": "O primeiro verdadeiro retorno da computação quântica pode vir do setor de energia, não da descoberta de medicamentos", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 280341, "titulo": "Napoleon’s warning to Nvidia’s Jensen Huang", "url": "https://www.ft.com/content/f4a9e8ac-9ba2-40ac-8d27-8ce2b9639e2a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-22T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A estrutura hierárquica plana e o micromanagement podem concentrar poder de forma perigosa no topo da organização.", "titulo_pt": "A advertência de napoleão para Jensen Huang da Nvidia", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 280343, "titulo": "Tech suppliers raise AI server prices up to 45% months after deals are signed", "url": "https://www.ft.com/content/dd2a6594-6146-4ff1-ac8e-54749c1fc99f?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-22T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fabricantes de equipamentos de tecnologia, como Dell, HPE, Lenovo e Supermicro, aumentaram os preços das máquinas de inteligência artificial em até 45% alguns meses após os contratos serem assinados. Este aumento está afetando as empresas de negócios que comercializam esses equipamentos.", "titulo_pt": "Fabricantes de tecnologia aumentam preços de servidores de IA em até 45% meses após assinatura de contratos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 280344, "titulo": "Amazon’s AI resistance: workers ready for battle over data centres", "url": "https://www.ft.com/content/d194e93b-8d3c-42eb-85dd-46d58c4f2a80?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-22T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores da Amazon estão preparados para se opor à expansão rápida da empresa, especialmente em relação aos centros de dados. Essa oposição vem tanto dos funcionários quanto da comunidade pública.", "titulo_pt": "Resistência da AI da amazon: funcionários prontos para se opor aos centros de dados", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 280454, "titulo": "Seoul-backed tech firms bag 34 Innovation Awards at CES 2027", "url": "https://www.koreaherald.com/article/10945072", "fonte_id": "korea_herald", "data_pub": "2026-11-22T04:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vinte e sete startups apoiadas pelo governo metropolitano de Seul ganharam um total de 34 Prêmios de Inovação no CES 2027, incluindo três prêmios de melhor inovação. As empresas vencedoras incluem participantes de programas municipais-chave como Seoul R&D e Seoul Campus Town, bem como startups residentes atuais e anteriores de incubadoras administradas pela cidade, como o Seoul Startup Hub, Seoul AI Hub e Seoul Fintech Lab.", "titulo_pt": "Startups apoiadas por seul ganham 34 prêmios de inovação no CES 2027", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 280424, "titulo": "Samsung Electronics, SK hynix dividend payout ratios surge through Q3 amid AI boom", "url": "https://en.yna.co.kr/view/AEN20261122000400320", "fonte_id": "yonhap_news", "data_pub": "2026-11-22T01:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Samsung Electronics e SK hynix registraram aumento nas taxas de pagamento de dividendos no terceiro trimestre, coincidindo com o boom da Inteligência Artificial.", "titulo_pt": "Taxas de pagamento de dividendos de samsung Electronics e SK hynix aumentam no terceiro trimestre com o boom da IA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 280382, "titulo": "U.S. Agriculture Department and FBI breached by hackers, reports say", "url": "https://www.japantimes.co.jp/news/2026/11/22/world/crime-legal/us-fbi-usda-cyberattacks/", "fonte_id": "japan_times", "data_pub": "2026-11-22T00:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Relatos indicam que o Departamento de Agricultura dos Estados Unidos e o FBI foram alvos de hackers. Essas informações surgem em um momento de crescente preocupação com falhas tecnológicas recentes em instituições americanas importantes.", "titulo_pt": "Departamento de agricultura e FBI dos EUA foram alvos de hackers, relatam", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 279975, "titulo": "Henry Shevlin, do Google DeepMind: 'Esta é a parte mais importante de ser humano'", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/henry-shevlin-do-google-deepmind-esta-e-a-parte-mais-importante-de-ser-humano.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-22T00:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Henry Shevlin, um acadêmico que estuda a consciência e trabalha no Leverhulme Centre for the Future of Intelligence, recebeu um e-mail educado de um agente de IA em fevereiro.", "titulo_pt": "Henry Shevlin, do Google DeepMind: 'esta é a parte mais importante de ser humano'", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 280201, "titulo": "Review ASUS Zenbook S14 | Uma opção sólida no segmento de notebooks premium", "url": "https://canaltech.com.br/notebook/review-asus-zenbook-s14/", "fonte_id": "canaltech", "data_pub": "2026-11-21T23:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ASUS Zenbook S14 foi lançado no Brasil com a chegada das CPUs Panther Lake da Intel, que prometem desempenho e eficiência energética. Este modelo é considerado uma opção sólida no segmento de notebooks premium.", "titulo_pt": "Review ASUS Zenbook S14 | Uma opção sólida no segmento de notebooks premium", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 279733, "titulo": "Quais são e quanto custam os carros da Caoa Changan no Brasil?", "url": "https://canaltech.com.br/carros/quais-sao-e-quanto-custam-os-carros-da-caoa-changan-no-brasil/", "fonte_id": "canaltech", "data_pub": "2026-11-21T22:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Caoa Changan começou suas operações no Brasil em abril de 2026, oferecendo uma gama limitada de veículos que atendem diferentes perfis de consumidores. A reportagem do CT Auto lista os modelos disponíveis e seus respectivos preços no mercado brasileiro.", "titulo_pt": "Quais são e quanto custam os carros da Caoa Changan no Brasil?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 279943, "titulo": "Amazon is complaining about NYC Council on shipping labels, too", "url": "https://www.theverge.com/tech/1039564/amazon-nyc-council-packages-shipping-label", "fonte_id": "the_verge", "data_pub": "2026-11-21T21:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amazon está utilizando rótulos nas suas entregas para contestar o New York City Council e a Delivery Protection Act. A empresa afirma que a lei poderia adicionar até $5 a qualquer pedido do Amazon.", "titulo_pt": "Amazon está contestando o new york city Council e a delivery protection act com rótulos nas entregas", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 279945, "titulo": "Signal restricts mobile screenshots as it confronts ‘existential threat’ of AI surveillance", "url": "https://techcrunch.com/2026/11/21/signal-restricts-mobile-screenshots-as-it-confronts-existential-threat-of-ai-surveillance/", "fonte_id": "techcrunch", "data_pub": "2026-11-21T21:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Signal está limitando a capacidade dos usuários de fazerem captur
