<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "27/07/2026 00:12", "stats": {"noticias_novas": 488, "resumos_gerados": 205}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Supremo Tribunal Federal decretou luto oficial após a morte do ex-ministro Octavio Gallotti, que presidiu o STF entre 1993 e 1995. O ministro Alexandre de Moraes assinou um ato determinando que a bandeira deve ser hasteada a meio-mastro e as celebrações no STF serão suspensas por três dias. Em outro desenvolvimento, Flávio Bolsonaro foi nomeado como candidato à presidência na eleição de outubro no Brasil, enfrentando o atual presidente Luiz Inácio Lula da Silva. O Itamaraty convocou o embaixador argentino após declarações ofensivas do presidente Javier Milei contra instituições brasileiras, consideradas 'inaceitáveis' pelo governo. Além disso, a Confederação Nacional do Transporte enviou uma agenda com dez propostas para os candidatos presidenciais, incluindo um pedido de R$ 2 trilhões em investimentos nos transportes.", "mundo": "A Coreia do Norte rejeitou pedidos sobre a desnuclearização do país, alguns dias após autoridades apelarem pela desnuclearização durante uma cúpula de nações asiáticas. Em outro desenvolvimento, o Brasil chamou o embaixador argentino para consultas depois que o presidente ultradireitista Javier Milei fez comentários ofensivos sobre Jair Bolsonaro, gerando um conflito diplomático entre os dois países sul-americanos. Além disso, a Coreia do Norte busca um acordo de segurança com Israel, enquanto o Brasil receberá o presidente ucraniano Volodymyr Zelenskyy em uma base naval britânica como sinal de 'inabalável' apoio à Ucrânia.\n\nOs Estados Unidos e o Irã entraram em uma trégua informal após quase duas semanas de intensos confrontos, com os ataques de ambos sendo pausados. Essa decisão levantou esperanças de que haja um novo ciclo de negociações diplomáticas entre as duas nações. O Irã anunciou a interrupção de seus próprios ataques após a paralisação dos Estados Unidos, enquanto o Pentágono retirou os quatro militares americanos mortos recentemente do balanço oficial de vítimas da guerra contra o Irã. A Coreia do Norte instalou telas em volta de uma construção na vila intercoreana de Panmunjom para esconder obras de reforma, enquanto a Síria sinalizou um possível acordo de segurança com Israel, esperando que isso possa levar a uma paz abrangente. Além disso, o governo israelense concordou com a presença de uma força estabilizadora internacional em Gaza, e houve relatos de ataques de drones entre as forças hutíes e sauditas no Iêmen.", "economia": "Os mercados financeiros internacionais enfrentaram uma série de eventos importantes na última semana. A China viu sua empresa de chips de memória CXMT realizar um IPO bem-sucedido, com o valor da empresa disparando 470% em sua estreia no mercado. No entanto, a economia chinesa também registrou uma redução nos lucros industriais em junho, principalmente devido à queda dos preços do petróleo. Em outro desenvolvimento, as ações da Seven & i caíram após encerrar negociações para comprar a Zabka, rede polonesa de lojas conveniência, embora a empresa ainda veja a Europa como uma oportunidade de crescimento. No Brasil, o Ministério da Saúde lançou uma campanha sobre os riscos das apostas, enquanto o petróleo abriu a semana em queda após relatos de que o Irã indicou que suspenderia seus ataques se os Estados Unidos mantivessem um hiato nas hostilidades. Além disso, as tensões no Oriente Médio levaram à pausa nos ataques e ao consequente enfraquecimento do preço do petróleo. Em meio a essa volatilidade, o Banco Central de Singapura endureceu sua política monetária em resposta ao risco inflacionário aumentado causado pelo aumento dos preços do petróleo.", "tecnologia": "A China continua a dominar o noticiário tecnológico, com empresas como CXMT e Black Lake Technologies se destacando. A ChangXin Memory Technologies (CXMT), principal fabricante chines de chips DRAM, teve seu IPO ser o maior na bolsa da China desde 2010, refletindo a crescente demanda por chips de memória para inteligência artificial. As ações da empresa subiram 472%, indicando grande interesse do mercado. A Black Lake Technologies, sediada em Shanghai, adotou uma estratégia inusitada para vender soluções de IA para pequenas fábricas chinesas: contratou entregadores de comida para promover seus produtos. Por outro lado, a empresa chinesa de inteligência artificial DeepSeek informou verbalmente aos investidores potenciais que está pausando sua segunda rodada de financiamento, segundo fontes do Bloomberg. O anúncio inesperado ocorreu poucos dias após transcrições vazadas atribuídas ao fundador Liang Wenfeng levantarem discussões online sobre a dependência da China em hardware dos EUA e seu atraso tecnológico em relação às concorrentes americanas. Além disso, a SK Telecom formou uma subsidiária dedicada, a SK Hyper, com o objetivo de desenvolver negócios relacionados a centrais de dados de inteligência artificial e expandir a infraestrutura de AI na Coreia do Sul. A empresa visa apoiar a estratégia governamental 'Três Grandes Poderes da Inteligência Artificial' e fornecer uma nova plataforma para construir e operar capacidade de centrais de dados de grande escala de IA no país.", "ciencia": "A descoberta de um pulsar emissor de gama com 3,2 milissegundos a uma distância de 3.900 anos-luz da Terra, pela equipe chinesa, é o destaque na pesquisa científica desta edição. O estudo publicado no servidor pré-impresso arXiv sugere que a gravidade intensa perto de um buraco negro afetaria como um observador distante leria o dispositivo, sem necessariamente alterar as leis do circuito quântico. Outras notícias científicas abrangem a produtividade florestal na Ártica Oriental, que determina o sink de carbono da região, e a descoberta de vinhedos antigos em Tigray, no norte da Etiópia, que sobreviveram contra todas as odds. A pesquisa também inclui a identificação de alterações genéticas semelhantes às de tumores humanos em uma variedade de lagartixas-leopardo, o que pode ajudar a entender como o câncer surge e se espalha no organismo. Além disso, cientistas descobriram que a glucosa desempenha um papel crucial na fixação de memórias a longo prazo, enquanto um motor quântico de calor opera simultaneamente como um motor que produz trabalho e como um refrigerador. A produtividade florestal, e não o aquecimento rápido, determina o sink de carbono da Ártica Oriental, abrigando cerca de 20% das florestas do mundo e desempenhando um papel crucial na mitigação do aquecimento global ao absorver dióxido de carbono.", "cultura": "O Festival Literário Internacional de Paraty (Flip) 2026 registrou seu maior público até hoje, com 40 mil visitantes. Os autores Socorro Acioli e Valter Hugo Mãe foram os mais vendidos durante a festa. Além disso, Camila Pitanga interpretará Clara Nunes em uma cinebiografia sobre a cantora sambista, enquanto Jão retorna após um hiato com seu novo álbum 'Memórias Póstumas', que inclui uma narrativa reflexiva. A música também esteve em alta, com Gracie Abrams conquistando seu primeiro número um no Billboard 200 com o álbum 'Daughter from Hell'. No cinema, 'Toy Story 5' arrecadou mais de US$ 1 bilhão e se tornou o filme com maior bilheteria do ano.", "sociedade": "A governadora de Nova York, Kathy Hochul, anunciou que o estado serviu 396 milhões de refeições escolares gratuitas e economizou cerca de 450 milhões de dólares mensais em despesas para famílias. Cerca de 2,7 milhões de alunos recebem café da manhã e almoço em mais de duas mil escolas do estado. Em São Paulo, o governo investiu bilhões na construção de 100 creches e na climatização de mil escolas estaduais desde 2023, demonstrando esforços para melhorar a infraestrutura educacional. No Distrito Federal, um suspeito ateou fogo em sua ex-companheira após ela recusar seu pedido para manter o relacionamento. Em Ribeirão Preto, após um temporal, a Defesa Civil enviou 11 mil itens de ajuda à cidade, que registrou 319 raios até sábado (25/7), causando destelhamentos e queda de árvores.", "meio_ambiente": "Incêndios florestais na França e Espanha continuam a causar preocupação, com mais de 360 mil pessoas evacuadas. Em Bordeaux, o avanço das chamas obrigou a evacuação de 250 mil pessoas durante a noite, enquanto incêndios na Espanha levaram cerca de 270 mil pessoas a deixarem suas casas. A França enfrenta uma 'tempestade de fogo' perto da região vitivinícola, intensificada por ondas sucessivas de calor e secagem do solo. Em contraste, na região do Alentejo, as mudanças climáticas estão afetando a produção de azeite, com a onda de calor exacerbando os impactos negativos. No Chile, o rio Perquilauquén atingiu seu limite crítico, levando à declaração de um alerta vermelho em comunas de Ñuble por aumento do caudal. Estes eventos refletem a crescente vulnerabilidade das regiões ao clima extremo e mudanças climáticas.", "direitos_humanos": "Um ataque durante a Berlin Pride em Berlim é suspeito de ser um ato de terrorismo islâmico, conforme as investigações estão sendo realizadas. Em outro evento relacionado, duas pessoas morreram baleadas por agentes do ICE durante uma operação migratória nos Estados Unidos neste mês. O governo chileno expressou disposição para dialogar sobre o projeto 'Escuta seu coração' e considera revisar a denúncia obrigatória em casos de violação, embora reconheça as dificuldades para as vítimas. Em Minab, no Irã, um ataque deixou 120 crianças mortas, reavivando debates sobre direitos humanos na região. Além disso, a responsabilidade penal para adolescentes e o problema da violência juvenil são discutidos em uma análise chilena. Por fim, Donald Trump criticou LeBron James, sugerindo que ele 'talvez seja racista', em um tom depreciativo sobre o jogador de basquete americano."}, "resumo_do_dia": {"politica_nacional": [{"id": 74223, "titulo": "Faria Lima torce por desembarque de Flávio Bolsonaro em favor de Caiado", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/faria-lima-torce-por-desembarque-de-flavio-bolsonaro-em-favor-de-caiado.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-27T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mercado financeiro paulistano, representado pela região de Faria Lima, espera que Flávio Bolsonaro não se apresente como candidato a presidente em favor de Ronaldo Caiado. O mercado apoiou Jair Bolsonaro por sua linha econômica mais liberal, mas não tem o mesmo afeto para com Flávio Bolsonaro.", "titulo_pt": "Faria Lima espera desistência de Flávio Bolsonaro em favor de Caiado", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 74234, "titulo": "Em meio a restrições da lei eleitoral, Ministério da Pesca intensifica publicação de receitas culinárias", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/em-meio-a-restricoes-da-lei-eleitoral-ministerio-da-pesca-intensifica-publicacao-de-receitas-culinarias.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-27T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Pesca e Aquicultura tem publicado receitas culinárias em seu site, devido às restrições impostas pela lei eleitoral que limitam a divulgação de ações governamentais. Essa estratégia é usada como forma de manter o conteúdo online sem violar as regras eleitorais.", "titulo_pt": "Ministério da Pesca intensifica publicação de receitas culinárias diante das restrições eleitorais", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 74236, "titulo": "Eleitores de Caiado usam de chapéu de cowboy a camiseta pela redução da maioridade penal", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/eleitores-de-caiado-usam-de-chapeu-de-cowboy-a-camiseta-pela-reducao-da-maioridade-penal.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-27T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os eleitores do governador Caiado usaram diversos tipos de roupas, incluindo chapéus de cowboy e camisetas, durante a convenção nacional do PSD em São Paulo para apoiar o partido. O evento ocorreu no centro da cidade na manhã do último domingo (26).", "titulo_pt": "Eleitores do Caiado usam chapéu de cowboy e camiseta pela redução da maioridade penal em convenção do psd", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 74237, "titulo": "Convenção de PSOL-Rede tem divergência até última hora sobre suplência de Marina", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/sem-boulos-e-erika-convencao-de-psol-rede-tem-divergencia-ate-ultima-hora-sobre-suplencia-de-marina.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-27T01:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A convenção estadual da federação PSOL-Rede Sustentabilidade terminou com divergências internas sobre a suplência de Marina Silva, candidata ao Senado. Guilherme Boulos e Erika Hilton não participaram do evento.", "titulo_pt": "Convenção PSOL-Rede tem divergência sobre suplência de Marina até última hora", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 74258, "titulo": "Itamaraty convoca embaixador argentino após declarações de Milei", "url": "https://www.poder360.com.br/poder-governo/itamaraty-convoca-embaixador-argentino-apos-declaracoes-de-milei/", "fonte_id": "poder360", "data_pub": "2026-07-27T00:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Itamaraty convocou o embaixador argentino após declarações do presidente argentino Miguel Ángel Milei contra o ministro Alexandre de Moraes e instituições brasileiras, consideradas 'inaceitáveis' pelo governo.", "titulo_pt": "Itamaraty convoca embaixador argentino após declarações de Milei", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 74288, "titulo": "STF decreta luto oficial após morte do ex-ministro Octavio Gallotti", "url": "https://www.metropoles.com/colunas/manoela-alcantara/stf-decreta-luto-oficial-apos-morte-do-ex-ministro-octavio-gallotti", "fonte_id": "metropoles", "data_pub": "2026-07-26T23:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) decretou luto oficial após a morte do ex-ministro Octavio Gallotti. O ato, assinado pelo ministro Alexandre de Moraes, determina que a bandeira deve ser hasteada a meio-mastro e as celebrações no STF serão suspensas por três dias.", "titulo_pt": "STF decreta luto oficial após morte do ex-ministro Octavio Gallotti", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 74290, "titulo": "PSol e Rede confirmam apoio a Haddad e anunciam candidaturas em SP", "url": "https://www.metropoles.com/sao-paulo/psol-e-rede-confirmam-apoio-a-haddad-e-anunciam-candidatos-em-sp", "fonte_id": "metropoles", "data_pub": "2026-07-26T23:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Federação PSol-Rede realizou uma convenção no domingo (26/7) em São Paulo, confirmou o apoio a Fernando Haddad e anunciou candidatos a deputado.", "titulo_pt": "Psol e Rede confirmam apoio a Haddad e anunciam candidaturas em SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 74259, "titulo": "União Brasil oficializa candidatura de Allyson Bezerra ao governo do RN", "url": "https://www.poder360.com.br/poder-eleicoes-2026/uniao-brasil-oficializa-candidatura-de-allyson-bezerra-ao-governo-do-rn/", "fonte_id": "poder360", "data_pub": "2026-07-26T23:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A União Brasil oficializou a candidatura de Allyson Bezerra ao governo do Rio Grande do Norte para as eleições de 2026. A chapa foi aprovada durante uma convenção estadual da Federação União Progressista.", "titulo_pt": "União Brasil oficializa candidatura de Allyson Bezerra ao governo do RN", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 74260, "titulo": "Caiado diz que participará de todos os debates e cobra adversários", "url": "https://www.poder360.com.br/poder-eleicoes-2026/caiado-diz-que-participara-de-todos-os-debates-e-cobra-adversarios/", "fonte_id": "poder360", "data_pub": "2026-07-26T23:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato do PSD, Caiado, afirmou que participará de todos os debates eleitorais. Ele fez essa declaração após especulações sobre a possibilidade de Lula não comparecer aos debates do primeiro turno.", "titulo_pt": "Caiado anuncia participação em todos os debates e cobra adversários", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 74261, "titulo": "PDT oficializa candidatura de Alexandre Kalil ao governo de Minas", "url": "https://www.poder360.com.br/poder-eleicoes-2026/pdt-oficializa-candidatura-de-alexandre-kalil-ao-governo-de-minas/", "fonte_id": "poder360", "data_pub": "2026-07-26T22:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PDT oficializou a candidatura de Alexandre Kalil ao governo de Minas Gerais através da convenção do diretório estadual. O partido ainda está negociando nomes para o cargo de vice-governador e para uma vaga no Senado.", "titulo_pt": "PDT oficializa candidatura de Alexandre Kalil ao governo de Minas", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 74262, "titulo": "No ABC, Lula pede que metalúrgicos mantenham tradição de luta", "url": "https://www.poder360.com.br/poder-governo/no-abc-lula-pede-que-metalurgicos-mantenham-tradicao-de-luta/", "fonte_id": "poder360", "data_pub": "2026-07-26T22:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula, durante uma visita ao ABC, pediu aos metalúrgicos que mantivessem a tradição de luta e preservassem a autonomia para cobrar os governos.", "titulo_pt": "No ABC, Lula pede que metalúrgicos mantenham tradição de luta", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 74335, "titulo": "Flávio quer candidatura própria do PL ao governo de Minas", "url": "https://www.cnnbrasil.com.br/eleicoes/flavio-quer-candidatura-propria-do-pl-ao-governo-de-minas/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-26T22:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio, pré-candidato a cargo, conversou com parlamentares mineiros e orientou que o PL lance um nome próprio para o governo de Minas Gerais caso o senador Cleitinho (Republicanos) não concorra.", "titulo_pt": "Flávio quer candidatura própria do PL ao governo de Minas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 74238, "titulo": "Vídeo de IA só viola prisão domiciliar se Bolsonaro participou ou consentiu, diz advogado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/video-de-ia-so-viola-prisao-domiciliar-se-bolsonaro-participou-ou-consentiu-diz-advogado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-26T22:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um vídeo de inteligência artificial mostrando Jair Bolsonaro declarando apoio à candidatura do filho Flávio Bolsonaro pode levar a uma apuração sobre eventual descumprimento das restrições impostas ao ex-presidente pelo STF. O advogado afirmou que o vídeo só viola a prisão domiciliar se Bolsonaro participou ou consentiu.", "titulo_pt": "Vídeo de IA só viola prisão domiciliar se Bolsonaro participou ou consentiu, diz advogado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 74263, "titulo": "Governador de Buenos Aires posta foto com Lula e critica Milei", "url": "https://www.poder360.com.br/poder-internacional/governador-de-buenos-aires-posta-foto-com-lula-e-critica-milei/", "fonte_id": "poder360", "data_pub": "2026-07-26T22:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador de Buenos Aires, Axel Kicillof, criticou o presidente argentino Maximiliano Milei por sua postura ofensiva em relação ao governo do Brasil. Kicillof publicou uma foto com o ex-presidente Luiz Inácio Lula da Silva e expressou vergonha alheia diante dos comentários de Milei.", "titulo_pt": "Governador de Buenos Aires critica Milei por ofender governo brasileiro", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 74264, "titulo": "Eduardo Leite promete palanque forte para Caiado no RS", "url": "https://www.poder360.com.br/poder-eleicoes-2026/eduardo-leite-promete-palanque-forte-para-caiado-no-rs/", "fonte_id": "poder360", "data_pub": "2026-07-26T22:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador do Rio Grande do Sul, Eduardo Leite, que foi preterido pelo PSD na corrida presidencial, declarou seu apoio a Ronaldo Caiado na disputa pela Presidência da República.", "titulo_pt": "Eduardo Leite apóia Caiado àpresidência no RS", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 74265, "titulo": "Morre Octávio Gallotti, ministro aposentado do STF", "url": "https://www.poder360.com.br/poder-justica/morre-octavio-gallotti-ministro-aposentado-do-stf/", "fonte_id": "poder360", "data_pub": "2026-07-26T22:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Octávio Gallotti, ministro aposentado do Supremo Tribunal Federal (STF) que serviu de 1984 a 2000, faleceu em Brasília. O velório público será realizado no STF na segunda-feira.", "titulo_pt": "Morre Octávio Gallotti, ministro aposentado do STF", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 74448, "titulo": "Australia news live: NSW corruption inquiry hears of lengths allegedly gone to by witnesses to avoid scrutiny", "url": "https://www.theguardian.com/australia-news/live/2026/jul/27/ausalert-emergency-warning-test-antisemitism-royal-commission-nsw-icac-inquiry-politics-anthony-albanese-labor-angus-taylor-coalition-victoria-jacinta-allan-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-07-27T02:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão de Corrupção do estado da Nova Gales do Sul, Austrália, ouviu relatos sobre os esforços supostos feitos por testemunhas para evitar serem examinadas. O jornalista Adeshola Ore realizou uma entrevista com Barnaby Joyce sobre o programa de refugiados em Armidale e as posições do partido One Nation em imigração, destacando que este último quer proibir a imigração de pessoas que não falam inglês.", "titulo_pt": "Notícias da austrália em tempo real: comissão de corrupção ouve sobre esforços supostos de testemunhas para evitar investigação", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 74271, "titulo": "Dinastia Kim rejeita pedidos sobre desnuclearização da Coreia do Norte", "url": "https://www.metropoles.com/mundo/dinastia-kim-rejeita-pedidos-sobre-desnuclearizacao-da-coreia-do-norte", "fonte_id": "metropoles", "data_pub": "2026-07-27T02:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Norte rejeitou pedidos sobre a desnuclearização do país, ocorrendo alguns dias após autoridades apelarem pela desnuclearização durante uma cúpula de nações asiáticas.", "titulo_pt": "Dinastia Kim rejeita pedidos sobre desnuclearização da Coreia do Norte", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 74230, "titulo": "Trump constrói vínculo com apoiadores ao enaltecer a si mesmo, avaliam especialistas", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/07/trump-constroi-vinculo-com-apoiadores-ao-enaltecer-a-si-mesmo-avaliam-especialistas.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-07-27T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo das falas públicas de Donald Trump, analisadas por especialistas, indica que o ex-presidente constrói vínculo com seus apoiadores ao se enaltecer. Essa estratégia é vista como um mecanismo para fortalecer sua base de apoio.", "titulo_pt": "Trump constrói ligação com apoiadores ao se autopromover, dizem especialistas", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 74231, "titulo": "Confiante e de vocabulário repetitivo, retórica de Trump passou a mirar cada vez mais os outros", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/07/confiante-e-de-vocabulario-repetitivo-retorica-de-trump-passou-a-mirar-cada-vez-mais-os-outros.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-07-27T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Donald Trump expressa principalmente confiança, expectativa e alegria em suas falas públicas ao longo de sua carreira política, desde 2015 até fevereiro de 2026.", "titulo_pt": "Confiantes, expectantes e felizes: o vocabulário repetitivo de Trump", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 74232, "titulo": "Indígenas na fronteira com o Peru estão sob cerco do crime organizado", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/colunas/bianca-santana/2026/07/indigenas-na-fronteira-com-o-peru-estao-sob-cerco-do-crime-organizado.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-07-27T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Indígenas ashaninkas vivem tanto no Brasil quanto no Peru, mantendo relações de parentesco e circulação que atravessam a fronteira. Mais de 100 mil ashaninkas residem no Peru, enquanto cerca de 1.500 habitam o Acre, Brasil.", "titulo_pt": "Indígenas na fronteira com o Peru estão sob cerco do crime organizado", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 74525, "titulo": "Watch: Scaffolding ripped from Hong Kong building as Typhoon Noul makes landfall", "url": "https://www.bbc.co.uk/news/videos/ckg9ewekpk1o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-07-27T01:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tufão chamado Noul atingiu a China como o mais forte deste ano, de acordo com os meios de comunicação estatais. Estruturas temporárias, como andaimes, foram derrubadas em Hong Kong devido à força do tufão.", "titulo_pt": "Assista: estandarte arrancado de prédio em Hong Kong enquanto tufão Noul toca solo", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 74545, "titulo": "Lebanese return to homes of rubble left by Israel in so-called pilot zones", "url": "https://www.aljazeera.com/video/newsfeed/2026/7/27/lebanese-return-to-homes-of-rubble-left-by-israel-in-so-called-pilot-zones?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-27T01:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O exército libanês acusa Israel de derrubar casas e dificultar o retorno dos residentes às áreas conhecidas como zonas-piloto. Os libaneses estão sendo encaminhados para essas áreas, mas enfrentam obstáculos devido às ações israelenses.", "titulo_pt": "Libaneses retornam às casas em ruínas causadas por Israel nas chamadas zonas-piloto", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 74522, "titulo": "Argentinian leader calls Brazilian president a 'thief' and a 'convict'", "url": "https://www.bbc.co.uk/news/articles/cvgx91vdedno?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-07-27T01:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O economista Javier Milei, que está na cidade de São Paulo para apoiar a campanha do candidato presidencial Flávio Bolsonaro, fez críticas duras ao presidente brasileiro Jair Bolsonaro, chamando-o de 'ladrão' e 'condenado'.", "titulo_pt": "Líder argentino chama presidente brasileiro de ladrão e condenado", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 74595, "titulo": "Marcos fights to revive economy and presidency after graft debacle", "url": "https://www.japantimes.co.jp/news/2026/07/27/asia-pacific/politics/marcos-economy-presidency-graft/", "fonte_id": "japan_times", "data_pub": "2026-07-27T01:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A confiança do público na presidência filipina de Ferdinando Marcos Jr. está em seu nível mais baixo, apesar das tentativas de proteger os consumidores dos efeitos da guerra no Irã.", "titulo_pt": "Marcos luta para reativar economia e presidência após escândalo de corrupção", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 74274, "titulo": "EUA e Irã entram em trégua informal após dias de ataques seguidos", "url": "https://www.metropoles.com/mundo/eua-e-ira-entram-em-tregua-informal-apos-dias-de-ataques-seguidos", "fonte_id": "metropoles", "data_pub": "2026-07-27T01:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Irã anunciou a suspensão de ataques contra países vizinhos após os Estados Unidos não realizarem novas operações militares desde sexta-feira (24/7). Isso marcou uma trégua informal entre as duas nações.", "titulo_pt": "EUA e Irã entram em trégua informal após dias de ataques seguidos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 74596, "titulo": "Syrian president tells Al Jazeera his country seeks security deal with Israel", "url": "https://www.japantimes.co.jp/news/2026/07/27/world/politics/syria-al-jazeera-security-deal-israel/", "fonte_id": "japan_times", "data_pub": "2026-07-27T01:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente sírio, Ahmad al-Sharaa, declarou que seu país busca um acordo de segurança com Israel. Este acordo poderia abrir caminho para uma paz abrangente entre os dois países sem comprometer o direito do Síria à Golan Heights.", "titulo_pt": "Presidente sírio diz a Al Jazeera que seu país busca acordo de segurança com Israel", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 74582, "titulo": "Oltre 1.400 morti nell'epidemia di Ebola in Congo", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/27/oltre-1.400-morti-nellepidemia-di-ebola-in-congo_91d010c3-808e-4139-a792-bdb3aa1668f0.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-27T01:05:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Mais de 1.400 pessoas morreram na epidemia de Ebola no Congo, segundo relatório da Dpa. O tasso de mortalidade atual é de 43,9%.", "titulo_pt": "Maior de 1.400 mortos na epidemia de Ebola no Congo", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 74597, "titulo": "Missile strikes kill civilians in Kyiv and other cities, with Russian-held areas hit", "url": "https://www.japantimes.co.jp/news/2026/07/27/world/missile-strikes-kyiv-russia/", "fonte_id": "japan_times", "data_pub": "2026-07-27T00:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Missilistas e drones atingiram áreas controladas por Kiev, resultando em mortes civis. Regiões ocupadas pelo Exército Russo também foram alvo de ataques, com quatro
