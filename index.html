<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">

</div>

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "26/10/2026 19:27", "stats": {"noticias_novas": 627, "resumos_gerados": 231}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Luiz Inácio Lula da Silva foi reeleito presidente do Brasil com uma vantagem significativa de mais de 4 milhões de votos sobre o senador Flávio Bolsonaro. Líderes internacionais, como o presidente francês Emmanuel Macron, parabenizaram a vitória de Lula. Durante seu discurso de vitória, Lula pediu que o Hino Nacional fosse tocado e se emocionou com a reação dos manifestantes. O senador Flávio Bolsonaro desistiu de pedir a anulação da eleição e agora planeja entrar com uma ação por abuso de poder contra Lula. A posse de Lula para seu quarto mandato está marcada para 5 de janeiro de 2027. O governo federal transferiu o ponto facultativo do Dia do Servidor Público para 30 de outubro, permitindo quatro dias de folga consecutivos. Além disso, a Polícia Federal registrou 86 casos de possíveis crimes eleitorais no segundo turno das eleições.", "mundo": "Luiz Inácio Lula da Silva venceu as eleições presidenciais no Brasil para seu quarto mandato, superando Flávio Bolsonaro no segundo turno com 51,76% dos votos. Flávio Bolsonaro, filho do ex-presidente Jair Bolsonaro, contestou o resultado, pedindo a prorrogação da votação em cinco estados. O presidente americano, Donald Trump, criticou as eleições brasileiras, afirmando que pareceram fraudadas, sem apresentar evidências. Trump também comemorou recentes vitórias eleitorais de direita na América do Sul, incluindo a vitória do candidato do movimento estudantil na Sérvia. A vitória de Lula enfraquece o bolsonarismo e mostra a força do Brasil contra a interferência dos EUA. Congressistas democratas dos Estados Unidos parabenizaram Lula e pediram que Trump reconheça o resultado. Além disso, a esquerda francesa vê a vitória de Lula como um sinal de esperança para as eleições de 2027 na França.\n\nA guerra contra o Irã está aumentando os custos de combustível e fertilizantes na África, ameaçando a segurança alimentar, segundo informantes do comércio. Em contraste, Luiz Inácio Lula da Silva venceu a terceira eleição presidencial no Brasil, enquanto Jair Bolsonaro contesta o resultado. Agora, Lula terá a oportunidade de implementar as promessas de mudanças feitas durante a campanha. Além disso, a Arábia Saudita e o Irã concordaram em continuar o diálogo para fortalecer a cooperação após sua reunião quadrilateral em Teerã, focando em 'paz e segurança na região'. A guerra na Ucrânia continua com ataques de drones e incêndios em edifícios, enquanto a ONU advertiu sobre as devastadoras consequências de qualquer escalada militar na região do Golfo.", "economia": "A vitória inesperada de Lula nas eleições presidenciais no Brasil causou uma das maiores quedas dos mercados brasileiros em décadas, conforme relatado pelo Financial Times. A bolsa brasileira registrou um circuit breaker pela primeira vez desde março de 2020, e o dólar subiu 12%, refletindo a reação negativa dos investidores. O risco-Brasil disparou quase 27%, e empresas como a Petrobras experimentaram fortes quedas nas ações. Diante dessas incertezas, o Tesouro Nacional realizou uma recompra de títulos prefixados no valor de R$ 7,1 bilhões, enquanto o Banco Central aprovou novas regras para o Pix, visando aumentar a transparência e reduzir o endividamento. Além disso, a confiança do consumidor no Brasil aumentou em outubro após cinco meses consecutivos de decréscimo, segundo a FGV. No exterior, a União Europeia considera adquirir participações em projetos de minerais críticos, seguindo a estratégia dos Estados Unidos e do Japão, enquanto a China vê suas marcas de beleza buscando espaço nas prateleiras globais.", "tecnologia": "A Anthropic, uma empresa de inteligência artificial, enviou seu pedido para uma oferta pública inicial de ações (IPO), indicando que a empresa está prestes a se listar na bolsa de valores. De acordo com seu prospecto de IPO, a empresa relatou vendas trimestrais de US$ 11,6 bilhões, mas alertou os investidores sobre diversos riscos, incluindo conflitos com o governo de Trump e sistemas de IA agindo por conta própria. Além disso, a Microsoft anunciou que ofereceu pacotes de saída a 60.000 funcionários como parte de uma estratégia para controlar custos, com a empresa planejando investir até US$ 175 bilhões em infraestrutura de inteligência artificial neste ano.", "ciencia": "A NASA convidou a mídia para visitar um novo simulador de pouso lunar no Ames Research Center, na Califórnia, nos dias 29 e 30 de outubro. O simulador permitirá uma experiência realista do pouso lunar, oferecendo uma oportunidade única para jornalistas e especialistas assistirem às tecnologias e procedimentos envolvidos no próximo grande passo da exploração lunar. Paralelamente, pesquisas sobre o envelhecimento da frota da NASA em órbita de Marte sugerem que o desgaste das instalações espaciais pode afetar as operações futuras de exploração do planeta, destacando a importância de manter as instalações em boas condições. Além disso, a descoberta de nuvens em um planeta rochoso de lava, com atmosfera composta por vapor de minerais silicáticos, desafia as expectativas científicas sobre o comportamento atmosférico de planetas rochosos quentes.", "cultura": "A vitória de Lula nas eleições presidenciais no Brasil causou uma onda de celebração na cultura digital do país, com memes e outros conteúdos populistas se espalhando nas redes sociais. O National Gallery of Singapore, um importante centro cultural, está enfrentando mudanças significativas, com a saída de executivos importantes, incluindo o curador-chefe Patrick Flores e o vice-presidente executivo Chris Lee. Em outro desenvolvimento cultural, o documentário 'Você Pode Ver Tudo', dirigido por Nathan Fielder, questiona a natureza da documentação ao apresentar uma narrativa que pode ser interpretada como uma performance artística. Além disso, a exposição 'Desejos de Máquinas' no Museu de Arte Contemporânea em Mar del Plata convida os visitantes a refletirem sobre a relação com a tecnologia, enquanto o Flaming Lips anuncia um novo álbum intitulado 'The Teardrop Throbs'.", "sociedade": "Um homem foi preso em flagrante após disparar tiros contra duas pessoas em uma adega em São Paulo, conforme relato do Metrópoles. Em uma notícia relacionada, a Fundação INMULA, uma organização sem fins lucrativos, oferece empregos e bolsas de formação para promover a igualdade de oportunidades no mercado de trabalho, informa a Clarín. Em Goiás, um homem foi agredido com chutes por um grupo de pessoas após as eleições, conforme relato do CNN Brasil. No Rio de Janeiro, uma deputada sugeriu que empresários demitam funcionários que votaram em Lula, refletindo tensões políticas, de acordo com a Veja. Além disso, a influenciadora Deolane Bezerra, advogada, fez um novo desabafo em uma carta enviada à mãe, expressando o desejo de voltar para casa, informa o CNN Brasil.", "meio_ambiente": "A Holanda anunciou uma contribuição de 500 milhões de dólares para um fundo de florestas, em uma iniciativa que aproxima a meta brasileira de 10 bilhões de dólares ao longo de dez anos. Em outro desenvolvimento, a vigilância ambiental do estado da Austrália Ocidental alertou que o plano da Woodside Energy para perfurar gás na costa norte do país pode causar danos significativos a recifes de coral excepcionais e aumentar o risco de vazamento de óleo, possivelmente impossível de ser reduzido a um nível aceitável. Além disso, a Filipinas enfrenta os custos mais altos de danos aos portos devido ao clima na Ásia Oriental, com prejuízos anuais projetados em 70,2 bilhões de dólares até 2100, conforme alerta o Banco de Desenvolvimento Asiático, destacando a necessidade de uma abordagem mais coordenada para a proteção contra inundações. No Brasil, o sistema de logística reversa de embalagens agrícolas já destinou corretamente mais de 900 mil toneladas desde 2002, tornando-se uma referência na reciclagem no agro. No entanto, a falta de estrutura e planejamento compromete a efetividade das unidades de conservação no país, conhecidas como parques de papel, que não atendem plenamente seu propósito de preservação e gestão ambiental.", "direitos_humanos": "A Comissão da ONU acusa Israel de 'extermínio' na Cisjordânia e de 'genocídio' em Gaza, enquanto a Rússia é acusada de crimes de guerra e contra a humanidade na Ucrânia, incluindo ataques deliberados à infraestrutura energética e o tráfico de estrangeiros para o Exército russo. O chefe das Nações Unidas para os direitos humanos, Volker Turk, advertiu sobre possíveis 'limpeza étnica' em Hebron, na Cisjordânia, devido a operações que deslocaram mais de 2.000 palestinos. Em outro contexto, o governo marroquino considera anular decisões que permitiram a libertação antecipada de condenados por abuso sexual de menores, apesar de ter descartado anteriormente a suspensão dos decretos já executados. Além disso, a descoberta de bebês orangotangos em uma floresta de casuarinas na Índia expõe um comércio ilegal de primatas que está se expandindo para o país. Por fim, um ativista defendeu a necessidade de novas leis para combater a repressão."}, "resumo_do_dia": {"politica_nacional": [{"id": 227805, "titulo": "Quem estava com Flávio Bolsonaro em discurso após derrota no 2º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/quem-estava-com-flavio-bolsonaro-em-discurso-apos-derrota-no-2o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-26T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro acompanhou a apuração das eleições em Brasília, cercado por aliados, após ser derrotado pelo presidente Lula no segundo turno. Lula venceu com uma vantagem de mais de 4 milhões de votos.", "titulo_pt": "Quem estava com Flávio Bolsonaro durante o discurso após a derrota no segundo turno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 227844, "titulo": "Líderes estrangeiros reconhecem vitória e parabenizam Lula", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/lideres-estrangeiros-reconhecem-vitoria-e-parabenizam-lula", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-26T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Líderes internacionais continuam a manifestar apoio à reeleição de Luiz Inácio Lula da Silva, com o presidente francês Emmanuel Macron sendo um dos primeiros a parabenizá-lo. A vitória de Lula está sendo noticiada amplamente na imprensa europeia e asiática.", "titulo_pt": "Líderes estrangeiros reconhecem vitória e parabenizam Lula", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 227806, "titulo": "Lula entoa o Hino da Independência e repete que Brasil não cabe no 'quintal de ninguém'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/lula-entoa-o-hino-da-independencia-e-repete-que-brasil-nao-cabe-no-quintal-de-ninguem.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-26T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Depois de sua vitória nas eleições, Lula pediu que o Hino Nacional fosse tocado e se emocionou com a reação dos manifestantes na avenida Paulista, que cantaram a canção em apoio a ele.", "titulo_pt": "Lula pede Hino nacional e se emociona com apoio dos manifestantes", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 227910, "titulo": "CLDF: Wellington Luiz retira assinatura do projeto sobre nova reeleição", "url": "https://www.metropoles.com/colunas/grande-angular/cldf-wellington-luiz-retira-assinatura-do-projeto-sobre-nova-reeleicao", "fonte_id": "metropoles", "data_pub": "2026-10-26T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Wellington Luiz, presidente da CLDF, retirou sua assinatura do projeto sobre nova reeleição para poder presidir a sessão que analisará o projeto nesta terça-feira.", "titulo_pt": "CLDF: wellington Luiz retira assinatura do projeto sobre nova reeleição", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 227913, "titulo": "Flávio não pedirá anulação da eleição, dizem aliados. Foco é cassar chapa", "url": "https://www.metropoles.com/brasil/flavio-nao-vai-mais-pedir-anulacao-da-eleicao-dizem-aliados-e-juridico", "fonte_id": "metropoles", "data_pub": "2026-10-26T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados de Flávio Bolsonaro decidiram não pedir anulação da eleição. O grupo pretende priorizar a atuação no Congresso, segundo informações divulgadas nesta segunda-feira com Tarcísio e Rogério Marinho.", "titulo_pt": "Aliados de flávio não pedirão anulação da eleição, dizem", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 227807, "titulo": "Deputado de Santa Catarina diz que vai propor plebiscito para separar Sul do Brasil", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/deputado-de-santa-catarina-diz-que-vai-propor-plebiscito-para-separar-sul-do-brasil.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-26T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado estadual eleito Bruno Souza (PL-SC) planeja convocar um plebiscito para consultar a população de Santa Catarina sobre a possibilidade de secessão do estado do resto do Brasil.", "titulo_pt": "Deputado catarinense planeja plebiscito sobre secessão", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 227850, "titulo": "Governo federal transfere ponto facultativo do Dia do Servidor Público para 30 de outubro", "url": "https://g1.globo.com/politica/noticia/2026/10/26/governo-federal-transfere-ponto-facultativo-do-dia-do-servidor-publico-para-30-de-outubro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-26T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal transferiu o ponto facultativo do Dia do Servidor Público, inicialmente marcado para 28 de outubro, para 30 de outubro. Com isso, os servidores poderão ter quatro dias de folga consecutivos, incluindo o fim de semana e o feriado de Finados.", "titulo_pt": "Governo federal transfere ponto facultativo do Dia do Servidor Público para 30 de outubro", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 227808, "titulo": "CNBB parabeniza Lula, diz que é preciso pacificar o país e faz aceno antiaborto", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/cnbb-parabeniza-lula-diz-que-e-preciso-pacificar-o-pais-e-faz-aceno-antiaborto.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-26T21:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A CNBB parabenizou o presidente Lula e seu vice, Geraldo Alckmin, pela reeleição. A instituição fez menção a pacificação nacional e fez um aceno antiaborto em sua carta.", "titulo_pt": "CNBB parabeniza Lula e faz aceno antiaborto após reeleição", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 227995, "titulo": "Não é novidade que Flávio questione derrota nas urnas, diz Marília à CNN", "url": "https://www.cnnbrasil.com.br/eleicoes/nao-e-novidade-que-flavio-questione-derrota-nas-urnas-diz-marilia-a-cnn/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-26T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A senadora eleita Marília Castro Neves afirmou que Flávio Bolsonaro questiona frequentemente a derrota nas urnas. Ela também mencionou que a composição do novo Senado deve seguir o modelo do terceiro mandato de Lula, com aprovação de projetos de interesse e de bandeiras eleitorais.", "titulo_pt": "Não é novidade que Flávio questione derrota nas urnas, diz Marília", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 227809, "titulo": "Das 7 promessas feitas por Lula após ser reeleito, 4 dependem do Congresso", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/das-7-promessas-feitas-por-lula-apos-ser-reeleito-4-dependem-do-congresso.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-26T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula fez sete promessas após a reeleição, mas quatro delas dependem do Congresso Nacional. As outras três promessas necessitam de espaço no Orçamento.", "titulo_pt": "De 7 promessas de Lula após reeleição, 4 dependem do Congresso", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 227845, "titulo": "Moraes manda Flávio entregar passaporte e o proíbe de deixar o país", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/moraes-manda-flavio-entregar-passaporte-e-o-proibe-de-deixar-o-pais", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-26T20:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes, do Supremo Tribunal Federal, proibiu o senador Flávio Bolsonaro de deixar o país e ordenou que ele entregasse seus passaportes à Polícia Federal. Essa decisão faz parte de um processo em que Flávio e o advogado Willer Tomaz são investigados.", "titulo_pt": "Moraes proíbe Flávio bolsonaro de deixar o país e entrega passaporte", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 227846, "titulo": "Posse de Lula será em 5 de janeiro", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/posse-de-lula-sera-em-5-de-janeiro", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-26T20:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A posse de Luiz Inácio Lula da Silva para seu quarto mandato e de Geraldo Alckmin como vice será em 5 de janeiro de 2027, conforme determina a Emenda Constitucional nº 111, de 2021. Esta é uma mudança na data tradicional de 1º de janeiro, adotada desde a Constituição de 1988.", "titulo_pt": "Posse de Lula será em 5 de janeiro", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 227852, "titulo": "Polícia vai investigar vídeo em que homem negro aparece acorrentado em ato de apoio a Flávio Bolsonaro", "url": "https://g1.globo.com/rj/rio-de-janeiro/eleicoes/2026/noticia/2026/10/26/investigacao-acorrentado-barra.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-26T20:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Civil do Rio de Janeiro investigará um vídeo em que um homem negro aparece acorrentado por um manifestante branco durante um ato de apoio ao senador Flávio Bolsonaro. A filmagem foi registrada na Barra da Tijuca, na Zona Sudoeste do Rio, durante um evento relacionado às eleições, quando Flávio era candidato à Presidência.", "titulo_pt": "Polícia vai investigar vídeo de homem negro acorrentado em ato de apoio a Flávio Bolsonaro", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 227847, "titulo": "PF registrou 86 casos de possíveis crimes eleitorais no 2º turno", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/pf-registrou-no-2o-turno-86-casos-de-possiveis-crimes-eleitorais", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-26T20:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal registrou 86 casos de possíveis crimes eleitorais no segundo turno das eleições, além de instaurar 13 inquéritos policiais e lavrar 64 termos circunstanciados de ocorrência. Seis situações de flagrante permaneciam em análise.", "titulo_pt": "PF registrou 86 casos de possíveis crimes eleitorais no 2º turno", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 227810, "titulo": "Nikolas diz que chance de anular eleição é quase nula e orienta apoiadores de Flávio a evitarem atos nas ruas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/nikolas-diz-que-chance-de-anular-eleicao-e-quase-nula-e-orienta-apoiadores-de-flavio-a-evitarem-atos-nas-ruas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-26T20:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal Nikolas Ferreira afirmou que a chance de anular o segundo turno das eleições é praticamente nula e orientou os apoiadores do candidato derrotado Flávio Bolsonaro a evitar atos públicos.", "titulo_pt": "Nikolas diz que chance de anular eleição é quase nula e orienta apoiadores de Flávio a evitarem atos nas ruas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 228130, "titulo": "Terceiro turno das eleições depende de aliança entre Trump e bolsonarismo", "url": "https://www.jota.info/opiniao-e-analise/colunas/democracia-em-transe/terceiro-turno-das-eleicoes-depende-de-alianca-entre-trump-e-bolsonarismo", "fonte_id": "jota", "data_pub": "2026-10-26T20:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O resultado do terceiro turno das eleições brasileiras pode depender de uma aliança entre o ex-presidente dos Estados Unidos, Donald Trump, e o bolsonarismo. Trump tem a reputação de abandonar perdedores no caminho.", "titulo_pt": "Terceiro turno das eleições depende de aliança entre Trump e bolsonarismo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 227558, "titulo": "Lula wins fourth term, as Bolsonaro seeks to void result", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/27/2003866676", "fonte_id": "taipei_times", "data_pub": "2026-10-27T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lula foi eleito para seu quarto mandato presidencial. Bolsonaro busca anular o resultado das eleições.", "titulo_pt": "Lula ganha quarto mandato, Bolsonaro busca anular resultado", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 228136, "titulo": "How Lula’s Social Media Campaign Helped Him Win Brazil’s Election", "url": "https://www.nytimes.com/2026/10/26/world/americas/brazil-election-lula-social-media.html", "fonte_id": "nyt_world", "data_pub": "2026-10-26T21:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Luiz Inácio Lula da Silva venceu as eleições no Brasil com a ajuda de uma campanha nas redes sociais que convenceu os brasileiros a rejeitarem seu adversário.", "titulo_pt": "Como a campanha nas redes sociais de Lula auxiliou sua vitória nas eleições do Brasil", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 228222, "titulo": "Serbia’s elections: 'Tracking fraud for sure had an impact on the results'", "url": "https://www.france24.com/en/europe/20261026-serbia-elections-tracking-fraud-had-an-impact-on-results-vote-fraud", "fonte_id": "france24", "data_pub": "2026-10-26T21:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na eleição parlamentar de 25 de outubro, o movimento estudantil na Sérvia obteve uma vitória histórica, derrotando o partido do presidente em exercício Aleksandar Vucic. Os apoiantes da lista estudantil relataram como mob lo_pt": "Financiamento direto corporativo aumenta em setembro com vendas de dívidas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 227963, "titulo": "Sem provas, Trump repete narrativa de Flávio Bolsonaro e diz que eleições no Brasil foram ‘fraudadas’", "url": "https://www.brasildefato.com.br/2026/10/26/sem-provas-trump-repete-narrativa-de-flavio-bolsonaro-e-diz-que-eleicoes-no-brasil-foram-fraudadas/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-26T20:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, não parabenizou Lula após sua vitória nas eleições brasileiras e afirmou que as eleições foram 'muito corruptas'. Trump repetiu a narrativa de Flávio Bolsonaro sobre a possibilidade de fraude nas eleições brasileiras.", "titulo_pt": "Sem provas, Trump repete narrativa de Flávio Bolsonaro e diz que eleições no Brasil foram 'fraudadas'", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 227851, "titulo": "Após mínima histórica, aprovação de Trump sobe 1% e chega a 32% antes das eleições nos EUA", "url": "https://g1.globo.com/mundo/noticia/2026/10/26/aprovacao-de-trump-sobe-1percent-e-chega-a-32percent-antes-das-eleicoes-nos-eua.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-26T20:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A aprovação do presidente dos Estados Unidos, Donald Trump, aumentou para 32%, após atingir um mínimo histórico de 31% na semana anterior, conforme uma pesquisa Reuters/Ipsos divulgada em 26 de outubro. A pesquisa foi realizada antes das eleições legislativas de 3 de novembro, conhecidas como midterms, que definirão os representantes do Congresso americano.", "titulo_pt": "Aprovação de Trump sobe 1% e chega a 32% antes das eleições nos EUA", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 228247, "titulo": "What will Lula’s fourth term mean for Brazil?", "url": "https://www.aljazeera.com/video/inside-story/2026/10/26/what-will-lulas-fourth-term-mean-for-brazil?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-26T20:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Luiz Inácio Lula da Silva venceu uma quarta eleição presidencial, enquanto Bolsonaro contesta o resultado. Agora, ele terá a oportunidade de implementar as promessas de mudanças que fez durante a campanha.", "titulo_pt": "O que o quarto mandato de Lula significa para o Brasil?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 228248, "titulo": "US court rules daughter of Trump critic James Comey was illegally fired", "url": "https://www.aljazeera.com/news/2026/10/26/us-court-rules-daughter-of-trump-critic-james-comey-was-illegally-fired?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-26T20:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A filha de James Comey, ex-comandante do FBI, argumentou que foi demitida por causa das críticas de seu pai ao presidente Trump. Comey Júnior era alvo da ira de Trump.", "titulo_pt": "Juízo dos EUA decide que filha de crítico de Trump foi demitida ilegalmente", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 227579, "titulo": "Musk says US$40bn chips debt closed; talks continue", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/27/2003866661", "fonte_id": "taipei_times", "data_pub": "2026-10-27T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O empresário Elon Musk disse que a dívida de US$40 bilhões com chips foi quitada; as negociações continuam.", "titulo_pt": "Musk anuncia dívida de US$40 bi com chips quitada; negociações em andamento", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 228045, "titulo": "O que vai acontecer com dólar e juros após derrocada dos mercados financeiros com vitória de Lula", "url": "https://www.bbc.com/portuguese/articles/cr20wjpvye31o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-26T21:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A contenção da valorização do dólar e das negociações interrompidas na bolsa dependerá da sinalização do governo sobre os planos de ajuste das contas públicas, segundo analistas.", "titulo_pt": "O que vai acontecer com dólar e juros após a vitória de Lula nos mercados financeiros", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 228008, "titulo": "Morgan Stanley rebaixa ações do Brasil após eleição e reforça aposta em exportadoras", "url": "https://www.infomoney.com.br/mercados/morgan-stanley-rebaixa-acoes-do-brasil-apos-eleicao-e-reforca-aposta-em-exportadoras/", "fonte_id": "infomoney", "data_pub": "2026-10-26T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Morgan Stanley reduziu a classificação das ações do Brasil após a eleição e enfatizou a preferência por empresas com receitas em dólar e menor dependência da economia doméstica.", "titulo_pt": "Morgan Stanley rebaixa ações do Brasil após eleição e reforça aposta em exportadoras", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 227906, "titulo": "Ex-diretor do BC diz que alertou para riscos na compra do Master pelo BRB", "url": "https://www.metropoles.com/colunas/manoela-alcantara/ex-diretor-do-bc-diz-que-alertou-para-riscos-na-compra-do-master-pelo-brb", "fonte_id": "metropoles", "data_pub": "2026-10-26T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-diretor do Banco Central (BC) alertou sobre riscos associados à compra da Mastercard pelo Banco do Brasil (BRB) em junho de 2025. A defesa de Paulo Sérgio contesta a versão de Galípolo, afirmando que a análise enviada apontava problemas financeiros e tributários.", "titulo_pt": "Ex-diretor do BC diz ter alertado para riscos na compra do Master pelo BRB", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 227818, "titulo": "Na guerra de apps, 99Food toma novo revés contra o iFood", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/na-guerra-de-apps-99food-toma-novo-reves-contra-o-ifood.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-26T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 99Food foi condenada pela Justiça de São Paulo por concorrência desleal em campanhas publicitárias que se referiam ao iFood. Os desembargadores negaram o recurso da empresa e mantiveram a indenização de R$ 50 mil por danos morais, além da determinação de interromper a veiculação das peças.", "titulo_pt": "Na guerra de apps, 99Food enfrenta novo revés contra o ifood", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 228300, "titulo": "How Hong Kong’s 5-year plan can fuel its financial clout", "url": "https://www.scmp.com/opinion/hong-kong-opinion/article/3371934/how-hong-kongs-5-year-plan-can-fuel-its-financial-clout", "fonte_id": "scmp", "data_pub": "2026-10-26T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ministros da finanças de 21 economias da Ásia-Pacífico se reuniram recentemente em Hong Kong, pela primeira vez no país. O evento visa explorar como os serviços financeiros de Hong Kong podem auxiliar empresas a operar de forma mais eficiente e com custos menores.", "titulo_pt": "Como o plano de 5 anos de Hong Kong pode fortalecer sua influência financeira", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 227819, "titulo": "Reforma tributária poderá reter capital de giro em até 63 dias, aponta levantamento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/reforma-tributaria-podera-reter-capital-de-giro-em-ate-63-dias-aponta-levantamento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-26T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento da Roit indica que descompassos comuns entre faturamento de fornecedores e compradores podem atrasar o aproveitamento de créditos tributários da CBS em até 33 dias, prazo que pode dobrar para 63 dias em caso de inadimplência do parceiro comercial.", "titulo_pt": "Reforma tributária poderá reter capital de giro em até 63 dias, aponta estudo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 227820, "titulo": "O que um gestor pode acrescentar à sua renda fixa?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/10/o-que-um-gestor-pode-acrescentar-a-sua-renda-fixa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-26T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute a diferença entre comprar títulos de renda fixa e pagar por uma gestão profissional. Explica que, embora seja possível comprar títulos sozinho, pagar por uma gestão pode ser justificado por alguns fundos, enquanto outros não o são.", "titulo_pt": "O que um gestor pode adicionar à sua renda fixa?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 228295, "titulo": "Consumer sentiment drops in Oct. on stock market correction, Mideast tensions", "url": "https://en.yna.co.kr/view/AEN20261026008200320", "fonte_id": "yonhap_news", "data_pub": "2026-10-26T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A percepção do consumidor diminuiu em outubro devido principalmente à correção do mercado de ações e tensões no Oriente Médio.", "titulo_pt": "Sentimento do consumidor cai em outubro devido a correção do mercado de ações e tensões no oriente médio", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 227951, "titulo": "Ibovespa derrete 13,9% em pregão pós-reeleição de Lula; dólar tem m alta diária desde 1999 após vitória de Lula", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 227826, "titulo": "Banqueiros mais ricos do Brasil perdem US$ 10 bilhões após vitória de Lula", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/10/banqueiros-mais-ricos-do-brasil-perdem-us-10-bilhoes-apos-vitoria-de-lula.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-26T19:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os banqueiros mais ricos do Brasil perderam cerca de R$ 54 bilhões após a vitória surpreendente de Lula nas eleições, resultando em uma forte queda nos mercados locais e uma suspensão temporária das negociações na Bolsa.", "titulo_pt": "Banqueiros mais ricos do Brasil perdem r$ 54 bilhões após vitória de Lula", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 227829, "titulo": "O que Lula 4 pode fazer para domar o pânico dos donos do dinheiro grosso", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/viniciustorres/2026/10/o-que-lula-4-pode-fazer-para-domar-o-panico-dos-donos-do-dinheiro-grosso.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-26T18:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os investidores ficaram assustados com a vitória de Lula 4 nas eleições, após a expectativa inicial de uma vitória de Bolsonaro 2. Muitos investidores saíram de suas posições com medo de perderem dinheiro.", "titulo_pt": "O que Lula 4 pode fazer para aliviar o pânico dos investidores ricos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 228257, "titulo": "Brazil’s real sinks after Lula’s re-election victory", "url": "https://www.aljazeera.com/economy/2026/10/26/brazils-real-sinks-after-lulas-re-election-victory?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-26T18:27:00Z", /27/2003866692", "fonte_id": "taipei_times", "data_pub": "2026-10-27T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo propôs um sistema de inteligência artificial para prever e prevenir a morte de animais nas estradas. O sistema visa reduzir a ocorrência de acidentes envolvendo animais selvagens nas rodovias.", "titulo_pt": "Grupo propõe sistema de IA para prever e prevenir a morte de animais nas estradas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 228325, "titulo": "Databricks co-founder shares his secrets for winning big enterprises customers", "url": "https://techcrunch.com/2026/10/26/databricks-co-founder-shares-his-secrets-for-winning-big-enterprises-customers/", "fonte_id": "techcrunch", "data_pub": "2026-10-26T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O cofundador da Databricks compartilhou que vender para grandes empresas não depende de tecnologia inovadora, mas sim de usar a equipe de vendas de uma empresa maior como plataforma.", "titulo_pt": "Cofundador da databricks revela segredos para conquistar grandes clientes empresariais", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 228309, "titulo": "Anthropic is burning gas to feed the AI boom", "url": "https://www.theverge.com/ai-artificial-intelligence/1018994/anthropic-ipo-ai-data-center-energy-climate-risk", "fonte_id": "the_verge", "data_pub": "2026-10-26T21:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Anthropic, que está se preparando para uma oferta pública inicial de ações, revela em seu S-1 que os centros de dados estão cada vez mais dependentes de gás natural para alimentar a expansão dos modelos de inteligência artificial gerativa. A empresa admite que a concorrência por acesso à energia elétrica e aos locais dos centros de dados com disponibilidade de energia é intensa.", "titulo_pt": "Anthropic está queimando gás para alimentar a explosão da IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 228320, "titulo": "Why Anthropic’s IPO Prospectus Is Missing So Many Key Figures", "url": "https://www.wired.com/story/anthropic-prospectus-leaves-out-some-numbers/", "fonte_id": "wired", "data_pub": "2026-10-26T21:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O prospecto de IPO da Anthropic contém centenas de páginas, mas omite muitos detalhes financeiros importantes. Analistas acreditam que os investidores merecem mais informações.", "titulo_pt": "Por que o prospecto de IPO da Anthropic omite muitos detalhes financeiros?", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 228326, "titulo": "Watch out, YouTube — Instagram goes from short-form to 90-minute videos", "url": "https://techcrunch.com/2026/10/26/watch-out-youtube-instagram-goes-from-short-form-to-90-minute-videos/", "fonte_id": "techcrunch", "data_pub": "2026-10-26T21:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Instagram está lançando vídeos de até 90 minutos, oferecendo uma oportunidade de desafiar o YouTube se a plataforma souber aproveitar essa chance.", "titulo_pt": "Atenção, YouTube — Instagram passa a oferecer vídeos de até 90 minutos", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 228296, "titulo": "U.S. bill names N. Korea, Iran among countries of concern in AI cybersecurity initiative", "url": "https://en.yna.co.kr/view/AEN20261027000500315", "fonte_id": "yonhap_news", "data_pub": "2026-10-26T20:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O congresso dos Estados Unidos apresentou um projeto de lei voltado para a iniciativa de segurança cibernética em inteligência artificial, incluindo Coreia do Norte e Irã entre os países de preocupação.", "titulo_pt": "Projeto de lei dos EUA lista Coreia do norte e Irã entre países de preocupação na iniciativa de segurança cibernética de IA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 22829 ", "classe": "A"}, {"id": 228313, "titulo": "Meet the real-life Scottish surgeon who inspired Sherlock Holmes", "url": "https://arstechnica.com/science/2026/10/meet-the-real-life-scottish-surgeon-who-inspired-sherlock-holmes/", "fonte_id": "ars_technica", "data_pub": "2026-10-26T20:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lindsey Fitzharris conversa com Ars Technica sobre seu novo livro, Sleuth-Hound: O Caso do Verossímil Sherlock Holmes, no qual ela explora o real médico cirurgião escocês que inspirou o personagem de Sherlock Holmes.", "titulo_pt": "Conheça o cirurgião escocês real que inspirou Sherlock Holmes", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 228314, "titulo": "Apple releases iOS and macOS 27.2 with new Siri AI features, new Music logo", "url": "https://arstechnica.com/apple/2026/10/apple-releases-ios-and-macos-27-2-with-new-siri-ai-features-new-music-logo/", "fonte_id": "ars_technica", "data_pub": "2026-10-26T20:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple lançou as versões iOS 16.2 e macOS 13.2, introduzindo novas funcionalidades da inteligência artificial do Siri e um novo logotipo para o serviço Music. Também foi incluído o controle sobre quais aplicativos o Siri pode acessar diretamente.", "titulo_pt": "Apple lança ios e macos 13.2 com novas funcionalidades do Siri e novo logotipo do Music", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 227960, "titulo": "Itaú fecha acordo de R$ 2,9 bilhões para comprar startup de IA", "url": "https://veja.abril.com.br/coluna/faria-lima-news/itau-fecha-acordo-de-r-29-bilhoes-para-comprar-startup-de-ia/", "fonte_id": "veja", "data_pub": "2026-10-26T19:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Itaú fechou um acordo para comprar a NeoSpace por R$ 2,9 bilhões. A NeoSpace desenvolve tecnologia para crédito, atendimento e prevenção a fraudes. A aquisição ainda depende da aprovação regulatória.  "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 228364, "titulo": "STAT+: Nonprofit Bon Secours Mercy Health strikes $5.7 billion deal for surgery center chain", "url": "https://www.statnews.com/2026/10/26/bon-secours-mercy-health-surgery-partners-deal-ambulatory-surgery-centers-bain-capital/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-26T21:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A entidade sem fins lucrativa Bon Secours Mercy Health fechou um acordo de $5,7 bilhões para adquirir uma cadeia de centros cirúrgicos ambulatoriais. O sistema católico se tornará uma das maiores operadoras de centros cirúrgicos ambulatoriais do país.", "titulo_pt": "Bon Secours Mercy Health fecha acordo de $5,7 bilhões por cadeia de centros cirúrgicos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 228340, "titulo": "Could ecological roles offer clues to how life began?", "url": "https://phys.org/news/2026-10-ecological-roles-clues-life-began.html", "fonte_id": "phys_org", "data_pub": "2026-10-26T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo sugere que os papéis de produtores, consumidores e decompositores em ecossistemas atuais podem oferecer pistas sobre como a vida começou. O autor questiona se as diferenças entre esses papéis poderiam refletir diferentes ambientes físicos e químicos em que a vida primitiva se desenvolveu.", "titulo_pt": "Poderiam os papéis ecológicos oferecer pistas sobre o começo da vida?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 228341, "titulo": "Expanding hemp could boost Kentucky water quality and ecological diversity", "url": "https://phys.org/news/2026-10-hemp-boost-kentucky-quality-ecological.html", "fonte_id": "phys_org", "data_pub": "2026-10-26T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa sugere que a expansão da cultivação de cânhamo poderia diversificar a paisagem do Kentucky, trazendo benefícios mensuráveis para a qualidade da água e a diversidade ecológica do estado.", "titulo_pt": "Expansão do cânhamo poderia melhorar a qualidade da água e a diversidade ecológica do Kentucky", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 228342, "titulo": "Metalens microscope switches focus with voltage, not moving optics", "url": "https://phys.org/news/2026-10-metalens-microscope-focus-voltage-optics.html", "fonte_id": "phys_org", "data_pub": "2026-10-26T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um microscópio metalensa pode mudar o foco aplicando tensão, sem precisar mover peças ópticas. Isso resolve o problema comum de microscópios óticos, que têm dificuldade em focar estruturas em diferentes profundidades ao mesmo tempo.", "titulo_pt": "Microscópio metalensa alterna o foco com tensão, não movendo ópticas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 228343, "titulo": "Beyond trial and error: Integrating computation, processing, and AI to design high-entropy alloys", "url": "https://phys.org/news/2026-10-trial-error-ai-high-entropy.html", "fonte_id": "phys_org", "data_pub": "2026-10-26T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O design de alies estruturais altamente entrópicas (SHEAs) envolve resolver um problema com um número enorme de variáveis: quais combinações de composição e condições de processamento resultarão nas fases, microestruturas e propriedades mecânicas exigidas por uma aplicação específica? Como esses alies misturam vários elementos principais em proporções comparáveis, essa questão abrange escalas de comprimento e tempo que nenhum único experimento ou modelo pode cobrir sozinho.", "titulo_pt": "Além do ensaio e erro: integrando computação, processamento e IA para projetar alies altamente entrópicos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 228365, "titulo": "STAT+: HHS relaxes security, transparency rules for health record software used by hospitals", "url": "https://www.statnews.com/2026/10/26/health-data-interoperability-hti5-relaxes-privacy-security-requirements/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-26T21:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Trump flexibilizou várias regras de segurança, privacidade e transparência para fornecedores de software de sistemas de registro eletrônico de saúde (EHR) utilizados por hospitais.", "titulo_pt": "HHS relaxa regras de segurança e transparência para software de registros de saúde utilizados por hospitais", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 228368, "titulo": "NASA’s Perseverance Offers Clues to Protect Crews From Mars Dust", "url": "https://www.nasa.gov/missions/mars-2020-perseverance/nasas-perseverance-offers-clues-to-protect-crews-from-mars-dust/", "fonte_id": "nasa_news", "data_pub": "2026-10-26T21:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O rover Perseverance da NASA mediu partículas de martianos finas e ultrafinas que se adheriram a materiais de trajes espaciais a bordo do rover, durante mais de 1.645 dias marcianos. Os resultados serão publicados em 27 de outubro no Proceedings of.", "titulo_pt": "Perseverança da nasa oferece pistas sobre proteção contra poeira de marte para tripulações", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 228344, "titulo": "Silent bacterial genes yield potential leads for future cancer drugs", "url": "https://phys.org/news/2026-10-silent-bacterial-genes-yield-potential.html", "fonte_id": "phys_org", "data_pub": "2026-10-26T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores do Helmholtz Center for Infection Research (HZI) e do Helmholtz Institute for Pharmaceutical Research Saarland (HIPS) descobriram uma nova família de compostos naturais produzidos por microorganismos, elucidaram sua biossíntese incomum e desenvolveram um método para produzi-los sinteticamente. Esses compostos podem ser uma fonte promissora para novos medicamentos, incluindo potenciais drogas contra o câncer.", "titulo_pt": "Genes silenciosos bacterianos oferecem possíveis leituras para medicamentos contra o câncer", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 228345, "titulo": "Light-based monitoring could improve quality checks for lab-grown replacement cartilage", "url": "https://phys.org/news/2026-10-based-quality-lab-grown-cartilage.html", "fonte_id": "phys_org", "data_pub": "2026-10-26T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo doutorado de Omar Anwar Elkadi, no campo da Física Aplicada, sobre espetroscopia de infravermelho próximo para o monitoramento contínuo de cartilagem tecnicamente engenheirada será defendido na Faculdade de Ciências, Florestais e Tecnologia, no campus de Kuopio da Universidade de Sudeste da Finlândia em 30 de outubro.", "titulo_pt": "Monitoramento baseado em luz poderia melhorar verificações de qualidade para cartilagem substituta labiologicamente engenheirada", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 228389, "titulo": "Analog astronauts: How living underwater can prepare humans for space missions", "url": "https://www.space.com/space-exploration/missions/analog-astronauts-how-living-underwater-can-prepare-humans-for-space-missions", "fonte_id": "space_com", "data_pub": "2026-10-26T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A vida embaixo d'água pode preparar humanos para missões espaciais. Isso ocorre porque ambientes aquáticos compartilham semelhanças com a estadia em espaços confinados e pressurizados, como os módulos espaciais.", "titulo_pt": "Astronautas subaquáticos: como viver embaixo d'água pode preparar humanos para missões espaciais", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 228346, "titulo": "Can cats really thrive on vegan diets? Professor Andrew Knight responds to critics", "url": "https://phys.org/news/2026-10-cats-vegan-diets-professor-andrew.html", "fonte_id": "phys_org", "data_pub": "2026-10-26T20:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Professor Andrew Knight, veterinário e professor de bem-estar animal da Universidade Murdoch, respondeu a críticas sobre a possibilidade de gatos prosperarem em dietas veganas. Muitos leitores expressaram preocupações, argumentando que gatos são carnívoros obrigatórios e que dietas veganas poderiam ser muito prejudiciais à sua saúde.", "titulo_pt": "Cães podem realmente prosperar em dietas veganas? Professor Andrew Knight responde a críticos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 227817, "titulo": "Envelhecimento de frota da Nasa na órbita de Marte pode afetar a exploração do planeta", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/envelhecimento-de-frota-da-nasa-na-orbita-de-marte-pode-afetar-a-exploracao-do-planeta.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-26T20:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A frota da NASA em órbita de Marte está envelhecendo, o que pode impactar as operações de exploração do planeta. Atualmente, aproximadamente 16 mil satélites artificiais orbitam a Terra, fornecendo serviços variados como GPS, meteorologia e comunicações remotas.", "titulo_pt": "Envelhecimento da frota da Nasa em órbita de Marte pode afetar a exploração de Marte", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 228347, "titulo": "Aleppo pine at risk: Climate impacts arrive decades earlier than projected", "url": "https://phys.org/news/2026-10-aleppo-climate-impacts-decades-earlier.html", "fonte_id": "phys_org", "data_pub": "2026-10-26T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2020, uma pesquisa publicada na New Phytologist demonstrou como o crescimento em altura da pinheira de Aleppo respondeu a gradientes climáticos no Mediterrâneo e como as populações estavam previstas para responder a mudanças climáticas futuras com base em experimentos de jardim comum ao longo de décadas. Desde então, vários estudos sobre Pinus halepensis têm documentado respostas rápidas e diversas à extrema climática recente.", "titulo_pt": "Pinheira de aleppo em risco: impactos climáticos chegam décadas antes do previsto", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 228348, "titulo": "Tree‑hugging optional: What today's green tradespeople actually care about", "url": "https://phys.org/news/2026-10-treehugging-optional-today-green-tradespeople.html", "fonte_id": "phys_org", "data_pub": "2026-10-26T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa examina se a masculinidade é um obstáculo para os empregos verdes. Os profissionais verdes atuais não necessariamente se identificam com a ideia de 'abraçar árvores'.", "titulo_pt": "Abraçar árvores não é necessário: o que os profissionais verdes atuais realmente se importam?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 228366, "titulo": "Flexell Space Establishes French Subsidiary to Strengthen European Presence", "url": "https://spacenews.com/flexell-space-establishes-french-subsidiary-to-strengthen-european-presence/", "fonte_id": "spacenews", "data_pub": "2026-10-26T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FLEXELL SPACE FRANCE SAS, com sede em Paris, estabeleceu uma subsidiária local na Europa para fortalecer sua presença no continente. A nova entidade visa apoiar discussões em andamento com clientes europeus, desde revisões técnicas até fornecimento.", "titulo_pt": "Flexell Space estabelece subsidiária francesa para fortalecer presença europeia", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 228369, "titulo": "NASA SEES Interns Tackle Real-World Challenges in Lunar Exploration", "url": "https://science.nasa.gov/learning-resources/science-activation/nasa-sees-interns-tackle-real-world-challenges-in-lunar-exploration/", "fonte_id": "nasa_news", "data_pub": "2026-10-26T19:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O programa de estágio NASA STEM Enhancement in Earth Science (SEES) no Centro de Pesquisa Espacial da Universidade do Texas envolve estudantes do ensino médio em pequenos grupos de pesquisa focados em missões, orientados por especialistas da NASA, da academia e do setor privado. Durante o verão de 2026, a equipe SEES Mission Architecture Tool for Research, Integration, and eXploration (MATRIX) trabalhou em desafios relacionados à exploração lunar.", "titulo_pt": "NASA SEES: estagiários enfrentam desafios de exploração Lunar em equipe", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 228426, "titulo": "James Gunn and Peter Safran’s DC Experiment: What’s Working, What Isn’t, and What’s Next", "url": "https://www.indiewire.com/features/commentary/james-gunn-dc-studios-report-card-1235223600/", "fonte_id": "indiewire", "data_pub": "2026-10-26T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A quarta revisão e terceiro filme desde o início de uma reconstrução total do universo DC são avaliados e classificados. A análise se baseia no mais recente esforço da parceria de James Gunn e Peter Safran para o universo DC.", "titulo_pt": "Experimento DC de james Gunn e Peter Safran: o que funciona, o que não funciona e o que vem Next", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 228100, "titulo": "¿Por qué Martin McDonagh homenajeó a Victor Jara en “Caballo Salvaje Nueve”?", "url": "https://www.latercera.com/videos/noticia/por-que-martin-mcdonagh-homenajeo-a-victor-jara-en-caballo-salvaje-nueve/", "fonte_id": "la_tercera", "data_pub": "2026-10-26T21:57:00Z", "idioma": "es", "provavel_duplicata_de": nu to_pt": "Em 1889, no México, o dentista forense Eduardo Nolasco usa métodos científicos inovadores para auxiliar a polícia nas investigações de assassinatos de mulheres. O filme 'Mistérios de um Dentista' retrata essa história.", "titulo_pt": "Mistérios de um Dentista", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 228372, "titulo": "At 60, a Legendary LA Print Workshop Still Urges Us to Pay Attention", "url": "https://hyperallergic.com/at-60-a-legendary-la-print-workshop-still-urges-us-to-pay-attention/", "fonte_id": "hyperallergic", "data_pub": "2026-10-26T21:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A lendária Gemini G.E.L., localizada em Los Angeles, continua incentivando artistas a explorarem novos campos criativos desde os anos 1960, com nomes como Robert Rauschenberg, Josef Albers, Vija Celmins e Julie Mehretu tendo participado.", "titulo_pt": "Com 60 anos, a renomada gemini g.E.L. De LA continua incentivando a saída da zona de comforto dos artistas", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 227831, "titulo": "Streaming gratuito traz documentários com Eunice Paiva e líderes sindicais", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/blogs/bau-do-cinema/2026/10/streaming-gratuito-traz-documentarios-com-eunice-paiva-e-lideres-sindicais.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-26T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A partir desta terça-feira (27), três documentários sobre líderes sindicalistas e rurais, incluindo Eunice Paiva, estão disponíveis gratuitamente no Itaú Cultural Play. Os filmes abordam a memória das lutas sociais e políticas no Brasil durante a ditadura militar.", "titulo_pt": "Streaming gratuito traz documentários sobre líderes sindicais e memórias das lutas sociais", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 2 ignal’ for Australia’s public spending and rising costs", "url": "https://www.theguardian.com/business/2026/oct/27/the-chaos-in-france-is-a-warning-signal-for-australias-public-spending-and-rising-costs", "fonte_id": "guardian_world", "data_pub": "2026-10-26T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Economistas afirmam que os protestos na França, motivados por problemas na educação e infraestrutura, servem como um 'sinal de alerta' para a Austrália, que também corre o risco de enfrentar similares problemas sem uma 'conversa honesta' sobre os gastos públicos. A dívida pública da Austrália é menor que a da França, mas há lições a serem aprendidas com os desafios econômicos franceses.", "titulo_pt": "Protestos na França são 'sinal de alerta' para a austrália em relação aos gastos públicos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 228208, "titulo": "What Does Durga Puja Tell Us About Minorities in Bangladesh?", "url": "https://thediplomat.com/2026/10/what-does-durga-puja-tell-us-about-minorities-in-bangladesh/", "fonte_id": "the_diplomat", "data_pub": "2026-10-26T11:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O maior festival religioso hindu ocorreu sem problemas – um crédito para o novo governo BNP.", "titulo_pt": "O que o festival de Durga Puja revela sobre minorias no Bangladesh?", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 226747, "titulo": "In one Korean county, 1 in 3 young people have migrant backgrounds", "url": "https://www.koreaherald.com/article/10915303", "fonte_id": "korea_herald", "data_pub": "2026-10-26T08:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Goseong, na Província de Gangwon, cerca de um terço dos residentes com 24 anos ou menos tinham origem migrante em 2025, sendo o maior percentual do país e quatro vezes maior que a média nacional.", "titulo_pt": "Em um condado coreano, 1 em 3 jovens têm origem migrant dog-says", "fonte_id": "guardian_world", "data_pub": "2026-10-26T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A vigilância ambiental do estado da Austrália Ocidental alertou que o plano da Woodside Energy para perfurar gás na costa norte da Austrália pode causar danos significativos a recifes de coral excepcionais e aumentar o risco de vazamento de óleo, possivelmente impossível de ser reduzido a um nível aceitável.", "titulo_pt": "Tartarugas em perigo e recifes de coral excepcionais correm risco com perfuração de gás da Woodside na austrália ocidental, diz vigilância ambiental", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 227598, "titulo": "Climate damage to Philippine ports could cost US$70b a year by 2100", "url": "https://www.scmp.com/week-asia/economics/article/3372185/climate-damage-philippine-ports-could-cost-us70b-year-2100", "fonte_id": "scmp", "data_pub": "2026-10-26T11:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Filipinas enfrenta os custos mais altos de danos aos portos devido ao clima na Ásia Oriental, com prejuízos anuais projetados em US$70,2 bilhões até 2100, conforme alerta o Banco de Desenvolvimento Asiático. O relatório destaca a necessidade de uma abordagem mais coordenada para a proteção contra inundações, além da simples fortificação das infraestruturas portuárias.", "titulo_pt": "Danos climáticos aos portos filipinos poderiam custar US$70 bilhões ao ano até 2100", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 226212, "titulo": "Reciclagem no agro amplia recuperação de resíduos e se torna referência", "url": "https://www.cnnbrasil.com.br/agro/reciclagem-no-agro-amplia-recuperacao-de-residuos-e-se-torna-referencia/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-26T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O sistema de logística reversa de embalagens agrícolas já destinou corretamente mais d
