<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

na Ucrânia, resultando em quatro mortes, conforme relatado pela France24. O presidente dos Estados Unidos, Donald Trump, expressou a esperança de que um acordo possa ser alcançado entre Volodymyr Zelenskyy e Vladimir Putin. Em seguida, a situação na América Latina ganhou destaque com a nova direita governando vários países, apoiando as políticas de segurança duras promovidas pelos Estados Unidos, conforme relatado pelo BBC Brasil. No Brasil, a eleição presidencial está próxima, com revelações de que a Casa Branca teria pedido ao governo Lula a garantia da participação de 'disidentes políticos' nas eleições, mas o governo Lula se recusou a ceder a exigência, informou a La Tercera. Além disso, a China, durante um discurso na ONU, advertiu os Estados Unidos sobre Cuba e Irã, reforçando o uso de ciência e tecnologia como motores do seu desenvolvimento, informou o Brasil de Fato. Em outro desenvolvimento, a Arábia Saudita acusou o Irã de ataques em diversas partes da região durante a sessão da ONU, informou o Al Jazeera. Finalmente, o Reino Unido enfrentou uma situação preocupante quando a polícia invadiu residências e realizou prisões perto de uma base aérea usada pelo exército americano, após suspeitas de crimes relacionados a explosivos, relatou o DW English.\n\nA geopolítica global enfrenta diversos desafios e tensões, com destaque para a escalada de tensões entre as grandes potências. A reunião entre os líderes dos Estados Unidos e da China, presidida por Donald Trump e Xi Jinping, teve um impacto significativo. Trump afirmou que Xi 'entende' sua posição sobre Taiwan, embora Washington mantenha sua postura inalterada. O Irã advertiu navios que usassem rotas não autorizadas no Estreito de Ormuz em resposta à rejeição de Trump a uma proposta iraniana para reabrir o estreito. Além disso, o Irã está buscando alternativas para exportar seu petróleo devido ao bloqueio sulista pelos Estados Unidos, direcionando seu comércio para o Mar do Cáspio. Na África do Sul, dois tiroteios em massa resultaram em pelo menos 27 mortes, enquanto na Austrália, o governo convocou os CEOs das empresas OpenAI e Anthropic para uma investigação sobre inteligência artificial. Em Djibouti, o país pede ajuda internacional para lidar com o aumento do fluxo de refugiados provenientes da guerra no Iêmen. A escalada de tensões também é observada na Ucrânia, onde a Rússia intensificou seus ataques, incluindo uma paralisação das operações da maior empresa de aço ucraniana.", "economia": "O cenário econômico global apresenta diversos desafios e oportunidades. Isso pode ser visto no aumento de investimentos em infraestrutura e tecnologia no Azerbaijão, bem como no fortalecimento das relações econômicas entre a Coreia do Sul e o México em setores avançados. No Brasil, a produtividade enfrenta desafios, dependendo de instituições sólidas e do uso eficiente da inteligência artificial. Debates no governo sobre ajustes fiscais refletem incertezas econômicas. A Coreia do Sul registra uma melhora na percepção dos negócios devido a exportações robustas de semicondutores e cosméticos, mas a balança comercial registra um déficit. Em termos de investimentos, o Nubank está negociando a compra do Monzo, um banco britânico, enquanto a McDonald's enfrenta reações negativas de consumidores devido ao aumento do preço do Big Mac. A economia global enfrenta incertezas, com o aumento do indicador de risco-país na Argentina e a pressão sobre as exchanges de criptomoedas devido ao inverno cripto.", "tecnologia": "A inteligência artificial (IA) continua sendo um tema central na tecnologia, com avanços e desafios em diversos setores. A Arábia Saudita se destacou ao apresentar seus primeiros carros elétricos, que podem chegar a 850 CV de potência, representando um passo significativo na indústria automobilística local. Em Hong Kong, as autoridades adiaram a proposta de alteração da lei de direitos autorais para proteger obras de IA, priorizando a emissão de diretrizes operacionais. Por outro lado, a OpenAI suspendeu o treinamento de seus modelos de IA mais recentes devido a incidentes inesperados, destacando a complexidade e os riscos associados a essa tecnologia. Além disso, a Arábia Saudita também apresentou seus primeiros carros elétricos, que começarão a ser vendidos em 2027, representando um avanço significativo na indústria local de veículos elétricos. Estes desenvolvimentos refletem a crescente importância da IA e dos veículos elétricos em diversos cenários tecnológicos.", "ciencia": "Um sinal de rádio do exoplaneta β Pictoris b foi captado pela primeira vez na Terra, permitindo a medição de seu campo magnético. Este avanço é significativo na compreensão de planetas fora do Sistema Solar. Em outro estudo, cientistas descobriram que a gravidade não é a única força que ajudou a formar o Sistema Solar. Grãos microscópicos de um meteorito preservam evidências dos primeiros 200 mil anos da formação do sistema planetário. Um novo teste promete reduzir o tempo necessário para diagnosticar tumores cerebrais durante a cirurgia para duas horas, um avanço que pode revolucionar a medicina. Além disso, um estudo sugere que a mamografia pode levar a um baixo risco de sobre-diagnóstico de câncer de mama, com uma taxa abaixo de 5%, uma descoberta que pode alterar as práticas de rastreamento. Um projeto inovador ensinou as naves espaciais a 'sonhar' como parte do processo de atracação com a Estação Espacial Internacional, uma manobra complexa que requer precisão extrema.", "cultura": "A cultura global é destaque neste resumo, com foco na arquitetura forense, exposições históricas e eventos artísticos. A arquiteta mexicana Elis Mendoza discute a utilização de tecnologias, como mapas e reconstruções 3D, para investigar violações de direitos humanos, questionando a neutralidade da arquitetura. Em Londres, o Museu Victoria and Albert celebra os 170 anos do trench coat Burberry em uma exposição que explora a história deste item de vestuário, originado em 1879. A Coreia do Sul comemora a vitória de Koo Jaha, o primeiro artista asiático a ganhar o Prêmio Internacional Ibsen, no National Theatre em Oslo, Noruega. Na Europa, a Royal Shakespeare Company apresenta uma versão feminina e contemporânea de 'Julius Caesar', impressionando os espectadores, incluindo jovens, em turnês escolares. Além disso, a China envia dois pandas gigantes para os Estados Unidos, gerando controvérsias em um templo hindu na Esplanade des Religions em Paris. No Japão, a indústria de turismo enfrenta desafios para melhorar sua sustentabilidade, enquanto Hollywood busca incentivos fiscais para reverter a fuga de filmagens para o exterior.", "sociedade": "No Brasil, o Dia da Doação de Órgãos foi celebrado com campanhas que incentivaram conversas entre familiares sobre a intenção de doação. Em South Africa, dois tiroteios em massa resultaram em 27 mortes, levando a uma busca intensa por suspeitos. Em Chapecoense, o time visitou um memorial na Colômbia em comemoração aos 10 anos da tragédia envolvendo o avião do clube. No Distrito Federal, uma dupla em moto efetuou tiros contra uma vítima perto de uma creche, resultando em ferimentos. No Rio de Janeiro, a ex-vereadora Verônica Costa foi presa por supostamente torturar seu ex-companheiro. Em South Africa, a polícia está buscando suspeitos após dois tiroteios que resultaram em 27 mortes, destacando os problemas de violência de gangues e crime organizado no país. Em Borneo, jovens Bajau lutam por pertencimento e reconhecimento, construindo suas próprias estruturas educacionais e culturais. Em São Paulo, três hospitais municipais foram incluídos em rankings internacionais, destacando a excelência na América Latina. A 'ambulância aérea' realiza cerca de 50 transportes mensais no Brasil, atendendo a 6,8 milhões de pessoas, sendo fundamental para o transporte de órgãos e tecidos. Mais de 10.700 alunos deixaram três das universidades mais prestigiadas da Coreia do Sul sem concluir seus estudos nos últimos cinco anos, segundo dados do sistema de divulgação de educação superior da Coreia. No Rio Grande do Sul, a crise da obra social dos militares persiste sem solução, com uma dívida que atingiu 500 bilhões de pesos, levando a pedidos de informes ao ministro de Defesa sobre o assunto. A subsecretária de Saúde Pública, Alejandra Pizarro, chamou a atenção para a importância da doação de órgãos, diante de mais de 2.200 pessoas na lista de espera por um transplante. A Controladoria-Geral da União (CGU) identificou falhas em um contrato milionário do Ministério do Trabalho voltado para os Yanomami, liberando a totalidade da verba para uma ONG do ABC Paulista atuar com indígenas. A morte de Maria Elisabete e sua filha Cibele, que enfrentavam diferentes tipos de câncer, comoveu as redes sociais devido à proximidade da morte das duas em um curto intervalo de tempo. A influenciadora digital Malévola processou o cantor MC Paiva por supostos atos de transfobia, pedindo uma indenização de R$ 60 mil, com MC Paiva se defendendo na Justiça. A Controladoria-Geral da União (CGU) apontou falhas em um contrato milionário do Ministério do Trabalho destinado aos Yanomami, com o governo liberando a totalidade da verba para uma ONG do ABC Paulista atuar com indígenas. A justiça manteve a prisão de ex-vereadora Verônica Costa no Rio de Janeiro, por supostamente torturar seu ex-companheiro. A polícia sul-africana está buscando suspeitos após dois tiroteios que resultaram em 27 mortes, destacando os problemas de violência de gangues e crime organizado no país. A justiça manteve a prisão de ex-vereadora Verônica Costa no Rio de Janeiro, por supostamente torturar seu ex-companheiro. A justiça manteve a prisão de ex-vereadora Verônica Costa no Rio de Janeiro, por supostamente torturar seu ex-companheiro. A justiça manteve a prisão de ex-vereadora Verônica Costa no Rio de Janeiro, por supostamente torturar seu ex-companheiro. A justiça manteve a prisão de ex-vereadora Verônica Costa no Rio de Janeiro, por supostamente torturar seu ex-companheiro.", "meio_ambiente": "Em diversas cidades francesas, desde Bordéus até Paris, ocorreram 260 manifestações envolvendo 120 mil pessoas em prol do clima, da vida, da paz e da justiça social, após um verão extremamente quente. No Brasil, uma onda de calor está afetando 8 estados, com previsão de temperaturas acima dos 40ºC até a próxima quarta-feira (30), devido a um fenômeno climático que começou no sábado (26) e deve durar até o próximo dia 30, conforme previsão do Instituto Nacional de Meteorologia (Inmet). Em Montenegro, foram encontrados pequenos caracóis com um mecanismo incomum de proteção, alertando para a biodiversidade ameaçada na região. Além disso, especialistas alertam para o aumento do risco de encontros com serpentes em áreas urbanas e rurais devido aos eventos climáticos extremos, como o Super El Niño, que intensificam o calor e alteram o habitat dos animais.", "direitos_humanos": "No Chile, o país descendeu sete posições no Índice Global de Brecha de Gênero do Fórum Econômico Mundial, passando do 22º para o 29º lugar. Especialistas alertam que as disparidades persistem, especialmente no acesso a cargos de liderança e áreas emergentes como a inteligência artificial. Em outro desenvolvimento, um conselheiro de carreira palestino, Wasim El-Haj, alega que foi ordenado a parar de usar um keffiyeh em uma escola pública de Sydney, Austrália, porque o símbolo poderia causar discordância. Ele está processando o estado de Nova Gales do Sul por discriminação racial. A violência e a desconfiança em relação aos centros de tratamento do Ebola dificultam o combate à doença no Congo, levando pacientes a buscar tratamento apenas quando a doença já está em estágio grave. Além disso, a polícia sul-coreana realizou mais de 700 investigações ocultas sobre crimes digitais sexuais este ano, um aumento mais do que triplicado em comparação com o ano passado. No Brasil, o Papa Francisco visitou o centro de refugiados Maison Bakhita em Roma, durante sua segunda visita oficial à cidade, enfatizando o papel das mulheres em sociedade e alertando contra a cultura que isola as pessoas."}, "resumo_do_dia": {"politica_nacional": [{"id": 183404, "titulo": "Por que reformas no STF podem ser perigosas?", "url": "https://www.bbc.com/portuguese/articles/ckrer307j5rgo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-27T09:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A crise envolvendo Alexandre de Moraes e André Mendonça no Supremo Tribunal Federal (STF) intensificou as discussões sobre possíveis mudanças na corte. Especialistas sugerem o desenvolvimento de um código de ética, mas enfatizam os riscos associados a reformas mais amplas durante um período de instabilidade institucional.", "titulo_pt": "Por que mudanças no STF podem ser perigosas?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 183221, "titulo": "Candidato em PE, neto de Arraes e sobrinho de Alceu opta por usar sobrenome Valença na urna", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/candidato-em-pe-neto-de-arraes-e-sobrinho-de-alceu-opta-por-usar-sobrenome-valenca-na-urna.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Daniel Valença, candidato a deputado estadual pelo PSOL em Pernambuco, decidiu usar o sobrenome paterno Valença em sua campanha, em vez do sobrenome do avô Miguel Arraes, também conhecido como Alceu Valença.", "titulo_pt": "Candidato em PE usa sobrenome Valença na urna", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 183305, "titulo": "Eleições 2026: saiba o que pode e o que não pode no dia da votação", "url": "https://www.cnnbrasil.com.br/eleicoes/eleicoes-2026-saiba-o-que-pode-e-o-que-nao-pode-no-dia-da-votacao/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-27T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Manifestações individuais e silenciosas são permitidas no dia da votação, mas atos coletivos e boca de urna continuam proibidos. As regras sobre propaganda, uso de celular e documentos também foram detalhadas.", "titulo_pt": "Eleições 2026: saiba o que pode e o que não pode no dia da votação", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 183443, "titulo": "Mediação e arbitragem abrem novo caminho para solução de conflitos tributários", "url": "https://www.jota.info/opiniao-e-analise/artigos/mediacao-e-arbitragem-abrem-novo-caminho-para-solucao-de-conflitos-tributarios", "fonte_id": "jota", "data_pub": "2026-09-27T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mecanismos alternativos de resolução de conflitos tributários, como mediação e arbitragem, estão ganhando espaço no sistema fiscal. Decisões recentes do STF e do STJ estão vinculando a administração tributária a esses novos procedimentos.", "titulo_pt": "Mediação e arbitragem ganham espaço na resolução de conflitos tributários", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 183275, "titulo": "Só resta para o chamado “arco democrático” apoiar Lula outra vez", "url": "https://www.metropoles.com/blog-do-noblat/ricardo-noblat/so-resta-para-o-chamado-arco-democratico-apoiar-lula-outra-vez", "fonte_id": "metropoles", "data_pub": "2026-09-27T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A direita que se diz civilizada agora deve decidir se apoia Lula. O chamado ‘arco democrático’ deve reagir às próximas eleições.", "titulo_pt": "Só resta à direita que se diz civilizada apoiar Lula novamente", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 183276, "titulo": "Pesquisas de 1º turno só podem ser registradas até segunda-feira (28/9)", "url": "https://www.metropoles.com/brasil/pesquisas-de-1o-turno-so-podem-ser-registradas-ate-segunda-feira-28-9", "fonte_id": "metropoles", "data_pub": "2026-09-27T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As pesquisas de intenção de voto para o primeiro turno só podem ser registradas até 28 de setembro. É necessário manter um intervalo mínimo de cinco dias entre o cadastro e a divulgação dos resultados.", "titulo_pt": "Pesquisas de 1º turno só podem ser registradas até segunda-feira (28/9)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 183277, "titulo": "Pesquisas trazem briga mais acirrada do que em 2022 às vésperas do 1º turno", "url": "https://www.metropoles.com/brasil/pesquisas-trazem-briga-mais-acirrada-do-que-em-2022-as-vesperas-do-1o-turno", "fonte_id": "metropoles", "data_pub": "2026-09-27T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa mais recente indica que a disputa eleitoral está mais acirrada do que no ano de 2022, quando Lula liderava com uma vantagem significativa sobre seu principal concorrente.", "titulo_pt": "Pesquisas mostram disputa mais acirrada do que em 2022", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 183223, "titulo": "Macarrão, Tadala e Trump: nomes e slogans inusitados marcam disputa por vagas no Legislativo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/macarrao-tadala-e-trump-nomes-e-slogans-inusitados-marcam-disputa-por-vagas-no-legislativo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-27T02:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Slogans inusitados, como 'Macarrão', 'Tadala' e referências anais, junto com fantasias, perucas e gracinhas, estão sendo usados pelos candidatos nas eleições de 2026 para tentar angariar votos. Não é a primeira vez que humor e excentricidade são utilizados na campanha eleitoral.", "titulo_pt": "Macarrão, Tadala e Trump: nomes e slogans inusitados marcam disputa pelo Legislativo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasi grupo.", "titulo_pt": "Emendas viram principal arma do centrão na campanha", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 183229, "titulo": "Conheça a história do prédio da Assembleia Legislativa de São Paulo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/conheca-a-historia-do-predio-da-assembleia-legislativa-de-sao-paulo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-27T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Assembleia Legislativa de São Paulo demorou para obter uma sede própria, construída especificamente para abrigar os deputados do estado.", "titulo_pt": "Conheça a história do prédio da Assembleia Legislativa de São Paulo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 183230, "titulo": "Lula errou em 2023", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/eliogaspari/2026/09/lula-errou-em-2023.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-27T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2022, Lula venceu Bolsonaro com uma margem de votos pequena, mas o PT e Lula interpretaram erroneamente essa vitória como uma consagração. A interpretação foi que a vitória era uma expressão da vontade do arco democrático, quando na verdade era apenas uma vitória apertada.", "titulo_pt": "Lula errou ao interpretar sua vitória de 2022", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 183231, "titulo": "Na eleição para deputado, fisiologismo é estratégia, e localismo é projeto", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/na-eleicao-para-deputado-fisiologismo-e-estrategia-e-localismo-e-projeto.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-27T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Deputad aca como uma líder única: popular em tempos de desapropriação geral, poderosa no meio da fragmentação política e metódica em um contexto de ruído mediático.", "titulo_pt": "Claudia Sheinbaum ou o método do discurso", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 183495, "titulo": "¿Deterioro de salud o estrategia judicial? El choque entre la defensa y la Fiscalía por el estado de Cilia Flores", "url": "https://elpais.com/us/2026-09-27/deterioro-de-salud-o-estrategia-judicial-el-choque-entre-la-defensa-y-la-fiscalia-por-el-estado-de-cilia-flores.html", "fonte_id": "elpais_america", "data_pub": "2026-09-27T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os advogados da esposa de Maduro afirmam que Cilia Flores tem problemas cardíacos e gástricos, perda de peso e dentes. No entanto, a Fiscalía afirma que a acusada se nega a receber tratamento médico, conforme mostram os documentos judiciais.", "titulo_pt": "Saúde ou estratégia judicial? O choque entre a defesa e a Fiscalía por estado de Cilia Flores", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 183500, "titulo": "23 niños frente un hipopótamo de Pablo Escobar: la batalla legal para llegar a la escuela", "url": "https://elpais.com/america-colombia/2026-09-27/23-ninos-frente-un-hipopotamo-de-pablo-escobar-la-batalla-legal-para-llegar-a-la-escuela.html", "fonte_id": "elpais_america", "data_pub": "2026-09-27T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um hipopótamo de três toneladas representa um perigo para a rota escolar que passa pelo rio que liga a comunidade de Puerto Nare. A justiça decidiu a favor dos 23 crianças e deu 60 dias ao Estado para tomar medidas.", "titulo_pt": "23 Crianças frente a um hipopótamo de Pablo Escobar: a batalha legal para chegar à escola", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 183505, "titulo": "La denuncia por una ejecución extrajudicial opaca el operativo militar de De la Espriella en Santa Marta: “Era un campesino pobre, no un criminal”", "url": "https://elpais.com/america-colombia/2026-09-27/la-denuncia-por-una-ejecucion-extrajudicial-opaca-el-operativo-militar-de-de-la-espriella-en-santa-marta-era-un-campesino-pobre-no-un-criminal.html", "fonte_id": "elpais_america", "data_pub": "2026-09-27T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A família de Ricardo Andrés Martínez Rodríguez, um jovem de 18 anos morto durante um operativo da Polícia, afirma que ele era um campesino pobre e não um criminal. A denúncia visa esclarecer que o governo tenta apresentá-lo como um paramilitar.", "titulo_pt": "Denúncia sobre execução extrajudicial esgota operação militar De De la Espriella em Santa Marta: 'ele era um campesino pobre, não um criminal'", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 183651, "titulo": "Tensione alla marcia in Irlanda del Nord, folla protesta contro parata Orange", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/27/tensione-alla-marcia-in-irlanda-del-nord-folla-protesta-contro-parata_660ff342-bbc6-40ee-a0fd-538e51643191.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-27T09:24:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Há tensão durante a marcha na Irlanda do Norte, com uma multidão protestando contra a parada Orange. O primeiro-ministro Gb Burnham pediu calma.", "titulo_pt": "Tensão durante marcha na Irlanda do norte, com protesto contra parada Orange", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 183560, "titulo": "UK reports 'major incident,' arrests near Fairford air base", "url": "https://www.dw.com/en/uk-reports-major-incident-arrests-near-fairford-air-base/a-79447992?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-27T09:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma localidade próxima a uma base aérea usada pelo exército americano no Reino Unido, várias edificações foram evacuadas e equipes de desarmamento estavam verificando veículos no local. Várias pessoas foram detidas.", "titulo_pt": "Reino unido relata 'incidente major', com prisões perto da base aérea de Fairford", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 183452, "titulo": "The Raffles’ Singapore Sling Costs $40. There’s a Reason Tourists Still Love It.", "url": "https://www.nytimes.com/2026/09/27/world/asia/singapore-sling-raffles-hotel-cocktail.html", "fonte_id": "nyt_world", "data_pub": "2026-09-27T09:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "É possível ainda comprar um Singapore Sling no hotel colonial onde se acredita ter sido inventado há mais de um século. Versões personalizadas do drink surgiram nas proximidades.", "titulo_pt": "Singapore Sling no Raffles continua a agradar turistas após mais de um século", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 183656, "titulo": "Men arrested in major incident at U.K. air base used by U.S.", "url": "https://www.japantimes.co.jp/news/2026/09/27/world/arrested-incident-uk-air-base-us/", "fonte_id": "japan_times", "data_pub": "2026-09-27T09:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças armadas do Irã ameaçaram retaliar se bases utilizadas em operações de ataque forem alvo. Ministros britânicos discutiram ameaças russas a infraestrutura britânica.", "titulo_pt": "Forças armadas do Irã ameaçam retaliar se bases britânicas forem alvo", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 183550, "titulo": "UK police make arrests, evacuate homes in ‘major incident’ near air base used by US forces", "url": "https://www.france24.com/en/europe/20260927-uk-police-evacuate-homes-near-air-base-used-by-us-arrest-men-on-suspected-explosives-offenses", "fonte_id": "france24", "data_pub": "2026-09-27T09:05:00Z", "idioma": "en", "provavel_duplicata_de": null, tuições sólidas e do uso eficiente da inteligência artificial para aumentar sua produtividade sem contar com o bônus demográfico.", "titulo_pt": "Produtividade no Brasil: o que Acemoglu nos ensina?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 183446, "titulo": "Troca de informações no Cade: um ilícito reconhecido, mas nunca julgado", "url": "https://www.jota.info/opiniao-e-analise/colunas/fronteiras-concorrencia-regulacao/troca-de-informacoes-no-cade-um-ilicito-reconhecido-mas-nunca-julgado", "fonte_id": "jota", "data_pub": "2026-09-27T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal do Cade ainda não julgou o mérito das trocas de informações fora de investigações de cartel, apesar de reconhecer que se trata de um ilícito. O número de casos relacionados a esse tema tem aumentado.", "titulo_pt": "Troca de informações no Cade: um ilícito reconhecido, mas nunca julgado", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 183281, "titulo": "Proibidas por governo, bets geraram R$ 19 bilhões em arrecadação desde 2025", "url": "https://www.metropoles.com/brasil/proibida-bets-renderam-19-bilhoes-receita", "fonte_id": "metropoles", "data_pub": "2026-09-27T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A receita proveniente das apostas online, conhecidas como bets, atingiu R$ 19 bilhões em arrecadação desde 2025. No entanto, o governo impôs restrições ao setor devido aos impactos sociais negativos.", "titulo_pt": "Bets geraram R$ 19 bilhões em arrecadação desde 2025, mas foram proibidas pelo governo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 183715, "titulo": "Korea's manufacturing sentiment improves on strong chip, cosmetics exports", "url": "https://www.koreaherald.com/article/10885275", "fonte_id": "korea_herald", "data_pub": "2026-09-27T05:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A percepção dos negócios na indústria sul-coreana melhoro ite US rate uncertainty", "url": "https://www.scmp.com/business/article/3368796/how-asia-pacific-property-markets-are-drawing-fresh-capital-despite-us-rate-uncertainty?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-27T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os mercados imobiliários da Ásia-Pacífico devem permanecer atraentes apesar da incerteza sobre a política monetária após a primeira elevação das taxas de juros pelo Federal Reserve nos Estados Unidos em mais de três anos, de acordo com analistas. Volumes de transações, especialmente transações internacionais, aumentaram cerca de 30% até agora.", "titulo_pt": "Como os mercados imobiliários da ásia-pacífico estão atraindo capital apesar da incerteza das taxas de juros nos EUA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 183745, "titulo": "Biz sentiment for Q4 improves on robust semiconductor, cosmetics exports: poll", "url": "https://en.yna.co.kr/view/AEN20260927001300320", "fonte_id": "yonhap_news", "data_pub": "2026-09-27T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A percepção dos negócios na Coreia do Sul melhorou para o quarto trimestre devido a exportações robustas de semicondutores e cosméticos, de acordo com uma pesquisa.", "titulo_pt": "Percepção de negócios para o 4º quadrimestre melhora com exportações sólidas de semicondutores e cosméticos: pesquisa", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 183734, "titulo": "Nicotine Is Mounting a Comeback in the Wellness Movement", "url": "https://www.wired.com/story/nicotine-is-mounting-a-comeback-in-the-wellness-movement/", "fonte_id": "wired", "data_pub": "2026-09-27T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A nicotina está ganhando força no movimento da wellness com afirmações sem comprovação sobre melhorar o humor e aumentar a longevidade.
