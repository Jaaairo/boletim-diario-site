i Times", "pais": "Taiwan", "classe": "B"}, {"id": 262265, "titulo": "Russia sends major business delegation to Kabul for business talks with the Taliban", "url": "https://www.euronews.com/2026/11/13/russia-sends-major-business-delegation-to-kabul-for-business-talks-with-the-taliban", "fonte_id": "euronews", "data_pub": "2026-11-13T17:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um vice-prime minister russo liderou uma delegação de 70 membros para Cabul para negociações de negócios com o Taliban sobre transportes, logística, agricultura e produtos de saúde.", "titulo_pt": "Rússia envia importante delegação empresarial para cabul para negociações com o Taliban", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 262192, "titulo": "'We have done all our homework' to get EU candidate status: Kosovo's PM Albin Kurti", "url": "https://www.france24.com/en/tv-shows/talking-europe/20261113-we-have-done-all-our-homework-to-get-eu-candidate-status-kosovo-s-pm-albin-kurti", "fonte_id": "france24", "data_pub": "2026-11-13T17:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro de Kosovo, Albin Kurti, afirma que seu país já realizou todos os preparativos necessários para obter o status de candidato à União Europeia. Kosovo declarou sua independência da Sérvia em 2008 e deseja se integrar à família europeia, mas ainda não recebeu o status de candidato à UE quatro anos após a aplicação.", "titulo_pt": "Kosovo diz estar pronto para candidatura à ue", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 262330, "titulo": "Fonti P.Chigi, 'da vertice di Dublino importante risultato su team negoziale'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/13/fonti-p.chigi-da-vertice-di-dublino-importante-risultato-su-team-negoziale_1857c3dd-97b1-4f6a-865e-f6be2356d00c.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-13T17:43:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O texto indica que os esforços do negociador estão alinhados com as diretrizes estabelecidas por Meloni. O próximo passo é definir o mandato detalhadamente.", "titulo_pt": "Fonte chigi, 'em direção a dublin, importante resultado para o time negociador'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 262331, "titulo": "Ft, Nvidia ha contattato il ceo di Arm, Rene Haas, per il dopo Huang", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/13/ft-nvidia-ha-contattato-il-ceo-di-arm-rene-haas-per-il-dopo-huang_6b8d3ab0-e294-4e12-8369-0163f969c939.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-13T17:33:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Nvidia contatou o CEO da Arm, Rene Haas, em relação à sucessão após a morte de Jensen Huang. Este último era um dos candidatos potenciais para assumir a liderança da empresa.", "titulo_pt": "Nvidia contatou ceo da Arm sobre sucessão", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 262250, "titulo": "The dangers of revising Europe's security architecture", "url": "https://www.dw.com/en/the-dangers-of-revising-europe-s-security-architecture/a-79943049?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-13T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Peritos alertam contra a revisão do arcabouço de segurança da Europa, pois argumentam que isso significaria conceder ao Moscou o desejo de renegociar a segurança pós-guerra na Europa que tem mantido há muito.", "titulo_pt": "Perigos de revisar a arquitetura de segurança da Europa", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 262332, "titulo": "Merkel, 'oggi voterei a favore del matrimonio per tutti'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/13/merkel-oggi-voterei-a-favore-del-matrimonio-per-tutti_79b409ce-763c-4763-bb75-4351d9bdd0de.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-13T17:29:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Em 2017, a ex-cancelliera Angela Merkel votou contra o casamento igualitário. Na época, ela tinha preocupações de various naturezas.", "titulo_pt": "Merkel, 'hoje votarei a favor do casamento para todos'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 262193, "titulo": "As EU grapples with fierce AI competition, summit overshadowed by elusive Ukraine-Russia peace deal", "url": "https://www.france24.com/en/video/20261113-as-eu-grapples-with-fierce-ai-competition-summit-overshadowed-by-elusive-ukraine-russia-peace-deal-1", "fonte_id": "france24", "data_pub": "2026-11-13T17:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Líderes da Europa se reúnem para um summit de IA em Dublin, com destaque limitado devido à guerra da Ucrânia contra a Rússia. Fabrice Pothier, CEO de Rasmussen Global, destaca a limitada capacidade de cálculo da Europa e a dificuldade em transformar recursos em escala tecnológica e industrial.", "titulo_pt": "EUA enfrenta forte concorrência em IA, summit em dublin sob influência da paz entre Ucrânia e Rússia", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 262266, "titulo": "Iran MPs debate possible shift in nuclear doctrine and exit from NPT", "url": "https://www.euronews.com/2026/11/13/iran-mps-debate-possible-shift-in-nuclear-doctrine-and-exit-from-npt", "fonte_id": "euronews", "data_pub": "2026-11-13T17:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A assembleia iraniana está debatendo possíveis mudanças na doutrina nuclear e na possibilidade de sair do Tratado de Não-Proliferação de Armas Nucleares (NPT). A redução do risco de um ataque nuclear por parte dos EUA e Israel parece ter diminuído temporariamente, mas o objetivo americano de impedir qualquer programa nuclear iraniano está provocando um intenso debate na sociedade e nos círculos de poder iranianos.", "titulo_pt": "Deputados iranianos discutem possível mudança na doutrina nuclear e saída do NPT", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 262333, "titulo": "La new entry Tony Boy scalza Kid Yugi dalla vetta della hit parade", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/13/la-new-entry-tony-boy-scalza-kid-yugi-dalla-vetta-della_c232b351-26fa-4bef-a71a-49a7b61399d3.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-13T17:19:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Tony Boy se posiciona em terceiro lugar na parada de hits, deslocando Kid Yugi do topo. Clementino e Rocco Hunt também são omitidos da lista.", "titulo_pt": "Tony Boy se posiciona no topo da parada de hits, deslocando Kid Yugi", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 262334, "titulo": "Il gas in calo (-3%) a 89 euro al Megawattora", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/13/il-gas-in-calo-3-a-89-euro-al-megawattora_43008c91-90f7-48e4-847e-5ed984d9bf64.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-13T17:12:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O gás registou uma queda de 3% no mercado de referência de Amsterdã, cotado a 89 euros por Megawattora. Este mercado é um dos principais para o seguimento do preço do gás na Europa.", "titulo_pt": "Gás em queda (-3%) a 89 euros por Megawattora no mercado de amsterdã", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 262288, "titulo": "The fight over Canadian steelworker jobs", "url": "https://www.aljazeera.com/economy/2026/11/13/the-fight-over-canadian-steelworker-jobs?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-13T17:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa proprietária dos Estados Unidos da Stelco culpa os impostos sobre importações impostos por Trump pelas demissões, mas seu apoio a esses mesmos impostos levanta dúvidas.", "titulo_pt": "A luta pelas vagas de trabalho de trabalhadores da açoaria canadense", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 261736, "titulo": "Após ameaça de Trump, Sheinbaum afirma que não há caravanas de migrantes a caminho dos EUA", "url": "https://www.cartacapital.com.br/mundo/apos-ameaca-de-trump-sheinbaum-afirma-que-nao-ha-caravanas-de-migrantes-a-caminho-dos-eua/", "fonte_id": "cartacapital", "data_pub": "2026-11-13T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após ameaças de Trump, Sheinbaum afirmou que não há caravanas de migrantes a caminho dos EUA. A declaração foi dada em resposta às ameaças de tarifas sobre produtos mexicanos, caso o México não controle o fluxo migratório.", "titulo_pt": "Sheinbaum nega caravanas de migrantes após ameaças de Trump", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 262327, "titulo": "Bessent blames Lutnick’s commerce department for failure to blacklist Megaspeed", "url": "https://www.ft.com/content/ce6d292e-eaaa-4c23-b909-34276e1a1e8d?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-13T17:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário do Tesouro dos EUA evitou incluir a Megaspeed na lista negra, o que pode agravar tensões dentro da administração Trump em relação ao escândalo da Nvidia. O responsável pelo Comércio dos EUA, Bessent, atribuiu a falha à pasta de Lutnick.", "titulo_pt": "Bessent culpa pasta de Lutnick pelo não blacklistamento da Megaspeed", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 262335, "titulo": "Lo spread tra Btp e Bund chiude poco mosso a 104 punti base", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/13/lo-spread-tra-btp-e-bund-chiude-poco-mosso-a-104-punti-base_54ff0a28-f8dc-48d5-9f02-6f6d9c5b29f9.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-13T17:06:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O spread entre os títulos do Tesouro Italiano e alemão encerrou ligeiramente estável em 104 pontos base. O rendimento do título do Tesouro Italiano foi de 4,41%.", "titulo_pt": "O spread entre Btp e Bund encerra estável em 104 pontos base", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 262358, "titulo": "ASE investing NT$100 billion in Kaohsiung", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/14/2003867696", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ASE está investindo NT$100 bilhões em Kaohsiung. Este investimento destina-se a projetos no porto de Kaohsiung.", "titulo_pt": "ASE investindo NT$100 bilhões em Kaohsiung", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 261851, "titulo": "PPI dos EUA avança 0,3% em outubro e acumula alta anual de 6,5%", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/ppi-dos-eua-avanca-03-em-outubro-e-acumula-alta-anual-de-65/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-13T17:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O índice de preços ao produtor dos EUA (PPI) subiu 0,3% em outubro em comparação com setembro e registrou uma alta de 5,0% no ano.", "titulo_pt": "PPI dos EUA avança 0,3% em outubro e acumula alta anual de 5,0%", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 261697, "titulo": "Com novo CEO, Natura enfrenta concorrência e gargalos de logística para reconquistar consumidor", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/com-novo-ceo-natura-enfrenta-concorrencia-e-gargalos-de-logistica-para-reconquistar-consumidor.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O novo CEO da Natura, Alessandro Carlucci, busca reconduzir a empresa de cosméticos a seus tempos de maior sucesso, enfrentando concorrência intensa e desafios internos e externos, incluindo problemas logísticos.", "titulo_pt": "Com novo CEO, Natura enfrenta concorrência e gargalos de logística para reconquistar consumidor", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 261698, "titulo": "Pane da Microsoft deixa empresas e profissionais com trabalho acumulado", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/11/pane-da-microsoft-deixa-empresas-e-profissionais-com-trabalho-acumulado.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T17:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Microsoft enfrentou uma pane que afetou a rotina de empresas e profissionais que utilizam o Outlook, causando acúmulo de mensagens e atrasos em tarefas. Com a retomada gradual das ferramentas, usuários relataram dificuldades para manter a comunicação normal.", "titulo_pt": "Panne da Microsoft deixa empresas e profissionais com trabalho acumulado", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 262328, "titulo": "US Treasuries set for worst week since Trump’s ‘liberation day’", "url": "https://www.ft.com/content/7bebace2-dc87-410a-ae29-ffd9f3176def?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-13T17:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os títulos do Tesouro dos Estados Unidos podem ter sua pior semana desde o que alguns consideram o dia da libertação de Donald Trump, devido a uma inflação maior do que o esperado e declarações hawkish dos membros do Federal Reserve. Isso afetou investidores que apostavam em uma reversão da queda geral dos rendimentos das dívidas globais.", "titulo_pt": "Títulos do tesouro dos EUA para ter pior semana desde 'dia da libertação' de Trump", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 261701, "titulo": "Eleitores dos EUA rejeitaram data centers, mas muitos serão construídos mesmo assim", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/eleitores-dos-eua-rejeitaram-data-centers-mas-muitos-serao-construidos-mesmo-assim.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Muitas empresas de tecnologia reduziram suas propostas para data centers diante da oposição nos Estados Unidos, oferecendo mais benefícios locais e aumentando o pagamento pela energia. No entanto, ainda serão construídos muitos data centers mesmo com a rejeição dos eleitores.", "titulo_pt": "Eleitores dos EUA rejeitaram data centers, mas muitos serão construídos mesmo assim", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 261702, "titulo": "CSN está negociando venda de mais ativos no curto prazo, diz novo CEO", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/csn-esta-negociando-venda-de-mais-ativos-no-curto-prazo-diz-novo-ceo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A CSN está negociando a venda de mais ativos após a conclusão da venda de dois ativos que somam quase R$ 15 bilhões. Novas transações podem ser anunciadas em breve.", "titulo_pt": "CSN negocia venda de mais ativos no curto prazo, diz novo CEO", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 262185, "titulo": "The global economy's Achilles' heels", "url": "https://www.axios.com/2026/11/13/global-trade-supply-hormuz-mckinsey", "fonte_id": "axios", "data_pub": "2026-11-13T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A história desta década tem sido marcada por uma série de choques econômicos globais, como pandemia, guerra e mudanças geopolíticas. Um relatório da consultoria McKinsey identifica uma crescente lista de vulnerabilidades no sistema de comércio global, com muitos bens cruciais construídos em cadeias de suprimentos que têm um ou mais pontos fracos.", "titulo_pt": "Os pontos fracos do sistema global de comércio", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 261704, "titulo": "Braskem vê margens menores em 2027 e 'segue engajada' em acordo com credores, diz diretoria", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/braskem-ve-margens-menores-em-2027-e-segue-engajada-em-acordo-com-credores-diz-diretoria.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T16:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Braskem informou que as margens elevadas na petroquímica, impulsionadas pela guerra no Irã, já passaram. A empresa espera que 2027 seja um ano pior do que a média histórica do setor. A diretoria também declarou que a companhia segue engajada em um acordo com seus credores.", "titulo_pt": "Braskem projeta menores margens em 2027 e mantém acordo com credores", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 261844, "titulo": "Risco fiscal: como as contas públicas podem influenciar dólar, juros e Bolsa?", "url": "https://www.infomoney.com.br/mercados/risco-fiscal-como-as-contas-publicas-podem-influenciar-dolar-juros-bolsa/", "fonte_id": "infomoney", "data_pub": "2026-11-13T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os investidores se preocupam mais com a trajetória da dívida pública do que com seu tamanho, influenciando o comportamento do dólar, juros e Bolsa.", "titulo_pt": "Risco fiscal: como as contas públicas podem influenciar dólar, juros e Bolsa?", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 261706, "titulo": "Após bancos privados, Caixa faz as contas para subir taxa de juros do crédito imobiliário", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/apos-bancos-privados-caixa-faz-as-contas-para-subir-taxa-de-juros-do-credito-imobiliario.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T16:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Caixa Econômica Federal está avaliando se e quando aumentará as taxas de juros do financiamento imobiliário, considerando o aumento do custo de captação de recursos e a elevação das taxas no mercado financeiro. O banco está analisando quanto pode absorver dessa alta sem afetar a rentabilidade e a oferta de crédito.", "titulo_pt": "Caixa considera aumento de juros no crédito imobiliário", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 261707, "titulo": "Binance diz que concluiu reposição de US$ 6,3 bilhões roubados por hackers", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/binance-diz-que-concluiu-reposicao-de-us-63-bilhoes-roubados-por-hackers.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T15:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Binance informou que concluiu a reposição de US$ 6,3 bilhões em criptoativos roubados de clientes, finalizando assim a devolução aos clientes afetados pelo maior roubo cibernético da história.", "titulo_pt": "Binance conclui reposição de US$ 6,3 bilhões roubados por hackers", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 261709, "titulo": "SpaceX planeja investir US$ 74 bilhões em data centers no Texas e Arizona", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/spacex-planeja-investir-us-74-bilhoes-em-data-centers-no-texas-e-arizona.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T15:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A SpaceX planeja investir US$ 74 bilhões na construção de novos complexos de data centers no Arizona e no Texas. A empresa continua a direcionar recursos para a disputa global pela inteligência artificial.", "titulo_pt": "Spacex planeja investir US$ 74 bilhões em data centers no Texas e Arizona", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 261710, "titulo": "Pagamento do 13º salário injeta R$ 339 bilhões na economia; veja calendário e quem recebe", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/pagamento-do-13o-salario-injeta-r-339-bilhoes-na-economia-veja-calendario-e-quem-tem-recebe.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T15:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O pagamento do 13º salário injetará R$ 339,21 bilhões na economia brasileira em 2026, equivalente a 2,9% do PIB. Este levantamento foi realizado pelo Dieese.", "titulo_pt": "Pagamento do 13º salário injetará R$ 339 bilhões na economia brasileira em 2026; veja detalhes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 261712, "titulo": "Pane na Microsoft leva empresas, governo e hospitais brasileiros a concentrar comunicação no WhatsApp", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/11/pane-na-microsoft-afeta-mais-de-30-milhoes-de-assinantes-entre-empresas-escolas-e-hospitais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T15:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Com o serviço de emails Outlook, da Microsoft, fora do ar desde a tarde de quinta-feira (12), diversas instituições, incluindo empresas, escolas, hospitais e o governo brasileiro, migraram para o WhatsApp e ligações telefônicas para manter suas comunicações institucionais.", "titulo_pt": "Problemas na Microsoft levam empresas, governo e hospitais a usar WhatsApp", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 261713, "titulo": "Ex-funcionários da Oi cobram acordo após Justiça fixar R$ 98,5 milhões a gestor", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/ex-funcionarios-da-oi-cobram-acordo-apos-justica-fixar-r-985-milhoes-a-gestor.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T15:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ex-funcionários da Oi protestaram em frente ao Fórum do Rio de Janeiro para exigir o cumprimento de um acordo que previa o pagamento parcelado de verbas rescisórias para cerca de mil trabalhadores demitidos em agosto. A Justiça já havia determinado o pagamento de R$ 98,5 milhões a um gestor envolvido no caso.", "titulo_pt": "Ex-funcionários da Oi protestam por acordo após Justiça fixar valor a gestor", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 262344, "titulo": "EU leaders seek to tackle challenges in first AI summit", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/14/2003867714", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Líderes europeus se reuniram em uma primeira cúpula sobre IA para abordar desafios relacionados à tecnologia. O objetivo é discutir como enfrentar questões relacionadas à inteligência artificial na região.", "titulo_pt": "Líderes europeus buscam enfrentar desafios em primeira cúpula sobre IA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 262357, "titulo": "Chip suppliers shrug off Huang’s exit", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/14/2003867695", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas fornecedoras de chips não se preocuparam com a saída de Huang. Não há detalhes adicionais sobre o impacto ou as razões para a saída.", "titulo_pt": "Fornecedores de chips ignoram saída de Huang", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 262359, "titulo": "Lutnick faces chip export scrutiny", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/14/2003867697", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa enfrenta uma revisão das exportações de chips. O foco está na análise dos processos de exportação de componentes eletrônicos.", "titulo_pt": "Lutnick enfrenta revisão de exportação de chips", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 262360, "titulo": "Rugged computer demand to lift Getac sales next year", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/14/2003867698", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A demanda por computadores resistentes deve aumentar as vendas da Getac no próximo ano.", "titulo_pt": "Demanda por computadores resistentes deve impulsionar vendas da Getac no ano próximo", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 262362, "titulo": "Soft sell", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/14/2003867700", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto trata de uma técnica de venda suave, sem fornecer detalhes adicionais.", "titulo_pt": "Suave venda", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 262322, "titulo": "Arm boss Rene Haas approached in Nvidia CEO search", "url": "https://www.ft.com/content/2a64f698-46dd-4178-a3f4-4c5f4c0a0926?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-13T17:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe da empresa de semicondutores britânica de propriedade do SoftBank foi abordado para o processo de busca pelo novo CEO da Nvidia após a demissão de Jensen Huang devido a problemas pessoais.", "titulo_pt": "Chefe da empresa de semicondutores britânica abordado para busca pelo novo CEO da Nvidia", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 262373, "titulo": "EU leaders told to ‘act now’ to stay in AI race with US and China", "url": "https://www.scmp.com/news/world/europe/article/3374405/eu-leaders-told-act-now-stay-ai-race-us-and-china", "fonte_id": "scmp", "data_pub": "2026-11-13T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da empresa francesa de IA Mistral, Arthur Mensch, recomendou que a União Europeia 'agisse agora' para se manter na corrida de IA com os Estados Unidos e China. Durante uma cúpula dos líderes da UE, Mensch e Geoffrey Hinton, um vencedor do Prêmio Nobel e reconhecido como um dos fundadores da IA, discutiram como a Europa pode equilibrar seus objetivos de IA com a proteção dos cidadãos contra os crescentes riscos associados à tecnologia.", "titulo_pt": "Líderes da ue são incentivados a 'agir agora' na corrida de IA com EUA e China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 262422, "titulo": "The Microsoft Outage Is a Warning for the World", "url": "https://www.wired.com/story/the-microsoft-outage-is-a-warning-for-the-world/", "fonte_id": "wired", "data_pub": "2026-11-13T17:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Inúmeros negócios, escolas, hospitais e governos descobriram, de maneira difícil, as consequências de depender dos sistemas de uma única empresa. A próxima vez pode ser ainda pior.", "titulo_pt": "A interrupção da Microsoft é um aviso para o mundo", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 262325, "titulo": "AI believers hold the line after Nvidia ructions", "url": "https://www.ft.com/content/750e4304-7287-432a-8ac1-36db40d0d968?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-13T16:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ações de empresas de inteligência artificial mantêm-se estáveis, independentemente das preocupações sobre o risco concentrado. Investidores de ações não se deixam abalar por essas preocupações.", "titulo_pt": "Crenças em IA mantêm-se após turbulências na Nvidia", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 261998, "titulo": "Aura, la Mujer del Futuro, llega a Chile con su IA: así será la segunda Swiss Innovation Week", "url": "https://www.latercera.com/nacional/noticia/aura-la-mujer-del-futuro-llega-a-chile-con-su-ia-asi-sera-la-segunda-swiss-innovation-week/", "fonte_id": "la_tercera", "data_pub": "2026-11-13T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A segunda edição da Swiss Innovation Week acontecerá na próxima semana e terá como protagonista uma inteligência artificial feminina. A escolha visa promover equidade de gênero e inclusão.", "titulo_pt": "Aura, a mulher do Futuro, chega ao Chile com sua IA: assim será a segunda Swiss Innovation Week", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 262173, "titulo": "How Jensen Huang’s exit from Nvidia impacts China’s AI supply chain", "url": "https://restofworld.org/2026/jensen-huang-nvidia-exit-china-ai-chip-impact/?utm_source=rss&utm_medium=rss&utm_campaign=feeds", "fonte_id": "rest_of_world", "data_pub": "2026-11-13T16:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Nvidia, Jensen Huang, participou de uma conferência no Instituto da Paz em Washington, DC, em 8 de outubro de 2026. Sua saída da Nvidia pode afetar a cadeia de suprimentos de AI da China.", "titulo_pt": "Como a saída de Jensen Huang da Nvidia impacta a cadeia de suprimentos de AI da China", "veiculo": "Rest of World", "pais": "EUA", "classe": "A"}, {"id": 262423, "titulo": "Jensen Huang and the End of the Founder Fairy Tale", "url": "https://www.wired.com/story/jensen-huang-and-the-end-of-the-founder-fairy-tale/", "fonte_id": "wired", "data_pub": "2026-11-13T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang, ex-CEO de tecnologia, está focado na força da narrativa, mas não conseguiu se livrar das escândalos sexuais que enfrenta.", "titulo_pt": "Jensen Huang e o fim da lenda do fundador", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 262377, "titulo": "Will Jensen Huang’s downfall tip the scales against open-source AI?", "url": "https://www.scmp.com/tech/big-tech/article/3374376/will-jensen-huangs-downfall-tip-scales-against-open-source-ai", "fonte_id": "scmp", "data_pub": "2026-11-13T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A renúncia repentina de Jensen Huang da Nvidia gerou incerteza sobre os bilionários investimentos da empresa em inteligência artificial de código aberto, possivelmente deixando desenvolvedores chineses sem um de seus principais aliados em Washington. Seu desligamento poderia levar a uma redução nos investimentos da Nvidia em modelos de peso leve de IA e infraestrutura associada, according to analysts.", "titulo_pt": "Desligamento de Huang pode influenciar investimentos da nvidia em AI de código aberto", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 262447, "titulo": "U.S. obtains court approval to seize, restrain over US$1.2 bln stolen in N.K. Binance theft", "url": "https://en.yna.co.kr/view/AEN20261113008800315", "fonte_id": "yonhap_news", "data_pub": "2026-11-13T13:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Justiça dos Estados Unidos obteve aprovação judicial para apreender e reter mais de 1,2 bilhão de dólares roubados no furto da Binance na Coreia do Norte.", "titulo_pt": "EUA obtém aprovação judicial para apreender 1,2 bilhão roubados em furto da binance na Coreia do norte", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 261827, "titulo": "ChatGPT ganha carteira digital para IA fazer compras pelo usuário", "url": "https://exame.com/inteligencia-artificial/chatgpt-ganha-carteira-digital-para-ia-fazer-compras-pelo-usuario/", "fonte_id": "exame", "data_pub": "2026-11-13T13:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ChatGPT Wallet permite autorizar pagamentos com biometria, mas o recurso está disponível apenas para assinantes Pro elegíveis nos Estados Unidos.", "titulo_pt": "Chatgpt wallet ganha capacidade de autorizar pagamentos com biometria", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 262326, "titulo": "Will Jensen Huang sell his $135bn of stock?", "url": "https://www.ft.com/content/7a1ee00c-ddbd-4ae2-8323-e4dc603d7a41?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-13T13:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Qualquer tentativa do cofundador da Nvidia vender suas ações causaria preocupação aos investidores, mas também apresenta riscos legais e de preço.", "titulo_pt": "Cofundador da nvidia planeja vender suas ações por $135 bilhões?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 262458, "titulo": "From stimulation to suppression: How nitrogen addition changes soil respiration over time", "url": "https://phys.org/news/2026-11-suppression-nitrogen-addition-soil-respiration.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A respiração do solo (Rs), a liberação de CO₂ do solo para a atmosfera, é um dos maiores fluxos de carbono terrestres e um principal determinante da sequestração de carbono líquida. O papel do nitrogênio na sequestração de carbono terrestre é bem conhecido, mas sua influência nas dinâmicas temporais da Rs ainda não foi bem compreendida.", "titulo_pt": "De estimulação a supressão: como a adição de nitrogênio altera a respiração do solo ao longo do tempo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 262499, "titulo": "Noise pollution is reshaping the health and behaviour of animals everywhere", "url": "https://www.newscientist.com/article/2598675-noise-pollution-is-reshaping-the-health-and-behaviour-of-animals-everywhere/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-13T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A poluição sonora é transformando a saúde e o comportamento dos animais em todo o planeta. Há quase nenhum lugar no mundo livre de ruídos disruptivos humanos, mas é uma das questões ambientais mais fáceis de resolver.", "titulo_pt": "A poluição sonora está remodelando a saúde e o comportamento dos animais em todo o planeta", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 262218, "titulo": "Cientistas publicam atlas cerebral com dados de 25,5 milhões de células", "url": "https://www.metropoles.com/saude/cientistas-publicam-atlas-cerebral-com-dados-de-255-milhoes-de-celulas", "fonte_id": "metropoles", "data_pub": "2026-11-13T17:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas publicaram um atlas cerebral que inclui dados de 25,5 milhões de células de humanos e outros primatas. Este atlas pode auxiliar na investigação de doenças como Parkinson e esquizofrenia.", "titulo_pt": "Cientistas publicam atlas cerebral com dados de 25,5 milhões de células", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 262451, "titulo": "STAT+: Doctors have questions about the Watchman. Boston Scientific has a sales pitch.", "url": "https://www.statnews.com/2026/11/13/investigation-boston-scientific-watchman-cardiac-implant-marketing-science/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-13T17:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O The Boston Globe examina se a marketing de Boston Scientific para seu dispositivo de implante cardíaco, o Watchman, ultrapassou a ciência subjacente. O artigo sugere que há questionamentos sobre a validade das estratégias de vendas da empresa.", "titulo_pt": "Marketing do Watchman de boston Scientific pode ter antecipado a ciência", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 262500, "titulo": "Did El Niño cause an early breakdown in the polar vortex?", "url": "https://www.newscientist.com/article/2599008-did-el-nino-cause-an-early-breakdown-in-the-polar-vortex/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-13T17:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os ventos do vórtice polar têm experimentado uma depreciação inédita, o que pode levar a condições climáticas frias na Europa. Alguns cientistas suspeitam que o El Niño recorde seja responsável por isso.", "titulo_pt": "O El Niño causou uma quebra prematura no vórtice polar?", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 262459, "titulo": "How Chinese brewers refined their booze 5,000 years ago", "url": "https://phys.org/news/2026-11-chinese-brewers-refined-booze-years.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 5.000 anos atrás, os cervejeiros da China Oriental pareciam ter usado mofo vermelho para produzir álcool de arroz, depois destrincharam a bebida através de pano. Resíduos microscópicos em cerâmicas antigas mostram evidências tanto do método de fermentação quanto do processo de filtragem para separar a líquida do grão restante.", "titulo_pt": "Como os cervejeiros chineses refinaram sua bebida há 5.000 anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 262460, "titulo": "Kindergarten teachers offer cognitive help during outdoor play but fall short on emotional and social support", "url": "https://phys.org/news/2026-11-kindergarten-teachers-cognitive-outdoor-play.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa publicada na International Journal of Innovation and Sustainable Development analisou o comportamento dos professores durante o brincar ao ar livre em creches e identificou uma discrepância entre a assistência necessária aos alunos e a prestada pelos educadores, especialmente em desenvolvimento emocional e social.", "titulo_pt": "Professores de berçário oferecem apoio cognitivo durante brincadeiras ao ar livre, mas carecem de suporte emocional e social", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 262461, "titulo": "Self-learning AI separates particle jets from background noise in simulated heavy-ion collisions", "url": "https://phys.org/news/2026-11-ai-particle-jets-background-noise.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time de físicos e cientistas de computação liderado por pesquisadores do Laboratório Nacional Brookhaven, dos Estados Unidos, desenvolveu uma nova abordagem de inteligência artificial (IA) que aprende sozinha a separar sinais de jatos de partículas de alta energia dos enormes níveis de ruído de partículas registrados em colisões de íons pesados relativísticos, onde duas jatos de íons pesados colidem quase na velocidade da luz.", "titulo_pt": "IA autodidata separa jatos de partículas de ruído de fundo em colisões simuladas de íons pesados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 262462, "titulo": "Colorful fish reveal how species stay distinct despite interbreeding", "url": "https://phys.org/news/2026-11-fish-reveal-species-stay-distinct.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Peixes coloridos que vivem nos fundos de riachos do Meio-Oeste americano podem auxiliar na compreensão dos mecanismos evolutivos que permitem que espécies permaneçam distintas, mesmo quando se cruzam geneticamente. Orangethroat e rainbow darters, que frequentemente se cruzam onde seus habitats se sobrepõem, ainda permanecem como espécies separadas após milhões de anos de divergência.", "titulo_pt": "Peixes coloridos revelam como espécies permanecem distintas apesar do cruzamento genético", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 262463, "titulo": "Rh₃ clusters balance activity and butene selectivity in butane dehydrogenation", "url": "https://phys.org/news/2026-11-rh-clusters-butene-butane-dehydrogenation.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas do Instituto de Pesquisa de Metais (IMR) da Academia Chinesa de Ciências, em colaboração com pesquisadores da Universidade de Pequim e da Universidade de Chongqing, demonstraram como a geometria e as propriedades eletrônicas dos sítios ativos de ródio (Rh) subnanométricos moldam a ativação de C–H, a desorção de produtos e a quebra de ligações C–C durante a dehidrogenação de butano.", "titulo_pt": "Grupos rh₃ balanceiam atividade e seleção de buteno na dehidrogenação de butano", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 262464, "titulo": "Heat drives electron orbital currents, revealing first experimental evidence of orbital Nernst effect", "url": "https://phys.org/news/2026-11-electron-orbital-currents-revealing-experimental.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da National Taiwan University (NTU) relataram a primeira evidência experimental do efeito Nernst orbital, causado por correntes de calor que acumulam o momento angular orbital dos elétrons transversalmente. O estudo foi publicado recentemente na Nature Communications.", "titulo_pt": "Calor impulsiona correntes orbitais de elétrons, revelando primeiro evidência experimental do efeito Nernst orbital", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 262501, "titulo": "Researchers build the first ever quantum clock that uses sunlight", "url": "https://www.newscientist.com/article/2598583-researchers-built-the-first-ever-quantum-clock-that-uses-sunlight/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-13T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores desenvolveram o primeiro relógio quântico que utiliza luz solar, substituindo os lasers e átomos isolados tradicionais. Este experimento demonstra que os relógios quânticos podem funcionar com recursos mais simples e acessíveis.", "titulo_pt": "Pesquisadores criam primeiro relógio quântico que usa luz solar", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 262541, "titulo": "Astronomers trace mystery radio signals back to cosmic odd couple of white dwarf and sun-like star", "url": "https://www.space.com/astronomy/stars/astronomers-trace-mystery-radio-signals-back-to-cosmic-odd-couple-of-white-dwarf-and-sun-like-star", "fonte_id": "space_com", "data_pub": "2026-11-13T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos rastrearam sinais radiofônicos misteriosos de volta a uma combinação incomum de uma estrela branco e uma estrela semelhante ao Sol. É impressionante que, usando ondas radiofônicas, podemos detectar tempestades em uma estrela a mais de 5.000 anos-luz de distância.", "titulo_pt": "Astrônomos rastreiam sinais radiofônicos misteriosos de volta a estrela branco e estrela semelhante ao sol", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 262444, "titulo": "IAEA recommends safety improvements at S. Korean nuclear reactor in Busan", "url": "https://en.yna.co.kr/view/AEN20261114000300315", "fonte_id": "yonhap_news", "data_pub": "2026-11-13T16:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Agência Internacional de Energia Atômica (IAEA) recomendou melhorias na segurança de uma usina nuclear em Busan, Coreia do Sul. As informações foram divulgadas em Washington no dia 13 de novembro.", "titulo_pt": "IAEA recomenda melhorias de segurança para usina nuclear em Busan, Coreia do sul", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 262465, "titulo": "Scientists successfully swap all fish products in aquafeed to boost sustainable fish farming", "url": "https://phys.org/news/2026-11-scientists-successfully-swap-fish-products.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas substituíram completamente os produtos de peixe na alimentação aquática, avanço que pode promover a pesca sustentável. A produção e o consumo de peixe atingiram novos recordes globalmente, de acordo com a ONU, com mais de 23 milhões de pessoas trabalhando na indústria da aquicultura.", "titulo_pt": "Cientistas substituem todos os produtos de peixe na ração aquática para impulsionar a pesca sustentável", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 262494, "titulo": "Outbursts from a Massive Star", "url": "https://www.nasa.gov/image-article/outbursts-from-a-massive-star/", "fonte_id": "nasa_news", "data_pub": "2026-11-13T16:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos usaram o observatório espacial Chandra da NASA para identificar o que está causando repetidas erupções em uma estrela gigante e volátil chamada AT 2016blu, localizada na galáxia NGC 4559, a cerca de 30 milhões de anos-luz da Terra.", "titulo_pt": "Erupções de uma estrela massiva", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 262356, "titulo": "Changes incoming", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/14/2003867734", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há mudanças a caminho, mas sem detalhes específicos sobre o que está para acontecer.", "titulo_pt": "Mudanças em curso", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 262219, "titulo": "Exposição no DF reúne colagens inspiradas em obra de Athos Bulcão", "url": "https://www.metropoles.com/entretenimento/cultura/exposicao-no-df-reune-colagens-inspiradas-em-athos-bulcao", "fonte_id": "metropoles", "data_pub": "2026-11-13T17:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A exposição gratuita reúne colagens de nove artistas do Coletivo Iló, inspiradas na obra de Athos Bulcão, na Fundação Athos Bulcão, em Brasília.", "titulo_pt": "Exposição no DF reúne colagens inspiradas em obra de Athos Bulcão", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 262504, "titulo": "Rhizome Announces Partnership With Electronic Arts Intermix Following Vimeo Censorship Concerns", "url": "https://www.artnews.com/art-news/news/rhizome-electronic-arts-intermix-partnership-vimeo-censorship-1234805760/", "fonte_id": "artnews", "data_pub": "2026-11-13T17:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rhizome anunciou uma parceria com o Electronic Arts Intermix após a Vimeo suspender a conta do EAI por causa de dois vídeos de Barbara Hammer, uma cineasta lésbica.", "titulo_pt": "Rhizome anuncia parceria com Electronic Arts Intermix após censura da Vimeo", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 262577, "titulo": "Lorna Simpson Wins 2027 Wolfgang Hahn Prize", "url": "https://www.artforum.com/news/lorna-simpson-awarded-2027-wolfgang-hahn-prize-1234763599/", "fonte_id": "artforum", "data_pub": "2026-11-13T17:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A artista Lorna Simpson, conhecida por suas obras fotográficas que questionam estereótipos raciais e sexistas e exploram temas como raça, classe, gênero, política e história, foi revelada como a vencedora do trigésimo terceiro Wolfgang Hahn Prize, concedido pela Society for Modern Art no Museu Ludwig em Colônia.", "titulo_pt": "Lorna Simpson vence prêmio Wolfgang Hahn 2027", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 261982, "titulo": "“¿Pa’ qué fumas?“: Minsal lanza campaña contra el tabaco y vapeadores dirigido especialmente a adolescentes", "url": "https://www.latercera.com/nacional/noticia/pa-que-fumas-minsal-lanza-campana-contra-el-tabaco-y-vapeadores-dirigido-especialmente-a-adolescentes/", "fonte_id": "la_tercera", "data_pub": "2026-11-13T17:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A campanha do Minsal, intitulada 'Para que você fuma?', usa personagens animados de pulmões e cérebros danificados para ilustrar os danos cognitivos causados pela nicotina e metais pesados no corpo dos adolescentes.", "titulo_pt": "Para que você fuma? Minsal lança campanha contra tabaco e vapede para adolescentes", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 261952, "titulo": "León XIV: los cinco momentos más emotivos de la visita histórica del Papa a la Argentina y las reacciones que generó", "url": "https://www.lanacion.com.ar/sociedad/leon-xiv-los-cinco-momentos-mas-emotivos-de-la-visita-historica-del-papa-a-la-argentina-y-las-nid12112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-13T17:18:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O título traduzido para português brasileiro é: 'Leão XIV: os cinco momentos mais emocionantes da visita histórica do Papa à Argentina e as reações que gerou'. O texto destaca as cenas-chave que marcaram a estadia do Papa na Argentina, variando desde o conurbano de Buenos Aires até Ezeiza, e como fiéis e autoridades responderam a esses momentos.", "titulo_pt": "Leão XIV: os cinco momentos mais emocionantes da visita histórica do Papa à Argentina e as reações que gerou", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 262531, "titulo": "‘The Sacred Ordinary’ Shines a Light on Heritage in Birmingham’s Civil Rights District", "url": "https://www.thisiscolossal.com/2026/11/the-sacred-ordinary-1504-birmingham-civil-rights/", "fonte_id": "colossal", "data_pub": "2026-11-13T17:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A obra de arte participativa inclui uma visita guiada por texto a cada noite de 5 às 8 horas, até 13 de dezembro, no distrito de direitos civis de Birmingham. O artigo 'The Sacred Ordinary' destaca o patrimônio hereditário nesse distrito.", "titulo_pt": "‘O sagrado do ordinário’ ilumina o patrimônio hereditário no distrito de direitos civis de Birmingham", "veiculo": "Colossal (arte)", "pais": "EUA", "classe": "B"}, {"id": 261722, "titulo": "Marcos Pitombo volta à Globo após sete anos para fazer nova novela das sete", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/11/marcos-pitombo-volta-a-globo-apos-sete-anos-para-fazer-nova-novela-das-sete.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-13T17:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marcos Pitombo retorna à Globo após sete anos, participando da novela 'Elas que Lutem', que estreia em março de 2027.", "titulo_pt": "Marcos Pitombo volta à Globo após sete anos para novela das sete", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 262578, "titulo": "Newark Museum Returns 1852 Jug by David Drake to Artist’s Family", "url": "https://www.artforum.com/news/nmoa-returns-1852-jug-by-david-drake-to-artists-family-1234763595/", "fonte_id": "artforum", "data_pub": "2026-11-13T17:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Museu de Arte de Newark (NMOA  null, "texto_pt": "Uma mulher de 76 anos morreu devido a uma parada cardíaca causada pela Doença de Chagas durante um voo que saiu de Brasília para Porto Velho no último domingo.", "titulo_pt": "Doença de Chagas causou morte de passageira durante voo de Brasília", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 262226, "titulo": "PM da reserva e esposa são executados a tiros pelo genro em bar de MS", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/pm-da-reserva-e-esposa-sao-executados-a-tiros-pelo-genro-em-bar-de-ms", "fonte_id": "metropoles", "data_pub": "2026-11-13T17:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um policial militar da reserva e sua esposa foram executados a tiros pelo genro em um bar em Maracaju, Mato Grosso do Sul. O genro, Vantuir Chaves, de 40 anos, fugiu após o crime.", "titulo_pt": "PM da reserva e esposa são executados a tiros pelo genro em bar de MS", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 262229, "titulo": "Menino de 11 anos fica preso na roda de caminhão após queda de bicicleta", "url": "https://www.metropoles.com/distrito-federal/na-mira/menino-de-11-anos-fica-preso-na-roda-de-caminhao-apos-queda-de-bicicleta", "fonte_id": "metropoles", "data_pub": "2026-11-13T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um garoto de 11 anos ficou preso na roda de um caminhão após cair de uma bicicleta e sofreu escoriações leves, além de um traumatismo craniano leve, sendo transferido para um hospital. Ele já recebeu alta médica.", "titulo_pt": "Menino de 11 anos fica preso na roda de caminhão após queda de bicicleta", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 262230, "titulo": "Homem que estuprou criança é condenado no STJ após TJGO afastar culpa", "url": "https://www.metropoles.com/distrito-federal/entorno/homem-que-estuprou-crianca-5-anos-condenado-no-stj-apos-tjgo-afastar-culpa", "fonte_id": "metropoles", "data_pub": "2026-11-13T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior de Justiça (STJ) rejeitou a absolvição de um homem que havia sido condenado pelo Tribunal de Justiça de Goiás (TJGO) por estuprar uma criança. A sentença original, que impunha mais de 8 anos de prisão, foi confirmada.", "titulo_pt": "Homem condenado a mais de 8 anos de prisão por estupro de criança é reafirmado pelo STJ", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 261953, "titulo": "Por qué hay cada vez más infartos en gente joven, según un cardiólogo", "url": "https://www.lanacion.com.ar/sociedad/por-que-hay-cada-vez-mas-infartos-en-gente-joven-segun-un-cardiologo-nid12112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-13T17:18:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O cardiólogo Jorge Tartaglione alertou que a cardiopatia não é mais uma condição exclusiva de idosos. Ele destacou os sintomas frequentemente ignorados que podem indicar o problema.", "titulo_pt": "Por que há cada vez mais infartos em jovens, segundo um cardiólogo", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 261869, "titulo": "RS: Mulher marca consulta médica denunciando violência e parceiro é preso", "url": "https://www.cnnbrasil.com.br/nacional/sul/rs/rs-mulher-marca-consulta-medica-denunciando-violencia-e-parceiro-e-preso/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-13T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher marcou uma consulta médica para denunciar violência doméstica e seu parceiro foi preso. Ela havia enviado uma mensagem por WhatsApp à Secretaria da Mulher de Parobé, na Grande Porto Alegre, relatando episódios de violência e ameaça.", "titulo_pt": "RS: mulher denuncia violência e parceiro é preso após marcação de consulta médica", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 261870, "titulo": "Funcionários da Kalunga sofrem ataque a tiros após expediente em Santos", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/funcionarios-da-kalunga-sofrem-ataque-a-tiros-apos-expediente-em-santos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-13T16:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dois funcionários da Kalunga foram feridos a tiros em frente à loja em Santos, no litoral paulista. A ocorrência está sendo investigada como tentativa de homicídio.", "titulo_pt": "Funcionários da Kalunga sofrem ataque a tiros após expediente em Santos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 261990, "titulo": "Camila Bustamante, víctima del Sodalicio tras su reunión con el Papa: “Lo sentí preocupado y con un compromiso personal”", "url": "https://www.latercera.com/mundo/noticia/camila-bustamante-victima-de-sodalicio-tras-su-reunion-con-el-papa-lo-senti-preocupado-y-con-un-compromiso-personal/", "fonte_id": "la_tercera", "data_pub": "2026-11-13T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A jornalista chilena Camila Bustamante, que participou do Sodalicio de Vida Cristiana na juventude, foi uma das seis vítimas de abusos que se reuniram com o Papa em Lima. Ela conversou com a La Tercera sobre a reunião e a necessidade de justiça para as vítimas.", "titulo_pt": "Camila Bustamante, vítima do Sodalicio após encontro com o Papa: ‘senti preocupação e compromisso pessoal’", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 262002, "titulo": "Formar odontólogos para una sociedad que envejece", "url": "https://www.latercera.com/educacion/noticia/formar-odontologos-para-una-sociedad-que-envejece/", "fonte_id": "la_tercera", "data_pub": "2026-11-13T16:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a formação de odontólogos para atender a uma sociedade envelhecida. Ele aborda como a população envelhecida apresenta necessidades específicas de saúde bucal que devem ser consideradas no currículo de formação dos profissionais.", "titulo_pt": "Formar odontólogos para uma sociedade envelhecida", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 261715, "titulo": "Brasil precisa integrar programas sociais e superar polarização em debate, diz ex-secretária de ministério", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/c-level-entrevista/2026/11/brasil-precisa-integrar-programas-sociais-e-superar-polarizacao-em-debate-diz-ex-secretaria-de-ministerio.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ex-secretária nacional de Avaliação, Gestão da Informação e Cadastro Único do Ministério do Desenvolvimento e Assistência Social, Letícia Bartholo, defende a necessidade de maior integração entre os programas sociais para evitar sobreposições e lacunas de atendimento. Ela participou de um debate sobre o tema em 11 de outubro de 2026.", "titulo_pt": "Brasil precisa integrar programas sociais e superar polarização, diz ex-secretária", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 261923, "titulo": "Fuga do Brasil tem impacto negativo na imagem de Flávio, diz AtlasIntel", "url": "https://www.jota.info/eleicoes/eleicoes-2026/fuga-do-brasil-tem-impacto-negativo-na-imagem-de-flavio-diz-atlasintel", "fonte_id": "jota", "data_pub": "2026-11-13T14:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa indicou um impacto negativo na imagem do senador Flávio Bolsonaro. Houve também uma divisão na direita sobre sua liderança e uma percepção de que o episódio fortaleceu Lula e o PT.", "titulo_pt": "Fuga do Brasil impacta negativamente a imagem de Flávio, diz pesquisa", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 262181, "titulo": "Trial of French policemen's beating of Black man: 'Since the assault, he has lost the ability to move forward'", "url": "https: ws/taiwan/archives/2026/11/14/2003867722", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro taiwanês fez uma declaração afirmando que um índice climático está injustamente classificando Taiwan. Não foram fornecidos detalhes adicionais sobre o índice ou as razões específicas da classificação.", "titulo_pt": "Índice climático classifica injustamente Taiwan, afirma ministro", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 261985, "titulo": "RADAR LT: Tecnología de monitoreo busca proteger aves amenazadas en el Humedal Río Maipo", "url": "https://www.latercera.com/videos/noticia/radar-lt-tecnologia-de-monitoreo-busca-proteger-aves-amenazadas-en-el-humedal-rio-maipo/", "fonte_id": "la_tercera", "data_pub": "2026-11-13T17:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Através de dispositivos de monitoramento bioacústico e transmissores satelitais, a iniciativa visa estudar espécies ameaçadas de aves, monitorar seus deslocamentos e fornecer informações cruciais para fortalecer a sua conservação.", "titulo_pt": "RADAR LT: tecnologia de monitoramento busca proteger aves ameaçadas no Humedal Río Maipo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 261817, "titulo": "Na COP31, Brasil quer apresentar ao mundo roteiro para cidades mais resilientes", "url": "https://exame.com/esg/na-cop31-brasil-quer-apresentar-ao-mundo-roteiro-para-cidades-mais-resilientes/", "fonte_id": "exame", "data_pub": "2026-11-13T14:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro das Cidades pretende apresentar uma proposta para cidades mais resilientes na COP31, inspirada nos roteiros para o fim do desmatamento e a transição para energias renováveis.", "titulo_pt": "No COP31, Brasil quer apresentar roteiro para cidades mais resilientes", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 262271, "titulo": "North Macedonia: Kriva Palanka seeks help over 1,000 free-roaming cows", "url": "https://www.euronews.com/video/2026/11/13/north-macedonia-kriva-palanka-seeks-help-over-1000-free-roaming-cows", "fonte_id": "euronews", "data_pub": "2026-11-13T14:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de mil vacas estão soltas em Kriva Palanka, na Macedônia do Norte, causando danos e preocupando os residentes. O prefeito pede que o governo declare um estado de crise por 30 dias.", "titulo_pt": "Macedônia do norte: kriva Palanka busca ajuda para 1.000 vacas soltas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 262304, "titulo": "Delhi overtakes Lahore as world’s most polluted city", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/13/delhi-overtakes-lahore-as-worlds-most-polluted-city?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-13T13:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A capital indiana Nova Deli superou Lahore, na Paquistão, como a cidade mais poluída do mundo.", "titulo_pt": "Nova deli ultrapassa Lahore como a cidade mais poluída do mundo", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 261835, "titulo": "COP31: rascunho da decisão final inclui Mapas do Caminho e financiamento climático", "url": "https://exame.com/esg/cop31-rascunho-da-decisao-final-inclui-mapas-do-caminho-e-financiamento-climatico/", "fonte_id": "exame", "data_pub": "2026-11-13T12:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A presidência da conferência apresentou um rascunho da decisão final, incluindo os Mapas do Caminho e financiamento climático. As disputas sobre tecnologia, transparência e comércio internacional permanecem sem solução.", "titulo_pt": "COP31: rascunho da decisão final inclui Mapas do Caminho e financiamento climático", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 260943, "titulo": "Clima: combinação entre calor e alta umidade provoca muita chuva nesta 6ª", "url": "https://www.metropoles.com/brasil/clima-combinacao-entre-calor-e-alta-umidade-provoca-muita-chuva-nesta-6a", "fonte_id": "metropoles", "data_pub": "2026-11-13T09:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A combinação de calor e alta umidade está causando muita chuva no Centro-Sul do Brasil e em áreas do Norte e Nordeste. Pancadas de chuva e tempestades são esperadas.", "titulo_pt": "Clima: calor e alta umidade provocam chuva intensa no centro-sul e norte/nordeste", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 261068, "titulo": "Amazônia queimando afeta a saúde e o bolso do Brasil inteiro, diz bióloga dedicada a combater o fogo na floresta", "url": "https://www.bbc.com/portuguese/articles/cr20v7g9jyy3o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-13T09:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A bióloga Erika Berenguer, da Universidade de Oxford e Lancaster, expressa tristeza com os incêndios na Amazônia, mas defende a continuidade dos esforços de preservação, afirmando que o futuro será ainda mais difícil.", "titulo_pt": "Amazônia em chamas afeta todo o Brasil, diz bióloga", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 260900, "titulo": "Efeitos já devastadores do El Niño pelo país expõem fragilidade do poder público diante da crise", "url": "https://veja.abril.com.br/brasil/efeitos-ja-devastadores-do-el-nino-pelo-pais-expoem-fragilidade-do-poder-publico-diante-da-crise/", "fonte_id": "veja", "data_pub": "2026-11-13T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O El Niño já está causando efeitos devastadores em todo o país, revelando a fragilidade do poder público diante da crise. O desprezo pela prevenção resultou em uma situação de grande despreparo dos municípios.", "titulo_pt": "Efeitos devastadores do El Niño expõem fragilidade do poder público", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 261157, "titulo": "Storm Charles causes floods and flight cancellations across southern Europe", "url": "https://www.theguardian.com/environment/2026/nov/13/storm-charles-floods-flight-cancellations-southern-europe-weather", "fonte_id": "guardian_world", "data_pub": "2026-11-13T08:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A tempestade Charles causou alagamentos e cancelamentos de voos na Europa do Sul nos últimos dias. Em Portugal e no sul de Espanha, o sistema trouxe fortes chuvas e ventos, com uma rajada de vento de 84,5 mph registrada em Funchal e 183 voos cancelados em Lisboa em uma só noite. Também houve interrupções na Colúmbia canadense devido a fortes chuvas e ventos.", "titulo_pt": "Tempestade Charles causa inundações e cancelamentos de voos na Europa do sul", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 260851, "titulo": "Crédito climático com juros de 1% bancado pelo governo financia apartamentos de luxo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/11/credito-climatico-com-juros-de-1-bancado-pelo-governo-financia-apartamentos-de-luxo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um programa de financiamento climático do governo federal, com juros baixos de 1% ao ano, tem sido usado para financiar a construção de prédios de luxo, incluindo apartamentos que custam mais de R$ 6 milhões.", "titulo_pt": "Crédito climático com juros baixos bancado pelo governo financia apartamentos de luxo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 262363, "titulo": "EDITORIAL: Nuclear power on the ballot again", "url": "https://www.taipeitimes.com/News/editorials/archives/2026/11/14/2003867701", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A questão nuclear está novamente em discussão no referendo. O editorial destaca que o tema voltou à pauta política.", "titulo_pt": "EDITORIAL: energia nuclear novamente em votação", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 262557, "titulo": "Fast facts: Ebola outbreak toll on children six months into the response – UNICEF", "url": "https://www.unicef.org/press-releases/fast-facts-ebola-outbreak-toll-children-six-months-response-unicef", "fonte_id": "unicef", "data_pub": "2026-11-13T19:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório destaca os impactos dos surtos de Ebola nos children seis meses após a resposta inicial. Os dados mostram o efeito desse surto em crianças.", "titulo_pt": "Fatos rápidos: impacto do surto de ebola nos children seis meses após a resposta - UNICEF", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 262290, "titulo": "Jerusalem Daily: Baby dies from cold in Gaza", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/13/jerusalem-daily-baby-dies-from-cold-in-gaza?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-13T16:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um bebê morreu de frio em Gaza, enquanto 53 países pediam a Israel que permitisse a entrada de ajuda humanitária.", "titulo_pt": "Jerusalém diária: bebê morre de frio em Gaza", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 262136, "titulo": "Nuevo informe: Sernageomin insiste en que proyecto del hermano del ministro Quiroz no permite descartar “remociones en masa”", "url": "https://www.ciperchile.cl/2026/11/13/nuevo-informe-sernageomin-insiste-en-que-proyecto-del-hermano-del-ministro-quiroz-no-permite-descartar-remociones-en-masa/?utm_source=rss&utm_medium=rss&utm_campaign=nuevo-informe-sernageomin-insiste-en-que-proyecto-del-hermano-del-ministro-quiroz-no-permite-descartar-remociones-en-masa", "fonte_id": "ciper_chile", "data_pub": "2026-11-13T16:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Sernageomin reiterou que o projeto do irmão do ministro Quiroz não permite descartar a possibilidade de 'remoções em massa' no relatório. O órgão insiste que as evidências não são suficientes para excluir essa hipótese.", "titulo_pt": "Novo relatório: sernageomin reitera que projeto do irmão do ministro Quiroz não descarta 'remoções em massa'", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 262177, "titulo": "'How can medical staff and patients be exposed to this?': Gaza's Nasser Hospital hit again by Israel amid Hamas accusations", "url": "https://www.lemonde.fr/en/international/article/2026/11/13/how-can-medical-staff-and-patients-be-exposed-to-this-gaza-s-nasser-hospital-hit-again-by-israel-amid-hamas-accusations_6779898_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-13T14:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O hospital Nasser em Gaza foi atingido novamente por Israel, algo que ocorre com frequência desde há três anos. A Israel acusa o movimento islâmico Hamas de usar o hospital como um ponto de base.", "titulo_pt": "Como médicos e pacientes podem ser expostos a isso? Hospital de gaza atingido novamente por Israel durante acusações de Hamas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 261917, "titulo": "Chuvas e chegada do inverno agravam crise humanitária dos palestinos na Faixa de Gaza", "url": "https://www.dw.com/pt-br/chuvas-e-chegada-do-inverno-agravam-crise-humanitária-dos-palestinos-na-faixa-de-gaza/a-79938350?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-13T13:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Milhares de palestinos, incluindo crianças, grávidas e bebês, enfrentam condições precárias em Gaza devido às chuvas e ao inverno, com barracas inundadas e falta de roupas adequadas. O impasse entre Israel e Hamas impede a reconstrução de Gaza e a chegada de ajuda humanitária.", "titulo_pt": "Chuvas e inverno agravam crise humanitária dos palestinos na Faixa de Gaza", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 261547, "titulo": "'Empowering women is a business imperative'", "url": "https://www.koreaherald.com/article/10936673", "fonte_id": "korea_herald", "data_pub": "2026-11-13T08:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A executiva LG Group Yun Yuh-soon, de 71 anos, publicou um livro intitulado 'O Tempo de Acordar a Metade'. O livro destaca que organizações que não reconhecem e desenvolvem o potencial das mulheres desperdiçam metade de seu talento.", "titulo_pt": "O tempo de acordar a metade", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 261377, "titulo": "UNRWA funding cuts deepen hardship for Palestinian refugees in Lebanon", "url": "https://www.aljazeera.com/features/2026/11/13/unrwa-funding-cuts-deepen-hardship-for-palestinian-refugees-in-lebanon?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-13T04:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As cortesias de financiamento e a guerra de Israel deixaram os palestinos em Líbano em situações cada vez mais difíceis.", "titulo_pt": "Cortes de financiamento e guerra israelense aprofundam a dificuldade para refugiados palestinos no líbano", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 261292, "titulo": "Two sexual violence cases reignite questions about 'culture of silence' in UK's media and culture sectors", "url": "https://www.lemonde.fr/en/international/article/2026/11/13/two-sexual-assault-cases-reignite-questions-about-culture-of-silence-in-uk-s-media-and-culture-sectors_6779533_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-13T04:46:00Z", "idioma": "en", "provavel_duplic
