const D = {"gerado_em": "07/09/2026 07:24", "stats": {"noticias_novas": 726, "resumos_gerados": 236}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Dia da Independência, celebrado em 7 de setembro de 2026, foi marcado por uma forte polarização política. O presidente Lula enfatizou a soberania nacional em seus pronunciamentos, reafirmando que o Brasil não é e não será colônia de ninguém. Durante o 7 de Setembro, Lula criticou o tarifaço imposto pelos Estados Unidos e defendeu a autonomia do país em suas relações internacionais e na gestão de suas riquezas naturais. O evento foi usado por Lula para reforçar sua campanha de reeleição, focando na soberania nacional. Paralelamente, a crise no Supremo Tribunal Federal (STF) continua a influenciar a política eleitoral. Flávio Bolsonaro utilizou a crise no STF para mobilizar a base bolsonarista durante o 7 de Setembro, mas corre o risco de afastar eleitores moderados. O Congresso Nacional deve retomar as votações somente após o primeiro turno das eleições, previsto para o período de 5 a 9 de outubro, com foco em propostas importantes, incluindo o fim da escala 6x1 e a PEC da Segurança. Além disso, a campanha do Partido dos Trabalhadores (PT) planeja discutir a reforma do Judiciário, associando-a a medidas de contenção de gastos por juízes e procuradores, propostas anticorrupção e debates sobre a relação entre magistrados e empresários, em resposta à crise no STF.", "mundo": "Um avião de carga da Amazon perdeu o controle no Aeroporto Internacional de Miami, colidindo com veículos e pegando fogo. O incidente resultou em pelo menos cinco mortos e cinco feridos. Em outra notícia, o partido de extrema-direita AfD obteve seu melhor resultado nas eleições regionais do estado alemão de Saxônia-Anhalt, obtendo 44% dos votos e se aproximando de formar o primeiro governo de extrema-direita em um estado alemão desde a Segunda Guerra Mundial. A Alemanha planeja apresentar um caso ao Tribunal Internacional de Justiça para desconsiderar uma acusação de 'genocídio' apresentada pela Nicarágua, alegando que Berlim 'facilitou' a situação em Gaza. Além disso, o governo chinês aumentou seu plano de recapitalização para incluir mais instituições controladas pelo estado, enquanto a Coreia do Sul e a França concordaram em estabelecer um canal de cooperação para indústrias estratégicas e comércio.\n\nO conflito no Oriente Médio intensificou-se nos últimos dias, com ataques israelenses em Gaza e no Líbano resultando em mais de 20 mortes, incluindo civis e crianças. Segundo relatos, nove pessoas morreram em ataques israelenses em Kfar Rumman, no sul do Líbano, incluindo dois bebês, e quatro em Gaza. O Irã reagiu com ataques a bases dos Estados Unidos no Oriente Médio, justificados como uma forma de defesa do seu direito à autodefesa. O tráfego marítimo no Estreito de Ormuz atingiu seu menor nível desde maio, refletindo a tensão no local. Além disso, o Irã reforçou sua presença militar na região, invocando a Carta das Nações Unidas para justificar suas ações. O Canadá criticou as ações do Irã, afirmando que manterá pressão significativa sobre Teerã. Diante da intensificação das hostilidades na região, a Coreia do Sul está reconsiderando suas propostas de envio de tropas para o Estreito de Ormuz.", "economia": "A economia global enfrenta diversos desafios, com destaque para o aumento dos preços do petróleo, que atingiu US$ 97 por barril, impulsionado pela escassez causada pela guerra entre os Estados Unidos e seus aliados. A Petrobras registrou um aumento de 97% nas ações, enquanto o consumidor brasileiro beneficiou-se de uma redução de 38% nas tarifas aéreas regionais, refletindo a alta do Brent. A China orientou as montadoras locais a evitar uma guerra de preços no exterior, indicando que os preços devem ser definidos com base em custos e na demanda local. A Samsung continua dominando o mercado global de DRAM com 39,4% de participação. No Japão, o iene subiu a seu nível mais alto desde fevereiro, após especulações de que o Banco do Japão pode aumentar suas taxas de juros, levando a uma rápida reversão da percepção do mercado. O Brasil comemora a Independência, refletindo sobre a independência financeira do país, enquanto o governo de Goiás propõe criar uma poupança de R$ 1 mil para recém-nascidos com recursos do combate à corrupção. O novo marco da mobilidade enfatiza a importância de previsibilidade regulatória e governança metropolitana para atrair investimentos no setor. A EssilorLuxottica reorganizou sua liderança sênior após uma divisão com o filho do fundador, enquanto a indústria de baterias de poder da China registrou um crescimento robusto nos primeiros sete meses de 2026, impulsionada pela elevada demanda tanto para veículos elétricos quanto para armazenamento de energia estacionário.", "tecnologia": "O evento mais importante dos artigos é a SEMICON Taiwan 2027, que foi transferida para os dias 18-20 de agosto, adiantando o evento por quase um mês. De acordo com o COO da Infineon, Alexander Gorski, a nova fábrica em Dresden está sendo expandida mais rapidamente do que as expansões anteriores, graças a ferramentas de inteligência artificial e a uma única estratégia de fábrica virtual. A fábrica alcançará sua capacidade total em dois a três anos, com a demanda do mercado e do AI aumentando. A Taiwan está considerando o silício fotônico como o próximo grande salto tecnológico, com o objetivo de se posicionar como líder nessa área. Além disso, a inteligência artificial está ganhando espaço em diversos setores, como a indústria farmacêutica, onde a HK inno.N recebeu o primeiro Certificado de Declaração Ambiental (EPD) para um medicamento oral, e a indústria de relógios, onde os relógios de quartzos estão se tornando uma tendência, perdendo o estigma de serem considerados acessórios menos luxuosos. A China está buscando reduzir a dependência dos chips Nvidia, com a empresa DeepSeek planejando comprar 160 mil chips Huawei para sua grande data center de 1 GW em construção na província de Inner Mongolia.", "ciencia": "Um estudo publicado na revista JGR Solid Earth utilizou aprendizado de máquina para analisar ondas sísmicas e identificar seis estruturas incomuns na interface entre o núcleo e a crosta funda da Terra. Essas estruturas, que eram anteriormente visíveis apenas como manchas dispersas, agora aparecem como seis faixas contínuas de irregularidades. Em seguida, o neurocientista Ignacio Morgado afirmou que, com base em evidências científicas, apenas os humanos têm consciência de que pensam, tornando-nos a espécie mais singular do planeta. Além disso, cientistas desenvolveram um biomaterial injetável que pode auxiliar no processo de regeneração cerebral após um acidente vascular cerebral (AVC), transformando a cavidade resultante do AVC em um ambiente mais favorável para a reparação. Por fim, um estudo envolvendo mais de 270.000 pessoas associou níveis mais altos de tirosina no sangue a uma menor expectativa de vida nos homens, potencialmente reduzindo a expectativa de vida masculina em cerca de um ano, sem efeitos significativos em mulheres.", "cultura": "O evento mais importante é a co-presidência do presidente sul-coreano Yoon Suk Yeol no summit sobre cinema, que acontecerá em Saint-Paul-de-Vence na França em 7 de setembro. O objetivo é promover a indústria cinematográfica e anunciar uma iniciativa de investimento. Em outro destaque, o ator Robert Pattinson entrega uma de suas melhores atuações na carreira no filme 'Primetime', interpretando um caçador de pedófilos. O documentário 'Sharks are my film stars' oferece uma visão única da vida marinha no Mar do Norte, com foco em tubarões e baleias-oricó. O festival Rock in Rio apresentou diversos artistas, como Calvin Harris, Nelly, Aespa e João Gordo, além de grandes shows de rave, agitando a multidão mesmo sob chuva. O festival também marcou a volta de Aespa ao Brasil após três anos, enfrentando condições climáticas adversas. O cineasta Wim Wenders se pronunciou sobre a polêmica gerada durante o Festival de Berlim, definindo o cinema como um antídoto à política.", "sociedade": "A população chilena está envelhecendo, trazendo desafios para a sociedade e a economia, conforme alerta um estudo da Universidade Católica. Ao mesmo tempo, a Fundação Amparo e Justícia investiga mortes de crianças sem causa determinada, apresentando seis propostas para melhorar o sistema. Na Argentina, a lei na Cidade de Buenos Aires agora garante a disponibilidade da anestesia peridural para parturientes que a necessitam, com um levantamento mostrando aplicação desigual em hospitais públicos. Em São Paulo, uma adolescente de 15 anos foi arrastada por um motorista de aplicativo após tentar recuperar R$ 100, enquanto um incêndio atingiu mais de 25 moradias em uma comunidade da zona Norte da cidade. No Paraná, uma médica foi encontrada morta em seu apartamento, levando a prisão de seu marido sob suspeita de feminicídio. Em Minas Gerais, duas idosas de 90 e 65 anos foram resgatadas em condições semelhantes ao trabalho escravo doméstico. Em Seul, a prefeitura planeja abrir um segundo centro de suporte à educação multicultural e expandir escolas preparatórias para o coreano, devido ao aumento do número de estudantes com origem migratória. Além disso, o atraso no pagamento de dívidas aumentou, especialmente entre pessoas com idades entre 30 e 70 anos, enquanto o número de lares com apenas uma pessoa cresceu para 40,5% no país.", "meio_ambiente": "A China está investindo em energias renováveis e tecnologias de veículos elétricos para reduzir as emissões em suas cidades. Em Nepal e na China, uma enxurrada causou quase 1.400 mortes e 5.000 desaparecidos, com danos econômicos bilionários. O Nepal solicitou assistência financeira ao Fundo da ONU para compensar as perdas e danos causados pelas inundações. Em Sarawak, na Malásia, a emergência devido à neblina foi encerrada, mas os níveis de poluição do ar permanecem críticos devido a incêndios florestais na Indonésia. Em Manaus, capital do Amazonas, há o risco de secar até 2040 devido ao uso descontrolado de poços subterrâneos e mudanças climáticas. No Rio Grande do Sul, 80% das pequenas e médias empresas não se sentem preparadas para enfrentar eventos climáticos relacionados ao El Niño. Um vulcão chamado 'filhote do Krakatoa' entrou em erupção na Indonésia, afetando voos em várias rotas e deixando 150 mil passageiros retidos. Em Atafona, no Brasil, a erosão costeira está destruindo casas e transformando a cidade em um laboratório urbano para adaptação climática.", "direitos_humanos": "Novos relatos de violações de direitos humanos surgiram em vários países. No Egito, a apresentadora de TV Sarah Khalifa, junto com 11 outros indivíduos, foi condenada à morte por tráfico de drogas sintéticas, levando a uma batalhada legal. Em desenvolvimento alarmante, documentos e evidências revelaram o uso de bombas de cloro pelo exército sudanês contra opositores paramilitares, sugerindo o uso de armas químicas. Em Hong Kong, uma lei contra assédio está sendo proposta após um homem ser absolvido de acusações de seguir uma garota adolescente para a escola, evidenciando a necessidade de proteção legal contra esse tipo de crime. Além disso, uma coalizão de organizações cívicas pediu à UNESCO que incluísse documentos relacionados às 'mulheres de conforto' em sua lista de bens da memória humana, enquanto um grupo de seguidores da médium Maira Rocha atacou e ameaçou críticos na internet, denotando a presença de milícias digitais em ação. Por fim, um ataque israelense resultou na morte de uma menina de oito anos e seu pai no primeiro dia da escola, reforçando a violência em conflitos armados. Estes eventos sublinham a urgência de proteger os direitos humanos em diferentes contextos globais."}, "resumo_do_dia": {"politica_nacional": [{"id": 149926, "titulo": "Eleições 2026: entenda como são eleitos deputados federais e estaduais", "url": "https://www.cnnbrasil.com.br/eleicoes/eleicoes-2026-entenda-como-sao-eleitos-deputados-federais-e-estaduais/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-07T09:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As eleições para deputados federais e estaduais seguem um sistema diferente do usado para eleger outros representantes. A votação para membros da Câmara dos Deputados não segue o mesmo sistema usado para os demais representantes.", "titulo_pt": "Eleições 2026: entenda como são eleitos deputados federais e estaduais", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 149850, "titulo": "Crítico do STF, jurista pede saída de Alexandre de Moraes", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/critico-do-stf-jurista-pede-saida-de-alexandre-de-moraes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-07T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O advogado e professor aposentado da USP Modesto Carvalhosa criticou a narrativa que enfoca um suposto embate entre ministros do STF, afirmando que isso tem desviado o foco de possíveis atos ilícitos praticados por Alexandre de Moraes.", "titulo_pt": "Jurista pede saída de Alexandre de Moraes", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 149974, "titulo": "STF precisa falar como Corte, não como soma de ministros", "url": "https://www.jota.info/opiniao-e-analise/artigos/stf-precisa-falar-como-corte-nao-como-soma-de-ministros", "fonte_id": "jota", "data_pub": "2026-09-07T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto destaca a necessidade de o Supremo Tribunal Federal (STF) adotar um modelo decisório mais colegiado e menos personalista para garantir sua legitimidade. A ideia é que a corte produza decisões com razões institucionais claras para a sociedade.", "titulo_pt": "STF deve funcionar como uma Corte, não como a soma de ministros", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 149976, "titulo": "A trajetória da dívida pública em ano eleitoral à luz dos recentes acórdãos do TCU", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-trajetoria-da-divida-publica-em-ano-eleitoral-a-luz-dos-recentes-acordaos-do-tcu", "fonte_id": "jota", "data_pub": "2026-09-07T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute a trajetória da dívida pública durante anos eleitorais, baseando-se em recentes decisões do Tribunal de Contas da União (TCU).", "titulo_pt": "A trajetória da dívida pública em anos eleitorais à luz dos recentes acórdãos do TCU", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 149978, "titulo": "Por que o ESG não vai morrer", "url": "https://www.jota.info/opiniao-e-analise/colunas/praticas-esg/por-que-o-esg-nao-vai-morrer", "fonte_id": "jota", "data_pub": "2026-09-07T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A suspensão dos relatórios ESG pela CVM não representa um recuo, mas sim um sinal de uma demanda crescente por maior comparabilidade nos dados de sustentabilidade.", "titulo_pt": "Por que o ESG não vai desaparecer", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 149999, "titulo": "Como o Dia da Independência apagou a memória da luta negra por independência e abolição", "url": "https://www.bbc.com/portuguese/articles/c0j3ppkk054o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-07T08:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A articulação popular que defendia o regime republicano e o fim da escravidão foi suprimida, com seus líderes sendo executados décadas antes da proclamação da independência no Brasil em 7 de setembro de 1822.", "titulo_pt": "Como o Dia da Independência esqueceu a luta negra por Independência e abolição", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 149878, "titulo": "Cresce aposta de que Fachin não levará crise para o plenário físico do STF", "url": "https://www.metropoles.com/colunas/igor-gadelha/cresce-aposta-de-que-fachin-nao-levara-crise-para-o-plenario-fisico-do-stf", "fonte_id": "metropoles", "data_pub": "2026-09-07T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Acredita-se que Edson Fachin, presidente do STF, tome decisões individuais sem expor a crise no plenário físico do tribunal.", "titulo_pt": "Cresce a aposta de que Fachin não levará crise para o plenário físico do STF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 149919, "titulo": "Minas vira o “swing state” brasileiro em eleição apertada entre Lula e Flávio", "url": "https://www.infomoney.com.br/politica/minas-vira-o-swing-state-brasileiro-em-eleicao-apertada-entre-lula-e-flavio/", "fonte_id": "infomoney", "data_pub": "2026-09-07T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estado de Minas Gerais se tornou decisivo na eleição presidencial entre Lula e Flávio, com um empate apertado, voto cruzado e a influência do senador Cleitinho.", "titulo_pt": "Minas se torna estado-chave na eleição apertada entre Lula e Flávio", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 149980, "titulo": "Acumulação de cargos públicos e avaliação unificada da pessoa com deficiência", "url": "https://www.jota.info/opiniao-e-analise/colunas/advogadas-publicas-em-debate/acumulacao-de-cargos-publicos-e-avaliacao-unificada-da-pessoa-com-deficiencia", "fonte_id": "jota", "data_pub": "2026-09-07T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cooperação entre os regimes pode evitar perícias repetidas para servidores com deficiência que acumulam cargos. Isso visa simplificar o processo de avaliação unificada das condições desses servidores.", "titulo_pt": "Acumulação de cargos públicos e avaliação unificada da pessoa com deficiência", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 149996, "titulo": "Crise do STF embala 7 de setembro e vira trunfo para Flávio Bolsonaro tentar recuperar força eleitoral", "url": "https://www.bbc.com/portuguese/articles/c87vpnpel9jo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-07T07:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, candidato do PL, está utilizando a crise no STF para mobilizar a base bolsonarista durante o 7 de Setembro, mas enfrenta o risco de afastar eleitores moderados. O desgaste do ministro Alexandre de Moraes está sendo usado como trunfo político para tentar recuperar força eleitoral.", "titulo_pt": "Crise no STF é usado por Flávio Bolsonaro para mobilizar base no 7 de setembro", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 149879, "titulo": "Confira as agendas dos candidatos à Presidência nesta segunda-feira (7/9)", "url": "https://www.metropoles.com/brasil/confira-as-agendas-dos-candidatos-a-presidencia-nesta-segunda-feira-7-9", "fonte_id": "metropoles", "data_pub": "2026-09-07T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos à Presidência têm agendas focadas no 7 de Setembro, com eventos e atos. Luiz Inácio Lula da Silva participa de um desfile em Brasília, enquanto Flávio Bolsonaro realiza um comício na Avenida Paulista.", "titulo_pt": "Confira as agendas dos candidatos à Presidência nesta segunda-feira (7/9)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 149881, "titulo": "Vaquinhas eleitorais somam mais de R$ 10 milhões a um mês das eleições", "url": "https://www.metropoles.com/brasil/vaquinhas-eleitorais-somam-mais-de-r-10-milhoes-a-um-mes-das-eleicoes", "fonte_id": "metropoles", "data_pub": "2026-09-07T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um mês antes das eleições, as vaquinhas eleitorais já somam mais de R$ 10 milhões. O partido que recebeu mais valores de financiamento coletivo foi Missão, seguido por Novo, PT, PSol e PSD.", "titulo_pt": "Vaquinhas eleitorais somam mais de R$ 10 milhões a um mês das eleições", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 149889, "titulo": "7 de Setembro: Lula prega união e Flávio mobiliza apoiadores contra Moraes", "url": "https://www.metropoles.com/brasil/7-de-setembro-lula-prega-uniao-e-flavio-mobiliza-apoiadores-contra-moraes", "fonte_id": "metropoles", "data_pub": "2026-09-07T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula se esforça para evitar que o 7 de Setembro se torne politicamente polarizado, enquanto Flávio Bolsonaro convoca apoiadores para um ato contra o presidente Jair Bolsonaro e o ministro Alexandre de Moraes.", "titulo_pt": "7 De Setembro: lula prega união e Flávio mobiliza apoiadores contra Moraes", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 149944, "titulo": "Governo Lula prepara nova MP para restringir bets", "url": "https://www.cnnbrasil.com.br/politica/governo-lula-prepara-nova-mp-para-restringir-bets/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-07T07:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula está preparando uma nova Medida Provisória para restringir apostas. O Palácio do Planalto optou por esse instrumento devido ao efeito imediato esperado, com foco em impactos eleitorais. O conteúdo da MP ainda está em discussão.", "titulo_pt": "Governo Lula prepara nova MP para restringir apostas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 149946, "titulo": "Congresso vai retomar votações somente após primeiro turno das eleições", "url": "https://www.cnnbrasil.com.br/politica/congresso-vai-retomar-votacoes-somente-apos-primeiro-turno-das-eleicoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-07T07:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Congresso Nacional deve retomar as votações somente após o primeiro turno das eleições, previsto para o período de 5 a 9 de outubro. Durante essa semana, a Câmara e o Senado devem focar em aprovar propostas importantes, incluindo o fim da escala 6x1 e a PEC da Segurança.", "titulo_pt": "Congresso retomará votações após primeiro turno das eleições", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 149851, "titulo": "Depois de ter filho, moradora de Porto Alegre confia menos em políticos e cogita voto nulo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/depois-de-ter-filho-moradora-de-porto-alegre-confia-menos-em-politicos-e-cogita-voto-nulo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-07T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Heloisa Vivan, de 33 anos, moradora de Porto Alegre, dedica seu tempo livre ao filho de 8 meses, aproveitando os intervalos do home office para caminhar na orla do lago Guaíba. Ela confia menos em políticos após ter o filho e cogita votar nulo.", "titulo_pt": "Depois de ter filho, moradora de Porto Alegre confia menos em políticos e cogita voto nulo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 150312, "titulo": "Israeli strikes kill seven Palestinians in Gaza in past 24 hours", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-strikes-kill-seven-palestinians-gaza-past-24-hours", "fonte_id": "middle_east_eye", "data_pub": "2026-09-07T09:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sete palestinos foram mortos em ataques israelenses no Gaza Strip nas últimas 24 horas. Entre as vítimas está um menino de seis anos que foi atingido por um tiro perto de Gaza City há algumas semanas, e um homem que morreu de ferimentos causados por um ataque aéreo israelense em uma área residencial de Gaza City.", "titulo_pt": "Israel realiza ataques que deixam sete palestinos mortos em Gaza em 24 horas", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 150189, "titulo": "Probe begins into why Amazon cargo plane overran Miami runway", "url": "https://www.bbc.co.uk/news/articles/c0e3p1j7n3ro?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-07T09:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um avião de carga do Amazonas perdeu o controle na pista de pouso do Aeroporto Internacional de Miami, colidiu com veículos e pegou fogo. Cinco pessoas morreram e outras cinco ficaram feridas.", "titulo_pt": "Inquérito começa para investigar o porquê do avião de carga do amazonas desviar do pista em Miami", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 150211, "titulo": "Italy's Meloni celebrates record tenure amid crises and setbacks", "url": "https://www.lemonde.fr/en/international/article/2026/09/07/italy-s-meloni-celebrates-record-tenure-amid-crises-and-setbacks_6757244_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-07T09:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A chefe do governo italiano, Meloni, comemora seu mandato recorde enquanto enfrenta uma economia lenta e uma oposição política que se move cada vez mais para a direita. O discurso à sua base ocorreu na cidade de Bari, em meio a crises políticas e econômicas.", "titulo_pt": "Meloni comemora mandato recorde em meio a crises e desafios", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 150151, "titulo": "Far-right AfD celebrate ‘dream result’ in key German state as Merz reportedly holds crisis talks – Europe live", "url": "https://www.theguardian.com/world/live/2026/sep/07/germany-afd-saxony-anhalt-merz-greenland-ratko-mladic-europe-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-09-07T09:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O partido de extrema-direita AfD venceu uma eleição importante no estado alemão de Saxônia-Anhalt, mas não conseguiu uma maioria. O partido agora buscará discutir com outros sobre como governar.", "titulo_pt": "AfD comemoram 'resultado de sonho' em estado alemão após eleição", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 150214, "titulo": "German startup notches Europe's first successful private orbital launch", "url": "https://www.france24.com/en/tv-shows/business/20260907-german-startup-notches-europe-s-first-successful-private-orbital-launch", "fonte_id": "france24", "data_pub": "2026-09-07T09:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup alemã Isar Aerospace realizou com sucesso o primeiro lançamento orbital privado da Europa. Em paralelo, o partido de extrema-direita AfD obteve uma vitória eleitoral significativa, influenciada em parte pela crise econômica estrutural e pelas políticas fiscais do país.", "titulo_pt": "Alemã isar aerospace realiza primeiro lançamento orbital privado da Europa", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 150272, "titulo": "Iran war: How US consumers spent an additional $100bn on fuel", "url": "https://www.aljazeera.com/news/2026/9/7/iran-war-how-us-consumers-spent-an-additional-100bn-on-fuel?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-07T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O gasto médio de uma família americana com combustível aumentou em $763 em seis meses, devido à guerra entre Estados Unidos e Israel contra o Irã, que elevou os preços dos combustíveis.", "titulo_pt": "Guerra Irã: consumidores americanos gastaram adicionalmente $100 bilhões com combustível", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 150231, "titulo": "Israel-Hezbollah clashes kill 11 as Mideast conflict escalation gathers pace after U.S.-Iran strikes", "url": "https://www.cnbc.com/2026/09/07/us-iran-war-trump-hormuz-israel-hezbollah-fighting-strikes-.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-07T09:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Clashes entre Israel e Hezbollah resultaram em 11 mortos. O presidente do Líbano, Joseph Aoun, pediu ajuda ao Estados Unidos para parar os ataques israelenses após os ataques de domingo que causaram pelo menos sete mortes.", "titulo_pt": "Conflitos entre israel e hezbollah matam 11, enquanto líbano pede ajuda aos EUA para parar ataques israelenses", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 150261, "titulo": "China pumps $54bn into banks and insurers", "url": "https://www.ft.com/content/8012b60e-c74e-49bc-9200-d37f13b4a135?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-07T09:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo chinês aumentou o plano de recapitalização para incluir mais instituições controladas pelo estado com o objetivo de melhorar o desempenho financeiro dessas instituições.", "titulo_pt": "China injeta r$ 54 bilhões em bancos e seguradoras", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 150215, "titulo": "Nepal holds a day of mourning as rescuers continue search for flood missing", "url": "https://www.france24.com/en/video/20260907-nepal-holds-a-day-of-mourning-as-rescuers-continue-search-for-flood-missing", "fonte_id": "france24", "data_pub": "2026-09-07T09:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nepal entrou em luto tradicional hindu pela centena de mortos causados pela enchente na fronteira com a China, enquanto as buscas continuavam após quatro resgates milagrosos recentes.", "titulo_pt": "Nepal entra em luto pela enchente na fronteira com a china, com buscas em andamento", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 150248, "titulo": "Middle East: Israeli strikes kill several in Lebanon", "url": "https://www.dw.com/en/middle-east-israeli-strikes-kill-several-in-lebanon/live-79133242?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-07T09:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No menos de 10 pessoas morreram em ataques israelenses no sul do Líbano, de acordo com o ministério da Saúde do Líbano. O tráfego no Estreito de Ormuz atingiu o nível mais baixo desde maio.", "titulo_pt": "Meio oriente: israel realiza ataques no sul do líbano, causando mortes", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 150269, "titulo": "Why Alexandria Ocasio-Cortez’s egg freezing is one of 2026’s most interesting political moves", "url": "https://english.elpais.com/usa/2026-09-07/why-alexandria-ocasio-cortezs-egg-freezing-is-one-of-2026s-most-interesting-political-moves.html", "fonte_id": "elpais_en", "data_pub": "2026-09-07T09:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alexandria Ocasio-Cortez documentou seu processo clínico para adiar a maternidade, expandindo assim o quadro das instituições sobre saúde reprodutiva e oferecendo pistas sobre seus possíveis planos futuros.", "titulo_pt": "Por que o processo de congelação de ovócitos de Alexandria Ocasio-Cortez é uma das movimentações políticas mais interessantes de 2026", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 150120, "titulo": "Virtual Taekwondo Takes the Contact Out of a Combat Sport", "url": "https://www.nytimes.com/2026/09/07/sports/virtual-taekwondo-asian-games.html", "fonte_id": "nyt_world", "data_pub": "2026-09-07T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A versão sem contato do artes marciais coreanas está sendo estreada nos Jogos Asiáticos deste ano. Críticos a chamam de um videogame enfeitado.", "titulo_pt": "Taekwondo virtual remove o contato de um esporte de combate", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 149997, "titulo": "O dilema da Europa após direita radical na Alemanha obter vitória inédita desde a 2ª Guerra", "url": "https://www.bbc.com/portuguese/articles/crr4q7zj985o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-07T09:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os próximos 12 meses serão marcados por eleições em vários países da União Europeia, incluindo França, Itália, Espanha e Polônia. A Comissão Europeia expressa preocupação com a possibilidade de partidos mais extremistas se beneficiarem da vitória inédita da AfD na Alemanha.", "titulo_pt": "O dilema europeu após vitória inédita da direita radical na Alemanha", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 149925, "titulo": "Tráfego de navios no Estreito de Ormuz atinge menor nível desde maio", "url": "https://www.cnnbrasil.com.br/internacional/trafego-de-navios-no-estreito-de-ormuz-atinge-menor-nivel-desde-maio/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-07T09:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O tráfego de navios no Estreito de Ormuz registrou seu menor nível desde maio, com apenas cinco navios passando no domingo, contra dois no sábado.", "titulo_pt": "Tráfego de navios no Estreito de Ormuz atinge menor nível desde maio", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 150216, "titulo": "Germany seeks to dismiss Nicaragua's Gaza genocide case at top UN court", "url": "https://www.france24.com/en/europe/20260907-germany-seeks-dismissal-of-nicaragua-s-gaza-genocide-case-at-top-un-court", "fonte_id": "france24", "data_pub": "2026-09-07T09:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Alemanha planeja pedir ao Tribunal Internacional de Justiça na próxima segunda-feira para descartar um caso apresentado pela Nicarágua, que acusa Berlim de 'facilitar genocídio' em Gaza ao apoiar Israel após os ataques letais de militantes do Hamas em outubro de 2023. Os detalhes do caso, apresentado em 2024, ainda não foram divulgados.", "titulo_pt": "Alemanha solicitará ao tj internacional descarte de caso nicaraguense sobre 'genocídio' em Gaza", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 150313, "titulo": "Iran war shows Gulf cannot rely on US for security, Qatar says", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/important-not-enough-iran-war-shows-gulf-cannot-rely-us-security-qatar", "fonte_id": "middle_east_eye", "data_pub": "2026-09-07T09:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Qatar afirmou que o conflito com o Irã demonstrou que os estados do Golfo não podem mais contar com alianças estratégicas com os Estados Unidos para sua segurança. O responsável pela diplomacia qatarita destacou que forças internacionais e alianças com os EUA são importantes, mas insuficientes para garantir a segurança da região.", "titulo_pt": "Guerra com o Irã mostra que os estados do golfo não podem mais contar com os EUA para sua segurança, diz o Qatar", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 150435, "titulo": "(2nd LD) S. Korea says in talks with int'l community over Hormuz security, keeps Iran channel open", "url": "https://en.yna.co.kr/view/AEN20260907005852315", "fonte_id": "yonhap_news", "data_pub": "2026-09-07T09:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul está mantendo diálogo com a comunidade internacional sobre a segurança do Estreito de Ormuz, mantendo um canal aberto com o Irã.", "titulo_pt": "Coreia do sul mantém diálogo sobre segurança do estreito de Ormuz com a comunidade internacional e com o Irã", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 150333, "titulo": "Yen rises to highest since February, topping intervention rally", "url": "https://www.japantimes.co.jp/business/2026/09/07/markets/japan-yen-gains-154/", "fonte_id": "japan_times", "data_pub": "2026-09-07T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O iene subiu até 1,4%, atingindo ¥154,06 em relação ao dólar, após apostas crescentes de que o Banco do Japão pode aumentar suas taxas de juros, levando a uma reversão rápida da percepção do mercado.", "titulo_pt": "Iene atinge nível mais alto desde fevereiro, superando rally de intervenção", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 149868, "titulo": "China cria diretriz para montadoras evitarem guerra de preços no exterior", "url": "https://www.poder360.com.br/poder-china/china-cria-diretriz-para-montadoras-evitarem-guerra-de-precos-no-exterior/", "fonte_id": "poder360", "data_pub": "2026-09-07T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A China estabeleceu uma diretriz para as montadoras locais evitar uma guerra de preços no exterior, orientando-as a definir preços com base em custos e na demanda local dos mercados externos.", "titulo_pt": "China cria diretriz para montadoras evitar guerra de preços no exterior", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 150440, "titulo": "Samsung extends lead in global DRAM market with 39 pct share: report", "url": "https://en.yna.co.kr/view/AEN20260907008900320", "fonte_id": "yonhap_news", "data_pub": "2026-09-07T08:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Samsung Electronics detém 39,4% do mercado global de DRAM, expandindo sua liderança.", "titulo_pt": "Samsung amplia liderança no mercado global de DRAM com 39,4% de participação", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 150262, "titulo": "Iran to raise petrol prices as US war triggers shortages", "url": "https://www.ft.com/content/15d59180-ea46-4441-9c45-d6be584ae911?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-07T08:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Irão planeja aumentar os preços do petróleo devido a escassezes provocadas pela guerra dos Estados Unidos. Os combustíveis são atualmente os mais baratos do mundo, mas os subsídios estão se tornando inaceitáveis para as autoridades.", "titulo_pt": "Irã vai aumentar preços do petróleo por causa de escassez devido à guerra dos EUA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 149977, "titulo": "Petrobras +97%, consumidor brasileiro -38", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-da-abde/petrobras-97-consumidor-brasileiro-38", "fonte_id": "jota", "data_pub": "2026-09-07T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petrobras registrou um aumento de 97% nas suas ações, enquanto o consumidor brasileiro sofreu uma redução de 38% nas tarifas aéreas regionais. A exclusão do querosene de aviões da Medida Provisória 1.358 intensificou o impacto do aumento do preço do Brent, um tipo de petróleo, nas tarifas aéreas.", "titulo_pt": "Petrobras +97%, consumidor brasileiro -38", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 149979, "titulo": "Novo marco da mobilidade e a evolução da segurança jurídica nas concessões", "url": "https://www.jota.info/opiniao-e-analise/artigos/novo-marco-da-mobilidade-e-a-evolucao-da-seguranca-juridica-nas-concessoes", "fonte_id": "jota", "data_pub": "2026-09-07T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O novo marco da mobilidade e a evolução da segurança jurídica nas concessões enfatizam a importância de previsibilidade regulatória e governança metropolitana para atrair investimentos no setor.", "titulo_pt": "Novo marco da mobilidade e a evolução da segurança jurídica nas concessões", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 150338, "titulo": "Bessent pushes BOJ as he signals end of Abenomics", "url": "https://www.japantimes.co.jp/commentary/2026/09/07/japan/bessent-pressuring-on-rate-hike/", "fonte_id": "japan_times", "data_pub": "2026-09-07T08:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O aumento da taxa de juros em setembro provavelmente já está planejado, e o mercado espera uma 'comunicação hawksa' da BoJ.", "titulo_pt": "Bessent pressiona BOJ enquanto sinaliza fim de Abenomics", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 149981, "titulo": "Pesquisa clínica no Brasil: janela histórica para transformar potencial em impacto real", "url": "https://www.jota.info/opiniao-e-analise/artigos/pesquisa-clinica-no-brasil-janela-historica-para-transformar-potencial-em-impacto-real", "fonte_id": "jota", "data_pub": "2026-09-07T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A regulação mais previsível e o aumento dos investimentos estão preparando o Brasil para um novo papel na ciência. A pesquisa clínica no país está se tornando mais atrativa e promissora.", "titulo_pt": "Pesquisa clínica no Brasil: janela histórica para transformar potencial em impacto real", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 150417, "titulo": "Model fatigue, China's price pressure, and a profit horizon still years away", "url": "https://www.digitimes.com/news/a20260907VL206/price-anthropic-openai-claude-2030.html", "fonte_id": "digitimes", "data_pub": "2026-09-07T07:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A agenda de lançamentos da indústria de IA se acelerou a ponto de uma semana abrigar cinco lançamentos avançados ou pró-avantajados, mas essa aceleração não é um sinal de confiança. É uma reação defensiva em um mercado onde anúncios de concorrentes podem enterrar os seus próprios, onde os laboratórios chineses têm reduzido a maioria das diferenças de qualidade a um quinto do custo, e onde nem a parte americana nem a chinesa da corrida esperam recuperar seu investimento nos próximos anos.", "titulo_pt": "Fadiga de modelos, pressão de preços da China e horizonte de lucratividade ainda a anos", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 150339, "titulo": "Weak yen not always good for Tokyo stocks, some analysts say", "url": "https://www.japantimes.co.jp/business/2026/09/07/markets/weak-yen-stocks/", "fonte_id": "japan_times", "data_pub": "2026-09-07T07:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Algumas analistas afirmam que a cotação fraca do iene não necessariamente beneficia os mercados de ações de Tóquio, especialmente se os juros subirem.", "titulo_pt": "Moeda fraca não sempre é benéfica para os mercados de ações de tóquio, dizem analistas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 150234, "titulo": "Japan's foreign reserves drop by a record $80 billion in August following yen intervention", "url": "https://www.cnbc.com/2026/09/07/japan-foreign-reserves-yen-intervention.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-07T07:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As reservas internacionais do Japão caíram em agosto, registrando uma diminuição recorde de US$ 80 bilhões devido à intervenção cambial. As reservas oficiais agora se situam em US$ 1,207 trilhão.", "titulo_pt": "Reservas internacionais do Japão caem us$ 80 bilhões em agosto após intervenção cambial", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 149880, "titulo": "Pagamentos por aproximação movimentam R$ 1 trilhão no 1º semestre", "url": "https://www.metropoles.com/brasil/pagamentos-aproximacao-1-trilhao-semestre", "fonte_id": "metropoles", "data_pub": "2026-09-07T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os pagamentos por aproximação movimentaram mais de R$ 1 trilhão no primeiro semestre do ano. Este método de pagamento cresceu 18,5% em um ano e responde por mais de 76% das compras realizadas com cartões no país, de acordo com a Abecs.", "titulo_pt": "Pagamentos por aproximação movimentam R$ 1 trilhão no 1º semestre", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 149882, "titulo": "Juros e endividamento pressionam futuro do PIB", "url": "https://www.metropoles.com/brasil/juros-endividamento-pressionam-pib", "fonte_id": "metropoles", "data_pub": "2026-09-07T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O crescimento da economia está perdendo velocidade e os juros são o ponto mais criticado, juntamente com o elevado endividamento.", "titulo_pt": "Juros e endividamento ameaçam crescimento futuro do PIB", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 149814, "titulo": "Volkswagen aposta em plano de reestruturação para enfrentar crise", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/volkswagen-aposta-em-plano-de-reestruturacao-para-enfrentar-crise.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-07T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Volkswagen obteve o apoio dos sindicatos para implementar a maior reestruturação na história da empresa, com 89 anos. No entanto, os desafios mais significativos ainda estão por vir para a empresa e seu CEO, Oliver Blume.", "titulo_pt": "Volkswagen conquista apoio dos sindicatos para reestruturação histórica", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 149815, "titulo": "STJ paralisa ações e vai discutir abuso em cartão do consignado e dano moral presumido", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/09/stj-paralisa-acoes-e-vai-discutir-abuso-em-cartao-do-consignado-e-dano-moral-presumido.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-07T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Segunda Seção do STJ vai discutir o entendimento sobre ações relacionadas ao cartão consignado e a possibilidade de condenação por dano moral em caso de anulação desses contratos.", "titulo_pt": "STJ discutirá abuso em cartão consignado e dano moral presumido", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 150332, "titulo": "Japan needs artificial intelligence its factories can plug in", "url": "https://www.japantimes.co.jp/commentary/2026/09/07/japan/japan-ai-factories/", "fonte_id": "japan_times", "data_pub": "2026-09-07T09:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A competitividade do Japão dependerá do uso industrial da inteligência artificial em vez de acumular capacidade de cálculo nacional.", "titulo_pt": "Japão precisa que suas fábricas adotem a inteligência artificial", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 150457, "titulo": "LG Energy Solution develops technology to boost LMR battery life", "url": "https://www.koreaherald.com/article/10865485", "fonte_id": "korea_herald", "data_pub": "2026-09-07T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "LG Energy Solution e a Universidade Nacional de Seul desenvolveram uma tecnologia que reduz a geração de gás e melhora a vida ciclística em baterias de íon-lítio ricas em manganes. Os resultados foram publicados na revista Nature Communications.", "titulo_pt": "LG Energy Solution desenvolve tecnologia para melhorar a vida útil das baterias LMR", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 150458, "titulo": "HK inno.N secures world's first EPD for oral medicine", "url": "https://www.koreaherald.com/article/10865484", "fonte_id": "korea_herald", "data_pub": "2026-09-07T09:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A HK inno.N, uma empresa farmacêutica sul-coreana, recebeu o primeiro Certificado de Declaração Ambiental (EPD) para um medicamento oral. O tratamento para refluxo gastroesofágico K-CAB Tab. 50mg foi o primeiro remédio final farmacêutico a ser avaliado com base em padrões internacionais de impacto ambiental ao longo de sua vida útil.", "titulo_pt": "HK inno.N obtém primeiro EPD para medicamento oral", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 150434, "titulo": "Plastics Companies Are Writing Lesson Plans. What Could Go Wrong?", "url": "https://www.wired.com/story/plastics-companies-writing-lesson-plans-what-could-go-wrong/", "fonte_id": "wired", "data_pub": "2026-09-07T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas de plásticos estão oferecendo currículos científicos para escolas, apresentando os plásticos como seguros, recicláveis e uma fonte de empregos bons. Críticos afirmam que isso é propaganda.", "titulo_pt": "Empresas de plásticos estão escrevendo planilhas de aula. O que pode correr mal?", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 150409, "titulo": "HBM4 squeezes DRAM supply as Samsung, SK Hynix inventories fall below 10 days", "url": "https://www.digitimes.com/news/a20260907VL217/samsung-sk-hynix-dram-hbm4-demand.html", "fonte_id": "digitimes", "data_pub": "2026-09-07T08:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os estoques de memória da Samsung Electronics e SK Hynix caíram abaixo de 10 dias de suprimento devido ao aumento da demanda por HBM, DRAM de servidores e SSDs corporativos, impulsionado pela gastos em infraestrutura de IA, de acordo com um relatório da KB Securities em 7 de setembro.", "titulo_pt": "HBM4 reduz suprimento de DRAM enquanto estoques da Samsung e SK Hynix caem abaixo de 10 dias", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 150410, "titulo": "Huawei Kirin 9050 Pro revives flagship chip launches with reported LogicFolding architecture in Mate XT 2", "url": "https://www.digitimes.com/news/a20260907VL215/huawei-kirin-flagship-smartphone-launch-performance.html", "fonte_id": "digitimes", "data_pub": "2026-09-07T08:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Huawei lançou o Kirin 9050 Pro em seu novo smartphone tri-plicado Mate XT 2, marcar a estreia comercial da arquitetura LogicFolding por trás da Lei de Escalabilidade Tau e o primeiro novo chip Kirin de alta performance apresentado pela empresa em seis anos.", "titulo_pt": "Huawei Kirin 9050 Pro revive lançamentos de chip com arquitetura LogicFolding no Mate XT 2", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 150411, "titulo": "STMicroelectronics says humanoid robots must clear a trio of hurdles", "url": "https://www.digitimes.com/news/a20260907PD234/stmicroelectronics-manufacturing-robot-production.html", "fonte_id": "digitimes", "data_pub": "2026-09-07T08:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A STMicroelectronics afirmou que os robôs humanoides provavelmente entrarão primeiro na indústria de manufatura, uma vez que a indústria supera obstáculos relacionados à destreza das mãos, à tomada de decisões de IA nos limites e ao custo total do sistema.", "titulo_pt": "Stmicroelectronics diz que robôs humanoides devem superar três desafios para chegar à manufatura", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 150462, "titulo": "aT offers AI-backed consulting for flower farmers facing climate shifts", "url": "https://www.koreaherald.com/article/10865451", "fonte_id": "korea_herald", "data_pub": "2026-09-07T08:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Korea Agro-Fisheries & Food Trade Corp. (aT) realizou uma sessão de consultoria que combina análise de dados de leilões de flores com orientação de cultivo por especialistas para ajudar os agricultores a lidarem com custos elevados e climas imprevisíveis. O evento ocorreu em uma plantação de rosas em Jincheon, com a participação da Administração de Desenvolvimento Rural.", "titulo_pt": "At oferece consultoria com base em IA para agricultores de flores enfrentarem mudanças climáticas", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 150412, "titulo": "Exclusive: Infineon Dresden fab to hit full capacity in 2-3 years, COO says", "url": "https://www.digitimes.com/news/a20260907PD216/infineon-fab-capacity-digitimes-manufacturing.html", "fonte_id": "digitimes", "data_pub": "2026-09-07T08:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O COO da Infineon, Alexander Gorski, informou em uma entrevista exclusiva ao DIGITIMES durante SEMICON Taiwan 2026 que a nova fábrica em Dresden está sendo expandida mais rapidamente do que as expansões anteriores, graças a ferramentas de inteligência artificial e uma única estratégia de fábrica virtual. A fábrica alcançará sua capacidade total em dois a três anos com a demanda do mercado e do AI aumentando.", "titulo_pt": "Fábrica da infineon em Dresden atingirá capacidade total em 2-3 anos, diz COO", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 150490, "titulo": "European tech weekly recap: €4.6B in deals and August's highlights", "url": "https://tech.eu/2026/09/07/european-tech-weekly-recap-eur46b-in-deals-and-augusts-highlights/", "fonte_id": "tech_eu", "data_pub": "2026-09-07T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No último período, foram acompanhados mais de 50 investimentos em tecnologia com valor superior a 4,6 bilhões de euros e mais de 10 saídas, transações de fusões e aquisições, rumores e notícias relacionadas em toda a Europa.", "titulo_pt": "Recap semanal europeu de tecnologia: r$ 65,1 bilhões em negócios e os destaques de agosto", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 150413, "titulo": "India frames its chip build-out as redundancy for the world, and Taiwan as its partner in building it", "url": "https://www.digitimes.com/news/a20260904VL222/india-semiconductors-supply-chain-packaging-taipei-taiwan-2026.html", "fonte_id": "digitimes", "data_pub": "2026-09-07T08:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os principais policymaker do semicondutor da Índia visitaram Taipei com o objetivo de argumentar que o programa de chips da Índia visa adicionar redundância a uma indústria global concentrada, não substituir as importações por trás de um muro. Isso reconfigura a Índia como uma segunda base de produção para as empresas taiwanesas de materiais, gás, equipamentos e embalagem, que já são solicitadas por seus próprios clientes a trabalharem nesse mercado.", "titulo_pt": "Índia estrutura seu programa de chips como redundância para o mundo e Taiwan como parceira na construção", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 150414, "titulo": "SEMICON Taiwan 2027 moves to August, aligning with TSMC's 40th anniversary", "url": "https://www.digitimes.com/news/a20260907PD232/taiwan-2027-tsmc-ceo-technology.html", "fonte_id": "digitimes", "data_pub": "2026-09-07T08:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SEMICON Taiwan, um dos principais eventos da indústria de semicondutores da Taiwan, transferiu sua edição de 2027 para agosto 18-20, adiantando o evento por quase um mês e desviando da programação tradicional de agosto. O evento, que tem se expandido rapidamente e se concentra cada vez mais na estratégia e na rota tecnológica da TSMC, tem crescido nos últimos anos, mas a nova data levanta preocupações entre algumas empresas da cadeia de suprimentos internacionais devido às férias de verão, ao calor da Taiwan e à temporada de furacões.", "titulo_pt": "SEMICON Taiwan 2027 será realizado em agosto, coincidindo com o 40º aniversário da TSMC", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 150384, "titulo": "China’s Moonshot and Z.ai bring AI model subscription race to Tmall’s retail shelves", "url": "https://www.scmp.com/tech/tech-trends/article/3366617/chinas-moonshot-and-zai-bring-ai-model-subscription-race-tmalls-retail-shelves?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-07T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desenvolvedores de inteligência artificial chineses estão competindo por usuários pagantes em uma nova frente consumista: a plataforma de e-commerce Tmall, da Alibaba, onde modelos de IA estão sendo vendidos ao lado de smartphones, cosméticos e marcas de luxo. Empresas como Moonshot AI e MiniMax estão em discussões para abrir lojas flagship oficiais na plataforma.", "titulo_pt": "Chinês: desafio da IA e Z.AI levam corrida de assinaturas de modelos de IA para prateleiras do Tmall", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 150491, "titulo": "Jaipur Robotics raises €4.3M to bring computer vision to waste plants", "url": "https://tech.eu/2026/09/07/jaipur-robotics-raises-eur43m-to-bring-computer-vision-to-waste-plants/", "fonte_id": "tech_eu", "data_pub": "2026-09-07T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa suíça de IA industrial Jaipur Robotics levantou €4,3 milhões em financiamento de semente para expandir sua tecnologia de visão computacional e automação para usinas de energia a partir de resíduos e outras instalações industriais.", "titulo_pt": "Jaipur Robotics arrecada €4,3 milhões para levar visão computacional a usinas de reciclagem", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 150416, "titulo": "Yaho rides TSMC, Micron expansion wave to tap facility integration, equipment installation market", "url": "https://www.digitimes.com/news/a20260906PD200/equipment-expansion-market-tsmc-micron.html", "fonte_id": "digitimes", "data_pub": "2026-09-07T07:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A indústria de semicondutores está entrando em uma nova fase de expansão, impulsionada por inteligência artificial (IA) e computação de alto desempenho (HPC), com fábricas se estendendo de Taiwan até os Estados Unidos, Japão, Singapura e Europa. A empresa de serviços de engenharia de semicondutores Yaho System Technology está aproveitando essa oportunidade para capturar o mercado de engenharia de instalação de equipamentos e serviços de integração de fábricas.", "titulo_pt": "Yahoo aproveita expansão da indústria de semicondutores para entrar no mercado de engenharia de instalação de equipamentos", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 150447, "titulo": "(2nd LD) Seoul shares spike 4.6 pct to 5-week high on renewed AI optimism", "url": "https://en.yna.co.kr/view/AEN20260907005752320", "fonte_id": "yonhap_news", "data_pub": "2026-09-07T07:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações sul-coreanas subiram 4,6% atingindo um nível não visto em mais de cinco semanas, devido a uma renovação da optimismo em relação à inteligência artificial.", "titulo_pt": "Seul registra alta de 4,6% atingindo nível não visto em cinco semanas devido à otimismo em relação à IA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 150376, "titulo": "China ‘Snakeaholic’ dedicates life to studying, protecting snakes despite losing finger", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3366592/china-snakeaholic-dedicates-life-studying-protecting-snakes-despite-losing-finger?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-07T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Chen Yuanhui, de 77 anos, dedicou sua vida ao estudo e proteção de serpentes, mesmo após ser picado nove vezes e perder um dedo devido ao veneno. Ele descobriu a espécie rara Mangshan pit viper há 37 anos e continua trabalhando na pesquisa e proteção das serpentes, embora o centro de pesquisa onde trabalhava tenha sido encerrado em 1982.", "titulo_pt": "Chinês 'Snakeaholic' dedica vida ao estudo e proteção de serpentes, mesmo após perder dedo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 150377, "titulo": "Rare Beijing spy series highlights real-life intelligence drama with Taiwan", "url": "https://www.scmp.com/news/china/politics/article/3366639/rare-beijing-spy-series-highlights-real-life-intelligence-drama-taiwan?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-07T09:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma série de televisão produzida pela principal agência contra-espionagem de Beijing está destacando casos reais na alta-stakes batalha de inteligência entre a China continental e Taiwan. A série, supervisionada pelo Ministério da Segurança Nacional, aborda esforços de inteligência de 1998 a 2018.", "titulo_pt": "Série de Beijing sobre espionagem realça drama da inteligência entre a china e Taiwan", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 150093, "titulo": "El hábito que aumenta el riesgo de cáncer de próstata hasta en un 30%, según un estudio", "url": "https://www.latercera.com/tendencias/noticia/el-habito-que-aumenta-el-riesgo-de-cancer-de-prostata-hasta-en-un-30-segun-un-estudio/", "fonte_id": "la_tercera", "data_pub": "2026-09-07T09:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo com mais de 17 mil homens identificou uma relação entre uma dieta específica e um aumento de até 30% no risco de câncer de próstata. O estudo associou certos hábitos alimentares a um maior risco do câncer na próstata.", "titulo_pt": "Hábito alimentar aumenta risco de câncer de próstata em 30%, sugere estudo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 150095, "titulo": "Cómo la respiración puede influir en la actividad cerebral y la toma de decisiones, según un estudio", "url": "https://www.latercera.com/tendencias/noticia/como-la-respiracion-puede-influir-en-la-actividad-cerebral-y-la-toma-de-decisiones-segun-un-estudio/", "fonte_id": "la_tercera", "data_pub": "2026-09-07T09:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O estudo examinou como a interação entre diferentes órgãos afeta a função cerebral e a tomada de decisões. Foi conduzido por cientistas do Instituto Alemão de Nutrición Humana Potsdam-Rehbrücke e da Charité – Universitätsmedizin Berlin, em colaboração com outras instituições.", "titulo_pt": "Como a respiração pode influenciar a atividade cerebral e a tomada de decisões, de acordo com um estudo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 150097, "titulo": "Científicos desarrollan un tratamiento que podría ayudar al cerebro a regenerarse después de un ACV", "url": "https://www.latercera.com/tendencias/noticia/cientificos-desarrollan-un-tratamiento-que-podria-ayudar-al-cerebro-a-regenerarse-despues-de-un-acv/", "fonte_id": "la_tercera", "data_pub": "2026-09-07T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os cientistas desenvolveram um biomaterial injetável que pode auxiliar no processo de regeneração cerebral após um acidente vascular cerebral (AVC). Este material pode transformar a cavidade resultante do AVC causado por um coágulo sanguíneo em um ambiente mais favorável para a reparação.", "titulo_pt": "Cientistas desenvolvem biomaterial injetável para auxiliar na regeneração cerebral após avc", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 149822, "titulo": "Extinto há 13 mil anos, 'guepardo' americano era parente do puma", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/extinto-ha-13-mil-anos-guepardo-americano-era-parente-do-puma.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-07T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O felino da América do Norte Miracinonyx trumani, conhecido como guepardo americano, viveu há 13 mil anos e é mais relacionado aos pumas do que ao guepardo africano.", "titulo_pt": "Extinto há 13 mil anos, 'guepardo' americano era parente do puma", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 150481, "titulo": "Treat education as infrastructure during wartime, say researchers in Ukraine", "url": "https://phys.org/news/2026-09-infrastructure-wartime-ukraine.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa sugere que a educação deve ser tratada como infraestrutura durante tempos de guerra. A guerra destrói laboratórios e equipamentos e interrompe as redes humanas que permitem a reprodução da ciência, incluindo orientação, colaborações e ligações informais que transformam estudantes em pesquisadores.", "titulo_pt": "Educacional deve ser considerado infraestrutura durante guerra, dizem pesquisadores na Ucrânia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 150482, "titulo": "'Truly scared': Blazes outpace firefighters in Indonesian Borneo", "url": "https://phys.org/news/2026-09-blazes-outpace-firefighters-indonesian-borneo.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T08:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fuzileiros indonésios trabalham dia e noite, mas não conseguem controlar os incêndios que estão destruindo a paisagem e encolhendo comunidades em uma névoa adocicada de fumaça.", "titulo_pt": "Realmente assustado: incêndios superam bombeiros na Borneo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 150452, "titulo": "Seoul shares spike over 4.6 pct on renewed AI optimism", "url": "https://en.yna.co.kr/view/AEN20260907005700320", "fonte_id": "yonhap_news", "data_pub": "2026-09-07T06:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações sul-coreanas subiram mais de 4,6% na semana, impulsionadas pela renovação da optimismo em relação à inteligência artificial.", "titulo_pt": "Ações sul-coreanas ganham mais de 4,6% com renascimento da optimismo em AI", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 150453, "titulo": "(URGENT) Seoul shares spike over 4 pct on renewed AI optimism", "url": "https://en.yna.co.kr/view/AEN20260907005600320", "fonte_id": "yonhap_news", "data_pub": "2026-09-07T06:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da cidade de Seul subiram mais de 4% devido a uma renovação da esperança em relação à inteligência artificial.", "titulo_pt": "Seul registra alta de 4% nas ações devido à renovação da esperança em AI", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 150486, "titulo": "APOD: 2026 September 7 – The Pelican Nebula in Gas, Dust, and Stars", "url": "https://science.nasa.gov/image-article/apod-2026-september-7-the-pelican-nebula-in-gas-dust-and-stars/", "fonte_id": "nasa_news", "data_pub": "2026-09-07T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia do APOD em 7 de setembro de 2026 apresenta a Nuvem do Pelicanário, mostrando nuvens de gás e poeira, bem como estrelas.", "titulo_pt": "Nuvem do pelicanário em gás, poeira e estrelas", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 150487, "titulo": "A Bright Spot at Mount Michael", "url": "https://science.nasa.gov/earth/earth-observatory/a-bright-spot-at-mount-michael/", "fonte_id": "nasa_news", "data_pub": "2026-09-07T04:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Com o inverno austral prestes a terminar, as nuvens se dissiparam, permitindo uma visão de satélite da atividade vulcânica em uma área remota do Atlântico Sul.", "titulo_pt": "Um ponto brilhante no monte Michael", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 150494, "titulo": "Laughter therapy may help people with chronic lung disease", "url": "https://www.newscientist.com/article/2587748-laughter-therapy-may-help-people-with-chronic-lung-disease/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-09-07T04:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um curso de oito semanas de terapia de riso auto-administrada ajudou um pequeno número de pessoas com doenças pulmonares obstrutivas crônicas a respirarem com mais facilidade.", "titulo_pt": "Terapia de riso pode ajudar pessoas com doenças pulmonares crônicas", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 150483, "titulo": "Growing up socially isolated linked to young people becoming NEET", "url": "https://phys.org/news/2026-09-socially-isolated-linked-young-people.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T00:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente um milhão de jovens no Reino Unido não estão em educação, emprego ou treinamento (NEET). Isolamento social durante a infância e adolescência pode estar associado a esse status.", "titulo_pt": "Crescimento isolado socialmente associado a jovens se tornarem NEET", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 150455, "titulo": "Isaac Newton’s remarkable year — and the plagiarism accusations that followed", "url": "https://www.nature.com/articles/d41586-026-02808-7", "fonte_id": "nature_news", "data_pub": "2026-09-
