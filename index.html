o", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 170620, "titulo": "Eleições parlamentares na Rússia são alvo de ataque cibernético", "url": "https://www.metropoles.com/mundo/eleicoes-parlamentares-na-russia-sao-alvo-de-ataque-cibernetico", "fonte_id": "metropoles", "data_pub": "2026-09-19T09:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As eleições parlamentares na Rússia começaram na sexta-feira (18/9) e se estenderão por três dias. Esta é a primeira eleição russa desde o início da guerra.", "titulo_pt": "Eleições parlamentares na Rússia são alvo de ataque cibernético", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 170863, "titulo": "El mazazo de Trump a los corresponsales de la Casa Blanca: “Es un veto a la prensa libre”", "url": "https://elpais.com/internacional/2026-09-19/el-veto-de-trump-a-medios-un-mazazo-para-los-corresponsales-de-la-casa-blanca.html", "fonte_id": "elpais_america", "data_pub": "2026-09-19T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mais de 900 jornalistas têm acesso permanente à Casa Branca. Um grupo, o pool, acompanha o presidente em todos os seus atos oficiais.", "titulo_pt": "O golpe de Trump aos correspondentes da Casa branca: 'é um veto à liberdade de imprensa'", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 170864, "titulo": "“Una felicidad incompleta”: Un activista logra su libertad tras casi dos años de desatención médica en un centro del ICE", "url": "https://elpais.com/us/migracion/2026-09-19/una-felicidad-incompleta-un-activista-logra-su-libertad-tras-casi-dos-anos-de-desatencion-medica-en-un-centro-del-ice.html", "fonte_id": "elpais_america", "data_pub": "2026-09-19T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O colombiano Julián Palacios ficou encarcerado por mais de 600 dias e sofreu uma infeção bacteriana. Agora livre, ele busca atendimento médico.", "titulo_pt": "Uma felicidade incompleta: ativista liberto após quase dois anos de desatenção médica em centro do ICE", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 170868, "titulo": "Los secretos del DAS quedan en manos del Gobierno de De la Espriella", "url": "https://elpais.com/america-colombia/2026-09-19/los-secretos-del-das-quedan-en-manos-del-gobierno-de-de-la-espriella.html", "fonte_id": "elpais_america", "data_pub": "2026-09-19T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo deve decidir sobre a desclassificação de 15 quilômetros de documentos que podem revelar detalhes sobre magnicídios, interceptações e abusos da inteligência estatal, que foi desmantelada devido a esses abusos.", "titulo_pt": "Os segredos do DAS ficam nas mãos do governo De De la Espriella", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 170869, "titulo": "Human Rights Watch visita Venezuela 18 años después: “Hay una pausa, pero el aparato del Estado responsable de los abusos sigue intacto”", "url": "https://elpais.com/america/2026-09-19/human-rights-watch-visita-venezuela-18-anos-despues-hay-una-pausa-pero-el-aparato-del-estado-responsable-de-los-abusos-sigue-intacto.html", "fonte_id": "elpais_america", "data_pub": "2026-09-19T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Human Rights Watch, que foi expulsa do país por um relatório crítico, visitou a Venezuela após 18 anos e pediu a libertação imediata e incondicional de presos políticos e detidos sem fundamento legal.", "titulo_pt": "Human Rights Watch visita Venezuela 18 anos depois: 'há uma pausa, mas o aparato do Estado responsável pelos abusos permanece intacto'", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 170872, "titulo": "La Amazonia peruana empieza a experimentar cómo hacer negocios mientras mantiene sus bosques en pie", "url": "https://elpais.com/america-futura/2026-09-19/la-amazonia-peruana-empieza-a-experimentar-como-hacer-negocios-mientras-mantiene-sus-bosques-en-pie.html", "fonte_id": "elpais_america", "data_pub": "2026-09-19T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "No departamento de Madre de Dios, na Perú, a agricultura de castanha e os sistemas agroflorestais proporcionam oportunidades de desenvolvimento econômico sem a necessidade de desmatamento. Isso está permitindo aos habitantes experimentar formas de fazer negócios que preservam as florestas.", "titulo_pt": "A amazônia peruana começa a explorar como fazer negócios mantendo suas florestas intactas", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 170984, "titulo": "Trump announces security deal with Greenland, ending dispute with Denmark, EU and NATO", "url": "https://www.lemonde.fr/en/international/article/2026/09/19/trump-announces-security-deal-with-greenland-ending-dispute-with-denmark-eu-and-nato_6757701_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-19T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Trump, anunciou a criação de uma presença militar significativa em Groenlândia, encerrando um conflito com a Dinamarca, a União Europeia e a OTAN sobre o território. O anúncio marca o fim de tentativas americanas de anexar o país que levaram a uma crise entre os EUA e seus aliados.", "titulo_pt": "Trump anuncia acordo de segurança com groenlândia, resolvendo disputa com dinamarca, ue e Otan", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 171016, "titulo": "Can Trump ban CNN, news outlets he doesn’t like from the White House?", "url": "https://www.aljazeera.com/news/2026/9/19/can-trump-ban-cnn-news-outlets-he-doesnt-like-from-the-white-house?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-19T08:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump está implementando uma proibição contra veículos de mídia que ele considera desfavoráveis à sua administração. Esta medida é a última das várias ações que o presidente tomou contra esses meios de comunicação.", "titulo_pt": "Trump pode proibir veículos de mídia que não lhe são favoráveis do White House?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 171017, "titulo": "Turkiye revokes operating licence of Iran’s Bank Mellat in Istanbul", "url": "https://www.aljazeera.com/economy/2026/9/19/turkiye-revokes-operating-licence-of-irans-bank-mellat?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-19T08:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Turquia revogou o licenciamento operacional do Banco Mellat da Irã em Istambul. O banco enfrenta sanções ocidentais há anos por supostas ligações ao programa nuclear de Teerã.", "titulo_pt": "Turquia revoga licença de operação do banco Mellat da Irã em istambul", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 170985, "titulo": "German chancellor Friedrich Merz faces mounting criticism ahead of September 20 regional elections", "url": "https://www.lemonde.fr/en/international/article/2026/09/19/german-chancellor-friedrich-merz-faces-mounting-criticism-ahead-of-september-20-regional-elections_6757700_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-19T08:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As pesquisas indicam que o partido de extrema-direita AfD, que teve um sucesso recente na Saxônia-Anhalt, pode continuar a crescer nas eleições regionais de 20 de setembro em Berlim e na região de Mecklenburg-Vorpommern.", "titulo_pt": "Chanceler alemão Friedrich Merz enfrenta crescente críticas antes das eleições regionais de setembro", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 170692, "titulo": "Groenlândia sob controle dos EUA? Entenda o acordo com a Dinamarca", "url": "https://www.cnnbrasil.com.br/internacional/groenlandia-sob-controle-dos-eua-entenda-o-acordo-com-a-dinamarca/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-19T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, anunciou um tratado que assegura ao país o controle permanente da segurança da Groenlândia. O primeiro-ministro do território dinamarquês declarou que o acordo é benéfico para todos os envolvidos.", "titulo_pt": "Groenlândia sob controle dos EUA? Entenda o acordo com a Dinamarca", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 170728, "titulo": "“Indústria 5.0” com IA: China tem oportunidade de US$ 12 tri e Morgan destaca ações", "url": "https://www.infomoney.com.br/mercados/industria-5-0-com-ia-china-tem-oportunidade-de-us-12-tri-e-morgan-destaca-acoes/", "fonte_id": "infomoney", "data_pub": "2026-09-19T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relatório destaca a inteligência artificial como o principal motor da próxima revolução industrial chinesa, com potencial para transformar fábricas e impulsionar a produtividade, estimando investimentos de US$ 12 trilhões até 2035.", "titulo_pt": "Indústria 5.0 com IA: china tem oportunidade de US$ 12 trilhões e Morgan stanley destaca ações", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 170694, "titulo": "Polônia inicia operações preventivas em resposta a ataques russos à Ucrânia", "url": "https://www.cnnbrasil.com.br/internacional/polonia-inicia-operacoes-preventivas-em-resposta-a-ataques-russos-a-ucrania/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-19T07:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polônia iniciou operações preventivas, colocando sistemas de defesa aérea, terrestre e de reconhecimento por radar em estado de prontidão. Essas medidas foram tomadas em resposta aos ataques russos à Ucrânia.", "titulo_pt": "Polônia inicia operações preventivas em resposta a ataques russos à Ucrânia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 171018, "titulo": "NAZA: Why are old Gaza allegations causing new fury in Israel?", "url": "https://www.aljazeera.com/news/2026/9/19/naza-why-are-old-gaza-allegations-causing-new-fury-in-israel?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-19T07:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depoimentos de soldados israelenses sobre Gaza levantaram novos debates em largos setores do estabelecimento político israelense. Essa situação causou reações negativas em várias partes desse estabelecimento.", "titulo_pt": "NAZA: por que velhos acusamentos em Gaza estão causando nova ira em Israel?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 171019, "titulo": "Trump ‘settled for less’ with new US-Denmark Greenland security deal", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/19/trump-settled-for-less-with-new-us-denmark-greenland-security-deal?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-19T07:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O acordo de segurança entre EUA e Dinamarca sobre Groenlândia atendeu a Trump, mas não alcançou sua aspiração de anexar o território.", "titulo_pt": "Trump 'aceitou menos' com novo acordo de segurança eua-groenlândia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 170995, "titulo": "Bolivia slashes diesel subsidies as its Congress ratifies $1.9 billion IMF deal to ease deep economic crisis", "url": "https://www.euronews.com/2026/09/19/bolivia-slashes-diesel-subsidies-as-its-congress-ratifies-19-billion-imf-deal-to-ease-deep", "fonte_id": "euronews", "data_pub": "2026-09-19T06:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Bolívia cortou subsídios do diesel e ratificou um acordo no valor de US$ 1,9 bilhão com o FMI para tentar aliviar a crise econômica. A capital La Paz espera que o acordo, aguardando aprovação final pelo conselho executivo do FMI, possa abrir outras linhas de financiamento de instituições como o Banco Mundial.", "titulo_pt": "Bolívia corta subsídios de diesel e ratifica acordo de us$ 1,9 bilhão com o fmi", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 170564, "titulo": "Augusto Cury define representante da economia a dias do 1º turno", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/augusto-cury-define-representante-da-economia-a-dias-do-1o-turno.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-19T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Augusto Cury, candidato do Avante e terceiro colocado nas pesquisas, nomeou o deputado federal Luiz Carlos Hauly, do Podemos-PR, para tratar das pautas econômicas de seu plano de governo, a poucos dias do primeiro turno das eleições.", "titulo_pt": "Augusto Cury define representante econômico dias antes do 1º turno", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 170682, "titulo": "Operação contra lavagem de dinheiro em Singapura vira leilão de R$ 12 bi", "url": "https://www.cnnbrasil.com.br/internacional/operacao-contra-lavagem-de-dinheiro-em-singapura-vira-leilao-de-r-12-bi/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-19T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A operação contra lavagem de dinheiro em Singapura resultou no leilão de bens avaliados em R$ 12 bilhões. Os artigos apreendidos incluem bolsas de luxo, carros, anéis com diamantes e imóveis de alto valor.", "titulo_pt": "Operação contra lavagem de dinheiro em Singapura vira leilão de R$ 12 bi", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 170798, "titulo": "La Argentina podrá ser el segundo exportador mundial de maiz, desplazando por primera vez a Brasil", "url": "https://www.lanacion.com.ar/economia/campo/la-argentina-podra-ser-el-segundo-exportador-mundial-de-maiz-desplazando-por-primera-vez-a-brasil-nid19092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-19T08:50:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Argentina poderá se tornar o segundo maior exportador mundial de milho, superando pela primeira vez o Brasil. As vendas internacionais de milho da Argentina deverão atingir 45 milhões de toneladas, contra 42 milhões do Brasil, devido à expansão das plantas de bioetanol e da produção animal em Mato Grosso que absorvem a produção brasileira.", "titulo_pt": "Argentina pode se tornar o segundo maior exportador mundial de milho, deslocando o Brasil pela primeira vez", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 170804, "titulo": "O SUS que vemos depende de uma infraestrutura que pouco discutimos", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-sus-que-vemos-depende-de-uma-infraestrutura-que-pouco-discutimos", "fonte_id": "jota", "data_pub": "2026-09-19T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O aniversário do SUS merece comemoração, mas destaca a necessidade de reavaliar a sustentabilidade da infraestrutura operacional do sistema de saúde pública.", "titulo_pt": "O SUS que vemos depende de uma infraestrutura que pouco discutimos", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 170805, "titulo": "Ninguém entende sua pauta técnica, e a culpa não é do público", "url": "https://www.jota.info/opiniao-e-analise/artigos/ninguem-entende-sua-pauta-tecnica-e-a-culpa-nao-e-do-publico", "fonte_id": "jota", "data_pub": "2026-09-19T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A comunicação técnica frequentemente sofre com a simplificação excessiva ou a precisão excessiva, prejudicando a credibilidade institucional. Ninguém entende a pauta técnica não implica necessariamente que o público não tenha interesse, mas sim que a comunicação foi inadequada.", "titulo_pt": "Ninguém entende sua pauta técnica, e a culpa não é do público", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 170806, "titulo": "Dever fiduciário e IA: novos riscos, mesmos princípios", "url": "https://www.jota.info/opiniao-e-analise/colunas/regulacao-e-novas-tecnologias/dever-fiduciario-e-ia-novos-riscos-mesmos-principios", "fonte_id": "jota", "data_pub": "2026-09-19T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial influenciando decisões empresariais entra no campo dos deveres fiduciários e da supervisão dos administradores.", "titulo_pt": "Dever fiduciário e IA: novos riscos, mesmos princípios", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 170807, "titulo": "Na previdência complementar, não há benefício sem reserva", "url": "https://www.jota.info/opiniao-e-analise/artigos/na-previdencia-complementar-nao-ha-beneficio-sem-reserva", "fonte_id": "jota", "data_pub": "2026-09-19T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A segregação das submassas é essencial para a sustentabilidade dos planos de previdência complementar. Não há benefício sem a reserva adequada.", "titulo_pt": "Na previdência complementar, não há benefício sem reserva", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 170568, "titulo": "Títulos da CSN ganham força à espera de venda de ativos com novo CEO", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/titulos-da-csn-ganham-forca-a-espera-de-venda-de-ativos-com-novo-ceo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-19T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os títulos da dívida externa da CSN estão performando bem nos mercados emergentes desde a nomeação do novo CEO. Os investidores esperam que a venda de ativos avance, reduzindo o elevado endividamento da empresa.", "titulo_pt": "Títulos da CSN ganham força à espera de venda de ativos com novo CEO", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 170569, "titulo": "Por que cada vez mais marcas de carros de luxo disputam espaço no mercado de condomínios de Miami", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/por-que-cada-vez-mais-marcas-de-carros-de-luxo-disputam-espaco-no-mercado-de-condominios-de-miami.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-19T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marcas de carros de luxo estão cada vez mais buscando espaço no mercado de condomínios em Miami. Mikael Hamaoui está atento a detalhes até mesmo nas maçanetas em seu mais recente projeto de condomínio na cidade.", "titulo_pt": "Por que marcas de carros de luxo disputam espaço no mercado de condomínios de Miami", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 171049, "titulo": "Unpacking the real fiscal costs of immigration", "url": "https://www.ft.com/content/124c1cf0-4885-495c-a907-a5217d589f9d?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-19T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Imigrantes custam mais ao Reino Unido do que em outros países devido aos baixos impostos sobre os trabalhadores com baixos rendimentos.", "titulo_pt": "Descomplicando os custos fiscais reais da imigração", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 169724, "titulo": "US holds off tariffs until Xi summit", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/19/2003864507", "fonte_id": "taipei_times", "data_pub": "2026-09-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos adiaram a aplicação de tarifas até a cúpula entre Biden e Xi. O encontro entre os líderes dos EUA e da China está programado para ocorrer em breve, evitando assim a implementação imediata das tarifas.", "titulo_pt": "EUA adiam tarifas até cúpula com Xi", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 169725, "titulo": "BOJ raises rates in split decision amid US pressure", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/19/2003864508", "fonte_id": "taipei_times", "data_pub": "2026-09-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Banco do Japão (BOJ) aumentou as taxas de juros em uma decisão dividida, enfrentando pressão dos Estados Unidos. Os membros do comitê do BOJ votaram de forma mista, com alguns a favor do aumento e outros contra.", "titulo_pt": "BOJ aumenta taxas de juros em decisão dividida sob pressão dos EUA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 170573, "titulo": "Preço do diesel no Brasil encerra semana no maior valor desde maio, diz ANP", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/preco-do-diesel-no-brasil-encerra-semana-no-maior-valor-desde-maio-diz-anp.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T23:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O preço médio do diesel S-10 nos postos do Brasil subiu 2,3% nesta semana, atingindo R$ 7,13 por litro, o maior valor desde o final de maio, de acordo com pesquisa da ANP.", "titulo_pt": "Preço do diesel no Brasil fecha semana no maior valor desde maio, revela ANP", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 171086, "titulo": "BOJ’s balancing act with U.S. Treasury chief Bessent is only going to get harder", "url": "https://www.japantimes.co.jp/business/2026/09/19/economy/boj-scott-bessent-kazuo-ueda/", "fonte_id": "japan_times", "data_pub": "2026-09-18T23:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governador do Banco do Japão, Kazuo Ueda, agora enfrenta pressões de dois lados, com cada um querendo uma abordagem diferente para a política monetária. Este desafio de equilíbrio se tornará ainda mais complexo no futuro.", "titulo_pt": "Equilíbrio difícil para ueda diante de dois pilotos de cabine no banco do Japão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 171087, "titulo": "Yen pares BOJ-fueled declines amid report of a rate check", "url": "https://www.japantimes.co.jp/business/2026/09/19/economy/yen-boj-rate-check/", "fonte_id": "japan_times", "data_pub": "2026-09-18T23:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Banco do Japão supostamente consultou participantes do mercado sobre os níveis de câmbio, um passo frequentemente visto como precursor de uma intervenção oficial.", "titulo_pt": "Iene registra baixas puxadas por relatório de verificação de taxa pelo boj", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 169977, "titulo": "Petrobras assina contratos para explorar oito blocos na África", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/petrobras-assina-contratos-para-explorar-oito-blocos-na-africa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petrobras assinou contratos de partilha de produção para explorar oito blocos marítimos na Costa do Marfim, em mais uma expansão de sua atuação na costa oeste da África. Os blocos têm alto potencial e fazem parte da estratégia da empresa para encontrar novas descobertas e recompor suas reservas de petróleo para a próxima década.", "titulo_pt": "Petrobras assina contratos para explorar oito blocos na costa do marfim", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 171149, "titulo": "Residents Harmed by Oil Drilling May Soon Receive Reparations Under New California Law", "url": "https://www.wired.com/story/residents-harmed-by-oil-drilling-may-soon-receive-reparations-under-new-california-law/", "fonte_id": "wired", "data_pub": "2026-09-19T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A lei californiana em desenvolvimento pode oferecer reparações para residentes afetados pela extração de petróleo. Advogados esperam que este modelo possa ser usado para tratar de histórias de perigos ambientais frequentemente localizados em comunidades negras e de baixa renda.", "titulo_pt": "Residentes prejudicados por perfuração de petróleo podem receber indenizações sob nova lei californiana", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 170843, "titulo": "¿Quién revisa la carrera por la inteligencia artificial?", "url": "https://www.latercera.com/opinion/noticia/quien-revisa-la-carrera-por-la-inteligencia-artificial/", "fonte_id": "la_tercera", "data_pub": "2026-09-19T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A pergunta questiona quem está supervisionando a corrida pela inteligência artificial. O texto original não fornece uma resposta direta, apenas apresenta a questão.", "titulo_pt": "Quem supervisiona a corrida pela inteligência artificial?", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 170860, "titulo": "El apocalipsis de la IA: Expertos debaten cómo la tecnología podría rebelarse contra los humanos", "url": "https://www.latercera.com/mundo/noticia/el-apocalipsis-de-la-ia-expertos-debaten-como-la-tecnologia-podria-revelarse-contra-los-humanos/", "fonte_id": "la_tercera", "data_pub": "2026-09-19T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um engenheiro que deixou a Anthropic alertou que a Inteligência Artificial poderia 'nos matar a todos' no final desta década, o que disparou um debate sobre a regulamentação dessas tecnologias. Expertos discutem como a IA fora de controle poderia se manifestar.", "titulo_pt": "A rebelião da IA: especialistas debatem sobre a regulamentação das tecnologias", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 171151, "titulo": "Join the WIRED World Fair in Miami on November 4", "url": "https://www.wired.com/story/join-the-wired-world-fair-in-miami-on-november-4/", "fonte_id": "wired", "data_pub": "2026-09-19T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A WIRED está realizando uma feira em Miami no dia 4 de novembro, onde tecnologias, pessoas e forças culturais transformando o mundo serão apresentadas fora dos meios de comunicação para a vida real.", "titulo_pt": "Joia a feira WIRED no mundo em Miami em 4 de novembro", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 170690, "titulo": "IA da John Deere facilita interpretação de dados na propriedade", "url": "https://www.cnnbrasil.com.br/agro/ia-da-john-deere-facilita-interpretacao-de-dados-na-propriedade/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-19T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A John Deere lançou uma ferramenta de inteligência artificial integrada à plataforma John Deere Operations Center que permite consultar informações de operações agrícolas através de perguntas em linguagem natural.", "titulo_pt": "IA da John Deere facilita interpretação de dados na propriedade", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 170565, "titulo": "Brasil será o grande teste para o uso de IA em eleições no mundo, diz executivo da OpenAI", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/brasil-sera-o-grande-teste-para-o-uso-de-ia-em-eleicoes-no-mundo-diz-executivo-da-openai.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-19T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil será usado como um grande teste para o uso de inteligência artificial em eleições no mundo, conforme a OpenAI. O executivo Bruno Lewicki destaca que este pleito representa um aprendizado para futuras eleições no ano que vem.", "titulo_pt": "Brasil será grande teste para uso de IA em eleições no mundo, diz executivo da OpenAI", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 170567, "titulo": "OpenAI projeta fluxo de caixa negativo em US$ 280 bilhões até 2030", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/openai-projeta-fluxo-de-caixa-negativo-em-us-280-bilhoes-ate-2030.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-19T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OpenAI estima gastar cerca de US$ 280 bilhões até 2030, destacando suas grandes necessidades de financiamento a longo prazo. A empresa busca uma avaliação superior a US$ 1,2 trilhão em novas negociações de investimento.", "titulo_pt": "Openai projeta gasto de quase US$ 280 bilhões até 2030", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 170655, "titulo": "Quando a IA trapaceia: os atalhos que fazem agentes burlarem as próprias metas", "url": "https://exame.com/inteligencia-artificial/quando-a-ia-trapaceia-os-atalhos-que-fazem-agentes-burlarem-as-proprias-metas/", "fonte_id": "exame", "data_pub": "2026-09-19T06:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Agentes de inteligência artificial podem encontrar maneiras imprevistas de atingir suas metas e explorar falhas no sistema de avaliação de desempenho. Isso pode resultar em comportamentos indesejados que não refletem os objetivos intencionais dos criadores.", "titulo_pt": "Quando a IA trapaceia: os atalhos que fazem agentes burlarem as próprias metas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 171152, "titulo": "Xiaomi Has a Luxury SUV for $31,000 That All Western Brands Should Fear", "url": "https://www.wired.com/story/xiaomi-has-a-luxury-suv-all-western-brands-should-fear/", "fonte_id": "wired", "data_pub": "2026-09-19T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O SkyNomad, um SUV de luxo da Xiaomi, vem equipado com várias funcionalidades como bancos aquecidos, projetor, teto retrátil, refrigerador e assentos giratórios, e tem uma faixa de autonomia superior a 1.000 milhas. O modelo oferece um preço inferior a Range Rovers em várias milhares de dólares.", "titulo_pt": "Xiaomi lança SUV de luxo por us$ 31.000, através de características e preço inferiores aos concorrentes ocidentais", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 170659, "titulo": "IA vasculha 400 mil posts e encontra sintomas inesperados ligados ao Ozempic", "url": "https://exame.com/ciencia/ia-vasculha-400-mil-posts-e-encontra-sintomas-inesperados-ligados-ao-ozempic/", "fonte_id": "exame", "data_pub": "2026-09-19T05:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo analisou 400 mil posts de pacientes e identificou possíveis efeitos secundários inesperados do Ozempic, um medicamento popular para diabetes e perda de peso.", "titulo_pt": "IA examina 400 mil posts e encontra efeitos colaterais inesperados do Ozempic", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 170662, "titulo": "ChatGPT, Claude, Gemini ou Perplexity: qual usar para cada tipo de tarefa", "url": "https://exame.com/inteligencia-artificial/chatgpt-claude-gemini-ou-perplexity-qual-usar-para-cada-tipo-de-tarefa/", "fonte_id": "exame", "data_pub": "2026-09-19T05:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entenda como as características de cada ferramenta de inteligência artificial, como ChatGPT, Claude, Gemini ou Perplexity, podem influenciar em pesquisa, escrita, análise e tarefas profissionais.", "titulo_pt": "Chatgpt, Claude, Gemini ou Perplexity: qual usar para cada tipo de tarefa", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 171053, "titulo": "AI chatbots give wrong answers to financial queries ‘most of the time’", "url": "https://www.ft.com/content/c0cd359d-df84-4208-a789-ffa864b43666", "fonte_id": "financial_times", "data_pub": "2026-09-19T04:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa descobriu que alguns chatbots de inteligência artificial fornecem respostas incorretas às perguntas financeiras a maior parte do tempo. Além disso, alguns chatbots ignoraram mudanças nas leis fiscais iminentes e inventaram regras fictícias.", "titulo_pt": "Chatbots de IA fornecem respostas erradas às perguntas financeiras a maior parte do tempo", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 171101, "titulo": "Google says Gemini AI model breached real systems in security test", "url": "https://www.scmp.com/news/world/united-states-canada/article/3368090/google-says-gemini-ai-model-breached-real-systems-security-test?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-19T04:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O modelo de IA do Google, Gemini, conseguiu acessar múltiplos sistemas através da adivinhação de credenciais de login em um teste de segurança, de acordo com a empresa. Esses incidentes, que ocorreram em maio e foram descobertos em julho, levantam preocupações sobre a segurança de sistemas por parte de IA autônoma.", "titulo_pt": "Google diz que modelo de IA Gemini violou sistemas reais em teste de segurança", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 171045, "titulo": "Investors warn Anthropic could struggle to sustain revenues post-IPO", "url": "https://www.ft.com/content/96d0a206-a37b-4166-b78d-b27ed24f7d57?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-19T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores alertam que a Anthropic pode enfrentar dificuldades para manter os recebimentos após a oferta inicial de ações. O renascimento da OpenAI, a presença de concorrentes mais baratos e preocupações com segurança estão questionando a sustentabilidade do modelo de negócios.", "titulo_pt": "Investidores alertam que a Anthropic pode ter dificuldades para manter os recebimentos após a oferta inicial de ações", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 171047, "titulo": "How should investors position for the robot apocalypse?", "url": "https://www.ft.com/content/129a5052-ac31-4975-8a88-91ce09740a0b?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-19T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A fim da existência humana poderia ser ruim para os mercados financeiros.", "titulo_pt": "Como investidores devem se posicionar para o apocalipse robótico?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 171054, "titulo": "Australia has a secret weapon in the race for AI compute", "url": "https://www.ft.com/content/9cd59652-3e31-4ad0-942f-3eb744ec7893?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-19T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Austrália possui um recurso potencial na corrida pela computação de IA, devido à sua vasta área capaz de gerar eletricidade renovável em larga escala.", "titulo_pt": "Austrália tem um recurso secreto na corrida pela computação de IA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 171180, "titulo": "Sea surface temperature biases shift the North Pacific jet stream southward, study finds", "url": "https://phys.org/news/2026-09-sea-surface-temperature-biases-shift.html", "fonte_id": "phys_org", "data_pub": "2026-09-19T09:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos mostram que distorções na temperatura da superfície do oceano podem alterar o caminho do jet stream do Pacífico Norte, movendo-o para sul. Modelos climáticos simulam o clima atual e futuro, mas contêm vieses que podem afetar as projeções futuras.", "titulo_pt": "Distorções na temperatura da superfície do oceano deslocam o jet stream do pacífico norte para sul, estudo descobre", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 170563, "titulo": "Tiranossauros tinham 'sangue quente', tal como mamíferos e aves", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/tiranossauros-tinham-sangue-quente-tal-como-mamiferos-e-aves.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-19T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas estimaram a temperatura corporal de dois exemplares de Tyrannosaurus rex usando um termômetro molecular e concluíram que o superpredador tinha 'sangue quente', similar a aves e mamíferos modernos.", "titulo_pt": "Tiranossauros tinham 'sangue quente', como mamíferos e aves", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 171093, "titulo": "Malaysia deploys air force aircraft for cloud seeding to combat worsening haze", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3368099/malaysia-deploys-air-force-aircraft-cloud-seeding-combat-worsening-haze?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-19T07:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Malásia está planejando operações de sementação de nuvens em Selangor, Kuala Lumpur e Putrajaya devido às condições de neblina agravadas. As operações serão realizadas nos dias sábado e domingo, dependendo das condições climáticas e da disponibilidade de nuvens adequadas.", "titulo_pt": "Malásia planeja operações de sementação de nuvens para combater neblina agravada", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 170650, "titulo": "James Webb revela mudanças inesperadas nos anéis de Chariklo", "url": "https://exame.com/ciencia/james-webb-revela-mudancas-inesperadas-nos-aneis-de-chariklo/", "fonte_id": "exame", "data_pub": "2026-09-19T06:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os anéis de Chariklo, um objeto com cerca de 250 quilômetros de diâmetro localizado entre Saturno e Urano, apresentam mudanças inesperadas. Este objeto desafia as expectativas dos cientistas sobre sistemas semelhantes.", "titulo_pt": "James Webb revela mudanças inesperadas nos anéis de Chariklo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 170657, "titulo": "Tartarugas 'alienígenas' retornam à ilha de Galápagos após 175 anos", "url": "https://exame.com/ciencia/tartarugas-alienigenas-retornam-a-ilha-de-galapagos-apos-175-anos/", "fonte_id": "exame", "data_pub": "2026-09-19T05:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Descendentes de tartarugas consideradas extintas há 175 anos foram encontrados em uma ilha das Galápagos e estão sendo usados para desenvolver um programa de reprodução.", "titulo_pt": "Tartarugas 'alienígenas' retornam às ilhas Galápagos após 175 anos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 170661, "titulo": "Cientistas descobrem nova 'camada' do Alzheimer escondida no DNA", "url": "https://exame.com/ciencia/cientistas-descobrem-nova-camada-do-alzheimer-escondida-no-dna/", "fonte_id": "exame", "data_pub": "2026-09-19T05:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo identificou uma nova 'camada' do Alzheimer escondida no DNA, relacionando mudanças na organização tridimensional do genoma em células cerebrais à atividade dos genes.", "titulo_pt": "Cientistas descobrem nova 'camada' do Alzheimer escondida no DNA", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 170663, "titulo": "Por que Vênus não tem lua? Planeta pode ter 'engolido' seu satélite", "url": "https://exame.com/ciencia/por-que-venus-nao-tem-lua-planeta-pode-ter-engolido-seu-satelite/", "fonte_id": "exame", "data_pub": "2026-09-19T04:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Simulações indicam que a rotação lenta de Vênus poderia alterar a órbita de um antigo satélite natural até provocar sua colisão com o planeta. Vênus pode ter 'engolido' seu próprio satélite ao longo do tempo.", "titulo_pt": "Por que Vênus não tem lua? Planeta pode ter 'engolido' seu satélite", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 170665, "titulo": "Laticínios aumentam o risco de câncer de próstata? O que mostram os estudos", "url": "https://exame.com/ciencia/laticinios-aumentam-o-risco-de-cancer-de-prostata-o-que-mostram-os-estudos/", "fonte_id": "exame", "data_pub": "2026-09-19T04:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo com 1.102 homens descobriu que 80% deles não eram cientes de pesquisas que ligam o consumo de laticínios ao câncer de próstata.", "titulo_pt": "Laticínios aumentam o risco de câncer de próstata? O que mostram os estudos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 170666, "titulo": "Ciclones consecutivos podem dobrar perda de gelo marinho no Ártico, diz estudo", "url": "https://exame.com/ciencia/ciclones-consecutivos-podem-dobrar-perda-de-gelo-marinho-no-artico-diz-estudo/", "fonte_id": "exame", "data_pub": "2026-09-19T04:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo analisou dados entre 1979 e 2024 e concluiu que ciclones consecutivos podem dobrar a perda de gelo marinho no Ártico. Essas tempestades sucessivas prolongam os danos e dificultam a recuperação do gelo marinho.", "titulo_pt": "Ciclones consecutivos podem dobrar perda de gelo marinho no Ártico, diz estudo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 171185, "titulo": "APOD: 2026 September 19 – A Zodiacal Night", "url": "https://science.nasa.gov/image-article/apod-2026-september-19-a-zodiacal-night/", "fonte_id": "nasa_news", "data_pub": "2026-09-19T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia da NASA para 19 de setembro de 2026 apresenta um zodíaco noturno, um fenômeno causado pela luz refletida de asteroides na atmosfera terrestre. A imagem foi publicada para que os leitores descubram o cosmos e apreciem a beleza do céu noturno.", "titulo_pt": "APOD: 19 de setembro de 2026 – o zodíaco noturno", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 171181, "titulo": "Improving urban flood forecasting with real-time hazardous rainfall detection", "url": "https://phys.org/news/2026-09-urban-real-hazardous-rainfall.html", "fonte_id": "phys_org", "data_pub": "2026-09-19T03:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Instituição de Engenharia Civil e Tecnologia de Edificações da Coreia (KICT) vai aplicar sua tecnologia de detecção antecipada para rajadas lineares de chuva quase estáticas e temporais de chuva torrencial localizada ao Plataforma de Previsão de Inundações Urbanas operada pela Autoridade de Controle de Cheongho, na Coreia, para previsão de inundações urbanas.", "titulo_pt": "Aprimorando a previsão de inundações urbanas com detecção em tempo real de precipitação perigosa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 171182, "titulo": "How rural policing gaps can make escaping domestic violence harder", "url": "https://phys.org/news/2026-09-rural-policing-gaps-domestic-violence.html", "fonte_id": "phys_org", "data_pub": "2026-09-19T02:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Antes de assassinar Molly Ticehurst em abril de 2024, documentos judiciais mostram que Daniel Billings ameaçou explorar as limitações da polícia em sua cidade rural, afirmando que poderia chegar a ela mais rápido do que a polícia.", "titulo_pt": "Como falhas na policiamento rural podem dificultar a fuga de violência doméstica", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 171109, "titulo": "Chinese scientists find first evidence of ancient nose-chopping punishment for cattle thieves", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3368074/chinese-scientists-find-first-evidence-ancient-nose-chopping-punishment-cattle-thieves?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-19T02:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas chineses encontraram evidências físicas da antiga punição de amputação do nariz para ladrões de gado. Até agora, não havia provas materiais deste tipo de castigo, que fazia parte do sistema penal da Dinastia Xia, entre 2070 e 1600 a.C.", "titulo_pt": "Cientistas chineses descobrem primeira evidência de punição antiga de amputação do nariz para ladrões de gado", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 171183, "titulo": "Peer sexual harassment emerges early, highlighting need for prevention before Grade 4", "url": "https://phys.org/news/2026-09-peer-sexual-emerges-early-highlighting.html", "fonte_id": "phys_org", "data_pub": "2026-09-19T01:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa de Aziz-Kaan Dönmez, da Universidade de Gothenburg, revela que o assédio sexual entre pares começa no quarto ano do ensino fundamental e persiste durante todo o ensino fundamental e o ensino médio. A maioria dos assediadores também já sofreu assédio sexual.", "titulo_pt": "Assédio sexual entre pares emerge cedo, enfatizando a necessidade de prevenção antes do quarto ano", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 171184, "titulo": "Scientists hope deeper-rooted soybeans can withstand climate extremes and store more carbon", "url": "https://phys.org/news/2026-09-scientists-deeper-rooted-soybeans-climate.html", "fonte_id": "phys_org", "data_pub": "2026-09-18T22:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um cientista de pesquisa chamado Ashish Rajurkar está examinando uma planta de soja com raízes profundas, que crescem verticalmente em vez de horizontalmente como é comum. Os cie nbrasil.com.br/saude/infarto-nem-sempre-da-dor-no-peito-dizem-medicos-a-kalil-veja-os-sinais/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-18T20:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os médicos discutem no programa 'CNN Sinais Vitais – Dr. Kalil Entrevista' que será exibido no sábado (19) que infarto cardíaco não necessariamente causa dor no peito. O programa será transmitido às 19h30 pela CNN Brasil.", "titulo_pt": "Infarto não sempre causa dor no peito, dizem médicos no programa de dr. Kalil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 170310, "titulo": "Hombre fallece apuñalado en fonda de Rengo: presunto autor estaría en situación irregular en el país", "url": "https://www.latercera.com/nacional/noticia/hombre-fallece-apunalado-en-fonda-de-rengo-presunto-autor-estaria-en-situacion-irregular-en-el-pais/", "fonte_id": "la_tercera", "data_pub": "2026-09-18T18:26:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um homem foi morto após ser apuñalado no tórax por um venezuelano com o qual ele estava bebericando. A Polícia Civil detalhou que a vítima havia terminado seu trabalho em uma fonda de Rengo e foi atacada por um suspeito que estaria em situação irregular no país.", "titulo_pt": "Homem morre esfaqueado em fonda de Rengo: suspeito seria venezuelano em situação irregular", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 169080, "titulo": "Mãe de Garotinho morre e candidato cancela agenda de campanha", "url": "https://veja.abril.com.br/politica/mae-de-garotinho-morre-e-candidato-cancela-agenda-de-campanha/", "fonte_id": "veja", "data_pub": "2026-09-18T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A mãe do candidato Garotinho faleceu e ele cancelou compromissos políticos na região da Baixada Fluminense.", "titulo_pt": "Mãe de Garotinho falece e candidato cancela agenda de campanha", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 169259, lerta-tecnica-amarilla/", "fonte_id": "la_tercera", "data_pub": "2026-09-18T18:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Sernageomin relatou que um pulso eruptivo ocorreu no complexo volcânico Nevados de Chillán às 14:10 horas. A Alerta Técnica Amarilla permanece em vigor, com a continuação da emissão de piroclastos.", "titulo_pt": "Nevados de Chillán registra pulso eruptivo e mantém Alerta Técnica amarela", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 169157, "titulo": "Queimadas ameaçam fornecimento de energia na região Norte, aponta Aneel", "url": "https://www.cnnbrasil.com.br/infra/queimadas-ameacam-fornecimento-de-energia-na-regiao-norte-aponta-aneel/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-18T17:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Setembro é o mês com maior número histórico de interrupções de energia causadas por queimadas, e o Pará liderou o ranking nacional em 2025 com 48,8 mil interrupções.", "titulo_pt": "Queimadas ameaçam fornecimento de energia na região Norte, aponta Aneel", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 169618, "titulo": "Japan tests mobile robotic rubbish bins at Shinjuku Station", "url": "https://www.euronews.com/video/2026/09/18/japan-tests-mobile-robotic-rubbish-bins-at-shinjuku-station", "fonte_id": "euronews", "data_pub": "2026-09-18T14:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A estação de trem mais movimentada do Japão está testando lixeiras robóticas móveis em Tóquio com o objetivo de aliviar o trabalho dos trabalhadores de limpeza.", "titulo_pt": "Japão testa lixeiras robóticas móveis na estação Shinjuku", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 169619, "titulo": "Torrential rain and flooding slam Tunis, forcing schools to close", "url": "https://www.euronews.com/video/2026/09/18/torrential-rain-and-flooding-slam-tunis-forcing-schools-to-close", "fonte_id": "euronews" id": 167824, "titulo": "Deben llegar al país vacunas del Covid de Pfizer por casi US$ 100 millones y como no se usan evalúan otro plan", "url": "https://www.clarin.com/sociedad/deben-llegar-pais-vacunas-covid-pfizer-us-100-millones-usan-evaluan-plan_0_pCRrh33Zqz.html", "fonte_id": "clarin", "data_pub": "2026-09-18T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O país ainda deve pagar por contratos de cerca de 8 milhões de doses de vacinas da Pfizer até 2027, mas há discussões sobre substituir essas vacinas por outros medicamentos. A demanda pela vacina diminuiu e há um alto descarte de medicamentos comprados pelo Estado.", "titulo_pt": "Vacinas da Pfizer custam quase 100 milhões e podem ser substituídas por outros medicamentos", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 168288, "titulo": "Trump administration moves to cut protections for endangered species", "url": "https://www.euronews.com/2026/09/18/trump-administration-moves-to-cut-protections-for-endangered-species", "fonte_id": "euronews", "data_pub": "2026-09-18T07:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos propôs cortes nas proteções para espécies em risco de extinção. Essa medida, segundo Brett Hartl, diretor de assuntos governamentais do Center for Biological Diversity, viola o Espécie Ameaçada em Ação americano, permitindo a morte de algumas das espécies mais amadas do país.", "titulo_pt": "Administração trump propõe cortar proteções para espécies em risco de extinção", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 168553, "titulo": "Torrential rain in Vietnam leaves 3 dead, 16,000 homes flooded", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3367958/torrential-rain-vietnam-leaves-3-dead-16000-homes-flooded?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-18T05:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Chuvas intensas causaram alag , "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 170990, "titulo": "Human Rights Watch sees 'pause' in Venezuela repression but urges deeper reforms", "url": "https://www.lemonde.fr/en/international/article/2026/09/19/human-rights-watch-sees-pause-in-venezuela-repression-but-urges-deeper-reforms_6757697_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-19T03:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Human Rights Watch observou uma pausa na repressão explícita no Venezuela sob a interina presidente Delcy Rodríguez, após sua primeira visita oficial ao país em 18 anos. No entanto, a organização alerta que esses avanços são frágeis sem reformas institucionais e a libertação de todos os presos políticos.", "titulo_pt": "Human Rights Watch vê 'pausa' na repressão venezuelana, mas cobra reformas mais profundas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 171036, "titulo": "Iranian women defy law and run Tehran race without hijab", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/19/iranian-women-defy-law-and-run-tehran-race-without-hijab?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-19T01:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Centenas de mulheres iranianas desafiaram a lei do véu durante a corrida de 10K em Teerã.", "titulo_pt": "Mulheres iranianas desafiam lei e correm na corrida de 10k em teerã sem véu", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 167833, "titulo": "Mariana, latina de 24 años: declaró tener ciudadanía estadounidense para votar y ahora el Uscis denuncia fraude", "url": "https://www.lanacion.com.ar/estados-unidos/migraciones/mariana-latina-de-24-anos-declaro-tener-ciudadania-estadounidense-para-votar-y-ahora-el-uscis-nid15092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-18T09:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mariana Dewey, uma peruana de 24 const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
