<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

<div class="modal-overlay" id="modal-flag">

</div>

<script>
const D = {"gerado_em": "10/08/2026 07:16", "stats": {"noticias_novas": 448, "resumos_gerados": 220}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "No primeiro turno das eleições presidenciais, uma pesquisa do BTG/Nexus divulgada entre 7 e 9 de agosto mostrou que Lula obteve 40% dos votos contra 35% para Flávio Bolsonaro. A pesquisa não registrou grandes mudanças em relação à anterior entre os candidatos principais. O Congresso Nacional retomou suas sessões com uma semana de trabalho intenso para aprovar pautas de consenso antes das eleições, apesar da baixa presença de parlamentares. A falta de recursos e estrutura para as campanhas está dificultando a vida dos candidatos jovens, afetando tanto os partidos de esquerda quanto os de direita, conforme uma pesquisa recente indicou.", "mundo": "Um ex-deputado tailandês chamado Chalong Riewrang fez um live no YouTube confessando o assassinato de um funcionário do governo. Na Groenlândia, houve uma advertência contra a perfuração exploratória realizada pela empresa norte-americana Greenland Energy sem aprovação local. O governo da Itália anunciou novos dispositivos chamados 'identitari', que incluem uma pistola de água e um secador com paleta, visando permitir a continuidade da construção em áreas protegidas. Em outro desenvolvimento, a Ucrânia realizou ataques com drones contra a cidade russa de Nizhnekamsk, resultando na morte de 13 pessoas, incluindo uma criança, e ferindo outras 39. Além disso, o Departamento de Defesa dos Estados Unidos investiu em uma mineradora australiana de minerais rares, levando à valorização da empresa. Por fim, o primeiro-ministro australiano Anthony Albanese e o líder da oposição Angus Taylor se encontraram para avançar no acordo sobre publicidade de apostas, cedendo às pressões e limitando as induções de apostas.\n\nOs conflitos geopolíticos continuam dominando o cenário internacional. Em primeiro lugar, Israel realizou um ataque que causou uma 'explosão major' no sul do Líbano, de acordo com relatos da agência estatal NNA. Além disso, outros ataques foram registrados em territórios vizinhos. No entanto, a tensão entre Israel e os Estados Unidos está aumentando, já que relatos indicam que Washington tenta reduzir as hostilidades na região. Em segundo lugar, a Ucrânia realizou um ataque com drones contra instalações de refino de petróleo russas, enquanto o Irã permaneceu indiferente ao novo 'Acordo Conjunto de Defesa de Meca'. Os preços do petróleo subiram após Teerã declarar que o Estreito de Ormuz permaneceria fechado sem concesões significativas dos EUA. Finalmente, a China está implementando o 'Ice Silk Road' pelo Ártico, oferecendo um serviço regular de contêineres entre a Europa e o Extremo Oriente que reduz os tempos de viagem pela metade para cerca de 20 dias. Essas ações refletem a crescente competição global e as complexidades da geopolítica atual.", "economia": "A Embraer elevou suas projeções de fluxo de caixa livre para 2026, projetando US$ 400 milhões e aumentou a estimativa da margem EBIT ajustada. As discussões sobre acordos no setor de entrega de alimentos estão sendo avaliadas como fatores positivos que podem aumentar os investimentos e expandir os negócios. A reforma tributária em curso na Argentina, visando eliminar os impostos mais distorcivos sem comprometer o equilíbrio fiscal, leva mais de uma década para ser concluída devido à complexidade do processo. Além disso, a moagem de cana-de-açúcar no Centro-Sul do Brasil caiu 14,5% em junho, conforme informado pela Unica, e a S&P lançou um preço referência para minerais críticos diante da alta demanda global. O petróleo subiu enquanto os traders avaliam sinais mistos dos Estados Unidos e Irã sobre o acordo que pode abrir o Estreito de Ormuz.", "tecnologia": "Em julho de 2026, o setor tecnológico na Europa manteve-se resiliente, levantando €8,6 bilhões em 267 rodadas de financiamento, mesmo com uma diminuição no número de negócios. Entre os destaques, a Revolut conquistou uma licença bancária francesa, expandindo seu alcance regulatório na Europa Ocidental, sua região de maior crescimento. No mesmo mês, a Contemporary Amperex Technology Ltd (CATL), maior fabricante mundial de baterias para veículos elétricos, realizou um teste bem-sucedido com baterias para voos autônomos, o que poderia fortalecer sua posição no setor de energias renováveis e na mobilidade futura. Além disso, o governo chinês planeja aprovar uma lei especial este ano para designar uma zona específica para projetos de investimento em inteligência artificial, enquanto a China cancelou exibições de drones em diversos locais por causa do aumento do controle sobre voos baixos. A Acer Gadget registrou resultados sólidos no segundo trimestre e prevê crescimento na segunda metade do ano, impulsionado por acessórios de vida inteligente, enquanto a GS Engineering & Construction e a LS Electric firmaram um acordo para fortalecer a infraestrutura de energia das suas projetos de centrais de dados de inteligência artificial.", "ciencia": "A China Southern Airlines registrou um incidente no qual um Airbus A321 foi atingido por relâmpagos durante o taxiamento no Aeroporto de Shenzhen, resultando em 20 marcas de impacto. Recentemente, cientistas descobriram que cachalotes liberam bolhas para se manterem flutuando abaixo da superfície do oceano, evitando a ascensão à superfície. A China lançou uma ferramenta de inteligência artificial genética gratuita com o objetivo de auxiliar no combate a doenças raras. Além disso, a Western Europe registrou o verão mais quente em junho e julho na história, atribuído ao aquecimento climático. Um novo catalisador que usa 75% menos platina promete reduzir significativamente os custos de células combustíveis a base de hidrogênio.", "cultura": "O Pacifica Quartet, um quarteto de cordas com mais de três décadas de história, faz sua estreia no Teatro Colón após ganhar prestígio em concursos internacionais. A apresentação desta noite é realizada em parceria com o Mozarteum Argentino e marca o início do evento cultural na Argentina. Em outro contexto musical, Jon Batiste compôs a trilha sonora da animação 'Soul', que lhe rendeu um Oscar e um Globo de Ouro, destacando-se como uma forma de expressar o inefável através da música. Na literatura, destaca-se a publicação do novo livro 'Sunlight Finds You', cuja autora foi batizada com o nome Eleanor após nascer uma semana depois de uma visita de Eleanor Roosevelt à Kansas City para apoiar sua campanha presidencial. Além disso, na cultura pop, Baby Shark Boy, um cantor sul-coreano, estreou como K-pop star lançando sua primeira single 'WAVE', que foi co-escrevida por ele.", "sociedade": "Um homem foi condenado a pagar R$ 75 mil de indenização após abusar sexualmente de uma menina de 11 anos por força, conforme relato do Metrópoles. O incidente ocorreu em Santa Catarina e o agressor confessou estar embriagado e ter achado que a garota era maior de idade. No Brasil, aproximadamente metade dos idosos sofrem com hipertensão, aponta o Metrópoles, ressaltando a importância do acompanhamento médico regular. Em São Paulo, acontece um evento chamado Metrópoles Talks para debater os desafios e oportunidades da educação na cidade. A Lei de Desalojos Exprés estabelece que processos judiciais devem ser acelerados em casos de inadimplência no pagamento do aluguel, conforme detalhado pela La Nación Argentina. Um pesquisador da USP observa que entregadores de aplicativos têm sido explorados por plataformas que valorizam comportamentos arriscados como prova de virilidade.", "meio_ambiente": "Temperaturas extremamente altas estão quebrando recordes em toda a Europa, intensificando secas e incêndios florestais. Segundo o Copernicus, a Europa Ocidental registrou novos recordes de temperatura no último mês. Na Grécia, um novo incêndio perto de Atenas foi impulsionado por fortes ventos, enquanto na Indonésia, incêndios florestais em Mount Bromo e áreas vizinhas continuam a ameaçar a região durante o período excepcionalmente seco. Em Hong Kong, a temperatura histórica atingiu 36,9°C devido ao passar do Typhão Dolphin. No Canadá, incêndios florestais fora de controle obrigaram cerca de 22.000 pessoas a deixarem suas casas na província de British Columbia.", "direitos_humanos": "Em Hong Kong, um tribunal rejeitou o último pedido de 11 políticos oposicionistas presos para anular suas condenações por conspiração à subversão, em uma importante audiência de segurança nacional. A decisão foi tomada após análise de cinco questões legais pelo Tribunal de Recursos. Paralelamente, a Agência Nacional de Polícia da Coreia anunciou que vai fortalecer as medidas para incentivar denúncias e proteger os informantes após uma reforma legal que concede autoridade investigativa exclusivamente à polícia. No Equador, oito corpos desmembrados foram encontrados em uma mina ilegal de ouro. Além disso, um casal russo, Nikita e Olga Belov, está enfrentando a deportação da Finlândia após ter suas solicitações de asilo negadas repetidamente, temendo perseguições por seu ativismo pró-Ucrânia. Em Hong Kong, a adesão de jovens aos grupos uniformizados diminuiu 8% nos últimos cinco anos, apesar do financiamento constante do governo. No Brasil, o ex-marido de Maria da Penha foi voltado à prisão por supostamente descumprir uma medida cautelar ao conceder uma entrevista sobre sua condenação. O direito à dignidade menstrual de meninas e a questão dos ataques a jornalistas palestinos também foram discutidos, destacando os desafios em garantir esses direitos humanos."}, "resumo_do_dia": {"politica_nacional": [{"id": 96122, "titulo": "Nexus/BTG: No 1º turno, Lula tem 40% e Flávio, 35%", "url": "https://www.cnnbrasil.com.br/eleicoes/nexus-btg-no-1o-turno-lula-tem-40-e-flavio-35/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-10T09:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa mostrou que, no primeiro turno das eleições, Lula obteve 40% dos votos e Flávio 35%. A pesquisa foi realizada entre os dias 7 e 9 de agosto com uma margem de erro de 2 pontos percentuais e um nível de confiança de 95%.", "titulo_pt": "Nexus/BTG: no primeiro turno, Lula tem 40% e Flávio, 35%", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 96091, "titulo": "A nova pesquisa BTG/Nexus sobre a disputa entre Lula e Flávio Bolsonaro", "url": "https://veja.abril.com.br/politica/a-nova-pesquisa-btg-nexus-sobre-a-disputa-entre-lula-e-flavio-bolsonaro-2/", "fonte_id": "veja", "data_pub": "2026-08-10T09:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa realizada pelo BTG/Nexus indica que a vantagem do presidente Lula sobre o senador Flávio Bolsonaro aumentou no segundo turno das eleições.", "titulo_pt": "Nova pesquisa BTG/Nexus mostra aumento da diferença entre Lula e Flávio Bolsonaro no segundo turno", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 96100, "titulo": "BTG/Nexus: Lula lidera 1º turno e empata com Flávio e Caiado no 2º", "url": "https://www.metropoles.com/brasil/pesquisa-btg-nexus-lula-e-flavio-turno", "fonte_id": "metropoles", "data_pub": "2026-08-10T09:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa mostra que Lula lidera no primeiro turno, enquanto Flávio e Caiado empatam no segundo turno. O levantamento registra estabilidade entre os principais candidatos em comparação com a pesquisa anterior.", "titulo_pt": "BTG/Nexus: lula lidera primeiro turno e Flávio e Caiado empatam no segundo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 96092, "titulo": "Congresso inicia semana de esforço concentrado para votar pautas de consenso antes das eleições", "url": "https://veja.abril.com.br/brasil/congresso-inicia-semana-de-esforco-concentrado-para-votar-pautas-de-consenso-antes-das-eleicoes/", "fonte_id": "veja", "data_pub": "2026-08-10T09:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Congresso Nacional iniciou uma semana de votação intensa com o objetivo de aprovar pautas de consenso antes das eleições. Apesar do grande número de matérias a serem discutidas, a expectativa é que não haja um grande número de parlamentares presentes no local.", "titulo_pt": "Congresso inicia semana de votação intensa para pautas de consenso antes das eleições", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 96259, "titulo": "Falta de recursos e estrutura de campanha trava eleição de jovens, diz pesquisa", "url": "https://www.jota.info/eleicoes/eleicoes-2026/falta-de-recursos-e-estrutura-de-campanha-trava-eleicao-de-jovens-diz-pesquisa", "fonte_id": "jota", "data_pub": "2026-08-10T09:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que a falta de recursos e estrutura de campanha está dificultando as eleições dos jovens candidatos. Este problema afeta tanto os partidos de esquerda quanto os de direita.", "titulo_pt": "Falta de recursos e estrutura de campanha prejudica eleição de jovens, aponta pesquisa", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 96085, "titulo": "Candidata, ex-ministra instala estande no Minhocão antes do início da campanha", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/candidata-ex-ministra-instala-estande-no-minhocao-antes-do-inicio-da-campanha.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada federal Sônia Guajajara (PSOL-SP), candidata à reeleição, instalou um estande no Minhocão, centro da capital, para o lançamento do seu programa ReflorestarMentes. A gestão do prefeito Ricardo Nunes (MDB) promete abrir uma apuração sobre o evento.", "titulo_pt": "Candidata e ex-ministra instalam estande no Minhocão antes do início da campanha", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 96086, "titulo": "Série de seminários da Folha sobre o Judiciário segue nas duas próximas segundas-feiras", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/seminariosfolha/2026/08/serie-de-seminarios-da-folha-sobre-o-judiciario-segue-nas-duas-proximas-segundas-feiras.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A série de seminários 'O Judiciário em Debate: Integridade, Eficiência e Acesso à Justiça', promovida pela Folha, continuará nas próximas duas segundas-feiras (17 e 24), abordando temas como segurança jurídica, acesso à Justiça, digitalização e os impactos da inteligência artificial no Direito.", "titulo_pt": "Série de seminários sobre o Judiciário segue em duas próximas segundas-feiras", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 96107, "titulo": "O voto e sua definição", "url": "https://www.metropoles.com/blog-do-noblat/enquetes/o-voto-e-sua-definicao", "fonte_id": "metropoles", "data_pub": "2026-08-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A enquete aborda a definição do voto.", "titulo_pt": "O voto e sua definição", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 96125, "titulo": "Jornalistas da CNN analisam debates estaduais; veja os destaques", "url": "https://www.cnnbrasil.com.br/eleicoes/jornalistas-da-cnn-analisam-debates-estaduais-veja-os-destaques/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os jornalistas da CNN analisaram os debates estaduais, destacando temas como segurança, educação e articulações políticas.", "titulo_pt": "Jornalistas da CNN analisam debates estaduais; veja os destaques", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 96128, "titulo": "CNN começa nesta segunda sabatinas com candidatos aos governos estaduais", "url": "https://www.cnnbrasil.com.br/eleicoes/comeca-hoje-sabatinas-com-candidatos-aos-governos-estaduais/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A CNN iniciará nesta segunda-feira uma série de entrevistas com candidatos a governadores estaduais. Fernando Haddad, do PT e candidato ao governo de São Paulo, será o primeiro entrevistado.", "titulo_pt": "CNN começa sabatinas com candidatos aos governos estaduais nesta segunda", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 96108, "titulo": "Senador reage após aparecer em foto em piscina: \"Ninguém pede ficha policial”", "url": "https://www.metropoles.com/colunas/milena-teixeira/ninguem-pede-ficha-policial-diz-senador-apos-aparecer-em-foto-na-piscina-com-alvo-do-inss", "fonte_id": "metropoles", "data_pub": "2026-08-10T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador afirmou que não há problema com a foto em uma piscina onde se encontraram amigos de diferentes partidos. Ele reagiu dizendo que ninguém pede ficha policial para esses encontros.", "titulo_pt": "Senador reage após aparecer em foto em piscina: 'ninguém pede ficha policial'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 96087, "titulo": "Podcast discute o que guia escolha de vices e analisa perfil das chapas na eleição", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/podcasts/2026/08/podcast-discute-o-que-guia-escolha-de-vices-e-analisa-perfil-das-chapas-na-eleicao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-10T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O próximo sábado (15) é o prazo final para registro de candidaturas; a campanha começa oficialmente no dia seguinte. As convenções recentes definiram os perfis das chapas disputantes.", "titulo_pt": "Podcast debate fatores que influenciam escolha de vices e perfil das chapas na eleição", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 96110, "titulo": "Afinal, os debates mudam o resultado das urnas?", "url": "https://www.metropoles.com/blog-do-noblat/ricardo-noblat/afinal-os-debates-mudam-o-resultado-das-urnas", "fonte_id": "metropoles", "data_pub": "2026-08-10T07:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Com candidatos altamente preparados e histórico de favoritismo, os debates na televisão funcionam mais como testes de resistência do que como fatores decisivos para mudar o resultado das eleições.", "titulo_pt": "Afinal, os debates alteram o resultado das urnas?", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 96111, "titulo": "Com pauta amena, Congresso faz 1º esforço concentrado antes da eleição", "url": "https://www.metropoles.com/brasil/com-pauta-amena-congresso-faz-1o-esforco-concentrado-antes-da-eleicao", "fonte_id": "metropoles", "data_pub": "2026-08-10T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Congresso Nacional retoma suas atividades com propostas de emendas constitucionais do governo que estavam paradas e uma agenda simplificada. As votações mais significativas serão adiadas para o ano que vem.", "titulo_pt": "Com pauta leve, Congresso realiza primeiro esforço concentrado antes das eleições", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 96133, "titulo": "Com Congresso empoderado, gestão Lula 3 tem aprovação menor de MPs", "url": "https://www.cnnbrasil.com.br/politica/com-congresso-empoderado-gestao-lula-3-tem-aprovacao-menor-de-mps/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-10T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A gestão do terceiro mandato de Lula teve apenas 20% das medidas provisórias convertidas em lei. A tendência de aprovação dessas propostas tem diminuído desde a gestão de 2003.", "titulo_pt": "Com Congresso empoderado, gestão Lula 3 tem aprovação menor de MPs", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 96136, "titulo": "“Taxa das blusinhas”: governo quer avançar com MP na retomada do Congresso", "url": "https://www.cnnbrasil.com.br/politica/taxa-das-blusinhas-governo-quer-avancar-com-mp-na-retomada-do-congresso/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-10T07:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo pretende avançar com um Projeto de Lei Orçamentária (MP) durante a retomada do Congresso. A decisão considera o prazo da MP e seu impacto eleitoral, especialmente em relação à isenção das compras internacionais até US$ 50.", "titulo_pt": "Taxa das blusinhas: governo quer avançar com MP na retomada do Congresso", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 96283, "titulo": "Former Thai MP allegedly kills official and confesses on YouTube", "url": "https://www.bbc.co.uk/news/articles/cqx7lje8l79o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-10T09:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ex-deputado thaiuano chamado Chalong Riewrang fez um livestream no YouTube confessando que havia assassinado um funcionário do governo.", "titulo_pt": "Ex-deputado tailandês faz confessionamento em livestream após suposto assassinato", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 96324, "titulo": "UK couple detained in Iran ends hunger strike", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/uk-couple-detained-iran-ends-hunger-strike", "fonte_id": "middle_east_eye", "data_pub": "2026-08-10T09:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um casal britânico detido na Irã, acusado de espionagem, encerrou sua última fome de meses, em protesto contra seu tratamento na prisão, conforme informou a família. Lindsay e Craig Foreman, ambos com mais de 50 anos, foram presos em janeiro de 2025 durante uma viagem em motocicleta ao redor do mundo que passava por Iran.", "titulo_pt": "Casal britânico detido na Irã encerra fome de meses", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 96241, "titulo": "Ukraine launches drone attack on Russian oil refining facilities – Europe live", "url": "https://www.theguardian.com/world/live/2026/aug/10/ukraine-drones-russia-oil-facilities-europe-heat-drought-latest-updates-news", "fonte_id": "guardian_world", "data_pub": "2026-08-10T09:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ucrânia realizou um ataque com drones contra instalações de refino de petróleo russas. A Chefe do governo da Dinamarca, Mette Frederiksen, emitiu uma declaração conjunta com a primeira-ministra da Itália, Giorgia Meloni, afirmando o compromisso de proteger o que consideram herança cultural cristã europeia.", "titulo_pt": "Ucrânia realiza ataque com drones em instalações de refino de petróleo russas – Europa em tempo real", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 96294, "titulo": "Greenland issues warning against US oil drilling on its territory", "url": "https://www.france24.com/en/video/20260810-greenland-issues-warning-against-us-oil-drilling-on-its-territory", "fonte_id": "france24", "data_pub": "2026-08-10T09:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo da Groenlândia informou que não houve aprovação para a perfuração exploratória realizada pela empresa norte-americana Greenland Energy. A situação foi comentada por Lukas Wahden, associado do programa Rússia da Universidade George Washington.", "titulo_pt": "Groenlândia emite aviso contra perfuração de óleo americana em seu território", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 96361, "titulo": "FnV lancia gadget 'identitari', anche pistola acqua e secchiello con paletta", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/10/fnv-lancia-gadget-identitari-anche-pistola-acqua-e-secchiello-con-paletta_3348099d-fa77-4fc2-8145-833afedb8e83.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-10T09:36:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A FnV lançou um novo dispositivo chamado 'identitari', que inclui uma pistola de água e um secador com paleta. O objetivo é permitir a continuidade da construção de casas e empresas, bem como sua defesa.", "titulo_pt": "Fnv lança gadget 'identitari', com pistola de água e secador", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 96295, "titulo": "Yemeni military says Houthi attack on Mocha kills 7, wounds 30", "url": "https://www.france24.com/en/video/20260810-yemeni-military-says-houthi-attack-on-mocha-kills-7-wounds-30", "fonte_id": "france24", "data_pub": "2026-08-10T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sete pessoas, incluindo militares e civis, foram mortas e 30 ficaram feridas durante um ataque do grupo Houthis ao porto de Mocha na costa do Mar Vermelho. Infraestrutura civil e forças armadas também foram alvo.", "titulo_pt": "Exército yemenita relata que ataque Houthi em Mocha causa 7 mortos e 30 feridos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 96325, "titulo": "Israeli strike causes 'major explosion' in south Lebanon, state media reports", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-strike-causes-major-explosion-south-lebanon-state-media-reports", "fonte_id": "middle_east_eye", "data_pub": "2026-08-10T09:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ataque israelense causou uma 'explosão major' no município de Zaoutar el-Charkiya, no sul do Líbano, conforme relatório da agência estatal NNA. Além disso, o ataque incluiu tiros com metralhadoras em Wadi Slouki pela manhã e ataques com artilharia contra a aldeia de Mansouri e o assentamento de Bani Hayyan durante a noite.", "titulo_pt": "Ataque israelense causa 'explosão major' no sul do líbano", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 96362, "titulo": "Spider-man resta primo con quasi 27 milioni di incassi, Odissea a quota 44 milioni", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/10/spider-man-resta-primo-con-quasi-27-milioni-di-incassi-odissea-a-quota_8b1d2103-b9a4-47dc-a7c4-24eec6343842.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-10T09:30:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Spider-Man registou quase 27 milhões de bilheteria, enquanto Odisseia atingiu a posição 44 na lista de bilheteria. Na classificação Cinetel, Hokum é um novo entrante no gênero horror e Documentário sobre a banda Ateez também estreou como novo entrante.", "titulo_pt": "Spider-man arrecada quase 27 milhões, odisseia em 44º lugar; novidades no cinetel", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 96265, "titulo": "Al menos doce muertos y decenas de heridos en uno de los ataques de Ucrania más mortíferos contra Rusia", "url": "https://www.latercera.com/mundo/noticia/al-menos-doce-muertos-y-decenas-de-heridos-en-uno-de-los-ataques-de-ucrania-mas-mortiferos-contra-rusia/", "fonte_id": "la_tercera", "data_pub": "2026-08-10T09:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um ataque resultou em pelo menos 12 mortes e dezenas de feridos na cidade de Nizhnekamsk, localizada no território russo, onde estão instaladas duas empresas especializadas no processamento de petróleo e condensado de gás.", "titulo_pt": "Pelo menos 12 mortos e dezenas de feridos em um dos ataques mais letais da Ucrânia contra a Rússia", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 96343, "titulo": "Anguished locals watch as Israel demolishes homes in southern Lebanon", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/10/anguished-locals-watch-as-israel-demolishes-homes-in-southern-lebanon?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-10T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Locais angustiados assistem enquanto Israel demoliu casas no sul do Líbano.", "titulo_pt": "Locais angustiados assistem à demolição de casas por Israel no sul do líbano", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 96344, "titulo": "‘Like the movies’: How Ukraine’s ground robots are changing rules of war", "url": "https://www.aljazeera.com/news/2026/8/10/like-the-movies-how-ukraines-ground-robots-are-changing-rules-of-war?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-10T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os robôs terrestres ucranianos transportam munição, podem realizar missões kamikaze e demonstraram a capacidade de capturar posições inimigas.", "titulo_pt": "Como os robôs terrestres estão mudando as regras da guerra na Ucrânia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 96221, "titulo": "Southern Iran Bears Brunt of U.S. Bombing", "url": "https://www.nytimes.com/2026/08/10/world/middleeast/iran-south-bombing-strait-hormuz.html", "fonte_id": "nyt_world", "data_pub": "2026-08-10T09:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Embora as lutas tenham diminuído em
