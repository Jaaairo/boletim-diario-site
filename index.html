ra", "data_pub": "2026-08-22T17:18:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Guardas ambientais identificaram seis motos de neve realizando atividades ilegais na Reserva Nacional Malalcagüello. A Conaf denunciou esses incidentes ao Juzgado de Polícia Local de Curacautín e aumentará as rondas em conjunto com a Carabineros.", "titulo_pt": "Conaf denuncia presença de motos de neve em atividades ilegais na reserva nacional Malalcagüello", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 118140, "titulo": "Climate demands political leadership", "url": "https://www.lemonde.fr/en/opinion/article/2026/08/22/climate-demands-political-leadership_6756762_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-22T14:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os líderes políticos não comentaram sobre as consequências da onda de calor inédita no verão de 2026 e as soluções necessárias, o que pode ser interpretado como inabilidade em agir ou, pior, falta de vontade de fazê-lo.", "titulo_pt": "Requisito de liderança política no enfrentamento do clima", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 118204, "titulo": "More than 16,000 doses of Ervebo vaccine arrive in Ebola-hit DR Congo", "url": "https://www.aljazeera.com/news/2026/8/22/more-than-16000-doses-of-ervebo-vaccine-arrive-in-ebola-hit-dr-congo?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-22T10:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 16.000 doses da vacina Ervebo chegaram à República Democrática do Congo, para a cidade de Kinshasa. Essas doses são a primeira parte de 70.000 destinadas à cidade, enquanto especialistas alertam para a expansão exponencial do vírus.", "titulo_pt": "Mais de 16.000 doses da vacina Ervebo chegam à república democrática do Congo", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 117679, "titulo": "Customs seizes endangered turtles and parrots in 2 cases, arrests woman", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3364924/customs-seizes-endangered-turtles-and-parrots-2-cases-arrests-woman?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-22T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Alfândega de Hong Kong apreendeu tartarugas e papagaios em dois casos de contrabando separados, resultando na prisão de uma mulher. Foram encontradas 17 tartarugas vivas em uma embalagem declarada como contendo um casaco que chegou do Aeroporto Internacional de Hong Kong dos Estados Unidos.", "titulo_pt": "Alfândega apreende tartarugas e papagaios e prende mulher em dois casos de contrabando", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 117241, "titulo": "“Super El Niño”: ONG avalia risco para moradias vulneráveis no Brasil", "url": "https://www.cnnbrasil.com.br/ciencia/super-el-nino-ong-avalia-risco-para-moradias-vulneraveis-no-brasil/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-22T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Organização Não-Governamental Habitat para a Humanidade Brasil alerta para o risco de aumento de eventos como enchentes, deslizamentos de terra, estiagens e queimadas devido à elevação das temperaturas e mudanças nas chuvas associadas ao fenômeno 'Super El Niño'.", "titulo_pt": "Super El Niño: ONG avalia risco para moradias vulneráveis no Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 117547, "titulo": "Climatologist Jean Jouzel: 'None of France's presidential candidates truly grasp the reality of global warming'", "url": "https://www.lemonde.fr/en/environment/article/2026/08/22/climatologist-jean-jouzel-none-of-france-s-presidential-candidates-truly-grasp-the-reality-of-global-warming_6756754_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-22T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O paleoclimatologista e ex-vice-presidente do painel científico do IPCC, Jean Jouzel, expressou preocupação sobre a possibilidade de que os candidatos presidenciais franceses não compreendam plenamente a gravidade do aquecimento global. Ele incentiva os candidatos a reconhecerem a escala deste desafio global.", "titulo_pt": "Cientista do clima Jean Jouzel: 'nenhum dos candidatos presidenciais franceses realmente compreende a realidade do aquecimento global'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 117699, "titulo": "China banned ivory, but Vietnamese gangs keep the trade alive", "url": "https://www.scmp.com/week-asia/health-environment/article/3364858/china-banned-ivory-vietnamese-gangs-keep-trade-alive?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-22T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três meses após deixar uma porta fluvial interna do Congo, uma remessa de madeira que chegou à Vietnam neste verão escondia 1,2 toneladas quase de ossos de elefante de ivoire, contrabandeado por metade do mundo. A carga viajou cerca de 9.000 náuticos com paradas em Sri Lanka e Singapura antes de chegar a Quy Nhon, um porto na costa central do Vietnam.", "titulo_pt": "China proibiu o ivoire, mas gangues vietnamitas mantêm o comércio vivo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 117664, "titulo": "Heat wave-hit Europe logs over 30,000 excess summer deaths", "url": "https://www.japantimes.co.jp/environment/2026/08/22/heat-wave-europe-30000-deaths/", "fonte_id": "japan_times", "data_pub": "2026-08-22T00:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Entre julho e agosto, o EuroMomo, plataforma de monitoramento da Europa, estima que mais de 32.000 mortes a mais ocorreram na região. O verão ainda não terminou.", "titulo_pt": "Onslaught de calor na Europa registra mais de 30.000 mortes a mais no verão", "veiculo": "The Japan Times", " do. Políticamente, a decisão reforça a postura de resistência do Canadá frente às mudanças comerciais unilaterais dos EUA. Economicamente, a escalada de tarifas pode levar a uma guerra comercial entre os dois maiores economias do hemisfério norte, com possíveis efeitos na cadeia de suprimentos globais e na competitividade dos produtos canadenses. Humanitariamente, a disputa pode afetar o comércio de bens essenciais, como alimentos e medicamentos. Além disso, a escalada comercial pode ter implicações científicas, afetando o intercâmbio de conhecimento e colaboração entre os dois países. A situação também pode influenciar a relação bilateral, com possíveis efeitos na cooperação em outros campos, como segurança e defesa.", "data_edicao": "2026-08-22", "artigos": [{"id": 118656, "titulo": "Canada to match US tariffs “dollar for dollar,” PM Carney says", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/22/22-08-clip-carney-tariffs-canada-ca?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-22T19:13:00Z", "topico": "geopolitica", "idioma": "en", "texto_resumo": "O Prime ministerado Canadá, Mark Carney, declarou que o Canadá irá corresponder às novas tarifas dos Estados Unidos, dólar por dólar.", "titulo_pt": "Canadá vai corresponder tarifas dos EUA, dólar por dólar, diz PM Carney", "texto_pt": "O Prime ministerado Canadá, Mark Carney, declarou que o Canadá irá corresponder às novas tarifas dos Estados Unidos, dólar por dólar.", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 118160, "titulo": "Canada to hit back with retaliatory tariffs after US trade talks fail", "url": "https://www.dw.com/en/canada-to-hit-back-with-retaliatory-tariffs-after-us-trade-talks-fail/a-78471618?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-22T17:28:00Z", "topico": "politica_internacional", "idioma": "en", "texto_resumo": "Canadá implementou tarifas sobre produtos americanos em resposta à declaração dos Estados Unidos de que tarifas seguiriam após o fracasso das negociações. A disputa comercial entre Ottawa e Washington intensificou-se.", "titulo_pt": "Canadá reagirá com tarifas retaliatórias após falha nas negociações comerciais", "texto_pt": "Canadá implementou tarifas sobre produtos americanos em resposta à declaração dos Estados Unidos de que tarifas seguiriam após o fracasso das negociações. A disputa comercial entre Ottawa e Washington intensificou-se.", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 117897, "titulo": "Canadá retaliará os EUA com tarifas sobre diversos setores, diz Carney", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/canada-retaliara-os-eua-com-tarifas-sobre-diversos-setores-diz-carney/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-22T16:17:00Z", "topico": "politica_internacional", "idioma": "pt", "texto_resumo": "O Canadá planeja retaliar as tarifas impostas pelos Estados Unidos com suas próprias tarifas em diversos setores. Isso ocorre após o fracasso em um acordo comercial e a imposição de tarifas de 50% por parte dos EUA sobre exportações canadenses.", "titulo_pt": "Canadá retaliará EUA com tarifas em diversos setores, diz Carney", "texto_pt": "O Canadá planeja retaliar as tarifas impostas pelos Estados Unidos com suas próprias tarifas em diversos setores. Isso ocorre após o fracasso em um acordo comercial e a imposição de tarifas de 50% por parte dos EUA sobre exportações canadenses.", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 117918, "titulo": "'Dólar por dólar': Canadá diz que vai retaliar tarifas de Trump", "url": "https://exame.com/mundo/dolar-por-dolar-canada-diz-que-vai-retaliar-tarifas-de-trump/", "fonte_id": "exame", "data_pub": "2026-08-22T14:35:00Z", "topico": "economia", "idioma": "pt", "texto_resumo": "O Canadá planeja retaliar as tarifas impostas pelos Estados Unidos, medida que entrará em vigor a partir de 8 de setembro. As negociações entre Washington e function toggleDrill(id) {
  const el = document.getElementById(id);

  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">

      <div class="dmeta">

      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}

  return `<div>

    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;

  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

    btn.classList.toggle('flag-ativo', ativo);

    btn.textContent = ativo ? '⚑' : '⚐';
  });

  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
