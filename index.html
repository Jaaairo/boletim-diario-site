<html lang="pt-BR">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

o tumultuado de Donald Trump, vai significativamente influenciar o cenário político dos Estados Unidos nos próximos dois anos, com a perspectiva de batalhas legislativas ambiciosas. Em outro desenvolvimento, o presidente do Irã desligou as luzes do seu escritório para incentivar os cidadãos a economizarem energia, em meio a uma crise energética no país devido às sanções econômicas dos Estados Unidos e ao bloqueio naval. Além disso, a Força Armada dos Estados Unidos planeja detonar toneladas de explosivos instáveis em Iowa, apesar de uma ordem judicial, para proteger seu pessoal e as comunidades próximas ao depósito de munição.\n\nAs negociações climáticas da COP31 na Austrália falharam, com a União Europeia e outros países rejeitando um projeto de acordo proposto, refletindo a dificuldade das nações em tomar ações ambiciosas para enfrentar o aquecimento global. Paralelamente, a guerra legal do Partido Comunista Chinês continua a se desenvolver, e Taiwan advertiu o Canadá sobre a dependência do país em relação à China, visando alertar sobre as possíveis consequências dessa dependência nas relações internacionais. Além disso, ataques cibernéticos intensificaram contra portos dos Estados Unidos, com hackers realizando milhares de tentativas de ataque diariamente. No Oriente Médio, o Irã relatou que dois petroleros se incendiaram após colidirem com minas navais no Estreito de Ormuz, enquanto incidentes envolvendo drones e ataques a navios russos e israelenses em Benghazi, Líbia, levantaram preocupações sobre a escalada de conflitos na região. O presidente ucraniano Zelenskyy pediu ao Estados Unidos a liberação de mísseis Patriot para enfrentar a invasão russa, enquanto o México capturou um dos narcotraficantes mais procurados do país, Fausto Isidro Meza Flores, em uma operação que envolveu forças especiais, interceptação de mensagens e vigilância aérea por semanas.", "economia": "A economia global enfrenta diversos desafios, como evidenciado por vários eventos recentes. A França anunciou um pacote de investimentos de 15 bilhões de euros em projetos industriais, em um momento de pessimismo econômico, com o objetivo de estimular o crescimento e preparar o país para as eleições presidenciais. Por outro lado, o Chile registrou a maior retração do PIB desde 2020, com uma queda de 1,8% no terceiro trimestre, refletindo a complexidade econômica enfrentada pelo país. Além disso, a Petrobras divulgou a atualização de seu plano de investimentos para os próximos cinco anos, com uma projeção maior de gastos e foco no crescimento da produção de diesel e biocombustíveis. Estes eventos refletem a diversidade e complexidade das questões econômicas atuais, abrangendo desde investimentos e políticas industriais até retrações econômicas e estratégias de investimento da indústria petrolífera.", "tecnologia": "Bancos taiwaneses estão utilizando inteligência artificial para prevenir ataques cibernéticos. Esta medida visa fortalecer a segurança digital dos bancos locais. O setor de energia está à frente do setor farmacêutico em termos de avanços na computação quântica. A tecnologia está sendo aplicada para ajudar a equilibrar redes elétricas, aprimorar materiais e reduzir custos operacionais. TechCrunch Mobility continua sendo o hub para o futuro da mobilidade, destacando o papel da inteligência artificial nesse setor. A série agora explora testes A/B entre robôs e humanos em contextos de mobilidade. O Secretário do Tesouro americano, Scott Bessent, declarou que a Nvidia deve fornecer respostas rápidas sobre o clima de conformidade na empresa, que é liderada por Jensen Huang. As empresas de IA Anthropic e SpaceX impuseram regras incomuns e irritaram bancos no IPO. As empresas negociaram condições incomuns com os bancos durante suas ofertas públicas iniciais, gerando irritação entre os bancos. Isso ilustra a crescente influência das empresas de IA na negociação de IPOs. Surge um novo canal comercial, operado de ponta a ponta por IA. A inteligência artificial já faz parte das agendas de investimento das empresas, mas apenas 37% dos projetos de IA entregaram os resultados esperados até 2025, de acordo com uma pesquisa da IBM Institute for Business Value. A incorporação da tecnologia às operações é um desafio, conforme apontado por uma análise da Bain & Company.", "ciencia": "O planeta registrou o dia mais anomalousmente quente já registrado durante um El Niño que continua a se intensificar, conforme relato do Scientific American. Em outra notícia científica, a NASA's Johnson Space Center comemora 65 anos de contribuição para a exploração espacial, desde as missões Gemini até a pesquisa na Estação Espacial Internacional, informa o NASA News. A China prepara uma missão para realizar um pouso na lua Calisto, de Júpiter, e busca parcerias para experimentos embarcados, anunciou a Folha Ciência. Além disso, a ONU promete reformar as negociações climáticas após a COP31, que terminou sem um acordo histórico, devido a uma disputa geopolítica entre o grupo árabe e a coalizão liderada pela União Europeia em relação aos combustíveis fósseis, conforme relato do Financial Times.", "cultura": "O Festival de Cinema Ibero-Americano de Huelva, um dos principais eventos europeus para o cinema latino-americano, premiou o ator chileno Alfredo Castro e a diretora-roteirista argentina Lucía Puenzo, além do filme 'La Bola Negra', criado por Javier Calvo e Javier Ambrossi. O documentário 'Você Pode Ver Tudo', dirigido por Lance Oppenheim e Nathan Fielder, arrecadou mais de $100 milhões em bilheteria globalmente, um marco raro para um filme documental. A plataforma de streaming Sommos Brics exibirá filmes de países membros do Brics, incluindo Brasil, Rússia, Índia, China e África do Sul, com o objetivo de destacar a parceria entre esses países e oferecer uma alternativa cultural e econômica aos Estados Unidos.", "sociedade": "Um homem armado assaltou uma joalheria dentro de um shopping na zona sul de São Paulo no domingo (22/11), levando a um incidente no Interlagos. Em Tupanciretã, no Rio Grande do Sul, uma tempestade causou a morte de cinco pessoas e deixou 265 feridos, levando o governo a declarar calamidade pública. No Hospital DF Star, em Brasília, o ex-presidente Jair Bolsonaro permanece internado na UTI por causa de uma obstrução intestinal, sem previsão de alta, após dois dias de internação. A Secretaria de Saúde do Rio Grande do Sul avaliou a instalação de um posto médico avançado em Tupanciretã para atender às necessidades dos moradores após o temporal.", "meio_ambiente": "Temporal causou danos às lavouras de soja e aos armazéns em Tupanciretã, aumentando o risco de chuvas e granizo neste domingo. Em Belo Horizonte, um estudo mostrou que o uso do mosquito Aedes com a bactéria Wolbachia resultou em uma redução significativa das infecções por dengue e chikungunya, com 68,5% de infecções reduzidas nas áreas onde o mosquito foi solto. Além disso, agricultores na região do Rio Colorado expressaram preocupações sobre os níveis do rio, que estão em baixa devido ao aquecimento global. O ciclone se aproxima do Rio Grande do Sul após um temporal que deixou mortos em Santa Catarina e Paraná, intensificando o risco de chuvas e granizo neste domingo.", "direitos_humanos": "O diretor da Organização Mundial da Saúde (OMS) pediu paz para a província do Congo, afetada pelo surto de Ebola, onde pelo menos 5.678 pessoas morreram e 11.613 casos confirmados foram registrados. Este surto é o mais grave já registrado no país. Em Israel, uma investigação foi aberta sobre incêndios atribuídos a colonos na Cisjordânia, denunciados por Gadi Eisenkot, um rival de Benjamin Netanyahu. Na Cisjordânia, a ICE (Immigration and Customs Enforcement) abordou violentamente mexicanos durante o embarque em um voo para Los Angeles, causando protestos do governador de Washington. Em Seattle, imigrantes americanos detiveram duas pessoas em um incidente que gerou grande controvérsia e atrasou um voo para Los Angeles. Além disso, ativistas franceses exigem a suspensão do uso de gás lacrimogênio durante protestos devido a relatos de alterações nos ciclos menstruais e outros problemas de saúde reprodutiva. Na Gaza, crianças com diabetes enfrentam dificuldades para obter insulina e suprimentos de teste de glicose sanguínea. A apresentadora Nati Jota denunciou ameaças de abuso sexual e acusou um homem de hostilizá-la nas redes sociais. Em Bergerac, no sul da França, uma escola foi renomeada em homenagem a Irène Sapir, que escapou da deportação durante a operação Vél d'Hiv em 1942, mas os conselheiros do partido RN de Marine Le Pen votaram contra a renomeação, causando controvérsia. Por fim, a comunidade asiática americana enfrenta consequências do escândalo envolvendo a Nvidia, especialmente as mulheres."}, "resumo_do_dia": {"politica_nacional": [{"id": 281191, "titulo": "Supremo cria lista de bolsonaristas ‘moderados’ para barrar pedidos de impeachment", "url": "https://veja.abril.com.br/politica/supremo-cria-lista-de-bolsonaristas-moderados-para-barrar-pedidos-de-impeachment/", "fonte_id": "veja", "data_pub": "2026-11-22T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) criou uma lista com nomes de aliados moderados do presidente Jair Bolsonaro para evitar pedidos de impeachment. Entre os nomes estão Eduardo Gomes e Reinaldo Azambuja.", "titulo_pt": "Supremo cria lista de bolsonaristas 'moderados' para impedir pedidos de impeachment", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 281106, "titulo": "Direita tem muitos craques e esquerda só Lula de líder, diz Flávio", "url": "https://www.poder360.com.br/poder-congresso/direita-tem-muitos-craques-e-esquerda-so-lula-de-lider-diz-flavio/", "fonte_id": "poder360", "data_pub": "2026-11-22T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro afirma que a direita possui muitos líderes qualificados, enquanto a esquerda só tem Lula. O senador também menciona a possibilidade de disputar a Presidência em 2030, caso Jair Bolsonaro permaneça inelegível e haja mudanças no sistema eleitoral.", "titulo_pt": "Direita tem muitos líderes e esquerda só Lula, diz Flávio bolsonaro; ele pode running em 2030", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 281107, "titulo": "Aldo Rebelo diz que Lula foi “patético” ao participar da COP31", "url": "https://www.poder360.com.br/poder-brasil/aldo-rebelo-diz-que-lula-foi-patetico-ao-participar-da-cop31/", "fonte_id": "poder360", "data_pub": "2026-11-22T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aldo Rebelo criticou a postura de Lula durante a COP31, comparando-o a Silvério dos Reis e afirmando que ele cedeu à agenda colonialista do século 21 ao se posicionar contra o uso de combustíveis fósseis.", "titulo_pt": "Aldo Rebelo diz que Lula foi ‘patético’ na COP31", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 281192, "titulo": "PT precisa crescer ao centro para fazer frente ao PL, diz cientista político", "url": "https://veja.abril.com.br/politica/pt-precisa-crescer-ao-centro-para-fazer-frente-ao-pl-diz-cientista-politico/", "fonte_id": "veja", "data_pub": "2026-11-22T21:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um cientista político afirma que o Partido dos Trabalhadores (PT) precisa se alinhar com posições centristas para competir com o PL no Congresso. O analista sugere que o PT deve se tornar um 'ônibus' político para a esquerda e o centro.", "titulo_pt": "PT precisa se alinhar com o centro para enfrentar o PL, diz cientista político", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 281108, "titulo": "Reforma tributária é positiva para nanoempreendedores, diz associação", "url": "https://www.poder360.com.br/poder-economia/reforma-tributaria-e-positiva-para-nanoempreendedores-diz-associacao/", "fonte_id": "poder360", "data_pub": "2026-11-22T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Adriana Colloca, representante do setor de vendas diretas, destacou a isenção de IBS e CBS e a dispensa de obrigações acessórias para nanoempreendedores.", "titulo_pt": "Reforma tributária é positiva para nanoempreendedores, associação afirma", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 281109, "titulo": "Custo Brasil afasta empresas estrangeiras do mercado brasileiro", "url": "https://www.poder360.com.br/poder-economia/custo-brasil-afasta-empresas-estrangeiras-do-mercado-brasileiro/", "fonte_id": "poder360", "data_pub": "2026-11-22T21:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas estrangeiras enfrentam dificuldades para expandir no mercado brasileiro devido a juros altos, endividamento e problemas tributários e logísticos, conforme informa a Associação Brasileira de Empresas de Vendas Diretas.", "titulo_pt": "Custo Brasil dificulta expansão de empresas estrangeiras", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 281194, "titulo": "Os novos planos da ‘mente econômica’ da campanha de Flávio Bolsonaro", "url": "https://veja.abril.com.br/politica/os-novos-planos-da-mente-economica-da-campanha-de-flavio-bolsonaro/", "fonte_id": "veja", "data_pub": "2026-11-22T21:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Semanas após a derrota do filho de Bolsonaro, Daniella Marques foi convidada por Tallis Gomes para se juntar como sócia no G4.", "titulo_pt": "Novos planos da 'mente econômica' da campanha de Flávio Bolsonaro", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 281097, "titulo": "Tempestades no Paraná danificam mais de 250 casas e deixam 907 afetados", "url": "https://www.cartacapital.com.br/sociedade/tempestades-no-parana-danificam-mais-de-250-casas-e-deixam-907-afetados/", "fonte_id": "cartacapital", "data_pub": "2026-11-22T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 250 casas foram danificadas e 907 pessoas ficaram afetadas em nove municípios do Paraná devido a vendavais, granizo e um tornado desde a última sexta-feira.", "titulo_pt": "Tempestades no Paraná danificam mais de 250 casas e deixam 907 afetados", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 281110, "titulo": "UE propõe taxar big techs para financiar orçamento", "url": "https://www.poder360.com.br/poder-internacional/ue-propoe-taxar-big-techs-para-financiar-orcamento/", "fonte_id": "poder360", "data_pub": "2026-11-22T20:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A União Europeia propôs taxar as grandes empresas de tecnologia com receita líquida anual mínima de 50 milhões de euros na UE e 750 milhões de euros globalmente. Essa medida visa financiar o orçamento europeu.", "titulo_pt": "UE propõe taxar grandes empresas de tecnologia para financiar orçamento", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 281098, "titulo": "Polícia francesa denuncia à Justiça racismo e saudações nazistas em escola de formação de oficiais", "url": "https://www.cartacapital.com.br/mundo/policia-francesa-denuncia-a-justica-racismo-e-saudacoes-nazistas-em-escola-de-formacao-de-oficiais/", "fonte_id": "cartacapital", "data_pub": "2026-11-22T20:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A polícia francesa denunciou à justiça casos de racismo e saudações nazistas em uma escola de formação de oficiais. Uma das evidências mostradas é uma captura de tela com um manequim vestido com um uniforme de oficial alemão, exibindo uma saudação nazista.", "titulo_pt": "Polícia francesa denuncia à Justiça racismo e saudações nazistas em escola de formação de oficiais", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 281147, "titulo": "Brasil cumpriu mais de 251 mil mandados de prisão em 2026, diz governo", "url": "https://www.cnnbrasil.com.br/nacional/brasil/brasil-cumpriu-mais-de-251-mil-mandados-de-prisao-em-2026-diz-governo/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-22T20:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo informou que o Brasil cumpriu mais de 251 mil mandados de prisão em 2026. Este número representa o maior registro desde 2019, de acordo com um levantamento da Secretaria Nacional de Segurança Pública.", "titulo_pt": "Brasil cumpriu mais de 251 mil mandados de prisão em 2026, diz governo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 281111, "titulo": "Flávio diz não ter provas de fraude por ser “proibido de investigar”", "url": "https://www.poder360.com.br/poder-eleicoes-2026/flavio-diz-nao-ter-provas-de-fraude-por-ser-proibido-de-investigar/", "fonte_id": "poder360", "data_pub": "2026-11-22T20:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro afirma não ter provas de fraude eleitoral, argumentando que está proibido de investigar o assunto. Ele critica técnicos do Tribunal Superior Eleitoral (TSE) e defende a adoção do voto impresso, que permite auditorias e não está conectado a redes externas.", "titulo_pt": "Flávio diz não ter provas de fraude por ser ‘proibido de investigar’", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 281131, "titulo": "Gilmar admite excesso de exposição no STF: \"Talvez falte uma autocontenção\"", "url": "https://www.metropoles.com/mundo/gilmar-admite-excesso-de-exposicao-no-stf-talvez-falte-uma-autocontencao", "fonte_id": "metropoles", "data_pub": "2026-11-22T20:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Gilmar Mendes admitiu que há um excesso de exposição do STF e sugeriu que os magistrados devem refletir sobre sua atuação. Ele foi questionado sobre o desgaste na imagem pública do STF durante uma visita à Argentina.", "titulo_pt": "Gilmar reconhece excesso de exposição no STF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 281197, "titulo": "O cargo no Palácio do Planalto que o PT pode "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 280960, "titulo": "CCP legal warfare evolving: minister", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/23/2003868215", "fonte_id": "taipei_times", "data_pub": "2026-11-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministério indica que a guerra legal do Partido Comunista Chinês está evoluindo. Não há detalhes adicionais sobre as mudanças específicas na abordagem legal.", "titulo_pt": "Guerra legal do CCP evoluindo: ministro", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 280961, "titulo": "Taiwan warns Canada over dependence on China", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/23/2003868216", "fonte_id": "taipei_times", "data_pub": "2026-11-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Taiwan advertiu o Canadá sobre a dependência do país em relação à China. A advertência visa alertar sobre as possíveis consequências dessa dependência para as relações internacionais.", "titulo_pt": "Taiwan avisa canadá sobre dependência de China", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 280963, "titulo": "UN climate talks in Turkey collapse as nations reject deal", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/23/2003868218", "fonte_id": "taipei_times", "data_pub": "2026-11-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As negociações climáticas da ONU em Turquia falharam, pois os países rejeitaram o acordo proposto.", "titulo_pt": "Negociações climáticas da ONU em Turquia falham após rejeição do acordo", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 281307, "titulo": "Australian politics live: Labor to extend PBS medicine freeze to 2030; Bowen ‘failed’ on Cop, Hume says", "url": "https://www.theguardian.com/australia-news/live/2026/nov/23/anthony-albanese-digital-duty-of-care-labor nou ataques por arrombamento a vilas palestinas no Vale de Cisjordânia como 'terrorismo judaico'. A polícia israelense iniciou uma investigação sobre os incidentes, ocorridos aproximadamente um mês após uma eleição inconclusiva ter tirado o maioria do atual primeiro-ministro Benjamin Netanyahu.", "titulo_pt": "Israelense condena ‘terrorismo judaico’ após ataques de assentados em territórios palestinos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 281376, "titulo": "Midterms: US Democrats secure biggest House majority in decades", "url": "https://www.euronews.com/2026/11/22/midterms-us-democrats-secure-biggest-house-majority-in-decades", "fonte_id": "euronews", "data_pub": "2026-11-22T21:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os democratas conquistaram a maior maioria no Congresso dos EUA da Câmara dos Representantes em mais de trinta anos, afetando significativamente o presidente Donald Trump e estabelecendo o cenário para dois anos de governo dividido, confrontos políticos e batalhas legislativas ambiciosas.", "titulo_pt": "Mídia: democratas consolidam maioria maioritária na câmara dos EUA há décadas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 281366, "titulo": "Miley Cyrus marries Maxx Morando in California ceremony", "url": "https://www.bbc.co.uk/news/articles/cq8e0p87l89lo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-22T21:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Miley Cyrus se casou com Maxx Morando em uma cerimônia na Califórnia. Os dois estavam juntos há quatro anos e se comprometeram em 2025.", "titulo_pt": "Miley Cyrus se casa com Maxx Morando em cerimônia na califórnia", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 281067, "titulo": "Portos dos EUA enfrentam ataques cibernéticos, e hackers miram rotas comerciais vitais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/11/portos-dos-eua-enfrentam-ataques-ciberneticos-e-hackers-miram-rotas-comerciais-vitais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-22T21:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Hackers intensificaram ataques cibernéticos contra portos e navios de carga dos Estados Unidos, bombardeando rotas comerciais vitais com milhares de tentativas de ataque diariamente.", "titulo_pt": "Portos dos EUA enfrentam intensificação de ataques cibernéticos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 281440, "titulo": "Iranian president turns out office lights to urge citizens to save energy", "url": "https://www.washingtonpost.com/world/2026/11/22/iranian-president-turns-out-office-lights-urge-citizens-save-energy/", "fonte_id": "washington_post_world", "data_pub": "2026-11-22T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente do Irã desligou as luzes do seu escritório para incentivar os cidadãos a economizarem energia. O Irã enfrenta uma crise energética devido às sanções econômicas dos Estados Unidos e ao bloqueio naval.", "titulo_pt": "Presidente do Irã desliga luzes do escritório para incentivar economia de energia", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 281309, "titulo": "US intelligence chief says he trusts Trump’s description of Putin as ‘my friend’", "url": "https://www.theguardian.com/us-news/2026/nov/22/intelligence-chief-jay-clayton-trump-putin-my-friend", "fonte_id": "guardian_world", "data_pub": "2026-11-22T20:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jay Clayton, diretor de inteligência nacional dos EUA, afirmou que confia completamente em Donald Trump após o presidente dos EUA chamar Vladimir Putin de 'amigo' durante sua reunião em China. Clayton fez essas declarações em aparições à mídia no domingo, onde foi questionado sobre a caracterização amistosa de Putin por Trump.", "titulo_pt": "Chefe da inteligência dos EUA confirma confiança em Trump após chamá-lo de 'amigo' de Putin", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 281264, "titulo": "Irán informa que dos petroleros se incendiaron tras impactar con minas navales en el estrecho de Ormuz", "url": "https://www.latercera.com/mundo/noticia/iran-informa-que-dos-petroleros-se-incendiaron-tras-impactar-con-minas-navales-en-el-estrecho-de-ormuz/", "fonte_id": "la_tercera", "data_pub": "2026-11-22T20:39:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A armada iraniana informou que dois petroleros se incendiaram após colidirem com minas navais em um estreito localizado no Oceano Índico, em meio a restrições impostas pelo Irã ao tráfego marítimo na área. Os navios entraram em uma zona restringida apesar de avisos e com seus sistemas de navegação desativados.", "titulo_pt": "Irã relata que dois petroleros pegaram fogo após colidirem com minas navais no estreito de Ormuz", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 281304, "titulo": "A Landmark Genocide Ruling", "url": "https://www.nytimes.com/2026/11/22/world/genocide-myanmar-un-climate-talks.html", "fonte_id": "nyt_world", "data_pub": "2026-11-22T20:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal da ONU decidiu contra Myanmar, estabelecendo um precedente importante na lei internacional que tem implicações similares para um caso sobre as ações de Israel em Gaza.", "titulo_pt": "Julgamento marca precedente em genocídio", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 281412, "titulo": "US Democrats clinch a historic House majority of at least 258 seats, the largest since 1992", "url": "https://www.scmp.com/news/world/united-states-canada/article/3375405/us-democrats-clinch-historic-house-majority-least-258-seats-largest-1992", "fonte_id": "scmp", "data_pub": "2026-11-22T20:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os democratas americanos conquistaram pelo menos 258 vagas na Câmara dos Representantes, o melhor resultado geral em décadas. Este é o maior número de assentos desde 1992, proporcionando oportunidades de governo amplas, mas também pressões para cumprir promessas eleitorais.", "titulo_pt": "Democratas americanos garantem maioria histórica na câmara com pelo menos 258 assentos, o maior desde 1992", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 281401, "titulo": "Grillo, se il giudice dice che il Movimento è mio me lo prendo", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/22/grillo-se-il-giudice-dice-che-il-movimento-e-mio-me-lo-prendo_cae5c617-c713-4d74-a7a8-6a4cdbd78926.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-22T20:30:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O juiz decidiu que o Movimento pertence a Grillo, e ele pode assumi-lo. O uso poderá ser limitado a pessoas com menos de 25 anos.", "titulo_pt": "Grillo, se o juiz diz que o Movimento é meu, eu o assumo", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 281364, "titulo": "Democrats win largest House majority since 1992 after flipping North Carolina seat", "url": "https://www.bbc.co.uk/news/articles/c6vg29g7dlyno?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-22T20:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os democratas ganharam a maior maioria na Câmara dos Representantes desde 1992, após conquistar uma cadeira na Carolina do Norte. Agora, os democratas detêm pelo menos 258 cadeiras, enquanto os republicanos têm pelo menos 173.", "titulo_pt": "Democratas conquistam maioria na câmara desde 1992 após ganho na Carolina do norte", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 281164, "titulo": "Cientista-chefe da OpenAI defende limites para o desenvolvimento de IA no setor", "url": "https://www.infomoney.com.br/business/cientista-chefe-da-openai-defende-limites-para-o-desenvolvimento-de-ia-no-setor/", "fonte_id": "infomoney", "data_pub": "2026-11-22T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jakub Pachocki, cientista-chefe da OpenAI, defendeu a criação de padrões industriais para limitar o desenvolvimento da inteligência artificial. Esses padrões visam estabelecer regras para todo o setor de IA.", "titulo_pt": "Cientista-chefe da OpenAI defende limites para o desenvolvimento de IA no setor", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 281165, "titulo": "Conflitos no Congo dificultam resposta ao surto de Ebola, diz diretor-geral ⁠da OMS", "url": "https://www.infomoney.com.br/mundo/conflitos-no-congo-dificultam-resposta-ao-surto-de-ebola-diz-diretor-geral-%e2%81%a0da-oms/", "fonte_id": "infomoney", "data_pub": "2026-11-22T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ataques generalizados no leste do Congo desde outubro têm dificultado a resposta à epidemia de Ebola. O diretor-geral da OMS relatou essa dificuldade.", "titulo_pt": "Conflitos no Congo dificultam resposta ao surto de Ebola, diz diretor-geral da OMS", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 281068, "titulo": "Você realmente precisa ter parte do patrimônio em dólar?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/11/voce-realmente-precisa-ter-parte-do-patrimonio-em-dolar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-22T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Muitos investidores brasileiros mantêm uma parte de seu patrimônio em dólar, com recomendações que variam de 10% a 30%. Esta prática é frequentemente considerada uma forma de reduzir riscos relacionados à volatilidade cambial, mas alguns acreditam que pode ser desnecessária.", "titulo_pt": "Você realmente precisa ter parte do patrimônio em dólar?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 281069, "titulo": "Secretário do Tesouro dos EUA suaviza discurso e não descarta retorno de Jensen Huang à Nvidia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/secretario-do-tesouro-dos-eua-se-recusa-a-descartar-retorno-de-jensen-huang-a-nvidia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-22T20:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O secretário do Tesouro dos EUA, Scott Bessent, sinalizou que não se oporia à possível volta de Jensen Huang à Nvidia, após ter solicitado uma reformulação drástica da empresa e a busca por uma nova liderança há uma semana.", "titulo_pt": "Secretário do Tesouro dos EUA deixa porta aberta para retorno de Jensen Huang à Nvidia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 281216, "titulo": "Controvérsia sobre SSE/THC2 evolui nos Tribunais Superiores. Como os importadores são afetados?", "url": "https://www.jota.info/opiniao-e-analise/artigos/controversia-sobre-sse-thc2-evolui-nos-tribunais-superiores-como-os-importadores-sao-afetados", "fonte_id": "jota", "data_pub": "2026-11-22T20:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A controvérsia sobre o SSE/THC2 foi apreciada pelo Supremo Tribunal Federal (STF) e agora será analisada pelo Superior Tribunal de Justiça (STJ). Os importadores podem ser afetados pela decisão final.", "titulo_pt": "Controvérsia sobre SSE/THC2 evolui nos Tribunais Superiores e afeta importadores", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 281070, "titulo": "Economia circular depende de catadores e ainda ignora seu papel", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/11/economia-circular-depende-de-catadores-e-ainda-ignora-seu-papel.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-22T20:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em Bogotá, na Colômbia, catadores recolhem diariamente materiais recicláveis como papelão, plástico, metal e papel. Sua importância para a economia circular é significativa, mas ainda não é reconhecida de forma adequada.", "titulo_pt": "Economia circular depende de catadores e ainda ignora seu papel", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 281399, "titulo": "Delta flight delays add to concerns about US air travel systems", "url": "https://www.ft.com/content/14566557-3f63-4eeb-b589-6cb1144dc918?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-22T19:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Atrasos em voos da Delta não estão relacionados a problemas técnicos no hub da empresa em Atlanta, segundo a FAA. Essa informação não está relacionada a uma pane nacional ocorrida no mês atual.", "titulo_pt": "Atrasos de voos da delta não estão relacionados a problemas técnicos no hub de atlanta, diz a faa", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 281171, "titulo": "Estrondos de madrugada assustam moradores de Barretos (SP); USP investiga causa", "url": "https://www.infomoney.com.br/brasil/estrondos-de-madrugada-assustam-moradores-de-barretos-sp-usp-investiga-causa/", "fonte_id": "infomoney", "data_pub": "2026-11-22T18:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sismógrafos foram instalados no bairro de Barretos, São Paulo, após moradores relatar estrondos de madrugada. A Universidade de São Paulo (USP) está investigando a causa desses sons, que incluem a possibilidade de acomodação do solo e poços artesianos irregulares.", "titulo_pt": "Estrondos de madrugada assustam moradores de Barretos (SP); USP investiga causa", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 281375, "titulo": "Employees at Eric Trump-backed robot startup lose health benefits as company's cash crunch deepens", "url": "https://www.cnbc.com/2026/11/22/foundation-future-industries-health-benefits-payroll-base-group.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-22T18:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Funcionários de uma startup de robótica apoiada por Eric Trump perderam seus benefícios de saúde devido a uma crise financeira que a empresa está enfrentando. A startup está buscando um empréstimo de curto prazo emergencial e tem conversado com fundos de venture capital enquanto aguarda uma investida de 150 milhões de dólares do grupo sul-coreano Base Group.", "titulo_pt": "Funcionários da startup robótica perdem benefícios de saúde devido à crise financeira", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 281172, "titulo": "“Uma minoria pode descarrilar tudo”: UE explica por que rejeitou acordo da COP31", "url": "https://www.infomoney.com.br/mundo/uma-minoria-pode-descarrilar-tudo-ue-explica-por-que-rejeitou-acordo-da-cop31/", "fonte_id": "infomoney", "data_pub": "2026-11-22T18:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O comissário de Clima da UE, Wopke Hoekstra, explicou que o acordo da COP31 foi rejeitado porque o texto recuava do compromisso de abandonar os combustíveis fósseis. Alternativas fora da ONU foram defendidas.", "titulo_pt": "‘Uma minoria pode descarrilar tudo’: UE explica por que rejeitou acordo da COP31", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 280602, "titulo": "Chitãozinho e Xororó anunciam aposentadoria dos palcos – mas não do agro", "url": "https://www.infomoney.com.br/business/chitaozinho-e-xororo-anunciam-aposentadoria-dos-palcos-mas-nao-do-agro/", "fonte_id": "infomoney", "data_pub": "2026-11-22T17:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Chitãozinho e Xororó an "Falha em sistema da Delta provoca atrasos em centenas de voos nos EUA", "url": "https://www.metropoles.com/mundo/falha-em-sistema-da-delta-provoca-atrasos-em-centenas-de-voos-nos-eua", "fonte_id": "metropoles", "data_pub": "2026-11-22T20:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um problema no sistema que calcula o peso e o balanceamento das aeronaves da Delta causou atrasos em centenas de voos no principal centro de conexões da companhia, em Atlanta.", "titulo_pt": "Falha no sistema da Delta causa atrasos em centenas de voos nos EUA", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 281413, "titulo": "US seeks answers on Nvidia’s sale of chips to China, Bessent says", "url": "https://www.scmp.com/news/world/united-states-canada/article/3375404/us-seeks-answers-nvidias-sale-chips-china-bessent-says", "fonte_id": "scmp", "data_pub": "2026-11-22T20:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos está pedindo explicações à Nvidia sobre suas vendas de chips para a China e planeja descobrir quem estava responsável por questões de conformidade na empresa, que foi anteriormente liderada por Jensen Huang, que renunciou após um caso com uma suspeita de espionagem chinesa. O secretário do Tesouro dos EUA, Scott Bessent, declarou que a Nvidia deve fornecer respostas rápidas sobre o clima de conformidade na empresa.", "titulo_pt": "EUA pedem explicações à Nvidia sobre vendas de chips para a China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 281206, "titulo": "Como concluir missões em GTA 6: planejamento vale mais que o caos", "url": "https://canaltech.com.br/games/gta-6-planejar-missoes-recompensa-realismo/", "fonte_id": "canaltech", "data_pub": "2026-11-22T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "GTA 6 prioriza uma jogabilidade mais realista, mantendo elementos de diversão, sem seguir estritamente os hábitos de GTA V. O jogo se posiciona entre os estilos de GTA 4 e GTA V, oferecendo uma experiência equilibrada entre seriedade e excentricidade.", "titulo_pt": "Como concluir missões em GTA 6: planejamento vale mais que o caos", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 281213, "titulo": "Anthropic e SpaceX impuseram regras incomuns e irritaram bancos no IPO", "url": "https://olhardigital.com.br/2026/11/22/pro/anthropic-e-spacex-impuseram-regras-incomuns-e-irritaram-bancos-no-ipo/", "fonte_id": "olhar_digital", "data_pub": "2026-11-22T19:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As empresas de IA Anthropic e SpaceX negociaram condições incomuns com os bancos durante suas ofertas públicas iniciais (IPO), gerando irritação entre os bancos. Isso ilustra a crescente influência das empresas de IA na negociação de IPOs.", "titulo_pt": "Anthropic e SpaceX impuseram regras incomuns e irritaram bancos no IPO", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 281208, "titulo": "GTA 6: carro de Jason esconde BMW clássico com DNA de F1", "url": "https://canaltech.com.br/carros/gta-6-carro-de-jason-esconde-bmw-classico-com-dna-de-f1/", "fonte_id": "canaltech", "data_pub": "2026-11-22T19:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O novo jogo Grand Theft Auto 6 da Rockstar Games apresenta um carro conversível vermelho dirigido pelo protagonista Jason Duval, que lembra o BMW Série 3 Cabriolet da geração E30. Embora a Rockstar não use nomes de fabricantes reais, o veículo é inspirado nesse modelo clássico.", "titulo_pt": "GTA 6: carro de Jason lembra BMW clássico com DNA de F1", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 281214, "titulo": "Por que Roraima enfrenta seca extrema mesmo após cheias em junho", "url": "https://olhardigital.com.br/2026/11/22/ciencia-e-espaco/por-que-roraima-enfrenta-seca-extrema-mesmo-apos-cheias-em-junho/", "fonte_id": "olhar_digital", "data_pub": "2026-11-22T18:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Com apenas 37% da média de chuvas desde julho, Roraima enfrenta uma seca severa, influenciada pelo El Niño mais intenso para esta época desde 1997. Apesar de ter registrado cheias em junho, a região continua enfrentando condições secas extremas.", "titulo_pt": "Por que Roraima enfrenta seca extrema mesmo após cheias em junho", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 281176, "titulo": "Bessent não descarta retorno de Jensen Huang ao comando da Nvidia", "url": "https://exame.com/mundo/bessent-nao-descarta-retorno-de-jensen-huang-ao-comando-da-nvidia/", "fonte_id": "exame", "data_pub": "2026-11-22T18:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Secretário do Tesouro americano sugeriu mudanças na liderança da Nvidia, mas não se posicionou contra o possível retorno de Jensen Huang, que recentemente deixou o cargo.", "titulo_pt": "Bessent não descarta retorno de Jensen Huang à liderança da Nvidia", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 281215, "titulo": "Como os irmãos Amodei moldaram a cultura excêntrica da Anthropic", "url": "https://olhardigital.com.br/2026/11/22/pro/como-os-irmaos-amodei-moldaram-a-cultura-excentrica-da-anthropic/", "fonte_id": "olhar_digital", "data_pub": "2026-11-22T18:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os irmãos Dario e Daniela Amodei criaram a Anthropic com o lema 'mantenha a Anthropic estranha', estabelecendo rituais excêntricos e rejeitando candidatos com motivações financeiras únicas.", "titulo_pt": "Como os irmãos Amodei moldaram a cultura excêntrica da Anthropic", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 281424, "titulo": "Why data centers are at the center of the Big Tech backlash", "url": "https://techcrunch.com/2026/11/22/why-data-centers-are-at-the-center-of-the-big-tech-backlash/", "fonte_id": "techcrunch", "data_pub": " abetes tipo 2 apresentam um risco 53% maior de desenvolver Alzheimer's disease, conforme indicado por uma revisão que analisou 40 estudos. Os pesquisadores estimam que aproximadamente cinco em cada mil pessoas com diabetes tipo 2 desenvolvem Alzheimer's anualmente.", "titulo_pt": "Diabetes tipo 2 associado a risco 53% maior de Alzheimer", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 281437, "titulo": "Earth just saw the most anomalously hot day ever on record", "url": "https://www.scientificamerican.com/article/earth-just-saw-the-most-anomalously-hot-day-ever-on-record/", "fonte_id": "scientific_american", "data_pub": "2026-11-22T20:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O planeta registrou o dia mais anomalousmente quente já registrado, durante um El Niño que continua a se intensificar. Este recorde pode ser superado em breve.", "titulo_pt": "A terra registrou o dia mais anomalousmente quente já registrado", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 281425, "titulo": "Silver briefly forms a rare crystal structure seen in radioactive polonium", "url": "https://phys.org/news/2026-11-silver-briefly-rare-crystal-radioactive.html", "fonte_id": "phys_org", "data_pub": "2026-11-22T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores da Hokkaido University descobriram uma nova estrutura cristalina de prata com alta reatividade química. Essa descoberta, publicada em Nano Letters, pode abrir novas possibilidades para a exploração de materiais com propriedades desejáveis.", "titulo_pt": "Prata forma rara estrutura cristalina semelhante à encontrada em polônio radioativo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 281438, "titulo": "65 Years of Human Spaceflight at NASA Johnson", "url": "https://www.nasa.gov/centers-and-facilities/johnson/65-years-of-human-spaceflight-at-nasa-johnson/", "fonte_id": "nasa_news", "data_pub": "2026-11-22T19:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA's Johnson Space Center em Houston comemora 65 anos de contribuição para a humanidade na exploração espacial, desde as missões Gemini até a pesquisa realizada na Estação Espacial Internacional. Hoje, os times da Johnson continuam preparando equipes para missões espaciais.", "titulo_pt": "65 Anos de exploração espacial humana na NASA Johnson", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 281010, "titulo": "Atmospheric organic nitrogen emerges as a major nutrient source for global oceans", "url": "https://phys.org/news/2026-11-atmospheric-nitrogen-emerges-major-nutrient.html", "fonte_id": "phys_org", "data_pub": "2026-11-22T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time de pesquisa quantificou um componente importante do ciclo global de nitrogênio. O nitrogênio orgânico atmosférico emerge como uma importante fonte de nutrientes para os oceanos globais.", "titulo_pt": "Nitrogênio orgânico atmosférico emerge como uma importante fonte de nutrientes para os oceanos globais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 280717, "titulo": "El Niño y La Niña: un estudio argentino descubrió patrones de recurrencia y planteó una hipótesis hasta 2030", "url": "https://www.lanacion.com.ar/economia/campo/el-nino-y-la-nina-un-estudio-argentino-descubrio-patrones-de-recurrencia-y-planteo-una-hipotesis-nid21112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-22T16:59:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O pesquisador Guillermo A. Chinni analisou 78 anos de registros e encontrou padrões de recorrência entre El Niño e La Niña e a posição da Terra em relação ao Sol. O trabalho sugere uma possível predominância de El Niño nos próximos anos.", "titulo_pt": "El Niño e La Niña: estudo argentino identifica padrões de recorrência e prevê predominância de el Niño", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 280692, "titulo": "Pente experimental estimula crescimento capilar e supera tratamentos convencionais em ratos", "url": "https://www.dw.com/pt-br/pente-experimental-estimula-crescimento-capilar-e-supera-tratamentos-convencionais-em-ratos/a-80014577?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-22T16:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um novo dispositivo experimental combina estímulos elétricos e moléculas terapêuticas para estimular o crescimento capilar, alcançando até 97,85% de recrescimento capilar em ratos. A tecnologia ainda não foi testada em humanos.", "titulo_pt": "Dispositivo experimental estimula crescimento capilar e supera tratamentos convencionais em ratos", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 281011, "titulo": "JWST finds a possible black hole that grew faster than its host galaxy in the early universe", "url": "https://phys.org/news/2026-11-jwst-black-hole-grew-faster.html", "fonte_id": "phys_org", "data_pub": "2026-11-22T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A descoberta do possível buraco negro que cresceu mais rápido que sua galáxia anfitriã no início do universo é um mistério em astronomia. A formação de buracos negros massivos de cerca de um bilhão de massas solares no primeiro bilhão de anos do universo requer explicações extraordinárias.", "titulo_pt": "JWST encontra possível buraco negro que cresceu mais rápido que sua galáxia anfitriã no início do universo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 281040, "titulo": "SpaceX sends classified US spy satellites to orbit in early-morning launch from California coast (video)", "url": "https://www.space.com/space-exploration/launches-spacecraft/spacex-spy-satellite-launch-nrol-136-proliferated-architecture", "fonte_id": "space_com", "data_pub": "2026-11-22T16:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX lançou uma série de satélites espionagem classificados para o Departamento Nacional de Reconhecimento dos Estados Unidos na madrugada de domingo (22 de novembro).", "titulo_pt": "Spacex lança satélites espionagem classificados para o departamento nacional de reconhecimento dos EUA", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 280945, "titulo": "Has AI solved the Riemann hypothesis? Claim makes waves at 200th birthday event in China", "url": "https://www.scmp.com/news/china/science/article/3375386/has-ai-solved-riemann-hypothesis-claim-makes-waves-200th-birthday-event-china", "fonte_id": "scmp", "data_pub": "2026-11-22T16:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um matemático dos Estados Unidos surpreendeu a comunidade ao afirmar ter resolvido a hipótese de Riemann, um problema matemático não resolvido há quase 170 anos, usando inteligência artificial. A afirmação causou comoção durante um importante congresso em Shenzhen, China, que celebra o 200º aniversário do nascimento de Bernhard Riemann.", "titulo_pt": "AI resolveu hipótese de Riemann? Alegação causa ondas em evento chinês", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 281012, "titulo": "Mercury gets its first visitor in years as a pair of spacecraft loop into orbit", "url": "https://phys.org/news/2026-11-mercury-visitor-years-pair-spacecraft.html", "fonte_id": "phys_org", "data_pub": "2026-11-22T15:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois satélites entraram em órbita ao redor de Mercúrio após uma viagem de oito anos pelo sistema solar interno. O objetivo é descobrir mais sobre as mistérias desse planeta mais próximo do Sol.", "titulo_pt": "Mercúrio recebe sua primeira visita em anos com uma dupla de satélites em órbita", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 281013, "titulo": "COP31 fails to agree on climate deal in chaotic finale", "url": "https://phys.org/news/2026-11-cop31-climate-chaotic.html", "fonte_id": "phys_org", "data_pub": "2026-11-22T15:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As negociações climáticas COP31 terminaram sem um acordo histórico, após a União Europeia e outros países recusarem-se a endossar um pacto que omitiu os combustíveis fósseis. O evento se estendeu além do horário previsto, alcançando uma marca inédita na Turquia.", "titulo_pt": "COP31 falha em alcançar acordo climático em final caótico", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 280474, "titulo": "Filósofo Michael Marder propõe outro Iluminismo de olho no vegetal", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/filosofo-michael-marder-propoe-outro-iluminismo-de-olho-no-vegetal.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-22T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O filósofo Michael Marder sugere um novo Iluminismo que considere as plantas como modelo de pensamento, em uma época de desorientação. Ele propõe refletir mais sobre as plantas do que sobre os problemas humanos complexos.", "titulo_pt": "Filósofo Michael Marder sugere um novo Iluminismo voltado para o vegetal", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 281014, "titulo": "Hybrid nanocrystal surface reveals new way to tune interactions with infrared light", "url": "https://phys.org/news/2026-11-hybrid-nanocrystal-surface-reveals-tune.html", "fonte_id": "phys_org", "data_pub": "2026-11-22T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma camada de um cristal, feita de duas espécies de nanocrystais misturados em solução, pode amplificar ou suprimir a luz infravermelha além da soma de suas partes individuais.", "titulo_pt": "Superfície de nanocrystais híbridos revela novo método para ajustar interações com luz infravermelha", "veiculo": "Phys.org", "pais": "EUA", -formar-tecnicos-en-nid22112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-22T21:25:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em 2027, a cidade de Buenos Aires criará uma especialidade secundária na área de automovilismo, que será oferecida pela Escola Técnica Monte Castro e concederá o título de Técnico em Motorsport. O programa incluirá formação em motores de competição, telemetría, aerodinâmica e inteligência artificial.", "titulo_pt": "Das salas de aula às pistas: a cidade criará uma especialidade secundária para formar técnicos em automovilismo", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 281444, "titulo": "Huelva Ibero-American Film Festival Prizes: ‘After Elena,’ Alfredo Castro, Lucía Puenzo and ‘La Bola Negra’ Win Big", "url": "https://variety.com/2026/film/global/huelva-ibero-american-film-festival-prizes-after-elena-1236955462/", "fonte_id": "variety", "data_pub": "2026-11-22T21:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Festival de Cinema Ibero-Americano de Huelva, um dos principais palcos europeus para o cinema latino-americano, premiou o ator chileno Alfredo Castro e a diretora-roteirista argentina Lucía Puenzo. O filme 'La Bola Negra' também ganhou mais um prêmio, com seus criadores Javier Calvo e Javier Ambrossi.", "titulo_pt": "Prêmios do Festival de cinema ibero-americano de huelva: Castro, Puenzo e 'La Bola Negra' vencem", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 281439, "titulo": "Rian Johnson Leaves the Door Open to Star Wars Return: ‘It’s a World I Deeply Love’", "url": "https://www.indiewire.com/news/breaking-news/rian-johnson-star-wars-return-update-1235229946/", "fonte_id": "indiewire", "data_pub": "2026-11-22T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rian Johnson, diretor de \"The Last Jedi\", afirmou à IndieWire que ama a franquia 'Star Wars' mais do que nunca. Ele expressou que está aberto à possibilidade de retornar à franquia, sob a liderança do novo chefe da Lucasfilm, Dave Filoni, que está avançando com projetos após \"The Rise of Skywalker\".", "titulo_pt": "Rian Johnson deixa porta aberta para retorno a Star Wars: 'é um mundo que amo profundamente'", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 281453, "titulo": "PlaqueBoyMax Wants to Find Your Next Favorite Artist", "url": "https://www.rollingstone.com/music/music-features/plaqueboymax-rising-star-interview-new-album-1235662193/", "fonte_id": "rolling_stone_music", "data_pub": "2026-11-22T20:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O streamer PlaqueBoyMax está promovendo um concurso de música chamado 'Rising Star', onde artistas emergentes têm uma oportunidade no fim de semana para mostrar seus talentos. Além disso, ele está produzindo um álbum musical próprio.", "titulo_pt": "Plaqueboymax quer descobrir seu próximo artista favorito", "veiculo": "Rolling Stone - Música", "pais": "EUA", "classe": "C"}, {"id": 281445, "titulo": "John Turturro Says ‘I Still Consider Myself a Beginner’ as He Gets Marrakech Film Festival Tribute Award: ‘Every Job Is Like a First Love’", "url": "https://variety.com/2026/film/festivals/john-turturro-marrakech-film-festival-award-still-beginner-1236955255/", "fonte_id": "variety", "data_pub": "2026-11-22T20:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "John Turturro, com 69 anos, recebeu um tributo em festival de cinema em Marrakesh, reconhecendo sua carreira de quatro décadas. Mesmo após tanto tempo, ele se considera ainda um iniciante.", "titulo_pt": "John Turturro considera-se ainda um iniciante apesar da longa carreira, recebe tributo em Festival de marrakesh", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 281247, "titulo": "Los Pumas, entre la bronca de Contepomi con los árbitros, los errores que se repiten y una última prueba ante Escocia", "url": "https://www.clarin.com/deportes/pumas-bronca-contepomi-arbitros-errores-repiten-ultima-prueba-escocia_0_ODVaxjZR7l.html", "fonte_id": "clarin", "data_pub": "2026-11-22T20:38:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O técnico dos Pumas questionou cautelosamente a expulsão de Mayco Vivas, em meio a debates sobre a punição a Rassie Erasmus. Após a derrota contra a França, a seleção argentina busca encerrar um ano irregular enfrentando novamente o mesmo adversário com o qual iniciou a temporada.", "titulo_pt": "Os Pumas, entre a bronca de Contepomi com os árbitros, os erros que se repetem e uma última prova contra escócia", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 281446, "titulo": "‘Hunger Games’ Lead Joseph Zada on Filming His Breakout Movie Role and ‘Sunrise on the Reaping’s’ Intense Stunts: ‘I Look Like a F—ing Action Star!’", "url": "https://variety.com/2026/film/features/hunger-games-sunrise-on-the-reaping-joseph-zada-action-scenes-1236954627/", "fonte_id": "variety", "data_pub": "2026-11-22T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Joseph Zada, ator principal de 'The Hunger Games: Sunrise on the Reaping', descreveu sua primeira experiência no set como intenso, especialmente em relação aos cenas de ação. Ele mencionou que parece um ator de ação após as filmagens.", "titulo_pt": "Ator de 'the hunger Games' fala sobre seu primeiro dia no set e cenas intensas de ação", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 281447, "titulo": "Ina Garten Says She Turned Down ‘Dancing With the Stars’ Because the Thought of Competing Gave Her ‘Nightmares’", "url": "https://variety.com/2026/tv/news/ina-garten-dancing-with-the-stars-1236955404/", "fonte_id": "variety", "data_pub": "2026-11-22T20:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A chef famosa Ina Garten decidiu não participar do programa 'Dancing with the Stars' devido ao seu medo de competir, que a deixava ansiosa. Ela revelou isso em 21/", "fonte_id": "variety", "data_pub": "2026-11-22T19:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Noah Kahan não recebeu a atenção Grammy que merecia, recebendo apenas uma indicação menor. Muitos artistas, tanto de maior quanto de menor projeção, têm sido abertos sobre sua decepção com a falta de reconhecimento Grammy ou Oscar nos tempos modernos, com maior uso de redes sociais.", "titulo_pt": "Noah Kahan merecia muito mais amor Grammy do que apenas uma indicação menor. Aqui está por que ele não teve isso", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 281450, "titulo": "Noah Schnapp Says He Auditioned to Play Haymitch in ‘Hunger Games: Sunrise on the Reaping’: ‘They Picked Right for This One’", "url": "https://variety.com/2026/film/news/noah-schnapp-hunger-games-sunrise-on-the-reaping-haymich-1236955369/", "fonte_id": "variety", "data_pub": "2026-11-22T18:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Noah Schnapp, ator de 'Stranger Things', revelou que havia audicionado para o papel de Haymitch em 'The Hunger Games: Sunrise on the Reaping'. A chance não estava em seu favor para esse papel.", "titulo_pt": "Noah Schnapp diz ter audicionado para o papel de Haymitch em 'the Hunger Games: sunrise on the Reaping'", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 281065, "titulo": "Não tenho pretensão de nada além da emoção, diz Sarah Oliveira sobre Atenção para o Refrão", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/televisao/2026/11/nao-tenho-pretensao-de-nada-alem-da-emocao-diz-sarah-oliveira-sobre-atencao-para-o-refrao.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-22T18:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sarah Oliveira, de 47 anos, criou o programa 'Atenção para o Refrão', que estreou uma nova temporada nos canais Bis e Multishow. O programa explora a história por trás de trechos de músicas popular
