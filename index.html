<html lang="pt-BR">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

iderando convocar eleições antecipadas se os decretos de habitação forem revogados. Na América Latina, a China superou os Estados Unidos em termos de percepção de influência positiva, segundo o relatório Latinobarómetro 2026. Em Paris, mais de 560 escolas foram interrompidas na sexta-feira devido a intensas manifestações, com cerca de 3.000 adolescentes detidos. Na Itália, o sindicato médico registrou uma taxa de demissões de 150% em 2025, além de um aumento do spread entre títulos de dívida da Itália e da Alemanha para 131 pontos base. O Departamento de Estado dos Estados Unidos suspendeu os serviços consulares no Brasil véspera das eleições presidenciais, justificando a medida por questões de segurança. Na França, o presidente Macron presidirá uma videoconferência com líderes do G7 para discutir a situação energética mundial.\n\nO cenário geopolítico mundial continua agitado, com várias frentes de conflitos e tensões. A Ucrânia enfrenta um novo impulso militar russo, com Moscou utilizando drones para superar as defesas ucranianas, enquanto Kiev luta com altas perdas e recuos. Em resposta, o governo dos Estados Unidos aumentou sua presença militar no Oriente Médio, enviando um navio de guerra e mais de 60.000 soldados para a região. A Coreia do Sul advertiu a Ucrânia sobre possíveis medidas adicionais se ela não oferecer uma retratação pública sobre o suposto envio de soldados norte-coreanos para a Coreia do Sul. Em outro ponto do globo, a Turquia enfrenta uma repressão crescente, com centenas de sites e contas de mídia social sendo bloqueados e uma onda de restrições à internet afetando até mesmo o mercado de ações. Além disso, a Austrália fechou temporariamente sua embaixada no Brasil devido a preocupações de segurança, enquanto a embaixada dos Estados Unidos também suspendeu seus serviços no país por razões semelhantes. Estes eventos refletem a crescente complexidade e interconectividade das relações internacionais em um momento de grande instabilidade global.", "economia": "A economia global enfrenta desafios significativos, com a inflação na zona do euro atingindo seu nível mais alto em três anos, conforme dados da Eurostat. As tensões geopolíticas, como o conflito entre Estados Unidos e Irã, contribuem para o aumento dos preços de energia, impulsionando a inflação para 3,8%. No Brasil, o dólar subiu em vista do relatório de emprego dos Estados Unidos, que indicou uma desaceleração no crescimento do emprego. As preocupações com a volatilidade nas ações brasileiras levaram o índice de medo da Bolsa a atingir um recorde de 32,39 pontos. O presidente Lula anunciou discussões com o Banco Central sobre a possibilidade de proibir a emissão de cartões de crédito adicionais para reduzir o endividamento dos consumidores. A Embraer renovou seu recorde de entregas no terceiro trimestre, com 66 aeronaves, enquanto a Airbus entregou 72 aviões em setembro. A Nike enfrenta dificuldades com a queda no lucro e prevê uma redução significativa nas receitas, devido à estagnação nas vendas de tênis e artigos esportivos em mercados globais. A Care Plus adquiriu uma fatia da Beep Saúde, ampliando sua aposta no atendimento domiciliar, enquanto a Highline recebeu R$ 72,9 milhões para expandir a cobertura móvel de alta capacidade em 131 localidades.", "tecnologia": "A tecnologia está em constante crescimento, com destaque para a inteligência artificial (IA), que está transformando diversos setores. Segundo relatos, a demanda por engenheiros de IA especializados em 'agent orchestration' aumentou em 1.721%, o que impulsionou a busca por talentos nesta área. O Google lançou o modelo Gemini 4 Argón, projetado para áreas como programação, pesquisa e cibersegurança, com acesso gradual para clientes pagantes. Por outro lado, a China está investindo na formação de especialistas em tecnologias avançadas, criando novas instituições nas academias militares. A OpenAI demitiu três funcionários por manuseio incorreto de informações sensíveis, enquanto a Anthropic planeja uma oferta inicial de ações para meados de novembro, embora com preocupações legais e de segurança. A Amazon também está pedindo apoio para projetos de centrais de dados de IA, alegando que o bloqueio desses projetos pode causar danos irreparáveis à economia e à segurança nacional dos EUA.", "ciencia": "Astrônomos encontraram um sistema de duas estrelas de nêutrons de menor massa até o momento, um achado que amplia nosso entendimento sobre os restos extremamente densos de estrelas massivas que explodiram no fim de suas vidas. Paralelamente, um relógio atômico de alta precisão, construído por pesquisadores de Singapura, superou cientistas chineses e americanos, estabelecendo um novo recorde mundial. Em ciência, um estudo sugere que a primeira semana de vida dos bebês pode ser crucial para o risco futuro de alergias e eczema. Além disso, um fóssil recém-descoberto na China oferece novas evidências sobre a evolução dos dinossauros para o voo. Estes avanços refletem o amplo espectro de descobertas e inovações em diversas áreas do conhecimento.", "cultura": "Um importante evento na cultura global foi o cancelamento dos shows de Kanye West, agora conhecido como Ye, em São Petersburgo, na Rússia. Os dois concertos agendados foram cancelados após a diplomacia russa considerar as apresentações inaceitáveis devido à glorificação do Adolf Hitler pelo rapper. Este cancelamento reflete questões complexas envolvendo cultura, política e liberdades artísticas. Além disso, a Globo está avaliando reprisar o remake de 'Pantanal' para aumentar a audiência após o sucesso de 'Avenida Brasil'. Em outros desenvolvimentos, a atriz chinesa Zhong Juanjuan, de 60 anos, se tornou uma streamer de jogos eletrônicos, desafiando estereótipos sobre idosos. Sua popularidade crescente sugere uma mudança na percepção da idade na indústria de entretenimento. Finalmente, a obra de 'Fall of Freedom' está de volta a leilão, enquanto os desenhos de Alice Neel dos julgamentos de Foley Square serão leiloados, destacando a importância de reconhecer e preservar a arte e a história.", "sociedade": "Mais de 400 escolas na França foram fechadas devido a protestos de estudantes contra a precarização do ensino, conforme informado pela CNN Brasil. A situação agravou-se, levando o governo francês a enviar policiais de choque às escolas para controlar os confrontos, relata o Le Monde. Em Goiás, um idoso ficou ilhado em uma ponte após seu carro apagar durante uma tentativa de cruzar um córrego transbordado, sendo resgatado pelo Corpo de Bombeiros. No Japão, há uma epidemia de gripe em todo o país, com o ministério da Saúde pedindo precauções básicas. Em Madri, manifestantes batem panelas e frigideiras para exigir ações sobre a crise imobiliária na Espanha, pedindo segurança e apoio a jovens adultos em busca de moradia. Além disso, a Cornell University enfrenta novas acusações de estupro coletivo, reavivando debates nos Estados Unidos. No Brasil, condomínios terão até 2027 para se adequar às novas regras do Estatuto da Segurança Privada, diferenciando as funções de porteiros e vigilantes. O verão de 2026 foi o mais quente da história na Europa Ocidental, mas não houve uma política de transição para energias renováveis, aponta a Euronews.", "meio_ambiente": "A Alemanha inaugurou um novo aerogerador de 365 metros de altura em Schipkau, que se tornou o mais alto do mundo. O equipamento está programado para entrar em operação em novembro, representando um avanço tecnológico na geração de energia eólica. Paralelamente, um relatório do Copernicus revelou que o verão europeu de 2023 foi extremamente quente, com temperaturas médias 2,5°C acima da média de 10 anos, especialmente na Europa ocidental, onde as temperaturas superaram 38°C em mais de metade do continente. Essas condições extremas resultaram em perdas significativas na colheita e aumentaram o número de mortes relacionadas ao calor, sinalizando um cenário preocupante para o futuro do meio ambiente e da agricultura na região.", "direitos_humanos": "No Brasil, o número de casos de violência política contra mulheres aumentou mais de 11 vezes nos últimos quatro anos, conforme estabelecido pela lei que impõe penalidades para ataques direcionados a mulheres que atuam na política. Em Perth, Austrália Ocidental, ativistas e um deputado verde ameaçam processar a polícia após ela proibir pelo menos 12 pessoas de entrar em uma área de segurança designada para o Expo Land Forces, um evento de armas. Segundo as novas leis australianas, qualquer pessoa que desobedecer a uma ordem de exclusão pode enfrentar uma multa máxima de 36.000 dólares australianos e até três anos de prisão. Na Malásia, refugiados rohingyas enfrentam crescente hostilidade, enquanto os recursos limitados dos grupos de apoio se cruzam com a situação. Finalmente, uma petição com 170.000 assinaturas foi entregue ao Subsecretário Chefe de Gabinete do Japão, pedindo ações do governo japonês em relação ao ex-diretor do ICC, que foi sanionado."}, "resumo_do_dia": {"politica_nacional": [{"id": 190807, "titulo": "PF investiga financiamento irregular de campanha após apreender meio milhão", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/pf-investiga-financiamento-irregular-de-campanha-apos-apreender-meio-milhao", "fonte_id": "metropoles", "data_pub": "2026-10-02T12:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal investiga um financiamento irregular de campanha após apreender meio milhão de reais durante uma abordagem em Santa Inês, Maranhão.", "titulo_pt": "PF investiga financiamento irregular de campanha após apreender meio milhão", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 190900, "titulo": "Por que a dívida pública é importante e deve pautar o governo do próximo presidente", "url": "https://www.infomoney.com.br/economia/por-que-a-divida-publica-e-importante-e-deve-pautar-o-governo-do-proximo-presidente/", "fonte_id": "infomoney", "data_pub": "2026-10-02T12:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A dívida pública é crucial para o governo, pois os juros comprometem uma grande parte do orçamento. Entretanto, nenhum dos candidatos favoritos detalhou como planejam mudar essa situação se forem eleitos.", "titulo_pt": "Por que a dívida pública é importante e deve pautar o governo do próximo presidente", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 190912, "titulo": "A estratégia de Lula para evitar abstenção no primeiro turno", "url": "https://veja.abril.com.br/politica/a-estrategia-de-lula-para-evitar-abstencao-no-primeiro-turno/", "fonte_id": "veja", "data_pub": "2026-10-02T12:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O petista Lula temado a atrair eleitores para o primeiro turno, defendendo que a eleição pode ser decidida nesse momento.", "titulo_pt": "A estratégia de Lula para evitar abstenção no primeiro turno", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 190996, "titulo": "Decisões de STF e TSE culminam em debate cancelado e democracia em segundo plano", "url": "https://www.jota.info/newsletters/jota-principal/stf-tse-debate-cancelado", "fonte_id": "jota", "data_pub": "2026-10-02T12:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A decisão do STF e TSE levou a um debate cancelado e priorizou a democracia. Lula preferiu uma entrevista a podcast em vez de um confronto na TV Globo.", "titulo_pt": "Decisões do STF e TSE levam a debate cancelado e priorizam democracia; lula opta por podcast", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 190751, "titulo": "Mendonça manda redes apagarem posts associando Flávio Bolsonaro à retirada do posto de padroeira de Nossa Senhora", "url": "https://g1.globo.com/politica/noticia/2026/10/02/mendonca-manda-redes-apagarem-posts-associando-flavio-bolsonaro-a-retirada-do-posto-de-padroeira-de-nossa-senhora.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-02T12:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro André Mendonça, vice-presidente do Tribunal Superior Eleitoral (TSE), ordenou que as redes sociais excluam posts que atribuam falsamente a Flávio Bolsonaro e sua família a defesa ou compromisso com a retirada de Nossa Senhora Aparecida da condição de padroeira do Brasil. Essa decisão foi comunicada após ajustes no plenário virtual do TSE.", "titulo_pt": "Mendonça determina que redes sociais apaguem posts associando Flávio Bolsonaro à retirada do posto de padroeira de Nossa Senhora", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 190871, "titulo": "Lula x Flávio: o que está em jogo na reta final", "url": "https://piaui.uol.com.br/web/ft132/", "fonte_id": "piaui", "data_pub": "2026-10-02T12:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute os confrontos entre Lula e Flávio, focando nos principais pontos em disputa na fase final da campanha.", "titulo_pt": "Lula x Flávio: o que está em jogo na reta final", "veiculo": "Revista Piauí", "pais": "Brasil", "classe": "B"}, {"id": 190752, "titulo": "Análise: Judiciário protagoniza a eleição do começo ao fim do 1° turno", "url": "https://g1.globo.com/politica/blog/andreia-sadi/post/2026/10/02/judiciario-protagoniza-a-eleicao-do-comeco-ao-fim-do-1-turno.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-02T12:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reta final da campanha para o primeiro turno foi marcada pela atuação do Judiciário, que impactou diretamente as estratégias dos candidatos. Decisões do TSE e STF redefiniram o cenário político em poucas horas.", "titulo_pt": "Análise: judiciário protagoniza a eleição do começo ao fim do 1° turno", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 190747, "titulo": "Lei Seca: Ceará e 4 municípios de Rondônia aderem; veja lista completa", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/lei-seca-ceara-e-4-municipios-de-rondonia-aderem-veja-lista-completa", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-02T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Regional Eleitoral do Ceará (TRE-CE) implementou restrições à venda de bebidas alcoólicas durante o primeiro turno das eleições, proibindo o consumo em estabelecimentos públicos de 8h às 18h no dia 4. Além disso, dois juízos eleitorais de Rondônia também aderiram à Lei Seca para as eleições 2026.", "titulo_pt": "Lei Seca: ceará e 2 municípios de Rondônia aderem; veja lista completa", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 190824, "titulo": "PF faz operação após denúncia anônima revelar esquema de compra de votos", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/pf-faz-operacao-apos-denuncia-anonima-revelar-esquema-de-compra-de-votos", "fonte_id": "metropoles", "data_pub": "2026-10-02T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal realizou uma operação em Salgado, no estado da Bahia, após uma denúncia anônima sobre um esquema de compra de votos. Um mandado de busca e apreensão foi cumprido nesta sexta-feira (2/10).", "titulo_pt": "PF realiza operação após denúncia anônima sobre esquema de compra de votos em salgado, ba", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 190924, "titulo": "A aposta do PT para manter militância mobilizada e conquistar votos na reta final", "url": "https://veja.abril.com.br/politica/a-aposta-do-pt-para-manter-militancia-mobilizada-e-conquistar-votos-na-reta-final/", "fonte_id": "veja", "data_pub": "2026-10-02T11:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PT está apostando na presença nas ruas e na mobilização nas redes sociais para atrair votos e tentar vencer a disputa presidencial no primeiro turno.", "titulo_pt": "Aposta do PT para manter militância mobilizada e conquistar votos na reta final", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 190754, "titulo": "Maior juro do mercado, uso do rotativo bate recorde; Lula quer limitar a um cartão de crédito por pessoa", "url": "https://g1.globo.com/economia/noticia/2026/10/02/maior-juro-do-mercado-uso-do-rotativo-bate-recorde-lula-quer-limitar-a-um-cartao-de-credito-por-pessoa.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-02T11:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O juro médio cobrado pelos bancos no rotativo do cartão de crédito era de 445% ao ano em agosto, de acordo com dados do Banco Central. O uso dessa linha de crédito bateu recorde em 2026, com R$ 311 bilhões em contratações nos primeiros oito meses, um aumento de 17,1% em comparação com o mesmo período do ano anterior.", "titulo_pt": "Juro do cartão de crédito rotativo e uso batem novos recordes; Lula quer limitar a um cartão por pessoa", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 190755, "titulo": "IA impulsiona produção de ataques contra candidatas mulheres nas eleições de 2026", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/02/ia-ataques-contra-candidatas-nas-eleicoes-de-2026.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-02T11:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento do projeto MonitorA revelou que a inteligência artificial está sendo usada para produzir imagens ofensivas contra candidatas mulheres na política em 25% dos casos analisados. Outros 9% dos ataques visando candidatas não puderam ser confirmados como manipulação de IA.", "titulo_pt": "IA impulsiona produção de ataques contra candidatas mulheres nas eleições de 2026", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 190730, "titulo": "Vigência da reforma tributária desafia consumidores e governos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/vigencia-da-reforma-tributaria-desafia-consumidores-e-governos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-02T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reforma tributária entrará em vigor no próximo ano, afetando significativamente os consumidores. O impacto será comparado à influência dos vencedores das eleições de 2026.", "titulo_pt": "Vigência da reforma tributária desafia consumidores e governos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 190748, "titulo": "Origem das bets passa por lobby estrangeiro e “jabutis” no Congresso", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/origem-das-bets-passa-por-lobby-estrangeiro-e-jabutis-no-congresso", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-02T10:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A legalização das apostas esportivas online no Brasil em dezembro de 2018 teve como principal fator o lobby de empresas estrangeiras em conjunto com legisladores e agentes do Estado brasileiro. Este processo foi investigado por Francisco Cláudio Freitas Silva, pesquisador da PUC Minas.", "titulo_pt": "Origem das bets envolve lobby estrangeiro e 'jabutis' no Congresso", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 190675, "titulo": "Debate cancelado é desfecho perfeito para campanha dominada pelo Judiciário; veja vídeo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/debate-cancelado-e-desfecho-perfeito-para-campanha-dominada-pelo-judiciario-veja-video.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-02T10:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cancelamento do debate presidencial da Globo encerrou uma campanha onde a política seguiu as decisões do Judiciário.", "titulo_pt": "Debate cancelado é desfecho perfeito para campanha dominada pelo Judiciário", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 190676, "titulo": "Pesquisa mostra que 82,7% dos brasileiros se dizem muito preocupados com a corrupção", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/pesquisa-mostra-que-827-dos-brasileiros-se-dizem-muito-preocupados-com-a-corrupcao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-02T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa realizada pelo Instituto Não Aceito Corrupção e pelo Datafolha revelou que 82,7% dos brasileiros se declararam muito ou extremamente preocupados com a corrupção no país em 2026.", "titulo_pt": "82,7% Dos brasileiros se dizem muito preocupados com a corrupção", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 190700, "titulo": "Rússia aumenta pressão sobre Kiev com ataque a pontes", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/10/russia-aumenta-pressao-sobre-kiev-com-ataque-a-pontes.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-10-02T12:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Rússia atacou pela primeira vez pontes vitais de Kiev, capital ucraniana, em sua guerra contra o país. O ataque resultou em pelo menos uma morte.", "titulo_pt": "Rússia aumenta pressão sobre Kiev com ataque a pontes", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 191463, "titulo": "Ukraine war: Japan’s new sanctions on Russia target oil exports", "url": "https://www.scmp.com/news/asia/east-asia/article/3369616/ukraine-war-japans-new-sanctions-russia-target-oil-exports?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-02T12:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo japonês anunciou sanções adicionais contra a Rússia durant }, {"id": 191421, "titulo": "Sindacato medici, nel 2025 + 150% dimissioni, superati i pensionamenti", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/02/sindacato-medici-nel-2025-150-dimissioni-superati-i-pensionamenti_8f4ff2c9-588a-49e8-8046-d338bc8f8876.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-02T12:17:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Em 2025, o sindicato medici registrou uma taxa de demissões de 150% em relação aos contratos assumidos. Além disso, um estudo da Anaao indicou que, por cada 100 profissionais admitidos, 43 optaram por sair voluntariamente dos hospitais.", "titulo_pt": "Sindicato medici, em 2025 +150% em demissões, supera os pensionamentos", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 191104, "titulo": "Indian Pilot Stabbed on FlyDubai Flight Recalls Sudden Attack", "url": "https://www.nytimes.com/2026/10/02/world/asia/flydubai-attack-pilot-israel-india-smit-machchhar.html", "fonte_id": "nyt_world", "data_pub": "2026-10-02T12:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O capitão Smit Machchhar, que foi esfaqueado pelo seu copiloto durante um voo FlyDubai entre Dubai e Tel Aviv, afirmou que teve que agir para evitar um acidente apesar de estar ferido gravemente.", "titulo_pt": "Piloto indiano esfaqueado em voo FlyDubai entre dubai e tel aviv relata ataque súbito", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 191110, "titulo": "U.S. Suspends Consular Services in Brazil on Eve of Elections", "url": "https://www.nytimes.com/2026/10/02/world/americas/brazil-us-consulate-elections.html", "fonte_id": "nyt_world", "data_pub": "2026-10-02T12:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Estado dos Estados Unidos suspendeu os serviços consulares no Brasil véspera das eleições presidenciais. A decisão foi justificada por razões de segurança não especificadas.", "titulo_pt": "EUA suspenrem serviços consulares no Brasil véspera das eleições", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 191415, "titulo": "After Bosnia’s ‘Anaemic’ Election Campaign, Polling Day Sees New Challenge", "url": "https://balkaninsight.com/2026/10/02/after-bosnias-anaemic-election-campaign-polling-day-sees-new-challenge/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-10-02T12:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A introdução de escaneadores de votos e verificação de impressões digitais para combater a fraude eleitoral é uma inovação rara em um processo eleitoral dominado por políticos e promessas repetitivas.", "titulo_pt": "Depois de campanha eleitoral 'anêmica' na bósnia, dia de votação traz novo desafio", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 191422, "titulo": "In 3 regioni del sud oltre l'80% dei Comuni in dissesto finanziario", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/02/in-3-regioni-del-sud-oltre-l80-dei-comuni-in-dissesto-finanziario_2bd0f1b3-14cd-4672-931a-d6405e10ee96.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-02T12:12:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Na Calábria, Campania e Sicília, mais de 80% dos municípios estão em estado de crise financeira. 63,6% dessas regiões têm procedimentos de crise em andamento.", "titulo_pt": "Em 3 regiões do sul, mais de 80% dos municípios estão em estado de crise financeira", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 191423, "titulo": "Lo spread tra Btp e Bund decolla a 131 punti base", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/02/lo-spread-tra-btp-e-bund-decolla-a-131-punti-base_cba27dc0-0548-400c-8b39-7748db9cc8cb.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-02T12:11:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos estão subindo, com o título decênio italiano rendendo 4,7%. O spread entre os títulos de dívida da Itália (BTP) e da Alemanha (Bund) aumentou para 131 pontos base.", "titulo_pt": "O spread entre Btp e Bund sobe para 131 pontos base", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 191424, "titulo": "Macron presiede videoconferenza leader G7 sulla situazione energetica mondiale", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/02/macron-presiede-videoconferenza-leader-g7-sulla-situazione-energetica-mondiale_b38593ea-fc12-4ad9-ac51-48a485164edc.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-02T12:11:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Às 14:30, o Eliseu anuncia uma videoconferência presidida por Macron com os líderes do G7 para discutir a situação energética mundial.", "titulo_pt": "Macron preside videoconferência com líderes do G7 sobre situação energética mundial", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 191295, "titulo": "A violent classroom revolt is becoming France's next big crisis", "url": "https://www.cnbc.com/2026/10/02/france-student-protests-budget-debt.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-02T12:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Centenas de escolas de ensino médio em França foram fechadas na sexta-feira após protestos nacionais de estudantes sobre as condições escolares se intensificarem e se tornarem violentos.", "titulo_pt": "Uma revolta violenta na sala de aula está se tornando a próxima grande crise da França", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 191438, "titulo": "U.S. to put missile system on island near Taiwan for drills", "url": "https://www.japantimes.co.jp/news/2026/10/02/japan/politics/us-missile-yonaguni-drills/", "fonte_id": "japan_times", "data_pub": "2026-10-02T12:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Exército dos Estados Unidos está programado para deslocar um sistema antimísseis avançado contra navios para a ilha de Yonaguni pela primeira vez, para exercícios no mês seguinte.", "titulo_pt": "EUA vão deslocar sistema antimísseis para ilha próxima a Taiwan para exercícios", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 190779, "titulo": "EUA suspendem serviços consulares no Brasil por ‘questões de segurança’", "url": "https://www.cartacapital.com.br/politica/eua-suspendem-servicos-consulares-no-brasil-por-questoes-de-seguranca/", "fonte_id": "cartacapital", "data_pub": "2026-10-02T12:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os serviços consulares dos Estados Unidos foram suspensos no Brasil dois dias antes das eleições brasileiras. A missão americana não detalhou as razões da medida e instruiu os funcionários da embaixada em Brasília a trabalharem de casa.", "titulo_pt": "EUA suspendem serviços consulares no Brasil dois dias antes das eleições por ‘questões de segurança’", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 191335, "titulo": "Sánchez se toma un tiempo para decidir si convoca elecciones si caen los decretos de vivienda", "url": "https://elpais.com/espana/2026-10-02/dirigentes-del-psoe-y-ministros-del-gobierno-creen-que-sanchez-debe-convocar-elecciones-si-se-tumban-los-decretos.html", "fonte_id": "elpais_america", "data_pub": "2026-10-02T12:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente Sánchez está considerando se convoca eleições antecipadas se os decretos de habitação forem revogados. Se optar por dissolver o Congresso, a primeira data disponível seria o domingo, 29 de novembro.", "titulo_pt": "Sánchez pondera sobre convocação de eleições se caírem os decretos de habitação", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 191146, "titulo": "The Forces Shaping Brazil’s Election", "url": "https://foreignpolicy.com/2026/10/02/brazil-election-president-lula-bolsonaro-military-women-economy/", "fonte_id": "foreign_policy", "data_pub": "2026-10-02T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os fatores que moldam a eleição no Brasil incluem questões de gênero, relações civis-militares e a situação econômica.", "titulo_pt": "Forças que moldam a eleição no Brasil", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 190723, "titulo": "Airbus diminuiu vendas em setembro para 72 aviões, diz agência", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/10/01/6562-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post467077", "fonte_id": "folha_mercado", "data_pub": "2026-10-02T12:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Airbus entregou aproximadamente 72 aviões em setembro, um número semelhante às 73 entregues no mesmo mês do ano anterior. A empresa não comentou sobre o total de entregas antes da divulgação do boletim industrial mensal, marcada para 8 de outubro.", "titulo_pt": "Airbus reduziu vendas em setembro para 72 aviões, segundo setor", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 190901, "titulo": "Dólar hoje sobe à espera do relatório de emprego nos Estados Unidos", "url": "https://www.infomoney.com.br/mercados/dolar-hoje-abertura-fechamento-comercial-turismo-02102026/", "fonte_id": "infomoney", "data_pub": "2026-10-02T12:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar subiu nesta sessão em vista do relatório de emprego dos Estados Unidos, que provavelmente indicará uma desaceleração no crescimento do emprego em setembro e manutenção da taxa de desemprego em 4,1% pelo terceiro mês consecutivo.", "titulo_pt": "Dólar hoje sobe à espera do relatório de emprego nos Estados Unidos", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 191033, "titulo": "Dólar hoy y dólar blue, EN VIVO: a cuánto cotiza el oficial y cuál es el precio del paralelo este viernes 2 de octubre, minuto a minuto", "url": "https://www.lanacion.com.ar/economia/dolar/dolar-hoy-y-dolar-blue-en-vivo-a-cuanto-cotiza-el-oficial-y-cual-es-el-precio-del-paralelo-este-nid02102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-02T12:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O dólar oficial estava cotado a R$1545 na venda pelo Banco Nación; o dólar blue estava valendo R$1555 na mesma operação; as informações sobre o MEP e o CCL não foram detalhadas no texto fornecido.", "titulo_pt": "Dólar hoje e dólar paralelo, em VIVO: a quais valores estão cotados o oficial e o blue neste viés de outubro, minuto a minuto", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 190724, "titulo": "Volvo tem queda de 11% nas vendas no terceiro trimestre e evita fazer novas projeções", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/volvo-tem-queda-de-11-nas-vendas-no-terceiro-trimestre-e-evita-fazer-novas-projecoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-02T12:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Volvo informou que não atingirá suas projeções anteriores de volume de vendas e fluxo de caixa para o ano, devido a um mercado desafiador e a deterioração das perspectivas de curto prazo. A empresa evitou fazer novas projeções.", "titulo_pt": "Volvo não alcançará projeções de vendas e fluxo de caixa e evita fazer novas previsões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 190725, "titulo": "Embraer renova recorde de entregas no 3º tri, com retomada de aeronaves militares", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/embraer-renova-recorde-de-entregas-no-3o-tri-com-retomada-de-aeronaves-militares.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-02T12:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Embraer entregou 66 aeronaves no terceiro trimestre de 2026, renovando o recorde anterior de 65 aeronaves no mesmo período do ano anterior.", "titulo_pt": "Embraer mantém recorde de entregas no 3º tri, com 66 aeronaves", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 191272, "titulo": "Eurozone inflation jumps to 3.8%, three-year high", "url": "https://www.lemonde.fr/en/economy/article/2026/10/02/eurozone-inflation-jumps-to-3-8-three-year-high_6758175_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-02T11:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inflação na zona do euro atingiu 3,8%, seu nível mais alto em três anos. Os aumentos nos preços da energia aumentaram para 18,8% em setembro, de 14,3% em agosto, devido a interrupções nas importações de petróleo do Oriente Médio devido ao conflito entre Estados Unidos e Irã.", "titulo_pt": "Inflação na zona do euro atinge 3,8%, nível mais alto em três anos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 190923, "titulo": "‘Índice do medo’ da Bolsa atinge recorde às vésperas das eleições", "url": "https://veja.abril.com.br/economia/indice-do-medo-da-bolsa-atinge-recorde-as-vesperas-das-eleicoes/", "fonte_id": "veja", "data_pub": "2026-10-02T11:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O índice de medo da Bolsa atingiu um recorde de 32,39 pontos, indicando expectativas de oscilações mais intensas nas ações brasileiras nos próximos 30 dias. Este indicador mede a volatilidade esperada nos mercados de ações.", "titulo_pt": "Índice do medo da Bolsa atinge recorde às vésperas das eleições", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 190907, "titulo": "O “capital paciente” da Ultrapar: os planos da dona da Ipiranga mirando 2031", "url": "https://braziljournal.com/o-capital-paciente-da-ultrapar-os-planos-da-dona-da-ipiranga-mirando-2031/", "fonte_id": "brazil_journal", "data_pub": "2026-10-02T11:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nos últimos cinco anos, a Ultrapar analisou mais de 100 transações e concluiu 14. O CEO Rodrigo Pizzinatto destaca a abordagem do 'capital paciente', focada na criação de valor a longo prazo, não em crescimento imediato.", "titulo_pt": "O ‘capital paciente’ da Ultrapar: os planos da dona da Ipiranga mirando 2031", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 191408, "titulo": "My mortgage is a problem for the Fed, and for America", "url": "https://www.ft.com/content/9f960533-9cd7-4475-aed0-17f09fdc28fd?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-02T11:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mercado imobiliário está congelado e a situação de viabilidade financeira é ruim, comparável à bolha imobiliária. Os proprietários de imóveis continuam a manter seus imóveis, mas a situação econômica é desafiadora.", "titulo_pt": "Minha hipoteca é um problema para o Fed e para os estados unidos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 190728, "titulo": "Preços dos alimentos no mundo atingem maior patamar em quatro anos, diz órgão da ONU", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/precos-dos-alimentos-no-mundo-atingem-maior-patamar-em-quatro-anos-diz-orgao-da-onu.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-02T11:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os preços dos alimentos no mundo atingiram o nível mais alto em quase quatro anos em setembro, devido a interrupções logísticas e preocupações climáticas. A FAO informou sobre esse aumento nos mercados agrícolas.", "titulo_pt": "Preços dos alimentos no mundo atingem maior patamar em quatro anos, diz fao", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 190729, "titulo": "Adiamento da MP do Imposto Seletivo tira R$ 3,82 bi de arrecadação do governo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/10/adiamento-da-mp-do-imposto-seletivo-tira-r-382-bi-de-arrecadacao-do-governo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-02T11:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O adiamento da edição da medida provisória que trata das alíquotas do Imposto Seletivo e da reforma tributária resultará em uma perda de arrecadação de R$ 3,82 bilhões para o governo federal em 2027. Isso equivale a 9% da receita prevista para o ano com esse tributo.", "titulo_pt": "Atraso na MP do Imposto Seletivo e reforma tributária custará R$ 3,82 bi ao governo em 2027", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 191410, "titulo": "Diesel falls sharply as EU considers releasing 50mn barrels under pressure from Trump", "url": "https://www.ft.com/content/97200b07-755c-40ce-a50b-b51666bd4b7e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-02T10:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A preços do diesel caíram drasticamente devido à consideração da União Europeia de liberar 50 milhões de barris de petróleo sob pressão dos Estados Unidos. O presidente dos EUA ameaçou banir as exportações de diesel se a Europa não liberar suas reservas.", "titulo_pt": "Diesel cai drasticamente enquanto EU considera liberar 50 milhões de barris sob pressão dos EUA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 190731, "titulo": "Inflação na zona do euro acelera a 3,8%, maior nível em três anos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/inflacao-na-zona-do-euro-acelera-a-38-maior-nivel-em-tres-anos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-02T10:47:00Z", "idioma": "pt", "pr milhões com Ministério das Comunicações e BNDES para expansão móvel", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/highline-capta-r-729-milhoes-com-ministerio-das-comunicacoes-e-bndes-para-expansao-movel.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-02T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Highline recebeu R$ 72,9 milhões para expandir a cobertura móvel de alta capacidade em 131 localidades, incluindo 13 favelas, em sete estados brasileiros. O financiamento é proveniente do FUST, gerido pelo Ministério das Comunicações, com o BNDES como agente financeiro.", "titulo_pt": "Highline capta R$ 72,9 milhões para expansão móvel em 131 localidades", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 191300, "titulo": "How AI is redefining Wall Street jobs — and boosting demand for this new 'hottest skill' by 1,721%", "url": "https://www.cnbc.com/2026/10/02/ai-redefining-wall-street-jobs.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-02T12:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bancos estão promovendo uma onda de contratações de engenheiros de IA especializados em 'agent orchestration', a capacidade de coordenar equipes de agentes especializados. A demanda por essa nova 'habilidade mais procurada' aumentou em 1.721%.", "titulo_pt": "Como a IA está redefine jobs na Wall Street — e aumentando a demanda por esta nova 'habilidade mais procurada' em 1.721%", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 191050, "titulo": "Google presenta Gemini 4 Argón: una IA que corrige fallas de seguridad y aborda tareas complejas", "url": "https://www.latercera.com/tecnologia/noticia/google-gemini-4-argon-ia/", "fonte_id": "la_tercera", "data_pub": "2026-10-02T12:18:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O "Hong Kong", "classe": "B"}, {"id": 191468, "titulo": "China stockpiles ASML lithography tools, spurring US calls for complete export ban", "url": "https://www.scmp.com/tech/tech-war/article/3369557/china-stockpiles-asml-lithography-tools-spurring-us-calls-complete-export-ban?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-02T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Segundo relatório do Centro para Tecnologia e Estado de Armas (CTS), empresas chinesas adquiriram cerca de 343 sistemas de lithografia DUV immersion até 2026. Ex-funcionários dos EUA estão pedindo uma proibição total de exportações para impedir que a China continue acumulando equipamentos.", "titulo_pt": "China acumula máquinas de lithografia, levando EUA a pedir proibição total de exportações", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 191522, "titulo": "Amazon writes scary blog warning communities not to block data centers", "url": "https://www.theverge.com/tech/1003929/amazon-ai-data-center-blog-warning", "fonte_id": "the_verge", "data_pub": "2026-10-02T11:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amazon está pedindo apoio a projetos de centrais de dados de IA, alegando que o bloqueio desses projetos pode causar danos irreparáveis à economia e à segurança nacional dos EUA. O CEO da AWS, Matt Garman, escreveu um blog de mais de 3.000 palavras abordando preocupações públicas sobre os impactos das centrais de dados em empregos, demanda por energia e outros aspectos.", "titulo_pt": "Amazon escreve blog assustador pedindo apoio a projetos de centrais de dados de IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 191563, "titulo": "(2nd LD) Regulator instructs financial firms to check security systems over series of cyberattacks on banks", "url": "https://en.yna.co.kr/view/AEN20261002009152320", "fonte_id": "yonhap_news", "data_pub": "2026-10-02T11:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A reguladora financeira instruiu as empresas financeiras a verificar seus sistemas de segurança devido a uma série de ataques cibernéticos em bancos. O anúncio foi feito em Seul no dia 2 de outubro.", "titulo_pt": "Reguladora instrui empresas financeiras a verificar sistemas de segurança após série de ataques cibernéticos em bancos", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 191526, "titulo": "Amazon Says It's No Longer Using NDAs for Data Centers", "url": "https://www.wired.com/story/amazon-says-it-is-going-to-stop-using-ndas-for-data-centers/", "fonte_id": "wired", "data_pub": "2026-10-02T11:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Amazon informou que parou de usar acordos secretos com autoridades locais para seus centros de dados. A empresa reconhece que a rejeição da comunidade está levando a moratórias nos projetos de centros de dados em todo o país.", "titulo_pt": "Amazon diz não usar mais acordos secretos para centros de dados", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 190726, "titulo": "OpenAI demite três funcionários por manuseio incorreto de informações sensíveis", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/openai-demite-tres-funcionarios-por-manuseio-incorreto-de-informacoes-sensiveis.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-02T11:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OpenAI demitiu três funcionários por suposto manuseio incorreto de informações sensíveis e por violar as políticas da empresa.", "titulo_pt": "Openai demite três funcionários por manuseio incorreto de informações sensíveis", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 191538, "titulo": "FSC orders banks, card firms to conduct security checks", "url": "https://www.koreaherald.com/article/10892315", "fonte_id": "korea_herald", "data_pub": "2026-10-02T11:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão de Serviços Financeiros da Coreia do Sul ordenou que bancos e empresas de cartões de crédito realizem verificações de segurança após uma série de ataques cibernéticos envolvendo o Banco Shinhan e o Banco KB Kookmin. A entidade planeja coletar rapidamente os resultados para desenvolver medidas para fortalecer a segurança cibernética no setor financeiro.", "titulo_pt": "FSC ordena que bancos e empresas de cartões realizem verificações de segurança", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 191299, "titulo": "Google has been playing catch up with OpenAI and Anthropic. Does its new flagship model really compete at the frontier?", "url": "https://www.cnbc.com/2026/10/02/tech-download-google-argon-frontier-openai-anthropic.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-02T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google tem estado atrás de OpenAI e Anthropic desde grande parte de 2026, de acordo com analistas. O modelo Gemini 4 coloca a empresa de volta na conversa sobre IA avançada.", "titulo_pt": "Google está tentando se recuperar na corrida de IA com gemini 4", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 191528, "titulo": "Your Driverless Cab Is Spying on You", "url": "https://www.wired.com/story/when-the-robotaxis-are-watching-you/", "fonte_id": "wired", "data_pub": "2026-10-02T10:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Veículos autônomos de empresas como Waymo, Zoox e Tesla estão equipados com câmeras e sensores, alguns dos quais estão direcionados para os passageiros.", "titulo_pt": "Seu carro autônomo está vigiando você", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 191566, "titulo": "(LEAD) 89 customers' personal information leaked from Hana Bank", "url": "https://en.yna.co.kr/view/AEN20261002009151320", "fonte_id": "yonhap_news", "data_pub": "2026-10-02T10:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O banco Hana revelou que os dados pessoais de 89 clientes foram vazados. O incidente ocorreu em Seul no dia 2 de outubro.", "titulo_pt": "89 Clientes do Hana Bank tiveram informações pessoais expostas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 191489, "titulo": "Anthropic aims for mid-November IPO as it juggles relationship with Trump administration", "url": "https://www.digitimes.com/news/a20261002VL214/anthropic-ipo-ai-regulation-usa-government.html", "fonte_id": "digitimes", "data_pub": "2026-10-02T10:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup de IA Anthropic estaria planejando uma oferta inicial de ações (IPO) para meados de novembro, que poderia se tornar a maior IPO até agora. O processo de listagem coincide com uma relação instável com o governo dos EUA, chamados do CEO Dario Amodei por mais regulamentações do setor e preocupações nacionais sobre a segurança da IA.", "titulo_pt": "Anthropic planeja IPO em meados de novembro em meio a relações instáveis com o governo dos EUA", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 191236, "titulo": "Who gets to decide if AI is safe? Africa wants a say", "url": "https://restofworld.org/2026/african-leaders-un-security-council-ai-safety/?utm_source=rss&utm_medium=rss&utm_campaign=feeds", "fonte_id": "rest_of_world", "data_pub": "2026-10-02T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas africanas estão correndo para adotar tecnologias de inteligência artificial americanas e chinesas, com pouca preocupação com a segurança dessas tecnologias.", "titulo_pt": "Quem decide se a IA é segura? África quer ter voz no assunto", "veiculo": "Rest of World", "pais": "EUA", "classe": "A"}, {"id": 191529, "titulo": "Election Deniers Think the GOP’s Terrible Midterm Polling Is a ‘Psyop’", "url": "https://www.wired.com/story/election-deniers-think-the-gops-terrible-midterm-polling-is-a-psyop/", "fonte_id": "wired", "data_pub": "2026-10-02T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitos influenciadores e comentaristas do movimento MAGA expressaram sua opinião sobre as pesquisas de opinião eleitoral, considerando-as falsas. Catturd postou em X que as supostas pesquisas são ridículas e falsas.", "titulo_pt": "Denegidores das eleições atribuem resultados ruins do GOP a uma ‘operação psicológica’", "veiculo": "Wired", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 191592, "titulo": "Astronomers discover the lowest-mass double neutron star system to date", "url": "https://phys.org/news/2026-09-astronomers-lowest-mass-neutron-star.html", "fonte_id": "phys_org", "data_pub": "2026-10-02T12:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos descobriram o sistema de duas estrelas de neutrons de menor massa até o momento. Esses remanescentes extremamente densos de estrelas massivas que explodiram no fim de suas vidas são objetos astrológicos amplamente estudados.", "titulo_pt": "Astrônomos descobrem o sistema de duas estrelas de neutrons de menor massa até o momento", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 191593, "titulo": "How deep do AI relationships really go? Attachment theory expert explains", "url": "https://phys.org/news/2026-10-deep-ai-relationships-theory-expert.html", "fonte_id": "phys_org", "data_pub": "2026-10-02T12:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A psicologia usa o termo 'anexo' para descrever as relações mais significativas que mantêm as vidas das pessoas unidas. De acordo com a psicóloga desenvolvimental americana-canadense Mary Ainsworth, uma relação de anexo deve atender a seis condições.", "titulo_pt": "Quão profundas são as relações de IA realmente?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 191594, "titulo": "An Ebola treatment center was burned down as the death toll in Congo passes 4,000", "url": "https://phys.org/news/2026-10-ebola-treatment-center-death-toll.html", "fonte_id": "phys_org", "data_pub": "2026-10-02T12:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A epidemia de Ebola na República Democrática do Congo registrou mais de 4.000 mortes, de acordo com autoridades, que lutam para conter a propagação do vírus. Um centro de tratamento para Ebola foi queimado.", "titulo_pt": "Centro de tratamento para Ebola é incendiado enquanto mortes na república democrática do Congo superam 4.000", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 191595, "titulo": "Bushfire simulation reveals green strategy that could cut Australia's fire threat", "url": "https://phys.org/news/2026-10-bushfire-simulation-reveals-green-strategy.html", "fonte_id": "phys_org", "data_pub": "2026-10-02T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Modelos de simulação mostram que irrigar vegetação com baixa flammabilidade pode significativamente reduzir a propagação e a intensidade dos incêndios florestais, fornecendo comunidades com mais tempo para se prepararem.", "titulo_pt": "Simulação de incêndio revela estratégia verde que pode reduzir ameaça de incêndios na austrália", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 191649, "titulo": "First week of life seems crucial for future allergy and eczema risk", "url": "https://www.newscientist.com/article/2591816-first-week-of-life-seems-critical-for-future-allergy-and-eczema-risk/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-10-02T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo de centenas de bebês sugere que a primeira semana de vida pode ser crucial para o risco futuro de alergias e eczema. A visão geral predominante é que não há fases particularmente críticas no desenvolvimento do sistema imunológico.", "titulo_pt": "Primeira semana de vida pode ser crucial para o risco futuro de alergias e eczema", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 191583, "titulo": "How big is Pennsylvania’s measles outbreak?", "url": "https://www.statnews.com/2026/10/02/health-news-how-big-is-pennsylvania-measles-outbreak/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-02T11:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A notícia de um quinto óbito por sarampo em Pensilvânia destaca um problema persistente com a doença. O tamanho da epidemia no estado e no país ainda não foi totalmente determinado.", "titulo_pt": "Quanto é o tamanho da epidemia de sarampo em pensilvânia?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 191596, "titulo": "Study links hurricane exposure to higher eviction risk for renters", "url": "https://phys.org/news/2026-10-links-hurricane-exposure-higher-eviction.html", "fonte_id": "phys_org", "data_pub": "2026-10-02T11:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisas conduzidas por Qian He, urbanista da Rowan University, indicam que furacões podem levar a desalojamentos de inquilinos mesmo quando suas casas não sofrem danos.", "titulo_pt": "Estudo relaciona exposição a furacões ao risco de despejo maior para inquilinos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 191597, "titulo": "The economy is resilient: Why do many Americans feel differently? An expert explains", "url": "https://phys.org/news/2026-10-economy-resilient-americans-differently-expert.html", "fonte_id": "phys_org", "data_pub": "2026-10-02T11:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mesmo com a economia apresentando indicadores fortes, como relatórios de empregos e desempenho do mercado de ações, apenas 24% dos americanos avaliaram a economia como 'boa' o tratamento contra esquistossomose aprovado para crianças a partir de 3 meses", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 190876, "titulo": "Anvisa proíbe lote falsificado de gel íntimo e apreende antitranspirante; veja quais", "url": "https://exame.com/brasil/anvisa-proibe-lote-falsificado-de-gel-intimo-e-apreende-antitranspirante-veja-quais/", "fonte_id": "exame", "data_pub": "2026-10-02T09:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anvisa proibiu o lote falsificado de um gel íntimo e apreendeu um antitranspirante com irregularidades nas embalagens e origem desconhecida. As medidas foram publicadas no Diário Oficial da União nesta sexta-feira, 2.", "titulo_pt": "Anvisa proíbe lote falso de gel íntimo e apreende antitranspirante; veja quais", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 191479, "titulo": "Crop outputs grew up to 100% in China’s big agricultural experiment: scientists", "url": "https://www.scmp.com/news/china/science/article/3369564/crop-outputs-grew-100-chinas-big-agricultural-experiment-scientists?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-02T09:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos em campos ao longo da China mostraram que água de irrigação tratada com minerais naturais radiados pela luz solar pode aumentar drasticamente a produção de vários cultivos, de acordo com cientistas chineses. As experiências incluíram culturas como arroz, trigo, soja, amendoim, mandioca, cana-de-açúcar e vegetais.", "titulo_pt": "Saídas agrícolas cresceram até 100% em grande experimento agrícola da China: cientistas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 191631, "titulo": "Fangs a million: Lenny Rush on turning an Eric Morecambe classic into a hilarious vampire comedy", "url": "https://www.theguardian.com/tv-and-radio/2026/oct/02/the-reluctant-vampire-bbc-lenny-rush-eric-morecambe-vampire-comedy", "fonte_id": "guardian_culture", "data_pub": "2026-10-02T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lenny Rush, vencedor de um Bafta na juventude, interpreta o protagonista Val em uma comédia vampiresca. O roteiro foi escrito especificamente para ele, segundo confessa, por Shane Allen, o produtor executivo, que era fã das obras originais quando jovem.", "titulo_pt": "Dentes a milhares: lenny Rush sobre transformar um clássico de Eric Morecambe em uma hilária comédia vampiresca", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 191633, "titulo": "‘It’s radical to release a film called Girls Like Girls in this climate’: hitmaker turned director Hayley Kiyoko on sexuality, safety and becoming ‘Lesbian Jesus’", "url": "https://www.theguardian.com/film/2026/oct/02/hayley-kiyoko-interview-girls-like-girls-music-film-books", "fonte_id": "guardian_culture", "data_pub": "2026-10-02T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hayley Kiyoko, cantora e diretora, lançou um filme chamado 'Girls Like Girls', que é uma homenagem à sua versão de 17 anos e à sua primeira experiência confiante com a sexualidade. O filme retrata a história de uma garota que se apaixona por outra, refletindo Kiyoko's própria experiência de amor juvenil.", "titulo_pt": "É radical lançar um filme chamado 'Girls Like Girls' nesse clima: Hayley Kiyoko fala sobre sexualidade, segurança e se tornar 'Jesus gay'", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 191637, "titulo": "Parsifal review – bunkers, CCTV and fembots in elusive vision of Wagner’s mystical masterpiece", "url": "https://www.theguardian.com/music/2026/oct/02/wagner-parsifal-review-royal-opera-house-london-titov-hrusa-gerhaher", "fonte_id": "guardian_culture", "data_pub": "2026-10-02T11:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A produção de Evgeny Titov para a Ópera sse": "B"}, {"id": 191682, "titulo": "Lit Hub Daily: October 2, 2026", "url": "https://lithub.com/lit-hub-daily-october-2-2026/", "fonte_id": "lithub", "data_pub": "2026-10-02T10:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Assal Rad analisa as semelhanças entre a cobertura da mídia americana da invasão do Iraque e o genocídio em Gaza. Cinco livros essenciais sobre mulheres no início do movimento dos direitos civis são recomendados.", "titulo_pt": "Lit Hub Daily: 2 de outubro de 2026", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 191632, "titulo": "‘Starchitects go home’: what’s the truth behind Albania’s astonishing building boom?", "url": "https://www.theguardian.com/artanddesign/2026/oct/02/starchitects-go-home-albania-building-boom-edi-rama", "fonte_id": "guardian_culture", "data_pub": "2026-10-02T10:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Albania viu mais de 500 projetos arquitetônicos propostos por 60 das principais empresas de arquitetura do mundo, levantando protestos. Um livro de 800 páginas sobre o assunto está sendo chamado de 'a peça do crime' por alguns.", "titulo_pt": "Arquitetos, vá embora: a verdade por trás da onda de construção em Albania", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 191626, "titulo": "Vollebak creates Rock Jacket from 54,000 slate tiles", "url": "https://www.dezeen.com/2026/10/02/vollebak-rock-jacket-slate-tiles/", "fonte_id": "dezeen", "data_pub": "2026-10-02T10:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A marca experimental de roupas Vollebak criou uma jaqueta única coberta por mais de 50.000 pedaços de argila slate de 0,5 centímetro quadrado. A jaqueta, chamada Rock Jacket, é o último projeto da Vollebak que visa desafiar as escolhas tradicionais de materiais para roupas.", "titulo_pt": "Vollebak cria jaqueta rochosa com mais de 54.000 pedaços de argila slate", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 191473, "titulo": "Chinese woman, 60, becomes gaming streamer after playing to understand son’s addiction", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3369504/chinese-woman-60-becomes-gaming-streamer-after-playing-understand-sons-addiction?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-02T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher chinesa de 60 anos se tornou uma streamer de jogos eletrônicos populares, desafiando estereótipos sobre idosos. Zhong Juanjuan, conhecida como Tia Juan pelos usuários da internet, acumulou 527.000 seguidores em plataformas sociais e realiza duas sessões de streaming diariamente, cada uma com cerca de 10.000 espectadores.", "titulo_pt": "Mulher chinesa de 60 anos se torna streamer de jogos para entender filho", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 191627, "titulo": "We're scared of Meta's adorable AI device", "url": "https://www.dezeen.com/2026/10/02/muse-ai-charm-new-york-jails-dezeen-weekly-podcast/", "fonte_id": "dezeen", "data_pub": "2026-10-02T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Dezeen discute a escolha de designs adoráveis por empresas de IA e também aborda o projeto de prédios ilegais em Nova York chamados 'jailscrapers'. O foco principal é a nova AI do Meta chamada Muse Charm.", "titulo_pt": "Nós temos medo do adorável dispositivo de IA do Meta", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 191634, "titulo": "‘It’s rational to fear the music industry’: Grouper’s Liz Harris on virality, streaming scammers and her ‘restorative’ dream-pop trio", "url": "https://www.theguardian.com/music/2026/oct/02/grouper-liz-harris-tour-helen-band-lindas-head-interview", "fonte_id": "guardian_culture", "data_pub": "2026-10-02T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null,
