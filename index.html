    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "01/11/2026 07:20", "stats": {"noticias_novas": 555, "resumos_gerados": 214}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A vitória de Luiz Inácio Lula da Silva nas eleições presidenciais é um dos principais temas desta edição. O senador Flávio Bolsonaro reagiu escrevendo uma carta considerada golpista, afirmando-se o verdadeiro presidente eleito. O ex-chanceler equatoriano Guillaume Long avaliou que a vitória de Lula é um obstáculo contra a extrema-direita global. O governo Lula (PT) tenta derrubar uma decisão judicial que obriga a Polícia Rodoviária Federal a incluir o tema de direitos humanos nos cursos de formação dos policiais. Além disso, o Congresso analisa a possibilidade de tornar a inelegibilidade por violência contra a mulher mais rigorosa, com pelo menos 13 propostas apresentadas desde 2015. O projeto de lei que visa criar reservas de vagas para autistas em escolas também está em análise, após ser proposto pelo deputado Marcos Pereira. Outros assuntos abordados incluem a exposição online que alerta para o impacto da crise climática nos recursos hídricos, o projeto que muda as regras para incorporação de novas tecnologias no SUS, e a proposta da BYD de nacionalizar 50% da produção em 2027.", "mundo": "As Jornadas Olímpicas Juvenis de 2026 abriram oficialmente em Dakar, Senegal, com uma cerimônia que celebrou a cultura africana. O evento segue o lema 'África acolhe, Dakar comemora'. Na Europa, o custo de vida é um tema central na corrida eleitoral nos Estados Unidos, com 40% da população de Michigan enfrentando dificuldades financeiras. Em Paris, milhares protestaram contra aumentos de custos de vida e condições deterioradas nas escolas, com confrontos e uso de gás lacrimogênico. O presidente do Brasil, Luiz Inácio Lula da Silva, afirmou que não tem planos de encontrar o senador Flávio Bolsonaro nos Estados Unidos, mas que ele pode permanecer lá o tempo que desejar. No entanto, a maior parte dos artigos se concentra nas eleições intercalares nos Estados Unidos, com pesquisas indicando que os democratas continuam na frente, e com especialistas como Matt Barreto prevendo uma vitória democrata na Câmara dos Representantes, apesar da falta de alinhamento partidário sólido entre os hispanos. Além disso, a Coreia do Sul divulgou dados mostrando que 38,9% das pessoas na faixa de renda média experimentaram uma diminuição na renda em 2024, o maior percentual desde o início da pandemia de COVID-19 em 2020.\n\nA Coreia do Norte realizou testes com munições de bomba de cluster, afirmando que pode destruir uma área de 12 a 13 hectares. Diante da tensão geopolítica, o FBI acusa o país de ser responsável por roubos de criptomoedas no valor de 6,3 bilhões de dólares no maior mercado de ativos digitais do mundo. O presidente dos Estados Unidos, Donald Trump, declarou que o país ainda precisa 'cuidar' de uma ou duas questões no Irã, sugerindo a possibilidade de novos ataques. Na fronteira com a China, a Guarda Costeira da China estaria desafiando a jurisdição internacional na área da costa leste de Taiwan, considerada crucial para o fornecimento de suprimentos em caso de bloqueio ou conflito. Além disso, a Coreia do Norte testou uma bomba de cluster que pode ser instalada em mísseis balísticos táticos, aumentando as preocupações internacionais sobre seu arsenal nuclear e de mísseis.", "economia": "A Binance reiniciou as retiradas de fundos aos clientes após um roubo estimado em 6,3 bilhões de dólares, atribuído a um grupo ligado ao Norte da Coreia, comprometendo a segurança das transações na plataforma. O mercado revisou para baixo as projeções do PIB e projeta uma inflação de até 6% em 2027, considerando o mandato de quatro anos de Lula. Investidores reduziram suas expectativas sobre o crescimento dos Estados Unidos e estão comprando títulos públicos devido aos temores relacionados à exposição excessiva à inteligência artificial. Em outro desenvolvimento, a empresa sul-coreana de cosméticos APR registrou uma receita recorde de 773,1 bilhões de wones no terceiro trimestre de 2026, dobrando em comparação com o mesmo período do ano anterior, impulsionada pela demanda robusta nos Estados Unidos e na Europa. Além disso, a vinícola gaúcha Miolo exporta vinho para 32 países e reforça sua aposta no mercado global, enquanto as exportações sul-coreanas atingiram um recorde de US$115,3 bilhões em outubro, principalmente devido às vendas históricas de chips.", "tecnologia": "A inteligência artificial (IA) está se tornando uma ferramenta estratégica para empresas e governos, como mostram parcerias e projetos em andamento. A HD Hyundai Robotics, em colaboração com a Palantir, está desenvolvendo soluções de IA que prometem reduzir significativamente o tempo de resolução de problemas em robôs, com um corte de 63% no tempo necessário. O Banco KB Kookmin lidera um empréstimo de 10,7 trilhões de wones para apoiar o projeto de infraestrutura de computação de IA da Naver, sendo o maior empréstimo sindicado da Coreia do Sul. A tecnologia também é debatida em eventos como o TechCrunch Founder Summit, que oferece oportunidades de networking para startups. Além disso, a Meta está desenvolvendo um protótipo de robô humanoide em parceria com uma startup chinesa, visando auxiliar na realização de tarefas domésticas. A discussão sobre a qualidade da pesquisa científica alimentada pela IA também envolve matemáticos, destacando os desafios éticos e acadêmicos que a tecnologia apresenta.", "ciencia": "Um estudo publicado pela revista New Scientist mostrou que peixes rummy-nose tetra observam e seguem apenas um vizinho influente, tanto em interações reais quanto virtuais, demonstrando a capacidade deles de discernir liderança em seu grupo. Em outro estudo, cientistas da NASA descobriram que uma partícula esquecida durante décadas pode explicar por que a matéria sobreviveu ao Big Bang, permitindo a existência de estrelas, planetas e vida. A pesquisa sugere que esta partícula reconfigurou o universo primitivo e pode ter deixado sinais gravitacionais detectáveis. Um modelo de inteligência artificial desenvolvido por pesquisadores do MIT detectou sinais de câncer de pâncreas em tomografias com 73% de sensibilidade, melhorando em relação aos radiologistas, que tiveram apenas 39% de acurácia. Além disso, um estudo do Phys. Org descobriu que árvores podem perceber sua forma e alinhar seus troncos usando madeira especializada que funciona como músculos opostos, ajudando as árvores a manterem sua postura e potencialmente levando a florestas mais fortes e madeiras de melhor qualidade.", "cultura": "O filósofo italiano Pietro del Soldà, participante do Festival Puerto de Ideas Valparaíso, enfatizou o individualismo como principal ameaça à democracia, destacando a importância do amor, amizade e aventura para a liberdade e a convivência democrática. Segundo outra notícia, a indústria do K-pop está prestes a atingir 100 milhões de álbuns vendidos em 2026, com a projeção baseada em lançamentos importantes e formatos de merchandise. No campo cultural, o filme 'A Terra do Meu Pai', dirigido por Thomas Mann em 1949, sugere que a arte falha diante da violência, retratando a viagem do autor pela Alemanha após a Segunda Guerra Mundial.", "sociedade": "A crise no sistema de saúde e segurança no Brasil e em outros países é um tema recorrente. No Paraná, alunos de medicina da UniCesumar em Maringá foram expulsos após ofensas contra bolsistas em grupos de mensagens relacionados ao resultado das eleições presidenciais, revelando tensões sociais. Em São Paulo, um adolescente de 17 anos faleceu após ser atropelado por um ônibus na zona sul da cidade, destacando a necessidade de maior segurança viária. No Distrito Federal, o governo inaugurou 32 Unidades Básicas de Saúde (UBSs) para vacinação, mas o sistema de segurança enfrenta desafios, com o Smart Seg (ou sistema equivalente, mas o Smart Sampa é da cidade de São Paulo). No nível global, a Alemanha viu a polícia usar jatos de água para dispersar manifestantes jovens em protestos contra o custo de vida e educação, enquanto a França registrou quase meio milhão de pessoas nas ruas em protestos contra o mesmo tema. Esses eventos refletem os desafios sociais e políticos atuais em diversos países.", "meio_ambiente": "O Amazonas registrou uma queda de 39% nos focos de queimadas em outubro, totalizando 8,5 mil focos, de acordo com o relatório do Instituto Nacional de Pesquisas Espaciais (Inpe). No entanto, nove municípios enfrentaram qualidade do ar moderada a ruim. Em outro desenvolvimento, a COP17 terminou com o acordo 'Caminho de Yerevan', que visa acelerar o cumprimento das metas globais de biodiversidade até 2030, mas o financiamento permanece como o principal obstáculo. Além disso, o presidente da Bolívia decretou emergência nacional em face do fenômeno climático El Niño, que está afetando o território do país, mobilizando recursos financeiros e humanos para lidar com as consequências desse evento climatológico.", "direitos_humanos": "Um novo surto de combates no Iêmen fez com que cerca de 290 mil pessoas fossem deslocadas de suas casas, segundo a ONU, com mulheres grávidas em risco. Em outro desenvolvimento, a Funai notificou a Polícia Federal para investigar incidentes de ataques contra indígenas no Mato Grosso do Sul, ocorridos após a reeleição do presidente Lula. O Departamento de Segurança Nacional dos Estados Unidos comemorou um julgamento que limitou as audiências de fiança para imigrantes detidos pelo ICE em Texas, Louisiana e Mississippi. Além disso, o governo britânico ainda está enviando pessoas que buscam asilo para a França, mesmo após o fim do esquema 'um para um'."}, "resumo_do_dia": {"politica_nacional": [{"id": 238306, "titulo": "Projeto muda regras para incorporação de novas tecnologias no SUS", "url": "https://www.poder360.com.br/poder-saude/projeto-muda-regras-para-incorporacao-de-novas-tecnologias-no-sus/", "fonte_id": "poder360", "data_pub": "2026-11-01T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei está sendo analisado na Câmara dos Deputados e visa modificar as regras para a incorporação de novas tecnologias no Sistema Único de Saúde (SUS). A avaliação de novos remédios, produtos e procedimentos seria realizada em duas fases.", "titulo_pt": "Projeto altera regras para incorporação de novas tecnologias no SUS", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 238307, "titulo": "Exposição alerta para efeito da crise climática nos recursos hídricos", "url": "https://www.poder360.com.br/poder-sustentavel/exposicao-alerta-para-efeito-da-crise-climatica-nos-recursos-hidricos/", "fonte_id": "poder360", "data_pub": "2026-11-01T09:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A exposição online apresenta imagens de paisagens aquáticas e fotografias de desastres relacionados ao efeito da crise climática nos recursos hídricos.", "titulo_pt": "Exposição online alerta para impacto da crise climática nos recursos hídricos", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 238309, "titulo": "Projeto incentiva reserva de vagas para autistas em escolas", "url": "https://www.poder360.com.br/poder-congresso/projeto-incentiva-reserva-de-vagas-para-autistas-em-escolas/", "fonte_id": "poder360", "data_pub": "2026-11-01T09:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um projeto de lei proposto pelo deputado Marcos Pereira (Republicanos) visa criar reservas de vagas para pessoas autistas em escolas. O texto ainda necessita ser aprovado pela Câmara e pelo Senado para se tornar uma lei.", "titulo_pt": "Projeto incentiva reserva de vagas para autistas em escolas", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 238310, "titulo": "Finados: aeroportos devem receber 2 milhões de passageiros no feriado", "url": "https://www.poder360.com.br/poder-brasil/finados-aeroportos-devem-receber-2-milhoes-de-passageiros-no-feriado/", "fonte_id": "poder360", "data_pub": "2026-11-01T09:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério do Turismo prevê que cerca de 2 milhões de passageiros passem por aeroportos durante o feriado dos Finados, que ocorre na próxima segunda-feira (2 de novembro). A expectativa é de mais de 10,3 mil voos durante o período.", "titulo_pt": "Finados: aeroportos devem receber 2 milhões de passageiros no feriado", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 238311, "titulo": "BYD da Bahia deve nacionalizar 50% da produção em 2027", "url": "https://www.poder360.com.br/poder-china/byd-da-bahia-deve-nacionalizar-50-da-producao-em-2027/", "fonte_id": "poder360", "data_pub": "2026-11-01T09:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A fábrica da BYD em Camaçari está iniciando a fase de testes em suas fábricas de estamparia, soldagem e pintura. A empresa pretende nacionalizar 50% da produção em 2027.", "titulo_pt": "BYD da Bahia deve nacionalizar 50% da produção em 2027", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 238312, "titulo": "Arsesp abre consultas e marca audiências sobre gás e saneamento", "url": "https://www.poder360.com.br/poder-infra/arsesp-abre-consultas-e-marca-audiencias-sobre-gas-e-saneamento/", "fonte_id": "poder360", "data_pub": "2026-11-01T09:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "AArsesp iniciou consultas públicas sobre gás e saneamento e agendou audiências para os dias 9 e 10 de novembro, que serão realizadas de forma virtual.", "titulo_pt": "Arsesp inicia consultas e marca audiências sobre gás e saneamento", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 238295, "titulo": "Franco-senegalesa radicada no Brasil, Anaïs Sylla une Senegal, Mali e Caribe em novo disco", "url": "https://www.cartacapital.com.br/blogs/augusto-diniz/franco-senegalesa-radicada-no-brasil-anais-sylla-une-senegal-mali-e-caribe-em-novo-disco/", "fonte_id": "cartacapital", "data_pub": "2026-11-01T09:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O álbum, nascido durante a pandemia, une influências do Senegal, Mali e Caribe. É uma celebração das sonoridades afrodiaspóricas, redefinindo o conceito de isolamento musical.", "titulo_pt": "Franco-senegalesa radicada no Brasil, Anaïs Sylla une Senegal, Mali e Caribe em novo disco", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 238313, "titulo": "Moraes está há 177 dias com ações contra a lei da dosimetria", "url": "https://www.poder360.com.br/poder-justica/moraes-esta-ha-177-dias-com-acoes-contra-a-lei-da-dosimetria/", "fonte_id": "poder360", "data_pub": "2026-11-01T09:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Moraes tem considerado ações que questionam a constitucionalidade da Lei 15.402, que entrou em vigor em maio de 2026, e ainda não decidiu se deve liberar ou não a aplicação da norma.", "titulo_pt": "Moraes mantém atraso de 177 dias em decisões sobre ações contra a lei da dosimetria", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 238314, "titulo": "Alcolumbre tenta acordo para libertar Bolsonaro e se reeleger no Senado", "url": "https://www.poder360.com.br/poder-congresso/alcolumbre-tenta-acordo-para-libertar-bolsonaro-e-se-reeleger-no-senado/", "fonte_id": "poder360", "data_pub": "2026-11-01T09:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Senado, Alcolumbre, está negociando a possibilidade de um indulto ou anistia com o presidente Lula ou no Congresso em troca do apoio da direita para se reeleger. A proposta visa também mitigar a pressão por um impeachment de ministros do STF.", "titulo_pt": "Alcolumbre busca acordo para se reeleger e evitar impeachment de ministros do stf", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 238273, "titulo": "Governo tenta derrubar obrigação de oferecer curso de direitos humanos na Polícia Rodoviária Federal", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/governo-tenta-derrubar-obrigacao-de-oferecer-curso-de-direitos-humanos-na-policia-rodoviaria-federal.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-01T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula (PT) recorreu de uma decisão judicial que obrigava a PRF a restabelecer comissões regionais de direitos humanos e incluir o tema nos cursos de formação dos policiais.", "titulo_pt": "Governo recorre de decisão judicial sobre direitos humanos na prf", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 238296, "titulo": "‘Vitória de Lula é um muro contra a extrema-direita global’, avalia ex-chanceler do Equador", "url": "https://www.cartacapital.com.br/politica/vitoria-de-lula-e-um-muro-contra-a-extrema-direita-global-avalia-ex-chanceler-do-equador/", "fonte_id": "cartacapital", "data_pub": "2026-11-01T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-chanceler equatoriano Guillaume Long avaliou que a vitória de Lula é um obstáculo contra a extrema-direita global. Ele também mencionou que o desafio imediato na região é recuperar a institucionalidade democrática.", "titulo_pt": "Vitória de Lula é barreira contra extrema-direita global, afirma ex-chanceler do Equador", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 238328, "titulo": "Acertou ou errou?", "url": "https://www.metropoles.com/blog-do-noblat/enquetes/acertou-ou-errou", "fonte_id": "metropoles", "data_pub": "2026-11-01T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A enquete apresenta perguntas para os leitores, mas não há detalhes adicionais sobre o conteúdo específico das perguntas ou os resultados obtidos.", "titulo_pt": "Acertou ou errou?", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 238329, "titulo": "Sem acordo, bancada do PT fará reunião para discutir maioridade penal", "url": "https://www.metropoles.com/colunas/milena-teixeira/sem-acordo-bancada-do-pt-fara-reuniao-para-discutir-maioridade-penal", "fonte_id": "metropoles", "data_pub": "2026-11-01T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Senadores do PT estão planejando uma reunião para discutir uma emenda que propõe reduzir a idade penal para 16 anos, especificamente para crimes hediondos, sem que haja consenso sobre a maioridade.", "titulo_pt": "Sem acordo, bancada do PT fará reunião sobre maioridade penal", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 238358, "titulo": "Governo tenta acelerar PEC da Segurança; oposição insiste em maioridade", "url": "https://www.cnnbrasil.com.br/politica/governo-tenta-acelerar-pec-da-seguranca-oposicao-insiste-em-maioridade/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-01T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo tenta acelerar o processo de votação da Proposta de Emenda à Constituição (PEC) da Segurança, mas há impasses em relação à redução da idade mínima para prisão. A base aliada quer votar os dois turnos da proposta na terça-feira (3), mas a oposição insiste em manter a maioridade para prisão.", "titulo_pt": "Governo tenta acelerar PEC da Segurança; oposição insiste em maioridade", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 238330, "titulo": "PP e União Brasil sugerem nomes para novo governo Lula", "url": "https://www.metropoles.com/colunas/igor-gadelha/pp-e-uniao-brasil-sugerem-ao-planalto-nomes-para-novo-governo-lula", "fonte_id": "metropoles", "data_pub": "2026-11-01T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Caciques do União Brasil e do PP apresentaram ao Palácio do Planalto algumas sugestões de nomes para compor o governo Lula.", "titulo_pt": "PP e União Brasil sugerem nomes para novo governo Lula", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 238331, "titulo": "Eleições: 27 partidos reconhecem vitória de Lula; Novo contesta resultado", "url": "https://www.metropoles.com/brasil/eleicoes-27-partidos-reconhecem-vitoria-de-lula-novo-contesta-resultado", "fonte_id": "metropoles", "data_pub": "2026-11-01T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Vinte e sete partidos políticos reconheceram a vitória do presidente eleito Luiz Inácio Lula da Silva, enquanto o partido Novo contestou o resultado das eleições. Um partido, Mobiliza, não se manifestou sobre o assunto.", "titulo_pt": "Eleições: 27 partidos reconhecem vitória de Lula; Novo contesta resultado", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 238674, "titulo": "Manovra, rinvio per le compensazioni del Superbonus, spalmate su 10 anni", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/01/manovra-rinvio-per-le-compensazioni-del-superbonus-spalmate-su-10-anni_003871fd-283b-4f82-a15a-190e58b11a17.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-01T09:54:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O governo italiano pretende estender os pagamentos das compensações do Superbonus em 10 anos. Os 20,5 bilhões esperados para 2027 serão distribuídos em 10 parcelas anuais.", "titulo_pt": "Manobra, reprogramação para compensações do Superbonus, espalhadas em 10 anos", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 238594, "titulo": "Youth Olympic Games kick off in Dakar", "url": "https://www.france24.com/en/youth-olympic-games-kick-off-in-dakar", "fonte_id": "france24", "data_pub": "2026-11-01T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As Jornadas Olímpicas Juvenis de 2026 iniciaram-se oficialmente em Dakar, Senegal. A cerimônia de abertura, que contou com centenas de bateristas e dançarinos, celebrou a cultura senegalesa e africana em consonância com o lema dos jogos: 'África acolhe, Dakar comemora'.", "titulo_pt": "Jornadas olímpicas juvenis de 2026 começam em Dakar", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 238737, "titulo": "Turkish, East Timorese presidents to visit S. Korea this week for talks with Lee", "url": "https://en.yna.co.kr/view/AEN20261101004100315", "fonte_id": "yonhap_news", "data_pub": "2026-11-01T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente da Turquia, Recep Tayyip Erdogan, e o presidente de Timor-Leste estarão visitando a Coreia do Sul esta semana para reuniões com o presidente Lee.", "titulo_pt": "Presidentes da Turquia e timor-leste visitarão a Coreia do sul esta semana", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 238706, "titulo": "Turkey moves Kurdish militant leader as part of peace process", "url": "https://www.scmp.com/news/world/europe/article/3372883/turkey-moves-kurdish-militant-leader-part-peace-process", "fonte_id": "scmp", "data_pub": "2026-11-01T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Turquia transferiu o líder militante kurdo Abdullah Öcalan para uma nova seção de uma prisão ilha onde ele está detido desde 1999, como parte de esforços para pôr fim a décadas de conflito. Melhorar as condições de detenção de Öcalan, que lidera o Partido dos Trabalhadores do Curdistão (PKK), tem sido uma demanda principal dos kurdos para encerrar o conflito de 42 anos entre o grupo militant e as autoridades turcas.", "titulo_pt": "Turquia transfere líder kurdo militant para ilha como parte do processo de paz", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 238595, "titulo": "The World celebrates Halloween: Traditions, costumes and pumpkins", "url": "https://www.france24.com/en/video/20261101-the-world-celebrates-halloween-traditions-costumes-and-pumpkins", "fonte_id": "france24", "data_pub": "2026-11-01T09:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Celebridades de várias partes do mundo comemoram o Halloween, que é celebrado por tradições, fantasias e lanternas de pepino. Charlotte Hughes preparou um resumo sobre as comemorações deste feriado em diferentes países.", "titulo_pt": "O mundo comemora Halloween: tradições, fantasias e lanternas de pepino", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 238596, "titulo": "France: 115 yachts will sail out of Sain-Malo for Route du Rhum race", "url": "https://www.france24.com/en/france-115-yachts-will-sail-out-of-sain-malo-for-route-du-rhum-race", "fonte_id": "france24", "data_pub": "2026-11-01T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Saint-Malo, na região da Bretanha na França, está sendo preparada a lendária Route du Rhum. É uma corrida solo transatlântica de grande escala, com os navegadores partindo da costa norte da França para a ilha caribenha de Guadeloupe, em uma travessia de alta velocidade que ocorre a cada quatro anos.", "titulo_pt": "França: 115 iates partirão de saint-malo para a corrida Route du Rhum", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 238597, "titulo": "US Midterms: Affordability at heart of Michigan race", "url": "https://www.france24.com/en/us-midterms-affordability-at-heart-of-michigan-race", "fonte_id": "france24", "data_pub": "2026-11-01T09:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Para muitos eleitores, a questão do custo de vida é o principal problema. Em Michigan, cerca de 40% da população enfrentam dificuldades para arcar com os gastos básicos, conforme relatado por uma ONG.", "titulo_pt": "Eleições médias dos EUA: viabilidade financeira é o principal tema em Michigan", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 238598, "titulo": "Youth-led rallies sweep Europe", "url": "https://www.france24.com/en/youth-led-rallies-sweep-europe", "fonte_id": "france24", "data_pub": "2026-11-01T09:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Protestos em França inspiraram manifestações jovens em outros países europeus, como Portugal, Itália e Alemanha. Em Berlim, uma iniciativa jovem chamada 'Gen Z has got this' liderou um grande protesto, onde os manifestantes pediram melhor educação e saúde, proteção climática mais forte e um custo de vida mais acessível, além de se opor a qualquer retorno ao serviço militar obrigatório.", "titulo_pt": "Manifestações jovens espalham-se pela Europa", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 238599, "titulo": "How social media are central to protests", "url": "https://www.france24.com/en/how-social-media-are-central-to-protests", "fonte_id": "france24", "data_pub": "2026-11-01T09:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Protestantes estavam frustrados por serem mantidos no perímetro da capital francesa. Há relatos de supressão de postagens nas redes sociais sobre as demonstrações.", "titulo_pt": "Como as redes sociais são centrais nas protestos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 238600, "titulo": "Hundreds of thousands protest in France for \"Act III\"", "url": "https://www.france24.com/en/hundreds-of-thousands-protest-in-france-for-act-iii", "fonte_id": "france24", "data_pub": "2026-11-01T09:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas protestaram em Paris e outras cidades francesas neste fim de semana contra o aumento dos custos de vida e as condições deterioradas nas escolas. A presença policial foi intensa, mas não impediu confrontos, com uso de gás lacrimogêneo e incêndios em várias áreas.", "titulo_pt": "Milhares protestam em França para 'ato III'", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 238626, "titulo": "Matt Barreto: ‘More than a reversal or a shift in voting trends, the Latino vote is a repudiation of Trump’", "url": "https://english.elpais.com/usa/2026-11-01/matt-barreto-more-than-a-reversal-or-a-shift-in-voting-trends-the-latino-vote-is-a-repudiation-of-trump.html", "fonte_id": "elpais_en", "data_pub": "2026-11-01T09:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Matt Barreto, estrategista de campanha e pesquisador de opinião, acredita que os democratas vão recuperar a maioria na Câmara dos Representantes, mas alerta que os votos hispânicos não estão amplamente ou firmemente alinhados com nenhum dos partidos políticos.", "titulo_pt": "Matt Barreto: 'mais do que uma reversão ou mudança nas tendências de voto, o voto hispânico é uma repúdia a Trump'", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 238308, "titulo": "IBGE e Instituto Nacional de Estatística da China ampliam cooperação", "url": "https://www.poder360.com.br/poder-internacional/ibge-e-instituto-nacional-de-estatistica-da-china-ampliam-cooperacao/", "fonte_id": "poder360", "data_pub": "2026-11-01T09:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O IBGE e o Instituto Nacional de Estatística da China estenderam suas colaborações com o objetivo de aprimorar metodologias, processos de trabalho e instrumentos de análise da realidade econômica e social.", "titulo_pt": "IBGE e Instituto Nacional de Estatística da China ampliam cooperação", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 238494, "titulo": "Daron Acemoglu: “Si los demócratas creen que todo puede volver a la normalidad, será una victoria peligrosa”", "url": "https://elpais.com/us/2026-11-01/daron-acemoglu-si-los-democratas-creen-que-todo-puede-volver-a-la-normalidad-sera-una-victoria-peligrosa.html", "fonte_id": "elpais_america", "data_pub": "2026-11-01T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Daron Acemoglu, economista premiado com o Nobel, discute no que está em jogo nas eleições intercaladas dos Estados Unidos. Ele critica a ideia de que os democratas possam retornar a uma normalidade pré-pandêmica, considerando-a uma vitória potencialmente perigosa.", "titulo_pt": "Daron Acemoglu: 'se os democratas acreditarem que tudo pode voltar à normalidade, será uma vitória perigosa'", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 238495, "titulo": "“Amar al prójimo” como lema de campaña: los pastores demócratas que buscan arrebatar el voto cristiano a los republicanos", "url": "https://elpais.com/us/2026-11-01/amar-al-projimo-como-lema-de-campana-los-pastores-democratas-que-buscan-arrebatar-el-voto-cristiano-a-los-republicanos.html", "fonte_id": "elpais_america", "data_pub": "2026-11-01T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Clérigos democratas estão competindo nas eleições em estados conservadores como Kansas e Texas, baseando suas campanhas em fé e valores religiosos. Seu objetivo é atrair o voto cristão que historicamente apoia os republicanos.", "titulo_pt": "Amor ao próximo como lema de campanha: pastores democratas buscam o voto cristão nos estados conservadores", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 238499, "titulo": "Matt Barreto: “Más que una reversión o un cambio de tendencia, el voto latino es un rechazo a Trump”", "url": "https://elpais.com/us/2026-11-01/matt-barreto-mas-que-una-reversion-o-un-cambio-de-tendencia-el-voto-latino-es-un-rechazo-a-trump.html", "fonte_id": "elpais_america", "data_pub": "2026-11-01T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Matt Barreto, especialista em campanhas e pesquisas, prevê uma vitória democrata na Câmara dos Representantes, mas destaca a falta de alinhamento partidário sólido entre os hispanos nos Estados Unidos.", "titulo_pt": "Matt Barreto: 'mais do que uma reversão ou mudança de tendência, o voto latino é um rejeição a Trump'", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 238500, "titulo": "Un chat cifrado, un disco duro, más de 30 detenidos: así cayó la estructura del CJNG que mató a Carlos Manzo", "url": "https://elpais.com/mexico/2026-11-01/un-chat-cifrado-un-disco-duro-mas-de-30-detenidos-asi-cayo-la-estructura-del-cjng-que-mato-a-carlos-manzo.html", "fonte_id": "elpais_america", "data_pub": "2026-11-01T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A investigação das autoridades revelou que mais de 30 pessoas foram detidas e que o CJNG estava envolvido no assassinato do prefeito de Uruapan, Carlos Manzo, ocorrido há um ano. A operação incluiu o uso de um chat cifrado e um disco rígido como elementos-chave.", "titulo_pt": "Um chat criptografado, um disco rígido, mais de 30 detidos: assim desmoronou a estrutura do CJNG que matou Carlos Manzo", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 238635, "titulo": "Binance restarts customer withdrawals after $6.3bn heist", "url": "https://www.ft.com/content/1d4dd7b2-9dee-433b-ac2a-e8022af1dd07?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-01T09:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Binance reiniciou as retiradas de clientes após um roubo de $6,3 bilhões atribuído a um grupo ligado ao Norte Coreia. A plataforma vai reembolsar os usuários cujos ativos foram roubados no hack.", "titulo_pt": "Binance reanuda saques de clientes após roubos de $6,3 bi atribuídos a grupo norte-coreano", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 238285, "titulo": "Consumo de proteína cresce nos Estados Unidos e muda disputa entre carnes e ovos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/consumo-de-proteina-cresce-nos-estados-unidos-e-muda-disputa-entre-carnes-e-ovos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-01T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A demanda por proteína nos Estados Unidos aumentou nos últimos anos, acompanhando mudanças nos hábitos alimentares dos americanos. A disputa entre carnes e ovos na oferta de proteína tem se intensificado.", "titulo_pt": "Consumo de proteína cresce nos EUA e intensifica disputa entre carnes e ovos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 238362, "titulo": "Nasdaq tem pior mês em mais de um ano com temores sobre IA", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/nasdaq-tem-pior-mes-em-mais-de-um-ano-com-temores-sobre-ia/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-01T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As bolsas americanas fecharam em baixa na sexta-feira, com destaque para a forte queda das ações de empresas de tecnologia, principalmente após a Intel. Essa tendência reflete a preocupação crescente dos investidores com as perspectivas de crescimento da inteligência artificial.", "titulo_pt": "Nasdaq tem pior mês em mais de um ano com temores sobre IA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 238377, "titulo": "Esquecido no organograma, jovem de 27 anos vira aposta da Cisco para a era da IA", "url": "https://www.infomoney.com.br/business/global/esquecido-no-organograma-jovem-de-27-anos-vira-aposta-da-cisco-para-a-era-da-ia/", "fonte_id": "infomoney", "data_pub": "2026-11-01T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um jovem de 27 anos, que estava em uma função pouco estratégica na Cisco, foi encarregado de um projeto considerado impossível: reescrever 98% do código da empresa. O executivo encontrou o jovem com o ex-fundador de uma startup e decidiu apostar nele para este desafio.", "titulo_pt": "Jovem de 27 anos esquecido no organograma se torna aposta da Cisco para a era da IA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 238379, "titulo": "Ucranianos combatem russos dentro de gasodutos subterrâneos. Eu entrei em um deles", "url": "https://www.infomoney.com.br/business/global/ucranianos-combatem-russos-dentro-de-gasodutos-subterraneos-eu-entrei-em-um-deles/", "fonte_id": "infomoney", "data_pub": "2026-11-01T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ucranianos combatem russos dentro de gasodutos subterrâneos. O autor relatou sua experiência pessoal dentro de um desses gasodutos durante a guerra.", "titulo_pt": "Ucranianos combatem russos dentro de gasodutos subterrâneos. Eu entrei em um deles", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 238382, "titulo": "Juros, impostos, crédito e trabalho: o que realmente importa para os negócios em 2027", "url": "https://www.infomoney.com.br/business/juros-impostos-credito-e-trabalho-o-que-realmente-importa-para-os-negocios-em-2027/", "fonte_id": "infomoney", "data_pub": "2026-11-01T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Com uma dívida pública próxima a 83% do PIB, juros ainda elevados e incertezas sobre a tributação e o mercado de trabalho, as empresas entram em 2027 sem clareza sobre fatores cruciais para o investimento, contratações e expansão.", "titulo_pt": "Juros, impostos, crédito e trabalho: o que realmente importa para os negócios em 2027", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 238434, "titulo": "Sigue el éxodo de millonarios en California y ahora Jeff Bezos inyectará US$554 millones para fabricar satélites en Texas", "url": "https://www.lanacion.com.ar/estados-unidos/texas/sigue-el-exodo-de-millonarios-en-california-y-ahora-jeff-bezos-inyectara-us554-millones-para-nid01112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-01T08:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Jeff Bezos investirá US$554 milhões em Texas para fabricar satélites e criar mais de 2.000 empregos ao longo de dez anos. Blue Origin, empresa de Bezos, planeja estabelecer operações em Hutto, Texas.", "titulo_pt": "Plano de blue origin em Texas: investimento de US$554 milhões para fabricar satélites e gerar empregos", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 238286, "titulo": "Investidores reduzem apostas em crescimento dos EUA em meio a temores de exposição excessiva a IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/investidores-reduzem-apostas-em-crescimento-dos-eua-em-meio-a-temores-de-exposicao-excessiva-a-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-01T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Investidores estão reduzindo suas expectativas sobre o crescimento dos Estados Unidos e comprando títulos públicos devido aos crescentes temores relacionados à exposição excessiva a inteligência artificial.", "titulo_pt": "Investidores reduzem apostas em crescimento dos EUA diante dos temores de exposição excessiva à IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 238287, "titulo": "Como foi ataque que roubou US$ 6,3 bilhões da Binance e abalou setor cripto", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/como-foi-ataque-que-roubou-us-63-bilhoes-da-binance-e-abalou-setor-cripto.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-01T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Por volta das 16h20 de quinta-feira (29), uma série de transações incomuns chamou a atenção na Binance, a maior corretora de criptomoedas do mundo. O incidente levantou preocupações e abalou o setor cripto.", "titulo_pt": "Como foi o ataque que causou preocupação na Binance e abalou o setor cripto?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 238370, "titulo": "Mercado revisa PIB para baixo e já vê inflação até 6% em 2027", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/mercado-revisa-pib-para-baixo-e-ja-ve-inflacao-ate-6-em-2027/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-01T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mercado revisou para baixo as projeções do PIB e projeta uma inflação de até 6% em 2027, considerando um mandato de quatro anos de Lula. Os analistas alertam para a possibilidade de preços elevados e de menor facilidade para o Banco Central cortar taxas de juros em um cenário econômico fraco.", "titulo_pt": "Mercado revisa PIB para baixo e projeta inflação de até 6% em 2027", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 238345, "titulo": "Fim da 6x1 e proximidade com Natal faz comércio acelerar mudança em escalas", "url": "https://www.metropoles.com/distrito-federal/fim-da-6x1-e-proximidade-com-natal-faz-comercio-acelerar-mudanca-em-escalas", "fonte_id": "metropoles", "data_pub": "2026-11-01T05:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O comércio do Distrito Federal está acelerando as mudanças em suas escalas de trabalho devido à antecipação da data do Natal. Isso visa evitar problemas com a mudança na jornada de trabalho.", "titulo_pt": "Fim da 6x1 e proximidade com Natal faz comércio acelerar mudança em escalas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 238634, "titulo": "EU leaders risk breaking their promise to help European start-ups", "url": "https://www.ft.com/content/ce1e852d-c699-4cf6-b8a0-78fd283556f3?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-01T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Europeia está abordando o gap de financiamento para inovadores, mas tomando o caminho errado ao não harmonizar regras que ajudariam essas empresas a permanecerem na Europa.", "titulo_pt": "Líderes da ue correm risco de quebrar promessa de auxiliar start-ups europeias", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 238637, "titulo": "Bond investors sit out ‘most consequential’ US midterm elections in years", "url": "https://www.ft.com/content/937308d7-aa2e-4dac-b19b-423d83bc1253?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-01T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grande gestores de fundos estão adiando suas decisões devido às eleições de meio de mandato nos Estados Unidos e à proximidade de lançamentos de dados econômicos importantes.", "titulo_pt": "Investidores em títulos americanos desconsideram 'mais significativa' eleição de meio de mandato em décadas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 238639, "titulo": "Quant hedge fund to spin out of Tudor in record $9bn launch", "url": "https://www.ft.com/content/8ee19897-1d15-4dd7-8ca8-162c4ea22b3a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-01T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O fundo de investimento Xantium planeja se separar do grupo controlado pelo bilionário Paul Tudor Jones II no próximo ano. A separação ocorrerá em um lançamento recorde avaliado em 9 bilhões de dólares.", "titulo_pt": "Xantium se separa de Tudor em lançamento recorde de 9 bilhões", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 238454, "titulo": "A reclamação no regime de relevância (Parte I)", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-reclamacao-no-regime-de-relevancia-parte-i", "fonte_id": "jota", "data_pub": "2026-11-01T04:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Lei 15.484/2026 foi alterada com cinco novas disposições. Este artigo aborda a primeira parte dessas alterações, focando na reclamação no regime de relevância.", "titulo_pt": "Reclamação no regime de relevância (Parte I)", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 238778, "titulo": "APR doubles Q3 revenue as US, European sales soar", "url": "https://www.koreaherald.com/article/10921716", "fonte_id": "korea_herald", "data_pub": "2026-11-01T04:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa sul-coreana de cosméticos APR registrou receita recorde de 773,1 bilhões de wones no terceiro trimestre de 2026, dobrando em comparação com o mesmo período do ano anterior. A demanda robusta nos Estados Unidos e na Europa impulsionou o crescimento global da empresa.", "titulo_pt": "Receita da APR do terceiro trimestre duplica em comparação com o ano anterior, impulsionada por vendas nos EUA e Europa", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 238390, "titulo": "Fases da Lua em novembro de 2026: veja datas e horários", "url": "https://olhardigital.com.br/2026/11/01/ciencia-e-espaco/fases-da-lua-em-novembro-de-2026-veja-datas-e-horarios/", "fonte_id": "olhar_digital", "data_pub": "2026-11-01T09:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As fases da Lua em novembro de 2026 começam no dia 1, às 17h30 (horário de Brasília), com a Lua Minguante. A seguir, serão observadas outras fases da Lua nesse mês.", "titulo_pt": "Fases da Lua em novembro de 2026: veja datas e horários", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 238743, "titulo": "(LEAD) Trump says U.S. will talk to N. Korea if it is behind Binance hack", "url": "https://en.yna.co.kr/view/AEN20261101000351315", "fonte_id": "yonhap_news", "data_pub": "2026-11-01T07:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, declarou que o país se prontificou a conversar com a Coreia do Norte se ela for responsável pelo hack do Binance.", "titulo_pt": "Trump diz que EUA conversarão com Coreia do norte se ela for responsável pelo hack do Binance", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 238319, "titulo": "Recrutadores estão filtrando currículos por fluência em IA? O que muda na prática", "url": "https://exame.com/inteligencia-artificial/recrutadores-estao-filtrando-curriculos-por-fluencia-em-ia-o-que-muda-na-pratica/", "fonte_id": "exame", "data_pub": "2026-11-01T06:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O conhecimento em inteligência artificial está sendo considerado cada vez mais pelas empresas como uma competência valiosa. Isso levanta dúvidas sobre como essa habilidade influencia na seleção de candidatos.", "titulo_pt": "Recrutadores estão filtrando currículos por fluência em IA?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 238616, "titulo": "Companies promised AI gains— here's how the payoff showed up in earnings", "url": "https://www.cnbc.com/2026/11/01/ai-investments-company-earnings.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-01T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas como Santander e Novartis afirmam que a inteligência artificial está começando a aumentar as receitas, reduzir custos ou melhorar a rentabilidade. Investidores buscam retornos dessas iniciativas.", "titulo_pt": "Empresas afirmam que AI está gerando ganhos - aqui está como os lucros apareceram nos resultados", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 238715, "titulo": "US or China? Why Kazakhstan refuses to pick sides as it eyes AI revolution", "url": "https://www.scmp.com/tech/big-tech/article/3372785/us-or-china-why-kazakhstan-refuses-pick-sides-it-eyes-ai-revolution", "fonte_id": "scmp", "data_pub": "2026-11-01T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante uma viagem recente à capital do Cazaquistão, Astana, era evidente a crescente presença comercial da China. Carros chineses, como BYD e Changan, estavam se tornando comuns nas ruas, substituindo marcas como Hyundai e Kia. O encontro com o motorista no aeroporto em um Changan elétrico ilustrou essa mudança no mercado automotivo.", "titulo_pt": "EUA ou China? Por que o cazaquistão evita escolher lados enquanto busca revolução da IA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 238770, "titulo": "Subway car breaks down at Boramae Station; operation resumed after 2 p.m.", "url": "https://www.koreaherald.com/article/10921753", "fonte_id": "korea_herald", "data_pub": "2026-11-01T05:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O serviço da Linha 7 do metrô de Seul retornou ao normal após às 14h, após um problema em uma locomotiva no Boramae Station na manhã de domingo. O problema causou atrasos nas viagens que iam para o norte, mas as viagens que iam para o sul permaneceram operacionais.", "titulo_pt": "Trem quebrado na estação Boramae interrompe operações na linha 7 do metrô de seul, mas serviço retorna após 14h", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 238746, "titulo": "(LEAD) HD Hyundai Robotics partners with Palantir on AI solutions", "url": "https://en.yna.co.kr/view/AEN20261101001351320", "fonte_id": "yonhap_news", "data_pub": "2026-11-01T05:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A HD Hyundai Robotics, uma unidade de soluções robóticas do HD Group, está se associando à Palantir para desenvolver soluções de inteligência artificial. Essa parceria ocorre em Seul, Coreia do Sul, em novembro de 2023.", "titulo_pt": "HD Hyundai Robotics e Palantir unem-se em soluções de IA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 238774, "titulo": "KB Kookmin to lead record W10.7tr loan for Naver AI project", "url": "https://www.koreaherald.com/article/10921731", "fonte_id": "korea_herald", "data_pub": "2026-11-01T05:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Banco KB Kookmin está liderando um empréstimo sindicado de 10,7 trilhões de wones (cerca de 8 bilhões de dólares) para um projeto de infraestrutura de computação de IA apoiado pela Brookfield, que fornecerá recursos para a Naver Cloud. Este é o maior empréstimo sindicado da Coreia do Sul e o primeiro financiamento de GPU no país.", "titulo_pt": "KB Kookmin liderará empréstimo recorde de W10,7 trilhões para projeto de AI da Naver", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 238322, "titulo": "A nova literacia da liderança: por que “saber IA” significa mais do que usar ChatGPT", "url": "https://exame.com/inteligencia-artificial/a-nova-literacia-da-lideranca-por-que-saber-ia-significa-mais-do-que-usar-chatgpt/", "fonte_id": "exame", "data_pub": "2026-11-01T05:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A nova literacia de liderança envolve mais do que o uso de assistentes de inteligência artificial, exigindo conhecimentos específicos para a adoção dessas tecnologias. A familiaridade com assistentes de IA já é comum entre muitos profissionais, mas liderar sua implementação requer habilidades adicionais.", "titulo_pt": "A nova literacia da liderança: por que ‘saber IA’ significa mais do que usar ChatGPT", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 238776, "titulo": "HD Hyundai Robotics cuts troubleshooting time 63% with Palantir AI", "url": "https://www.koreaherald.com/article/10921723", "fonte_id": "korea_herald", "data_pub": "2026-11-01T04:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A HD Hyundai Robotics reduziu em 63% o tempo necessário para resolver problemas relacionados a robôs, utilizando agentes de inteligência artificial desenvolvidos em parceria com a Palantir Technologies. Desde agosto, a empresa passou a resolver, em média, problemas em 7,9 dias, em vez dos 21,5 anteriores.", "titulo_pt": "HD Hyundai Robotics reduz tempo de resolução de problemas de robôs em 63% com AI da Palantir", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 238401, "titulo": "Item de colecionador: o que a AI não produz", "url": "https://braziljournal.com/item-de-colecionador-o-que-a-ai-nao-produz", "fonte_id": "brazil_journal", "data_pub": "2026-11-01T03:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Dynamo publicou sua Carta 130, intitulada 'O Tácito do Tempo', que não se trata de relógios, mas sim de negócios baseados em confiança, hábito e conhecimento tácito. A gestora admite ter demorado para entender a estrutura relacional da rede de varejistas da Technos, sua antiga investida, e promete contar esse caso na próxima carta.", "titulo_pt": "Item de colecionador: o que a AI não produz", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 238691, "titulo": "Spewing U.S. election falsehoods, AI chatbots face scrutiny", "url": "https://www.japantimes.co.jp/news/2026/11/01/world/politics/ai-chatbots-us-election-scrutiny/", "fonte_id": "japan_times", "data_pub": "2026-11-01T03:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 3 de novembro, milhões de eleitores nos Estados Unidos vão depender de inteligência artificial para obter informações políticas, um fenômeno que pode ter um papel significativo nas próximas eleições. Chatbots de IA espalhando falsidades sobre a eleição estão sendo examinados.", "titulo_pt": "Espalhando falsidades sobre as eleições nos EUA, chatbots de IA enfrentam questionamentos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 238731, "titulo": "Data centers are now a midterm issue, even in Brooklyn", "url": "https://techcrunch.com/2026/10/31/data-centers-are-now-a-midterm-issue-even-in-brooklyn/", "fonte_id": "techcrunch", "data_pub": "2026-11-01T02:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma festa de voto intermediário em Brooklyn, cinco dias antes do Dia das Eleições, o assunto AI e centrais de dados foi constantemente discutido, abrangendo desde uma conversa informal com um membro do conselho até debates sobre o Partido Democrata.", "titulo_pt": "Centrais de dados agora são um assunto de voto intermediário, até mesmo em Brooklyn", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 238289, "titulo": "IA, capital e mercados, a outra face da revolução", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/roberto-campos-neto/2026/10/ia-capital-e-mercados-a-outra-face-da-revolucao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-01T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial é uma das maiores transformações tecnológicas registradas. Na coluna anterior, foi discutido seu impacto na produtividade agregada, que ainda não foi totalmente refletido nas estatísticas.", "titulo_pt": "IA, capital e mercados, a outra face da revolução", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 238697, "titulo": "GMO’s CEO Kumagai to hold news conference Monday on cyberattack", "url": "https://www.japantimes.co.jp/news/2026/11/01/japan/gmo-ceo-kumagai-cyberattack-presser/", "fonte_id": "japan_times", "data_pub": "2026-11-01T01:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da GMO Internet Group, Masatoshi Kumagai, e outros executivos irão realizar uma conferência de imprensa em Tóquio na próxima segunda-feira para discutir uma série de incidentes de acesso não autorizado.", "titulo_pt": "CEO da gmo realizará conferência de imprensa sobre ataque cibernético na próxima segunda-feira", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 238394, "titulo": "Casa mais limpa sem esforço: aspiradores robô em promoção na Amazon", "url": "https://olhardigital.com.br/2026/10/31/reviews/casa-mais-limpa-sem-esforco-aspiradores-robo-em-promocao-na-amazon/", "fonte_id": "olhar_digital", "data_pub": "2026-10-31T22:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Amazon está oferecendo aspiradores robôs em promoção, com três opções de modelos para diferentes perfis de consumidores, incluindo opções mais acessíveis e modelos com tecnologia avançada da Xiaomi. Os aspiradores robôs facilitam a manutenção da limpeza doméstica.", "titulo_pt": "Casa mais limpa sem esforço: aspiradores robôs em promoção na Amazon", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}], "tecnologia__eventos": [], "ciencia": [{"id": 238806, "titulo": "Fish pay attention to one influential neighbour in virtual reality", "url": "https://www.newscientist.com/article/2596645-fish-only-pay-attention-to-one-most-influential-neighbor-in-virtual-reality/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-01T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos mostram que, em um grupo, cada peixe rummy-nose tetra observa e segue apenas um vizinho influente, tanto em interações reais quanto virtuais.", "titulo_pt": "Peixes rummy-nose tetra prestam atenção a um vizinho influente em realidade virtual", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 238284, "titulo": "Inscrição em parede pode ser assinatura de antigo astrônomo do povo maia", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/inscricao-em-parede-pode-ser-assinatura-de-antigo-astronomo-do-povo-maia.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-01T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma breve assinatura ou fórmula de conclusão em maia, escrita nas paredes de uma possível biblioteca pré-colombiana, pode representar a assinatura de um dos primeiros astrônomos do Novo Mundo, anterior aos europeus, cuja identidade foi reconhecida pela ciência.", "titulo_pt": "Inscrição em parede pode ser assinatura de antigo astrônomo maia", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 238807, "titulo": "The best new science-fiction novels of November 2026", "url": "https://www.newscientist.com/article/2596484-the-best-new-science-fiction-novels-of-november-2026/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-01T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em novembro de 2026, há várias novidades na ficção científica, incluindo um drama audiológico produzido pelo autor de 'O Martelo do Destino', Andy Weir, uma autobiografia fictícia de Michael Moorcock e um novo romance de John Scalzi.", "titulo_pt": "Os melhores novos romances de ficção científica de novembro de 2026", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 238686, "titulo": "What a Japanese scientist says can be done about the climate’s nitrogen problem", "url": "https://www.japantimes.co.jp/environment/2026/11/01/climate-change/nitrogen-fertilizer-concern-climate-change/", "fonte_id": "japan_times", "data_pub": "2026-11-01T07:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A produção de fertilizantes, usada para alimentar a população mundial, converte o gás nitrogênio, que é inofensivo, em nitrogênio reativo, o que traz custos ambientais. Um cientista japonês sugere soluções para este problema do nitrogênio.", "titulo_pt": "O que um cientista japonês diz sobre o problema de nitrogênio do clima", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 238318, "titulo": "IA encontra sinais 'invisíveis' de câncer de pâncreas até 3 anos antes do diagnóstico", "url": "https://exame.com/ciencia/ia-encontra-sinais-invisiveis-de-cancer-de-pancreas-ate-3-anos-antes-do-diagnostico/", "fonte_id": "exame", "data_pub": "2026-11-01T06:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um modelo de inteligência artificial identificou sinais de câncer de pâncreas em tomografias com 73% de sensibilidade, melhorando em relação aos radiologistas que tiveram 39% de acurácia. Esses sinais foram detectados até 3 anos antes do diagnóstico oficial.", "titulo_pt": "IA encontra sinais de câncer de pâncreas até 3 anos antes do diagnóstico", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 238321, "titulo": "Novembro Azul: o que todo homem precisa saber sobre o câncer de próstata", "url": "https://exame.com/ciencia/novembro-azul-o-que-todo-homem-precisa-saber-sobre-o-cancer-de-prostata/", "fonte_id": "exame", "data_pub": "2026-11-01T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O câncer de próstata pode não apresentar sintomas nos estágios iniciais. É importante entender os fatores de risco e as situações em que os exames devem ser realizados.", "titulo_pt": "Novembro Azul: o que todo homem precisa saber sobre o câncer de próstata", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 238716, "titulo": "Singapore turns up heat on power-hungry air conditioning with cool revolution", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3372868/singapore-turns-heat-power-hungry-air-conditioning-cool-revolution", "fonte_id": "scmp", "data_pub": "2026-11-01T05:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Singapore está experimentando alternativas ao ar condicionado, como feixes refrigerados e 'deslocamento passivo', para reduzir a dependência de equipamentos energicamente intensivos. O país possui uma das maiores taxas de propriedade de ar condicionado per capita na região, com cerca de 99% das residências privadas equipadas com unidades de refrigeração.", "titulo_pt": "Singapura lança revolução fria para reduzir dependência de ar condicionado", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 238784, "titulo": "Scientists say a forgotten particle may explain why the universe exists", "url": "https://www.sciencedaily.com/releases/2026/10/261031221201.htm", "fonte_id": "science_daily", "data_pub": "2026-11-01T04:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um partícula misteriosa, negligenciada durante décadas, pode explicar por que a matéria sobreviveu ao Big Bang, permitindo a existência de estrelas, planetas e vida. Cientistas acreditam que esta partícula esquecida reconfigurou o universo primitivo e pode ter deixado sinais gravitacionais detectáveis que podem ajudar a desvendar os mistérios mais profundos do cosmos.", "titulo_pt": "Cientistas sugerem que uma partícula esquecida pode explicar a existência do universo", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 238787, "titulo": "APOD: 2026 November 1 – Colors of the Moon", "url": "https://science.nasa.gov/image-article/apod-2026-november-1-colors-of-the-moon/", "fonte_id": "nasa_news", "data_pub": "2026-11-01T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do Dia Astronômico de hoje apresenta os tons da Lua. A imagem foi publicada em 1 de novembro de 2026 e foi selecionada para destacar as cores visíveis na superfície lunar.", "titulo_pt": "Imagem do dia: cores da lua (1 de novembro de 2026)", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 238690, "titulo": "‘Air-con nation’ Singapore eyes alternatives to cool down", "url": "https://www.japantimes.co.jp/environment/2026/11/01/climate-change/singapore-alternatives-heat/", "fonte_id": "japan_times", "data_pub": "2026-11-01T03:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Singapura possui a maior taxa de propriedade de condicionadores de ar per capita na região do Sudeste Asiático, com cerca de 99% das residências privadas equipadas com unidades de refrigeração. A cidade-estado está considerando alternativas para reduzir a temperatura.", "titulo_pt": "Nação de condicionadores de ar", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 238785, "titulo": "Scientists discover the hidden “muscles” trees use to straighten themselves", "url": "https://www.sciencedaily.com/releases/2026/10/261030003006.htm", "fonte_id": "science_daily", "data_pub": "2026-11-01T02:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram que árvores podem perceber sua forma e alinhar seus troncos usando madeira especializada que funciona como músculos opostos. Esta habilidade notável ajuda as árvores a manterem sua postura e pode levar a florestas mais fortes, madeiras de melhor qualidade e culturas mais resistentes.", "titulo_pt": "Cientistas descobrem os 'músculos' ocultos que árvores usam para se retorcer", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 238786, "titulo": "Scientists discover a hidden driver of high cholesterol and a way to stop it", "url": "https://www.sciencedaily.com/releases/2026/10/261030003003.htm", "fonte_id": "science_daily", "data_pub": "2026-11-01T01:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram um mecanismo oculto que permite que dietas altas em colesterol comprometam as defesas naturais do corpo contra a colesterolose, e bloquear esse mecanismo reduziu dramaticamente o colesterol LDL nocivo em camundongos. Um medicamento experimental alvo dessa via já passou com sucesso por uma fase inicial de testes de segurança em humanos, o que pode acelerar o desenvolvimento de um novo tratamento para a colesterolose.", "titulo_pt": "Cientistas descobrem mecanismo oculto e potencial tratamento para colesterol alto", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 238782, "titulo": "This oddball reflective lava world is challenging to understand", "url": "https://phys.org/news/2026-10-oddball-lava-world.html", "fonte_id": "phys_org", "data_pub": "2026-11-01T00:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os planetas ultra-curto-período (USP) são exoplanetas que orbitam muito rapidamente, completando uma órbita em menos de 24 horas. Eles são surpreendentes entre as descobertas de Kepler e TESS, incluindo o planeta USP que orbita tão rapidamente que é um desafio compreendê-lo.", "titulo_pt": "Este planeta de lava refletora incomum é desafiador de se entender", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 237823, "titulo": "Experts caution cancer cachexia an urgent issue", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/01/2003866959", "fonte_id": "taipei_times", "data_pub": "2026-11-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertas alertam que a cachexia do câncer é um problema urgente que requer atenção imediata. Os especialistas enfatizam a necessidade de uma abordagem mais agressiva para o tratamento desta condição associada ao câncer.", "titulo_pt": "Expertas alertam sobre a urgência da cachexia do câncer", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 238783, "titulo": "Looking for bats after dark can help science—and change how we see them", "url": "https://phys.org/news/2026-10-dark-science.html", "fonte_id": "phys_org", "data_pub": "2026-10-31T22:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As pessoas reagem de diferentes maneiras quando ouvem ou sentem microbats voando, pois estes pequenos mamíferos noturnos usam sons ultrasonicos para se orientar e caçar à noite através de um processo chamado eco-localização. Eles emitem chamados e ouvem as ecoções refletidas por objetos e presas.", "titulo_pt": "Procurando por morcegos à noite pode ajudar a ciência e mudar como vemos eles", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 238250, "titulo": "Giant virus yields potassium channel gene that illuminates complex protein evolution", "url": "https://phys.org/news/2026-10-giant-virus-yields-potassium-channel.html", "fonte_id": "phys_org", "data_pub": "2026-10-31T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores descobriram um gene para um canal de potássio em um vírus de algas. O achado apóia a ideia de que vírus gigantes podem ter contribuído significativamente para a evolução de proteínas complexas.", "titulo_pt": "Gigante do vírus revela gene de canal de potássio que ilumina a evolução complexa de proteínas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 238468, "titulo": "Pietro del Soldà, filósofo italiano: “El individualismo es la amenaza más fuerte para la democracia, incluso más que los autócratas o las guerras”", "url": "https://www.latercera.com/nacional/noticia/pietro-del-solda-filosofo-italiano-el-individualismo-es-la-amenaza-mas-fuerte-para-la-democracia-incluso-mas-que-los-autocratas-o-las-guerras/", "fonte_id": "la_tercera", "data_pub": "2026-11-01T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Pietro del Soldà, filósofo italiano, participou do Festival Puerto de Ideas Valparaíso e discursou sobre o individualismo como principal ameaça à democracia. Ele reivindica a importância do amor, da amizade e da aventura para a liberdade e a convivência democrática.", "titulo_pt": "Pietro del Soldà, filósofo italiano: 'o individualismo é a maior ameaça à democracia, mais do que ditadores ou guerras'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 238433, "titulo": "El deseo de Reid Wiseman, comandante de Artemis II, para nuevas misiones: “Estoy ansioso por ver a mis amigos continuar este legado”", "url": "https://www.lanacion.com.ar/el-mundo/el-deseo-de-reid-wiseman-comandante-de-artemis-ii-para-nuevas-misiones-estoy-ansioso-por-ver-a-mis-nid01112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-01T08:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Reid Wiseman, comandante da missão Artemis II, expressou sua ansiedade pela possibilidade de novas missões. Após o retorno à Terra, Donald Trump concedeu a cada tripulante uma Medalla de Honor Espacial do Congresso durante uma cerimônia no Centro Espacial Johnson de Houston.", "titulo_pt": "O desejo de Reid Wiseman para novas missões: 'estou ansioso por ver meus amigos continuarem este legado'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 238759, "titulo": "K-pop album sales set to top 100 million as merchandise-style formats spread", "url": "https://www.koreaherald.com/article/10921822", "fonte_id": "korea_herald", "data_pub": "2026-11-01T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas de álbuns de K-pop devem ultrapassar 100 milhões de cópias em 2026, após um aumento de 7,6 milhões de cópias nos primeiros nove meses do ano. A projeção é baseada no retorno do mercado com lançamentos importantes e no crescimento rápido dos formatos de merchandise.", "titulo_pt": "Vendas de álbuns de k-pop devem atingir 100 milhões em 2026", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 238789, "titulo": "Dafne Keen and Harriet Walter on working with Patrick Stewart: ‘I’ve never seen anyone so ecstatic’", "url": "https://www.theguardian.com/culture/2026/nov/01/dafne-keen-and-harriet-walter-on-working-with-patrick-stewart-ive-never-seen-anyone-so-ecstatic", "fonte_id": "guardian_culture", "data_pub": "2026-11-01T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dafne Keen e Harriet Walter, que trabalharam com Patrick Stewart em Logan e Anthony e Cleopatra, lembram seu carisma, humor e generosidade. Stewart era conhecido por fazer todos ao seu redor se sentirem especiais e lembrava a todos do amor pelo trabalho e a importância de compartilhá-lo.", "titulo_pt": "Dafne Keen e Harriet Walter sobre trabalhar com Patrick Stewart: 'eu nunca vi ninguém tão eufórico'", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 238267, "titulo": "Em 'A Terra do Meu Pai', arte vira estratégia de Alemanha que se recupera do nazismo", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/em-a-terra-do-meu-pai-arte-vira-estrategia-de-alemanha-que-se-recupera-do-nazismo.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-01T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No filme, o autor Thomas Mann realiza uma turnê pela Alemanha após a Segunda Guerra Mundial. A viagem é interpretada como uma iniciativa do governo para aliviar as dores do conflito, incluindo o exílio de Mann durante o regime nazista.", "titulo_pt": "Em 'A Terra do Meu Pai', arte vira estratégia de Alemanha que se recupera do nazismo", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 238268, "titulo": "'A Terra do Meu Pai' sugere que arte falha diante da violência", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/a-terra-do-meu-pai-sugere-que-arte-falha-diante-da-violencia.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-01T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 1949, Thomas Mann viaja para sua terra natal, a Alemanha, acompanhado de sua filha Erika, interpretada por Sandra Hüller. A obra sugere que a arte falha diante da violência.", "titulo_pt erald.com/article/10921725", "fonte_id": "korea_herald", "data_pub": "2026-11-01T04:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "American Dream", "titulo_pt": "Sem heróis ou vilões: koki Mitani retrata a pavor vermelho de Hollywood em 'sonho americano'", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 238779, "titulo": "Korean entertainment expands its presence on global TV screens", "url": "https://www.koreaherald.com/article/10921714", "fonte_id": "korea_herald", "data_pub": "2026-11-01T04:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A presença de conteúdo coreano em telas internacionais está aumentando, com empresas de entretenimento buscando novos fluxos de receita para compensar custos crescentes e vendas publicitárias domésticas lentas. A gigante CJ ENM lançou o 'CJ ENM K-Dance', um canal dedicado ao dance coreano no Norte América através da LG Channels.", "titulo_pt": "Indústria de entretenimento sul-coreana expande presença em telas internacionais", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 238793, "titulo": "The Art of Red Tape: On Mary Ellen Carroll", "url": "https://www.artforum.com/columns/kat-herriman-mary-ellen-carroll-1234762509/", "fonte_id": "artforum", "data_pub": "2026-11-01T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A artista Mary Ellen Carroll é conhecida por suas ações ousadas e manobras burocráticas.", "titulo_pt": "A arte da papelada: sobre Mary Ellen Carroll", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 238794, "titulo": "Future Nostalgia", "url": "https://www.artforum.com/columns/benjamin-paul-future-nostalgia-1234762572/", "fonte_id": "artforum", "data_pub": "2026-11-01T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a dimensão emancipatória do nostalgia, com foco na perspectiva de Benjamin Paul.", "titulo_pt": "Future Nostalgia", "veiculo"  Linares", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 238531, "titulo": "English children’s homes are in crisis. Does Denmark hold the answers?", "url": "https://www.theguardian.com/society/2026/nov/01/english-childrens-homes-crisis-denmark-care-system-model", "fonte_id": "guardian_world", "data_pub": "2026-11-01T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro britânico dos Assuntos Infantis, Josh MacAlister, visitou Copenhague para estudar o sistema de casas para crianças da Dinamarca. As casas para crianças dinamarquesas são frequentemente consideradas o padrão mundial em cuidados residenciais para crianças e estão sendo analisadas pelo governo britânico.", "titulo_pt": "Casas para crianças no reino unido estão em crise. A dinamarca pode ter respostas?", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 238334, "titulo": "Governo age para conter casos de assédio e violência após Eleições 2026", "url": "https://www.metropoles.com/brasil/governo-age-para-conter-casos-de-assedio-e-violencia-apos-eleicoes-2026", "fonte_id": "metropoles", "data_pub": "2026-11-01T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Relatos de assédio e intimidação a funcionários foram divulgados nas redes sociais após as eleições. O governo está investigando esses casos e também outros de violência.", "titulo_pt": "Governo age para combater assédio e violência após Eleições 2026", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 238371, "titulo": "Novembro Azul: câncer de próstata é o segundo tipo mais comum em homens", "url": "https://www.cnnbrasil.com.br/saude/novembro-azul-cancer-de-prostata-e-o-segundo-tipo-mais-comum-em-homens/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-01T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O câncer de próstata é estimado em mais de 77 mil novos casos por ano até 2028, segundo o Inca. O diagnóstico prec
