</div>

<script>
const D = {"gerado_em": "28/08/2026 07:24", "stats": {"noticias_novas": 858, "resumos_gerados": 250}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O horário eleitoral gratuito começa nesta sexta-feira (28), com propagandas de candidatos a senador, deputado estadual e governador. A governadora de Pernambuco, Raquel Lyra, estreia com um depoimento pessoal sem cortes. Em outra notícia, o projeto aprovado pela Câmara permite que empresas em recuperação judicial continuem operando no mercado secundário de milhas, criando uma possibilidade para empresas que já deram calotes bilionários no passado continuarem atuando. Além disso, a primeira aparição de Lula em propaganda eleitoral ocorrerá neste sábado (29/8), onde ele aparecerá ao lado de Alckmin e defenderá a soberania, criticando Flávio Bolsonaro. Por fim, o ministro Luiz Fux repreendeu um advogado que havia chamado ministros pelo nome e afirmara que o ministro Toffoli havia se retirado do plenário, destacando a importância do respeito nas sessões do STF.", "mundo": "O Nepal enfrenta novos desafios após inundações devastadoras nas montanhas dos Himalaia. A polícia localizou mais áreas de risco e ordenou que as equipes de resgate se protejam. Segundo relatos, pelo menos 472 pessoas foram mortas e mais de 1.500 estão desaparecidas, com o perigo de um lago tibetano transbordar ainda existente. Em um desenvolvimento histórico, o rei Harald V da Noruega faleceu aos 89 anos, sendo sucedido pelo seu filho Haakon, que se tornará o novo monarca. A Coreia do Sul anunciou que realizará exercícios militares conjuntos com os Estados Unidos e Japão, mesmo com o presidente dos EUA, Donald Trump, buscando reativar conversações com a Coreia do Norte. Além disso, as autoridades sul-coreanas anunciaram um plano de orçamento de 2027 para apoiar jovens em diferentes fases da vida, com o presidente Yoon Suk Yeol prometendo expandir as oportunidades para essa faixa etária, considerada o grupo mais vulnerável.\n\nAs tensões geopolíticas continuam a dominar o cenário internacional, com destaque para os conflitos na Ucrânia e no Oriente Médio. A Ucrânia comemora um novo esforço da União Europeia para desbloquear ativos congelados, enquanto as forças russas intensificam os ataques em Donetsk, avançando em direção a Sloviansk e Kramatorsk. Em Gaza, um vídeo mostra crianças buscando abrigo atrás de um carrinho de compras durante um suposto ataque com drone israelense, refletindo a intensificação do conflito. Além disso, o Irã mantém sua postura firme em relação à pressão dos Estados Unidos, com o ministro das Relações Exteriores, Abbas Araghchi, afirmando que a diplomacia não é impossível, mas depende de Washington entender que a pressão não é eficaz. Por outro lado, a China está se aproximando da SK Hynix em termos de receita de NAND e avançando em camadas mais avançadas, enquanto a TotalEnergies reduz sua exposição a gasodutos russos, mas permanece como acionista de projetos de gás natural na Sibéria. Estes eventos refletem a complexidade e a intensidade dos desafios geopolíticos atuais.", "economia": "O mercado financeiro está em atenção especial pela keynote speech de Kevin Warsh no evento de Jackson Hole, com gestores de fundos renomados como JPMorgan, Apollo e Morgan Stanley esperando que uma declaração firme sobre a meta de inflação de 2% possa influenciar a redução dos juros de longo prazo, atualmente acima de 5% há dois meses. A economia será o principal fator para influenciar o voto de aproximadamente 5 milhões de eleitores indecisos entre Lula e Jair Bolsonaro, de acordo com o fundador de um instituto de pesquisa eleitoral. O Brasil pode não precisar processar todos os minerais críticos que produz, segundo um líder de fundo de investimento, embora o argumento de que o país deveria desenvolver o processamento local desses minerais tenha mérito. O Banco Central realizou um leilão de compra e venda de dólares para injetar liquidez no mercado cambial em meio à saída de recursos estrangeiros do país. Além disso, o Conselho Monetário Nacional elevou o limite de remuneração do Eco Invest Brasil, permitindo que as instituições financeiras ganhem até 3% ao ano, o que pode incentivar o financiamento de mais projetos ligados à transformação ecológica.", "tecnologia": "A lei europeia sobre inteligência artificial avançou de uma ideia para a fase de implementação, com um prazo crucial para a aplicação das novas regras de transparência e revelação de informações para chatbots e conteúdo gerado por IA entrando em vigor em 2 de agosto. Outro desenvolvimento importante é que a empresa chinesa de inteligência artificial MiniMax aumentou o teto de compra de seus contratos de computação em nuvem com a Alibaba Group Holding em 220%, alcançando US$ 1,2 bilhão, refletindo a crescente demanda por poder computacional entre os principais desenvolvedores de IA do país. A inteligência artificial também está se tornando mais presente na segurança pública, com a Polícia do Japão planejando expandir o uso de câmeras corporais nacionalmente a partir do próximo ano fiscal, após os ensaios mostrarem que as câmeras são eficazes em fornecer evidências e verificar se os procedimentos de investigação foram seguidos corretamente. Além disso, a inteligência artificial está sendo integrada em diversos setores, como a Méliuz, que listou oito características de uma empresa que adota a abordagem AI-first, e a Dunamu, que anunciou uma parceria com a Visa para desenvolver serviços financeiros e de pagamento baseados em stablecoins e inteligência artificial.", "ciencia": "A Austrália planeja evacuar uma estação de pesquisa sub-Antártica devido ao risco psicossocial potencial de uma possível explosão de influenza avia H5N1, conforme relatado pela Phys.org. Este é um dos eventos mais significativos, pois envolve a saúde pública e a segurança de cientistas em uma região remota. Além disso, a descoberta do vírus H5N1 em um delfim morto em South Australia, também divulgada pela Phys.org, é uma evidência notável do impacto da gripe aviária em diferentes espécies marinhas. Em outro desenvolvimento, a New Scientist destaca que a teoria de Einstein sobre a dilatação do tempo foi confirmada como um fenômeno físico real e também como uma experiência psicológica, com a pesquisa de Karmela Padavic-Callaghan explorando essa questão em seu artigo.", "cultura": "O Museu do Pontal, no Rio de Janeiro, comemora 50 anos com a expansão de seu acervo, recebendo mais de 700 novas obras doadas por artistas, colecionadores e outras instituições. O aniversário será oficializado nesta sexta-feira (28). Em outro destaque cultural, o Festival Forwards em Clifton Down, em Bristol, será o primeiro a funcionar quase exclusivamente com energia limpa, gerada por uma planta de hidrogênio zero emissão e baterias recarregadas com energia sustentável. Lorde, Little Simz e Wet Leg se apresentarão nos palcos deste evento inovador no fim de semana. Além disso, o documentário 'Fidel e Cuba Socialista: Queimar os Céus' estreou em Havana, reúnindo relatos e imagens sobre Fidel Castro e a Revolução Cubana, em um auditório lotado. O Festival Forwards destaca a importância de eventos sustentáveis, enquanto o documentário sobre Fidel Castro celebra a história e a resistência de líderes históricos.", "sociedade": "O Brasil enfrenta um aumento significativo no número de jovens devedores, com mais de 500.000 indivíduos abaixo dos 24 anos estando em mora, conforme um estudo aponta. A facilidade de crédito oferecida pelas fintechs é apontada como uma das principais causas desse fenômeno. Em outro desenvolvimento, o vício em pornografia tem causado danos à saúde comparáveis aos causados pelo uso de drogas, e está se agravando com o avanço da era digital. No Distrito Federal, um professor transformou seu estúdio em um local de crime sexual, estuprando uma de suas vítimas, uma garota de 16 anos, dez vezes e gravando os atos, o que levou a uma intensa investigação. Além disso, o governo de Seul, na Coreia do Sul, planeja realizar uma série de feiras de emprego em setembro, conectando mais de 160 empresas com cerca de 3.000 candidatos de meia-idade, visando auxiliar na recuperação econômica e social dos trabalhadores mais experientes.", "meio_ambiente": "Uma série de desastres naturais e ambientais tem afetado regiões importantes do mundo. Em primeiro lugar, inundações devastadoras na fronteira entre Nepal e Tibet resultaram em pelo menos 270 mortes e mais de 1.400 pessoas desaparecidas. As autoridades chinesas suspenderam os esforços de resgate após a transbordada de um lago no Himalaia, enquanto equipes de resgate em helicóptero trabalham para salvar pessoas presas em um túnel de uma usina hidrelétrica em Nepal. Além disso, um colapso glacial na região causou uma vasta corrente de detritos gelados, resultando em inundações catastróficas. Em segundo lugar, um terremoto de magnitude 5,0 no Tibete, um dia após as enchentes, não afetou diretamente as áreas afetadas pelas inundações, mas destaca o risco crescente de desastres climáticos. Em outras partes do mundo, a estiagem severa na Europa prejudica a agricultura e os recursos hídricos, enquanto o rio Reno na Alemanha está se secando. No Brasil, a Polícia Federal realizou uma operação contra a extração ilegal de madeira em uma área indígena em Rondônia, e o Inmet emitiu alertas de perigo para tempestades em 675 municípios de três estados. No Amazonas, duas empresas venceram um leilão por 267 mil hectares de floresta, concedidos por 35 anos, para investimentos de R$ 2 bilhões.", "direitos_humanos": "Os direitos humanos continuam sendo um tema de controvérsias em diversos países, com casos que abrangem desde a destruição de suprimentos humanitários no Gaza até a detenção de aproximadamente 370 crianças palestinas em prisões israelenses. No Brasil, a Justiça Federal do Pará determinou que o candidato à Presidência Renan Santos apagasse um post com ataques a indígenas, enquanto o governo do Queensland admitiu que uma lei que impõe sentenças obrigatórias de prisão a crianças de 10 anos viola direitos humanos. Em Hong Kong, um advogado alertou contra o crime de doxxing, enquanto a Meta está enviando alertas para pais cujos filhos buscam conteúdo sobre suicídio ou autolesão no Instagram. Além disso, o governo australiano garantiu que não cortará o número anual de refugiados, encerrando planos de reduzir a quota de chegadas em um terço. Esses eventos refletem a complexidade e a importância dos direitos humanos em debates políticos e sociais globais."}, "resumo_do_dia": {"politica_nacional": [{"id": 129224, "titulo": "MPRJ aponta fraude em contrato de R$ 60 mil e mira prefeita de Miracema", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/mprj-aponta-fraude-em-contrato-de-r-60-mil-e-mira-prefeita-de-miracema", "fonte_id": "metropoles", "data_pub": "2026-08-28T09:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público do Rio de Janeiro (MPRJ) apontou uma possível fraude em um contrato no valor de R$ 60 mil, firmado entre a Prefeitura de Miracema e uma empresa recém-estabelecida. A empresa vencedora do contrato tinha apenas 34 dias de funcionamento na data da contratação.", "titulo_pt": "MPRJ denuncia fraude em contrato de R$ 60 mil envolvendo prefeita de Miracema", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 129154, "titulo": "Programa de estreia de Raquel Lyra tem depoimento pessoal e lembrança de tragédia", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/programa-de-estreia-de-raquel-lyra-tem-depoimento-pessoal-e-lembranca-de-tragedia.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-28T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A governadora de Pernambuco, Raquel Lyra (PSD), dá sua estreia no programa eleitoral de TV, apresentando um depoimento pessoal sem cortes sobre sua vida e carreira política. O programa será exibido nesta sexta-feira (28).", "titulo_pt": "Estreia do programa eleitoral de Raquel Lyra traz depoimento pessoal e memória de tragédia", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 129338, "titulo": "O horário eleitoral gratuito e a força do voto na era da IA", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-horario-eleitoral-gratuito-e-a-forca-do-voto-na-era-da-ia", "fonte_id": "jota", "data_pub": "2026-08-28T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As regras do TSE para conteúdo com inteligência artificial enfatizam o papel do horário eleitoral como um espaço auditável para as eleições de 2026.", "titulo_pt": "Regras do tse para conteúdo com IA reforçam papel do horário eleitoral em 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 129339, "titulo": "CFM usa estratégia dos jabutis para obter poderes estranhos à sua natureza", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-fernando-aith/cfm-usa-estrategia-dos-jabutis-para-obter-poderes-estranhos-a-sua-natureza", "fonte_id": "jota", "data_pub": "2026-08-28T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho Federal de Medicina (CFM) está utilizando uma estratégia semelhante à dos 'jabutis' para obter poderes não condizentes com sua natureza institucional. Segundo o levantamento, 80% das emendas parlamentares à Medida Provisória do Enamed são sugestões relacionadas ao órgão.", "titulo_pt": "CFM usa estratégia dos jabutis para obter poderes estranhos à sua natureza", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 129340, "titulo": "Simples Nacional: um modelo que arrecada, emprega e promove inclusão", "url": "https://www.jota.info/opiniao-e-analise/artigos/simples-nacional-um-modelo-que-arrecada-emprega-e-promove-inclusao", "fonte_id": "jota", "data_pub": "2026-08-28T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O modelo Simples Nacional concentra 34% das empresas do país e responde por quase um terço dos empregos formais do Brasil.", "titulo_pt": "Simples Nacional: um modelo que arrecada, emprega e promove inclusão", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 129233, "titulo": "PL das milhas dá brecha para empresas que deram calote bilionário", "url": "https://www.metropoles.com/colunas/tacio-lorran/pl-das-milhas-da-brecha-para-empresas-que-deram-calote-bilionario", "fonte_id": "metropoles", "data_pub": "2026-08-28T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto aprovado pela Câmara permite que empresas em recuperação judicial continuem operando no mercado secundário de milhas. Isso cria uma possibilidade para empresas que já deram calotes bilionários no passado continuarem atuando no mercado.", "titulo_pt": "PL das milhas abre espaço para empresas que deram calote bilionário", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 129342, "titulo": "Educação política: da obrigação legal à experiência democrática", "url": "https://www.jota.info/opiniao-e-analise/artigos/educacao-politica-da-obrigacao-legal-a-experiencia-democratica", "fonte_id": "jota", "data_pub": "2026-08-28T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Lei 15.468 reaviva o debate sobre a importância da escola na formação cidadã.", "titulo_pt": "Educação política: da obrigação legal à experiência democrática", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 129299, "titulo": "Rádio e TV ainda podem ajudar a definir eleições, avaliam especialistas", "url": "https://www.cnnbrasil.com.br/eleicoes/radio-e-tv-ainda-podem-ajudar-a-definir-eleicoes-avaliam-especialistas/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-28T07:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O horário eleitoral gratuito começa nesta sexta-feira (28) e está competindo com a propaganda nas redes sociais pelo espaço nas mídias.", "titulo_pt": "Rádio e TV ainda podem influenciar eleições, dizem especialistas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 129238, "titulo": "Lula estreia propaganda eleitoral com Alckmin e defesa da soberania", "url": "https://www.metropoles.com/brasil/lula-estreia-propaganda-eleitoral-com-alckmin-e-defesa-da-soberania", "fonte_id": "metropoles", "data_pub": "2026-08-28T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A primeira aparição de Lula em propaganda eleitoral ocorrerá neste sábado (29/8), onde ele aparecerá ao lado de Alckmin e defenderá a soberania. O programa também incluirá críticas a Flávio Bolsonaro.", "titulo_pt": "Lula estreia propaganda eleitoral com Alckmin e críticas a flávio bolsonaro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 129303, "titulo": "Congresso instala nesta sexta comissão sobre fim da taxa das blusinhas", "url": "https://www.cnnbrasil.com.br/politica/congresso-instala-nesta-sexta-comissao-sobre-fim-da-taxa-das-blusinhas/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-28T07:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A comissão para discutir o fim da taxa das blusinhas foi instalada nesta sexta-feira. O colegiado será presidido pelo deputado federal Reginaldo Lopes (PT-MG) e terá a senadora Leila Barros (PDT-DF) como relatora.", "titulo_pt": "Congresso instala comissão sobre fim da taxa das blusinhas nesta sexta", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 129305, "titulo": "Horário eleitoral começa no rádio e na TV nesta sexta-feira (28)", "url": "https://www.cnnbrasil.com.br/eleicoes/horario-eleitoral-comeca-no-radio-e-na-tv-nesta-sexta-feira-28/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-28T07:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O horário eleitoral começa nesta sexta-feira (28) com propagandas de candidatos a senadores, deputados estaduais e governadores. Os programas dos presidenciáveis e dos elegíveis a deputados federais iniciam no sábado (29).", "titulo_pt": "Horário eleitoral começa no rádio e na TV nesta sexta-feira (28)", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 129306, "titulo": "STF retoma julgamento de plano estratégico da Corte até 2031", "url": "https://www.cnnbrasil.com.br/politica/stf-retoma-julgamento-de-plano-estrategico-da-corte-ate-2031/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-28T07:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O julgamento do plano estratégico do STF para os próximos 10 anos foi retomado. O processo estava paralisado desde março devido a um pedido de vista de Gilmar Mendes, e até o momento, Fachin e cinco outros ministros já votaram a favor da aprovação.", "titulo_pt": "STF retoma julgamento do plano estratégico da Corte até 2031", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 129155, "titulo": "Juiz com aposentadoria cassada não consegue anular ato do TJ-SP", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/frederico-vasconcelos/2026/08/juiz-com-aposentadoria-cassada-nao-consegue-anular-ato-do-tj-sp.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-28T07:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um juiz com aposentadoria cassada não conseguiu anular um ato do TJ-SP. Durante investigações sobre o desembargador Arthur Del Guércio, a resistência de magistrados a reconhecer a corrupção entre juízes, mesmo que excepcional, prejudicou iniciativas do presidente Ivan Sartori.", "titulo_pt": "Juiz com aposentadoria cassada não consegue anular ato do TJ-SP", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 129156, "titulo": "Vínculos com o crime superam caso Master e corrupção em ataques nas eleições do governo do RJ", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/vinculos-com-o-crime-superam-caso-master-e-corrupcao-em-ataques-nas-eleicoes-do-governo-do-rj.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-28T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Supostos vínculos com o crime organizado são as principais armas de ataque entre os candidatos ao Governo do Rio de Janeiro. Este tema supera as acusações de corrupção, incluindo o caso Master, que influenciou a decisão de ex-governador Cláudio Castro de não se candidatar ao Senado.", "titulo_pt": "Vínculos com o crime organizado superam corrupção em ataques nas eleições do governo do RJ", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 129158, "titulo": "Redes ligadas a argentino miram Lula com desinformação sobre migração marroquina em SC", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/redes-ligadas-a-argentino-miram-lula-com-desinformacao-sobre-migracao-marroquina-em-sc.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-28T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Contas de redes sociais argentinas, ligadas a consultores e influenciadores próximos ao presidente Javier Milei, promovem uma campanha que acusa o governo Lula de estar impulsionando uma suposta 'invasão' de imigrantes marroquinos em Santa Catarina.", "titulo_pt": "Redes argentinas miram Lula com desinformação sobre imigração marroquina em SC", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 129312, "titulo": "Estreia de Lula na TV vai “comparar biografias”; Flávio focará em segurança", "url": "https://www.cnnbrasil.com.br/eleicoes/estreia-de-lula-na-tv-vai-comparar-biografias-flavio-focara-em-seguranca/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-28T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A propaganda eleitoral gratuita para os candidatos presidenciais começa no sábado (29). Luiz Inácio Lula da Silva terá 5 minutos e 31 segundos, enquanto Flávio Dino, do PL, terá 4 minutos e 20 segundos.", "titulo_pt": "Estreia de Lula na TV vai ‘comparar biografias’; Flávio focará em segurança", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 129478, "titulo": "Live Updates: New Nepal Flood Warning Clouds Desperate Search for Survivors", "url": "https://www.nytimes.com/live/2026/08/28/world/nepal-tibet-flash-floods", "fonte_id": "nyt_world", "data_pub": "2026-08-28T09:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia nepalesa advertiu as pessoas para buscar abrigo, pois há a possibilidade de mais água inundar aldeias afetadas. A China informou que o risco de um lago tibetano transbordar 'gradualmente diminuiu'.", "titulo_pt": "Atualizações em tempo real: novo aviso de cheias na Nepal acomplica busca desesperada por sobreviventes", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 129657, "titulo": "Nepal: army rescues hundreds as diaspora mourns lives lost", "url": "http://www.euronews.com/video/2026/08/28/nepal-army-rescues-hundreds-as-diaspora-mourns-lives-lost", "fonte_id": "euronews", "data_pub": "2026-08-28T09:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O exército nepalesês resgatou centenas de pessoas de um túnel hidrelétrico inundado, enquanto mais de 1.500 pessoas permanecem desaparecidas. Simultaneamente, a comunidade nepalesa no exterior realiza vigília em Nova York.", "titulo_pt": "Nepal: exército resgata centenas enquanto comunidade no exterior se solidariza", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 129179, "titulo": "Nepal manda socorristas se protegerem após novo risco", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/08/nepal-manda-socorristas-se-protegerem-apos-novo-risco.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-28T09:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As autoridades do Nepal ordenaram que as equipes de resgate se protejam após o rompimento de um lago formado por um deslizamento recente no Tibete, aumentando o risco de novas enxurradas. As inundações já haviam causado mortes.", "titulo_pt": "Nepal orienta equipes de resgate a se protegerem após novo risco", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 129617, "titulo": "Uganda's King of Tooro, once world's youngest reigning monarch, dies at 34", "url": "https://www.france24.com/en/africa/20260828-uganda-s-king-of-tooro-once-world-s-youngest-reigning-monarch-dies-at-34", "fonte_id": "france24", "data_pub": "2026-08-28T09:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O rei Oyo Nyimba, líder do reino de Tooro na Uganda ocidental, faleceu aos 34 anos, conforme anunciou o primeiro-ministro do seu reino. Coronado aos três anos de idade, tornou-se o monarca mais jovem do mundo a reinar em 1995.", "titulo_pt": "Rei de Tooro, o mais jovem monarca do mundo, morre aos 34 anos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 129618, "titulo": "Nepal flash floods: 'Very challenging' for survivors who have lost their homes and their families", "url": "https://www.france24.com/en/video/20260828-nepal-flash-floods-very-challenging-for-survivors-who-have-lost-their-homes-and-their-families", "fonte_id": "france24", "data_pub": "2026-08-28T09:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sunita Sharma, da Karuna-Shechen, destaca que, embora Nepal tenha experiência em responder a desastres naturais, a escala atual da destruição exige maior ênfase em preparação. Os imediatos desafios incluem encontrar sobreviventes, fornecer água potável, alimentos, abrigo, roupas e medicamentos, mas a recuperação deve ir além, com o objetivo de reconstruir a confiança e as comunidades.", "titulo_pt": "Nepal: desafio para sobreviventes após inundações", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 129619, "titulo": "El Niño, paired with climate change, 'just makes everything so much more dangerous'", "url": "https://www.france24.com/en/video/20260828-el-ni%C3%B1o-paired-with-climate-change-just-makes-everything-so-much-more-dangerous", "fonte_id": "france24", "data_pub": "2026-08-28T09:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gareth Redmond-King, do Energy and Climate Intelligence Unit, alerta que a combinação de El Niño com mudanças climáticas está intensificando os eventos climáticos extremos e aumentando a instabilidade do sistema climático. Isso torna as condições já perigosas ainda mais severas.", "titulo_pt": "El Niño, associado ao aquecimento global, 'aumenta ainda mais a gravidade dos eventos climáticos extremos'", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 129645, "titulo": "Russian forces intensify attacks in Donetsk as Ukraine lauds fresh EU push to unlock frozen assets", "url": "https://www.cnbc.com/2026/08/28/russia-donetsk-ukraine-frozen-assets.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-28T09:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças russas intensificaram os ataques em Donetsk, enquanto a Ucrânia comemora um novo esforço da União Europeia para desbloquear ativos congelados. As tropas russas afirmam avanços em direção a Sloviansk e Kramatorsk, com o combate acentuando-se na região.", "titulo_pt": "Forças russas intensificam ataques em Donetsk enquanto Ucrânia celebra nova proposta da ue para desbloquear ativos congelados", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 129483, "titulo": "Who Is Haakon, Norway’s New King?", "url": "https://www.nytimes.com/2026/08/28/world/europe/norway-new-king-haakon.html", "fonte_id": "nyt_world", "data_pub": "2026-08-28T09:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Crown Prince Haakon, filho único do Rei Harald V da Noruega, herdará o trono, cargo que é principalmente cerimonial e simbólico.", "titulo_pt": "Quem é Haakon, o novo rei da noruega?", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 129620, "titulo": "Nepal flood disaster reconstructed minute by minute", "url": "https://www.france24.com/en/nepal-flood-disaster-reconstructed-minute-by-minute", "fonte_id": "france24", "data_pub": "2026-08-28T09:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novas imagens de satélite e análise de vídeo mostram que as inundações letais no Nepal começaram com a colapso de uma geleira perto da fronteira com a China, que gerou um fluxo de detritos que avançou a até 150 km/h, devastando comunidades ao longo de mais de 80 quilômetros. As autoridades alertam que o desastre pode não ter terminado, pois um novo lago formado upstream começou a transbordar.", "titulo_pt": "Nepal: inundações mortais reconstruídas minuto a minuto", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 129621, "titulo": "China's lost children: Adoptees search for answers", "url": "https://www.france24.com/en/tv-shows/reporters/20260828-china-s-lost-children-adoptees-search-for-answers", "fonte_id": "france24", "data_pub": "2026-08-28T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante o auge da polêmica política de um filho por família na China, crianças eram separadas de suas famílias biológicas e colocadas para adoção. Yena Lee da FRANCE 24 acompanha uma adotada adulta em sua busca por informações sobre seu passado.", "titulo_pt": "Crianças perdidas da china: adotados buscam responder sobre suas origens", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 129766, "titulo": "Arriva il memoir di Sonia Gandhi, Belonging: un viaggio d'amore, in Italia per Rizzoli", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/28/arriva-il-memoir-di-sonia-gandhi-belonging-un-viaggio-damore-in-italia-per-rizzoli_c2837ad7-bac5-4448-8ce2-56363a50454d.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-28T09:19:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O livro memoir de Sonia Gandhi, intitulado 'Belonging: un viaggio d'amore', está disponível nas livrarias nos Estados Unidos a partir do dia 10 de novembro. A publicação será lançada na Itália pela editora Rizzoli.", "titulo_pt": "Chega o memoir de Sonia Gandhi, 'pertencendo: um viagem de amor'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 129622, "titulo": "In Tibet and Nepal, 'the most pressing fear is that the death toll could rise'", "url": "https://www.france24.com/en/in-tibet-and-nepal-the-most-pressing-fear-is-that-the-death-toll-could-rise", "fonte_id": "france24", "data_pub": "2026-08-28T09:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 472 pessoas foram mortas e mais de 1.500 estão desaparecidas após inundações devastadoras nos Himalayos, na fronteira entre Nepal e China. A preocupação maior é que o número de mortos possa aumentar, já que as autoridades alertam para a possibilidade de uma represa upstream transbordar e causar mais inundações.", "titulo_pt": "Na Índia e Nepal, o maior medo é que o número de mortos continue a aumentar", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 129623, "titulo": "EU wants Meta to extend US teen safety restrictions to Europe", "url": "https://www.france24.com/en/eu-wants-meta-to-extend-us-teen-safety-restrictions-to-europe", "fonte_id": "france24", "data_pub": "2026-08-28T09:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Europeia está pressionando a Meta a adotar as mesmas proteções para menores de 18 anos em toda a Europa que foram acordadas nos Estados Unidos, incluindo limites de tempo de tela e controles parentais mais fortes no Facebook e no Instagram. Além disso, Bruxelas está exigindo medidas adicionais.", "titulo_pt": "Ue quer que Meta estenda proteções para jovens nos EUA a Europa", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 129531, "titulo": "The SCO’s Diminishing Usefulness for India", "url": "https://foreignpolicy.com/2026/08/28/sco-shanghai-cooperation-organisation-summit-india-china-pakistan-russia-bishkek/", "fonte_id": "foreign_policy", "data_pub": "2026-08-28T09:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Shanghai Cooperation Organisation, dominado pela China, oferece poucos benefícios para Nova Deli, similar à experiência do Brasil na organização BRICS.", "titulo_pt": "A menor utilidade do SCO para a Índia", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 129767, "titulo": "Botta e risposta Meloni-Bonaccini,'per voi ignorante chi vota destra', 'ammonivo sinistra'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/28/botta-e-risposta-meloni-bonacciniper-voi-ignorante-chi-vota-destra-ammonivo_9ad660ed-b7df-4602-ba71-32e10210ced2.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-28T09:11:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A primeira-ministra italiana Giorgia Meloni criticou o presidente do Partido Democrata (PD), Andrea Bonaccini, afirmando que quem vota à direita precisa ser reeducado. Meloni respondeu a uma declaração de Bonaccini, que havia acusado o governo de ignorância.", "titulo_pt": "Bota e risposta Meloni-Bonaccini, 'para você ignorante que vota à direita', 'eu advertia os da esquerda'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 129624, "titulo": "US : Tate brothers remain in jail as judge delays bail decision", "url": "https://www.france24.com/en/us-tate-brothers-remain-in-jail-as-judge-delays-bail-decision", "fonte_id": "france24", "data_pub": "2026-08-28T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os irmãos Andrew e Tristan Tate permanecem detidos em Miami após um juiz federal negar um pedido de liberdade sob caução enquanto eles são processados pela extradição para o Reino Unido. Lá, eles enfrentam acusações que incluem estupro, agressão, tráfico humano e lavagem de dinheiro, mas continuam negando qualquer envolvimento e alegam que suas personalidades online eram fictícias.", "titulo_pt": "EUA: irmãos tate permanecem na prisão enquanto juiz nega liberdade sob caução", "veiculo": "France 24", "pais": "França", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 129281, "titulo": "Mercado pressiona para que fala de Warsh seja capaz de derrubar juros de longo prazo", "url": "https://www.infomoney.com.br/mercados/mercado-discurso-warsh-jackson-hole-juros-longos-treasuries/", "fonte_id": "infomoney", "data_pub": "2026-08-28T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Gestores de fundos da JPMorgan, Apollo e Morgan Stanley consideram que uma declaração firme de Warsh sobre a meta de 2% de inflação pode influenciar a redução dos juros de longo prazo, que atualmente estão acima de 5% há dois meses.", "titulo_pt": "Mercado pressiona para que fala de Warsh seja capaz de derrubar juros de longo prazo", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 129333, "titulo": "Economia vai decidir eleição, e não o caso Lulinha, diz fundador de instituto de pesquisa", "url": "https://www.bbc.com/portuguese/articles/cqlwry4xk6lo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-28T09:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O fundador de um instituto de pesquisa eleitoral afirma que a economia será o principal fator para influenciar o voto de aproximadamente 5 milhões de eleitores indecisos entre Lula e Flávio Bolsonaro.", "titulo_pt": "Economia vai decidir eleição, e não o caso Lulinha, diz fundador de instituto de pesquisa", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 129317, "titulo": "EXCLUSIVO. Equatorial quer vender a Echoenergia, sua empresa de renováveis", "url": "https://braziljournal.com/exclusivo-equatorial-quer-vender-a-echoenergia-sua-empresa-de-renovaveis/", "fonte_id": "brazil_journal", "data_pub": "2026-08-28T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Equatorial Energia iniciou um processo para a potencial venda de sua subsidiária de geração eólica e solar, a Echoenergia. A transação ainda está em fase inicial, com alguns grupos se preparando para fazer uma due diligence dos ativos.", "titulo_pt": "EXCLUSIVO: equatorial planeja vender a Echoenergia, sua empresa de energia renovável", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 129318, "titulo": "A empresa por trás da Festa de Barretos, que fez do sertanejo um ‘big business’", "url": "https://braziljournal.com/a-empresa-por-tras-da-festa-de-barretos-que-fez-do-sertanejo-um-big-business/", "fonte_id": "brazil_journal", "data_pub": "2026-08-28T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cidade de Barretos, no estado de São Paulo, está organizando sua 71ª Festa do Peão, a maior festa sertaneja do Brasil, que vai receber 1 milhão de pessoas em 11 dias. A DVT, uma empresa fundada há mais de 30 anos, está por trás de grande parte desse público.", "titulo_pt": "A empresa por trás da Festa de Barretos, que fez do sertanejo um 'big business'", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 129139, "titulo": "Brasil não precisa processar todo mineral crítico que produz, diz líder de fundo de investimento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/brasil-nao-precisa-processar-todo-mineral-critico-que-produz-diz-lider-de-fundo-de-investimento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-28T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil não precisa processar todos os minerais críticos que produz, segundo um líder de fundo de investimento. O argumento de que o país deveria desenvolver o processamento local desses minerais tem mérito, mas precisa ser abordado com mais profundidade.", "titulo_pt": "Brasil não precisa processar todo mineral crítico que produz, diz investidor", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 129140, "titulo": "Fundo britânico pensa em explorar terras raras no Brasil, mas vê minerais críticos como prioridade", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/fundo-britanico-pensa-em-explorar-terras-raras-no-brasil-mas-ve-minerais-criticos-como-prioridade.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-28T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O fundo britânico Appian Capital está considerando a exploração de terras raras no Brasil, embora ainda não tenha projetos relacionados em seu portfólio. A empresa afirma que a ausência de projetos não indica que não estejam sendo mapeadas novas oportunidades.", "titulo_pt": "Fundo britânico considera exploração de terras raras no Brasil, mas mantém foco em minerais críticos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 129647, "titulo": "Treasury yields tread water with all eyes on Kevin Warsh's Jackson Hole keynote speech", "url": "https://www.cnbc.com/2026/08/28/treasury-yields-jackson-hole.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-28T08:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos do Tesouro não apresentaram grandes mudanças. Todos os olhares estão voltados para a keynote speech de Kevin Warsh no evento de Jackson Hole.", "titulo_pt": "Rendimentos do tesouro mantêm-se estáveis com foco na keynote de Kevin Warsh em Jackson Hole", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 129341, "titulo": "SICX: breves considerações sobre o Decreto 13.106/26", "url": "https://www.jota.info/opiniao-e-analise/artigos/sicx-breves-consideracoes-sobre-o-decreto-13-106-26", "fonte_id": "jota", "data_pub": "2026-08-28T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Sistema de Compras Expressas tem uma aparência semelhante ao marketing digital, mas isso é apenas uma impressão superficial. O decreto 13.106/26 trata desse sistema de compras.", "titulo_pt": "SICX: breves considerações sobre o Decreto 13.106/26", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 129298, "titulo": "Setor florestal pode transformar potencial do mercado de carbono no Brasil", "url": "https://www.cnnbrasil.com.br/agro/setor-florestal-pode-transformar-potencial-do-mercado-de-carbono-no-brasil/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-28T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O setor florestal brasileiro possui mais de 10,5 milhões de hectares de árvores cultivadas e pode transformar o potencial do mercado de carbono em oportunidades econômicas.", "titulo_pt": "Setor florestal pode transformar potencial do mercado de carbono no Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 129343, "titulo": "A tributação dos créditos de carbono", "url": "https://www.jota.info/opiniao-e-analise/colunas/women-in-tax-brazil/a-tributacao-dos-creditos-de-carbono", "fonte_id": "jota", "data_pub": "2026-08-28T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reforma tributária discute a tributação de créditos de carbono, levantando questões relacionadas a IBS e CBS. Este tema envolve desafios e impasses na implementação da reforma.", "titulo_pt": "Tributação de créditos de carbono: impasses na reforma tributária", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 129824, "titulo": "China chip profits jump 18.5-fold on AI demand; advanced-node self-sufficiency seen at 66% by 2035", "url": "https://www.digitimes.com/news/a20260828VL205/demand-2035-self-sufficiency-investment-capacity.html", "fonte_id": "digitimes", "data_pub": "2026-08-28T07:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As investidas chinesas em inteligência artificial estão levando a um aumento significativo dos lucros das empresas de semicondutores, acelerando a expansão a longo prazo da capacidade de produção de semicondutores avançados, produção de memórias e equipamentos para fabricação de chips no país.", "titulo_pt": "Investimento chinês em IA impulsiona lucros de semicondutores e expande capacidade doméstica de produção", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 129870, "titulo": "S. Korean won hits over 13-month high on dollar selling", "url": "https://en.yna.co.kr/view/AEN20260828008600320", "fonte_id": "yonhap_news", "data_pub": "2026-08-28T07:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O iene sul-coreano continuou a ganhar valor e atingiu seu nível mais alto em mais de 13 meses, devido à venda de dólares.", "titulo_pt": "Iene sul-coreano atinge nível mais alto em mais de 13 meses", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 129143, "titulo": "Mercado de baterias para armazenar energia é dominado pela China e vive era da euforia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/mercado-de-baterias-para-armazenar-energia-e-dominado-pela-china-e-vive-era-da-euforia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-28T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No Brasil, um leilão de baterias para armazenamento de energia previsto para o fim do ano desperta interesse de empresas e entidades. No mundo, projetos de armazenamento de energia através de baterias estão crescendo rapidamente.", "titulo_pt": "Mercado de baterias para armazenar energia é dominado pela China e vive era da euforia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 129659, "titulo": "Tanker pays record $5.3m to transit Panama Canal amid El Niño drought", "url": "http://www.euronews.com/2026/08/28/tanker-pays-record-53m-to-transit-panama-canal-amid-el-nino-drought", "fonte_id": "euronews", "data_pub": "2026-08-28T06:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um navio de petróleo pagou um recorde de $5,3 milhões para transitar pelo Canal de Panamá durante a seca do El Niño. O canal é usado principalmente pelos Estados Unidos, China, Japão, Chile e Coreia do Sul.", "titulo_pt": "Tanque paga recorde de $5,3mi para transitar no Canal de panamá durante seca do El Niño", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 129265, "titulo": "Shein vai lançar ações na bolsa — como o brasileiro pode participar", "url": "https://exame.com/invest/mercados/shein-vai-lancar-acoes-na-bolsa-como-o-brasileiro-pode-participar/", "fonte_id": "exame", "data_pub": "2026-08-28T05:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Shein, uma varejista chinesa, está planejando lançar suas ações na bolsa de Hong Kong, o que pode movimentar US$ 1,77 bilhão e avaliar a empresa em US$ 27 bilhões. O IPO da Shein pode oferecer oportunidades para investidores brasileiros participarem desse evento.", "titulo_pt": "Shein vai listar ações na bolsa de hong kong — como o brasileiro pode se beneficiar", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 129734, "titulo": "US corporate profits surge to record as worker payouts wilt", "url": "https://www.ft.com/content/6f3ada65-c56c-499c-8eb6-008fac58949d?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-28T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As lucras líquidas das empresas americanas atingiram o maior percentual da renda nacional desde o pós-guerra mundial. Os pagamentos aos trabalhadores, no entanto, diminuíram em comparação com o passado.", "titulo_pt": "Lucros corporativos dos EUA atingem recorde enquanto pagamentos aos trabalhadores se reduzem", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 129853, "titulo": "There Are So Many Conspiracy Theories About Dolly Parton and Vaccines", "url": "https://www.wired.com/story/there-are-so-many-conspiracy-theories-about-dolly-parton-and-vaccines/", "fonte_id": "wired", "data_pub": "2026-08-28T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Conspiracy teóricos influentes à direita e comentaristas alinhados ao movimento MAGA estão falsamente afirmando que a vacina contra a Covid-19 matou Dolly Parton, uma defensora da vacinação e filantropo.", "titulo_pt": "Há muitas teorias da conspiração sobre Dolly Parton e vacinas", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 129598, "titulo": "The EU AI Act gets real", "url": "https://www.axios.com/2026/08/28/eu-ai-act-gets-real", "fonte_id": "axios", "data_pub": "2026-08-28T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A lei europeia sobre inteligência artificial passou de uma ideia para a fase de implementação. Um prazo crucial para a aplicação das novas regras de transparência e revelação de informações para chatbots e conteúdo gerado por IA entrou em vigor em 2 de agosto.", "titulo_pt": "A lei europeia de IA passa para a fase de execução", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 129361, "titulo": "Luz, câmera… IA: como a tecnologia invadiu a TV e o cinema sem pedir licença", "url": "https://veja.abril.com.br/cultura/luz-camera-ia-como-a-tecnologia-invadiu-a-tv-e-o-cinema-sem-pedir-licenca/", "fonte_id": "veja", "data_pub": "2026-08-28T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial, vista com desconfiança e preconceito na indústria criativa, tem se imposto e já se consolida no audiovisual.", "titulo_pt": "Luz, câmera… IA: como a tecnologia invadiu a TV e o cinema sem pedir licença", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 129844, "titulo": "How to sign up for a virtual power plant—and decide whether you should", "url": "https://www.technologyreview.com/2026/08/28/1142956/how-to-sign-up-for-a-virtual-power-plant-and-decide-whether-you-should/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um virtual power plant (VPP) é uma coleção de dispositivos domésticos como termostatos, veículos elétricos, baterias de casa e sistemas HVAC, que as empresas de energia estão cada vez mais tratando como uma pequena central elétrica. Este guia explica como se inscrever em um VPP e avaliar se isso é vantajoso para você.", "titulo_pt": "Como se inscrever em um virtual power plant e decidir se você deve participar", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 129854, "titulo": "How an Atlanta Suburb Ended Up Sharing Flock Data With More Than 2,000 Organizations", "url": "https://www.wired.com/story/how-an-atlanta-suburb-ended-up-sharing-flock-data-with-more-than-2000-organizations/", "fonte_id": "wired", "data_pub": "2026-08-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cidade de Alpharetta, na Georgia, compartilha dados com mais de 2000 usuários do aplicativo Flock, incluindo agências federais e comissões de pesca e vida selvagem. Isso ilustra a extensão e a natureza invasiva da rede do aplicativo.", "titulo_pt": "Subúrbio de Atlanta compartilha dados Flock com mais de 2000 organizações", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 129743, "titulo": "Toyota sales fall for six straight months on weak China demand", "url": "https://www.japantimes.co.jp/business/2026/08/28/companies/toyota-sales-july/", "fonte_id": "japan_times", "data_pub": "2026-08-28T08:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas da Toyota caíram por seis meses consecutivos devido à baixa demanda no mercado chinês, onde a concorrência entre fabricantes locais está diminuindo a competitividade dos importados. Turbulências na região do Oriente Médio interromperam rotas de suprimento críticas e fizeram os preços do petróleo dispararem, afetando ainda mais as operações da empresa.", "titulo_pt": "Vendas da toyota caem por seis meses seguidos devido à fraca demanda na China", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 129799, "titulo": "MiniMax expands Alibaba cloud pact as compute needs surge for training and inference", "url": "https://www.scmp.com/tech/article/3365558/minimax-expands-alibaba-cloud-pact-compute-needs-surge-training-and-inference?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-28T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa chinesa de inteligência artificial MiniMax aumentou o teto de compra de seus contratos de computação em nuvem com a Alibaba Group Holding em 220% para US$ 1,2 bilhão, refletindo a crescente demanda por poder computacional entre os principais desenvolvedores de IA do país. A empresa planeja gastar até US$ 300 milhões com serviços da Alibaba Cloud este ano, quase três vezes mais do que seu limite original de US$ 115 milhões.", "titulo_pt": "Minimax amplia contrato com nuvem da Alibaba para us$ 1,2 bilhão", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 129868, "titulo": "Army launches drone, robot tactical demonstration unit", "url": "https://en.yna.co.kr/view/AEN20260828009100315", "fonte_id": "yonhap_news", "data_pub": "2026-08-28T07:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Exército sul-coreano lançou uma nova unidade tática de drones e robôs. A informação foi divulgada em 28 de agosto pela agência Yonhap.", "titulo_pt": "Exército sul-coreano lança unidade tática com drones e robôs", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 129745, "titulo": "Japan to incorporate AI into the handling of emergency calls", "url": "https://www.japantimes.co.jp/news/2026/08/28/japan/emergency-call-operations-ai/", "fonte_id": "japan_times", "data_pub": "2026-08-28T07:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Agência de Gerenciamento de Incêndios e Desastres planeja introduzir um sistema que transcreve automaticamente chamadas de emergência e auxilia o pessoal nas ações subsequentes.", "titulo_pt": "Japão vai incorporar IA no atendimento de chamadas de emergência", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 129801, "titulo": "Japan police to roll out body-worn cameras nationwide in 2027 after trials", "url": "https://www.scmp.com/news/asia/east-asia/article/3365574/japan-police-roll-out-body-worn-cameras-nationwide-2027-after-trials?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-28T07:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Polícia do Japão planeja expandir o uso de câmeras corporais nacionalmente a partir do próximo ano fiscal, após os ensaios mostrarem que as câmeras são eficazes em fornecer evidências e verificar se os procedimentos de investigação foram seguidos corretamente. A Agência Nacional de Polícia solicitou cerca de 170 milhões de ienes (US$1 milhão) para o ano iniciando em abril de 2027 para cobrir os custos relacionados a cerca de 2.000 câmeras.", "titulo_pt": "Polícia japonesa vai implementar câmeras corporais em todo o país em 2027 após ensaios", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 129871, "titulo": "(2nd LD) Seoul stocks snap 3-day rise on tech slump", "url": "https://en.yna.co.kr/view/AEN20260828006652320", "fonte_id": "yonhap_news", "data_pub": "2026-08-28T07:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As bolsas de Seul fecharam significativamente em baixa no dia 28 de agosto, interrompendo uma sequência de três dias de ganhos. O declínio foi atribuído principalmente a uma queda no setor tecnológico.", "titulo_pt": "Seoul encerra em baixa, interrompendo três dias de ganhos", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 129802, "titulo": "Shares in Chinese MLCC makers rise as AI lifts sales and profits", "url": "https://www.scmp.com/tech/article/3365571/shares-chinese-mlcc-makers-rise-ai-lifts-sales-and-profits?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-28T07:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações das principais fabricantes chinesas de capacitores multilayer ceramicos (MLCCs), componentes essenciais para a indústria eletrônica, subiram após a divulgação de resultados positivos do primeiro semestre, impulsionados pela alta demanda relacionada à inteligência artificial.", "titulo_pt": "Ações de fabricantes chineses de mlccs sobem com vendas e lucros robustos devido à AI", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 129887, "titulo": "Innometry ramps up deployment of contactless battery CT system", "url": "https://www.koreaherald.com/article/10855762", "fonte_id": "korea_herald", "data_pub": "2026-08-28T07:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Innometry está acelerando a produção em massa do seu sistema de CT 1PASS-RING avançado, que utiliza um design sem contato para escaneamento de baterias, evitando o manuseio físico que pode danificar as células. Diferentemente dos sistemas tradicionais que usam braços robóticos ou pinças para girar as células de bateria, este sistema avançado utiliza um escâner em formato de anel onde a montagem de X-ray roda em torno de uma célula estática.", "titulo_pt": "Innometry acelera a implementação do sistema de CT sem contato 1pass-ring", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 129876, "titulo": "Suicide drone falls into sea after launch due to minor defect: officials", "url": "https://en.yna.co.kr/view/AEN20260828006800315", "fonte_id": "yonhap_news", "data_pub": "2026-08-28T07:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um drone suicida caiu no mar após o lançamento devido a um pequeno defeito, conforme informaram autoridades. O incidente ocorreu em Seul no dia 28 de agosto.", "titulo_pt": "Drone suicida cai no mar após lançamento devido a defeito", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 129675, "titulo": "US judge blocks Pentagon blacklisting of AI firm Anthropic", "url": "https://www.aljazeera.com/news/2026/8/28/us-judge-blocks-pentagon-blacklisting-of-ai-firm-anthropic?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-28T06:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz dos Estados Unidos suspendeu a blacklistagem do Pentágono contra a empresa de IA Anthropic. A corte determinou que o Pentágono agiu ilegalmente ao punir a empresa por críticas ao governo.", "titulo_pt": "Juiz bloqueia blacklistagem do pentágono contra empresa de IA Anthropic", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 129256, "titulo": "Ex-sócio da Méliuz lista 8 características de uma empresa AI-first no Startup Summit", "url": "https://exame.com/negocios/ex-socio-da-meliuz-lista-8-caracteristicas-de-uma-empresa-ai-first-no-startup-summit/", "fonte_id": "exame", "data_pub": "2026-08-28T06:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ex-sócio da Méliuz listou oito características de uma empresa que adota a abordagem AI-first no Startup Summit. Ele defende que a inteligência artificial deve ser integrada desde o desenvolvimento do produto até áreas como marketing, atendimento e operações.", "titulo_pt": "Ex-sócio da Méliuz lista 8 características de uma empresa AI-first no Startup Summit", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 129941, "titulo": "Where and when to see 2027’s ‘solar eclipse of the century’", "url": "https://www.newscientist.com/article/2586640-where-and-when-to-see-2027s-solar-eclipse-of-the-century/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-08-28T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A total eclipse de sol em 2 de agosto de 2027 será a mais longa até 2114, de acordo com pesquisadores e amantes de eclipses. Muitas pessoas estão ansiosas para ver este fenômeno astronômico.", "titulo_pt": "Onde e quando ver a total eclipse de sol do século em 2027", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 129901, "titulo": "STAT+: In autopsy of failed heart disease study, AstraZeneca raises broader questions about silencer drugs", "url": "https://www.statnews.com/2026/08/28/astrazeneca-ionis-wainua-eplontersen-attr-cm-study-failure-bridgebio-alnylam/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-28T09:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "AstraZeneca detalhou o surpreendente fracasso de um estudo de coração em doença cardíaca, com implicações significativas para um mercado competitivo de bilhões de dólares.", "titulo_pt": "Na autópsia de um estudo falido sobre doenças cardíacas, AstraZeneca levanta questões mais amplas sobre os medicamentos silenciadores", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 129136, "titulo": "Cientistas propõem equipar barata para aplicar medicamento em vítima de desastre", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/cientistas-propoem-equipar-barata-para-aplicar-medicamento-em-vitima-de-desastre.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-28T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas propõem o uso de baratas modificadas geneticamente para transportar medicamentos em áreas afetadas por desastres. Essas baratas gigantes poderiam auxiliar equipes de busca e salvamento distribuindo remédios.", "titulo_pt": "Cientistas sugerem equipar baratas para aplicar medicamentos em vítimas de desastres", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 129356, "titulo": "Descobertas sobre longevidade avançam, mas abrem questão: por que queremos viver sempre mais?", "url": "https://veja.abril.com.br/saude/descobertas-sobre-longevidade-avancam-mas-abrem-questao-por-que-queremos-viver-sempre-mais/", "fonte_id": "veja", "data_pub": "2026-08-28T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa sobre longevidade avança, mas levanta a questão sobre o motivo de querermos viver por mais tempo. A busca por superar o envelhecimento biológico provoca reflexões sobre o sentido de uma vida mais longa.", "titulo_pt": "Descobertas sobre longevidade avançam, mas abrem questão: por que queremos viver sempre mais?", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 129905, "titulo": "Australia to evacuate sub-Antarctic research base over bird flu fears", "url": "https://phys.org/news/2026-08-australia-evacuate-antarctic-base-bird.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T08:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Austrália planeja evacuar os trabalhadores de uma estação de pesquisa em uma ilha remota devido ao risco psicossocial potencial de uma possível explosão de influenza avia H5N1.", "titulo_pt": "Austrália vai evacuar base de pesquisa sub-antártica devido aos temores de gripe aviária", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 129942, "titulo": "Exclusive video of world’s first echidna puggle to be born at a university", "url": "https://www.newscientist.com/article/2586728-a-baby-echidna-has-been-born-in-a-university-for-the-first-time/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-08-28T08:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Echidnas são animais difíceis de serem criados em cativeiro, mas cientistas em Sydney conseguiram fazer com que uma fêmea nelaite um jovem, o que pode melhorar nossa compreensão sobre a evolução da gravidez nos mamíferos.", "titulo_pt": "Vídeo exclusivo do primeiro puggle de ecidna nascido em uma universidade", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 129902, "titulo": "STAT+: Vaccines take center stage at federal autism advisory committee", "url": "https://www.statnews.com/2026/08/28/vaccines-autism-advisory-committee-strategic-plan-boost-research-funding/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-28T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na reunião da comissão consultiva federal sobre autismo, os comentários sobre vacinas dominaram o debate, enquanto se discutia um plano para aumentar o financiamento federal para pesquisa sobre autismo.", "titulo_pt": "Vacinas dominam reunião da comissão federal sobre autismo", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 129903, "titulo": "Opinion: A billing code was supposed to incentivize relationship-based primary care for Medicare patients. It may not be working as hoped", "url": "https://www.statnews.com/2026/08/28/medicare-g2211-code-billing-research-primary-care/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-28T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A medicina de família é muito mais do que o que acontece durante uma visita ao consultório, escreve a médica Ishani Ganguli. Um código de cobrança pretendia incentivar uma medicina de relacionamento para pacientes do Medicare, mas isso não pode estar funcionando como se esperava.", "titulo_pt": "Opinião: um código de cobrança pretendia incentivar a medicina de relacionamento para pacientes do Medicare, mas isso pode não estar funcionando como se esperava", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 129904, "titulo": "Opinion: We quit the CDC last year. The problems we protested remain", "url": "https://www.statnews.com/2026/08/28/cdc-protest-resignations-one-year-later-houry-jernigan-daskalakis/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-28T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pessoa que escreveu o artigo saiu da CDC no ano anterior e afirma que os problemas que denunciou ainda persistem. A disseminação de doenças e os riscos e benefícios das intervenções são questões de ciência, não de ideologia.", "titulo_pt": "Opinião: saímos da CDC no ano passado e os problemas que denunciamos ainda existem", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 129906, "titulo": "Bird flu detected in dead dolphin in South Australia", "url": "https://phys.org/news/2026-08-bird-flu-dead-dolphin-south.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T08:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O vírus H5N1 da gripe aviária foi detectado em um delfim morto em South Australia, de acordo com autoridades locais. Este é o primeiro caso de sua espécie no país.", "titulo_pt": "Gripe aviária detectada em delfim morto em South Australia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 129943, "titulo": "Einstein thought time dilation was both real and not – he was right", "url": "https://www.newscientist.com/article/2586888-einstein-thought-time-dilation-was-both-real-and-not-he-was-right/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-08-28T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A teoria de Einstein sobre a dilatação do tempo foi confirmada como um fenômeno físico real e também como uma experiência psicológica. Karmela Padavic-Callaghan explora as provas disso em seu artigo.", "titulo_pt": "Einstein acreditava que a dilatação do tempo é real e subjetiva – e ele estava correto", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 129944, "titulo": "Read an extract from Chanda Prescod-Weinstein’s The Edge of Space-Time", "url": "https://www.newscientist.com/article/2585736-read-an-extract-from-chanda-prescod-weinsteins-the-edge-of-space-time/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-08-28T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Chanda Prescod-Weinstein explora no primeiro capítulo do livro, selecionado para o clube de leitura da New Scientist em setembro, as vantagens de observar o universo desde perspectivas marginais.", "titulo_pt": "Leia um trecho de Chanda Prescod-Weinstein sobre o limite do espaço-tempo", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 129945, "titulo": "‘Thinking about the edges of space-time can help build a better world’", "url": "https://www.newscientist.com/article/2585251-thinking-about-the-edges-of-space-time-can-help-build-a-better-world/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-08-28T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Chanda Prescod-Weinstein, colunista da New Scientist e autora do livro 'The Edge of Space-Time', discute por que as grandes questões da física são tão importantes.", "titulo_pt": "Pensar nas bordas do espaço-tempo pode ajudar a construir um mundo melhor", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 129503, "titulo": "Dolphin dies from H5 bird flu in SA as researchers withdrawn from sub-Antarctic island over ‘psychosocial risk’", "url": "https://www.theguardian.com/environment/2026/aug/28/dolphin-dies-from-h5-bird-flu-in-sa-as-researchers-withdrawn-from-sub-antarctic-island-over-psychosocial-risk", "fonte_id": "guardian_world", "data_pub": "2026-08-28T07:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um delfim morreu devido à gripe aviária H5 em South Australia, sendo este o segundo mamífero nativo conhecido a contrair o vírus. O governo da Tasmanha relatou a descoberta de aproximadamente 100 pinguins menores mortos em uma ilha tasmânica, mas não foi possível testá-los devido ao seu estado de decomposição.", "titulo_pt": "Delfim morre de gripe aviária H5 em SA; pesquisadores são retirados de ilha subantártica devido a 'risco psicossocial'", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 129746, "titulo": "Japan enters an unusually early flu season", "url": "https://www.japantimes.co.jp/news/2026/08/28/japan/science-health/influenza-season-early/", "fonte_id": "japan_times", "data_pub": "2026-08-28T07:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este ano marca o segundo início mais cedo da temporada de gripe desde que os registros do ministério da saúde começaram em 1999.", "titulo_pt": "Japão entra em uma temporada de gripe incomitantemente precoce", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 129137, "titulo": "Eclipse lunar é observado em várias partes do mundo; veja fotos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/eclipse-lunar-ocorre-nesta-quinta-e-sexta-feira-veja-fotos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-28T04:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um eclipse lunar parcial pode ser observado em várias regiões do mundo entre a noite desta quinta-feira (27) e a madrugada desta sexta-feira (28). O fenômeno ocorre quando a Terra passa entre o Sol e a Lua, projetando sua sombra no satélite natural.", "titulo_pt": "Eclipse lunar parcial é observado em várias partes do mundo; veja fotos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 129316, "titulo": "Roberto de Carvalho: “Ainda sinto a Rita Lee viva em mim”", "url": "https://braziljournal.com/roberto-de-carvalho-ainda-sinto-a-rita-lee-viva-em-mim/", "fonte_id": "brazil_journal", "data_pub": "2026-08-28T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Roberto de Carvalho tocou a música Bandido Coração, composta por Rita Lee para Ney Matogrosso nos anos 1970. Rita Lee ouviu a guitarra de Roberto antes de conhecê-lo e gostou da música.", "titulo_pt": "Roberto de Carvalho: ‘ainda sinto a Rita Lee viva em mim’", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 129936, "titulo": "Foster + Partners unveils plans for autonomous robot construction project", "url": "https://www.dezeen.com/2026/08/28/swift-build-robot-construction-foster-partners/", "fonte_id": "dezeen", "data_pub": "2026-08-28T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A estúdio britânico Foster + Partners, em colaboração com instituições acadêmicas, recebeu financiamento para desenvolver uma frota automatizada de robôs e drones para construção de madeira : "Brasil", "classe": "B"}, {"id": 128770, "titulo": "Cómo incluir a las personas mayores en un Estado cada vez más digitalizado: el desafío que enfrenta Chile", "url": "https://www.latercera.com/tendencias/noticia/como-incluir-a-las-personas-mayores-en-un-estado-cada-vez-mas-digitalizado-el-desafio-que-enfrenta-chile/", "fonte_id": "la_tercera", "data_pub": "2026-08-27T21:41:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Estado chileno está avançando na digitalização de seus processos, o que levanta a necessidade de capacitar e acompanhar as pessoas idosas para que não se sintam excluídas desse novo sistema. Especialistas e autoridades destacam essa importância como desafio para o país.", "titulo_pt": "Como incluir as pessoas idosas em um Estado cada vez mais digitalizado: o desafio que enfrenta o Chile", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 129220, "titulo": "PF faz operação contra extração ilegal de madeira em área indígena", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/pf-faz-operacao-contra-extracao-ilegal-de-madeira-em-area-indigena", "fonte_id": "metropoles", "data_pub": "2026-08-28T09:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal realizou uma operação em Rondônia contra a extração ilegal de madeira em uma área indígena. Durante a ação, duas pessoas foram presas em flagrante por posse ilegal de armas de fogo e munições.", "titulo_pt": "PF realiza operação contra extração ilegal de madeira em área indígena", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 129494, "titulo": "Overflowing lake halts rescue efforts as Nepal-Tibet flood death toll hits 474", "url": "https://www.theguardian.com/world/2026/aug/28/flash-flood-risk-halt-rescue-tibet-nepal-death-toll-china-lake-burst", "fonte_id": "guardian_world", "data_pub": "2026-08-28T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_p , "provavel_duplicata_de": null, "texto_pt": "Um relatório afirma que aproximadamente 370 crianças palestinas estão detidas em prisões israelenses, um número considerado inédito em comparação com períodos anteriores. A maioria está detida nas prisões de Megiddo e Ofer, entre mais de 9.400 prisioneiros e detidos palestinos.", "titulo_pt": "Quase 400 crianças palestinas estão detidas em prisões israelenses, relatório diz", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 128975, "titulo": "Parents who lost children to social media harms question Meta settlement", "url": "https://www.aljazeera.com/economy/2026/8/27/parents-who-lost-children-to-social-media-harms-question-meta?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-27T19:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pais dos Estados Unidos afirmam ter sido 'enganados' quanto à possibilidade de verem provas de que a Meta tinha consciência dos danos causados por seus produtos. Eles questionam um acordo de compensação feito pela empresa.", "titulo_pt": "Pais que perderam filhos por danos nas redes sociais questionam acordo da Meta", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 127870, "titulo": "La Justicia declaró inconstitucional un artículo clave de la nueva ley laboral", "url": "https://www.clarin.com/economia/justicia-declaro-inconstitucional-articulo-clave-nueva-ley-laboral_0_3NtcvPx801.html", "fonte_id": "clarin", "data_pub": "2026-08-27T17:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A justiça declarou inconstitucional o artigo 55 da nova lei laboral, que tratava de forma diferenciada os juízes que iniciaram ações legais antes da aprovação da lei.", "titulo_pt": "Justiça declara inconstitucional artigo da nova lei laboral", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 128448, "titulo": "Artist Gao Zhen Receives Three-Year Prison Sentence for ‘Slandering China’s Heroes’", "url": "https://www.artnews.com/art-news/news/gao-zhen-receives-three-year-prison-sentence-for-slander-1234796095/", "fonte_id": "artnews", "data_pub": "2026-08-27T17:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artista Gao Zhen foi condenado a três anos de prisão por 'calúnia contra heróis chineses'. Amnesty International informou que Gao planeja recorrer da sentença.", "titulo_pt": "Artista Gao Zhen recebe sentença de três anos de prisão por 'calúnia contra heróis chineses'", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 129562, "titulo": "Transitional Justice or Political Retaliation? Bangladesh’s Journalists on Trial", "url": "https://thediplomat.com/2026/08/transitional-justice-or-political-retaliation-bangladeshs-journalists-on-trial/", "fonte_id": "the_diplomat", "data_pub": "2026-08-27T15:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O tribunal bangladesque para crimes cometidos em 1971 está sendo usado para processar jornalistas, testando a linha entre responsabilização e vingança.", "titulo_pt": "Justiça transitória ou retaliação política? Jornalistas em juízo no bangladesh", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 128414, "titulo": "Flash floods in Nepal leave more than 17,000 children in need of urgent humanitarian assistance", "url": "https://www.unicef.org/press-releases/flash-floods-nepal-leave-more-17000-children-need-urgent-humanitarian-assistance", "fonte_id": "unicef", "data_pub": "2026-08-27T13:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Flashões na Nepal deixaram mais de 17.000 crianças em necessidade de assistência humanitária urgente. O UNICEF pede US$17,2 milhões para fornecer uma resposta de emergência e recuperação precoce.", "titulo_pt": "Flashões na Nepal deixam mais de 17.000 crianças em necessidade de assistência humanitária urgente", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 128181, "titulo"
