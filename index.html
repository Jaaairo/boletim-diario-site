<html lang="pt-BR">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

 lado, a Coreia do Sul e os Estados Unidos continuam alinhados em relação à política para a Coreia do Norte e ao processo de desnuclearização da Península Coreana, declarou o Ministro das Relações Exteriores sul-coreano, Cho Hyun. O presidente da Coreia do Sul, Lee Jae Myung, ordenou que o governo reinicie discussões sobre a possibilidade de ingresso do país na CPTPP, uma vez que o Egito fará uma visita oficial à Coreia do Sul nesta semana.\n\nSuspeito de espionagem e traição, August Hanning, ex-chefe do Serviço Federal de Inteligência da Alemanha, foi detido. Em Kosovo, manifestantes se reúnem novamente em Pristina, exigindo mudanças na lei para limitar o poder do Tribunal Especial de Kosovo para crimes de guerra. A Coreia do Sul considera a disculpa de Kiev insuficiente por revelar o transporte de soldados norcoreanos. Forças do governo do Iêmen avançaram sobre Dhubab, perto do estreito de Bab el-Mandeb, em uma operação apoiada por 100 aviões da coalizão saudita. O mercado de petróleo permanece tenso devido ao risco de interrupções nas suprimentos do Oriente Médio, com o Brent negociado por volta de $100 por barril. Além disso, a Ucrânia realizou uma ampla operação com 650 drones contra a região de Moscou, resultando em pelo menos duas mortes. A Coreia do Sul recebeu uma mensagem da Ucrânia sobre a revelação de informações sobre prisioneiros de guerra da Coreia do Norte, mas considerou a oferta de desculpas insuficiente.", "economia": "Hong Kong manteve seu status como a economia mais livre do mundo, de acordo com o relatório Economic Freedom of the World de 2026, que utilizou dados de 2024, apesar de uma diminuição recente em sua pontuação. As bolsas de Wall Street estão registrando lucros superiores às expectativas neste ano, com projeções para um recorde histórico em 2026, impulsionadas pelo boom de inteligência artificial e pela volatilidade do mercado. A Seven & I Holdings encerrou suas operações na Índia devido à crescente concorrência local, enquanto a Goldman Sachs prevê que a capacidade restrita de refinarias possa manter os preços do diesel elevados até 2027, com margens altas necessárias para reduzir a demanda e reconstituir os estoques. O dólar caiu para R$ 5 e a bolsa subiu quase 8%, ultrapassando pela primeira vez os 200 mil pontos, após o resultado do primeiro turno das eleições presidenciais no Brasil, com diferentes casas de análise projetando uma valorização das ações brasileiras de 11% a 45% caso o senador Flávio Bolsonaro vença o presidente Lula no segundo turno das eleições, marcado para o dia 25 de outubro.", "tecnologia": "O IEEE Day de 2026, marcado para 6 de outubro, destaca a colaboração global para o futuro da tecnologia. Em um cenário mais imediato, a Coreia do Sul discute a implementação de sistemas de compra baseados em inteligência artificial com parceiros asiáticos. Simultaneamente, a Coreia do Sul e a China enfrentam desafios em relação à segurança cibernética, com a Coreia do Sul investigando supostos ataques assistidos por IA contra bancos. Economicamente, a Doosan Enerbility enviou uma turbina de gás para a SpaceX nos Estados Unidos, enquanto a Samsung Biologics busca negociações diretas com a Samsung Electronics sobre questões de pessoal e políticas de compensação. A tecnologia de inteligência artificial também está sendo aplicada na saúde, com a Coreia do Sul planejando um sistema de cuidados de saúde para idosos baseado em IA a partir de 2028. Além disso, a BenQ Materials apresenta sua linha de tecidos ecológicos Xpore, enquanto a Nvidia-backed Reflection AI desafia a China no domínio dos modelos de IA gratuitos.", "ciencia": "O cientista Francis Halzen, de 82 anos, nascido na Bélgica e vinculado à Universidade do Wisconsin–Madison, EUA, foi premiado com o Nobel de Física em 2026. A Academia Real Sueca de Ciências anunciou a premiação em Estocolmo, Suécia, reconhecendo suas contribuições decisivas para o Observatório de Neutrinos IceCube e pela descoberta de neutrinos de alta energia de origem cósmica. A premiação, rara e isolada, foi transmitida ao vivo pelo YouTube. O evento marcou um avanço significativo na compreensão dos fenômenos cósmicos e das partículas subatômicas. Além disso, o Nobel de Química em 2026 foi concedido a pesquisadores por suas pesquisas sobre mensagens fantasmagóricas do espaço, embora os nomes dos vencedores não tenham sido especificados nos artigos fornecidos. Estas premiações refletem o avanço constante da ciência em compreender os mistérios do universo e das partículas fundamentais.", "cultura": "O 23º Festival de Jazz de Jarasum, em Gapyeong, na Província de Gyeonggi, Coreia do Sul, homenageou a França e apresentou uma pianista de inteligência artificial. Ao longo de três dias, houve 64 apresentações de artistas locais e internacionais. Um destaque foi a concessão do Prêmio Nobel de Física de 2026 ao professor belga Francis Halzen, em uma cerimônia que também reconheceu o psicólogo Matías Muñoz, que enfatizou a importância dos bons relacionamentos na saúde mental. A cultura visual foi destacada pela coleção de papel de parede RGB-Not, criada pela coletiva italiana Carnovsky, que apresenta qualidades interativas de luz e uma variedade de cores. Outros eventos incluíram a British Art Show 10, que explorou a diversidade e peculiaridade da identidade britânica, e um documentário sobre a cantora Beldina Odenyo, que retrata a trajetória de uma artista talentosa que faleceu prematuramente em 2021.", "sociedade": "Manifestações estudantis se espalharam pela França, com mais de 5.000 pessoas detidas e um adolescente perdendo uma mão durante confrontos com a polícia. Em Barcelona, uma manifestação por moradia se tornou violenta, com incêndios e prisões. No Brasil, negros conquistaram menos de um terço das vagas nas assembleias e na CLDF. Em Alagoas e Santa Catarina, nenhum candidato negro foi eleito para esses cargos. No estado de São Paulo, a proibição de bisnagas de molhos em lanchonetes foi adiada para 2027. Na Flórida, um acidente envolvendo um ônibus escolar matou uma estudante do 10º ano. Em Kalamos, na Grécia, a sala de aula está vazia, refletindo a tendência de declínio populacional em escolas remotas. O socialismo está ganhando popularidade entre os jovens, com mais de metade das pessoas nessa faixa etária tendo uma visão positiva sobre o termo.", "meio_ambiente": "A Natura alerta sobre os impactos da mudança climática na Amazônia, estimando que ela possa comprometer R$ 584,2 milhões em vendas, representando 2,6% da receita líquida da empresa em 2025. De outro lado, cientistas do Reino Unido desenvolveram um dispositivo conhecido como 'espantalhos flutuantes', que reduziu a morte de aves marinhas em 95%, ajudando a prevenir a morte desses animais. As chuvas intensas atingem o Sul, Sudeste e Centro-Oeste, com temporais previstos para a terça-feira (6/10). Em Belo Horizonte, um incêndio atingiu um depósito de recicláveis no bairro Nova Granada, mas os bombeiros conseguiram controlar as chamas sem registrar vítimas. A França enfrenta uma seca persistente que está pressionando os sistemas de distribuição de água, devido à falta significativa de precipitação.", "direitos_humanos": "A República Democrática do Congo confirmou seu primeiro caso de Ebola, com o paciente falecido, e identificou 28 contatos potenciais. Em Gaza, a guerra tem aumentado a violência sexual e o casamento forçado de meninas e mulheres como forma de proteção. Na África do Sul, corpos de mulheres foram encontrados brutalmente espancados, evidenciando a violência contra as mulheres no país. Mais de 1.900 crianças foram deixadas órfãs ou separadas de suas famílias devido à Ebola em regiões de Ituri e North Kivu, na República Democrática do Congo, com o UNICEF pedindo fundos urgentes para proteger essas crianças. Na Etiópia, o conflito entre o governo federal etíope e os rebeldes de Tigray continua, com relatos de grupos rebeldes forçando a recruta de meninos com 15 anos ou menos. O Conselho de Direitos Humanos da ONU condenou os ataques contra civis no Sudão e pediu um cessar-fogo, estendendo o mandato da missão que investiga abusos no país."}, "resumo_do_dia": {"politica_nacional": [{"id": 197604, "titulo": "Flávio Bolsonaro e Lula: as propostas dos candidatos à Presidência que disputam o 2º turno", "url": "https://www.bbc.com/portuguese/articles/ckq5ne65q14go?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-06T09:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A BBC News Brasil preparou um especial interativo sobre as propostas e posicionamentos dos candidatos à Presidência que disputam o segundo turno, abrangendo oito áreas: economia e emprego, saúde, educação, política e corrupção, meio ambiente, programas sociais e direitos humanos, política externa e segurança.", "titulo_pt": "Flávio Bolsonaro e Lula: as propostas dos candidatos à Presidência que disputam o segundo turno", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 197706, "titulo": "Nova pesquisa testa a disputa Flávio Bolsonaro x Lula no segundo turno pela primeira vez", "url": "https://veja.abril.com.br/politica/nova-pesquisa-testa-a-disputa-flavio-bolsonaro-x-lula-no-segundo-turno-pela-primeira-vez/", "fonte_id": "veja", "data_pub": "2026-10-06T09:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa será realizada para testar a disputa direta entre Flávio Bolsonaro e Lula no segundo turno, avaliando aspectos como a firmeza do voto, rejeição, confiança em diferentes áreas de governo e a avaliação geral dos eleitores.", "titulo_pt": "Nova pesquisa testa disputa direta entre Flávio Bolsonaro e Lula no segundo turno pela primeira vez", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 197459, "titulo": "Estrategistas comemoram votações recorde de Tarcísio, Derrite e Prado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/estrategistas-comemoram-votacoes-recorde-de-tarcisio-derrite-e-prado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-06T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estrategistas das campanhas vencedoras para o governo e o Senado em São Paulo comemoram os recordes de votação obtidos. Os candidatos Tarcísio, Derrite e Prado alcançaram resultados históricos nas urnas.", "titulo_pt": "Estrategistas comemoram votações recorde de Tarcísio, Derrite e Prado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 197578, "titulo": "Eleições em mapas: veja a distribuição de votos nos estados e exterior", "url": "https://www.cnnbrasil.com.br/eleicoes/eleicoes-em-mapas-veja-a-distribuicao-de-votos-nos-estados-e-exterior/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-06T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro ganhou em 14 estados, o Distrito Federal e 37 países, enquanto Lula venceu em 12 estados e 64 nações.", "titulo_pt": "Eleições em mapas: confira a distribuição de votos nos estados e exterior", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 197527, "titulo": "Veja o que o calendário eleitoral prevê para esta 3ª, 2 dias após 1º turno", "url": "https://www.metropoles.com/brasil/veja-o-que-o-calendario-eleitoral-preve-para-esta-3a-2-dias-apos-1o-turno", "fonte_id": "metropoles", "data_pub": "2026-10-06T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O calendário eleitoral encerra nesta terça-feira (6/10) as regras de proteção aos eleitores estabelecidas após o primeiro turno das eleições. As medidas visam garantir a segurança e o direito dos votantes durante o período eleitoral.", "titulo_pt": "Veja o que o calendário eleitoral prevê para esta terça-feira, 2 dias após 1º turno", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 197460, "titulo": "Brancos aumentam na Câmara pela primeira vez desde 2014", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/brancos-aumentam-na-camara-pela-primeira-vez-desde-2014.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-06T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de deputados que se autodeclaram brancos aumentou pela primeira vez desde 2014, elegeram 374 parlamentares brancos no pleito de 2026, contra 366 em 2022.", "titulo_pt": "Brancos aumentam na Câmara pela primeira vez desde 2014", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 197461, "titulo": "Fragmentação partidária cai na Câmara, que concentra poder na direita", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/fragmentacao-partidaria-cai-na-camara-que-concentra-poder-na-direita.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-06T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara dos Deputados eleita em 2026 será menos fragmentada em relação à anterior, mas isso não necessariamente facilitará as negociações para o próximo presidente.", "titulo_pt": "Fragmentação partidária diminui na Câmara, mas negociações podem não se tornar mais fáceis", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 197462, "titulo": "Bancada evangélica perde 4 de 5 presidentes, e urnas desgastam velha guarda", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/bancada-evangelica-perde-4-de-5-presidentes-e-urnas-desgastam-velha-guarda.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-06T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Desde a eleição de Jair Bolsonaro em 2018, cinco deputados evangélicos ocuparam a presidência da bancada. Apenas Sóstenes Cavalcante, do PL, foi reeleito com a sétima maior votação no estado do Rio de Janeiro.", "titulo_pt": "Bancada evangélica perde quatro de cinco presidentes e urnas desgastam velha guarda", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 197591, "titulo": "6×1: Avanço da direita coloca meta da campanha de Lula em xeque", "url": "https://www.cnnbrasil.com.br/politica/6x1-avanco-da-direita-coloca-meta-da-campanha-de-lula-em-xeque/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-06T06:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O resultado do primeiro turno das eleições gerou preocupação entre os aliados do governo sobre a eficácia da pauta trabalhista como um argumento forte para a campanha de Lula no segundo turno.", "titulo_pt": "6×1: Avanço da direita coloca meta da campanha de Lula em xeque", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 197463, "titulo": "Missão aposta em expansão nacional, mas elege só dois deputados", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/missao-aposta-em-expansao-nacional-mas-elege-so-dois-deputados.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-06T02:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Missão, partido liderado por Renan Santos, conquistou apenas duas vagas nas eleições de 2026, reeleger um deputado federal e conquistar uma vaga na Assembleia Legislativa de São Paulo.", "titulo_pt": "Missão elegera só dois deputados em sua primeira eleição como partido oficial", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 197445, "titulo": "Senado mantém análise do fim da 6x1 nesta terça, e oposição tenta adiamento após resultado das urnas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/senado-mantem-analise-do-fim-da-6x1-nesta-terca-e-oposicao-tenta-adiamento-apos-resultado-das-urnas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-06T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Senado, Davi Alcolumbre, manteve a análise da PEC que aboliu a jornada de trabalho 6x1 para esta terça-feira. Oposição tenta adiar a discussão até após os resultados das eleições no domingo.", "titulo_pt": "Senado mantém análise do fim da 6x1 nesta terça, e oposição tenta adiamento após resultado das urnas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 197464, "titulo": "Assembleia do Ceará será a mais feminina, e Acre terá apenas deputados estaduais homens", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/assembleia-do-ceara-sera-a-mais-feminina-e-acre-tera-apenas-deputados-estaduais-homens.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-06T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As mulheres bateram o recorde de eleitas aos Legislativos estaduais e do Distrito Federal, ocupando 218 vagas, um aumento de 27 cadeiras em relação ao pleito de 2022. A Assembleia do Ceará será a mais feminina, enquanto o Acre terá apenas deputados estaduais homens.", "titulo_pt": "Assembleia do Ceará será a mais feminina, e Acre terá apenas deputados estaduais homens", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 197465, "titulo": "Kassab vê PSD encolher no Congresso e perder estados após aposta em Caiado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/kassab-ve-psd-encolher-no-congresso-e-perder-estados-apos-aposta-em-caiado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-06T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Kassab, presidente do PSD, observa que o partido pode perder influência no Congresso e em estados após a aposta em Ronaldo Caiado. A estratégia tradicional de Kassab, que geralmente o leva ao lado vencedor, não se repetiu neste ano devido ao avanço da direita no país.", "titulo_p da inteligência artificial, o que cria um dilema para o Federal Reserve (Fed). Os custos de financiamento estão pressionando famílias e empresas, mas os investimentos em infraestrutura de IA continuam impulsionando a inflação.", "titulo_pt": "Juros mais altos nos EUA não freiam boom da IA e criam dilema para o Fed", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 197666, "titulo": "O Imposto Seletivo e o agro: a porta dos fundos da cumulatividade", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-imposto-seletivo-e-o-agro-a-porta-dos-fundos-da-cumulatividade", "fonte_id": "jota", "data_pub": "2026-10-06T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O imposto seletivo afeta menos o agronegócio do que se pensa. A blindagem do setor contra o imposto seletivo é menor do que parece.", "titulo_pt": "Blindagem do agronegócio contra o Imposto Seletivo é menor do que se pensa", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 197667, "titulo": "O subprime do consignado?", "url": "https://www.jota.info/opiniao-e-analise/colunas/mulheres-na-regulacao/o-subprime-do-consignado", "fonte_id": "jota", "data_pub": "2026-10-06T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dados de 142 FIDCs indicam que a instituição que origina o crédito não assume o risco, e que o Banco Central e a Comissão de Valores Mobiliários não monitoram completamente a cadeia de financiamento.", "titulo_pt": "O subprime do consignado?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 197589, "titulo": "Mercado se anima com Flávio, mas sustentabilidade da alta depende de fiscal", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/mercado-se-anima-com-flavio-mas-sustentabilidade-da-alta-depende-de-fiscal/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-06T07:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, candidato do PL, promoveu ações positivas no mercado com sua proposta de 'tesouraço', mas a sustentabilidade dessa alta depende da apresentação concreta de medidas fiscais.", "titulo_pt": "Mercado se anima com Flávio, mas sustentabilidade da alta depende de medidas fiscais", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 197959, "titulo": "Trump allows cheaper, dyed diesel on highways to blunt historic fuel-cost spike ahead of midterms", "url": "https://www.cnbc.com/2026/10/06/us-diesel-fuel-prices-iran-ukraine-energy-crisis-.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-06T07:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O preço médio nacional de diesel nos Estados Unidos superou pela primeira vez os seis dólares por galão em setembro, devido a interrupções na oferta de combustível que elevaram os custos de transporte no país. O presidente Trump permitiu o uso de diesel mais barato e tingido nas estradas para mitigar a alta histórica nos preços do combustível antes das eleições gerais de 2018.", "titulo_pt": "Trump permite diesel mais barato e tingido nas estradas para combater aumento histórico nos preços do combustível antes das eleições", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 197435, "titulo": "Regra para alíquota dos combustíveis na reforma tributária é publicada", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/regra-para-aliquota-dos-combustiveis-na-reforma-tributaria-e-publicada.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-06T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Fazenda e o CGIBS definiram a metodologia para calcular as alíquotas da CBS e do IBS sobre combustíveis a partir de 2027 e 2029, respectivamente. A regra foi publicada em uma portaria no dia 5 de junho de 2026.", "titulo_pt": "Regra para alíquota dos combustíveis na reforma tributária é publicada", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 197436, "titulo": "Não sacou dinheiro da bet? Veja como recuperar saldo após fim das plataformas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/nao-sacou-dinheiro-da-bet-veja-como-recuperar-saldo-apos-fim-das-plataformas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-06T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O prazo para solicitar a retirada voluntária de valores depositados em casas de apostas terminou na segunda-feira (5). A partir desta terça-feira (6), os sites e aplicativos de apostas de quota fixa ficarão indisponíveis conforme determina a Medida Provisória nº 1.394, publicada em 25 de setembro.", "titulo_pt": "Não sacou dinheiro das casas de apostas? Veja como recuperar saldo após encerramento das plataformas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 197437, "titulo": "Receita leiloa esmeraldas, iPhones e veículos em São Paulo; veja prazos e como participar", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/receita-leiloa-esmeraldas-iphones-e-veiculos-em-sao-paulo-veja-prazos-e-como-participar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-06T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Receita Federal em São Paulo recebe propostas até sexta-feira (9) para um leilão de mercadorias abandonadas, entregues ao fisco ou confiscadas pela União. Os interessados podem participar enviando propostas até às 21h do prazo estabelecido.", "titulo_pt": "Receita federal leiloa mercadorias abandonadas, entregues ao fisco ou confiscadas em São Paulo; veja prazos e como participar", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 198153, "titulo": "Happy IEEE Day!", "url": "https://spectrum.ieee.org/ieee-day", "fonte_id": "ieee_spectrum", "data_pub": "2026-10-06T09:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O IEEE Day de 2026 será celebrado em 6 de outubro. O evento destaca a colaboração entre membros do IEEE em comunidades locais para melhorar o futuro através da tecnologia.", "titulo_pt": "Feliz dia do IEEE 2026!", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 197573, "titulo": "Conheça metal extraído em Minas que salvas vidas em batidas de carro", "url": "https://www.cnnbrasil.com.br/auto/conheca-metal-extraido-em-minas-que-salvas-vidas-em-batidas-de-carro/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-06T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O nióbio, um metal extraído em Minas Gerais, é utilizado em veículos para desenvolver aços mais resistentes. Este material é aplicado em estruturas, rodas, bancos e componentes eletrificados dos carros.", "titulo_pt": "Conheça metal mineiro que salva vidas em batidas de carro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 197872, "titulo": "Latino group bets on bilingual AI to cut voter confusion before the midterms", "url": "https://www.axios.com/2026/10/06/latino-voters-ai-guide-midterms-nubi", "fonte_id": "axios", "data_pub": "2026-10-06T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo nacional de engajamento cívico latino está utilizando uma aplicação de inteligência artificial bilingue para auxiliar eleitores a navegar por um sistema eleitoral cada vez mais complexo, em inglês ou espanhol. Cerca de 39 milhões de hispânicos podem votar nas eleições de meiod mandato deste ano, e sua lealdade política está se tornando cada vez mais incerta.", "titulo_pt": "Grupo latino aposta em inteligência artificial bilingue para reduzir confusão eleitoral antes dos midterms", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 197873, "titulo": "Scoop: Gun safety groups jump into midterms with $10 million assist for Democrats", "url": "https://www.axios.com/2026/10/06/democrats-election-gun-control-moms-demand-action", "fonte_id": "axios", "data_pub": "2026-10-06T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Everytown for Gun Safety, um grupo que defende leis mais rígidas sobre armas, está colaborando com os democratas para candidatos antigos do grupo Moms Demand Action em uma campanha publicitária de $10 milhões. Este é um montante significativo no momento em que os democratas expressam preocupação sobre sua capacidade financeira para competir nas eleições gerais de 2022.", "titulo_pt": "Everytown para segurança com armas se associará a democratas em campanha publicitária de $10 milhões para candidatos antigos", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 197874, "titulo": "Inside Trump's new AI playbook", "url": "https://www.axios.com/2026/10/06/trump-ai-strategy-task-force", "fonte_id": "axios", "data_pub": "2026-10-06T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O novo grupo de trabalho 'Super Intelligence' do presidente Trump enfrenta um desafio significativo: unificar divisões dentro do gabinete para criar uma política de tecnologia que acompanhe a corrida acelerada de inteligência artificial. O grupo de trabalho reúne os esforços espalhados do governo em AI, mas também pode resultar em regras controversas devido às divergências internas.", "titulo_pt": "Dentro do novo plano de AI do Trump", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 198128, "titulo": "BenQ Materials expands Xpore circular textile push", "url": "https://www.digitimes.com/news/a20261006PD240/benq-materials-2026-performance-brand-eco-friendly.html", "fonte_id": "digitimes", "data_pub": "2026-10-06T08:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A BenQ Materials apresentou sua marca de tecidos ecológicos Xpore no Taipei Innovative Textile Application Show (TITAS) 2026, apresentando três tecnologias verdes, seis linhas de produtos e o lançamento comercial do Xpore e2cycle, seu processo de reciclagem de resíduos eletrônicos.", "titulo_pt": "Benq Materials expande a push Xpore de tecidos circulares", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 198157, "titulo": "Posco Future M lands W6tr LFP materials deal with Samsung SDI", "url": "https://www.koreaherald.com/article/10894677", "fonte_id": "korea_herald", "data_pub": "2026-10-06T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Posco Future M firmou um contrato de 6 trilhões de wones (cerca de 4,48 bilhões de dólares) para fornecer materiais de bateria de fófato de ferro de lítio (LFP) para a Samsung SDI, estendendo sua parceria. O acordo abrange o fornecimento de material cátodo ativo LFP de 2027 a 2032, com volumes mais do que o dobro do contrato anterior assinado em agosto de 2023.", "titulo_pt": "Posco Future M e Samsung SDI firmam acordo de 6 trilhões de wones para fornecimento de materiais de bateria LFP", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 198112, "titulo": "S. Korea discusses AI-powered procurement with Asian partners", "url": "https://en.yna.co.kr/view/AEN20261006010300320", "fonte_id": "yonhap_news", "data_pub": "2026-10-06T08:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul discutiu sistemas de compra baseados em inteligência artificial com parceiros asiáticos. A conversa teve como foco a exploração de tecnologias de compra automatizadas.", "titulo_pt": "Coreia do sul discute sistemas de compra baseados em IA com parceiros asiáticos", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 198031, "titulo": "Suzuki undercuts BYD as competition grows in market for low-budget EV minicars", "url": "https://www.japantimes.co.jp/business/2026/10/06/companies/suzuki-cheap-mini-evs/", "fonte_id": "japan_times", "data_pub": "2026-10-06T08:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A chegada do primeiro carro elétrico totalmente elétrico da Suzuki aumenta as indicações de que o Japão está se tornando um campo de batalha importante para as versões elétricas dos veículos pequenos.", "titulo_pt": "Suzuki baixa o preço em face da BYD enquanto a concorrência cresce no mercado de microcarros elétricos econômicos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 198074, "titulo": "Southeast Asia urged to step up war against AI-powered scams through data sharing", "url": "https://www.scmp.com/week-asia/economics/article/3369903/southeast-asia-urged-step-war-against-ai-powered-scams-through-data-sharing?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-06T07:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Governo e instituições financeiras da Ásia Oriental são encorajados a compartilhar dados de forma segura e rápida para combater a crescente ocorrência de estelionatos alimentados por inteligência artificial, alertam especialistas em segurança cibernética. As operações criminosas na região estão se expandindo rapidamente com o auxílio de inteligência artificial, e empresas criminosas roubaram aproximadamente US$114 bilhões de vítimas na Ásia-Pacífico em 2025, mais do que o triplo do valor do ano anterior.", "titulo_pt": "Ásia oriental é encorajada a intensificar a luta contra estelionatos de IA através do compartilhamento de dados", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 198116, "titulo": "(2nd LD) Seoul shares end lower on tech losses amid rising bond yields", "url": "https://en.yna.co.kr/view/AEN20261006006852320", "fonte_id": "yonhap_news", "data_pub": "2026-10-06T07:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações de Seul encerraram em baixa na segunda-feira, lideradas por perdas no setor tecnológico devido a uma elevação nas taxas de juros das obrigações.", "titulo_pt": "Seul encerra em baixa com perdas tecnológicas devido a taxas de juros elevadas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 197587, "titulo": "Os primeiros profissionais a adotarem IA agora querem evitá-la", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/os-primeiros-profissionais-a-adotarem-ia-agora-querem-evita-la/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-06T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento com 30 mil desenvolvedores realizado pelo Stack Overflow mostrou que os primeiros profissionais a adotarem inteligência artificial estão expressando insatisfação com as ferramentas automatizadas.", "titulo_pt": "Os primeiros profissionais a adotarem IA agora querem evitá-la", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 198161, "titulo": "Police launch major probe as suspected AI hacks sweep through banks", "url": "https://www.koreaherald.com/article/10894542", "fonte_id": "korea_herald", "data_pub": "2026-10-06T07:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia sul-coreana iniciou uma investigação abrangente em relação a uma série de supostos ataques cibernéticos assistidos por inteligência artificial contra instituições financeiras, expostas informações pessoais de dezenas de milhares de pessoas. O Presidente Lee Jae Myung pediu uma resposta rápida durante uma reunião do gabinete.", "titulo_pt": "Polícia sul-coreana inicia investigação sobre supostos ataques cibernéticos assistidos por IA em bancos", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 198077, "titulo": "Nvidia-backed Reflection AI challenges Chinese dominance in open-weight models", "url": "https://www.scmp.com/tech/tech-trends/article/3369885/nvidia-backed-reflection-ai-challenges-chinese-dominance-open-weight-models?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-06T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma startup americana, apoiada pela Nvidia, lançou um modelo de inteligência artificial aberto para competir com a China no domínio dos modelos de IA gratuitos. O sistema, chamado Beam, foi comparado positivamente em testes iniciais e pode ser considerado um dos modelos mais eficientes em termos de tokenização em sua categoria.", "titulo_pt": "Startup nvidia apoiada desafia dominância chinesa em modelos de inteligência artificial abertos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 198033, "titulo": "How to protect yourself against cybersecurity threats", "url": "https://www.japantimes.co.jp/news/2026/10/06/japan/crime-legal/japan-protecting-against-cyberattacks/", "fonte_id": "japan_times", "data_pub": "2026-10-06T06:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Diante do aumento recente de ataques cibernéticos no Japão, os usuários podem adotar medidas para limitar suas vulnerabilidades. O artigo oferece orientações sobre como proteger-se contra essas ameaças.", "titulo_pt": "Como proteger-se contra ameaças cibernéticas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 198034, "titulo": "South Korea’s Lee says AI appears to have been used in bank hacks", "url": "https://www.japantimes.co.jp/business/2026/10/06/south-korea-bank-hacks/", "fonte_id": "japan_times", "data_pub": "2026-10-06T06:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente da Coreia do Sul, Lee, pediu ao país que desenvolva métodos de segurança cibernética adequados para a era da inteligência artificial. Ele se referiu a possíveis uso de AI em ataques bancários recentes.", "titulo_pt": "Lee, da Coreia do sul, chama para desenvolvimento de segurança cibernética para era da AI", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 197704, "titulo": "Nobel de Química 2026 premia mensagens fantasmagóricas do espaço", "url": "https://veja.abril.com.br/ciencia/nobel-de-quimica-2026-premia-mensagens-fantasmagoricas-do-espaco/", "fonte_id": "veja", "data_pub": "2026-10-06T09:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Academia Real Sueca de Ciências anunciou o vencedor do Nobel de Química 2026, premiando pesquisas sobre mensagens fantasmagóricas do espaço. O anúncio foi feito em Estocolmo, Suécia, e transmitido ao vivo pelo YouTube.", "titulo_pt": "Nobel de Química 2026 homenageia mensagens fantasmagóricas do espaço", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 198062, "titulo": "Francis Halzen wins 2026 Nobel Prize in Physics", "url": "https://www.scmp.com/news/world/europe/article/3369925/francis-halzen-wins-2026-nobel-prize-physics?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-06T09:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Francis Halzen, de 82 anos, nascido em Bélgica e vinculado à Universidade do Wisconsin–Madison, nos Estados Unidos, ganhou o Prêmio Nobel de Física de 2026 por suas contribuições decisivas para o Observatório de Neutrinos IceCube e pela descoberta de neutrinos de alta energia de origem astrológica.", "titulo_pt": "Francis Halzen vence prêmio Nobel de física de 2026", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 198234, "titulo": "Nobel prize in physics awarded for discovery of high-energy neutrinos", "url": "https://www.newscientist.com/article/2592237-nobel-prize-in-physics-awarded-for-discovery-of-high-energy-neutrinos/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-10-06T09:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Francis Halzen ganhou o prêmio Nobel de Física de 2026 por seu trabalho sobre neutrinos, que são comparados a 'mensageiros fantasmagóricos do cosmos'.", "titulo_pt": "Prêmio nobel de física de 2026 concedido por descobertas de neutrinos de alta energia", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 197475, "titulo": "Nobel de Física 2026 premia detecção de neutrinos de alta energia", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/nobel-de-fisica-2026-premia-descoberta-de-neutrinos-de-alta-energia.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-06T09:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Francis Halzen recebeu o Prêmio Nobel de Física de 2026 por suas contribuições na detecção de neutrinos de alta energia com o observatório Icecube, localizado no polo sul. A premiação, rara e isolada, foi anunciada pela Academia Real de Ciências da Suécia nesta terça-feira (6).", "titulo_pt": "Nobel de Física 2026 reconhece detecção de neutrinos de alta energia", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 197511, "titulo": "Nobel de Física vai para Francis Halzen por descoberta sobre neutrinos", "url": "https://www.metropoles.com/ciencia/nobel-de-fisica-vai-para-francis-halzen-por-descoberta-de-neutrinos", "fonte_id": "metropoles", "data_pub": "2026-10-06T09:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Prêmio Nobel de Física foi concedido pela Real Academia Sueca de Ciências, em Estocolmo, para Francis Halzen por sua contribuição na descoberta sobre neutrinos.", "titulo_pt": "Nobel de Física vai para Francis Halzen por descoberta sobre neutrinos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 198063, "titulo": "Kenya reports first Ebola case imported from DR Congo after patient dies", "url": "https://www.scmp.com/news/world/africa/article/3369923/kenya-reports-first-ebola-case-imported-dr-congo-after-patient-dies?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-06T09:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kenya registrou seu primeiro caso de morte por Ebola, após um homem que vivia na República Democrática do Congo e retornou ao país após se sentir mal, morrer. O ministro da Saúde, Aden Duale, informou que o paciente foi diagnosticado positivo para Ebola após viajar para Kampala, Uganda, e depois para Nairobi, na República do Quênia.", "titulo_pt": "Kenya registra primeiro caso de morte por Ebola após paciente importado do Congo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 197868, "titulo": "Missing details keep U.S. plague response on hold", "url": "https://www.axios.com/2026/10/06/missing-details-us-plague-response", "fonte_id": "axios", "data_pub": "2026-10-06T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Duas incertezas principais impedem o estabelecimento de uma resposta ao plague na Rússia e a adoção de conselhos de viagem ou outras medidas de precaução nos Estados Unidos. Ainda não se sabe qual patógeno matou um pesquisador russo e como está contido esse patógeno.", "titulo_pt": "Detalhes faltantes impedem resposta ao plague nos estados unidos", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 197870, "titulo": "Longevity guru Bryan Johnson: \"People really want me to die\"", "url": "https://www.axios.com/2026/10/06/bryan-johnson-dont-die-autoimmune-diagnosis", "fonte_id": "axios", "data_pub": "2026-10-06T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bryan Johnson, líder do movimento pela longevidade e fundador da campanha 'Não Morra', anunciou recentemente ter uma doença autoimune incurável, o que foi celebrado por seus críticos. Johnson admitiu que essa reação é irônica, mas vê a situação como uma oportunidade para avançar seu trabalho.", "titulo_pt": "Guru da longevidade Bryan Johnson: 'as pessoas realmente querem que eu morra'", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 197684, "titulo": "Científicos revelan qué alimentos tienen un compuesto que empeora la inflamación intestinal", "url": "https://www.latercera.com/tendencias/noticia/cientificos-revelan-que-alimentos-tienen-un-compuesto-que-empeora-la-inflamacion-intestinal/", "fonte_id": "la_tercera", "data_pub": "2026-10-06T09:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa recente examinou a relação entre certos alimentos considerados saudáveis e a inflamação em pessoas com doença inflamatória intestinal. O estudo revelou que alguns alimentos contêm compostos que podem agravar a inflamação intestinal.", "titulo_pt": "Cientistas descobrem que alimentos saudáveis podem agravar inflamação intestinal", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 197655, "titulo": "“Yersinia pestis integra la categoría A de agentes de bioterrorismo”: la explicación de un infectólogo tras la muerte de una investigadora en Rusia", "url": "https://www.lanacion.com.ar/sociedad/yersinia-pestis-integra-la-categoria-a-de-agentes-de-bioterrorismo-la-explicacion-de-un-infectologo-nid06102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-06T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um infectologista analisou o caso de uma investigadora que morreu em um laboratório antipeste na Rússia, levando o governo de Putin a isolar cerca de 200 pessoas. A Yersinia pestis, a bactéria que causa a peste, foi reclassificada como agente de bioterrorismo da categoria A.", "titulo_pt": "Yersinia pestis integra A categoria A de agentes de bioterrorismo após morte de investigadora em laboratório na Rússia", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 198181, "titulo": "Nature's capacity to 'bounce back' when species are lost is vastly overestimated, global analysis finds", "url": "https://phys.org/news/2026-10-nature-capacity-species-lost-vastly.html", "fonte_id": "phys_org", "data_pub": "2026-10-06T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma análise global maioritária descobriu que a capacidade dos ecossistemas de se recuperar após a perda de espécies é muito mais limitada do que se pensava. A crença de que a extinção de espécies em pequena escala não causa grande dano é amplamente exagerada.", "titulo_pt": "Capacidade dos ecossistemas de se recuperar após a perda de espécies é muito mais limitada do que se pensava", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 198177, "titulo": "In this hospital, pulse oximeters went from overestimating to underestimating blood oxygen. Why?", "url": "https://www.statnews.com/2026/10/06/pulse-oximeters-overestimate-and-underestimate-blood-oxygen-study/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-06T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores descobriram que os oximetros de pulso passaram de sobrestimar os níveis de oxigênio no sangue para subestimá-los; as inaccuracy eram maiores nos pacientes de cor.", "titulo_pt": "Neste hospital, oximetros de pulso passaram de sobrestimar para subestimar os níveis de oxigênio no sangue; a inaccuracy era maior nos pacientes de cor.", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 198178, "titulo": "Opinion: I’m a doctor. Here’s what I want the public to know about AI tools and health care costs", "url": "https://www.statnews.com/2026/10/06/ai-tools-health-care-costs-bcbs-research/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-06T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um médico expressa sua frustração ao notar que, mesmo registrando informações honestamente, pode resultar em aumentos nos custos das contas hospitalares.", "titulo_pt": "Opinião: eu sou um médico. Aqui está o que quero que o público saiba sobre ferramentas de IA e custos de saúde", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 198179, "titulo": "Opinion: Why the FDA should not approve an ineffective multicancer screening test", "url": "https://www.statnews.com/2026/10/06/grail-multi-cancer-screening-test-criticism/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-06T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "H. Gilbert Welch argumenta que a FDA não deve aprovar o teste de detecção multicancro de Grail, pois informar mais pessoas que têm câncer não representa progresso; progresso seria reduzir o número de mortes por câncer.", "titulo_pt": "Por que a FDA não deve aprovar um teste de detecção multicancro ineficaz", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 198180, "titulo": "STAT+: Can you live longer for $5,500? Longevity clinics are the buzzy new trend at nonprofit hospitals", "url": "https://www.statnews.com/2026/10/06/hospitals-longevity-clinics-healthy-aging-wellness-trend/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-06T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Longevidade clínicas oferecem conselhos de saúde personalizados e testes avançados. Agora, hospitais de grande porte estão entrando neste negócio, com custos que podem chegar a US$ 45.000 por ano.", "titulo_pt": "Você pode viver mais por us$ 5.500? Clínicas de longevidade se tornam a nova tendência em hospitais sem fins lucrativos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 197564, "titulo": "Rússia tenta conter especulações sobre suposto caso de peste na Sibéria", "url": "https://www.infomoney.com.br/business/global/russia-tenta-conter-especulacoes-sobre-suposto-caso-de-peste-na-siberia/", "fonte_id": "infomoney", "data_pub": "2026-10-06T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A agência russa de defesa do consumidor informou que uma funcionária de um instituto antipeste na região de Irkutsk contraiu pneumonia. As especulações sobre um suposto caso de peste foram contidas pelas autoridades russas.", "titulo_pt": "Rússia tenta conter especulações sobre suposto caso de peste na Sibéria", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 198228, "titulo": "Lee Krasner Gets the Last Word", "url": "https://hyperallergic.com/lee-krasner-gets-the-last-word/", "fonte_id": "hyperallergic", "data_pub": "2026-10-06T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A crítica Lucy Ives revisou a exposição The Met’s Krasner-Pollock no Museu Metropolitano de Arte. Hakim Bishara, Editor-in-Chief, entrevistou Elaina Richardson, que está deixando o cargo de Presidente do Yaddo. Aruna D’Souza produziu um perfil sobre a artista Rana Begum.", "titulo_pt": "Lee Krasner conclui a exposição", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 198154, "titulo": "Jarasum Jazz Festival puts French jazz and an AI pianist in spotlight", "url": "https://www.koreaherald.com/article/10894721", "fonte_id": "korea_herald", "data_pub": "2026-10-06T09:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O 23º Festival de Jazz de Jarasum começa nesta sexta-feira em Gapyeong, Gyeonggi Province, com um programa centrado na França e com destaque para uma pianista de inteligência artificial. O festival, que dura três dias e inclui 64 apresentações de artistas locais e internacionais, tem como palco principal a Jazz Island, uma ilha no Jaraseom, e três palcos gratuitos na cidade durante os fins de semana de Hangeul.", "titulo_pt": "Festival de Jazz de jarasum destaca Jazz francês e pianista de IA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 197642, "titulo": "El Premio Nobel de Física 2026 fue para el profesor belga Francis Halzen", "url": "https://www.lanacion.com.ar/sociedad/el-premio-nobel-de-fisica-2026-fue-para-francis-halzen-nid06102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-06T09:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Premio Nobe
