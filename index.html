<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>
const D = {"gerado_em": "11/11/2026 15:33", "stats": {"noticias_novas": 1016, "resumos_gerados": 255}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva passou a palavra ao ministro do Meio Ambiente durante a Cúpula de Líderes sobre Florestas em Antália, pedindo que o ministro levasse o segundo discurso. No Senado, um projeto engavetado por Flávio Bolsonaro pode ser desengavetado, permitindo que projetos relacionados ao combate a facções criminosas passem diretamente à Comissão de Constituição e Justiça. Na COP31, os líderes estavam fazendo discursos, mas Lula não falou conforme programado. A Sabesp começou a emitir uma nova fatura de água, com campos específicos para os tributos da reforma tributária. A prisão de Milton Leite, ex-presidente da Câmara Municipal de São Paulo, desestruturou o União Brasil na campanha eleitoral, constrangendo o governador Tarcísio de Freitas. A Meta foi condenada a pagar R$ 7,5 milhões por não ter tratado igualmente as candidaturas de Lula e Flávio Bolsonaro durante a campanha eleitoral de 2026. O ministro Gilmar Mendes suspendeu os processos relacionados à substituição da tabela do SUS, paralisando todos os estágios dos processos. O STF deve analisar ações que questionam a aplicação da imunidade prevista no Código Penal em casos de violência patrimonial contra mulheres.", "mundo": "A Alemanha registrou um aumento significativo no número de pessoas que recusam o serviço militar, passando de 3,8 mil em 2025 para quase 17 mil até outubro deste ano. Este salto ocorreu após a entrada em vigor de uma nova lei de alistamento, com o objetivo de aumentar o efetivo militar. Em contraste, a Suécia modificou sua constituição para permitir a revogação da cidadania sueca de cidadãos suíço-suecos se eles obtiveram a cidadania sueca de forma fraudulenta ou se foram condenados a crimes que prejudicaram gravemente os 'interesses vitais' da Suécia. A próxima gestão governamental será responsável por apresentar uma proposta de lei para implementar essa mudança. Na Espanha, ocorreu a primeira greve geral em 14 anos, em protesto contra a crise da moradia e o alto custo de vida, com milhares de pessoas nas ruas. O presidente ucraniano Zelenskyy alertou que seu país não é 'propriedade imobiliária', enquanto as negociações de paz, promovidas pelos Estados Unidos, entraram em sua segunda e última etapa, sem avanços significativos para um acordo de paz mais amplo. Além disso, o governo iraniano está se mostrando firme e planejando para o pior cenário, mas uma sanção dos Estados Unidos é esperada para tornar a maioria dos iranianos mais pobres, enquanto o governo do Quênia anunciou que o país continuará a implementar medidas de prevenção até 23 de dezembro, após o último paciente com Ebola ser dispensado do hospital.\n\nAs negociações trilaterais entre Rússia, Ucrânia e Estados Unidos em Abu Dhabi não produziram avanços concretos, segundo relatos de diversas fontes, incluindo o Brasil de Fato e o Financial Times. As partes concordaram em um grande intercâmbio de prisioneiros de guerra, mas não anunciaram avanços significativos na resolução do conflito que já dura quase cinco anos, desde a invasão russa. A Alemanha, por sua vez, ameaçou cortar financiamento para países da União Europeia que não contribuam financeiramente para a Ucrânia, pressionando para um apoio mais amplo à nação. Além disso, a Rússia banificou dois deputados franceses e dois jornalistas em retaliação à expulsão de um comentarista russo que liderava RT France, conforme informado pelo Al Jazeera.", "economia": "As ações de tecnologia dos Estados Unidos subiram, recuperando-se das perdas da semana anterior, impulsionadas por um IPO mais bem-sucedido da Anthropic e por um desempenho melhor do que esperado da CoreWeave. A Petrobras aumentou suas projeções de investimentos, o que levou as ações da companhia a cair, com o mercado expressando preocupação com o impacto desses investimentos futuros nos dividendos da empresa. O governo federal enviará ao Congresso Nacional uma proposta que cria uma regra de transição na cobrança da Contribuição sobre Bens e Serviços (CBS), permitindo que as empresas façam cálculos estimados do imposto nos primeiros meses e ajustem posteriormente, facilitando a adaptação às novas regras. Além disso, o Banco Central do Brasil enfrenta desafios na resolução de conflitos de consumo, com 95% dos processos sancionadores envolvendo formulários, enquanto apenas 1% abrangem grandes bancos. A reforma tributária e as concessões enfrentam desafios para preservar o equilíbrio dos contratos, dependendo de uma atuação coordenada entre o poder concedente, agências reguladoras, órgãos de controle e concessionárias. O fim da escala 6x1 no comércio de São Paulo e Porto Alegre pode pressionar reajustes significativos nas mensalidades escolares para 2027, com percentuais que podem chegar a dois dígitos.", "tecnologia": "A inteligência artificial (IA) tem ganhado destaque em diversos setores, especialmente em ataques cibernéticos e questões geopolíticas. O secretário do Tesouro, Scott Bessent, discutiu com o secretário do Comércio, Howard Lutnick, sobre a exclusão da empresa Nvidia, cliente da Megaspeed, de uma lista de empresas com preocupações de segurança nacional. Isso ocorreu em meio a suspeitas de espionagem chinesa envolvendo o CEO da Nvidia, Jensen Huang. Em outro desenvolvimento, a startup Radical Numerics criou um modelo que pode identificar patógenos naturais e gerados por IA sem conexão à internet. Por outro lado, a startup Switchpoint Bio levantou $5,3 milhões para estudar por que alguns pacientes respondem bem a medicamentos e outros não, com o objetivo de personalizar os tratamentos. Além disso, a indústria de IA enfrentou uma semana turbulenta, com a IPO do Anthropic enfrentando problemas devido a preocupações com a venda de inside e com um ciclo de fornecimento circular, o que pode comprometer a confiança dos investidores.", "ciencia": "A Organização Pan-Americana da Saúde (PAHO) conseguiu acordos regionais para testes de HPV pela primeira vez em toda a América Latina e Caribe, com apoio da Unitaid. Esses acordos visam melhorar o acesso a testes de HPV na região. Um estudo mostrou que pacientes que tomaram banhos frios durante três meses apresentaram uma redução de 26% nos sintomas de gripe e infecções em comparação com aqueles que tomaram banhos quentes. A Horizon Microtechnologies está acelerando a industrialização de sua plataforma de fabricação aditiva metálica em polímeros, com o projeto IP-MASS, que visa fortalecer a iniciativa de industrialização da empresa. Um novo estudo sugere que a identificação do receptor do vírus da rubéola pode auxiliar no desenvolvimento de medicamentos antivirais, após a identificação feita por um time de pesquisa japonês. Além disso, a Horizon Microtechnologies está acelerando a industrialização de sua plataforma de fabricação aditiva metálica em polímeros por meio do projeto IP-MASS, um projeto de dois anos com financiamento de 500.000 euros. A seleção da ESA Phi-Lab fortalece a iniciativa de industrialização da empresa.", "cultura": "O Papa encerrou sua viagem pela Argentina com uma missa que reuniu 2 milhões de fiéis na Basílica de Luján, marcando o fim de uma jornada que passou pelo Peru. Em São Paulo, o 34º Festival MixBrasil de Cultura da Diversidade, com o tema 'Todos os Futuros Possíveis', apresenta mais de 130 filmes, além de peças de teatro, literatura, mostras de jogos digitais e performances, abrangendo públicos LGBTQIA+ e atrações internacionais. A Ceci foi declarada a melhor padaria de São Paulo no Padocaria 2026, um concurso local. Além disso, a atriz Leonor Benedetto viajará para Roma para apresentar sua última peça, 'Dante e Borges: Um Diálogo no Paraíso', que ela escreveu e protagoniza, refletindo sobre sua carreira e história pessoal.", "sociedade": "A Espanha está enfrentando sua primeira greve geral em 14 anos, com protestos que exigem moradias acessíveis, controle dos aluguéis e melhores salários. Essas manifestações, que ocorrem 18 dias antes das eleições, estão pressionando tanto o governo quanto a oposição. Em São Paulo, o programa Minha Casa, Minha Vida responde por 70% das vendas de imóveis. Os lançamentos de imóveis sob esse programa cresceram mais rapidamente do que as vendas, aumentando 65% em um ano. No Distrito Federal, uma mulher foi agredida durante uma situação que resultou em confusão e levou cinco pessoas à delegacia. Além disso, o governo investirá R$ 24 milhões para levar internet e celular a 190 localidades rurais, beneficiando mais de 118 mil brasileiros em 17 estados e no Distrito Federal.", "meio_ambiente": "A COP31, a maior cúpula climática da história, está em andamento em Antalya, Turquia, com a participação de 102 líderes de países. O Brasil, com a segunda maior delegação, apresentou medidas ambientais para manter as exportações para a Europa, enquanto o presidente Lula discursou tanto na abertura quanto no segmento de alto nível. No entanto, a ausência de líderes das sete maiores economias desenvolvidas, com exceção do primeiro-ministro britânico, é um contraponto. O chefe da ONU, Guterres, alertou que a crise climática está avançando mais rápido do que as ações tomadas para enfrentá-la. O Brasil melhorou seu ranking de proteção climática devido à redução do desmatamento na Amazônia e ao aumento da utilização de energias renováveis, mas a expansão do petróleo e gás e as emissões de gases de efeito estufa de setores poluentes continuam sendo obstáculos. Em paralelo, a Embrapii e a agência alemã GIZ lançaram uma chamada de financiamento no valor de R$ 81 milhões para projetos de pesquisa e desenvolvimento voltados à redução das emissões de CO2 na cadeia industrial do aço e do cimento no Brasil. Além disso, a seca atinge 59% do Brasil e 49,5% dos municípios enfrentam alagamentos, de acordo com uma pesquisa do IBGE. As massas de ar polar se afastam e as temperaturas começam a subir, com áreas do Centro-Sul do país podendo enfrentar chuva forte, granizo e ventos de até 80 km/h.", "direitos_humanos": "O Tribunal Supremo da ilha de Trinidad e Tobago anulou uma lei de 1986 que proibia relações sexuais entre adultos do mesmo sexo, consentidas, em decisão que representa uma vitória significativa para os direitos da comunidade LGBTQ+ na região. A decisão, tomada pelo tribunal mais alto do país, considerou que a lei violava direitos fundamentais à privacidade e liberdade individual. Em outro desenvolvimento, a Comissão de Direitos Humanos pediu ao presidente da Nigéria que interceda sobre supostas violações cometidas contra os Mahamid, um grupo árabe na Nigéria, destacando a necessidade de proteção e respeito aos direitos humanos de minorias étnicas. Além disso, o Secretário de Estado britânico para Negócios e Comércio, Ed Miliband, alertou líderes mundiais na COP31 que a crise climática representa uma ameaça à segurança nacional de todos os países, com cenários de destruição aparentemente de ficção científica se tornando realidade e choques econômicos causados por combustíveis fósseis se tornando a regra."}, "resumo_do_dia": {"politica_nacional": [{"id": 256900, "titulo": "Como o regimento do Senado permite destravar projeto engavetado por Flávio Bolsonaro", "url": "https://veja.abril.com.br/politica/como-o-regimento-do-senado-permite-destravar-projeto-engavetado-por-flavio-bolsonaro/", "fonte_id": "veja", "data_pub": "2026-11-11T17:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Disposições internas permitem que projetos relacionados ao combate a facções criminosas possam ser levados diretamente à CCJ (Comissão de Constituição e Justiça) sem passar por outros órgãos do Senado. Isso pode ajudar a desengavetar projetos que estavam parados, como os relacionados ao filho do presidente.", "titulo_pt": "Como disposições internas do Senado podem acelerar projetos de combate a facções criminosas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 256977, "titulo": "Moradores bloqueiam BR-040 contra desapropriações em Nova Lima (MG)", "url": "https://www.metropoles.com/minas-gerais/moradores-bloqueiam-br-040-contra-desapropriacoes-em-nova-lima-mg", "fonte_id": "metropoles", "data_pub": "2026-11-11T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Moradores bloquearam a BR-040 em Nova Lima, Minas Gerais, contra desapropriações, interditando os dois sentidos da rodovia no km 569.5. A Polícia Rodoviária Federal (PRF) e a Polícia Militar (PM) estão negociando a liberação do tráfego.", "titulo_pt": "Moradores bloqueiam BR-040 contra desapropriações em Nova Lima (MG)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 257005, "titulo": "Projeto de ajuste fiscal será apresentado por Jaques e relatado por Braga", "url": "https://www.cnnbrasil.com.br/politica/projeto-de-ajuste-fiscal-sera-apresentado-por-jaques-e-relatado-por-braga/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-11T17:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um projeto de ajuste fiscal será apresentado por Jaques e relatado por Braga. O objetivo é viabilizar um ajuste de 0,5% do PIB para o próximo ano.", "titulo_pt": "Projeto de ajuste fiscal será apresentado por Jaques e relatado por Braga", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 256983, "titulo": "Reforma tributária: governo vai propor adiar pagamento definitivo da CBS", "url": "https://www.metropoles.com/brasil/reforma-tributaria-governo-vai-propor-adiar-pagamento-definitivo-da-cbs", "fonte_id": "metropoles", "data_pub": "2026-11-11T17:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo propõe adiar o pagamento definitivo da Contribuição para o Financiamento da Seguridade Social (CBS). Empresários poderiam optar por realizar um recolhimento presumido no início de fevereiro deste ano.", "titulo_pt": "Reforma tributária: governo vai propor adiar pagamento definitivo da CBS", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 256769, "titulo": "Damares volta a cobrar Anac sobre voos de aviões ligados a Vorcaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/damares-volta-a-cobrar-anac-sobre-voos-de-avioes-ligados-a-vorcaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-11T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A senadora Damares Alves cobrou informações sobre voos de aviões ligados ao ex-banqueiro Daniel Vorcaro após a Anac notificar as empresas por falta de autorização para transporte remunerado de passageiros.", "titulo_pt": "Damares volta a cobrar Anac sobre voos de aviões ligados a Vorcaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 257044, "titulo": "Homens de meia-idade e com ensino médio: o perfil de quem elegeu os deputados campeões de voto em SP nas eleições de 2026", "url": "https://www.bbc.com/portuguese/articles/cm3r5v2el35vo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-11T17:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os dados da votação no estado de São Paulo foram cruzados com o cadastro do eleitorado das seções, revelando uma polarização ideológica nas eleições de 2026, onde os deputados mais votados representam pautas à esquerda e à direita.", "titulo_pt": "Homens de meia-idade e com ensino médio: o perfil de quem elegeu os deputados campeões de voto em SP nas eleições de 2026", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 256770, "titulo": "Câmara do Rio concede Medalha Chiquinha Gonzaga a Eduarda Campopiano; oposição reage", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/camara-do-rio-concede-medalha-chiquinha-gonzaga-a-eduarda-campopiano-oposicao-reage.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-11T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara Municipal do Rio de Janeiro aprovou a concessão da Medalha Chiquinha Gonzaga à deputada estadual eleita por São Paulo Eduarda Campopiano, que se declara abertamente antifeminista. A decisão gerou reação da oposição.", "titulo_pt": "Câmara do Rio concede Medalha Chiquinha Gonzaga a deputada antifeminista; oposição reage", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 256782, "titulo": "Quem é Ricardo Magro, alvo de mandado de prisão por suspeita de fraude fiscal", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/quem-e-ricardo-magro-alvo-de-mandado-de-prisao-por-suspeita-de-fraude-fiscal.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O empresário Ricardo Magro, ex-dono da Refit, foi alvo de mandados de prisão preventiva no âmbito da Operação Charon, deflagrada pelo Ministério Público do Estado do Rio de Janeiro. Ele e quatro parentes foram investigados por suspeita de fraude fiscal.", "titulo_pt": "Quem é Ricardo Magro, alvo de mandado de prisão por suspeita de fraude fiscal", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 256783, "titulo": "Sem contar penduricalhos, distância entre topo e classe média do serviço público diminui", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/sem-contar-penduricalhos-distancia-entre-topo-e-classe-media-do-servico-publico-diminui.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A diferença salarial entre os servidores públicos mais bem remunerados e aqueles no meio da distribuição salarial diminuiu nos últimos anos, de acordo com o Anuário do Serviço Público publicado pelas edições de 2024, 2025 e 2026 do República.org.", "titulo_pt": "Distância entre os servidores públicos mais bem pagos e a classe média do serviço público diminuiu", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 256784, "titulo": "Sabesp muda conta de água para se adequar à reforma tributária; veja o que muda", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/sabesp-muda-conta-de-agua-para-se-adequar-a-reforma-tributaria-veja-o-que-muda.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Sabesp começou a emitir uma nova fatura de água desde segunda-feira (9), com campos específicos para os tributos da reforma tributária. A mudança afeta tanto a versão impressa quanto a digital da fatura.", "titulo_pt": "Sabesp altera fatura de água para se adequar à reforma tributária", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 256771, "titulo": "PL mantém indefinição sobre presidência da Câmara em meio a racha sobre apoio a Motta", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/pl-mantem-indefinicao-sobre-presidencia-da-camara-em-meio-a-racha-sobre-apoio-a-motta.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-11T16:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A bancada do PL na Câmara não definiu seu apoio à reeleição de Hugo Motta para a presidência da Câmara em 2027, devido a possíveis candidatos internos. A decisão ocorreu em uma reunião realizada em 11 de novembro de 2026.", "titulo_pt": "PL mantém indefinição sobre presidência da Câmara em meio a racha sobre apoio a Motta", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 256916, "titulo": "Rouco, Lula pede para ministro ler segundo discurso da COP31: ‘Me represente da forma mais efusiva possível’", "url": "https://veja.abril.com.br/politica/rouco-lula-pede-para-ministro-ler-segundo-discurso-da-cop31-me-represente-da-forma-mais-efusiva-possivel/", "fonte_id": "veja", "data_pub": "2026-11-11T16:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva transferiu a palavra ao ministro do Meio Ambiente durante a Cúpula de Líderes sobre Florestas em Antália, solicitando que o ministro leu o segundo discurso.", "titulo_pt": "Lula pede para ministro ler segundo discurso da COP31: 'me represente da forma mais efusiva possível'", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 256836, "titulo": "Governo descarta adiamento da reforma tributária", "url": "https://g1.globo.com/economia/blog/ana-flor/post/2026/11/11/governo-descarta-adiamento-da-reforma-tributaria.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-11T16:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo não planeja adiar a reforma tributária, mas permitirá um período de adaptação de seis meses para as empresas, durante o qual elas poderão ser isentas de multas. O modelo 'Split Payment', que divide imediatamente a arrecadação entre União, Estados e municípios, continuará sendo implementado.", "titulo_pt": "Governo descarta adiamento da reforma tributária", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 256837, "titulo": "Líderes discursam na sessão de alto nível da COP31; acompanhe ao vivo", "url": "https://g1.globo.com/politica/ao-vivo/lula-cop-31-na-turquia.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-11T16:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Líderes estavam fazendo discursos na sessão de alto nível da COP31, mas Luiz Inácio Lula da Silva não falou conforme programado. Ele havia discursado mais cedo na abertura da Cúpula dos Líderes, apresentando uma fala rouca e pedindo que o ministro do Meio Ambiente leitasse outra.", "titulo_pt": "Líderes discursam na sessão de alto nível da COP31; acompanhe ao vivo", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 256772, "titulo": "Com Milton Leite preso, União Brasil encolhe em SP e constrange Tarcísio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/com-milton-leite-preso-uniao-brasil-encolhe-em-sp-e-constrange-tarcisio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-11T16:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A prisão de Milton Leite, ex-presidente da Câmara Municipal de São Paulo e atualmente do União Brasil, e a denúncia por integrar a facção PCC desestruturaram o partido na campanha eleitoral. Isso constrangeu o governador Tarcísio de Freitas, que administra a relação com o União Brasil.", "titulo_pt": "Com Milton Leite preso, União Brasil encolhe em SP e constrange Tarcísio", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 256773, "titulo": "Multa de R$ 7,5 mi aplicada à Meta vai para fundo partidário e não fica com PT", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/multa-de-r-75-mi-aplicada-a-meta-por-tratamento-desigual-vai-para-o-fundo-partidario-e-nao-fica-com-pt.shtml", "fonte_id": , "titulo_pt": "Suposto espia chinês barrado do retorno à Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 257492, "titulo": "MOFA begins withdrawal of staff from office in PNG", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/12/2003867599", "fonte_id": "taipei_times", "data_pub": "2026-11-12T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A MOFA está iniciando o processo de retirada de funcionários de seu escritório na Papua-Nova Guiné. Este movimento envolve a redução da presença diplomática no país.", "titulo_pt": "MOFA começa a retirar funcionários do escritório em papua-nova Guiné", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 257137, "titulo": "Huelga general 11N y actualidad política, en directo | Miles de personas recorren las calles de numerosas ciudades en las manifestaciones de la huelga general", "url": "https://elpais.com/espana/2026-11-11/ultima-hora-de-la-huelga-general-y-la-actualidad-politica-en-directo.html", "fonte_id": "elpais_america", "data_pub": "2026-11-11T17:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Maior de 50 pessoas foram detidas durante a huelga general no dia 11 de novembro. Os sindicatos consideram o evento um 'sucesso' acima das expectativas, enquanto a CEOE vê o baixo comparecimento como um 'fracasso'. Manifestações foram canceladas em algumas cidades devido a condições climáticas adversas.", "titulo_pt": "Huelga geral 11N e atualidade política, em directo | milhares marcham pelas ruas de várias cidades em protestos", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 257135, "titulo": "La visita del papa León XIV, en vivo | El Pontífice concluye su paso por Argentina y viaja a Perú", "url": "https://elpais.com/america/2026-11-11/la-visita-del-papa-leon-xiv-en-vivo.html", "fonte_id": "elpais_america", "data_pub": "2026-11-11T17:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Papa realizou uma missa multitudinária em Luján antes de viajar para a última parada de sua viagem pela América do Sul, direcionada para o Peru.", "titulo_pt": "A visita do papa em luján antes de seguir para o peru", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 257213, "titulo": "Kenya Starts Countdown to End of Ebola Outbreak", "url": "https://www.nytimes.com/2026/11/11/world/africa/kenya-ebola-countdown.html", "fonte_id": "nyt_world", "data_pub": "2026-11-11T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Kenia inicia o contagem regressiva para o fim da epidemia de Ebola. O marco é mais uma prova de que os países africanos têm conseguido prevenir a transmissão comunitária e isolar os casos menores que chegam da República Democrática do Congo.", "titulo_pt": "Quênia inicia contagem regressiva para fim da epidemia de Ebola", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 256888, "titulo": "Irã classifica Forças Aérea e Naval da Argentina como terroristas", "url": "https://www.poder360.com.br/poder-internacional/ira-classifica-forcas-aerea-e-naval-da-argentina-como-terroristas/", "fonte_id": "poder360", "data_pub": "2026-11-11T17:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Irã incluiu as Forças Aérea e Naval da Argentina na lista de organizações terroristas. Em março, a Argentina havia colocado a Guarda Revolucionária iraniana na mesma lista.", "titulo_pt": "Irã inclui Forças Aérea e Naval da Argentina na lista de terroristas", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 257782, "titulo": "Serbian Ex-Minister Arrested for Suspected Abuse of Office", "url": "https://balkaninsight.com/2026/11/11/serbian-ex-minister-arrested-for-suspected-abuse-of-office/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-11T17:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ex-ministro da Economia sérvio Rade Basta foi detido sob 6-11-11T17:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Alemanha registrou um aumento significativo no número de pessoas que recusam o serviço militar, passando de 3,8 mil em 2025 para quase 17 mil até outubro deste ano. Este salto ocorreu após a entrada em vigor de uma nova lei de alistamento, com o objetivo de aumentar o efetivo militar.", "titulo_pt": "Alemanha registra disparada no número de pessoas que recusam serviço militar", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 257207, "titulo": "Seeking to Broaden Ukraine Talks, U.S. Urges Russia to Include Europe", "url": "https://www.nytimes.com/2026/11/11/world/europe/russia-ukraine-talks-abu-dhabi.html", "fonte_id": "nyt_world", "data_pub": "2026-11-11T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Enviados dos Estados Unidos disseram que iriam a Moscou após negociações em Abu Dhabi, enquanto o Kremlin pede discussões sobre estruturas de segurança europeias.", "titulo_pt": "Estados unidos encorajam Rússia a incluir Europa nas negociações sobre Ucrânia", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 257222, "titulo": "Ukraine talks in Abu Dhabi bring progress on prisoners but not on peace", "url": "https://www.theguardian.com/world/2026/nov/11/ukraine-talks-in-abu-dhabi-bring-progress-on-prisoners-but-not-on-peace", "fonte_id": "guardian_world", "data_pub": "2026-11-11T17:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ucrânia e Rússia acordaram a maior troca de prisioneiros desde o início da guerra durante conversações em Abu Dhabi, mediadas pelos Estados Unidos. No entanto, não houve avanços significativos para um acordo de paz mais amplo.", "titulo_pt": "Negociações em Abu Dhabi trazem avanços na troca de prisioneiros, mas não em paz", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 256866, "titulo": "Irã ameaça atacar bases dos EUA na Europa para retaliar possíveis novos bombardeios", "url": "https://www.cartacapital.com.br/cartaexpressa/ira-ameaca-atacar-bases-dos-eua-na-europa-para-retaliar-possiveis-novos-bombardeios/", "fonte_id": "cartacapital", "data_pub": "2026-11-11T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Irã ameaçou atacar bases dos EUA na Europa como retaliação a possíveis novos bombardeios. A declaração aumenta as preocupações com uma escalada da guerra que poderia afetar regiões além do Oriente Médio.", "titulo_pt": "Irã ameaça atacar bases dos EUA na Europa para retaliar possíveis novos bombardeios", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 257437, "titulo": "Russia-Ukraine talks in UAE secure major prisoner exchange deal", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/11/russia-ukraine-talks-in-uae-secure-major-prisoner-exchange-deal?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-11T16:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rússia e Ucrânia concordaram em um intercâmbio significativo de prisioneiros após dois dias de negociações mediadas pelos Estados Unidos em Abu Dhabi.", "titulo_pt": "Negociações em abu dhabi resultam em acordo de grande porte para troca de prisioneiros entre Rússia e Ucrânia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 256779, "titulo": "Japoneses batem recorde de compras de títulos públicos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/japoneses-batem-recorde-de-compras-de-titulos-publicos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Investidores domésticos japoneses estão batendo recordes em compras de títulos públicos, sinalizando uma possível mudança na preferência por depósitos bancários conservadores do país. Essa tendência pode representar um novo cenário no mercado financeiro japonês.", "titulo_pt": "Japoneses superam recorde em compras de títulos públicos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 257461, "titulo": "US tech stocks surge as AI trade revives", "url": "https://www.ft.com/content/639de881-6017-454f-abfa-cfb191d1e7cd?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-11T17:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações de tecnologia dos EUA subiram, apagando as perdas da semana anterior. O desempenho melhor do que esperado da CoreWeave e a perspectiva de uma avaliação mais alta para o IPO do Anthropic melhoraram osentimento do mercado.", "titulo_pt": "Ações de tecnologia dos EUA avançam com recuperação do trade de IA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 256780, "titulo": "A conta da demora fiscal", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/solange-srour/2026/11/a-conta-da-demora-fiscal.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A demora na resposta ao desequilíbrio fiscal pode levar o Brasil a uma combinação de recessão e inflação alta em 2027. A economia já perdia dinamismo, e as perspectivas pioraram devido à expansão dos gastos e do crédito subsidiado.", "titulo_pt": "A conta da demora fiscal", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 256781, "titulo": "Festival de compras na China testa potencial da IA para impulsionar vendas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/festival-de-compras-na-china-testa-potencial-da-ia-para-impulsionar-vendas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Dia dos Solteiros, um festival de compras no China, demonstra o uso entusiasmado de inteligência artificial para promover vendas. Este evento, que se estende por um mês, ilustra como a China está integrando a IA em suas iniciativas comerciais.", "titulo_pt": "Festival de compras na China testa potencial da IA para impulsionar vendas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 256861, "titulo": "Governo apresentará texto que facilita adaptação à reforma tributária", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/governo-apresentara-texto-que-facilita-adaptacao-a-reforma-tributaria", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-11T16:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal enviará ao Congresso Nacional uma proposta que cria uma regra de transição na cobrança da Contribuição sobre Bens e Serviços (CBS), permitindo que as empresas façam cálculos estimados do imposto nos primeiros meses e ajustem posteriormente, facilitando a adaptação às novas regras. A medida visa reduzir dificuldades na implementação da reforma tributária.", "titulo_pt": "Governo encaminhará proposta de regra de transição para cbs", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 256786, "titulo": "Ações do Magalu sobem mais de 20% em dois dias com crise da Casas Bahia no radar", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/acoes-do-magalu-sobem-mais-de-20-em-dois-dias-com-crise-da-casas-bahia-no-radar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T16:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações do Magazine Luiza subiram mais de 20% em dois dias devido à perspectiva de ganho de participação de mercado, em meio à crise da Casas Bahia. No entanto, o setor varejista ainda enfrenta desafios com o consumo fraco e juros altos no Brasil.", "titulo_pt": "Ações do Magalu ganham mais de 20% em dois dias com crise da Casas Bahia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 257027, "titulo": "IBGE: Produção industrial recua em 14 dos 18 locais pesquisados em setembro", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/ibge-producao-industrial-recua-em-14-dos-18-locais-pesquisados-em-setembro/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-11T16:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A produção industrial recuou em 14 dos 18 locais pesquisados pelo IBGE em setembro. Apenas os estados do Rio de Janeiro, Mato Grosso, Mato Grosso do Sul e Amazonas apresentaram aumento no mês.", "titulo_pt": "IBGE: produção industrial recua em 14 dos 18 locais pesquisados em setembro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 256787, "titulo": "Alta de investimentos da Petrobras preocupa mercado, e ações caem", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/alta-de-investimentos-da-petrobras-preocupa-mercado-e-acoes-caem.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T16:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petrobras aumentou suas projeções de investimentos, o que levou as ações da companhia a cair durante o pregão de quarta-feira. O mercado expressou preocupação com o impacto desses investimentos futuros nos dividendos da empresa.", "titulo_pt": "Aumento de investimentos da Petrobras faz ações cair", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 256789, "titulo": "Falta de seguros contra riscos climáticos ameaça crédito e investimentos, diz chefe da área na ONU", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/11/falta-de-seguros-contra-riscos-climaticos-ameaca-credito-e-investimentos-diz-chefe-da-area-na-onu.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A crescente dificuldade de contratar seguros contra riscos climáticos tende a restringir o crédito e afastar investimentos, além de comprometer as contas públicas e a estabilidade financeira de regiões inteiras. O chefe da área na ONU alerta sobre esses impactos.", "titulo_pt": "Falta de seguros climáticos ameaça crédito e investimentos, diz chefe da ONU", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 257047, "titulo": "Falta ao Banco Central ser central nos conflitos de consumo", "url": "https://www.jota.info/opiniao-e-analise/colunas/fronteiras-regulacao-financeira/falta-ao-banco-central-ser-central-nos-conflitos-de-consumo", "fonte_id": "jota", "data_pub": "2026-11-11T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "95% dos processos sancionadores do Banco Central envolvem formulários, enquanto apenas 1% dos processos abrangem grandes bancos.", "titulo_pt": "Falta ao Banco Central ser Central nos conflitos de consumo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 256790, "titulo": "Congelamento mínimo de R$ 12,8 bi proposto em ajuste não poderá ser desfeito mesmo com aumento de receita", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/piso-de-contingenciamento-de-r-128-bi-sera-anual-e-nao-podera-ser-desfeito-apos-acionado.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T15:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ajuste proposto impõe um congelamento mínimo de R$ 12,8 bilhões nas despesas anualmente, caso o resultado das contas públicas seja inferior ao piso da meta, e essa medida não pode ser revertida mesmo com melhoras na arrecadação.", "titulo_pt": "Congelamento mínimo de R$ 12,8 bi nas despesas não poderá ser desfeito", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 257048, "titulo": "TCU quer dar nota ao saneamento dos municípios", "url": "https://www.jota.info/opiniao-e-analise/colunas/controle-publico/tcu-quer-dar-nota-ao-saneamento-dos-municipios", "fonte_id": "jota", "data_pub": "2026-11-11T15:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TCU (Tribunal de Contas da União) pretende avaliar o desempenho do saneamento nos municípios brasileiros. O indicador criado pela Corte de Contas visa distinguir entre obrigações legais e decisões municipais.", "titulo_pt": "TCU quer avaliar saneamento dos municípios", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 257462, "titulo": "Single-stock perps look like pointiest horn of a bull market", "url": "https://www.ft.com/content/0ecbc732-4d5a-4a3e-97aa-86d19285bcf8?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-11T15:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A incerteza regulatória é o maior obstáculo para a adoção mais ampla, de acordo com uma pesquisa. Os contratos futuros sobre ações individuais parecem indicar o pico do mercado de ações.", "titulo_pt": "Contratos futuros sobre ações individuais parecem indicar o pico do mercado de ações", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 257028, "titulo": "Não só o aço: siderúrgicas querem tarifar carros e eletrodomésticos da China", "url": "https://braziljournal.com/nao-so-o-aco-siderurgicas-querem-tarifar-carros-e-eletrodomesticos-da-china", "fonte_id": "brazil_journal", "data_pub": "2026-11-11T15:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A indústria siderúrgica da América Latina conseguiu ampliar as barreiras comerciais ao aço chinês no último ano. No entanto, os chineses continuam vendendo seus produtos à região através de caminhos indiretos, incorporando o aço em itens como carros, máquinas e eletrodomésticos.", "titulo_pt": "Não só o aço: siderúrgicas querem tarifar carros e eletrodomésticos da China", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 256791, "titulo": "Credores da Braskem apresentam novas propostas para reestruturação da dívida", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/credores-da-braskem-apresentam-novas-propostas-para-reestruturacao-da-divida.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T15:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os principais credores da Braskem apresentaram novas propostas de reestruturação da dívida da empresa, que está em recuperação extrajudicial com dívidas de US$ 10,9 bilhões. A Braskem solicitou o pedido de recuperação em agosto.", "titulo_pt": "Credores da Braskem apresentam novas propostas para reestruturação da dívida", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 257050, "titulo": "STJ discute se valor da marca integra apuração de bens na saída de sócio caso contrato seja omisso", "url": "https://www.jota.info/justica/stj-discute-se-valor-da-marca-integra-apuracao-de-bens-na-saida-de-socio-caso-contrato-seja-omisso", "fonte_id": "jota", "data_pub": "2026-11-11T15:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A relatora do caso no Superior Tribunal de Justiça (STJ) votou a favor da inclusão de ativos intangíveis, como o valor da marca, no levantamento de valores do negócio durante a saída de um sócio, caso o contrato seja omisso sobre o assunto.", "titulo_pt": "STJ debate inclusão de valor da marca no levantamento de bens na saída de sócio", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 257496, "titulo": "Legislature uses AI to read legislation for the first time", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/12/2003867603", "fonte_id": "taipei_times", "data_pub": "2026-11-12T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A legislatura utilizou IA pela primeira vez para analisar leis. Este foi o primeiro uso de inteligência artificial na leitura de legislação pelo parlamento.", "titulo_pt": "Legislatura utiliza IA pela primeira vez para ler legislação", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 257503, "titulo": "AI used in cyberattacks, some originating in HK", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/12/2003867610", "fonte_id": "taipei_times", "data_pub": "2026-11-12T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O uso de inteligência artificial está sendo empregado em ataques cibernéticos, alguns dos quais têm origem na região administrativa especial de Hong Kong.", "titulo_pt": "IA utilizada em ataques cibernéticos, alguns deles provenientes de hong kong", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 257156, "titulo": "RADAR LT: Desarrollan tutor educativo con IA para universitarios", "url": "https://www.latercera.com/videos/noticia/radar-lt-desarrollan-tutor-educativo-con-ia-para-universitarios/", "fonte_id": "la_tercera", "data_pub": "2026-11-11T17:56:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Wawentu, um tutor educativo baseado em inteligência artificial desenvolvido por um acadêmico da Universidade Adolfo Ibáñez, visa transformar o uso da IA na educação, promovendo o pensamento crítico, a argumentação e o aprendizado autônomo.", "titulo_pt": "RADAR LT: desenvolvem tutor educativo com IA para universitários", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 257306, "titulo": "Scoop: Inside Bessent's Situation Room confrontation with Lutnick over China chip security", "url": "https://www.axios.com/2026/11/11/bessent-lutnick-megaspeed-nvidia-china-chips", "fonte_id": "axios", "data_pub": "2026-11-11T17:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário do Tesouro Scott Bessent confrontou o secretário do Comércio Howard Lutnick sobre a falta de inclusão da empresa Nvidia cliente Megaspeed em uma lista de empresas que representam preocupações de segurança nacional. Esta reunião ocorreu durante uma reunião no Quartier-Général da Casa Branca após revelações sobre um affair entre o CEO da Nvidia, Jensen Huang, e Alice Huang, suspeita de ser uma espionagem chinesa.", "titulo_pt": "Scoop: dentro da confrontação no quartier-général da casa branca entre Bessent e Lutnick sobre segurança de chips chineses", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 257408, "titulo": "Nvidia shares rebound as Jensen Huang faces scrutiny ahead of earnings", "url": "https://www.cnbc.com/2026/11/11/nvidia-stock-jensen-huang-affair-china.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-11T17:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores estão avaliando se o affair do CEO Jensen Huang terá efeitos na empresa Nvidia. Ações da Nvidia estão se recuperando.", "titulo_pt": "Ações da nvidia se recuperam enquanto Jensen Huang enfrenta questionamentos antes dos resultados", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 257548, "titulo": "What to know about this year’s UN climate talks", "url": "https://www.technologyreview.com/2026/11/11/1148308/un-climate-talks/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-11T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Delegados, lobbyistas e jornalistas se reúnem anualmente para as negociações climáticas da ONU, que ocorrem este ano em Antalya, Turquia. A COP31 começou oficialmente em 8 de novembro, marcando o início das negociações em um dos maiores palcos do mundo climático.", "titulo_pt": "O que saber sobre as negociações climáticas da ONU deste ano", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 257580, "titulo": "A Startup Wants to Fight AI Bioweapons With AI", "url": "https://www.wired.com/story/startup-fights-ai-bioweapons-with-ai/", "fonte_id": "wired", "data_pub": "2026-11-11T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup Radical Numerics criou um modelo que, segundo a empresa, pode identificar patógenos naturais e gerados por inteligência artificial sem a necessidade de conexão à internet.", "titulo_pt": "Startup quer combater armas biológicas de IA com AI", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 257581, "titulo": "The AO3 Shutdown Is Pitting Fanfic Readers Against Authors", "url": "https://www.wired.com/story/the-ao3-shutdown-is-pitting-fanfic-readers-against-authors/", "fonte_id": "wired", "data_pub": "2026-11-11T16:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma autora de fanfics chamada Heated Rivalry relatou que sua obra foi publicada em sites de espelhos do AO3 sem seu consentimento, deixando um sabor amargo em sua boca.", "titulo_pt": "Encerramento do AO3 divide leitores de fanfics dos autores", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 257465, "titulo": "Humanoid robot start-up backed by Eric Trump in talks to supply IDF", "url": "https://www.ft.com/content/8117b912-ebc7-46b2-90cd-a1ec32e12c5a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-11T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma start-up de robôs humanoides, apoiada por Eric Trump, está em negociações com o Exército Israelense (IDF) para fornecer seus robôs para operações em túneis no Gaza. O uso potencial dos robôs em situações de combate também está sendo discutido.", "titulo_pt": "Start-up de robôs humanoides de Eric Trump em discussões com o IDF para operações no gaza", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 256798, "titulo": "Escândalo da Nvidia expõe riscos crescentes de espionagem contra empresas de IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/escandalo-da-nvidia-expoe-riscos-crescentes-de-espionagem-contra-empresas-de-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T14:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O caso envolvendo o presidente-executivo da Nvidia, Jensen Huang, e sua relação extraconjugal com uma mulher suspeita de ser espiã chinesa ilustra como Pequim e outros países recorrem cada vez mais à espionagem corporativa para obter vantagem na corrida global pela inteligência artificial.", "titulo_pt": "Escândalo da Nvidia expõe riscos crescentes de espionagem contra empresas de IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 256925, "titulo": "No 1º ano da Graduação Saint Paul, alunos criam solução que a Renault pode usar em 2027", "url": "https://exame.com/carreira/no-1o-ano-da-graduacao-saint-paul-alunos-criam-solucao-que-a-renault-pode-usar-em-2027/", "fonte_id": "exame", "data_pub": "2026-11-11T14:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alunos da primeira turma da Graduação Saint Paul desenvolveram uma plataforma com inteligência artificial para a manutenção da Renault, apresentada durante o Transformation Day no Paraná. A solução pode ser utilizada pela montadora em 2027.", "titulo_pt": "No primeiro ano da Graduação Saint Paul, alunos criam solução para a Renault", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 257566, "titulo": "Sony’s latest Pulse wireless headset packs planar magnetic drivers at a good price", "url": "https://www.theverge.com/games/1031291/sony-playstation-pulse-wireless-gaming-headset-hands-on", "fonte_id": "the_verge", "data_pub": "2026-11-11T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O headset wireless PlayStation Pulse da Sony, custando $99,99, oferece som de boa qualidade e algumas funcionalidades adicionais. É uma opção a considerar se você busca um headset básico bem feito.", "titulo_pt": "Novo headset wireless playstation Pulse da sony oferece bom som por um bom preço", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 257567, "titulo": "Adobe’s AI experiments let you walk around in photos and interview your characters", "url": "https://www.theverge.com/tech/1031505/adobe-max-2026-sneaks-experiments-ai", "fonte_id": "the_verge", "data_pub": "2026-11-11T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Adobe anunciou novas ferramentas experimentais durante seu evento Max anual, incluindo a capacidade de transformar imagens em ambientes 3D interativos, criar personagens de IA por meio de conversas, e simplificar a edição de fotos com um processo de cópia e colagem.", "titulo_pt": "Experimentos de IA da adobe permitem caminhar por fotos e entrevistar personagens", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 257583, "titulo": "Duolingo, Strava, and Ticketmaster Are All Caught Up in EU’s New Digital Fairness Rules", "url": "https://www.wired.com/story/duolingo-strava-and-ticketmaster-are-all-caught-up-in-eus-new-digital-fairness-rules/", "fonte_id": "wired", "data_pub": "2026-11-11T13:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Digital Fairness Act está sendo implementada para combater práticas ocultas em plataformas digitais, permitindo que usuários desativem vitórias consecutivas e exigindo que influenciadores revelem quando estão sendo remunerados.", "titulo_pt": "Duolingo, Strava e Ticketmaster estão sob as novas regras de justiça Digital da ue", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 257521, "titulo": "Google in, but Nvidia out as US lines up Apec CEO Summit delegation: source", "url": "https://www.scmp.com/economy/global-economy/article/3374105/google-nvidia-out-us-lines-apec-ceo-summit-delegation-source", "fonte_id": "scmp", "data_pub": "2026-11-11T13:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Representantes de Google e Boeing estarão incluídos na delegação de negócios dos Estados Unidos para o Apec CEO Summit em Shenzhen, conforme confirmado pelo organizador do evento. No entanto, a presença do CEO da Nvidia, Jensen Huang, ainda não foi confirmada.", "titulo_pt": "Google e boeing na delegação dos EUA para Apec CEO Summit, mas huang ainda não confirmado", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 257549, "titulo": "The Download: preserving minds and weighing open AI risks", "url": "https://www.technologyreview.com/2026/11/11/1148424/the-download-preserving-minds-open-ai-risks/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-11T13:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O newsletter The Download discute seis ideias inovadoras para preservar a memória humana à medida que envelhecemos. O texto destaca a continuidade da identidade pessoal ao longo da vida, mesmo com a perda de memórias específicas.", "titulo_pt": "Download: preservando memórias e ponderando riscos de IA aberta", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 257648, "titulo": "PAHO secures first-ever region-wide access agreements for HPV testing across Latin America and the Caribbean, with support from Unitaid", "url": "https://www.paho.org/en/news/11-11-2026-paho-secures-first-ever-region-wide-access-agreements-hpv-testing-across-latin", "fonte_id": "paho", "data_pub": "2026-11-11T19:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A PAHO (Organização Pan-Americana da Saúde) conseguiu acordos de acesso regionais para testes de HPV pela primeira vez em toda a América Latina e Caribe, com apoio da Unitaid. Esses acordos visam melhorar o acesso a testes de HPV na região.", "titulo_pt": "PAHO conquista primeiros acordos regionais de acesso a testes de HPV em toda a américa latina e caribe, com apoio da Unitaid", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 257617, "titulo": "Opinion: What MAHA’s support for Russell Brand tells us about the movement", "url": "https://www.statnews.com/2026/11/11/maha-russell-brand-conviction-violence-rfk-jr/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-11T17:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A aliança entre MAHA e Russell Brand não é uma exceção, segundo Gavin Yamey.", "titulo_pt": "Opinião: o que o apoio de MAHA a Russell Brand nos diz sobre o movimento", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 257018, "titulo": "Banhos frios podem fortalecer a imunidade, sugere estudo", "url": "https://www.cnnbrasil.com.br/saude/banhos-frios-podem-fortalecer-a-imunidade-sugere-estudo/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-11T17:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pacientes que tomaram banhos frios durante três meses apresentaram uma redução de 26% nos sintomas de gripe e infecções em comparação com aqueles que tomavam banhos quentes, conforme sugere um estudo.", "titulo_pt": "Banhos frios podem fortalecer a imunidade, sugere estudo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 257618, "titulo": "STAT+: BMI alternative would flip obesity diagnosis for millions, study finds", "url": "https://www.statnews.com/2026/11/11/obesity-diagnosis-bmi-lancet-commission-proposal-impact/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-11T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo método proposto para identificar obesidade poderia inverter as diagnósticos de milhões de pessoas. Apoiadores argumentam que isso poderia levar a um cuidado mais preciso.", "titulo_pt": "Novo método de identificar obesidade poderia inverter diagnósticos de milhões", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 257649, "titulo": "This magic mushroom can kill", "url": "https://www.sciencenews.or
