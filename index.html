 "texto_pt": "Há seis candidatos disputando o cargo de governador de Mato Grosso nas eleições de 2026. O Palácio dos Paiaguás é a sede do governo estadual.", "titulo_pt": "Quem são os candidatos ao governo de Mato Grosso (MT) nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 102688, "titulo": "Eleições 2026: quem são os candidatos mais ricos na disputa à presidência", "url": "https://veja.abril.com.br/politica/eleicoes-2026-quem-sao-os-candidatos-mais-ricos-na-disputa-a-presidencia/", "fonte_id": "veja", "data_pub": "2026-08-13T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Romeu Zema é o candidato mais rico na disputa presidencial de 2026, com patrimônio formado majoritariamente por participações societárias.", "titulo_pt": "Eleições 2026: quem são os candidatos mais ricos na corrida à presidência", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 102912, "titulo": "Quem são os candidatos ao Senado pelo Espírito Santo (ES) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-os-candidatos-ao-senado-pelo-espirito-santo-es-nas-eleicoes-2026-agosto", "fonte_id": "jota", "data_pub": "2026-08-13T20:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Onze candidatos disputam as duas vagas de senador pelo Espírito Santo nas eleições de outubro.", "titulo_pt": "Quem são os candidatos ao Senado pelo Espírito Santo (ES) nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}]}], "mundo": [{"id": 102417, "titulo": "Taiwan targeted in AI-driven hacking campaign", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/14/2003862463", "fonte_id": "taipei_times", "data_pub": "2026-08-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Taiwan foi alvo de uma campanha de hacking baseada em inteligência artificial. Os detalhes específicos da operação não foram fornecidos nessa notícia.", "titulo_pt": "Taiwan alvo de campanha de hacking com uso de IA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 102423, "titulo": "U.S. urges China to halt military pressure on Taiwan after naval drill", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/14/2003862476", "fonte_id": "taipei_times", "data_pub": "2026-08-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos pediram à China para que parasse de aplicar pressão militar sobre a Taiwan após uma manobra naval. O incidente envolveu exercícios militares realizados pela China perto das águas taiwanesas.", "titulo_pt": "EUA pedem a China para parar com pressão militar sobre Taiwan após manobras navais", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 102427, "titulo": "Government bodies urged to collaborate on APEC subfund", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/14/2003862480", "fonte_id": "taipei_times", "data_pub": "2026-08-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foram encorajados os órgãos governamentais a colaborarem na subcota do FMI para APEC. O foco está na cooperação entre as entidades governamentais relacionada ao fundo.", "titulo_pt": "Governo incentivado a colaborar no subfundo da APEC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 102440, "titulo": "EDITORIAL: AIT shows deepening Taiwan-US ties", "url": "https://www.taipeitimes.com/News/editorials/archives/2026/08/14/2003862453", "fonte_id": "taipei_times", "data_pub": "2026-08-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo editorial destaca aprofundamento das relações entre Taiwan e Estados Unidos.", "titulo_pt": "AIT mostra aprofundamento das relações entre taiwan e estados unidos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 102986, "titulo": "Bernie Sanders says he can’t get involved in every race. Some allies wish he would.", "url": "https://www.politico.com/news/2026/08/13/bernie-sanders-wisconsin-progressives-hong-01037121", "fonte_id": "politico", "data_pub": "2026-08-13T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alguns progressistas notáveis estão acusando o senador Bernie Sanders de Vermont de não apoiar Francesca Hong na corrida eleitoral no Wisconsin. Sanders afirmou que tem recursos limitados.", "titulo_pt": "Progressistas criticam Sanders por não endossar candidata em wisconsin", "veiculo": "Politico", "pais": "EUA", "classe": "A"}, {"id": 103072, "titulo": "'Agility vs depth': How the Mecca pact stacks up against the UAE-Israel alliance", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/agility-vs-depth-how-mecca-pact-stacks-against-uae-israel-alliance", "fonte_id": "middle_east_eye", "data_pub": "2026-08-13T21:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este verão, um diplomata sênior dos Emirados Árabes Unidos, Lanna Nusseibeh, realizou consultas com um aliado americano na Europa. Embora a reunião não tenha sido notável, os participantes europeus enfatizaram que os Emirados estão totalmente alinhados com Israel.", "titulo_pt": "Agilidade vs profundidade: como o pacto de meca se compara à aliança dos emirados árabes unidos e israel", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 102971, "titulo": "Australia news live: Albanese says he argued for tariff exemption in ‘productive and substantial’ call with Trump", "url": "https://www.theguardian.com/australia-news/live/2026/aug/14/australia-news-live-kpmg-inquiry-icac-alan-jones-trial-gst-treasurer-jim-chalmers-anthony-albanese-angus-taylor-pauline-hanson-labor-liberals-one-nation-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-08-13T21:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anthony Albanese, primeiro-ministro australiano, realizou uma conversa produtiva e substancial com Donald Trump. Durante o telefonema, os líderes discutiram questões globais e regionais, incluindo conflitos no Oriente Médio e desenvolvimentos recentes no Pacífico, reafirmando o compromisso do AUKUS.", "titulo_pt": "Albanese diz que chamada com Trump foi 'produtiva' e 'substancial', e aukus continua em pleno vapor", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 103029, "titulo": "Engine parts smashed Ryanair window that man's head was sucked out of, report says", "url": "https://www.bbc.co.uk/news/articles/cr59j4z3vl8o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-13T21:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório preliminar dos investigadores americanos afirma que uma pala do rotor do motor se rompeu durante o voo de volta para a Grécia, realizado no mês anterior. O incidente ocorreu em um voo da Ryanair.", "titulo_pt": "Parte do motor quebrou Ryanair window que homem foi sugado, relatório diz", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 102659, "titulo": "Familiares relatam tentativas de suicídio de militares a bordo de porta-aviões dos EUA no Oriente Médio", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/08/familiares-relatam-tentativas-de-suicidio-de-militares-a-bordo-de-porta-avioes-dos-eua-no-oriente-medio.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-13T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O secretário de Defesa dos Estados Unidos, Pete Hegseth, negou que as condições a bordo do porta-aviões USS Abraham Lincoln no Oriente Médio estejam ruins. Ele afirmou que as informações sobre o assunto são 'completamente distorcidas'.", "titulo_pt": "Familiares relatam tentativas de suicídio de militares a bordo de porta-aviões dos EUA no Oriente Médio", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 103034, "titulo": "Raul Castro makes rare public appearance at Fidel centenary event", "url": "https://www.france24.com/en/americas/20260813-raul-castro-makes-rare-public-appearance-at-fidel-centenary-event", "fonte_id": "france24", "data_pub": "2026-08-13T21:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Raul Castro, de 95 anos, fez uma rara aparição pública no evento que comemorava o centenário do nascimento de seu irmão Fidel em Havana. O ex-presidente recebeu aplausos prolongados durante o evento seguro realizado na capital cubana.", "titulo_pt": "Raul Castro faz rara aparição pública no centenário de Fidel", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 102734, "titulo": "Chefe do Pentágono diz que PCC e CV são \"alvos legítimos\" dos EUA", "url": "https://www.metropoles.com/mundo/chefe-do-pentagono-diz-que-pcc-e-cv-sao-alvos-legitimos-dos-eua", "fonte_id": "metropoles", "data_pub": "2026-08-13T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O chefe do Pentágono, Peter Hegseth, declarou que o PCC e CV são alvos legítimos dos Estados Unidos durante uma coletiva de imprensa no Panamá.", "titulo_pt": "Chefe do Pentágono diz que PCC e CV são 'alvos legítimos' dos EUA", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 103149, "titulo": "(URGENT) Trump signs proclamation to impose 15 pct on drones, components from S. Korea, Japan, others", "url": "https://en.yna.co.kr/view/AEN20260814000400315", "fonte_id": "yonhap_news", "data_pub": "2026-08-13T21:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, assinou uma proclamação para impor uma tarifa de 15% sobre drones e componentes provenientes da Coreia do Sul, Japão e outros países.", "titulo_pt": "(Urgente) Trump assina proclamação para aplicar 15% de tarifa em drones e componentes de S. Korea, Japão, entre outros", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 103111, "titulo": "What the Mecca military pact means for China", "url": "https://www.scmp.com/opinion/world-opinion/article/3363663/what-mecca-military-pact-means-china?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-13T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os príncipes hereditários do Reino de Arábia Saudita, o presidente da Turquia e o primeiro-ministro do Paquistão assinaram um acordo de defesa em Meca, reestruturando a arquitetura de segurança do Oriente Médio. O pacto estabelece uma garantia mútua de defesa, considerando que um ataque armado contra um dos signatários será tratado como um ataque aos demais.", "titulo_pt": "O que o pacto militar de meca significa para a China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 102894, "titulo": "El régimen de Ortega exhibe en televisión al obispo Abelardo Mata tras 40 días en paradero desconocido en Nicaragua", "url": "https://elpais.com/america/2026-08-13/el-regimen-de-ortega-exhibe-en-television-al-obispo-abelardo-mata-tras-40-dias-en-paradero-desconocido-en-nicaragua.html", "fonte_id": "elpais_america", "data_pub": "2026-08-13T21:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O bispo Abelardo Mata reapareceu nos meios de comunicação do governo nicaragüense 24 horas após a CIDH exigir medidas urgentes para garantir sua saúde e integridade, que haviam sido desconhecidas durante quatro décadas.", "titulo_pt": "Regime de Ortega exibe bispo Abelardo Mata em tv após 40 dias desaparecido na nicarágua", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 102946, "titulo": "Female Afghans Erased From Public Life in Five Years of Taliban Rule", "url": "https://www.nytimes.com/2026/08/13/world/asia/afghan-women-taliban-rule.html", "fonte_id": "nyt_world", "data_pub": "2026-08-13T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Decretos que limitam os direitos das mulheres em relação à educação, trabalho, viagem e independência agora ameaçam causar danos permanentes ao Afeganistão, according to experts.", "titulo_pt": "Mulheres afegãs excluídas da vida pública nos cinco anos de regra do talibã", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 102990, "titulo": "Estados Unidos menciona a Chile como parte del “Caballo de Troya” del comercio chino", "url": "https://www.latercera.com/pulso/noticia/estados-unidos-menciona-a-chile-como-parte-del-caballo-de-troya-del-comercio-chino/", "fonte_id": "la_tercera", "data_pub": "2026-08-13T21:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um relatório da Casa Branca, publicado nesta semana, inclui o Chile como parte de um grupo de países que seriam utilizados por China para expandir seu comércio nos Estados Unidos, aproveitando vantagens arancelares e portuárias dessas nações.", "titulo_pt": "Estados Unidos aponta Chile como parte do 'cavalo de troia' chinês no comércio", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 102843, "titulo": "Nubank tem lucro recorde no 2º tri; crédito cresce menos", "url": "https://braziljournal.com/nubank-tem-lucro-recorde-no-2o-tri-credito-cresce-menos/", "fonte_id": "brazil_journal", "data_pub": "2026-08-13T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Nubank registrou um lucro recorde de US$ 1,1 bilhão no segundo trimestre de 2023, crescimento de 17% em relação ao primeiro trimestre e de 49% em comparação com o mesmo período do ano anterior. O retorno sobre o patrimônio líquido (ROE) foi de 33%, aumento em relação aos 29% do trimestre anterior.", "titulo_pt": "Nubank registra lucro recorde no segundo trimestre; crédito cresce menos", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 102626, "titulo": "Corregedoria afasta juiz do caso Banco Santos após áudio com sugestão de venda ao Master", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/corregedoria-afasta-juiz-do-caso-banco-santos-apos-audio-com-sugestao-de-venda-ao-master.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-13T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O juiz Paulo Furtado de Oliveira Filho foi afastado do processo de falência do Banco Santos após a divulgação de um áudio onde ele sugeriu aos herdeiros que vendessem suas participações ao Banco Master. A decisão foi tomada pela Corregedoria Nacional de Justiça.", "titulo_pt": "Corregedoria afasta juiz do caso Banco Santos após sugestão de venda", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 102627, "titulo": "Puxado pelo crédito, lucro do Nubank alcança US$ 1 bilhão pela primeira vez", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/puxado-pelo-credito-lucro-do-nubank-alcanca-us-1-bilhao-pela-primeira-vez.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-13T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Nubank registrou um lucro líquido de US$ 1,061 bilhão no segundo trimestre deste ano, impulsionado pelo crescimento nos empréstimos e cartões de crédito. As receitas do banco aumentaram significativamente durante o período.", "titulo_pt": "Lucro do Nubank atinge US$ 1 bilhão pela primeira vez, puxado por crescimento no crédito", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 102909, "titulo": "Galípolo elogia trabalho do FGC e diz que regulador sempre avalia próximo risco", "url": "https://www.jota.info/tributos-e-empresas/mercado/galipolo-elogia-trabalho-do-fgc-e-diz-que-regulador-sempre-avalia-proximo-risco", "fonte_id": "jota", "data_pub": "2026-08-13T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Banco Central elogiou o trabalho recente realizado pelo Fundo Garantidor de Créditos (FGC) e associações do mercado, focado nas mudanças das regras do fundo. Ele destacou a cooperação entre as partes envolvidas na implementação dessas alterações.", "titulo_pt": "Galípolo elogia trabalho do FGC e diz que regulador sempre avalia próximo risco", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 102628, "titulo": "Bloqueio ao acesso de bets chega a 5 milhões de pessoas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/bloqueio-ao-acesso-de-bets-chega-a-5-milhoes-de-pessoas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-13T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O sistema de autoexclusão das plataformas de apostas contava com 5 milhões de CPFs inscritos, conforme informado pelo Ministério da Fazenda nesta quinta-feira (13).", "titulo_pt": "Bloqueio ao acesso de apostas atinge 5 milhões de pessoas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 103097, "titulo": "US sells 30-year bonds at highest borrowing costs since 2001", "url": "https://www.ft.com/content/9c9c948f-dc8b-4385-a9b9-4b98dc1eadd9?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-13T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos venderam títulos de dívida com prazo de 30 anos a taxas de juros das maiores desde 2001, em meio à preocupação com o aumento da dívida pública e a inflação persistente.", "titulo_pt": "EUA vendem títulos de 30 anos a taxas mais altas desde 2001", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 102678, "titulo": "Cai diferença entre homens e mulheres no acesso ao emprego formal", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/cai-diferenca-entre-homens-e-mulheres-no-acesso-ao-emprego-formal", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-13T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No Brasil, das 62,8 milhões de vagas formais ativas, ainda há uma predominância masculina, mas a diferença entre homens e mulheres no acesso ao emprego formal diminuiu nos últimos anos. Estes dados foram publicados pela Rais Mensal de junho pelo Ministério do Trabalho e Emprego.", "titulo_pt": "Reduzida a diferença entre homens e mulheres no acesso ao emprego formal", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 102629, "titulo": "Fazenda suspende licença da Pixbet, investigada pela PF, por falhas e falta de documentos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/fazenda-suspende-licenca-da-pixbet-investigada-pela-pf-por-falhas-e-falta-de-documentos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-13T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Fazenda suspendeu a licença da empresa Pixbet Soluções Tecnológicas por falta de mecanismos de monitoramento de jogadores compulsivos e não entrega dos documentos obrigatórios.", "titulo_pt": "Fazenda suspende licença da Pixbet, investigada pela PF", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 103039, "titulo": "US court rules Trump can end tariff exemption for small parcels", "url": "https://www.lemonde.fr/en/economy/article/2026/08/13/us-court-rules-trump-can-end-tariff-exemption-for-small-parcels_6756481_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-13T21:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A corte americana decidiu que o presidente pode terminar a excepção de tarifas para pequenos pacotes. O programa presidencial enfrentou uma série de contratempos legais desde que o presidente impôs tarifas amplos sobre parceiros comerciais no ano passado.", "titulo_pt": "Corte americana permite que Trump encerre exceção de tarifas para pequenas encomendas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 102632, "titulo": "Promotoria do Rio cumpre mandados contra bets ilegais que movimentaram R$ 1,4 bi", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/promotoria-do-rio-cumpre-mandados-contra-bets-ilegais-que-movimentaram-r-14-bi.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-13T20:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Promotores do Rio de Janeiro realizaram buscas e apreensões relacionadas a uma rede de sites ilegais de apostas esportivas que movimentaram R$ 1,4 bilhão. A operação contou com o apoio das Promotorias de São Paulo e Bahia.", "titulo_pt": "Promotores do Rio realizam buscas em sites ilegais de apostas que movimentaram R$ 1,4 bi", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 102844, "titulo": "O jato chinês para desafiar a Airbus e a Boeing", "url": "https://braziljournal.com/o-jato-chines-para-desafiar-a-airbus-e-a-boeing/", "fonte_id": "brazil_journal", "data_pub": "2026-08-13T20:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Comac, estatal chinesa responsável pelo desenvolvimento de aviões comerciais, realizou o primeiro voo internacional do jato C919. Este é um bimotor de corpo estreito com capacidade para até 174 passageiros e visa competir diretamente com os fabricantes aeroespaciais europeus (Airbus) e americanos (Boeing).", "titulo_pt": "O jato chinês para desafiar a Airbus e a Boeing", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 102634, "titulo": "Seul supera Dubai como o aeroporto internacional mais movimentado do mundo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/seul-supera-dubai-como-o-aeroporto-internacional-mais-movimentado-do-mundo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-13T20:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Aeroporto de Incheon, na Seul, se tornou o aeroporto mais movimentado do mundo em número de passageiros internacionais neste ano, superando Dubai. A queda no fluxo de viajantes para o centro de conexões do Golfo, devido à guerra no Irã, contribuiu para esse resultado.", "titulo_pt": "Seul supera Dubai como o aeroporto internacional mais movimentado do mundo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 102637, "titulo": "Bancos e federação iniciam no STF disputa por R$ 6,1 bilhões de poupadores", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/bancos-e-federacao-iniciam-no-stf-disputa-por-r-61-bilhoes-de-poupadores.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-13T19:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal julga nesta sexta-feira uma disputa envolvendo R$ 6,1 bilhões entre bancos e federação de poupadores referentes a perdas causadas por planos econômicos entre 1986 e 1991. O caso envolve cerca de 200 mil pessoas ainda não localizadas.", "titulo_pt": "Bancos e federação de poupadores disputam R$ 6,1 bilhões no STF", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 102638, "titulo": "Importação de calçados supera exportação no Brasil pela 1ª vez em quase 30 anos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/importacao-de-calcados-supera-exportacao-no-brasil-pela-1a-vez-em-quase-30-anos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-13T19:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No mês de julho de 2026, pela primeira vez em cerca de três décadas, o Brasil importou mais calçados do que exportou. Foram importados US$ 66 milhões (R$ 382 mi) e exportados US$ 62 milhões (R$ 314 mi).", "titulo_pt": "Importação de calçados supera exportação no Brasil pela primeira vez em quase 30 anos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 102680, "titulo": "Segunda maior refinaria do país reduz preço da gasolina em 11,3%", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/segunda-maior-refinaria-do-pais-reduz-preco-da-gasolina-em-113", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-13T19:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Refinaria de Mataripe, localizada na Região Metropolitana de Salvador e responsável por 42% do abastecimento da região Nordeste, reduziu o preço da gasolina em cerca de 11,3%. A refinaria é a segunda maior do país e vende a gasolina A para distribuidoras que misturam etanol para formar a gasolina C vendida nos postos.", "titulo_pt": "Segunda maior refinaria do país reduz preço da gasolina em 11,3%", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 102914, "titulo": "Juíza dispensa editora de recolher CBS sobre cards colecionáveis", "url": "https://www.jota.info/coberturas-especiais/pulso-da-reforma/juiza-dispensa-editora-de-recolher-cbs-sobre-cards-colecionaveis", "fonte_id": "jota", "data_pub": "2026-08-13T19:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A juíza permitiu que a editora não recolha os cards colecionáveis 'Elo Monsters', lançados em parceria com o youtuber Enaldinho. Estes cards foram classificados como equivalentes a livros.", "titulo_pt": "Juíza autoriza editora a manter cards 'elo monsters' no mercado", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 102438, "titulo": "Skytech eyes high demand on AI boom", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/14/2003862451", "fonte_id": "taipei_times", "data_pub": "2026-08-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Skytech está focada na alta demanda associada ao boom da inteligência artificial.", "titulo_pt": "Skytech mira na alta demanda do boom da IA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 103132, "titulo": "‘That is not acceptable’: Judge orders Google to make rival app store installs easier", "url": "https://www.theverge.com/policy/979852/that-is-not-acceptable-judge-orders-google-to-make-rival-app-store-installs-easier", "fonte_id": "the_verge", "data_pub": "2026-08-13T21:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O juiz James Donato ordenou que a Google faça com que seja mais fácil instalar lojas de aplicativos rivais no Android, um mês após Epic Games e Google terem parecido ter parado de se enfrentar sobre a distribuição de apps para o sistema operacional.", "titulo_pt": "'Isso não é aceitável': juiz ordena que a Google facilite instalação de lojas de aplicativos rivais", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 103141, "titulo": "If Apple sends you a push notification alerting you to a spyware attack, take it seriously", "url": "https://techcrunch.com/2026/08/13/if-apple-sends-you-a-push-notification-alerting-you-to-a-spyware-attack-take-it-seriously/", "fonte_id": "techcrunch", "data_pub": "2026-08-13T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple agora envia notificações push às telas de bloqueio do iPhone quando identifica espionagem governamental nas instalações dos dispositivos. Essa medida visa alertar os usuários sobre possíveis ataques de spyware.", "titulo_pt": "Se a Apple enviar uma notificação push sobre um ataque de spyware, tome isso a sério", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 103133, "titulo": "The fight over Flock and other ALPRs", "url": "https://www.theverge.com/tech/979869/flock-alpr-ai-surveillance-protest-privacy", "fonte_id": "the_verge", "data_pub": "2026-08-13T21:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Existem mais de 120 mil câmeras de leitura automática de placas (ALPR) da Flock instaladas por todo os Estados Unidos. Essas câmeras utilizam inteligência artificial para identificar e rastrear veículos com base em seus números de placa, marca, modelo, cor e outras informações, conectadas em uma rede que monitora veículos e movimentos de pessoas ao longo do dia e através de diferentes localidades.", "titulo_pt": "O debate sobre Flock e outros sistemas alpr", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 103134, "titulo": "Microsoft’s Clippy-like Mico character is no longer the face of Copilot", "url": "https://www.theverge.com/tech/979871/microsoft-copilot-mico-retired", "fonte_id": "the_verge", "data_pub": "2026-08-13T21:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microsoft não utilizará mais o personagem Mico, semelhante ao Clippy, no modo de voz do Copilot. O avatar será transferido para a plataforma Learn Live, onde terá mais interações disponíveis.", "titulo_pt": "Personagem Mico do Copilot deixa modo de voz", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 103147, "titulo": "Mark Zuckerberg’s AI Manifesto Is 6,500-Words—and Barely Says Anything", "url": "https://www.wired.com/story/mark-zuckerbergs-ai-manifesto-is-6500-words-and-barely-says-anything/", "fonte_id": "wired", "data_pub": "2026-08-13T21:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O AI está transformando a cultura, desde manifestos de CEOs de tecnologia até entrevistas de emprego às 1h da manhã. O artigo discute alguns dos mais recentes desenvolvimentos no campo e inclui os principais achados das conferências Black Hat e Defcon desta semana.", "titulo_pt": "Manifesto AI de mark Zuckerberg é de 6,500 palavras—e quase não diz nada", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 103142, "titulo": "Writer introduces new AI model and upgraded harness to contain token costs", "url": "https://techcrunch.com/2026/08/13/writer-introduces-new-ai-model-and-upgraded-harness-to-contain-token-costs/", "fonte_id": "techcrunch", "data_pub": "2026-08-13T21:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O escritor apresentou um novo modelo de IA e uma atualização no sistema para controlar os custos de tokens. Este novo sistema é uma variação pós-treinamento do modelo GLM-5.2, desenvolvido pela Z.ai, oferecendo capacidades de implementação prontas a um preço significativamente mais baixo.", "titulo_pt": "Escritor apresenta novo modelo AI e atualização para reduzir custos de tokens", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 103117, "titulo": "Roundtables: Inside the “Censorship-Industrial Complex” Idea Shaping US Policy", "url": "https://www.technologyreview.com/2026/08/13/1141399/roundtables-inside-the-censorship-industrial-complex-idea-shaping-us-policy/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-13T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ideia de 'censura-industrial complex' sugere que uma rede de grupos governamentais, tecnológicos e de pesquisa está colaborando para suprimir a expressão conservadora online. Esta ideia passou por um período de disseminação no esfera da informação direitista antes de começar a influenciar a política dos Estados Unidos.", "titulo_pt": "Redes: dentro da ideia do 'censura-industrial Complex' que forma a política dos EUA", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 103135, "titulo": "Netflix is closing two game studios", "url": "https://www.theverge.com/games/979855/netflix-shut-down-night-school-studio-moonloot-games", "fonte_id": "the_verge", "data_pub": "2026-08-13T20:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Netflix planeja fechar duas de suas empresas de jogos, uma delas sendo a Night School Studio, criadora da série Oxenfree. A empresa está se focando mais em jogos para festas e títulos transmitidos diretamente para televisores.", "titulo_pt": "Netflix fecha dois estúdios de jogos", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 103143, "titulo": "Databricks wanted to raise $1B, investors wanted $15B. It settled on $5B at a $190B valuation.", "url": "https://techcrunch.com/2026/08/13/databricks-wanted-to-raise-1b-investors-wanted-15b-it-settled-on-5b-at-a-190b-valuation/", "fonte_id": "techcrunch", "data_pub": "2026-08-13T20:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Databricks levantou $5 bilhões avaliando a empresa em $190 bilhões. Ali Ghodsi, CEO da Databricks, aceitou uma oferta maior do que planejada devido à grande quantidade de investidores interessados.", "titulo_pt": "Databricks queria levantar 1 bi, investidores queriam 15 bi. A empresa fechou com 5 bi e avaliação de 190 bi.", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 103125, "titulo": "Private security firms will soon be allowed to hack overseas cybercriminals", "url": "https://arstechnica.com/security/2026/08/white-house-recruits-security-firms-to-hack-overseas-cybercriminals/", "fonte_id": "ars_technica", "data_pub": "2026-08-13T19:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A administração Trump autorizou pela primeira vez que empresas de segurança privada possam realizar ataques cibernéticos contra criminosos digitais no exterior. Este é o primeiro caso em que o governo permitiu atividades ofensivas cibernéticas por parte do setor privado.", "titulo_pt": "Administração trump autoriza empresas de segurança privadas a realizarem ataques cibernéticos contra criminosos digitais no exterior", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 103137, "titulo": "OpenAI is losing its second executive this week", "url": "https://www.theverge.com/ai-artificial-intelligence/979815/openai-denise-dresser-leaving-executive-departure", "fonte_id": "the_verge", "data_pub": "2026-08-13T19:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Denise Dresser, ex-chefe de receita da OpenAI, está deixando a empresa nos próximos semanas para buscar outras oportunidades. Dali Rajic, atualmente presidente e COO da Wiz, será o novo responsável pela posição ocupada por Dresser.", "titulo_pt": "Outro executivo da openai está saindo", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 103144, "titulo": "OpenAI introduces ‘Ultrafast,’ a new mode that makes GPT-5.6 Sol work at 14x the speed", "url": "https://techcrunch.com/2026/08/13/openai-introduces-ultrafast-a-new-mode-that-makes-gpt-5-6-sol-work-at-14x-the-speed/", "fonte_id": "techcrunch", "data_pub": "2026-08-13T19:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI está lançando uma prévia de uma versão acelerada do seu modelo mais recente e poderoso, com o intuito de atrair usuários corporativos. Este novo modo, chamado 'Ultrafast', faz com que a GPT-5.6 trabalhe 14 vezes mais rápido.", "titulo_pt": "Openai apresenta 'Ultrafast', um novo modo que acelera a GPT-5.6", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 103145, "titulo": "IBM partners with OpenAI to bolster enterprise AI push", "url": "https://techcrunch.com/2026/08/13/ibm-partners-with-openai-to-bolster-enterprise-ai-push/", "fonte_id": "techcrunch", "data_pub": "2026-08-13T19:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "IBM vai treinar e certificar dezenas de milhares de consultores nas tecnologias da OpenAI como parte desta parceria.", "titulo_pt": "IBM se associa à OpenAI para fortalecer sua propulsão em inteligência artificial empresarial", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 103126, "titulo": "Virgin Galactic wants your help naming its new Delta class spaceship", "url": "https://arstechnica.com/space/2026/08/virgin-galactic-wants-your-help-naming-its-new-delta-class-spaceship/", "fonte_id": "ars_technica", "data_pub": "2026-08-13T19:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Virgin Galactic está buscando a ajuda dos fãs para nomear seu novo navio espacial da classe Delta, que pode ser chamado de VSS Horizon, Explorer, Ascend ou Apeiron.", "titulo_pt": "Virgin Galactic quer sua ajuda para nomear o novo navio espacial Delta", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 103096, "titulo": "Spotify asks creators to label songs when they’re AI-generated", "url": "https://www.japantimes.co.jp/life/2026/08/14/digital/spotify-ai-label/", "fonte_id": "japan_times", "data_pub": "2026-08-13T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A gigante de streaming Spotify pediu aos criadores que marquem as músicas quando elas são geradas por inteligência artificial. A empresa afirma que essa medida fornecerá mais transparência para os ouvintes à medida que a música gerada por AI se torna mais difícil de identificar.", "titulo_pt": "Spotify pede aos criadores que marquem músicas geradas por IA", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 103152, "titulo": "Synchronized star pairs unleash radio bursts via a Jupiter-Io-like mechanism", "url": "https://phys.org/news/2026-08-synchronized-star-pairs-unleash-radio.html", "fonte_id": "phys_org", "data_pub": "2026-08-13T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores ajudaram a desvendar o motivo pelo qual certos pares de estrelas pulsam com bursts regulares e de longo período de ondas radiofáticas. Esses objetos observados são pares que sempre incluem uma estrela branca compacta orbitando junto com uma M dwarf, uma estrela vermelha menor do que nosso sol.", "titulo_pt": "Pares de estrelas sincronizados liberam burburinhos radiofáticos por meio de um mecanismo semelhante ao de júpiter-io", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 103153, "titulo": "Butterfly effects of climate change", "url": "https://phys.org/news/2026-08-butterfly-effects-climate.html", "fonte_id": "phys_org", "data_pub": "2026-08-13T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coleção Nacional Australiana de Insetos do CSIRO possui 2.000 gavetas com espécimes de borboletas, incluindo alguns coletados há mais de um século.", "titulo_pt": "Efeitos borboleta do aquecimento global", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 103154, "titulo": "Mutation hotspots help 'friendly' viruses outmaneuver the bacteria in your gut", "url": "https://phys.org/news/2026-08-mutation-hotspots-friendly-viruses-outmaneuver.html", "fonte_id": "phys_org", "data_pub": "2026-08-13T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cada 15 minutos, uma pessoa nos Estados Unidos morre de uma bactéria super-resistente a antibióticos. Em alguns décadas, as infecções por bactérias resistentes a antibióticos podem se tornar a principal causa de morte mundial, ultrapassando o câncer.", "titulo_pt": "Pontos quentes de mutação auxiliam 'vírus amigos' a superarem as bactérias no intestino", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 103177, "titulo": "STAT+: Commure terminates payments under its customer referral programs tied to AI products", "url": "https://www.statnews.com/2026/08/13/commure-terminates-payments-under-customer-referral-programs/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-13T21:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Commure, que desenvolve e vende produtos de inteligência artificial para clínicas, encerrou um programa que remunerava referências a novos clientes. O programa relacionado a produtos de IA foi terminado pela empresa.", "titulo_pt": "Commure encerra programa de referral com pagamento por referrals de produtos de AI", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 102683, "titulo": "A descoberta de um novo tipo de estrutura cósmica: as estrelas que também são buracos negros", "url": "https://veja.abril.com.br/ciencia/a-descoberta-de-um-novo-tipo-de-estrutura-cosmica-as-estrelas-que-tambem-sao-buracos-negros/", "fonte_id": "veja", "data_pub": "2026-08-13T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo publicado na revista Nature confirma a teoria de que os pequenos pontos vermelhos observados no início do universo são buracos negros envolvidos por uma estrela.", "titulo_pt": "Descoberta de um novo tipo de estrutura cósmica: as estrelas que também são buracos negros", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 103155, "titulo": "While Great Lakes ice cover is slipping, a 'temporary respite' may be on the way", "url": "https://phys.org/news/2026-08-great-lakes-ice-temporary-respite.html", "fonte_id": "phys_org", "data_pub": "2026-08-13T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Após décadas de redução da cobertura anual de gelo nos Grandes Lagos, pesquisadores do Instituto Cooperativo para Pesquisa dos Grandes Lagos, na Universidade do Michigan, sugerem que essa tendência possa se estabilizar ou até mesmo inverter temporariamente. No entanto, a cobertura de gelo ainda está diminuindo.", "titulo_pt": "Bom e mau notícias sobre a cobertura de gelo nos grandes lagos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 103156, "titulo": "Proposed 900-telescope array could detect an Earth-like exoplanet's atmosphere in a single transit", "url": "https://phys.org/news/2026-08-telescope-array-earth-exoplanet-atmosphere.html", "fonte_id": "phys_org", "data_pub": "2026-08-13T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um array de 900 telescópios proposto poderia detectar o atmosfere de um exoplaneta semelhante à Terra durante uma única passagem transitória. Ao analisar a espectroscopia do brilho estelar, é possível identificar os gases presentes na atmosfera do planeta.", "titulo_pt": "Array de 900 telescópios poderia detectar atmosfera de exoplaneta semelhante à terra em uma única passagem transitória", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 103157, "titulo": "How a mystery kept in London led to the discovery of a new Ecuadorian frog", "url": "https://phys.org/news/2026-08-mystery-london-discovery-ecuadorian-frog.html", "fonte_id": "phys_org", "data_pub": "2026-08-13T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas da Pontificia Universidad Católica del Ecuador descobriram a espécie de rã Pristimantis milpe, que havia sido confundida com outra por mais de um século. Para resolver essa questão, os pesquisadores revisaram amostras históricas coletadas no Equador durante o século XIX e armazenadas no Museu da História Natural em Londres.", "titulo_pt": "Como uma mistério mantido em londres levou ao descobrimento de uma nova espécie de rã do equador", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 103158, "titulo": "Safe havens protect Australian mammals from invasive predators. Why aren't they working for other animal groups?", "url": "https://phys.org/news/2026-08-safe-havens-australian-mammals-invasive.html", "fonte_id": "phys_org", "data_pub": "2026-08-13T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Predadores feral, como gatos selvagens e raposas, agora se espalharam por quase todo o território australiano. Esses predadores são uma das principais causas da extinção de várias espécies.", "titulo_pt": "Refúgios seguros protegem mamíferos australianos dos predadores invasores, mas por que eles não funcionam para outros grupos animais?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 103159, "titulo": "How to fine-tune molecular structures within vaccines to improve immune responses", "url": "https://phys.org/news/2026-08-fine-tune-molecular-vaccines-immune.html", "fonte_id": "phys_org", "data_pub": "2026-08-13T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A estrutura molecular da vacina influencia significativamente a resposta imune do corpo. Para desenvolver uma vacina contra o HIV que ofereça proteção à longo prazo, é crucial promover uma resposta imune duradoura em que células imunes e anticorpos preparados para combater o vírus permaneçam no organismo.", "titulo_pt": "Como afinar as estruturas moleculares dentro das vacinas para melhorar as respostas imunológicas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 102658, "titulo": "Toda vida é uma Jornada do Herói", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/colunas/suzanaherculanohouzel/2026/08/toda-vida-e-uma-jornada-do-heroi.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-13T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O protagonista enfrenta uma situação desafiadora que excede suas habilidades atuais, mas ele decide encarar o desafio. Ao longo do caminho, ele recebe ajuda de pessoas que lhe ensinam novas habilidades.", "titulo_pt": "Toda vida é uma Jornada do Herói", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 103160, "titulo": "TESS discovers a rare brown dwarf orbiting a massive, aging star", "url": "https://phys.org/news/2026-08-tess-rare-brown-dwarf-orbiting.html", "fonte_id": "phys_org", "data_pub": "2026-08-13T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos descobriram um raro branco-dwarf orbitando uma estrela massiva e envelhecida. A classificação dos brancos-dwarf foi reavaliada, considerando não apenas a massa, mas também o mecanismo de formação, que pode ocorrer através da colapso direto de nuvens de gás ou dentro de discos de acréscimo de estrelas massivas.", "titulo_pt": "TESS descobre um raro branco-dwarf orbitando uma estrela massiva e envelhecida", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 103161, "titulo": "How environmental responsibility can improve financial performance", "url": "https://phys.org/news/2026-08-environmental-responsibility-financial.html", "fonte_id": "phys_org", "data_pub": "2026-08-13T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Consumidores estão cada vez mais optando por produtos de empresas que demonstram responsabilidade ambiental genuína. Um novo estudo sugere que a sustentabilidade melhora o desempenho financeiro das empresas indiretamente, aumentando as vendas.", "titulo_pt": "Como a responsabilidade ambiental pode melhorar o desempenho financeiro", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 103192, "titulo": "NASA astronaut Mike Fincke retires after 30 years at the space agency", "url": "https://www.space.com/space-exploration/human-spaceflight/nasa-astronaut-mike-fincke-retires-after-30-years-at-the-space-agency", "fonte_id": "space_com", "data_pub": "2026-08-13T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mike Fincke, astronauta da NASA, se aposentou após 30 anos de serviço público. Durante sua carreira, ele foi comandante duas vezes da Estação Espacial Internacional e chefe da Seção de Tripulações Comerciais do Escritório de Astronautas.", "titulo_pt": "Astronauta Mike Fincke se aposenta após 30 anos na NASA", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 103162, "titulo": "There's nothing 'wild' about most wildfires. Humans start them and have made them more dangerous", "url": "https://phys.org/news/2026-08-wild-wildfires-humans-dangerous.html", "fonte_id": "phys_org", "data_pub": "2026-08-13T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A maioria dos incêndios florestais não tem um nome inicialmente, apenas a área que estão consumindo. Um exemplo disso foi o incêndio na região dos Pinos do Gironde na França, que só recebeu um nome definitivo após ter consumido uma grande área.", "titulo_pt": "Não há nada de 'selvagem' em maioria dos incêndios florestais.", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 103163, "titulo": "Does your city match your relationship status? New study exposes the hidden costs of urban living", "url": "https://phys.org/news/2026-08-city-relationship-status-exposes-hidden.html", "fonte_id": "phys_org", "data_pub": "2026-08-13T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa co-autoria de Dr. Mariana Macedo, da Universidade Constructor, examina como mudanças significativas na vida afetam a percepção e utilização das cidades pelos indivíduos. O estudo, publicado em npj Complexity, sugere que os modelos tradicionais de planejamento urbano, baseados em perfis demográficos genéricos, devem ser reconsiderados para incluir designs mais sensíveis às diferenças demográficas.", "titulo_pt": "Sua cidade se encaixa no seu status de relacionamento? Novo estudo revela os custos ocultos da vida urbana", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 102433, "titulo": "Nature meets architecture", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/14/2003862486", "fonte_id": "taipei_times", "data_pub": "2026-08-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a interseção entre arquitetura e natureza, explorando como elementos naturais são integrados nos projetos de edifícios modernos. A abordagem é multifacetada, abrangendo desde as escolhas materiais até as soluções de design que promovem a sustentabilidade.", "titulo_pt": "Natureza e arquitetura", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 102874, "titulo": "Gabriel Rolón: “Podemos quedar atrapados en un vínculo que se construyó alrededor de cierto sufrimiento”", "url": "https://www.lanacion.com.ar/sociedad/gabriel-rolon-podemos-quedar-atrapados-en-un-vinculo-que-se-construyo-alrededor-de-cierto-nid13082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-13T21:43:00Z", "idioma": "es", "provavel_dupli n-es-pitty-la-numerologa-mencionada-en-el-caso-del-femicidio-en-villa-devoto-nid13082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-13T21:27:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O nome de Pitty, a numeróloga, ficou ligado ao caso após Walter Verón, preso pelo crime, mencioná-la em uma carta deixada antes do assassinato de sua esposa, Romina María de los Ángeles Calvo.", "titulo_pt": "Quem é Pitty, a Numeróloga, mencionada no caso do femicídio em Villa Devoto", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 102793, "titulo": "Envelhecimento populacional exige inovação na estrutura de cuidados", "url": "https://www.cnnbrasil.com.br/saude/envelhecimento-populacional-exige-inovacao-na-estrutura-de-cuidados/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-13T21:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Sanii apresenta uma experiência que utiliza sensores e automações para adaptar a residência às necessidades de cuidados de pessoas mais velhas. Este método visa inovar na estrutura de cuidados para o envelhecimento populacional.", "titulo_pt": "Envelhecimento populacional exige inovação na estrutura de cuidados", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 102701, "titulo": "INSS realiza mutirão com 600 vagas para avaliação do BPC em Salvador", "url": "https://veja.abril.com.br/economia/inss-realiza-mutirao-com-600-vagas-para-avaliacao-do-bpc-em-salvador/", "fonte_id": "veja", "data_pub": "2026-08-13T20:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Instituto Nacional do Seguro Social (INSS) realiza um mutirão com 600 vagas para a avaliação do Benefício de Prestação Continuada (BPC) em Salvador. Os atendimentos ocorrerão nos dias 15 e 16 de agosto.", "titulo_pt": "INSS realiza mutirão com 600 vagas para avaliação do BPC em Salvador", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 103007, "titulo": "De una tensa campaña a trabajar juntos por la reconstrucción: el abuenamiento de Ivan Poduje y Macarena Ripamonti", "url": "https://www.latercera.com/nacional/noticia/de-una-tensa-campana-a-trabajar-juntos-por-la-reconstruccion-el-abuenamiento-de-ivan-poduje-y-macarena-ripamonti/", "fonte_id": "la_tercera", "data_pub": "2026-08-13T20:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Ivan Poduje e Macarena Ripamonti, que disputaram o cargo de prefeito de Viña del Mar durante uma campanha tensa, agora valorizam as gestões do outro. Segundo seus círculos próximos, as relações entre eles melhoraram.", "titulo_pt": "Do conflito eleitoral à colaboração para a reconstrução: o abrandamento de Ivan Poduje e Macarena Ripamonti", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 102645, "titulo": "Antipetismo visceral alimenta o servilismo a Donald Trump", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/marcosaugustogoncalves/2026/08/antipetismo-visceral-alimenta-o-servilismo-a-donald-trump.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-13T19:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um número significativo de brasileiros expressa simpatia pelo presidente dos Estados Unidos, Donald Trump, apesar das tarifas comerciais e pressões políticas que ele tem exercido contra o país. Este antipetismo visceral parece alimentar um comportamento servil em relação a Trump.", "titulo_pt": "Antipetismo visceral alimenta o servilismo a Donald Trump", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 102639, "titulo": "Justiça condena Correios após morte de trabalhador e pede medidas de segurança", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/justica-condena-correios-apos-morte-de-trabalhador-e-pede-medidas-de-seguranca.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-13T18:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça do Trabalho condenou os Correios a implementar 16 medidas de segurança no Centro de Entrega de Encomendas (CEE) de Santo André, Grande São Paulo, após a morte de um funcionário em outubro de 2024. A sentença foi emitida em 8 de janeiro de 2026.", "titulo_pt": "Justiça condena Correios após morte de trabalhador e determina medidas de segurança", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 102916, "titulo": "Eternit é condenada em R$ 2,3 milhões por morte de trabalhador exposto a amianto", "url": "https://www.jota.info/trabalho/eternit-e-condenada-em-r-23-milhoes-por-morte-de-trabalhador-exposto-a-amianto", "fonte_id": "jota", "data_pub": "2026-08-13T18:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa Eternit foi condenada a pagar R$ 2,3 milhões por causa da morte de um trabalhador exposto ao amianto. Os ministros reconheceram o vínculo entre a exposição ao amianto e a morte do trabalhador após 40 anos de atividade.", "titulo_pt": "Eternit é condenada em R$ 2,3 milhões por morte de trabalhador exposto a amianto", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 102892, "titulo": "Três homens executados no mesmo dia: o que explica o aumento na aplicação da pena de morte nos EUA", "url": "https://www.bbc.com/portuguese/articles/c07r24928klo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-13T18:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Apesar da crescente oposição à pena de morte nos Estados Unidos, um único estado tem sido responsável pelo aumento do número de execuções. Este fenômeno ocorre mesmo em um contexto geral de desaprovação da pena capital.", "titulo_pt": "Três homens executados no mesmo dia: qual estado está aumentando as execuções na américa do norte?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 103221, "titulo": "Morat to Donate Concert Proceeds to Help Rebuild Schools After Colombia Earthquake", "url": "https://consequence.net/2026/08/morat-donate-concert-proceeds-rebuild-schools-colombia-earthquake/", "fonte_id": "consequence_sound", "data_pub": "2026-08-13T18:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A banda Morat irá doar os lucros de sua turnê com seis shows no Arena Movistar de Bogotá para ajudar a reconstruir escolas após o terremoto na Colômbia. O evento será realizado por Pedro Camacho.", "titulo_pt": "Morat doará ingressos da turnê para reconstrução de escolas após terremoto na colômbia", "veiculo": "Consequence of Sound", "pais": "EUA", "classe": "C"}, {"id": 102840, "titulo": "Abandono de pets pode render sanções na CNH; saiba mais", "url": "https://canaltech.com.br/carros/usar-o-carro-para-abandonar-o-pet-pode-dar-perda-de-cnh-e-multa-pesada/", "fonte_id": "canaltech", "data_pub": "2026-08-13T18:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara dos Deputados aprovou um projeto de lei que prevê sanções para quem usar o carro para abandonar animais, classificando a prática como infração gravíssima e podendo resultar na suspensão da Carteira Nacional de Habilitação (CNH) por um ano.", "titulo_pt": "Abandono de pets pode render sanções na CNH", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 101810, "titulo": "Chacina: suspeitos de matar 4 pessoas se apresentam e são liberados", "url": "https://www.metropoles.com/distrito-federal/na-mira/chacina-suspeitos-de-matar-4-pessoas-se-apresentam-e-sao-liberados", "fonte_id": "metropoles", "data_pub": "2026-08-13T17:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Suspeitos de matar quatro pessoas em Formosa, Goiás, se apresentaram à polícia e foram liberados. Um dos suspeitos relatou que reagiu após seu filho ser perseguido e alvo de disparos.", "titulo_pt": "Chacina: suspeitos de matar 4 pessoas se apresentam e são liberados", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 102425, "titulo": "Greenpeace calls for review of energy bill", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/14/2003862478", "fonte_id": "taipei_times", "data_pub": "2026-08-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Greenpeace está pedindo uma revisão da lei de energia. O grupo ambientalista quer que as regras atuais sobre a produção e uso de energia sejam examinadas mais profundamente.", "titulo_pt": "Greenpeace solicita revisão da lei de energia", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 102429, "titulo": "Agency presents four farmers with owl-friendly label", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/14/2003862482", "fonte_id": "taipei_times", "data_pub": "2026-08-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A agência apresentou quatro agricultores com um rótulo que indica que suas propriedades são amigáveis aos búlbos.", "titulo_pt": "Agência apresenta quatro agricultores com rótulo owl-friendly", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 102692, "titulo": "Como a desinformação climática usa a fé para se espalhar", "url": "https://veja.abril.com.br/comportamento/como-a-desinformacao-climatica-usa-a-fe-para-se-espalhar/", "fonte_id": "veja", "data_pub": "2026-08-13T20:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cartilha destaca o uso de argumentos religiosos na propagação de notícias falsas sobre o clima. O relatório alerta para esse método de disseminação da desinformação.", "titulo_pt": "Como a desinformação climática usa a fé para se espalhar", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 103003, "titulo": "Chile Carbon Forum lanza su tercera edición con foco en estándares globales, financiamiento y adaptación climática", "url": "https://www.latercera.com/sustentabilidad/noticia/chile-carbon-forum-lanza-su-tercera-edicion-con-foco-en-estandares-globales-financiamiento-y-adaptacion-climatica/", "fonte_id": "la_tercera", "data_pub": "2026-08-13T20:09:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Chile Carbon Forum, o maior encontro de ação climática e mercados de carbono do Chile, terá sua terceira edição nos dias 6 e 7 de outubro na Faculdade de Economia e Negócios da USP, com mais de 30 sessões em duas rotas simultâneas e focos adicionais em estándares globais de reporte, novos esquemas de financiamento e adaptação climática.", "titulo_pt": "Chile Carbon Forum lança sua terceira edição com foco em padrões globais, financiamento e adaptação ao clima", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 102286, "titulo": "Ebola outbreak in DR Congo spreads to sixth province as death toll passes 2,100", "url": "https://www.lemonde.fr/en/health/article/2026/08/13/ebola-outbreak-in-dr-congo-spreads-to-sixth-province-as-death-toll-passes-2-100_6756475_14.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-13T15:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A epidemia de Ebola, que já é a mais letal na história do país, está se espalhando para a sexta província congolesa, conforme o número de mortes ultrapassa 2.100. A Organização Mundial da Saúde alertou que esta é a propagação mais rápida de uma epidemia de Ebola já registrada.", "titulo_pt": "Epidemia de ebola no Congo atinge sexta província com mais de 2.100 mortes", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 102103, "titulo": "UK records hottest day of year as fifth summer heatwave reaches peak", "url": "https://www.theguardian.com/environment/2026/aug/13/uk-records-hottest-day-of-the-year-fifth-summer-heatwave-peak", "fonte_id": "guardian_world", "data_pub": "2026-08-13T15:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Reino Unido registrou sua temperatura mais alta do ano até o momento, com 38.1C registrada no Jardim Botânico de Kew em Londres, enquanto partes da Europa superaram os 40C durante a quinta onda de calor veraniega. A Met Office informou que essa leitura superou o recorde anterior de 38C, registrado em 28 de junho.", "titulo_pt": "Reino unido registra dia mais quente do ano com quinta onda de calor na Europa", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 102014, "titulo": "Antropoceno, Capitaloceno, ou o preço de tratar a natureza como mercadoria", "url": "https://www.jota.info/opiniao-e-analise/colunas/em-clima-de-justica/antropoceno-capitaloceno-ou-o-preco-de-tratar-a-natureza-como-mercadoria", "fonte_id": "jota", "data_pub": "2026-08-13T14:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a importância de conceitos como Antropoceno e Capitaloceno, enfatizando a urgência da mudança no tratamento da natureza como mercadoria.", "titulo_pt": "Antropoceno, Capitaloceno, ou o preço de tratar a natureza como mercadoria", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 102345, "titulo": "Ebola outbreak caused by new ‘animal transmission’: What that means", "url": "https://www.aljazeera.com/news/2026/8/13/ebola-outbreak-caused-by-new-animal-transmission-what-that-means?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-13T14:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 2.000 pessoas morreram após contrair a última cepa do vírus Ebola.", "titulo_pt": "Ebola: nova 'transmissão animal' é causa dos casos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 102355, "titulo": "More than 135 million people in Europe face temperatures over 35C", "url": "https://www.aljazeera.com/news/2026/8/13/more-than-135-million-people-in-europe-set-for-temperatures-over-35c?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-13T11:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 135 milhões de pessoas na Europa enfrentam temperaturas acima de 35°C. A Europa é o continente que mais aquece no mundo e, em alguns lugares, não está preparada para lidar com as condições quentes.", "titulo_pt": "Mais de 135 milhões de europeus enfrentam temperaturas superiores a 35C", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 102283, "titulo": "Europe braces for another temperature spike above 35°C", "url": "https://www.lemonde.fr/en/international/article/2026/08/13/europe-braces-for-another-temperature-spike-above-35-c_6756467_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-13T11:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Áreas habitadas por mais de 135 milhões de europeus estão prestes a serem afetadas pelas temperaturas mais altas. Cerca de três quintos dos residentes da Europa podem ver as temperaturas superarem os 30°C.", "titulo_pt": "Europa se prepara para nova onda de altas temperaturas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 101147, "titulo": "Efecto Niño: anticipan lluvias extraordinarias desde fin de agosto en las zonas más productivas de Argentina", "url": "https://www.clarin.com/rural/efecto-nino-anticipan-lluvias-extraordinarias-fin-agosto-zonas-productivas-argentina_0_DAHC980u1c.html", "fonte_id": "clarin", "data_pub": "2026-08-13T09:10:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Prevê-se um aumento nas chuvas de até 25% na primavera e até 33% no verão nas regiões mais produtivas da Argentina. Essas precipitações extraordinárias são esperadas a partir do final de agosto.", "titulo_pt": "Efeito Niño: previsão de chuvas excepcionais desde o fim de agosto em áreas produtivas da Argentina", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 101016, "titulo": "Clima: El Niño e veranico trazem calorão e interrompem chuvas nesta 5ª", "url": "https://www.metropoles.com/brasil/clima-el-nino-e-veranico-trazem-calorao-e-interrompem-chuvas-nesta-5a", "fonte_id": "metropoles", "data_pub": "2026-08-13T09:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O El Niño e o veranico estão causando temperaturas acima da média e interrompendo as chuvas nesta quinta-feira. Há uma ausência quase total de precipitação.", "titulo_pt": "El Niño e veranico trazem calorão e interrompem chuvas nesta quinta", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 101352, "titulo": "As drought grips France, tensions over drinking water mount: 'We are in uncharted territory'", "url": "https://www.lemonde.fr/en/environment/article/2026/08/13/as-drought-grips-france-tensions-over-drinking-water-mount-we-are-in-uncharted-territory_6756456_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-13T08:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas de água enfrentam escassez de reservas superficiais e subterrâneas, com 40 mil pessoas já afetadas por cortes no abastecimento. A ministra do Meio Ambiente, Monique Barbut, pediu restrições mais rígidas no uso da água.", "titulo_pt": "A seca atinge França e aumentam as tensões sobre o fornecimento de água: 'estamos em território inexplorado'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 101422, "titulo": "As temperatures soar, ‘exceptionally serious’ drought imperils UK farmers", "url": "https://www.aljazeera.com/news/2026/8/13/uk-drought-imperils-farmers?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-13T08:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Agricultores estão tentando adaptar-se ao clima extremo e afirmam que, mesmo com o melhor planejamento, sua indústria enfrenta seu teste mais difícil. Uma seca excepcionalmente séria está ameaçando os agricultores do Reino Unido devido às altas temperaturas.", "titulo_pt": "Seca extremamente séria ameaça agricultura britânica", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 101378, "titulo": "Soaring stingray numbers off California beaches drive record injuries", "url": "http://www.euronews.com/video/2026/08/13/soaring-stingray-numbers-off-california-beaches-drive-record-injuries", "fonte_id": "euronews", "data_pub": "2026-08-13T08:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número atípico de raia-dourada foi observado nas praias da Califórnia, com os animais se aproximando mais das costas devido às águas marinhas aquecidas e à presença esperada do El Niño forte.", "titulo_pt": "Números recorde de raia-dourada em praias da califórnia causam ferimentos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 101387, "titulo": "Oil spill from tanker believed to be Russian reaches Oman's coastline, Muscat authorities say", "url": "http://www.euronews.com/2026/08/13/oil-spill-from-tanker-believed-to-be-russian-reaches-omans-coastline-muscat-authorities-sa", "fonte_id": "euronews", "data_pub": "2026-08-13T04:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um vazamento de óleo de um navio-tanque, supostamente russo, atingiu as praias de Ras Madrakah na costa principal do Omã, a cerca de 200 quilômetros ao norte da Ilha Qabiliyah. De acordo com o Autoridade Ambiental do Omã, as praias também foram contaminadas.", "titulo_pt": "Vazamento de óleo russo atinge costa do omã", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 102732, "titulo": "Suécia endurece lei e reduz maioridade penal para 14 anos", "url": "https://www.metropoles.com/mundo/suecia-reduz-maioridade-penal-14-anos", "fonte_id": "metropoles", "data_pub": "2026-08-13T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Suécia implementou uma lei que reduziu a maioridade penal para 14 anos, entrando em vigor três dias antes das eleições gerais. A medida reflete a agenda de segurança do governo conservador era", "data_pub": "2026-08-13T20:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um homem foi colocado em prisão preventiva após atropelar sua ex-parceira em Antofagasta. A vítima, uma jovem de 21 anos, está internada com risco vital e o tribunal determinou um prazo de 60 dias para a investigação do caso.", "titulo_pt": "Homem que atropelou ex-parceira em Antofagasta fica em prisão preventiva", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 102101, "titulo": "Nearly 100 children detained as adults under UK-France migration deal", "url": "https://www.theguardian.com/uk-news/2026/aug/13/children-detained-adults-one-in-one-out-deal-uk-france-migration", "fonte_id": "guardian_world", "data_pub": "2026-08-13T17:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nove décimos de um cento de crianças foram detidas como adultos sob o acordo entre Reino Unido e França para a migração. Segundo relatório, 94 (31%) dos casos envolvendo disputa de idade foram posteriormente confirmados como menores de idade.", "titulo_pt": "Quase 100 crianças detidas como adultos no acordo uk-frança sobre imigração", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 101948, "titulo": "Única filha de Fidel Castro reflete sobre o homem que ela nunca quis chamar de pai: 'Ele me deu um boneco vestido como ele'", "url": "https://www.bbc.com/portuguese/articles/c2k72yvd5wyo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-13T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alina Fernández, a única filha de Fidel Castro, só descobriu que o líder cubano era seu pai mais tarde. Desde jovem, ela recebia visitas frequentes de Castro em sua casa.", "titulo_pt": "Única filha de Fidel Castro reflete sobre o homem que ela nunca quis chamar de pai", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 102284, "titulo": "US court dismisses Trump administration's antisemitism lawsuit against Harvard", "url": "https://www.lemonde.fr/en/international/article/2026/08/13/us-court-dismisses-trump-administration-s-antisemitism-lawsuit-against-harvard_6756478_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-13T17:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz federal em Boston decidiu que os incidentes citados pelo Departamento de Justiça não foram o suficiente para provar que a Harvard violou a lei sobre direitos civis durante as manifestações pró-Palestina no campus.", "titulo_pt": "Juiz federal descarta processo antisemitismo do governo Trump contra Harvard", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 102347, "titulo": "Lebanese Americans sue US over Israel’s rights abuses in Lebanon war", "url": "https://www.aljazeera.com/news/2026/8/13/lebanese-americans-sue-us-over-israels-rights-abuses-in-lebanon-war?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-13T14:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo baseado em Michigan lidera uma ação coletiva contra o governo dos Estados Unidos e empresas de defesa por supostas violações de direitos humanos cometidas durante a guerra no Líbano.", "titulo_pt": "Lebanês americanos processam EUA pela violação dos direitos humanos em guerra israelense no líbano", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 102030, "titulo": "Ley “Escucha su corazón”: ¿un encuadre fallido?", "url": "https://www.ciperchile.cl/2026/08/13/ley-escucha-su-corazon-un-encuadre-fallido/?utm_source=rss&utm_medium=rss&utm_campaign=ley-escucha-su-corazon-un-encuadre-fallido", "fonte_id": "ciper_chile", "data_pub": "2026-08-13T13:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A lei 'Escuta seu coração' foi publicada, mas há questionamentos sobre a adequação do seu enquadramento. O texto original se originou no CIPER Chile.", "titulo_pt": "Lei ‘ouça seu function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">

    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  </div>`;
}

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;

  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
