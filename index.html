iado-finados-sera-chuva-tempestades-parte-brasil", "fonte_id": "metropoles", "data_pub": "2026-11-02T09:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Inmet emitiu alertas de perigo e perigo potencial para diferentes regiões do Brasil, com previsão de chuvas e baixa umidade do ar durante o feriado de Finados.", "titulo_pt": "Feriado de Finados terá temporais em diferentes regiões do Brasil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 239898, "titulo": "Ebola tem letalidade de 52% na República Democrática do Congo", "url": "https://www.cnnbrasil.com.br/internacional/ebola-tem-letalidade-de-52-na-republica-democratica-do-congo/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-02T09:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O surto de Ebola na República Democrática do Congo, causado pelo vírus Ebola Bundibugyo, tem uma letalidade de 52% e é o segundo maior surto de Ebola do mundo, atrás apenas da epidemia ocorrida entre 2014 e 2016 na África Ocidental.", "titulo_pt": "Ebola tem letalidade de 52% na República Democrática do Congo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 240006, "titulo": "ACV: cómo reconocer sus señales y por qué actuar rápido es clave", "url": "https://www.latercera.com/tendencias/noticia/acv-como-reconocer-sus-senales-y-por-que-actuar-rapido-es-clave/", "fonte_id": "la_tercera", "data_pub": "2026-11-02T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O acidente cerebrovascular pode causar danos graves se não for tratado rapidamente. É crucial identificar os sintomas e procurar atendimento médico imediatamente para melhorar o prognóstico.", "titulo_pt": "ACV: como reconhecer seus sinais e por que agir rápido é fundamental", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 240555, "titulo": "Reino Unido obrigará parte dos migrantes a esperar 10 anos para direito a residência", "url": "https://www.infomoney.com.br/mundo/reino-unido-obrigara-parte-dos-migrantes-a-esperar-10-anos-para-direito-a-residencia/", "fonte_id": "infomoney", "data_pub": "2026-11-02T17:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Reino Unido implementará novas regras que obrigam parte dos migrantes a esperar 10 anos para obter o direito de residência. Essas mudanças são parte de uma série de medidas mais rigorosas adotadas pelo governo após um aumento súbito no número de chegadas de imigrantes.", "titulo_pt": "Reino Unido obrigará parte dos migrantes a esperar 10 anos para direito a residência", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 240686, "titulo": "Lindsay Clancy busca que retiren los cargos por el asesinato de sus tres hijos en Massachusetts tras el juicio anulado", "url": "https://www.clarin.com/estados-unidos/lindsay-clancy-busca-retiren-cargos-asesinato-hijos-massachusetts-juicio-anulado_0_TbriRmIDE8.html", "fonte_id": "clarin", "data_pub": "2026-11-02T17:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Lindsay Clancy reapareceu perante a justiça após um júri não conseguir chegar a um veredicto. Seus advogados argumentam que submeter a ela a um novo julgamento violaria sua proteção constitucional contra o julgamento duplo.", "titulo_pt": "Lindsay Clancy busca que sejam retirados os cargos por assassinato de seus três filhos em Massachusetts após julgamento anulado", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 240888, "titulo": "Calls mount to ban French TV channel CNews after racist killing", "url": "https://www.lemonde.fr/en/france/article/2026/11/02/calls-mount-to-ban-french-tv-channel-after-racist-killing_6769451_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-02T16:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma petição pedindo o fechamento da CNews, um canal pertencente ao grupo conservador francês do bilionário Vincent Bolloré, que é frequentemente comparado à Fox News dos EUA, já ultrapassou 500 mil assinaturas.", "titulo_pt": "Reclamações crescem para fechar canal CNews após assassinato racista", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 241043, "titulo": "Mother, 72, on trial in France over 1980s torture killing of 4-year-old daughter", "url": "https://www.scmp.com/news/world/europe/article/3373039/mother-72-trial-france-over-1980s-torture-killing-4-year-old-daughter", "fonte_id": "scmp", "data_pub": "2026-11-02T16:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher de 72 anos está sendo julgada em França por acusações de tortura fatais a sua filha de 4 anos nos anos 1980, após uma correspondência de DNA reabrir o caso frio. O processo ocorre em Blois, com ativistas dos direitos da criança exigindo justiça.", "titulo_pt": "Mãe, de 72 anos, em julgamento em França por morte tortuosa de filha de 4 anos nos anos 1980", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 240962, "titulo": "At least seven migrants die on boat bound for Canary Islands amid storm", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/2/at-least-seven-migrants-die-on-boat-bound-for-canary-islands-amid-storm?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-02T16:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos sete migrantes morreram a bordo de uma embarcação que transportava 139 pessoas em direção às Ilhas Canárias após uma tempestade atingir o local.", "titulo_pt": "Pelo menos sete migrantes morrem em embarcação rumo às ilhas canárias durante tempestade", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 240964, "titulo": "Violence in northern Ethiopia pushing health system towards collapse: WHO", "url": "https://www.aljazeera.com/news/2026/11/2/violence-in-northern-ethiopia-pushing-health-system-towards-collapse-who?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-02T16:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Violências entre rebeldes do Tigray e o governo de Addis Ababa têm comprometido o sistema de saúde local, ameaçando sua colapso, conforme relata o WHO. Um acordo de paz de 2022 foi quebrado devido à nova escalada de conflito.", "titulo_pt": "Violência no norte da étiopía ameaça colapso do sistema de saúde: OMS", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 240755, "titulo": "Reddit and libertarian group challenge Australia’s under-16s social media ban in high court", "url": "https://www.theguardian.com/australia-news/2026/nov/03/australia-social-media-ban-high-court-challenge-reddit-digital-freedom-project", "fonte_id": "guardian_world", "data_pub": "2026-11-02T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Reddit e um grupo de liberdade digital, liderado pelo deputado estadual John Ruddick do estado de NSW, estão buscando derrubar a proibição de uso de redes sociais para menores de 16 anos em tribunal de alta instância. Essa é a primeira grande desafio legal contra a lei, que exigiu que 10 plataformas digitais desativassem ou suspendessem contas de usuários menores de 16 anos há quase 11 meses.", "titulo_pt": "Reddit e grupo libertário desafiam proibição de redes sociais para menores de 16 anos na austrália em tribunal", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 240861, "titulo": "Represión policial, discapacidad y Derechos Humanos", "url": "https://www.ciperchile.cl/2026/11/02/represion-policial-discapacidad-y-derechos-humanos/?utm_source=rss&utm_medium=rss&utm_campaign=represion-policial-discapacidad-y-derechos-humanos", "fonte_id": "ciper_chile", "data_pub": "2026-11-02T13:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo aborda a repressão policial em relação às pessoas com deficiência e seus direitos humanos.", "titulo_pt": "Repressão policial, deficiência e direitos Humanos", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 241062, "titulo": "As UN peacekeeping mission in Western Sahara ends, refugees cling to hopes of return", "url": "https://www.scmp.com/news/world/africa/article/3373014/un-peacekeeping-mission-western-sahara-ends-refugees-cling-hopes-return", "fonte_id": "scmp", "data_pub": "2026-11-02T12:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Binina Mohamed, de 51 anos, vive em um campo de refugiados no sul da Argélia há toda a vida desde que foi forçada a deixar a região do Saara Ocidental, local de um conflito que é frequentemente considerado o mais antigo desafio territorial da África. A missão de paz da ONU no Saara Ocidental chegou ao fim após uma disputa no Conselho de Segurança das Nações Unidas.", "titulo_pt": "Missão de paz da ONU no saara ocidental termina, refugiados seguem com esperança de retorno", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 240884, "titulo": "Evacuated Ukrainians from Oleshky: 'We don't know where to go, but one thing is certain: We will survive'", "url": "https://www.lemonde.fr/en/international/article/2026/11/02/evacuated-ukrainians-from-oleshky-we-don-t-know-where-to-go-but-one-thing-is-certain-we-will-survive_6769438_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-02T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante uma cessão de hostilidades de seis dias entre Moscou e Kiev, cerca de 700 pessoas conseguiram deixar Oleshky, uma cidade ocupada por forças russas há quatro anos e localizada nas proximidades das linhas de frente. A população abandonada enfrentava graves escassezes de alimentos e medicamentos.", "titulo_pt": "Ucranianos de Oleshky: 'não sabemos para onde ir, mas uma coisa é certa: vamos sobreviver'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 240294, "titulo": "‘Life on Hold’: Poland’s Immigrants Face Years Waiting for Residence Permits", "url": "https://balkaninsight.com/2026/11/02/life-on-hold-polands-immigrants-face-years-waiting-for-residence-permits/rd/", "fonte_id": "balkan_insight", "data_pub": "2026-11-02T06:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Polônia tem se tornado um país de imigração mais rápido do que suas autoridades conseguem adaptar-se. Estrangeiros que vivem e trabalham no país enfrentam longos períodos de espera por permissoes de residência sob uma regra de emergência de 2022 que ainda está em vigor, sem muitas opções para contestar esses atrasos.", "titulo_pt": "Vida em pausa: polônia imigrante enfrenta anos de espera por permissoes de residência", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 240317, "titulo": "Retrial to begin next week for Uzbek national convicted of murder, robbery 16 yrs ago", "url": "https://www.koreaherald.com/article/10922926", "fonte_id": "korea_herald", "data_pub": "2026-11-02T06:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um réu uzbeco, Akmal Bozorov, de 37 anos, terá seu julgamento retrial iniciado na próxima semana. O julgamento, que começará às 11h do dia 12 de novembro no Fórum Distrital de Changwon, será para uma sentença de prisão perpétua, de 16 anos atrás, por matar e roubar um motorista de táxi em 2009.", "titulo_pt": "Re julgamento para ucraniano condenado a prisão perpétua por assassinato e roubo de motorista de táxi ocorrerá na próxima semana", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 240825, "titulo": "Thai Activist Sentenced to Additional Prison Term For Defaming Monarchy During 2020 Protest", "url": "https://thediplomat.com/2026/11/thai-activist-sentenced-to-additional-prison-term-for-defaming-monarchy-during-2020-protest/", "fonte_id": "the_diplomat", "data_pub": "2026-11-02T03:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Arnon Na function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];

  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
