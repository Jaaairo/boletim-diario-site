l": "https://www.theguardian.com/books/2026/nov/18/the-man-who-broke-reality-by-philip-ball-review-the-inspirational-genius-of-niels-bohr", "fonte_id": "guardian_culture", "data_pub": "2026-11-18T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O livro 'O Homem que Quebrou a Realidade' de Philip Ball oferece uma explicação acessível das descobertas científicas de Niels Bohr, que compartilha o prestígio de Albert Einstein na ciência do século XX. Bohr era um genial intuito físico, diferentemente de Einstein, e seu caráter influenciou profundamente a física moderna.", "titulo_pt": "O homem que quebrou a realidade - a genialidade inspiradora de Niels Bohr", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 271885, "titulo": "Disney+ Korea bets big on entertainment shows as it expands local slate", "url": "https://www.koreaherald.com/article/10941486", "fonte_id": "korea_herald", "data_pub": "2026-11-18T06:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quatro anos após seu lançamento na Coreia do Sul, o Disney+ ainda está atrás de líderes como a Netflix e concorrentes locais como o Tving e o Coupang Play. No entanto, a plataforma está investindo pesadamente em produções de entretenimento local para fechar essa diferença. Em uma apresentação em Seul, o Disney+ anunciou um novo line-up de programas originais de realidade, incluindo uma renovação para a segunda temporada do programa de competição de adivinhação de sorte 'Battle of Fates'.", "titulo_pt": "Disney+ Coreia aposta em produções de entretenimento para competir no mercado", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 271989, "titulo": "TV tonight: the terrifying and tragic case of a New Year’s Day arson attack", "url": "https://www.theguardian.com/tv-and-radio/2026/nov/18/tv-tonight-the-terrifying-and-tragic-case-of-a-new-years-day-arson-attack", "fonte_id": "guardian_culture", "data_pub": "2026-11-18T06:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O documentário em duas partes segue a investigação policial após um ataque de arrombamento em 2017. A história foca na sobrevivente Bex Williams, que teve seu namorado Cameron Logan morto no incêndio, e na investigação que apontou para uma disputa entre irmãos.", "titulo_pt": "TV desta noite: o caso assustador e trágico de um ataque de arrombamento em dia de ano novo", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 271981, "titulo": "‘The aesthetics in my family were so high, I felt ugly’: Charlotte Gainsbourg on extremism, abortion and her mother, Jane Birkin", "url": "https://www.theguardian.com/culture/2026/nov/18/charlotte-gainsbourg-aesthetics-family-high-i-felt-ugly-extremism-abortion-jane-birkin", "fonte_id": "guardian_culture", "data_pub": "2026-11-18T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Charlotte Gainsbourg atua em um filme sobre um advogado lutando pelos direitos reprodutivos no sistema francês. Ela fala sobre ser criticada por seu apoio a Israel e sobre ter visto uma foto de sua mãe, Jane Birkin, em uma demonstração pró-escolha no ano de 1972.", "titulo_pt": "Aestetica familiar alta: charlotte Gainsbourg sobre extremismo, aborto e sua mãe Jane Birkin", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 271983, "titulo": "The first truly weird Bond: 13 things to know about Robert Pattinson – from heavy saliva to dead clowns", "url": "https://www.theguardian.com/film/2026/nov/18/first-truly-weird-bond-13-things-robert-pattinson-from-heavy-saliva-to-dead-clowns", "fonte_id": "guardian_culture", "data_pub": "2026-11-18T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Robert Pattinson, conhecido por papéis eccentricos, será o próximo agente 007. A escolha gerou entusiasmo entre os fãs do ator desde sua época como vampiro no filme 'Crepúsculo'.", "titulo_pt": "O primeiro Bo _pt": "Aproximadamente 20 membros da tribo Awá, que vive em isolamento voluntário, emergiram do Amazonas e entraram em contato com uma aldeia, aceitando alimentos para levar de volta à sua área territorial. Este encontro histórico foi relatado por organizações não-governamentais e gerou preocupação sobre as ameaças crescentes à vida da tribo.", "titulo_pt": "Tribo isolada do amazonas emerge e entra em contato com aldeia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 270647, "titulo": "Em Minas, 75% preferem trabalho híbrido, ainda que salário seja menor", "url": "https://www.metropoles.com/minas-gerais/em-minas-75-preferem-trabalho-hibrido-ainda-que-salario-seja-menor", "fonte_id": "metropoles", "data_pub": "2026-11-17T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No primeiro semestre de 2026, a capital mineira abriu 13,8 mil vagas formais. Um especialista destacou novos desafios na seleção de candidatos, mesmo com 75% preferindo o trabalho híbrido.", "titulo_pt": "Em Minas, 75% preferem trabalho híbrido, ainda que salário seja menor", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 270621, "titulo": "Eficiência não é crescimento", "url": "https://veja.abril.com.br/coluna/historias-de-sucesso/eficiencia-nao-e-crescimento/", "fonte_id": "veja", "data_pub": "2026-11-17T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Delair Angelo Bolis, líder global da MSD Saúde Animal, compartilha insights sobre liderança. O artigo destaca experiências e lições aprendidas por Bolis em sua posição de liderança.", "titulo_pt": "Eficiência não é crescimento", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 270697, "titulo": "Mulher suspeita de jogar bonecas misteriosas em creches de SC é detida", "url": "https://www.cnnbrasil.com.br/nacional/sul/sc/mulher-suspeita-de-jogar-bonecas-misteriosas-em-creches-de-sc-e-detida/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-17T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher foi detida após ser identificada pelas câmeras de segurança. Ela enviou bonecas misteriosas para seis creches em Santa Catarina e a guarda municipal encontrou mais bonecas em sua casa.", "titulo_pt": "Suspeita de jogar bonecas misteriosas em creches de SC é detida", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 271310, "titulo": "Clima: país tem temporais, rajadas de vento e até queda de granizo nesta 4ª", "url": "https://www.metropoles.com/brasil/clima-pais-tem-temporais-rajadas-de-vento-e-ate-queda-de-granizo-nesta-4a", "fonte_id": "metropoles", "data_pub": "2026-11-18T09:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nesta quarta-feira, o Brasil enfrenta temporais, rajadas de vento e até queda de granizo em algumas regiões, enquanto o calor persiste em outras, com temperaturas chegando a 37°C.", "titulo_pt": "Clima: país tem temporais, rajadas de vento e queda de granizo nesta quarta-feira, com calor em algumas localidades", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 271465, "titulo": "Después de 180 años, reintrodujeron tortugas gigantes en una isla y seis meses después ya se había recuperado un ecosistema nunca antes visto", "url": "https://www.lanacion.com.ar/ciencia/despues-de-180-anos-reintrodujeron-tortugas-gigantes-en-una-isla-y-seis-meses-despues-ya-se-habia-nid17112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-18T09:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Foram reintroduzidas tartarugas gigantes da espécie Aldabrachelys gigantea na ilha do archipiélago Aride, após 180 anos. Em apenas seis meses, os cientistas observaram a recuperação de um ecosistema que nunca havia sido visto antes.", "titulo_pt": "Depois de 180 anos, tartarugas gigantes são reintroduzidas em uma ilha e ecosistema se recupera rapidamente", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 271331, "titulo": "COP31 entra na reta final e debate justiça climática em meio a impasses financeiros", "url": "https://exame.com/esg/cop31-entra-em-negociacoes-decisivas-e-debate-justica-climatica-em-meio-a-impasses-financeiros/", "fonte_id": "exame", "data_pub": "2026-11-18T06:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Disputas sobre a responsabilidade financeira na crise climática estão dificultando avanços em financiamento durante a COP31. Há expectativa por uma decisão importante nesta quarta-feira.", "titulo_pt": "COP31 entra na reta final e debate justiça climática em meio a impasses financeiros", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 271749, "titulo": "Rare video of Brazilian Amazon tribe", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/18/rare-video-of-brazilian-amazon-tribe?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-18T05:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo vídeo foi divulgado mostrando membros da tribo isolada Awa, que vive em uma área remota da floresta amazônica no Brasil.", "titulo_pt": "Novo vídeo da tribo isolada awa na amazônia brasileira", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 271702, "titulo": "The good and the bad of climate policy", "url": "https://www.ft.com/content/68e72928-ef85-481e-adbd-46b7b654223e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-18T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As políticas climáticas enfrentam desafios significativos para mitigar as mudanças futuras, mas esses desafios são superados pelos custos de adaptação às mudanças atuais.", "titulo_pt": "Os bons e os maus aspectos da política climática", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 271645, "titulo": "Paris, Lyon and Marseille make progress on reducing air pollution, but still trail Europe's cleanest cities", "url": "https://www.lemonde.fr/en/environment/article/2026/11/18/paris-lyon-and-marseille-make-inroads-into-reducing-air-pollution-but-still-lag-far-behind-europe-s-top-cities_6783097_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-18T03:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Paris, Lyon e Marselha têm progredido na redução da poluição do ar, mas ainda ficam atrás das cidades mais limpas da Europa. Uma coalizão de mais de 150 organizações não-governamentais lançou um novo ranking de qualidade do ar em 40 cidades e capitais europeias.", "titulo_pt": "Paris, Lyon e marselha avançam na redução da poluição do ar, mas ainda não atingem as cidades mais limpas da Europa", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 271302, "titulo": "Rio tem mais de 400 casos de mpox e primeira morte no Brasil", "url": "https://veja.abril.com.br/saude/rio-tem-mais-de-400-casos-de-mpox-e-primeira-morte-no-brasil/", "fonte_id": "veja", "data_pub": "2026-11-17T23:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Rio de Janeiro registrou mais de 400 casos de mpox, com uma morte confirmada. A maior concentração desses casos está na capital, que contabilizou 288 infecções.", "titulo_pt": "Rio tem mais de 400 casos de mpox e primeira morte no Brasil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 271588, "titulo": "An Obituary for America’s Measles-Elimination Status", "url": "https://www.theatlantic.com/newsletters/2026/11/rip-measles-elimination/689482/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-11-17T22:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A eliminação da doenças da sarampo nos Estados Unidos parecia ter muitos anos bons pela frente.", "titulo_pt": "Obituário para a Status de eliminação do sarampo nos estados unidos", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 270640, Tesouro Nacional, é considerado uma figura importante.", "titulo_pt": "Eco Invest, o cartão de visita da política climática brasileira", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 268922, "titulo": "Botellas de plástico y residuos que flotan: cómo es el nuevo sistema para evitar que toneladas de basura lleguen al Riachuelo", "url": "https://www.clarin.com/ciudades/botellas-plastico-residuos-flotan-nuevo-sistema-evitar-toneladas-basura-lleguen-riachuelo_0_KkPgQ54jAG.html", "fonte_id": "clarin", "data_pub": "2026-11-17T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O sistema visa modificar a tradicional limpeza do Rio Riachuelo. As embalagens plásticas e os resíduos flutuantes são os tipos de lixo mais comuns encontrados no local.", "titulo_pt": "Botijões de plástico e resíduos que flutuam: como é o novo sistema para evitar que toneladas de lixo cheguem ao Riachuelo", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 268940, "titulo": "Ranking QS de sustentabilidad: Ocho de las 11 universidades del país retrocedieron", "url": "https://www.lanacion.com.ar/sociedad/ranking-qs-de-sustentabilidad-ocho-de-las-11-universidades-del-pais-retrocedieron-nid17112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-17T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Universidade Austral foi a única instituição argentina a melhorar sua posição no ranking QS de sustentabilidade. O ranking avaliou o impacto ambiental, social e de governança de mais de 2000 universidades ao redor do mundo.", "titulo_pt": "Única universidade argentina no ranking de sustentabilidade avançou", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 268795, "titulo": "COP31 discute transição energética justa e financiamento para proteger oceanos e florestas", "url": "https://exame.com/esg/cop31-discute-transicao-energetica-justa-e-financiamento-para-proteger-oceanos-e-florestas/", "fonte_id": "exame", "data_pub": "2026-11-17T06:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ministros, cientistas e lideranças indígenas se reuniram em Antália para discutir a transição energética justa e financiamento para proteger oceanos e florestas. A programação incluiu debates sobre investimentos, direitos territoriais e cooperação internacional.", "titulo_pt": "COP31 discute transição energética justa e financiamento para proteger oceanos e florestas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 269234, "titulo": "Why the electrification push at global climate talks is stalling", "url": "https://www.japantimes.co.jp/environment/2026/11/17/electrification-global-climate-talks/", "fonte_id": "japan_times", "data_pub": "2026-11-17T06:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O esforço visa reduzir emissões transferindo o transporte, edificações e indústria para dispositivos elétricos mais eficientes em energia.", "titulo_pt": "Por que o impulso para a eletrificação nos debates climáticos globais está se estagnando", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 269038, "titulo": "European-made pesticides named in 1,605 poisoning reports in Brazil last year", "url": "https://www.theguardian.com/environment/2026/nov/17/european-made-pesticides-named-1605-brazil-poisoning-reports", "fonte_id": "guardian_world", "data_pub": "2026-11-17T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 1.600 relatos de intoxicações por pesticidas fabricados na Europa foram registrados no Brasil no ano passado. Aproximadamente um terço desses casos envolveu produtos químicos proibidos no uso nas fazendas da União Europeia devido aos riscos para a saúde humana e o meio ambiente.", "titulo_pt": "Pesticidas fabricados na Europa são citados em mais de 1.600 relatos de intoxicação no Brasil", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 271736, "titulo": "‘We want to go back’: Rohingya refugees pin hopes on ICJ genocide verdict", "url": "https://www.aljazeera.com/features/2026/11/18/we-want-to-go-back-rohingya-refugees-pin-hopes-on-icj-genocide-verdict?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-18T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Refugiados rohingya, que vivem no exílio há quase uma década, esperam que o TJ Internacional decida a seu favor. No entanto, não está claro se isso ajudará a permitir seu retorno.", "titulo_pt": "Queremos voltar”: refugiados rohingya esperam decisão favorável do tj internacional", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 271979, "titulo": "UNICEF FAST FACTS: World leaders meet in Manila to end violence against children", "url": "https://www.unicef.org/press-releases/unicef-fast-facts-world-leaders-meet-manila-end-violence-against-children", "fonte_id": "unicef", "data_pub": "2026-11-18T06:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Membros de governos mundiais se encontram em Manila para discutir a eliminação da violência contra crianças. O evento visa promover ações para proteger os direitos das crianças.", "titulo_pt": "Fatos rápidos: líderes mundiais se reúnem em Manila para combater violência contra crianças", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 271565, "titulo": "‘Devastating consequences’: One Nation plan to slash Australia’s refugee program denounced", "url": "https://www.theguardian.com/australia-news/2026/nov/18/one-nation-refugee-intake-immigration-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-11-18T05:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O partido One Nation propôs cortar drasticamente o programa de refugiados da Austrália em 90% e eliminar o programa de vistos permanentes para pais e pais idosos. A proposta foi criticada por oponentes políticos e organizações de advocacy como uma 'ataque barato' aos refugiados.", "titulo_pt": "Consequências devastadoras: plano do one Nation para reduzir programa de refugiados da austrália condenado", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 271641, "titulo": "Fears over impact of tear gas on women's health prompt calls for ban", "url": "https://www.lemonde.fr/en/environment/article/2026/11/18/fears-over-impact-of-tear-gas-on-women-s-health-prompt-calls-for-ban_6783098_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-18T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nove mil mulheres relataram problemas ginecológicos após exposição a gases lacrimogêneos durante protestos recentes em escolas e na sociedade francesa, conforme apresentado em testemunhos à Assembléia Nacional. Esses relatos levantaram preocupações sobre os efeitos desses gases na saúde feminina, resultando em chamados por uma proibição.", "titulo_pt": "Medo dos efeitos dos gases lacrimogêneos na saúde feminina leva a chamados por proibição", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 271980, "titulo": "At least 64 children killed and 64 injured in Yemen as intensified hostilities approach three-month mark", "url": "https://www.unicef.org/press-releases/least-64-children-killed-and-64-injured-yemen-intensified-hostilities-approach-three", "fonte_id": "unicef", "data_pub": "2026-11-18T02:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A intensificação dos conflitos no Iêmen está causando a morte e ferimentos em pelo menos 64 crianças, além de interromper o acesso a serviços de saúde, água segura, higiene, alimentos e educação. A cidade de Taiz está cada vez mais isolada.", "titulo_pt": "Pelo menos 64 crianças mortas e 64 feridas no iêmen à medida que os conflitos se intensificam, chegando ao terceiro mês", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 270690, "titulo": "Como as abelhas sem ferrão no Peru se tornaram os primeiros insetos do mundo a receber direitos legais", "url": "https://www.cnnbrasil.com.br/ciencia/como-as-abelhas-sem-ferrao-no-peru-se-tornaram-os-primeiros-insetos-do-mundo-a-receber-direitos-legais/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-17T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No Peru, foi aprovada uma legislação inovadora que concede direitos legais a mais de 175 espécies de insetos nativas, incluindo as abelhas sem ferrão, para protegê-las contra desmatamento, pesticidas e mudanças climáticas.", "titulo_pt": "Como as abelhas sem ferrão no Peru se tornaram os primeiros insetos do mundo a receber direitos legais", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 270701, "titulo": "Sobrevivente da bomba atômica de Nagasaki morre aos 97 anos em SC", "url": "https://www.cnnbrasil.com.br/nacional/sul/sc/sobrevivente-da-bomba-atomica-de-nagasaki-morre-aos-97-anos-em-sc/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-17T21:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Wataru Ogawa, sobrevivente da bomba atômica de Nagasaki, faleceu aos 97 anos em Frei Rogério, Santa Catarina. Ele era membro da comunidade japonesa local.", "titulo_pt": "Sobrevivente da bomba atômica de Nagasaki morre aos 97 anos em SC", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 270882, "titulo": "Eight-year-old Haitian boy returns home after release from ICE custody", "url": "https://www.theguardian.com/us-news/2026/nov/17/haitian-child-ice-custody-release", "fonte_id": "guardian_world", "data_pub": "2026-11-17T20:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um menino haitiano de oito anos, detido por agentes de imigração em San Diego em 4 de novembro e transferido para uma instalação em Texas, foi reunificado com sua família na Califórnia após 11 dias.", "titulo_pt": "Menino haitiano de 8 anos retorna para casa após ser solto da custódia do ICE", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 270793, "titulo": "Al menos 81 migrantes detenidos en operativos marítimos frente a la costa de California", "url": "https://www.clarin.com/estados-unidos/al-menos-81-migrantes-detenidos-en-operativos-maritimos-frente-a-la-costa-de-california_0_wbp9LHcTS0.html", "fonte_id": "clarin", "data_pub": "2026-11-17T20:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Autoridades interceptaram quatro barcos no sul da Califórnia em 7 e 8 de novembro, detendo 81 pessoas acusadas de tráfico de imigrantes. As operações envolveram a Guarda Costeira e a CBP e destacaram o perigo das embarcações sobrecarregadas no mar.", "titulo_pt": "Pelo menos 81 imigrantes detidos em operações marítimas na costa da califórnia", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 271024, "titulo": "Ugandan human trafficking survivor uses music to fight abuse", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/17/ugandan-human-trafficking-survivor-uses-music-to-fight-abuse?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-17T19:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O cantor ugandense Gideon Mwesezi, conhecido como 'Small Q', que sobreviveu ao tráfico humano em Myanmar, está utilizando a música para alertar outras pessoas sobre o problema.", "titulo_pt": "Sobrevivente de tráfico humano no uganda usa música para combater abuso", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 270759, "titulo": "Por que EUA perderam certificado de eliminação do sarampo após 26 anos", "url": "https://www.bbc.com/portuguese/articles/cq78258y8np9o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-17T18:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos relataram mais de 5,4 mil casos e 10 mortes de sarampo pela p ação aos direitos humanos.", "titulo_pt": "O Debate sobre a segurança da IA tem um vazio em direitos humanos", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 270183, "titulo": "Exclusive: UN commissioner Chris Sidoti says Israel is targeting children in Gaza", "url": "https://www.middleeasteye.net/video/exclusive-un-commissioner-chris-sidoti-israels-targeting-children-and-ongoing-genocide", "fonte_id": "middle_east_eye", "data_pub": "2026-11-17T16:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um membro da Comissão de Inquérito das Nações Unidas sobre o Território Palestino Ocupado, Chris Sidoti, afirmou que Israel está alvo de crianças em Gaza. Segundo Sidoti, não há cessar-fogo e Israel está cometendo genocídio no Gaza e na Cisjordânia ocupada.", "titulo_pt": "Exclusivo: comissário das nações unidas Chris Sidoti afirma que Israel está alvo de crianças em Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 270056, "titulo": "Lanzamiento Informe Anual sobre Derechos Humanos en Chile 2026", "url": "https://www.ciperchile.cl/2026/11/17/lanzamiento-informe-anual-sobre-derechos-humanos-en-chile-2026/?utm_source=rss&utm_medium=rss&utm_campaign=lanzamiento-informe-anual-sobre-derechos-humanos-en-chile-2026", "fonte_id": "ciper_chile", "data_pub": "2026-11-17T14:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O relatório anual sobre direitos humanos no Chile para 2026 foi lançado.", "titulo_pt": "Lançamento do relatório Anual sobre direitos Humanos no Chile 2026", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 271913, "fonte_id": "phys_org", "titulo": "Sudden heat spikes harm honey bees more than sustained heat, study finds", "url": "https://phys.org/news/2026-11-sudden-spikes-honey-bees-sustained.html", "data_pub": "2026-11-18T10:00:00Z", "topico": "ciencia", "idioma": "en", "titulo_pt": "Picos de calor repentinos function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">

    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
