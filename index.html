<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

<script>

sar uma ferramenta de inteligência artificial chinesa para atacar bancos sul-coreanos, embora não atribua os ataques a um indivíduo específico. As tensões diplomáticas aumentam com o Reino Unido mantendo sua missão diplomática em Jerusalém Oriental, apesar do pedido de Israel para fechar o consulado britânico, e com a Coreia do Sul recolhendo seu embaixador na Ucrânia devido a disputas sobre a transferência de prisioneiros de guerra da Coreia do Norte.\n\nOs Estados Unidos e o Irã continuam em um conflito geopolítico intenso, com relatos de discussões sobre possíveis ataques militares e a possível retomada de operações de bombardeio em larga escala. O preço do petróleo Brent atingiu US$ 104 por barril, refletindo a incerteza causada pelas tensões. O presidente dos Estados Unidos, Donald Trump, reiterou que não deseja um acordo com o Irã e que espera que a guerra contra o país termine em breve. As tensões também se refletem em outros cenários geopolíticos, como o ataque com drone no centro de dados da Yandex, na Rússia, e as ofensivas militares na Ucrânia, que mataram dezenas de pessoas. Além disso, a questão do Consulado britânico em Jerusalém e a presença de Israel em Gaza continuam a gerar tensões, com protestos globais exigindo um cessar-fogo. A China estendeu seu controle militar no Laos, potencialmente afetando as relações com o Vietnã, enquanto a Rússia e os Estados Unidos se envolvem em disputas sobre o Estreito de Ormuz.", "economia": "O cenário econômico global apresenta diversos desafios e oportunidades. A China pode ver uma recuperação dos mercados imobiliários nas maiores cidades no próximo ano, segundo a agência de classificação de risco S&P. Em contraste, a Coreia do Sul registrou um superávit na conta corrente em agosto, mantendo a tendência positiva de exportações, com o Banco da Reserva da Coreia do Sul (BOK) anunciando um superávit de US$46,1 bilhões em agosto. No Brasil, o governo autorizou a venda de ações minoritárias da Bahiagás, permitindo maior participação privada na distribuição de gás natural canalizado, um dia após uma eleição. O Edifício Chrysler, um ícone de Nova York, será reformado por novos donos em meio a um boom de escritórios de luxo na cidade. Além disso, a Anglo American ameaça fechar suas operações de níquel no Brasil se a União Europeia bloquear a venda da unidade para a MMG. O relatório da Moody's Ratings indica que é necessário um superávit primário de 2% a 3% do PIB para estabilizar a dívida pública, representando um desafio econômico para o próximo presidente. O dólar voltou a R$5,016 com ajustes pós-eleitorais no mercado financeiro brasileiro, enquanto o faturamento da indústria de transformação caiu 3,5% em agosto, segundo a CNI.", "tecnologia": "A Coreia do Sul realizou com sucesso o lançamento do seu primeiro veículo de vôo hipersônico, um avanço significativo em sua capacidade de ataque de alta velocidade, observado pelo presidente Yoon Suk Yeol. Em outra notícia, a Coreia do Sul enfrenta uma disputa de mercado com a empresa de semicondutores Huawei, que afirma que seus chips Ascend de inteligência artificial superaram os da Nvidia no mercado chinês. Além disso, a organização sem fins lucrativos Center for Humane Technology, que ajudou a iniciar um movimento contra o uso excessivo de telas, está demitindo a maioria de seus funcionários e passará a ser gerida pelo fundador. A startup de inteligência artificial Manus levantou $500 milhões em sua primeira rodada de financiamento desde a separação da Meta, enquanto a empresa de inteligência artificial Anthropic introduziu opções em chinês para seu chatbot Claude em mercados suportados.", "ciencia": "Cientistas identificaram a urolitina A, um composto natural produzido pela microbiota intestinal, como um potencial tratamento para a Enterite Inflamatória Crônica (EIC), conforme um estudo publicado pela La Tercera. Em outro avanço, cientistas de Viena e Pequim criaram os primeiros relógios nucleares do mundo, o que pode ter aplicações práticas e potencial para investigações em física fundamental. A longevidade de Jonathan, uma tartaruga gigante com 194 anos, foi mapeada por cientistas, que identificaram marcadores genéticos associados ao envelhecimento. No entanto, eles notaram que áreas importantes de seu DNA mantêm uma baixa 'desordem', semelhante a de indivíduos jovens, o que pode explicar parte de sua longevidade. Além disso, uma startup está lançando sua tecnologia de previsão de risco de câncer de mama por inteligência artificial diretamente aos pacientes, sem esperar pela adoção por parte de médicos e seguradoras, em um esforço para implementar tratamentos mais personalizados para mulheres mais velhas com câncer de mama.", "cultura": "O evento mais importante dos artigos é a cerimônia do Prêmio Nobel de Literatura, que será anunciado na manhã desta quinta-feira, 8 de outubro. Até agora, apenas 18 mulheres receberam este prestigiado prêmio. Paralelamente, a cultura literária chilena comemora 15 anos de existência no principal encontro de edição independente, a Primavera do Libro, que ocorrerá de 9 a 11 de outubro. No Japão, o país foi novamente classificado como o melhor do mundo em 2026, destacando-se por suas qualidades turísticas e características únicas. A exposição 'The weirdos were taking over!' na Tate Britain revisita o fascinante decênio dos anos 1990, quando arte, música e moda se misturaram de forma intensa, relembrando o período com imagens e objetos do passado. Além disso, a mostra 'Por Elas, Com Elas: Do Moderno ao Contemporâneo' reúne artistas de diferentes gerações em São Paulo, destacando as trajetórias de mulheres que expandiram os limites da arte brasileira, celebrando a diversidade e a evolução artística.", "sociedade": "Maricarmen Abascal, uma idosa de 87 anos que se tornou símbolo da crise habitacional na Espanha após ser despejada de sua residência em Madri, faleceu em 19 de outubro. A expulsão dela, em 23 de setembro, gerou protestos em massa e levou a um novo pleito eleitoral. Sua morte reavivou debates sobre a crise imobiliária no país, com centenas de pessoas se manifestando em Madri para exigir ações sobre a questão. Em Paris, jovens e adultos protestaram contra a degradação das escolas e a escassez de professores, com mais greves programadas. Esses eventos refletem a crescente preocupação com questões sociais e educacionais em vários países, incluindo a Espanha, França e Polônia.", "meio_ambiente": "O prolongado período de seca no centro de Sri Lanka está deixando poços secos, prejudicando os meios de subsistência dos agricultores e empurrando a vida selvagem para poças d'água cada vez menores. De acordo com a Unicef, as crianças serão impactadas 'desproporcionalmente' pelo fenômeno El Niño, devido à sua vulnerabilidade em face das mudanças climáticas urgentes. A conservação da vida selvagem tem tido sucesso, apesar da queda de 73% na população de animais selvagens, trazendo esperança para o mundo natural em crise. A maior colônia de pinguins do mundo perdeu o título de maior colônia de pinguins de-barbicha das Ilhas Sandwich do Sul, com uma perda de mais de meio milhão desses animais. O Mar do Cáspio tem vindo a encolher há décadas, com uma nova ilha emergindo, alertando para a situação semelhante ao Mar de Aral. A poluição do ar em Singapura atingiu o nível mais alto do mundo devido à fuligem proveniente das queimadas na Indonésia, fechando escolas em Kuala Lumpur, Malásia. Os severos temporais estão se tornando uma crescente ameaça para a infraestrutura energética nos Estados Unidos, superando as hurricânes em riscos de catástrofe segurada. O aquecimento global e o uso humano da água estão aumentando a pressão sobre a região do Mar do Cáspio, com partes do norte do mar enfrentando uma situação semelhante ao Mar de Aral.", "direitos_humanos": "Em uma decisão judicial na Coreia do Sul, o líder de uma organização religiosa controversa e sua organização foram condenados a pagar 370 milhões de wones (cerca de 276 mil dólares) a três mulheres que sofreram estupro por ele. Este caso reaviva debates sobre a responsabilidade legal e moral das organizações religiosas em casos de abuso sexual. Em outro desenvolvimento, seis jornalistas de uma plataforma de verificação de fatos independente no Egito foram detidos durante operações policiais, sendo acusados de terrorismo, o que causa preocupações sobre a liberdade de imprensa no país. Além disso, a Federação Palestina denuncia o fracasso dos acordos de paz, a fome impostas aos palestinos e a impunidade do Israel. A Oficina de Mídia do Governo de Gaza afirma que Israel matou 263 jornalistas e trabalhadores de mídia em três anos, refletindo a intensificação da censura e violência contra a mídia independente no território palestiniano."}, "resumo_do_dia": {"politica_nacional": [{"id": 202011, "titulo": "PL e Republicanos já disputam presidência da Alesp, após saída de André do Prado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/pl-e-republicanos-ja-disputam-presidencia-da-alesp-apos-saida-de-andre-do-prado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido Liberal (PL) e o Republicanos, partido do governador Tarcísio de Freitas, estão disputando o comando da Assembleia Legislativa de São Paulo (Alesp) para a próxima legislatura. A saída do atual presidente André do Prado está sendo antecipadamente disputada pelos dois partidos.", "titulo_pt": "PL e Republicanos já disputam presidência da Alesp, após saída de André do Prado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 202170, "titulo": "O que Flávio Bolsonaro e Lula propõem sobre o Bolsa Família", "url": "https://www.bbc.com/portuguese/articles/c84g120zwq1zo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-08T08:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula e Flávio Bolsonaro apresentam propostas distintas para o Bolsa Família durante a disputa pelo segundo turno da eleição presidencial no Brasil.", "titulo_pt": "Lula e Flávio Bolsonaro propõem diferentes ideias para o Bolsa Família", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 202012, "titulo": "Soltar Bolsonaro em decisão liminar exigiria evidência de erro judicial crasso, apontam especialistas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/soltar-bolsonaro-em-decisao-liminar-exigiria-evidencia-de-erro-judicial-crasso-apontam-especialistas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T07:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Jair Bolsonaro já apresentou dois pedidos de revisão criminal no STF para tentar reverter sua condenação no caso da trama golpista. Especialistas consideram que soltar Bolsonaro em decisão liminar exigiria evidência de um erro judicial crasso.", "titulo_pt": "Soltar Bolsonaro em decisão liminar exigiria evidência de erro judicial crasso, apontam especialistas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 201997, "titulo": "Incentivo eleva em 3 anos tempo de servidor na ativa, e em 2 anos para professores, aponta estudo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/incentivo-eleva-em-3-anos-tempo-de-servidor-na-ativa-e-em-2-anos-para-professores-aponta-estudo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O abono de permanência, um incentivo para prolongar o tempo de trabalho de funcionários públicos, faz com que os profissionais permaneçam em atividade por, em média, três anos. Para os professores, esse tempo de permanência é de cerca de dois anos.", "titulo_pt": "Incentivo eleva em 3 anos tempo de servidor na ativa, e em 2 anos para professores, aponta estudo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 202002, "titulo": "Governo dribla decisão de Dino e retém R$ 731,9 milhões da CVM em reserva", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/governo-dribla-decisao-de-dino-e-retem-r-7319-milhoes-da-cvm-em-reserva.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula colocou R$ 731,9 milhões do Orçamento de 2027 da CVM em reserva, ignorando uma decisão do ministro Flávio Dino no STF que determinava a liberação desses recursos. Essa ação restringe o uso de fundos para a Comissão de Valores Mobiliários.", "titulo_pt": "Governo dribla decisão de Dino e retém R$ 731,9 milhões da CVM em reserva", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 202014, "titulo": "Campanha de Lula emenda 3 dias de crise interna enquanto busca rumo para o 2º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/campanha-de-lula-emenda-3-dias-de-crise-interna-enquanto-busca-rumo-para-o-2o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de reeleição do presidente Lula enfrenta uma crise após obter menos votos no primeiro turno do que o senador Flávio Bolsonaro. O petista busca formas de virar a disputa no segundo turno, o que seria um feito inédito desde a redemocratização.", "titulo_pt": "Campanha de Lula enfrenta crise no primeiro turno enquanto busca virar o segundo turno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 202015, "titulo": "Congresso amplia presença feminina, mas vê avanço antifeminista", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/congresso-amplia-presenca-feminina-mas-ve-avanco-antifeminista.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Congresso brasileiro aumentou a presença de mulheres, mas enfrenta avanços de ideias antifeministas. A informação foi publicada na newsletter Todas, que pode ser assinada para receber atualizações semanais.", "titulo_pt": "Congresso amplia presença feminina, mas enfrenta avanços antifeministas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 202016, "titulo": "Tarcísio vence na cracolândia em eleição com virada sobre Haddad na capital de SP", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/tarcisio-vence-na-cracolandia-em-eleicao-com-virada-sobre-haddad-na-capital-de-sp.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tarcísio de Freitas (Republicanos) foi reeleito governador de São Paulo, vencendo em São Paulo no segundo turno das eleições. Fernando Haddad (PT) perdeu a capital paulista, que havia votado a seu favor nas últimas eleições.", "titulo_pt": "Tarcísio vence na capital em eleição que reelege governador de são paulo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 202017, "titulo": "Games viram parte da estratégia de candidatos e da crítica de eleitores em 2026", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/games-viram-parte-da-estrategia-de-candidatos-e-da-critica-de-eleitores-em-2026.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2026, os jogos eletrônicos se tornaram uma parte da estratégia de campanha de candidatos e da crítica de eleitores.", "titulo_pt": "Jogos eletrônicos fazem parte da estratégia de candidatos e da crítica de eleitores em 2026", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 202112, "titulo": "Flávio Bolsonaro amplia apoios e aliança pode reunir 286 deputados eleitos", "url": "https://exame.com/brasil/alianca-de-flavio-bolsonaro-pode-reunir-partidos-com-286-deputados-eleitos/", "fonte_id": "exame", "data_pub": "2026-10-08T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro ampliou suas alianças para o segundo turno das eleições, potencialmente reunindo 286 deputados eleitos. As legendas que apoiam o candidato concentraram 55,8% das cadeiras da Câmara dos Deputados.", "titulo_pt": "Flávio Bolsonaro amplia apoios e aliança pode reunir 286 deputados eleitos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 202018, "titulo": "Site distribui criptomoedas em troca de divulgação de conteúdo que incentiva voto em Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/site-distribui-criptomoedas-em-troca-de-divulgacao-de-conteudo-que-incentiva-voto-em-flavio-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T03:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um site de venda de criptomoedas lançou um esquema que distribui tokens para usuários que compartilham a mensagem B22 e conteúdos que incentivam o voto em Flávio Bolsonaro.", "titulo_pt": "Site de criptomoedas distribui tokens em troca de divulgação de conteúdo pró-flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 202019, "titulo": "No corredor da soja, estudante quer ser produtor rural e opta por Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/no-corredor-da-soja-estudante-quer-ser-produtor-rural-e-opta-por-flavio-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Matupá, localizada no norte de Mato Grosso, é uma cidade onde a soja, o milho e o mercado agropecuário são os principais temas. Diariamente, durante a safra, cerca de 2.000 a 3.000 caminhões passam pela região.", "titulo_pt": "No corredor da soja, estudante quer ser produtor rural e opta por Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 202020, "titulo": "Nunes reúne prefeitos da Grande SP em almoço com Flávio para reforçar campanha", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/nunes-reune-prefeitos-da-grande-sp-em-almoco-com-flavio-para-reforcar-campanha.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O prefeito de São Paulo, Ricardo Nunes, reúne prefeitos da Grande SP em almoço com Flávio Bolsonaro neste domingo, assumindo o papel de articulador da campanha do presidenciável.", "titulo_pt": "Nunes reúne prefeitos da Grande SP em almoço com Flávio para reforçar campanha", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 202021, "titulo": "Abstenção e voto útil explicam Flávio Bolsonaro na frente de Lula no 1º turno, dizem especialistas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/abstencao-e-voto-util-explicam-flavio-bolsonaro-na-frente-de-lula-no-1o-turno-dizem-especialistas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas atribuem a dianteira de Flávio Bolsonaro sobre Lula no primeiro turno das eleições presidenciais à abstenção e ao voto útil. Esses fatores são citados como explicação pelos especialistas ouvidos pela Folha.", "titulo_pt": "Abstenção e voto útil explicam Flávio Bolsonaro na frente de Lula no 1º turno, dizem especialistas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 202022, "titulo": "'Não vou declarar apoio a presidente da República', diz Raquel Lyra", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/nao-vou-declarar-apoio-a-presidente-da-republica-diz-raquel-lyra.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T01:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A governadora de Pernambuco, Raquel Lyra (PSD), reeleita recentemente, afirmou que não vai declarar apoio à presidente da República. A declaração foi dada durante uma entrevista à Folha no Palácio do Campo das Princesas, sede do governo pernambucano.", "titulo_pt": "Raquel Lyra não declarará apoio à presidente", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 202023, "titulo": "Ala do MDB cobra apoio a Flávio Bolsonaro, mas Baleia Rossi resiste", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/ala-do-mdb-cobra-apoio-a-flavio-bolsonaro-mas-baleia-rossi-resiste.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T01:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Membros do MDB de regiões Sul, Sudeste e Norte têm pressionado Baleia Rossi, presidente do partido, para que o MDB apoie o senador Flávio Bolsonaro (PL). Baleia Rossi, no entanto, ainda não se posicionou favoravelmente a essa ideia.", "titulo_pt": "Ala do MDB cobra apoio a Flávio Bolsonaro, mas Baleia Rossi resiste", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 202453, "titulo": "Anger mounts in Spain as woman whose eviction ignited housing protests dies", "url": "https://www.france24.com/en/video/20261008-anger-mounts-in-spain-as-woman-whose-eviction-ignited-housing-protests-dies", "fonte_id": "france24", "data_pub": "2026-10-08T09:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Maricarmen Abascal, uma mulher de 87 anos cuja expulsão dramática do apartamento levou a protestos de moradores pela habitação em massa e resultou em uma eleição antecipada, faleceu. Milhares de pessoas demonstraram em Madrid em sua homenagem.", "titulo_pt": "Raiva cresce na Espanha após morte da mulher cuja expulsão acendeu protestos de moradia", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 202491, "titulo": "UK scales back Jerusalem consulate after Israel dispute", "url": "https://www.dw.com/en/uk-scales-back-jerusalem-consulate-after-israel-dispute/a-79590790?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-10-08T09:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Reino Unido decidiu manter sua missão diplomática em Jerusalém, mas com redução no número de funcionários, em resposta a um pedido do Israel para fechar o consulado britânico, que tem uma história de quase 200 anos.", "titulo_pt": "Reino unido reduz consulado em jerusalém após disputa com Israel", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 202454, "titulo": "Houthis claim new attack on Riyadh airport as fighting continues in Yemen", "url": "https://www.france24.com/en/video/20261008-houthis-claim-new-attack-on-riyadh-airport-as-fighting-continues-in-yemen", "fonte_id": "france24", "data_pub": "2026-10-08T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Houthi rebeldes afirmam ter atacado o aeroporto de Riad com um míssil balístico. Em resposta, o coalition liderada por Saudi Arabia destruiu 82 alvos militares houthi. O conflito continua no Iêmen.", "titulo_pt": "Houthi afirmam atacar aeroporto de riad com míssil balístico enquanto conflito persiste no iêmen", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 202338, "titulo": "Hacker Used Chinese-Developed A.I. Tool to Target South Korean Banks, CrowdStrike Says", "url": "https://www.nytimes.com/2026/10/08/world/australia/south-korea-bank-hack-china-us-ai.html", "fonte_id": "nyt_world", "data_pub": "2026-10-08T09:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma empresa de segurança cibernética informou que um hacker que falava chinês e tinha motivações financeiras usou uma ferramenta de inteligência artificial desenvolvida na China para atacar bancos sul-coreanos, mas não atribuiu os ataques a um indivíduo ou grupo específico.", "titulo_pt": "Hackers usaram ferramenta de IA chinesa para atacar bancos sul-coreanos, diz CrowdStrike", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 202356, "titulo": "French high school protests continue despite PM’s promise of action – Europe live", "url": "https://www.theguardian.com/world/live/2026/oct/08/france-protests-spain-housing-maria-del-carmen-abascal-burnham-merz-europe-latest-news", "fonte_id": "guardian_world", "data_pub": "2026-10-08T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os protestos em escolas francesas continuam, apesar da promessa do Ministro da Educação, Sébastien Lecornu, de apresentar um plano para reformar o sistema educacional até o final do mês. Além disso, relatos tristes vindos da Ucrânia informam que pelo menos 30 pessoas foram mortas em um ataque russo perto de uma parada de ônibus na cidade de Kramatorsk, no leste do país.", "titulo_pt": "Protestos em escolas francesas continuam e Ucrânia registra novos mortos em ataque russo", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 202468, "titulo": "Trump says he doesn't want Iran deal as U.S. reportedly prepares for 'massive bombing'", "url": "https://www.cnbc.com/2026/10/08/us-iran-war-trump-hormuz.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-08T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos e sua equipe de segurança nacional discutiram a possibilidade de retomar operações militares em larga escala nos próximos semanas, de acordo com relatos da NBC News. Trump afirmou que não deseja um acordo com o Irã.", "titulo_pt": "Trump não quer acordo com o Irã enquanto EUA planejam 'bombardamento massivo'", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 202472, "titulo": "Russia's internet giant Yandex halts operations at major data center after drone attack", "url": "https://www.cnbc.com/2026/10/08/russia-yandex-ukraine-drone-strike-data-center.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-08T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A gigante russa de internet Yandex interrompeu as operações em um de seus centros de dados após um ataque com drone. O ataque ocorre enquanto a Ucrânia continua a atacar infraestruturas russas.", "titulo_pt": "Yandex, gigante de internet russa, suspende operações em centro de dados após ataque com drone", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 202150, "titulo": "Petróleo Brent supera os US$ 104 após notícias sobre planos de ataques dos EUA ao Irã", "url": "https://www.infomoney.com.br/mercados/petroleo-abertura-fechamento-ira-eua-08102026/", "fonte_id": "infomoney", "data_pub": "2026-10-08T09:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O petróleo Brent atingiu US$ 104 por barril após relatos de que o presidente dos Estados Unidos, Donald Trump, e sua equipe de segurança nacional estavam discutindo possíveis ataques militares ao Irã. As informações foram divulgadas pela NBC News.", "titulo_pt": "Petróleo Brent supera os US$ 104 após rumores sobre planos de ataques dos EUA ao Irã", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 202098, "titulo": "Ataques russos no dia do aniversário de Putin matam dezenas na Ucrânia", "url": "https://www.metropoles.com/mundo/ataques-russos-no-dia-do-aniversario-de-putin-matam-dezenas-na-ucrania", "fonte_id": "metropoles", "data_pub": "2026-10-08T09:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Forças russas realizaram uma ofensiva em grande escala no dia do aniversário do presidente Putin, usando mísseis balísticos, mísseis de cruzeiro e drones de combate, resultando em várias vítimas na Ucrânia.", "titulo_pt": "Ataques russos no dia do aniversário de Putin matam dezenas na Ucrânia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 202507, "titulo": "UK says Israel has no legal authority to close Jerusalem consulate", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/uk-rejects-israels-right-shut-jerusalem-consulate", "fonte_id": "middle_east_eye", "data_pub": "2026-10-08T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Reino Unido afirma que Israel não tem autoridade legal para fechar o consulado britânico em Jerusalém. O ministério das Relações Exteriores do Reino Unido declara que manterá sua presença na ocupada Jerusalém Oriental, independentemente da ação israelense.", "titulo_pt": "Reino unido afirma que Israel não tem autoridade legal para fechar consulado em jerusalém", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 202169, "titulo": "Quem é e qual o crime do primeiro militar que vai ser executado nos EUA desde a Segunda Guerra Mundial", "url": "https://www.bbc.com/portuguese/articles/cq70p4p76j2ro?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-08T09:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nidal Malik Hasan assassinou 13 soldados desarmados e feriu 32 no ataque mais letal não relacionado a combate contra uma base militar americana desde a Segunda Guerra Mundial.", "titulo_pt": "Quem é e qual o crime do primeiro militar a ser executado nos EUA desde a Segunda Guerra Mundial", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 202573, "titulo": "Germany’s ex-spymaster admits holding files but denies treason", "url": "https://www.ft.com/content/572b899b-0e36-4a90-aadc-776818e339c3?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-08T08:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "August Hanning, ex-chefe do serviço secreto alemão, admitiu ter em posse documentos confidenciais, mas negou trair o país. Seu advogado afirmou que Hanning nunca pagou pelos documentos nem os passou para potências estrangeiras.", "titulo_pt": "Ex-chefe do serviço secreto alemão admite ter documentos confidenciais, mas nega traição", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 202583, "titulo": "Takaichi continues to fend off questions about scandal-hit farm minister", "url": "https://www.japantimes.co.jp/news/2026/10/08/japan/politics/yana-takaichi/", "fonte_id": "japan_times", "data_pub": "2026-10-08T08:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro da Agricultura, Takaichi, continua evitando perguntas sobre o escândalo que o envolve. Isso não é favorável para o plano legislativo do governo, especialmente considerando a falta de maioria na Cámara Alta.", "titulo_pt": "Takaichi continua a evitar perguntas sobre o ministro da agricultura envolvido em escândalo", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 202357, "titulo": "French minister invites UK to ‘come all the way back’ to the EU", "url": "https://www.theguardian.com/politics/2026/oct/08/french-minister-invites-uk-to-come-all-the-way-back-to-the-eu", "fonte_id": "guardian_world", "data_pub": "2026-10-08T08:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro das Finanças da França, Roland Lescure, convidou o Reino Unido a retornar completamente à União Europeia após Andy Burnham sugerir a possibilidade de um novo referendo para revogar o Brexit. O primeiro-ministro britânico prometeu explorar laços mais estreitos com a União Europeia em uma cúpula prevista para este ano durante seu discurso na convenção do Partido Trabalhista.", "titulo_pt": "Ministro francês convida reino unido a retornar à ue", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 202679, "titulo": "(URGENT) S. Korea to recall ambassador to Ukraine amid dispute over disclosure of N.K. POW transfer", "url": "https://en.yna.co.kr/view/AEN20261008008300315", "fonte_id": "yonhap_news", "data_pub": "2026-10-08T08:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Coreia do Sul vai recolher seu embaixador na Ucrânia em virtude de uma disputa sobre a divulgação do envio de prisioneiros de guerra da Coreia do Norte.", "titulo_pt": "Coreia do sul vai recolher embaixador na Ucrânia por disputa sobre divulgação do envio de prisioneiros de guerra da Coreia do norte", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 202530, "titulo": "Why Israel loves skunk water", "url": "https://www.aljazeera.com/opinions/2026/10/8/why-israel-loves-skunk-water?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-08T08:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O produto de Israel com odor desagradável é usado como um meio de repressão contra os palestinos, transformando a repressão em uma oportunidade de vendas.", "titulo_pt": "Por que Israel ama a água de sapo", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 202470, "titulo": "After a yearslong slump, China's real estate market may be set for a turnaround", "url": "https://www.cnbc.com/2026/10/08/chinas-real-estate-market-may-be-set-for-a-turnaround-sp-says.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-08T09:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A recuperação dos mercados imobiliários nas maiores cidades da China pode ocorrer no ano qu 1, "titulo": "Justiça do Sul manda INSS rever regra e conceder aposentadoria mais vantajosa; entenda", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/justica-do-sul-manda-inss-rever-regra-e-conceder-aposentadoria-mais-vantajosa-entenda.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 8ª Vara Federal de Londrina determinou que o INSS conceda a aposentadoria por tempo de contribuição a um segurado que teve a aposentadoria negada após completar o tempo mínimo exigido para entrar na regra de transição do pedágio de 50%, aprovada pela reforma da Previdência de 2019.", "titulo_pt": "Justiça determina que INSS conceda aposentadoria mais vantajosa a segurado", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 202003, "titulo": "Advogado investigado por lavagem com bets comprou empresa de apostas acusada de calote no Rio", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/advogado-investigado-por-lavagem-com-bets-comprou-empresa-de-apostas-acusada-de-calote-no-rio.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O advogado Willer Tomaz, investigado por fraudes contra a Previdência, assumiu o controle da RioPag, empresa de pagamento do setor de apostas, em 2024, conforme documentos da Jucepar. Tomaz foi fotografado em viagens com o presidenciável Flávio Bolsonaro.", "titulo_pt": "Advogado investigado por fraudes contra a previdência compra empresa de apostas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 202004, "titulo": "Ícone de Nova York, Edifício Chrysler será reformado por novos donos em meio a boom de escritórios de luxo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/icone-de-nova-york-edificio-chrysler-sera-reformado-por-novos-donos-em-meio-a-boom-de-escritorios-de-luxo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Edifício Chrysler, um ícone de Nova York, será reformado por novos donos em um período de alta demanda por escritórios de luxo na cidade.", "titulo_pt": "Ícone de Nova York, Edifício Chrysler será reformado por novos donos em meio a boom de escritórios de luxo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 202110, "titulo": "Dívida alta, juros elevados e orçamento rígido: o desafio econômico do próximo presidente", "url": "https://exame.com/brasil/divida-alta-juros-elevados-e-orcamento-rigido-o-desafio-economico-do-proximo-presidente/", "fonte_id": "exame", "data_pub": "2026-10-08T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relatório da Moody's Ratings indica que é necessário um superávit primário de 2% a 3% do PIB para estabilizar a dívida pública. O desafio econômico para o próximo presidente envolve alta dívida, juros elevados e orçamento rígido.", "titulo_pt": "Dívida alta, juros elevados e orçamento rígido: o desafio econômico do próximo presidente", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 202466, "titulo": "America shut out Chinese EVs. Britain welcomed them — and now faces a difficult choice", "url": "https://www.cnbc.com/2026/10/08/autos-china-evs-uk-tariffs-hybrid-cars.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-08T05:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Grã-Bretanha está enfrentando uma escolha delicada sobre se seguirá a União Europeia e impor tarifas sobre os veículos elétricos chineses. O país precisa decidir entre os benefícios econômicos de importar esses veículos e eventuais preocupações relacionadas à qualidade e segurança.", "titulo_pt": "A grã-bretanha escolhe entre tarifas para veículos elétricos chineses ou não", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 202570, "titulo": "How a trillion-dollar hedge fund borrowing spree became Wall Street’s cash cow", "url": "https://www.ft.com/content/d313d0ce-d552-463e-9e84-6fa8c3efeeec?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-08T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As atividades de trading das instituições bancárias estão em crescimento, mas a regulamentação pós-crise impede que sejam os próprios bancos que façam as apostas.", "titulo_pt": "Como uma onda de empréstimos de um fundo de investimento trilionário se tornou a fonte de renda da Wall Street", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 202572, "titulo": "Big investors ‘bottom fish’ in Eurozone bond markets after France sell-off", "url": "https://www.ft.com/content/9cf103ed-548e-4b06-baed-71632abca961?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-08T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores de grande porte estão buscando oportunidades no mercado de títulos da dívida da zona do euro após a venda de títulos franceses. Os gerentes de ativos afirmam que as preocupações com um possível novo colapso semelhante à crise de dívida da zona do euro foram exageradas.", "titulo_pt": "Grande investidores 'pesquisam fundo' no mercado de títulos da zona do euro após vendas francesas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 202675, "titulo": "Coupang files lawsuits against 620 bln-won fine over data leak", "url": "https://en.yna.co.kr/view/AEN20261008008700320", "fonte_id": "yonhap_news", "data_pub": "2026-10-08T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de comércio eletrônico Coupang Corp. apresentou ações judiciais em respost
