 um autor descomplicado", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 79184, "titulo": "Silent Hill Townfall: the series is coming to Scotland, but what fresh horrors will it bring?", "url": "https://www.theguardian.com/games/2026/jul/29/silent-hill-is-coming-to-scotland-but-what-else-will-townfall-bring-to-the-series", "fonte_id": "guardian_culture", "data_pub": "2026-07-29T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem amnésico chega a uma pequena vila costeira de uma ilha escocesa remota, com suas memórias vagas e um nevoeiro estranho pairando no ar. Este cenário é típico do gênero Silent Hill, mas agora o local é uma ilha escocesa ao invés da região norte-americana ou japonesa habitual.", "titulo_pt": "Silent Hill Townfall: a série chega à escócia, mas quais novas atrocidades esperam por lá?", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 79188, "titulo": "Beginning Middle End by Valeria Luiselli review – a mother and daughter’s odyssey", "url": "https://www.theguardian.com/books/2026/jul/29/beginning-middle-end-by-valeria-luiselli-review-a-mother-and-daughters-odyssey", "fonte_id": "guardian_culture", "data_pub": "2026-07-29T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A jornada de descoberta da autora Valeria Luiselli, que viaja dos EUA para a Sicília, aborda temas urgentes, mas se torna cada vez mais introspectiva. O livro é impulsionado por uma solicitação semelhante àquela feita na história 'Uma Conversa Com Meu Pai' de Grace Paley.", "titulo_pt": "Do começo ao fim por Valeria Luiselli - revisão: uma odisséia mãe e filha", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 79193, "titulo": "Take the plunge! A deep dive into New York and other great American cities – in pictures", "url": "https://www.theguardian.com/artanddesign/gallery/2026/jul/29/take-the-plunge-a-deep-dive-into-new-york-and-other-great-american-cities-in-pictures", "fonte_id": "guardian_culture", "data_pub": "2026-07-29T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova exposição apresenta trabalhos de fotógrafos renomados como Peter Hujar, Garry Winogrand e Edward Steichen, retratando cidades americanas em movimento. A mostra oferece uma visão das grandes cidades norte-americanas através da lente desses mestres da fotografia.", "titulo_pt": "Pule! Uma mergulho profundo nas cidades de nova York e outras grandes cidades americanas – em imagens", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 79194, "titulo": "TV tonight: Tinie Tempah’s popular house extension series returns", "url": "https://www.theguardian.com/tv-and-radio/2026/jul/29/tv-tonight-tinie-tempahs-popular-house-extension-series-returns", "fonte_id": "guardian_culture", "data_pub": "2026-07-29T05:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tinie Tempah retorna com sua série sobre reformas de casas que mistura glamour do Great Gatsby e temas náuticos. Duas casas diferentes são transformadas, uma inspirada em luxo e outra em sustentabilidade.", "titulo_pt": "Esta noite na TV: série de tinie Tempah sobre reformas de casas retorna com tema de great gatsby e navegação", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 79182, "titulo": "‘No plan, no budget, no promotion’: how a genre-mashing masterpiece by a forgotten New York beatnik blew Gen Z away", "url": "https://www.theguardian.com/culture/2026/jul/29/my-skyscraper-nirosta-steel-new-york-beatnik", "fonte_id": "guardian_culture", "data_pub": "2026-07-29T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um álbum lançado pela primeira vez em 1984, que misturou diversos gêneros como disco, folk, synth-pop e ópera chinesa, foi ressuscitado recentemente sob o nome Nirosta Steel. O músico Steven Hall, de 69 anos, está sendo elogiado por críticos após o lançamento do álbum My Skyscraper em 2025.", "titulo_pt": "'Sem planejamento, orçamento ou promoção': como um masterpiece que misturava gêneros acabou cativando a Gen Z", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 78893, "titulo": "France's summer festivals adapt to rising temperatures with new methods", "url": "https://www.lemonde.fr/en/culture/article/2026/07/29/france-s-summer-festivals-adapt-to-rising-temperatures-with-new-methods_6755945_30.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-29T03:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Festivais de verão na França estão adotando novos métodos para se adaptar às temperaturas elevadas, como atrasar os shows para o período da noite, fazer trabalhos técnicos cedo pela manhã e instalar equipamentos de resfriamento. As visitas aos exibidores também estão sendo reduzidas.", "titulo_pt": "Festivais de verão na França adaptam-se às altas temperaturas com novos métodos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 78894, "titulo": "Senegal, the new hub for shipping cocaine consumed in Europe", "url": "https://www.lemonde.fr/en/summer-reads/article/2026/07/29/senegal-the-new-hub-for-shipping-cocaine-consumed-in-europe_6755943_183.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-29T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Até 2030, metade da cocaína latino-americana consumida na Europa será transportada pela África Ocidental. Em Dakar, um importante porto de tráfico de drogas, o uso de drogas sintéticas, ainda mais perigosas, está se expandindo.", "titulo_pt": "Senegal se torna novo hub para o transporte da cocaína consumida na Europa", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 77696, "titulo": "Voltaire, filósofo: “Quienes creen que el dinero lo hace todo terminan haciendo todo por dinero”", "url": "https://www.lanacion.com.ar/lifestyle/voltaire-filosofo-quienes-creen-que-el-dinero-lo-hace-todo-terminan-haciendo-todo-por-dinero-nid28072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-29T02:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A frase de Voltaire, que sugere que aqueles que acreditam que o dinheiro resolve tudo acabam fazendo tudo por dinheiro, ganha nova relevância diante da alta produtividade atual. Especialistas alertam para o perigo de transformar o capital em único motor da existência.", "titulo_pt": "Voltaire, filósofo: ‘aqueles que acreditam que o dinheiro resolve tudo acabam fazendo tudo por dinheiro’", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}], "cultura__eventos": [], "sociedade": [{"id": 78680, "titulo": "Desde Atacama hasta Magallanes: cuáles son las 13 regiones chilenas bajo alerta sanitaria por hantavirus tras 18 muertes", "url": "https://www.lanacion.com.ar/sociedad/desde-atacama-hasta-magallanes-cuales-son-las-13-regiones-chilenas-bajo-alerta-sanitaria-por-nid29072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-29T11:24:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Saúde do Chile implementou uma alerta sanitária para 13 regiões, incluindo Atacama e Magallanes, devido a um aumento na letalidade do hantavirus, que chegou a 39% dos casos. A medida também prevê precauções contra influenza aviar e dengue e será válida até julho de 2027.", "titulo_pt": "Das Atacama às Magallanes: quais são as 13 regiões chilenas sob alerta sanitário por hantavirus após 18 mortes", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 78554, "titulo": "Três pessoas são mortas a tiros dentro de fazenda em Goiás", "url": "https://www.metropoles.com/distrito-federal/na-mira/tres-pessoas-sao-mortos-a-tiros-dentro-de-fazenda-em-goias", "fonte_id": "metropoles", "data_pub": "2026-07-29T11:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Três pessoas foram mortas a t , "texto_pt": "O Corpo de Guardas Costeiros da Coreia permitiu que um de seus membros, acusado de assédio sexual, retornasse ao seu posto original após ser transferido, resultando em ambos trabalharem na mesma estação. Em 2024, um subordinado havia acusado um inspetor sênior da Estação Pyeongtaek do Corpo de Guardas Costeiros em 2022 de fazer comentários inapropriados, considerados assédio sexual.", "titulo_pt": "Vítima e agressor de assédio sexual trabalham na mesma estação da guarda costeira", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 78639, "titulo": "O desafio do poder público para contratar bons serviços de segurança pública", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-desafio-do-poder-publico-para-contratar-bons-servicos-de-seguranca-publica", "fonte_id": "jota", "data_pub": "2026-07-29T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Instituições precisam questionar modelos inadequados e avançar para contratações modernas para alcançar bons resultados. O desafio do poder público está em reformular suas abordagens na contratação de serviços de segurança pública.", "titulo_pt": "O desafio do poder público para contratar bons serviços de segurança pública", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 78699, "titulo": "Três irmãs criaram uma escola para fisioterapeutas oncológicos — e agora querem vender mais", "url": "https://exame.com/negocios/tres-irmas-criaram-uma-escola-para-fisioterapeutas-oncologicos-e-agora-querem-vender-mais/", "fonte_id": "exame", "data_pub": "2026-07-29T07:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Três irmãs criaram uma escola para fisioterapeutas oncológicos e a empresa, BioOnco, faturou R$ 1 milhão no último ano. A companhia recebeu mentoramento de Caio Carneiro no Choque de Gestão para melhorar sua área comercial.", "titulo_pt": "Três irmãs criaram escola para fisioterapeutas oncológicos e buscam expandir", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 79132, "titulo": "Gwangju murder case sparks calls for legislative reform", "url": "https://www.koreaherald.com/article/10824540", "fonte_id": "korea_herald", "data_pub": "2026-07-29T06:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Deputados coreanos propuseram mudanças legislativas para limitar a imunidade de responsabilidade de familiares de suspeitos que escondem criminosos e manipulam evidências após um caso de assassinato em Gwangju, onde o pai do suspeito, um policial, supostamente manipulou as evidências.", "titulo_pt": "Caso de assassinato em gwangju aciona pedido por reforma legislativa", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 78214, "titulo": "1 in 20 Koreans in gray intellectual zone: survey", "url": "https://www.koreaherald.com/article/10824128", "fonte_id": "korea_herald", "data_pub": "2026-07-29T02:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo comissionado pelo governo mostrou que 5,1% dos menores e 6,8% dos adultos na Coreia do Sul estão em risco significativo de ter uma função intelectual marginal, que se refere a uma capacidade cognitiva abaixo da média, mas não tão severa quanto uma deficiência intelectual. Dos participantes com menos de 18 anos, 2,6% foram categorizados como no grupo em risco de função intelectual marginal (BIF) e 2,5% como no grupo de busca para BIF.", "titulo_pt": "1 Em 20 coreanos na zona intelectual cinza: estudo", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 77700, "titulo": "Amplían arrestos de migrantes: los cinco pasos a seguir si el ICE te aborda en un aeropuerto en julio 2026", "url": "https://www.lanacion.com.ar/estados-unidos/amplian-arrestos-de-migrantes-los-cinco-pasos-a-seguir-si-el-ice-te-aborda-en-un-aeropuerto-en-julio-nid28072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-29T02:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo oferece orientações sobre como proceder se um migrante for abordado pelo ICE em aeroportos dos Estados Unidos em julho de 2026. Os leitores são instruídos sobre quais documentos mostrar e quando falar, bem como os cinco passos essenciais a seguir.", "titulo_pt": "Cinco passos para se guiar caso o ICE aborde um migrante em aeroportos nos EUA em julho 2026", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 77849, "titulo": "Con foco en nacimientos, vejez y empleo formal: autoridades discuten medidas para mejorar la protección social en Chile", "url": "https://www.latercera.com/pulso/noticia/con-foco-en-nacimientos-vejez-y-empleo-formal-autoridades-discuten-medidas-para-mejorar-la-proteccion-social-en-chile/", "fonte_id": "la_tercera", "data_pub": "2026-07-29T01:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Autoridades chilenas discutiram medidas para melhorar a proteção social, focando em nascimentos, velhice e emprego formal. O evento foi marcado pelo reconhecimento de que ainda há muito a ser feito para alcançar os objetivos desejados.", "titulo_pt": "Com foco em nascimentos, velhice e emprego formal: autoridades discutem medidas para melhorar a proteção social no Chile", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 77851, "titulo": "La urgencia del desempleo juvenil", "url": "https://www.latercera.com/cartas-al-director/noticia/la-urgencia-del-desempleo-juvenil/", "fonte_id": "la_tercera", "data_pub": "2026-07-29T00:56:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a urgência do problema do desemprego jovem, destacando as necessidades urgentes de soluções para esta questão social.", "titulo_pt": "A urgência do desemprego juvenil", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 77858, "titulo": "Grandes y medianas empresas estarán obligadas a informar sobre sus políticas de equidad de género", "url": "https://www.latercera.com/pulso/noticia/grandes-y-medianas-empresas-estaran-obligadas-a-informar-sobre-sus-politicas-de-equidad-de-genero/", "fonte_id": "la_tercera", "data_pub": "2026-07-29T00:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As empresas com mais de 200 funcionários terão a obrigação de informar anualmente sobre suas políticas de equidade de gênero. Para setores específicos, como mineração, pesquisa e desenvolvimento, finanças, energia, transporte e construção, essa exigência começa para empresas com mais de 50 empregados.", "titulo_pt": "Grandes e médias empresas terão de relatar políticas de equidade de gênero", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 77861, "titulo": "El otro drama de los temporales: 15 mil personas se mantienen aisladas hace casi una semana", "url": "https://www.latercera.com/nacional/noticia/el-otro-drama-de-los-temporales-15-mil-personas-se-mantienen-aisladas-hace-casi-una-semana/", "fonte_id": "la_tercera", "data_pub": "2026-07-29T00:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um sistema frontal mantém grande parte do país sob alerta, com tornados, chuvas intensas e ventos fortes na região centro-sul. Em Atacama e Coquimbo, milhares de pessoas permanecem isoladas há cerca de uma semana, recebendo alimentos e insumos médicos por meio de lançamentos aéreos.", "titulo_pt": "Outro drama dos temporais: 15 mil pessoas se mantêm isoladas há quase uma semana", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 78610, "titulo": "Sob alerta de chuva e ventos, Defesa Civil ativa Gabinete de Crise em SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/sob-alerta-de-chuva-e-ventos-defesa-civil-ativa-gabinete-de-crise-em-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T10:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Defesa Civil de São Paulo ativou o Gabinete de Crise nesta quar function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">

  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
