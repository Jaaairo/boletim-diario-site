<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>

</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "18/09/2026 15:18", "stats": {"noticias_novas": 980, "resumos_gerados": 240}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Lula enfrenta desafios na reta final da campanha eleitoral, devido a uma crise no STF que está causando desgaste na campanha de reeleição. A Procuradoria-Geral da República deu parecer favorável a um pedido para que Henrique Moura Vorcaro realize exames médicos fora da prisão. O PT aumentou o Bolsa Família, o que representa um impacto financeiro de R$ 22 bilhões em 2027, em uma tentativa de reverter pesquisas eleitorais. Além disso, a defesa de Daniel Vorcaro pediu a revogação da prisão preventiva, argumentando a crise no STF e a indefinição da condução da Operação Compliance Zero.", "mundo": "A aliança entre os Estados Unidos e Coreia do Sul foi destacada como um elemento crucial para a paz na Península Coreana, segundo a embaixadora dos EUA na Coreia do Sul, Michelle Steel. No entanto, o governo sul-coreano manteve as cotações máximas de combustíveis em meio às tensões no Oriente Médio. A Coreia do Sul também anunciou a reabertura de centros de detenção para pessoas que excederam o visto de trabalho no Brasil. A Indonésia recebeu seu primeiro porta-aviões. A Coreia do Norte acusou os Estados Unidos de aumentar as tensões na Península Coreana através de exercícios militares multilaterais. Por outro lado, a Venezuela se aproxima de um acordo para utilizar um reservatório de ouro contestado, com valor estimado em US$ 4 bilhões. O Irã ativou rotas terrestres para contornar o bloqueio dos EUA. Sob a pressão de Trump, a OTAN está impulsionando a diversificação das dependências de armas, tecnologia e empresas de defesa americanas. O presidente sul-coreano, Yoon Suk-yeol, emitiu uma série de desculpas em um momento crítico. O déficit francês deve aumentar para 5,4% do PIB em 2026, distante do alvo de 5% estabelecido para 2027. Além disso, a Irlanda vai boycottar o Eurovision pela segunda vez consecutiva em 2027, em protesto contra a 'inaceitável' continuidade dos assassinatos no Gaza.\n\nA Ucrânia continua sendo um cenário de tensões geopolíticas, com o conflito entre as duas nações se estendendo por cinco anos. Neste contexto, os russos realizaram votações, enquanto o presidente francês Emmanuel Macron ordenou reforçar a proteção de infraestrutura crítica em face de ameaças híbridas atribuídas a agentes russos. Além disso, o avanço dos hutíes no Iêmen e a escalada de ataques na região estão ligados não apenas à influência iraniana, mas também à rivalidade saudita-egípcia. Na Ásia, a Coreia do Norte realizou testes nucleares que podem ter provocado quase 1.400 terremotos, enquanto a Tailândia enfrenta a persistência de conflitos entre separatistas e autoridades. No cenário mais amplo, o Brasil ainda busca definir seu papel no bloco BRICS após sediar o evento, enquanto a Indonésia adquiriu seu primeiro porta-aviões como parte de um aumento nas operações militares.", "economia": "Os Estados Unidos adiaram a aplicação de tarifas até a cúpula entre Biden e Xi, evitando a implementação imediata. O Banco do Japão aumentou as taxas de juros em uma decisão dividida, enfrentando pressão dos Estados Unidos. O Brasil vai retomar as exportações de carne de frango para a Europa, conforme anunciou Cleber Soares, secretário-executivo do Ministério da Agricultura e Pecuária, após a aprovação dos protocolos sanitários brasileiros pela União Europeia. O próximo presidente enfrentará uma dívida bruta de quase 86% do PIB e uma economia em desaceleração, o que aumentará o custo do governo para se financiar e limitará investimentos e crescimento econômico. O dólar está em alta devido a uma nova pesquisa Datafolha que mostra a intenção de voto por segmentos do eleitorado, com Lula liderando entre os eleitores de 16 a 24 anos. Além disso, a pesquisa indica que o interesse dos consumidores pelo uso de carros elétricos tem aumentado no Brasil, com montadoras acelerando o desenvolvimento de veículos elétricos para atender a normas ambientais e à demanda do público.", "tecnologia": "O governador da Califórnia, Gavin Newsom, está liderando esforços para supervisionar a inteligência artificial (IA) no estado, incluindo a possibilidade de implementar um 'botão de desligamento' para modelos avançados, conforme anunciado em um novo decreto executivo. Este movimento surge em um momento em que a IA está se tornando cada vez mais central na economia global, com empresas como Anthropic e OpenAI enfrentando crescentes questionamentos sobre a segurança de suas plataformas. Além disso, a China está se aproximando no desenvolvimento de IA, o que coloca a administração de Joe Biden sob pressão para adotar uma postura mais regulatória. Em um desenvolvimento preocupante, pesquisadores de segurança cibernética invadiram a OpenAI usando um software da rival Anthropic, destacando vulnerabilidades na segurança da empresa detentora do ChatGPT. Este incidente ocorre em um contexto em que a Anthropic informou que os sistemas de IA estão se tornando cada vez mais capazes de criar versões futuras de si mesmas, aumentando as preocupações sobre os riscos associados à tecnologia.", "ciencia": "A NASA concedeu à SpaceX três missões adicionais para transporte de tripulação à Estação Espacial Internacional, expandindo os esforços para a exploração espacial. Além disso, a OpenAI utilizou inteligência artificial para resolver um problema matemático centenário, levantando questões sobre o futuro papel dos matemáticos na pesquisa científica. A descoberta de um novo planeta jovem, com menos de 1 milhão de anos, o Elias 2-24 b, desafia as teorias sobre a evolução do universo. Na biotecnologia, a Anthropic, liderada por Dario Amodei, construiu um laboratório secreto para desenvolver remédios para doenças raras. Por outro lado, a degradação florestal na Amazônia está em alta, e a concentração de carbono na atmosfera está aumentando, com consequências para a saúde e o clima. A China planeja se tornar uma potência global em biomedicina até 2030, visando tecnologias de ponta e pelo menos 25% do mercado de medicamentos inovadores.", "cultura": "Em março de 2027, o festival Franchir, dedicado à literatura francófona, será realizado em São Paulo. O evento contará com a presença de renomados autores como Françoise Vergès e Chamoiseau, oferecendo uma programação cultural rica. Em outro desenvolvimento cultural, Peter Hook, baixista britânico e fundador das bandas Joy Division e New Order, confirmou sua turnê no Brasil, que ocorrerá em março de 2027, em parceria com The Light. A turnê incluirá shows em São Paulo, com os ingressos a serem vendidos a partir de 18 de setembro de 2026, às 11h, na plataforma Ticket360. Além disso, o escritor e roteirista Emmanuel Carrère, conhecido por suas obras introspectivas, afirmou estar mais feliz, apesar de suas tendências de se flagelar, em uma entrevista concedida por videoconferência.", "sociedade": "A mãe do candidato Garotinho faleceu, o que levou-o a cancelar compromissos políticos na região da Baixada Fluminense. Em Fortaleza, no Ceará, jovens foram baleados por policiais militares durante uma gravação de cena de roubo para redes sociais, acusando a confusão de ser uma ação criminosa real. No Hospital Príncipe de Gales, em Sha Tin, Hong Kong, um paciente de 54 anos morreu após engasgar com uma refeição comum, o que levou a uma investigação interna. No Brasil, apenas 29% das pessoas com deficiência estavam empregadas em 2022, de acordo com dados do IBGE, com renda geralmente menor que a média nacional. A geolocalização pode aumentar a eficácia das investigações criminais nas favelas, mas também pode reduzir a proteção dos direitos fundamentais dos moradores, conforme apontado por um estudo recente.", "meio_ambiente": "Queimadas ameaçam o fornecimento de energia na região Norte do Brasil, com o mês de setembro tendo registrado o maior número histórico de interrupções de energia causadas por incêndios, liderado pelo Pará. No Amapá, a exploração de petróleo divide opiniões locais, com o líder indígena Wagner Karipuna expressando preocupações sobre a possibilidade de um vazamento de petróleo que afetaria sua comunidade. Estudos indicam que o número de dias extremamente quentes deve aumentar significativamente até o final do século, enquanto grupos estão incentivando o uso de energia verde nas fábricas da TSMC, uma das principais empresas de fabricação de chips do mundo.", "direitos_humanos": "Uma missão da ONU apontou crimes de guerra cometidos pelos Estados Unidos durante ataques militares que atingiram uma escola infantil no Iêmen, resultando na morte de 178 pessoas, a maioria crianças. Em outro evento, a jornalista Sophia Huang Xueqin, ativista do movimento #MeToo na China, está prestes a ser libertada após um período de prisão desde 2021, e amigos e grupos de direitos humanos expressam preocupação com sua situação após o cumprimento da pena. Na África do Sul, nove mulheres foram encontradas mortas em uma área de Johannesburgo em dois meses, aumentando as preocupações sobre a segurança das mulheres no país. No Peru, Mariana Dewey, uma peruana de 24 anos, foi acusada de declarar ter cidadania americana para se registrar e votar nas eleições de 2024, com o USCIS denunciando supostos fraudes. Finalmente, mais de 180 escritores assinaram uma carta pedindo informações sobre a vida de 12 escritores eritreanos detidos desde 2001, durante uma repressão à liberdade de expressão, liderada por escritores nobéis Olga Tokarczuk e JM Coetzee."}, "resumo_do_dia": {"politica_nacional": [{"id": 169041, "titulo": "Coordenador da campanha de Lula admite desgaste eleitoral após crise no STF", "url": "https://g1.globo.com/politica/blog/andreia-sadi/post/2026/09/18/coordenador-da-campanha-de-lula-entrevista.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-18T17:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Edinho Silva, coordenador da campanha do presidente Lula, admitiu que a crise no STF causou desgaste na campanha de reeleição do petista.", "titulo_pt": "Coordenador da campanha de Lula reconhece desgaste eleitoral após crise no STF", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 169042, "titulo": "PGR dá parecer favorável a pedido de Henrique Vorcaro para realizar exames médicos", "url": "https://g1.globo.com/politica/noticia/2026/09/18/pgr-da-parecer-favoravel-a-pedido-de-henrique-vorcaro-para-realizar-exames-medicos.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-18T17:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral da República deu parecer favorável a um pedido para que Henrique Moura Vorcaro, pai de Daniel Vorcaro, realize exames médicos fora da prisão. O pedido foi feito pela defesa devido a possíveis sintomas de diverticulite.", "titulo_pt": "PGR autoriza exames médicos fora da prisão para pai de ex-banqueiro", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 169078, "titulo": "A nova orientação da campanha de Lula sobre a crise no STF", "url": "https://veja.abril.com.br/politica/a-nova-orientacao-da-campanha-de-lula-sobre-a-crise-no-stf/", "fonte_id": "veja", "data_pub": "2026-09-18T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os aliados e apoiadores de Lula foram instruídos a passar para uma posição ofensiva, exigindo investigações em relação aos ministros do STF suspeitos de envolvimento no escândalo do Banco Master.", "titulo_pt": "Nova orientação de Lula sobre a crise no STF", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 169253, "titulo": "Ao lado de Andrei, Lula promete “desocupar” territórios do crime no Rio", "url": "https://www.metropoles.com/brasil/ao-lado-de-andrei-lula-promete-desocupar-territorios-do-crime-no-rio", "fonte_id": "metropoles", "data_pub": "2026-09-18T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Durante uma visita ao Rio de Janeiro, o presidente Lula discursou sobre a intenção de eliminar os territórios dominados pelo crime organizado e de livrar o estado da corrupção e da criminalidade.", "titulo_pt": "Ao lado de Andrei, Lula promete 'desocupar' territórios do crime no Rio", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 169151, "titulo": "Cury defende julgamento rápido do caso Master e mudanças no STF", "url": "https://www.cnnbrasil.com.br/eleicoes/cury-defende-julgamento-rapido-do-caso-master-e-mudancas-no-stf/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-18T17:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato do Avante à Presidência, Cury, defendeu durante uma agenda em São Paulo o julgamento rápido do caso Master e criticou pesquisas eleitorais, afirmando que algoritmos prejudicaram o alcance de sua campanha nas redes sociais.", "titulo_pt": "Cury defende julgamento rápido e critica pesquisas eleitorais", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 169006, "titulo": "Lula vai a Pernambuco para ampliar vantagem no Nordeste e impulsionar João Campos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/09/lula-vai-a-pernambuco-para-ampliar-vantagem-no-nordeste-e-impulsionar-joao-campos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-18T17:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva (PT) viajará a Pernambuco para um ato de campanha antes do primeiro turno. A visita visa fortalecer a posição do petista no estado e ajudar o ex-prefeito do Recife João Campos (PSB) na disputa contra a governadora Raquel Lyra (PSD).", "titulo_pt": "Lula viaja a Pernambuco para fortalecer João Campos antes do primeiro turno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 169086, "titulo": "As ofensivas de Lula para reverter cenário de pesquisas e tirar foco de crise do STF", "url": "https://veja.abril.com.br/politica/as-ofensivas-de-lula-para-reverter-cenario-de-pesquisas-e-tirar-foco-de-crise-do-stf/", "fonte_id": "veja", "data_pub": "2026-09-18T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula adotou um novo comportamento, abandonando a cautela em relação ao mercado financeiro, e anunciou medidas populistas com o objetivo de reverter as pesquisas eleitorais e desviar o foco da crise no Supremo Tribunal Federal.", "titulo_pt": "As ofensivas de Lula para reverter pesquisas e tirar foco da crise no STF", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 169007, "titulo": "Bolsonaro foi terrorista ao tentar dar golpe, diz Lula em crítica a Trump", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/bolsonaro-foi-terrorista-ao-tentar-dar-golpe-diz-lula-em-critica-a-trump.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-18T16:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula (PT) afirmou que Jair Bolsonaro (PL) fez parte de um grupo terrorista ao planejar um golpe em 2022.", "titulo_pt": "Lula acusa bolsonaro de ter sido terrorista ao tentar dar golpe", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 169008, "titulo": "Aliados dizem que Milton Leite vai se apresentar à polícia nesta sexta", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/aliados-dizem-que-milton-leite-vai-se-apresentar-a-policia-nesta-sexta.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-18T16:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados de Milton Leite informam que ele deve se apresentar à Polícia Civil nesta sexta-feira. O ex-presidente da Câmara Municipal de São Paulo é do partido União Brasil.", "titulo_pt": "Aliados dizem que Milton Leite se apresentará à polícia nesta sexta", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 169043, "titulo": "Lula diz não aceitar classificação de facções como terroristas: 'Terrorismo foi o 8 de Janeiro'", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/18/lula-diz-nao-aceitar-classificacao-de-faccoes-como-terroristas-terrorismo-foi-o-8-de-janeiro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-18T16:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula afirmou que não concorda com a classificação dos Estados Unidos de facções criminosas como terroristas. Ele associou o termo 'terrorismo' a eventos específicos como o 8 de Janeiro e o planejamento de assassinatos de autoridades no contexto de um golpe.", "titulo_pt": "Lula não aceita classificação de facções como terroristas", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 169009, "titulo": "Ministro do STJ disse estar 'sempre à disposição' de Vorcaro, indicam mensagens", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/ministro-do-stj-disse-estar-sempre-a-disposicao-de-vorcaro-indicam-mensagens.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-18T16:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Conversas entre Daniel Vorcaro e o ministro do STJ Benedito Gonçalves foram encontradas em mensagens do celular de Vorcaro. Isso sugere uma possível relação próxima entre os dois.", "titulo_pt": "Ministro do STJ diz estar 'sempre à disposição' de Vorcaro, indicam mensagens", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 169010, "titulo": "Lula foi alvo de 1 em cada 4 conteúdos com IA publicados na pré-campanha, diz levantamento", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/lula-foi-alvo-de-1-em-cada-4-conteudos-com-ia-publicados-na-pre-campanha-diz-levantamento.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-18T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula (PT) foi o principal alvo de conteúdos com uso de inteligência artificial durante a pré-campanha, de acordo com um levantamento do Observatório IA nas Eleições. Foram identificados 112 casos de reprodução artificial de imagem ou voz do presidente.", "titulo_pt": "Lula foi alvo de 1 em cada 4 conteúdos com IA publicados na pré-campanha, diz levantamento", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 169011, "titulo": "Ex-ministra do STJ diz que investigação contra Moraes vai implodir a República e pode prejudicar as eleições", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/ex-ministra-do-stj-diz-que-investigacao-contra-moraes-vai-implodir-a-republica-e-pode-prejudicar-as-eleicoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-18T15:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ex-ministra do STJ Eliana Calmon afirmou que uma investigação séria contra o ministro do STF Alexandre de Moraes pode causar grandes danos à República e que há bandidos de toga na Suprema Corte.", "titulo_pt": "Ex-ministra do STJ diz que investigação contra Moraes pode desestabilizar o país e afetar as eleições", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 169096, "titulo": "Candidatos não poderão ser presos a partir deste sábado", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/candidatos-nao-poderao-ser-presos-partir-deste-sabado", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-18T15:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A partir deste sábado (19), candidatos às eleições 2026 não poderão ser presos ou detidos durante os 15 dias que antecedem o primeiro turno, marcado para 4 de outubro. A proibição valerá até 48 horas após o encerramento da votação.", "titulo_pt": "Candidatos não poderão ser presos a partir deste sábado", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 169022, "titulo": "Promotoria denuncia ex-diretor da Fazenda de SP por organização criminosa e corrupção", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/promotoria-denuncia-ex-diretor-da-fazenda-de-sp-por-organizacao-criminosa-e-corrupcao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T15:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público de São Paulo denunciou André Weiss, ex-diretor-geral da Secretaria de Fazenda paulista, por corrupção passiva e organização criminosa. A prisão preventiva dele foi mantida.", "titulo_pt": "Promotoria denuncia ex-diretor da Fazenda de SP por corrupção e organização criminosa", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 169045, "titulo": "Caiado diz que reajuste do Bolsa Família é 'comprar voto'", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/18/caiado-critica-reajuste-bolsa-familia.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-18T15:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ronaldo Caiado, cand ndo/2026/09/por-que-putin-se-importa-com-as-eleicoes-legislativas-mesmo-com-resultado-previsivel.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-18T16:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O sistema de poder na Rússia é frequentemente descrito como 'democracia administrada', onde o Kremlin controla tudo, incluindo as eleições legislativas. Mesmo com resultados previsíveis, Putin se importa com essas eleições por causa do controle que elas conferem ao Kremlin.", "titulo_pt": "Por que Putin se importa com as eleições legislativas, mesmo com resultado previsível", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 169459, "titulo": "How Americanness Overcomes Islamophobia", "url": "https://foreignpolicy.com/2026/09/18/rozina-ali-seasons-fury-review-islamophobia-911-attacks-america/", "fonte_id": "foreign_policy", "data_pub": "2026-09-18T16:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O livro de Rozina Ali explora como quatro famílias lidam com a mudança pós-11 de setembro em relação à islamofobia.", "titulo_pt": "Como americana superpõe-se à islamofobia", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 169640, "titulo": "Howard Buffett to succeed father as Berkshire Hathaway chair", "url": "https://www.ft.com/content/e26d8335-426a-4405-ae4c-433bd2696994?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-18T16:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Howard Buffett será o novo presidente do conselho da Berkshire Hathaway, sucedendo seu pai, que assumirá o cargo de chair emeritus.", "titulo_pt": "Howard Buffett vai suceder o pai como chair da Berkshire Hathaway", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 169649, "titulo": "More than 112,000 displaced by Yemen fighting; thousands flee to Djibouti", "url": "https://www.aljazeera.com/news/2026/9/18/more-than-112000-displaced-by-yemen-fighting-thousands-flee-to-djibouti?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-18T16:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 112 mil pessoas foram deslocadas devido ao conflito no Iêmen, com milhares fugindo para Djibouti. A ONU afirma que 22 milhões de pessoas precisam de ajuda humanitária à medida que o conflito se intensifica.", "titulo_pt": "Mais de 112 mil deslocados por conflito no iêmen; milhares fogem para Djibouti", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 169617, "titulo": "Three dead and eight injured in Philippines school shooting", "url": "https://www.euronews.com/2026/09/18/three-dead-and-eight-injured-in-philippines-school-shooting", "fonte_id": "euronews", "data_pub": "2026-09-18T15:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três pessoas morreram e oito ficaram feridas em um tiroteio em uma escola nas Filipinas. Segundo autoridades, o adolescente envolvido havia avisado amigos após o almoço que iria 'fazer algo', mas eles acharam que ele estava brincando.", "titulo_pt": "Três mortos e oito feridos em tiroteio em escola nas filipinas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 169452, "titulo": "Flight chaos for hundreds of thousands was caused in ‘millisecond’ by software error", "url": "https://www.theguardian.com/world/2026/sep/18/flight-chaos-affecting-hundreds-of-thousands-caused-in-millisecond-by-software-error-uk", "fonte_id": "guardian_world", "data_pub": "2026-09-18T15:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um erro de software no sistema de controle do tráfego aéreo do Reino Unido causou uma falha em seis horas que afetou centenas de milhares de voos, levando a cancelamentos e atrasos em todo o país. O incidente durou de 10h até 16h, mas não foi declarado como um incidente principal até às 12h30.", "titulo_pt": "Confusão no voo causada em 'milissegundo' por erro de software", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 169724, "titulo": "US holds off tariffs until Xi summit", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/19/2003864507", "fonte_id": "taipei_times", "data_pub": "2026-09-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos adiaram a aplicação de tarifas até a cúpula entre Biden e Xi. O encontro entre os líderes dos EUA e da China está programado para ocorrer em breve, evitando assim a implementação imediata das tarifas.", "titulo_pt": "EUA adiam tarifas até cúpula com Xi", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 169725, "titulo": "BOJ raises rates in split decision amid US pressure", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/19/2003864508", "fonte_id": "taipei_times", "data_pub": "2026-09-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Banco do Japão (BOJ) aumentou as taxas de juros em uma decisão dividida, enfrentando pressão dos Estados Unidos. Os membros do comitê do BOJ votaram de forma mista, com alguns a favor do aumento e outros contra.", "titulo_pt": "BOJ aumenta taxas de juros em decisão dividida sob pressão dos EUA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 169016, "titulo": "Sindicatos de trabalhadores de energia pedem suspensão de pagamento de R$ 2,3 bi a acionistas da Axia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/sindicatos-de-trabalhadores-de-energia-pedem-suspensao-de-pagamento-de-r-23-bi-a-acionistas-da-axia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Trinta e quatro sindicatos de trabalhadores do setor elétrico pediram à 80ª Vara do Trabalho do Rio de Janeiro a suspensão do pagamento de aproximadamente R$ 2,3 bilhões programado para acionistas da Axia Energia na próxima terça-feira (22).", "titulo_pt": "Sindicatos pedem suspensão do pagamento de R$ 2,3 bi a acionistas da Axia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 169018, "titulo": "Número de brasileiros que já apostaram em bets cresce 75,2% em 8 meses, e receita de sites sobe 5,9%", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/numero-de-brasileiros-inscritos-em-bets-aumenta-752-em-8-meses-e-receita-dos-sites-sobe-59.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T16:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de brasileiros que já apostou em bets aumentou para 43,8 milhões no fim de agosto, representando 27% da população adulta, um crescimento de 75,2% em relação aos 25 milhões registrados no fim de 2025. A receita de sites de apostas também aumentou em 5,9% no período.", "titulo_pt": "Número de brasileiros que já apostou em bets cresce 75,2% em 8 meses, e receita de sites sobe 5,9%", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 169265, "titulo": "Presidenciáveis prometem impulsionar setor elétrico sem priorizar transição energética", "url": "https://www.jota.info/coberturas-especiais/matriz/presidenciaveis-prometem-impulsionar-setor-eletrico-sem-priorizar-transicao-energetica", "fonte_id": "jota", "data_pub": "2026-09-18T15:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos à presidência prometem avançar no setor elétrico, destacando a diversificação energética e a industrialização mineral, no entanto, os planos são vagos quanto às medidas ambientais.", "titulo_pt": "Presidenciáveis prometem impulsionar setor elétrico sem se preocupar com transição energética", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 169019, "titulo": "Tóquio testa robôs coletores de lixo na estação de trem mais movimentada do mundo; veja vídeo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/09/toquio-testa-robos-coletores-de-lixo-na-estacao-de-trem-mais-movimentada-do-mundo-veja-video.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T15:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A estação de trem mais movimentada do mundo, localizada no centro de Tóquio, está testando robôs coletores de lixo para ajudar na limpeza. A iniciativa visa aliviar o trabalho da equipe de limpeza.", "titulo_pt": "Tóquio testa robôs coletores de lixo na estação de trem mais movimentada do mundo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 169266, "titulo": "BC possibilita Pix Automático em contas-salário e define regra para cobrança híbrida", "url": "https://www.jota.info/tributos-e-empresas/mercado/bc-possibilita-pix-automatico-em-contas-salario-e-define-regra-para-cobranca-hibrida", "fonte_id": "jota", "data_pub": "2026-09-18T15:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A BC (Banco Central) permitiu o uso do Pix Automático em contas-salário e estabeleceu regras para a saída ordenada do Pix e para a marcação de fraude. Também definiu regras para cobrança híbrida.", "titulo_pt": "BC permite Pix Automático em contas-salário e estabelece regras para cobrança híbrida e marcação de fraude", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 169021, "titulo": "Cade vê compra da Medley pela EMS como 'complexa', frustra empresas e vai aprofundar análise", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/cade-ve-compra-da-medley-pela-ems-como-complexa-frustra-empresas-e-vai-aprofundar-analise.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T15:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Cade considera a compra da Medley pela EMS como uma operação complexa e vai aprofundar sua análise. O negócio, avaliado em cerca de R$ 3,2 bilhões, está gerando frustração entre as empresas envolvidas.", "titulo_pt": "Cade vê compra da Medley pela EMS como complexa e vai aprofundar análise", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 169026, "titulo": "Benefício por pessoa do Bolsa Família sobe para R$ 164; veja novos valores", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/beneficio-por-pessoa-do-bolsa-familia-sobe-para-r-164-veja-novos-valores.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T14:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O benefício do Bolsa Família será aumentado para R$ 164 por pessoa a partir de outubro. A parcela para crianças de até sete anos será elevada para R$ 173.", "titulo_pt": "Benefício do Bolsa Família aumenta para R$ 164; veja novos valores", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 169102, "titulo": "Pix terá novas regras para fraudes, cobrança híbrida e contas-salário", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/pix-tera-novas-regras-para-fraudes-cobranca-hibrida-e-contas-salario", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-18T14:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central introduziu novas regras para o Pix, incluindo a autorização do uso em contas-salário a partir de julho de 2027 e a regulamentação da cobrança híbrida, que combina boleto e QR Code do Pix. As novas regras entram em vigor em fevereiro do próximo ano.", "titulo_pt": "Novas regras para pix incluem uso em contas-salário e cobrança híbrida", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 169453, "titulo": "Record fuel prices across EU prompt calls for bloc-wide windfall tax on firms", "url": "https://www.theguardian.com/world/2026/sep/18/eu-europe-fuel-prices-calls-windfall-tax-energy-firms", "fonte_id": "guardian_world", "data_pub": "2026-09-18T14:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Governos da União Europeia discutiram a possibilidade de implementar uma taxa sobre lucros excessivos nas empresas de energia, em resposta a altos preços de combustíveis e gás. Esse movimento surge em meio a eleições programadas para o próximo ano em oito países da UE, incluindo França, Itália, Espanha e Polônia.", "titulo_pt": "Chamados para taxa sobre lucros excessivos nas empresas de energia na ue", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 169028, "titulo": "Assaí anuncia compra de 18 postos de combustíveis em São Paulo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/assai-anuncia-compra-de-18-postos-de-combustiveis-em-sao-paulo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T14:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Sendas, proprietária da rede de supermercados Assaí, adquiriu 18 postos de combustíveis em São Paulo por um valor estimado de até R$ 80 milhões. O anúncio foi feito nesta quinta-feira (17).", "titulo_pt": "Assaí compra 18 postos de combustíveis em São Paulo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 169029, "titulo": "Credores da Braskem rejeitam plano de dívida e cobram acionistas, diz agência", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/credores-da-braskem-rejeitam-plano-de-divida-e-cobram-acionistas-diz-agencia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T14:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os credores da Braskem rejeitaram o plano de reestruturação proposto pela empresa, o que aumenta a pressão sobre a Petrobras para fornecer novos recursos. Os detalhes específicos do plano e a reação dos acionistas não foram detalhados.", "titulo_pt": "Credores da Braskem rejeitam plano de reestruturação e pressionam petrobras", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 169030, "titulo": "BC libera Pix automático em conta-salário e prevê exclusão imediata de instituições; veja mudanças", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/bc-libera-pix-automatico-em-conta-salario-e-preve-exclusao-imediata-de-instituicoes-veja-mudancas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T14:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central anunciou mudanças nas regras do Pix, permitindo pagamentos automáticos via Pix para contas-salário a partir de 1º de julho de 2027. As novidades incluem também a exclusão imediata de instituições que não cumprirem os requisitos estabelecidos.", "titulo_pt": "BC libera Pix automático em conta-salário e prevê exclusão imediata de instituições; veja mudanças", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 169644, "titulo": "Former Wells Fargo asset manager Allspring explores $4bn sale", "url": "https://www.ft.com/content/1270032d-25e9-4be0-aa2f-5205b9bedd08?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-18T14:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma empresa de gestão de ativos ex-Wells Fargo, Allspring, está explorando a venda de ativos por cerca de 4 bilhões de dólares. Esta transação seria parte de uma série de negócios que têm remodelado o setor.", "titulo_pt": "Ex-gestor de ativos da Wells Fargo, Allspring, considera venda de 4 bilhões de dólares", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 169216, "titulo": "De reciclagem a agrofloresta: como a Heineken faturou R$ 560 milhões com negócios de impacto", "url": "https://exame.com/esg/de-reciclagem-a-agrofloresta-como-a-heineken-faturou-r-560-milhoes-com-negocios-de-impacto/", "fonte_id": "exame", "data_pub": "2026-09-18T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Criado há dois anos com um investimento inicial de R$ 150 milhões, o ecossistema da Heineken reúne marcas, energia renovável e princípios de circularidade. É descrito como uma operação financeiramente sustentável.", "titulo_pt": "De reciclagem a agrofloresta: como a Heineken faturou R$ 560 milhões com negócios de impacto", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 169800, "titulo": "Gavin Newsom is pushing for an AI kill switch", "url": "https://www.theverge.com/policy/997516/california-governor-newsom-ai-kill-switch", "fonte_id": "the_verge", "data_pub": "2026-09-18T17:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governador da Califórnia, Gavin Newsom, está buscando liderar a supervisão de IA no estado, incluindo a possibilidade de exigir um 'botão de desligamento' para modelos avançados, através de um novo decreto executivo. O decreto direciona o estado a formar um grupo de especialistas que deverão apresentar recomendações em duas meses sobre como abordar a questão.", "titulo_pt": "Gavin Newsom quer impulsionar supervisão de IA no estado com 'botão de desligamento'", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 169643, "titulo": "Ex-Apollo executive admits to improperly using company documents", "url": "https://www.ft.com/content/c57e73d1-547d-4f69-addb-6516845fbe6d?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-18T16:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Imran Siddiqui, ex-executivo da Apollo, admitiu o uso inadequado de documentos da empresa. Ele foi processado pela unidade Athene de um grupo de compra de empresas por conta de seu rival start-up.", "titulo_pt": "Ex-executivo da apollo admite uso inadequado de documentos da empresa", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 169786, "titulo": "An Undercover Google Analyst Infiltrated a Notorious Supply-Chain Hacking Gang", "url": "https://www.wired.com/story/an-undercover-google-analyst-infiltrated-a-notorious-supply-chain-hacking-gang/", "fonte_id": "wired", "data_pub": "2026-09-18T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo de hackers conhecido como TeamPCP realizou uma das maiores operações de hacking de cadeia de suprimentos, invadindo milhares de empresas. Agora, o grupo de inteligência de ameaças da Google afirma ter um agente infiltrado no círculo interno dos hackers.", "titulo_pt": "Analista de Google infiltrado na gangue de hackers Notorious", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 169642, "titulo": "Anthropic and the golden rules of business", "url": "https://www.ft.com/content/e2d2b86f-4f22-477f-9578-75c72683f1e9", "fonte_id": "financial_times", "data_pub": "2026-09-18T15:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alterações na tecnologia e na geopolítica estão transformando a noção ideal de uma empresa perfeita.", "titulo_pt": "Anthropic e as regras douradas do negócio", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 169802, "titulo": "Security researchers used Claude to help them hack into OpenAI", "url": "https://www.theverge.com/ai-artificial-intelligence/997444/openai-hack-claude-heif-heist", "fonte_id": "the_verge", "data_pub": "2026-09-18T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo de três pesquisadores de segurança independentes da Hacktron afirmou ter invadido contas de funcionários da OpenAI em menos de 72 horas usando o Claude Opus 4.8 e 5, desenvolvidos pela Anthropic, conforme relatado pelo The Wall Street Journal. Eles conseguiram acessar o repositório GitHub da OpenAI, chamado 'Monorepo', que supostamente contém os segredos algorítmicos da empresa.", "titulo_pt": "Pesquisadores de segurança utilizaram Claude para hackear contas de funcionários da OpenAI", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 169803, "titulo": "Brendan Carr’s FCC is more worried about who The View interviews than foreign governments owning Paramount", "url": "https://www.theverge.com/policy/997416/brendan-carr-fcc-foreign-governments-paramount", "fonte_id": "the_verge", "data_pub": "2026-09-18T15:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FCC anunciou que vai permitir que três fundos de riqueza soberana, controlados pelos governos de Arábia Saudita, Catar e Abu Dhabi, tenham 49,5% da Paramount-Warner Bros., superando a regra que limitava a participação estrangeira a 25%. Durante o mandato de Brendan Carr, a FCC ameaçou a ABC, mas não fornece detalhes específicos sobre essas ameaças.", "titulo_pt": "Brendan carr's FCC se preocupa mais com entrevistas do The View do que com governos estrangeiros possuindo a Paramount", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 169631, "titulo": "California Gov. Newsom issues executive order to rein in AI 'before it's too late'", "url": "https://www.cnbc.com/2026/09/18/california-newsom-executive-order-ai.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-18T15:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governador de California, Gavin Newsom, emitiu um decreto executivo para controlar a inteligência artificial (IA) antes que possa causar danos significativos. Além disso, outros potenciais candidatos democratas à presidência em 2028 também apelaram por uma abordagem mais agressiva para enfrentar as preocupações relacionadas à IA.", "titulo_pt": "Governador de california emite decreto para controlar IA 'antes que seja tarde demais'", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 169787, "titulo": "AI PACs Have Dumped Nearly $1 Million Into an Obscure Senate Race", "url": "https://www.wired.com/story/ai-pacs-have-dumped-nearly-1-million-into-an-obscure-senate-race/", "fonte_id": "wired", "data_pub": "2026-09-18T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "PACs ligados a laboratórios e investidores de IA gastaram quase um milhão de dólares em uma corrida pelo senado do estado republicano do South Dakota, enquanto os residentes locais contribuíram menos.", "titulo_pt": "PACs de IA investiram quase um milhão em corrida pelo senado do south dakota", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 169788, "titulo": "If the AI Industry Followed Its Own Research, It Might Have Paused Already", "url": "https://www.wired.com/story/if-the-ai-industry-followed-its-own-research-it-might-have-paused-already/", "fonte_id": "wired", "data_pub": "2026-09-18T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Anthropic afirma que a segurança da IA depende de entender como a IA ‘pensa’. Até o momento, os sinais são preocupantes.", "titulo_pt": "Se a indústria de IA seguisse sua própria pesquisa, talvez já tivesse parado", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 169027, "titulo": "Anthropic diz que sistemas de IA avançam para criar versões de si mesmos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/anthropic-diz-que-sistemas-de-ia-avancam-para-criar-versoes-de-si-mesmos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T14:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A gigante de inteligência artificial Anthropic informou que os sistemas de IA estão se tornando cada vez mais capazes de criar versões futuras de si mesmas, aumentando as preocupações sobre os riscos associados à tecnologia. A empresa fez essa afirmação nesta quinta-feira, 17 de setembro de 2026.", "titulo_pt": "Anthropic avisa que sistemas de IA estão se autodesenvolvendo, aumentando preocupações", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 169622, "titulo": "OpenAI's latest AI revelation is a 'serious situation,' Microsoft's Suleyman tells CNBC", "url": "https://www.cnbc.com/2026/09/18/microsoft-ai-ceo-openais-latest-ai-revelation-a-serious-situation.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-18T14:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Suleyman comentou sobre as últimas demonstrações preocupantes do comportamento do modelo da OpenAI, divulgadas recentemente. Essas situações são consideradas uma situação séria.", "titulo_pt": "Últimas revelações da openai são 'situação séria', afirma Suleyman para CNBC", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 169732, "titulo": "Alibaba open-sources medical AI model that can detect cancer and nearly 150 conditions", "url": "https://www.scmp.com/tech/big-tech/article/3368055/alibaba-open-sources-medical-ai-model-can-detect-cancer-and-nearly-150-conditions?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-18T14:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A academia de pesquisa Damo Academy, filial da Alibaba Group Holding, lançou uma modelagem de inteligência artificial que pode identificar quase 150 condições abdominais, incluindo cânceres, através da leitura de exames de tomografia computadorizada (CT). Este modelo, chamado Damo Radar, foi projetado para analisar exames de tomografia computadorizada em contraste de 18 órgãos abdominais e identificar uma ampla gama de doenças e outras anomalias.", "titulo_pt": "Alibaba libera modelo de IA para detecção de câncer e quase 150 condições médicas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 169213, "titulo": "Adtech & Branding 2026 reúne mercado para discutir IA, liderança e novas fronteiras da publicidade", "url": "https://exame.com/marketing/adtech-branding-2026-reune-mercado-para-discutir-ia-lideranca-e-novas-fronteiras-da-publicidade/", "fonte_id": "exame", "data_pub": "2026-09-18T14:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O evento Adtech & Branding 2026, organizado pelo IAB Brasil, trouxe executivos para discutir temas como inteligência artificial, economia criadora, mídia de varejo, mensuração e as novas dinâmicas da publicidade digital.", "titulo_pt": "Adtech & Branding 2026 reúne executivos para discutir tecnologia e novas tendências da publicidade", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 169031, "titulo": "'Hackers do bem' invadem OpenAI usando programa da rival Anthropic, diz dona do ChatGPT", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/hackers-do-bem-invadem-openai-usando-programa-da-rival-anthropic-diz-dona-do-chatgpt.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T14:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores de segurança cibernética invadiram a OpenAI utilizando um software da Anthropic, sua principal concorrente, destacando vulnerabilidades na segurança da empresa detentora do ChatGPT. Este incidente ocorre em um momento em que as principais empresas de IA enfrentam crescente questionamento sobre a segurança de suas plataformas.", "titulo_pt": "Hackers do bem invadem OpenAI usando programa da rival Anthropic, diz dona do ChatGPT", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 169220, "titulo": "Quando será o próximo voo orbital da Starship? Space X define data da missão", "url": "https://exame.com/ciencia/quando-sera-o-proximo-voo-orbital-da-starship-space-x-define-data-da-missao/", "fonte_id": "exame", "data_pub": "2026-09-18T13:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A SpaceX definiu a data para o próximo teste da Starship, que visa a transição da nave para missões rocessam planilha de seguro Blue Cross fora do estado por reivindicações negadas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 169868, "titulo": "NASA Awards SpaceX Three Crew Flights to Space Station", "url": "https://www.nasa.gov/missions/station/commercial-crew/nasa-awards-spacex-three-crew-flights-to-space-station/", "fonte_id": "nasa_news", "data_pub": "2026-09-18T16:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA concedeu à SpaceX três missões adicionais para transporte de tripulação à Estação Espacial Internacional por meio de uma modificação de contrato.", "titulo_pt": "NASA concede três missões de tripulação à SpaceX", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 169004, "titulo": "O que a IA representa para o futuro da matemática", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/o-que-a-ia-representa-para-o-futuro-da-matematica.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-18T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OpenAI usou inteligência artificial para resolver um problema matemático centenário, o que provocou reflexões sobre o futuro papel dos matemáticos na pesquisa científica. Este avanço levantou questões sobre como a IA pode transformar a pesquisa matemática no futuro.", "titulo_pt": "IA desafia o mundo da matemática ao resolver problema centenário", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 169869, "titulo": "COSI Telescope Comes Together", "url": "https://www.nasa.gov/image-article/cosi-telescope-comes-together/", "fonte_id": "nasa_news", "data_pub": "2026-09-18T15:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Engenheiros e gerentes da UC Berkeley observam a elevação do detector do COSI (Compton Spectrometer and Imager) em uma imagem de 8 de julho de 2026. O detector é composto por quatro peças de material prateado que cobrem as flexcircuits, responsáveis por transmitir sinais dos detectores para a eletrônica de leitura.", "titulo_pt": "Telescópio COSI é montado", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 169391, "titulo": "Why a Sea-Lion Epidemic Is a Bad Sign for Humans", "url": "https://www.theatlantic.com/science/2026/09/sea-lion-avian-flu-synanthrope/688662/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-18T15:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Animais que conectam o mundo humano com a natureza selvagem podem ser particularmente perigosos para a saúde humana.", "titulo_pt": "Por que uma epidemia de lobos-marinhos é um sinal ruim para os humanos", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 169864, "titulo": "This ‘anti-vampiric’ grave used two strategies to stop the undead", "url": "https://www.sciencenews.org/article/ancient-anti-vampire-grave-undead", "fonte_id": "science_news", "data_pub": "2026-09-18T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um foices colocada no pescoço e uma fechadura no dedo do pé foram provavelmente usadas para impedir que uma adolescente polonesa do século XVII se ressuscitasse como um zumbi.", "titulo_pt": "Este ‘anti-vampirico’ sepultamento usou duas estratégias para impedir a ressurreição dos mortos", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 169867, "titulo": "Terran Orbital Promotes Margherita Cardi to Vice President of European Operations & Head of Strategic Programs", "url": "https://spacenews.com/terran-orbital-promotes-margherita-cardi-to-vice-president-of-european-operations-head-of-strategic-programs/", "fonte_id": "spacenews", "data_pub": "2026-09-18T14:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Terran Orbital, uma empresa da Lockheed Martin e líder global em soluções baseadas em satélites, nomeou Margherita Cardi como vice-presidente das operações europeias e chefe dos programas estratégicos.", "titulo_pt": "Terran Orbital promove Margherita Cardi a vice-presidente das operações europeias e chefe dos programas estratégicos", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 169845, "titulo": "NASA’s Nancy Grace Roman Telescope glimpses its first cosmic light", "url": "https://www.scientificamerican.com/article/nasas-nancy-grace-roman-telescope-glimpses-its-first-cosmic-light/", "fonte_id": "scientific_american", "data_pub": "2026-09-18T14:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A telescópio espacial Nancy Grace Roman está prestes a revelar milhares de novos exoplanetas e a examinar o universo em busca de sinais de matéria escura e energia escura.", "titulo_pt": "Telescópio espacial Nancy Grace Roman captura sua primeira luz cósmica", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 169846, "titulo": "What changing ‘Lake Ontario’ to ‘Lake America’ means for weather forecasts", "url": "https://www.scientificamerican.com/article/what-changing-lake-ontario-to-lake-america-means-for-weather-forecasts/", "fonte_id": "scientific_american", "data_pub": "2026-09-18T14:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Serviço Nacional de Meteorologia está avançando com a mudança do nome do Lago Ontario para Lago América. Essa alteração afetará as previsões meteorológicas.", "titulo_pt": "Qual o significado de mudar 'lago Ontario' para 'lago américa' nas previsões meteorológicas?", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 169808, "titulo": "STAT+: Roche expands its Boston footprint with new research center", "url": "https://www.statnews.com/2026/09/18/biotech-news-roche-expands-it-boston-footprint-with-research-center/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-18T13:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Roche expandiu sua presença em Boston com um novo centro de pesquisa. A gene terapia aprovada para o síndrome de Sanfilippo, boas e más notícias para a Xenon Pharma, e outras notícias da biotecnologia foram mencionadas.", "titulo_pt": "Roche amplia sua presença em Boston com novo centro de pesquisa", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 169223, "titulo": "Astrônomos descobrem planeta mais jovem já identificado, com menos de 1 mi de anos", "url": "https://exame.com/ciencia/astronomos-descobrem-planeta-mais-jovem-ja-identificado-com-menos-de-1-mi-de-anos/", "fonte_id": "exame", "data_pub": "2026-09-18T13:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Astrônomos identificaram um planeta com menos de 1 milhão de anos, o Elias 2-24 b, que tem massa semelhante à de Júpiter e ainda reúne poeira ao redor de sua estrela. Este descobrimento desafia as teorias sobre a evolução do Universo.", "titulo_pt": "Astrônomos descobrem planeta mais jovem já identificado, com menos de 1 mi de anos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 169005, "titulo": "Só há vantagens em conter degradação no Brasil", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/colunas/marceloleite/2026/09/so-ha-vantagens-em-conter-degradacao-no-brasil.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-18T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O degradação florestal na Amazônia está em alta, conforme decisões judiciais e políticas atuais. O foco deve ser na contenção dessa degradação, já que outras medidas não estão sendo eficazes.", "titulo_pt": "Apenas há vantagens em conter a degradação na amazônia", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 169865, "titulo": "What’s behind ‘one of paleontology’s most enduring enigmas’?", "url": "https://www.sciencenews.org/article/paleontology-enigma-honeycomb-fossil", "fonte_id": "science_news", "data_pub": "2026-09-18T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novas pesquisas sugerem que as formações hexagonais conhecidas como Paleodictyon, possivelmente retratadas por Leonardo da Vinci, não são criadas por organismos com corpos macios.", "titulo_pt": "O que está por trás de uma das maiores enigmas da paleontologia?", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 169229, "titulo": "Dona do Claude monta laboratório secreto para testar remédios", "url": "https://exame.com/inteligencia-artificial/dona-do-claude-monta-laboratorio-secreto-para-testar-remedios/", "fonte_id": "exame", "data_pub": "2026-09-18T12:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic, liderada por Dario Amodei, construiu um laboratório de testes biológicos na Califórnia para desenvolver remédios para doenças raras, que são geralmente consideradas pouco lucrativas pela indústria farmacêutica.", "titulo_pt": "Dono da anthropic monta laboratório secreto para testar remédios", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 169810, "titulo": "Who supports policies for ‘health equity’? It depends on how you’re asking", "url": "https://www.statnews.com/2026/09/18/health-news-who-supports-health-equity-policy-in-america/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-18T12:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kennedy discursa na Children's Health Defense, aborda ações contra instalações médicas em Sudão e notícias de saúde adicionais do Morning Rounds.", "titulo_pt": "Quem apoia políticas para 'equidade em saúde'? Isso depende de como você está perguntando.", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 168983, "titulo": "Alvo de ação na Justiça, Virginia Fonseca decide não fazer mais propaganda de bets", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/
