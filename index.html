<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 20/11/2026 19:20 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">
    <div class="modal-erro" id="senha-erro" style="display:none">Senha incorreta.</div>
    <div class="modal-btns">
      <button class="btn-sec2" onclick="fecharModal('modal-senha')">Cancelar</button>
      <button class="btn-pri" onclick="verificarSenha()">Entrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>
      <option value="erro_traducao">Erro de tradução</option>

      <option value="resumo_impreciso">Resumo impreciso</option>

    <label for="flag-nota">Nota (opcional)</label>

    <div class="modal-btns">
      <button class="btn-peri" id="btn-rm-flag" onclick="removerFlagAtual()" style="display:none;margin-right:auto">Remover</button>
      <button class="btn-sec2" onclick="fecharModal('modal-flag')">Cancelar</button>
      <button class="btn-pri" onclick="salvarFlagAtual()">Marcar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "20/11/2026 19:20", "stats": {"noticias_novas": 557, "resumos_gerados": 241}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Brasil enfrentou diversos desafios recentemente, incluindo a internação do ex-presidente Jair Bolsonaro, que foi levado ao hospital com fortes dores abdominais. Um temporal que atingiu o Rio Grande do Sul causou danos significativos, com três mortes e 60 feridos, afetando 28 municípios. O país também enfrentou desafios econômicos, como a queda de 8,5% nas ações da Anthropic no segundo dia após um IPO recorde, e a revisão de bancos da Itaipu após a liquidação do Ueno Bank. Além disso, a comunidade negra celebrou a vitória de Lula no Dia da Consciência Negra em Petrolina, com uma festa de rua que arrecadou alimentos para cozinhas solidárias.", "mundo": "A Dinamarca decidiu expulsar um diplomata russo após acusações de que a inteligência russa esteja por trás de um plano para assassinar um rapper americano-ucraniano antes de um show em Copenhague, conforme anunciado pelo ministro das Relações Exteriores da Dinamarca. O Reino Unido e a União Europeia estão trabalhando para definir o futuro das relações após o Brexit, com os acordos recentes sendo analisados pelos editores políticos e europeus da BBC. O presidente dos Estados Unidos, Donald Trump, continua a tomar medidas para proteger a tecnologia dos EUA, ameaçando banir empresas americanas de construir centros de dados de inteligência artificial no exterior e considerando novos ataques contra o Irã. Além disso, o governo Trump está expandindo as operações militares na América Latina, incluindo ataques a grupos guerrilheiros em Venezuela e bombardeios no mar, refletindo as ambições hegemônicas do presidente.\n\nA tensão geopolítica continua a crescer. A Polônia acusa a Rússia de violar seu espaço aéreo durante exercícios militares europeus, o que levou à mobilização de aviões de combate pela OTAN. A Rússia, por sua vez, criticou o movimento, comparando-o a uma nova barreira, similar à antiga Cortina de Ferro. A Arábia Saudita liderou ataques contra os houthis no Iêmen, aumentando a tensão no Mar Vermelho, enquanto o Irã reagiu com ataques de drones que mataram sete palestinos no centro de Gaza. Em outro frente, a Ucrânia atacou a Ponte de Kerch, utilizando armas e tecnologia de comunicação próprias, o que elevou as tensões com a Rússia. O encontro trilateral em Shenzhen fortaleceu o presidente russo, Putin, enquanto os Estados Unidos, Rússia e China concordaram que um conflito nuclear nunca deve ocorrer, embora a China tenha concordado em realizar um encontro para discutir a questão nuclear. Manifestações ocorrem em vários países da Europa por causa de salários, serviços públicos e altos custos de vida, inspiradas nas manifestações na França, e não mostram sinais de diminuir.", "economia": "O orçamento adicional foi aprovado sem cortes, conforme informado pelo Taipei Times. No entanto, o TAIEX, índice da bolsa de valores de Taiwan, teve uma queda significativa de quase 18% em sua pior semana desde 1991, refletindo a volatilidade do mercado. As exportações atingiram um recorde, sinalizando uma demanda robusta no mercado internacional. Por outro lado, uma ação judicial acusa a Alibaba de fraudar acionistas. Em outros desenvolvimentos, o petróleo fechou em alta em uma sessão volátil, enquanto o Bitcoin continuou a desvalorizar. As autoridades do Reino Unido e da União Europeia concordaram em interligar seus mercados de carbono a partir de 2028, com o objetivo de aumentar a liquidez. Na Europa, a autoridade reguladora está investigando as práticas contábeis da Nvidia, em meio a uma crise envolvendo o ex-CEO da empresa. No Brasil, o dólar oficial está cotado a R$1610 na venda pelo Banco Nación, enquanto o dólar paralelo (blue) está valendo R$1650 na venda. Além disso, a Lagarde, presidente do Banco Central Europeu, destacou que as ameaças cibernéticas, ampliadas pela inteligência artificial, são sua principal preocupação imediata para o setor financeiro.", "tecnologia": "A aprovação da venda de produtos Nvidia para a China, após a aprovação do Departamento de Comércio dos Estados Unidos, destaca-se como um dos principais eventos na área tecnológica. A Meta está reconsiderando seus objetivos de sustentabilidade para 2030 devido a emissões recordes de seus centros de dados de inteligência artificial, refletindo a crescente preocupação com a sustentabilidade no setor tecnológico. No cenário de inteligência artificial, a Nvidia enfrenta suspeitas de espionagem relacionadas à executiva Alice Huang, que mantém conexões com a indústria militar chinesa através de parentes e associados. Além disso, a empresa está sob investigação por acusações de que seus ex-CEO e outros executivos teriam mentido sobre relações pessoais, incluindo com supostas agências de inteligência estrangeiras. Estes incidentes levantam questões sobre a transparência e integridade operacional das grandes empresas de tecnologia.", "ciencia": "Um matemático da empresa Anthropic afirmou ter usado o chatbot Claude para tentar provar a Hipótese de Riemann, um dos maiores problemas abertos da matemática, após 167 anos. A afirmação foi feita na sexta-feira (20) e a hipótese foi abordada com a ajuda do chatbot Claude, desenvolvido pela empresa. No entanto, a afirmação ainda não foi verificada por terceiros e a prova não foi revisada por especialistas externos. Em outra notícia, os cientistas da Texas A&M AgriLife Research desenvolveram uma planta de cânhamo que não produz cannabidiol (CBD) ou tetrahidrocannabinol (THC) em quantidades detectáveis, potencialmente reduzindo o risco de destruição da colheita. Além disso, os restos fósseis de recifes de corais antigos no Caribe podem auxiliar na identificação de áreas onde os corais podem sobreviver ao aquecimento futuro, enquanto o aquecimento global intensifica o El Niño, levando a preocupações sobre inundações na Califórnia. Por fim, a pesquisa sugere que recursos gamificados em aplicativos de pagamento móvel podem aumentar a adoção entre os consumidores de economias emergentes, enquanto a NASA selecionou 302 projetos inovadores de pequenas empresas para atender às necessidades tecnológicas mais críticas da agência em explorações lunares e marcianas, estimulando a economia espacial americana.", "cultura": "Taiwan será o anfitrião do Simpósio Internacional das Orquídeas em 2030, com o objetivo de promover a pesquisa e o compartilhamento de conhecimentos sobre orquídeas de todo o mundo. Um destaque adicional é a restauração das cores de um trabalho de El Greco, um dos maiores artistas de sua época, após mais de 400 anos. Essa restauração foi realizada com o apoio da Callia Foundation, fundada por Carmen Reviriego. O Museu de Paisley, na Escócia, está programado para reabrir ao público no início de 2027, após uma reforma de 150 anos e um investimento de 68,7 milhões de libras. A reabertura visa apresentar uma das maiores coleções municipais de arte na Escócia, após enfrentar atrasos devido à pandemia de Covid, problemas de construção e inflação.", "sociedade": "Milhares de colombianos protestaram contra as medidas econômicas e agrárias implementadas pelo presidente Abelardo de la Espriella, que completou três meses no cargo. As medidas incluem aumento de impostos sobre salários e retrocessos na reforma agrária, gerando conflitos com centrais sindicais, movimentos populares e organizações de oposição. No Brasil, o Dia da Consciência Negra foi lembrado com discussões sobre o racismo persistente e a baixa representação de negros em posições de liderança, enquanto o governo publicou um decreto para a jornada de trabalho 5x2 no agronegócio, sem regras específicas. Em Nova York, o prefeito Zohran Mamdani apresentou um plano para fechar a prisão controversa de Rikers Island até 2032, substituindo-a por quatro novas prisões menores e mais modernas. Além disso, jovens de mais de 25 países europeus organizaram protestos contra o aumento dos custos de vida, a crise habitacional e a precarização do ensino, refletindo uma onda de manifestações continentais contra a situação socioeconômica atual.", "meio_ambiente": "A 31ª Conferência das Nações Unidas sobre Mudanças Climáticas (COP31), realizada em Antalya, Turquia, enfrentou dificuldades para chegar a um acordo. O vice-ministro ucraniano Oleksandr Krasnolutskyi criticou as negociações, exigindo que a Rússia pague por danos ambientais causados pela guerra. Apesar do clima seguir como prioridade para a Ucrânia, a falta de um acordo final expôs os desafios de repensar a própria COP. Em outro desenvolvimento, a Venezuela apresentou um modelo próprio de participação comunitária na proteção ambiental e combate às mudanças climáticas, enfatizando a importância de políticas locais e projetos de conservação do território.", "direitos_humanos": "A Corte Internacional de Justiça declarou que Mianmar cometeu genocídio contra o povo rohingya em 2016 e 2017, citando publicações militares no Facebook como parte do esforço de disseminar discurso de ódio. Em seguida, o Tribunal Penal Internacional decidiu que Mianmar cometeu genocídio contra a minoria rohingya, sendo a primeira decisão do órgão judicial mais importante da ONU que atribui responsabilidade por genocídio a um país. No Brasil, uma ação popular está sendo julgada para mudar o nome do Hospital Nina Rodrigues, em São Luís, como forma de reparação histórica, devido ao seu papel no racismo científico. Além disso, a execução nos Estados Unidos durou uma hora e o condenado relatou ter sentido dor durante o processo, levando a novos pedidos pela suspensão das execuções por injeção letal no país. Na Ucrânia, as mortes de crianças atingiram o nível mais alto em quase quatro anos, de acordo com o UNICEF, devido a ataques verificados a infraestrutura energética desde o início da guerra de escala completa."}, "resumo_do_dia": {"politica_nacional": [{"id": 277910, "titulo": "GTA 6 movimenta US$ 3,79 bilhões em vendas no 1º dia", "url": "https://www.poder360.com.br/poder-tech/gta-6-movimenta-us-379-bilhoes-em-vendas-no-1o-dia/", "fonte_id": "poder360", "data_pub": "2026-11-20T21:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O jogo GTA 6 gerou vendas de US$ 3,79 bilhões no primeiro dia após o lançamento. A Rockstar registrou o maior lançamento do entretenimento e o jogo alcançou 32,5 milhões de pré-vendas.", "titulo_pt": "GTA 6 movimenta US$ 3,79 bilhões em vendas no 1º dia", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 277911, "titulo": "Van Hattem diz não estar surpreso com voto de Flávio Dino", "url": "https://www.poder360.com.br/poder-congresso/van-hattem-diz-nao-estar-surpreso-com-voto-de-flavio-dino/", "fonte_id": "poder360", "data_pub": "2026-11-20T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado Van Hattem não se surpreendeu com o voto de Flávio Dino em torná-lo réu, após o ministro fazer declarações contra um delegado da Polícia Federal.", "titulo_pt": "Van Hattem não se surpreende com voto de Flávio Dino", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 277866, "titulo": "Dino vota para tornar Van Hattem réu por calúnia, mas julgamento é suspenso após pedido de Zanin", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/dino-vota-para-tornar-van-hattem-reu-por-calunia-mas-julgamento-e-suspenso-apos-pedido-de-zanin.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-20T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Flávio Dino, do STF, votou para tornar Marcel Van Hattem réu por calúnia e injúria contra um delegado da PF. No entanto, o julgamento foi suspenso após o pedido de Zanin.", "titulo_pt": "Dino vota para tornar Van Hattem réu por calúnia, mas julgamento é suspenso", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 277912, "titulo": "Ações da Anthropic caem 8,5% no 2º dia depois de IPO recorde", "url": "https://www.poder360.com.br/poder-economia/acoes-da-anthropic-caem-85-no-2o-dia-depois-de-ipo-recorde/", "fonte_id": "poder360", "data_pub": "2026-11-20T21:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações da Anthropic caíram 8,5% no segundo dia após um IPO recorde que movimentou US$ 93,5 bilhões. Investidores expressam preocupações com uma possível bolha no setor de inteligência artificial.", "titulo_pt": "Ações da Anthropic caem 8,5% no 2º dia após IPO recorde", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 277913, "titulo": "Michelle diz que voltará ao Brasil após Bolsonaro ser hospitalizado", "url": "https://www.poder360.com.br/poder-brasil/michelle-diz-que-voltara-ao-brasil-apos-bolsonaro-ser-hospitalizado/", "fonte_id": "poder360", "data_pub": "2026-11-20T21:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Michelle Bolsonaro, ex-presidente da República, sentiu dores abdominais e foi levada para exames em Brasília. Ela cumpre prisão domiciliar desde março.", "titulo_pt": "Michelle anuncia retorno ao Brasil após Bolsonaro ser hospitalizado", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 277937, "titulo": "Exame de Bolsonaro mostra obstrução parcial do intestino, diz médico", "url": "https://www.metropoles.com/brasil/exame-de-bolsonaro-mostra-obstrucao-parcial-do-intestino-diz-medico", "fonte_id": "metropoles", "data_pub": "2026-11-20T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Jair Bolsonaro foi diagnosticado com obstrução parcial do intestino e está internado no Distrito Federal. Caiado informou que Bolsonaro permanecerá hospitalizado nos próximos dias.", "titulo_pt": "Exame de Bolsonaro revela obstrução parcial do intestino, informa caiado", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 277962, "titulo": "Bolsonaro está medicado, em observação e sem previsão de alta, diz médico", "url": "https://www.cnnbrasil.com.br/politica/bolsonaro-esta-medicado-em-observacao-e-sem-previsao-de-alta-diz-medico/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T21:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Jair Bolsonaro está sendo medicado, em observação e sem previsão de alta hospitalar, conforme informou o médico responsável. A informação foi dada sem detalhes adicionais sobre o estado de saúde do presidente.", "titulo_pt": "Bolsonaro medicado, em observação e sem previsão de alta, diz médico", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 277987, "titulo": "Petrolina festeja vitória de Lula junto com o dia da Consciência Negra, na noite desta sexta-feira (20)", "url": "https://www.brasildefato.com.br/2026/11/20/petrolina-festeja-vitoria-de-lula-junto-com-o-dia-da-consciencia-negra-na-noite-desta-sexta-feira-20/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-20T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em Petrolina, uma festa de rua celebrou a vitória de Lula e o Dia da Consciência Negra, com diversos tipos de música e a arrecadação de alimentos para cozinhas solidárias.", "titulo_pt": "Petrolina comemora vitória de Lula e dia da Consciência Negra em festa de rua", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 277899, "titulo": "Lula mobiliza equipes federais para atender vítimas de temporal no RS", "url": "https://www.cartacapital.com.br/sociedade/lula-mobiliza-equipes-federais-para-atender-vitimas-de-temporal-no-rs/", "fonte_id": "cartacapital", "data_pub": "2026-11-20T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O temporal que atingiu o Rio Grande do Sul causou três mortes e feriu 60 pessoas em Tupanciretã. A tempestade danificou cerca de 8 mil residências e afetou 28 municípios do estado.", "titulo_pt": "Lula mobiliza equipes federais para atender vítimas de temporal no RS", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 277882, "titulo": "Bolsonaro é internado com quadro de dor e distensão abdominal", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/bolsonaro-e-internado-com-quadro-de-dor-e-distens%C3%A3o-abdominal", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-20T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Jair Bolsonaro foi internado no Hospital DF Star, em Brasília, devido a fortes dores abdominais. Ele está em prisão domiciliar e foi atendido por seu médico particular, que recomendou o hospitalização para realização de exames.", "titulo_pt": "Bolsonaro internado com dores abdominais", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 277915, "titulo": "Brasil cobra revisão de bancos da Itaipu após crise no Paraguai", "url": "https://www.poder360.com.br/poder-infra/brasil-cobra-revisao-de-bancos-da-itaipu-apos-crise-no-paraguai/", "fonte_id": "poder360", "data_pub": "2026-11-20T21:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil solicitou uma revisão dos bancos da Itaipu após a liquidação do Ueno Bank, que mantinha aproximadamente R$ 1 bilhão da usina. Os países também estão negociando a tarifa de energia.", "titulo_pt": "Brasil pede revisão de bancos da Itaipu após crise no Paraguai", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 278016, "titulo": "Jair Bolsonaro passa mal e é levado para hospital em Brasília", "url": "https://www.jota.info/justica/jair-bolsonaro-passa-mal-e-e-levado-para-hospital-em-brasilia", "fonte_id": "jota", "data_pub": "2026-11-20T21:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Jair Bolsonaro apresentou sintomas de obstrução intestinal e foi levado para o hospital em Brasília. Bolsonaro, que já ocupou o cargo de presidente, está atualmente recebendo atendimento médico.", "titulo_pt": "Jair Bolsonaro passa mal e é levado para hospital em Brasília", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 277942, "titulo": "Ministro do TSE vota para barrar eleição de Ney Santos por ligação com PCC", "url": "https://www.metropoles.com/sao-paulo/ministro-do-tse-vota-para-barrar-eleicao-de-ney-santos-por-ligacao-com-pcc", "fonte_id": "metropoles", "data_pub": "2026-11-20T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Tribunal Superior Eleitoral (TSE) votou para anular a candidatura do deputado eleito Ney Santos devido a evidências robustas de sua ligação com o PCC.", "titulo_pt": "Ministro do TSE vota para anular candidatura de Ney Santos por ligação com o PCC", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 277916, "titulo": "Total de pacientes de cannabis medicinal passa de 1 milhão no Brasil", "url": "https://www.poder360.com.br/poder-cannabis/total-de-pacientes-de-cannabis-medicinal-passa-de-1-milhao-no-brasil/", "fonte_id": "poder360", "data_pub": "2026-11-20T21:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O total de pacientes que utilizam cannabis medicinal no Brasil ultrapassou um milhão, de acordo com o 5º anuário da Kaya Mind. A importação é o principal meio de acesso a esse medicamento.", "titulo_pt": "Total de pacientes de cannabis medicinal atinge 1 milhão no Brasil", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 277943, "titulo": "Médicos avaliam submeter Bolsonaro a uma nova cirurgia", "url": "https://www.metropoles.com/colunas/igor-gadelha/medicos-avaliam-nova-cirurgia-em-bolsonaro", "fonte_id": "metropoles", "data_pub": "2026-11-20T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ex-presidente Jair Bolsonaro foi internado no hospital DF Star, em Brasília, após sentir dores abdominais. Médicos avaliam a possibilidade de submeter Bolsonaro a uma nova cirurgia.", "titulo_pt": "Médicos avaliam cirurgia para Bolsonaro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 277988, "titulo": "‘Cinema sempre fechou as portas ao povo e nós estamos escancarando’ diz diretor de Vicentina Pede Desculpas, Gabriel Martins", "url": "https://www.brasildefato.com.br/podcast/bem-viver/2026/11/20/cinema-sempre-fechou-as-portas-ao-povo-e-nos-estamos-escancarando-diz-diretor-de-vicentina-pede-desculpas-gabriel-martins/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-20T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O filme 'Vicentina Pede Desculpas', dirigido por Gabriel Martins, estreou nesta sexta-feira. A história gira em torno de uma mãe que perde seu filho, motorista de ônibus, em um acidente trágico.", "titulo_pt": "Cinema sempre fechou as portas ao povo e nós estamos escancarando", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 277662, "titulo": "Moscow hits Kyiv after Putin’s threat of ‘painful’ response", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/21/2003868121", "fonte_id": "taipei_times", "data_pub": "2026-11-21T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Moscou reagiu a Kyiv após a ameaça de Putin de uma resposta 'dolorosa'.", "titulo_pt": "Moscou ataca Kyiv após ameaça de resposta lage to relocate", "url": "https://www.npr.org/2026/11/20/nx-s1-6046485/rising-seas-have-forced-this-quinault-village-to-relocate", "fonte_id": "npr_news", "data_pub": "2026-11-20T21:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nação Quinault indígena moveu sua maior vila para longe das águas do mar que estão subindo e dos tsunamis.", "titulo_pt": "Vila indígena tem que se mudar devido a marés mais altas e tsunamis", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 278216, "titulo": "Trump's impact on an Ohio steel plant", "url": "https://www.npr.org/2026/11/20/nx-s1-5860971/trumps-impact-on-ohio-steel-plant", "fonte_id": "npr_news", "data_pub": "2026-11-20T21:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grande complexo siderúrgico em Middletown, Ohio, planejava mudar para não usar carvão refinado, conhecido como coca, o que reduziria a poluição atmosférica perigosa e as emissões de gases de efeito estufa. No entanto, esse plano foi alterado sob a presidência de Trump.", "titulo_pt": "O impacto de trump na fábrica de aço de Ohio", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 278269, "titulo": "Iraq PM targets militia stronghold in bid to assert state control", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/20/aje-onl-nf_iraq-pm-targets-militia-stronghold-jurf-al-sakhar-201126?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-20T21:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro do Iraque, Ali al-Zaidi, anunciou que uma operação em Jurf al-Sakhar marcou o início de uma campanha nacional para reafirmar o controle do estado.", "titulo_pt": "PM do iraque almeja controle estatal em forte de milícias", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 278083, "titulo": "Trump amenaza con sancionar a las empresas estadounidenses que construyan centros de datos en otros países", "url": "https://elpais.com/us/2026-11-20/trump-amenaza-con-sancionar-a-las-empresas-estadounidenses-que-construyan-centros-de-datos-en-otros-paises.html", "fonte_id": "elpais_america", "data_pub": "2026-11-20T21:19:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente Trump ameaçou sancionar empresas americanas que construam centros de dados em outros países. Ele incentivou as comunidades a aceitarem essas instalações, apesar do crescente rejeição a elas.", "titulo_pt": "Trump ameaça sancionar empresas americanas que construam centros de dados em outros países", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 278256, "titulo": "'Licence to kill': French parliament adopts police shootings law slammed by activists", "url": "https://www.france24.com/en/france/20261120-licence-to-kill-french-parliament-adopts-police-shootings-law-slammed-activists", "fonte_id": "france24", "data_pub": "2026-11-20T21:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Senado francês aprovou a legislação controversa que concede aos policiais uma presunção de legítima defesa ao usar armas de fogo, atendendo a um pedido do extremismo direito. Aprovada nesta aprovação final, a lei foi questionada por parlamentares da esquerda, que pretendem contestá-la perante o Conselho Constitucional francês.", "titulo_pt": "Licença para matar: senado francês aprova lei sobre uso de armas policiais, enfrentando protestos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 278298, "titulo": "Wall Street chiude in forte calo. Dj -2,03%, Nasdaq -5,37%", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/20/wall-street-chiude-in-forte-calo.-dj-203-nasdaq-537_2603c36d-1094-48af-b17a-590d5705aa0b.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-20T21:16:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A bolsa de valores de Wall Street fechou em forte queda. O Dow Jones caiu 2,03% e o Nasdaq perdeu 5,37%. O S&P 500 registrou uma
