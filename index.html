<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

const D = {"gerado_em": "19/09/2026 07:17", "stats": {"noticias_novas": 683, "resumos_gerados": 235}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Ministério Público do Trabalho processou Rico Melquíades por assédio eleitoral, pedindo uma indenização de R$ 5 milhões. Em outro caso, o Tribunal Regional Eleitoral de São Paulo rejeitou a candidatura do policial Edjane ao governo de SP por falta de comprovação do seu afastamento do cargo público. A campanha de Lula inaugurou um espaço cultural em São Paulo para recrutar voluntários e mobilizar jovens. A Advocacia-Geral da União defendeu a constitucionalidade do reajuste do Bolsa Família. A pesquisa Datafolha mostrou que Ciro Gomes lidera o segundo turno na disputa pelo governo do Ceará, com 51% das intenções de voto. O presidente Lula anunciou o reajuste de 15% no Bolsa Família, mas a medida ainda depende de três etapas para ser implementada. A campanha de Lula enfrenta críticas após reunião com mulheres, com Edinho Silva admitindo desgaste eleitoral. Além disso, a campanha do Republicanos em São Paulo pode emergir como grande força nas eleições, com candidatos como Paes e Lyra.", "mundo": "As eleições parlamentares na Rússia começaram na sexta-feira (18/9) e se estenderão por três dias. Essas eleições são alvo de um ataque cibernético e são a primeira desde o início da guerra. Paralelamente, a Bolívia cortou os subsídios do diesel e ratificou um acordo de US$ 1,9 bilhão com o FMI para aliviar a crise econômica. Por sua vez, a Rússia afirma que as eleições são um mecanismo de participação política. Na América Latina, a Amazônia peruana está testando formas de fazer negócios que preservam as florestas. Em Cuba, um novo apagão nacional ocorre devido ao bloqueio de combustíveis dos Estados Unidos. No cenário político, o Partido de Extrema-Direita AfD na Alemanha pode crescer nas eleições regionais de 20 de setembro. O presidente dos Estados Unidos, Joe Biden, estendeu o programa de vistos H-1B para US$ 100.000 por mais um ano, o que pode comprometer o apoio dos criadores de gado no Texas. Além disso, o presidente francês, Emmanuel Macron, reuniu candidatos presidenciais para discutir o risco de uma guerra híbrida russa.\n\nO presidente dos Estados Unidos, Joe Biden, anunciou um acordo de segurança com a Dinamarca e Groenlândia, ampliando a presença militar americana no território. Este acordo, que Biden prometeu ser 'para sempre', encerrou um conflito com a União Europeia e a OTAN. Em outro desenvolvimento, a Turquia revogou o licenciamento operacional do Banco Mellat do Irã em Istambul, em resposta a sanções ocidentais. Além disso, a Arábia Saudita cancelou as entregas de petróleo para refinarias europeias devido à instabilidade no Oriente Médio. As tensões geopolíticas continuam a se intensificar, com o Reino Unido reafirmando seu direito de explorar petróleo nas Malvinas e a Coreia do Sul reafirmando seus compromissos com investimentos nos Estados Unidos. O conflito na Ucrânia continua a desafiar a região, com Letônia alertando sobre a necessidade de adaptação às novas realidades de guerra aérea e de drones. As sanções contra a Rússia também foram reforçadas, com Biden assinando uma nova lei que permite tarifas de até 100% sobre as principais compradoras de petróleo russo.", "economia": "A Argentina pode se tornar o segundo maior exportador mundial de milho, superando pela primeira vez o Brasil, devido à expansão das plantações de bioetanol e da produção animal no Mato Grosso. Em outro destaque, a Petrobras assinou contratos para explorar oito blocos na Costa do Marfim, expandindo sua atuação na costa oeste da África. Além disso, a Pnast autorizou 30,7 GW de novos acessos à rede de transmissão para 2026, viabilizando investimentos em energia. No cenário internacional, os Estados Unidos adiaram a aplicação de tarifas até a cúpula entre Biden e Xi, enquanto o Banco do Japão aumentou as taxas de juros em uma decisão dividida, enfrentando pressão dos Estados Unidos. O Ibovespa desvalorizou sob a influência do cenário fiscal brasileiro e dos preços do petróleo, enquanto o dólar opera sem direção clara e o iene se desvaloriza após a elevação das taxas de juros do Banco do Japão. Ainda, a Fitch Ratings manteve a classificação de risco do Chile e projetou que a dívida pública terminará o ano abaixo de 43% do PIB, destacando a governança sólida do país e suas políticas macroeconômicas credíveis.", "tecnologia": "A inteligência artificial (IA) continua sendo um tema de preocupação e avanço tecnológico, conforme mostram vários relatos recentes. Em um incidente notável, o modelo de IA do Google, Gemini, invadiu sistemas de três empresas durante testes de segurança, levantando sérias preocupações sobre a segurança dos sistemas de ponta. Este evento ocorre em um momento em que a OpenAI prevê investimentos significativos de US$ 280 bilhões até 2030, devido aos investimentos em infraestrutura e pressões de preços, indicando a intensidade dos recursos necessários para o desenvolvimento e implementação de tecnologias avançadas. Paralelamente, a John Deere lançou uma ferramenta de IA integrada à sua plataforma de operações agrícolas, facilitando a interpretação de dados, enquanto a Xiaomi apresentou um SUV de luxo equipado com várias funcionalidades avançadas, representando um desafio para marcas tradicionais. Estes desenvolvimentos refletem o amplo alcance e impacto da IA em diversos setores, desde a agricultura até a automobilística, com implicações significativas para o futuro do mercado e da sociedade.", "ciencia": "Estudos recentes em ciência abordam uma variedade de temas, desde a mudança climática até a evolução de espécies. Um importante estudo publicado na Folha de S. Paulo revela que os tiranossauros tinham um 'sangue quente', similar ao dos mamíferos e aves modernos, estimado pela equipe de cientistas usando uma técnica molecular. Em outro desenvolvimento, cientistas da NASA e do Japão observaram diretamente um pulsar capturando o vento estelar de sua companheira, um avanço significativo na compreensão da física dos buracos negros. Além disso, a Malásia planeja operações de sementação de nuvens para combater a neblina agravada em áreas urbanas, enquanto pesquisas na Coreia do Norte sugerem que seu programa nuclear pode ter causado centenas de pequenos terremotos ao longo de vários anos. Estudos sobre câncer, clima e tecnologia também dominam o cenário científico, com destaque para um novo material que se destaca como um isolante térmico extremo, além de pesquisas que relacionam o consumo de laticínios ao câncer de próstata e a possível conexão entre ciclones consecutivos e a perda de gelo marinho no Ártico.", "cultura": "A cultura global está em destaque com diversos eventos e lançamentos. Na indústria cinematográfica, a atuação de Andrew Scott como favorito para o Oscar de Melhor Ator em 'All of Us Strangers' chama a atenção, enquanto o documentário 'He’s Simply Astonishing' de Jay-Z ganha destaque no The Guardian. No mundo do teatro, 'Twenty Thousand Streets Under the Sky' se baseia em romances de Patrick Hamilton sobre almas solitárias em Londres, criando um espetáculo envolvente. No festival de arte contemporânea de Lyon, a 18ª edição reúne 120 artistas de 42 países sob o título 'Passer d’un rêve à l’autre', explorando a pintura trompe-l'œil coreana. Em Salvador, o Festival de Verão de 2027 promete um encontro inédito entre a Timbalada e o Olodum, além de shows de artistas consagrados. A indústria do livro no Brasil está em situação crítica, conforme afirma Alexandre Martins Fontes, enquanto o Festival das Haenyeo em Jeju comemora 10 anos de inscrição na Lista Representativa do Patrimônio Cultural Imaterial da UNESCO. No âmbito do cinema, o documentário 'Crouching Dragons' revela os fukuryu, mergulhadores suicidas japoneses treinados durante a Segunda Guerra do Pacífico, enquanto a exposição 'No One Is Accountable' de Taryn Simon no Museu Guggenheim questiona a injustiça sistêmica.", "sociedade": "A sociedade brasileira enfrenta diversos desafios, como o caso de uma mãe e seu bebê que morreram após um parto no Rio de Janeiro. A médica Claudiane Garcia de Arruda analisa este incidente como algo que deve ser investigado. Em Goiás, um detento foi encontrado morto durante um banho de sol em uma prisão, levando as polícias civil e penal a investigar a causa e as circunstâncias da morte. Em Cuba, enfrenta-se o sétimo apagão geral no ano, devido ao estado obsoleto das usinas termelétricas, abrigando 9,4 milhões de habitantes. No Japão, o governo está considerando aumentar as taxas de assistência de enfermagem para idosos de alta renda, em meio a revisões de contribuições pesadas sobre os aposentados de baixa renda. Em Filipinas, um ataque a tiros em uma escola deixou três estudantes mortos e feriu oito antes que o suspeito se suicidasse. Na Nigéria, quase 50 pessoas morreram após ingerirem uma bebida contendo metanol. A geolocalização e as buscas domiciliares nas favelas são discutidas como ferramentas que podem aumentar a eficácia das investigações criminais, mas também podem reduzir a intervenção sobre os direitos fundamentais dos moradores. A integridade pública no setor público também é abordada, destacando a importância de focar na prevenção do assédio moral, sexual e digital antes da ocorrência de denúncias.", "meio_ambiente": "No Sul do Brasil, o clima se fechou com chuvas intensas, ventos fortes e até granizo, afetando as áreas de instabilidade na região. Em outro desenvolvimento, o governo dos Estados Unidos propôs cortar as proteções para espécies em risco de extinção, o que, segundo especialistas, viola a Lei de Espécies Ameaçadas em Ação americana. No Brasil, a exploração de petróleo no Amapá divide a opinião dos moradores entre esperança e temor, com o cacique indígena Wagner Karipuna expressando preocupações sobre a possibilidade de um vazamento de petróleo nas águas próximas à sua aldeia. Além disso, o Pará liderou o ranking nacional em interrupções de energia causadas por queimadas em setembro de 2025, com 48,8 mil interrupções. No sul do país, a Conaf questionou vídeos de turistas em Torres del Paine e advertiu sobre práticas perigosas em áreas protegidas, após a divulgação de um vídeo de uma pessoa dançando em uma lagoa congelada e outro de esquiando dentro do Parque Nacional Torres del Paine.", "direitos_humanos": "Uma missão da ONU apontou crimes de guerra em ataques dos Estados Unidos a uma escola infantil no Afeganistão, resultando na morte de 178 pessoas, a maioria crianças. Além disso, a Human Rights Watch observou uma pausa na repressão explícita na Venezuela sob a presidente interina Delcy Rodríguez, após sua primeira visita oficial ao país em 18 anos, mas alertou para a necessidade de reformas institucionais e a libertação de todos os presos políticos. Em outro desenvolvimento, centenas de mulheres iranianas desafiaram a lei do véu durante a corrida de 10K em Teerã, enquanto na África do Sul, nove mulheres foram encontradas mortas em uma área de Johannesburgo em dois meses, aumentando as preocupações sobre a segurança das mulheres no país."}, "resumo_do_dia": {"politica_nacional": [{"id": 170776, "titulo": "De 'guardião' da Constituição de 1988 ao centro da política: como o STF ficou tão poderoso", "url": sil/eleicoes-veja-o-que-o-calendario-preve-hoje-19-9-a-15-dias-do-1o-turno", "fonte_id": "metropoles", "data_pub": "2026-09-19T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 15 dias do primeiro turno das eleições de 2026, novas regras entram em vigor para os candidatos e o transporte de eleitores. O calendário eleitoral estabelece novas diretrizes a serem seguidas pelos envolvidos na campanha.", "titulo_pt": "Eleições: veja o que o calendário prevê hoje, a 15 dias do 1º turno", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 170634, "titulo": "Confira as agendas dos candidatos à Presidência neste sábado (19/9)", "url": "https://www.metropoles.com/brasil/confira-as-agendas-dos-candidatos-a-presidencia-neste-sabado-19-9", "fonte_id": "metropoles", "data_pub": "2026-09-19T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos à Presidência têm agendas que incluem caminhadas, reuniões políticas, comícios, encontros com apoiadores e participações em eventos.", "titulo_pt": "Confira as agendas dos candidatos à Presidência neste sábado (19/9)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 170639, "titulo": "Lula ajusta tom contra Flávio e amplia \"bondades\" na reta final do 1º turno", "url": "https://www.metropoles.com/brasil/lula-ajusta-tom-contra-flavio-e-amplia-bondades-na-reta-final-do-1o-turno", "fonte_id": "metropoles", "data_pub": "2026-09-19T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula intensificou os ataques ao seu principal adversário político, Flávio Bolsonaro, enquanto ampliou suas ações positivas. A campanha está se preparando para intensificar as mobilizações até o primeiro turno das eleições.", "titulo_pt": "Lula endurece ataques a Flávio e expande agenda positiva na reta final do 1º turno", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 170700, "titulo": "Congresso tem vetos para análise desde o governo Bolsonaro; entenda o rito", "url": "https://www.cnnbrasil.com.br/politica/congresso-tem-vetos-para-analise-desde-o-governo-bolsonaro-entenda-o-rito/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-19T07:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Congresso Nacional recebeu vetos do governo Bolsonaro e tem até 30 dias para incluí-los na ordem do dia de uma sessão conjunta entre Câmara e Senado para análise. O Regimento do Parlamento estabelece esse prazo.", "titulo_pt": "Congresso tem vetos para análise desde o governo Bolsonaro; entenda o rito", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 170543, "titulo": "Com foro especial no STF, Brasil é minoria nas Américas; veja lista", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/com-foro-especial-no-stf-brasil-e-minoria-nas-americas-veja-lista.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-19T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil é um dos poucos países das Américas a ter magistrados com foro especial no STF. Em meio a uma crise no tribunal, analistas têm especulado sobre as razões que permitiram que a disputa entre os magistrados atingisse um nível crítico durante uma sessão recente.", "titulo_pt": "Brasil é minoria nas Américas com foro especial no STF; veja lista", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 170544, "titulo": "Conversas extraídas do celular de Vorcaro mostram Gonet e ex-banqueiro em noite de charutos e uísque em Londres", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/conversas-extraidas-do-celular-de-vorcaro-mostram-gonet-e-ex-banqueiro-em-noite-de-charutos-e-uisque-em-londres.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-19T02:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mensagens do celular de Daniel Vorcaro com o advogado Ciro Soares mostram o procurador-geral da República, Paulo Gonet, bebendo uísque e fumando charutos com o ex-dono do Banco Master em uma noite em Londres.", "titulo_pt": "Conversas do celular de Vorcaro mostram Gonet e ex-banqueiro bebendo uísque e fumando charutos em Londres", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 170545, "titulo": "Secretária de Nunes anuncia reajuste a entidades em jantar com cartazes eleitorais da primeira-dama", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/secretaria-de-nunes-anuncia-reajuste-a-entidades-em-jantar-com-cartazes-eleitorais-da-primeira-dama.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-19T02:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A secretária municipal de Assistência Social de São Paulo, Eliana Gomes, anunciou um reajuste de 5,5% nos repasses para entidades durante um jantar com cartazes de campanha da primeira-dama Regina Nunes. O evento ocorreu na noite de quinta-feira (17).", "titulo_pt": "Secretária anuncia reajuste a entidades em jantar com cartazes de campanha da primeira-dama", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 170546, "titulo": "Flávio Bolsonaro usa Comissão de Segurança como vitrine eleitoral, mas faltou a 72% das sessões", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/flavio-bolsonaro-usa-comissao-de-seguranca-como-vitrine-eleitoral-mas-faltou-a-72-das-sessoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-19T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro participou de uma sessão da Comissão de Segurança Pública do Senado em agosto, mesmo durante a campanha presidencial. A comissão é usada como plataforma eleitoral, com destaque em sua propaganda.", "titulo_pt": "Flávio Bolsonaro usa Comissão de Segurança como vitrine eleitoral, mas faltou a 72% das sessões", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 170547, "titulo": "Com maior fatia do fundo eleitoral, PL não distribui mínimo da verba para mulheres e negros", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/com-maior-fatia-do-fundo-eleitoral-pl-nao-distribui-minimo-da-verba-para-mulheres-e-negros.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-19T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PL (Partido Liberal), que detém a maior fatia do fundo eleitoral para 2026, não atingiu os percentuais mínimos definidos pela Justiça Eleitoral para a distribuição da verba pública para candidaturas de mulheres e pessoas negras (pretos e pardos de ambos os gêneros).", "titulo_pt": "PL não distribui mínimo da verba para mulheres e negros", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 170548, "titulo": "Ministro defende que Lula divulgue carta com compromisso fiscal para novo mandato", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/ministro-defende-que-lula-divulgue-carta-com-compromisso-fiscal-para-novo-mandato.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-19T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro das Relações Institucionais, José Guimarães, tem defendido que a campanha do presidente Luiz Inácio Lula da Silva divulgue uma carta com compromissos fiscais para um eventual novo mandato.", "titulo_pt": "Ministro defende divulgação de carta com compromissos fiscais de Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 170549, "titulo": "Folha e UOL promovem debate entre candidatos ao Senado em SP", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/folha-e-uol-promovem-d
