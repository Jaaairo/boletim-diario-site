logy) irão selecionar e orientar pós-doutorandos em um novo programa de bolsa conjunta. Sob o programa KAIST-Caltech Global Research Fellow, os professores das duas instituições identificarão tópicos de pesquisa conjuntos e selecionarão pós-doutorandos adequados para esses projetos.", "titulo_pt": "KAIST e Caltech selecionarão e orientarão pós-doutorandos em programa conjunto", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 139874, "titulo": "Scientists make potential breakthrough in search for dark matter", "url": "https://www.japantimes.co.jp/news/2026/09/02/world/scientists-breakthrough-search-dark-matter/", "fonte_id": "japan_times", "data_pub": "2026-09-02T04:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas em South Dakota observaram indícios de matéria escura durante uma experimento subterrâneo, mas não anunciaram a detecção definitiva desse componente cósmico difícil de ser encontrado.", "titulo_pt": "Cientistas fazem potencial avanço na busca por matéria escura", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 140011, "titulo": "Scientists discover the key ingredients that make birdsong pretty", "url": "https://phys.org/news/2026-08-scientists-key-ingredients-birdsong-pretty.html", "fonte_id": "phys_org", "data_pub": "2026-09-02T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os cientistas identificaram os componentes essenciais que tornam o canto dos pássaros agradável para os ouvidos. Essa pesquisa pode auxiliar na compreensão de como paisagens sonoras relaxam os humanos, permitindo aprimoramentos em espaços públicos como parques e consultórios, bem como promovendo a conservação de espécies com canções particularmente agradáveis.", "titulo_pt": "Cientistas descobrem os ingredientes que tornam o canto dos pássaros agradável", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 140046, "titulo": "Can we really reverse global warming after overshooting 1.5°C?", "url": "https://www.newscientist.com/article/2587239-can-we-really-reverse-global-warming-after-overshooting-1-5c/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-09-02T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma relatório da ONU afirma que é possível reduzir as temperaturas globais para 1,5°C acima dos níveis pré-industriais até o final do século, mas muitos pesquisadores consideram essa perspectiva altamente improvável.", "titulo_pt": "Podemos realmente reverter o aquecimento global após ultrapassar os 1,5°C?", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 140012, "titulo": "Community-led systems may curb illegal dumping in Indonesia's rural tourism areas", "url": "https://phys.org/news/2026-09-community-curb-illegal-dumping-indonesia.html", "fonte_id": "phys_org", "data_pub": "2026-09-02T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo sugere que sistemas de gestão de resíduos com liderança comunitária podem ser eficazes em reduzir o descarte ilegal em áreas turísticas rurais da Indonésia. O caso de Kampung Nipah, um vilarejo turístico costeiro no Norte da Sumatra, indica que comunidades rurais com serviços públicos limitados podem necessitar de sistemas de gestão de resíduos governados localmente.", "titulo_pt": "Sistemas comunitários podem reduzir o descarte ilegal em áreas turísticas rurais da indonésia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 139276, "titulo": "O sentido do número em bebês", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/colunas/marceloviana/2026/09/o-sentido-do-numero-em-bebes.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-02T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Experiências recentes indicam que o entendimento dos números pode ser uma habilidade inata em nossa espécie, com bebês capazes de extrair informações numéricas desde cedo.", "titulo_pt": "O sentido do número em bebês", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 140013, "titulo": "Children's picture books reflect changing attitudes to languages and can support revitalization", "url": "https://phys.org/news/2026-09-children-picture-attitudes-languages-revitalization.html", "fonte_id": "phys_org", "data_pub": "2026-09-02T02:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisas mostram que livros ilustrados para crianças auxiliam no aprendizado de línguas. Estes livros podem também contribuir para a revitalização de línguas em declínio.", "titulo_pt": "Livros ilustrados para crianças refletem atitudes mudando em relação às línguas e podem apoiar a revitalização", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 140014, "titulo": "Agentic AI accelerates search for crops that can harvest critical minerals", "url": "https://phys.org/news/2026-09-agentic-ai-crops-harvest-critical.html", "fonte_id": "phys_org", "data_pub": "2026-09-02T01:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial agente está acelerando a busca por culturas que podem extrair minerais críticos diretamente do solo, oferecendo uma alternativa potencial à dependência de fontes estrangeiras de minerais essenciais para tecnologias modernas. Esta abordagem, conhecida como fitominagem, envolve o uso de plantas geneticamente engenhadas e microrganismos simbióticos para absorver minerais críticos do solo de maneira eficiente.", "titulo_pt": "IA agente acelera busca por culturas que podem extrair minerais críticos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 140015, "titulo": "Many space missions are searching for life beyond Earth, but are we prepared for the fallout if they succeed?", "url": "https://phys.org/news/2026-09-space-missions-life-earth-fallout.html", "fonte_id": "phys_org", "data_pub": "2026-09-02T00:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitas missões espaciais estão buscando vida além da Terra, mas estamos preparados para as consequências se encontrarmos microorganismos extraterrestres? A possibilidade de descoberta de vida microbiana em outros planetas está aumentando com o lançamento de mais missões espaciais anualmente.", "titulo_pt": "Várias missões espaciais buscam vida além da terra, mas estamos preparados para o impacto se encontrarmos microorganismos extraterrestres?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 140016, "titulo": "Border toy screening finds 12% exceed toxic-metal limits", "url": "https://phys.org/news/2026-09-border-toy-screening-exceed-toxic.html", "fonte_id": "phys_org", "data_pub": "2026-09-02T00:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo conduzido por pesquisadores da Universidade do Texas em El Paso descobriu que 79% dos brinquedos para crianças comprados na região de El Paso-Ciudad Juárez contêm pelo menos um elemento tóxico. Os resultados, publicados no jornal Environmental Pollution, representam o primeiro exame binacional de metais tóxicos em brinquedos vendidos em ambos os lados da fronteira entre Estados Unidos e México.", "titulo_pt": "Avaliação de brinquedos na fronteira descobre que 12% ultrapassam limites de metais tóxicos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 139331, "titulo": "Caso Erasmo Carlos: o que está em jogo na disputa entre viúva e filhos", "url": "https://veja.abril.com.br/cultura/caso-erasmo-carlos-o-que-esta-em-jogo-na-disputa-entre-viuva-e-filhos/", "fonte_id": "veja", "data_pub": "2026-09-02T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A advogada Mayara Vasconcellos Lima declarou à coluna GENTE que o bloqueio de parte dos aluguéis é temporário. O caso envolve a disputa entre a viúva e os filhos de Erasmo Carlos.", "titulo_pt": "Caso Erasmo Carlos: o que está em jogo na disputa entre viúva e filhos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 140045, "titulo": "Two Artists' Odyssey Up the Erie Canal", "url": "https://hyperallergic.com/two-artists-odyssey-up-the-erie-canal/", "fonte_id": "hyperallergic", "data_pub": "2026-09-02T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Artistas Z Behl e Kim Moloney realizaram uma performance duracional de 350 milhas ao longo do Canal Erie, explorando as origens compartilhadas entre a maloteira liberiana e gullah. O trabalho incluiu uma biblioteca de zines escondida em um apartamento no Texas.", "titulo_pt": "Odisséia de dois artistas ao longo do Canal Erie", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 140041, "titulo": "Terramater tiles by Marazzi", "url": "https://www.dezeen.com/2026/09/02/terramater-tiles-marazzi-dezeen-showroom/", "fonte_id": "dezeen", "data_pub": "2026-09-02T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A coleção Terramater de cerâmicas, criada pela empresa italiana Marazzi, apresenta detalhes tridimensionais em cores de argila que emergem das gálgicas coloridas. Durante o processo de fabricação, as glazes especiais se misturam ao corpo vermelho do porcelanato, resultando em superfícies texturizadas ricas.", "titulo_pt": "Vitrines terramater pela Marazzi", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 140072, "titulo": "The Literary Film & TV You Need to Stream in September", "url": "https://lithub.com/the-literary-film-tv-you-need-to-stream-in-september-4/", "fonte_id": "lithub", "data_pub": "2026-09-02T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cada mês, os principais serviços de streaming adicionam uma grande quantidade de novos episódios de séries, filmes e documentários à sua biblioteca. O artigo sugere que os leitores podem escolher o que assistir entre essas novidades.", "titulo_pt": "Filmes e séries literárias para assistir em setembro", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 140073, "titulo": "What Ann Patchett’s Whistler Gets Right and Wrong About Horses", "url": "https://lithub.com/what-ann-patchetts-whistler-gets-right-and-wrong-about-horses/", "fonte_id": "lithub", "data_pub": "2026-09-02T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Livros populares frequentemente cometem erros ao contar histórias sobre cavalos. Pecados incluem coltinhos crescendo para se tornarem fêmeas, competidores regionais usando casacos vermelhos e cavalos a passo ganhando corridas de velocidade.", "titulo_pt": "O que Ann Patchett’s Whistler acerta e erra sobre cavalos", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 140074, "titulo": "Abdelrahman ElGendy on Writing From Inside a Prison Cell", "url": "https://lithub.com/abdelrahman-elgendy-on-writing-from-inside-a-prison-cell/", "fonte_id": "lithub", "data_pub": "2026-09-02T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Abdelrahman ElGendy passou sua terceira noite em detenção em Cairo, em uma cela de quatro por cinco metros com sessenta outros prisioneiros. Após três dias de fome, um de seus companheiros de cela começou a cantar pela primeira vez.", "titulo_pt": "Abdelrahman ElGendy sobre a escrita dentro de uma cela de prisão", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 140075, "titulo": "The Jerusalem of the East: When Billy Graham Visited Pyongyang", "url": "https://lithub.com/the-jerusalem-of-the-east-when-billy-graham-visited-pyongyang/", "fonte_id": "lithub", "data_pub": "2026-09-02T09:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em outubro de 1991, o evangelista americano Billy Graham recebeu uma inesperada convite para visitar Pyongyang. A carta, enviada pelos líderes da Igreja do Norte-Coreia, convidava-o a visitar uma de suas igrejas.", "titulo_pt": "A jerusalém do leste: quando Billy Graham visou Pyongyang", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 140076, "titulo": "The Book of Chuck", "url": "https://lithub.com/the-book-of-chuck/", "fonte_id": "lithub", "data_pub": "2026-09-02T09:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A personagem Before Evie se prepara para conversar com seu parceiro, mas Atlas a interrompe primeiro. A frase inacabada sugere que há uma transação comercial envolvendo um homem em Monroe.", "titulo_pt": "O livro do Chuck", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 140077, "titulo": "Visiting Helen Keller’s Birthplace While Deaf: What it Means to Navigate Accessibility", "url": "https://lithub.com/visiting-helen-kellers-birthplace-while-deaf-what-it-means-to-navigate-accessibility/", "fonte_id": "lithub", "data_pub": "2026-09-02T09:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma manhã quente de julho, o autor saiu do carro condicionado e foi abraçado pelo calor da estação no Alabama. O caminho de pedra em frente a ele passava por uma pequena cerca ornamental e cruzava um gramado seco.", "titulo_pt": "Visitar o lugar de nascimento de Helen Keller enquanto surdo: o que significa navegar pela acessibilidade", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 139377, "titulo": "De Conceição Evaristo a Lynn Painter: veja os destaques da Bienal do Livro", "url": "https://www.cnnbrasil.com.br/pop/de-conceicao-evaristo-a-lynn-painter-veja-os-destaques-da-bienal-do-livro/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-02T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Autores como Conceição Evaristo e Lynn Painter participarão do evento, subindo à Arena Cultural entre os dias 4 e 13 de setembro.", "titulo_pt": "De Conceição Evaristo a Lynn Painter: confira os destaques da Bienal do Livro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 139646, "titulo": "No eggs, no potatoes but ‘a lot of imagination’: how Spain cooked in war’s hunger years", "url": "https://www.theguardian.com/world/2026/sep/02/how-spain-cooked-war-hunger-years", "fonte_id": "guardian_world", "data_pub": "2026-09-02T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O livro 'Recetas de Guerra' (Receitas de Guerra) de Berta Álvarez Acal recria receitas de período pós-guerra espanhola, quando a população enfrentava escassez de alimentos. O livro oferece alternativas para preparar pratos como a tortilla de patatas, sem os ingredientes tradicionais de ovos e batatas.", "titulo_pt": "Sem ovos, sem batatas, mas 'muita imaginação': como a Espanha cozinhou nos anos de fome após a guerra", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 140058, "titulo": "The opposite of ‘damsels in distress’: how TV fell in love with female gangsters", "url": "https://www.theguardian.com/tv-and-radio/2026/sep/02/female-gangsters-crime-tv-the-gentlemen", "fonte_id": "guardian_culture", "data_pub": "2026-09-02T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Personagens femininas cruéis de The Gentlemen, Beef e Peaky Blinders estão expandindo o estereótipo da matriarca maligna. Estas séries apresentam novas dimensões para personagens de gangsterismo que são geralmente retratadas como dominadoras e malvadas.", "titulo_pt": "O oposto de ‘damsels in distress’: como a TV se apaixonou por gangsteras", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 140059, "titulo": "Star Wars Zero Company review – joyfully absurd heroics with a tight-knit team of misfits", "url": "https://www.theguardian.com/games/2026/sep/02/star-wars-zero-company-review-joyfully-absurd-heroics-with-a-tight-knit-team-of-misfits", "fonte_id": "guardian_culture", "data_pub": "2026-09-02T09:00:00Z", "idioma": "en", "provavel_duplicata_de": nu licata_de": null, "texto_pt": "Ter padrões de exigência irracionais pode danificar relações saudáveis, levando a constantes decepções. A psicologia analisa como comportamentos vícios podem prejudicar essas relações.", "titulo_pt": "Ter padrões de exigência irracionais destrói relações saudáveis; entenda", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 139966, "titulo": "S. Korea sees surge in suicide-encouraging content, most posts aren't deleted: report", "url": "https://www.koreaherald.com/article/10860673", "fonte_id": "korea_herald", "data_pub": "2026-09-02T08:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 600 mil relatos de conteúdo online que podem incentivar ou facilitar suicídios foram registrados na Coreia do Sul em 2025, mas 70% desses conteúdos permaneceram online ao final do ano. Os dados foram divulgados pelo Ministério da Saúde.", "titulo_pt": "Coreia do sul registra aumento de conteúdo que pode incentivar suicídio, maioria não é deletada", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 139968, "titulo": "An island county needed a doctor, so it tripled the pay", "url": "https://www.koreaherald.com/article/10860654", "fonte_id": "korea_herald", "data_pub": "2026-09-02T07:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Shinan-gun, uma ilha no sul da Coreia do Sul, contratou um médico sênior após três tentativas falhas de recrutamento ao oferecer um salário mensal pré-tributário de 33 milhões de wones (cerca de $24.100). O médico, de 61 anos, foi escolhido entre seis candidatos para trabalhar no centro de saúde público do condado.", "titulo_pt": "Um condado ilha precisava de um médico, então triplicou o salário", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 139903, "titulo": "9 children, 5 others injured after 2 buses collide at Hong Kong primary school", "url": "https://www.scmp.com/news/hong-kong/transport/article/3366084/least-14-injured-after-2-buses-collide-hong-kong-primary-school?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-02T07:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois ônibus escolares colidiram em uma escola primária feminina em Hong Kong, resultando em 14 pessoas feridas, incluindo nove crianças. Ocorreu por volta das 13h26 no Good Hope Primary School cum Kindergarten, localizada em Ngau Chi Wan.", "titulo_pt": "9 Crianças e 5 outras pessoas se feriram em colisão entre dois ônibus escolares em escola primária feminina de Hong Kong", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 139231, "titulo": "Desigualdade de renda entre servidores supera a observada no Brasil, diz estudo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/desigualdade-de-renda-entre-servidores-supera-a-observada-no-brasil-diz-estudo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-02T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A desigualdade de renda entre os servidores públicos brasileiros é maior do que a observada no conjunto do país, de acordo com um estudo do auditor Sergio Guedes-Reis, baseado em dados da Rais.", "titulo_pt": "Desigualdade de renda entre servidores supera a do Brasil, diz estudo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 139982, "titulo": "Principals, teachers oppose 3 p.m. dismissal for younger elementary students", "url": "https://www.koreaherald.com/article/10860425", "fonte_id": "korea_herald", "data_pub": "2026-09-02T05:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Associações de diretores e professores de escolas elementares se opuseram ao plano do Comitê Nacional de Educação de manter alunos do primeiro e segundo ano na escola até as 15h, argumentando que isso poderia perturbar os programas existentes e não ser no melhor interesse dos jovens alunos.", "titulo_pt": "Diretores e professores se opõem ao plano de manter alunos mais novos na escola até as 15h", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 139779, "titulo": "Mass burials of unidentified victims continue in Nepal as death toll exceeds 1,100 one week after flash floods", "url": "http://www.euronews.com/2026/09/02/mass-burials-of-unidentified-victims-continue-in-nepal-as-death-toll-exceeds-1000-one-week", "fonte_id": "euronews", "data_pub": "2026-09-02T04:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Massas de vítimas não identificadas continuam sendo enterradas em Nepal, onde o número de mortos superou 1.100 uma semana após as cheias. A comunidade hindu se opôs à medida de enterramento em massa, argumentando que ela contraria tradições religiosas.", "titulo_pt": "Enterramentos em massa de vítimas continuam em Nepal com mortes superando 1.100", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 139610, "titulo": "Vapeadores: una omisión inaceptable", "url": "https://www.latercera.com/cartas-al-director/noticia/vapeadores-una-omision-inaceptable/", "fonte_id": "la_tercera", "data_pub": "2026-09-02T00:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a negligência em relação aos vapedores, que são usuários de e-cigarettes. Não há detalhes adicionais sobre o conteúdo do artigo nesse trecho.", "titulo_pt": "Vapedores: uma omissão inaceitável", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 139245, "titulo": "Justiça condena Oxxo a pagar R$ 2 milhões por expor funcionários a assaltos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/justica-condena-oxxo-a-pagar-r-2-milhoes-por-expor-funcionarios-a-assaltos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T22:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça do Trab ondicionados/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-01T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O seguro rural receberá R$ 1,2 bilhão no Orçamento, mas 73,5% dos recursos estão condicionados. O setor tem preocupações com a falta de previsibilidade em um cenário de maior risco climático e endividamento dos produtores.", "titulo_pt": "Seguro rural terá R$ 1,2 bi no Orçamento, mas 73,5% são condicionados", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 139418, "titulo": "Clima: frentes frias chegam ao Sudeste e tempo firme retorna ao Sul", "url": "https://www.metropoles.com/brasil/clima-frentes-frias-chegam-ao-sudeste-e-sol-e-tempo-firme-retornam-ao-sul", "fonte_id": "metropoles", "data_pub": "2026-09-02T09:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Frentes frias chegam ao Sudeste do Brasil, causando rajadas de vento entre 50 km/h e 70 km/h no litoral paulista e capixaba, com picos de até 90 km/h. O tempo firme retorna para o Sul do país.", "titulo_pt": "Clima: frentes frias chegam ao Sudeste e tempo firme retorna ao Sul", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 139379, "titulo": "Mortos no Nepal passam de 1.100 após inundação e deslizamento", "url": "https://www.cnnbrasil.com.br/internacional/mortos-no-nepal-passam-de-1-100-apos-inundacao-e-deslizamento/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-02T08:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de mortos no Nepal após a ocorrência de inundação e deslizamento de terra ultrapassou 1.100. Mais de 3.900 pessoas permanecem desaparecidas no país, segundo as autoridades.", "titulo_pt": "Mortos no Nepal passam de 1.100 após inundação e deslizamento de terra; 3.900 desaparecidos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 139384, "titulo": "ONU prevê aquecimento superior a 1,5°C e riscos maiores no agro", "url": "https://www.cnnbrasil.com.br/agro/onu-preve-aquecimento-superior-a-15c-e-riscos-maiores-no-agro/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-02T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ONU prevê um aquecimento global superior a 1,5°C, aumentando os riscos relacionados a eventos climáticos extremos e afetando negativamente a produtividade agrícola e a utilização de recursos naturais.", "titulo_pt": "ONU prevê aquecimento superior a 1,5°C e riscos maiores no agro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 139869, "titulo": "Fatal floods expose threats to hydropower in the roof of the world", "url": "https://www.japantimes.co.jp/environment/2026/09/02/energy/floods-threat-hydropower-nepal/", "fonte_id": "japan_times", "data_pub": "2026-09-02T06:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O clima está mudando, trazendo gelos instáveis e chuvas imprevisíveis, criando novos riscos e aumentando os custos para projetos de hidrelétrica na região conhecida como teto do mundo.", "titulo_pt": "Inundações fatais expõem ameaças às hidrelétricas no teto do mundo", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 139637, "titulo": "Almost half of world’s farmers poisoned by pesticides every year, experts find", "url": "https://www.theguardian.com/environment/2026/sep/02/50-per-cent-world-farmers-poisoned-pesticides-every-year-experts", "fonte_id": "guardian_world", "data_pub": "2026-09-02T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo, encomendado pela Rede de Ação sobre Pesticidas, revelou que quase metade dos agricultores do mundo são intoxicados por pesticidas a cada ano. O estudo, que utilizou dados públicos de 2006 a 2023, estimou que ocorrem entre 402 e 433 milhões de casos de intoxicação aguda por pesticidas entre agricultores e trabalhadores rurais anualmente. India é responsável por quase 60% dos óbitos relacionados a intoxicações por pesticidas.", "titulo_pt": "Quase metade dos agricultores do mundo é intoxicada por pesticidas a cada ano, mostra estudo", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 139859, "titulo": "‘Marine Landfills’: The Garbage Choking Greece’s Seas", "url": "https://balkaninsight.com/2026/09/02/marine-landfills-the-garbage-choking-greeces-seas/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-09-02T05:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As águas do Mar Egeu e do Mar Íonico em Grécia estão sendo sufocadas por crescentes concentrações de resíduos, principalmente plásticos, sobretudo devido à imagem de águas cristalinas que se mantém.", "titulo_pt": "Marjantes de lixo: as águas de Grécia estão sufocadas", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 139608, "titulo": "Norte y cambio climático", "url": "https://www.latercera.com/cartas-al-director/noticia/norte-y-cambio-climatico/", "fonte_id": "la_tercera", "data_pub": "2026-09-02T00:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute o norte e o impacto do mudança climática na região.", "titulo_pt": "Norte e mudança climática", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 139110, "titulo": "Nepal-China floods highlight a growing front of the climate change crisis", "url": "https://www.scmp.com/opinion/asia-opinion/article/3365825/nepal-china-floods-highlight-growing-front-climate-change-crisis?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-01T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 26 de agosto, um pedaço de geleira desabou a uma altitude superior a 5.000 metros no lado nepalês dos Himalaias. O gelo e a rocha caíram rapidamente por uma vally íngreme a cerca de 50 metros por segundo, escavando detritos e se transformando em uma avalanche de lama rápida que atingiu o Porto de Gyirong na China sete minutos depois. A força da corrente enterrou e destruiu as instalações da fronteira chinesas.", "titulo_pt": "Nepal-china: inundações evidenciam a crescente frente da crise climática", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 138761, "titulo": "Reino Unido bate recorde e tem verão mais quente já registrado pelo país", "url": "https://www.cnnbrasil.com.br/internacional/reino-unido-bate-recorde-e-tem-verao-mais-quente-ja-registrado-pelo-pais/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-01T21:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Reino Unido registrou seu verão mais quente desde o início dos registros meteorológicos, com uma temperatura média de 16,5 graus Celsius. Este foi o maior valor observado pelo Met Office, serviço meteorológico britânico.", "titulo_pt": "Reino Unido bate recorde e registra verão mais quente já registrado pelo país", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 138956, "titulo": "Nepal Pays the Price for Climate Change", "url": "https://foreignpolicy.com/2026/09/01/climate-nepal-floods-china-india/", "fonte_id": "foreign_policy", "data_pub": "2026-09-01T20:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As geleiras estão derretendo e inundações devastadoras estão afetando as montanhas himalayanas.", "titulo_pt": "Nepal paga o preço do mudança climática", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 139084, "titulo": "Health crisis looming as Gaza heads towards rainy season, warns WHO", "url": "https://www.aljazeera.com/news/2026/9/1/health-crisis-looming-as-gaza-heads-towards-rainy-season-warns-who?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-01T18:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Organização Mundial da Saúde alerta para uma crise de saúde iminente na Gaza à medida que se aproxima a temporada chuvosa. A qualidade da água já é ruim no enclave palestino, e a cheia poderá agravar as ameaças à saúde.", "titulo_pt": "Crise de saúde iminente na Gaza à medida que se aproxima a temporada chuvosa, avisa a OMS", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 138224, "titulo": "Farmers press Commission for drought aid", "url": "https://www.euractiv.com/news/farmers-press-commission-for-drought-aid/", "fonte_id": "euractiv", "data_pub": "2026-09-01T15:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão Europeia irá atualizar os ministros da agricultura sobre a situação de estiagem durante uma reunião em Dublin na próxima segunda-feira.", "titulo_pt": "Agricultores pressionam comissão pela ajuda no caso da seca", "veiculo": "Euractiv", "pais": "Europa", "classe": "B"}, {"id": 138356, "titulo": "Philippine capital’s ‘acutely unhealthy’ air due to Indonesian haze spurs warnings", "url": "https://www.scmp.com/week-asia/health-environment/article/3366016/philippine-capitals-acutely-unhealthy-air-due-indonesian-haze-spurs-warnings?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-01T12:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fumaça proveniente de incêndios florestais na Indonésia cobriu Manila, levando a alertas de saúde pública no centro da Filipinas. O esmagamento de fumaça vindos das chamas em Kalimantan, parte indonésia da Borneu, fez com que especialistas em saúde recomendassem o uso de máscaras N95 para a população.", "titulo_pt": "Araguaia encolhe em alerta de saúde pública devido à fumaça da indonésia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 138363, "titulo": "Glacier risk hangs over China-Nepal border as region remembers mudslide victims", "url": "https://www.scmp.com/news/china/politics/article/3366006/glacier-risk-hangs-over-china-nepal-border-region-remembers-mudslide-victims?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-01T11:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na região autônoma do Tibete, moradores e resgatistas observaram um minuto de silêncio em memória das vítimas da deslizamento de lama que ocorreu na semana passada. Cerca de mil pessoas morreram e milhares estão desaparecidas na área fronteiriça entre China e Nepal após a colapso de um glaciar.", "titulo_pt": "Risco de gelo paira sobre fronteira entre china e nepal enquanto região homenageia vítimas de deslizamento de lama", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 138378, "titulo": "Doosan, KOEN widen drone, helicopter search for 9 missing workers in Nepal", "url": "https://www.koreaherald.com/article/10859334", "fonte_id": "korea_herald", "data_pub": "2026-09-01T11:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Doosan Enerbility e Korea South-East Power Co. intensificaram a busca por nove funcionários desaparecidos em Nepal, após inundações flash, utilizando drones e helicópteros. A empresa estatal KOEN adicionou quatro drones equipados com câmeras térmicas e infravermelhas, totalizando seis, para a busca.", "titulo_pt": "Doosan e KOEN intensificam busca por 9 trabalhadores desaparecidos em Nepal com drones e helicópteros", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 137966, "titulo": "The Growing Lawlessness in California’s Forests", "url": "https://www.theatlantic.com/science/2026/09/frog-biologists-kidnapping-california-national-forest/688445/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-01T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Duas biólogas de rãs foram sequestradas nas florestas. Situações ainda mais estranhas podem ocorrer.", "titulo_pt": "Aumento da Lawlessness nas florestas da califórnia", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 139409, "titulo": "Homem é preso após defender estupro como “dever” e atacar mu anos por estupro e agressão", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 139804, "titulo": "Mark Ruffalo comments cause pushback against anti-Semitism ‘smear campaign’", "url": "https://www.aljazeera.com/news/2026/9/2/mark-ruffalo-comments-spark-pushback-against-antisemitism-smear-campaign?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-02T06:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ator Mark Ruffalo criticou a fusão entre Paramount e Warner Bros., associando-a às relações da Oracle com o exército israelense durante o genocídio no Gaza.", "titulo_pt": "Mark Ruffalo critica fusão e acusa oracle de ligação com 'campanha difamatória' contra anti-semitismo", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 139639, "titulo": "Hong Kong pro-democracy activist Joshua Wong pleads guilty in second national security case", "url": "https://www.theguardian.com/world/2026/sep/02/hong-kong-pro-democracy-activist-joshua-wong-pleads-guilty-collusion-china", "fonte_id": "guardian_world", "data_pub": "2026-09-02T04:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Joshua Wong, de 29 anos, um dos ativistas pró-democracia mais proeminentes de Hong Kong, admitiu culpa por conspirar para solicitar sanções estrangeiras contra Hong Kong e China. Ele é acusado de trabalhar com Nathan Law, um ativista exilado, para incitar poderes estrangeiros a aplicar sanções, bloqueios ou outras medidas hostis contra a China.", "titulo_pt": "Joshua Wong, um dos ativistas pró-democracia mais proeminentes de hong Kong, se entrega em segundo caso de segurança nacional", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 139781, "titulo": "Prominent pro-democracy Hong Kong activist Joshua Wong pleads guilty in second national security law case", "url": "http://www.euronews.com/2026/09/02/prominent-pro-democracy-hong-kong-activist-joshua-wong-pleads-guilty B"}, {"id": 138608, "fonte_id": "folha_poder", "titulo": "Terremoto institucional no STF atinge as campanhas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/terremoto-institucional-no-stf-atinge-as-campanhas.shtml", "data_pub": "2026-09-01T21:05:00Z", "topico": "politica_nacional", "idioma": "pt", "titulo_pt": "Terremoto institucional no STF atinge as campanhas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 138762, "fonte_id": "cnn_brasil", "titulo": "Putin diz preferir negociar paz na Ucrânia com pessoas próximas a Trump", "url": "https://www.cnnbrasil.com.br/internacional/putin-diz-preferir-negociar-paz-na-ucrania-com-pessoas-proximas-a-trump/", "data_pub": "2026-09-01T21:05:00Z", "topico": "geopolitica", "idioma": "pt", "titulo_pt": "Putin prefere negociar paz na Ucrânia com pessoas próximas a Trump", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "destaque": {"titulo_evento": "Acordo de petróleo EUA-Venezuela", "texto_pt": "O acordo de petróleo entre os Estados Unidos e a Venezuela, apoiado por executivos de petróleo americanos, visa controlar os preços de combustíveis, que estão em alta devido à guerra na Irã. O Parlamento venezuelano aprovou um acordo que concede poderes aos EUA sobre o petróleo do país, permitindo a exploração de 17 campos de petróleo por 100 anos. A Chevron está prestes a ampliar suas operações no país, o que pode desafiar rivais chineses e russos. No entanto, críticos argumentam que o acordo não é realista e que não haverá redução nos preços da gasolina. O acordo ainda precisa ser esclarecido em vários aspectos, como sua validade legal e impacto econômico. Este acordo insólito envolve interesses militares e econômicos do país sul-americano, reconfigurando a exploração de petróleo na região. As implicações políticas e econômicas deste acordo são significativas, podendo afetar a produção de combustível e a economia de ambos os países. A function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
