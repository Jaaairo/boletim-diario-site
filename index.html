<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

<nav id="nav"></nav>
<main id="main"></main>

</div>

<div class="modal-overlay" id="modal-flag">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

<script>
const D = {"gerado_em": "04/08/2026 23:59", "stats": {"noticias_novas": 1126, "resumos_gerados": 259}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva sancionou uma lei que limita o número de recursos julgados pelo Superior Tribunal de Justiça (STJ), desafogando a corte. Em outro desenvolvimento, Flávio Bolsonaro definiu o nome do vice para as eleições deste ano e encerrou negociações com partidos centristas e da direita. O Podemos anunciou que adotará neutralidade nas eleições presidenciais, afetando assim a aliança política do senador Flávio Bolsonaro.", "mundo": "A crise diplomática entre os Estados Unidos e o Brasil ganhou novos capítulos com a revogação do visto da embaixadora brasileira Maria Luiza Ribeiro Viotti pelos Estados Unidos, em resposta à demora das autoridades brasileiras na confirmação do novo embaixador americano Daniel Pereira. O governo brasileiro considera que a decisão dos EUA se dá por razões ideológicas e negou as acusações feitas pelo país norte-americano sobre a demora na aprovação diplomática. A medida é vista como uma escalada na tensão entre Washington e Brasília, com o Itamaraty rebaixando o nível de relações diplomáticas com a Argentina em resposta aos ataques do presidente Javier Milei ao governo Lula. Além disso, a crise econômica global e as preocupações com a guerra no Irã continuam a influenciar os mercados financeiros e as políticas internacionais, com os EUA considerando novas sanções contra o Brasil devido à demora na confirmação do embaixador americano.\n\nHouve confrontos envolvendo drones na fronteira entre a Rússia e a Ucrânia, resultando em mortes civis em ambos os lados. As autoridades russas confirmaram cinco mortos em Moscou, enquanto as ucranianas relataram que pelo menos um número semelhante de pessoas, incluindo duas crianças, foram mortas em vários locais do país. Em outro desenvolvimento geopolítico, os Estados Unidos revogaram vistos de pelo menos 16 autoridades brasileiras, como a embaixadora Maria Luiza Viotti, como retaliação pelo atraso na homologação do embaixador dos EUA no Brasil. As negociações entre Téhéran e Omã sobre o Estreito de Ormuz são vistas com otimismo, pois podem levar a um acordo que reabra o canal estratégico esta semana. Além disso, a China lançou uma campanha contra o crime organizado, incluindo gangues locais e mafias de areia, enquanto o presidente Luiz Inácio Lula da Silva conversou com Vladimir Putin sobre o comércio entre Brasil e Rússia, focando nas exportações de diesel e fertilizantes.", "economia": "As ações de tecnologia asiáticas subiram 10% após o recorde da sessão de Wall Street, alimentando otimismo sobre inteligência artificial e empresas de crescimento. Em contraste, as vendas do Grupo Pão de Açúcar caíram 9,6% no segundo trimestre, refletindo problemas na logística de produtos. Os investimentos em litio à Corfo aumentaram quase cinco vezes no primeiro semestre, chegando a aproximadamente US$800 milhões, com projeções para ultrapassar os US$1,2 bilhões. A China impôs um tributo sobre trusts offshore, causando uma corrida por advogados e busca frenética por dinheiro entre os super-ricos do país. O Itaú Unibanco registrou um lucro líquido recorrente de R$ 12,407 bilhões no segundo trimestre, enquanto a Kakao Bank relatou lucros recordes no primeiro semestre devido ao aumento nas receitas de juros e não-juros. O emplacamento de veículos no Brasil aumentou 15% em julho ante o mesmo mês do ano anterior, enquanto a Embraer vendeu dois aviões KC-390 à Força Aérea da Colômbia, estabelecendo um novo mercado de exportação para a América Latina.", "tecnologia": "A SpaceX registrou uma baixa nas ações após anunciar que suas despesas com capital aumentaram para cerca de 18,4 bilhões de dólares no segundo trimestre. O fundador Elon Musk planeja investir em inteligência artificial (IA). Em contrapartida, a receita da companhia como empresa de IA dobrou quase três vezes, atingindo US$ 2,6 bilhões, impulsionada principalmente por contratos para fornecer computação para outras empresas de IA. A Samsung também chamou atenção ao apresentar o conceito de zHBM, uma arquitetura avançada de memória projetada para oferecer aproximadamente oito vezes mais desempenho do que a HBM5. Além disso, a empresa divulgou detalhes sobre seu plano para o Future of Memory and Storage 2026 em Santa Clara, Califórnia. Na área de IA, a OpenAI e Anthropic foram acusadas por um relatório da AI Security Institute de realizar testes potencialmente perigosos com pessoas reais e organizações durante a avaliação de segurança cibernética, o que levou à queda nas ações da SpaceX mesmo com o aumento significativo na receita.", "ciencia": "Um pedaço de um foguete Falcon 9, da SpaceX, está programado para colidir com a Lua na madrugada desta quarta-feira às 6h35 GMT. Este evento faz parte do plano da NASA e SpaceX para monitorar o impacto lunar, que pode contribuir para o entendimento dos dados lunares. Paralelamente, uma pesquisa publicada no Center for Climate Change and Social Transformations sugere que a influência social, através de celebridades, atletas e líderes religiosos, pode ser crucial na mudança das atitudes e comportamentos ambientais relacionados ao combate às alterações climáticas. Além disso, a SpaceX planeja iniciar o lançamento de satélites atualizados do Starlink no próximo voo do seu fogueto Starship, programado para ocorrer até o final deste mês. Empresas como Rocket Lab e STR ganharam contratos para rastrear alvos aéreos. As teorias científicas sobre viajar no tempo usando buracos de wormhole também foram discutidas, assim como um fundo apoiado por bilionários destinou 200 milhões de dólares para a preservação de animais e plantas em risco de extinção.", "cultura": "A oitava edição da Festa Literária Pirata das Editoras Independentes (Flipei), que acontecerá de 5 a 9 de outubro na região central de São Paulo, contará com mais de 180 convidados e 65 mesas de debates. O evento, famoso por ser um palco de resistência cultural e pensamento crítico desde 2018, promete abordar diversos temas relevantes para a sociedade. Outro destaque é o Lollapalooza Brasil 2027, que já começou a vender passaportes para os três dias do festival. Os valores estão disponíveis no site oficial e na bilheteria do shopping Ibirapuera. Além disso, a série de terror 'Estilhaços', inspirada no romance de Bret Easton Ellis, segue um grupo de alunos do último ano do ensino médio em Los Angeles nos anos 1980, explorando questões de identidade, sexualidade e ciúmes.", "sociedade": "Um calor extremo está dividindo os ricos e pobres na região nobre de Gangnam, Seul. O acesso ao ar condicionado agora separa as pessoas com recursos das que não têm. No Brasil, a greve da CPTM afetou quase 1 milhão de passageiros em São Paulo, com o rodízio municipal suspenso durante determinados horários para veículos com placas específicas no fim do número. No Chile, a situação econômica continua instável, com cada vez mais chilenos enfrentando dificuldades para manter uma alimentação adequada, refletindo um aumento na desigualdade no país. Em outro ponto do mundo, o governo sul-coreano aprovou regras que podem levar ao fechamento de universidades privadas financeiramente debilitadas.", "meio_ambiente": "Em julho de 2026, a França registrou seu mês mais quente e seco desde o início das medições no século XX, com temperaturas médias superando os 24.9°C e enfrentando uma seca inédita. Essa onda de calor extremo afetou não apenas a Europa, mas também os Estados Unidos e a Ásia, levando a incêndios florestais e mortes relacionadas ao calor. Em Washington State, nos EUA, grandes chamas destruíram mais de 700 edifícios e obrigaram cerca de 64 mil pessoas a deixarem suas casas. Os incêndios também afetaram a região produtora de vinhos de Bordeaux, com fumaça possivelmente influenciando o sabor da nova safra. A Organização Mundial da Saúde (OMS) pede mais apoio para combater a epidemia de Ebola na República Democrática do Congo, enquanto o BID anuncia um acelerador para adaptação ao clima durante a COP31 na Turquia. A Grande Barreira Verde, uma iniciativa de reflorestamento em larga escala na África e na China, visa frear a desertificação e envolve governos, organizações da sociedade civil e voluntários individuais como partes cruciais do projeto.", "direitos_humanos": "Seis anos após o acidente da explosão no porto de Beirute, as famílias das vítimas continuam exigindo justiça. Este ano marca o sexto aniversário do incidente, que teve um impacto devastador nas vidas dos sobreviventes e das famílias dos falecidos. Em Gaza, ocorreu um funeral coletivo para 112 membros de duas famílias palestinas, refletindo a gravidade das tragédias enfrentadas pela população local. A corrida de imigrantes para o enclave espanhol de Ceuta foi iniciada por rumores online que sugeriam a abertura da fronteira com o Marrocos, levando a uma grande movimentação de pessoas. Em Kosovo, autoridades detiveram um terceiro suspeito enquanto as investigações sobre possíveis fossas comuns continuavam. Estes eventos ilustram os desafios e violações dos direitos humanos enfrentados em diversos contextos globais."}, "resumo_do_dia": {"politica_nacional": [{"id": 88220, "titulo": "Vice de Zema, Girão afirma que Michelle teve 'coragem' ao expor acordo 'indecoroso' do PL com Ciro", "url": "https://g1.globo.com/ce/ceara/eleicoes/2026/noticia/2026/08/04/vice-de-zema-girao-afirma-que-michelle-teve-coragem-ao-expor-acordo-indecoroso-do-pl-com-ciro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-05T01:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Eduardo Girão afirmou que Michelle Bolsonaro teve coragem ao expor um acordo considerado indecoroso entre o PL e Ciro Gomes para formar chapa nas eleições do Ceará. Girão fez uma ligação telefônica a Michelle após aceitar concorrer como vice de Romeu Zema.", "titulo_pt": "Girão elogia coragem de Michelle ao expor acordo indecoroso do PL com Ciro", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 88171, "titulo": "CNJ afasta Gabriela Hardt, ex-juíza da Lava Jato, por 2 anos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/cnj-afasta-gabriela-hardt-ex-juiza-da-lava-jato-por-2-anos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-05T00:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CNJ decidiu afastar a juíza Gabriela Hardt por dois anos. Outros dois juízes federais também foram punidos.", "titulo_pt": "CNJ afasta Gabriela Hardt, ex-juíza da Lava Jato, por 2 anos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 88221, "titulo": "SUS amplia teleatendimento de saúde mental a pessoas com vício em apostas", "url": "https://g1.globo.com/saude/noticia/2026/08/04/sus-amplia-teleatendimento-de-saude-mental-a-pessoas-com-vicio-em-apostas.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-05T00:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Saúde expandiu o teleatendimento de saúde mental para pessoas com vícios em apostas. O serviço, oferecido pelo aplicativo Meu SUS Digital, é conduzido por profissionais como psicólogos e enf está sendo investigada pela Polícia Federal.", "titulo_pt": "Ex-chefe de gabinete de Lula diz ter pegado empréstimo de R$ 249 mil com amiga de Lulinha", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 88121, "titulo": "O isolamento de Flávio Bolsonaro na nova podridão do sistema político", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/viniciustorres/2026/08/o-isolamento-de-flavio-bolsonaro-na-nova-podridao-do-sistema-politico.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-04T23:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro do PL enfrenta isolamento partidário, refletindo a diminuição da influência do governo federal sobre o Congresso e reduzindo a importância de alianças estreitas com presidentes para controlar recursos do Estado.", "titulo_pt": "O isolamento de Flávio Bolsonaro na nova dinâmica do sistema político", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 88262, "titulo": "Assessor de Lula diz que recebeu R$ 249 mil de lobista investigada pela PF", "url": "https://veja.abril.com.br/brasil/assessor-de-lula-diz-que-recebeu-r-249-mil-de-lobista-investigada-pela-pf/", "fonte_id": "veja", "data_pub": "2026-08-04T23:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um assessor de campanha do ex-presidente Lula afirmou ter recebido R$ 249 mil de uma lobista que está sendo investigada pela Polícia Federal. O assessor negou irregularidades, afirmando que sua atuação pública sempre foi ética e transparente.", "titulo_pt": "Assessor de Lula diz ter recebido R$ 249 mil de lobista investigada", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 88122, "titulo": "Luiza Trajano pede cota de 50% para mulheres em cargos de liderança", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/luiza-trajano-pede-cota-de-50-para eral do Paraná e condenou o ex-presidente Luiz Inácio Lula da Silva em 2019.", "titulo_pt": "Quem é Gabriela Hardt, juíza afastada por dois anos após atos na Operação Lava Jato", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 88229, "titulo": "Correção: armas com registro vencido", "url": "https://g1.globo.com/correcoes/noticia/2026/08/04/correcao-armas-com-registro-vencido.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-04T23:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O G1 errou ao informar que 30% das armas de CACs estão com o registro vencido. De acordo com o Anuário da Segurança Pública, 1,6 milhão de armas registradas no país estão vencidas, mas não se sabe quantas são de CACs.", "titulo_pt": "Correção: percentual de armas com registro vencido é incerto", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 88175, "titulo": "Michelle descarta apoiar Ciro Gomes mesmo após desistência de Girão", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/michelle-descarta-apoiar-ciro-gomes-mesmo-apos-desistencia-de-girao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-04T22:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Michelle Bolsonaro, ex-primeira dama e candidata ao Senado pelo PL, não considera a possibilidade de aliar-se a Ciro Gomes, do PSDB, mesmo após o senador Eduardo Girão, preferido dela, desistir da candidatura no Ceará.", "titulo_pt": "Michelle rejeita apoio a Ciro Gomes após desistência de Girão", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 88231, "titulo": "Tenente Dalma é oficializada pelo PRTB como candidata à vice-presidência da República na chapa de Leonardo Avalanche", "url": "https://g1.globo.com/go/goias/eleicoes/2026/noticia/2026/08/04/tenente-dalma-e-oficializada-pelo-prtb-como-candidata-a-vice-presidencia-da-republica-na-chapa-de-leonardo-avalanche.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-04T22:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PRTB oficializou Tenente Dalma Regina Florencio de Morais como candidata à vice-presidência na chapa com Leonardo Avalanche. A decisão foi aprovada por unanimidade em reunião do partido.", "titulo_pt": "Tenente Dalma é oficializada pelo PRTB como candidata à vice-presidência da República", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 88951, "titulo": "Russia and Ukraine trade drone attacks with 5 killed in each country", "url": "https://www.koreaherald.com/article/10831412", "fonte_id": "korea_herald", "data_pub": "2026-08-05T01:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rússia e Ucrânia acusaram-se mutuamente de ataques com drones que resultaram em cinco mortes civis cada lado. Enquanto autoridades russas informaram cinco mortos no Moscou, as autoridades ucranianas relataram a morte de um número similar de pessoas, incluindo duas crianças, em vários locais do país.", "titulo_pt": "Rússia e Ucrânia trocam acusações de ataques com drones que deixam cinco mortos cada lado", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 88602, "titulo": "Australia news live: Ben Carroll grilled about involvement in Victorian leadership spill", "url": "https://www.theguardian.com/australia-news/live/2026/aug/05/australia-news-live-jetstar-charge-overhead-luggage-labor-tax-coalition-economy-wednesday-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-08-05T01:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A maioria das casas vendidas nos primeiros seis meses do ano lucrou, mesmo com a queda nas cotações imobiliárias. O relatório da AAP indica que quase todos os proprietários estão vendendo suas propriedades por valores superiores aos de compra.", "titulo_pt": "Notícias ao vivo da austrália: ben Carroll questionado sobre envolvimento na deslocação do líder do victoria", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 88913, "titulo": "Saudi Arabia tries diplomacy to stop Houthi attacks from growing", "url": "https://www.japantimes.co.jp/news/2026/08/05/world/politics/saudi-arabia-diplomacy-houthi-attacks/", "fonte_id": "japan_times", "data_pub": "2026-08-05T01:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Arábia Saudita tem realizado negociações com os hutis, baseados em Yemen, através de mediadores omãios e está ainda preparando opções militares caso a diplomacia falhe, segundo fontes informaram.", "titulo_pt": "Arábia saudita tenta diplomacia para frear ataques dos hutis", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 88255, "titulo": "O recado dos EUA com a retirada do visto da embaixadora brasileira", "url": "https://veja.abril.com.br/politica/o-recado-dos-eua-com-a-retirada-do-visto-da-embaixadora-brasileira/", "fonte_id": "veja", "data_pub": "2026-08-05T01:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos removeu o visto da embaixadora brasileira, aumentando a pressão sobre o Brasil e potencialmente levando a uma crise diplomática entre os dois países.", "titulo_pt": "Mensagem americana com retirada do visto para embaixadora brasileira", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 89006, "titulo": "White House notes its proposal to build 2 combat, 2 non-combat vessels in foreign shipyards in memo", "url": "https://en.yna.co.kr/view/AEN20260805002900315", "fonte_id": "yonhap_news", "data_pub": "2026-08-05T01:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Palácio Branco destacou uma proposta prioritária para a construção de duas embarcações de combate e duas não-combatentes em grama estrangeiras. O anúncio foi feito em um memorando divulgado no dia 4 de agosto.", "titulo_pt": "Branco salienta proposta para construir 2 navios de combate e 2 não-combates em grama estrangeira", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 88853, "titulo": "Ukrainian man chased by exploding drone recounts his terror", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/5/ukrainian-man-chased-by-exploding-drone-recounts-his-terror?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-05T00:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem ucraniano relata o momento em que um drone suspeito russo perseguiu-o antes de explodir.", "titulo_pt": "Homem ucraniano relata perseguição por drone explosivo suspeito", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 88840, "titulo": "Trump trapped between escalation and an Iran deal on Tehran’s terms", "url": "https://www.ft.com/content/87b039cf-7eb0-4cf6-b536-0c2929424dc5?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-05T00:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos enfrenta poucas opções favoráveis para sair de uma guerra que ele afirmou que terminaria rapidamente com a rendição do Irã.", "titulo_pt": "Trump em situações difíceis entre escalada e acordo com as condições do Irã", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 88247, "titulo": "EUA já revogaram vistos de ao menos 16 autoridades brasileiras", "url": "https://www.poder360.com.br/poder-internacional/eua-ja-revogaram-vistos-de-ao-menos-16-autoridades-brasileiras/", "fonte_id": "poder360", "data_pub": "2026-08-05T00:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos revogaram vistos de pelo menos 16 autoridades brasileiras, incluindo a embaixadora Maria Luiza Viotti. Esta medida foi tomada como retaliação pelo atraso do Brasil na homologação do embaixador dos EUA no Brasil.", "titulo_pt": "EUA já revogaram vistos de ao menos 16 autoridades brasileiras", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 88367, "titulo": "Embaixador brasileiro não voltará à Argentina após novos ataques de Milei a Lula", "url": "https://www.infomoney.com.br/politica/embaixador-brasileiro-nao-voltara-a-argentina-apos-novos-ataques-de-milei-a-lula/", "fonte_id": "infomoney", "data_pub": "2026-08-05T00:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A decisão de não retornar o embaixador brasileiro à Argentina foi tomada após Milei realizar novos ataques a Lula em uma entrevista ao jornal La Nación.", "titulo_pt": "Embaixador brasileiro não voltará à Argentina após novas ofensas de Milei a Lula", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 88501, "titulo": "Megarreforma: Senado aprueba compensación a municipios por exención de contribuciones; tribunal confirma comiso de casa de exalcalde Miguel Ángel Aguilera, y gobierno sube a 6 mil UF tope de subsidio a tasas hipotecarias", "url": "https://www.ciperchile.cl/2026/08/04/radar-04-08-26/?utm_source=rss&utm_medium=rss&utm_campaign=radar-04-08-26", "fonte_id": "ciper_chile", "data_pub": "2026-08-05T00:36:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Senado aprovou uma compensação para os municípios devido à exenção de contribuições. Um tribunal confirmou o confisco da casa do ex-prefeito Miguel Ángel Aguilera. O governo aumentou o teto do subsídio para taxas hipotecárias para 6 mil UF.", "titulo_pt": "Megarreforma: senado aprova compensação a municípios; tribunal confirma confisco de casa do ex-prefeito Miguel Ángel Aguilera, e governo aumenta teto do subsídio para taxas hipotecárias para 6 mil UF", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 88368, "titulo": "Decisão dos EUA sobre visto de embaixadora se dá por razões ideológicas, diz Planalto", "url": "https://www.infomoney.com.br/politica/decisao-dos-eua-sobre-visto-de-embaixadora-se-da-por-razoes-ideologicas-diz-planalto/", "fonte_id": "infomoney", "data_pub": "2026-08-05T00:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo brasileiro afirma que a decisão dos Estados Unidos sobre o visto de uma embaixadora se dá por razões ideológicas. O Planalto considera que não é um fato isolado.", "titulo_pt": "Decisão dos EUA sobre visto de embaixadora é motivada por razões ideológicas, diz governo", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 88405, "titulo": "Ataque russo com mísseis balísticos atinge Kiev e provoca incêndios", "url": "https://www.cnnbrasil.com.br/internacional/ataque-russo-com-misseis-balisticos-atinge-kiev-e-provoca-incendios/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-05T00:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Prédios residenciais e armazéns foram atingidos por sucessivas ondas de ataques com mísseis balísticos na capital ucraniana, Kiev.", "titulo_pt": "Ataque russo com mísseis balísticos atinge Kiev e provoca incêndios", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 88222, "titulo": "Brasil rebaixa relações com a Argentina: relembre os ataques de Milei a Lula e a escalada da crise diplomática", "url": "https://g1.globo.com/mundo/noticia/2026/08/04/brasil-rebaixa-relacoes-com-a-argentina-relembre-os-ataques-de-milei-a-lula-e-a-escalada-da-crise-diplomatica.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-05T00:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil decidiu manter o embaixador brasileiro em Buenos Aires no território nacional enquanto Javier Milei, presidente da Argentina, continuar criticando o governo de Luiz Inácio Lula da Silva. Essa medida representa um rebaixamento das relações diplomáticas entre os dois países.", "titulo_pt": "Brasil rebaixa relações com a Argentina após ataques de Milei a Lula", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 88195, "titulo": "Brasil repudia revogação de visto de
