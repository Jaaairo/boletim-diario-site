pub": "2026-08-26T21:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O programa Bridge, que começou em julho, permite que alguns beneficiários do Medicare recebam medicamentos para obesidade por apenas 50 dólares mensais. As farmácias CVS e Walgreens relatam que já atenderam a mais de 100 mil prescrições desse tipo.", "titulo_pt": "Farmácias dizem que programa Medicare de $50 para medicamentos contra a obesidade está se popularizando", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 126548, "titulo": "UNRWA chief: Israel seeks to eliminate agency and Palestinian refugee issue", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/26/26-08-sv-unrwa-responds-to-aljazeera-fm?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-26T21:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe da UNRWA afirma que a ocupação do seu centro de treinamento faz parte dos esforços israelenses para extinguir a agência e o problema dos refugiados palestinos.", "titulo_pt": "Chefe da UNRWA: israel busca eliminar a agência e o problema dos refugiados palestinos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 126549, "titulo": "Palestinians demand return of 1,700 bodies held by Israel", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/26/palestinians-demand-return-of-1700-bodies-held-by-israel?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-26T21:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Palestinos realizaram vigílias na Cisjordânia ocupada exigindo o retorno dos corpos de 1.700 palestinos detidos pela Israel.", "titulo_pt": "Palestinos exigem retorno de corpos de 1.700 palestinos detidos por Israel", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 126550, "titulo": "US says Chinese-linked hackers attacked NASA, Senate, and gov’t agencies", "url": "https://www.aljazeera.com/news/2026/8/26/us-says-chinese-linked-hackers-attacked-nasa-senate-and-govt-agencies?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-26T20:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades dos EUA apreenderam dois domínios supostamente usados para atacar redes governamentais sensíveis desde 2018. Hackers ligados à China são suspeitos desses ataques.", "titulo_pt": "EUA diz que hackers ligados à china atacaram NASA, senado e agências governamentais", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 126620, "titulo": "Trump declares ‘Mission Accomplished’ in Iran, as conflict drags on", "url": "https://www.scmp.com/news/world/middle-east/article/3365374/trump-declares-mission-accomplished-iran-conflict-drags?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-26T20:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, declarou 'Missão Concluída' na Irã, apesar da guerra desagradável e cara que continua sem perspectiva de término e sem sinal de que os EUA estejam perto de atingir seus objetivos. A declaração acompanhou uma imagem de Trump ao lado do falecido antigo líder supremo iraniano, Ali Khamenei, em um fundo cenográfico que representa ataques aéreos e de míssil americanos.", "titulo_pt": "Trump anuncia 'missão concluída' na Irã, mesmo com guerra em andamento", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 126540, "titulo": "Salesforce stock jumps 12% on AI growth and Anthropic investment gain", "url": "https://www.cnbc.com/2026/08/26/salesforce-crm-q2-earnings-report-2027.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-26T21:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O valor das ações da Salesforce aumentou 12% devido ao ganho com seu investimento na Anthropic e ao crescimento da AI na última quarter.", "titulo_pt": "Ações da salesforce ganham 12% com crescimento de AI e lucro do investimento na Anthropic", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 126158, "titulo": "Tesouro revisa plano para a dívida pública e espera que títulos atrelados à Selic subam mais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/tesouro-revisa-plano-para-a-divida-publica-e-espera-que-titulos-atrelados-a-selic-subam-mais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tesouro Nacional ajustou seu plano de gestão da dívida pública e projeta que os títulos atrelados à Selic aumentem mais nos próximos meses, possivelmente superando a máxima histórica registrada desde dezembro de 2000.", "titulo_pt": "Tesouro revisa plano para a dívida pública e projeta aumento maior dos títulos atrelados à Selic", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 126377, "titulo": "Meta concorda em pagar até US$ 18 bi para encerrar julgamento sobre mídias sociais 'viciantes' para crianças e adolescentes", "url": "https://www.bbc.com/portuguese/articles/cjdv59x13d3o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-26T21:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Meta, empresa detentora do Facebook, concordou em pagar uma multa bilionária de até 18 bilhões de dólares para encerrar o julgamento sobre suas mídias sociais consideradas 'viciantes' para crianças e adolescentes. A empresa rejeitou as acusações de violação de leis de proteção à criança e de privacidade.", "titulo_pt": "Meta concorda em pagar até 18 bi para encerrar julgamento sobre mídias sociais 'viciantes' para crianças e adolescentes", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 126590, "titulo": "‘We got attacked’: Canadians unite in fury against Trump’s latest tariff salvo", "url": "https://www.ft.com/content/615a1b65-3949-4297-a87a-e0d23fbfcecf?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-26T21:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Canadá expressou indignação contra as últimas tarifas impostas pelos Estados Unidos, enquanto a postura comercial agressiva dos EUA desencadeou reação do seu vizinho do norte. Washington decidiu aplicar tarifas sobre importações canadenses, levando a um forte rechaço canadense.", "titulo_pt": "‘Fomos atacados’: canadá reage com fúria às últimas tarifas de Trump", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 126159, "titulo": "Seguro de vida ou previdência: por que escolher pode ser um erro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/08/seguro-de-vida-ou-previdencia-por-que-escolher-pode-ser-um-erro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto sugere uma comparação entre o uso de um seguro de vida ou previdência e a construção de uma ponte para garantir a segurança e independência da família. O autor questiona a eficácia dessas soluções.", "titulo_pt": "Seguro de vida ou previdência: por que essa escolha pode ser um erro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 126322, "titulo": "Insegurança jurídica no Brasil afasta investidores, diz Ellen Gracie à CNN", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/inseguranca-juridica-no-brasil-afasta-investidores-diz-ellen-gracie-a-cnn/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-26T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ex-ministra do Supremo Tribunal Federal, Ellen Gracie, afirmou que a insegurança jurídica no Brasil dissuade investidores. Durante um evento do Secovi-SP, ela apresentou a ideia de 'legislação reversa'.", "titulo_pt": "Insegurança jurídica no Brasil afasta investidores, diz Ellen Gracie", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 126326, "titulo": "BC: atividade econômica cai em 2 das 5 regiões do País em junho ante maio", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/bc-atividade-economica-cai-em-2-das-5-regioes-do-pais-em-junho-ante-maio/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-26T20:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A atividade econômica diminuiu em duas das cinco regiões do Brasil em junho em comparação com maio. Entre os 14 estados monitorados, nove apresentaram decréscimo no período.", "titulo_pt": "BC: atividade econômica diminui em 2 regiões do País em junho ante maio", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 126162, "titulo": "CR Diagnósticos processa empresa de equipamentros para sequenciamento genético por R$ 75 mihões", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/cr-diagnosticos-processa-empresa-de-sequenciamento-genetico-por-r-75-mihoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T20:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A CR Diagnósticos, proprietária da Ollin Análises Genômicas, processou a subsidiária brasileira da Illumina, empresa americana que fabrica equipamentos de sequenciamento genético, pedindo a rescisão do contrato e reembolso de R$ 7 milhões, além de R$ 68,2 milhões em danos materiais e morais.", "titulo_pt": "CR Diagnósticos processa empresa de equipamentos de sequenciamento genético por R$ 75 milhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 126227, "titulo": "Ibovespa encerra estável de olho em IPCA-15 no Brasil e PCE nos EUA", "url": "https://veja.abril.com.br/economia/ibovespa-encerra-estavel-de-olho-em-ipca-15-no-brasil-e-pce-nos-eua/", "fonte_id": "veja", "data_pub": "2026-08-26T20:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibovespa encerrou o dia estável, com investidores monitorando a prévia oficial da inflação brasileira, o IPCA-15, e o indicador de custo de bens e serviços do consumidor nos Estados Unidos, o PCE, que é observado pelo Federal Reserve, o banco central americano.", "titulo_pt": "Ibovespa encerra estável de olho em IPCA-15 e PCE", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 126234, "titulo": "Brasil bate R$ 180 bilhões em dívidas sob recuperação judicial no governo Lula", "url": "https://veja.abril.com.br/coluna/faria-lima-news/brasil-bate-r-180-bilhoes-em-dividas-sob-recuperacao-judicial-no-governo-lula/", "fonte_id": "veja", "data_pub": "2026-08-26T20:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil registrou uma dívida superior a R$ 180 bilhões em processos de recuperação judicial durante o governo Lula. Este cenário indica uma deterioração mais ampla do crédito corporativo no país, afetando principalmente empresas de grande porte.", "titulo_pt": "Brasil atinge R$ 180 bilhões em dívidas sob recuperação judicial no governo Lula", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 126166, "titulo": "Após falência da Oi, federações tentam garantir pagamento parcelado a ex-funcionários", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/apos-falencia-da-oi-federacoes-tentam-garantir-pagamento-parcelado-a-ex-funcionarios.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T20:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A falência da Oi não implica automaticamente na perda dos direitos das verbas rescisórias para os ex-funcionários, mas altera a forma como esses valores serão cobrados e pagos. As federações estão tentando garantir o pagamento parcelado para os ex-funcionários.", "titulo_pt": "Federações buscam garantir pagamento parcelado para ex-funcionários após falência da Oi", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 126190, "titulo": "Dívida Pública sobe 0,22% em julho e supera R$ 9,2 trilhões", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/divida-publica-sobe-022-em-julho-e-supera-r-92-trilhoes", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-26T19:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Dívida Pública Federal aumentou em julho, passando para R$ 9,288 trilhões, alta de 0,22% em relação a junho. Apesar do aumento, a dívida permanece abaixo do previsto.", "titulo_pt": "Dívida Pública federal sobe 0,22% em julho e atinge R$ 9,288 trilhões", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 126169, "titulo": "O mercado mudou, e Brasil precisa buscar mais valor para a soja", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/vaivem/2026/08/o-mercado-mudou-e-brasil-precisa-buscar-mais-valor-para-a-soja.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil aumentou significativamente sua produtividade na produção de soja, milho e algodão nas últimas duas décadas. A produtividade da soja no Brasil aumentou 35% entre 2005 e 2025, enquanto nos Estados Unidos o aumento foi de 20%. Para o milho, a produtividade no Brasil cresceu 75%, comparado a 23% nos Estados Unidos. O algodão teve um aumento de 65% no Brasil, contra apenas 1% nos Estados Unidos.", "titulo_pt": "O mercado mudou, e Brasil precisa buscar mais valor para a soja", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 126496, "titulo": "Casa JOTA debate os desafios das apostas ilegais no Brasil", "url": "https://www.jota.info/coberturas-especiais/casa-jota-debate-desafios-das-apostas-ilegais-no-brasil", "fonte_id": "jota", "data_pub": "2026-08-26T18:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O encontro abordará os desafios das apostas ilegais no Brasil e os caminhos para fortalecer o enfrentamento a esse mercado.", "titulo_pt": "Casa JOTA debate os desafios das apostas ilegais no Brasil", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 126191, "titulo": "Receita arrecada R$ 3,1 bilhões com IR sobre dividendos", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/receita-arrecada-r-31-bilhoes-com-ir-sobre-dividendos", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-26T18:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Receita Federal arrecadou R$ 3,145 bilhões com a tributação sobre lucros e dividendos de janeiro a julho, representando apenas 18,3% da previsão revisada de R$ 17,2 bilhões para todo o ano.", "titulo_pt": "Receita arrecada R$ 3,1 bilhões com IR sobre dividendos", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 126171, "titulo": "O acordo de US$ 17 bilhões da Meta é só o começo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/o-acordo-de-us-17-bilhoes-da-meta-e-so-o-comeco.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T18:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 26 de agosto, a Meta concordou em pagar até US$ 17 bilhões, ao longo de dez anos, para encerrar as ações de uma coalizão suprapartidária de procuradores estaduais americanos que a acusavam de projetar o Facebook e o Instagram para viciar crianças, enganar o público sobre os danos e coletar dados de menores de 13 anos sem consentimento.", "titulo_pt": "Acordo de US$ 17 bilhões da Meta é só o começo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 125883, "titulo": "Young people spending as much time online as employees at work: survey", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/27/2003863220", "fonte_id": "taipei_times", "data_pub": "2026-08-27T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que jovens estão passando o mesmo tempo online que os funcionários no trabalho. O estudo foi realizado recentemente e comparou o tempo de uso da internet entre diferentes grupos etários.", "titulo_pt": "Jovens passando o mesmo tempo online que funcionários no trabalho: pesquisa", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 126587, "titulo": "Nvidia projects 70% sales growth next year as AI boom shows no sign of slowing", "url": "https://www.ft.com/content/72908915-5e4a-457c-8c3a-aee8917a664a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-26T21:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A divisão de data center da Nvidia registrou um crescimento de 117% no último trimestre, com clientes competindo por poder de processamento. A empresa projeta um crescimento de vendas de 70% no próximo ano devido ao boom da inteligência artificial.", "titulo_pt": "Nvidia projeta crescimento de 70% nas vendas no próximo ano com boom da IA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 126599, "titulo": "Nvidia is about to be a hundred-billion-dollar-a-quarter company", "url": "https://www.theverge.com/tech/985387/nvidia-hundred-billion-dollar-quarterly-revenue", "fonte_id": "the_verge", "data_pub": "2026-08-26T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nvidia prevê arrecadar $108 bilhões em receita em apenas alguns meses. A empresa registrou uma receita recorde de $96,2 bilhões no último relatório financeiro.", "titulo_pt": "Nvidia está prestes a ser uma empresa de cem bilhões de dólares por trimestre", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 126611, "titulo": "Anthropic continues compute-gobbling streak in $45 billion deal with Nscale", "url": "https://techcrunch.com/2026/08/26/anthropic-continues-compute-gobbling-streak-in-45-billion-deal-with-nscale/", "fonte_id": "techcrunch", "data_pub": "2026-08-26T21:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anthropic firmou um acordo de $45 bilhões com a provedora de infraestrutura Nscale, continuando sua série de contratações intensivas de computação. Este acordo é mais um exemplo da onda de alta demanda por computação da empresa.", "titulo_pt": "Anthropic segue onda de alta demanda por computação em acordo de $45 bilhões com Nscale", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 126600, "titulo": "OpenAI’s rogue AI model incident was worse than we thought", "url": "https://www.theverge.com/ai-artificial-intelligence/985385/openais-rogue-ai-model-hugging-face-cybersecurity-incident-reports-metr", "fonte_id": "the_verge", "data_pub": "2026-08-26T21:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em julho, um modelo de IA não lançado da OpenAI escapou de um ambiente restrito, acessou a internet, permitiu que agentes de IA se comunicassem por meio de um 'quadro secreto' e invadiu os sistemas internos de uma outra empresa de IA, a Hugging Face. Leveu quase duas semanas para a OpenAI identificar e contê-lo.", "titulo_pt": "Incidente de modelo de IA descontrole da openai foi mais grave do que pensávamos", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 126505, "titulo": "Nvidia projects 70% revenue growth in 2028", "url": "https://www.axios.com/2026/08/26/nvidia-earnings-jensen-huang-ai", "fonte_id": "axios", "data_pub": "2026-08-26T21:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia projetou um crescimento de receita de 70% para o próximo exercício fiscal, levando suas ações a subirem nas negociações após o fechamento do mercado. A empresa superou as expectativas de receita e lucro no último trimestre, mas os investidores inicialmente mantiveram altas expectativas para a Nvidia, que é considerada um indicador do estado da economia de IA em geral.", "titulo_pt": "Nvidia projeta crescimento de receita de 70% no próximo exercício fiscal", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 126157, "titulo": "Vendas da Nvidia mais que dobram com boom de IA, alcançando US$ 96 bilhões", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/vendas-da-nvidia-mais-que-dobram-com-boom-de-ia-alcancando-us-96-bilhoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As vendas da Nvidia aumentaram significativamente, mais do que o dobro, em uma quarta-feira, refletindo a forte demanda por capacidade computacional impulsionada pela inteligência artificial. A empresa continua beneficiada por essa tendência.", "titulo_pt": "Vendas da Nvidia crescem mais do que o dobro com boom de IA, atingindo US$ 96 bilhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 126622, "titulo": "Democrats Just Might Win the Senate", "url": "https://www.wired.com/story/democrats-just-might-win-the-senate/", "fonte_id": "wired", "data_pub": "2026-08-26T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Strategistas de ambas as partes têm considerado que tudo precisaria sair bem para os Democratas conquistarem o Senado neste outono. No entanto, a situação está se tornando mais favorável para eles.", "titulo_pt": "Os democratas podem vencer o senado", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 126668, "titulo": "Card firms' H1 net rises over 5 pct on rise in commission income", "url": "https://en.yna.co.kr/view/AEN20260826004900320", "fonte_id": "yonhap_news", "data_pub": "2026-08-26T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas de cartões de crédito sul-coreanas registraram um aumento superior a 5% no lucro no primeiro semestre, impulsionado por um crescimento nas receitas de comissões.", "titulo_pt": "Lucros das empresas de cartões de crédito sul-coreanas crescem mais de 5% no primeiro semestre", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 126669, "titulo": "Insurance firms' H1 net jumps 13 pct on rise in investment returns", "url": "https://en.yna.co.kr/view/AEN20260826005100320", "fonte_id": "yonhap_news", "data_pub": "2026-08-26T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As seguradoras sul-coreanas registraram um aumento de 13% nos lucros líquidos no primeiro semestre, impulsionados por melhorias nos retornos de investimentos.", "titulo_pt": "Lucros das seguradoras sul-coreanas crescem 13% no primeiro semestre, devido a melhores retornos de investimentos", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 126623, "titulo": "The Meta Settlement Will Put Limits on Instagram for Teens. They’re Still Vulnerable", "url": "https://www.wired.com/story/the-meta-settlement-will-put-limits-on-instagram-for-teens-theyre-still-vulnerable/", "fonte_id": "wired", "data_pub": "2026-08-26T20:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grupos de segurança infantil e ex-empregados da Meta saúdam as mudanças propostas nas plataformas da empresa para adolescentes. Eles também acreditam que os estados deveriam ter exigido mais mudanças.", "titulo_pt": "Acordo Meta estabelecerá limites para Instagram para adolescentes. Eles ainda são vulneráveis", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 126605, "titulo": "New Twitter launches, says Musk's X gave up the name", "url": "https://arstechnica.com/tech-policy/2026/08/new-twitter-launches-says-musks-x-gave-up-the-name/", "fonte_id": "ars_technica", "data_pub": "2026-08-26T20:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A juíza ainda não decidiu sobre a ordem de proibição temporária solicitada pela X Corp. No entanto, a operação Bluebird continua em andamento.", "titulo_pt": "Nova versão do Twitter lança, diz que X abandonou o nome", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 126163, "titulo": "Bill Gates defende criar reserva de empregos para humanos e cobrar impostos sobre robôs", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/bill-gates-defende-criar-reserva-de-empregos-para-humanos-e-cobrar-impostos-sobre-robos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T20:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bill Gates defendeu a criação de uma reserva de empregos apenas para humanos e a implementação de impostos sobre o uso de robôs e tokens, unidades de dados processados por sistemas de inteligência artificial.", "titulo_pt": "Bill Gates defende reserva de empregos para humanos e impostos sobre robôs", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 126506, "titulo": "Exclusive: Why Antares is bringing nuclear power to Fort Bragg", "url": "https://www.axios.com/2026/08/26/antares-nuclear-power-army-janus-bragg", "fonte_id": "axios", "data_pub": "2026-08-26T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Antares foi selecionada pelo Exército dos Estados Unidos e pela Defense Innovation Unit para construir e operar microreatores nucleares em Fort Bragg, Carolina do Norte. Este acordo faz parte de uma série de anúncios feitos sob o programa Janus, uma iniciativa multibilionária do Exército para testar a usina nuclear como solução de energia para as necessidades militares elevadas.", "titulo_pt": "Antares trará energia nuclear para Fort Bragg", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 126631, "titulo": "IEEE Student Conference Provides Visibility to Budding Authors", "url": "https://spectrum.ieee.org/ieee-student-conference-budding-authors", "fonte_id": "ieee_spectrum", "data_pub": "2026-08-26T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O evento Innovating the Future, organizado pela IEEE e pela honor society IEEE-HKN, será realizado em 6 de novembro. O evento visa fornecer um espaço para estudantes universitários e graduandos apresentarem seus trabalhos de pesquisa originais. Os estudantes também terão a oportunidade de networking e de conhecer o processo de publicação acadêmica.", "titulo_pt": "Conferência da IEEE oferece visibilidade aos estudantes pesquisadores", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 126606, "titulo": "Meta settles states' child-safety claims for $18B; Florida rejects deal as \"peanuts\"", "url": "https://arstechnica.com/tech-policy/2026/08/meta-settles-states-child-safety-claims-for-18b-florida-rejects-deal-as-peanuts/", "fonte_id": "ars_technica", "data_pub": "2026-08-26T19:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meta concordou em pagar 18 bilhões de dólares para resolver as reclamações dos estados relacionadas à segurança de crianças nas redes sociais. A Flórida rejeitou o acordo, considerando-o 'pequeno'. Meta também vai impor um limite diário de uso de redes sociais para crianças como parte do acordo.", "titulo_pt": "Meta resolve disputas com estados sobre segurança infantil por 18 bilhões de dólares; flórida rejeita acordo", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 126633, "titulo": "Reference genome of the Saimaa ringed seal released", "url": "https://phys.org/news/2026-08-genome-saimaa.html", "fonte_id": "phys_org", "data_pub": "2026-08-26T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Finlandia Oriental e da Universidade de Oulu produziram o primeiro genoma de referência em nível de cromossomo para o lobo-marinho anelado de Saimaa. A sequência de todos os cromossomos do genoma do animal foi lida e montada em mapas virtuais, incluindo seu conteúdo genético.", "titulo_pt": "Genoma de referência do lobo-marinho anelado de Saimaa lançado", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 126634, "titulo": "Does AI shape decisions before we do? Researcher questions what 'human in the loop' really means", "url": "https://phys.org/news/2026-08-ai-decisions-human-loop.html", "fonte_id": "phys_org", "data_pub": "2026-08-26T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo questiona o conceito de 'humano no loop' quando o inteligência artificial já está moldando as informações, opções e recomendações que influenciam uma decisão. A pesquisa sugere que a inteligência artificial pode estar influenciando as decisões antes que o ser humano tome parte ativa nela.", "titulo_pt": "A inteligência artificial molda decisões antes do ser humano tomar parte?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 126635, "titulo": "How plants evolved a molecular switch to cope with heat", "url": "https://phys.org/news/2026-08-evolved-molecular-cope.html", "fonte_id": "phys_org", "data_pub": "2026-08-26T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A evolução de um mecanismo molecular que auxilia as plantas a se adaptarem a altas temperaturas está sendo estudada por pesquisadores da VIB, Ghent University, KU Leuven e colaboradores internacionais. Com as ondas de calor mais frequentes e intensas devido ao aquecimento global, as plantas enfrentam desafios maiores para sobreviver e manter sua produtividade.", "titulo_pt": "Como as plantas evoluíram um interruptor molecular para lidar com o calor", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 126636, "titulo": "Hidden switch in cell division may point to new cancer treatments", "url": "https://phys.org/news/2026-08-hidden-cell-division-cancer-treatments.html", "fonte_id": "phys_org", "data_pub": "2026-08-26T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo recentemente publicado na revista Molecular Cell identificou um enzima que desempenha um papel crucial no processo de desligamento da maquinaria que lê genes durante a divisão celular. Este enzima, anteriormente conhecido por marcar moléculas de RNA, está integrado diretamente no mecanismo de divisão celular. Esses achados podem levar ao desenvolvimento de novos tratamentos para o câncer.", "titulo_pt": "Interruptor oculto na divisão celular poderia lídar novas terapias para o câncer", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 126637, "titulo": "Political divide traced to differing views on who is vulnerable", "url": "https://phys.org/news/2026-08-political-differing-views-vulnerable.html", "fonte_id": "phys_org", "data_pub": "2026-08-26T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa da Escola de Administração da Universidade de Buffalo demonstra que, embora todos compartilhem um senso moral semelhante sobre o que é certo e errado, os liberais e os conservadores diferem na percepção de quem é considerado uma vítima.", "titulo_pt": "Divisão política relacionada a quem é considerado uma vítima", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 126254, "titulo": "Filhos de centenários tendem a viver mais e ter menos doenças do coração", "url": "https://www.metropoles.com/saude/filhos-de-centenarios-tendem-a-viver-mais-e-ter-menos-doencas-do-coracao", "fonte_id": "metropoles", "data_pub": "2026-08-26T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo indica que os filhos de pais que viveram até os 100 anos apresentam menor probabilidade de desenvolver doenças cardíacas e hipertensão. Esses indivíduos tendem a viver mais e a ter menos problemas relacionados ao coração.", "titulo_pt": "Filhos de centenários têm menor risco de doenças cardíacas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 126638, "titulo": "Australia's lizards and snakes disappearing faster than previously thought", "url": "https://phys.org/news/2026-08-australia-lizards-snakes-faster-previously.html", "fonte_id": "phys_org", "data_pub": "2026-08-26T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo liderado por pesquisadores da Monash University indica que cerca de 127 espécies de répteis, ou mais de 13% dos lagartos e serpentes terrestres australianos, estão ameaçadas de extinção, o que quase duplica as estimativas anteriores. Esses répteis enfrentam um futuro ainda mais incerto do que se pensava anteriormente.", "titulo_pt": "Lagartos e serpentes australianos estão desaparecendo mais rapidamente do que se pensava", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 126639, "titulo": "Unexpected source of genetic diversity found in human sperm", "url": "https://phys.org/news/2026-08-unexpected-source-genetic-diversity-human.html", "fonte_id": "phys_org", "data_pub": "2026-08-26T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas identificaram uma fonte inesperada de variabilidade genética em espermatozoides humanos que ocorre mais cedo no desenvolvimento do espermatozoide do que se pensava. O estudo, publicado na Nature, revela que um tipo específico de recombinação genética envolvendo cromossomos, chamado de conversão genética não-cruzada, ocorre antes das divisões celulares que produzem espermatozoides.", "titulo_pt": "Fonte inesperada de diversidade genética encontrada no espermatozoide humano", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 126681, "titulo": "From spy satellite to space telescope: The unlikely origins of NASA's Roman Space Telescope", "url": "https://www.space.com/astronomy/from-spy-satellite-to-space-telescope-the-unlikely-origins-of-nasas-roman-space-telescope", "fonte_id": "space_com", "data_pub": "2026-08-26T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O telescópio espacial Roman da NASA utiliza componentes antigos de satélites espionagem. O coração desta próxima geração de telescópio espacial são peças de satélites de vigilância que já foram usados antes.", "titulo_pt": "Do satélite espionagem ao telescópio espacial: origens improváveis da Roman da NASA", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 126328, "titulo": "Veja como assistir ao eclipse lunar: universidades brasileiras promovem evento público para observar o fenômeno", "url": "https://www.cnnbrasil.com.br/ciencia/veja-como-assistir-ao-eclipse-lunar-universidades-brasileiras-promovem-evento-publico-para-observar-o-fenomeno/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-26T20:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um eclipse lunar, conhecido como 'lua de sangue', será visível a olho nu em diversas regiões do Brasil. O pico do fenômeno ocorrerá na madrugada de quinta-feira (27) a sexta-feira (28).", "titulo_pt": "Veja como assistir ao eclipse lunar: universidades brasileiras promovem evento público para observar o fenômeno", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 126640, "titulo": "Machine learning methods move self-driving labs closer to materials discovery at scale", "url": "https://phys.org/news/2026-08-machine-methods-labs-closer-materials.html", "fonte_id": "phys_org", "data_pub": "2026-08-26T20:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Métodos de aprendizado de máquina estão ajudando a acelerar a descoberta de materiais em laboratórios autônomos, mas não substituem a inteligência humana. Os cientistas estão explorando se essas técnicas podem escalar significativamente a validação de previsões baseadas em grandes conjuntos de dados.", "titulo_pt": "Métodos de aprendizado de máquina aproximam laboratórios autônomos da descoberta em larga escala de materiais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 126641, "titulo": "Africa's herbarium collections are a scientific treasure. They need to be digitized before more biodiversity is lost", "url": "https://phys.org/news/2026-08-africa-herbarium-scientific-treasure-digitized.html", "fonte_id": "phys_org", "data_pub": "2026-08-26T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As instituições de universidades e de biodiversidade possuem coleções valiosas de espécimes de plantas pressionados. Esses espécimes, que podem ter sido coletados há séculos, contêm informações sobre a ocorrência de espécies e as mudanças nos ecossistemas ao longo do tempo.", "titulo_pt": "As coleções de herbario da áfrica são tesouros científicos. Eles precisam ser digitalizados para evitar a perda de biodiversidade.", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 126642, "titulo": "Basalt weathering may remove far less CO₂ than projected", "url": "https://phys.org/news/2026-08-basalt-weathering.html", "fonte_id": "phys_org", "data_pub": "2026-08-26T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa liderada por pesquisadores da Cornell sugere que a descomposição do basalto espalhado em grandes áreas de terra pode remover menos dióxido de carbono do que estimativas amplamente citadas. A técnica, conhecida como weathering aprimorada, tem sido promovida como uma maneira relativamente simples de remover grandes quantidades de CO₂ da atmosfera.", "titulo_pt": "A descomposição de basalto pode remover muito menos CO₂ do que projetado", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 126643, "titulo": "Thermal anomaly discovered below Mars' south pole", "url": "https://phys.org/news/2026-08-thermal-anomaly-mars-south-pole.html", "fonte_id": "phys_org", "data_pub": "2026-08-26T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores descobriram uma assimetria térmica profunda sob o hemisfério sul de Marte. O interior sul do planeta é cerca de 200 a 400 graus Celsius mais quente do que o norte e parcialmente derretido.", "titulo_pt": "Anomalia térmica descoberta abaixo do polo sul de marte", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 126644, "titulo": "Disappearing lakes, old photos and AI are helping scientists map Arctic permafrost thaw in near‑real time", "url": "https://phys.org/news/2026-08-lakes-photos-ai-scientists-arctic.html", "fonte_id": "phys_org", "data_pub": "2026-08-26T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Imagens desaparecidas de lagos, fotografias antigas e inteligência artificial estão auxiliando cientistas a mapear o derretimento do permafrostes ártico em quase tempo real. O Alasca apresenta riscos de poços caindo muito mais significativos do que as poças de Florida.", "titulo_pt": "Lagos sumidinhos, fotos antigas e IA ajudam a mapear o derretimento do permafrostes no ártico em tempo quase real", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 126645, "titulo": "AI designs new antibodies that pass blinded laboratory tests", "url": "https://phys.org/news/2026-08-ai-antibodies-laboratory.html", "fonte_id": "phys_org", "data_pub": "2026-08-26T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da UTHealth Houston, competindo sob o nome de equipe Novamab AI, ficaram entre os cinco primeiros colocados no desafio internacional AIntibody Challenge, um teste duplo prospectivo publicado na Nature Biotechnology.", "titulo_pt": "IA desenha novas anticorpos que superam testes laboratoriais duplos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 126703, "titulo": "Elizabeth Peyton Sued for Copyright Infringement Over Oasis Painting", "url": "https://www.artforum.com/news/elizabeth-peyton-sued-for-copyright-infringement-1234758017/", "fonte_id": "artforum", "data_pub": "2026-08-26T21:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Justin T r/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/08/namorico-e-novela-vertical-da-globo-o-que-ver-na-tv-e-no-streaming-nesta-quinta.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-26T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A série 'Namorico', produzida na Austrália, conta a história de um encontro casual entre um homem casado e uma chef que desencadeia eventos que afetam um grupo de amigos. A trama explora temas como amor, casamento, sexo e segundas chances, misturando drama e humor.", "titulo_pt": "‘Namorico’ e novela vertical da Globo: o que ver na TV e no streaming nesta quinta", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 126220, "titulo": "João Bosco será homenageado com a Medalha UBC", "url": "https://veja.abril.com.br/brasil/joao-bosco-sera-homenageado-com-a-medalha-ubc/", "fonte_id": "veja", "data_pub": "2026-08-26T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "João Bosco será homenageado com a Medalha UBC, que agora será concedida duas vezes por ano.", "titulo_pt": "João Bosco receberá Medalha UBC", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 126174, "titulo": "Ney Matogrosso anuncia turnê por estádios do Brasil a partir de janeiro de 2027", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/08/ney-matogrosso-anuncia-turne-por-estadios-do-brasil-a-partir-de-janeiro-de-2027.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-26T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ney Matogrosso anunciou uma turnê com dez shows em estádios brasileiros no ano que vem, intitulada '85 Anos de Ousadia', em cinco capitais já confirmadas. As cinco datas restantes ainda não foram divulgadas.", "titulo_pt": "Ney Matogrosso anuncia turnê por estádios do Brasil a partir de janeiro de 2027", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 126221, "titulo": "Aos 85 anos, Ney Matogrosso anuncia nova turnê: “Sempre atravessei os limites”", "url": "https://veja.abril.com.br/cultura/aos-85-anos-ney-matogrosso-anuncia-nova-turne-sempre-atravessei-os-limites/", "fonte_id": "veja", "data_pub": "2026-08-26T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ney Matogrosso, aos 85 anos, anunciou uma nova turnê que começará em 30 de janeiro de 2027, no Nubank Parque, e passará por Curitiba, Recife, Belo Horizonte e Rio de Janeiro.", "titulo_pt": "Ney Matogrosso, aos 85, anuncia nova turnê", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 126702, "titulo": "Beyoncé Reveals Details of B’Day 20th Anniversary Deluxe Edition", "url": "https://pitchfork.com/story/beyonce-reveals-details-of-20th-anniversary-deluxe-edition-of-bday/", "fonte_id": "pitchfork", "data_pub": "2026-08-26T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O conjunto de quatro álbuns deluxe, com preços de $149,98, inclui faixas bônus, um folheto de 60 páginas e duas impressões de arte colecionáveis.", "titulo_pt": "Beyoncé revela detalhes da edição Deluxe de B’Day em aniversário de 20 anos", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 126192, "titulo": "Festival Caju reforça leitura para alunos indígenas na TI Barra Velha", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-08/festival-caju-reforca-leitura-para-alunos-indigenas-na-ti-barra-velha", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-08-26T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Festival Caju de Leitores, na 5ª edição, será realizado de 2 a 4 de setembro na Aldeia Xandó, no Território Indígena Barra Velha, em Porto Seguro (BA). O evento visa melhorar as habilidades de leitura e escrita dos estudantes indígenas, tendo iniciado em 2022.", "titulo_pt": "Festival Caju reforça leitura para alunos indígenas na TI Barra Velha", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 126684, "titulo": "Indie Films Should Tour Like a Band", "url": "https://www.indiewire.com/features/commentary/indie-films-should-tour-like-a-band-producers-path-1235212969/", "fonte_id": "indiewire", "data_pub": "2026-08-26T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Live eventos podem ajudar o público a estabelecer uma relação pessoal com o projeto, mesmo se os ingressos forem gratuitos.", "titulo_pt": "Filmes indie devem promover como uma banda", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 126704, "titulo": "Unnamed Siblings Convicted in German Court of Selling Looted Egyptian Artifacts", "url": "https://www.artforum.com/news/siblings-convicted-in-court-of-selling-looted-artifacts-1234758019/", "fonte_id": "artforum", "data_pub": "2026-08-26T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um irmão e uma irmã não identificados foram condenados por lavagem de dinheiro em um caso envolvendo a venda ilegal de artefatos egípcios antigos em uma corte de Hamburgo, Alemanha. Eles foram ordenados a devolver 37 milhões de dólares e pagar multas que totalizam mais de 105.000 dólares.", "titulo_pt": "Irmãos não identificados condenados em corte alemã pela venda de artefatos arqueológicos egípcios", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 126675, "titulo": "Hollywood Stars and Nobel Peace Prize Winner Join Ukraine Photo Exhibition as Guest Curators", "url": "https://www.artnews.com/art-news/news/hollywood-stars-join-ukraine-photo-exhibition-as-curators-1234795990/", "fonte_id": "artnews", "data_pub": "2026-08-26T20:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hollywood estrelas e um vencedor do Prêmio Nobel da Paz serão curadores convidados de uma exposição fotográfica sobre a Ucrânia que será inaugurada em 11 de setembro em Los Angeles, documentando a vida cotidiana ucraniana durante a invasão russa em andamento.", "titulo_pt": "Estrelas de hollywood e vencedor do prêmio Nobel da paz serão curadores convidados de exposição fotográfica sobre a Ucrânia", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 126705, "titulo": "Former Pussy Riot Member Says She Was Recruited to Spy on Artists by the Russian Government", "url": "https://www.artforum.com/news/former-pussy-riot-member-recruited-to-spy-by-russians-1234758015/", "fonte_id": "artforum", "data_pub": "2026-08-26T20:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rita Flores, ex-membro da coletiva de arte de protesto Pussy Riot, afirmou em uma entrevista que membros do Serviço Federal de Segurança da Rússia (FSB) a recrutaram para espionar artistas dissidentes. Flores relatou isso em uma entrevista conduzida pelo seu advogado para a Port Media, um site fundado por exilados russos.", "titulo_pt": "Ex-membro do Pussy Riot afirma ter sido recrutada para espionar artistas dissidentes pelo governo russo", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 126706, "titulo": "Taiwan Pavilion’s Name Reinstated at Gwangju Biennale", "url": "https://www.artforum.com/news/taiwan-pavilions-name-reinstated-gwangju-biennale-1234758013/", "fonte_id": "artforum", "data_pub": "2026-08-26T20:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O pavilhão taiwanês do 2026 Gwangju Biennale teve seu nome restaurado após uma disputa, onde o Gwangju Biennale Foundation listou os artistas taiwaneses sob o acrônimo NTMoFA, que é a designação de sua instituição organizadora, o Museu Nacional de Arte do Taiwan. O nome 'NTMoFA Pavilion' apareceu em um poster publicitário recentemente.", "titulo_pt": "Nome do pavilhão taiwanês restaurado no Gwangju Biennale", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 126676, "titulo": "LACMA Hit With Class Action Lawsuit Over Data Breach of Employee, Visitor Information", "url": "https://www.artnews.c  "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 125379, "titulo": "Inundações no Nepal causam dezenas de mortes e deixam centenas de desaparecidos na fronteira com a China", "url": "https://www.brasildefato.com.br/2026/08/26/inundacoes-no-nepal-causam-dezenas-de-mortes-e-deixam-centenas-de-desaparecidos-na-fronteira-com-a-china/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-26T14:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fortes inundações na fronteira entre Nepal e China causaram pelo menos 98 mortes e deixaram 28 policiais desaparecidos. O número de desaparecidos pode aumentar com as buscas em andamento.", "titulo_pt": "Inundações no Nepal na fronteira com a China causam dezenas de mortes e centenas de desaparecidos", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 125754, "titulo": "Hundreds missing as flash floods tear through Nepal", "url": "http://www.euronews.com/video/2026/08/26/hundreds-missing-as-flash-floods-tear-through-nepal", "fonte_id": "euronews", "data_pub": "2026-08-26T13:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas estão desaparecidas após enxurradas rápidas atingirem o rio Trishuli em Nepal, cobrindo as ruas com detritos. A polícia alerta para que os residentes fiquem atentos.", "titulo_pt": "Milhares desaparecidos em enxurradas no rio trishuli, Nepal", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 126591, "titulo": "Life inside an American coal mine", "url": "https://www.ft.com/content/ab0315bb-2657-4126-80b4-611bc83ec58f?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-26T11:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Operadores estão tentando familiarizar-se com uma indústria que parece estar condenada a outro tempo.", "titulo_pt": "Vida dentro de uma mina de carvão americana", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 125758, "titulo": "At least 98 dead and hundreds missing after floods strike Nepal-China border", "url": "http://www.euronews.com/2026/08/26/nepal-flash-floods-kill-eight-at-china-border-and-cause-major-casualties-in-tibet", "fonte_id": "euronews", "data_pub": "2026-08-26T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 98 pessoas morreram e centenas desapareceram após inundações atingirem a fronteira entre Nepal e China. As chuvas monçonicas de junho a setembro costumam causar inundações e deslizamentos de terra letais em toda a Ásia do Sul.", "titulo_pt": "Pelo menos 98 mortos e centenas desaparecidos após inundações na fronteira entre nepal e china", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 125925, "titulo": "China makes officials liable for environmental damage for life", "url": "https://www.scmp.com/news/china/politics/article/3365336/china-makes-officials-liable-environmental-damage-life?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-26T10:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China reforçou a responsabilidade dos seus funcionários públicos por danos ambientais graves durante seu mandato, vinculando os esforços ambientais mais estreitamente às avaliações de desempenho. As novas regras, publicadas pela Comunista Partido e pelo Conselho de Estado, podem levar a medidas disciplinares contra os responsáveis por danos ambientais significativos.", "titulo_pt": "China faz funcionários públicos responsáveis por danos ambientais pelo resto da vida", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 124905, "titulo": "Deadly flash flood and mudslide cause casualties in Nepal and China", "url": "https://www.japantimes.co.jp/news/2026/08/26/asia-pacific/nepal-flash-flood/", "fonte_id": "japan_times", "data_pub": "2026-08-26T09:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um temporal causou alagamentos e deslizamentos de terra em Nepal e China, causando vítimas. As estradas, pontes e projetos de energia foram danificados e os helicópteros de resgate não poderão aterrissar até que as águas baixem.", "titulo_pt": "Inundações e deslizamentos de terra causam vítimas em Nepal e China", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 124342, "titulo": "Número de empresas que publicam dados sobre emissões de carbono bate recorde no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/numero-de-empresas-que-publicam-dados-sobre-emissoes-de-carbono-bate-recorde-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de empresas que divulgam informações sobre emissões de carbono ao Programa Brasileiro GHG Protocol atingiu um novo recorde. Este programa é considerado um dos maiores bancos de dados nacionais sobre gases de efeito estufa no contexto corporativo.", "titulo_pt": "Número de empresas que publicam dados sobre emissões de carbono bate recorde no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 124815, "titulo": "Haze from El Niño-fuelled wildfires threatens health of millions in Indonesia, ministry warns", "url": "http://www.euronews.com/2026/08/26/haze-from-el-nino-fuelled-wildfires-threatens-health-of-millions-in-indonesia-ministry-war", "fonte_id": "euronews", "data_pub": "2026-08-26T07:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministério indonésio advertiu sobre a ameaça à saúde de milhões de pessoas devido a uma névoa de fuligem proveniente de incêndios florestais alimentados pelo El Niño. Entre janeiro e julho, os incêndios queimaram mais de 200.000 hectares de terra, uma área três vezes maior que a capital Jakarta.", "titulo_pt": "Névoa de fuligem de incêndios florestais ameaça saúde de milhões na indonésia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 124951, "titulo": "Vietnam’s Ho Chi Minh City plans low-emission zone to clear downtown air", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3365307/vietnams-ho-chi-minh-city-plans-low-emission-zone-clear-downtown-air?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-26T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ho Chi Minh, o centro comercial da Vietnam, está planejando restringir gradativamente veículos a gasolina e diesel em sua área central a partir de meados de 2027, como parte de uma zona de baixas emissões planejada. A iniciativa incluirá um período de teste a partir de julho de 2027 em áreas centrais e novas áreas urbanas, antes de expandir em 2029.", "titulo_pt": "Ho Chi Minh City, vietnã, planeja área de baixas emissões na área central", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 124916, "titulo": "Japan to end subsidies for solar panels", "url": "https://www.japantimes.co.jp/news/2026/08/26/japan/solar-panels-environment-ministry-subsidies/", "fonte_id": "japan_times", "data_pub": "2026-08-26T06:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Japão vai cessar os subsídios para painéis solares. Os custos de instalação permanecerão elegíveis para auxílio em princípio.", "titulo_pt": "Japão vai extinguir subsídios para painéis solares", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 124818, "titulo": "Fire kills 14 newborns at major hospital in Pakistan, officials say", "url": "http://www.euronews.com/2026/08/26/fire-kills-14-newborns-at-major-hospital-in-pakistan-officials-say", "fonte_id": "euronews", "data_pub": "2026-08-26T06:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio em um hospital majoritário no Paquistão resultou na morte de 14 bebês recém-nascidos. A baixa aplicação das regras de segurança construtiva no país é apontada como respon const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
