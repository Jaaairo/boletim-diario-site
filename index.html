<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

    <label for="inp-senha">Senha</label>

  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>

      <button class="btn-sec2" onclick="fecharModal('modal-flag')">Cancelar</button>
      <button class="btn-pri" onclick="salvarFlagAtual()">Marcar</button>

  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

const D = {"gerado_em": "03/10/2026 19:13", "stats": {"noticias_novas": 416, "resumos_gerados": 191}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "As eleições de 2026 no Brasil apresentam uma disputa acirrada entre Lula e Flávio Bolsonaro, com ambos liderando as pesquisas de intenção de voto. De acordo com a pesquisa Datafolha divulgada no sábado (3), Lula tem 45% das intenções de votos válidos, enquanto Flávio Bolsonaro tem 42%, um empate técnico. Em São Paulo, Flávio Bolsonaro tem 47% e Lula 43%, conforme apontado pela pesquisa Palver. A pesquisa AtlasIntel no Pará indica que Lula tem uma vantagem significativa, com 52,5% dos votos válidos, enquanto Flávio Bolsonaro tem 40,6%. No Piauí, Fontelles lidera com 68,4% dos votos válidos, garantindo a reeleição. O cenário econômico do país é positivo, com aumento do emprego e renda, mas também há preocupações com a elevação das dívidas das famílias. As eleições ocorrem em 4 de outubro, com diversos candidatos em disputa para cargos como deputado federal, estadual e senador em estados como Ceará, Alagoas, Mato Grosso do Sul e Bahia. O presidente do TSE, Alexandre de Moraes, assegura que não há ameaças concretas de natureza internacional ou de crime organizado nas eleições.", "mundo": "Em Israel, uma operação militar resultou na morte de cinco pessoas, incluindo quatro mulheres, em Gaza, durante um ataque aéreo que visava o líder do Hamas, Ali al-Amoudi. Em Letônia, o partido pró-Ucrânia e pró-Europa do primeiro-ministro Andris Kuļbergs obteve uma vitória surpreendente nas eleições parlamentares, mas o centro-esquerda terá que formar um novo governo de coalizão. Em Tennessee, o diretor da prisão renunciou após a execução falha de Christa Pike, dando um passo atrás em sua posição. A França anunciou a implementação de uma suspensão temporária da carteira de motorista para quem for flagrado usando o celular ao volante. A Ucrânia intensificou os ataques à infraestrutura energética russa em resposta aos bombardeios contra Kyiv, enquanto a Rússia continuou sua campanha de bombardeios contra pontes em Kiev. Na América Latina, pesquisas indicam um avanço da direita, com vitórias de candidatos conservadores, mas há aspectos além desse movimento que também devem ser considerados.\n\nA Coreia do Norte realizou um teste de míssil durante um período de tensão com o Sul, aumentando as preocupações sobre a situação na Península Coreana. Em outros desenvolvimentos, Donald Trump declarou que o Irã foi decimado, indicando que tomará uma decisão sobre o país, sugerindo que o Irã enfrentará uma situação fácil ou difícil. Em Gaza, ataques israelenses resultaram em mortes, incluindo uma mãe e sua filha, em um ataque que atingiu um prédio residencial. Além disso, o Iraque transportou dois milhões de barris de petróleo através do Estreito de Ormuz, sua primeira operação desse tipo em décadas, enquanto Israel realizou um exercício militar com o Azerbaijão e a Turquia. O Irã também afirmou ter atacado uma instalação da Aramco em Riad, Arábia Saudita, usando mísseis balísticos e drones.", "economia": "A Agência Internacional de Energia (IEA) anunciou a liberação de 325 milhões de barris de petróleo das reservas dos membros, uma medida destinada a controlar os preços do combustível. O G7 decidiu liberar até 100 milhões de barris de petróleo e diesel para tentar conter os preços, além de planejar medidas para reduzir os custos de refino e transporte. O Goldman Sachs projeta que a dívida pública no Brasil aumentará para 86,9% do PIB em 2027, a partir de 83,1% em 2026, trazendo desafios econômicos para o próximo governo. A Petrobras atingiu um valor de mercado recorde de R$ 700,08 bilhões após a divulgação de uma nova descoberta de petróleo na Bacia da Foz do Amazonas. O Brasil enfrenta uma crise de moradia, resultado da construção excessiva na década de 2000, que levou à falência de várias empresas de construção civil e contribuiu para o déficit de moradias atuais. A China iniciou uma investigação antidumping sobre exportações europeias de p-nitroclorobenzeno, um insumo usado em corantes, produtos farmacêuticos, pesticidas e pigmentos, após reclamação da indústria local. O Reino Unido está sendo pressionado a alinhar-se mais com a política comercial da União Europeia em relação ao comércio de veículos elétricos chineses, para evitar tratamento discriminatório sob as regras propostas 'Feitas na Europa' da UE.", "tecnologia": "Um drone desenvolvido em colaboração entre os Estados Unidos e Taiwan foi recentemente apresentado, demonstrando avanços em tecnologia aérea não-tripulada. Paralelamente, Taiwan e o Reino Unido assinaram um acordo em ciência e tecnologia para colaborar em três projetos específicos, embora os detalhes desses projetos não sejam divulgados. O Smithsonian está explorando a utilização de inteligência artificial para melhorar a compreensão histórica, enquanto a OpenAI enfrenta críticas internas, com um ex-líder de segurança renunciando e expressando preocupações sobre a segurança das tecnologias avançadas. Em relação à segurança digital, um juiz federal decidiu que um agente de sheriff violou os direitos da quarta emenda de uma mulher ao usar o Flock sem um mandado. Além disso, a Amazon anunciou que não usará mais acordos de não-divulgação (NDAs) relacionados a seus centros de dados, em resposta a suspeitas generalizadas sobre as práticas da empresa.", "ciencia": "Novas pesquisas em ciência abrangem desde a saúde até a astronomia. Um estudo publicado no Phys.org destaca que a sensação de segurança em um grupo pode ajudar dissidentes a expressar suas opiniões com mais detalhes e persuasividade, potencialmente influenciando decisões organizacionais. Em outra pesquisa, cientistas da Universidade da Flórida Meridional estão utilizando novas tecnologias de imagens, como drones e câmeras próximas ao leito marinho, para monitorar mudanças em corais, melhorando a compreensão das alterações climáticas. Além disso, pesquisadores do Phys.org descobriram que os calamares têm células pilares distribuídas por todo o corpo, semelhantes às células pilares humanas, oferecendo novas perspectivas sobre a audição humana. Outros estudos abordam a via láctea, com novas simulações sugerindo que ela pode ter começado como milhares de pequenas galáxias, e a supercondutividade, com pesquisas demonstrando que flutuações quânticas no espaço vazio podem fortalecer a supercondutividade, aumentando a temperatura de transição de um material ultracósmico em até 5,4°C.", "cultura": "Um tradutor de 'Cidade Fantasma' ganhou um prêmio literário na Itália. A Semana da Moda de Paris iluminou a Cidade-Luz, com passarelas e locais de desfile acesos para celebrar a moda. O escritor francês Emmanuel Carrère participou de uma conversa no Malba sobre seu livro 'Koljós' e seu processo criativo, mencionando a influência de 'Koljós', de Mariana Enriquez. A Rádio MEC estreou a série 'Eu Gosto de Música', apresentada por Ruy Castro, com quatro episódios sobre samba, carnaval, bossa nova e jazz. O filme 'Minha Melhor Amiga', estrelado por Mônica Martelli e Ingrid Guimarães, arrecadou mais de 80 milhões de reais em menos de um mês nos cinemas. O filme 'Digger', dirigido por Guillermo Del Toro, foi defendido pelo diretor como ousado, ousado e complexo na cinematografia.", "sociedade": "Milhares de pessoas protestaram em várias cidades da Espanha contra a crise habitacional e a rejeição de medidas propostas pelo governo para proteger inquilinos, aumentar a proteção contra despejos e prorrogar contratos. As manifestações, que ocorreram em cerca de 50 cidades, refletem a crescente insatisfação com a política de habitação e a especulação imobiliária. Em Madri, milhares se juntaram aos protestos, que também se espalharam para outras cidades espanholas, levando a críticas às medidas do governo. A rejeição de decretos no Congresso espanhol contribuiu para a crise de moradia, com os preços de imóveis na Espanha aumentando 12,2% em um ano, conforme dados oficiais.", "meio_ambiente": "Bangcoc está em estado de emergência devido às inundações que já causaram 40 mortes e afetaram todos os 50 distritos da cidade. A precipitação rápida e intensa este ano levou a inundações em áreas extensas da capital tailandesa. Na Argentina, cientistas estão investigando o motivo pelo qual recém-nascidos de baleias estão morrendo em números inusitados ao longo da costa patagônica. Na América Central, o impacto devastador do El Niño está causando escassez de água e alimentos, agravada pelas mudanças climáticas, afetando milhares de famílias no Corredor Seco. No Brasil, uma baleia-jubarte foi encontrada morta à beira-mar em Mongaguá, no litoral sul de São Paulo, levando a uma necropsia. No âmbito do investimento climático na América Latina, o valor dobrou entre 2020 e 2024, mas a quantidade de recursos destinados a combustíveis fósseis superou o investimento em fontes de energia limpa. Além disso, obras de infraestrutura estão em andamento em várias localidades, como a renovação da rede pluvial na Cidade de Buenos Aires e a pavimentação de uma rodovia provincial em Córdoba, com a construção de um túnel em La Rioja.", "direitos_humanos": "O Tennessee recentemente enfrentou uma falha na execução de Christa Pike, que sobreviveu a duas doses letais de pentobarbital. A sobrevivente, agora inconsciente e intubada em um hospital de Nashville, se encontra em estado crítico. Em resposta ao incidente, o governador do estado anunciou a suspensão de todas as execuções restantes de 2026. Em outro desenvolvimento, a República Democrática do Congo registrou 4.000 mortes por Ebola, superando a marca de 4.000 vítimas desde o início da epidemia em 15 de maio. Além disso, a cidade ucraniana de Oleshky, ocupada pelas tropas russas, enfrenta escassezes críticas de alimentos e medicamentos, com a população diminuindo drasticamente. Estes eventos refletem a complexidade e a gravidade dos desafios aos direitos humanos em diferentes partes do mundo."}, "resumo_do_dia": {"politica_nacional": [{"id": 193698, "titulo": "Datafolha: Benedita tem 26% para o Senado no RJ; Portinho marca 19%, e Jordy, 18%", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/datafolha-benedita-tem-26-para-o-senado-no-rj-portinho-marca-19-e-jordy-18.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-03T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada federal Benedita da Silva lidera a disputa pelo Senado no Rio de Janeiro com 26% das intenções de voto, de acordo com uma pesquisa do Datafolha divulgada no sábado (3). Portinho tem 19% e Jordy, 18% das intenções de voto.", "titulo_pt": "Benedita lidera com 26% nas intenções de voto para o Senado no RJ; Portinho e Jordy atrás", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 193699, "titulo": "Presidente do TSE diz não haver ameaça internacional ou do crime organizado nas eleições", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/presidente-do-tse-diz-nao-haver-ameaca-internacional-ou-do-crime-organizado-nas-eleicoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-03T21:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do TSE, ministro Kassio Nunes Marques, afirmou que as eleições não enfrentam ameaças concretas de natureza internacional ou de crime organizado.", "titulo_pt": "Presidente do TSE afirma que eleições não estão sob ameaça", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 193700, "titulo": "Datafolha: Senado em MG tem Marília com 21%, Viana, 19%, Sávio, 17%, e Aécio, 13%", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/datafolha-senado-em-mg-tem-marilia-com-21-viana-19-savio-17-e-aecio-13.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-03T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ex-prefeita de Contagem Marília Campos lidera com 21% dos votos válidos para o Senado em Minas Gerais, seguida por Carlos Viana com 19%, Domingos Sávio com 17% e Aécio Neves com 13%. A pesquisa Datafolha foi divulgada neste sábado (3).", "titulo_pt": "Datafolha: Marília com 21%, Viana com 19%, Sávio com 17% e Aécio com 13% para o senado em MG", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 193701, "titulo": "Datafolha: Lula tem 45% e Flávio Bolsonaro, 42% em votos válidos, com empate técnico na véspera do 1º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/datafolha-lula-tem-45-e-flavio-bolsonaro-42-em-votos-validos-na-vespera-do-1o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-03T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na véspera do primeiro turno da eleição deste ano, a pesquisa do Datafolha mostrou que Lula (PT) tem 45% das intenções de votos válidos, enquanto Flávio Bolsonaro (PL) tem 42%, resultando em um empate técnico. Em comparação com a pesquisa anterior, divulgada na quinta-feira, Lula manteve 45% e Bolsonaro aumentou para 42%.", "titulo_pt": "Datafolha: lula e Flávio Bolsonaro empatam tecnicamente com 45% e 42% dos votos válidos, respectivamente, no dia anterior ao 1º turno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 193702, "titulo": "Datafolha: Michelle Bolsonaro tem 30% para Senado no DF, e Bia Kicis marca 24%", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/datafolha-michelle-bolsonaro-lidera-com-30-para-senado-no-df-e-bia-kicis-tem-24.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-03T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha indica que Michelle Bolsonaro tem 30% das intenções de voto para o Senado no Distrito Federal, enquanto Bia Kicis tem 24%. Há duas vagas para o Senado em disputa no DF.", "titulo_pt": "Datafolha: michelle Bolsonaro lidera com 30% para Senado no DF, seguida por Bia Kicis com 24%", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 193723, "titulo": "Datafolha, 1º turno - votos válidos: Lula, 45%; Flávio Bolsonaro, 42%; Caiado, 4%; Renan, 3%; Cury, 3%; Zema, 1%", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/10/03/datafolha-presidente-3-outubro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-03T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha divulgada neste sábado (3) indica que, no primeiro turno das eleições presidenciais, Lula lidera com 45% dos votos válidos, seguido por Flávio Bolsonaro com 42%. Ronaldo Caiado, Renan Santos, Augusto Cury e Romeu Zema obtiveram 4%, 3%, 3% e 1% dos votos válidos, respectivamente.", "titulo_pt": "Datafolha, 1º turno - votos válidos: lula, 45%; Flávio Bolsonaro, 42%; Caiado, 4%; Renan, 3%; Cury, 3%; Zema, 1%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [{"titulo": "Quem são todos os candidatos a deputado federal pelo Ceará nas eleições 2026", "sumario": "Haverá 22 candidatos a deputado federal a serem eleitos pelo estado do Ceará através de um processo com cerca de 7 milhões de eleitores. O Ceará terá 46 candidatos a deputado estadual nas eleições de 4 de outubro. Cid Gomes está concorrendo à reeleição ao lado de sete outros políticos pelo estado do Ceará nas eleições de 2026.", "artigos": [{"id": 194024, "titulo": "Quem são todos os candidatos a deputado federal pelo Ceará (CE) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-todos-os-candidatos-a-deputado-federal-pelo-ceara-ce-nas-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-10-03T21:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Haverá 22 candidatos a deputado federal a serem eleitos pelo estado do Ceará através de um processo com cerca de 7 milhões de eleitores.", "titulo_pt": "Quem são todos os candidatos a deputado federal pelo Ceará nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 194025, "titulo": "Quem são todos os candidatos a deputado estadual pelo Ceará (CE) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-todos-os-candidatos-a-deputado-estadual-pelo-ceara-ce-nas-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-10-03T21:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ceará terá 46 candidatos a deputado estadual nas eleições de 4 de outubro. Quase 7 milhões de eleitores participarão do processo de votação.", "titulo_pt": "Quem são todos os candidatos a deputado estadual pelo Ceará nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 194026, "titulo": "Quem são todos os candidatos ao Senado pelo Ceará (CE) nas eleições de 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-todos-os-candidatos-ao-senado-pelo-ceara-ce-nas-eleicoes-de-2026", "fonte_id": "jota", "data_pub": "2026-10-03T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cid Gomes está concorrendo à reeleiç 2026-10-03T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quatro candidatos — Derrite, Marina, Tebet e André do Prado — estão empatados na disputa pelo Senado em São Paulo, com apenas três pontos percentuais de separação entre eles. Esta é a primeira pesquisa após a saída de Ricardo Salles da corrida eleitoral.", "titulo_pt": "Derrite, Marina, Tebet e André do Prado empatam na disputa pelo Senado em SP", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 193921, "titulo": "El riesgo país superó los 650 puntos: las razones detrás de la escalada que lo llevaron a un nuevo máximo del año", "url": "https://www.lanacion.com.ar/economia/el-riesgo-pais-supero-los-650-puntos-las-razones-detras-de-la-escalada-que-lo-llevaron-a-un-nuevo-nid03102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-03T21:18:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O indicador de risco país atingiu um novo máximo anual, superando 650 pontos. As razões para esse aumento incluem taxas de juros externas em níveis recordes, a liquidação em massa de títulos emergentes e maiores incertezas domésticas relacionadas ao rumo político e à atividade econômica.", "titulo_pt": "O risco país superou 650 pontos: as razões para a escalada que o levaram a um novo máximo do ano", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 193870, "titulo": "Bessent diz que indústria de IA precisa assumir seus riscos e encontrar soluções", "url": "https://www.infomoney.com.br/mundo/bessent-diz-que-industria-de-ia-precisa-assumir-seus-riscos-e-encontrar-solucoes/", "fonte_id": "infomoney", "data_pub": "2026-10-03T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Secretário do Tesouro dos EUA criticou os alertas de figuras importantes da inteligência artificial, afirmando que a indústria precisa assumir seus riscos e encontrar soluções.", "titulo_pt": "Bessent diz que indústria de IA precisa assumir seus riscos e encontrar soluções", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 193871, "titulo": "Quaest: Celina tem 53% dos votos válidos no DF; Grass aparece com 32%", "url": "https://www.infomoney.com.br/politica/quaest-celina-tem-53-dos-votos-validos-no-df-grass-aparece-com-32/", "fonte_id": "infomoney", "data_pub": "2026-10-03T20:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A governadora Celina Leão lidera com 53% dos votos válidos no Distrito Federal, enquanto Grass obteve 32%. A margem é suficiente para ela vencer no primeiro turno.", "titulo_pt": "Celina tem 53% dos votos válidos no DF; Grass aparece com 32%", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 193872, "titulo": "Quaest: Cleitinho tem 54% dos votos válidos em MG; Patrus aparece com 23%", "url": "https://www.infomoney.com.br/politica/quaest-cleitinho-tem-54-dos-votos-validos-em-mg-patrus-aparece-com-23/", "fonte_id": "infomoney", "data_pub": "2026-10-03T20:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A última pesquisa antes do primeiro turno mostra que Cleitinho tem 54% dos votos válidos em Minas Gerais, enquanto Patrus tem 23%.", "titulo_pt": "Quaest: cleitinho tem 54% dos votos válidos em MG; Patrus aparece com 23%", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 193888, "titulo": "Por que a Espanha, que construía casas demais, vive hoje uma grave crise de moradia", "url": "https://www.bbc.com/portuguese/articles/c3vgygl0r9v2o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-03T19:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A crise financeira de 2008 levou à falência de várias empresas de construção civil na Espanha, contribuindo para o déficit de moradias atuais. O aumento da população e o crescimento do aluguel para turismo também são fatores importantes.", "titulo_pt": "Por que a Espanha, que construía casas demais, enfrenta hoje uma grave crise de moradia", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 193754, "titulo": "Link School of Business investe R$ 500 mil em cinco startups de inteligência artificial", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/link-school-of-business-investe-r-500-mil-em-cinco-startups-de-inteligencia-artificial.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-03T18:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Link School of Business, uma faculdade especializada em formar empreendedores, investiu R$ 500 mil em cinco startups de inteligência artificial, com cada startup recebendo R$ 100 mil. Cada empresa cedeu 5% de sua participação para a instituição de ensino.", "titulo_pt": "Link School of Business investe R$ 500 mil em cinco startups de inteligência artificial", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 193756, "titulo": "Jack Daniel's aposta em saborizar uísque para expandir mercado no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/jack-daniels-aposta-em-saborizar-uisque-para-expandir-mercado-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-03T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eduardo Ambrosio discute o papel do gelo no uísque Jack Daniel's e comemora a obtenção de um fornecedor de água gelada de qualidade. As conversas sobre mixologia ocorrem frequentemente no escritório da Brown-Forman, localizado na Vila Nova Conceição, em São Paulo.", "titulo_pt": "Jack Daniel's investe em saborização de uísque para ampliar mercado no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 192983, "titulo": "Flávio: STF está “dando canetada” a favor de Lula; Judiciário deve “ser consertado”", "url": "https://www.infomoney.com.br/politica/flavio-stf-e : "https://canaltech.com.br/carros/economia-por-que-alguns-carros-chineses-nao-tem-limpador-traseiro/", "fonte_id": "canaltech", "data_pub": "2026-10-03T20:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Embora os carros chineses sejam populares no Brasil e tenham dominado o mercado de vendas, alguns modelos não incluem limpador traseiro. A ausência desse recurso não é aleatória, mas resulta de considerações técnicas e estratégicas de produção.", "titulo_pt": "Por que alguns carros chineses não têm limpador traseiro?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 193879, "titulo": "Empresas de IA deveriam ter regras de usinas nucleares, diz ex-OpenAI", "url": "https://olhardigital.com.br/2026/10/03/pro/empresas-de-ia-deveriam-ter-regras-de-usinas-nucleares-diz-ex-openai/", "fonte_id": "olhar_digital", "data_pub": "2026-10-03T19:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ex-OpenAI David Robinson acredita que a indústria de inteligência artificial precisa de salvaguardas rigorosas, comparando-as às regras de usinas nucleares.", "titulo_pt": "Ex-openai: empresas de IA deveriam ter regras de usinas nucleares", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 194090, "titulo": "Milt Windler, NASA flight director who helped save Apollo 13, dies at 94", "url": "https://arstechnica.com/space/2026/10/milt-windler-nasa-flight-director-who-helped-save-apollo-13-dies-at-94/", "fonte_id": "ars_technica", "data_pub": "2026-10-03T19:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milt Windler, um diretor de voo da NASA que ajudou a salvar a missão Apollo 13, faleceu aos 94 anos. A frase 'estamos escrevendo história' resume parte de sua contribuição.", "titulo_pt": "Milt Windler, diretor de voo da NASA que ajudou a salvar Apollo 13, morre aos 94 anos", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 194091, "titulo": "Federal judge calls Flock ‘indiscriminate 882, "titulo": "Brasil tem 158,7 milhões de eleitores aptos para votar em 2026; mulheres são maioria", "url": "https://olhardigital.com.br/2026/10/03/pro/brasil-tem-1587-milhoes-de-eleitores-aptos-para-votar-em-2026-mulheres-sao-maioria/", "fonte_id": "olhar_digital", "data_pub": "2026-10-03T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil possui 158,7 milhões de eleitores aptos para votar em 2026, com as mulheres representando a maioria. Estes dados incluem informações sobre idade, escolaridade, biometria, nome social, acessibilidade e eleitores brasileiros no exterior.", "titulo_pt": "Brasil tem 158,7 milhões de eleitores aptos para votar em 2026; mulheres são maioria", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 193883, "titulo": "GTA VI, Resident Evil e mais: os jogos de PS5 que você precisa ter no seu radar", "url": "https://olhardigital.com.br/2026/10/03/reviews/gta-vi-resident-evil-e-mais-os-jogos-de-ps5-que-voce-precisa-ter-no-seu-radar/", "fonte_id": "olhar_digital", "data_pub": "2026-10-03T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O catálogo do PlayStation 5 conta com vários jogos aguardados, incluindo Resident Evil Requiem. A lista inclui títulos como GTA VI e outros que estão em destaque na Amazon.", "titulo_pt": "GTA VI, Resident Evil e mais: os jogos de PS5 que você precisa ter no seu radar", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 194092, "titulo": "Amazon responds to data center backlash, says it no longer uses NDAs", "url": "https://techcrunch.com/2026/10/03/amazon-responds-to-data-center-backlash-says-it-no-longer-uses-ndas/", "fonte_id": "techcrunch", "data_pub": "2026-10-03T18:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO do Amazon Web Services tentou contrapor a suspeita generalizada sobre os centros de dados da empresa. Amazon anunciou que não usa mais acordos de não-divulgação (NDAs) relacionados a seus centros de dados.", "titulo_pt": "Amazon responde a críticas sobre centros de dados e diz não usar mais NDAs", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 193877, "titulo": "A mentira de bilhões: relembre o caso Theranos, escândalo que volta à tona em novo filme", "url": "https://canaltech.com.br/entretenimento/relembre-caso-theranos-que-vai-virar-filme/", "fonte_id": "canaltech", "data_pub": "2026-10-03T18:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um escândalo envolvendo a empresária Elizabeth Holmes e sua empresa Theranos, que envolvia uma fraude bilionária, foi revisitado no documentário 'You Can See Everything', lançado recentemente. Holmes foi condenada à prisão em 2022.", "titulo_pt": "A mentira de bilhões: relembre o caso Theranos", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}], "tecnologia__eventos": [], "ciencia": [{"id": 194096, "titulo": "Feeling secure in a group may help dissenters make stronger arguments", "url": "https://phys.org/news/2026-09-group-dissenters-stronger-arguments.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quando todos em uma reunião expressam a mesma opinião, uma organização pode ignorar sinais de alerta importantes e novas ideias. Segundo uma equipe de pesquisa da KAIST, quando os membros se sentem seguramente aceitos em seu grupo, eles podem expressar opiniões contrárias com mais detalhes e persuasividade, aumentando a probabilidade de outras pessoas utilizarem essas opiniões na tomada de decisões.", "titulo_pt": "Sentir-se seguro em um grupo pode ajudar os dissidentes a apresentarem argumentos mais fortes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 194097, "titulo": "How can the same El Niño cause drought in one part of the world and floods in another?", "url": "https://phys.org/news/2026-09-el-nio-drought-world.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Pacífico está aquecendo de forma anormal, e o El Niño atual já superou marcas anteriores. Meteorologistas prevêem que o fenômeno se intensifique ainda mais antes de atingir seu pico usual em dezembro.", "titulo_pt": "Como o mesmo El Niño pode causar secas em uma região e inundações em outra?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 194098, "titulo": "Today's emissions choices could limit Antarctic ice loss and sea-level rise for coastal communities", "url": "https://phys.org/news/2026-10-today-emissions-choices-limit-antarctic.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A redução das emissões de gases de efeito estufa atualmente pode limitar a perda de gelo na Antártica neste século e reduzir o aumento do nível do mar que enfrentam as comunidades costeiras, de acordo com novos estudos.", "titulo_pt": "As escolhas atuais de emissões podem limitar a perda de gelo na antártica e o aumento do nível do mar para comunidades costeiras", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 194099, "titulo": "New reactor design improves plastic feedstock synthesis using oxygen and electricity", "url": "https://phys.org/news/2026-09-reactor-plastic-feedstock-synthesis-oxygen.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T19:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um fator crucial que pode determinar o sucesso ou fracasso de uma reação química foi identificado na área imediata dos eletrodos. Um novo design de reator foi desenvolvido para a síntese de matéria-prima plástica usando oxigênio e eletricidade.", "titulo_pt": "Novo design de reator melhora a síntese de matéria-prima plástica usando oxigênio e eletricidade", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 193745, "titulo": "Arquivos dos EUA sobre óvnis reúnem muitas fotos borradas e relatos não confirmados", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/arquivos-dos-eua-sobre-ovnis-reunem-muitas-fotos-borradas-e-relatos-nao-confirmados.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-03T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os arquivos dos EUA sobre ovnis contêm muitas fotos borradas e relatos não confirmados. Caçadores de alienígenas americanos estão agora à frente desse material.", "titulo_pt": "Arquivos dos EUA sobre ovnis reúnem muitas fotos borradas e relatos não confirmados", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 193625, "titulo": "Recovery after intimate partner violence: New study reveals what works", "url": "https://phys.org/news/2026-09-recovery-intimate-partner-violence-reveals.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos recentes exploram os métodos de recuperação após a violência doméstica. Anualmente, mais de um milhão de pessoas com 16 anos ou mais no Países Baixos sofrem violência doméstica, muitas das quais são cometidas por parceiros atuais ou antigos.", "titulo_pt": "Recoveria após violência doméstica: novo estudo revela o que funciona", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 193822, "titulo": "Índia está entre os países com mais obesos, mas poucos querem as 'canetas emagrecedoras'", "url": "https://exame.com/invest/mercados/india-esta-entre-os-paises-com-mais-obesos-mas-poucos-querem-as-canetas-emagrecedoras/", "fonte_id": "exame", "data_pub": "2026-10-03T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Índia tem um alto número de obesos, mas a produção de medicamentos baratos, como o GLP-1, não está gerando um mercado significativo.", "titulo_pt": "Índia tem alto número de obesos, mas medicamentos baratos não são suficientes para criar mercado", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 193626, "titulo": "Reading hidden topology in light, even when energy leaks away", "url": "https://phys.org/news/2026-10-hidden-topology-energy-leaks.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Físicos descobriram que alguns materiais e dispositivos transportam propriedades topológicas semelhantes a nósos em ondas, que permanecem inalteradas mesmo diante de pequenas imperfeições. Essa robustez faz da topologia uma ideia central em física moderna, prometendo eletrônicos, ópticos e dispositivos quânticos que toleram defeitos e ruídos.", "titulo_pt": "Lendo a topologia oculta na luz, mesmo quando a energia se esvai", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 193627, "titulo": "Q&A: An Earth-like planet with two suns?", "url": "https://phys.org/news/2026-09-qa-earth-planet-suns.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um sistema estelar próximo com duas estrelas poderia suportar um planeta do tamanho da Terra em uma região onde a água líquida poderia existir, de acordo com um novo artigo que examina as dinâmicas do sistema.", "titulo_pt": "Perguntas e respostas: um planeta semelhante à terra com dois 'somas'?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 193628, "titulo": "Visible light does not speed up water evaporation, rigorous experiments suggest", "url": "https://phys.org/news/2026-10-visible-evaporation-rigorous.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Experiências recentes com hidrogéis e gotas d'água sugerem que a exposição à luz visível pode acelerar a evaporação da água sem aquecê-la. No entanto, provas diretas de que a luz age diretamente na água são escassas.", "titulo_pt": "A luz visível não acelera a evaporação da água, sugere estudos rigorosos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 193305, "titulo": "Departure comes as the state investigates what went wrong during Pike's lethal injection.", "url": "https://www.axios.com/local/nashville/2026/10/03/christa-pike-execution-tennessee-prison-chief-resigns", "fonte_id": "axios", "data_pub": "2026-10-03T16:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe da prisão de Tennessee, Frank Strada, apresentou sua demissão poucos dias após um fracasso no processo de execução de Christa Pike, uma condenada à morte. Strada se comprometeu a colaborar com a investigação independente do incidente.", "titulo_pt": "Demissão ocorre após falha no processo de execução de christa Pike", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 193629, "titulo": "When the atmosphere slows the Earth: Uncovering a subtle signal of climate change", "url": "https://phys.org/news/2026-10-atmosphere-earth-uncovering-subtle-climate.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A circulação atmosférica controla o clima e o tempo, mas também transporta momentum angular. Sob longo prazo, mudanças climáticas podem afetar a rotação da Terra alterando momentaneamente sua velocidade de rotação.", "titulo_pt": "Quando a atmosfera diminui a velocidade da terra: descobrindo um sutil sinal do aquecimento global", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 193630, "titulo": "New imaging technologies offer a clearer view of coral reef change", "url": "https://phys.org/news/2026-09-imaging-technologies-clearer-view-coral.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade da Flórida Meridional estão utilizando novas tecnologias de imagens, como drones e câmeras próximas ao leito marinho, para transformar a maneira como os cientistas observam corais e medem mudanças que eram difíceis, caras ou demoradas de documentar.", "titulo_pt": "Novas tecnologias de imagens oferecem uma visão mais clara do mudança nos recifes de corais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 193631, "titulo": "Newly discovered hair cells on squid may offer clues to understanding hearing loss in humans", "url": "https://phys.org/news/2026-10-newly-hair-cells-squid-clues.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram que os calamares têm centenas de células pilares distribuídas por toda a superfície do corpo, semelhantes às células pilares profundamente localizadas no ouvido humano que permitem a audição. Esta descoberta pode fornecer aos pesquisadores uma oportunidade única para entender como os humanos usam e perdem a audição.", "titulo_pt": "Novas células pilares descobertas em calamar podem oferecer pistas sobre perda auditiva humana", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 192737, "titulo": "Pesquisa sobre câncer premiada com Nobel de Medicina há cem anos acabou refutada", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/pesquisa-sobre-cancer-premiada-com-nobel-de-medicina-ha-cem-anos-acabou-refutada.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-03T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo premiado com o Nobel de Medicina há um século se tornou controverso, comprovando-se que suas conclusões eram incorretas. No entanto, a pesquisadora ainda considera que o trabalho pode ser visto como um passo importante para o entendimento do câncer.", "titulo_pt": "Pesquisa sobre câncer premiada com Nobel há um século foi refutada", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 193632, "titulo": "A short breath extends the mating ontra crise imobiliária", "url": "https://www.infomoney.com.br/mundo/dezenas-de-milhares-de-pessoas-protestam-em-toda-a-espanha-contra-crise-imobiliaria/", "fonte_id": "infomoney", "data_pub": "2026-10-03T15:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dezenas de milhares de pessoas estão protestando em todo o país espanhol contra a crise imobiliária. As medidas do governo estão sendo rejeitadas pela oposição.", "titulo_pt": "Dezenas de milhares de pessoas protestam em toda a Espanha contra crise imobiliária", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 192893, "titulo": "Crise de moradia leva milhares às ruas após derrota de Sánchez na Espanha", "url": "https://veja.abril.com.br/mundo/crise-de-moradia-leva-milhares-as-ruas-apos-derrota-de-sanchez-na-espanha/", "fonte_id": "veja", "data_pub": "2026-10-03T15:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Congresso espanhol rejeitou medidas para proteção contra despejos e prorrogação de contratos, contribuindo para uma crise de moradia que levou milhares de pessoas às ruas após a derrota do governo Sánchez. Os imóveis na Espanha aumentaram 12,2% em um ano, segundo dados oficiais.", "titulo_pt": "Crise de moradia leva milhares às ruas após derrota de Sánchez na Espanha", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 193107, "titulo": "Capturan a un hombre por homicidio calificado en Saltos del Laja: se registró en julio de 2026", "url": "https://www.latercera.com/nacional/noticia/pdi-detiene-a-un-hombre-por-homicidio-en-saltos-del-laja/", "fonte_id": "la_tercera", "data_pub": "2026-10-03T15:18:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um homem foi preso por homicídio calificado em julho de 2026. O crime ocorreu no dia 29 de julho e a polícia localizou o suspeito escondido em Chillancito após investigações.", "titulo_pt": "Homem é preso por homicídio calificado em julho de 2026 em Saltos do Laja", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 192961, "titulo": "Milhares protestam contra crise habitacional em 50 cidades da Espanha após Congresso rejeitar medidas", "url": "https://www.brasildefato.com.br/2026/10/03/milhares-protestam-contra-crise-habitacional-em-50-cidades-da-espanha-apos-congresso-rejeitar-medidas/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-03T14:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas protestaram em cerca de 50 cidades da Espanha contra a crise habitacional e a especulação imobiliária. O Congresso espanhol rejeitou um pacote de medidas proposto pelo governo de Pedro Sánchez.", "titulo_pt": "Milhares protestam contra crise habitacional em 50 cidades da Espanha após rejeição de medidas pelo Congresso", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 193113, "titulo": "Protestas por la vivienda en España tras rechazo de dos decretos del Gobierno en el Congreso", "url": "https://www.latercera.com/mundo/noticia/protestas-por-la-vivienda-en-espana-tras-rechazo-de-dos-decretos-del-gobierno-en-el-congreso/", "fonte_id": "la_tercera", "data_pub": "2026-10-03T14:25:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Protestas estão previstas em mais de 50 cidades espanholas para exigir mudanças nas políticas de habitação e maior proteção para inquilinos. As manifestações incluem chamados a uma greve geral e críticas aos preços de compra e aluguel.", "titulo_pt": "Protestos por moradia em Espanha após rejeição de dois decretos do governo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 193314, "titulo": "Thousands protest in Madrid and across Spain after parliament rejects tenant protections", "url": "https://www.lemonde.fr/en/international/article/2026/10/03/thousands-protest-in-madrid-and-across-spain-after-parliament-rejects-tenant-protections_6758216_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-03T13:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas protestaram em Madri e em todo o Espanha após o parlamento rejeitar uma nova lei que prometia maior assistência para inquilinos. A rejeição ocorreu após uma idosa de 87 anos ser expulsa de sua casa devido a um aumento de 275% no aluguel.", "titulo_pt": "Milhares protestam em madri e Espanha após rejeição de lei de proteção aos inquilinos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 193531, "titulo": "Slow-moving wave threatens more damage to US West Coast", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/04/2003865345", "fonte_id": "taipei_times", "data_pub": "2026-10-04T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tsunami lento ameaça causar mais danos à costa oeste dos Estados Unidos. Os especialistas estão monitorando a situação com atenção, pois a onda pode levar algum tempo para atingir o litoral americano.", "titulo_pt": "Onslaught lento ameaça mais danos à costa oeste dos EUA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 193798, "titulo": "Baleia-jubarte é encontrada morta à beira-mar em praia de Mongaguá", "url": "https://www.metropoles.com/sao-paulo/baleia-jubarte-morta-praia-sp", "fonte_id": "metropoles", "data_pub": "2026-10-03T21:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma baleia-jubarte foi encontrada morta à beira-mar em uma praia de Mongaguá, no litoral sul de São Paulo. O secretário de Agricultura e Meio Ambiente acompanhou a necrópsia do animal.", "titulo_pt": "Baleia-jubarte é encontrada morta em praia de Mongaguá", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 193053, "titulo": "Chau anegamientos: terminó la megaobra en el norte de la Ciudad que promete enfrentar los efectos climáticos del Súper Niño", "url": "https://www.lanacion.com.ar/sociedad/chau-anegamientos-termino-la-megaobra-en-el-norte-de-la-ciudad-que-promete-enfrentar-los-efectos-nid30092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-03T16:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A obra de renovação da rede pluvial está concluída no norte da Cidade de Buenos Aires, entre as avenidas Figueroa Alcorta e Del Libertador. O projeto visa melhorar a qualidade de vida da população ao enfrentar os efeitos climáticos do Súper Niño.", "titulo_pt": "Fim dos anegamentos: termina a megaobra no norte da cidade que promete enfrentar os efeitos climáticos do Súper Niño", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 193054, "titulo": "25 km de ruta de montaña: avanza la megaobra serrana que busca cambiar para siempre el mapa del turismo en Córdoba", "url": "https://www.lanacion.com.ar/sociedad/25-km-de-ruta-de-montana-avanza-la-megaobra-serrana-que-busca-cambiar-para-siempre-el-mapa-del-nid23092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-03T16:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A pavimentação da rodovia provincial 28, com 25 km de extensão, está avançando e conectará os departamentos de Punilla e Pocho, promovendo o desenvolvimento produtivo e turístico no oeste da província de Córdoba.", "titulo_pt": "25 Km de rota de montanha: avanço da megaobra serrana que busca transformar o turismo no oeste de Córdoba", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 193055, "titulo": "Con explosivos y detonación dinamitaron una montaña en La Rioja: así avanza la megaobra de un túnel de 250 metros en la ruta nacional 75", "url": "https://www.lanacion.com.ar/sociedad/con-explosivos-y-detonacion-dinamitaron-una-montana-en-la-rioja-asi-avanza-la-megaobra-de-un-tunel-nid22092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-03T16:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma carga de explosivos foi detonada em uma montanha em La Rioja, Argentina, p ercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/10/investimento-climatico-dobra-na-america-latina-mas-fosseis-recebem-mais-que-energia-limpa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-03T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O investimento climático na América Latina e no Caribe dobrou de 2020 a 2024, passando de US$ 54 bilhões para US$ 108 bilhões. No entanto, a quantidade de recursos destinados a combustíveis fósseis na região é mais do que o dobro do investimento em fontes de energia limpa.", "titulo_pt": "Investimento climático dobra na América Latina, mas combustíveis fósseis recebem mais que energia limpa", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 193640, "titulo": "Scientists search for answers as baby whales wash up dead in Argentina", "url": "https://phys.org/news/2026-10-scientists-baby-whales-dead-argentina.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores em Argentina estão tentando descobrir o motivo pelo qual recém-nascidos de baleias estão morrendo em números inusitadamente altos ao longo da costa patagônica do país.", "titulo_pt": "Cientistas buscam respostas com recém-nascidos de baleias mortos na costa Argentina", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 193175, "titulo": "Bangkok at breaking point as floods turn streets into stagnant lakes", "url": "https://www.theguardian.com/world/2026/oct/03/bangkok-thailand-floods-breaking-point-stagnant-lakes", "fonte_id": "guardian_world", "data_pub": "2026-10-03T02:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bangcoc está em estado de emergência devido a inundações que resultaram em 40 mortes e afetaram todas as 50 distritos da cidade. A precipitação rápida e intensa este ano levou a inundações em áreas inteiras da capital tailandesa.", "titulo_pt": "Bangcoc a fDxDyP0.html", "fonte_id": "clarin", "data_pub": "2026-10-03T17:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Christa Pike encontra-se em estado crítico em um hospital de Nashville, inconsciente e intubada, após sobreviver a duas doses letais de pentobarbital. Seu estado é grave, com os braços hinchados, queimados e cheios de ampolas.", "titulo_pt": "Detalhes judiciais mostram que Christa Pike se encontra em estado crítico após sobreviver a uma execução fallida", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 193044, "titulo": "Identifican al agresor del vuelo de Flydubai y Emiratos Árabes ‌confirma que fue un ataque terrorista", "url": "https://www.lanacion.com.ar/el-mundo/identifican-al-agresor-del-vuelo-de-flydubai-y-emiratos-arabes-confirma-que-fue-un-ataque-terrorista-nid03102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-03T17:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As autoridades identificaram o agressor do voo da Flydubai e confirmaram que o incidente foi um ataque terrorista. A investigação também revelou o tipo de arma usada para ferir o piloto.", "titulo_pt": "Identificado agressor do voo da Flydubai e confirmado ataque terrorista", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 193112, "titulo": "Ministerio de la Mujer anuncia querella por femicidio en Renaico: es el quinto caso en La Araucanía registrado este año", "url": "https://www.latercera.com/nacional/noticia/ministerio-de-la-mujer-anuncia-querella-por-femicidio-en-renaico-es-el-quinto-caso-en-la-araucania-registrado-este-ano/", "fonte_id": "la_tercera", "data_pub": "2026-10-03T14:59:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A ministra de Mulheres anunciou uma nova querella por femicídio em Renaico, elevando o número de casos consumados neste ano no país para 29. Em resposta, uma sessão extraordinária do Circuito Intersectorial de Femicídio será realizada naquele
