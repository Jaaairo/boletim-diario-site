, "data_pub": "2026-08-11T08:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As chuvas retornam ao Sul do país, enquanto o ar seco causa calor em outras regiões. O fenômeno El Niño influencia esta dinâmica climática.", "titulo_pt": "Clima: chuvas no Sul e calor seco em partes do país", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 98258, "titulo": "Amazônia à beira do colapso: por que a Moratória da Soja deveria ser retomada", "url": "https://www.jota.info/opiniao-e-analise/artigos/amazonia-a-beira-do-colapso-por-que-a-moratoria-da-soja-deveria-ser-retomada", "fonte_id": "jota", "data_pub": "2026-08-11T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O instrumento da Moratória da Soja é essencial para preservar a Amazônia e o clima global. É tanto juridicamente permitido quanto necessário.", "titulo_pt": "Amazônia à beira do colapso: por que a Moratória da Soja deveria ser retomada", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 98501, "titulo": "Indonesian officials race to contain wildfires as dozens of schools shut", "url": "https://www.aljazeera.com/news/2026/8/11/indonesian-officials-race-to-contain-wildfires-as-dozens-of-schools-shut?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-11T08:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Funcionários indonésios estão trabalhando para conter incêndios florestais enquanto dezenas de escolas permanecem fechadas devido à qualidade do ar ruim. Aeronaves foram empregadas em operações de sowing de nuvens.", "titulo_pt": "Funcionários indonésios correm para conter focos de incêndio enquanto escolas são fechadas por conta da poluição", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 98091, "titulo": "El Niño pode reduzir produtividade da safra 2026/27, alerta secretário", "url": "https://www.cnnbrasil.com.br/agro/el-nino-pode-reduzir-produtividade-da-safra-2026-27-alerta-secretario/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-11T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O secretário Guilherme Campos alerta que o El Niño pode reduzir a produtividade da safra 2026/27. Ele destaca que os produtores já estão sobrecarregados com dívidas, juros altos e custos elevados, além do risco de aumento dos custos de proteção devido à demora na liberação de recursos para seguro.", "titulo_pt": "El Niño pode reduzir produtividade da safra 2026/27, alerta secretário", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 98261, "titulo": "Tempo rei: a força normativa do tempo no direito climático", "url": "https://www.jota.info/opiniao-e-analise/colunas/direito-e-clima/tempo-rei-a-forca-normativa-do-tempo-no-direito-climatico", "fonte_id": "jota", "data_pub": "2026-08-11T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dever de diligência dos países deve englobar a urgência das ações climáticas. Este texto discute o papel do tempo na responsabilidade legal internacional relacionada ao clima.", "titulo_pt": "Tempo rei: a força normativa do tempo no direito climático", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 98633, "titulo": "Climate change might hit N. Korea with 'complex security crisis'", "url": "https://www.koreaherald.com/article/10837778", "fonte_id": "korea_herald", "data_pub": "2026-08-11T07:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tempestades de calor, secas e chuvas intensas associadas ao aquecimento global podem levar a uma 'crise de segurança complexa' para o Norte da Coreia, afetando suprimentos alimentares, sistemas de saúde e até instalações militares, conforme alertou um pesquisador sul-coreano. O relatório destaca que aumento das temperaturas e frequência crescente desses eventos meteorológicos agravam a vulnerabilidade do país aos desastres naturais.", "titulo_pt": "Mudanças climáticas podem causar 'crise de segurança complexa' na Coreia do norte", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 98458, "titulo": "Spain’s Huelva blaze threatens homes, 800 evacuated amid severe drought", "url": "http://www.euronews.com/video/2026/08/11/spains-huelva-blaze-threatens-homes-800-evacuated-amid-severe-drought", "fonte_id": "euronews", "data_pub": "2026-08-11T06:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grande incêndio florestal na província de Huelva, Espanha, obrigou a evacuação de 800 pessoas e consumiu cerca de 20.000 hectares de terra. O fogo ocorre durante uma piora da crise de seca em toda a Europa.", "titulo_pt": "Chama em Huelva força 800 evacuações, queima 20.000 hectares no seco Espanha", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 98641, "titulo": "Heat wave, solar growth test Korea’s power strategy", "url": "https://www.koreaherald.com/article/10837610", "fonte_id": "korea_herald", "data_pub": "2026-08-11T06:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A onda de calor recorde na Coreia do Sul testou sua estratégia energética, enquanto o país busca atender às crescentes necessidades de eletricidade através da nuclear e das renováveis. A expansão rápida das instalações solares produz grande quantidade de energia durante o dia, desafiando a flexibilidade das usinas nucleares.", "titulo_pt": "Onada de calor e crescimento solar testam estratégia energética da Coreia do sul", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 98661, "titulo": "First 10 days of August rank as hottest on record", "url": "https://en.yna.co.kr/view/AEN20260811006600315", "fonte_id": "yonhap_news", "data_pub": "2026-08-11T05:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este ano, o verão na Coreia do Sul registrou os dias mais quentes dos primeiros 10 dias de agosto. A temperatura atingiu níveis recordes.", "titulo_pt": "Primeiras dez dias de agosto são os mais quentes da história na Coreia do sul", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 98555, "titulo": "Indonesia races to contain fires as haze spreads", "url": "https://www.japantimes.co.jp/news/2026/08/11/asia-pacific/indonesia-fires-haze/", "fonte_id": "japan_times", "data_pub": "2026-08-11T04:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Indonésia está correndo contra o tempo para conter incêndios devido ao aumento do período seco mais longo e severo este ano, causado pelo El Niño. O risco de estiagem, incêndios florestais e poluição do ar aumentou.", "titulo_pt": "Indonésia corre contra o tempo para conter fogo enquanto fuligem se espalha", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 98463, "titulo": "Hundreds more flights cancelled as Tropical Storm Dolphin causes flooding in eastern China", "url": "http://www.euronews.com/2026/08/11/hundreds-more-flights-cancelled-as-tropical-storm-dolphin-causes-flooding-in-eastern-china", "fonte_id": "euronews", "data_pub": "2026-08-11T04:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 900 voos foram cancelados nos aeroportos de Hongqiao e Pudong, em Shanghai, devido ao temporal Tropical Storm Dolphin. O número de voos cancelados dobrou em comparação com o dia anterior.", "titulo_pt": "Milhares de voos cancelados em shanghai devido à passagem do temporal Tropical Dolphin", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 98271, "titulo": "SEA suspende sesión clave de proyecto eléctrico en cordillera del Maule en medio de controversia por ranita del Pehuenche", "url": "https://www.latercera.com/nacional/noticia/sea-suspende-sesion-clave-de-proyecto-electrico-en-cordillera-del-maule-en-medio-de-controversia-por-ranita-del-pehuenche/", "fonte_id": "la_tercera", "data_pub": "2026-08-11T03:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A SEA (Superintendência do Ambiente) suspendeu uma sessão importante sobre um projeto elétrico na Cordillera del Maule, programada para esta segunda-feira e realizada de forma telemática. O estudo de impacto ambiental da iniciativa da Enel Generación Chile em San Clemente estava sendo discutido, mas enfrenta questionamentos relacionados aos seus possíveis efeitos sobre o ecossistema do Alto Maule.", "titulo_pt": "SEA suspende sessão crucial de projeto elétrico na cordillera del Maule em meio a controvérsias", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 97306, "titulo": "World’s seas hit hottest temperature on record for July", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/11/2003862281", "fonte_id": "taipei_times", "data_pub": "2026-08-11T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As águas do mundo registraram a temperatura mais alta para o mês de julho desde que os registros começaram. O recorde foi alcançado durante o mês passado, refletindo um aquecimento global crescente.", "titulo_pt": "Mares globais atingem temperatura recorde em julho", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 97843, "titulo": "Europe braces for another heatwave after record-breaking temperatures", "url": "https://www.aljazeera.com/news/2026/8/10/europe-braces-for-another-heatwave-after-record-breaking-temperatures?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-10T21:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Exames de calor extremo foram emitidos na Grã-Bretanha e França, com previsões de temperaturas chegando a 35 graus Celsius nesta semana.", "titulo_pt": "Europa se prepara para outra onda de calor após registros de temperatura recordes", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 97553, "titulo": "BH registra segundo incêndio após 10 dias na região da Serra do Gandarela", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/mg/bh-registra-segundo-incendio-apo s", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 98288, "titulo": "Condiciones de pacientes del Instituto Dr. José Horwitz Barak", "url": "https://www.ciperchile.cl/2026/08/10/condiciones-de-pacientes-del-instituto-dr-jose-horwitz-barak/?utm_source=rss&utm_medium=rss&utm_campaign=condiciones-de-pacientes-del-instituto-dr-jose-horwitz-barak", "fonte_id": "ciper_chile", "data_pub": "2026-08-11T02:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto trata das condições dos pacientes do Instituto Dr. José Horwitz Barak, mas não fornece detalhes adicionais sobre essas condições.", "titulo_pt": "Condições de pacientes do Instituto Dr. José Horwitz Barak", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 98561, "titulo": "Ukrainians recount torture and sexual abuse meted out in Russian prisons", "url": "https://www.japantimes.co.jp/news/2026/08/11/world/ukrainian-prisoners-abuse-russian-detention/", "fonte_id": "japan_times", "data_pub": "2026-08-11T02:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 95% dos prisioneiros ucranianos entrevistados relataram ter sofrido tortura ou tratamento cruel, de acordo com um funcionário da ONU. Esses relatos incluem abusos sexuais e outras formas de maltrato em prisões russas.", "titulo_pt": "Ucranianos relatam tortura e abuso sexual nas prisões russas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 98566, "titulo": "Torment of Afghan fathers as daughters deprived of education", "url": "https://www.japantimes.co.jp/news/2026/08/11/world/society/afghan-fathers-daughters-education/", "fonte_id": "japan_times", "data_pub": "2026-08-11T01:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa da ONU mostrou que 90% dos homens afegãos desejam que as filhas tenham acesso à escola secundária, e dois terços consideram que é uma obrigação religiosa dos pais apoiar a educação das filhas.", "titulo_pt": "Dile const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
