<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

<script>
const D = {"gerado_em": "23/10/2026 07:24", "stats": {"noticias_novas": 828, "resumos_gerados": 241}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Na véspera do segundo turno das eleições presidenciais, Jair Bolsonaro e Lula estão empatados com 50% dos votos válidos, conforme apontado por uma pesquisa do Datafolha. As principais notícias do dia incluem a liberação de funcionários para votar no domingo, a determinação judicial para varejistas ajustarem escalas e a campanha de Jair Bolsonaro que promete ampliar a irrigação agrícola no cerrado. O governo de São Paulo também solicitou R$ 70 milhões ao governo federal para o reassentamento de moradores da Favela do Moinho. Em um cenário de empate técnico, a reta final da campanha está marcada por acirramento das disputas e estratégias de influenciadores digitais, com Jair Bolsonaro prometendo aumentar a irrigação agrícola e Lula sendo elogiado por influenciadores. Além disso, a campanha de Jair Bolsonaro enfrenta investigações judiciais sobre a coordenação de seu 'Exército do Lula' nas redes sociais.", "mundo": "As tensões políticas e sociais aumentam em vários países do mundo. Na Ucrânia, a situação militar permanece instável, com o serviço de satélite Starlink ainda limitado, prejudicando as defesas aéreas. No Oriente Médio, a tensão se eleva com o presidente dos Estados Unidos, Donald Trump, sugerindo que pode se candidatar a um terceiro mandato em 2028, desafiando as regras constitucionais. Em Israel, os conflitos entre israelenses e palestinos se intensificam, com ataques a tiros e fechamentos de territórios, com a data próxima das eleições nacionais. Na Europa, a Grécia implementou uma lei que proíbe o acesso a redes sociais para crianças menores de 15 anos, enquanto a Itália enfrenta protestos de pescadores e agricultores devido a atrasos e escasezes de produtos. Na América do Sul, a economia brasileira enfrenta desafios, com a região de Nanuque, no interior de Minas Gerais, mostrando tendência de votar à direita, longe das grandes cidades.\n\nA geopolítica global enfrenta diversos desafios e tensões. A Rússia e os Estados Unidos buscam manter relações diplomáticas sem comprometer suas posições na Ucrânia, enquanto a guerra entre os dois países está agravando a fome mundial, conforme relatos da South China Morning Post. Em Israel, o primeiro-ministro Benjamin Netanyahu ordenou um lockdown total na Cisjordânia após um tiroteio que deixou cinco feridos, enquanto a França prepara-se para novas manifestações após reuniões entre o presidente Macron e representantes dos estudantes, informa a Al Jazeera. O Filipinas busca fortalecer suas relações com os Estados Unidos em meio à crise energética, o que poderia beneficiar interesses militares americanos, conforme relatado pelo South China Morning Post. Além disso, a Europa enfrenta um inverno com reservas de gás historicamente baixas, enquanto a guerra entre Estados Unidos e Irã ameaça a segurança global, de acordo com a Agência Internacional de Energia. A guerra na Ucrânia também afeta as rotas de grãos, com o milho caindo nas bolsas de Chicago devido a negociações diplomáticas entre os países envolvidos, informa a CNN Brasil.", "economia": "O preço do petróleo chegou a US$ 114 por barril, seu maior nível desde maio, refletindo preocupações sobre a sustentabilidade do boom da inteligência artificial (IA) que afetou as ações globais. O aumento do petróleo foi acompanhado por uma escalada da inflação no Japão, que atingiu 2% em setembro, pressionando o Banco do Japão a aumentar as taxas de juros. Além disso, o Conselho Monetário Nacional (CMN) e o Banco Central (BC) atualizaram as regras do Open Finance, focando em segurança, transparência e novas exigências para bancos e empresas. No Brasil, o Ibovespa está na sessão final antes do segundo turno das eleições presidenciais, o que aumentou a incerteza sobre o desempenho dos ativos no mercado. As compras de ouro por bancos centrais estão quatro vezes maiores do que a média pré-2022, com países diversificando a custódia das reservas em resposta a preocupações geopolíticas e à menor confiança no sistema liderado pelo dólar.", "tecnologia": "As tecnologias de inteligência artificial (IA) e semicondutores estão em destaque na indústria global. A Doosan Robotics está se concentrando em grandes fabricantes de automóveis e semicondutores, desenvolvendo sistemas com IA para tarefas fabris mais complexas, enquanto concorre com rivais chineses que estão reduzindo preços. A Samsung Electro-Mechanics (Semco) enfrenta prazos de entrega mais longos de capacitores multilayer ceramicos (MLCC) devido à alta demanda por servidores de IA, o que está beneficiando os fornecedores. A Lenovo está voltando ao mercado de IA com a entrega do Nvidia Vera Rubin NVL72 e expandindo sua fábrica nos Estados Unidos, com o objetivo de se tornar uma empresa nativa de IA com receita anual superior a 100 bilhões de dólares em dois anos. Além disso, a fusão proposta entre SpaceX e Tesla, liderada por Elon Musk, está sendo discutida, com a fusão resultando em uma empresa avaliada em aproximadamente 3,5 trilhões de dólares, tornando-se a maior transação corporativa da história.", "ciencia": "Um estudo recente, publicado na revista New Scientist, destaca a importância do ciúme em relacionamentos, explorando suas origens e impacto. Por outro lado, pesquisadores do Technion desenvolveram um método inovador que usa luz para controlar a movimentação ultra-rápida de elétrons em um microscópio de túnel de escaneamento, permitindo a visualização de átomos individuais e a captura do movimento de elétrons em escalas temporais extremamente curtas. Além disso, um novo estudo sugere que os padrões da íris podem ser usados como uma forma não invasiva para identificar indivíduos de uma espécie de rã-da-árvore na natureza, oferecendo uma alternativa segura e eficaz para métodos tradicionais. Outro destaque é a descoberta de que apenas 3% dos gelos da Terra, que desembarcam em lagos, oceanos ou pranchas de gelo, representam mais de metade da perda de gelo entre 2000 e 2019, destacando a urgência de ações climáticas para mitigar o impacto do aquecimento global.", "cultura": "A cultura global engloba diversos aspectos, desde arquitetura e ativismo ambiental até literatura e gastronomia. No Armenia, a Foster + Partners projetou dois arranha-céus conectados por pontes-jardim para o World Trade Center Yerevan, promovendo um ambiente urbano sustentável. Em contraste, na Inglaterra, milhares de crustáceos mortos foram encontrados, levando um pescador a se tornar um ativista contra a poluição marítima. A literatura também faz parte deste panorama: Ryu Murakami, um renomado escritor conhecido por explorar temas como violência e cultura jovem, faleceu. Shigeru Miyamoto, criador do Super Mario, foi o primeiro vencedor do prêmio de cultura relacionado a videojogos no Japão. No Brasil, a ministra Margareth Menezes defende que o financiamento público não exige fidelidade política, enquanto o retorno do BTS ao país após sete anos traz novidades sobre a turnê 'ARIRANG' e a trajetória do grupo.", "sociedade": "Um foragido acusado de feminicídio, Valdir Coimbra da Costa, conhecido como 'Mendigato', foi preso em uma academia de São Paulo. Ele foi identificado como o suspeito de matar e ocultar o corpo de sua ex-namorada, Cristiane dos Santos. Em outro caso, uma falsa nutricionista foi presa em um residencial de luxo no Rio de Janeiro, condenada a 16 anos de prisão por estelionato. Uma organização criminosa faturou R$ 1,3 milhão em 60 dias, abastecendo o Distrito Federal com drogas, usando empresas de fachada e armazenando substâncias ilícitas em propriedades em Samambaia e Sol Nascente. Além disso, o governo do Chile continua expandindo o apoio para crianças com deficiências, mas enfrenta a falta de professores capacitados para atender a demanda, conforme relatado por uma parlamentar. A participação de mais mulheres na política é vista como necessária para aprimorar as políticas públicas, conforme argumentado por um artigo que destaca a importância da diversidade e de lideranças eficazes.", "meio_ambiente": "Um estudo encomendado pelo Ministério de Clima, Energia e Meio Ambiente da Coreia do Sul revelou que os palitos de papel, amplamente promovidos como uma alternativa ecológica aos de plástico, podem ter um impacto ambiental maior do que os palitos de plástico convencional. Este achado reavivou a discussão sobre se a mudança de material realmente reduz o desperdício. Em outro desenvolvimento, flash floods inundaram áreas do sul-leste da Austrália em outubro, causando alagamentos graves que levaram a escolas a serem fechadas devido a chuvas históricas. Em um evento relacionado, torres de transmissão de energia foram derrubadas no Brasil devido a eventos climáticos extremos associados ao fenômeno El Niño. Além disso, o desmatamento na Amazônia Legal brasileira atingiu um valor recorde baixo, com 3,3 mil km² desmatados entre agosto de 2025 e julho de 2026, representando uma queda de 71% em comparação com 2022. No entanto, o Brasil não atingiu a meta climática de 2025, com as emissões de CO₂ equivalente em 2,06 bilhões de toneladas.", "direitos_humanos": "O Tribunal Penal Internacional, um tribunal da ONU que julga crimes contra o direito internacional, recebeu o Prêmio Sakharov do Parlamento Europeu por seu trabalho em prol da justiça e da democracia. Em contraste, a situação de direitos humanos em vários países e regiões continua alarmante. Na Albânia, a polícia tem relatos de violência contra menores. No Chile, há abusos sexuais e a redução das penas para os agressores de menores. Além disso, em Durban, na África do Sul, imigrantes são assassinados. Na Austrália, ações coletivas contra o Meta (anteriormente Facebook) denunciam a exposição a conteúdo prejudicial para menores. Por fim, a Corte Constitucional do Chile declarou o requerimento contra as RUF inadmissível, após a Suprema Corte confirmar falhas em decisões que beneficiaram abusadores sexuais."}, "resumo_do_dia": {"politica_nacional": [{"id": 220172, "titulo": "Na PUC-SP, Haddad comemora Datafolha e critica Flávio Bolsonaro", "url": "https://www.metropoles.com/sao-paulo/flavio-gabaritou-o-enem-do-crime-diz-haddad-em-discurso-na-puc-sp", "fonte_id": "metropoles", "data_pub": "2026-10-23T09:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Haddad criticou Flávio Bolsonaro, ex-ministro Lula, e comemorou um empate técnico em uma pesquisa presidencial realizada pela Datafolha.", "titulo_pt": "Haddad critica Flávio Bolsonaro e comemora Datafolha", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 220234, "titulo": "Eleições, debate na Globo, IPCA-15 e mais destaques desta sexta", "url": "https://www.infomoney.com.br/mercados/eleicoes-debate-globo-ipca-15-agenda-23102026/", "fonte_id": "infomoney", "data_pub": "2026-10-23T09:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As principais notícias que devem influenciar os mercados nesta sexta-feira (23) incluem eleições, um debate na Globo e a divulgação do IPCA-15.", "titulo_pt": "Eleições, debate na Globo, IPCA-15 e outros destaques desta sexta", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 220135, "titulo": "Fim da propaganda e null, "texto_pt": "O texto discute lições da história sobre como democracias podem se deteriorar internamente e destaca a importância do voto nas eleições presidenciais deste domingo.", "titulo_pt": "Lições da história sobre como democracias se deterioram internamente e por que o voto deste domingo importa", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 220083, "titulo": "Flávio Bolsonaro promete ampliar irrigação no cerrado, onde sistema faz rios minguarem", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/ambiente/2026/10/flavio-bolsonaro-promete-ampliar-irrigacao-no-cerrado-onde-sistema-faz-rios-minguarem.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-23T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro promete aumentar a irrigação agrícola caso seja eleito presidente, focando no Matopiba. A região enfrenta diminuição na vazão de rios e extinção de nascentes devido à atividade agrícola.", "titulo_pt": "Flávio Bolsonaro promete ampliar irrigação no cerrado, onde sistema faz rios minguarem", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 220188, "titulo": "Plano do PT tem exaltação de Janones a Lula e influencers contra Flávio", "url": "https://www.metropoles.com/colunas/ramiro-brites/pt-janones-lula-flavio", "fonte_id": "metropoles", "data_pub": "2026-10-23T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O plano digital do PT destaca elogios a Lula através de uma rede de influenciadores, enquanto Flávio é criticado por pequenos e médios influenciadores.", "titulo_pt": "Plano do PT exalta Lula e critica Flávio por influenciadores", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 220084, "titulo": "Proposta de Flávio Bolsonaro para transformar SUS em Einstein é fantasiosa e acena para privatizações, afirmam especialistas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https o_pt": "Uma nova empresa, apoiada pela Anthropic e pelo grupo de buyout britânico Hg, será responsável por orientar empresas sobre o uso de inteligência artificial.", "titulo_pt": "Anthropic fecha acordo para lançar consultoria europeia", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 220572, "titulo": "France is flashing euro crisis signals. This time, the fault lines are different", "url": "https://www.cnbc.com/2026/10/23/france-debt-euro-zone-contagion.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-23T09:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os custos de empréstimos da França aumentaram significativamente devido ao acúmulo de dívida e riscos políticos, levantando dúvidas sobre se o estresse financeiro poderia se espalhar pela zona do euro. As fissuras atuais são diferentes das anteriores.", "titulo_pt": "França está sinalizando crises do euro. As fissuras desta vez são diferentes", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 220110, "titulo": "Quem é o pai do Bolsa Família? Veja a história do programa que tirou o Brasil do Mapa da Fome", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/quem-e-o-pai-do-bolsa-familia-veja-a-historia-do-programa-que-tirou-o-brasil-do-mapa-da-fome.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-23T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Bolsa Família foi criado em outubro de 2003 durante o primeiro governo de Luiz Inácio Lula da Silva (PT). O programa, que não surgiu de uma única iniciativa, se tornou o maior programa social de combate à fome e à pobreza no Brasil após anos de desenvolvimento.", "titulo_pt": "Quem é o pai do Bolsa Família? Veja a história do programa que tirou o Brasil do Mapa da Fome", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 220181, "titulo": "O que você pensa?", "url": "
