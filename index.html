<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

</div>

const D = {"gerado_em": "27/11/2026 15:21", "stats": {"noticias_novas": 884, "resumos_gerados": 242}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva (Lula) prometeu manter investimentos em áreas sociais e educacionais, reafirmando a necessidade de ajustes financeiros para equilibrar as contas públicas. Lula também defendeu a revisão de programas sociais, garantindo que nenhum benefício para pessoas em situação de vulnerabilidade ou para a educação será cortado. A ministra Regina Helena Costa, do Superior Tribunal de Justiça (STJ), lançou um livro sobre o Código Tributário Nacional, abordando reformas tributárias e regulamentos para resolver controvérsias. Além disso, o governo registrou um superávit primário de R$ 52,2 bilhões em outubro, o melhor resultado para o mês na série histórica. O ministro Camilo Santana (PT-CE) foi convidado para comandar a Casa Civil, e o ex-ministro da Fazenda Fernando Haddad deseja 'sorte e serenidade' ao novo ministro Luiz Carlos Trabuco. O Ministério da Justiça retirou do ar 86.176 sites e perfis com publicidade ilegal de apostas online desde a proibição do setor.", "mundo": "A imigração na Espanha, um tema crucial nas próximas eleições, continua a transformar a sociedade e a política do país. A chegada de milhões de imigrantes nas últimas décadas levou a uma população recorde. Em contraste, a França enfrenta uma crise hídrica devido à seca, mesmo com recentes chuvas, e o governo debata o orçamento e a segurança cibernética. Na América do Sul, a iminente eleição no Chile revela a instabilidade do governo central, que depende de contratos anuais para sobreviver. Internamente, o Vietnã reduziu a aplicação da pena de morte. No cenário internacional, a Ucrânia se alinha com a indústria europeia de drones, enquanto o Irã detém um coautor do filme 'Foi Apenas um Acidente'. O presidente dos Estados Unidos pressiona a Venezuela e o Iraque a deixarem a Opep. O governo brasileiro responde a críticas de Macron sobre a carne brasileira. As tensões entre as potências europeias continuam, com a União Europeia enfrentando cortes orçamentários e a França acusando um empresário alemão de fornecer equipamentos para cruzamentos de imigrantes.\n\nOs líderes da União Europeia discutiram sobre gastos do orçamento e uma proposta de empréstimo de 49 bilhões de dólares para a Ucrânia, mas não chegaram a um consenso. A China realizou exercícios militares para testar novas táticas de pouso. A Taiwan rejeitou a ideia de mudar o nome das suas delegações em protesto à pressão da China, após a Lituânia alertar sobre as possíveis consequências. O comandante da Força Aeroespacial da Guarda Revolucionária Islâmica do Irã afirmou que os inimigos do país podem esperar ações no ar e no mar. As forças israelenses mataram mais de 16.248 palestinianos em Gaza, segundo dados da OCHA, com cerca de 70% sendo mulheres e crianças. O governo britânico excluiu o registro de uma reunião entre o ex-primeiro-ministro Tony Blair e a Secretária de Estado do Interior Shabana Mahmood, conforme informado pelo Democracy for Sale. A FAMINHA pode aumentar devido a conflitos globais e El Niño, alerta a ONU. A Intel enfrentou pressão para ceder 10% de sua participação em troca de bilhões em subsídios prometidos. A discussão sobre como evitar uma catástrofe alimentar, alimentada pela tecnologia, entre os Estados Unidos e China ganha destaque na geopolítica internacional.", "economia": "A França entrou em recessão após o PIB recuar por dois trimestres consecutivos, conforme informou o instituto Insee, impactando a economia europeia. Em outro desenvolvimento, a B3 firmou um acordo com seis grandes bancos brasileiros para desenvolver uma stablecoin em reais, criando uma infraestrutura compartilhada para o uso desse ativo digital no mercado financeiro. A Axia Energia vendeu R$ 2,1 bilhões em ações da ISA Energia em um block trade, representando cerca de 10% do capital da companhia de transmissão. Além disso, a Pesquisa de Orçamentos Familiares (POF) 2024-2025, divulgada pelo IBGE, revelou que as famílias com renda até dois salários mínimos representam 21,7% da população, mas detêm apenas 4,7% da renda total, enquanto as famílias com renda acima de 25 salários mínimos concentram 19,1% dos recursos.", "tecnologia": "A Europa tem assistido a uma intensa atividade na área tecnológica, com mais de 60 acordos de financiamento tecnológico, totalizando mais de 559 milhões de euros, e mais de 5 saídas de transações de aquisição. A União Europeia propôs um fundo de equidade no valor de 50 bilhões de euros para a Ucrânia. Em uma notícia relacionada, a startup belga Inqase levantou 1 milhão de euros em uma rodada de financiamento, oferecendo seguros cibernéticos para micro e pequenas empresas. A tecnologia Willo permite que robôs sejam recarregados enquanto se movem, sem a necessidade de alinhar com uma placa de recarga ou se conectar a um cabo, o que pode abrir caminho para dispositivos como laptops e telefones se recarregarem automaticamente ao entrar em uma sala. Além disso, a Nvidia, uma das maiores empresas de tecnologia, enfrentou uma crise de liderança temporária, com Jensen Huang retornando ao comando após 11 dias de afastamento, prometendo ser um CEO melhor na segunda vez. A empresa enfrenta desafios, com ações em queda e investidores questionando a sustentabilidade do boom de inteligência artificial.", "ciencia": "Os avanços científicos em diversas áreas foram destacados em diversos artigos recentes. Um estudo liderado pelo físico Dr. Slava Turyshev sugere que, no futuro, robôs serão responsáveis pela manutenção de centros de dados espaciais, não astronautas. Em outra pesquisa, pesquisadores do Instituto de Informação Aeroespacial da Academia Chinesa de Ciências desenvolveram um modelo matemático para estimar a idade e o estado de degradação de crateras lunares. Além disso, cientistas descobriram uma nova espécie de fungo, Drynaria lineatisora, que foi confundida com outra espécie durante cerca de 200 anos. Outro estudo, desta vez da Universidade Anglia Ruskin, analisou mordidas de cães em humanos no Reino Unido e concluiu que a maioria das incidentes pode ser prevenida através de melhores práticas de controle do proprietário do animal. Em relação à astronomia, a constelação da Cassiopeia está em movimento e não está em uma posição estática, segundo relatos. Por fim, pesquisas sobre buracos negros da Via Láctea e sobre a alergia alfa-gal, transmitida por carrapatos, também foram destacadas, com ambas apresentando muitos mistérios ainda por desvendar.", "cultura": "A Corte Suprema do Canadá manteve, por 6 votos contra 1, uma lei secularista em Quebec que proíbe funcionários do setor público de usar símbolos religiosos visíveis, expôs tensões entre os direitos minoritários e o poder do governo em sobrepor esses direitos. Em outro destaque, a exposição 'Louvre Photo' reavalia duas centenas de imagens do famoso museu, inspirando fotógrafos desde os tempos do daguerreótipo. Além disso, a atriz Jennifer Reid, que começou a escrever canções trabalhistas do século XIX em recibos de uma loja de varejo, está levando essas canções para todo o mundo, encontrando ressonância com as injustiças atuais, destacando a importância cultural e social dessas canções.", "sociedade": "Neste sábado, ocorre um mutirão de vacinação e castração gratuita de animais na Unidade Básica de Saúde 5 e na Escola Classe 7. As cirurgias gratuitas serão realizadas aos animais na primeira semana de dezembro. Em outro evento, a corregedora do NSW descobriu que a morte de um homem indígena em custódia em 2023 foi prevenível, reforçando a necessidade de treinamento adequado para os funcionários.", "meio_ambiente": "Inundações letais afetaram casas, negócios e estradas em várias partes do Equador, conforme relato do Al Jazeera. Em outra notícia, um professor uzbeque desenvolveu um projeto de educação ambiental que envolveu 25.000 pessoas em 25 escolas, vencendo uma competição internacional com 369 inscrições de 94 países. No Brasil, a seca severa atinge 95% do estado de Roraima, isolando comunidades ribeirinhas. O Pantanal registra chuvas intensas devido ao avanço do El Niño, mas ainda enfrenta cenários preocupantes devido a anos extremos de seca e fogo na região.", "direitos_humanos": "Os palestinos em Jerusalém Oriental enfrentam uma série de violações de direitos humanos, incluindo expulsões, fechamento de livrarias, demolição de casas e ações violentas por parte de colonos israelenses, criando um ambiente hostil para a comunidade palestina. Além disso, famílias relatam que parentes ainda estão detidos em prisões israelenses, mesmo após terem cumprido suas penas, o que mostra a persistência de problemas relacionados à liberdade e direitos humanos. Em outros contextos, o Irã pode considerar modificar sua lei de nacionalidade para conceder cidadania a crianças de mães sírias e estrangeiras, enquanto a Coreia do Sul repatriou seis marinheiros norte-coreanos após 24 dias, com um dos sete membros da tripulação optando por permanecer na Coreia do Sul. Estes casos ilustram a complexidade e diversidade dos desafios enfrentados em diferentes partes do mundo em relação aos direitos humanos."}, "resumo_do_dia": {"politica_nacional": [{"id": 291078, "titulo": "Lula promete não cortar gastos na área social nem na educação", "url": "https://veja.abril.com.br/politica/lula-promete-nao-cortar-gastos-na-area-social-nem-na-educacao/", "fonte_id": "veja", "data_pub": "2026-11-27T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula visitou surpreendentemente a UFF, fora da agenda oficial. O presidente prometeu não cortar gastos na área social e na educação.", "titulo_pt": "Lula promete não cortar gastos na área social e na educação", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 291017, "titulo": "Sob Lula, Exército tentou reverter tombamento de antigo DOI-Codi no RJ", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/sob-lula-exercito-tentou-reverter-tombamento-de-antigo-doi-codi-no-rj.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-27T17:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O processo de tombamento da antiga sede do DOI-Codi no Rio de Janeiro, concluído na quinta-feira (26), enfrentou resistência do Exército, atual responsável pelo imóvel, até os últimos dias de tramitação no Iphan. O Exército tentou reverter o tombamento no final do processo.", "titulo_pt": "Sob Lula, Exército tentou reverter tombamento da antiga sede do DOI-Codi no RJ", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 290965, "titulo": "Manutenção de Moretti no Ministério do Planejamento é vista como praticamente certa, em um aceno de Lula ao PT", "url": "https://g1.globo.com/politica/blog/valdo-cruz/post/2026/11/27/manutencao-de-moretti-no-ministerio-do-planejamento-e-vista-como-praticamente-certa-em-um-aceno-de-lula-ao-pt.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-27T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Planejamento, Bruno Moretti, está quase garantido na pasta, segundo aliados do presidente Lula. Isso ocorre após Lula ter demonstrado satisfação com a gestão de Moretti e não há expectativa de conflito com o Ministério da Fazenda.", "titulo_pt": "Manutenção de Moretti no Ministério do Planejamento é vista como praticamente certa, em um aceno de Lula ao PT", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 291081, "titulo": "Buscas por Haddad disparam 150% no Google após anúncio de que ficará fora do Lula 4", "url": "https://veja.abril.com.br/brasil/buscas-por-haddad-disparam-150-no-google-apos-anuncio-de-que-ficara-fora-do-lula-4/", "fonte_id": "veja", "data_pub": "2026-11-27T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As buscas por Fernando Haddad no Google aumentaram 150% após o anúncio de que ele ficará fora da campanha de Lula. Entre os principais questionamentos estão sobre sua trajetória acadêmica, que inclui o ensino na Universidade de São Paulo (USP).", "titulo_pt": "Buscas por Haddad dispararam 150% no Google após anúncio de que ficará fora da campanha de Lula", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 291087, "titulo": "Lula diz que país ‘não pode gastar dinheiro à toa’ e que ajuste nas contas é necessário", "url": "https://veja.abril.com.br/economia/lula-diz-que-pais-nao-pode-gastar-dinheiro-a-toa-e-que-ajuste-nas-contas-e-necessario/", "fonte_id": "veja", "data_pub": "2026-11-27T17:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula expressou preocupação com o equilíbrio das contas públicas, enfatizando a necessidade de ajustes financeiros. No entanto, ele garantiu que a busca por economia não comprometerá investimentos e programas sociais.", "titulo_pt": "Lula afirma que país não pode gastar dinheiro à toa e que ajuste nas contas é necessário", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 291016, "titulo": "Lula garante benefícios em novo governo, mas defende revisão", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/lula-garante-beneficios-em-novo-governo-mas-defende-revisao", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-27T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula defendeu a revisão de programas sociais, afirmando que pessoas sem direito estão recebendo benefícios. Ele garantiu que nenhum benefício para pessoas pobres ou educação será cortado, mas haverá ajustes necessários.", "titulo_pt": "Lula defende revisão nos programas sociais, mas garante benefícios", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 290966, "titulo": "Ministério da Justiça tirou do ar 86 mil sites e perfis com publicidade ilegal de bets desde proibição", "url": "https://g1.globo.com/politica/noticia/2026/11/27/ministerio-da-justica-tirou-do-ar-86-mil-sites-e-perfis-com-publicidade-ilegal-de-bets-desde-proibicao.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-27T16:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Justiça retirou do ar 86.176 sites e perfis com publicidade ilegal de apostas online desde a proibição no Brasil. A ação afetou 74,7 milhões de usuários em diversos canais, incluindo redes sociais e aplicativos de mensagens.", "titulo_pt": "Ministério da Justiça removeu 86 mil sites e perfis de publicidade ilegal de apostas online", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 291018, "titulo": "Fora do Senado em 2027, Mara Gabrilli participará de conselhos da Fiesp", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/fora-do-senado-em-2027-mara-gabrilli-participara-de-conselhos-da-fiesp.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-27T16:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A senadora Mara Gabrilli (PSD-SP) foi convidada para participar de dois conselhos da Fiesp: o Conselho Superior de Comércio Exterior e o Conselho Superior Multidisciplinar. Ela deixará o Senado em 2027.", "titulo_pt": "Mara Gabrilli participará de conselhos da Fiesp fora do Senado em 2027", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 291019, "titulo": "Lula diz que 'salto alto' levou a derrota no primeiro turno da eleição", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/lula-diz-que-salto-alto-levou-a-derrota-no-primeiro-turno-da-eleicao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-27T16:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula afirmou que a derrota no primeiro turno das eleições presidenciais pode ter sido causada pelo 'salto alto' da campanha. A declaração foi feita nesta sexta-feira (27).", "titulo_pt": "Lula atribui derrota no primeiro turno à 'salto alto' da campanha", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 291020, "titulo": "Sardinha de Michelle vira meme, mas não há evidência de relação entre dieta de Bolsonaro e obstrução", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/sardinha-de-michelle-vira-meme-mas-nao-ha-evidencia-de-relacao-entre-dieta-de-bolsonaro-e-obstrucao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-27T16:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A dieta do ex-presidente Jair Bolsonaro foi relacionada a memes sobre a ex-primeira-dama Michelle Bolsonaro, mas não há evidências científicas de que alimentos específicos causem obstruções intestinais, segundo o cirurgião Diego Adão.", "titulo_pt": "Sardinha de Michelle vira meme, mas não há ligação com dieta de Bolsonaro e obstrução intestinal", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 291278, "titulo": "Ministra Regina Helena Costa, do STJ, lança livro sobre Código Tributário Nacional", "url": "https://www.jota.info/justica/ministra-regina-helena-costa-do-stj-lanca-livro-sobre-codigo-tributario-nacional", "fonte_id": "jota", "data_pub": "2026-11-27T16:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ministra Regina Helena Costa, do Superior Tribunal de Justiça (STJ), lançou um livro que aborda o Código Tributário Nacional, incluindo reformas tributárias e regulamentos para resolver controvérsias e processos administrativos tributários.", "titulo_pt": "Ministra Regina Helena Costa lança livro sobre Código Tributário Nacional", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 290968, "titulo": "Lula convida Camilo Santana para ser ministro da Casa Civil", "url": "https://g1.globo.com/economia/blog/ana-flor/post/2026/11/27/lula-convida-camilo-santana-para-ser-ministro-da-casa-civil.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-27T16:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva (PT) convidou o senador Camilo Santana (PT-CE) para ser o ministro da Casa Civil a partir do próximo ano. Camilo aceitou o convite e pode ser anunciado em breve.", "titulo_pt": "Lula convida Camilo Santana para ministro da Casa Civil", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 290999, "titulo": "Lula fala em ajustes, diz que não pode gastar dinheiro à toa, mas nega corte de benefícios", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/lula-fala-em-ajustes-diz-que-nao-pode-gastar-dinheiro-a-toa-mas-nega-corte-de-beneficios.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-27T15:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula afirmou que pretende fazer ajustes nas despesas em seu novo governo, mas que não cortará benefícios sociais nem gastos com educação. Ele enfatizou que não pode gastar dinheiro à toa.", "titulo_pt": "Lula promete ajustes, mas mantém benefícios sociais e educação", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 291021, "titulo": "Lula define Camilo Santana para comandar Casa Civil, dizem aliados", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/lula-define-camilo-santana-para-comandar-casa-civil-dizem-aliados.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-27T15:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula (PT) escolheu o senador Camilo Santana (PT-CE) para comandar a Casa Civil. O órgão é responsável por coordenar o trabalho dos demais ministérios e é considerado um dos mais importantes do Executivo, junto com a Fazenda.", "titulo_pt": "Lula anuncia Camilo Santana para Casa Civil", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 291001, "titulo": "Lula busca em Trabuco conciliação de ajuste com políticas sociais, dizem aliados", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/lula-busca-em-trabuco-conciliacao-de-ajuste-com-politicas-sociais-dizem-aliados.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-27T15:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados do presidente Lula interpretam o convite ao banqueiro Luiz Carlos Trabuco como um esforço para conciliar ajustes fiscais com políticas sociais. O convite reconhece a necessidade técnica para a condução da política econômica em um momento delicado.", "titulo_pt": "Lula busca conciliação entre ajuste fiscal e políticas sociais convidando banqueiro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 291022, "titulo": "Mobilização para indicação de mulher negra ao STF é legítima, diz ministra de Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/mobilizacao-para-indicacao-de-mulher-negra-ao-stf-e-legitima-diz-ministra-de-lula.shtml", "fonte_id": "folha_poder", "data_pub": id": 291392, "titulo": "Spanish Police Find a Vast Marijuana Bunker Beneath a Backyard Playground", "url": "https://www.nytimes.com/2026/11/27/world/europe/marijuana-farm-spain-playground.html", "fonte_id": "nyt_world", "data_pub": "2026-11-27T17:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cinco pessoas foram presas em uma área sul de Espanha após a descoberta de uma grande plantação de maconha localizada sob um playground artificial.", "titulo_pt": "Polícia espanhola prende cinco pessoas em vasta plantação de maconha em Playground", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 291570, "titulo": "Mecca pact allies condemn ‘heinous’ Houthi attacks on Saudi Arabia", "url": "https://www.aljazeera.com/news/2026/11/27/mecca-pact-allies-condemn-heinous-houthi-attacks-on-saudi-arabia?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-27T17:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Funcionários de Paquistão, Arábia Saudita e Turquia se comprometeram a proteger a segurança do reino durante conversas em Islamabad. Aliados condenam os ataques ‘heinosos’ dos hutis à Arábia Saudita.", "titulo_pt": "Aliados de meca condenam ‘criminosos’ ataques hutis à arábia saudita", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 291389, "titulo": "Canada’s Top Court Lets Quebec Use Controversial Measure for Secularism Law", "url": "https://www.nytimes.com/2026/11/27/world/canada/canada-supreme-court-quebec-religion-bill-21.html", "fonte_id": "nyt_world", "data_pub": "2026-11-27T17:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O tribunal superior do Canadá permitiu que a província de Quebec utilize uma medida controversa para implementar uma lei de laicidade, permitindo que ela proíba certos funcionários públicos, como professores e policiais, de usar símbolos religiosos no trabalho.", "titulo_pt": "Tribunal canadense permite que Quebec Use medida controversa para lei de laicidade", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 291363, "titulo": "Cierre de campaña de las elecciones generales del 29-N, en directo | Sánchez cierra la campaña del PSOE con un gran acto en Madrid", "url": "https://elpais.com/espana/elecciones-generales/2026-11-27/cierre-de-campana-de-las-elecciones-generales-del-29-n-en-directo.html", "fonte_id": "elpais_america", "data_pub": "2026-11-27T17:35:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O PP denuncia possíveis irregularidades no voto por correspondência e no distribuição da propaganda eleitoral. O voto por correspondência diminuiu 59% em comparação com 2023, mas aumentou 9% em relação a 2019.", "titulo_pt": "Fim da campanha das eleições gerais de 29-N, em direto | Sánchez encerra a campanha do PSOE com grande evento em Madrid", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 291492, "titulo": "French far-left candidate Mélenchon demands ‘thorough overhaul’ of Germany ties", "url": "https://www.france24.com/en/france/20261127-french-far-left-candidate-m%C3%A9lenchon-demands-thorough-overhaul-germany-ties", "fonte_id": "france24", "data_pub": "2026-11-27T17:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jean-Luc Mélenchon, candidato à presidência da França em 2027 pelo partido de extrema-esquerda France Unbowed, declarou que está hostil à economia liberal alemã e à sua dominação na União Europeia. Ele também alertou que a França poderia ser envolvida em conflitos indesejados devido à crescente força militar da Alemanha, que ele considera um 'alvo' para outros países.", "titulo_pt": "Candidato à presidência da França critica ligação com a Alemanha", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 291606, "titulo": "Mecca pact members meet in Islamabad and condemn Houthi attacks on Saudi Arabia", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/mecca-pact-members-meet-islamabad-condemn-houthi-attacks-saudi-arabia", "fonte_id": "middle_east_eye", "data_pub": "2026-11-27T17:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ministros de Turquia, Arábia Saudita e Paquistão se reuniram em Islamabad para discutir seu acordo de defesa mutual e condenaram os ataques dos hutis à Arábia Saudita. Os três países se comprometeram a intensificar esforços para apoiar a Arábia Saudita em segurança, soberania e integridade territorial.", "titulo_pt": "Pacto de meccá: ministros se reúnem em Islamabad e condenam ataques hutis à arábia saudita", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 291493, "titulo": "OM - Levski Sofia: A night of violence disrupts Marseille match", "url": "https://www.france24.com/en/video/20261127-om-levski-sofia-a-night-of-violence-disrupts-marseille-match", "fonte_id": "france24", "data_pub": "2026-11-27T17:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ao menos 11 torcedores do clube búlgaro Levski Sofia foram feridos em Marselha na quinta-feira, quando incidentes violentos ocorreram entre os torcedores do clube visitante e os da casa, Olympique Marseille, antes do seu jogo da Liga Europa.", "titulo_pt": "OM - Levski Sofia: noite de violência interrompe partida em marselha", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 291494, "titulo": "Paris Paloma tackles Greek mythology, generative AI in her second album 'The Fatal Flaw'", "url": "https://www.france24.com/en/tv-shows/arts24/20261127-paris-paloma-tackles-greek-mythology-generative-ai-in-her-second-album-the-fatal-flaw", "fonte_id": "france24", "data_pub": "2026-11-27T17:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Paris Paloma está promovendo seu segundo álbum, 'The Fatal Flaw', que se inspira em mitologia grega, arte e feminismo. O álbum é mais pessoal do que seu primeiro registro, 'Cacophony'.", "titulo_pt": "Paris Paloma aborda mitologia grega e IA gerativa em seu segundo álbum 'The Fatal Flaw'", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 291467, "titulo": "Kenyan doomsday cult leader convicted over further 123 deaths", "url": "https://www.bbc.co.uk/news/articles/cmy49de4xx1zo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-27T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Paul Mackenzie foi condenado por assassinar seus seguidores, semanas após ser condenado pelo assassinato em massa de crianças.", "titulo_pt": "Líder de culto doomsday da kenya condenado por mais 123 mortes", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 291573, "titulo": "‘Bear trap’: Ukraine hails new operation as Russian casualties mount", "url": "https://www.aljazeera.com/news/2026/11/27/ukraine-rejects-unfavourable-compromises-as-it-frees-more-territory?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-27T17:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Defesas ucranianas são firmes contra os ataques russos ao longo da linha de frente. Ocidentais discutem propostas de cessar-fogo.", "titulo_pt": "Armadilha de urso: Ucrânia comemora nova operação enquanto aumentam os baixos russos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 291495, "titulo": "France is dealing with water insecurity – a new study shows it's a global problem", "url": "https://www.france24.com/en/environment/20261127-france-dealing-with-water-insecurity-%E2%80%93-new-study-shows-global-problem", "fonte_id": "france24", "data_pub": "2026-11-27T17:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas na França estão sob restrições de água devido a uma seca, apesar de chuvas recentes, de acordo com o ministério do Meio Ambiente. Um novo estudo mostrou que houve a maior diminuição global das fontes de água superficial desde 1991.", "titulo_pt": "França enfrenta exto_pt": "Microempreendedores individuais e donos de pequenos negócios podem consultar gratuitamente as mudanças nas regras de faturamento, tributação e regularização de dívidas. O Radar das Mudanças para Pequenos Negócios reúne 11 medidas relacionadas à reforma tributária e ao pacote Prospera MEI.", "titulo_pt": "Ferramenta gratuita reúne mudanças para MEIs e pequenos negócios", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 291300, "titulo": "Um M&A de tabaco para financiar o fim do cigarro", "url": "https://braziljournal.com/um-m-and-a-de-tabaco-para-financiar-o-fim-do-cigarro", "fonte_id": "brazil_journal", "data_pub": "2026-11-27T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Altria, uma das maiores produtoras de cigarros do mundo, está estudando a possibilidade de fazer uma oferta em dinheiro pela Imperial Brands, uma empresa britânica que administra marcas como Winston e West, e pode chamar a Japan Tobacco para comprar parte dos ativos, visando reduzir riscos antitruste. Esta movimentação surge em um momento de crise de identidade para a indústria do tabaco.", "titulo_pt": "Uma fusão e aquisição de tabaco para financiar o fim do cigarro", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 290993, "titulo": "B3 fecha acordo com bancos para criar stablecoin em reais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/b3-fecha-acordo-com-bancos-para-criar-stablecoin-em-reais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-27T17:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A B3 firmou um acordo com seis grandes bancos brasileiros para desenvolver uma stablecoin referenciada em reais e uma infraestrutura compartilhada para o uso desse ativo digital no mercado financeiro. O anúncio foi feito nesta sexta-feira (27).", "titulo_pt": "B3 fecha acordo com bancos para criar stablecoin em reais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 291149, "titulo": "BC quer regras para coibir mensagens intimidatórias enviadas pelo Pix", "url": "https://www.metropoles.com/brasil/bc-quer-regras-para-coibir-mensagens-intimidatorias-enviadas-pelo-pix", "fonte_id": "metropoles", "data_pub": "2026-11-27T17:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A BC (Banco Central) planeja implementar regras para combater mensagens intimidatórias enviadas pelo Pix em 2027. As medidas incluirão campanhas educativas e uma ferramenta para ocultar textos ofensivos nos aplicativos bancários.", "titulo_pt": "BC quer regras para combater mensagens intimidatórias enviadas pelo Pix", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 290994, "titulo": "Pluxee e Petrobras integram grupo sobre segurança alimentar de trabalhadores na ONU", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/pluxee-e-petrobras-integram-grupo-sobre-seguranca-alimentar-de-trabalhadores-na-onu.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-27T17:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Rede Brasil do Pacto Global da ONU formou um grupo de trabalho para discutir segurança alimentar e nutricional de trabalhadores. Este grupo foi lançado recentemente em Genebra.", "titulo_pt": "Pluxee e Petrobras participam de grupo sobre segurança alimentar de trabalhadores na ONU", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 290995, "titulo": "Raízen considera vender negócio de distribuição de combustíveis, diz Ometto", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/raizen-considera-vender-negocio-de-distribuicao-de-combustiveis-diz-ometto.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-27T17:04:00Z", "idioma": "pt", "provavel_duplicata_ ido", "classe": "A"}, {"id": 291098, "titulo": "Contas do governo têm superávit de R$ 52,3 bilhões em outubro", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/contas-do-governo-tem-superavit-de-r-523-bilhoes-em-outubro", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-27T15:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As contas do Governo Central registraram um superávit primário de R$ 52,3 bilhões em outubro. Este resultado foi superior às estimativas do mercado, que projetavam R$ 43,4 bilhões. Em comparação com outubro do ano anterior, houve um aumento real de 36,4%.", "titulo_pt": "Contas do governo têm superávit de R$ 52,3 bilhões em outubro", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 291000, "titulo": "Greve da Caixa impactou liberação de até 25% de crédito imobiliário no mês, mostra BC", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/greve-da-caixa-impactou-liberacao-de-ate-25-de-credito-imobiliario-no-mes-mostra-bc.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-27T15:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A greve dos funcionários da Caixa Econômica Federal, que durou 19 dias em setembro, resultou em uma redução de até 25% na liberação de novos financiamentos imobiliários no mês, conforme dados do Banco Central.", "titulo_pt": "Greve da Caixa impactou liberação de até 25% de crédito imobiliário no mês, mostra BC", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 291279, "titulo": "Terras raras: Nunes Marques nega ação contra compra de mineradora por empresa dos EUA", "url": "https://www.jota.info/stf/do-supremo/terras-raras-nunes-marques-nega-acao-contra-compra-de-mineradora-por-empresa-dos-eua", "fonte_id": "jota", "data_pub": "2026-11-27T15:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Nunes Marque cos em prova de residência em Portugal", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 291772, "titulo": "Belgian cyber insurance startup Inqase raises €1M", "url": "https://tech.eu/2026/11/27/belgian-cyber-insurance-startup-inqase-raises-eur1m/", "fonte_id": "tech_eu", "data_pub": "2026-11-27T15:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup belga Inqase levantou €1 milhão em uma rodada de financiamento. A empresa oferece seguros cibernéticos para micro e pequenas empresas.", "titulo_pt": "Startup belga Inqase arrecada €1 milhão", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 291773, "titulo": "Europe's tech ecosystem demands decisive action on Ukraine, EU proposes €50BN equity fund, and Pliant secures over €200M", "url": "https://tech.eu/2026/11/27/europe-s-tech-ecosystem-demands-decisive-action-on-ukraine-eu-proposes-50bn-equity-fund-and-pliant-secures-over-200m/", "fonte_id": "tech_eu", "data_pub": "2026-11-27T15:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nesta semana, foram acompanhados mais de 60 acordos de financiamento tecnológico com valor superior a 559 milhões de euros e mais de 5 saídas, transações de aquisição e notícias relacionadas na Europa. A União Europeia propôs um fundo de equidade no valor de 50 bilhões de euros para a Ucrânia.", "titulo_pt": "Economia tecnológica europeia pede ação decisiva sobre a Ucrânia, ue propõe fundo de 50 bilhões de euros e Pliant obtém financiamento superior a 200 milhões", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 291601, "titulo": "From Jobs to Jensen: tech’s metamorphosis", "url": "https://www.ft.com/content/5b10a0e6-aad6-403b-9f2e-23b5ca78897d", "fonte_id": "financial_times", "data_pub": "2026-11-27T15:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A saga da Nvidia é parte de uma história maior e mais estranha sobre a transformação política da Vale do Silício.", "titulo_pt": "De Jobs a Jensen: a metamorfose da tecnologia", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 291002, "titulo": "Como Jensen Huang vai comandar a Nvidia após crise de liderança?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/como-jensen-huang-vai-comandar-a-nvidia-apos-crise-de-lideranca.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-27T15:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang retornou ao comando da Nvidia após 11 dias de afastamento e prometeu ser um CEO melhor na segunda vez. A empresa enfrentou uma crise de liderança temporária.", "titulo_pt": "Como Jensen Huang vai comandar a Nvidia após crise de liderança?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 291106, "titulo": "Viés algorítmico: o que é, exemplos e como auditar", "url": "https://exame.com/blog-saint-paul/vies-algoritmico-o-que-e-exemplos-e-como-auditar/", "fonte_id": "exame", "data_pub": "2026-11-27T14:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Modelos de inteligência artificial podem perpetuar desigualdades em processos como triagem de currículos e concessão de crédito. Para auditar sistemas de IA, é recomendado utilizar um checklist de 10 perguntas.", "titulo_pt": "Viés algorítmico: entenda os tipos e como auditar", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 291774, "titulo": "Cutting the cord: How Willo is taking wireless power into the third dimension", "url": "https://tech.eu/2026/11/27/cutting-the-cord-how-willo-is-taking-wireless-power-into-the-third-dimension/", "fonte_id": "tech_eu", "data_pub": "2026-11-27T14:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A tecnologia Willo permite que robôs sejam recarregados enquanto se movem, sem a necessidade de alinhar com uma placa de recarga ou se conectar a um cabo. Além disso, é possível que dispositivos como laptops e telefones começem a se recarregar automaticamente ao entrar em uma sala.", "titulo_pt": "Cortando o cabo: como Willo está levando o poder sem fio ao terceiro dimensionamento", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 291730, "titulo": "This ER Doctor Became a Hospital’s First Clinical AI Engineer", "url": "https://spectrum.ieee.org/clinical-ai-engineer-dinesh-rai", "fonte_id": "ieee_spectrum", "data_pub": "2026-11-27T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2023, Dinesh Rai, um médico pediatra, se tornou o primeiro engenheiro clínico de IA do Hospital Boston Children’s, depois de se candidatar a um cargo de engenheiro de prompt. Rai não esperava obter o emprego, que envolvia ajudar grandes modelos de linguagem a fornecer as respostas mais adequadas por meio de instruções bem formuladas e contexto.", "titulo_pt": "Médico se torna o primeiro engenheiro clínico de IA do Hospital boston children’s", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 291678, "titulo": "Belgium orders Google to stop work on data centre lacking proper permits", "url": "https://www.scmp.com/news/world/europe/article/3376094/belgium-orders-google-stop-work-data-centre-lacking-proper-permits", "fonte_id": "scmp", "data_pub": "2026-11-27T13:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades belgas ordenaram que a Google pare de trabalhar na construção de um centro de dados no sul do país devido à falta de permissão de planejamento adequada. O centro de dados, localizado em um antigo local de mineração de 50 hectares, está sendo construído sem as permissões necessárias.", "titulo_pt": "Bélgica ordena à Google parar de trabalhar em centro de dados sem permissão", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 291116, "titulo": "Voz clonada por IA: como evitar golpes nas compras de fim de ano", "url": "https://exame.com/tecnologia/voz-clonada-ia-golpes-compras-fim-de-ano/", "fonte_id": "exame", "data_pub": "2026-11-27T13:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Criminosos estão usando inteligência artificial para clonar vozes familiares e fazer falsas cobranças, pedindo dinheiro. A Visa recomenda confirmar solicitações por canais conhecidos para evitar estes golpes.", "titulo_pt": "Voz clonada por IA: como evitar golpes nas compras de fim de ano", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 291679, "titulo": "China test-fires world’s first metal powder-fuelled afterburner for fighter jets", "url": "https://www.scmp.com/news/china/science/article/3376081/china-test-fires-worlds-first-metal-powder-fuelled-afterburner-fighter-jets", "fonte_id": "scmp", "data_pub": "2026-11-27T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas chineses realizaram testes de sucesso em um protótipo de motor turbojato que utiliza pó metálico como combustível no afterburner, em vez do kerosene. Este é considerado o primeiro caso do mundo dessa tecnologia.", "titulo_pt": "China realiza testes com primeiro afterburner do mundo a funcionar com pó metálico para aviões", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 291694, "titulo": "The Download: Innovators Under 35 nominations are open, and a bionic window into the mind", "url": "https://www.technologyreview.com/2026/11/27/1149960/the-download-the-download-innovators-under-35-nominations-bionic-hand/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-27T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O MIT Technology Review está aceitando inscrições para a 2027 Innovators Under 35, uma lista que homenageia 35 jovens cientistas, empreendedores e inovadores brilhantes do mundo todo.", "titulo_pt": "Download: inscrições abertas para a 2027 innovators Under 35", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 291735, "titulo": "SK hynix doubles daily buyback orders as shares slide", "url": "https://www.koreaherald.com/article/10952285", "fonte_id": "korea_herald", "data_pub": "2026-11-27T12:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SK hynix dobrou o volume diário de suas ações adquiridas para cerca de 700.000 ações, de 350.000, em um esforço para suportar suas ações que caíram significativamente. A empresa afirma que as ações estão subavaliadas em relação ao seu valor real, o que indica preocupação com a recente queda e seu impacto no valor dos acionistas.", "titulo_pt": "SK hynix duplica ordens de compra diária de ações em meio à queda das cotações", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 291440, "titulo": "Gift Guide for the AI Apocalypse", "url": "https://www.theatlantic.com/ideas/2026/11/gift-guide-ai-apocalypse/689561/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-11-27T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este período festivo, presenteie-se com algo que possa servir como proteção contra desastres computacionais.", "titulo_pt": "Guia de presentes para a apocalipse pela inteligência artificial", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 291739, "titulo": "Robots, not astronauts, will have to fix space data centers", "url": "https://phys.org/news/2026-11-robots-astronauts-space-centers.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo de Dr. Slava Turyshev, físico do JPL, destaca que, além de lançar equipamentos para os centros de dados no espaço, será necessário encontrar maneiras de manutenção. O artigo sugere que robôs, e não astronautas, serão responsáveis por realizar essas tarefas de manutenção no futuro.", "titulo_pt": "Robôs, não astronautas, terão que reparar os centros de dados espaciais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 291740, "titulo": "As families gather for Thanksgiving, college science students need training to talk across societal divides", "url": "https://phys.org/news/2026-11-families-thanksgiving-college-science-students.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudantes de ciência universitários precisam de treinamento para conversar sobre temas controversos com pessoas de diferentes visões sociais. Durante o Dia do Agradecimento, muitas famílias discutirão questões controversas como vacinas e mudanças climáticas, o que pode levar a debates intensos e divisivos.", "titulo_pt": "Famílias se reúnem para o dia do agradecimento, mas estudantes de ciência precisam de treinamento para conversar sobre divisões sociais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 291371, "titulo": "Miguel Ángel Rojas, experto en climatización: “Si afuera hace 35 grados y adentro ponés 18, el choque térmico es enorme y el equipo trabaja muchísimo”", "url": "https://www.lanacion.com.ar/lifestyle/miguel-angel-rojas-experto-en-climatizacion-si-afuera-hace-35-grados-y-dentro-pones-18-el-choque-nid27112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-27T17:50:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um especialista em climatização explicou que manter a temperatura do ar condicionado em 18 graus Celsius quando o exterior está a 35 graus resulta em um grande choque térmico, fazendo com que o equipamento trabalhe excessivamente e aumentando o consumo de energia e a possibilidade de danos no equipamento.", "titulo_pt": "Miguel Ángel Rojas, especialista em climatização: 'se a temperatura externa é de 35 graus e interna de 18, o choque térmico é grande e o equipamento trava muito'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 291741, "titulo": "Researchers develop mathematical model to estimate age and degradation of lunar impact craters", "url": "https://phys.org/news/2026-11-mathematical-age-degradation-lunar-impact.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores do Instituto de Informação Aeroespacial da Academia Chinesa de Ciências (AIRCAS) e colaboradores desenvolveram um modelo matemático que utiliza parâmetros morfométricos para estimar rapidamente o estado de degradação e a idade de crateras lunares. O modelo foi aplicado a 140 crateras na área de pouso da missão Chang'e-6.", "titulo_pt": "Pesquisadores desenvolvem modelo matemático para estimar a idade e o estado de degradação de crateras lunares", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 291742, "titulo": "New fern species discovered after nearly 200 years of being mistaken for another", "url": "https://phys.org/news/2026-11-fern-species-years-mistaken.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores chineses formalmente descreveram uma nova espécie de ferrovia, denominada Drynaria lineatisora, que foi confundida com a espécie Drynaria coronans durante cerca de 200 anos. Estudos recentes realizados pelo Xishuangbanna Tropical Botanical Garden e seus colaboradores confirmaram que se trata de uma espécie distinta.", "titulo_pt": "Nova espécie de ferrovia descoberta após quase 200 anos de ser confundida com outra", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 291743, "titulo": "Dog bite survey identifies owner control as key to preventing attacks across breeds", "url": "https://phys.org/news/2026-11-dog-survey-owner-key.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma análise recente sobre mordidas de cães em humanos no Reino Unido sugere que a maioria das incidentes pode ser prevenida e envolve uma ampla variedade de raças, não apenas as consideradas 'perigosas'. O relatório, intitulado 'Segurança ao Redor dos Cães: Uma Análise do Processo de Mordidas de Cães', foi realizado pela Universidade Anglia Ruskin e analisou registros judiciais, dados de internações hospitalares, políticas e pesquisas.", "titulo_pt": "Pesquisa sobre mordidas de cães identifica controle do dono como chave para prevenção", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 291744, "titulo": "Ancient skull reveals an early relative of the largest bone-cracking hyena", "url": "https://phys.org/news/2026-11-ancient-skull-reveals-early-largest.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo fóssil de hipólenas pré-históricas da região nordeste do Tibet fornece informações sobre a origem de um predador de grande porte especializado em cravar ossos. O crânio parcial desse animal mostra que ele perdeu um dente canino e sobreviveu o suficiente para que o osso preenchesse a cavidade do dente perdido.", "titulo_pt": "Cranio antigo revela parente precoce da maior hipólenas esmagadora de ossos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 291745, "titulo": "Why does the word 'huge' sound so large?", "url": "https://phys.org/news/2026-11-word-huge-large.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As palavras que usamos para descrever os sons dos animais são claramente inspiradas nos próprios sons produzidos pelos animais. Por exemplo, 'meow' para gatos, 'woof' para cachorros, 'moo' para vacas e 'baa' para ovelhas.", "titulo_pt": "Por que a palavra 'huge' soa tão grande?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 291746, "titulo": "The dark matter puzzle deepens: Nearby galaxies challenge cosmic simulations", "url": "https://phys.org/news/2026-11-dark-puzzle-deepens-nearby-galaxies.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa envolvendo 136 galáxias próximas revelou que as regiões internas dessas galáxias contêm menos matéria escura do que as previsões dos nossos modelos computacionais mais avançados. Esta descrença se agrava em sistemas mais massivos, oferecendo novas pistas sobre a estrutura da matéria escura.", "titulo_pt": "O mistério da matéria escura se agrava: galáxias próximas desafiam simulações cósmicas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 291793, "titulo": "Who turned the W upside down? Why Cassiopeia won't sit still", "url": "https://www.space.com/stargazing/who-turned-the-w-upside-down-why-cassiopeia-wont-sit-still", "fonte_id": "space_com", "data_pub": "2026-11-27T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A constelação da Cassiopeia é frequentemente reconhecida como um W ou um M no céu noturno. A constelação não está em uma posição estática e tem movimentado sua forma ao longo do tempo.", "titulo_pt": "Quem virou a W de cabeça para baixo? Por que a Cassiopeia não permanece estática", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 291747, "titulo": "Researchers reveal sex chromosome evolution and molecular sex markers in the pitcher plant Nepenthes mirabilis", "url": "https://phys.org/news/2026-11-reveal-sex-chromosome-evolution-molecular.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T16:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores descobriram a base genômica da determinação sexual no Nepenthes mirabilis, a única planta-pérola nativa da China, identificando um sistema de cromossomos sexuais XX/XY e marcadores moleculares que permitem distinguir plantas macho de fêmea muito antes do florescimento.", "titulo_pt": "Pesquisadores revelam bases genômicas da determinação sexual e marcadores moleculares no planta-pérola Nepenthes mirabilis", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 291748, "titulo": "Dolly Parton gets a deep-sea namesake: Bathyadmetella dollypartonae", "url": "https://phys.org/news/2026-11-dolly-parton-deep-sea-namesake.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova espécie de verme, coberto por penas brancas finas, foi nomeada em homenagem à cantora Dolly Parton. Os cientistas do Museu da História Natural deram esse nome após identificar a espécie em uma das áreas marítimas menos exploradas.", "titulo_pt": "Nova espécie marinha recebe nome em homenagem a dolly Parton", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 291177, "titulo": "O que se sabe sobre a nova variante da Covid-19 que circula no Brasil", "url": "https://www.cnnbrasil.com.br/saude/o-que-se-sabe-sobre-a-nova-variante-da-covid-19-que-circula-no-brasil/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-27T16:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A linhagem PJ.2.1 da variante do coronavírus foi identificada em seis estados brasileiros e no Distrito Federal. A Organização Mundial da Saúde (OMS) considera que o risco adicional à saúde pública é baixo e mantém o monitoramento da situação.", "titulo_pt": "O que se sabe sobre a nova variante do coronavírus que circula no Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 291794, "titulo": "On this day in space! Nov. 27, 1885: Astronomer captures 1st known photo of a meteor during an Andromedid meteor storm", "url": "https://www.space.com/space-exploration/on-this-day-in-space-november-27-2026", "fonte_id": "space_com", "data_pub": "2026-11-27T16:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 27 de novembro de 1885, um astrônomo capturou a primeira fotografia conhecida de um meteorito. Este evento foi importante porque marcou o início da fotografia de meteoros.", "titulo_pt": "27 De novembro de 1885: astrônomo captura primeira foto de um meteorito", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 291749, "titulo": "Q&A: What matters most to homeowners facing flooding?", "url": "https://phys.org/news/2026-11-qa-homeowners.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A quantidade anual de precipitação e a frequência de eventos extremos aumentaram na Pensilvânia nas últimas décadas e estão previstas para continuar aumentando, aumentando o risco de inundações. No entanto, os estudos de risco climático refletem uma compreensão limitada da forma como as pessoas interpretam e agem frente ao risco de inundações.", "titulo_pt": "Perguntas e respostas: o que importa mais para proprietários de imóveis enfrentando inundações?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 291750, "titulo": "Lizards build complex teeth differently from humans", "url": "https://phys.org/news/2026-11-lizards-complex-teeth-differently-humans.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores do Instituto de Biologia, parte do Helsinki Institute of Life Science (HiLIFE) da Universidade de Helsínquia, demonstraram como a evolução pode produzir formas dentais complexas através de mecanismos biológicos muito diferentes.", "titulo_pt": "Lagartos construem dentes complexos de maneira diferente dos humanos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 291653, "titulo": "Taipei exhibition marks Penglai rice centennial", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/28/2003868543", "fonte_id": "taipei_times", "data_pub": "2026-11-28T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma exposição em Taipei comemora o centenário do arroz de Penglai. O evento celebra a histór own last year. Now its residents are bracing for more", "url": "https://www.theguardian.com/world/2026/nov/27/spain-migrants-election-vox-far-right-europe", "fonte_id": "guardian_world", "data_pub": "2026-11-27T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Residentes de Torre-Pacheco, uma cidade espanhola com comunidades diversificadas, estão preocupados com a possibilidade de entrada do partido de extrema-direita Vox no governo após as eleições deste domingo. A chegada do Vox está sendo vista como um sinal de aumento do racismo na cidade.", "titulo_pt": "Ojeriza racial explodiu nesta cidade espanhola no ano passado. Agora, os residentes se preparam para mais.", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 290776, "titulo": "Health ministry mulls raising care insurance premiums for some older adults", "url": "https://www.japantimes.co.jp/news/2026/11/27/japan/society/older-adults-care-insurance/", "fonte_id": "japan_times", "data_pub": "2026-11-27T02:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministério da Saúde está considerando aumentar as taxas de seguro de cuidados para alguns idosos. As mudanças ocorrem devido aos desafios de financiamento e outros problemas enfrentados pelo sistema de seguro de cuidados de saúde, diante do aumento da demanda por serviços de cuidados de saúde.", "titulo_pt": "Ministério da saúde considera aumentar taxas de seguro de cuidados para alguns idosos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 291537, "titulo": "Uzbek teacher turns school recycling problem into an award-winning green education project", "url": "https://www.euronews.com/2026/11/27/uzbek-teacher-turns-school-recycling-problem-into-an-award-winning-green-education-project", "fonte_id": "euronews", "data_pub": "2026-11-27T17:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um professor uzbeque utbreak", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/gazas-children-caught-grip-meningitis-outbreak", "fonte_id": "middle_east_eye", "data_pub": "2026-11-27T16:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um bebê de dois meses chamado Mostafa Hallawin está internado há 10 dias no Hospital Al-Rantisi em Gaza, com meningite. Sua mãe relata que ele apresentou uma erupção cutânea e febre alta, com temperatura chegando a 39°C, e que seu estado não melhorou devido a escassez de recursos médicos.", "titulo_pt": "Crianças de gaza caídas na gripe meningocócica", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 291297, "titulo": "Florestas da Alemanha encolhem, mas um tipo de árvore vem resistindo", "url": "https://www.dw.com/pt-br/florestas-da-alemanha-encolhem-mas-um-tipo-de-árvore-vem-resistindo/a-80060110?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-27T14:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Imagens de satélite indicam que as florestas de coníferas e áreas particulares da Alemanha estão encolhendo, mas um tipo específico de árvore está superando as expectativas em termos de resistência.", "titulo_pt": "Florestas da Alemanha encolhem, mas uma espécie de árvore se sai melhor do que se imaginava", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 291117, "titulo": "AquaRio inaugura laboratório para reprodução de corais ameaçados", "url": "https://exame.com/bussola/aquario-inaugura-laboratorio-para-reproducao-de-corais-ameacados/", "fonte_id": "exame", "data_pub": "2026-11-27T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O AquaRio inaugurou um laboratório com capacidade para produzir 15 mil mudas de corais a cada seis meses, visando preservar a diversidade genética de espécies ameaçadas.", "titulo_pt": "Aquario inaugura laboratório para reprodução de corais ameaçados", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 291119, "titulo": "A conta do clima: seca severa atinge 95% de Roraima e isola comunidades ribeirinhas", "url": "https://exame.com/esg/a-conta-do-clima-seca-severa-atinge-95-de-roraima-e-isola-comunidades-ribeirinhas/", "fonte_id": "exame", "data_pub": "2026-11-27T12:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A seca severa afeta 95% do estado de Roraima e está isolando comunidades ribeirinhas. Este é o terceiro evento associado ao El Niño e ao aquecimento do Atlântico Norte em 11 anos, destacando a vulnerabilidade da Amazônia às mudanças climáticas.", "titulo_pt": "A conta do clima: seca severa atinge 95% de Roraima e isola comunidades ribeirinhas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 291298, "titulo": "O efeito surpresa do El Niño no Pantanal", "url": "https://www.dw.com/pt-br/o-efeito-surpresa-do-el-niño-no-pantanal/a-80072689?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-27T10:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nos últimos meses, o Pantanal registrou chuvas intensas devido ao avanço do El Niño. No entanto, o cenário ainda é preocupante devido aos anos extremos de seca e fogo na região.", "titulo_pt": "Efeito surpresa do El Niño no Pantanal", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 290714, "titulo": "Deadly floods leave parts of Ecuador under water", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/27/deadly-floods-leave-parts-of-ecuador-under-water?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-27T08:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Inundações letais submergiram casas, negócios e estradas em várias partes do Equador.", "titulo_pt": "Inundações letais deixam partes do equador submersas", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 291575, "titulo": "
