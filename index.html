nho do Republicanos foi eleito governador no primeiro turno, confirmado o favoritismo apontado pelas pesquisas. Também no primeiro turno, Eduardo Braide do PSD foi eleito governador do Maranhão, derrotando Orleans Brandão. No Ceará, Elmano de Freitas foi reeleito governador no primeiro turno, vencendo Ciro Gomes do PDT. No Paraná, Sergio Moro foi eleito governador no primeiro turno com 50,11% dos votos válidos. Em Santa Catarina, Carlos Bolsonaro foi eleito senador. Em outros estados, como Rio Grande do Norte e Rio de Janeiro (RJ), foram definidos os candidatos para o segundo turno.", "mundo": "No Brasil, as eleições presidenciais terão uma segunda volta no dia 25 de outubro, com Luiz Inácio Lula da Silva e Flávio Bolsonaro, filho do ex-presidente Jair Bolsonaro, liderando as pesquisas. De acordo com as pesquisas, Lula tem uma pequena vantagem, mas o resultado final só será conhecido no segundo turno. Esta eleição é vista como um ponto de virada potencial para a América Latina, após vários anos de vitórias da direita na região. Além disso, o Irã admitiu estar passando por uma grave crise econômica, enquanto os Estados Unidos retiraram seus bombardeiros da base britânica de Fairford após um incidente de segurança. A região do Pacífico se reuniu para discutir ações climáticas e a ONU está se preparando para o COP31 em Fiji.\n\nAs tensões geopolíticas em todo o mundo continuam a se intensificar, com vários eventos importantes marcando o cenário internacional. O Irã e os Estados Unidos parecem cada vez mais próximos de uma escalada de conflitos, com ex-diplomatas concordando que a guerra contra o Irã provavelmente se agravará nos próximos meses. Em outro desenvolvimento, o governo de Israel ordenou a remoção de vídeos online que foram usados como propaganda eleitoral pelo primeiro-ministro Benjamin Netanyahu, durante um processo eleitoral que segue em andamento. Além disso, a Coreia do Norte e a Rússia são acusadas de compartilhar tecnologia de dron-jato com a Ucrânia, o que tem sido um ponto de tensão nas negociações entre as partes. O presidente ucraniano, Volodymyr Zelensky, também anunciou que a Ucrânia está pronta para iniciar negociações trilaterais com a Rússia, em um local proposto pelos Estados Unidos, possivelmente nos Emirados Árabes Unidos. Essas notícias refletem a complexidade e a volatilidade do cenário geopolítico atual, com múltiplos conflitos e tensões em diferentes regiões do mundo.", "economia": "O resultado do primeiro turno das eleições presidenciais no Brasil mostrou um avanço significativo do candidato bolsonarista, levantando expectativas de uma vitória de direita nos próximos dias. O mercado financeiro e as bolsas de valores reagirão a essa tendência, com investidores monitorando o resultado das próximas eleições. No cenário econômico global, os Estados Unidos estão se aproximando do modelo italiano em termos de economia e sociedade, enquanto a atividade de fusões e aquisições enfrenta um freio devido a preocupações com a inteligência artificial e as eleições intermediárias nos EUA. Na economia brasileira, a reforma tributária avança, mas enfrenta desafios, como a definição da alíquota tributária no setor de saneamento, enquanto a Havan mira expansão no Paraguai e Uruguai. A economia chilena, por sua vez, enfrenta a perspectiva de uma recessão em 2026, com riscos de aumento da inflação e desemprego, enquanto a indústria automobilística britânica lida com um equilíbrio difícil entre mercados chineses e europeus.", "tecnologia": "A inteligência artificial (IA) continua sendo um tema central na tecnologia, com várias empresas e governos investindo pesadamente em sua evolução e aplicação. A SpaceX atingiu uma importante marca ao fazer a Starship entrar em órbita pela primeira vez, embora tenha enfrentado problemas com os motores durante o voo. Além disso, a demanda de dados para IA está aumentando, levando as grandes fabricantes de chips a focarem mais em sistemas e ecossistemas do que em especificações de hardware. A Amazon também se comprometeu com as cidades que abrigam seus centros de dados, prometendo investimentos e apoio local. No entanto, a necessidade de segurança adicional para a IA foi destacada por um ex-engenheiro da OpenAI, que alertou para a urgência de melhorar a segurança dessas tecnologias.", "ciencia": "Um estudo recente sobre saúde mostrou que os tratamentos com medicamentos são eficazes, embora os detalhes específicos não tenham sido fornecidos. A NASA está envolvida em várias iniciativas científicas, incluindo a exploração do cráter Gale pelo rover Curiosity, que está explorando a área conhecida como Cache Creek. A SpaceX, que se tornou líder no mercado de lançamentos espaciais comerciais, decidiu priorizar o desenvolvimento do foguete Starship, afetando os clientes de lançamento de satélites. Um novo material ativo à luz foi descoberto, capaz de produzir hidrogênio a partir da água de forma eficiente, sem a necessidade de um catalisador metálico caro. Além disso, um lago na fronteira entre França e Suíça secou após um verão extremamente quente, levando os locais a pedirem ajuda para salvar o lago.", "cultura": "O encerramento dos 20º Jogos Asiáticos em Nagoya, após duas semanas de turbulências, evidenciou a excelência dos jovens atletas, mas também apontou falhas logísticas e um interesse público moderado. Entre as notícias culturais, a atriz Lita Stantic recebeu um doutorado honoris causa durante um festival de cinema, e houve discussões sobre qual álbum dos Beatles é o melhor, variando dependendo do momento. O documentário dirigido por Lucrecia Martel no Museu Malba e a declaração de Sarah Jessica Parker sobre sua coleção de roupas inspiradas em Carrie Bradshaw na série 'Sex and the City' também chamaram a atenção. O fim da temporada do programa Música do Mundo na Rádio Nacional e a exposição em Milão que resgata as colaborações de Salvador Dalí com a moda completam a visão cultural deste período.", "sociedade": "Mais de 400 escolas em França enfrentarão interrupções na próxima segunda-feira devido a protestos estudantis, conforme informou o ministro da Educação, Édouard Geffray. Cerca de 500 escolas podem permanecer parcial ou totalmente fechadas, com 24 já sendo queimadas ou saqueadas e 78 funcionários ficando feridos desde o início da mobilização. Em Moscou, o Partido Comunista russo, aliado ao Kremlin, promoveu um evento que terminou com a detenção de cerca de 60 pessoas, a maioria jovens. Além disso, a governadora de Nova York, Hochul, anunciou um pagamento de US$16,8 milhões para agricultores do estado, enquanto um homem de 36 anos morreu após ser esfaqueado durante uma briga em Lampa, Chile, com dois suspeitos detidos.", "meio_ambiente": "A França registrou mais de 8.124 mortes relacionadas a ondas de calor entre maio e agosto, conforme relatos do jornal Le Monde. Em outra notícia, uma funcionária de uma instituição antipagamento na região de Irkutsk, Rússia, morreu após um incidente com bactérias em um laboratório, levando 200 pessoas a serem isoladas como medida de precaução. Além disso, a Alemanha inaugurou o aerogenerador mais alto do mundo, com 365 metros, superando a Torre Eiffel. Em um caso de impacto ambiental, 11 ovelhas selvagens libertadas no Parque Nacional do Teide, na Ilha da Tenerife, em 1971, se tornaram uma ameaça para o ecossistema local após quase quatro décadas. Por fim, houve cinco casos de baleias e tubarões-baleias se estranhando na costa indonésia nas últimas três semanas, levantando a possibilidade de um aumento nas ocorrências devido a mudanças ambientais, atividade humana e melhor reportagem.", "direitos_humanos": "Comemora-se o cinquentenário do crime Letelier-Moffitt, um evento significativo no contexto internacional. Em seguida, um jornalista egípcio enfrenta acusações de terrorismo após uma equipe inteira de jornalistas ser detida, levando a denúncias de repressão às liberdades de imprensa. Em Gaza, uma mãe cristã de 47 anos e sua filha de 14 anos morreram em um ataque aéreo israelense. Na Cisjordânia Ocidental, forças israelenses e setidores feriram mais de 15 pessoas, incluindo quatro homens palestinos em Beit Imrin. No acampamento de imigrantes em Ceuta, o governo espanhol está removendo os refugiados antes da visita do Rei Felipe VI. Em Louisiana, um bebê de um ano enfrenta um julgamento migratório sem advogado, enquanto sua mãe, com 17 anos, busca asilo. A comunidade vietnamita no Japão enfrenta desinformação devido a mudanças nas atitudes em relação aos imigrantes e nas regras de vistos. Na Polônia, ativistas lançaram um 'AbortOmat', um locker para pílulas de aborto, contornando a proibição quase total do aborto no país. Finalmente, a ONU alerta sobre as condições inseguras em Mianmar para os retornos de imigrantes da Malásia."}, "resumo_do_dia": {"politica_nacional": [{"id": 194976, "titulo": "Centro-Oeste reelege governadores de todos Estados no 1º turno; DF vai a 2º turno", "url": "https://www.infomoney.com.br/politica/centro-oeste-reelege-governadores-de-todos-estados-no-1o-turno-df-vai-a-2o-turno/", "fonte_id": "infomoney", "data_pub": "2026-10-05T00:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Todos os governadores do Centro-Oeste foram reeleitos no primeiro turno das eleições. A capital Distrito Federal, no entanto, terá segundo turno.", "titulo_pt": "Centro-oeste reelege governadores em primeiro turno; DF irá a segundo turno", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 194977, "titulo": "Ruas pode vencer no 1º turno se TSE anular votos de Garotinho; entenda", "url": "https://www.infomoney.com.br/politica/ruas-pode-vencer-no-1o-turno-se-tse-anular-votos-de-garotinho-entenda/", "fonte_id": "infomoney", "data_pub": "2026-10-05T00:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) indicou um segundo turno entre Eduardo Paes e Anthony Garotinho, mas a decisão ainda pode mudar se o TSE anular os votos de Garotinho. A candidata do partido Rede Sustentabilidade, Luiza Erundina, conhecida como Ruas, pode vencer no primeiro turno se isso ocorrer.", "titulo_pt": "Ruas pode vencer no 1º turno se TSE anular votos de Garotinho; entenda", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 195020, "titulo": "Lucas Pavanato e Nikolas Ferreira já são os deputados mais votados da história: veja os 10 no topo da lista até agora", "url": "https://www.bbc.com/portuguese/articles/c3y0elvd819lo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-05T00:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lucas Pavanato e Nikolas Ferreira do partido PL superaram o recorde anterior estabelecido por Eduardo Bolsonaro nas eleições de 2018, se tornando os deputados mais votados da história. A lista completa inclui os 10 candidatos com mais votos para a Câmara desta eleição.", "titulo_pt": "Lucas Pavanato e Nikolas Ferreira já são os deputados mais votados da história: veja os 10 no topo da lista até agora", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 195025, "titulo": "TSE mantém votos de Garotinho na apuração do 1º turno no Rio de Janeiro (RJ)", "url": "https://www.jota.info/eleicoes/eleicoes-2026/tse-mantem-votos-de-garotinho-na-apuracao-do-1o-turno-no-rio-de-janeiro-rj", "fonte_id": "jota", "data_pub": "2026-10-05T00:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Kassio Nunes Marques manteve os votos de Anthony Garotinho na apuração do primeiro turno das eleições no Rio de Janeiro, informou o Tribunal Superior Eleitoral (TSE). Os votos continuarão incluídos no cálculo até uma decisão colegiada sobre o registro do candidato.", "titulo_pt": "TSE mantém votos de Garotinho na apuração do 1º turno no Rio de Janeiro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 194993, "titulo": "Com maior percentual do país, Rafael Fonteles é reeleito governador do PI", "url": "https://www.metropoles.com/brasil/com-maior-percentual-do-pais-rafael-fonteles-e-reeleito-governador-do-pi", "fonte_id": "metropoles", "data_pub": "2026-10-05T00:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Rafael Fonteles foi reeleito governador do Piauí, obtendo mais de 70% dos votos válidos. Esta foi a maior proporção entre os governadores eleitos.", "titulo_pt": "Rafael Fonteles é reeleito governador do piauí com mais de 70% dos votos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 194994, "titulo": "Legítima, séria e confiável\", diz presidente do TRE-DF sobre eleições", "url": "https://www.metropoles.com/distrito-federal/legitima-seria-e-confiavel-diz-presidente-do-tre-df-sobre-eleicoes", "fonte_id": "metropoles", "data_pub": "2026-10-05T00:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do TRE-DF afirmou que as eleições são legítimas, sérias e confiáveis. Somente duas urnas entre as escolhidas para o teste de integridade apresentaram falhas humanas.", "titulo_pt": "Legítimas, sérias e confiáveis", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 194995, "titulo": "Fufuca (PP) e Lahesio Bonfim (Novo) são eleitos senadores pelo Maranhão", "url": "https://www.metropoles.com/brasil/fufuca-e-lahesio-bonfim-sao-eleitos-senadores-pelo-maranhao", "fonte_id": "metropoles", "data_pub": "2026-10-05T00:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fufuca (PPL) e Lahesio Bonfim (Novo) foram eleitos senadores pelo Maranhão. A disputa para o Senado Federal no estado contou com onze candidatos.", "titulo_pt": "Fufuca e Lahesio Bonfim são eleitos senadores pelo Maranhão", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 194954, "titulo": "Ciro Gomes perde governo do Ceará após romper com PT", "url": "https://www.cnnbrasil.com.br/eleicoes/ciro-gomes-perde-governo-do-ceara-apos-romper-com-pt/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-05T00:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ciro Gomes, do PSDB, não conseguiu se reeleger governador do Ceará. Ele foi derrotado pelo candidato do PT, Elmano de Freitas, em uma tentativa de retornar ao cargo de governador do estado.", "titulo_pt": "Ciro Gomes perde governo do Ceará após romper com PT", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 194978, "titulo": "Reeleito em SP, Tarcísio agradece Bolsonaro e promete fazer mais no segundo mandato", "url": "https://www.infomoney.com.br/politica/reeleito-em-sp-tarcisio-agradece-bolsonaro-e-promete-fazer-mais-no-segundo-mandato/", "fonte_id": "infomoney", "data_pub": "2026-10-05T00:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tarcísio de Oliveira, governador do Republicanos, foi reeleito no primeiro turno nas eleições de São Paulo. Ele agradeceu o apoio do presidente Jair Bolsonaro e prometeu realizar mais ações durante seu segundo mandato.", "titulo_pt": "Reeleito em SP, Tarcísio agradece Bolsonaro e promete fazer mais no segundo mandato", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 194980, "titulo": "Zema, Caiado, Cury e Renan: para onde podem ir seus votos no 2º turno", "url": "https://www.infomoney.com.br/politica/zema-caiado-cury-e-renan-para-onde-podem-ir-seus-votos-no-2o-turno/", "fonte_id": "infomoney", "data_pub": "2026-10-05T00:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O artigo discute possíveis direções dos votos dos candidatos Zema, Caiado, Cury e Renan no segundo turno da eleição, focando em como seus eleitores podem se comportar entre as opções Flávio e Lula.", "titulo_pt": "Zema, Caiado, Cury e Renan: para onde podem ir seus votos no 2º turno", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 194981, "titulo": "Omar Aziz e Maria do Carmo vão para o 2º turno no Amazonas", "url": "https://www.infomoney.com.br/politica/amazonas-1-turno-resultado/", "fonte_id": "infomoney", "data_pub": "2026-10-05T00:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Omar Aziz e Maria do Carmo avançaram para o segundo turno das eleições no Amazonas. O segundo turno ocorrerá em 25 de outubro.", "titulo_pt": "Omar Aziz e Maria do Carmo avançam para o segundo turno no Amazonas", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 195002, "titulo": "Lula repete feito contra Jair e ganha de Flávio na cidade de São Paulo", "url": "https://www.metropoles.com/sao-paulo/lula-repete-feito-contra-jair-e-ganha-de-flavio-na-cidade-de-sao-paulo", "fonte_id": "metropoles", "data_pub": "2026-10-05T00:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2022, Lula venceu Jair Bolsonaro entre os paulistanos. No primeiro turno das eleições, Lula também superou Flávio Bolsonaro na cidade de São Paulo, obtendo 4,45% a mais dos votos.", "titulo_pt": "Lula vence Flávio e bolsonaro na cidade de São Paulo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 194959, "titulo": "Gleisi Hoffmann perde disputa pelo Senado no Paraná", "url": "https://www.cnnbrasil.com.br/eleicoes/gleisi-hoffmann-perde-disputa-pelo-senado-no-parana/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-05T00:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Filipe Barros (PL) e Deltan Dallagnol (Novo) venceram a disputa pelo Senado no Paraná. Gleisi Hoffmann (PT), que já ocupou o cargo entre 2011 e 2019, ficou em quarto lugar.", "titulo_pt": "Gleisi Hoffmann perde disputa pelo Senado no Paraná", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 195003, "titulo": "Helder Barbalho (MDB) e Éder Mauro (PL) são eleitos para o Senado no Pará", "url": "https://www.metropoles.com/brasil/eleitos-senadores-para", "fonte_id": "metropoles", "data_pub": "2026-10-05T00:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Helder Barbalho (MDB) e Delegado Éder Mauro (PL) foram eleitos para representar o Pará no Senado Federal.", "titulo_pt": "Helder Barbalho (MDB) e Éder Mauro (PL) são eleitos para o Senado no Pará", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 195026, "titulo": "Jerônimo vence ACM Neto com 55,26% dos votos e é reeleito governador da Bahia", "url": "https://www.jota.info/eleicoes/eleicoes-2026/jeronimo-vence-acm-neto-com-5526-dos-votos-e-e-reeleito-governador-da-bahia", "fonte_id": "jota", "data_pub": "2026-10-05T00:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jerônimo de Azevedo foi reeleito governador da Bahia com 55,26% dos votos. ACM Neto ficou em segundo lugar com 44,25% dos votos.", "titulo_pt": "Jerônimo vence ACM Neto com 55,26% dos votos e é reeleito governador da Bahia", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 194984, "titulo": "Eduardo Braide (PSD) é eleito governador do Maranhão em 1º turno", "url": "https://www.infomoney.com.br/politica/maranhao-resultado-1-turno/", "fonte_id": "infomoney", "data_pub": "2026-10-05T00:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eduardo Braide, do PSD, foi eleito governador do Maranhão no primeiro turno das eleições. Ele derrotou Orleans Brandão.", "titulo_pt": "Eduardo Braide (PSD) é eleito governador do Maranhão no primeiro turno", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 195357, "titulo": "Election panel orders Netanyahu to remove 'election propaganda' videos", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/election-panel-orders-netanyahu-remove-election-propaganda-videos", "fonte_id": "middle_east_eye", "data_pub": "2026-10-05T00:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um painel eleitoral israelense ordenou que o primeiro-ministro Benjamin Netanyahu remova vídeos online que foram usados sem autorização, pois constituem propaganda eleitoral. O presidente do Comitê Central das Eleições de Israel, Noam Sohlberg, afirmou que os vídeos incluem comentários que podem ser interpretados como autoelogios sobre os feitos do governo e do primeiro-ministro.", "titulo_pt": "Comitê eleitoral ordena que Netanyahu remova vídeos de campanha", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 195018, "titulo": "Quem são os governadores eleitos em 2026 e quais Estados terão 2º turno: veja os resultados", "url": "https://www.bbc.com/portuguese/articles/c6lyk4jgljv9o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-05T00:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eduardo Riedel, do PP, foi eleito governador de Mato Grosso do Sul. Mato Grosso do Sul foi o primeiro estado a definir seu governador para o biênio 2026-2027.", "titulo_pt": "Quem são os governadores eleitos em 2026 e quais Estados terão 2º turno: veja os resultados", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 195204, "titulo": "Brazil presidential election 2026: first-round live results", "url": "https://www.theguardian.com/world/ng-interactive/2026/oct/04/brazil-presidential-election-2026-first-round-live-results", "fonte_id": "guardian_world", "data_pub": "2026-10-05T00:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Luiz Inácio Lula da Silva está enfrentando Flávio Bolsonaro na primeira rodada da eleição presidencial. Flávio Bolsonaro é o filho do ex-presidente Jair Bolsonaro, que está preso por planejar um golpe militar. O presidente do Brasil é eleito diretamente, e os candidatos precisam de mais de 50% dos votos para evitar uma segunda rodada.", "titulo_pt": "Eleição presidencial do Brasil 2026: resultados ao vivo da primeira rodada", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 195331, "titulo": "Flávio Bolsonaro takes lead in first round of Brazil election", "url": "https://www.ft.com/content/028da85c-0e1f-4f1b-ad04-eac78c4f18c0?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-05T00:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro lidera nas intenções de voto no primeiro turno das eleições, contra Luiz Inácio Lula da Silva. O candidato é o filho do ex-presidente Jair Bolsonaro, que está preso, e representa uma surpresa nas pesquisas de intenção de voto.", "titulo_pt": "Filho do ex-presidente preso lidera primeiro turno das eleições contra lula", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 195199, "titulo": "Iran’s Top Security Official Warns of Dire Economic Crisis", "url": "https://www.nytimes.com/2026/10/04/world/middleeast/iran-economy-rial.html", "fonte_id": "nyt_world", "data_pub": "2026-10-05T00:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe de segurança do Irã, Mohsen Rezaei, fez uma rara admissão sobre uma grave crise econômica. Este aviso ocorreu algumas semanas após os Estados Unidos intensificarem as sanções e um bloqueio naval.", "titulo_pt": "Chefe de segurança do Irã admite gravidade da crise econômica", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 195332, "titulo": "Iran war live: Yemen fighting intensifies; Tehran says ready for US attacks", "url": "https://www.aljazeera.com/news/liveblog/2026/10/5/iran-war-live-fighting-in-yemen-intensifies-tehran-says-ready-for-us-war?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-05T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo de Yemen anuncia uma ofensiva significativa contra os hutis, enquanto o Irã afirma que está disposto a se defender em caso de ataques dos Estados Unidos.", "titulo_pt": "Irã em alerta: ofensiva do yemen contra hutis e prontidão iraniana para enfrentar ataques americanos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 195431, "titulo": "US-China differences offer Taiwan opportunity: expert", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/05/2003865414", "fonte_id": "taipei_times", "data_pub": "2026-10-05T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um especialista afirma que as diferenças entre os Estados Unidos e China oferecem uma oportunidade para Taiwan. O especialista sugere que Taiwan pode explorar essas diferenças a seu favor.", "titulo_pt": "Diferenças entre EUA e china oferecem oportunidade para Taiwan: especialista", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 195432, "titulo": "Four more missing in China, Mainland Affairs Council says", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/05/2003865415", "fonte_id": "taipei_times", "data_pub": "2026-10-05T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Conselho das Relações Cross-Strait informou que mais quatro pessoas estão desaparecidas na China.", "titulo_pt": "Quatro pessoas adicionais desaparecidas na China, diz conselho das relações cross-strait", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 195433, "titulo": "Laos base part of China’s regional ambitions: expert", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/05/2003865416", "fonte_id": "taipei_times", "data_pub": "2026-10-05T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um especialista afirma que uma base no Laos faz parte das aspirações regionais da China. Sem fornecer detalhes adicionais sobre a natureza ou as implicações desta base.", "titulo_pt": "Base no laos parte das aspirações regionais da China, diz especialista", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 195434, "titulo": "Xi could escalate ‘gray zone’ action in 4th term", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/05/2003865417", "fonte_id": "taipei_times", "data_pub": "2026-10-05T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente chinês Xi Jinping poderia intensificar ações de 'zona cinza' em seu quarto mandato. As 'ações de zona cinza' referem-se a atividades não declaradas de natureza militar ou política que visam aumentar a pressão ou influenciar adversários sem entrar em conflitos abertos.", "titulo_pt": "Xi poderia escalonar ações de 'zona cinza' em quarto mandato", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 195333, "titulo": "Israel face spitting allegation as Ireland boss ‘delighted’ ties after over", "url": "https://www.aljazeera.com/sports/2026/10/4/israel-face-spitting-allegation-as-ireland-boss-delighted-ties-after-over?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-04T23:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O gerente da seleção irlandesa afirmou que uma comissão disciplinar investigará as acusações de que um jogador israelense cuspiu em um de seus membros da comissão técnica. O gerente irlandês expressou satisfação após as relações entre as duas seleções melhorarem.", "titulo_pt": "Irlandês diz que comissão disciplinar investigará acusações de jogador israelense ter cuspiu em sua comissão técnica", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 195456, "titulo": "US-China truce extension lifts 4Q freight rates, tightens capacity", "url": "https://www.digitimes.com/news/a20261002PD229/donald-trump-capacity-xi-jinping-market-demand.html?chid=10", "fonte_id": "digitimes", "data_pub": "2026-10-04T23:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Após a reunião entre o presidente dos Estados Unidos, Donald Trump, e o presidente da China, Xi Jinping, os dois lados concordaram em estender o acordo de comércio, o que foi interpretado positivamente pelo mercado. Os participantes do setor esperam que as remessas entre China e Estados Unidos que foram adiadas sejam liberadas gradualmente, elevando as tarifas de frete a partir de outubro e apertando o espaço de carga.", "titulo_pt": "Estendendo o acordo comercial, tarifas de frete devem subir e apertar o espaço de carga", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 195358, "titulo": "Israeli troops kill man in southern Syria", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-troops-kill-man-southern-syria", "fonte_id": "middle_east_eye", "data_pub": "2026-10-04T23:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israelenses mataram um homem na Síria sulana, em uma operação militar que continua no país. Alegam que o indivíduo tentou entrar em uma de suas bases militares, motivando o uso de força letal.", "titulo_pt": "Israelenses matam homem no sul da síria", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}], "mundo__eventos": [{"titulo": "Bolsonaro e Lula se enfrentarão na segunda volta das eleições", "sumario": "Luiz Inácio Lula da Silva e Jair Bolsonaro foram os candidatos mais votados na primeira volta das eleições presidenciais do Brasil. Jair Bolsonaro, senador e filho do ex-presidente condenado por golpismo, obteve 47,1% dos votos contra 45% de Luiz Inácio Lula da Silva, o mandatário da esquerda. Flávio Bolsonaro venceu a primeira volta das eleições com 47% dos votos, contra 45% de Lula.", "artigos": [{"id": 195474, "titulo": "Bolsonaro and Lula head to runoff: 5 takeaways from Brazil’s election", "url": "https://www.washingtonpost.com/world/2026/10/04/bolsonaro-lula-head-runoff-5-takeaways-brazils-election/", "fonte_id": "washington_post_world", "data_pub": "2026-10-05T00:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Luiz Inácio Lula da Silva e Jair Bolsonaro foram os candidatos mais votados na primeira volta das eleições presidenciais do Brasil. Eles irão disputar a segunda volta em 25 de outubro.", "titulo_pt": "Bolsonaro e Lula se enfrentarão na segunda volta das eleições", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 195165, "titulo": "Bolsonaro vence a Lula en primera vuelta de las elecciones y acaricia el retorno de la ultraderecha al poder en Brasil", "url": "https://elpais.com/america/2026-10-05/bolsonaro-vence-a-lula-en-primera-vuelta-y-acaricia-el-retorno-de-la-ultraderecha-al-poder-en-brasil.html", "fonte_id": "elpais_america", "data_pub": "2026-10-05T00:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Jair Bolsonaro, senador e filho do ex-presidente condenado por golpismo, obteve 47,1% dos votos contra 45% de Luiz Inácio Lula da Silva, o mandatário da esquerda. Ambos avançarão para a segunda volta das eleições, marcada para o dia 25 de outubro.", "titulo_pt": "Bolsonaro vence Lula na primeira volta das eleições e avança para a segunda volta", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 195166, "titulo": "Resultados de las elecciones en Brasil, en vivo | Milei y De la Espriella felicitan a Bolsonaro por el resultado de la primera vuelta en Brasil", "url": "https://elpais.com/america/2026-10-04/resultados-de-las-elecciones-en-brasil-2026-en-vivo.html", "fonte_id": "elpais_america", "data_pub": "2026-10-05T00:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro venceu a primeira volta das eleições com 47% dos votos, contra 45% de Lula. Mais do 99% dos votos já foram contados.", "titulo_pt": "Resultados da primeira volta das eleições no Brasil em tempo real: flávio Bolsonaro vence lula", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}]}], "economia": [{"id": 194979, "titulo": "Após resultado do 1º turno das eleições, como os mercados vão reagir nesta segunda?", "url": "https://www.infomoney.com.br/mercados/apos-resultado-do-1o-turno-das-eleicoes-como-os-mercados-vao-reagir-nesta-segunda/", "fonte_id": "infomoney", "data_pub": "2026-10-05T00:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O resultado do primeiro turno das eleições mostrou um avanço acima do esperado do candidato bolsonarista, levantando expectativas de uma vitória de direita nos próximos dias.", "titulo_pt": "Depois do resultado do 1º turno das eleições, como os mercados vão reagir nesta segunda?", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 194982, "titulo": "Jerônimo Rodrigues (PT) é reeleito governador da Bahia no primeiro turno", "url": "https://www.infomoney.com.br/politica/bahia-resultado-1-turno-2/", "fonte_id": "infomoney", "data_pub": "2026-10-05T00:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jerônimo Rodrigues do PT foi reeleito governador da Bahia no primeiro turno. O petista superou ACM Neto do União Brasil, apoiado pelo PL, evitando a necessidade de um segundo turno.", "titulo_pt": "Jerônimo Rodrigues (PT) é reeleito governador da Bahia no primeiro turno", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 195448, "titulo": "Domestic gasoline, diesel prices to stay unchanged", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/05/2003865390", "fonte_id": "taipei_times", "data_pub": "2026-10-05T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os preços da gasolina e do diesel internos permanecerão estáveis. Não há alterações nos preços desses combustíveis no mercado interno.", "titulo_pt": "Preços da gasolina e do diesel internos manter-se-ão inalterados", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 195058, "titulo": "Quanto custaria um Nissan Livina hoje, com a inflação?", "url": "https://canaltech.com.br/carros/quanto-custaria-um-nissan-livina-hoje-com-a-inflacao/", "fonte_id": "canaltech", "data_pub": "2026-10-04T22:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Nissan Livina, um veículo MPV que chegou ao Brasil em 2009, foi produzido pela montadora no país por cinco anos, período mais curto em comparação com outros mercados como China, Indonésia e África do Sul. Este modelo foi popular entre os taxistas devido ao seu espaço interno amplo, robustez e custo-benefício.", "titulo_pt": "Quanto custaria um Nissan Livina hoje, considerando a inflação?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 195329, "titulo": "Schneider Electric nears deal to buy software group PTC for $20bn", "url": "https://www.ft.com/content/2084f349-0829-4130-a5e6-b98929a6e633?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-04T21:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Schneider Electric está prestes a fechar um acordo para adquirir o grupo de software PTC por 20 bilhões de dólares. Esta aquisição seria a maior da empresa francesa e ampliaria seus produtos voltados para fabricantes.", "titulo_pt": "Schneider Electric se aproxima de acordo para comprar grupo de software PTC por 20 bi", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 195307, "titulo": "US growth remains strong but job creation slows", "url": "https://www.lemonde.fr/en/economy/article/2026/10/04/us-growth-remains-strong-but-job-creation-slows_6758245_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-04T21:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O país criou apenas 29.000 novos postos de trabalho em setembro, abaixo do esperado pela análise de 80.000. O setor de saúde foi responsável pela maioria desses novos empregos, enquanto o setor financeiro continuou a registrar significativas perdas de empregos.", "titulo_pt": "Crescimento econômico nos EUA permanece forte, mas criação de empregos diminui", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 195330, "titulo": "Dealmaking slowdown threatens early end to M&A boom", "url": "https://www.ft.com/content/00fb4438-1f86-4bf2-a165-0c39f3fd506b?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-04T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A atividade de fusões e aquisições pode enfrentar um fim mais precoce do que esperado devido a uma diminuição no interesse, preocupações com inteligência artificial e as eleições intermédiacas que estão enfraquecendo a disposição dos investidores a fechar negócios.", "titulo_pt": "Decréscimo nas negociações ameaça um fim precoce ao boom de M&A", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 195416, "titulo": "Hotstone Yoga closure losses rise to HK$7.8 million as 694 customers file reports", "url": "https://www.scmp.com/news/hong-kong/hong-kong-economy/article/3369722/hotstone-yoga-closure-losses-rise-hk78-million-694-customers-file-reports?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-04T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As perdas relacionadas ao encerramento abrupto da Hotstone Yoga subiram para quase 8 milhões de Hongkongdólares, com cerca de 700 relatórios de clientes afetados apresentados em Hong Kong. Até às 18h do domingo, o Departamento de Alfândega e Tributação havia recebido 694 relatórios, envolvendo contratos de serviço avaliados em cerca de 7,8 milhões de Hongkongdólares. O Conselho do Consumidor registrou 416 reclamações até as 17h do mesmo dia, com prejuízos totais alegados de 5,42 milhões de Hongkongdólares.", "titulo_pt": "Perdas da hotstone Yoga encerradas em HK$8 milhões após 694 clientes apresentarem reclamações", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 195071, "titulo": "Quanto custaria um iPod nano hoje, corrigido pela inflação?", "url": "https://canaltech.com.br/smartphone/quanto-custaria-um-ipod-nano-hoje-corrigido-pela-inflacao/", "fonte_id": "canaltech", "data_pub": "2026-10-04T13:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O iPod nano era um dos dispositivos mais populares da Apple nos anos 2000, conhecido por sua pequena e leve forma e armazenamento em memória flash. Para saber quanto custaria um iPod nano hoje, corrigido pela inflação, seria necessário considerar os preços de entrada praticados no Brasil na época.", "titulo_pt": "Quanto custaria um ipod nano hoje, ajustado pela inflação?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 194683, "titulo": "The US is looking more like Italy", "url": "https://www.ft.com/content/a2711e64-145b-4df6-baf7-56a3da7ed0b0?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-04T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os EUA estão se tornando menos excepcionais e o Novo Mundo está se aproximando do Velho Mundo em termos econômicos e sociais.", "titulo_pt": "Os EUA estão parecendo mais com a Itália", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 194688, "titulo": "Investors look to shelter portfolios from rising AI concentration risks", "url": "https://www.ft.com/content/3302fd5c-8b92-425b-9523-673b2565bb10?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-04T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gestores de fundos consideram fundos de hedge e ativos de mercados emergentes como proteção contra um possível repentino desinteresse em inteligência artificial.", "titulo_pt": "Investidores buscam proteger portfólios contra riscos crescentes de concentração em inteligência artificial", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 194307, "titulo": "Suspeita de bomba fecha estação Higienópolis-Mackenzie do metrô em São Paulo", "url": "https://www.infomoney.com.br/brasil/suspeita-de-bomba-fecha-estacao-higienopolis-mackenzie-do-metro-em-sao-paulo/", "fonte_id": "infomoney", "data_pub": "2026-10-04T11:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A estação Higienópolis-Mackenzie do metrô em São Paulo foi fechada após a suspeita de uma bomba ser encontrada perto da linha de bloqueio. A Polícia Militar e o Grupo de Ações Táticas Especiais (GATE) foram chamados para verificar o objeto.", "titulo_pt": "Suspeita de bomba fecha estação Higienópolis-Mackenzie do metrô em São Paulo", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 194308, "titulo": "Mãe de Flávio Bolsonaro diz que família está esperançosa", "url": "https://www.infomoney.com.br/politica/mae-de-flavio-bolsonaro-diz-que-familia-esta-esperancosa/", "fonte_id": "infomoney", "data_pub": "2026-10-04T11:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A mãe de Flávio Bolsonaro afirmou que a família está esperançosa. Ela destacou a 'garra' e 'disposição' de Flávio durante a campanha eleitoral.", "titulo_pt": "Mãe de Flávio Bolsonaro diz que família está esperançosa", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 194309, "titulo": "TSE: Eleitores no exterior enviaram 124 mil justificativas até às 7h", "url": "https://www.infomoney.com.br/politica/tse-eleitores-no-exterior-enviaram-124-mil-justificativas-ate-as-7h/", "fonte_id": "infomoney", "data_pub": "2026-10-04T11:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) informou que só começará a divulgar os resultados eleitorais após o fechamento das urnas no Brasil. Até às 7h, 124 mil justificativas de eleitores no exterior já haviam sido enviadas.", "titulo_pt": "TSE: eleitores no exterior enviaram 124 mil justificativas até às 7h", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 194341, "titulo": "As discussões econômicas que o Congresso eleito vai encontrar em 2027", "url": "https://veja.abril.com.br/economia/as-discussoes-economicas-que-o-congresso-eleito-vai-encontrar-em-2027/", "fonte_id": "veja", "data_pub": "2026-10-04T11:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O novo Congresso enfrentará uma economia com uma dívida pública em crescimento e limitações para aumentar gastos. A reforma tributária avançará para uma fase decisiva.", "titulo_pt": "Discussões econômicas que o Congresso eleito em 2027 encontrará", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 194159, "titulo": "Veto no Brasil distorce projeções eleitorais de Kalshi e Polymarket, dizem empresas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/veto-no-brasil-distorce-projecoes-eleitorais-de-kalshi-e-polymarket-dizem-empresas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-04T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As plataformas de mercado de previsão, como Kalshi e Polymarket, continuam a fornecer projeções sobre as eleições brasileiras, mesmo estando proibidas no país. No entanto, o bloqueio no Brasil prejudica os resultados das empresas.", "titulo_pt": "Veto no Brasil distorce projeções eleitorais de Kalshi e Polymarket, dizem empresas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 195446, "titulo": "AI needs more safety layers: ex-OpenAI engineer", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/05/2003865388", "fonte_id": "taipei_times", "data_pub": "2026-10-05T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ex-engenheiro da OpenAI afirma que a inteligência artificial precisa de camadas adicionais de segurança. O artigo discute a necessidade de melhorar a segurança das tecnologias de IA.", "titulo_pt": "IA precisa de camadas adicionais de segurança: ex-engenheiro da openai", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 195447, "titulo": "AI frenzy powers Hong Kong fundraising record", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/05/2003865389", "fonte_id": "taipei_times", "data_pub": "2026-10-05T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Houve um recorde de arrecadação em Hong Kong graças à febre pelo investimento em inteligência artificial.", "titulo_pt": "Frenesi por IA impulsiona recorde de arrecadação em Hong Kong", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 195449, "titulo": "Amazon makes vow to data center towns", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/05/2003865391", "fonte_id": "taipei_times", "data_pub": "2026-10-05T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Amazon se comprometeu com as cidades que abrigam seus centros de dados, prometendo investimentos e apoio local. A empresa declarou que visa fortalecer a infraestrutura e a economia dessas comunidades.", "titulo_pt": "Amazon promete apoio às cidades de seus centros de dados", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 195450, "titulo": "SpaceX's Starship reaches orbit, but engine issues raise stakes for NASA's Moon plan", "url": "https://www.digitimes.com/news/a20261002PD248/spacex-starlink-commercial-launch.html", "fonte_id": "digitimes", "data_pub": "2026-10-04T23:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Starship da SpaceX atingiu a órbita terrestre pela primeira vez em sua 14ª viagem de teste, lançando 26 satélites Starlink, marcando um importante avanço para o foguete pesado. No entanto, anomalias nos motores durante o voo levaram a SpaceX a interromper a missão originalmente planejada para durar cerca de 10 horas após apenas três horas.", "titulo_pt": "Starship da spacex atinge órbita terrestre, mas anomalias nos motores aumentam riscos para o plano da NASA para a lua", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 195451, "titulo": "DIGITIMES Insight: AI data demand surges as power and cooling become new bottlenecks", "url": "https://www.digitimes.com/news/a20261002PD250/data-cooling-demand-chips-hbm.html", "fonte_id": "digitimes", "data_pub": "2026-10-04T23:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A demanda de dados para inteligência artificial está aumentando rapidamente, enquanto a integração de transistores de computação de IA em um único pacote CoWoS cresce, o movimento de grandes volumes de dados para os chips de computação se torna cada vez mais crucial para a utilização plena da potência de computação disponível. Além disso, o poder e a refrigeração estão se tornando novos gargalos.", "titulo_pt": "Insight do DIGITIMES: aumento da demanda de dados de IA coloca o poder e a refrigeração como novos gargalos", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 195452, "titulo": "Tesla leads Taiwan registrations as it advances FSD road tests", "url": "https://www.digitimes.com/news/a20261002PD245/tesla-taiwan-fsd-2026-market.html", "fonte_id": "digitimes", "data_pub": "2026-10-04T23:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em setembro, a Tesla liderou as novas matrículas de carros novos na Taiwan e disse estar prosseguindo com o processo de aprovação do seu sistema de assistência ao motorista Full Self-Driving (Supervisionado), ou FSD (S). A empresa apresentou um quadro de testes de estrada em uma reunião técnica, trabalhando com agências governamentais e especialistas acadêmicos.", "titulo_pt": "Tesla lidera matrículas de carros novos na Taiwan e avança com testes de FSD", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 195453, "titulo": "Acer tops Canada's Windows PC market in August", "url": "https://www.digitimes.com/news/a20261002PD232/acer-canada-windows-market-pc.html", "fonte_id": "digitimes", "data_pub": "2026-10-04T23:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em agosto de 2026, a Acer liderou o mercado de PCs Windows no Canadá com 22,9% de participação, um aumento de 18,3% em comparação com o mesmo período do ano anterior, enquanto a indústria registrou uma diminuição de 23,2%.", "titulo_pt": "Acer lidera mercado de pcs Windows no canadá em agosto de 2026", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 195454, "titulo": "AI system integration eclipses chip specs", "url": "https://www.digitimes.com/news/a20261002PD231/chipmakers-design-chips-competition-hardware.html", "fonte_id": "digitimes", "data_pub": "2026-10-04T23:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O desenvolvimento rápido da IA em ambientes de nuvem e borda faz com que as grandes fabricantes de chips dediquem menos atenção às especificações dos chips e mais ao design de sistemas e ecossistemas. Para os líderes de design de IC, entrar na camada de sistema se tornou um fator-chave para se atualizar na era da IA, pois fornecer apenas chips não é mais suficiente para manter-se competitivo em linhas de produtos de IA.", "titulo_pt": "Integração de sistema supera especificações de chip em IA", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 195455, "titulo": "Nanya Tech expands 3D OSAT to chase HBM-like demand", "url": "https://www.digitimes.com/news/a20261002PD230/nanya-technology-3d-demand-osat-plant.html", "fonte_id": "digitimes", "data_pub": "2026-10-04T23:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nanya Technology está aumentando sua capacidade de fábrica para expandir a embalagem e testes de dispositivos 3D, em resposta a uma demanda crescente por soluções de memória de alta performance e larga banda. A empresa obteve aprovação para estabelecer uma planta de embalagem e testes de wafer 3D no Parque Científico de Pingtung, visando capturar essa demanda.", "titulo_pt": "Nanya Tech amplia capacidade de embalagem 3D para atender à demanda crescente de memórias de alta performance", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 195457, "titulo": "Podcast highlights: TSMC Texas plant talk is premature, Intel 18A hits backfiring criticism", "url": "https://www.digitimes.com/news/a20261002PD227/tsmc-intel-texas-digitimes-arizona.html", "fonte_id": "digitimes", "data_pub": "2026-10-04T23:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O podcast do analista Luke Lin da DIGITIMES discute a suposta expansão da TSMC em Texas, o debate sobre os processos 14A e 18A da Intel, e a promoção da Qualcomm de computação de alta banda (HBC) devido à crescente demanda por processos híbridos e embalagens avançadas devido ao aumento da carga de trabalho de inteligência artificial (IA).", "titulo_pt": "Podcast destaca expansão da TSMC em Texas, debate sobre processos da Intel e promoção da qualcomm em ai", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 195458, "titulo": "AI-driven power crunch positions energy upstarts as key IT equipment buyers", "url": "https://www.digitimes.com/news/a20261002PD221/electricity-data-center-demand-amazon.html", "fonte_id": "digitimes", "data_pub": "2026-10-04T23:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A crescente demanda por energia devido à inteligência artificial, associada a uma crescente oposição pública a novos centros de dados, está elevando os desenvolvedores de energia para se tornarem os novos intermediários na economia da inteligência artificial. Além de maximizar o valor do terreno através do acesso à rede, alguns operadores de energia ricos estão avançando na cadeia de valor tecnológica e podem se tornar compradores diretos de equipamentos de TI.", "titulo_pt": "A ascensão dos iniciantes em energia como compradores-chave de equipamentos de ti impulsionada pela inteligência artificial", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 195501, "titulo": "Germany funds tens of thousands of interceptor drones as Quantum Systems scales in Ukraine", "url": "https://tech.eu/2026/10/04/germany-funds-tens-of-thousands-of-interceptor-drones-as-quantum-systems-scales-in-ukraine/", "fonte_id": "tech_eu", "data_pub": "2026-10-04T23:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Federal Chancellor da Alemanha, Friedrich Merz, anunciou financiamento para aquisição de several tens of thousands de drones interceptores da Quantum Systems para a Ucrânia, como parte do pacote de ajuda militar alemão para o inverno.", "titulo_pt": "Alemanha financia drones interceptores da Quantum Systems para a Ucrânia", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 195502, "titulo": "ARX Robotics and Roboneers step up UGV collaboration for Ukraine’s battlefield", "url": "https://tech.eu/2026/10/04/arx-robotics-and-roboneers-step-up-ugv-collaboration-for-ukraines-battlefield/", "fonte_id": "tech_eu", "data_pub": "2026-10-04T23:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de defesa alemã ARX Robotics estabeleceu uma parceria estratégica com a empresa ucraniana Roboneers para colaborar no desenvolvimento de veículos terrestres não tripulados (UGVs) para o campo de batalha ucraniano.", "titulo_pt": "ARX Robotics e Roboneers intensificam colaboração para ugvs na Ucrânia", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 195057, "titulo": "A Blizzard voltou? 5 sinais de que o estúdio está mais vivo do que nunca", "url": "https://canaltech.com.br/games/sinais-de-que-a-blizzard-voltou/", "fonte_id": "canaltech", "data_pub": "2026-10-04T23:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Blizzard tem sido crucial para o desenvolvimento dos jogos para PC, tendo revolucionado diversos gêneros como ARPG, RTS, MMORPG e hero shooter. Apesar de ter passado por problemas graves relacionados a escândalos trabalhistas e de cultura tóxica, a produtora ainda é considerada importante para a indústria dos games.", "titulo_pt": "A Blizzard voltou? 5 sinais de que o estúdio está mais vivo do que nunca", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 195007, "titulo": "IA consegue saber pelo cérebro quando entendeu errado o que você quis dizer", "url": "https://olhardigital.com.br/2026/10/04/inteligencia-artificial/ia-consegue-saber-pelo-cerebro-quando-entendeu-errado-o-que-voce-quis-dizer/", "fonte_id": "olhar_digital", "data_pub": "2026-10-04T22:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A proposta é que sistemas de inteligência artificial possam perceber quando entenderam algo de forma incorreta sem que o usuário tenha que corrigir verbalmente. O objetivo é permitir que os sistemas de IA reconheçam quando houve um mal-entendido.", "titulo_pt": "IA consegue saber pelo cérebro quando entendeu errado o que você quis dizer", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 195008, "titulo": "Celulares viram peça central do campo de batalha", "url": "https://olhardigital.com.br/2026/10/04/pro/celulares-viram-peca-central-do-campo-de-batalha/", "fonte_id": "olhar_digital", "data_pub": "2026-10-04T22:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A tecnologia, incluindo smartphones, é uma parte crucial do programa Next Generation Command and Control (NGC2), destinado a modernizar os sistemas de comando e controle das Forças Armadas dos Estados Unidos. Os celulares desempenham um papel central no campo de batalha dentro desse programa.", "titulo_pt": "Celulares tornam-se peça central do campo de batalha", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}], "tecnologia__eventos": [], "ciencia": [{"id": 195476, "titulo": "Nature-strip gardens are a paradise for pollinators in your street", "url": "https://phys.org/news/2026-09-nature-gardens-paradise-pollinators-street.html", "fonte_id": "phys_org", "data_pub": "2026-10-05T00:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em frente a muitas casas australianas, existe uma faixa de terra entre o calçadão e a rua, conhecida como nature strip, que geralmente não é considerada. Essa faixa pode se tornar um paraíso para polinizadores se utilizada adequadamente.", "titulo_pt": "Jardins de nature strip podem ser paraíso para polinizadores em suas ruas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 195437, "titulo": "Health study shows the efficacy of drug treatments", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/05/2003865420", "fonte_id": "taipei_times", "data_pub": "2026-10-05T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo de saúde demonstrou a eficácia das tratamentos com medicamentos. Os detalhes específicos do estudo não foram fornecidos nesse trecho.", "titulo_pt": "Estudo de saúde mostra a eficácia de tratamentos com medicamentos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 195503, "titulo": "Curiosity Blog, Sols 5022-5028: Cashing in at Cache Creek", "url": "https://science.nasa.gov/blog/curiosity-blog-sols-5022-5028-cashing-in-at-cache-creek/", "fonte_id": "nasa_news", "data_pub": "2026-10-04T21:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A área do cráter Gale que a equipe planejou explorar foi dividida em parcelas retangulares com nomes designados, inspirados em pequenas cidades associadas a características geológicas significativas. Antes do pouso, a equipe selecionou a área conhecida como Cache Creek para exploração com o rover Curiosity.", "titulo_pt": "Blog do curiosity, solos 5022-5028: parque de descanso em Cache Creek", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 195478, "titulo": "Nanoneedle arrays map RNA in fresh tissue without sequencing or amplification", "url": "https://phys.org/news/2026-09-nanoneedle-arrays-rna-fresh-tissue.html", "fonte_id": "phys_org", "data_pub": "2026-10-04T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Recentemente, a omicronespacial se tornou uma ferramenta poderosa, permitindo que os pesquisadores vejam não apenas quais moléculas estão presentes em um tecido, mas também onde estão localizadas e como estão organizadas entre células, estruturas de tecido e microambientes locais. No entanto, à medida que o campo avança, uma questão importante permanece: quantas dessas tecnologias poderosas estão prontas para uso clínico rotineiro?", "titulo_pt": "Array de agulhas nanométricas mapeiam RNA em tecido fresco sem sequenciamento ou amplificação", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 195479, "titulo": "Informal businesses belong in entrepreneurial ecosystems, review argues", "url": "https://phys.org/news/2026-09-businesses-entrepreneurial-ecosystems.html", "fonte_id": "phys_org", "data_pub": "2026-10-04T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma revisão sistemática de negócios informais publicada na International Journal of Entrepreneurship and Small Business argumenta que esses negócios devem ser considerados parte do ecossistema empresarial maior, em vez de serem vistos como uma característica periférica da economia.", "titulo_pt": "Empreendimentos informais devem fazer parte dos ecossistemas empresariais, argumenta revisão", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 195480, "titulo": "Too many males to choose from can overwhelm female frogs—and change who gets to mate", "url": "https://phys.org/news/2026-10-males-overwhelm-female-frogs.html", "fonte_id": "phys_org", "data_pub": "2026-10-04T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fêmeas de rãs podem se sentir sobrecarregadas com muitos machos para escolher e isso pode alterar o parceiro com quem acabam se reproduzindo. O fenômeno é semelhante à sensação humana de choice overload, quando há muitas opções a serem consideradas.", "titulo_pt": "Demasiados machos podem sobrecarregar fêmeas de rã e mudar quem elas escolhem como parceiro", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 195314, "titulo": "Scoop: White House monitors suspected plague outbreak in Russia", "url": "https://www.axios.com/2026/10/04/russia-plague-outbreak-white-house-us", "fonte_id": "axios", "data_pub": "2026-10-04T20:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Palácio Branco está monitorando relatos de um possível caso de peste e quarentenas relacionadas na Rússia. Autoridades russas tomaram medidas cautelares em resposta à morte de uma mulher que trabalhava em uma instalação de pesquisa antipeste, mas ainda não confirmaram que ela contraiu a peste.", "titulo_pt": "Pente-fino: palácio branco monitora possível surto de peste na Rússia", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 195481, "titulo": "Gamma-ray search sets new limits on dark matter annihilation in the inner Milky Way", "url": "https://phys.org/news/2026-09-gamma-ray-limits-dark-annihilation.html", "fonte_id": "phys_org", "data_pub": "2026-10-04T19:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa com raios gama estabeleceu novas limitações sobre a aniquilação de matéria escura no interior da Via Láctea. A matéria escura é um tipo de matéria no universo que não emite, absorve ou reflete luz detectável e interage muito debilmente com a matéria comum.", "titulo_pt": "Pesquisa com raios gama estabelece novas limitações sobre aniquilação de matéria escura na via láctea", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 195504, "titulo": "Mapping the Gaps in NASA’s Return to the Moon, featuring Richard Spolzino", "url": "https://www.nasa.gov/general/mapping-the-gaps-in-nasas-return-to-the-moon-featuring-richard-spolzino/", "fonte_id": "nasa_news", "data_pub": "2026-10-04T19:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Richard Spolzino busca contribuir para a missão da NASA de retornar à Lua, desejando poder dizer que tocou em algo relacionado a um lançamento de foguete. Ele não almeja um título específico ou missão, mas sim a satisfação de ver seu trabalho realizado.", "titulo_pt": "Mapeando os desafios na retorno da NASA à lua, com Richard Spolzino", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 195482, "titulo": "Taste shapes support for climate-friendly school meals", "url": "https://phys.org/news/2026-10-climate-friendly-school-meals.html", "fonte_id": "phys_org", "data_pub": "2026-10-04T18:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os estudantes em uma nova pesquisa não expressaram claramente sentimentos positivos ou negativos sobre refeições escolares mais amigáveis ao clima. A satisfação com o sabor, a sensação de saciedade e a familiaridade com os alimentos desempenharam um papel importante na percepção dos alunos.", "titulo_pt": "O gosto forma a opinião sobre refeições escolares amigáveis ao clima", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 195483, "titulo": "One giant clam contains a month‑by‑month diary of the Great Barrier Reef's climate 200 years ago", "url": "https://phys.org/news/2026-09-giant-clam-monthbymonth-diary-great.html", "fonte_id": "phys_org", "data_pub": "2026-10-04T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gigantes de concha do Great Barrier Reef contêm um registro mensal do clima do recife durante 200 anos. Esses moluscos são facilmente visíveis no fundo do mar azul do Great Barrier Reef, com suas conchas grandes e estilizadas abrigando uma manta branca que brilha em azul elétrico, verde e dourado.", "titulo_pt": "Um gigante de concha contém o diário mensal do clima do Great Barrier Reef há 200 anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 195484, "titulo": "Hidden X-ray phase revealed in likely neutron star merger", "url": "https://phys.org/news/2026-09-hidden-ray-phase-revealed-neutron.html", "fonte_id": "phys_org", "data_pub": "2026-10-04T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time internacional de astrônomos, incluindo pesquisadores do Departamento de Física e do Instituto de Astronomia e Astrofísica de Hong Kong (HKIAA) na Universidade de Hong Kong (HKU), descobriu uma fase de atividade de alta energia oculta após a fusão de estrelas compactas.", "titulo_pt": "Fase oculta de raios-x revelada após possível fusão de estrelas compactas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 195485, "titulo": "Heat-trapping gas once frozen in Arctic ground is slowly leaking and warming the planet", "url": "https://phys.org/news/2026-10-gas-frozen-arctic-ground-slowly.html", "fonte_id": "phys_org", "data_pub": "2026-10-04T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gases de efeito estufa presos no solo permafrost do Ártico estão sendo libertados à medida que o gelo se derrete devido ao aquecimento acelerado da região. Isso está liberando metano, um gás potente que atrai calor, contribuindo para o aquecimento global.", "titulo_pt": "Gás de efeito estufa congelado no ártico está lentamente se liberando e aquecendo o planeta", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 195486, "titulo": "How Enceladus' ocean spray becomes chemically diverse ice grains", "url": "https://phys.org/news/2026-09-enceladus-ocean-spray-chemically-diverse.html", "fonte_id": "phys_org", "data_pub": "2026-10-04T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Saturno possui um satélite gelado chamado Enceladus, que oculta um oceano global sob sua superfície congelada. Partículas de água vapor e partículas de gelo emanadas de fissuras perto do polo sul deste satélite fornecem aos cientistas uma oportunidade rara de estudar um oceano extraterrestre sem precisar perfurar quilômetros de gelo.", "titulo_pt": "Como a chuva de oceanos do Enceladus se transforma em grãos de gelo quimicamente diversificados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 195487, "titulo": "New research shows steep and continuing decline in prison population in the US", "url": "https://phys.org/news/2026-09-steep-decline-prison-population.html", "fonte_id": "phys_org", "data_pub": "2026-10-04T14:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A população carcerária nos Estados Unidos está diminuindo a um ritmo acelerado, e as taxas de admissão para prisão devem cair cerca de 50% nos próximos 20 anos, de acordo com novas pesquisas conduzidas pelo professor Shawn Bushway da Universidade de Albany.", "titulo_pt": "Nova pesquisa mostra declínio acentuado e continuado na população carcerária nos EUA", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 195488, "titulo": "Inka scattered sacred coca leaves over sacrificed llamas, excavation suggests", "url": "https://phys.org/news/2026-09-inka-sacred-coca-sacrificed-llamas.html", "fonte_id": "phys_org", "data_pub": "2026-10-04T13:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Arqueólogos descobriram folhas de coca ainda presas no pelo de alguns lhamas sacrificados em ruínas do centro provincial Inka Tambo Viejo, em Peru. Antes disso, provas sobre como os Inka usavam essa planta sagrada em rituais eram escassas.", "titulo_pt": "Inca espalharam folhas sagradas de coca sobre lhamas sacrificados, sugere escavação", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 195461, "titulo": "Asian Games close after fortnight of turmoil and teenage triumph", "url": "https://www.koreaherald.com/article/10893143", "fonte_id": "korea_herald", "data_pub": "2026-10-05T00:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O 20º Jogos Asiáticos encerraram no domingo após duas semanas de turbulência, marcadas pela excelência juvenil nos esportes, mas também pela falha logística e pelo interesse público moderado. Cerca de 17.000 atletas e oficiais participaram dos jogos em Nagoya, superando o número de atletas que competiram nos Jogos Olímpicos de Paris.", "titulo_pt": "Jogos asiáticos encerram após duas semanas de turbulência e brilho juvenil", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 195087, "titulo": "Lita Stantic recibió el doctorado Honoris Causa de la UBA en el marco de su festival de cine", "url": "https://www.lanacion.com.ar/espectaculos/cine/lita-stantic-recibio-el-doctorado-honoris-causa-de-la-uba-en-el-marco-de-su-festival-de-cine-nid04102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-05T00:26:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A atriz Lita Stantic recebeu um doutorado honoris causa da UBA durante o festival de cinema. Até o miércoles, os filmes 'Yo, la peor de todas', de María Luisa Bemberg, e 'La niña santa', de Lucrecia Martel, podem ser vistos gratuitamente.", "titulo_pt": "Lita Stantic recebe doutorado Honoris Causa da UBA durante festival de cinema", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 195511, "titulo": "J. Todd Anderson, ‘The Nice Guys’ Storyboard Artist and Longtime Coen Brothers Collaborator, Dies at 67", "url": "https://variety.com/2026/film/people-news/j-todd-anderson-dead-the-nice-guys-coen-brothers-1236898722/", "fonte_id": "variety", "data_pub": "2026-10-05T00:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "J. Todd Anderson, artista de storyboard conhecido por trabalhos em filmes como 'The Nice Guys' e 'Raising Arizona', e colaborador por muitos anos dos irmãos Coen, faleceu aos 67 anos após uma batalha contra o câncer.", "titulo_pt": "J. Todd Anderson, artista de Storyboard e colaborador línguista dos irmãos Coen, morre aos 67 anos", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 195183, "titulo": "Encuentro entre Longueira y Hoffmann", "url": "https://www.latercera.com/cartas-al-director/noticia/encuentro-entre-longueira-y-hoffmann/", "fonte_id": "la_tercera", "data_pub": "2026-10-04T23:50:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Houve um encontro entre os políticos Longueira e Hoffmann. Não há detalhes adicionais sobre o conteúdo ou a natureza desse encontro.", "titulo_pt": "Encontro entre Longueira e Hoffmann", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 195512, "titulo": "Sarah Jessica Parker Says She’s ‘Never’ Worn Her Archived ‘Sex and the City’ Wardrobe: ‘There’s a Huge Separation Between Myself and Carrie Bradshaw’", "url": "https://variety.com/2026/tv/news/sarah-jessica-parker-carrie-bradshaw-sex-and-the-city-wardrobe-1236898781/", "fonte_id": "variety", "data_pub": "2026-10-04T23:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sarah Jessica Parker nunca usa a roupa que interpretou a personagem Carrie Bradshaw na série 'Sex and the City', embora mantenha uma coleção arquivada dessas roupas. Ela destaca que existe uma grande diferença entre ela e a personagem.", "titulo_pt": "Sarah Jessica Parker afirma nunca ter usado sua coleção de roupas de 'Sex and the City'", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 195049, "titulo": "Lucrecia Martel en el cierre del Filba: “La respuesta a la violencia es la invención”", "url": "https://www.clarin.com/cultura/lucrecia-martel-cierre-filba-respuesta-violencia-invencion_0_sHHhoz2Uxm.html", "fonte_id": "clarin", "data_pub": "2026-10-04T23:42:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Lucrecia Martel, diretora argentina, falou sobre seu documentário sobre o assassinato do líder indígena Javier Chocobar e o pedido de território no Museu Malba. Ela explicou como trabalhar com arquivos judiciais ajudou a explorar as relações entre a terra, o poder e a desigualdade.", "titulo_pt": "Lucrecia Martel no encerramento do Filba: 'a resposta à violência é a invenção'", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 195305, "titulo": "Jean Pisani-Ferry: 'Markets want fiscal responsibility, not austerity'", "url": "https://www.lemonde.fr/en/opinion/article/2026/10/05/jean-pisani-ferry-markets-want-fiscal-responsibility-not-austerity_6758247_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-04T23:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O economista Jean Pisani-Ferry afirma que a França não deve aguardar o resultado da eleição presidencial para reduzir seu déficit. Ele rejeita a regra dourada, mas sugere a construção de uma plataforma comum entre as forças políticas capazes de formar uma coalizão.", "titulo_pt": "Jean Pisani-Ferry: 'mercados querem responsabilidade fiscal, não austeridade'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 195513, "titulo": "Marvel Canceled ‘Blade,’ But the Gory Vampire Brawler ‘Half’ Will Thrill Genre Fans", "url": "https://variety.com/2026/film/features/half-vampire-action-movie-india-blade-1236898106/", "fonte_id": "variety", "data_pub": "2026-10-04T23:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kevin Feige, responsável pela Marvel Studios, decidiu não produzir um novo filme de Blade, embora tenha tomado decisões financeiras acertadas no passado. No entanto, um filme dirigido por Samjad trará alegria aos fãs do metade-vampiro Wesley Snipes.", "titulo_pt": "Marvel cancelou Blade, mas filme de wesley snipes ‘Half’ agradará fãs", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 195514, "titulo": "Is ‘Rubber Soul’ the Beatles’ Best Album? The Answer to That is as Malleable as the Shifting Track Lists, but This ‘Super Deluxe’ Is Super Essential: Boxed Set Review", "url": "https://variety.com/2026/music/album-reviews/beatles-rubber-soul-super-deluxe-boxed-set-review-1236898774/", "fonte_id": "variety", "data_pub": "2026-10-04T22:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pergunta sobre qual é o melhor álbum dos Beatles não tem uma resposta definitiva, pois pode variar dependendo do momento e do ponto de entrada do fã. No entanto, este lançamento 'Super Deluxe' é considerado essencial.", "titulo_pt": "É o álbum dos Beatles melhor, 'Rubber Soul'? A resposta pode variar, mas este 'Super Deluxe' é Super essencial", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 195508, "titulo": "Q3’s Horror Box Office Shows the Trouble with Always Hunting Another ‘Obsession’", "url": "https://www.indiewire.com/features/commentary/horror-box-office-q3-2026-1235220127/", "fonte_id": "indiewire", "data_pub": "2026-10-04T22:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O terceiro trimestre do gênero horror no cinema apresentou diversos títulos, incluindo 'Resident Evil', 'Buddy', 'Evil Dead' e 'Insidious', que enfrentaram expectativas de lucratividade. O desempenho dessas produções sugere que o gênero precisa de mais do que apenas um padrão de sucesso para se manter forte.", "titulo_pt": "O desempenho do Horror no terceiro trimestre revela a precariedade de depender de um único padrão de sucesso", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 195515, "titulo": "What David Zaslav Got Wrong About ‘Coyote vs. Acme’", "url": "https://variety.com/2026/film/box-office/coyote-vs-acme-proves-david-zaslav-wrong-box-office-1236895011/", "fonte_id": "variety", "data_pub": "2026-10-04T22:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três anos após 'Coyote vs. Acme' ser cancelado pela Warner Bros. como uma dedução fiscal e resgatado pela distribuidora independente Ketchup Entertainment, a comédia da Looney Tunes se tornou um ponto alto de bilheteria global, arrecadando mais de 100 milhões de dólares. David Zaslav, CEO da Warner Bros. Discovery, havia julgado o filme como insuficiente para um lançamento em cinemas.", "titulo_pt": "O que David Zaslav errou sobre 'Coyote vs. Acme'", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 195516, "titulo": "Peacock’s Free Trial Offer Returns – But You Won’t Find It On the Streaming Service", "url": "https://variety.com/2026/shopping/news/best-peacock-streaming-deals-offers-1235625188/", "fonte_id": "variety", "data_pub": "2026-10-04T22:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os assinantes do Peacock enfrentar ão aos imigrantes, desinformação abala a comunidade vietnamita no Japão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 194507, "titulo": "Polish activists launch abortion pill locker to bypass near-total ban", "url": "https://www.theguardian.com/world/2026/oct/04/polish-activists-launch-abortion-pill-locker-to-bypass-near-total-ban", "fonte_id": "guardian_world", "data_pub": "2026-10-04T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Polonesas lançaram um 'AbortOmat', um locker rosa com 22 compartimentos em Warsaw, permitindo que mulheres adquiram pilulas de aborto rapidamente e anonimamente. O serviço visa contornar a proibição quase total do aborto no país.", "titulo_pt": "Polonesas lançam 'abortomat' para contornar proibição quase total do aborto", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 194713, "titulo": "Myanmar migrants returned to war-torn nation from Malaysia", "url": "https://www.japantimes.co.jp/news/2026/10/04/asia-pacific/society/myanmar-migrants-malaysia/", "fonte_id": "japan_times", "data_pub": "2026-10-04T04:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ONU alerta que as condições na Myanmar, em guerra civil desde 2021, não garantem retornos seguros, conforme exigido pela lei internacional.", "titulo_pt": "Migrantes myanmarenses retornados de malásia enfrentam riscos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 194976, "fonte_id": "infomoney", "titulo": "Centro-Oeste reelege governadores de todos Estados no 1º turno; DF vai a 2º turno", "url": "https://www.infomoney.com.br/politica/centro-oeste-reelege-governadores-de-todos-estados-no-1o-turno-df-vai-a-2o-turno/", "data_pub": "2026-10-05T00:35:00Z", "topico": "politica_nacional", "idioma": "pt", "titulo_pt": "Centro-oeste reelege governadores em primeiro turno; DF irá a segundo turno", "veiculo": "InfoMoney", "pais": nciais no Brasil de 2026 resultaram em um segundo turno entre Luiz Inácio Lula da Silva e Flávio Bolsonaro, filho do ex-presidente Jair Bolsonaro. O Tribunal Superior Eleitoral confirmou a segunda volta, marcada para o dia 25 de outubro. A disputa é polarizada, com Lula defendendo ampliação do papel do Estado e políticas sociais, enquanto Flávio Bolsonaro propõe uma agenda liberal, redução de impostos e endurecimento no combate ao crime. A corrida para o segundo turno tem gerado debates significativos, com Flávio Bolsonaro destacando as relações com o governo dos Estados Unidos, especialmente sobre recursos minerais raros. A decisão final sobre o próximo presidente do Brasil dependerá do voto dos mais de 158 milhões de eleitores, o que pode ter implicações significativas para a política, economia e sociedade brasileiras.", "data_edicao": "2026-10-04", "artigos": [{"id": 195084, "titulo": "Cuándo es el balotaje de Brasil 2026: así definen Lula y Flávio Bolsonaro las elecciones", "url": "https://www.lanacion.com.ar/el-mundo/cuando-es-el-balotaje-de-brasil-2026-asi-definen-lula-y-flavio-bolsonaro-las-elecciones-nid04102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-05T00:31:00Z", "topico": "politica_internacional", "idioma": "es", "texto_resumo": "O Tribunal Superior Eleitoral confirmou a segunda volta das eleições presidenciais no Brasil de 2026, que será entre o atual presidente Lula e o líder do Partido Liberal Flávio Bolsonaro.", "titulo_pt": "Quando é o balotaje de Brasil 2026: assim definem Lula e Flávio Bolsonaro as eleições", "texto_pt": "O Tribunal Superior Eleitoral confirmou a segunda volta das eleições presidenciais no Brasil de 2026, que será entre o atual presidente Lula e o líder do Partido Liberal Flávio Bolsonaro.", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 195278, "titulo": "Brazil election goes to run-off as right-wing Flávio Bolsonaro wins first round", "url": "https://www.bbc.co.uk/news/articles/ck1l34
