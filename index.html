<html lang="pt-BR">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

 mísseis Patriot interceptores. No Brasil, o governo Lula rejeitou a prorrogação da declaração de emergência nacional nos Estados Unidos em relação ao país e afirmou que a decisão é infundada. Além disso, dois navios, incluindo um tanque americano de armazenamento de gás, pegaram fogo após uma explosão em um terminal portuário no Egito, levando à suspeita de um ataque por drone do Irã.\n\nAs tensões geopolíticas no Oriente Médio continuam a crescer com ataques e confrontos entre Estados Unidos, Arábia Saudita e Irã. Recentemente, o Iraque atacou combatentes apoiados pelo Irã em seu território, levando a um alerta da ONU sobre o potencial de ampliação da guerra na região. A Arábia Saudita buscou formar uma coalizão internacional para proteger o Mar Vermelho das ameaças hutitas e dos rebeldes do Iêmen. Além disso, Donald Trump ameaçou retaliar contra o Irã após ataques a navios-pipa no Egito e a uma base militar americana. As tensões entre os países continuam com novas sanções estadunidenses contra entidades iranianas e o Irã reagindo com um ataque surpresa aos Estados Unidos, aumentando o risco de escalada do conflito na região.", "economia": "A UBS elevou sua previsão para o crescimento do PIB do país para 11%, refletindo uma economia em expansão. O dólar caiu para R$ 5,108 após o Federal Reserve manter os juros nos Estados Unidos entre 3,50% e 3,75%. As vendas da divisão de nuvem da Microsoft aumentaram 32%, enquanto a empresa planeja investir US$ 41 bilhões em inteligência artificial. A Meta enfrentou uma queda de 6% nas ações após anunciar lucros abaixo do esperado e reduzir suas previsões de vendas, sob pressão sobre seu alto investimento em IA. O Ibovespa caiu 1,52% após o Federal Reserve manter as taxas de juros inalteradas, embora três membros votaram pela elevação. A decisão foi amplamente esperada. As vendas do carro elétrico da Ferrari Luce superaram suas metas em apenas dois meses, impulsionado pelo forte interesse chinês, enquanto o Bitcoin operou em alta após a decisão do Fed e as expectativas de balanços tecnológicos. O Tesouro Nacional colocou R$ 12,21 bilhões no mercado argentino e outros US$ 309 milhões do Bonar 2029, realizando um rollover de 144,5%. A dívida pública federal subiu 2,61% em junho, atingindo R$ 9,033 trilhões. O dólar argentino também sofreu pressões com a alta dos preços das bencinas, que aumentaram mais de $30, e o ministro Quiroz advertiu sobre possíveis futuras elevações se o preço do petróleo não cair. A CVM adiou a assembleia da Emae para decidir sua incorporação pela Sabesp por 30 dias, enquanto a Antaq propôs uma medida cautelar para suspender a exigência de relatório de gestão ambiental portuária de água de lastro pela Codeba. O Fórum E-Commerce Brasil gerou R$ 21,2 milhões em apenas duas horas de negócios, reuniendo 11 empresas patrocinadoras e 30 compradoras conectadas com base nos seus interesses e demandas.", "tecnologia": "A tecnologia avança, especialmente em relação à segurança e ética. A proibição da FCC dos Estados Unidos sobre a importação de novos robôs humanoides visa garantir a segurança pública. Empresas como OpenAI e Anthropic pedem aos EUA que freiem o desenvolvimento de modelos avançados de inteligência artificial (IA). O CEO Mark Zuckerberg, da Meta, prevê que bilhões de pessoas terão agentes de IA pessoais em cinco anos, com a empresa investindo bilhões na infraestrutura necessária para essa transformação digital. A Dynapack está aumentando suas vendas de baterias de backup neste ano, e a Qualcomm aumentará os preços dos seus processadores a partir do dia 1º de setembro. No TechCrunch Disrupt 2026, o foco será na IA com uma exploração das oportunidades corporativas relacionadas aos agentes de IA.", "ciencia": "A NASA está preparando o lançamento do Telescópio Espacial Roman, agendado para 30 de agosto. Este avanço tecnológico promete mapear todo o céu com uma escala nunca antes vista e tem potencial para transformar a compreensão do universo em diversas disciplinas científicas. Paralelamente, os cientistas estão explorando novos métodos de utilização de resíduos industriais, como o desenvolvimento de fungos presentes no intestino da lagarta-do-algodão para degradar isopor. Esta descoberta pode ter aplicações ambientais significativas. Estudos também mostram que a perda do gelo nas lagoas do Hemisfério Norte após temperaturas invernais superarem determinados limites críticos pode acelerar o processo de derivação do gelo, afetando os ecossistemas aquáticos e o equilíbrio energético. Além disso, pesquisas indicam que a adaptação às águas mais quentes está causando mudanças comportamentais e biológicas nos peixes icelândicos, incluindo obesidade e overeating, devido ao aquecimento global.", "cultura": "A cultura global está em destaque com diversas iniciativas e eventos. A série 'O Atentado ao Voo Pan Am 103', produzida pela BBC, relata o trágico evento de dezembro de 1988 que resultou na morte de 270 pessoas. Em outro desenvolvimento cultural notável, a bailarina sul-coreana Yun Seo-hoo retorna à Coreia após uma década atuando no Ballet do Palácio de Opera de Paris, trazendo novidades para os espectadores locais. No universo da dança, a morte de Simone Forti, precursora do movimento postmoderno nos Estados Unidos, é lembrada por sua contribuição artística e coreográfica ao longo de 60 anos de carreira.", "sociedade": "Em São Paulo, uma ventania com velocidade de 111 km/h causou três mortes e levou a um deslocamento dos telhados. O Gabinete de Crise foi ativado para gerenciar a situação. No interior de São Paulo, a Polícia Civil realizou operações contra redes de crimes digitais, prendendo 21 pessoas e apreendendo diversos objetos. Em Goiás, um tiroteio em uma fazenda resultou em três mortes, com o suspeito se suicidando no local. Na Zona Oeste do Rio de Janeiro, ventos fortes derrubaram barracas de ambulantes. Na Região do Biobío, as aulas foram suspensas para esta quinta-feira devido ao passar de um sistema frontal. Em Minas Gerais, um servidor foi acusado de cobrar R$ 500 via Pix por cada enterro no cemitério de Senhora dos Remédios, e o Ministério Público denunciou a situação.", "meio_ambiente": "Mais da metade do Reino Unido está oficialmente em estado de seca, conforme informa a Agência Ambiental do Reino Unido. O órgão relata níveis baixos nos rios, colheitas antecipadas por agricultores e aumento do risco de incêndios florestais, além de milhões de pessoas vivendo sob restrições no uso d'água. No Brasil, um vendaval no Rio de Janeiro atingiu velocidades superiores a 100 km/h, causando ao menos duas mortes e levando à paralisação do metrô e dos aeroportos na cidade. Em Goiás, uma explosão envolvendo um caminhão que transportava químicos perigosos resultou em proibição de captação de água e notificação da empresa para conter os danos ambientais. No Parque Nacional Amboseli, no Quênia, ao menos 15 elefantes morreram por suspeita de intoxicação, levando as autoridades a investigar o incidente.", "direitos_humanos": "Um artista renomado, fundador do coletivo cultural Movimento San Isidro, passou cinco anos preso na Cuba. Após ser libertado e forçado a deixar o país, ele narra como sobreviveu à prisão e explica suas intenções de usar as criações artísticas para resistir. Em outro evento, uma foto viral mostrando duas soldadas israelenses posando ao lado de um palestiniano cego gerou indignação na internet. A imagem, publicada no Instagram pessoal de uma ex-soldada israelense, mostra as soldadas sorrindo perto de um jovem palestiniano sentado com a cabeça baixa. Além disso, Volker Türk, Alto Comissário das Nações Unidas para os Direitos Humanos, visitou o Líbano em julho para discutir violações ocorridas durante a guerra entre Israel e Hezbollah, perspectivas de justiça para as vítimas e preocupações sobre a retirada da Força Interina das Nações Unidas no Líbano prevista para o final de 2026. Também foi registrado um aumento significativo em ataques antissemitas em 2025, com mais de 23.000 incidentes em sete países, incluindo Austrália, Reino Unido e França."}, "resumo_do_dia": {"politica_nacional": [{"id": 80630, "titulo": "Ao vivo: Cleitinho dá declaração após veto do Republicanos em MG", "url": "https://www.poder360.com.br/poder-eleicoes-2026/ao-vivo-cleitinho-da-declaracao-apos-veto-do-republicanos-em-mg/", "fonte_id": "poder360", "data_pub": "2026-07-29T22:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Cleitinho concedeu uma entrevista após o partido Republicanos afirmar que sua ausência na convenção estadual inviabilizou sua candidatura ao governo do Estado.", "titulo_pt": "Cleitinho dá declaração após veto do Republicanos em MG", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 80631, "titulo": "Tarcísio adia “free flow” na Imigrantes e anuncia reposicionamento", "url": "https://www.poder360.com.br/poder-infra/tarcisio-adia-free-flow-na-imigrantes-e-anuncia-reposicionamento/", "fonte_id": "poder360", "data_pub": "2026-07-29T22:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador de São Paulo, Tarcísio de Freitas, adiou a implementação do 'free flow' na empresa Imigrantes e anunciou um reposicionamento. O governo alterou o pórtico de cobrança eletrônica após protestos dos moradores de São Bernardo do Campo.", "titulo_pt": "Tarcísio adia 'free flow' na Imigrantes e anuncia reposicionamento", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 80632, "titulo": "Itaú anuncia mudanças nos cartões Mastercard e Visa", "url": "https://www.poder360.com.br/poder-economia/itau-anuncia-mudancas-nos-cartoes-mastercard-e-visa/", "fonte_id": "poder360", "data_pub": "2026-07-29T22:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Itaú anunciou mudanças nos cartões Mastercard e Visa, aumentando o acúmulo de pontos, ampliando o acesso a salas VIP e flexibilizando os critérios para isenção da anuidade.", "titulo_pt": "Itaú anuncia alterações em cartões Mastercard e Visa", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 80670, "titulo": "TCU aponta \"risco intolerável ao erário\" em controle das emendas Pix", "url": "https://www.congressoemfoco.com.br/noticia/120884/tcu-aponta-risco-intoleravel-ao-erario-em-controle-das-emendas-pix", "fonte_id": "congresso_em_foco", "data_pub": "2026-07-29T22:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TCU (Tribunal de Contas da União) identificou problemas graves nas emendas Pix, incluindo a falta de prestação de contas, desvios de finalidade, licitações irregulares e obras não entregues.", "titulo_pt": "TCU aponta 'risco intolerável ao erário' no controle das emendas Pix", "veiculo": "Congresso em Foco", "pais": "Brasil", "classe": "B"}, {"id": 80640, "titulo": "Em meio a novo ataque às urnas, TSE diz quais empresas fabricam os aparelhos", "url": "https://veja.abril.com.br/politica/em-meio-a-novo-ataque-as-urnas-tse-diz-quais-empresas-fabricam-as-urnas/", "fonte_id": "veja", "data_pub": "2026-07-29T22:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os equipamentos eletrônicos utilizados nas urnas eletrônicas no Brasil são produzidos por quatro empresas brasileiras.", "titulo_pt": "Em meio a novos ataques às urnas, TSE esclarece fabricantes dos equipamentos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 80625, "titulo": "Congresso do Paraguai repudia fala de Lula sobre Guerra da Tríplice Aliança", "url": "https://g1.globo.com/mundo/noticia/2026/07/29/congresso-do-paraguai-repudia-fala-de-lula-sobre-guerra-da-triplice-alianca.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-29T22:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara dos Deputados do Paraguai emitiu uma declaração oficial repudiando as declarações de Lula sobre a Guerra da Tríplice Aliança, considerando-as distorcidas e minimizadoras. O presidente Lula havia feito um discurso em 24 de julho, relembrando o conflito histórico para defender investimentos em defesa.", "titulo_pt": "Câmara do Paraguai repudia declarações de Lula sobre Guerra da Tríplice Aliança", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 80662, "titulo": "Flávio deu aval à negativa ao STF sobre vídeo de Bolsonaro com IA", "url": "https://www.metropoles.com/colunas/manoela-alcantara/flavio-deu-aval-a-negativa-ao-stf-sobre-video-de-bolsonaro-com-ia", "fonte_id": "metropoles", "data_pub": "2026-07-29T22:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro assinou um documento enviado ao STF negando conhecimento do presidente sobre o vídeo com IA exibido na convenção do PL.", "titulo_pt": "Flávio confirma não ter dado aval à negativa sobre vídeo de Bolsonaro com IA", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 80682, "titulo": "Mais de 50% das mulheres dizem ter sofrido violência de parceiros", "url": "https://www.brasildefato.com.br/2026/07/29/mais-de-50-das-mulheres-dizem-ter-sofrido-violencia-de-parceiros/", "fonte_id": "brasil_de_fato", "data_pub": "2026-07-29T22:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais da metade das mulheres brasileiras (54%) que já tiveram relacionamentos com homens relataram ter sofrido violência. Por outro lado, apenas 11% dos homens que já estiveram em relacionamentos com mulheres admitiram ter cometido agressões.", "titulo_pt": "Mais de 50% das mulheres brasileiras dizem ter sofrido violência doméstica", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 80633, "titulo": "Veja imagens do vendaval no litoral de São Paulo", "url": "https://www.poder360.com.br/poder-brasil/veja-imagens-do-vendaval-no-litoral-de-sao-paulo/", "fonte_id": "poder360", "data_pub": "2026-07-29T22:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ventanias com velocidades superiores a 100 km/h causaram dano no litoral de São Paulo, derrubando árvores e agitando o mar.", "titulo_pt": "Veja imagens do vendaval no litoral de São Paulo", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 80634, "titulo": "Durigan indica Lula 4 mais austero e tenta acalmar o mercado", "url": "https://www.poder360.com.br/poder-economia/durigan-indica-lula-4-mais-austero-e-tenta-acalmar-o-mercado/", "fonte_id": "poder360", "data_pub": "2026-07-29T22:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O chefe da economia do governo indicou uma abordagem fiscal mais austera e sustentável. No entanto, há dúvidas sobre a viabilidade política para implementar mudanças.", "titulo_pt": "Durigan sugere orçamento mais austero e tenta aliviar preocupações com o mercado", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 80635, "titulo": "Vendavais de mais de 100 km/h atingem SP", "url": "https://www.poder360.com.br/poder-brasil/vendavais-de-mais-de-100-km-h-atingem-sp/", "fonte_id": "poder360", "data_pub": "2026-07-29T22:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Vendavais com velocidades superiores a 100 km/h atingiram o estado de São Paulo. A Defesa Civil emitiu alertas e recomendações para a população durante este período de instabilidade meteorológica.", "titulo_pt": "Vendavais de mais de 100 km/h atingem SP", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 80697, "titulo": "Moraes cobra PF sobre posts que ligavam Bolsonaro a canibalismo", "url": "https://www.cnnbrasil.com.br/politica/moraes-cobra-pf-sobre-posts-que-ligavam-bolsonaro-a-canibalismo/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T22:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Justiça e Segurança Pública, Deltan Dallagnol, solicitou à Polícia Federal que informasse sobre as providências adotadas para identificar os autores de publicações desinformacionais relacionadas a Jair Bolsonaro durante as eleições de 2022.", "titulo_pt": "Dallagnol pede PF sobre posts ligando Bolsonaro a canibalismo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 80647, "titulo": "O convite de Lula para Alexandre de Moraes, após evento no Planalto", "url": "https://veja.abril.com.br/brasil/o-convite-de-lula-para-alexandre-de-moraes-apos-evento-no-planalto/", "fonte_id": "veja", "data_pub": "2026-07-29T22:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Lula teria convidado o ministro Alexandre de Moraes para um café após um evento no Palácio do Planalto, conforme microfones registraram.", "titulo_pt": "Convite de Lula para Alexandre de Moraes após evento no Planalto", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 80649, "titulo": "Meta, Telegram e X fecham acordo com TSE sobre desinformação sem punição caso não cumpram", "url": "https://apublica.org/2026/07/desinformacao-big-techs-e-tse-fazem-acordo-que-nao-preve-punicao/", "fonte_id": "agencia_publica", "data_pub": "2026-07-29T22:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Meta, Telegram e X concordaram com o TSE sobre como lidar com desinformação durante as eleições de 2026, mas não há punição prevista se as plataformas não cumprirem os termos.", "titulo_pt": "Meta, Telegram e X fecham acordo com TSE sobre desinformação sem punição caso não cumpram", "veiculo": "Agência Pública", "pais": "Brasil", "classe": "B"}, {"id": 80443, "titulo": "Justiça Eleitoral condena Lula por propaganda antecipada por pedido de votos para Simone Tebet e Marina Silva", "url": "https://www.jota.info/eleicoes/eleicoes-2026/justica-eleitoral-condena-lula-por-propaganda-antecipada-por-pedido-de-votos-para-simone-tebet-e-marina-silva", "fonte_id": "jota", "data_pub": "2026-07-29T21:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça Eleitoral condenou Lula por propaganda antecipada, após pedido explícito de votos para Simone Tebet e Marina Silva realizado em um evento em maio em São Paulo.", "titulo_pt": "Justiça Eleitoral condena Lula por propaganda antecipada", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 80267, "titulo": "Eduardo Bolsonaro encontra Netanyahu no complexo da Casa Branca", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/eduardo-bolsonaro-encontra-netanyahu-no-complexo-da-casa-branca.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-29T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eduardo Bolsonaro esteve na Blair House, residência em frente à Casa Branca, onde está hospedado o primeiro-ministro de Israel, Binyamin Netanyahu. Ambos participaram de reuniões e eventos relacionados a lideranças políticas americanas.", "titulo_pt": "Eduardo Bolsonaro encontra Netanyahu na blair house", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 79973, "titulo": "US and Saudi hit Iran-backed fighters in Iraq", "url": "https://www.taipeitimes.com/News/front/archives/2026/07/30/2003861623", "fonte_id": "taipei_times", "data_pub": "2026-07-30T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças dos Estados Unidos e do Reino Unido atacaram combatentes apoiados pelo Irã emIraq.", "titulo_pt": "Estados unidos e Saudi arábia atacam fighters iranianos no iraque", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 80825, "titulo": "Bolivia, ordinato l'arresto di Evo Morales per terrorismo e rivolta armata", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/30/bolivia-ordinato-larresto-di-evo-morales-per-terrorismo-e-rivolta-armata_a8020d5a-ccd7-4181-8704-479e8d312ee7.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-29T22:55:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Evo Morales, ex-presidente da Bolívia, acusa o governo de perseguição política e afirma que não se intimidará. Ele foi ordenado o seu arresto sob acusações de terrorismo e revolta armada.", "titulo_pt": "Bolívia, ordem de prisão contra Evo Morales por terrorismo e revolta armada", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 80815, "titulo": "Iran war: Trump threatens to hit Iran 'very hard'", "url": "https://www.dw.com/en/iran-war-trump-threatens-to-hit-iran-very-hard/live-78166958?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-07-29T22:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, ameaçou retaliar contra o Irã, afirmando que os EUA atingiriam o país 'muito duramente' após militares americanos serem atacados em Jordânia.", "titulo_pt": "-Trump ameaça castigar o Irã 'muito duramente'", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 80817, "titulo": "Turkish FM meets with head of Hamas’s political bureau", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/turkish-fm-meets-head-hamass-political-bureau", "fonte_id": "middle_east_eye", "data_pub": "2026-07-29T22:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro das Relações Exteriores da Turquia, Hakan Fidan, se reuniu com Khalil al-Hayya, o novo chefe do bureau político do Hamas. Durante a reunião, al-Hayya discutiu os desenvolvimentos em Gaza e na Cisjordânia ocupada, enquanto Fidan expressou apoio à causa palestiniana.", "titulo_pt": "Ministro das relações exteriores da Turquia se reúne com chefe do bureau político do Hamas", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 80689, "titulo": "ONU alerta que escalada ligada ao Irã pode ampliar guerra no Oriente Médio", "url": "https://www.cnnbrasil.com.br/internacional/onu-alerta-que-escalada-ligada-ao-ira-pode-ampliar-guerra-no-oriente-medio/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T22:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ONU alerta que a escalada relacionada ao Irã pode ampliar a guerra no Oriente Médio. Os recentes confrontos são considerados negativos e exige-se um retorno à via do diálogo entre as partes envolvidas.", "titulo_pt": "ONU avisa sobre risco de conflito iraniano ampliar guerra no Oriente Médio", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 80816, "titulo": "Explosions reported in Kyiv after Zelenskyy warns of Russian strikes", "url": "https://www.dw.com/en/explosions-reported-in-kyiv-after-zelenskyy-warns-of-russian-strikes/a-78167375?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-07-29T22:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ucrânia registrou explosões em Kyiv após Zelenskyy advertir sobre possíveis investidas russas. O presidente ucraniano havia previsto um ataque massivo, com base em relatórios do exército.", "titulo_pt": "Explosões relatadas em Kyiv após Zelenskyy avistar ataques russos", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 80818, "titulo": "Iraq demands evidence that attacks on Saudi Arabia originated from its territor", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/iraq-demands-evidence-attacks-saudi-arabia-originated-its-territor", "fonte_id": "middle_east_eye", "data_pub": "2026-07-29T22:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Iraque exigiu provas de que os ataques à Arábia Saudita foram lançados de seu território. Segundo o porta-voz das forças armadas iraquianas, nenhuma parte apresentou evidências sobre a origem dos ataques.", "titulo_pt": "Iraque pede provas de que ataques à arábia saudita partiram do seu território", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 80748, "titulo": "Argentina extradita a un ciudadano turco acusado de liderar una organización mafiosa", "url": "https://elpais.com/argentina/2026-07-29/argentina-extradita-a-un-ciudadano-turco-acusado-de-liderar-una-organizacion-mafiosa.html", "fonte_id": "elpais_america", "data_pub": "2026-07-29T22:26:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O argentino Serkan Kurtulus, acusado de liderar uma organização mafiosa, foi extraditado para Turquia. Ele afirma que sua vida está em perigo no país por possuir informações sobre o governo de Erdogan.", "titulo_pt": "Argentina extradija cidadão turco acusado de liderar organização mafiosa", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 80693, "titulo": "Arábia Saudita busca coalizão internacional para proteger Mar Vermelho", "url": "https://www.cnnbrasil.com.br/internacional/arabia-saudita-busca-coalizao-internacional-para-proteger-mar-vermelho/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T22:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Arábia Saudita busca uma coalizão internacional para proteger o Mar Vermelho após ataques dos Houthis, rebeldes do Iêmen aliados ao Irã. O objetivo é assegurar a navegação no mar.", "titulo_pt": "Arábia Saudita busca coalizão internacional para proteger o Mar Vermelho", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 80629, "titulo": "Brasil rejeita prorrogação de emergência nacional dos EUA", "url": "https://agenciabrasil.ebc.com.br/internacional/noticia/2026-07/brasil-rejeita-prorrogacao-de-emergencia-nacional-dos-eua", "fonte_id": "agencia_brasil_intl", "data_pub": "2026-07-29T22:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo brasileiro rejeitou a prorrogação da declaração de emergência nacional nos Estados Unidos em relação ao Brasil. O Executivo considerou infundadas as justificativas apresentadas pela Casa Branca e enfatizou a soberania nacional.", "titulo_pt": "Brasil rejeita prorrogação de emergência nacional dos EUA", "veiculo": "Agência Brasil - Internacional", "pais": "Brasil", "classe": "A"}, {"id": 80706, "titulo": "Chanceler da Argentina diz que “não há chance” de rompimento com o Brasil", "url": "https://www.infomoney.com.br/mundo/chanceler-da-argentina-diz-que-nao-ha-chance-de-rompimento-com-o-brasil/", "fonte_id": "infomoney", "data_pub": "2026-07-29T22:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O chanceler da Argentina, Pablo Quirno, afirmou que não há chance de rompimento nas relações com o Brasil. Segundo ele, a participação do presidente brasileiro em um ato partidário representa apoio à família Bolsonaro.", "titulo_pt": "Chanceler argentino afirma que não há chance de rompimento com o Brasil", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 80806, "titulo": "Salman Rushdie attacker convicted of terror offenses", "url": "https://www.bbc.co.uk/news/articles/c86ng1g5wy4o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-07-29T22:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hadi Matar, de 28 anos, foi condenado por tentar ajudar a Hezbollah ao atacar o autor britânico-indiano Salman Rushdie.", "titulo_pt": "Acusador de salman Rushdie condenado por crimes terroristas", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 80807, "titulo": "The Chinese robot army transforming the UK's retail industry", "url": "https://www.bbc.co.uk/news/articles/c0jl8v23qwgo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-07-29T22:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A fraca crescimento da produtividade e as escassezes de mão-de-obra no Reino Unido estão criando uma oportunidade para as empresas chinesas de robótica.", "titulo_pt": "Exército chinês de robôs transformando o setor varejista do reino unido", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 80571, "titulo": "How Trump’s call for Asia-Pacific allies to raise defence spending may backfire on US", "url": "https://www.scmp.com/news/china/military/article/3362301/how-trumps-call-asia-pacific-allies-raise-defence-spending-may-backfire-us?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-29T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Donald Trump exigiu que aliados americanos na Ásia-Pacífico aumentem o gasto em defesa, levantando dúvidas sobre a confiabilidade dos Estados Unidos para deter ameaças como a China e a Coreia do Norte. Essa situação tem incentivado esses países a desenvolver suas próprias indústrias militares, o que pode eventualmente diminuir o domínio americano no comércio mundial de armas.", "titulo_pt": "Requisitos de Trump para aumento do gasto em defesa podem desequilibrar o poder militar", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 80278, "titulo": "Zelensky liga para Macron depois de reunião com Trump", "url": "https://www.poder360.com.br/poder-internacional/zelensky-liga-para-macron-depois-de-reuniao-com-trump/", "fonte_id": "poder360", "data_pub": "2026-07-29T21:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Zelensky ligou para Macron após reunião com Trump, informando-o sobre as conversas na Casa Branca e agradecendo ajuda à Ucrânia. Os líderes também discutiram incêndios em França.", "titulo_pt": "Zelensky liga para Macron após reunião com Trump", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 80478, "titulo": "El ICE libera a uno de los testigos clave en la muerte del inmigrante mexicano Lorenzo Salgado", "url": "https://elpais.com/us/migracion/2026-07-29/el-ice-libera-a-uno-de-los-testigos-clave-en-la-muerte-del-inmigrante-mexicano-lorenzo-salgado.html", "fonte_id": "elpais_america", "data_pub": "2026-07-29T21:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um juiz federal concedeu 48 horas ao ICE para libertar José Trinidad Rojas, um testemunha-chave na investigação da morte do imigrante mexicano Lorenzo Salgado.", "titulo_pt": "O ICE libera um dos principais testemunhos na morte do imigrante mexicano Lorenzo Salgado", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 79971, "titulo": "UBS raises forecast for nation’s GDP to expand 11 percent", "url": "https://www.taipeitimes.com/News/front/archives/2026/07/30/2003861621", "fonte_id": "taipei_times", "data_pub": "2026-07-30T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A UBS elevou sua previsão para o crescimento do PIB do país, projetando um aumento de 11%.", "titulo_pt": "UBS aumenta projeção de crescimento da economia nacional para 11%", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 80626, "titulo": "Mercado Livre e Mercado Pago têm instabilidade nesta quarta (29)", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/07/mercado-livre-e-mercado-pago-tem-instabilidade-nesta-quarta-29.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-29T22:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As plataformas do Mercado Livre e do Mercado Pago enfrentam instabilidade desde a tarde desta quarta-feira (29). O site Downdetector registra 596 reclamações sobre o Mercado Pago e 129 relatos sobre o Mercado Livre.", "titulo_pt": "Mercado Livre e Mercado Pago têm instabilidade nesta quarta-feira", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 80275, "titulo": "Dólar cai para R$ 5,10, após juros serem mantidos nos EUA", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-07/dolar-cai-para-r-510-apos-juros-serem-mantidos-nos-eua", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-07-29T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar encerrou o pregão em queda, cotado a R$ 5,108, enquanto a bolsa de valores recuou. O Federal Reserve decidiu manter os juros nos Estados Unidos entre 3,50% e 3,75%, com um tom mais moderado do presidente Kevin Warsh e divisão entre os membros da autoridade monetária.", "titulo_pt": "Dólar cai para R$ 5,10 após juros serem mantidos nos EUA", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 80518, "titulo": "Sube la bencina: revisa los valores de los combustibles para los próximos días", "url": "https://www.latercera.com/servicios/noticia/sube-la-bencina-revisa-los-valores-de-los-combustibles-para-los-proximos-dias/", "fonte_id": "la_tercera", "data_pub": "2026-07-29T21:49:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Empresa Nacional do Petróleo divulgou um relatório semanal sobre as variações dos valores dos combustíveis, que entrarão em vigor a partir desta quinta-feira. Os preços serão revisados nos próximos dias.", "titulo_pt": "Preços da gasolina sobem: confira os novos valores para os próximos dias", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 80456, "titulo": "El Gobierno retiró pesos del mercado en el debut de un nuevo bono dual", "url": "https://www.lanacion.com.ar/economia/el-gobierno-retiro-pesos-del-mercado-en-el-debut-de-un-nuevo-bono-dual-nid29072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-29T21:39:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Tesouro Nacional colocou no mercado argentino $12,21 bilhões em títulos e conseguiu um rollover de 144,5% sobre as dívidas vencíveis. Além disso, foram colocados outros US$309 milhões do Bonar 2029.", "titulo_pt": "Governo retirou pesos do mercado em debut de novo bono dual", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 80521, "titulo": "Fin al Movistar Arena: Santander adquiere los derechos para poner su nombre al recinto", "url": "https://www.latercera.com/pulso/noticia/movistar-arena-se-llamara-ahora-santander-arena/", "fonte_id": "la_tercera", "data_pub": "2026-07-29T21:38:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A partir de setembro, o nome do recinto será Santander Arena após a Santander assumir os direitos de patrocínio. A construção operada por Sociedad Concesionaria Arena Bicentenario S.A. passará a ser chamada deste novo nome.", "titulo_pt": "Fim da Movistar Arena: santander assume o patrocínio", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 80520, "titulo": "Las bencinas suben más de $30 y el ministro Quiroz advierte de mayores alzas si el precio del petróleo no cae", "url": "https://www.latercera.com/pulso/noticia/el-valor-de-las-bencinas-en-chile-desde-este-jueves-30-de-julio-del-2026/", "fonte_id": "la_tercera", "data_pub": "2026-07-29T21:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A partir de 30 de julho, os preços das gasolinas aumentarão novamente conforme informou a Enap. O ministro Quiroz alerta para possíveis futuras elevações se o preço do petróleo não cair.", "titulo_pt": "Preços das gasolinas subirão mais de r$30 e ministro avisa sobre novos aumentos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 80349, "titulo": "Não existe meta flexível de inflação e não hesitaremos em agir, diz Warsh", "url": "https://www.cnnbrasil.com.br/economia/macroeconomia/nao-existe-meta-flexivel-de-inflacao-e-nao-hesitaremos-em-agir-diz-warsh/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Fed afirmou que não existe meta flexível de inflação e que a instituição não hesitará em agir. A meta da instituição é manter uma inflação de 2%.", "titulo_pt": "Não existe meta flexível de inflação e não hesitaremos em agir, diz presidente do fed", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 80566, "titulo": "Microsoft’s cloud business boosts sales as capex climbs to $41bn", "url": "https://www.ft.com/content/da7c4472-cb30-4b82-b321-d82c1859419e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-29T21:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas da divisão de nuvem da Microsoft aumentaram 32% para US$ 39,3 bilhões. O gasto em capital subiu para US$ 41 bilhões.", "titulo_pt": "Negócio em nuvem da microsoft impulsiona vendas enquanto gasto em capital atinge us$ 41 bi", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 80444, "titulo": "Infraestrutura digital e capacidade estatal: lições do caso SuperSapiens", "url": "https://www.jota.info/opiniao-e-analise/artigos/infraestrutura-digital-e-capacidade-estatal-licoes-do-caso-supersapiens", "fonte_id": "jota", "data_pub": "2026-07-29T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A indisponibilidade recente do sistema da Advocacia-Geral da União (AGU) ilustra que a infraestrutura digital é uma condição essencial para o exercício das capacidades estatais.", "titulo_pt": "Infraestrutura digital e capacidade estatal: lições do caso SuperSapiens", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 80276, "titulo": "Dívida Pública sobe 2,61% em junho e supera R$ 9,2 trilhões", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-07/divida-publica-sobe-261-em-junho-e-supera-r-92-trilhoes", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-07-29T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Dívida Pública Federal subiu 2,61% em junho e atingiu R$ 9,033 trilhões. O valor superou a marca de R$ 9 trilhões no mês passado.", "titulo_pt": "Dívida Pública sobe 2,61% em junho e ultrapassa R$ 9,2 trilhões", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 80568, "titulo": "Infantino defends $20bn Fifa commercial venture after mounting backlash", "url": "https://www.ft.com/content/b97720c3-b6d7-455e-84ca-1e4339003644?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-29T21:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente da entidade governante do futebol mundial defendeu a ta_de": null, "texto_pt": "A taxa dos títulos do Tesouro de 30 anos atingiu o nível mais alto desde 2007 após a decisão do Federal Reserve (Fed) manter os juros básicos entre 3,5% e 3,75%. A probabilidade de uma alta nos juros em setembro aumentou para 60%, com três membros do Fed votando pela elevação.", "titulo_pt": "Títulos do tesouro de 30 anos atingem nível mais alto desde 2007 após manutenção dos juros pelo Fed", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 80550, "titulo": "Qualcomm to raise prices during memory crunch as chipmaker issues light earnings guidance", "url": "https://www.cnbc.com/2026/07/29/qualcomm-qcom-earnings-report-q3-2026-.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-29T21:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Qualcomm planeja aumentar os preços devido a um aumento nos custos, conforme declarado pelo CEO Cristiano Amon. A empresa ofereceu uma perspectiva de lucros moderada.", "titulo_pt": "Qualcomm vai aumentar os preços durante escassez de memória e oferece perspectiva de lucros leve", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 79977, "titulo": "Thunder Tiger, Shield AI demonstrate mission autonomy software", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/07/30/2003861633", "fonte_id": "taipei_times", "data_pub": "2026-07-30T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Thunder Tiger e o Shield AI demonstraram software de autonomia operacional para missões. O software permite que os sistemas operem de forma autônoma durante as tarefas designadas.", "titulo_pt": "Thunder Tiger e Shield AI demonstram software de autonomia para missões", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 79991, "titulo": "US FCC bans imports of new humanoid bots", "url": "https://www.taipeitimes.com/News/biz/archives/2026/07/30/2003861602", "fonte_id": "taipei_times", "data_pub": "2026-07-30T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FCC dos Estados Unidos proibiu a importação de novos robôs humanoides. A decisão visa evitar potenciais riscos à segurança pública e privacidade.", "titulo_pt": "FCC dos EUA proíbe importação de novos robôs humanoides", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 79992, "titulo": "Dynapack scaling up backup battery sales this year", "url": "https://www.taipeitimes.com/News/biz/archives/2026/07/30/2003861603", "fonte_id": "taipei_times", "data_pub": "2026-07-30T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Dynapack está aumentando suas vendas de baterias de backup neste ano. A empresa está expandindo seu negócio nessa área.", "titulo_pt": "Dynapack ampliando vendas de baterias de backup este ano", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 80830, "titulo": "Mark Zuckerberg predicts that billions of people will have personal AI agents in five years", "url": "https://techcrunch.com/2026/07/29/mark-zuckerberg-predicts-that-billions-of-people-will-have-personal-ai-agents-in-five-years/", "fonte_id": "techcrunch", "data_pub": "2026-07-29T23:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mark Zuckerberg espera que bilhões de pessoas tenham agentes de inteligência artificial pessoais em cinco anos. A Meta está investindo bilhões na infraestrutura e nos agentes de IA, buscando convencer os investidores da recompensa desse investimento.", "titulo_pt": "Zuckerberg prevê que bilhões de pessoas terão agentes de IA pessoais em cinco anos", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 80831, "titulo": "Microsoft logs $3.2B from Anthropic investment, but OpenAI was a mixed bag", "url": "https://techcrunch.com/2026/07/29/microsoft-logs-3-2b-from-anthropic-investment-but-openai-was-a-mixed-bag/", "fonte_id": "techcrunch", "data_pub": "2026-07-29T22:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Microsoft registrou ganhos de $3,2 bilhões com sua investida na Anthropic, enquanto os resultados das suas investidas no OpenAI foram mistos. Durante o quarto trimestre fiscal de 2026 (que terminou em 30 de junho), a empresa divulgou detalhes sobre o desempenho de seus investimentos nos dois maiores laboratórios de IA, que são rivais entre si.", "titulo_pt": "Microsoft registra $3,2 bi com investimento na Anthropic, mas OpenAI foi misto", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 80832, "titulo": "Zuckerberg says Meta’s enterprise AI opportunity extends beyond agents", "url": "https://techcrunch.com/2026/07/29/zuckerberg-says-metas-enterprise-ai-opportunity-extends-beyond-agents/", "fonte_id": "techcrunch", "data_pub": "2026-07-29T22:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No chamado sobre os resultados do segundo trimestre, o CEO Mark Zuckerberg afirmou que a Meta vê uma 'grande oportunidade de negócios corporativo' que abrange agentes de inteligência artificial (IA), APIs, computação e software interno.", "titulo_pt": "Zuckerberg diz que a oportunidade empresarial da IA da Meta vai além dos assistentes", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 80833, "titulo": "Mythos attack on 3rd-round PQC algorithm candidate puts it out of commission", "url": "https://arstechnica.com/security/2026/07/mythos-uncovers-crypto-weaknesses-that-went-unknown-for-years/", "fonte_id": "ars_technica", "data_pub": "2026-07-29T22:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O algoritmo de criptografia PQC (Post-Quantum Cryptography) HAWK foi retirado do processo de avaliação após a detecção de uma vulnerabilidade através da metodologia Mythos.", "titulo_pt": "Ataque mythos remove candidato ao algoritmo PQC", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 80581, "titulo": "Mark Zuckerberg is planning a big push into personal AI agents", "url": "https://www.theverge.com/tech/972294/meta-q2-2026-earnings-mark-zuckerberg-personal-ai-agents", "fonte_id": "the_verge", "data_pub": "2026-07-29T21:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meta está focada no desenvolvimento de inteligência artificial e planeja lançar uma iniciativa significativa relacionada a agentes pessoais de IA que podem realizar tarefas em nome dos usuários. Durante o chamado financeiro do segundo trimestre de 2026, o CEO Mark Zuckerberg deu um vislumbre dessa estratégia.", "titulo_pt": "Mark Zuckerberg planeja uma grande investida em agentes pessoais de IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 80582, "titulo": "Qualcomm is raising phone chip prices starting September 1st", "url": "https://www.theverge.com/tech/972894/qualcomm-price-hikes-q2-2026-earnings", "fonte_id": "the_verge", "data_pub": "2026-07-29T21:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Qualcomm está aumentando os preços dos seus processadores a partir do dia 1º de setembro. De acordo com o CEO Cristiano Amon, as novas tarifas serão aplicadas em todos os produtos da empresa.", "titulo_pt": "Qualcomm vai aumentar os preços dos seus processadores a partir de 1º de setembro", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 80575, "titulo": "In an era defined by AI, can work still be measured by the clock?", "url": "https://www.scmp.com/opinion/asia-opinion/article/3361805/era-defined-ai-can-work-still-be-measured-clock?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-29T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Hwaseong, Coreia do Sul, após a meia-noite, um engenheiro está totalmente imerso no trabalho, detectando uma falha que evita desperdício de wafers. No entanto, ele precisa se retirar conforme exigido pela lei. A chegada da inteligência artificial está gradualmente redefinindo o valor do tempo dele fora das instalações.", "titulo_pt": "Na era dominada por IA, a still pode ser medida pelo relógio?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 80351, "titulo": "Limite da IA: empresas de tecnologia pedem que EUA freiem modelos avançados", "url": "https://www.cnnbrasil.com.br/tecnologia/limite-da-ia-empresas-de-tecnologia-pedem-que-eua-freiem-modelos-avancados/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas de tecnologia como OpenAI e Anthropic apoiaram uma iniciativa que pede aos Estados Unidos para frear o desenvolvimento de modelos avançados de inteligência artificial.", "titulo_pt": "Limite da IA: empresas de tecnologia apoiam pedido para frear modelos avançados nos EUA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 80352, "titulo": "Após Brasil, Google anuncia verificação de idade para o mundo todo", "url": "https://www.cnnbrasil.com.br/tecnologia/apos-brasil-google-anuncia-verificacao-de-idade-para-o-mundo-todo/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Google anunciou a verificação de idade para seus serviços em todo o mundo, incluindo no Brasil. Este recurso faz parte das exigências do ECA Digital.", "titulo_pt": "Google anuncia verificação de idade global após Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 80586, "titulo": "Discover what’s next for AI, from the SaaS reckoning to the agent security gap, at TechCrunch Disrupt 2026", "url": "https://techcrunch.com/2026/07/29/discover-whats-next-for-ai-from-the-saas-reckoning-to-the-agent-security-gap-at-techcrunch-disrupt-2026/", "fonte_id": "techcrunch", "data_pub": "2026-07-29T21:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No TechCrunch Disrupt 2026, o palco dedicado à Inteligência Artificial (IA) retornará para explorar o tema mais quente da comunidade nos últimos anos, apresentado pela Google for Startups.", "titulo_pt": "Descubra o que vem por aí na IA, do questionamento sobre os serviços como software à lacuna de segurança dos agentes, no TechCrunch Disrupt 2026", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 80587, "titulo": "Thinking Machines co-founder Lilian Weng left the company citing health reasons, then joined OpenAI", "url": "https://techcrunch.com/2026/07/29/thinking-machines-co-founder-lilian-weng-left-the-company-citing-health-reasons-then-joined-openai/", "fonte_id": "techcrunch", "data_pub": "2026-07-29T21:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lilian Weng, co-fundadora da Thinking Machines, deixou a empresa por motivos de saúde e posteriormente se juntou à OpenAI. Ela já havia servido como vice-presidente sênior de Pesquisa em Segurança do AI na OpenAI.", "titulo_pt": "Co-fundadora da thinking Machines Lilian Weng passa para a OpenAI por motivos de saúde", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 80583, "titulo": "xAI’s last-minute scramble to stop Minnesota’s anti-nudification app law", "url": "https://www.theverge.com/policy/972850/xai-grok-minnesota-nudification-lawsuit", "fonte_id": "the_verge", "data_pub": "2026-07-29T21:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "xAI está processando o Procurador-Geral do Estado do Minnesota, Keith Ellison, por uma lei aprovada no mês de maio que proíbe aplicativos de 'nudificação'. A empresa argumenta que a lei viola a Primeira Emenda e lhe impõe limitações impraticáveis em suas funcionalidades.", "titulo_pt": "Xai processa procurador-geral do Minnesota por lei contra aplicativos de 'nudificação'", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 80361, "titulo": "GWM revela versões esportivas do Ora 5; lançamento é exclusivo da China", "url": "https://www.cnnbrasil.com.br/auto/gwm-revela-versoes-esportivas-do-ora-5-lancamento-e-exclusivo-da-china/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A GWM lançou versões esportivas do Ora 5 chamadas Sport e GT no mercado asiático, com kits aerodinâmicos, cores novas e sensor LiDAR. O modelo base recém-lançado no Brasil já esgotou o primeiro lote.", "titulo_pt": "GWM anuncia versões esportivas do Ora 5; lançamento é exclusivo da China", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 80838, "titulo": "Lake ice loss could accelerate after winter temperatures cross critical thresholds", "url": "https://phys.org/news/2026-07-lake-ice-loss-winter-temperatures.html", "fonte_id": "phys_org", "data_pub": "2026-07-29T23:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A perda do gelo no inverno pode acelerar nas lagoas do Hemisfério Norte após as temperaturas de inverno ultrapassarem determinados limites críticos. O gelo invernal não é apenas uma superfície congelada, mas também um regulador sazonal que molda os ecossistemas aquáticos e o equilíbrio energético.", "titulo_pt": "Perda do gelo nas lagoas pode acelerar após temperaturas de inverno cruzarem limites críticos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 80839, "titulo": "Expressway restoration may speed regional economic recovery after disasters", "url": "https://phys.org/news/2026-07-expressway-regional-economic-recovery-disasters.html", "fonte_id": "phys_org", "data_pub": "2026-07-29T23:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo demonstrou pela primeira vez o papel crucial da restauração de redes de transporte (como estradas e ferrovias) na reconstrução das economias regionais após desastres naturais, ajudando os residentes a recuperarem suas vidas. O trabalho foi publicado em Transportation Research Part A: Policy and Practice.", "titulo_pt": "Restauração de rodovias pode acelerar recuperação econômica regional após desastres", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 80844, "titulo": "L3Harris delays missile business IPO to 2027 despite surging defense demand", "url": "https://spacenews.com/l3harris-delays-missile-business-ipo-to-2027-despite-surging-defense-demand/", "fonte_id": "spacenews", "data_pub": "2026-07-29T22:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A L3Harris adiou a oferta inicial de ações da sua divisão de mísseis para 2027, apesar da alta demanda pela defesa.", "titulo_pt": "L3harris adia IPO da divisão de mísseis para 2027 frente à alta demanda pela defesa", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 80846, "titulo": "'It's going to do things that currently are impossible': The Roman Space Telescope, NASA's next great observatory, is ready to launch Aug. 30", "url": "https://www.space.com/astronomy/its-going-to-do-things-that-currently-are-impossible-the-roman-space-telescope-nasas-next-great-observatory-is-ready-to-launch-aug-30", "fonte_id": "space_com", "data_pub": "2026-07-29T22:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Telescópio Espacial Roman da NASA está pronta para ser lançada no dia 30 de agosto a bordo do foguete Falcon Heavy da SpaceX. O telescópio mapeará todo o céu com uma escala nunca antes vista.", "titulo_pt": "Ele vai fazer coisas que atualmente são impossíveis: o telescópio espacial Roman, a próxima grande observatória da NASA, está pronto para ser lançado no dia 30 de agosto", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 80840, "titulo": "One of industry's toughest lignin byproducts could become feedstock for valuable chemicals", "url": "https://phys.org/news/2026-07-industry-toughest-lignin-byproducts-feedstock.html", "fonte_id": "phys_org", "data_pub": "2026-07-29T22:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A indústria de celulose e papel, que produz desde papel higiênico até cartão, também gera um subproduto significativo e frequentemente negligenciado - uma polímero complexo chamado lignina. Embora seja a maior fonte natural de carbono aromático do planeta, a maioria é queimada como energia devido à sua estrutura complexa.", "titulo_pt": "Um dos subprodutos mais resistentes da indústria de celulose e papel pode se tornar matéria-prima para químicos valiosos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 80841, "titulo": "Invasive species emerge as a driver of human displacement, new research shows", "url": "https://phys.org/news/2026-07-invasive-species-emerge-driver-human.html", "fonte_id": "phys_org", "data_pub": "2026-07-29T22:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa publicada no Frontiers mostra que espécies invasoras estão causando deslocamento humano. No Kenya, a Opuntia stricta expulsou comunidades pastoris, enquanto o formigão de pequeno fogo levou à abandono de fazendas em várias regiões do Pacífico e na América do Sul. O acastanhamento aquático tem interrompido os sustentados da pesca em grande parte da África.", "titulo_pt": "Espécies invasoras emergem como motor do deslocamento humano, mostra nova pesquisa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 80842, "titulo": "Keeping stem cells in check: A new mechanism by which cell junction proteins regulate tissue homeostasis", "url": "https://phys.org/news/2026-07-stem-cells-mechanism-cell-junction.html", "fonte_id": "phys_org", "data_pub": "2026-07-29T22:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em muitos tecidos animais, células-tronco dividem-se continuamente para criar novas células que substituem as velhas ou danificadas. No entanto, essa capacidade requer uma regulação estrita, pois a proliferação não controlada de células-tronco pode perturbar o equilíbrio do tecido e contribuir para o desenvolvimento de tumores.", "titulo_pt": "Regulando células-tronco: um novo mecanismo por meio dos quais proteínas de junções celulares regulam a homeostase tecidual", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 80843, "titulo": "Most complete skeleton of 30 million-year-old dog discovered", "url": "https://phys.org/news/2026-07-skeleton-million-year-dog.html", "fonte_id": "phys_org", "data_pub": "2026-07-29T22:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um fóssil completo de um cão de 30 milhões de anos foi descoberto há muito tempo em uma coleção de museu no Oregon. Inicialmente, os paleontólogos acreditavam que se tratava de um parente remoto de ovelhas, camelas e porcos.", "titulo_pt": "Maior esqueleto completo de cão de 30 milhões de anos descoberto", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 80598, "titulo": "What sheep's teeth can tell us about life in a medieval Kazakhstan town", "url": "https://phys.org/news/2026-07-sheep-teeth-life-medieval-kazakhstan.html", "fonte_id": "phys_org", "data_pub": "2026-07-29T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo analisou a herdagem em uma cidade medieval do Cazaquistão através dos isótopos preservados nos dentes de ovelhas. Os resultados indicaram que as pessoas adaptavam suas estratégias de gestão para sobreviverem em um ambiente árido.", "titulo_pt": "O que os dentes das ovelhas podem revelar sobre a vida em uma cidade medieval do cazaquistão", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 80599, "titulo": "Carrion emerges as a key force shaping ecosystems, disease and human evolution", "url": "https://phys.org/news/2026-07-carrion-emerges-key-ecosystems-disease.html", "fonte_id": "phys_org", "data_pub": "2026-07-29T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo internacional, liderado pela Universidade de Granada e envolvendo pesquisadores do Centro Nacional de Investigação sobre a Evolução Humana, sugere que o que acontece após a morte é crucial para compreender diversos processos e oferecer novas perspectivas em várias disciplinas. A questão tradicionalmente negligenciada pela ecologia pode ajudar a entender sistemas ecológicos, doenças e a evolução humana.", "titulo_pt": "O que acontece após a morte emerge como força fundamental para o entendimento de ecossistemas, doenças e evolução humana", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 80304, "titulo": "Lagarta que ataca soja e milho tem fungos que podem degradar isopor", "url": "https://www.metropoles.com/ciencia/lagarta-fungos-degradar-isopor", "fonte_id": "metropoles", "data_pub": "2026-07-29T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo brasileiro identificou fungos presentes no intestino da lagarta-do-algodão que podem degradar isopor. Essa descoberta pode ter aplicações ambientais significativas.", "titulo_pt": "Fungos do intestino de lagarta podem degradar isopor", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 80600, "titulo": "Climate shapes vegetation patterns across Yellow River Basin", "url": "https://phys.org/news/2026-07-climate-vegetation-patterns-yellow-river.html", "fonte_id": "phys_org", "data_pub": "2026-07-29T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa publicada na International Journal of Environmental Engineering demonstra que o clima molda os padrões da vegetação ao longo do trecho de Henan do vale do Rio Amarillo da China. No entanto, a expansão agrícola e urbana afetam negativamente a diversidade das plantas em áreas altamente desenvolvidas, conforme constatado pelo estudo baseado em observações por satélite e modelagem ecológica.", "titulo_pt": "Clima molda padrões de vegetação no vale do rio amarillo da china (henan)", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 80601, "titulo": "Ice Age artists carved thumbnail-size bird figurines from mammoth ivory 40,000 years ago", "url": "https://phys.org/news/2026-07-ice-age-artists-thumbnail-size.html", "fonte_id": "phys_org", "data_pub": "2026-07-29T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Arqueólogos descobriram duas pequenas figuras de pássaros, do tamanho de um ungarro, carvoadas em ossos de mamute na caverna Hohle Fels na Suábia, Alemanha. Esses artefatos são os mais pequenos já encontrados e datam de 40.000 anos, sendo parte da rica camada Aurignacian que produziu algumas das primeiras representações figurativas conhecidas.", "titulo_pt": "Artistas do idade da gelo esculpiram miniaturas de pássaros em ossos de mamute há 40.000 anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 80596, "titulo": "NSF testing new Ph.D. model giving trainees academic and industry experience", "url": "https://www.statnews.com/2026/07/29/hybrid-academia-industry-phd-program-announced-uidp/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-07-29T21:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A administração Trump anunciou um financiamento para testar um novo modelo de Ph.D., que oferece experiência acadêmica e industrial aos jovens cientistas. Este movimento visa reavaliar a educação de pós-graduação, considerando o aumento da desertificação do setor acadêmico por parte dos jovens cientistas.", "titulo_pt": "NSF testa novo modelo de Ph.D. Com experiência acadêmica e industrial", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 80602, "titulo": "A mechanically tunable molecular switch for circularly polarized light emission", "url": "https://phys.org/news/2026-07-mechanically-tunable-molecular-circularly-polarized.html", "fonte_id": "phys_org", "data_pub": "2026-07-29T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nos últimos décadas, cientistas têm se interessado cada vez mais em desenvolver materiais que não apenas resistem a forças mecânicas, mas também respondem a elas de maneiras úteis e detetáveis. Um exemplo disso são os materiais mecanocromáticos ou responsivos à mecânica, que podem sinalizar quando estão sob estresse através de mudanças em cor ou luminosidade.", "titulo_pt": "Um interruptor molecular ajustável para emissão de luz polarizada circularmente", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 80603, "titulo": "Interaction between sugar beet and its pest varies depending on drought stress, researchers find", "url": "https://phys.org/news/2026-07-interaction-sugar-beet-pest-varies.html", "fonte_id": "phys_org", "data_pub": "2026-07-29T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa da Universidade de Göttingen analisou como diferentes níveis de estresse por seca afetam a susceptibilidade do beterraba ao dano causado pelo minerador de folhas da beterraba (Pegomya cunicularia). Os resultados mostraram que o estresse por seca altera as interações entre a planta e seu parasita.", "titulo_pt": "Interação entre beterraba e seu parasita varia com o estresse por seca, revela pesquisa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 80644, "titulo": "A opinião do primeiro-ministro grego sobre a adaptação de ‘A Odisseia’", "url": "https://veja.abril.com.br/cultura/a-opiniao-de-primeiro-ministro-grego-pela-adaptacao-de-a-odisseia/", "fonte_id": "veja", "data_pub": "2026-07-29T22:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Parte da produção de 'A Odisseia' foi filmada em regiões da Grécia, como o Peloponeso e Corinto.", "titulo_pt": "A opinião do primeiro-ministro grego sobre A adaptação de ‘A Odisseia’", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 80645, "titulo": "O desabafo de Xuxa sobre política: ‘não sou de esquerda’", "url": "https://veja.abril.com.br/cultura/o-desabafo-de-xuxa-sobre-politica-nao-sou-de-esquerda/", "fonte_id": "veja", "data_pub": "2026-07-29T22:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Xuxa Mene
