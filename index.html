<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">

  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>

</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "15/11/2026 19:16", "stats": {"noticias_novas": 395, "resumos_gerados": 199}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Lula definiu a formação dos ministérios após suas viagens internacionais, conforme informou Geraldo Alckmin, presidente em exercício. A decisão política inclui a possibilidade de incluir parlamentares não petistas para garantir a governabilidade, segundo aliados do presidente. No segundo dia do Enem, o site do Inep sofreu ataques de hackers, conforme informou o ministro da Educação. Além disso, o Rio de Janeiro registrou a primeira morte confirmada por mpox no país, com 382 casos comprovados laboratorialmente. A Petrobras caiu três posições no ranking de lucro de petroleiras, com um lucro de US$ 7,7 bilhões no terceiro trimestre de 2026, enquanto a Saudi Aramco liderou a lista. O Superior Tribunal de Justiça (STJ) decidiu que condomínios podem ser responsabilizados por furto se a portaria falhar em prevenir a entrada de criminosos sem autorização dos moradores.", "mundo": "Várias notícias importantes marcaram a semana no cenário internacional. Na América do Norte, Dolores Huerta, líder histórica dos direitos dos trabalhadores, será homenageada em Sacramento e Bakersfield, Califórnia, por seu trabalho no ativismo. No Oriente Médio, o governo ucraniano pressiona para a remoção das limitações do sistema de internet satelital Starshield, que afetam a capacidade de interceptar ataques russos. Em Praga, na República Tcheca, milhares de pessoas se manifestaram em apoio aos meios de comunicação públicos, enquanto o governo propõe reformas que seriam consideradas ameaçadoras pela oposição. No Mar do Sul da China, líderes asiáticos se reúnem para discutir temas como soberania marítima e energia. Na América do Sul, o Papa Francisco defendeu a Amazônia e seus habitantes, criticando a lógica de mercado que coloca a natureza em risco, durante uma missa celebrada na Amazônia peruana. Além disso, milhares de migrantes chegaram às Ilhas Canárias em 48 horas, levando as autoridades a declararem uma emergência migratória na região.\n\nA Rússia confirmou um encontro entre os líderes dos Estados Unidos, Donald Trump, e da China, Xi Jinping, durante uma viagem de Putin à China para uma reunião da APEC. As tensões geopolíticas continuam a se intensificar, com o Irã atacando uma base militar dos Estados Unidos no Bahrein com drones, em resposta a operações americanas contra o Irã. A Estônia anunciou que fechará suas fronteiras com a Rússia a partir de 1º de dezembro, após denunciar uma tentativa de incêndio criminoso em uma fábrica de drones, atribuída à GRU, inteligência militar russa. Em outros desenvolvimentos, Israel matou um comandante do Hamas em um ataque aéreo na Faixa de Gaza, enquanto o Iêmen enfrenta ataques de mísseis balísticos lançados pelos hutíes contra o aeroporto e a área financeira de Riad. A NATO reduzirá as reuniões de alto nível e não realizará uma cúpula de líderes na Albânia em 2027, devido à tensão dentro da aliança sobre gastos em defesa, Irã e guerra na Ucrânia.", "economia": "O Brasil enfrenta desafios significativos na área de cibersegurança, com várias infraestruturas críticas sendo atacadas recentemente, levantando dúvidas sobre a existência de um plano de contingência. Os Correios sofreram um prejuízo no terceiro trimestre de 2026 no valor de R$ 1,9 bilhão, um aumento de 19% em relação ao mesmo período do ano anterior, com um total acumulado de R$ 7,5 bilhões em prejuízos até setembro. Além disso, a inflação nos Estados Unidos está 'caminhando na direção errada', conforme alertou o presidente do Fed de Kansas City, Jeff Schmid, o que pode levar a uma alta de 0,25 ponto percentual nas taxas de juros em dezembro, conforme previsto pelos mercados.", "tecnologia": "O escândalo envolvendo a Nvidia está aprofundando a concorrência na área de inteligência artificial (IA), com o CEO Jensen Huang potencialmente retornando ao cargo. O Congresso dos Estados Unidos está considerando restringir ainda mais as exportações de chips de IA. Durante uma apresentação antes de sua oferta inicial de ações (IPO), o CEO da Anthropic enfatizou a segurança e a cultura da empresa. A TSMC obteve um financiamento recorde para expandir suas fábricas de processadores, refletindo o crescimento das operações da empresa. A China realizou o primeiro voo tripulado de um avião comercial elétrico, enquanto a United Launch Alliance teve sua primeira falha de missão em 20 anos, destruindo 40 satélites da Amazon's Leo. Além disso, a Nvidia enfrenta pressão para encontrar um novo presidente-executivo externo, com o secretário do Tesouro dos EUA, Scott Bessant, questionando a conformidade da empresa com as restrições de exportação para a China.", "ciencia": "A ciência avança em vários campos, com destaque para a identificação de um sinal de rádio raro que se repete a cada oito minutos no espaço. Esse sinal foi descoberto por uma equipe que processou mais de 100 horas de dados no Centro de Pesquisa de Supercomputação Pawsey. Além disso, a NASA alerta que o El Niño de 2026 poderia superar o evento histórico de 1997-98, com possíveis grandes precipitações e inundações neste inverno. Em outro desenvolvimento, a Starship da SpaceX retornou com sucesso à Terra, sendo capturada por enormes braços mecânicos no local onde seu voo orbital começou 22 horas antes. Estudos também sugerem que a vitamina C pode ajudar a prevenir químicos potencialmente cancerígenos no estômago após o consumo de alimentos ricos em nitritos, enquanto um aminoácido comum, a arginina, pode desempenhar um papel importante na proteção contra câncer e infecções virais.", "cultura": "Phil Collins, lendário vocalista do Genesis, foi induzido ao Rock and Roll Hall of Fame em uma cerimônia que também celebrou artistas como U2, Red Hot Chili Peppers e Aerosmith. Durante a cerimônia, Collins subiu ao palco com bengalas devido a problemas de saúde, mas não conseguiu conter as lágrimas, emocionando-se com a homenagem. A cerimônia também incluiu performances memoráveis, como as do Wu-Tang Clan e de Peter Hook, baixista da Joy Division e New Order. Em outro evento cultural, Zezé Motta participará de um concerto em homenagem a Milton Nascimento, celebrando o Mês da Consciência Negra no Rio de Janeiro. Além disso, a cidade de Xiâan, na China, viu o projeto de interiores do café Laibei 1087, assinado por Tant A Temps Design, trazer elementos da arquitetura tang, revivendo a estética da dinastia Tang.", "sociedade": "Mais de 100 mil pessoas participaram de novos protestos na França, no quinto sábado consecutivo, contra o alto custo de vida e em defesa de uma educação melhor, de acordo com a Carta Capital. A polícia deteve 219 manifestantes durante as manifestações. No Brasil, o primeiro óbito por mpox foi confirmado no Rio de Janeiro, informou a Veja. Na França, a situação na província de Arauco divide a região do Biobío, com 33% pedindo aumento da segurança e 32% defendendo o diálogo, relatou o Carta Capital. Em Goiás, a fábrica localizada no Entorno do Distrito Federal trata diariamente 9 toneladas de resíduos animais, gerando odor e ruído intensos, informou o Metrópoles. O Hospital Digital do Minsal registrou mais de 10 mil atendimentos por diabetes em 2026, atendendo 57 mil pessoas desde 2018, conforme o Metrópoles. O Ministério da Educação relatou ter ocorrido ataques hackers no Instituto Nacional de Estudos e Pesquisas Educacionais (Inep) no dia anterior ao Exame Nacional do Ensino Médio (Enem), conforme a Veja. O Enem 2026 foi realizado com estudantes do Distrito Federal recebendo apoio de um grupo de oração antes do fechamento dos portões para o segundo dia de provas, relatou o Metrópoles. Um engenheiro de 75 anos do Distrito Federal participou do Enem com a intenção de atualizar seus conhecimentos e buscar uma vaga no curso de direito, informou o Metrópoles. O policial do BOPE de Pernambuco sobreviveu a um tiro na cabeça durante uma ação, graças ao uso do capacete, conforme a Veja. Ainda sobre saúde, a OMS informou que doenças respiratórias aumentaram em Gaza devido às condições de vida ruins e à superpopulação, e que a situação será ainda mais grave com a chegada das inundações do inverno, conforme a BBC Brasil. O cacique Raoni, do Brasil, apresenta melhoras no estado de saúde, mas ainda está sob monitorização médica, segundo a CNN Brasil. Além disso, a família de Bernardo Toni, uma criança de 5 anos com nanismo, perdeu o acesso a um tratamento após o Ministério da Saúde não incluir a medicação no SUS, informou o Metrópoles. Ainda sobre saúde, a Fundação das Mulheres e Família de Seul realizou um levantamento que revelou que 69,2% dos jovens se preocupam com a discriminação baseada no gênero, e que cerca de 40,3% dos entrevistados afirmaram serem conscientes de desvantagens estruturais contra as mulheres e de que há discriminação significativa entre homens e mulheres, conforme o Korea Herald.", "meio_ambiente": "O Papa Francisco está em uma viagem de 12 dias pela América do Sul, visitando o Peru, Uruguai e Argentina. Durante sua estadia no Brasil, ele condenou a 'exploração irresponsável' da floresta amazônica, citando a produção de ouro e petróleo, e pediu esclarecimentos sobre os assassinatos de lideranças indígenas. No Canadá, o presidente Lula anunciou um aporte bilionário de 400 milhões de dólares (aproximadamente R$ 2,26 bilhões) ao Fundo de Proteção de Florestas ao longo de quatro anos. Além disso, a reunião discutiu um acordo entre Mercosul e Canadá. O Fundo para Florestas Tropicais recebeu US$ 400 milhões do Canadá, se aproximando de sua meta. O avanço das queimadas ameaça comunidades tradicionais no Pará, que está enfrentando uma estiagem severa, favorecendo a propagação do fogo.", "direitos_humanos": "O Papa Francisco visitou comunidades Shipibo-Konibo no Peru e condenou o desmatamento na Amazônia e a morte de líderes indígenas, pedindo resistência à exploração de recursos naturais. Em outro evento, um tribunal jordaniano sentenciou três homens à morte por enforcamento após um ataque a uma igreja em Karak que resultou na morte de nove pessoas. No Irã, o movimento de mulheres que se opõem ao uso obrigatório do hijab está causando reações das autoridades e grupos conservadores, com sinais de que pode haver uma tentativa de boicote ao uso do véu. Na Malásia, o governo planeja permitir que refugiados trabalhem legalmente, o que aumentou as esperanças da comunidade de refugiados, mas ativistas afirmam que a medida precisará de procedimentos claros de registro e proteções no ambiente de trabalho para ser eficaz. Além disso, um incêndio destruiu um acampamento de refugiados sírios em Bar Elias, Líbano, e um lar para idosos na Tailândia está sendo acusado de manter dezenas de residentes idosos em gaiolas metálicas. O Papa Francisco também denunciou a exploração da Amazônia peruana, alertando sobre os danos causados pela desmatamento ilegal, poluição por mineração irregular e derramamento de óleo, além de condenar a ação do tráfico de drogas em jovens vulneráveis."}, "resumo_do_dia": {"politica_nacional": [{"id": 266028, "titulo": "Justiça condena União a investir R$ 597 milhões em Canudos", "url": "https://www.poder360.com.br/poder-justica/justica-condena-uniao-a-investir-r-597-milhoes-em-canudos/", "fonte_id": "poder360", "data_pub": "2026-11-15T21:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A justiça determinou que o governo federal deve investir R$ 597 milhões para reparar danos causados em Canudos. A decisão abrange a destruição do arraial de Belo Monte e a inundação de um sítio arqueológico.", "titulo_pt": "Justiça condena União a investir R$ 597 milhões em Canudos", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 266030, "titulo": "Dormir bem pode reduzir o risco de desenvolver 90 doenças, diz estudo", "url": "https://www.poder360.com.br/poder-saude/dormir-bem-pode-reduzir-o-risco-de-desenvolver-90-doencas-diz-estudo/", "fonte_id": "poder360", "data_pub": "2026-11-15T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo envolvendo 95.000 pessoas associou períodos mais longos de sono REM e sono profundo a uma menor probabilidade de desenvolver 90 doenças.", "titulo_pt": "Dormir bem pode reduzir o risco de desenvolver 90 doenças, diz estudo", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 266061, "titulo": "Lula decidirá formação dos ministérios quando voltar de viagem, diz Alckmin", "url": "https://www.cnnbrasil.com.br/politica/lula-decidira-formacao-dos-ministerios-quando-voltar-de-viagem-diz-alckmin/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-15T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente em exercício João Doria afirmou que o presidente Lula decidirá a formação dos ministérios na próxima terça-feira (17), após retornar de viagens internacionais.", "titulo_pt": "Alckmin diz que lula definirá ministérios após viagem", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 265985, "titulo": "Cleitinho liga para prefeito que fez show de Claudia Leitte para tirar satisfação", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/cleitinho-liga-para-prefeito-que-fez-show-de-claudia-leitte-para-tirar-satisfacao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-15T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador eleito Cleitinho Azevedo ligou para o ex-prefeito Luciano Rabelo para esclarecer sobre um show da cantora Claudia Leitte, custeado em 2024 com uma emenda do senador.", "titulo_pt": "Cleitinho liga para prefeito para tirar satisfação sobre show de Claudia Leitte", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 266039, "titulo": "Como Lula pode fazer um 4º governo com ‘menos PT’, segundo aliados", "url": "https://veja.abril.com.br/politica/como-lula-pode-fazer-um-4o-governo-com-menos-pt-segundo-aliados/", "fonte_id": "veja", "data_pub": "2026-11-15T21:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados do presidente reeleito Lula defendem a inclusão de parlamentares não petistas para garantir governabilidade e isolar o PL. Essa estratégia visa manter a coesão do governo sem necessariamente fortalecer o PT.", "titulo_pt": "Como Lula pode fazer um 4º governo com ‘menos PT’, segundo aliados", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 266121, "titulo": "Zeca Dirceu pede cassação de deputado eleito que sugeriu demitir petistas", "url": "https://www.metropoles.com/colunas/grande-angular/zeca-dirceu-pede-cassacao-de-deputado-eleito-que-sugeriu-demitir-petistas", "fonte_id": "metropoles", "data_pub": "2026-11-15T20:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado Zeca Dirceu solicitou a cassação do mandato de um parlamentar eleito do Novo que sugeriu demitir funcionários petistas para reduzir custos ou reestruturar empresas.", "titulo_pt": "Zeca Dirceu pede cassação de deputado eleito que sugeriu demitir petistas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 266124, "titulo": "Cleitinho cobra políticos por usarem emenda dele com show de Cláudia Leitte", "url": "https://www.metropoles.com/minas-gerais/cleitinho-cobra-politicos-por-usarem-emenda-dele-com-show-de-claudia-leitte", "fonte_id": "metropoles", "data_pub": "2026-11-15T20:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-prefeito de Mirabela, que gastou mais de R$ 500 mil com uma emenda para um show de Cláudia Leitte em 2024, afirmou não ter conhecimento de que a emenda não poderia ser usada para custear o evento.", "titulo_pt": "Cleitinho acusa políticos de usarem emenda dele para show de Cláudia Leitte", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 266032, "titulo": "Cármen arquiva ação sobre bloqueios de Bolsonaro a jornalistas no X", "url": "https://www.poder360.com.br/poder-justica/carmen-arquiva-acao-sobre-bloqueios-de-bolsonaro-a-jornalistas-no-x/", "fonte_id": "poder360", "data_pub": "2026-11-15T20:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ministra Cármen Lúcia arquivou a ação sobre bloqueios de Bolsonaro a jornalistas no Twitter, considerando que a saída do ex-presidente do cargo fez a ação perder o objeto. A medida foi vista como uma violação à liberdade de imprensa.", "titulo_pt": "Cármen arquiva ação sobre bloqueios de Bolsonaro a jornalistas no twitter", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 266033, "titulo": "Um em cada 4 adolescentes não faz atividades físicas diárias, diz OMS", "url": "https://www.poder360.com.br/poder-saude/um-em-cada-4-adolescentes-nao-faz-atividades-fisicas-diarias-diz-oms/", "fonte_id": "poder360", "data_pub": "2026-11-15T20:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um em cada quatro adolescentes não realiza atividades físicas diárias, de acordo com um estudo da OMS. Cerca de 240 milhões de jovens entre 11 e 17 anos não praticaram exercícios nos últimos 15 anos.", "titulo_pt": "Um em cada 4 adolescentes não faz atividades físicas diárias, diz OMS", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 266093, "titulo": "Site do Inep sofre ataques de hackers no 2º dia do Enem, diz ministro da Educação", "url": "https://www.infomoney.com.br/brasil/enem-2026-ministro-da-educacao-diz-que-pagina-do-inep-e-alvo-de-ataques-hackers/", "fonte_id": "infomoney", "data_pub": "2026-11-15T19:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O site do Inep foi alvo de ataques de hackers no segundo dia do Enem, conforme informou o ministro da Educação. Os ataques estão sendo controlados, mas o Ministério da Educação ainda não detalhou a natureza e o alcance dessas ações.", "titulo_pt": "Site do Inep sofre ataques de hackers no 2º dia do Enem, diz ministro da Educação", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 266035, "titulo": "Com Ronaldinho, Ravenna fatura alto com ingressos mas não bate recorde", "url": "https://www.poder360.com.br/poder-sportsmkt/com-ronaldinho-ravenna-fatura-alto-com-ingressos-mas-nao-bate-recorde/", "fonte_id": "poder360", "data_pub": "2026-11-15T19:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O clube italiano da Série C arrecadou cerca de 200 mil euros com a venda de ingressos durante a presença de Ronaldinho. O jogador retornou aos gramados após um período de 11 anos sem atuar profissionalmente.", "titulo_pt": "Com Ronaldinho, Ravenna conquista bom lucro com bilheteria, mas não atinge recorde", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 266036, "titulo": "Lula se encontra com Infantino e marca reunião sobre Copa Feminina", "url": "https://www.poder360.com.br/poder-sportsmkt/lula-se-encontra-com-infantino-e-marca-reuniao-sobre-copa-feminina/", "fonte_id": "poder360", "data_pub": "2026-11-15T19:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente da FIFA, Gianni Infantino, se reuniu com Lula e parabenizou-o pela reeleição. Eles marcaram uma reunião para discutir os preparativos para a Copa Feminina de 2027.", "titulo_pt": "Lula se reúne com Infantino e agenda reunião sobre Copa Feminina de 2027", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 266055, "titulo": "‘Fascistas’ xingam e provocam famílias no primeiro dia da Feira da Reforma Agrária em Goiânia", "url": "https://www.brasildefato.com.br/2026/11/15/fascistas-xingam-e-provocam-familias-no-primeiro-dia-da-feira-da-reforma-agraria-em-goiania/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-15T19:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Famílias camponesas participantes da 3ª Feira Estadual da Reforma Agrária em Goiânia foram xingadas e hostilizadas por grupos que passaram pelo local no sábado. O evento ocorreu na Praça Universitária e contou com a presença do Movimento dos Trabalhadores Rurais Sem Terra (MST).", "titulo_pt": "‘Fascistas’ xingam e provocam famílias no primeiro dia da Feira da Reforma Agrária em Goiânia", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 266047, "titulo": "MPF investiga agente da Abin que meteu atestado e foi fazer bico na iniciativa privada", "url": "https://veja.abril.com.br/brasil/mpf-investiga-agente-da-abin-que-meteu-atestado-e-foi-fazer-bico-na-iniciativa-privada/", "fonte_id": "veja", "data_pub": "2026-11-15T19:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público Federal (MPF) está investigando um agente da Agência Brasileira de Inteligência (Abin) que foi flagrado fazendo trabalho extraoficial em empresas privadas, conhecido como 'bico'. A investigação visa verificar se houve crime de improbidade administrativa no caso.", "titulo_pt": "MPF investiga agente da Abin que fez bico na iniciativa privada", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 266049, "titulo": "‘Não podemos permitir que nossas diferenças nos impeçam de trabalhar pelo Brasil’, diz Hugo Motta", "url": "https://veja.abril.com.br/politica/nao-podemos-permitir-que-nossas-diferencas-nos-impecam-de-trabalhar-pelo-brasil-diz-hugo-motta/", "fonte_id": "veja", "data_pub": "2026-11-15T18:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Hugo Motta, presidente da Câmara dos Deputados, publicou em seu perfil no feriado da Proclamação da República uma mensagem defendendo a independência dos Poderes e a harmonia democrática. Ele afirma que não podemos permitir que nossas diferenças nos impeçam de trabalhar pelo Brasil.", "titulo_pt": "‘Não podemos permitir que nossas diferenças nos impeçam de trabalhar pelo Brasil’, diz Hugo Motta", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 266050, "titulo": "Pacote de ajuste fiscal persegue superávit sem mexer nos mais pobres, diz Alckmin", "url": "https://veja.abril.com.br/economia/pacote-de-ajuste-fiscal-alckmin/", "fonte_id": "veja", "data_pub": "2026-11-15T18:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O pacote de ajuste fiscal apresentado recentemente não busca reduzir gastos com os mais pobres, segundo Alckmin. O projeto pode ser votado na Câmara dos Deputados na próxima semana.", "titulo_pt": "Pacote de ajuste fiscal persegue superávit sem mexer nos mais pobres, diz Alckmin", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 265859, "titulo": "Taiwan flags page over military data", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/16/2003867803", "fonte_id": "taipei_times", "data_pub": "2026-11-16T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Taiwan discute a bandeira da página sobre dados militares. Os detalhes específicos dos dados militares em questão não foram fornecidos nesse trecho.", "titulo_pt": "Taiwan discute bandeira da página sobre dados militares", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 265860, "titulo": "‘Nvidia loves Taiwan,’ tech executive says", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/16/2003867804", "fonte liados fazem acordo para proteger cadeia de IA da China", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 266240, "titulo": "Jordan Sentences 3 to Death Over Greek Orthodox Church Attack", "url": "https://www.nytimes.com/2026/11/15/world/middleeast/jordan-church-attack-death-sentence.html", "fonte_id": "nyt_world", "data_pub": "2026-11-15T21:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O exército jordaniano sentenciou três homens à pena de morte por ataques a uma igreja grega ortodoxa. Os acusados foram presos após um tiroteio ocorrido em uma igreja grega ortodoxa no mês passado e foram condenados por crimes terroristas.", "titulo_pt": "Jordânia sentencia 3 pessoas à morte por ataque a igreja ortodoxa grega", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 266348, "titulo": "5 steps China, US and Russia could take at Apec to defuse nuclear risk", "url": "https://www.scmp.com/opinion/china-opinion/article/3374204/5-steps-china-us-and-russia-could-take-apec-defuse-nuclear-risk", "fonte_id": "scmp", "data_pub": "2026-11-15T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A possibilidade de um encontro tripartido entre China, Rússia e Estados Unidos durante a APEC em Shenzhen é considerada. O presidente dos EUA, Donald Trump, propõe que o encontro se concentre em armas nucleares e desnuclearização, destacando a crescente capacidade nuclear da China.", "titulo_pt": "5 Passos que China, EUA e Rússia poderiam tomar na Apec para desarmar risco nuclear", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 266031, "titulo": "EUA receberam alertas sobre riscos em sistema que suspendeu voos", "url": "https://www.poder360.com.br/poder-internacional/eua-receberam-alertas-sobre-riscos-em-sistema-que-suspendeu-voos/", "fonte_id": "poder360", "data_pub": "2026-11-15T21:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Relatórios indicaram riscos etrópoles", "pais": "Brasil", "classe": "B"}, {"id": 266355, "titulo": "Vulcan rocket fails, destroying 40 Amazon Leo satellites", "url": "https://www.theverge.com/science/1034006/vulcan-rocket-fails-destroying-40-amazon-leo-satellites", "fonte_id": "the_verge", "data_pub": "2026-11-15T21:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A United Launch Alliance (ULA) teve sua primeira falha de missão em 20 anos, falhando na tentativa de levar 40 satélites Amazon Leo à órbita. O projeto da Amazon, rival do Starlink da SpaceX, enfrenta dificuldades para se estabelecer, tendo colocado apenas uma pequena parte dos satélites necessários em operação.", "titulo_pt": "Vulcan falha, destruindo 40 satélites Leo da Amazon", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 266134, "titulo": "China quer ampliar IA aberta no BRICS; o que o Brasil pode ganhar com isso?", "url": "https://canaltech.com.br/mercado/china-quer-ampliar-ia-aberta-no-brics-o-que-o-brasil-pode-ganhar-com-isso/", "fonte_id": "canaltech", "data_pub": "2026-11-15T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil pode beneficiar da proposta chinesa de criar uma comunidade de IA aberta no BRICS, mas isso dependerá das condições estabelecidas na parceria. O pesquisador Luca Belli defende que o país deve participar das decisões sobre o funcionamento da iniciativa, em vez de apenas utilizar as ferramentas disponibilizadas pela China.", "titulo_pt": "China quer ampliar IA aberta no BRICS; o que o Brasil pode ganhar com isso?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 266095, "titulo": "4 horas de sono estão boas pra você? Genética pode ajudar a explicar quem precisa de menos sono", "url": "https://olhardigital.com.br/2026/11/15/medicina-e-saude/4-horas-de-sono-estao-boas-pra-voce-genetica-pode-ajudar-a-explicar-quem-precisa-de-menos-sono/", "fonte_id": "olhar_digital", "data_pub": "2026-11-15T20:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudos examinam como a genética afeta a quantidade de sono necessária e por que sentir-se bem após poucas horas de sono não garante um bom desempenho. A genética pode explicar por que algumas pessoas conseguem se sentir bem com apenas 4 horas de sono.", "titulo_pt": "4 Horas de sono estão boas pra você? Genética pode ajudar a explicar quem precisa de menos sono", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 266356, "titulo": "Jensen Huang might be plotting a return and more of the latest Nvidia drama", "url": "https://www.theverge.com/tech/1033999/jensen-huang-return-nvidia-megaspeed", "fonte_id": "the_verge", "data_pub": "2026-11-15T20:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há desenvolvimentos recentes envolvendo Jensen Huang, co-fundador e ex-CEO da Nvidia, com especulações sobre uma possível volta dele ao cargo de CEO. O escândalo em torno dele está se desenvolvendo rapidamente.", "titulo_pt": "Jensen Huang pode estar planejando uma volta e mais do último drama da Nvidia", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 266359, "titulo": "SNL gathers all the tech tycoons for a lesson in dating and spycraft", "url": "https://techcrunch.com/2026/11/15/snl-gathers-all-the-tech-tycoons-for-a-lesson-in-dating-and-spycraft/", "fonte_id": "techcrunch", "data_pub": "2026-11-15T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A versão mais recente do Saturday Night Live apresentou uma seção que reuniu impressionações de executivos de tecnologia, focando em aulas sobre relacionamentos e espionagem. Embora tenha sido incômodo e até perturbador, a apresentação permitiu que os atores exibissem suas melhorias em uma única noite.", "titulo_pt": "SNL reúne executivos de tecnologia para aulas de relacionamentos e espionagem", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 266135, "titulo": "Review Samsung Odyssey OLED G5 | O OLED mais barato do Brasil é tudo isso mesmo?", "url": "https://canaltech.com.br/hardware/review-samsung-odyssey-oled-g5/", "fonte_id": "canaltech", "data_pub": "2026-11-15T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O monitor Samsung Odyssey OLED G5 é o OLED mais barato do Brasil, custando menos de R$ 4.000. Ele oferece cores vivas e pretos profundos, com contraste e brilho excelentes, graças à tecnologia OLED.", "titulo_pt": "Review Samsung Odyssey OLED G5 | O OLED mais barato do Brasil é tudo isso mesmo?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 266357, "titulo": "Congress wants to tighten export rules on AI chips after Nvidia spy scandal", "url": "https://www.theverge.com/ai-artificial-intelligence/1033984/congress-export-rules-ai-chips-china", "fonte_id": "the_verge", "data_pub": "2026-11-15T19:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Congressistas dos Estados Unidos estão considerando restringir ainda mais as exportações de chips de inteligência artificial após um escândalo envolvendo o ex-CEO da Nvidia, Jensen Huang, e um suposto espião chinês. Ambos os partidos políticos expressaram apoio a medidas que endureceriam as regras de exportação e exigiram que Huang e outros líderes da Nvidia prestem contas perante o Congresso.", "titulo_pt": "Congresso quer endurecer regras de exportação de chips de IA após escândalo com ex-ceo da Nvidia", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 266288, "titulo": "Jensen Huang discusses comeback as Nvidia CEO with allies", "url": "https://www.ft.com/content/45383d86-33c4-4d99-86e5-5e058d3567c1?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-15T19:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tech apoiadores estão pressionando o conselho de administração da Nvidia para reinstalar o ex-CEO Jensen Huang, que renunciou após ser acusado de envolvimento com uma suposta espiã chinesa.", "titulo_pt": "Apoiadores de tecnologia discutem retorno do ex-ceo jensen Huang como CEO da Nvidia com conselho de administração", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 266361, "titulo": "When the Saudi desert was green: A 125,000-year-old lakeside reveals how early humans lived", "url": "https://phys.org/news/2026-11-saudi-green-year-lakeside-reveals.html", "fonte_id": "phys_org", "data_pub": "2026-11-15T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Restos de megafauna, ferramentas de pedra e material vegetal raro foram recuperados de um local litorâneo de 125.000 anos em Uruq al-Julaybah, no sul da Arábia Saudita. Esses achados oferecem uma das visões mais detalhadas da vida pré-histórica na Arábia.", "titulo_pt": "Quando o deserto saudita era verde: um local litorâneo de 125.000 anos revela como os primeiros humanos viviam", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 266069, "titulo": "Cientistas identificam sinal de rádio raro que se repete a cada oito minutos no espaço", "url": "https://www.cnnbrasil.com.br/ciencia/cientistas-identificam-sinal-de-radio-raro-que-se-repete-a-cada-oito-minutos-no-espaco/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-15T20:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas identificaram um sinal de rádio raro que se repete a cada oito minutos. Para analisar o objeto astronômico, a equipe processou mais de 100 horas de dados no Centro de Pesquisa de Supercomputação Pawsey.", "titulo_pt": "Cientistas identificam sinal de rádio raro que se repete a cada oito minutos no espaço", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 266362, "titulo": "Dark matter–hunting satellite Euclid reveals record number of cosmic 'magnifying glasses'", "url": "https://phys.org/news/2026-11-dark-matterhunting-satellite-euclid-reveals.html", "fonte_id": "phys_org", "data_pub": "2026-11-15T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da UBC descobriram 15.000 novos possíveis lentes gravitacionais fortes, o maior conjunto desses instrumentos cósmicos usados para investigar a matéria escura.", "titulo_pt": "Satélite Euclid revela número recorde de 'lentes cósmicas' para busca de matéria escura", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 266363, "titulo": "The experiments improving our understanding of volcanic tsunamis", "url": "https://phys.org/news/2026-11-volcanic-tsunamis.html", "fonte_id": "phys_org", "data_pub": "2026-11-15T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos em laboratório estão sendo realizados para melhor compreender como erupções vulcânicas podem gerar tsunamis, mas ainda é incerto como bem esses modelos representam a realidade. Tsunamis causados por erupções vulcânicas são mal compreendidos devido à dinâmica complexa envolvendo rochas e cinzas caindo e interagindo com a água do mar.", "titulo_pt": "Experiências melhorando nossa compreensão de tsunamis vulcânicos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 266365, "titulo": "Why your brain sometimes craves sour tastes", "url": "https://www.scientificamerican.com/article/why-your-brain-sometimes-craves-sour-tastes/", "fonte_id": "scientific_american", "data_pub": "2026-11-15T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ciência está descobrindo como o sabor ácido age no cérebro. Adicionar um pouco de suco de limão ou vinagre é uma técnica conhecida há muito tempo pelos cozinheiros para melhorar o sabor dos pratos.", "titulo_pt": "Por que seu cérebro às vezes anseia por sabores ácidos", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 265843, "titulo": "FDA rejects cancer drug invented in China in blow to Beijing’s biotech sector", "url": "https://www.ft.com/content/390948a3-429c-410a-b5fe-54cc5a380b99?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-15T17:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA rejeitou o medicamento contra o câncer Ivonescimab, desenvolvido na China, o que representa um golpe para o setor biotecnológico chinês. O medicamento era considerado um teste para verificar se medicamentos chineses poderiam passar pela regulamentação dos EUA.", "titulo_pt": "FDA rejeita medicamento contra câncer chinês em golpe para setor biotecnológico chinês", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 265959, "titulo": "30 years ago, 'Space Jam' proposed the best way to resolve interplanetary disputes", "url": "https://www.space.com/entertainment/space-movies-shows/30-years-ago-space-jam-proposed-the-best-way-to-resolve-interplanetary-disputes", "fonte_id": "space_com", "data_pub": "2026-11-15T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há 30 anos, o filme 'Space Jam' apresentou uma das melhores formas de resolver disputas interplanetárias. O filme retrata a chegada dos Monstars e da equipe Tune Squad, que se tornaram um exemplo de resolução de conflitos interestelares.", "titulo_pt": "Há 30 anos, 'Space Jam' sugeriu a melhor maneira de resolver disputas interplanetárias", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 265919, "titulo": "Tangled quantum whirlpools caught unraveling in an ultracold gas", "url": "https://phys.org/news/2026-11-tangled-quantum-whirlpools-caught-unraveling.html", "fonte_id": "phys_org", "data_pub": "2026-11-15T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quando uma nuvem de átomos é resfriada próximo ao zero absoluto, pode se tornar um condensado de Bose-Einstein (BEC), onde todos os átomos compartilham um único estado quântico. Atualmente, teorias sugerem que à medida que um gás quântico desordenado se organiza nesse estado ordenado, uma trela de vórtices microscópicos deve se formar e gradualmente se desfazer.", "titulo_pt": "Vórtices quânticos desentrelaçados em um gás ultrarrefrescado", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 265516, "titulo": "Paciente sem metástase após vacina russa: é cedo para cura, diz cientista", "url": "https://www.cnnbrasil.com.br/ciencia/paciente-sem-metastase-apos-vacina-russa-e-cedo-para-cura-diz-cientista/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-15T16:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O primeiro paciente a receber a vacina experimental russa contra o câncer apresentou estabilidade no quadro clínico, mas cientistas alertam que é cedo para afirmar a eficácia do tratamento.", "titulo_pt": "Paciente sem metástase após vacina russa: é cedo para cura, diz cientista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 265960, "titulo": "On this day in space! Nov. 15, 1988: The 300-foot Green Bank Telescope collapses suddenly, leaving a huge pile of wreckage in West Virginia", "url": "https://www.space.com/space-exploration/on-this-day-in-space-november-15-2026", "fonte_id": "space_com", "data_pub": "2026-11-15T15:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 15 de novembro de 1988, um telescópio radioelétrico de 300 pés em Green Bank, West Virginia, caiu repentinamente, deixando um grande monte de escombros no local. Este evento foi significativo devido à perda do equipamento valioso e aos impactos na pesquisa científica.", "titulo_pt": "15 De novembro de 1988: o telescópio radioelétrico de 300 pés em Green Bank, West Virginia, colapsa repentinamente", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 265920, "titulo": "Climate response: Why previous warming makes all the difference", "url": "https://phys.org/news/2026-11-climate-response-previous-difference.html", "fonte_id": "phys_org", "data_pub": "2026-11-15T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A temperatura global pode continuar aumentando mesmo após a parada das emissões de CO₂ humanas. O estudo, liderado pelo Met Office Hadley Center e com co-autores da Universidade de Liverpool, mostrou que a resposta térmica depende do quão quente já está ficando a Terra.", "titulo_pt": "Resposta climática: por que o aquecimento anterior faz toda a diferença", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 265936, "titulo": "STAT+: FDA rejects lung cancer treatment ivonescimab from Summit Therapeutics", "url": "https://www.statnews.com/2026/11/15/fda-rejects-ivonescimab-lung-cancer-treatment-summit-therapeutics/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-15T15:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA rejeitou ivonescimab, um tratamento para um tipo de câncer de pulmão desenvolvido pela biotecnológica Summit Therapeutics, dos Estados Unidos, e pela farmacêutica chinesa Akeso.", "titulo_pt": "FDA rejeita tratamento para câncer de pulmão ivonescimab de Summit Therapeutics e akeso", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 265396, "titulo": "O tempo realmente existe ou é uma ilusão persistente?", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/o-tempo-realmente-existe-ou-e-uma-ilusao-persistente.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-15T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto descreve uma situação hipotética onde uma pessoa está em um trem em movimento constante, sem perceber a velocidade, e a iluminação dentro do vagão é uniforme, ilustrando conceitos relacionados ao tempo e à percepção de movimento.", "titulo_pt": "O tempo realmente existe ou é uma ilusão persistente?", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 265921, "titulo": "Giant, prehistoric rodent fossils discovered in southern Thailand", "url": "https://phys.org/news/2026-11-giant-prehistoric-rodent-fossils-southern.html", "fonte_id": "phys_org", "data_pub": "2026-11-15T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time internacional de paleontólogos, incluindo pesquisadores da McGill University, descobriu fósseis de roedores gigantes em uma mina no sul da Tailândia. O achado, publicado em Scientific Reports, sugere que a evolução de roedores gigantes tem uma história mais antiga e mais ampla geograficamente do que se sabia anteriormente.", "titulo_pt": "Fósseis de roedores gigantes descobertos na tailândia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 265961, "titulo": "Why hasn't the 'Blaze Star' exploded yet? Astronomers weigh in on what to expect", "url": "https://www.space.com/stargazing/why-hasnt-the-blaze-star-exploded-yet-astronomers-weigh-in-on-what-to-expect", "fonte_id": "space_com", "data_pub": "2026-11-15T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A estrela 'Blaze Star' (T CrB) irá erupcionar em breve. Astrônomos são muito confiantes sobre essa previsão.", "titulo_pt": "Por que a 'estrela de chama' ainda não explodiu? Astrônomos se pronunciam sobre o que esperar", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 265375, "titulo": "Após perder corrida dos transgênicos, Embrapa quer competir na edição gênica", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/11/apos-perder-corrida-dos-transgenicos-embrapa-quer-competir-na-edicao-genica.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-15T14:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Embrapa perdeu o desenvolvimento dos transgênicos recentemente devido aos altos custos e à concorrência das multinacionais, o que resultou em uma concentração do mercado. Com novas tecnologias, a empresa busca retomar seu papel relevante na cadeia da soja.", "titulo_pt": "Embrapa quer competir na edição gênica após perder corrida dos transgênicos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 265868, "titulo": "Takuya Kimura thanks Taiwan for disaster support", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/16/2003867819", "fonte_id": "taipei_times", "data_pub": "2026-11-16T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Takuya Kimura agradeceu Taiwan pela assistência durante desastres naturais.", "titulo_pt": "Takuya Kimura agradece Taiwan por apoio em desastres", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 265869, "titulo": "NTU honors alumni, awards honorary degrees", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/16/2003867820", "fonte_id": "taipei_times", "data_pub": "2026-11-16T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Universidade Nacional de Taiwan (NTU) premiou ex-alunos e concedeu graus honoris causa a alguns deles. A cerimônia reconheceu o trabalho e as contribuições desses ex-alunos.", "titulo_pt": "NTU homenageia ex-alunos e concede graus honoris causa", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 265875, "titulo": "Divine generals", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/16/2003867827", "fonte_id": "taipei_times", "data_pub": "2026-11-16T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto não fornece nenhum trecho específico para resumir. Por favor, forneça um trecho do artigo para que eu possa resumir adequadamente.", "titulo_pt": "Divinos generais", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 266378, "titulo": "Bob Dylan Meets the Pope on SNL", "url": "https://consequence.net/2026/11/bob-dylan-the-pope-snl/", "fonte_id": "consequence_sound", "data_pub": "2026-11-15T21:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em um sketch do Saturday Night Live, James Austion Johnson imitou Bob Dylan, e John  Paek e Zeca Camargo destacam vantagens e limites da gastronomia na era das redes sociais", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/restaurantes/2026/11/alex-atala-arthur-paek-e-zeca-camargo-destacam-vantagens-e-limites-da-gastronomia-na-era-das-redes-sociais.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-15T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alex Atala destacou a importância do alimento em si, acima da aparência e do sabor, na era das redes sociais. Durante uma palestra no Folha Gourmet Festival, ele refletiu sobre como a mídia social influencia a gastronomia.", "titulo_pt": "Alex Atala, Arthur Paek e Zeca Camargo destacam vantagens e limites da gastronomia na era das redes sociais", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 266376, "titulo": "Watch Phoebe Bridgers Play “Bobby” and “Still Standing” on Saturday Night Live", "url": "https://pitchfork.com/story/watch-phoebe-bridgers-play-bobby-and-still-standing-on-saturday-night-live/", "fonte_id": "pitchfork", "data_pub": "2026-11-15T20:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Phoebe Bridgers apareceu pela terceira vez no Saturday Night Live para promover seu álbum 'Lost Weekend'. Ela tocou os singles 'Bobby' e 'Still Standing'.", "titulo_pt": "Veja Phoebe Bridgers tocar 'Bobby' e 'Still Standing' no Saturday Night Live", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 266371, "titulo": "Ben Affleck Raved About Robert Pattinson’s ‘The Odyssey’ Performance, Recalls Matt Damon: He Said ‘It Was Like Watching a Guy Run Into an Avalanche’", "url": "https://variety.com/2026/film/news/ben-affleck-robert-pattinson-the-odyssey-1236948199/", "fonte_id": "variety", "data_pub": "2026-11-15T20:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Robert Pattinson desempenhou um papel antagonista em 'The Odyssey', dirig endo oferecidas para venda no mercado negro. A universidade confirmou à South China Morning Post que os dados publicados incluíam nomes, números de cartão de identidade de Hong Kong, números de telefone, endereços e médias de pontos de graduação (GPAs) de estudantes da HKMU.", "titulo_pt": "Aproximadamente 5.000 pessoas ligadas à HKMU podem ter seus dados pessoais expostos em vazamento cibernético", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 265409, "titulo": "Com mais mulheres sem véu, regime do Irã mira em boicote", "url": "https://www.cartacapital.com.br/mundo/com-mais-mulheres-sem-veu-regime-do-ira-mira-em-boicote/", "fonte_id": "cartacapital", "data_pub": "2026-11-15T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O movimento de mulheres iranianas que se opõem ao uso obrigatório do hijab está causando reações das autoridades e grupos conservadores do país. O regime iraniano está monitorando a situação, com sinais de que pode haver uma tentativa de boicote ao uso do véu.", "titulo_pt": "Com mais mulheres sem véu, regime do Irã enfrenta reação de autoridades", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 265820, "titulo": "Flames engulf Syrian refugee camp in eastern Lebanon", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/15/flames-engulf-syrian-refugee-camp-in-eastern-lebanon?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-15T14:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio destruiu uma acampamento de refugiados sírios em Bar Elias, leste do Líbano.", "titulo_pt": "Fogo destrói acampamento de refugiados sírios no leste do líbano", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 265663, "titulo": "Gender-diverse Australian sailors barred from US submarines despite Aukus deal, documents reveal", "url": "https://www.theguardian.com/australia-news/2026/nov/16/gender-diverse-australian-sailors-barred-from-us-submarines-despite-aukus-deal-documents-reveal-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-11-15T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Documentos revelam que a Marinha Austrílica está impedida de treinar marinheiros transgender e não-binários em submarinos nucleares devido a diretrizes dos EUA, mesmo com o acordo Aukus. Isso ocorre porque os EUA proíbem pessoas transgêneros no serviço militar e os australianos não podem participar dos treinamentos norte-americanos devido a essa proibição.", "titulo_pt": "Marinheiros australianos transgêneros impedidos de treinar em submarinos nucleares dos EUA, apesar do acordo Aukus", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 265571, "titulo": "Com mais mulheres sem véu, regime do Irã mira em boicote a quem rejeita o hijab", "url": "https://www.dw.com/pt-br/com-mais-mulheres-sem-véu-regime-do-irã-mira-em-boicote-a-quem-rejeita-o-hijab/a-79935780?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-15T10:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "À medida que mais mulheres no Irã rejeitam o uso do hijab, autoridades e grupos conservadores estão mudando sua abordagem, passando a focar na pressão social em locais de trabalho, serviços públicos e empresas em vez de depender da 'polícia moral'.", "titulo_pt": "Com mais mulheres sem véu, regime do Irã mira em boicote a quem rejeita o hijab", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 265277, "titulo": "Malaysian plan to let refugees work spurs advocates’ call for safeguards", "url": "https://www.scmp.com/week-asia/economics/article/3374464/malaysian-plan-let-refugees-work-spurs-advocates-call-safeguards", "fonte_id": "scmp", "data_pub": "2026-11-15T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Malásia planeja permitir que refugiados trabalhem legalmente, o que aumentou as esperanças da comu const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}
