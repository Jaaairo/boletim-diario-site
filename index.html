aíses patrocinadores de terrorismo, incluindo a recepção do novo presidente da Síria, Ahmed al-Sharaa, ex-militante do al-Qaeda. No entanto, essa mudança veio acompanhada de outros desenvolvimentos geopolíticos. O Supremo Tribunal dos EUA permitiu que o presidente Trump implementasse restrições a votos por correspondência, uma medida que beneficiou os republicanos. Além disso, as relações comerciais entre os EUA e o Canadá enfrentaram novos desafios, com Trump anunciando tarifas de 50% sobre veículos e aço canadenses a partir de 2027, um passo que pode afetar significativamente a economia bilateral. O Canadá rejeitou uma solicitação dos EUA, marcando um ponto de tensão na relação entre os dois países. Por outro lado, a Noruega planeja expandir a perfuração no Ártico, enquanto a União Europeia revisa sua posição em relação a novas atividades de perfuração na região. No cenário político, o Reino Unido e a Ucrânia firmaram um acordo para usar dados de campo ucraniano para treinar IA que proteja instalações sensíveis no Reino Unido, uma iniciativa que visa prevenir ataques de protestantes e estados hostis.\n\nA geopolítica global enfrenta uma série de desafios e tensões em diversos cenários. As sanções econômicas contra o Irã, lideradas pelos Estados Unidos, continuam a ampliar seu alcance. O secretário do Tesouro dos EUA, Scott Bessent, anunciou que as sanções serão aplicadas em múltiplos setores, incluindo ativos digitais, aviação e navegação, enquanto a Casa Branca promete uma 'guerra econômica global' contra o Irã. Essas sanções afetaram significativamente o setor de aviação iraniano, aumentando os preços do petróleo e pressionando os mercados globais. Paralelamente, a China intensificou sua presença marítima nas águas próximas à Taiwan, reforçando sua posição geopolítica na região. Em outro front, o conflito na Ucrânia continua com ataques de drones que resultaram em mortes, enquanto a Coreia do Norte permanece sob pressão, com a possibilidade de um encontro entre Trump e Kim Jong Un. A geopolítica regional também está em jogo, com o Irã e a Arábia Saudita intensificando suas atividades militares no Mar Vermelho, enquanto Israel intensifica seus ataques em Gaza. A China e o Jordânia pediram a reabertura do Estreito de Ormuz, buscando uma solução pacífica para a tensão entre EUA e Irã. Estes eventos refletem a complexidade e a interconectividade da geopolítica global atual, com diversos atores buscando influenciar o cenário internacional através de diferentes meios.", "economia": "A Braskem protocolou um pedido de recuperação extrajudicial de dívidas no valor de R$ 56,5 bilhões, obtendo o aval de credores que representam 39,6% dos créditos. A empresa busca aderência de mais de 50% dos credores. Após a divulgação do acordo, as ações da empresa caíram mais de 4%. Segundo especialistas, a recuperação extrajudicial é considerada uma solução temporária que não resolve a origem da crise. A maioria dos credores da Braskem são bancos estrangeiros. O Brasil aumentou suas exportações agrícolas para US$ 169 bilhões, um crescimento de 68% em cinco anos. Em contraste, os Estados Unidos registraram um crescimento mais lento, com exportações de US$ 171 bilhões, 14% acima do valor de cinco anos atrás. O governo dos EUA investiu mais R$ 1,2 bilhão na compra de uma mineradora brasileira de terras raras, a Serra Verde, e a transação deve ser concluída na semana seguinte. A Shein, uma empresa de moda online, planeja realizar uma oferta pública inicial de ações (IPO) em 1º de setembro na Bolsa de Hong Kong e espera arrecadar US$ 1,7 bilhão. Além disso, a Unicharm, multinacional japonesa, registrou um crescimento de 4,9% no faturamento global no primeiro semestre de 2026, priorizando a expansão nas regiões Norte e Nordeste do Brasil.", "tecnologia": "O setor de tecnologia enfrenta diversos desafios e oportunidades, com destaque para a investigação do fundo de investimento de inteligência artificial (AI) que passou rapidamente de destaque para ser alvo de convocações federais. A corrida por infraestrutura de AI está se intensificando, com a necessidade de financiamento para hardware e capacidade de data center em escala. A demanda por energia gerada por AI também está sendo atentamente considerada, com a Taipower planejando maneiras de lidar com essa crescente demanda. Em Taiwan, a AIDC espera um aumento na segunda metade de 2026, graças à clarificação da política de drones e à expansão de serviços tecnológicos, incluindo satélites espaciais e peças estruturais. No mercado de ações de Seul, as perdas no setor tecnológico levaram a uma queda de 2,4% nas ações, refletindo a volatilidade do setor. As empresas chinesas de tecnologia e farmacêuticas estão utilizando Hong Kong como plataforma para expandir globalmente, enquanto o investimento empresarial nos Estados Unidos está crescendo mais de três vezes mais rápido do que na Europa desde a pandemia, destacando a disparidade na adoção da inteligência artificial entre as duas economias.", "ciencia": "Cientistas argentinos criaram um índice que pode prever complicações graves de uma doença que afeta 30% da população adulta, a partir de um exame de sangue, permitindo o personalize dos tratamentos. Em outro avanço, pesquisadores da Coreia do Sul estão planejando desenvolver um satélite de geração próxima para observação ambiental e oceânica. Além disso, a NASA capturou uma imagem da silhueta de Phobos, uma das duas luas de Marte, passando diante do Sol, durante o 1.948º dia de missão marciano do rover Perseverance. Na Terra, a NASA está utilizando 10 sensores do Multi-Angular Imager for Aerosols (MAIA) para mapear a poluição do ar em Addis Ababa, Etiópia, proporcionando uma das visões mais detalhadas da poluição atmosférica da cidade ao longo de três anos.", "cultura": "O documentário do Brasil de Fato sobre Fidel Castro e a resistência de Cuba, que será exibido na Universidade Federal do Paraná (UFPR), destaca a importância do líder cubano e de seu legado na luta contra a ditadura. Em outro destaque, a cantora Olivia Rodrigo lançou a música 'Serena Joy', inspirada em 'O Conto da Aia' de Margaret Atwood, durante um show para fãs. A Academia Brasileira de Cinema anunciou 15 longas-metragens aptos a concorrerem ao Oscar de Melhor Filme Internacional, incluindo 'Feito Pipa' e o filme sobre Amyr Klink. A série 'Harry Potter' trocou de ator para o personagem Gilderoy Lockhart, com Kit Harington substituindo Nicholas Hoult. A influenciadora Blogueirinha terá um quadro no reality 'Estrelas da Casa' chamado 'Fora do Tom', onde testará sua sintonia com os cantores. A banda Westside Cowboy, de Manchester, está progredindo rapidamente, mas segue seu próprio ritmo, rejeitando o aconselhamento de Simon Le Bon, vocalista da Duran Duran. Além disso, a primeira-ministra da Dinamarca, Mette Frederiksen, rejeitou um convite de um cirurgião plástico para melhorar sua aparência, aconselhando mulheres em situações semelhantes a aceitarem-se como são. O Festival Green Man em Bannau Brycheiniog, Gales, manteve sua tradição do fogo, mesmo com condições climáticas adversas, graças às performances energéticas de artistas como Four Tet, Tamikrest e Westside Cowboy.", "sociedade": "Um terceiro suspeito foi detido em relação a um caso em Rancagua, onde uma vítima foi ferida com uma facada ao tentar ajudar um amigo. O incidente suscita preocupações sobre a segurança nas escolas e a necessidade de medidas de proteção. Em outro episódio, Cláudio Rafael Landeiro Moreira, um ciclista, foi espancado até a morte em Copacabana, com 63 golpes constatados pelo laudo pericial, refletindo a violência urbana.", "meio_ambiente": "A Austrália enfrenta uma crise com apenas 12.000 lobos-marinhos restantes, ameaçados pela gripe aviária H5N1. No Brasil, o clima segue frio, mas há expectativa de chuvas no final do mês. Na Suécia, Greta Thunberg participou de uma marcha com 10.000 pessoas exigindo ações mais drásticas contra o aquecimento global. Em outros países, como Indonésia, Nova Zelândia e Guiné, também há desafios ambientais, incluindo poluição de fuligem, proibição de redes sociais para menores e deslizamentos de terra em aterros sanitários.", "direitos_humanos": "A administração Trump pretende revogar cerca de 200.000 vistos de turismo e negócios de pessoas que buscam asilo nos Estados Unidos, uma medida que provavelmente enfrentará desafios legais. Ao mesmo tempo, a comunidade internacional ainda não abordou a causa fundamental dos problemas enfrentados pelos rohingya no Myanmar, conforme relatado em um artigo do The Diplomat. Na Faixa de Gaza, hospitais enfrentam graves dificuldades devido à destruição causada por conflitos, com pacientes em risco por falta de equipamentos médicos e máquinas de diagnóstico. Em Hong Kong, a polícia deteve uma mulher por supostamente usar uma camiseta com mensagem seditiva fora do Fórum Judicial de Baixo Kowloon. Além disso, a Amnesty International relatou que forças de segurança indianas usaram gás lacrimogênico, armas de projéteis de gás e dispositivos de choque elétrico contra protestos de estudantes em Nova Deli, Índia. Por fim, autoridades russas informaram a morte de duas crianças e ferimentos em sete outras em um centro infantil privado na região de Krasnodar, após ataques ucranianos com um restante de aeronave não tripulada."}, "resumo_do_dia": {"politica_nacional": [{"id": 121146, "titulo": "Ministro da Fazenda confirma projeção de salário mínimo em R$ 1.741 para 2027", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/ministro-da-fazenda-confirma-projecao-de-salario-minimo-em-r-1741-para-2027.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T00:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Dario Durigan confirmou que o salário mínimo será de R$ 1.741 em 2027, conforme as projeções que serão enviadas ao Congresso no PLOA do próximo ano.", "titulo_pt": "Ministro confirma salário mínimo de R$ 1.741 em 2027", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 121095, "titulo": "Eleições 2026: saiba como foi o dia do candidato Eduardo Braide ao governo do Maranhão", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/24/eleicoes-2026-saiba-como-foi-o-dia-do-candidato-eduardo-braide-ao-governo-do-maranhao.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-24T23:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos ao governo do Maranhão, incluindo Eduardo Braide, realizaram agendas de campanha na segunda-feira (24), apresentando propostas relacionadas à agricultura e agronegócio. A TV Mirante documentou essas atividades.", "titulo_pt": "Saiba como foi o dia de campanha do candidato Eduardo Braide ao governo do Maranhão", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 121301, "titulo": "Quaest: Lira tem 20%, Renan 18% e Marina JHC 15% para o Senado em AL", "url": "https://www.metropoles.com/brasil/quaest-lira-tem-20-renan-18-e-marina-jhc-15-para-o-senado-em-al", "fonte_id": "metropoles", "data_pub": "2026-08-24T23:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Arthur Lira, Renan Calheiros e Marina JHC têm 20%, 18% e 15% das intenções de voto para o Senado em Alagoas, respectivamente. Estão tecnicamente empatados dentro da margem de erro de 3 pontos percentuais.", "titulo_pt": "Lira, Renan e Marina JHC empatados tecnicamente para o Senado em alagoas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 121096, "titulo": "Quaest em SC: Flávio Bolsonaro, 45%; Lula, 20%", "url": "https://g1.globo.com/sc/santa-catarina/eleicoes/2026/noticia/2026/08/24/quaest-santa-catarina-presidente-24-agosto.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-24T23:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest, divulgada em 24 de [mês], indica que Flávio Bolsonaro lidera com 45% das intenções de voto no 1º turno da eleição presidencial em Santa Catarina, seguido por Lula com 20%. A pesquisa incluiu o candidato Pablo Marçal, apesar da sua inelegibilidade, que foi julgada pelo Tribunal Superior Eleitoral (TSE).", "titulo_pt": "Flávio Bolsonaro e Lula lideram intenções de voto no 1º turno em santa catarina", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 121125, "titulo": "Quaest: Renan Filho tem 42% contra 40% de JHC em Alagoas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/quaest-renan-filho-tem-42-contra-40-de-jhc-em-alagoas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-24T23:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Quaest divulgada em 24 de agosto indica que Renan Filho (MDB) e João Henrique Caldas (PSDB), conhecido como JHC, estão em empate técnico na corrida pelo governo de Alagoas.", "titulo_pt": "Renan Filho e JHC em empate técnico na corrida pelo governo de Alagoas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 121089, "titulo": "Veja como foi a segunda-feira (24) dos candidatos a presidente", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/veja-como-foi-segunda-feira-24-dos-candidatos-presidente", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-24T23:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nesta segunda-feira (24), os candidatos à Presidência da República realizaram entrevistas, sabatinas e atividades de preparação para a campanha. Flávio Bolsonaro cumpriu uma agenda em São Paulo, enquanto Edmilson Costa participou de uma entrevista para o Monitor Mercantil.", "titulo_pt": "Veja como foi a segunda-feira (24) dos candidatos a presidente", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 121090, "titulo": "SBPC convida candidatos a governador a se comprometerem com a ciência", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/sbpc-convida-candidatos-governador-se-comprometerem-com-ciencia", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-24T23:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Sociedade Brasileira para o Progresso da Ciência (SBPC) convidou candidatos a governador a se comprometerem com a Ciência, Tecnologia e Inovação (CT&I) nas eleições de 2026. A iniciativa faz parte do Observatório das Eleições 2026, que visa orientar o debate sobre o desenvolvimento dos estados com propostas da comunidade científica.", "titulo_pt": "SBPC convida candidatos a governador a se comprometerem com a ciência", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 121147, "titulo": "Governo do RJ prepara Lei de Responsabilidade Fiscal e tenta reverter déficit em 2026", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/governo-do-rj-prepara-lei-de-responsabilidade-fiscal-e-tenta-reverter-deficit-em-2026.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-24T23:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo interino do Rio de Janeiro está preparando uma Lei de Responsabilidade Fiscal (LRF) estadual para tentar reverter o déficit previsto para 2026. A proposta será enviada para a Assembleia Legislativa do Estado do Rio de Janeiro (Alerj) em breve.", "titulo_pt": "Governo do RJ prepara Lei de Responsabilidade Fiscal e tenta reverter déficit em 2026", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 121126, "titulo": "Quaest: Luciano Zucco (PL) e Juliana Brizola (PDT) mantêm empate técnico no 1° e 2° turnos no RS", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/quaest-luciano-zucco-pl-e-juliana-brizola-pdt-mantem-empate-tecnico-no-1-e-2-turnos-no-rs.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-24T23:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Luciano Zucco do PL e Juliana Brizola do PDT empatam tecnicamente na disputa pelo governo do Rio Grande do Sul, de acordo com uma pesquisa Quaest divulgada em 24 de agosto de 2026.", "titulo_pt": "Luciano Zucco e Juliana Brizola empatam tecnicamente no pleito pelo governo do rio grande do sul", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 121127, "titulo": "Quaest: Allyson tem 25%, Cadu tem 21% e Álvaro, 19% no Rio Grande do Norte", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/quaest-allyson-tem-25-cadu-tem-21-e-alvaro-19-no-rio-grande-do-norte.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-24T23:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Allyson Bezerra lidera com 25% das intenções de voto, seguido por Cadu de Lula com 21% e Álvaro com 19% na corrida pelo governo do Rio Grande do Norte, segundo uma pesquisa Quaest divulgada na segunda-feira (24).", "titulo_pt": "Allyson tem 25%, Cadu tem 21% e Álvaro, 19% no Rio Grande do Norte", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 121128, "titulo": "'Vocês vão parar no tempo?', diz Flávio Bolsonaro ao ser questionado sobre 'Dark Horse'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/voces-vao-parar-no-tempo-diz-flavio-bolsonaro-ao-ser-questionado-sobre-dark-horse.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-24T23:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro, candidato à Presidência, afirmou que a prestação de contas do filme 'Dark Horse' já foi apresentada. Ele acusa o presidente Lula de dever explicações.", "titulo_pt": "‘Vocês vão parar no tempo?’, diz Flávio Bolsonaro sobre 'Dark Horse'", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 121345, "titulo": "Governo propõe salário mínimo de R$ 1.741 em 2027", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/governo-propoe-salario-minimo-de-r-1-741/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-24T23:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo propôs um salário mínimo de R$ 1.741 para 2027, que será incluído no Projeto de Lei Orçamentária para o próximo ano, a ser enviado ao Congresso Nacional até 31 de agosto.", "titulo_pt": "Governo propõe salário mínimo de R$ 1.741 em 2027", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 121129, "titulo": "Quaest: Eduardo Braide lidera disputa no MA com 44%; Orleans Brandão tem 25%", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/quaest-eduardo-braide-lidera-disputa-no-ma-com-44-orleans-brandao-tem-25.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-24T22:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eduardo Braide, ex-prefeito de São Luís, lidera as intenções de voto para o governo do Maranhão com 44% das intenções de votos, de acordo com um levantamento divulgado pela Quaest. Orleans Brandão tem 25% dos votos.", "titulo_pt": "Eduardo Braide lidera disputa pelo governo do maranhão com 44%; Orleans Brandão tem 25%", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 121150, "titulo": "Governo Lula tenta expandir contratação de MEIs por ministérios e estatais perto da eleição", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/governo-lula-tenta-expandir-contratacao-de-meis-por-ministerios-e-estatais-perto-da-eleicao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-24T22:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula anunciou a expansão dos órgãos públicos que deverão contratar serviços de MEIs no programa Contrata+ Brasil. A medida foi anunciada pouco antes do primeiro turno das eleições presidenciais, com o objetivo de melhorar a popularidade do presidente entre empreendedores.", "titulo_pt": "Governo Lula expande contratação de MEIs por ministérios e estatais perto da eleição", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 121130, "titulo": "Quaest: Jorginho (PL) lidera pesquisa ao Governo de SC com 50% das intenções de voto", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/quaest-jorginho-pl-lidera-pesquisa-ao-governo-de-sc-com-50-das-intencoes-de-voto.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-24T22:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O atual governador de Santa Catarina, Jorginho Mello (PL), lidera as pesquisas para as eleições de outubro, com 50% das intenções de voto, de acordo com uma pesquisa da Quaest divulgada na segunda-feira (24).", "titulo_pt": "Jorginho (PL) lidera pesquisa para Governo de santa catarina com 50% das intenções de voto", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 121131, "titulo": "Quaest: Moro lidera no PR com 37%, seguido por Requião Filho (21%) e Sandro Alex (15%)", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/quaest-moro-lidera-no-pr-com-37-seguido-por-requiao-filho-21-e-sandro-alex-15.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-24T22:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sergio Moro lidera as intenções de voto para o Governo do Paraná com 37% das preferências, seguido por Requião Filho com 21% e Sandro Alex com 15%. A pesquisa foi divulgada pela Quaest.", "titulo_pt": "Moro lidera no PR com 37%, seguido por Requião Filho (21%) e Sandro Alex (15%)", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 121562, "titulo": "Cancillería enviará nota de protesta a Argentina por dichos de alto mando militar sobre el Estrecho de Magallanes", "url": "https://www.latercera.com/politica/noticia/cancilleria-enviara-nota-de-protesta-a-argentina-por-dichos-sobre-el-estrecho-de-magallanes/", "fonte_id": "la_tercera", "data_pub": "2026-08-25T00:18:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Cancilleria decidiu enviar uma nota de protesto à Argentina após declarações de um alto oficial militar que questionaram a soberania chilena sobre o Estrecho de Magallanes. Francisco Pérez Mackenna reafirmou que o local é 'indiscutivelmente chileno'.", "titulo_pt": "Cancilleria enviará nota de protesto à Argentina sobre declarações sobre o Estrecho de Magallanes", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 121627, "titulo": "US removes Syria from list of state sponsors of terrorism", "url": "https://www.bbc.co.uk/news/articles/c33knmyl0y5o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-25T00:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Trump aceitou o novo presidente da Síria, Ahmed al-Sharaa, ex-militante do al-Qaeda. A Síria foi removida da lista de países patrocinadores de terrorismo pelos Estados Unidos.", "titulo_pt": "EUA retira síria da lista de patrocinadores de terrorismo", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 121628, "titulo": "Moment tornado tears through southern France", "url": "https://www.bbc.co.uk/news/videos/ckg8wkd0j7do?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-25T00:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tornado causou mais de 40 feridos e destruiu casas em vilas da região sul da França.", "titulo_pt": "Tornado causa ferimentos e destruição em vilas da França", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 121728, "titulo": "Borsa: Tokyo, apertura in calo (-0,62%)", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/25/borsa-tokyo-apertura-in-calo-062_8de0e9f2-bb98-4d1f-899b-a9a8e6913900.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-25T00:13:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A bolsa de valores de Tóquio abriu em baixa (-0,62%). Aguarda-se o relatório trimestral da Nvidia e os dados sobre inflação nos Estados Unidos.", "titulo_pt": "Bolsa: tóquio, abertura em baixa (-0,62%)", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 121530, "titulo": "U.S. Tariffs Could Price Canadian Firms Out of U.S. and Threaten Thousands of Jobs", "url": "https://www.nytimes.com/2026/08/24/world/canada/us-tariffs-trade-economy.html", "fonte_id": "nyt_world", "data_pub": "2026-08-25T00:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As tarifas de 50% impostas pelo presidente Trump aos produtos canadenses exportados para os Estados Unidos tornarão difícil para muitas empresas canadenses continuarem a vender para o mercado americano, according to economists.", "titulo_pt": "Tarifas dos EUA poderiam expulsar empresas canadenses do mercado americano e ameaçar empregos", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 121653, "titulo": "US Supreme Court delivers Trump a temporary win on mail-in voting", "url": "https://www.lemonde.fr/en/international/article/2026/08/25/us-supreme-court-delivers-trump-a-temporary-win-on-mail-in-voting_6756815_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-25T00:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente republicano assinou um decreto em março para limitar o voto por correspondência antes das eleições intercalares de novembro. O Supremo Tribunal dos Estados Unidos suspendeu uma decisão de um tribunal district que havia bloqueado a implementação do decreto, permitindo que partes do direcionamento de Trump sejam implementadas temporariamente.", "titulo_pt": "Supremo dos EUA concede vitória temporária a Trump sobre votação por correspondência", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 121546, "titulo": "Australia news live: Coles blames competitor’s Ooshies for slowing sales; young people the first generation to earn less than their parents at same age", "url": "https://www.theguardian.com/australia-news/live/2026/aug/25/australia-news-live-sydney-trains-delays-cancellations-albanese-gst-wa-one-nation-coalition-secret-harbour-election-tax-reform-royal-commission-antisemitism-icac-victorian-rail-loop-alan-jones-trial-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-08-25T00:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A rede de supermercados Coles atribuiu o declínio do crescimento às campanhas de colecionáveis de seus concorrentes. Além disso, um relatório destaca que a geração jovem é a primeira a ganhar menos do que seus pais no mesmo estágio da vida.", "titulo_pt": "Notícias da austrália: coles culpa campanha de colecionáveis de concorrentes por reduzir vendas; jovens são a primeira geração a ganhar menos do que os pais na mesma idade", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 121729, "titulo": "Il Nevada fa causa a Trump per il piano sul fiume Colorado", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/25/il-nevada-fa-causa-a-trump-per-il-piano-sul-fiume-colorado_172d3cc4-bd3d-4628-bf21-bae0fce9fe73.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-25T00:02:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O Nevada está pressionando Trump para que ele avance com o plano sobre o Rio Colorado, o qual pode afetar o consumo hídrico de Las Vegas, que depende de 90% das águas do rio.", "titulo_pt": "Nevada pressiona Trump pelo plano sobre o rio Colorado", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 121451, "titulo": "Estados Unidos retoma los ataques contra supuestas narcolanchas y mata a dos personas", "url": "https://elpais.com/america/2026-08-24/estados-unidos-retoma-los-ataques-contra-supuestas-narcolanchas-y-mata-a-dos-personas.html", "fonte_id": "elpais_america", "data_pub": "2026-08-24T23:36:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos realizaram um ataque a uma embarcação no Pacífico oriental, o primeiro relatado em mais de dois meses. Duas pessoas foram mortas no incidente.", "titulo_pt": "EUA retomam ataques contra supostas narcolanchas e matam duas pessoas", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 121630, "titulo": "Caste divides make scorching summers harder in a parched corner of India", "url": "https://www.bbc.co.uk/news/articles/cyvlzp2zn67o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-24T23:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A elevação da temperatura e a escassez de água estão aprofundando as desigualdades de casta antigos na região de Bundelkhand, segundo ativistas.", "titulo_pt": "Caste divides aprofundam nas dificuldades de verões escaldantes em região escassa de água na Índia", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 121119, "titulo": "Governo Trump planeja revogar vistos de solicitantes de asilo", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/08/governo-trump-planeja-revogar-vistos-de-solicitantes-de-asilo.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-24T23:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo de Donald Trump planeja revogar os vistos de estrangeiros que solicitaram asilo ou estão buscando esse status nos Estados Unidos. Esta medida faz parte de uma ampla repressão à imigração implementada pelo governo.", "titulo_pt": "Governo Trump planeja revogar vistos de solicitantes de asilo", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 121726, "titulo": "U.S. widens sanctions on Iran but withholds more punishing options", "url": "https://www.japantimes.co.jp/news/2026/08/25/world/politics/us-sanctions-iran-bessent/", "fonte_id": "japan_times", "data_pub": "2026-08-24T23:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário do Tesouro dos EUA, Scott Bessent, afirmou que outros países precisarão interromper suas relações comerciais com a Irã ou correr o risco de serem excluídos do sistema financeiro baseado em dólar. As sanções americanas foram ampliadas, mas medidas mais severas foram rejeitadas.", "titulo_pt": "EUA amplia sanções contra Irã, mas não adota opções mais rigorosas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 121639, "titulo": "Trump administration to revoke visas of foreigners seeking asylum in US, officials say", "url": "https://www.france24.com/en/americas/20260824-trump-administration-revoke-visas-foreigners-seeking-asylum", "fonte_id": "france24", "data_pub": "2026-08-24T22:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo de Donald Trump anunciou que planeja revogar os vistos não imigrantes de estrangeiros que aplicaram ou estão buscando asilo nos Estados Unidos. Essa medida poderia afetar até 200.000 pessoas e pode se tornar a maior revogação de vistos em massa na história dos Estados Unidos.", "titulo_pt": "Governo trump planeja revogar vistos de estrangeiros buscando asilo nos EUA", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 121683, "titulo": "How US sanctions on Iran ripple through global markets and consumers", "url": "https://www.aljazeera.com/economy/2026/8/24/how-us-sanctions-on-iran-ripple-through-global-markets-and-consumers?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-24T22:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sanções recentes contra o Irã afetaram seus setores de aviação, tecnologia e navegação, aumentando a pressão sobre os mercados globais e os preços da energia.", "titulo_pt": "Como as sanções dos EUA ao Irã impactam os mercados globais e os consumidores", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 121151, "titulo": "Canadá disse não aos Estados Unidos, e as consequências vão muito além de suas fronteiras", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/canada-disse-nao-aos-estados-unidos-e-as-consequencias-vao-muito-alem-de-suas-fronteiras.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-24T22:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No dia 21 de agosto, o Canadá rejeitou uma solicitação dos Estados Unidos, marcando um momento significativo na relação bilateral. Esta recusa pode ter implicações mais amplas do que as fronteiras nacionais dos dois países.", "titulo_pt": "Canadá rejeitou Estados Unidos, e as consequências vão além das fronteiras", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 121725, "titulo": "US Supreme Court allows Trump restrictions on mail-in ballots", "url": "https://www.ft.com/content/b89d51c9-2206-4213-b0d3-8a826262c9d8?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-24T22:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte dos Estados Unidos levantou a decisão que bloqueava o decreto do presidente para restringir a elegibilidade para votos por correspondência, adotando uma nova lista federal de eleitores.", "titulo_pt": "Suprema corte dos EUA permite restrições de Trump a votos por correspondência", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 121427, "titulo": "Braskem protocola pedido de recuperação extrajudicial com dívidas de R$ 56,5 bi; leia íntegra do pedido", "url": "https://www.jota.info/justica/braskem-protocola-pedido-de-recuperacao-extrajudicial-com-dividas-de-r-565-bi-leia-integra-do-pedido", "fonte_id": "jota", "data_pub": "2026-08-24T23:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Braskem protocolou um pedido de recuperação extrajudicial de dívidas no valor de R$ 56,5 bilhões. A companhia obteve o aval de credores que representam 39,6% dos créditos e busca aderência de mais de 50% dos credores para avançar com o processo.", "titulo_pt": "Braskem protocola pedido de recuperação extrajudicial com dívidas de R$ 56,5 bi; leia íntegra do pedido", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 121148, "titulo": "Brasil encosta nos Estados Unidos em exportações do setor de agronegócio", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/vaivem/2026/08/brasil-encosta-nos-estados-unidos-em-exportacoes-do-setor-de-agronegocio.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-24T23:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil aumentou suas exportações agrícolas para US$ 169 bilhões, um crescimento de 68% em cinco anos, enquanto os Estados Unidos registraram um crescimento mais lento, com exportações de US$ 171 bilhões, 14% acima do valor de cinco anos atrás.", "titulo_pt": "Brasil se aproxima dos Estados Unidos em exportações do agronegócio", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 121149, "titulo": "Recuperação extrajudicial da Braskem é 'pedido de socorro', diz especialista", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/recuperacao-extrajudicial-da-braskem-e-pedido-de-socorro-diz-especialista.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-24T22:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas consideram que a recuperação extrajudicial da Braskem é uma solução temporária que não resolve a origem da crise. Eles avaliam que o acordo compra tempo, mas não é a solução definitiva para a maior petroquímica da América Latina.", "titulo_pt": "Recuperação extrajudicial da Braskem é 'pedido de socorro', diz especialista", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 121724, "titulo": "SEC subpoenas Wall Street banks over Situational Awareness", "url": "https://www.ft.com/content/c36d4e57-1ea2-47a5-8f6d-f390369aedc4?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-24T22:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SEC (Comissão de Valores Mobiliários dos Estados Unidos) convocou várias instituições do setor financeiro de Wall Street para prestar esclarecimentos sobre 'Consciência Situacional'. Um fundo de investimento focado em inteligência artificial, gerido por Leopold Aschenbrenner, esteve prestes a colapsar em julho, mas conseguiu um acordo com a Citadel.", "titulo_pt": "SEC convoca bancos de Wall Street sobre consciência situacional", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 121152, "titulo": "Maiores credores da Braskem são estrangeiros", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/maiores-credores-da-braskem-sao-estrangeiros.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-24T21:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A maioria dos credores da recuperação extrajudicial da Braskem, envolvendo um passivo de R$ 56,5 bilhões, são bancos estrangeiros. Apenas 7,6% da dívida são títulos emitidos no Brasil.", "titulo_pt": "Maior parte dos credores da Braskem são bancos estrangeiros", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 121723, "titulo": "First Brands forced into liquidation by bankruptcy court", "url": "https://www.ft.com/content/0ed63607-bf79-41d5-8052-f78eeae99d61?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-24T21:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz federal no Texas declarou que o plano de truste de litígios proposto pela empresa e por seus credores sêniores não era confirmável em nenhuma circunstância. Como resultado, a empresa First Brands foi forçada à liquidação.", "titulo_pt": "First Brands forçada à liquidação pelo tribunal de bancarrota", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 121153, "titulo": "O mundo reduziu o espaço para irresponsabilidades fiscais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/cecilia-machado/2026/08/o-mundo-reduziu-o-espaco-para-irresponsabilidades-fiscais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-24T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os juros reais globais atingiram níveis não vistos há algum tempo. O mundo reduziu o espaço para irresponsabilidades fiscais.", "titulo_pt": "O mundo reduziu o espaço para irresponsabilidades fiscais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 121429, "titulo": "Os desafios do governo Lula nas eleições: endividamento das famílias", "url": "https://www.jota.info/opiniao-e-analise/colunas/democracia-em-transe/os-desafios-do-governo-lula-nas-eleicoes-endividamento-das-familias", "fonte_id": "jota", "data_pub": "2026-08-24T20:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O orçamento doméstico está sendo corroído por uma menor capacidade de compra, juros elevados e crescimento da dívida das famílias. Esses fatores refletem o domínio do neoliberalismo mesmo sob uma gestão de centro-esquerda.", "titulo_pt": "Desafios do governo Lula nas eleições: endividamento das famílias", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 121154, "titulo": "Azul terá 2.500 voos extras para destinos como Maceió e Porto Seguro no verão; veja rotas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/azul-tera-2500-voos-extras-para-destinos-como-maceio-e-porto-seguro-no-verao-veja-rotas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-24T20:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Azul planeja aumentar sua malha aérea com 2.500 voos extras entre dezembro deste ano e fevereiro de 2027, para atender à demanda de férias durante a próxima temporada de verão. Os destinos incluirão Maceió e Porto Seguro.", "titulo_pt": "Azul terá 2.500 voos extras para destinos como Maceió e Porto Seguro no verão", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 121656, "titulo": "Saudi Arabia to invest €6 billion in three theme parks near Paris, one manga-themed", "url": "https://www.lemonde.fr/en/international/article/2026/08/24/saudi-arabia-to-invest-6-billion-in-three-theme-parks-near-paris-one-manga-themed_6756809_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-24T20:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Arábia Saudita planeja investir 6 bilhões de euros em três parques temáticos perto de Paris, incluindo um tema mangá. O acordo foi assinado durante uma visita de dois dias do príncipe herdeiro Mohammed bin Salman à França.", "titulo_pt": "Arábia saudita investirá 6 bilhões em três parques temáticos próximos a Paris, um inspirado em mangá", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 121157, "titulo": "Sheinbaum diz que México avança nas negociações com EUA para reduzir tarifas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/08/01/6556-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466764", "fonte_id": "folha_mercado", "data_pub": "2026-08-24T19:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A presidente do México, Claudia Sheinbaum, anunciou que o país está progredindo em negociações com os Estados Unidos para reduzir tarifas. Ela descartou que as tensões comerciais entre os EUA e o Canadá afetem o México.", "titulo_pt": "Sheinbaum afirma que México avança em negociações com EUA para reduzir tarifas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 121158, "titulo": "O inadiável, mas inalcançável, ajuste fiscal", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/o-inadiavel-mas-inalcancavel-ajuste-fiscal.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-24T18:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em agosto, os candidatos à presidência apresentam planos econômicos ambiciosos, mas raramente abordam as medidas necessárias de ajuste fiscal de forma transparente para não desencorajar o eleitorado. Muitos candidatos prometem um céu de céu com sustentabilidade fiscal e crescimento econômico, sem detalhar as dificuldades reais de implementação.", "titulo_pt": "O inadiável, mas inalcançável, ajuste fiscal", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 121160, "titulo": "Governo destina R$ 4 bi em crédito subsidiado para fertilizantes e minerais críticos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/governo-destina-r-4-bi-em-credito-subsidiado-para-fertilizantes-e-minerais-criticos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-24T18:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo destinou R$ 4 bilhões em crédito subsidiado para fertilizantes e minerais críticos no âmbito da terceira fase do programa Brasil Soberano, em resposta a um tarifaço de 37,5% imposto pelos Estados Unidos em julho.", "titulo_pt": "Governo destina R$ 4 bi em crédito subsidiado para fertilizantes e minerais críticos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 121433, "titulo": "Pagamento de R$ 2,6 bi de União e ex-Eletrobras encerra disputa de 30 anos sobre privatização no Piauí", "url": "https://www.jota.info/stf/do-supremo/pagamento-de-r-26-bi-de-uniao-e-ex-eletrobras-encerra-disputa-de-30-anos-sobre-privatizacao-no-piaui", "fonte_id": "jota", "data_pub": "2026-08-24T18:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O pagamento de R$ 2,6 bilhões pela União e pela ex-Eletrobras encerrou uma disputa de 30 anos sobre a privatização da empresa no estado do Piauí. O acordo foi homologado pelo ministro Luiz Fux, do STF.", "titulo_pt": "Pagamento de R$ 2,6 bi encerra disputa de 30 anos sobre privatização de ex-eletrobras no Piauí", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 121163, "titulo": "Dona da Estácio confirma conversas com a Afya sobre potencial combinação de negócios em educação", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/dona-da-estacio-confirma-conversas-com-a-afya-sobre-potencial-combinacao-de-negocios-em-educacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-24T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Yduqs, proprietária da rede Estácio, está em conversas com a Afya sobre uma possível fusão de suas operações na área de educação. A informação foi divulgada em um fato relevante no dia 24 de agosto de 2026.", "titulo_pt": "Yduqs confirma conversas com Afya sobre combinação de negócios em educação", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 121434, "titulo": "STF valida proibição de devedor contumaz pedir recuperação judicial", "url": "https://www.jota.info/stf/do-supremo/stf-valida-proibicao-de-devedor-contumaz-pedir-recuperacao-judicial", "fonte_id": "jota", "data_pub": "2026-08-24T17:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) validou a proibição de devedores contumazes pedirem recuperação judicial. O ministro relator Flávio Dino afirmou que a restrição é proporcional e serve para proteger o mercado.", "titulo_pt": "STF valida proibição de devedores contumazes pedirem recuperação judicial", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 121793, "titulo": "Situational Awareness, star AI hedge fund that nearly imploded, now being probed by the SEC", "url": "https://techcrunch.com/2026/08/24/situational-awareness-star-ai-hedge-fund-that-nearly-imploded-now-being-probed-by-the-sec/", "fonte_id": "techcrunch", "data_pub": "2026-08-25T00:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O fundo de investimento de IA que foi 'o assunto do Wall Street' agora é 'objeto de convocações federais'. O fundo passou rapidamente de destaque na indústria para ser alvo de investigações federais, como se diversificar o portfólio fosse rápido e fácil.", "titulo_pt": "Consciência situacional, fundo de IA de estrela que quase colapsou, agora sendo investigado pela SEC", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 121811, "titulo": "Broadcom's debt push signals AI compute is becoming Wall Street asset class", "url": "https://www.digitimes.com/news/a20260824VL215/broadcom-infrastructure-silicon-financing-demand.html", "fonte_id": "digitimes", "data_pub": "2026-08-25T00:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A corrida por infraestrutura de inteligência artificial está entrando em uma fase onde a disponibilidade de silício não é mais a única restrição. Com a expansão da demanda computacional para projetos com potência de múltiplos gigawatts, a indústria enfrenta agora um segundo obstáculo: como financiar hardware e capacidade de data center em escala, exigida pelos modelos de desenvolvedores de IA.", "titulo_pt": "Empurrão de dívida da broadcom indica que a computação de IA se torna classe de ativos para Wall Street", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 121812, "titulo": "AIDC eyes 2H26 lift from drones, jets", "url": "https://www.digitimes.com/news/a20260824PD233/aidc-drone-satellite-business-2026-taiwan.html", "fonte_id": "digitimes", "data_pub": "2026-08-25T00:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A AIDC espera um aumento na segunda metade de 2026, graças à clarificação da política de drones da Taiwan e ao trabalho de defesa sólido. A empresa possui encomendas superiores a 10 bilhões de NT$ (aproximadamente 3,1 bilhões de USD) nos próximos cinco anos, abrangendo defesa, aviação civil e serviços tecnológicos, além de expandir para o campo dos satélites espaciais, compostos avançados e peças estruturais.", "titulo_pt": "AIDC visa crescimento na segunda metade de 2026 com drones e aviões", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 121777, "titulo": "Seoul stocks open 2.4 pct lower on tech losses", "url": "https://en.yna.co.kr/view/AEN20260825001700320", "fonte_id": "yonhap_news", "data_pub": "2026-08-25T00:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações de Seul abriram com uma queda de 2,4%, seguindo as perdas noturnas no mercado tecnológico.", "titulo_pt": "Seul: ações abrem com queda de 2,4% seguindo perdas no mercado tecnológico", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 121778, "titulo": "(URGENT) Seoul shares open 2.4 pct lower on tech losses", "url": "https://en.yna.co.kr/view/AEN20260825001600320", "fonte_id": "yonhap_news", "data_pub": "2026-08-25T00:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações de Seul abriram com uma queda de 2,4% devido às perdas no setor tecnológico.", "titulo_pt": "Seul abre com queda de 2,4% devido a perdas no setor tecnológico", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 121763, "titulo": "Taipower planning for AI power demand", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/25/2003863061", "fonte_id": "taipei_times", "data_pub": "2026-08-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Taipower está planejando maneiras de lidar com a demanda de energia gerada por inteligência artificial. O objetivo é garantir a estabilidade do sistema elétrico diante do aumento da utilização de tecnologias de IA.", "titulo_pt": "Taipower planeja para demanda de energia da IA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 121765, "titulo": "Precision healthcare could be Taiwan’s strength", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/25/2003863063", "fonte_id": "taipei_times", "data_pub": "2026-08-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A saúde personalizada ou precisão médica poderia ser uma força para Taiwan. O país tem potencial para se destacar neste campo devido às suas capacidades tecnológicas e de dados.", "titulo_pt": "Saúde personalizada poderia ser força para Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 121780, "titulo": "(LEAD) Hyundai Motor, labor union tentatively reach wage deal", "url": "https://en.yna.co.kr/view/AEN20260825001251320", "fonte_id": "yonhap_news", "data_pub": "2026-08-24T23:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A gestão e a sindicato da Hyundai Motor Co. chegaram a um acordo preliminar sobre salários. O anúncio foi feito em Seul no dia 25 de agosto.", "titulo_pt": "Hyundai Motor e sindicato chegam a acordo preliminar sobre salários", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 121771, "titulo": "Hyundai Motor's union reaches tentative wage deal, averting more strikes", "url": "https://www.koreaherald.com/article/10850740", "fonte_id": "korea_herald", "data_pub": "2026-08-24T23:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A federação sindical da Hyundai Motor no Sul da Coreia chegou a um acordo provisório com a administração, evitando novos cortes produtivos após uma greve completa de uma década. O acordo inclui um aumento salarial básico de 100.000 wones mensais e um bônus de desempenho.", "titulo_pt": "Federação sindical da hyundai no sul da Coreia chega a acordo provisório, evitando greves", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 121662, "titulo": "Supreme Court upholds Trump's order to overhaul mail-in ballots", "url": "https://www.axios.com/2026/08/24/supreme-court-mail-in-ballot-rules", "fonte_id": "axios", "data_pub": "2026-08-24T22:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal permitiu que o presidente Trump implemente um ordem executiva que limita os votos por correspondência, poucos meses antes das eleições de meios-termo. Embora seja um sucesso para o presidente, que tem se oposto à votação por correspondência por anos, a batalha legal ainda não terminou e o impacto nas eleições de novembro permanece incerto.", "titulo_pt": "Supremo mantém ordem de Trump sobre votos por correspondência", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 121782, "titulo": "Trump gov't proposes more than US$103,000 fee on H-1B visas for skilled foreign workers", "url": "https://en.yna.co.kr/view/AEN20260825001100315", "fonte_id": "yonhap_news", "data_pub": "2026-08-24T22:13:00Z", "idioma": "en", "provavel_duplicata_de": 121772, "texto_pt": "O governo dos Estados Unidos propôs uma taxa adicional de mais de 103 mil dólares para vistos H-1B, destinados a trabalhadores qualificados estrangeiros. Essa medida foi anunciada pelo governo de Donald Trump.", "titulo_pt": "Governo trump propõe taxa de mais de 103 mil dólares para vistos H-1B", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 121664, "titulo": "5 ways Iran's economy is wilting under Trump's pressure", "url": "https://www.axios.com/2026/08/24/trump-iran-sanctions-bessent-economy", "fonte_id": "axios", "data_pub": "2026-08-24T21:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Trump está intensificando a pressão econômica sobre Teerã, seis meses após o início da guerra com o Irã, com o objetivo de fazer com que os líderes iranianos se rendam. O secretário do Tesouro Scott Bessent apresentou um plano para enfraquecer significativamente a economia iraniana, chamando-o de a 'maior ofensiva financeira já realizada'.", "titulo_pt": "5 Maneiras pelas quais a economia do Irã está se deteriorando sob a pressão de Trump", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 121808, "titulo": "Can You Kill Salmonella in Eggs Without Cooking Them? I Tried It", "url": "https://www.wired.com/story/sous-vide-salmonella-eggs/", "fonte_id": "wired", "data_pub": "2026-08-24T20:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor, com orientação de especialistas em doenças infecciosas, testou uma maneira simples de pasteurizar ovos em casa sem cozinhar eles. O objetivo era eliminar a salmonella sem alterar significativamente a textura dos ovos.", "titulo_pt": "Você pode eliminar a Salmonella nos ovos sem cozinhar eles? Eu testei", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 121244, "titulo": "Mark Ruffalo critica fusão entre Paramount e Warner, e empresa responde acusações", "url": "https://exame.com/pop/mark-ruffalo-critica-fusao-entre-paramount-e-warner-e-empresa-responde-acusacoes/", "fonte_id": "exame", "data_pub": "2026-08-24T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ator Mark Ruffalo criticou a fusão entre Paramount e Warner, alertando para a possível redução de empregos e a diminuição da concorrência no mercado de entretenimento.", "titulo_pt": "Mark Ruffalo critica fusão entre Paramount e Warner, e empresa responde acusações", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 121809, "titulo": "The Best Kitchen Gadget to Prevent Salmonella Is a Good Meat Probe", "url": "https://www.wired.com/story/food-safety-gear-salmonella/", "fonte_id": "wired", "data_pub": "2026-08-24T20:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Outbreaks de Salmonella são frequentes atualmente. Um bom probe de temperatura é a última linha de defesa contra essa bactéria.", "titulo_pt": "O melhor aparelho de cozinha para prevenir Salmonella é um boaprobe de temperatura", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 121836, "titulo": "IEEE Senior Membership Demystified", "url": "https://spectrum.ieee.org/ieee-senior-membership-demystified", "fonte_id": "ieee_spectrum", "data_pub": "2026-08-24T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor descobriu que sua percepção errônea sobre o nível de membros de nível superior da IEEE o impediu de reconhecer sua própria habilidade e profissionalismo. Sua membresia de nível superior poderia ter sido uma valiosa validação de suas habilidades e experiência profissional, mas isso foi ignorado devido a um preconceito sobre o que significa ser um membro sênior.", "titulo_pt": "Membro sênior da IEEE desmistificado", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 121483, "titulo": "Investigadores del Conicet identificaron marcadores moleculares clave para anticipar las formas graves de una enfermedad que padece el 30% de los adultos", "url": "https://www.lanacion.com.ar/ciencia/investigadores-del-conicet-identificaron-marcadores-moleculares-clave-para-anticipar-las-formas-nid24082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-25T00:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Cientistas argentinos desenvolveram um índice que pode prever complicações graves a partir de um exame de sangue. Este avanço permite o personalizado dos tratamentos para uma doença que afeta 30% da população adulta.", "titulo_pt": "Cientistas argentinos identificam marcadores moleculares para prever complicações graves de doença que afeta 30% dos adultos", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 121326, "titulo": "Quase na velocidade da luz cientistas recriam um mini Big-Bang colidindo partículas primordiais para criação do Universo", "url": "https://www.cnnbrasil.com.br/ciencia/quase-na-velocidade-da-luz-cientistas-recriam-um-mini-big-bang-colidindo-particulas-primordiais-para-criacao-do-universo/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-25T00:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas recriaram um estado de plasma de quarks e glúons, similar ao que existia no universo logo após sua formação. Este plasma impede a formação de prótons e oferece insights sobre o surgimento do universo.", "titulo_pt": "Quase na velocidade da luz, cientistas recriam mini Big-Bang colidindo partículas primordiais", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 121779, "titulo": "S. Korea to develop environmental, ocean observation satellite", "url": "https://en.yna.co.kr/view/AEN20260825001400320", "fonte_id": "yonhap_news", "data_pub": "2026-08-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul planeja desenvolver um satélite de geração próxima para observação ambiental e oceânica.", "titulo_pt": "Coreia do sul vai desenvolver satélite para observação ambiental e oceânica", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 121850, "titulo": "Blood-clotting protein may be SARS-CoV-2's hidden accomplice, helping it hide from antibodies and reach blood vessels", "url": "https://phys.org/news/2026-08-blood-clotting-protein-sars-cov.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fibrinogen, uma proteína plasmática abundante conhecida por formar coágulos sanguíneos, pode desempenhar um papel adicional prejudicial durante a infecção pelo SARS-CoV-2: servindo como um ponte molecular que oculta o vírus dos anticorpos neutralizantes e o leva até as células que revestem as veias e artérias.", "titulo_pt": "Proteína de coagulação sanguínea pode ser aliada oculta do SARS-CoV-2, escondendo-o dos anticorpos e levando-o aos vasos sanguíneos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 121851, "titulo": "Mystery statue unearthed at Sardis archaeological dig", "url": "https://phys.org/news/2026-08-mystery-statue-unearthed-sardis-archaeological.html", "fonte_id": "phys_org", "data_pub": "2026-08-24T23:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da longa-duradoura Expedition Arqueológica de Sardis, da Harvard–Cornell, descobriram uma estátua maior que o natural datada há aproximadamente 2.500 anos.", "titulo_pt": "Mistério: estátua de 2.500 anos é descoberta em escavações arqueológicas em Sardis", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 121852, "titulo": "Natural gas drilling could raise salt levels, in turn boosting radium in water", "url": "https://phys.org/news/2026-08-natural-gas-drilling-salt-boosting.html", "fonte_id": "phys_org", "data_pub": "2026-08-24T23:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A extração de gás natural em Pennsylvania está aumentando a produção de gás no país, representando cerca de um quinto da produção americana em 2024. Pesquisadores da Penn State estão investigando se o fracking está elevando o conteúdo de radium nas águas locais.", "titulo_pt": "A perfuração de gás natural pode aumentar os níveis de sal, o que por sua vez pode aumentar o radium na água", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 121880, "titulo": "Robotics and the future of on-orbit labor", "url": "https://spacenews.com/robotics-and-the-future-of-on-orbit-labor/", "fonte_id": "spacenews", "data_pub": "2026-08-24T22:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mike Gruss, da SpaceNews, entrevistou Ethan Barajas, CEO e cofundador da Icarus Robotics, durante a Conferência de Pequenos Satélites de 2026 em Salt Lake City, Utah. Eles discutiram o papel das robóticas no futuro do trabalho em órbita.", "titulo_pt": "Robótica e o futuro do trabalho orbital", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 121774, "titulo": "Simple test may help spot older drivers at higher crash risk", "url": "https://www.koreaherald.com/article/10850530", "fonte_id": "korea_herald", "data_pub": "2026-08-24T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo realizado pelo Hospital Seoul National University Bundang, liderado por Kim Ki-woong e Han Ji-won, mostrou que uma combinação de desempenho cognitivo e nível de educação pode ajudar a identificar motoristas mais velhos com maior risco de acidentes graves. A análise de dados policiais de 876 motoristas masculinos com 60 anos ou mais revelou diferenças significativas no risco de acidentes com base no tempo de estudo e no desempenho cognitivo.", "titulo_pt": "Teste simples pode ajudar a identificar motoristas mais velhos com maior risco de acidentes graves", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 121238, "titulo": "Tubarões ameaçados são criados por 'babás' antes de voltar ao oceano", "url": "https://exame.com/ciencia/tubaroes-ameacados-sao-criados-por-babas-antes-de-voltar-ao-oceano/", "fonte_id": "exame", "data_pub": "2026-08-24T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Filhotes de tubarões são criados por 'babás' até alcançarem o tamanho e as habilidades necessárias para sobreviverem na natureza. Eles recebem cuidados especializados durante esse período.", "titulo_pt": "Tubarões ameaçados são criados por 'babás' antes de voltar ao oceano", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 121251, "titulo": "Tratamento pioneiro contra o câncer salva píton 'Jodie Foster' de 4,5 metros", "url": "https://exame.com/ciencia/tratamento-pioneiro-contra-o-cancer-salva-piton-jodie-foster-de-45-metros/", "fonte_id": "exame", "data_pub": "2026-08-24T19:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma píton de 4,5 metros foi o primeiro réptil a receber eletroquimioterapia, um tratamento adaptado de humanos, e ficou livre do câncer.", "titulo_pt": "Tratamento pioneiro contra o câncer salva píton 'Jodie Foster' de 4,5 metros", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 121252, "titulo": "Por que uma rocha de 3,5 bilhões de anos está 'animando' cientistas", "url": "https://exame.com/ciencia/por-que-uma-rocha-de-35-bilhoes-de-anos-esta-animando-cientistas/", "fonte_id": "exame", "data_pub": "2026-08-24T19:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estruturas microscópicas em uma rocha de 3,5 bilhões de anos indicam a existência de antigos tapetes microbianos. Essa descoberta está 'animando' os cientistas.", "titulo_pt": "Por que uma rocha de 3,5 bilhões de anos está 'animando' cientistas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 121254, "titulo": "Como o maior tubarão luminoso do mundo usa a própria luz para enganar presas", "url": "https://exame.com/ciencia/como-o-maior-tubarao-luminoso-do-mundo-usa-a-propria-luz-para-enganar-presas/", "fonte_id": "exame", "data_pub": "2026-08-24T19:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo demonstra que a espécie de tubarão luminoso ajusta a intensidade de sua bioluminescência para ocultar sua silhueta e atacar suas presas sem ser percebido nas profundezas do mar.", "titulo_pt": "Como o maior tubarão luminoso do mundo usa a própria luz para enganar presas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 121847, "titulo": "‘Extreme’ wildfire sweeps Nevada as U.S. tallies almost 51,000 wildfires so far this year", "url": "https://www.scientificamerican.com/article/extreme-wildfire-sweeps-nevada-as-u-s-tallies-almost-51-000-wildfires-so-far-this-year/", "fonte_id": "scientific_american", "data_pub": "2026-08-24T19:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio florestal em Nevada começou em 22 de agosto e já consumiu mais de 15.000 acres de terra. Nos Estados Unidos, foram registradas quase 51.000 ocorrências de incêndios florestais até o momento deste ano.", "titulo_pt": "Incêndio extremo atinge Nevada enquanto EUA contabilizam quase 51.000 focos de incêndio florestal este ano", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 121255, "titulo": "A arara-azul não é azul: entenda a ilusão de óptica por trás da cor da ave", "url": "https://exame.com/ciencia/a-arara-azul-nao-e-azul-entenda-a-ilusao-de-optica-por-tras-da-cor-da-ave/", "fonte_id": "exame", "data_pub": "2026-08-24T19:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cor azul da arara-azul é causada por um efeito físico conhecido como cor estrutural, decorrente da microestrutura das penas da ave. Esta cor não é devido a pigmentos, mas sim a uma interação da luz com a estrutura das penas.", "titulo_pt": "A arara-azul não é azul: entenda a ilusão de óptica por trás da cor da ave", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 121093, "titulo": "Sensação de cócegas pode ser igual em diferentes culturas", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/sensacao-de-cocegas-pode-ser-igual-em-diferentes-culturas.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-24T18:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas holandeses investigaram a reação humana às cócegas e descobriram que as regiões do corpo sensíveis a cócegas parecem ser comuns entre dif renthood?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-24T11:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo de Singapura anunciou uma série de medidas para tornar a criação de filhos mais atraente, incluindo aumentar o período de licença parental com base no número de filhos. Essas iniciativas foram bem-vindas por alguns pais, mas outros questionam se elas serão suficientes para superar preocupações mais profundas sobre tempo, carreira, moradia e estilo de vida.", "titulo_pt": "Podem as últimas iniciativas pro-família de singapura mudar as percepções sobre a maternidade e paternidade?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 120523, "titulo": "Children make up half of mpox cases in Guinea-Bissau as epidemic spreads", "url": "https://www.theguardian.com/global-development/2026/aug/24/children-half-mpox-disease-cases-guinea-bissau-epidemic-spreads-west-africa", "fonte_id": "guardian_world", "data_pub": "2026-08-24T10:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Guiné-Bissau, mais de metade dos casos de mpox são crianças, com 46 casos suspeitos relatados desde julho. A epidemia foi declarada em 4 de julho após o registro do primeiro caso confirmado em uma mulher de 27 anos.", "titulo_pt": "Crianças representam metade dos casos de mpox em guiné-bissau", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 119674, "titulo": "Scrapping of Berlin swimming day for Black children becomes latest in long list of race-linked pool rows", "url": "https://www.theguardian.com/world/2026/aug/24/scrapping-of-berlin-swimming-day-for-black-children-becomes-latest-in-long-list-of-race-linked-pool-rows", "fonte_id": "guardian_world", "data_pub": "2026-08-24T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Plano de oferecer um horário exclusivo de banho na piscina para crianças negras em Berlim teve que ser cancelado devido a ataques racistas por parte de vozes de extrema-direita e conservadoras.", "titulo_pt": "Cancelamento do dia de banho na piscina para crianças negras em berlim se torna mais um caso de controvérsia racial", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 119359, "titulo": "Entenda como tipos de câncer afetam financeiramente lares brasileiros", "url": "https://www.cnnbrasil.com.br/saude/entenda-como-tipos-de-cancer-afetam-financeiramente-lares-brasileiros/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-24T02:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cânceres graves como o de mama, útero e ovário têm impactado financeiramente mais lares brasileiros. De acordo com dados do Censo 2022 (IBGE), as mulheres são as principais responsáveis pelo sustento familiar.", "titulo_pt": "Entenda como cânceres graves afetam financeiramente lares brasileiros", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 119942, "titulo": "‘Hang in there’: Chinese boys offer US$1.5 to struggling store owner, sparking wave of support", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3365006/hang-there-chinese-boys-offer-us15-struggling-store-owner-sparking-wave-support?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-24T02:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três boys da China oriental ofereceram 10,5 yuan (US$1,5) a um dono de loja de conveniência que estava prestes a fechar, gerando uma onda de apoio público. O dono, Chen, decidiu fechar sua loja em Guangzhou após cinco anos de dificuldades financeiras.", "titulo_pt": "Segure firme: garotos chineses oferecem US$1,5 para dono de loja em dificuldades, gerando onda de apoio", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 119943, "titulo": "Homes crack as London heatwaves trigger record subsidence claims", "url": "https://www.scmp.com/news/world/europe/article/3365004/homes-crack-london-heatwaves-trigger-record-subsidence-claims?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-24T02:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Londres enfrenta riscos históricos de subsidência devido a cinco secas consecutivas que secaram o solo argiloso da cidade. Reclamações de seguros relacionadas a subsidência, fenômeno causado por períodos quentes e secos, atingiram um recorde no último trimestre.", "titulo_pt": "Casas se rompem com reclamações de seguros por subsidência disparam em londres devido a ondas de calor", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 121503, "titulo": "Sube la temperatura, pero sigue el frío: así estará el clima en el AMBA durante la última semana de agosto", "url": "https://www.lanacion.com.ar/clima/buenos-aires/ciudad-de-buenos-aires/sube-la-temperatura-pero-sigue-el-frio-asi-estara-el-clima-en-el-amba-durante-la-ultima-semana-de-nid24082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-24T23:22:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Haverá uma recuperação térmica, mas o inverno persistirá por mais um mês. Há probabilidade de chuvas no próximo dia 26 de agosto.", "titulo_pt": "Aumenta a temperatura, mas o frio continua: assim será o clima no AMBA na última semana de agosto", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 121195, "titulo": "Febre do Nilo Ocidental: SP registra dois casos da doença e SC tem morte", "url": "https://veja.abril.com.br/saude/febre-do-nilo-ocidental-sp-registra-dois-casos-da-doenca-e-sc-tem-morte/", "fonte_id": "veja", "data_pub": "2026-08-24T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A doença do Nilo Ocidental foi registrada em São Paulo com dois casos confirmados, e houve uma morte relacionada à doença no estado de Santa Catarina. A doença é transmitida por pernilongos e tos foram detidos durante uma investigação sobre a morte de 18 elefantes no ecossistema de Amboseli, na Kenya. O ministério do Turismo e da Vida Selvagem informou que substâncias, incluindo químicos, foram apreendidos. Os suspeitos foram libertados em liberdade provisória, mas os resultados preliminares dos exames sugerem a possibilidade de envolvimento de uma substância tóxica.", "titulo_pt": "Quatro detidos na investigação sobre mortes de 18 elefantes em Amboseli, na Kenya", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 120234, "titulo": "Plástico que polui praias revela desafio da transição energética a partir da Amazônia", "url": "https://exame.com/esg/plastico-que-polui-praias-revela-desafio-da-transicao-energetica-a-partir-da-amazonia/", "fonte_id": "exame", "data_pub": "2026-08-24T12:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O lixo plástico está se acumulando nas praias da Amazônia. Ciência, inovação e políticas públicas buscam alternativas ao uso do petróleo.", "titulo_pt": "Plástico que polui praias amazônicas revela desafio da transição energética", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 120716, "titulo": "Tens of thousands evacuated as Hawk wildfire nears western US city of Reno", "url": "http://www.euronews.com/2026/08/24/tens-of-thousands-evacuated-as-hawk-wildfire-nears-western-us-city-of-reno", "fonte_id": "euronews", "data_pub": "2026-08-24T11:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dezenas de milhares de pessoas foram evacuadas à medida que o incêndio de Hawk se aproxima da cidade ocidental de Reno nos Estados Unidos. Não houve mortes relatadas, mas seis pessoas foram feridas, incluindo três resgatadores, e várias casas nas montanhas foram destruídas.", "titulo_pt": "Dezenas de milhares evacuados à medida que incêndio de Hawk se aproxima de Reno", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 120850, "titulo": "Malaysia says Indonesia to open airspace for cloud seeding to tackle haze", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3365068/malaysia-says-indonesia-open-airspace-cloud-seeding-tackle-haze?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-24T09:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Indonésia concedeu permissão oficial para agências malasianas entrar em seu espaço aéreo para realizar operações de sementação de nuvens, como parte das esforços conjuntos para combater a poluição de fuligem que atinge a região. O aumento das chamas florestais e de terras na Indonésia tem causado fechamentos de escolas em ambos os países.", "titulo_pt": "Malásia diz que indonésia abrirá espaço aéreo para operações de sementação de nuvens para combater a fuligem", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 120721, "titulo": "New Zealand's government introduces legislation to ban social media for under-16s", "url": "http://www.euronews.com/2026/08/24/new-zealands-government-introduces-legislation-to-ban-social-media-for-under-16s", "fonte_id": "euronews", "data_pub": "2026-08-24T09:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo da Nova Zelândia apresentou uma proposta de lei que proibiria o uso de redes sociais por menores de 16 anos. As empresas como Meta poderiam ser multadas em até 10% do seu faturamento global caso não cumpram a lei.", "titulo_pt": "Novo zeeland apresenta lei para proibir redes sociais para menores de 16 anos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 119801, "titulo": "Landslide at landfill in Guinea kills 30 people, government says", "url": "http://www.euronews.com/2026/08/24/landslide-at-landfill-in-guinea-kills-30-people-government-says", "fonte_id": "euronews", "data_pub": "2026-08-24T03:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um deslizamento de terra no aterro sanitário em Guiné resultou em 30 mortes. O incidente foi acionado por um trem pesado. O governo havia expedido ordens de despejo para os moradores locais nas proximidades do aterro alguns dias antes do acidente, devido ao medo de uma colapso.", "titulo_pt": "Deslizamento de terra em aterro mata 30 pessoas em Guiné, diz governo", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 119846, "titulo": "Human-caused Nevada wildfire forces 42,000 people to evacuate", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/24/08-24-26-nevada-forest-fire-sv?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-24T02:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio florestal perto de Reno, Nevada, obrigou 42.000 pessoas a se evacuarem e colocou mais 45.000 pessoas em alerta.", "titulo_pt": "Incêndio natural na Nevada força 42.000 pessoas a evacuarem", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 121654, "titulo": "In Gaza's hospitals, shortages and obstructed evacuations put patients at risk: 'We are forced to use the same catheter 20 or 30 times'", "url": "https://www.lemonde.fr/en/international/article/2026/08/25/in-gaza-s-hospitals-shortages-and-obstructed-evacuations-put-patients-at-risk-we-are-forced-to-use-the-same-catheter-20-or-30-times_6756811_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-24T22:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os hospitais na Faixa de Gaza estão enfrentando graves problemas devido à destruição e danos causados durante conflitos. A falta de equipamentos médicos, como máquinas MRI e CT, é significativa. Cerca de 20.000 pacientes estão na lista de evacuação.", "titulo_pt": "Nos hospitais de Gaza, escassez e evacuações interrompidas colocam os pacientes em risco: 'forçados a usar a mesma cateter 20 ou 30 vezes'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 121532, "t
