uerda ganhando força. Nas eleições nos Estados Unidos, os democratas buscam recuperar o controle do Congresso, com surpresas inesperadas, como a democrata Haley Stevens apoiando o republicano Mike Rogers na corrida ao Senado. Na Coreia do Norte, o general Kim Jong Sik denuncia uma 'brutal demonstração de guerra nuclear' por parte dos Estados Unidos e da Coreia do Sul, afirmando que a Coreia do Norte acelerará o reforço de sua capacidade de dissuasão atômica. Em um importante encontro, o presidente chinês Xi Jinping e o sultão do Omã, Haitham bin Tariq, pediram por uma resolução pacífica e um cessar-fogo integral entre Estados Unidos e Irã durante reuniões em Beijing. A Coreia do Sul e o Japão se encontrarão para discutir questões relacionadas à Coreia do Norte e assuntos bilaterais. No Brasil, Flávio Bolsonaro viajou para os Estados Unidos, intensificando a disputa por narrativas sobre a eleição presidencial, enquanto o Partido Democrático expressou satisfação com o discurso de orçamento do presidente Lee, mas o Partido Popular Progressista criticou o discurso por não abordar questões do Norte da Coreia e das dificuldades econômicas.\n\nSistemas de alerta antiaéreo na Ucrânia e na Rússia foram alvo de ciberataques, enviando mensagens falsas de alerta de radiação e química, conforme relatado pelo The Guardian. Essa ação é considerada uma das maiores ameaças à segurança cibernética na região, afetando diretamente a população civil. Em outro desenvolvimento, a ONU concluiu um alto elogio humanitário em Oleshki após o término do reparto de ajuda e a saída dos civis, conforme informado pelo La Tercera. O alto elogio, que foi o mais prolongado desde o início do conflito em 2022, exigiu trabalhos de desminagem nos acessos à localidade. Além disso, o Irã advertiu que um novo conflito com os Estados Unidos poderia durar mais tempo do que o conflito anterior, após Donald Trump afirmar que ainda precisa 'cuidar' de mais alvos, conforme relatos do South China Morning Post. Diplomatas têm tentado encerrar a guerra no Oriente Médio, mas ameaças americanas e israelitas de retomar bombardeios continuam a surgir, especialmente durante períodos de eleições cruciais.", "economia": "A economia global enfrenta diversos desafios e realizações, conforme indicado nos artigos. Em primeiro lugar, a economia dos Estados Unidos está surpreendendo positivamente, apesar de pesquisas mostrarem que Donald Trump perderá a maioria na Câmara e no Senado. Em seguida, a China anunciou uma nova rodada de estímulos financeiros para injetar cerca de 15 bilhões de dólares nos mercados acionários, após uma forte queda nas vendas. Na Coreia do Sul, a POSCO Holdings registrou uma queda de 1,8% no lucro líquido no terceiro trimestre, devido a preços menores do litio, enquanto a Renault e a Hyundai enfrentaram quedas nas vendas devido a uma demanda fraca. Os mercados acionários de Seul recuperaram-se, encerrando com alta superior a 2%, graças à busca por oportunidades em grandes empresas tecnológicas. O Brasil também enfrenta desafios, com a proposta de André Lara Resende para limitar a taxa Selic entrando no radar do governo Lula, causando preocupação no mercado financeiro. Além disso, as exportações do agronegócio brasileiro para a União Europeia aumentaram em 14,8% nos últimos seis meses, impulsionadas pelo acordo de livre comércio entre Mercosul e UE. O mercado de petróleo também é notável, com a OPEP+ mantendo as metas de produção de petróleo para dezembro, antes de uma possível decisão sobre 2027. Finalmente, a economia japonesa enfrenta baixas expectativas para o gasto do consumidor devido ao encolhimento da população, enquanto a Coreia do Sul acelera suas investidas no mercado japonês, motivada pelo aumento do investimento dos consumidores e pelas reformas nos mercados de capitais promovidas pelo governo japonês.", "tecnologia": "O mercado de tecnologia registrou diversas notícias significativas recentemente. A China se destacou na área de inteligência artificial (IA), gerando mais dados de inferência do que os utilizados para treinar os sistemas de IA, de acordo com um relatório oficial. A Tailândia viu seu comércio com Taiwan aumentar devido ao crescimento da IA e movimentos geopolíticos, tornando-se o terceiro maior parceiro comercial do país asiático. Em um desenvolvimento importante, a Jinpao Precision Industry, uma filial tailandesa, realizou a final de uma competição de robótica local com o objetivo de desenvolver talentos em inteligência artificial e fabricação inteligente. A Denso, uma das maiores fabricantes de peças automotivas do Japão, registrou lucros decrescentes devido ao aumento de custos de memória, um fenômeno impulsionado pelo boom da IA. Ainda no Japão, a Omron planeja aumentar a produção de monitores de pressão arterial na Índia, enquanto a Samsung SDS inaugurou um novo centro de dados de IA em Gumi, na Coreia do Sul, com capacidade inicial de 60 megawatts. Em outro desenvolvimento, a startup Marble Cognition levantou $3,75 milhões para desenvolver colegas de trabalho de IA que aprendem observando, enquanto a empresa de análise de resíduos Sortrace recebeu $800,000 para melhorar a separação de resíduos com IA. Estas notícias refletem a crescente importância do setor de tecnologia em diversas regiões globais.", "ciencia": "Um estudo inovador em vacinas contra o câncer de pâncreas está gerando respostas imunológicas em 99% dos pacientes em ensaios clínicos, conforme relatado pela La Tercera. O sistema de saúde dos Estados Unidos enfrenta problemas econômicos, de acordo com Paul Markovich, presidente da Ascendiun, em artigo publicado na STAT+. Na China, cientistas mapearam correntes de energia subaquática que formam estruturas chamadas 'chaminés inertiais', o que poderia transformar a detecção marítima e comunicação submarina. Além disso, pesquisas sobre a influência da mudança climática nas plantas do Uluru-Kata Tjuṯa, na Austrália, e sobre a aceleração do metabolismo humano em termos de emissão de dióxido de carbono, lideradas pela Universidade de Bath, também merecem destaque.", "cultura": "O mês de novembro promete uma rica variedade de atividades culturais. Entre os livros não-ficcionais, destaque para 'O Vôo da Morte: Veneno, Plunder e a Busca por um Medicamento Milagroso na Amazônia', de Matt O'Hara, que explora a história de 1938 envolvendo doenças e busca por medicamentos na região amazônica. Na poesia, a obra 'Cascos de Vidro, Luminosidade, Sopa e Outros Milagres', de Malgorzata Lebda, aborda temas como o movimento contra a perda e pensamentos de outono no verão. Para crianças, dez novos livros infantis foram lançados, oferecendo consolo em momentos difíceis. Entre as obras literárias, destaque para o Prêmio Nobel de Literatura de 1930 para Sinclair Lewis, reconhecido por seu estilo vigoroso e vívido e pela habilidade em criar personagens e situações com graça e humor. Além disso, diversos eventos culturais estão programados para o mês, incluindo a Semana de Arte de Miami, a Biênial de Design de Doha e a festa do Prêmio Dezeen 2026, além de apresentações de coreógrafos emergentes na Coreia do Sul.", "sociedade": "Milhões de chineses se emocionaram com a história de Cao Feng, uma graduada em escola secundária que deixou a universidade para cuidar de sua mãe gravemente doente. Em Bangladesh, milhares de trabalhadores da indústria têxtil entraram em conflito com a polícia, exigindo um aumento salarial. No Distrito Federal, uma moradora e um condomínio travaram uma batalha judicial sobre a construção de uma ciclovia. O Programa do Grupo Aconchego e Sedes-DF cuida de crianças separadas de suas famílias devido a maus-tratos ou abandono, acolhendo-as em lares temporários. Em São Paulo, a Prefeitura promove uma campanha de vacinação antirrábica e microchipagem para cães e gatos. A França e a Alemanha enfrentam protestos generalizados contra o aumento do custo de vida, com violência e saques em várias cidades. Em Bangladesh, trabalhadores entraram em conflito com a polícia, enquanto em Hong Kong, uma cidadã chinesa não retornou ao país para o Undas, o período de luto dedicado aos mortos. No Brasil, o governo investiga relatos de assédio e violência após as eleições de 2026. O mercado de saúde premium está diversificando seus produtos, oferecendo check-ups mentais e exames preditivos, além do tradicional check-up anual.", "meio_ambiente": "O Brasil terá temporais durante o feriado de Finados, conforme alertas do Inmet. O presidente Luiz Inácio Lula da Silva visitou um viveiro de araras reformado na Granja do Torto, enfatizando a importância da conservação. Em dezembro, a Califórnia inaugurará o maior puente para animais do mundo, que cruza uma autopista com dez pistas, promovendo a segurança dos animais na região. O adolescente Isaac Nelson, de 14 anos, construiu jardins submarinos verticais com ostras na Flórida, purificando 950.000 litros de água por dia. O negociador-chefe Steven Guilbeault do Canadá acredita que as subsídios prejudiciais serão o principal campo de batalha na conferência sobre biodiversidade COP17. O governo do Território do Norte do Canadá planeja eliminar a exigência legal de reserva de água para a natureza, o que é visto por grupos ambientais como uma 'ataque escancarado e sem vergonha' ao meio ambiente.", "direitos_humanos": "Um novo julgamento para Akmal Bozorov, um réu uzbeque, será iniciado na próxima semana no Fórum Distrital de Changwon, na Coreia do Sul. Após um julgamento de 16 anos atrás, em 2009, que resultou na sentença de prisão perpétua por matar e roubar um motorista de táxi, a sentença será reavaliada, conforme informa o Korea Herald. No Mato Grosso do Sul, o governo anunciou a ampliação da presença da Força Nacional em aldeias indígenas para monitorar e proteger as comunidades Guarani Kaiowá, em resposta a denúncias de violência. O Exame destaca que esta medida visa reforçar o efetivo e garantir a segurança das comunidades indígenas. Além disso, o Poder360 relata que o ICE publicou um vídeo em que debocha de migrantes presos nos EUA, usando ícones de filmes de terror e a música 'Thriller', de Michael Jackson, para criticar a situação dos imigrantes detidos."}, "resumo_do_dia": {"politica_nacional": [{"id": 239845, "titulo": "Como alimentar a população mundial se a IA derrubar a rede elétrica", "url": "https://www.poder360.com.br/poder-agro/como-alimentar-a-populacao-mundial-se-a-ia-derrubar-a-rede-eletrica/", "fonte_id": "poder360", "data_pub": "2026-11-02T09:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo apresenta oito alternativas para garantir a segurança alimentar em caso de colapso da agricultura convencional devido a uma interrupção da rede elétrica causada por inteligência artificial avançada. As alternativas visam suprir a demanda de alimentos sem a dependência do sistema elétrico atual.", "titulo_pt": "Como garantir a alimentação mundial se a agricultura convencional colapsar devido à IA?", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 239846, "titulo": "Realidade virtual e IA aprimoram detecção de declínio cognitivo", "url": "https://www.poder360.com.br/poder-saude/realidade-virtual-e-ia-aprimoram-deteccao-de-declinio-cognitivo/", "fonte_id": "poder360", "data_pub": "2026-11-02T09:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um sistema utiliza realidade virtual, medição do ativismo cerebral e inteligência artificial para detectar declínios cognitivos leves em idosos.", "titulo_pt": "Realidade virtual e IA melhoram detecção de declínio cognitivo em idosos", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 239835, "titulo": "Sandra de Sá e Teresa Cristina aportam no 3º Festival Sesc Culturas Negras", "url": "https://www.cartacapital.com.br/blogs/augusto-diniz/sandra-de-sa-e-teresa-cristina-aportam-no-3o-festival-sesc-culturas-negras/", "fonte_id": "cartacapital", "data_pub": "2026-11-02T09:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O evento inclui shows de Sandra de Sá, Teresa Cristina, Evinha e Bia Ferreira, além de um cortejo de Moçambique Estrela Guia e uma celebração da música negra.", "titulo_pt": "Sandra de Sá e Teresa Cristina participam do 3º Festival Sesc Culturas Negras", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 239847, "titulo": "Ferramenta on-line facilita a análise de dados genéticos complexos", "url": "https://www.poder360.com.br/poder-saude/ferramenta-on-line-gratuita-facilita-a-analise-de-dados-geneticos-complexos/", "fonte_id": "poder360", "data_pub": "2026-11-02T09:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma plataforma on-line foi desenvolvida para analisar dados de expressão gênica em células individuais, facilitando o processo para usuários que não possuem conhecimentos de programação.", "titulo_pt": "Ferramenta on-line simplifica análise de dados genéticos em células individuais", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 239999, "titulo": "Carf nega tese do STF à multa regulamentar do IPI por notas fiscais irregulares", "url": "https://www.jota.info/tributos/carf-nega-tese-do-stf-a-multa-regulamentar-do-ipi-por-notas-fiscais-irregulares", "fonte_id": "jota", "data_pub": "2026-11-02T09:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho de Fiscalização do Carf (Conselho Administrativo de Recursos Fiscais) rejeitou a tese do STF (Supremo Tribunal Federal) sobre a aplicação de uma multa regulamentar do IPI de 150% por emissão de notas fiscais irregulares.", "titulo_pt": "Carf rejeita tese do STF sobre multa do IPI por notas fiscais irregulares", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 239807, "titulo": "Cientistas articulam campanha para indicar presidente da SBPC ao Ministério da Ciência", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/cientistas-articulam-campanha-para-indicar-presidente-da-sbpc-ao-ministerio-da-ciencia.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-02T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Integrantes da comunidade científica estão articulando uma campanha para indicar Francilene Procópio Garcia, presidente da Sociedade Brasileira para o Progresso da Ciência (SBPC), ao comando do Ministério da Ciência, Tecnologia e Inovação (MCTI) no governo Lula. Garcia preside a SBPC desde julho de 2025.", "titulo_pt": "Cientistas articulam campanha para indicar presidente da SBPC ao Ministério da Ciência", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 239900, "titulo": "Para Mansueto, do BTG, incerteza fiscal é o maior problema de curto prazo", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/para-mansueto-do-btg-incerteza-fiscal-e-o-maior-problema-de-curto-prazo/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-02T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O economista do BTG, Mansueto Almeida, avaliou que a incerteza fiscal é o maior problema de curto prazo. Ele considerou que a turbulência pós-eleição é um ajuste de posições, mas destacou a necessidade de um plano fiscal claro do governo.", "titulo_pt": "Para Mansueto, incerteza fiscal é o maior problema de curto prazo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 239867, "titulo": "O que impede Kassab de ser ministro de Lula", "url": "https://www.metropoles.com/colunas/igor-gadelha/o-que-impede-kassab-de-ser-ministro-de-lula", "fonte_id": "metropoles", "data_pub": "2026-11-02T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lideranças do PSD consideram que Gilberto Kassab não teria condições de assumir um ministério no governo Lula, se fosse convidado.", "titulo_pt": "O que impede Kassab de ser ministro de Lula", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 239869, "titulo": "Governo quebra cabeça para desarmar bombas no Orçamento 2027", "url": "https://www.metropoles.com/brasil/governo-desarmar-bombas-orcamento", "fonte_id": "metropoles", "data_pub": "2026-11-02T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo enfrenta dificuldades para incluir no Orçamento de 2027 as despesas previstas no pacote de benefícios prometido durante a campanha eleitoral, o que requer ajustes para atingir a meta fiscal.", "titulo_pt": "Governo quebra cabeça para desarmar bombas no Orçamento 2027", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 239870, "titulo": "Cresce procura por posse de Lula e PT orienta organização de caravanas", "url": "https://www.metropoles.com/brasil/cresce-procura-por-posse-de-lula-e-pt-orienta-organizacao-de-caravanas", "fonte_id": "metropoles", "data_pub": "2026-11-02T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A procura por posse de Lula está aumentando, e o PT orientou a organização de caravanas. A cerimônia de início do quarto mandato de Lula está marcada para 5 de janeiro e deve mobilizar apoiadores de todo o país.", "titulo_pt": "Cresce procura por posse de Lula e PT orienta caravanas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 239910, "titulo": "Governo Lula retoma articulação com o Congresso após eleições", "url": "https://www.cnnbrasil.com.br/politica/governo-lula-retoma-articulacao-com-o-congresso-apos-eleicoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-02T07:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula está retomando as negociações com o Congresso após as eleições para aprovar a PEC da Segurança, nomear um ministro ao STF e avançar com o marco da Internet das Coisas (IA).", "titulo_pt": "Governo Lula retoma articulação com o Congresso após eleições", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 239911, "titulo": "Lula quer evitar “unção” a sucessor e buscará opções para Casa Civil", "url": "https://www.cnnbrasil.com.br/politica/lula-quer-evitar-uncao-a-sucessor-e-buscara-opcoes-para-casa-civil/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-02T07:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula busca alternativas para a Casa Civil, evitando a 'unção' de um sucessor imediato. Haddad e Camilo são os principais nomes cotados para o cargo, mas Lula pretende considerar outras opções.", "titulo_pt": "Lula busca alternativas para Casa Civil, evitando 'unção' de sucessor", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 239826, "titulo": "Ministério da Gestão lança calculadora de cotas em concursos públicos; veja como funciona", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/ministerio-da-gestao-lanca-calculadora-de-cotas-em-concursos-publicos-veja-como-funciona.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-02T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Gestão e da Inovação em Serviços Públicos desenvolveu uma calculadora para estimar o número de vagas em concursos públicos para diferentes grupos. O objetivo é aumentar a diversidade no setor público, com um enfoque especial em novembro, mês da Consciência Negra.", "titulo_pt": "Ministério da Gestão lança calculadora de cotas em concursos públicos; veja como funciona", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 239827, "titulo": "Beneficiada por liminar, Vertex planeja iniciar produção de gasolina em 2027", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/beneficiada-por-liminar-vertex-planeja-iniciar-producao-de-gasolina-em-2027.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-02T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Vertex Formuladora, beneficiada por uma decisão judicial, planeja iniciar a produção de gasolina em Sorocaba (SP) no início de 2027 através do processo de formulação. O projeto está sob questionamentos do mercado.", "titulo_pt": "Vertex planeja iniciar produção de gasolina em 2027, apoiada por liminar", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 239828, "titulo": "Recebimento de vales-alimentação e refeição muda a partir do dia 7", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/recebimento-de-vales-alimentacao-e-refeicao-muda-a-partir-do-dia-7.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-02T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A partir do dia 7 de novembro, as regras para o uso de cartões de vale-refeição (VR) e vale-alimentação (VA) serão alteradas, permitindo a aceitação de cartões de diferentes operadoras em qualquer maquininha habilitada para esse tipo de pagamento.", "titulo_pt": "Mudança no recebimento de vales-refeição e alimentação a partir do dia 7", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 239873, "titulo": "Marcinho VP mandou criar associação de moradores mesmo preso, diz polícia", "url": "https://www.metropoles.com/colunas/manoela-alcantara/marcinho-vp-mandou-criar-associacao-de-moradores-mesmo-preso-diz-policia", "fonte_id": "metropoles", "data_pub": "2026-11-02T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A polícia identificou conversas em que um aliado de Marcinho VP afirmou ter criado uma associação de moradores a pedido do traficante, mesmo ele estando preso. As mensagens foram encontradas no celular da mãe de Oruam.", "titulo_pt": "Marcinho VP teria mandado criar associação de moradores, mesmo preso, diz polícia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 240077, "titulo": "Foro World in Progress 2026 de Barcelona, en directo | Sánchez: “Debemos recuperar la confianza en la alta velocidad cuanto antes y cueste lo que cueste”", "url": "https://elpais.com/internacional/2026-11-02/foro-world-in-progress-de-barcelona-en-directo.html", "fonte_id": "elpais_america", "data_pub": "2026-11-02T09:57:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente do governo espanhol, Pedro Sánchez, discursou sobre a necessidade de recuperar a confiança na alta velocidade. Salvador Illa criticou a administração dos Estados Unidos, afirmando que ela quer destruir Europa e que é necessário fazer frente a ela. Collboni enfatizou a importância da política em transformar a incerteza em confiança.", "titulo_pt": "Foro World in Progress 2026 de Barcelona, em direto | Sánchez: ‘devemos recuperar a confiança na alta velocidade, custe o que custar’", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 240136, "titulo": "French high schoolers return from break with protest turnout uncertain but vows to 'keep up pressure'", "url": "https://www.lemonde.fr/en/france/article/2026/11/02/french-high-schoolers-return-from-break-with-protest-turnout-uncertain-but-vows-to-keep-up-pressure_6769406_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-02T09:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Após as férias, grupos de estudantes de ensino médio e universitários em França ameaçaram bloquear as escolas a partir da próxima segunda-feira ou terça-feira, apesar das promessas do governo. No entanto, a pressão dos exames e das inscrições universitárias está levando alguns estudantes a hesitarem.", "titulo_pt": "Estudantes de ensino médio e universitários ameaçam bloquear escolas após férias, mas pressão dos exames pode diminuir adesão", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 240059, "titulo": "Ukraine and Russia say emergency air-raid warning systems hit by cyber-hacks – Europe live", "url": "https://www.theguardian.com/world/live/2026/nov/02/ukraine-russia-emergency-warning-systems-hack-zelenskyy-streeting-eu-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-11-02T09:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sistemas de alerta antiaéreo na Ucrânia e na Rússia foram alvo de ciberataques, enviando mensagens falsas de alerta de radiação e química. O primeiro-ministro da Bélgica, Bart De Wever, está se demitindo após falhas em aprovar um orçamento.", "titulo_pt": "Ucrânia e Rússia relatam ciberataques em sistemas de alerta antiaéreo – Europa em tempo real", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 240292, "titulo": "Monday Briefing from the Balkans: November 2, 2026", "url": "https://balkaninsight.com/2026/11/02/monday-briefing-from-the-balkans-november-2-2026/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-02T09:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O resumo abrange os principais desenvolvimentos do fim de semana em diversos países da região dos Bálcãs, conforme publicado pelo Balkan Insight.", "titulo_pt": "Boletim semanal dos bálcãs: 02 de novembro de 2026", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 240002, "titulo": "Finaliza el alto el fuego humanitario en Oleshki tras completarse el reparto de ayuda y la salida de civiles", "url": "https://www.latercera.com/mundo/noticia/finaliza-el-alto-el-fuego-humanitario-en-oleshki-tras-completarse-el-reparto-de-ayuda-y-la-salida-de-civiles/", "fonte_id": "la_tercera", "data_pub": "2026-11-02T09:36:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O alto elogio humanitário em Oleshki foi finalizado após o término do reparto de ajuda e a saída dos civis. Esta tregua foi considerada o período de cessar-fogo mais prolongado concordado pelos dois lados desde o início do conflito em 2022, e exigiu trabalhos de desminagem nos acessos à localidade.", "titulo_pt": "Finaliza o alto elogio humanitário em Oleshki após reparto de ajuda e saída de civis", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 240185, "titulo": "Nuclear radiation in Russia, Ukraine? No, just hacked warning alerts", "url": "https://www.aljazeera.com/news/2026/11/2/nuclear-radiation-in-russia-ukraine-no-just-hacked-warning-alerts?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-02T09:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alertas de radiação foram emitidos em territórios da Rússia e Ucrânia, mas autoridades afirmam que a confusão foi esclarecida em menos de uma hora.", "titulo_pt": "Avisa-se sobre radiação na Rússia e Ucrânia? Não, apenas alertas falsos foram desmentidos rapidamente", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 240269, "titulo": "China and Oman unite in Mideast peace call on sultan’s ‘historic’ Beijing visit", "url": "https://www.scmp.com/news/china/diplomacy/article/3372994/china-and-oman-unite-mideast-peace-call-sultans-historic-beijing-visit", "fonte_id": "scmp", "data_pub": "2026-11-02T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "China e Omã pediram por uma resolução pacífica e um cessar-fogo integral entre Estados Unidos e Irã, enfatizando a necessidade de restaurar o tráfego seguro pelo Estreito de Ormuz. Essa posição foi expressa durante reuniões em Beijing entre o presidente chinês Xi Jinping e o sultão do Omã, Haitham bin Tariq.", "titulo_pt": "China e omã unem-se em chamado à paz no oriente médio durante visita histórica do sultão a Beijing", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 240170, "titulo": "Serbia remembers 16 victims of Novi Sad railway station collapse", "url": "https://www.euronews.com/video/2026/11/02/serbia-remembers-16-victims-of-novi-sad-railway-station-collapse", "fonte_id": "euronews", "data_pub": "2026-11-02T09:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Serbia comemora o segundo aniversário do colapso da estação de Novi Sad, onde 16 pessoas morreram. Estudantes no poder prometem justiça para as vítimas e responsabilização pela suposta corrupção.", "titulo_pt": "Serbia lembra dois anos do colapso da estação de Novi Sad com 16 mortos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 240186, "titulo": "US midterms: 1 day to go – Democrats rally around El-Sayed amid attacks", "url": "https://www.aljazeera.com/news/2026/11/2/us-midterms-1-day-to-go-democrats-rally-around-el-sayed-amid-attacks?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-02T09:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os democratas criticam Haley Stevens por seu endosso a um candidato republicano no dia anterior às eleições. O candidato democrata Mahmoud El-Sayed está recebendo apoio dos demais candidatos do partido.", "titulo_pt": "Eleições médias nos EUA: 1 dia para o pleito – democratas apoiam El-Sayed em meio a ataques", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 240139, "titulo": "Post-Orban Hungary faces challenge of rebuilding public trust", "url": "https://www.lemonde.fr/en/le-monde-events/article/2026/11/02/post-orban-hungary-faces-challenge-of-rebuilding-public-trust_6769405_88.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-02T09:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A sociedade civil, que havia sido alvo de campanhas constantes de desdenho e de uma legislação particularmente repressiva durante o governo de Viktor Orban, está respirando mais facilmente desde a mudança no poder. No entanto, todos os seus stakeholders permanecem cautelosos em relação ao novo governo liderado por Péter Magyar.", "titulo_pt": "Hungria pós-orban enfrenta desafio de reconstruir a confiança pública", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 240187, "titulo": "MLB ‘spot-fixing’ trial set to begin in US court", "url": "https://www.aljazeera.com/sports/2026/11/2/mlb-spot-fixing-trial-set-to-begin-in-us-court?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-02T09:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um julgamento está prestes a começar em um tribunal dos Estados Unidos para acusados de conspirar para influenciar partidas de beisebol profissional por meio de propinas. Os acusados são lançadores da MLB.", "titulo_pt": "Processo de corrupção na MLB deve começar em tribunal dos EUA", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 240096, "titulo": "How America Can Counter Chinese Coercion", "url": "https://www.foreignaffairs.com/japan/how-america-can-counter-chinese-coercion", "fonte_id": "foreign_affairs", "data_pub": "2026-11-02T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo argumenta a favor de uma aliança econômica para contrapor a coerção chinesa.", "titulo_pt": "A causa de uma aliança econômica para conter a coerção chinesa", "veiculo": "Foreign Affairs", "pais": "EUA", "classe": "A"}, {"id": 240097, "titulo": "The Limits of China’s Self-Sufficiency", "url": "https://www.foreignaffairs.com/china/limits-chinas-self-sufficiency", "fonte_id": "foreign_affairs", "data_pub": "2026-11-02T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A insegurança alimentar da China poderia impedir uma guerra sobre Taiwan. O país está cada vez mais dependente de importações de alimentos, o que limita suas opções estratégicas.", "titulo_pt": "A insegurança alimentar da China poderia prevenir uma guerra sobre taiwan", "veiculo": "Foreign Affairs", "pais": "EUA", "classe": "A"}, {"id": 240188, "titulo": "Trump makes controversial claims at final Republican campaign rallies", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/2/trump-makes-controversial-claims-at-final-republican-campaign-rallies?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-02T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Donald Trump fez uma série de declarações provocativas durante seus últimos discursos de campanha republicana.", "titulo_pt": "Trump faz declarações controversas em últimos discursos de campanha republicana", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 240190, "titulo": "Sydney deploys heavily armed police unit after Bondi attack", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/2/sydney-deploys-heavily-armed-police-unit-after-bondi-attack?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-02T08:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cidade de Sydney enviou uma unidade policial altamente armada após um ataque em Bondi.", "titulo_pt": "Sydney desloca unidade policial armada após ataque em Bondi", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 240011, "titulo": "Corea del Norte denuncia una “brutal demostración de guerra nuclear” de EEUU y Corea del Sur", "url": "https://www.latercera.com/mundo/noticia/corea-del-norte-denuncia-una-brutal-demostracion-de-guerra-nuclear-de-eeuu-y-corea-del-sur/", "fonte_id": "la_tercera", "data_pub": "2026-11-02T08:43:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O general norcoreano Kim Jong Sik denunciou uma 'brutal demonstração de guerra nuclear' por parte dos Estados Unidos e da Coreia do Sul. Segundo ele, Coreia do Norte acelerará o reforço de sua capacidade de dissuasão atômica sem alterações.", "titulo_pt": "Coreia do Norte denuncia 'brutal demonstração de guerra nuclear' dos EUA e Coreia do sul", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 239855, "titulo": "Excesso de prognósticos negativos sobre Trump esconde economia bombando", "url": "https://veja.abril.com.br/coluna/mundialista/excesso-de-prognosticos-negativos-sobre-trump-esconde-economia-bombando/", "fonte_id": "veja", "data_pub": "2026-11-02T09:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisas indicam que Trump perderá a maioria na Câmara e no Senado nas eleições de amanhã, mas a economia está apresentando resultados surpreendentes.", "titulo_pt": "Excesso de prognósticos negativos sobre Trump esconde economia em alta", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 239998, "titulo": "Terrorismo no Brasil: o fim da cooperação jurídica internacional e da nossa Economia?", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-da-abde/terrorismo-no-brasil-o-fim-da-cooperacao-juridica-internacional-e-da-nossa-economia", "fonte_id": "jota", "data_pub": "2026-11-02T09:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A designação de uma organização como terrorista não elimina a soberania nacional nem autoriza operações militares em território estrangeiro.", "titulo_pt": "Terrorismo no Brasil: o fim da cooperação jurídica internacional e da nossa Economia?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 240270, "titulo": "Beijing launches US$15b asset swap to support China’s markets after sell-off", "url": "https://www.scmp.com/business/markets/article/3372993/beijing-refreshes-asset-swap-support-chinas-stock-market-after-sell", "fonte_id": "scmp", "data_pub": "2026-11-02T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Banco Central da China anunciou que iniciará uma nova rodada de uma ferramenta de troca para injetar cerca de 15 bilhões de dólares nos mercados acionários onshore, após a maior venda-livre em mais de uma década que prejudicou a confiança dos investidores e ameaçou trazer novos riscos ao sistema financeiro do país. A taxa de câmbio prevista para esta troca é de um ano.", "titulo_pt": "Pequim lança troca de ativos de US$ 15 bilhões para apoiar mercados chineses após venda massiva", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 240060, "titulo": "Ryanair considers pay freezes and reducing crew on flights as fuel costs soar", "url": "https://www.theguardian.com/business/2026/nov/02/ryanair-considers-pay-freezes-reducing-crew-on-flights-fuel-costs-soar-ai", "fonte_id": "guardian_world", "data_pub": "2026-11-02T09:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ryanair está considerando medidas de corte de custos, como congelamento de salários, redução do número de tripulantes em voos e aumento do uso da inteligência artificial, devido ao aumento das tarifas de combustível, que devem subir em torno de 2 bilhões de euros no próximo ano financeiro. A companhia aérea, que é a maior da Europa na categoria low-cost, prevê que as tarifas de passagem possam aumentar em até 20%.", "titulo_pt": "Ryanair considera congelar salários e reduzir tripulação para combater aumento de custos com combustível", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 240244, "titulo": "BOJ signals low hopes for consumer spending as population falls", "url": "https://www.japantimes.co.jp/business/2026/11/02/economy/bank-of-japan-quarterly-outlook/", "fonte_id": "japan_times", "data_pub": "2026-11-02T08:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A economia privada representa aproximadamente metade da economia japonesa, sendo um fator crucial para o Banco do Japão. O Banco central expressou baixas expectativas para o gasto do consumidor devido ao encolhimento da população.", "titulo_pt": "BOJ sinaliza baixas expectativas para o consumo do consumidor devido ao encolhimento da população", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 240231, "titulo": "Alstom shares tumble 28% after train maker cuts profit forecast", "url": "https://www.ft.com/content/95723b31-c35b-4d68-9abe-9e082e95e362?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-02T08:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da Alstom caíram 28% após a empresa cortar sua projeção de lucro. A companhia também apresentou um plano para reduzir sua dívida em 2 bilhões de euros, em seu segundo alerta de lucro desde que Martin Sion assumiu o cargo de chefe.", "titulo_pt": "Ações da alstom despencam 28% após empresa cortar projeção de lucro", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 240323, "titulo": "(2nd LD) POSCO Holdings Q3 net falls 1.8 pct on one-off losses", "url": "https://en.yna.co.kr/view/AEN20261102006552320", "fonte_id": "yonhap_news", "data_pub": "2026-11-02T08:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A POSCO Holdings, principal empresa de aço da Coreia do Sul, registrou uma queda de 1,8% no lucro líquido no terceiro trimestre devido a perdas isoladas.", "titulo_pt": "Lucro líquido da POSCO Holdings cai 1,8% no terceiro trimestre devido a perdas isoladas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 240000, "titulo": "O IBS e a CBS não são receita do produtor rural, e o Funrural precisa reconhecer isso", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-ibs-e-a-cbs-nao-sao-receita-do-produtor-rural-e-o-funrural-precisa-reconhecer-isso", "fonte_id": "jota", "data_pub": "2026-11-02T07:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O IBS e a CBS não são responsáveis pela contribuição previdenciária, e o Funrural precisa reconhecer isso. A forma como os adquirentes parametrizarem a retenção decidirá se a contribuição previdenciária passará a incidir sobre o tributo.", "titulo_pt": "IBS e CBS não são a contribuição do produtor rural, e Funrural precisa reconhecer", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 240304, "titulo": "Seoul stocks rebound over 2% on bargain hunting", "url": "https://www.koreaherald.com/article/10923058", "fonte_id": "korea_herald", "data_pub": "2026-11-02T07:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os mercados acionários de Seul recuperaram-se, encerrando com alta superior a 2% graças à busca por oportunidades em grandes empresas tecnológicas, apesar das preocupações sobre o gasto com inteligência artificial. O índice da Bolsa Coreana subiu 2,24% para fechar em 5.859,08 pontos.", "titulo_pt": "Ações de seul reagem positivamente com busca por barganha em tecnologia", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 239909, "titulo": "Mercado chega à semana do Copom com expectativa por fim do corte de juros", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/mercado-chega-a-semana-do-copom-com-expectativa-por-fim-do-corte-de-juros/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-02T07:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Agentes econômicos expressam preocupação com a alta percepção de riscos, principalmente relacionada à política fiscal e à estabilidade da inflação. O mercado se prepara para a reunião do Copom, com expectativa de que os juros possam chegar ao fim do ciclo de corte.", "titulo_pt": "Mercado se prepara para reunião do Copom com aumento da percepção de riscos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 240329, "titulo": "(LEAD) POSCO Holdings Q3 net falls 1.8 pct amid lower lithium prices", "url": "https://en.yna.co.kr/view/AEN20261102006551320", "fonte_id": "yonhap_news", "data_pub": "2026-11-02T07:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A POSCO Holdings, maior empresa de siderúrgica da Coreia do Sul, registrou uma queda de 1,8% no lucro líquido no terceiro trimestre, devido a preços menores do litio.", "titulo_pt": "Lucro líquido da POSCO Holdings cai 1,8% no terceiro trimestre devido a preços mais baixos do litio", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 240330, "titulo": "Renault Korea's sales drop 23.6 pct in Oct. on weak demand", "url": "https://en.yna.co.kr/view/AEN20261102009300320", "fonte_id": "yonhap_news", "data_pub": "2026-11-02T07:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas da Renault Korea, unidade sul-coreana da Renault, caíram 23,6% em outubro devido a uma demanda fraca.", "titulo_pt": "Vendas da renault Korea caem 23,6% em outubro por baixa demanda", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 240331, "titulo": "Hyundai Motor's Oct. sales fall 6.3 pct amid sluggish demand", "url": "https://en.yna.co.kr/view/AEN20261102009100320", "fonte_id": "yonhap_news", "data_pub": "2026-11-02T06:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Hyundai Motor, a maior fabricante de carros da Coreia do Sul, registrou uma queda de 6,3% nas vendas de outubro devido à demanda fraca.", "titulo_pt": "Vendas de outubro da hyundai Motor caem 6,3% devido à demanda fraca", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 240311, "titulo": "Household loans again rise in Oct. despite tightened rules, higher rates", "url": "https://www.koreaherald.com/article/10922943", "fonte_id": "korea_herald", "data_pub": "2026-11-02T06:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os empréstimos residenciais dos cinco principais bancos sul-coreanos aumentaram em outubro, contrariando as expectativas de que as regras mais rígidas e os juros mais altos reduziriam o volume de empréstimos. Os empréstimos residenciais totais dessas instituições chegaram a 783,6 trilhões de wones, uma elevação de 2,77 trilhões de wones em comparação com o mês anterior.", "titulo_pt": "Empréstimos domiciliários crescem em outubro apesar de regras mais rígidas e juros mais altos", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 240314, "titulo": "From Samsung to Toss: Why Korean finance is betting on Japan", "url": "https://www.koreaherald.com/article/10922931", "fonte_id": "korea_herald", "data_pub": "2026-11-02T06:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas financeiras sul-coreanas como Mirae Asset, Hanwha e Toss estão acelerando suas investidas no mercado japonês, planejando adquirir corretoras locais nas próximas semanas. Essas aquisições refletem o interesse crescente na economia financeira japonesa, motivado pelo aumento da investimento dos consumidores e pelas reformas nos mercados de capitais promovidas pelo governo japonês.", "titulo_pt": "De Samsung a Toss: por que o financiamento sul-coreano está apostando no Japão", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 239925, "titulo": "Calendário de leilões tem mais de 300 imóveis à venda nesta semana; veja oportunidades", "url": "https://exame.com/mercado-imobiliario/calendario-de-leiloes-tem-mais-de-300-imoveis-a-venda-nesta-semana-veja-oportunidades/", "fonte_id": "exame", "data_pub": "2026-11-02T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Haverá leilões com mais de 300 imóveis à venda entre os dias 1º e 7 de novembro, com lance inicial a partir de R$ 25 mil. O calendário inclui casas, apartamentos e terrenos.", "titulo_pt": "Calendário de leilões desta semana tem mais de 300 imóveis à venda; lance a partir de r$ 25 mil", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 240242, "titulo": "Will Chinese AI build a global advantage?", "url": "https://www.japantimes.co.jp/commentary/2026/11/02/japan/chinese-builds-ai-global-advantage/", "fonte_id": "japan_times", "data_pub": "2026-11-02T09:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desenvolvidos não estão necessariamente escolhendo lados na disputa entre AI chinesa e global. Eles buscam preços competitivos, transferência de tecnologia, empregos e soberania de dados.", "titulo_pt": "AI chinesa construirá vantagem global?", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 240229, "titulo": "Global AI sell-off eases after Nasdaq’s worst month in over a year", "url": "https://www.ft.com/content/d7fe99f8-d292-4cb5-a8fd-45be0f8cc2b3?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-02T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações tecnológicas dos EUA devem iniciar a semana em alta após uma forte queda no Nasdaq, que foi o pior mês do índice em mais de um ano.", "titulo_pt": "Venda de AI global alivia após o pior mês do Nasdaq em mais de um ano", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 240337, "titulo": "The agentic web is here", "url": "https://www.technologyreview.com/2026/11/02/1147846/the-agentic-web-is-here/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-02T09:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2001, Tim Berners-Lee, inventor da World Wide Web, propôs uma nova visão chamada 'Web Sintática', em um artigo publicado na Scientific American, junto com dois colegas. Este modelo visa uma internet que possa ser explorada por agentes autônomos de software que atenderiam às nossas necessidades.", "titulo_pt": "A web agente chegou", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 240372, "titulo": "European tech weekly recap: Over €1.3B invested across 60+ deals", "url": "https://tech.eu/2026/11/02/european-tech-weekly-recap-over-eur13b-invested-across-60-deals/", "fonte_id": "tech_eu", "data_pub": "2026-11-02T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No último ano, foram registradas mais de 60 transações de financiamento tecnológico com valor superior a 1,3 bilhão de euros e mais de 10 saídas, transações de aquisição e notícias relacionadas em toda a Europa. Os três principais setores envolvidos foram destacados.", "titulo_pt": "Resumo semanal europeu de tecnologia: mais de 1,3 bilhão investidos em mais de 60 acordos", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 240243, "titulo": "More companies seeking cyber insurance following high-profile data breaches", "url": "https://www.japantimes.co.jp/business/2026/11/02/companies/cyber-security-insurance-policies/", "fonte_id": "japan_times", "data_pub": "2026-11-02T08:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais empresas estão buscando seguros cibernéticos após incidentes de vazamento de dados notáveis. Esses seguros normalmente cobrem os custos de rastrear a origem dos vazamentos e indenizações, mas não incluem o pagamento de resgates para atacantes cibernéticos.", "titulo_pt": "Mais empresas buscam seguros cibernéticos após vazamentos de dados notáveis", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 240347, "titulo": "AI, geopolitics make Taiwan Thailand's third-largest trade partner in 1H26", "url": "https://www.digitimes.com/news/a20261102PD231/taiwan-2026-fdi-investment-growth.html", "fonte_id": "digitimes", "data_pub": "2026-11-02T08:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2026, Taiwan se tornou o terceiro maior parceiro comercial da Tailândia, devido ao crescimento da inteligência artificial e aos movimentos geopolíticos que aceleraram a investimento taiwanês no país. Atualmente, aproximadamente 200.000 empresários taiwaneses estão estabelecidos na Tailândia, com o ritmo das investidas acelerando sob a tendência China+1.", "titulo_pt": "Taiwan se torna o terceiro maior parceiro comercial da tailândia no primeiro semestre de 2026", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 240245, "titulo": "GMO execs apologize for inadequate response to cyberattacks", "url": "https://www.japantimes.co.jp/news/2026/11/02/japan/gmo-news-conference-kumagai/", "fonte_id": "japan_times", "data_pub": "2026-11-02T08:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO Masatoshi Kumagai se retratou publicamente sobre falhas na empresa durante sua primeira apresentação pública desde que ela se envolveu em uma escândalo de vazamento de dados massivo.", "titulo_pt": "Executivos da GMO se retratam por resposta insuficiente a ataques cibernéticos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 240348, "titulo": "US backs Anderon, GF quantum foundries as Intel targets QPUs with 18A process", "url": "https://www.digitimes.com/news/a20261102PD228/intel-globalfoundries-funding-manufacturing-policy.html", "fonte_id": "digitimes", "data_pub": "2026-11-02T08:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Comércio dos Estados Unidos está utilizando financiamento federal e iniciativas de políticas para fortalecer a competitividade global dos Estados Unidos na tecnologia quântica. A estratégia central envolve apoiar plataformas de fabricação compartilhada através de subsídios públicos e participação acionária do governo, visando consolidar a demanda industrial fragmentada.", "titulo_pt": "EUA apoiam anderson e GF para fábricas quantímidas enquanto Intel almeja QPUs com processo 18A", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 240373, "titulo": "Marble raises $3.75M to build AI coworkers that learn by watching", "url": "https://tech.eu/2026/11/02/marble-raises-375m-to-build-ai-coworkers-that-learn-by-watching/", "fonte_id": "tech_eu", "data_pub": "2026-11-02T08:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup Marble Cognition, que desenvolve colegas de trabalho de inteligência artificial que aprendem observando, levantou $3,75 milhões em uma rodada de financiamento pré-série co-ledida por Heartcore e Seedcamp, com a participação de investidores anjos, incluindo um membro do conselho de_datadog.", "titulo_pt": "Marble arrecada $3,75 milhões para construir colegas de trabalho de IA que aprendem observando", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 240349, "titulo": "Jinpao taps robotics contest to deepen Thailand ties, develop AI talent", "url": "https://www.digitimes.com/news/a20261102PD233/talent-competition-automation-education-smart-manufacturing.html", "fonte_id": "digitimes", "data_pub": "2026-11-02T08:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A filial tailandesa da Jinpao Precision Industry, em parceria com autoridades locais, realizou o final da competição de automação e robótica Jinpao–Praksa em 31 de outubro, com o objetivo de desenvolver talentos em IA e fabricação inteligente localmente. O presidente Chung Kuo-sung enfatizou a importância de uma participação de carreira na comunidade local, em vez de doações pontuais.", "titulo_pt": "Jinpao participa de competição de robótica para fortalecer laços na tailândia e desenvolver talentos em IA", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 240273, "titulo": "As BYD and Geely hit sales highs, pressure mounts on China’s smaller carmakers", "url": "https://www.scmp.com/business/china-business/article/3372948/byd-and-geely-hit-sales-highs-pressure-mounts-chinas-smaller-carmakers", "fonte_id": "scmp", "data_pub": "2026-11-02T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "BYD e Geely Auto, as duas maiores fabricantes de carros da China, registraram seus melhores volumes de vendas mensais em outubro, contrariando uma tendência de queda no maior mercado automotivo do mundo. Com isso, as pequenas concorrentes enfrentam crescente pressão para gerar lucro.", "titulo_pt": "BYD e Geely atingem picos de vendas, aumentando pressão sobre fabricantes menores da China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 240374, "titulo": "Sortrace lands $800K to improve waste sorting with AI-powered analysis", "url": "https://tech.eu/2026/11/02/sortrace-lands-800k-to-improve-waste-sorting-with-ai-powered-analysis/", "fonte_id": "tech_eu", "data_pub": "2026-11-02T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa estabelecida em Estocolmo, Sortrace, que desenvolve tecnologia de análise de resíduos com inteligência artificial, levantou aproximadamente $800,000 em uma rodada de financiamento liderada pela Almi Invest, com a participação da Antler e da Gorilla.", "titulo_pt": "Sortrace arrecada cerca de 800 mil dólares para melhorar o processo de separação de resíduos com auxílio de inteligência artificial", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 240350, "titulo": "Murata to invest JPY1 trillion in expanding MLCC capacity across Asia plants", "url": "https://www.digitimes.com/news/a20261102VL214/murata-mlcc-capacity-asia-demand.html", "fonte_id": "digitimes", "data_pub": "2026-11-02T07:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Murata Manufacturing planeja investir aproximadamente 1 trilhão de ienes (US$6,3 bilhões) para expandir a capacidade de capacitores multilayer ceramic (MLCC) em suas fábricas na Ásia até 2030. A demanda crescente de data centers e aplicações de inteligência artificial está impulsionando as encomendas para fabricantes de MLCCs, que são componentes cruciais para gerenciar a demanda por energia.", "titulo_pt": "Murata investirá 1 trilhão de ienes para expandir capacidade de MLCC em fábricas asiáticas", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 240324, "titulo": "(2nd LD) Seoul stocks rebound over 2 pct on bargain hunting", "url": "https://en.yna.co.kr/view/AEN20261102007652320", "fonte_id": "yonhap_news", "data_pub": "2026-11-02T07:45:00Z", "idioma": "en", "provavel_duplicata_de": 240304, "texto_pt": "As ações de Seul se recuperaram, encerrando o dia com alta superior a 2%. O mercado registrou esse ganho devido a compras de ações a preços atraentes.", "titulo_pt": "Seul registra alta superior a 2% em sessão de compra de ações", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 240351, "titulo": "Denso sees profits hit by memory costs, seeks price pass-through", "url": "https://www.digitimes.com/news/a20261102PD227/denso-auto-components-profit-2026.html", "fonte_id": "digitimes", "data_pub": "2026-11-02T07:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Denso, maior fabricante de peças automotivas do Japão, registrou lucros decrescentes para a primeira metade da fiscal de 2026 devido aos aumentos de custos de memória e outros componentes, em parte impulsionados pelo boom da IA. A empresa planeja passar alguns custos para os clientes quando necessário e garantir suprimentos através de contratos a longo prazo.", "titulo_pt": "Denso vê lucros afetados por custos de memória, busca passagem de custos", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 240325, "titulo": "GM Korea's Oct. sales jump 26.6 pct on strong exports", "url": "https://en.yna.co.kr/view/AEN20261102010700320", "fonte_id": "yonhap_news", "data_pub": "2026-11-02T07:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas de outubro da GM Korea, unidade sul-coreana da General Motors, aumentaram 26,6% em comparação com o mesmo mês do ano anterior, principalmente devido a uma forte exportação.", "titulo_pt": "Vendas de outubro da GM Korea saltam 26,6% devido a fortes exportações", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 240341, "titulo": "Are you pursuing MRT as a treatment for infertility?", "url": "https://www.statnews.com/2026/11/02/mrt-fertility-treatment-advanced-maternal-age-three-parent-ivf-reader-callout/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-02T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A STAT está buscando feedback de pessoas que estão considerando ou já estão utilizando a terapia de regeneração muscular (MRT) como tratamento para infertilidade.", "titulo_pt": "Você está usando MRT como tratamento para infertilidade?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 240342, "titulo": "STAT+: Coming readout of Kymera eczema trial is a high-stakes moment in a bid to rival Dupixent", "url": "https://www.statnews.com/2026/11/02/kymera-therapeutics-trial-results-eczema-dupixent-rival/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-02T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores e médicos aguardam ansiosamente os resultados intermediários de uma terapia experimental Kymera que tem potencial para rivalizar com o Dupixent. Este momento é de alto risco e importância para a empresa.", "titulo_pt": "Saída dos resultados do ensaio de eczema Kymera é um momento de alto risco na tentativa de rivalizar com o Dupixent", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 240343, "titulo": "Opinion: Cancer patients are often pressured to end a pregnancy early. They shouldn’t be", "url": "https://www.statnews.com/2026/11/02/pregnant-cancer-patients-abortion-early-labor-research/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-02T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Câncer não deve levar a pressão para interromper uma gravidez prematuramente, de acordo com um especialista em medicina materno-fetal. Mulheres podem ser tratadas seguramente para muitos tipos de câncer durante a gravidez.", "titulo_pt": "Opinião: pacientes com câncer não devem ser pressionadas a interromper uma gravidez prematuramente", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 240344, "titulo": "Opinion: The economics of the U.S. health care system are broken", "url": "https://www.statnews.com/2026/11/02/american-health-care-costs-broken-economics-solutions/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-02T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Paul Markovich, presidente e CEO da Ascendiun, afirma que o sistema de saúde dos Estados Unidos tem problemas econômicos.", "titulo_pt": "A economia do sistema de saúde dos estados unidos está quebrada", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 240345, "titulo": "Women travel thousands of miles for a reproductive moonshot. Scientists say they’ve been misled", "url": "https://www.statnews.com/2026/11/02/three-parent-ivf-fertility-tourism-investigation-mrt-therapy/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-02T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma técnica inovadora de fertilização in vitro para reduzir o risco de crianças herdar doenças mitocondriais está sendo comercializada como um procedimento de fertilização para mulheres mais velhas, apesar da falta de evidências de sua eficácia.", "titulo_pt": "Mulheres viajam milhares de quilômetros para uma jornada reprodutiva. Cientistas dizem que foram enganadas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 240004, "titulo": "La vacuna que desencadenó respuestas inmunitarias en el 99% de pacientes con cáncer de páncreas", "url": "https://www.latercera.com/tendencias/noticia/la-vacuna-que-desencadeno-respuestas-inmunitarias-en-el-99-de-pacientes-con-cancer-de-pancreas/", "fonte_id": "la_tercera", "data_pub": "2026-11-02T09:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma vacina experimental está sendo testada para ajudar o organismo a identificar as mutações que alimentam um dos cânceres mais difíceis de tratar, o câncer de pâncreas. Os resultados do ensaio clínico indicaram que a vacina gera respostas imunológicas em 99% dos pacientes com câncer de pâncreas.", "titulo_pt": "Vacina experimental gera respostas imunológicas em 99% dos pacientes com câncer de pâncreas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 240005, "titulo": "Crean una nueva píldora de GLP-1 que genera un 12% de pérdida de peso en solo 36 semanas, según un ensayo clínico", "url": "https://www.latercera.com/tendencias/noticia/crean-una-nueva-pildora-de-glp-1-que-genera-un-12-de-perdida-de-peso-en-solo-36-semanas-segun-un-ensayo-clinico/", "fonte_id": "la_tercera", "data_pub": "2026-11-02T09:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um novo medicamento, administrado oralmente, está em desenvolvimento para o tratamento da obesidade e apresentou resultados promissores em um ensayo clínico, gerando uma perda de peso de 12% em 36 semanas.", "titulo_pt": "Cientistas criam nova pílula de GLP-1 que promete 12% de perda de peso em 36 semanas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 239825, "titulo": "Dinossauro do tamanho de peru é apontado como o 1º a consumir frutas", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/dinossauro-do-tamanho-de-peru-e-apontado-como-o-1o-a-consumir-frutas.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-02T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram fósseis de um dinossauro do tamanho de um peru, sem dentes e com uma cabeça semelhante a de um papagaio, que era especializado em uma dieta de frutas. O achado foi publicado na revista Nature Communications em 10 de fevereiro de 2026.", "titulo_pt": "Dinossauro do tamanho de peru é apontado como o primeiro a consumir frutas", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 240382, "titulo": "The scientific truth about collagen supplements", "url": "https://www.newscientist.com/article/2596816-the-scientific-truth-about-collagen-supplements/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-02T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Suplementos de colágeno são frequentemente usados para reduzir as rugas, pois o corpo utiliza colágeno para dar força e elasticidade à pele. No entanto, a colunista Alice Klein demonstra que a situação não é tão simples quanto isso.", "titulo_pt": "A verdade científica sobre suplementos de colágeno", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 240255, "titulo": "Is science possible without scientists?", "url": "https://www.japantimes.co.jp/commentary/2026/11/02/world/science-without-scientists/", "fonte_id": "japan_times", "data_pub": "2026-11-02T06:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sistemas que geram e testam suas próprias hipóteses e escrevem os resultados não são mais apenas uma suposição teórica.", "titulo_pt": "É possível a ciência sem cientistas?", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 240390, "titulo": "'The Sea God Surveys': Watch Rocket Lab launch Japanese Earth-observing satellite today", "url": "https://www.space.com/space-exploration/launches-spacecraft/rocket-lab-electron-launch-sea-god-surveys-iqps-radar-satellite", "fonte_id": "space_com", "data_pub": "2026-11-02T06:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Rocket Lab realizará sua 99ª missão, lançando um satélite de observação terrestre privado japonês para a órbita hoje, 2 de novembro. O público pode assistir ao lançamento ao vivo.", "titulo_pt": "Deus do mar da terra vigia: assista ao lançamento da Rocket Lab com satélite japonês hoje", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 240380, "titulo": "APOD: 2026 November 2 – A Long Cloud on Mars", "url": "https://science.nasa.gov/image-article/apod-2026-november-2-a-long-cloud-on-mars/", "fonte_id": "nasa_news", "data_pub": "2026-11-02T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia do APOD em 2 de novembro de 2026 mostra uma longa nuvem em Marte. A imagem foi escolhida por um astrônomo profissional para destacar um aspecto interessante do cosmos.", "titulo_pt": "APOD: 2 de novembro de 2026 – uma nuvem longa em marte", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 240381, "titulo": "Pennsylvania’s Grand Canyon", "url": "https://science.nasa.gov/earth/earth-observatory/pennsylvanias-grand-canyon/", "fonte_id": "nasa_news", "data_pub": "2026-11-02T05:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pine Creek Gorge, conhecido como o Grand Canyon da Pensilvânia, forma um profundo vale no Allegheny Plateau durante as tonalidades douradas do outono.", "titulo_pt": "Pensilvânia Canyon", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 240290, "titulo": "Chinese scientists found giant ‘chimneys’ in deep water that could alter submarine warfare", "url": "https://www.scmp.com/news/china/science/article/3372663/chinese-scientists-found-giant-chimneys-deep-water-could-alter-submarine-warfare", "fonte_id": "scmp", "data_pub": "2026-11-02T03:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas chineses mapearam correntes de energia subaquática que se estendem por milhares de metros até o leito do mar, descobrindo estruturas chamadas 'chaminés inertiais'. Essa descoberta pode auxiliar no apoio acústico submarino para detecção marítima e comunicação.", "titulo_pt": "Cientistas chineses encontram gigantes 'chaminés' submarinas que podem alterar a guerra submarina", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 240346, "titulo": "Global sexual health: Why communal knowledge about pleasure and well-being matters", "url": "https://phys.org/news/2026-10-global-sexual-health-communal-knowledge.html", "fonte_id": "phys_org", "data_pub": "2026-11-02T01:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Discussões e decisões sobre acesso a anticoncepcional, aborto, cuidados maternos, prevenção e tratamento do HIV, educação sexual abrangente, equidade de gênero e proteção contra violência sexual têm, por décadas, sido predominantemente direcionadas de países do Norte para países do Sul.", "titulo_pt": "Saúde sexual global: por que o conhecimento comunitário sobre prazer e bem-estar importa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 240340, "titulo": "Measles made a stealthy return as another virus took the spotlight", "url": "https://www.nature.com/articles/d41586-026-03387-3", "fonte_id": "nature_news", "data_pub": "2026-11-02T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As taxas de vacinação contra a rubéola diminuíram após a pandemia de COVID-19 interromper os programas de saúde pública e seus financiamentos. A rubéola retornou de forma silenciosa enquanto outra doença viral ganhou mais atenção.", "titulo_pt": "Rubéola retornou silenciosamente enquanto outra doença viral ganhou destaque", "veiculo": "Nature News", "pais": "Reino Unido", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 240412, "titulo": "10 Great Nonfiction Titles to Read in November", "url": "https://lithub.com/10-great-nonfiction-titles-to-read-in-november/", "fonte_id": "lithub", "data_pub": "2026-11-02T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este mês oferece uma variedade de excelentes novos livros não-ficcionais, incluindo trabalhos de Hermione Lee, Orlando Swain, Sarah Haas e outros. Um dos títulos é 'O Vôo da Morte: Veneno, Plunder e a Busca por um Medicamento Milagroso na Amazônia', de Matt O’Hara, que explora a história de 1938 envolvendo doenças e busca por medicamentos na Amazônia.", "titulo_pt": "10 Ótimos títulos não-ficcionais para ler em novembro", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 240413, "titulo": "Glass Skulls, Luminosity, Soup, and Other Miracles: New Poetry to Read This November", "url": "https://lithub.com/glass-skulls-luminosity-soup-and-other-miracles-new-poetry-to-read-this-november/", "fonte_id": "lithub", "data_pub": "2026-11-02T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O título em português seria 'Cascos de Vidro, Luminosidade, Sopa e Outros Milagres: Nova Poesia para Ler em Novembro'. O texto indica que a poesia de Malgorzata Lebda, traduzida por Mira Rosenthal, aborda temas como movimento contra a perda e pensamentos de outono no verão, além de fazer referência a apostas feitas com o próprio corpo.", "titulo_pt": "Cascos de vidro, luminosidade, sopa e outros milagres: nova poesia para ler em novembro", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 240414, "titulo": "Vampiric Broodmothers, Gig-Economy Ghosts, and Medieval Abortionists: November’s Best Sci-Fi and Fantasy Books", "url": "https://lithub.com/vampiric-broodmothers-gig-economy-ghosts-and-medieval-abortionists-novembers-best-sci-fi-and-fantasy-books/", "fonte_id": "lithub", "data_pub": "2026-11-02T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor está em uma região que desfruta de belas folhas caídas no outono e, inspirado por essa paisagem, apresenta uma seleção de livros de ficção científica e fantasia do mês de novembro. Estes livros são descritos como coloridos e abrangentes, prontos para serem lidos.", "titulo_pt": "Vampiras mães de criação, fantasmas do Gig-Economy e abortistas médievais: os melhores livros de ficção científica e fantasia de novembro", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 240415, "titulo": "The Ghostly and the Real: On Spirit Worlds in African Literature", "url": "https://lithub.com/the-ghostly-and-the-real-on-spirit-worlds-in-african-literature/", "fonte_id": "lithub", "data_pub": "2026-11-02T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em muitas tradições literárias africanas, as fronteiras entre os vivos e os mortos, o visível e o invisível, são fluidas e não fixas. Ancestrais, espíritos, sonhos e mitos não são apenas dispositivos fantásticos, mas são fatos comuns da realidade vivida.", "titulo_pt": "O fantasmagórico e o Real: sobre mundos espirituais na literatura africana", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 240416, "titulo": "Tough Days and Good Laughs: 10 New Children’s Books Out This November", "url": "https://lithub.com/tough-days-and-good-laughs-10-new-childrens-books-out-this-november/", "fonte_id": "lithub", "data_pub": "2026-11-02T09:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este livro apresenta dez novos livros infantis lançados em novembro. Os autores observam que, quando os filhos estão passando por momentos difíceis, eles preferem ficar sozinhos do que receberem conforto de uma mãe bem-intencionada.", "titulo_pt": "Dias difficilinhos e boas rirrinhas: 10 novos livros infantis saindo em novembro", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 240417, "titulo": "This Week in Literary History: Sinclair Lewis Wins the Nobel Prize in Literature", "url": "https://lithub.com/this-week-in-literary-history-sinclair-lewis-wins-the-nobel-prize-in-literature/", "fonte_id": "lithub", "data_pub": "2026-11-02T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sinclair Lewis recebeu o Prêmio Nobel de Literatura em 5 de novembro de 1930 'por seu vigoroso e vívido estilo de descrição e por sua habilidade em criar, com graça e humor, personagens e situações.'", "titulo_pt": "Esta semana na história literária: sinclair Lewis recebe o prêmio Nobel de literatura", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 240387, "titulo": "Solid cork forms walls of pavilion dedicated to silence at Casa No Tempo in Alentejo", "url": "https://www.dezeen.com/2026/11/02/still-room-casa-no-tempo-corkinho/", "fonte_id": "dezeen", "data_pub": "2026-11-02T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Corkinho lançou uma nova estrutura, chamada de 'still room', que é um pavilhão com paredes feitas de cortiça sólida. O pavilhão está instalado em um vilarejo de férias projetado por Manuel Aires Mateus, em Alentejo, Portugal.", "titulo_pt": "Cortiça sólida forma paredes de pavilhão dedicado ao silêncio em Casa No Tempo, Alentejo", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 240403, "titulo": "For Alex Rorison, photographs are physical objects to be played with – not just “pixels on a screen”", "url": "https://www.itsnicethat.com/articles/alex-rorison-photography-discover-021126", "fonte_id": "its_nice_that", "data_pub": "2026-11-02T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alex Rorison cria fotografias de moda e produtos com uma sensação mais tátil e menos estéril, tratando a disciplina mais como impressão, vendo as imagens como superfícies para algo mais.", "titulo_pt": "Para Alex Rorison, as fotografias são objetos físicos para serem manipulados – não apenas 'pixels na tela'", "veiculo": "It's Nice That", "pais": "Reino Unido", "classe": "B"}, {"id": 240404, "titulo": "Why Nothing’s Charlie Smith is doubling down on “joy and wonder”", "url": "https://www.itsnicethat.com/features/in-house-nothing-charlie-smith-creative-industry-021126", "fonte_id": "its_nice_that", "data_pub": "2026-11-02T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Charlie Smith, ex-CMO da Loewe, está empenhado em revitalizar a percepção positiva da tecnologia e acredita que as melhores marcas sabem como entretê-lo.", "titulo_pt": "Por que nothing's Charlie Smith está apostando em 'alegria e maravilha'", "veiculo": "It's Nice That", "pais": "Reino Unido", "classe": "B"}, {"id": 240405, "titulo": "“It’s not their experience versus your academia”", "url": "https://www.itsnicethat.com/articles/creative-career-condundrums-if-you-could-jobs-advice-021126", "fonte_id": "its_nice_that", "data_pub": "2026-11-02T09:00:00Z", "idioma": "en", "provavel_duplicata_d tps://veja.abril.com.br/mundo/estudantes-franceses-retomarao-bloqueios-apos-rejeitarem-medidas-do-governo/", "fonte_id": "veja", "data_pub": "2026-11-01T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudantes franceses planejam retomar bloqueios em escolas após rejeitarem as medidas do governo. O presidente Emmanuel Macron pediu que as aulas sejam retomadas normalmente.", "titulo_pt": "Estudantes franceses retomarão bloqueios após rejeitarem medidas do governo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 239095, "titulo": "Dados do SUS não são mercadoria, mas também não são intocáveis", "url": "https://www.jota.info/opiniao-e-analise/artigos/dados-do-sus-nao-sao-mercadoria-mas-tambem-nao-sao-intocaveis", "fonte_id": "jota", "data_pub": "2026-11-01T17:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A recomendação do Conselho Nacional de Saúde (CNS) aborda a questão dos dados do Sistema Único de Saúde (SUS), indicando que esses dados não devem ser comercializados, mas também não devem ser considerados inaccessíveis. O documento antecipa um debate que determinará o limite entre a pesquisa legítima e a monetização dos dados.", "titulo_pt": "Dados do SUS não são mercadoria, mas também não são intocáveis", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 238878, "titulo": "Binance retoma saques após ataque hacker que provocou rombo de US$ 6,3 bilhões", "url": "https://veja.abril.com.br/economia/binance-retoma-saques-apos-ataque-hacker-que-provocou-rombo-de-us-63-bilhoes/", "fonte_id": "veja", "data_pub": "2026-11-01T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": 238844, "texto_pt": "A Binance retomou os saques após um ataque hacker que causou um prejuízo de 6,3 bilhões de dólares. A corretora havia suspendido os saques na sexta-feira para conter o avanço dos hackers.", "titulo_pt": "Binance retoma saques após ataque hacker que provocou rombo de 6,3 bilhões", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 239330, "titulo": "6 dead, dozens injured in Halloween weekend gun violence across US", "url": "https://www.scmp.com/news/world/united-states-canada/article/3372906/4-dead-15-injured-3-separate-shootings-dallas-texas-halloween-night-police-say", "fonte_id": "scmp", "data_pub": "2026-11-01T17:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante o fim de semana de Halloween, ocorreram tiroteios em várias cidades dos Estados Unidos, resultando em pelo menos seis mortes e dezenas de feridos. Em Dallas, o local mais violento, quatro pessoas morreram e 15 ficaram feridas após um grupo de tiroteios em uma área da cidade conhecida por seus bares, restaurantes e vida noturna.", "titulo_pt": "6 Mortos, dezenas feridos em violência armada no fim de semana de Halloween por todo o país", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 239865, "titulo": "Clima: feriado de Finados terá temporais em diferentes regiões do Brasil", "url": "https://www.metropoles.com/brasil/feriado-finados-sera-chuva-tempestades-parte-brasil", "fonte_id": "metropoles", "data_pub": "2026-11-02T09:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Inmet emitiu alertas de perigo e perigo potencial para diferentes regiões do Brasil, com previsão de chuvas e baixa umidade do ar durante o feriado de Finados.", "titulo_pt": "Feriado de Finados terá temporais em diferentes regiões do Brasil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 239898, "titulo": "Ebola tem letalidade de 52% na República Democrática do Congo", "url": "https://www.cnnbrasil.com.br/internacional/ebola-tem-letalidade-de-52-na-republica-democratica-do-congo/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-02T09:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O surto de Ebola na República Democrática do Congo, causado pelo vírus Ebola Bundibugyo, te
