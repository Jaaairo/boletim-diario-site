ndia: 'se você nascer pobre, seria melhor não nascer'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 286218, "titulo": "In land mine-ravaged Myanmar, a rebel with an artificial leg vows to fight on", "url": "https://www.japantimes.co.jp/news/2026/11/25/asia-pacific/myanmar-landmine-artificial-leg/", "fonte_id": "japan_times", "data_pub": "2026-11-25T02:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um comandante de pelotão de 28 anos, chamado Pee Litt, que tem pernas artificiais, declarou que pode viver sem pernas, mas não pode viver sob o domínio militar em Myanmar. Ele se comprometeu a continuar a luta.", "titulo_pt": "Em Myanmar, rebeldes com pernas artificiais prometem continuar a luta", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 285763, "titulo": "‘Foi um fracasso, nós regredimos’, diz Marina Silva sobre resultado da COP 31", "url": "https://veja.abril.com.br/agenda-verde/foi-um-fracasso-nos-regredimos-diz-marina-silva-sobre-resultado-da-cop-31/", "fonte_id": "veja", "data_pub": "2026-11-25T00:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marina Silva declarou que a COP 31 foi um fracasso e que a conferência paralisou compromissos climáticos anteriormente assumidos.", "titulo_pt": "Fracasso na COP 31, afirma Marina Silva", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 285824, "titulo": "Chile: Sindicato dos professores inicia marcha contra cortes no orçamento da educação para 2027", "url": "https://www.brasildefato.com.br/2026/11/24/chile-sindicato-dos-professores-inicia-marcha-contra-cortes-no-orcamento-da-educacao-para-2027/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-24T22:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Sindicato dos Professores do Chile realizou uma marcha em Santiago para protestar contra os cortes no orçamento da educação previstos na Lei Orçamentária de 2027. O evento foi autorizado pela Delegação Presidencial.", "titulo_pt": "Chile: sindicato dos professores inicia marcha contra cortes no orçamento da educação para 2027", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 285164, "titulo": "Ladrão rende e assalta adolescentes em pilotis de prédio na Asa Norte", "url": "https://www.metropoles.com/distrito-federal/ladrao-rende-e-assalta-adolescentes-em-pilotis-de-predio-na-asa-norte", "fonte_id": "metropoles", "data_pub": "2026-11-24T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ladrão rendeu e assaltou adolescentes em pilotis de um prédio na Asa Norte. Os ladrões levaram documentos pessoais, cartão bancário e uma carteirinha de sócio de um clube de uma das vítimas.", "titulo_pt": "Ladrão rende e assalta adolescentes em pilotis de prédio na Asa Norte", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 285512, "titulo": "Brazil doctor uses surfboard and sledgehammer in flood rescue", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/24/brazil-doctor-uses-surfboard-and-sledgehammer-in-flood-rescue?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-24T20:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um médico brasileiro está sendo considerado um herói após resgatar um idoso durante inundações usando uma prancha de surfe. O resgate ocorreu durante uma situação de alagamento severo.", "titulo_pt": "Médico brasileiro resgata idoso com prancha de surfe durante inundações", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 285153, "titulo": "Facas, tesouras e estiletes: PM apreende 34 mil objetos cortantes no centro de SP", "url": "https://veja.abril.com.br/brasil/facas-tesouras-e-estiletes-pm-apreende-34-mil-objetos-cortantes-no-centro-de-sp/", "fonte_id": "veja", "data_pub": "2026-11-24T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Militar apreendeu 34 mil objetos cortantes, incluindo facas, tesouras e estiletes, durante uma operação no centro de São Paulo. A lista da operação também menciona serrotes, alicates, chaves de fenda e socos ingleses.", "titulo_pt": "Facas, tesouras e estiletes: PM apreende 34 mil objetos cortantes no centro de SP", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 285756, "titulo": "Por que as negociações climáticas travaram na COP31 e foram um ‘fracasso’, segundo Marina Silva", "url": "https://veja.abril.com.br/agenda-verde/por-que-as-negociacoes-climaticas-travaram-na-cop31-e-foram-um-fracasso-segundo-marina-silva/", "fonte_id": "veja", "data_pub": "2026-11-25T09:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As negociações climáticas na COP31 ficaram paralisadas devido a impasses entre grandes potências e bloqueios em temas centrais, resultando em um 'fracasso' conforme declarou Marina Silva.", "titulo_pt": "Por que as negociações climáticas na COP31 travaram e foram um ‘fracasso’, segundo Marina Silva", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 285797, "titulo": "Clima: ciclone extratropical avança pelo Sul e provoca nova frente fria", "url": "https://www.metropoles.com/brasil/clima-ciclone-extratropical-avanca-pelo-sul-e-provoca-nova-frente-fria", "fonte_id": "metropoles", "data_pub": "2026-11-25T09:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Inmet prevê chuvas fortes em áreas do Sul, Sudeste e Centro-Oeste do Brasil. No Nordeste, o calor pode chegar a 41°C.", "titulo_pt": "Ciclone extratropical avança pelo Sul e provoca nova frente fria, com chuvas fortes e calor no nordeste", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 286018, "titulo": "Large bushfire threatens homes and properties on remote island off Tasmania", "url": "https://www.theguardian.com/australia-news/2026/nov/25/large-bushfire-threatens-homes-and-properties-on-remote-island-off-tasmania", "fonte_id": "guardian_world", "data_pub": "2026-11-25T09:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio florestal em Flinders Island, uma ilha remota no Estreito de Bass, ameaça casas e propriedades após se expandir significativamente devido a descargas de relâmpagos. O fogo já lançou cinzas por centenas de quilômetros para o sul.", "titulo_pt": "Grande incêndio ameaça casas e propriedades em ilha remota ao largo de Tasmania", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 285904, "titulo": "Polémica por la venta de tierras frente al glaciar Perito Moreno a un magnate árabe que quiere construir un hotel de lujo", "url": "https://www.clarin.com/sociedad/polemica-venta-tierras-frente-glaciar-perito-moreno-magnate-arabe-quiere-construir-hotel-lujo_0_msTiB8tDq7.html", "fonte_id": "clarin", "data_pub": "2026-11-25T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governador Claudio Vidal autorizou, por decreto excepcional, a compra de terras para um empresário emirata que deseja construir um hotel de luxo na área protegida do Parque Nacional Los Glaciares, frente ao glaciar Perito Moreno. Um juiz suspendeu a transferência da propriedade e encaminhou o caso para a Corte Suprema.", "titulo_pt": "Polêmica por venda de terras frente ao glaciar Perito Moreno a magnata árabe que quer construir hotel de luxo", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 286166, "titulo": "Rescuers search for dozens trapped in flooded Indonesia gold mine", "url": "https://www.aljazeera.com/news/2026/11/25/rescuers-search-for-dozens-trapped-in-flooded-indonesia-gold-mine?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-25T08:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Polícia informa que 26 trabalhadores ainda estão presos em uma mina de ouro inundada após a transbordamento de um rio próximo devido a chuvas intensas.", "titulo_pt": "Resgatistas buscam trabalhadores em mina de ouro inunda em indonésia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 284971, "titulo": "CB Live: Carbon Brief journalists discuss key COP31 outcomes", "url": "https://www.carbonbrief.org/cb-live-carbon-brief-journalists-discuss-key-cop31-outcomes", "fonte_id": "carbon_brief", "data_pub": "2026-11-24T17:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois do encerramento da COP31 em Antalya, Turquia, jornalistas do Carbon Brief responderam a uma série de perguntas em um CB Live. O post trata das principais saídas da COP31 discutidas pelos jornalistas.", "titulo_pt": "CB Live: jornalistas do carbon Brief discutem resultados-chave da COP31", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 284350, "titulo": "Importante logro en un tambo cordobés: redujeron 31 por ciento la emisión de metano", "url": "https://www.clarin.com/rural/importante-logro-tambo-cordobes-redujeron-31-ciento-emision-metano_0_kJackwTsos.html", "fonte_id": "clarin", "data_pub": "2026-11-24T16:56:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em um estabelecimento leiteiro na província de Córdoba, houve uma redução de 31% na emissão de metano sem afetar a produção de leite. A melhoria foi alcançada através do uso de um suplemento natural feito com compostos bioativos vegetais, como polifenóis e sapônicas.", "titulo_pt": "Importante avanço em um estabalecimento leiteiro cordobés: reduziram 31% a emissão de metano", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 284422, "titulo": "LATAM y Siemens concretan su primer acuerdo en Sudamérica para reducir las emisiones de sus viajes de negocios mediante atributos ambientales asociados a SAF", "url": "https://www.latercera.com/sustentabilidad/noticia/latam-y-siemens-concretan-su-primer-acuerdo-en-sudamerica-para-reducir-las-emisiones-de-sus-viajes-de-negocios-mediante-atributos-ambientales-asociados-a-saf/", "fonte_id": "la_tercera", "data_pub": "2026-11-24T16:50:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A LATAM e a Siemens firmaram seu primeiro acordo em Sudamérica para reduzir as emissões de gases do efeito estufa dos voos de negócios de seus funcionários através do uso de atributos ambientais associados ao SAF (Combustível de Aviação Sustentável).", "titulo_pt": "LATAM e Siemens concretizam primeiro acordo em Sudamérica para reduzir emissões de voos de negócios através de atributos ambientais de SAF", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 284972, "titulo": "COP31: Key outcomes for food, forests, oceans and nature at the UN climate talks in Antalya", "url": "https://www.carbonbrief.org/cop31-key-outcomes-for-food-forests-oceans-and-nature-at-the-un-climate-talks-in-antalya", "fonte_id": "carbon_brief", "data_pub": "2026-11-24T16:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As discussões climáticas COP31 em Antalya, Turquia, não chegaram a um acordo sobre um 'pacto' que, apesar de não fazer referência clara, abordava questões relacionadas a alimentos, florestas, oceanos e natureza.", "titulo_pt": "COP31: principais resultados para alimentos, florestas, oceanos e natureza nas negociações climáticas da ONU em Antalya", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 284229, "titulo": "Gestão Sustentável: depois de tantas COPs, confesso que não sei mais o que fazer", "url": "https://exame.com/bussola/gestao-sustentavel-depois-da-cop31-confesso-que-nao-sei-mais-o-que-fazer/", "fonte_id": "exame", "data_pub": "2026-11-24T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A COP31 falhou, demonstrando os limites da cooperação internacional e questionando a capacidade de lidar com uma crise que requer decisões coletivas.", "titulo_pt": "Gestão Sustentável: depois de tantas COPs, confesso que não sei mais o que fazer", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 283762, "titulo": "Indonesia: Search continues for workers trapped after deadly factory fire", "url": "https://www.euronews.com/video/2026/11/24/indonesia-search-continues-for-workers-trapped-after-deadly-factory-fire", "fonte_id": "euronews", "data_pub": "2026-11-24T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de mortos em decorrência de um incêndio devastador em uma fábrica de doces, a oeste de Jacarta, aumentou para 26. Operações de resgate continuam em busca de trabalhadores presos sob os escombros.", "titulo_pt": "Indonésia: busca continua por trabalhadores após incêndio fatal em fábrica", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 283359, "titulo": "Áreas de Samambaia, Santa Maria, Sobradinho 2 e Paranoá ficarão sem energia", "url": "https://www.metropoles.com/distrito-federal/areas-de-samambaia-santa-maria-sobradinho-2-e-paranoa-ficarao-sem-energia", "fonte_id": "metropoles", "data_pub": "2026-11-24T09:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Serão realizadas interrupções de energia entre 10h e 16h em áreas como Samambaia, Santa Maria, Sobradinho 2 e Paranoá, no Distrito Federal, para modernização da rede elétrica e poda de árvores.", "titulo_pt": "Áreas de Samambaia, Santa Maria, Sobradinho 2 e Paranoá ficarão sem energia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 283508, "titulo": "Fenómeno El Niño: 4 mil personas siguen sin poder volver a sus casas en Corrientes y Chaco y qué esperan para las próximas semanas", "url": "https://www.clarin.com/sociedad/fenomeno-nino-4-mil-personas-siguen-poder-volver-casas-corrientes-chaco-esperan-proximas-semanas_0_nx1rXtgOVS.html", "fonte_id": "clarin", "data_pub": "2026-11-24T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A recuperação do nível do rio Paraná é lenta devido à saturação do solo e ao alto índice de humidade. Especialistas esperam um leve aumento nos próximos dias, mas os níveis permanecerão inferiores aos de outubro.", "titulo_pt": "Phenômeno El Niño: 4 mil pessoas ainda não podem retornar às suas casas em Corrientes e Chaco e o que se espera nas próximas semanas", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 283862, "titulo": "Cop31 illustrated what’s wrong with climate finance", "url": "https://www.scmp.com/opinion/world-opinion/article/3375456/cop31-illustrated-whats-wrong-climate-finance", "fonte_id": "scmp", "data_pub": "2026-11-24T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro australiano do Clima, Chris Bowen, falou na Conferência das Nações Unidas sobre Mudanças Climáticas em Antalya, Turquia, sobre o desafio da multilateralismo em face de múltiplos crises, incluindo mudança climática, segurança energética, conflitos e demandas de energia da inteligência artificial. Ele afirmou que a cooperação internacional ainda é viável.", "titulo_pt": "Cop31 ilustrou os problemas da finança climática", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 283865, "titulo": "‘People are going to die’: Thailand’s toxic rivers, ‘zombie’ fish sow dread", "url": "https://www.scmp.com/week-asia/health-environment/article/3375587/people-are-going-die-thailands-toxic-rivers-zombie-fish-sow-dread", "fonte_id": "scmp", "data_pub": "2026-11-24T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Thais não podem mais realizar a tradição de lançar lanternas de vela nas rios durante o festival Loy Krathong em algumas regiões, devido à poluição da água. O rio Sai, em Chiang Rai, está contaminado, impedindo a realização dos rituais.", "titulo_pt": "Pessoas vão morrer: rios tóxicos e 'peixes zumbis' causam medo na tailândia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 283588, "titulo": "Campaigners urge Albanese government to reject ‘climate bomb’ coalmine expansion after Cop31", "url": "https://www.theguardian.com/australia-news/2026/nov/24/campaigners-urge-albanese-government-to-reject-climate-bomb-coalmine-expansion-after-cop31", "fonte_id": "guardian_world", "data_pub": "2026-11-24T07:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Campanhas ambientais estão pedindo ao governo Albanese que rejeite a expansão de uma mina de carvão na região de Hunter Valley, Nova Gales do Sul, que permitiria a extração adicional de 430 milhões de toneladas de carvão. Isso ocorre após uma declaração de 'linha no chão' sobre combustíveis fósseis feita por dezenas de países durante a COP31 em Turquia.", "titulo_pt": "Campanhas ambientais pedem ao governo Albanese que rejeite expansão de mina de carvão após Cop31", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 286199, "titulo": "Ebola tied to rising violence against women and girls in Congo, UNICEF says", "url": "https://www.japantimes.co.jp/news/2026/11/25/world/science-health/ebola-violence-women-congo-unicef/", "fonte_id": "japan_times", "data_pub": "2026-11-25T07:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A UNICEF associa a epidemia de Ebola a um aumento da violência contra mulheres e meninas na República Democrática do Congo. O Ebola já causou mais de 5.800 mortes desde maio.", "titulo_pt": "Ebola relacionado a aumento da violência contra mulheres e meninas na Congo, diz UNICEF", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 286250, "titulo": "Migrant who became a symbol in Trump crackdown leaves US voluntarily", "url": "https://www.scmp.com/news/world/united-states-canada/article/3375712/migrant-who-became-symbol-trump-crackdown-leaves-us-voluntarily", "fonte_id": "scmp", "data_pub": "2026-11-25T06:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kilmar Abrego Garcia, um salvadorenho que se tornou um símbolo da oposição à repressão migratória de Donald Trump, deixou voluntariamente os Estados Unidos para a Espanha. A saída de Abrego Garcia, de 31 anos, encerra um caso legal que chegou ao Supremo Tribunal dos EUA.", "titulo_pt": "Migrante que se tornou símbolo da repressão migratória de Trump deixa EUA voluntariamente", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 286313, "titulo": "Prosecutors seek lengthy prison sentences for pastor, grandmother in fatal abuse of boy", "url": "https://en.yna.co.kr/view/AEN20261125005700315", "fonte_id": "yonhap_news", "data_pub": "2026-11-25T05:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Procuradores em Cheonan, Coreia do Sul, pediram penas de prisão prolongada para um pastor e uma avó acusados de maus-tratos fatais a um menino.", "titulo_pt": "Procuradores pedem penas longas para pastor e avó em caso de maus-tratos fatais a menino", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 286208, "titulo": "Prosecutors seek death penalty for 79-year-old man over couple’s murder and arson", "url": "https://www.japantimes.co.jp/news/2026/11/25/japan/crime-legal/chiba-murder-arson-trial/", "fonte_id": "japan_times", "data_pub": "2026-11-25T04:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem de 79 anos é acusado de ter esfaqueado uma casal e incendiado várias casas em Chiba, Prefeitura de 2024, destruindo um total de oito prédios.", "titulo_pt": "Procuradores buscam pena capital para homem de 79 anos por assassinato e arromatização", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 286024, "titulo": "The Russian army’s secret death toll – podcast", "url": "https://www.theguardian.com/news/audio/2026/nov/25/the-russian-armys-secret-death-toll-podcast", "fonte_id": "guardian_world", "data_pub": "2026-11-25T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de soldados russos mortos na Ucrânia durante a guerra permaneceu em segredo, mas documentos vazados ao The Guardian revelaram que, em um momento, 720 soldados morriam por dia. Os relatos indicam que a Rússia mantinha o número de mortes de forma muito confidencial.", "titulo_pt": "O segredo da mortandade: os números reais de soldados russos mortos na Ucrânia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 286081, "titulo": "El “Caso Rabat”: un análisis jurídico-constitucional", "url": "https://www.ciperchile.cl/2026/11/24/el-caso-rabat-un-analisis-juridico-constitucional/?utm_source=rss&utm_medium=rss&utm_campaign=el-caso-rabat-un-analisis-juridico-constitucional", "fonte_id": "ciper_chile", "data_pub": "2026-11-25T00:09:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O caso Rabat é analisado juridicamente e constitucionalmente. Este artigo explora aspectos legais e constitucionais relacionados ao caso.", "titulo_pt": "O ‘Caso Rabat’: um análise jurídico-constitucional", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 284779, "titulo": "Malaysia to send back another 6,803 Burmese refugees", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/25/2003868341", "fonte_id": "taipei_times", "data_pub": "2026-11-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo malásio planeja devolver 6.803 refugiados birmaneses. A decisão foi anunciada recentemente e envolve refugiados que estão no país de forma irregular.", "titulo_pt": "Malásia enviará de volta 6.803 refugiados birmaneses", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 285525, "titulo": "Should freedom of movement be a right or a privilege?", "url": "https://www.aljazeera.com/video/doha-debates/2026/11/24/should-freedom-of-movement-be-a-right-or-a-privilege?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-24T17:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pergunta se a liberdade de movimento é um direito ou um privilégio é discutida. O texto explora possíveis implicações dessa discussão.", "titulo_pt": "Liberdade de movimento: direito ou privilégio?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 284741, "titulo": "Amnesty calls on UK to stop Israeli organisation promoting West Bank settlements", "url": "https://www.middleeasteye.net/news/amnesty-calls-uk-stop-israeli-non-profit-promoting-west-bank-settlements", "fonte_id": "middle_east_eye", "data_pub": "2026-11-24T16:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amnesty International UK está pedindo ao governo britânico para impedir a Shivat Zion, uma organização israelense não lucrativa que promove a imigração judaica para Israel, de estimular cidadãos britânicos. A organização está atualmente em turnê pelo Reino Unido e seu site incentiva a migração para assentamentos ilegais no Território Ocidental.", "titulo_pt": "Amnesty pede ao reino unido para impedir organização israelense que promove assentamentos no território ocidental", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 284719, "titulo": "Five women killed every hour globally by partner, relative last year: UN", "url": "https://www.aljazeera.com/news/2026/11/24/five-women-killed-every-hour-globally-by-partner-relative-in-2025-un?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-24T15:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com a ONU Mulheres, cinco mulheres são assassinadas a cada hora por parceiros ou parentes em todo o mundo. A casa continua sendo o local mais perigoso para mulheres e meninas, um padrão que praticamente não mudou ao longo dos anos.", "titulo_pt": "Cinco mulheres mortas a cada hora por parceiro ou parente no mundo, diz ONU", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 284357, "titulo": "Morre Fábio Konder Comparato, referência em Direitos Humanos e Direito Comercial", "url": "https://www.jota.info/justica/morre-fabio-konder-comparato-referencia-em-direitos-humanos-e-direito-comercial", "fonte_id": "jota", "data_pub": "2026-11-24T15:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fábio Konder Comparato, professor emérito da USP e jurista, faleceu. Ele foi um referência em Direitos Humanos e Direito Comercial, formulando a tese da função social da empresa e sendo pioneiro no ensino de direitos humanos.", "titulo_pt": "Morre Fábio Konder Comparato, referência em Direitos Humanos e Direito Comercial", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 284248, "titulo": "‘Resistir não é crime’, afirma Mônica Seixas após deportação por Israel", "url": "https://www.brasildefato.com.br/2026/11/24/resistir-nao-e-crime-afirma-monica-seixas-apos-deportacao-por-israel/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-24T15:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada estadual Mônica Seixas, do Psol-SP, retornou ao Brasil após ser deportada por Israel no Aeroporto Internacional Ben Gurion, em Tel Aviv. Ela viajava para observar direitos humanos durante a colheita de uvas.", "titulo_pt": "Resistir não é crime", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 284342, "titulo": "Dados vazados apontam mais de mais de mil suicídios na tropa russa durante guerra na Ucrânia", "url": "https://www.dw.com/pt-br/dados-vazados-apontam-mais-de-mais-de-mil-suicídios-na-tropa-russa-durante-guerra-na-ucrânia/a-80032440?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-24T12:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento do jornal britânico The Guardian, baseado em registros oficiais vazados, indica que mais de mil suicídios ocorreram na tropa russa durante a guerra na Ucrânia. O número real pode ser ainda maior.", "titulo_pt": "Dados vazados indicam mais de mil suicídios na tropa russa durante guerra na Ucrânia", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 284552, "titulo": "Scoop: ACLU eyes Supreme Court flips in 11 states", "url": "https://www.axios.com/2026/11/24/aclu-state-supreme-court-south-democrats-religion", "fonte_id": "axios", "data_pub": "2026-11-24T10:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A American Civil Liberties Union está ampliando sua luta pelas eleições do Supremo Tribunal de Estado para áreas vermelhas após as eleições de meios-termos deixarem Texas com apenas uma vaga judicial para uma maioria democrata. Esses tribunais estaduais têm se tornado cada vez mais importantes na arbitragem de direitos constitucionais, enquanto o Supremo Tribunal dos EUA concede maior autonomia aos estados para definir suas próprias políticas.", "titulo_pt": "ACLU amplia batalha eleitoral no supremo estadual em 11 estados vermelhos", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 284952, "titulo": "\"Families are under enormous pressure because of Ebola, and women and girls are bearing much of the cost\" – UNICEF", "url": "https://www.unicef.org/press-releases/families-are-under-enormous-pressure-because-ebola-and-women-and-girls-are-bearing", "fonte_id": "unicef", "data_pub": "2026-11-24T10:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Famílias estão sob pressão significativa devido à Ebola, e as mulheres e garotas estão suportando grande parte desse impacto. Essa afirmação foi feita pelo Dr. Douglas Noble, responsável global de emergências de saúde pública e gerente global da incidente do Ebola na UNICEF, durante uma coletiva de imprensa no Palácio das Nações em Genebra.", "titulo_pt": "Famílias estão sob pressão significativa devido à Ebola, e mulheres e garotas estão pagando um alto preço", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 283546, "titulo": "Qué se sabe del caso de la estudiante de El Paso que pasó un mes bajo custodia del ICE", "url": "https://www.lanacion. function renderSecao(topico) {

function toggleDrill(id) {
  const el = document.getElementById(id);

  const aberta = el.classList.toggle("aberta");

}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')

    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">

      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

function filtrarSecao(topico) {

  return "8h";
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`

  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
