<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

</div>

const D = {"gerado_em": "03/10/2026 15:27", "stats": {"noticias_novas": 984, "resumos_gerados": 254}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "No primeiro turno das eleições de 2026, Lula liderava com 43,9% dos votos válidos, seguido por Flávio Bolsonaro com 40,5%, segundo o Instituto França. Uma pesquisa da CNT/MDA mostrou que Lula manteve a liderança no segundo turno com 47,3% das intenções de voto, contra 43,1% de Flávio Bolsonaro. A campanha tem debatido temas como ajuste fiscal, crédito para a casa própria e saneamento, com os candidatos tendo posições diferentes em alguns aspectos. Em Guaribas, uma cidade tradicionalmente bolsonarista, alguns eleitores estão se desiludindo com o presidente. O Supremo Tribunal Federal (STF) enfrenta uma crise, com casos como o do Banco Master sendo divulgados, o que impacta a campanha. A Igreja Assembleia de Deus Ministério Madureira, que historicamente apoiou Jair Bolsonaro, rejeitou o apoio à candidatura de Flávio Bolsonaro e preferiu apoiar Ronaldo Caiado. O INSS tem aproximadamente 13 milhões de segurados com a prova de vida pendente, representando 32,5% dos cerca de 40 milhões de segurados do instituto, e votar pode ser usado como comprovação.", "mundo": "As eleições em diversos países e regiões do mundo estão no centro do cenário político global. Na Letônia, o partido no poder lidera as pesquisas de intenção de voto, com um forte avanço dos partidos populistas. Em Madri, dezenas de milhares de pessoas se mobilizam em protestos contra a crise habitacional, intensificando a pressão sobre o governo Sánchez. No Brasil, a eleição presidencial é vista como um teste para a estratégia de Donald Trump na América Latina, com Nick Zimmerman, ex-assessor da Casa Branca, alertando sobre o risco de não reconhecimento do resultado se Lula vencer. Além disso, os ataques russos a infraestruturas ucranianas, incluindo o Puente del Norte em Kiev, continuam a afetar a situação militar na Ucrânia, enquanto a China inicia uma investigação antidumping contra exportações químicas europeias. Esses eventos refletem a complexidade das relações internacionais e a instabilidade política em diversos pontos do globo.\n\nA Coreia do Norte realizou um teste de míssil durante um período de tensão com o Sul, agravando a situação na península coreana, conforme relatado pelo Taipei Times. Em outro desenvolvimento, o governo da Somália declarou que não aceitará a presença israelense sob nenhuma circunstância, em declaração à Al Jazeera, após Israel planejar a construção de uma base naval em Berbera. A Ucrânia planeja atacar refinarias russas em resposta à 'nova doutrina' de ataques aéreos de Moscou, informou a Infomoney. Além disso, forças governamentais etíopes recuperaram o aeroporto de Mekelle, capital da região de Tigray, em um conflito com rebeldes tigreenses, relatado pela Al Jazeera.", "economia": "A Agência Internacional de Energia (IEA) anunciou a liberação de 325 milhões de barris de petróleo de suas reservas, em um esforço para controlar os preços. O G7 decidiu liberar até 100 milhões de barris de petróleo e diesel, complementando a ação da IEA. Após a descoberta de petróleo na Bacia da Foz do Amazonas, a Petrobras atingiu um valor de mercado recorde de R$ 700,08 bilhões. O Goldman Sachs projeta que a dívida pública no Brasil aumentará para 86,9% do PIB em 2027, a partir de 83,1% em 2026, o que representa desafios econômicos para o próximo governo. O STJ decidiu que pode haver penhora de salários para pagamento de dívidas não alimentares, em caráter excepcional, conforme consolidado no Tema 1.230 pela Corte Especial em julgamento de recursos repetitivos. Além disso, o mercado imobiliário de luxo em São Paulo está reduzindo o número de lançamentos de imóveis novos, enquanto os preços do metro quadrado aumentam nas áreas mais nobres da cidade. O setor de manufatura está mostrando sinais de crescimento sustentável, adaptando-se a práticas mais verdes e inovadoras. A Citi oferece um serviço de tokenização que permite às empresas taiwanesas transferir dinheiro a qualquer hora, facilitando a gestão financeira das empresas.", "tecnologia": "A colaboração entre os Estados Unidos e Taiwan no desenvolvimento de drones foi recentemente anunciada, marcando um avanço importante na tecnologia aérea não-tripulada. Paralelamente, Taiwan e o Reino Unido assinaram um acordo em ciência e tecnologia, focado em três projetos específicos, embora os detalhes desses projetos não tenham sido divulgados. A infraestrutura de recarga rápida de veículos elétricos no Brasil cresceu significativamente, com um aumento de 195% em 12 meses, refletindo o crescimento do mercado de veículos elétricos no país. A OpenAI enfrenta críticas internas sobre a cultura da empresa e questões de segurança, com um ex-empregado demitido após alertar sobre as ameaças potenciais das suas modelos de inteligência artificial. Além disso, a Novartis investiu pesadamente na tecnologia chinesa da Abogen Biosciences, pagando até US$ 7,8 bilhões por uma terapia de RNA mensageiro para 'resetar' o sistema imunológico, destacando a importância da inovação global na medicina.", "ciencia": "Novas descobertas científicas abrangem diversos campos, desde a física até a genética. A missão Juice da ESA usou a gravidade da Terra para ajustar sua trajetória em direção a Júpiter, enquanto a missão Chang'e-6 da China encontrou ferro metálico preservado na poeira lunar, potencialmente servindo como fósseis microscópicos do campo magnético lunar. Em biologia, estudos revelam novas células em calamares que podem oferecer insights sobre a audição humana, e pesquisas sobre câncer refutam uma teoria premiada com o Nobel há um século. Em astronomia, simulações sugerem que a Via Láctea pode ter começado como uma coleção de milhares de pequenas galaxias, enquanto novos comportamentos supercondutores são descobertos em urânio ditellurido. Além disso, a Terra pode ter experimentado um rápido deslocamento de seus polos durante a Era dos Dinossauros, e um novo estudo sugere que órgãos de doadores mais velhos podem passar por um processo de rejuvenescimento parcial quando transplantados em pacientes mais jovens. Estes avanços científicos continuam a expandir nosso conhecimento sobre a natureza e o universo ao nosso redor.", "cultura": "A Semana da Moda de Paris iluminou a Cidade-Luz, celebrando a moda e a cidade com diversos desfiles. No Brasil, a Mostra Internacional de Cinema de São Paulo, que comemora seus 50 anos, exibe filmes como 'Fjord', vencedor do Palma de Ouro do Festival de Cannes, e 'Mulher Desconhecida', vencedor do Festival de Veneza, além de produções como 'Ray Gunn', de Brad Bird, e 'O Outro Lado das Redes'. Em Nova York, o hotel Kimpton Era, projetado pelo estúdio de arquitetura local INC, imita camarotes de navios de cruzeiro, oferecendo uma experiência de luxo inspirada em viagens marítimas. No mundo da literatura, um tradutor de 'Cidade Fantasma' ganhou um prêmio literário na Itália, enquanto a literatura clássica ganha novos contornos com a reescrita de mitos gregos por Roland Schimmelpfennig em seu trabalho 'Anthropolis'.", "sociedade": "Milhares de pessoas protestaram em mais de 50 cidades da Espanha contra a crise habitacional e a especulação imobiliária, após o Congresso espanhol rejeitar medidas propostas pelo governo de Pedro Sánchez para proteção contra despejos e prorrogação de contratos. As medidas, que incluíam um pacote de medidas para proteger inquilinos, foram rejeitadas pela oposição, resultando em um aumento de 12,2% nos preços dos imóveis em um ano, de acordo com dados oficiais. Em um evento separado, um homem foi preso por homicídio calificado em julho de 2026, após ser localizado escondido em Chillancito, no Chile. No Brasil, a resiliência foi discutida em um editorial, destacando a importância de lidar com desafios tanto locais quanto globais. Além disso, aumentos salariais foram estabelecidos para as forças armadas, a Gendarmeria Nacional Argentina e os cuidadores de adultos, com detalhes específicos ainda a serem divulgados.", "meio_ambiente": "O investimento climático na América Latina e no Caribe dobrou entre 2020 e 2024, passando de US$ 54 bilhões para US$ 108 bilhões, de acordo com um relatório do Olhar Digital. No entanto, a quantidade de recursos destinados a combustíveis fósseis na região é mais do que o dobro do investimento em fontes de energia limpa. Em Bangkok, a capital da Tailândia, a cidade está em estado de emergência devido a inundações que resultaram em 40 mortes e afetaram todos os 50 distritos da cidade. Na Argentina, pesquisadores estão investigando o motivo pelo qual recém-nascidos de baleias estão morrendo em números inusitadamente altos ao longo da costa patagônica. No Corredor Seco da América Central, o impacto devastador do El Niño está causando escassez de água e alimentos, agravado pela influência do fenômeno El Niño e das mudanças climáticas, afetando milhares de famílias. Um tsunami lento ameaça causar mais danos à costa oeste dos Estados Unidos, enquanto obras de infraestrutura estão sendo realizadas em várias localidades argentinas para enfrentar os efeitos climáticos e promover o desenvolvimento turístico e produtivo.", "direitos_humanos": "O Tennessee enfrenta uma crise judicial após falhas na execução de Christa Pike, que resultou em sua sobrevivência em estado crítico. O oficial das prisões Frank Strada renunciou, e o governador suspendeu todas as execuções restantes para investigar os erros. Em outro desenvolvimento, a República Democrática do Congo registrou 4.000 mortes por Ebola, com a saúde pública sob pressão devido à falta de pagamento de trabalhadores. Na Ucrânia, a cidade de Oleksy, ocupada pelas forças russas, enfrenta uma severa escassez de alimentos e medicamentos, agravada pelo conflito. No Chile, a ministra de Igualdade de Gênero anunciou uma nova denúncia por feminicídio, elevando o número de casos neste ano para 29. Em China, o país retornou ao top 100 em um relatório de igualdade de gênero, após 10 anos, com 69,9% de sua brecha de gênero fechada."}, "resumo_do_dia": {"politica_nacional": [{"id": 192889, "titulo": "Flávio Bolsonaro fala em ‘libertar o Brasil’ em motociata no interior de SP", "url": "https://veja.abril.com.br/politica/flavio-bolsonaro-fala-em-libertar-o-brasil-em-motociata-no-interior-de-sp/", "fonte_id": "veja", "data_pub": "2026-10-03T16:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro realizou uma motociata no interior de São Paulo, reuniu seguidores e exibiu bandeiras do Brasil e dos Estados Unidos.", "titulo_pt": "Flávio Bolsonaro fala em 'libertar o Brasil' em motociata no interior de SP", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 192941, "titulo": "Caiado nega que tenha cogitado desistir e apoiar Flávio no 1º turno", "url": "https://www.cnnbrasil.com.br/eleicoes/caiado-nega-que-tenha-cogitado-desistir-e-apoiar-flavio-no-1o-turno/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-03T16:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-governador de Goiás realizou uma caminhada com apoiadores na capital do estado neste sábado, véspera do primeiro turno das eleições gerais. Caiado afirmou que não cogitou desistir e apoiar Flávio no primeiro turno.", "titulo_pt": "Caiado nega ter pensado em desistir e apoiar Flávio no 1º turno", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 192890, "titulo": "Lula diz disputar contra ‘chefes de quadrilha’ e ‘crime organizado’ em ato na Paulista", "url": "https://veja.abril.com.br/brasil/lula-diz-disputar-contra-chefes-de-quadrilha-e-crime-organizado-em-ato-na-paulista/", "fonte_id": "veja", "data_pub": "2026-10-03T16:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula afirmou que disputará contra 'chefes de quadrilha' e 'crime organizado' em um ato na Avenida Paulista. O presidente atacou adversários e pediu mobilização de apoiadores até a votação deste domingo, sem mencionar Flávio Bolsonaro.", "titulo_pt": "Lula diz disputar contra 'chefes de quadrilha' e 'crime organizado' em ato na Paulista", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 193025, "titulo": "Como vale-tudo no STF 'sequestrou' a eleição — e quais as consequências disso", "url": "https://www.bbc.com/portuguese/articles/c6kg8dq2j4l4o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-03T15:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A crise no Supremo Tribunal Federal (STF) foi acentuada pelo caso do Banco Master, expôs a divisão entre os ministros e impactou a campanha eleitoral.", "titulo_pt": "Como vale-tudo no STF 'sequestrou' a eleição — e quais as consequências disso", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 192781, "titulo": "Presidenciáveis convergem sobre necessidade de ajuste fiscal, mas evitam detalhar propostas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/presidenciaveis-convergem-sobre-necessidade-de-ajuste-fiscal-mas-evitam-detalhar-propostas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-03T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos à Presidência concordam que o próximo governo precisará lidar com o aumento da dívida pública, mas não se mostram uníssonos sobre o tamanho do ajuste fiscal necessário e sobre como controlar as despesas. Existem também divergências em temas eleitoralmente sensíveis, como a escala 6x1, a Previdência e o limite de faturamento do MEI.", "titulo_pt": "Candidatos à presidência concordam sobre ajuste fiscal, mas divergem em detalhes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 192808, "titulo": "Gilmar Mendes derruba direitos de resposta de Jerônimo contra vídeos de ACM Neto", "url": "https://g1.globo.com/ba/bahia/noticia/2026/10/03/gilmar-mendes-derruba-direitos-de-resposta-de-jeronimo-contra-videos-de-acm-neto.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-03T14:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes, do Supremo Tribunal Federal, revogou decisões do Tribunal Regional Eleitoral da Bahia que permitiam a Jerônimo Rodrigues responder a dois vídeos publicados por ACM Neto durante a campanha eleitoral. A decisão foi tomada a dois dias do primeiro turno das eleições, marcado para o dia 4.", "titulo_pt": "Gilmar Mendes revoga direitos de resposta de Jerônimo contra vídeos de ACM Neto", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 192784, "titulo": "Lama política e unção religiosa beneficiam sujeiras bolsonaristas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/michael-franca/2026/10/lama-politica-e-uncao-religiosa-beneficiam-sujeiras-bolsonaristas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-03T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A corrupção pode beneficiar políticos ao ser acompanhada por múltiplas denúncias semelhantes, reduzindo a capacidade de cobrança. A abundância de informações pode diluir a relevância de cada caso individual, favorecendo a inação frente à corrupção.", "titulo_pt": "Corrupção e excesso de denúncias beneficiam sujeiras políticas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 192785, "titulo": "Governo Lula determina que casas de apostas redirecionem tráfego para site 'Brasil sem Bets'", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/governo-lula-determina-que-casas-de-apostas-redirecionem-trafego-para-site-brasil-sem-bets.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-03T13:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula determinou que todas as casas de apostas online redirecionem seus usuários para o site www.brasilsembets.gov.br a partir de terça-feira (6) de março de 2026. Essa medida visa desativar os portais e aplicativos das casas de apostas.", "titulo_pt": "Governo Lula determina que casas de apostas online redirecionem usuários para site 'Brasil sem Bets'", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 192910, "titulo": "Eleições 2026: entenda por que é preciso votar em dois senadores neste ano", "url": "https://exame.com/brasil/eleicoes-2026-entenda-por-que-e-preciso-votar-em-dois-senadores-neste-ano/", "fonte_id": "exame", "data_pub": "2026-10-03T13:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nas eleições de 2026, a quantidade de senadores a serem eleitos será diferente da habitual, alterando o número de escolhas que os eleitores terão nas urnas.", "titulo_pt": "Eleições 2026: saiba por que o voto em dois senadores será necessário este ano", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 192786, "titulo": "O incumbente joga com as brancas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/samuelpessoa/2026/10/o-incumbente-joga-com-as-brancas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-03T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No final da corrida eleitoral para o primeiro turno, Lula realizou uma série de ações benéficas em tentativa de vencer a eleição. O resultado das urnas ainda não foi definido.", "titulo_pt": "O incumbente joga com as brancas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 193238, "titulo": "Lula tem 43,9% e Flávio Bolsonaro 40,5% dos votos válidos no 1º turno, diz Instituto França", "url": "https://www.jota.info/eleicoes/eleicoes-2026/lula-tem-439-e-flavio-bolsonaro-405-dos-votos-validos-no-1o-turno-diz-instituto-franca", "fonte_id": "jota", "data_pub": "2026-10-03T12:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No primeiro turno, Lula obteve 43,9% dos votos válidos e Flávio Bolsonaro 40,5%. Na segunda volta, a diferença entre os candidatos diminui, mas Lula mantém uma vantagem numérica dentro da margem de erro.", "titulo_pt": "Lula tem 43,9% e Flávio Bolsonaro 40,5% dos votos válidos no 1º turno, diz Instituto França", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 192914, "titulo": "Pesquisa CNT/MDA para presidente 2º turno: Lula tem 47,3% e Flávio Bolsonaro, 43,1%", "url": "https://exame.com/brasil/pesquisa-cnt-mda-para-presidente-2o-turno-lula-tem-473-e-flavio-bolsonaro-431/", "fonte_id": "exame", "data_pub": "2026-10-03T12:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa CNT/MDA indica que Lula lidera com 47,3% das intenções de voto no segundo turno, seguido por Flávio Bolsonaro com 43,1%. A distância entre os candidatos diminuiu em comparação com a trajetória temporal da pesquisa.", "titulo_pt": "Pesquisa CNT/MDA para presidente 2º turno: lula tem 47,3% e Flávio Bolsonaro, 43,1%", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 193241, "titulo": "Colinha das eleições 2026 – Qual é a ordem de votação nas urnas eletrônicas?", "url": "https://www.jota.info/eleicoes/eleicoes-2026/colinha-das-eleicoes-2026-qual-e-a-ordem-de-votacao-nas-urnas-eletronicas", "fonte_id": "jota", "data_pub": "2026-10-03T12:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nas eleições de 2026, os eleitores votarão para cargos majoritários e também escolherão representantes para deputados federal e estadual, além de dois senadores.", "titulo_pt": "Colinha das eleições 2026 – Qual é a ordem de votação nas urnas eletrônicas?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 193028, "titulo": "Eleições 2026: quem são os principais candidatos a governador em cada Estado", "url": "https://www.bbc.com/portuguese/articles/c69v9z2wydv1o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-03T11:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A BBC News Brasil listou os principais candidatos a governador em cada estado brasileiro e no Distrito Federal, apresentando suas trajetórias políticas.", "titulo_pt": "Eleições 2026: quais são os principais candidatos a governador em cada Estado", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 192789, "titulo": "Veja empresários que doaram para Jair em 2022, mas não para Flávio Bolsonaro em 2026", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/veja-empresarios-que-doaram-para-jair-em-2022-mas-nao-para-flavio-bolsonaro-em-2026.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-03T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresários que deram doações superiores a R$ 1 milhão para a campanha de Jair Bolsonaro em 2022 não financiaram a campanha de Flávio Bolsonaro em 2026.", "titulo_pt": "Veja empresários que doaram para Jair em 2022, mas não para Flávio Bolsonaro em 2026", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 192790, "titulo": "Veja quais são as propostas dos candidatos à Presidência para o crédito da casa própria", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/veja-quais-sao-as-propostas-dos-candidatos-a-presidencia-para-o-credito-da-casa-propria.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-03T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As propostas dos candidatos à Presidência para o crédito da casa própria estão sendo analisadas, com foco na compra da casa própria, que continua sendo um dos maiores mercados de crédito do país, apesar dos juros elevados.", "titulo_pt": "Veja as propostas dos candidatos para o crédito da casa própria", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 193513, "titulo": "N Korea test-fires missile amid tensions with South", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/04/2003865358", "fonte_id": "taipei_times", "data_pub": "2026-10-04T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Norte realizou um teste de míssil durante um período de tensão com o Sul. A Coreia do Sul e outros países temem que esses testes possam agravar a situação na península coreana.", "titulo_pt": "Coreia do norte realiza teste de míssil em meio a tensões com o sul", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 193332, "titulo": "Latvia: Ruling party leads in exit polls amid populist gains", "url": "https://www.dw.com/en/latvia-ruling-party-leads-in-exit-polls-amid-populist-gains/a-79527253?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-10-03T17:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma eleição na Letônia influenciada por preocupações de segurança nacional e aumentos nos custos de vida, o partido no poder lidera nas pesquisas de intenção de voto. Quatro jatos Eurofighter estão em missão da OTAN sobre o território letão durante o pleito.", "titulo_pt": "Letônia: partido governante lidera pesquisas com ganhos populistas", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 193021, "titulo": "Ceará, Pernambuco, Rio e outras disputas de governo estadual que você precisa ficar de olho", "url": "https://www.bbc.com/portuguese/articles/cqx28ygpe56yo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-03T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As eleições para governos em São Paulo, Minas Gerais, Rio de Janeiro, Bahia, Paraná, Pernambuco, Ceará, Distrito Federal e Amapá são importantes e merecem atenção especial neste processo eleitoral.", "titulo_pt": "Ceará, Pernambuco, Rio e outras disputas de governo estadual que você precisa ficar de olho", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 193282, "titulo": "Tennessee prison chief to resign after Christa Pike's failed execution", "url": "https://www.bbc.co.uk/news/articles/c8zxl62yzxzxo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-03T17:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A chefe da prisão de Tennessee irá se demitir após o fracasso na execução de Christa Pike. Pike sobreviveu a duas injeções letais e está em condição crítica.", "titulo_pt": "Chefe da prisão de tennessee vai se demitir após falha na execução de Christa Pike", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 193159, "titulo": "Russia Turns to Striking Kyiv’s Bridges, Threatening a Vital Lifeline", "url": "https://www.nytimes.com/2026/10/03/world/europe/russia-ukraine-bridges-kyiv.html", "fonte_id": "nyt_world", "data_pub": "2026-10-03T17:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As pontes em Kiev, usadas por muitos comutadores da capital ucraniana, são os últimos alvos de uma ampla campanha de bombardeios russos contra infraestruturas.", "titulo_pt": "Rússia ataca pontes de kiev, perigosas vias de comunicação", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 193466, "titulo": "Exit poll Lettonia, 'partito del premier Kulbergs in testa col 35,6% dei consensi'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/03/exit-poll-lettonia-partito-del-premier-kulbergs-in-testa-col-356_de301cec-0fb4-4d1c-b870-e28244fa1183.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-03T17:38:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "As siglas populistas ganharam força nas eleições letónias. O partido do primeiro-ministro Kulbergs lidera com 35,6% das intenções de voto. A União dos Verdes foi uma das maiores derrotas, sendo significativamente menos votada.", "titulo_pt": "Letônia, partido do primeiro-ministro Kulbergs na frente com 35,6% dos votos", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 192724, "titulo": "Madri reúne 70 mil em protesto e amplia pressão sobre governo Sánchez; atos se espalham pelo país", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/10/madri-reune-70-mil-em-protesto-e-amplia-pressao-sobre-governo-sanchez-atos-se-espalham-pelo-pais.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-10-03T17:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dezenas de milhares de pessoas se manifestaram em Madri e outras cidades espanholas neste sábado, intensificando as pressões sobre o governo Sánchez devido à crise habitacional, após dois decretos do governo serem derrubados pela oposição.", "titulo_pt": "Madri vê 70 mil em protesto e aumenta pressão sobre governo Sánchez", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 193293, "titulo": "Tennessee prison chief who oversaw botched Christa Pike execution resigns", "url": "https://www.france24.com/en/americas/20261003-tennessee-prison-chief-who-oversaw-botched-christa-pike-execution-resigns", "fonte_id": "france24", "data_pub": "2026-10-03T17:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe do sistema penitenciário do Tennessee renunciou, sendo este o primeiro grande movimento desde o fracasso notável na execução de Christa Pike, que está em estado crítico após sobreviver a duas injeções letais. O governador Bill Lee, que anteriormente negou clemência a Pike, suspendeu as execuções restantes do ano para que possa ser realizada uma revisão.", "titulo_pt": "Chefe do sistema penitenciário do tennessee renuncia após falha na execução de Christa Pike", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 193425, "titulo": "Really settlers injure at least three Palestinians in West Bank", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/really-settlers-injured-least-three-palestinians-west-bank", "fonte_id": "middle_east_eye", "data_pub": "2026-10-03T17:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israelenses colonos feriram pelo menos três palestinos no Vale do Cisjordânia, em Usarin e Beit Imrin. As informações foram divulgadas pela agência Wafa.", "titulo_pt": "Colônios israelenses ferem pelo menos três palestinos no vale do cisjordânia", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 193023, "titulo": "Copiloto usou machado em ataque a comandante de avião para Israel", "url": "https://www.bbc.com/portuguese/articles/cr86zldp7gv2o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-03T16:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O copiloto atacou o comandante com um machado, tentando fazer o avião despenhar 5.200 metros. Os passageiros conseguiram dominar o agressor e o voo pousou em segurança na Arábia Saudita.", "titulo_pt": "Copiloto usou machado em ataque a comandante de avião para Israel", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 192986, "titulo": "França vai aumentar financiamento para combate ao ebola no Congo, diz ministro", "url": "https://www.infomoney.com.br/mundo/franca-vai-aumentar-financiamento-para-combate-ao-ebola-no-congo-diz-ministro/", "fonte_id": "infomoney", "data_pub": "2026-10-03T16:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro das Relações Exteriores da França anunciou que o país vai aumentar o financiamento para o combate à ebola no Congo. A declaração foi feita durante uma visita à região afetada pelo vírus.", "titulo_pt": "França vai aumentar financiamento para combate ao ebola no Congo, diz ministro", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 193059, "titulo": "Elecciones en la Argentina 2027: fechas, cargos que se renuevan y todo lo que hay que saber", "url": "https://www.lanacion.com.ar/politica/elecciones-en-la-argentina-2027-fechas-cargos-que-se-renuevan-y-todo-lo-que-hay-que-saber-nid23092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-03T16:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As eleições na Argentina em 2027 incluirão votação em várias datas, com destaque para o pleito que elegerá novos governadores em algumas províncias. As datas exatas e detalhes específicos ainda não foram divulgados.", "titulo_pt": "Eleições na Argentina em 2027: datas, cargos que se renovam e informações importantes", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 193060, "titulo": "¿Cuándo se vota presidente en la Argentina? Todo sobre las elecciones 2027", "url": "https://www.lanacion.com.ar/politica/cuando-se-vota-presidente-en-la-argentina-todo-sobre-las-elecciones-2027-nid01092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-03T16:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As eleições presidenciais no ano que vem definirão os principais cargos do Poder Executivo e haverá renovação das bancadas no Congresso. As informações completas sobre a convocação eleitoral de 2027 estão disponíveis no texto original.", "titulo_pt": "Quando se vota presidente na Argentina? Tudo sobre as eleições 2027", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 193319, "titulo": "US midterms serve as a test for democracy", "url": "https://www.lemonde.fr/en/opinion/article/2026/10/03/us-midterms-serve-as-a-test-for-democracy_6758220_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-03T16:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nos eleições de meios períodos de novembro de 2022, os americanos têm a oportunidade de avaliar o desvio autoritário do governo de Trump. No entanto, um aumento da participação cívica pode ser lento devido à fraca polarização política e à manipulação de distritos eleitorais.", "titulo_pt": "Eleições de meios períodos servem como teste para a democracia americana", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 193401, "titulo": "Somalia won’t accept Israeli presence ‘under any circumstances’: President", "url": "https://www.aljazeera.com/news/2026/10/3/somalia-wont-accept-israeli-presence-under-any-circumstances-president?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-03T16:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente da Somália, Hassan Sheikh Mohamud, declarou em entrevista exclusiva à Al Jazeera que a Somália não aceitará a presença israelense sob nenhuma circunstância. Mohamud também afirmou que Israel está planejando a construção de um base naval em Berbera.", "titulo_pt": "Somália não aceitará presença israelense 'em nenhum caso'", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 192988, "titulo": "Ucrânia atacará refinarias em resposta à “nova doutrina” de ataques aéreos de Moscou", "url": "https://www.infomoney.com.br/mundo/ucrania-atacara-refinarias-em-resposta-a-nova-doutrina-de-ataques-aereos-de-moscou/", "fonte_id": "infomoney", "data_pub": "2026-10 Brasil", "classe": "B"}, {"id": 192938, "titulo": "Infraestrutura de recarga rápida cresce 195% em 12 meses no Brasil", "url": "https://www.cnnbrasil.com.br/auto/infraestrutura-de-recarga-rapida-cresce-195-em-12-meses-no-brasil/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-03T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A infraestrutura de recarga rápida de veículos elétricos no Brasil cresceu 195% em 12 meses. Dos quase 30 mil pontos de recarga existentes, 61,8% oferecem recarga lenta e 38,2% são de recarga rápida em corrente contínua.", "titulo_pt": "Infraestrutura de recarga rápida de veículos elétricos cresce 195% em 12 meses no Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 193582, "titulo": "Capcom is preparing for a ‘future where we create games together with AI’", "url": "https://www.theverge.com/games/1004418/capcom-ai-game-development", "fonte_id": "the_verge", "data_pub": "2026-10-03T16:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Capcom está preparando-se para um futuro onde trabalha em conjunto com a inteligência artificial na criação de jogos, apesar do tema perturbador abordado em seu jogo Pragmata. Durante a conferência Capcom Open Conference RE: 2026, o programador Satoshi Ishida apresentou o projeto REX, que evolui o motor de jogo RE.", "titulo_pt": "Capcom prepara-se para um futuro onde cria jogos com AI", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 193575, "titulo": "OpenAI safety employee resigns, claiming the company’s ‘culture is broken’", "url": "https://techcrunch.com/2026/10/03/openai-safety-employee-resigns-claiming-the-companys-culture-is-broken/", "fonte_id": "techcrunch", "data_pub": "2026-10-03T16:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "David Robinson, um funcionário de segurança de IA da OpenAI, deu sua demissão após criticar publicamente a cultura da empresa, afirmando que ela está 'quebrada'.", "titulo_pt": "Funcionário de segurança de IA da openai renuncia, acusando a empresa de 'cultura quebrada'", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 193306, "titulo": "OpenAI's Altman: Ascribing religion to models a \"safety issue\"", "url": "https://www.axios.com/2026/10/03/openai-anthropic-altman-amodei-religious-force-models", "fonte_id": "axios", "data_pub": "2026-10-03T15:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sam Altman, CEO da OpenAI, expressou sua desconforto com a ideia de atribuir poderes religiosos aos modelos de inteligência artificial. Isso reflete uma divisão entre Altman e seu ex-colaborador Dario Amodei, relacionada à abordagem de Anthropic em inserir consciência em modelos de IA.", "titulo_pt": "Altman da openai: atribuir religião aos modelos é um 'problema de segurança'", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 192956, "titulo": "Ben Affleck revela como usou IA em novo filme da Netflix; entenda", "url": "https://www.cnnbrasil.com.br/pop/streaming/ben-affleck-revela-como-usou-ia-em-novo-filme-da-netflix-entenda/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-03T15:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ben Affleck dirigiu a nova produção 'Sobrevivência', que estreia na sexta-feira (9) na Netflix. O ator revelou o uso de inteligência artificial no filme.", "titulo_pt": "Ben Affleck revela uso de IA em novo filme da Netflix; entenda", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 193576, "titulo": "Jack Dorsey’s Bitchat disappears from app stores in India after government order", "url": "https://techcrunch.com/2026/10/03/jack-dorseys-bitchat-disappears-from-app-stores-in-india-after-government-order/", "fonte_id": "techcrunch", "data_pub": "2026-10-03T15:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A aplicação Bitchat desapareceu das lojas de aplicativos na Índia devido a uma ordem governamental. A aplicação se tornou quase indisponível no país como resultado das restrições.", "titulo_pt": "Bitchat desaparece das lojas de aplicativos na Índia após ordem do governo", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 193583, "titulo": "Splice CEO Kakul Srivastava thinks AI emails are killing conversations", "url": "https://www.theverge.com/entertainment/1004162/splice-ceo-kakul-srivastava-ai-interview", "fonte_id": "the_verge", "data_pub": "2026-10-03T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kakul Srivastava, CEO da Splice, plataforma de amostras utilizada por produtores musicais, acredita que os emails de inteligência artificial estão prejudicando as conversas. Antes de liderar a Splice, Srivastava ocupou cargos executivos em outras empresas.", "titulo_pt": "CEO da splice acredita que e-mails de IA estão prejudicando as conversas", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 193577, "titulo": "Vessev built an electric ferry that almost flies", "url": "https://techcrunch.com/2026/10/03/vessev-built-an-electric-ferry-that-almost-flies/", "fonte_id": "techcrunch", "data_pub": "2026-10-03T14:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vessev desenvolveu um ferry elétrico que quase voa, com a esperança de transformar a forma como as pessoas e as cidades pensam sobre barcos.", "titulo_pt": "Vessev construiu um ferry elétrico que quase voa", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 193591, "titulo": "Musk confirms talks with TSMC over his Texas chip factory project", "url": "https://www.digitimes.com/news/a20261003VL200/tsmc-texas-elon-musk-spacex-investment.html", "fonte_id": "digitimes", "data_pub": "2026-10-03T14:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Elon Musk confirmou que a Terafab, empreendimento de fabricação de chips apoiado por SpaceX e Tesla, está em negociações com a TSMC. A confirmação ocorreu após relatos de que a fábrica de semicondutores taiwanesa está considerando a construção de novas fábricas de chips no Texas.", "titulo_pt": "Musk confirma conversas com TSMC sobre projeto de fábrica de chips no Texas", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 193584, "titulo": "An OpenAI safety employee has quit and is sounding the alarm", "url": "https://www.theverge.com/ai-artificial-intelligence/1004408/openai-safety-quits-sounding-the-alarm", "fonte_id": "the_verge", "data_pub": "2026-10-03T14:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "David Robinson, um ex-empregado de segurança da OpenAI, deixou o trabalho e publicou uma editorial no The Atlantic alertando sobre as potenciais ameaças das modelos de inteligência artificial da empresa. Ele era responsável por escrever os relatórios de segurança que acompanhavam as liberações de modelos principais da OpenAI.", "titulo_pt": "Ex-empregado de segurança da OpenAI deixa cargo e alerta sobre riscos", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 192909, "titulo": "Novartis paga até US$ 7,8 bi por tecnologia chinesa para 'resetar' sistema imunológico", "url": "https://exame.com/invest/mercados/novartis-paga-ate-us-78-bi-por-tecnologia-chinesa-para-resetar-sistema-imunologico/", "fonte_id": "exame", "data_pub": "2026-10-03T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Novartis pagou até US$ 7,8 bilhões pela tecnologia chinesa da Abogen Biosciences, que envolve uma terapia de RNA mensageiro para 'resetar' o sistema imunológico.", "titulo_pt": "Novartis paga até US$ 7,8 bi por tecnologia chinesa para 'resetar' sistema imunológico", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 193578, "titulo": "All the AI agents that can live in your text messages", "url": "https://techcrunch.com/2026/10/03/all-the-ai-agents-that-can-live-in-your-text-messages/", "fonte_id": "techcrunch", "data_pub": "2026-10-03T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A lista inclui assistentes de inteligência artificial para textos, desde assistentes gerais até aqueles projetados para famílias, viagens e trabalho.", "titulo_pt": "Todos os assistentes de IA que podem habitar suas mensagens de texto", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 193625, "titulo": "Recovery after intimate partner violence: New study reveals what works", "url": "https://phys.org/news/2026-09-recovery-intimate-partner-violence-reveals.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos recentes exploram os métodos de recuperação após a violência doméstica. Anualmente, mais de um milhão de pessoas com 16 anos ou mais no Países Baixos sofrem violência doméstica, muitas das quais são cometidas por parceiros atuais ou antigos.", "titulo_pt": "Recoveria após violência doméstica: novo estudo revela o que funciona", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 193626, "titulo": "Reading hidden topology in light, even when energy leaks away", "url": "https://phys.org/news/2026-10-hidden-topology-energy-leaks.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Físicos descobriram que alguns materiais e dispositivos transportam propriedades topológicas semelhantes a nósos em ondas, que permanecem inalteradas mesmo diante de pequenas imperfeições. Essa robustez faz da topologia uma ideia central em física moderna, prometendo eletrônicos, ópticos e dispositivos quânticos que toleram defeitos e ruídos.", "titulo_pt": "Lendo a topologia oculta na luz, mesmo quando a energia se esvai", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 193627, "titulo": "Q&A: An Earth-like planet with two suns?", "url": "https://phys.org/news/2026-09-qa-earth-planet-suns.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um sistema estelar próximo com duas estrelas poderia suportar um planeta do tamanho da Terra em uma região onde a água líquida poderia existir, de acordo com um novo artigo que examina as dinâmicas do sistema.", "titulo_pt": "Perguntas e respostas: um planeta semelhante à terra com dois 'somas'?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 193628, "titulo": "Visible light does not speed up water evaporation, rigorous experiments suggest", "url": "https://phys.org/news/2026-10-visible-evaporation-rigorous.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Experiências recentes com hidrogéis e gotas d'água sugerem que a exposição à luz visível pode acelerar a evaporação da água sem aquecê-la. No entanto, provas diretas de que a luz age diretamente na água são escassas.", "titulo_pt": "A luz visível não acelera a evaporação da água, sugere estudos rigorosos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 193305, "titulo": "Departure comes as the state investigates what went wrong during Pike's lethal injection.", "url": "https://www.axios.com/local/nashville/2026/10/03/christa-pike-execution-tennessee-prison-chief-resigns", "fonte_id": "axios", "data_pub": "2026-10-03T16:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe da prisão de Tennessee, Frank Strada, apresentou sua demissão poucos dias após um fracasso no processo de execução de Christa Pike, uma condenada à morte. Strada se comprometeu a colaborar com a investigação independente do incidente.", "titulo_pt": "Demissão ocorre após falha no processo de execução de christa Pike", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 193629, "titulo": "When the atmosphere slows the Earth: Uncovering a subtle signal of climate change", "url": "https://phys.org/news/2026-10-atmosphere-earth-uncovering-subtle-climate.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A circulação atmosférica controla o clima e o tempo, mas também transporta momentum angular. Sob longo prazo, mudanças climáticas podem afetar a rotação da Terra alterando momentaneamente sua velocidade de rotação.", "titulo_pt": "Quando a atmosfera diminui a velocidade da terra: descobrindo um sutil sinal do aquecimento global", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 193630, "titulo": "New imaging technologies offer a clearer view of coral reef change", "url": "https://phys.org/news/2026-09-imaging-technologies-clearer-view-coral.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade da Flórida Meridional estão utilizando novas tecnologias de imagens, como drones e câmeras próximas ao leito marinho, para transformar a maneira como os cientistas observam corais e medem mudanças que eram difíceis, caras ou demoradas de documentar.", "titulo_pt": "Novas tecnologias de imagens oferecem uma visão mais clara do mudança nos recifes de corais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 193631, "titulo": "Newly discovered hair cells on squid may offer clues to understanding hearing loss in humans", "url": "https://phys.org/news/2026-10-newly-hair-cells-squid-clues.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram que os calamares têm centenas de células pilares distribuídas por toda a superfície do corpo, semelhantes às células pilares profundamente localizadas no ouvido humano que permitem a audição. Esta descoberta pode fornecer aos pesquisadores uma oportunidade única para entender como os humanos usam e perdem a audição.", "titulo_pt": "Novas células pilares descobertas em calamar podem oferecer pistas sobre perda auditiva humana", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 192737, "titulo": "Pesquisa sobre câncer premiada com Nobel de Medicina há cem anos acabou refutada", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/pesquisa-sobre-cancer-premiada-com-nobel-de-medicina-ha-cem-anos-acabou-refutada.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-03T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo premiado com o Nobel de Medicina há um século se tornou controverso, comprovando-se que suas conclusões eram incorretas. No entanto, a pesquisadora ainda considera que o trabalho pode ser visto como um passo importante para o entendimento do câncer.", "titulo_pt": "Pesquisa sobre câncer premiada com Nobel há um século foi refutada", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 193632, "titulo": "A short breath extends the mating calls of male tokay geckos", "url": "https://phys.org/news/2026-09-short-male-tokay-geckos.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os geckos-tokay (Gekko gecko), geckos grandes e predominantemente noturnos nativos de partes da Ásia, são um dos poucos répteis não-ave que fazem sons para atrair parceiros potenciais, defender seu território e sinalizar perigo. Os chamados masculinos desses geckos começam com roncos mais suaves, seguidos por sons mais altos em duas partes que podem soar como 'ge-ko' ou 'to-kay'.", "titulo_pt": "Uma respiração curta estende os chamados de couraças-madrinha", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 193601, "titulo": "This protective enzyme could help stop fatty liver disease from getting worse", "url": "https://www.sciencedaily.com/releases/2026/10/261002080020.htm", "fonte_id": "science_daily", "data_pub": "2026-10-03T13:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas identificaram uma enzima chamada UBE2N que pode atuar como uma defesa natural contra o agravamento da doença hepática fatorial. A enzima ajuda as células do fígado a remover mitocôndrias danificadas e a quebrar gorduras, potencialmente prevenindo a inflamação, a cicatrização e o dano celular associados a uma condição mais perigosa.", "titulo_pt": "Esta enzima protetora poderia ajudar a impedir que a doença hepática fatorial se agrave", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 193602, "titulo": "ESA’s Juice just used Earth as a slingshot to Jupiter", "url": "https://www.sciencedaily.com/releases/2026/10/261001214102.htm", "fonte_id": "science_daily", "data_pub": "2026-10-03T13:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O foguete Juice da ESA se aproximou da Terra em 28 de setembro, utilizando a gravidade do planeta para alterar sua trajetória em direção a Júpiter sem consumir muito combustível. O voo por perto mudou a direção do veículo espacial em 20 graus e aumentou sua velocidade em 3,5 km/s.", "titulo_pt": "Juice da esa usa a terra como escada para júpiter", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 193604, "titulo": "Chang’e-6 lunar soil contains a surprising magnetic time capsule", "url": "https://www.sciencedaily.com/releases/2026/10/261001214015.htm", "fonte_id": "science_daily", "data_pub": "2026-10-03T13:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas que estudam a poeira lunar recolhida pela missão Chang'e-6 descobriram uma mineralidade magnética desconhecida: uma forma de ferro metálico chamada γ-Fe, preservada dentro de partículas de vidro formadas por impactos. Essa nanoscale do ferro pode manter um sinal magnético estável, potencialmente servindo como um fósseis microscópicos do campo magnético lunar perdido.", "titulo_pt": "Poço magnético lunar contém surpreendente minério de tempo", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 193633, "titulo": "Milky Way may have begun as thousands of galaxies, new simulations suggest", "url": "https://phys.org/news/2026-09-milky-begun-thousands-galaxies-simulations.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novas simulações sugerem que a Via Láctea pode ter começado como uma coleção de milhares de pequenas galáxias. Nas primeiras etapas do universo, a região que se tornaria a vizinhança da Via Láctea era composta por galáxias menores, algumas gerando estrelas rapidamente, enquanto outras estavam cheias apenas de gás ou repletas de estrelas mortas e buracos negros.", "titulo_pt": "Via láctea pode ter começado como milhares de galáxias", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 193605, "titulo": "Powerful simulations reveal how the first stars changed the universe", "url": "https://www.sciencedaily.com/releases/2026/10/261001214012.htm", "fonte_id": "science_daily", "data_pub": "2026-10-03T12:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Simulações ultra-detalhadas estão demonstrando como as primeiras estrelas iluminaram o Universo primitivo e semearam o espaço com elementos como carbono, oxigênio e ferro. O projeto MEGATRON visa conectar observações do JWST das primeiras galáxias com pistas químicas preservadas em estrelas antigas de hoje.", "titulo_pt": "Simulações poderosas revelam como as primeiras estrelas iluminaram o universo", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 193634, "titulo": "New interactive tool tracks private equity investments in health care across U.S.", "url": "https://phys.org/news/2026-09-interactive-tool-tracks-private-equity.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T12:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo ferramenta interativa foi lançada em 8 de setembro, oferecendo a poli /2026/10/investimento-climatico-dobra-na-america-latina-mas-fosseis-recebem-mais-que-energia-limpa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-03T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O investimento climático na América Latina e no Caribe dobrou de 2020 a 2024, passando de US$ 54 bilhões para US$ 108 bilhões. No entanto, a quantidade de recursos destinados a combustíveis fósseis na região é mais do que o dobro do investimento em fontes de energia limpa.", "titulo_pt": "Investimento climático dobra na América Latina, mas combustíveis fósseis recebem mais que energia limpa", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 193640, "titulo": "Scientists search for answers as baby whales wash up dead in Argentina", "url": "https://phys.org/news/2026-10-scientists-baby-whales-dead-argentina.html", "fonte_id": "phys_org", "data_pub": "2026-10-03T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores em Argentina estão tentando descobrir o motivo pelo qual recém-nascidos de baleias estão morrendo em números inusitadamente altos ao longo da costa patagônica do país.", "titulo_pt": "Cientistas buscam respostas com recém-nascidos de baleias mortos na costa Argentina", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 193175, "titulo": "Bangkok at breaking point as floods turn streets into stagnant lakes", "url": "https://www.theguardian.com/world/2026/oct/03/bangkok-thailand-floods-breaking-point-stagnant-lakes", "fonte_id": "guardian_world", "data_pub": "2026-10-03T02:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bangcoc está em estado de emergência devido a inundações que resultaram em 40 mortes e afetaram todas as 50 distritos da cidade. A precipitação rápida e intensa este ano levou a inundações em áreas inteiras da capital tailandesa.", "titulo_pt": "Bangcoc atinge seu ponto de ruptura com inundações que transformam ruas em lagos estagnados", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 193399, "titulo": "Tennessee prisons official resigns after Christa Pike’s failed US execution", "url": "https://www.aljazeera.com/news/2026/10/3/tennessee-prisons-official-resigns-after-christa-pikes-failed-us-execution?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-03T17:31:00Z", "idioma": "en", "provavel_duplicata_de": 193282, "texto_pt": "Frank Strada, um oficial das prisões do Tennessee, renunciou após a falha no processo de execução de Christa Pike. O governador do estado declarou que Strada deixará o cargo enquanto uma investigação independente examina os erros cometidos.", "titulo_pt": "Tennessee: oficial de prisões renuncia após falha na execução de Christa Pike", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 193032, "titulo": "Detalles judiciales revelan que Christa Pike se encuentra en estado crítico: inconsciente, intubada y quemada tras sobrevivir a una ejecución fallida", "url": "https://www.clarin.com/estados-unidos/detalles-judiciales-revelan-christa-pike-encuentra-estado-critico-inconsciente-intubada-quemada-sobrevivir-ejecucion-fallida_0_qjSfDxDyP0.html", "fonte_id": "clarin", "data_pub": "2026-10-03T17:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Christa Pike encontra-se em estado crítico em um hospital de Nashville, inconsciente e intubada, após sobreviver a duas doses letais de pentobarbital. Seu estado é grave, com os braços hinchados, queimados e cheios de ampolas.", "titulo_pt": "Detalhes judiciais mostram que Christa Pike se encontra em estado crítico após sobreviver a uma execução fallida", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 193044, "titulo": "Identifican al agresor del vuelo de Flydubai y Emiratos Árabes ‌confirma que fue un ataque terrorista", "url": "https://www.lanacion.com.ar/el-mundo/ident function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {

  _fUrl = btn.dataset.url;

  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}
