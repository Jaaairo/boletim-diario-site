"id": 158499, "titulo": "Lanzan créditos que se entregan en la firma del boleto (sin necesidad de escritura) para comprar departamentos en construcción", "url": "https://www.lanacion.com.ar/propiedades/casas-y-departamentos/lanzan-creditos-que-se-entregan-en-la-firma-del-boleto-sin-necesidad-de-escritura-para-comprar-nid13092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-13T09:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os compradores podem entregar os créditos na assinatura do contrato para a compra de apartamentos em construção, sem a necessidade de escritura. Esta iniciativa é promovida por uma empresa de desenvolvimento imobiliário em parceria com um banco.", "titulo_pt": "Créditos entregues na assinatura do contrato para compra de apartamentos em construção", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 158396, "titulo": "Anvisa vai regular plataformas, mas não sabe quantas vezes foram autuadas", "url": "https://www.metropoles.com/colunas/tacio-lorran/anvisa-vai-regular-plataformas-mas-nao-sabe-quantas-vezes-foram-autuadas", "fonte_id": "metropoles", "data_pub": "2026-09-13T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anvisa informou que não possui informações consolidadas sobre o número de autuações em plataformas e o painel disponível para consulta tem dados apenas até 2023.", "titulo_pt": "Anvisa não dispõe de informações consolidadas sobre autuações em plataformas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 158463, "titulo": "Quem está ficando com as vagas mais valorizadas da inteligência artificial?", "url": "https://www.infomoney.com.br/carreira/mulheres-inteligencia-artificial-contratacoes/", "fonte_id": "infomoney", "data_pub": "2026-09-13T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de vagas de inteligência artificial aumentou quase o dobro desde 2023 e oferece salários superiores a outros empregos. No entanto, as mulheres representam apenas 26% das contratações nesses cargos.", "titulo_pt": "Quem está ficando com as vagas mais valorizadas da inteligência artificial?", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 158558, "titulo": "O que os planos dos presidenciáveis revelam sobre tecnologia e direitos digitais", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-que-os-planos-dos-presidenciaveis-revelam-sobre-tecnologia-e-direitos-digitais", "fonte_id": "jota", "data_pub": "2026-09-13T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A análise destaca que os planos dos candidatos presidenciais apresentam pontos comuns em relação ao uso de tecnologia, mas evidencia brechas na discussão sobre riscos, governança e proteção de direitos digitais.", "titulo_pt": "O que os planos dos candidatos presidenciais revelam sobre tecnologia e direitos digitais", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 158559, "titulo": "Lobby não é inovação de Vorcaro, mas o default do Judiciário brasileiro", "url": "https://www.jota.info/opiniao-e-analise/artigos/lobby-nao-e-inovacao-de-vorcaro-mas-o-default-do-judiciario-brasileiro", "fonte_id": "jota", "data_pub": "2026-09-13T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Escândalos recentes reacenderam o debate sobre a existência de um mercado de influência próximo ao Poder Judiciário brasileiro. O lobby não é uma inovação de Vorcaro, mas o padrão default do Judiciário.", "titulo_pt": "Lobby não é inovação de Vorcaro, mas o default do Judiciário brasileiro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 158446, "titulo": "Dia do Cliente: PMEs podem aumentar vendas com ações simples", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/dia-do-cliente-pmes-podem-aumentar-vendas-com-acoes-simples/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-13T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pequenas e médias empresas podem aumentar suas vendas no Dia do Cliente através de ações simples como oferecer condições especiais, brindes, atendimento personalizado e comunicação nas redes sociais.", "titulo_pt": "Dia do Cliente: pmes podem aumentar vendas com ações simples", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 158448, "titulo": "Dia da Cachaça: por que a bebida brasileira ainda exporta tão pouco", "url": "https://www.cnnbrasil.com.br/agro/cachaca-busca-transformar-potencial-brasileiro-em-negocio-global/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-13T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O setor de cachaça apostou em produtos premium e promoção internacional para aumentar as exportações, que foram de apenas 7,95 milhões de litros em 2025, contra uma produção de 234,4 milhões de litros no mesmo período.", "titulo_pt": "Dia da Cachaça: por que a bebida brasileira ainda exporta tão pouco", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 158464, "titulo": "Boas práticas de governança renderam 224% a mais na América Latina, diz Morgan", "url": "https://www.infomoney.com.br/mercados/boas-praticas-de-governanca-renderam-224-a-mais-na-america-latina-diz-morgan/", "fonte_id": "infomoney", "data_pub": "2026-09-13T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Morgan indicou que empresas com melhores práticas de governança superaram as de pior classificação em 224% na América Latina. Entre as preferidas da casa estão B3, Vale, Mercado Livre e Banorte.", "titulo_pt": "Bons práticas de governança renderam 224% a mais na América Latina, diz Morgan", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 158417, "titulo": "Empresas perdem US$ 1,2 trilhão por ano com ruídos na comunicação, diz estudo. Como evitar isso?", "url": "https://exame.com/inteligencia-artificial/empresas-perdem-us-12-trilhao-por-ano-com-ruidos-na-comunicacao-diz-estudo-como-evitar-isso/", "fonte_id": "exame", "data_pub": "2026-09-13T06:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa da Grammarly, em parceria com a Harris Poll, revela que empresas perdem US$ 1,2 trilhão por ano devido a comunicação ineficaz. O estudo aponta estratégias para minimizar o retrabalho, a perda de tempo e as falhas na troca de informações.", "titulo_pt": "Empresas perdem US$ 1,2 trilhão por ano com comunicação ineficaz, diz estudo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 158723, "titulo": "PwC shakes up Indian operations as AI threat looms over consulting sector", "url": "https://www.ft.com/content/bf1f8def-98ce-4976-acc3-cd80f0956ab0?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-13T05:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A PwC unificará as operações de outsourcing e consultoria de suas divisões norte-americana e indiana em uma joint venture de 40.000 pessoas. A empresa está reorganizando suas operações indianas em face do risco crescente de inteligência artificial para o setor de consultoria.", "titulo_pt": "Pwc reformula operações indianas enquanto ameaça de IA paira sobre o setor de consultoria", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 158879, "titulo": "HD Hyundai advances shipbuilding initiatives at Gastech 2026", "url": "https://www.koreaherald.com/article/10871621", "fonte_id": "korea_herald", "data_pub": "2026-09-13T05:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A HD Hyundai participará da Gastech 2026, maior exposição de gás do mundo, em Bangkok, Tailândia, onde exibirá tecnologias de navios transportadores de gás, incluindo navios transportadores de gás liquefeito, unidades de armazenamento e regassificação móveis e navios transportadores de gás carbônico liquefeito. Cinco subsidiárias da HD Hyundai estarão exibindo juntas em um estande unificado.", "titulo_pt": "HD Hyundai avança com iniciativas navais na Gastech 2026", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 158721, "titulo": "Boom-era PE funds will fall short on promises, executives warn", "url": "https://www.ft.com/content/183569b4-8102-4b38-8a20-a3597a442f26?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-13T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Executivos advertem que os fundos de private equity lançados durante o período frenético de 2019 a 2021 terão dificuldade em atender às expectativas de retorno.", "titulo_pt": "Fundos de private equity do boom ficarão devendo, executivos avisam", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 158722, "titulo": "Musk’s secretive backer builds $40bn SpaceX stake", "url": "https://www.ft.com/content/c765f312-e698-4d31-bf71-f64a656ad6f4?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-13T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A firma de capital de risco Vy Capital emergiu como uma das maiores acionistas da SpaceX. Musk tem um patrocinador secreto que tem contribuído significativamente para a empresa de foguetes.", "titulo_pt": "Patrocinador secreto da vy capital se torna um dos maiores acionistas da SpaceX", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 158858, "titulo": "Foreign investors turn net sellers of S. Korean bonds in Aug.", "url": "https://en.yna.co.kr/view/AEN20260913001100320", "fonte_id": "yonhap_news", "data_pub": "2026-09-13T02:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores estrangeiros venderam títulos soberanos sul-coreanos líquidamente em agosto. Essa foi a primeira vez desde fevereiro que os investidores estrangeiros foram líquidos vendedores.", "titulo_pt": "Investidores estrangeiros se tornam líquidos vendedores de títulos sul-coreanos em agosto", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 158328, "titulo": "Folha lança portal C-Level e amplia cobertura de negócios e finanças", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/folha-lanca-portal-c-level-e-amplia-cobertura-de-negocios-e-financas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-13T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Folha deu lançamento ao portal C-Level, um site dedicado a notícias de negócios e finanças, voltado para executivos, profissionais do mercado financeiro e leitores interessados nessas áreas. O portal oferece curadoria de notícias para esses públicos.", "titulo_pt": "Folha lança portal C-Level e amplia cobertura de negócios e finanças", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 158888, "titulo": "With a Better Understanding of Physics, We Could Predict Volcanic Eruptions", "url": "https://www.wired.com/story/physics-predict-volcanic-eruptions/", "fonte_id": "wired", "data_pub": "2026-09-13T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Com um entendimento melhor da física, pode ser possível prever erupções vulcânicas de maneira semelhante às previsões do tempo no futuro.", "titulo_pt": "Com melhor entendimento de física, podemos prever eruptiones vulcânicas", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 158437, "titulo": "IA é fundamental para modelo de operação das empresas, diz CIO da MRV", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/ia-e-fundamental-para-modelo-de-operacao-das-empresas-diz-cio-da-mrv/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-13T09:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CIO da MRV, Reinaldo Sima, destaca a importância da inteligência artificial para o modelo de operação das empresas. Ele compara o papel atual da IA com o que a internet desempenhou há 20 anos.", "titulo_pt": "IA é fundamental para modelo de operação das empresas, afirma CIO da MRV", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 158829, "titulo": "Chinese leader pledges to help Brics nations with AI and smart manufacturing", "url": "https://www.scmp.com/news/china/diplomacy/article/3367341/chinese-leader-pledges-help-brics-nations-ai-and-smart-manufacturing?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-13T06:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente chinês Xi Jinping, após uma visita de um dia à Índia, promoveu a unidade entre os membros do Brics para contrariar a política de poder e anunciou a intenção de ajudar esses países a desenvolver inteligência artificial aberta e a estabelecer fábricas de fabricação inteligente. Xi identificou essas duas iniciativas como parte de cinco estratégias para promover o crescimento econômico e o desenvolvimento tecnológico no Sul Global.", "titulo_pt": "Líder chinês promete auxiliar países do Brics em inteligência artificial e fabricação inteligente", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 158832, "titulo": "Beijing pushes AI-assisted chip design as part of self-sufficiency drive", "url": "https://www.scmp.com/tech/tech-trends/article/3367245/beijing-pushes-ai-assisted-chip-design-part-self-sufficiency-drive?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-13T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China está intensificando o uso de inteligência artificial na designação de seus próximos semicondutores para aumentar a auto-suficiência nacional. A Empyrean Technology, principal fabricante de ferramentas de automação de design eletrônico no país, tem acelerado o processo de design de chips usando algoritmos e ferramentas otimizados por IA.", "titulo_pt": "Pequim impulsiona design de chips com ajuda de inteligência artificial como parte da drive de auto-suficiência", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 158872, "titulo": "Chong Kun Dang builds W2.2tr biopharma center in Siheung", "url": "https://www.koreaherald.com/article/10871650", "fonte_id": "korea_herald", "data_pub": "2026-09-13T05:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Chong Kun Dang planeja investir 2,2 trilhões de wones ($1,64 bilhões) para construir um complexo biofarmacêutico em Siheung, Gyeonggi Province. O projeto recebeu aprovação condicional durante a sétima reunião do comitê de revisão integrada de edificações e tráfego.", "titulo_pt": "Chong Kun Dang constrói centro biofarmacêutico de W2,2 trilhões em Siheung", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 158873, "titulo": "KRX to extend trading hours from Monday", "url": "https://www.koreaherald.com/article/10871647", "fonte_id": "korea_herald", "data_pub": "2026-09-13T05:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Korea Exchange, principal entidade de negociação da Coreia do Sul, implementará um mercado de pós-horas em tempo real a partir de segunda-feira, estendendo as negociações até às 20h e permitindo que a maioria das ações do Kospi e Kosdaq sejam negociadas à noite. Com a plataforma de negociação alternativa Nextrade incluindo a pré-mão de 8h, as horas de negociação serão estendidas a 12 horas.", "titulo_pt": "KRX vai estender horário de negociação a partir de segunda-feira", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 158876, "titulo": "Honam seen as key test for Korea’s regional AI-industrial strategy: ministry official", "url": "https://www.koreaherald.com/article/10871627", "fonte_id": "korea_herald", "data_pub": "2026-09-13T05:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul planeja investir na infraestrutura de IA da região de Honam para criar um novo eixo de crescimento industrial fora da área metropolitana de Seul, conectando centros de dados com produção avançada e setores industriais regionais específicos, de acordo com um oficial sênior do ministério da Indústria. O governo vê investimentos regionais como parte de sua resposta à diminuição do crescimento potencial e à rápida reestruturação global.", "titulo_pt": "Honam considerado teste-chave para estratégia industrial de IA da Coreia do sul: oficial do ministério", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 158877, "titulo": "Lotte, KAIST open joint research center", "url": "https://www.koreaherald.com/article/10871623", "fonte_id": "korea_herald", "data_pub": "2026-09-13T05:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Lotte Group e KAIST abriram recentemente um novo centro de pesquisa e desenvolvimento, fortalecendo suas parcerias entre indústria e academia e aumentando suas capacidades para obter tecnologias do futuro. A cerimônia de inauguração ocorreu na última sexta-feira no campus de Daejeon do KAIST.", "titulo_pt": "Lotte e KAIST abrem novo centro de pesquisa e desenvolvimento", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 158422, "titulo": "A corrida pela IA pode encarecer seu próximo smartphone. Entenda por quê", "url": "https://exame.com/inteligencia-artificial/a-corrida-pela-ia-pode-encarecer-seu-proximo-smartphone-entenda-por-que/", "fonte_id": "exame", "data_pub": "2026-09-13T05:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A concorrência pelo uso de componentes para aplicações de inteligência artificial está reduzindo a oferta de memória e aumentando os custos de fabricação de smartphones. Isso pode levar a um aumento nos preços dos próximos modelos de smartphones.", "titulo_pt": "Corrida pela IA pode encarecer seu próximo smartphone", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 158880, "titulo": "SK chief says Big Tech AI data center cooperation gaining pace", "url": "https://www.koreaherald.com/article/10871612", "fonte_id": "korea_herald", "data_pub": "2026-09-13T04:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente do grupo SK, Chey Tae-won, afirmou que a cooperação do grupo com empresas de tecnologia de grande porte em centrais de dados de inteligência artificial está avançando rapidamente. Segundo ele, as reuniões com essas empresas continuam, e um projeto de centro de dados AI em Ulsan, em parceria com a AWS, está em andamento há menos de um ano e já apresenta avanços significativos.", "titulo_pt": "Chefe do SK diz que cooperação com grandes empresas de tecnologia em centrais de dados de IA está avançando rapidamente", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 158881, "titulo": "Forum puts power, talent at center of southwest chip push", "url": "https://www.koreaherald.com/article/10871611", "fonte_id": "korea_herald", "data_pub": "2026-09-13T04:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O plano sul-coreano de estabelecer uma base de produção de semicondutores significativa no sudoeste está tomando forma, com a ênfase na disponibilidade de recursos como energia, água, permissões, talento humano e redes de fornecedores para apoiar futuros investimentos corporativos. Esses aspectos foram centrais no Fórum Integrado Metropolitano de Gwangju e da Província de Jeonnam para a Transição de Semicondutores e Inteligência Artificial.", "titulo_pt": "Fórum concentra-se em recursos e talento para impulsionar produção de semicondutores no sudoeste da Coreia", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 158862, "titulo": "SK chairman calls for sustainable AI biz model amid investment boom", "url": "https://en.yna.co.kr/view/AEN20260913000500320", "fonte_id": "yonhap_news", "data_pub": "2026-09-13T01:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente do grupo SK, Chey Tae-won, chamou para o desenvolvimento de um modelo de negócios sustentável para a inteligência artificial durante um boom de investimentos na área. Esta declaração foi feita em Ulsan no dia 13 de setembro, conforme informado pela Yonhap News.", "titulo_pt": "Presidente do SK group defende modelo de negócios sustentável para IA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 158889, "titulo": "China's robot champions can run; now they have to prove they can earn", "url": "https://www.digitimes.com/news/a20260911VL212/robot-revenue-robotics-ipo-funding.html", "fonte_id": "digitimes", "data_pub": "2026-09-13T00:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A onda de robôs humanóides chineses está entrando em uma fase mais difícil. Após anos de demonstrações notáveis e financiamento privado pesado, as empresas agora são pressionadas a mostrar que os robôs podem realizar trabalho confiável, gerar receita recorrente e justificar suas avaliações de mercado.", "titulo_pt": "Robôs humanóides chineses devem comprovar sua capacidade de geração de receita", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 158890, "titulo": "AI, 5G upgrades lift Taiwan's top three telecoms in August", "url": "https://www.digitimes.com/news/a20260911PD206/demand-revenue-5g-taiwan-growth.html", "fonte_id": "digitimes", "data_pub": "2026-09-13T00:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em agosto de 2026, a forte demanda por inteligência artificial (IA) e centrais de dados de IA, combinada com a implementação de projetos de tecnologia de informação e comunicações empresariais, contribuiu para o crescimento dos três principais operadores de telecomunicações de Taiwan. Chunghwa Telecom registrou recordes em receita, lucro operacional, EBITDA e lucro por ação; Taiwan Mobile manteve a liderança em lucro por ação acumulado; e FarEasTone atingiu picos mensais em receita, EBITDA e lucro líquido.", "titulo_pt": "IA e 5G impulsionam três maiores operadoras de telecomunicações de Taiwan em agosto", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 158891, "titulo": "Column: What is SLAM? The first step in Physical AI", "url": "https://www.digitimes.com/news/a20260909PD215/automation-3d.html", "fonte_id": "digitimes", "data_pub": "2026-09-13T00:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "SLAM é a primeira etapa do Physical AI, responsável por permitir que robôs autônomos operem em ambientes não estruturados, identificando sua localização, o que os rodeia e movendo-se de forma segura e eficiente enquanto realizam tarefas.", "titulo_pt": "O que é SLAM? O primeiro passo para o Physical AI", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 158893, "titulo": "AI server exports to US slow; electronics parts jump 1.5 times in August", "url": "https://www.digitimes.com/news/a20260910PD202/exports-taiwan-electronics-2025-ai-server.html", "fonte_id": "digitimes", "data_pub": "2026-09-13T00:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As exportações de componentes eletrônicos da Taiwan atingiram US$32,22 bilhões em agosto de 2026, um novo recorde mensal, aumentando em 58% em comparação com o mesmo mês do ano anterior. As exportações de circuitos integrados aumentaram 60%, enquanto as placas de circuito impresso aumentaram quase 30%.", "titulo_pt": "Exportações de peças eletrônicas da taiwan para os EUA crescem; agosto de 2026 registra recorde", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 158821, "titulo": "Chinese scientists develop new oil refining method that may cut energy use by 90%", "url": "https://www.scmp.com/news/china/science/article/3367332/chinese-scientists-develop-new-oil-refining-method-may-cut-energy-use-90?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-13T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas chineses desenvolveram uma nova técnica de refino de petróleo que pode reduzir drasticamente o consumo de energia, em torno de 90%. Se a tecnologia for escalada para a indústria, ela pode reduzir custos de produção e emissões, além de aumentar a precisão do processo e o valor dos produtos.", "titulo_pt": "Cientistas chineses desenvolvem nova técnica de refino de petróleo que pode reduzir energia consumida em 90%", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 158362, "titulo": "Pegadas de 66 milhões de anos são primeira trilha conhecida de um T. rex adulto", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/pegadas-de-66-milhoes-de-anos-sao-primeira-trilha-conhecida-de-um-t-rex-adulto.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-13T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores do Museu da Natureza e Ciências de Denver, nos Estados Unidos, e da Universidade de John Moores em Liverpool, na Inglaterra, encontraram, pela primeira vez, pegadas atribuídas a um adulto de Tyrannosaurus rex, datadas há 66 milhões de anos.", "titulo_pt": "Pegadas de 66 milhões de anos são a primeira trilha conhecida de um T. Rex adulto", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 158504, "titulo": "“Es un esfuerzo colectivo”: la Argentina se suma a una red global que utiliza cámaras trampa para monitorear mamíferos terrestres", "url": "https://www.lanacion.com.ar/sociedad/es-un-esfuerzo-colectivo-la-argentina-se-suma-a-una-red-global-que-utiliza-camaras-trampa-para-nid13092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-13T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Argentina participa de uma rede global chamada Snapshot Global, que utiliza câmeras-trampa para monitorar mamíferos terrestres. As imagens e metadados coletados podem contribuir para a conservação dessas espécies.", "titulo_pt": "É um esforço coletivo: Argentina se une à rede global snapshot global para monitorar mamíferos terrestres", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 158822, "titulo": "Chinese scientists find ‘extremely high-value’ underwater gold mine in Pacific", "url": "https://www.scmp.com/news/china/science/article/3367337/chinese-scientists-find-extremely-high-value-underwater-gold-mine-pacific?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-13T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas chineses relataram a descoberta de uma grande reserva mineral subaquática no Pacífico Ocidental, rica em ouro e prata. A descoberta foi feita durante uma expedição científica conjunta envolvendo várias instituições acadêmicas chinesas.", "titulo_pt": "Cientistas chineses encontram grande mina subaquática rica em ouro e prata no pacífico", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 158897, "titulo": "Ancient armored fish evolved two distinct ways to crush prey 385 million years ago", "url": "https://phys.org/news/2026-09-ancient-armored-fish-evolved-distinct.html", "fonte_id": "phys_org", "data_pub": "2026-09-13T08:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há 385 milhões de anos, peixes armados evoluíram de duas maneiras distintas para desenvolver mandíbulas que trituravam presas e dentes afiados, permitindo sobrevivência e diversificação em oceanos antigos antes da aparição dos dinossauros.", "titulo_pt": "Peixes armados evoluíram duas formas distintas para triturar presas há 385 milhões de anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 158419, "titulo": "Gosta de café bem quente? Hábito pode triplicar risco de câncer de esôfago, diz estudo", "url": "https://exame.com/ciencia/gosta-de-cafe-bem-quente-habito-pode-triplicar-risco-de-cancer-de-esofago-diz-estudo/", "fonte_id": "exame", "data_pub": "2026-09-13T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo com cerca de 980 mil adultos identificou um maior risco de câncer de esôfago para aqueles que preferiam bebidas quentes ou muito quentes.", "titulo_pt": "Gosta de café bem quente? Hábito pode triplicar risco de câncer de esôfago, diz estudo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 158420, "titulo": "Novo 'interruptor' dos ossos pode abrir caminho para tratar osteoporose", "url": "https://exame.com/ciencia/novo-interruptor-dos-ossos-pode-abrir-caminho-para-tratar-osteoporose/", "fonte_id": "exame", "data_pub": "2026-09-13T05:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um composto experimental ativou o receptor GPR133 e aumentou a resistência do tecido em ratos saudáveis e com perda de massa óssea. Este 'interruptor' dos ossos pode abrir caminho para novos métodos de tratamento da osteoporose.", "titulo_pt": "Novo 'interruptor' dos ossos pode abrir caminho para tratar osteoporose", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 158424, "titulo": "Novo efeito do Ozempic: estudo encontra relação com menos crises de asma", "url": "https://exame.com/ciencia/novo-efeito-do-ozempic-estudo-encontra-relacao-com-menos-crises-de-asma/", "fonte_id": "exame", "data_pub": "2026-09-13T05:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo com registros de até 22 mil pacientes identificou um possível efeito secundário do Ozempic, uma medicação para diabetes, que pode reduzir as crises de asma em 20%. Além disso, o estudo também mostrou uma diminuição de 20% nas exacerbações da doença pulmonar obstrutiva crônica (DPOC) associada à semaglutida, substância ativa do Ozempic.", "titulo_pt": "Novo efeito do Ozempic: estudo relaciona com redução de crises de asma e dpoc", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 158425, "titulo": "Fumar para socializar? Estudo mostra que hábito traz mais solidão", "url": "https://exame.com/ciencia/fumar-para-socializar-estudo-mostra-que-habito-traz-mais-solidao/", "fonte_id": "exame", "data_pub": "2026-09-13T05:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo acompanhou participantes de 15 países europeus por dois anos e identificou mudanças na percepção de isolamento social relacionadas ao hábito de fumar. O título traduzido é: 'Fumar para socializar? Estudo mostra que hábito traz mais solidão'.", "titulo_pt": "Fumar para socializar? Estudo mostra que hábito traz mais solidão", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 158427, "titulo": "Existe uma fórmula para o amor? Matemática tenta explicar por que casais duram mais", "url": "https://exame.com/ciencia/existe-uma-formula-para-o-amor-matematica-tenta-explicar-por-que-casais-duram-mais/", "fonte_id": "exame", "data_pub": "2026-09-13T04:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Modelos matemáticos analisam como atração, conflitos e respostas emocionais afetam a estabilidade dos relacionamentos ao longo do tempo. Existem tentativas de usar a matemática para explicar por que alguns casais duram mais.", "titulo_pt": "Existe uma fórmula para o amor? Matemática tenta explicar a durabilidade dos casamentos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 158429, "titulo": "Dentes antigos revelam que humanos já usavam drogas há 25 mil anos", "url": "https://exame.com/ciencia/dentes-antigos-revelam-que-humanos-ja-usavam-drogas-ha-25-mil-anos/", "fonte_id": "exame", "data_pub": "2026-09-13T04:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores encontraram vestígios de arecolina e sinais de desgaste dentário incomum em restos de caçadores-coletores da Indonésia, indicando o uso de drogas há cerca de 25 mil anos.", "titulo_pt": "Dentes antigos revelam que humanos já usavam drogas há 25 mil anos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 158913, "titulo": "APOD: 2026 September 13 – Comet NEOWISE Rising over the Adriatic Sea", "url": "https://science.nasa.gov/image-article/apod-2026-september-13-comet-neowise-rising-over-the-adriatic-sea/", "fonte_id": "nasa_news", "data_pub": "2026-09-13T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia do APOD em 13 de setembro de 2026 mostra um cometa NEOWISE se elevando sobre o Mar Adriático. Esta imagem é parte da coleção de imagens do APOD, que apresenta uma foto ou imagem do cosmos todos os dias, acompanhada por uma breve explicação escrita por um astrônomo profissional.", "titulo_pt": "Cometa NEOWISE se elevando sobre o mar adriático (2026, 13 de setembro)", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 158901, "titulo": "Venus’s pale yellow clouds may hide something surprisingly dark", "url": "https://www.sciencedaily.com/releases/2026/09/260912220022.htm", "fonte_id": "science_daily", "data_pub": "2026-09-13T03:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa identificou que o material desconhecido nas nuvens escuras de ultravioleta do Vênus absorve a luz de forma mais intensa do que se imaginava, o que limita as possibilidades. Isso pode auxiliar futuros spacecrafts a determinar se o material é orgânico, inorgânico ou algo inesperado.", "titulo_pt": "Nuvens pálidas amarelas do vênus podem esconder algo surpreendentemente escuro", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 158903, "titulo": "Scientists find water was fueling volcanoes 3 billion years ago", "url": "https://www.sciencedaily.com/releases/2026/09/260911214305.htm", "fonte_id": "science_daily", "data_pub": "2026-09-13T03:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos realizados em rochas antigas da Austrália Ocidental sugerem que água estava atingindo profundidades da Terra há mais de três bilhões de anos, antes do desenvolvimento completo dos tectonicoss de placas modernos. Os pesquisadores propõem que fragmentos da crosta ricos em água periodicamente se infiltravam na crosta através de um processo chamado 'dripduction', onde a água enterrada contribuiu para a formação de magma e erupções vulcânicas.", "titulo_pt": "Cientistas descobrem que água alimentava vulcões há 3 bilhões de anos", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 158905, "titulo": "A hidden compound in healthy foods may worsen IBD", "url": "https://www.sciencedaily.com/releases/2026/09/260911214250.htm", "fonte_id": "science_daily", "data_pub": "2026-09-13T02:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um composto natural presente em alimentos como espinafre, amêndoas e batatas-doce pode agravar a inflamação intestinal em pessoas com doenças inflamatórias do intestino (DIInt), como a doença de Crohn e a colite ulcerosa, devido a uma maneira diferente de processamento intestinal desses indivíduos. Os pesquisadores sugerem que esse descobrimento pode levar ao desenvolvimento de dietas com menor oxalato ou tratamentos microbiométicos personalizados para pessoas com DIInt.", "titulo_pt": "Compônente natural em alimentos pode agravar inflamação intestinal em pessoas com diint", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 158906, "titulo": "Ozempic and Wegovy may raise hair loss risk in some men", "url": "https://www.sciencedaily.com/releases/2026/09/260911214241.htm", "fonte_id": "science_daily", "data_pub": "2026-09-13T02:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Medicamentos como Ozempic, Wegovy e Zepbound, que pertencem ao grupo de GLP-1, podem aumentar o risco de calvície em 7% em homens geneticamente predispostos à calvície masculina. Esses achados indicam que a queda de cabelo pode não estar apenas relacionada à perda rápida de peso e pode refletir uma ligação biológica entre a atividade de GLP-1 e os folículos pilosos.", "titulo_pt": "Ozempic e Wegovy podem aumentar o risco de calvície em homens suscetíveis geneticamente", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}], "ciencia__eventos": [], "cultura": [{"id": 158852, "titulo": "Lee congratulates S. Korean director on Venice film festival award", "url": "https://en.yna.co.kr/view/AEN20260913002200315", "fonte_id": "yonhap_news", "data_pub": "2026-09-13T08:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente sul-coreano Lee Jae Myung congratulou um diretor sul-coreano após a cerimônia do Festival de Cinema de Veneza.", "titulo_pt": "Lee jae myung comemora vitória de diretor sul-coreano em festival de veneza", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 158334, "titulo": "Emmy reconhece ter pouca diversidade em edição com 'The Pitt' e recorde de 'Hacks'", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/emmy-reconhece-ter-pouca-diversidade-em-edicao-com-the-pitt-e-recorde-de-hacks.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-13T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na noite desta segunda-feira, o Emmy premiará as melhores séries e programas de TV do ano, mas a organização reconhece a falta de diversidade entre os indicados. A cerimônia acontece em Los Angeles, transmitida às 20h30 nos canais TNT e HBO Max.", "titulo_pt": "Emmy reconhece falta de diversidade em edição com 'The Pitt' e recorde de 'Hacks'", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 158335, "titulo": "Maroon 5, em 28° show no Brasil, faz o arroz com feijão que o brasileiro ama no Rock in Rio", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/maroon-5-em-28-show-no-brasil-faz-o-arroz-com-feijao-que-o-brasile function toggleDrill(id) {

}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });

};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
