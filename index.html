<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

const D = {"gerado_em": "08/09/2026 21:10", "stats": {"noticias_novas": 1408, "resumos_gerados": 240}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A crise no Supremo Tribunal Federal (STF) continua dominando o cenário político brasileiro, com tensões entre os ministros e decisões que afetam a Polícia Federal. O ministro André Mendonça manteve a liberdade do ex-procurador Virgílio Antônio Ribeiro de Oliveira Filho e revogou a tornozeleira eletrônica de três investigados. O STF formou uma maioria para afastar o diretor-geral da PF, Andrei Rodrigues, mesmo com o pedido de vista do ministro Gilmar Mendes. Especialistas e pesquisas indicam que a eleição presidencial de 2026 será definida na última semana antes do segundo turno, com Flávio Bolsonaro ultrapassando Lula em um estado-chave. O ex-presidente Lula lidera as intenções de voto em Minas Gerais, com 44% das preferências, contra 35% de Flávio Bolsonaro, segundo a AtlasIntel.", "mundo": "Os Estados Unidos realizaram ataques a cinco navios petroleiros do Irã após os mais recentes ataques a uma de suas embarcações de guerra, aumentando a tensão no Oriente Médio. O Irã acusa os Estados Unidos de terem iniciado os ataques, enquanto os EUA negam e afirmam que estão tomando medidas para proteger suas operações marítimas. Em outro desenvolvimento, a Coreia do Sul enviou uma equipe para avaliar a situação no Estreito de Ormuz, enquanto Israel enfrenta uma campanha eleitoral tensa e incerta, com preocupações sobre a possibilidade de uma retomada de violência política e contestação dos resultados. Além disso, doze países, incluindo França e Reino Unido, anunciaram sanções contra os assentamentos israelenses na Cisjordânia, em resposta a acusações de 'limpeza étnica' praticada pelos colonos israelenses.\n\nA Coreia do Norte enfrenta estratégias da China e da Rússia, com Xi Jinping e Vladimir Putin prometendo laços mais estreitos com Pyongyang. O Estreito de Ormuz, local estratégico, permanece sob controle americano, levando a Coreia do Sul a considerar o deslocamento de tropas. O conflito na Ucrânia continua, com a Rússia ameaçando uma resposta 'dura e dolorosa' após a expulsão de diplomatas por parte da Hungria. O Irã intensificou ataques contra instalações de petróleo na Arábia Saudita, gerando preocupações sobre a escalada do conflito regional. Israel reagiu com o fechamento do consulado britânico em Jerusalém, em resposta a sanções impostas pelo Reino Unido. A União Europeia planeja investir 200 milhões de euros em Groenlândia, enquanto a China e os Estados Unidos buscam colaborar em inteligência artificial sem confiança mútua. O conflito na Ucrânia persiste, com novos ataques a Kyiv após uma visita de alto escalão dos Estados Unidos sem avanços significativos. A Coreia do Sul e a República Tcheca discutem a expansão da cooperação militar, enquanto a Albânia bloqueia um navio suspeito, apoiado pelo Kremlin, em solidariedade à Ucrânia. Estes eventos refletem a complexidade e a intensidade da geopolítica global atual, marcada por tensões regionais e alinhamentos estratégicos.", "economia": "O preço do petróleo está próximo de US$100 por barril após os Estados Unidos realizarem novas operações militares contra navios associados aos Guardiões Revolucionários do Irã, o que gerou tensões no mercado energético. Em outro desenvolvimento, a CVM multou o ex-banqueiro Daniel Vorcaro em R$ 20 milhões por fraude em um fundo imobiliário, elevando o total de multas a R$ 201 milhões com sete pessoas e nove empresas envolvidas. Além disso, a Receita Federal bloqueou R$ 1 bilhão em fraudes relacionadas ao salário-maternidade do INSS, identificando pagamentos em pedidos suspeitos realizados por empresas e organizações fictícias. A previsão da inflação para 2023 foi reduzida pelo mercado financeiro para 5%, de acordo com o Boletim Focus do Banco Central, que estabeleceu a meta em 3%, com tolerância de 1,5 ponto percentual.", "tecnologia": "A Meta lançou um assistente de inteligência artificial chamado Muse, que pode enviar e-mails e reservar viagens automaticamente, apesar das preocupações internas sobre a gestão de dados pessoais. Em um desenvolvimento legal significativo, o The New York Times entrou com uma ação contra a OpenAI e a Microsoft, que agora apresentaram seus argumentos a um juiz. Isso pode afetar o modelo de negócios do setor de publicações e a indústria de IA. A D-Wave, uma empresa de computação quântica, fechou um acordo de US$ 100 milhões com o Departamento de Comércio dos Estados Unidos para avançar em tecnologias de computação quântica, com o governo obtendo uma participação minoritária na empresa. Além disso, a Samsung e a Mistral AI estabeleceram uma parceria estratégica para desenvolver modelos de IA específicos para operações de semicondutores, enquanto a Coreia do Sul planeja investir 4,7 trilhões de wons no desenvolvimento de modelos de IA avançada.", "ciencia": "A NASA lançou um convite para propostas que acelerem a tecnologia e infraestrutura necessárias para a exploração lunar e a instalação de uma base no polo sul lunar, visando preencher lacunas de capacidade, como geração de energia, extração de oxigênio e produção de materiais na Lua. Em um desenvolvimento científico notável, pesquisadores descobriram um fotão incomum que deveria ter sido destruído em seu caminho até a Terra, levantando novas perguntas sobre fenômenos cósmicos. Além disso, a Hubble Space Telescope da NASA capturou uma nebulosa chamada N44 na Grande Nuvem de Magalhães, revelando um vasto vazio central conhecido como 'superbulha', com cerca de 210 por 140 luzes-anos de diâmetro. Estes eventos refletem avanços significativos na ciência espacial e cósmica.", "cultura": "O evento mais importante dos artigos publicados é a confirmação da produção da nova temporada de 'Avenida Brasil' para 2027, anunciada pela Globo. O programa, que foi um grande sucesso, retorna com novos episódios após uma pausa. Paralelamente, a Cinemateca realiza uma mostra de filmes de 1976, explorando obras marcadas por utopias desbotadas, incluindo 'Comment Ça Va', de Jean-Luc Godard, exibido no Festival de Cannes. Em Veneza, o filme 'Bunker', com Javier Bardem e Penélope Cruz, aborda a dificuldade moderna de sentir emoções em um mundo cheio de estímulos visuais. Outras notícias culturais incluem a publicação de uma nova edição da editora Fósforo sobre o trabalho de Raduan Nassar, a apresentação de Paulo Miklos em São Paulo com covers de 'Evidências' e 'Saudosa Maloca', e a realização de edições especiais do programa Sem Censura na TV Brasil para comemorar os 90 anos da Rádio Nacional.", "sociedade": "A governadora Hochul anunciou a expansão do pré-escolar gratuito em Nova York, com 402 distritos agora oferecendo vagas. O objetivo do estado é alcançar a cobertura universal até 2028. Por outro lado, uma médica e uma clínica em Santa Catarina foram condenadas após uma paciente engravidar devido a erros na aplicação e acompanhamento de um implante contraceptivo. Na área da educação, a pesquisa de Fernanda Leite, da Universidade do Texas, destaca a importância da educação e liderança no desenvolvimento pessoal e profissional. Além disso, a greve dos bancários avançou pelo país, afetando o atendimento em bancos públicos como a Caixa e o Banco do Brasil.", "meio_ambiente": "Um estudo recente mostrou que o biometano pode reduzir as emissões no setor de transporte em até 75%, destacando o potencial do Brasil na produção e exportação de tecnologias relacionadas a esse combustível. Paralelamente, em um zoológico perto de Atenas, três tigres de Sumatra, considerados críticamente em perigo de extinção, receberam vacinas e microchipagens como parte de esforços de conservação. Finalmente, uma pergunta e resposta foi realizada sobre o papel do aquecimento global nas inundações flash que atingiram uma região do Himalaia na fronteira do Nepal e da China em 26 de agosto, com especialistas discutindo as limitações na atribuição direta do fenômeno às mudanças climáticas globais.", "direitos_humanos": "O Ministério Público Federal (MPF) solicitou R$ 50 mil à União em relação à demora na reação à invasão da Terra Indígena Ituna-Itatá, no Pará, onde mais de 500 pessoas invadiram a área protegida, destinada a indígenas isolados. Este evento levantou preocupações sobre o aumento de queimadas, desmatamento e ameaças à segurança dos servidores da Fundação Nacional do Índio (Funai)."}, "resumo_do_dia": {"politica_nacional": [{"id": 151981, "titulo": "Candidato de Bolsonaro diz que Marina Silva faz \"hora extra\" na Terra", "url": "https://www.metropoles.com/colunas/demetrio-vecchioli/candidato-de-bolsonaro-diz-que-marina-silva-faz-hora-extra-na-terra", "fonte_id": "metropoles", "data_pub": "2026-09-08T23:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bruno Scheid, ex-candidato apoiado por Bolsonaro, criticou Marina Silva, ex-ministra, comparando-a a um 'jabuti'. Scheid também foi proibido de usar o sobrenome do presidente.", "titulo_pt": "Candidato de Bolsonaro chama Marina Silva de 'jabuti'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 151845, "titulo": "Delegados da PF defendem que apenas plenário do STF poderia afastar diretor-geral, e não decisão monocrática", "url": "https://g1.globo.com/politica/noticia/2026/09/08/nota-delegados-pf-afastamento-andrei.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-08T23:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Associação dos Delegados da Polícia Federal (ADPF) afirmou que o afastamento do diretor-geral da Polícia Federal, Andrei Rodrigues, deveria ser decidido pelo plenário do Supremo Tribunal Federal (STF) e não por uma decisão monocrática. Segundo a ADPF, essa medida é necessária para preservar a autoridade do Tribunal, especialmente considerando documentos de investigações em andamento envolvendo ministros do STF.", "titulo_pt": "Delegados da PF defendem que afastamento do diretor-geral só poderia ser decidido pelo plenário do STF", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 151846, "titulo": "Mendonça manda soltar ex-procurador do INSS", "url": "https://g1.globo.com/politica/noticia/2026/09/08/mendonca-manda-soltar-ex-procurador-do-inss.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-08T23:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro André Mendonça, do Supremo Tribunal Federal, determinou a soltura do ex-procurador-geral Virgílio Antônio Ribeiro de Oliveira Filho, que estava envolvido em uma investigação sobre desvios em aposentadorias pelo INSS. Ele terá que usar tornozeleira eletrônica e cumprir outras restrições judiciais.", "titulo_pt": "Mendonça libera ex-procurador do INSS", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 151895, "titulo": "Conselheiros de Lula e Flávio para a Saúde apresentam planos semelhantes para o SUS", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/equilibrioesaude/2026/09/conselheiros-de-lula-e-flavio-para-a-saude-apresentam-planos-semelhantes-para-o-sus.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-08T22:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Conselheiros de Lula e Flávio Bolsonaro apresentaram ideias semelhantes para o SUS em um evento nesta terça-feira (8). Ambos os partidos escolheram nomes para formular planos de saúde para a disputa presidencial de 2026.", "titulo_pt": "Conselheiros de Lula e Flávio para a Saúde apresentam planos semelhantes para o SUS", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 152173, "titulo": "Delegados da PF temem 'efeito cascata' e impacto duradouro da guerra Moraes-Mendonça na corporação", "url": "https://www.bbc.com/portuguese/articles/c2l8704v88zo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-08T22:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Delegados da Polícia Federal expressam preocupação com os possíveis efeitos da crise no Supremo Tribunal Federal (STF) sobre a corporação, incluindo o enfraquecimento da PF e impactos duradouros na autonomia institucional.", "titulo_pt": "Delegados da PF temem 'efeito cascata' e impacto duradouro da guerra Moraes-Mendonça na corporação", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 151847, "titulo": "Veja o que é #FATO e o que é #FAKE na entrevista de Douglas Ruas a 'O Globo', 'Extra', 'Valor' e CBN", "url": "https://g1.globo.com/fato-ou-fake/eleicoes/noticia/2026/09/08/veja-o-que-e-fato-e-o-que-e-fake-na-entrevista-de-douglas-ruas-a-o-globo-extra-valor-e-cbn.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-08T22:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Douglas Ruas, candidato ao governo do Rio de Janeiro pelo partido PL, foi entrevistado por 'O Globo', 'Extra', 'Valor' e CBN nesta terça-feira (8). A entrevista, conduzida por apresentadores e jornalistas das emissoras e publicações, começou às 10h30.", "titulo_pt": "Veja O que é #FATO e O que é #FAKE na entrevista de Douglas Ruas a 'O Globo', 'Extra', 'Valor' e CBN", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 152150, "titulo": "AGU pede a Fachin suspensão de liminar de André Mendonça que afastou cúpula da PF", "url": "https://www.jota.info/stf/do-supremo/agu-pede-a-fachin-suspensao-de-liminar-de-andre-mendonca-que-afastou-cupula-da-pf", "fonte_id": "jota", "data_pub": "2026-09-08T22:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Advocacia-Geral da União (AGU) pediu ao ministro Fachin que suspenda uma liminar emitida por André Mendonça, que afastou a cúpula da Polícia Federal (PF). De acordo com a AGU, a decisão de Mendonça viola a prerrogativa constitucional privativa do presidente para nomear e demitir cargos de direção da PF.", "titulo_pt": "AGU pede suspensão de liminar que afastou cúpula da PF", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 152103, "titulo": "Relação Moraes-Vorcaro, Mendonça afasta Andrei: tudo sobre a crise no STF", "url": "https://www.cnnbrasil.com.br/politica/relacao-moraes-vorcaro-mendonca-afasta-andrei-tudo-sobre-a-crise-no-stf/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-08T22:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A tensão no Supremo Tribunal Federal (STF) aumentou com a revelação do sigilo de um relatório da Polícia Federal. O ministro André Mendonça se afastou do caso Vorcaro, que está em disputa com o ministro Luís Roberto Barroso.", "titulo_pt": "Relação Moraes-Vorcaro, Mendonça afasta Andrei: tudo sobre a crise no STF", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 151896, "titulo": "Quem é William Murad, que assumiu interinamente comando da PF após afastamento de diretor", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/quem-e-william-murad-que-assumiu-interinamente-comando-da-pf-apos-afastamento-de-diretor.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-08T22:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "William Marcel Murad, diretor-executivo da Polícia Federal, assumiu de forma interina o comando da instituição após André Rodrigues ser afastado, conforme determinação do ministro André Mendonça do STF.", "titulo_pt": "Quem é William Murad, que assumiu interinamente o comando da PF após afastamento de diretor?", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 152054, "titulo": "Flávio Bolsonaro ultrapassa Lula no 2º turno em estado-chave das eleições, mostra pesquisa", "url": "https://veja.abril.com.br/brasil/em-mg-estado-chave-das-eleicoes-flavio-bolsonaro-ultrapassa-lula-no-2o-turno-diz-quaest/", "fonte_id": "veja", "data_pub": "2026-09-08T22:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que Flávio Bolsonaro ultrapassa Lula no segundo turno em um estado-chave das eleições. O senador Flávio Bolsonaro tem apresentado uma ascensão nas intenções de voto, enquanto Lula tem registrado uma queda.", "titulo_pt": "Flávio Bolsonaro supera Lula no segundo turno em estado-chave, mostra pesquisa", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 151897, "titulo": "Lula deve defender saída institucional para crise e evitar ataques a Mendonça", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/lula-deve-defender-saida-institucional-para-crise-e-evitar-ataques-a-mendonca.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-08T22:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após reunião com aliados e ministros, Lula pretende buscar soluções institucionais para a crise entre o STF e a PF, evitando ataques ao ministro Mendonça.", "titulo_pt": "Lula deve buscar saídas institucionais para crise entre stf e pf e evitar ataques a Mendonça", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 151898, "titulo": "Parente de Maluf tem material de campanha vandalizado na Paulista; veja vídeo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/parente-de-maluf-tem-material-de-campanha-vandalizado-na-paulista.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-08T22:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Albertinho Maluf, candidato a deputado estadual pelo PP, relata que seu material de campanha tem sido alvo de furtos nas calçadas da capital paulista.", "titulo_pt": "Parente de Maluf tem material de campanha vandalizado na Paulista; veja vídeo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 151998, "titulo": "Mendonça solta operador da Conafer e revoga tornozeleira de 3 investigados", "url": "https://www.metropoles.com/colunas/manoela-alcantara/mendonca-solta-operador-da-conafer-e-revoga-tornozeleira-de-3-investigados", "fonte_id": "metropoles", "data_pub": "2026-09-08T22:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Mendonça revogou a tornozeleira eletrônica de três investigados, mas manteve outras restrições. Ele considerou que o avanço nas investigações reduziu a necessidade das medidas restritivas.", "titulo_pt": "Mendonça libera três investigados e mantém restrições", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 152117, "titulo": "Eleição será definida na semana anterior ao 2° turno, dizem especialistas", "url": "https://www.cnnbrasil.com.br/eleicoes/eleicao-sera-definida-na-semana-anterior-ao-2-turno-dizem-especialistas/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-08T22:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas avaliam que um empate técnico entre Lula e Flávio Bolsonaro deve persistir até o segundo turno das eleições de 2026. A eleição será definida na semana anterior ao segundo turno, segundo as especialidades.", "titulo_pt": "Eleição de 2026 será definida na semana anterior ao 2° turno, dizem especialistas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 151899, "titulo": "AGU vê prerrogativa da Presidência ao recorrer contra decisão de Mendonça que afastou chefe da PF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/agu-recorre-contra-decisao-de-mendonca-que-afastou-diretor-geral-da-pf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-08T22:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Advocacia-Geral da União recorreu da decisão do ministro do STF André Mendonça que determinou o afastamento do diretor-geral da Polícia Federal, Andrei Rodrigues. A AGU contesta a medida no STF.", "titulo_pt": "AGU recorre contra decisão que afastou chefe da PF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 151874, "titulo": "Carmen Lúcia rejeita ação no STF que contestava teto para taxa de cartões de VR", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/carmen-lucia-rejeita-acao-no-stf-que-contestava-teto-para-taxa-de-cartoes-de-vr.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-08T22:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ministra do STF Cármen Lúcia rejeitou nesta segunda-feira (7) uma ação que contestava o teto para as taxas de vale-refeição e alimentação estabelecido pelo governo federal.", "titulo_pt": "Cármen Lúcia rejeita ação que contestava teto para taxa de vale-refeição", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 152786, "titulo": "12 countries including France, UK say will sanction trade with Israeli", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/09/2003863932", "fonte_id": "taipei_times", "data_pub": "2026-09-09T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Doze países, incluindo França e Reino Unido, afirmaram que vão sanear comércio com Israel.", "titulo_pt": "Doze países, incluindo França e reino unido, ational-security/2026/09/08/us-launches-strikes-5-iranian-oil-tankers-after-latest-attacks-warships/", "fonte_id": "washington_post_world", "data_pub": "2026-09-08T23:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos realizaram ataques a cinco navios petroleiros da Irã após os mais recentes ataques a uma de suas embarcações de guerra. Esta ação ocorre após violência semelhante na semana anterior, com forças iranianas e americanas trocando tiros enquanto esforços diplomáticos para encerrar a guerra estão em estagnação.", "titulo_pt": "EUA realizam ataques em cinco navios petroleiros iranianos após novos ataques a embarcação de guerra", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 152537, "titulo": "Trump's summer of sabotage", "url": "https://www.axios.com/2026/09/08/donald-trump-senate-republicans-midterm-convention-trade-canada", "fonte_id": "axios", "data_pub": "2026-09-08T22:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Congressistas republicanos estão se preparando para dividir o palco com um presidente que, durante o recesso de agosto, complicou suas tentativas de conduzir suas campanhas de acordo com seus próprios termos. Ao prolongar as subsídios federais de creche, a administração Trump está nacionalizando a eleição, o que contraria a ortodoxia republicana em questões como importações de carne bovina e subsídios de creche.", "titulo_pt": "Verão de sabotagem de trump", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 152987, "titulo": "Xi, Putin pledge closer 'strategic' ties with N. Korea in founding anniv. messages", "url": "https://en.yna.co.kr/view/AEN20260909001200315", "fonte_id": "yonhap_news", "data_pub": "2026-09-08T22:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente chinês Xi Jinping e o presidente russo Vladimir Putin enviaram mensagens de aniversário que prometem laços mais estreitos e estratégicos com a Coreia do No nder um carro ou reservar um voo.", "titulo_pt": "Muse, novo assistente pessoal de IA da Meta, precisa da sua confiança", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 152931, "titulo": "Apple and Google Miss Deadline to Block Child Nudity on Their Phones in the UK", "url": "https://www.wired.com/story/apple-and-google-miss-deadline-to-block-child-nudity-on-their-phones-in-the-uk/", "fonte_id": "wired", "data_pub": "2026-09-08T18:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa britânica de tecnologia planeja introduzir novas leis que exigiriam que as empresas enfrentassem multas e responsabilidade criminal potencial se não bloquearem a nudez infantil em seus dispositivos. As plataformas Snapchat e Instagram podem também ser incluídas nessas medidas.", "titulo_pt": "Regras novas para bloquear nudez infantil em dispositivos de apple e Google no reino unido", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 152382, "titulo": "Medicine Needs to Get Serious About AI", "url": "https://www.theatlantic.com/health/2026/09/artificial-intelligence-autonomous-doctor-medicine/688543/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-08T16:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo sugere que os robôs devem ter a oportunidade de exercer a medicina.", "titulo_pt": "A medicina precisa levar a IA seriously", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 152932, "titulo": "OpenAI Just Claimed a Huge Math Discovery. Some Academics Are Crying Foul", "url": "https://www.wired.com/story/openai-navier-stokes-math-discovery-academics/", "fonte_id": "wired", "data_pub": "2026-09-08T16:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A labra de vanguarda em inteligência artificial fez uma importante declaração, mas foi rapidamente desviada para acusações de impropriedade.", "titulo_pt": "Openai alegou uma grande descoberta matemática. Alguns acadêmicos estão negando", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 152544, "titulo": "OpenAI's historic math solution overshadowed by credit controversy", "url": "https://www.axios.com/2026/09/08/openai-math-solution-navier-stokes-credit", "fonte_id": "axios", "data_pub": "2026-09-08T16:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI afirma que seu AI resolviu o problema do Prêmio Milenial Navier–Stokes, mas o feito está em sombra devido a questionamentos sobre pesquisas não publicadas de matemáticos externos. A controvérsia toca em questões de confiança centrais para a ciência assistida por IA: se os pesquisadores podem usar ferramentas de laboratórios de ponta de forma segura para trabalhar com descobertas não publicadas.", "titulo_pt": "Resolução histórica do problema navier–stokes de openai sob sombras de controvérsia", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 152909, "titulo": "Samsung, Mistral AI forge semiconductor AI partnership", "url": "https://www.koreaherald.com/article/10866843", "fonte_id": "korea_herald", "data_pub": "2026-09-08T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Samsung e a empresa de IA francesa Mistral AI estabeleceram uma parceria estratégica para desenvolver modelos de IA específicos para o design e a fabricação de semicondutores. O objetivo é criar e implementar soluções de IA para operações de semicondutores da Samsung, incluindo o design de chips, otimização do processo de fabricação e fluxos de trabalho de engenharia.", "titulo_pt": "Samsung e Mistral AI formam parceria para IA em semicondutores", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 152933, "titulo": "Here’s Samsung’s Advice for Apple and Its Upcoming Folding iPhone", "url": "https://www.wired.com/story/samsung-advice-for-apple-and-its-upcoming-folding-iphone/", "fonte_id": "wired", "data_pub": "2026-09-08T16:00:00Z", "idioma": "en", "provavel_duplicata_de": -technologies/", "fonte_id": "nasa_news", "data_pub": "2026-09-08T20:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA está buscando propostas para acelerar a tecnologia e infraestrutura necessárias para explorar a Lua e estabelecer uma base lunar no polo sul lunar. O convite visa preencher lacunas de capacidade, incluindo geração de energia, extração de oxigênio e produção de materiais na Lua necessários para construção e operações.", "titulo_pt": "NASA chama propostas para acelerar tecnologias Lunar", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 153024, "titulo": "This cosmic particle was never meant to reach Earth. Now scientists think they finally know why it did", "url": "https://www.scientificamerican.com/article/this-cosmic-particle-was-never-meant-to-reach-earth-now-scientists-think-they-finally-know-why-it-did/", "fonte_id": "scientific_american", "data_pub": "2026-09-08T18:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2022, pesquisadores detectaram um fotão muito incomum de uma explosão de raios gama enorme que deveria ter sido destruído em seu caminho até a Terra.", "titulo_pt": "Este partícula cósmica nunca deveria ter chegado à terra. Agora os cientistas acreditam que finalmente sabem o motivo", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 153025, "titulo": "There are just five perfect shapes in math—here's why", "url": "https://www.scientificamerican.com/article/there-are-just-five-perfect-shapes-in-math-heres-why/", "fonte_id": "scientific_american", "data_pub": "2026-09-08T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Existem apenas cinco sólidos platônicos perfeitos, que são exemplos paradigmáticos de perfeição em matemática. A topologia explica por que são exatamente cinco.", "titulo_pt": "Existem apenas cinco formas perfeitas em matemática - e aqui está por que", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 152968, "titulo": "STAT+: FDA warns an API supplier about residue on walls, a corroded product line, and open-toed sandals", "url": "https://www.statnews.com/pharmalot/2026/09/08/fda-warns-api-supplier-residue-corroded-production-line-sandals/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-08T17:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA advertiu um fornecedor de ingredientes farmacêuticos ativos sobre resíduos nas paredes, uma linha de produção corroída e sapatos de ponta aberta no local de trabalho. A agência incluiu fotos na advertência.", "titulo_pt": "FDA avisa fornecedor de ingredientes farmacêuticos sobre resíduos nas paredes, linha de produção corroída e sapatos de ponta aberta", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 153022, "titulo": "A choir of katydid ancestors filled the Jurassic rainforest with song", "url": "https://www.sciencenews.org/article/hear-insect-ancestors-jurassic-sound", "fonte_id": "science_news", "data_pub": "2026-09-08T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma análise das estruturas que produzem som nas asas preservadas revelou os chamados de reprodução de insetos ancestrais do Jurássico, reconstruindo parte do paisagismo sonoro antigo.", "titulo_pt": "Um coro de ancestrais de katydids encheu a floresta do jurássico com sua canção", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 153043, "titulo": "Superbubble in the Large Magellanic Cloud", "url": "https://www.nasa.gov/image-article/superbubble-in-the-large-magellanic-cloud/", "fonte_id": "nasa_news", "data_pub": "2026-09-08T16:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA's Hubble Space Telescope capturou uma nebulosa chamada N44 na Grande Nuvem de Magalhães em 3 de setembro de 2026. N44 é dominada por um vasto vazio central, conhecido como 'superbulha', com cerca de 210 por 140 luzes-anos de diâmetro, e por uma camada de gás denso e escuro.", "titulo_pt": "Superbubble na grande nuvem de magalhães", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 153026, "titulo": "OpenAI claims blockbuster math breakthrough amid swirl of controversy", "url": "https://www.scientificamerican.com/article/openai-claims-blockbuster-math-breakthrough-amid-swirl-of-controversy/", "fonte_id": "scientific_american", "data_pub": "2026-09-08T16:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Antes da divulgação, rumores sobre as origens da prova estavam circulando entre matemáticos na internet. OpenAI negou todas as acusações.", "titulo_pt": "Openai reivindica quebra de novos moldes na matemática em meio a controvérsia", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 153027, "titulo": "Something unique seems to be happening to the brain in menopause", "url": "https://www.scientificamerican.com/article/something-unique-seems-to-be-happening-to-the-brain-in-menopause/", "fonte_id": "scientific_american", "data_pub": "2026-09-08T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa identificou diferenças significativas entre os cambios no cérebro durante a menopausa e durante a gravidez e a puberdade.", "titulo_pt": "Algo único parece estar acontecendo com o cérebro durante a menopausa", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 152833, "titulo": "Endangered Sumatran tigers born in Greece as zoos build safety net", "url": "https://www.scmp.com/news/world/europe/article/3366823/endangered-sumatran-tigers-born-greece-zoos-build-safety-net?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-08T15:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tigres sumatranos, considerados os mais ameaçados do mundo, nasceram em um zoológico na Grécia, contribuindo para um esforço global para preservar essa espécie em perigo. Os filhotes, de duas meses de o": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 152013, "titulo": "81% dos alunos brasileiros já estudam sem celular. O que mudou na aprendizagem?", "url": "https://exame.com/brasil/81-dos-alunos-brasileiros-ja-estudam-sem-celular-o-que-mudou-na-aprendizagem/", "fonte_id": "exame", "data_pub": "2026-09-08T18:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo PISA revela que 81% dos alunos brasileiros já estudam sem o uso de celulares. Embora reduzir a distração digital seja positivo, a pesquisa indica que a tecnologia representa apenas uma parte do problema educacional no Brasil.", "titulo_pt": "81% Dos alunos brasileiros já estudam sem celular. O que mudou na aprendizagem?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 152522, "titulo": "In Sweden, despite anti-immigration rhetoric, public services still rely on foreign workers", "url": "https://www.lemonde.fr/en/international/article/2026/09/08/in-sweden-despite-anti-immigration-rhetoric-public-services-still-rely-on-foreign-workers_6757303_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-08T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apesar das políticas anti-imigrantes promovidas por todos os principais partidos antes das eleições de 13 de setembro, as cidades e regiões suecas continuam a depender fortemente de trabalhadores nascidos fora do país para preencher as lacunas no mercado de trabalho.", "titulo_pt": "Em suécia, apesar das políticas anti-imigrantes, serviços públicos ainda contam com trabalhadores estrangeiros", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 152180, "titulo": "Quais países da América Latina têm educação melhor do que o Brasil, segundo o ranking Pisa", "url": "https://www.bbc.com/portuguese/articles/cx2z9n0853wo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-08T13:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No ranking Pisa const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
