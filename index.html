-menores-em-meio-a-protestos-estudantis/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-21T14:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho de Ministros da Itália aprovou um novo decreto de segurança juvenil que estende a prática de detenção preventiva a menores. Com a norma entrando em vigor imediatamente, a medida representa uma mudança autoritária na política do Estado em relação a crianças e adolescentes.", "titulo_pt": "Itália aprova detenção de menores em meio a protestos estudantis", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 216174, "titulo": "'Comecei a usar cetamina aos 14 anos e aos 22 precisei de fraldas'", "url": "https://www.bbc.com/portuguese/articles/cm8xz1llkr54o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-21T12:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Megan, que começou a usar cetamina aos 14 anos, sofre com dores intensas e não consegue manter o corpo ereto. Ela precisou usar fraldas aos 22 anos devido ao uso abusivo da substância.", "titulo_pt": "Comecei a usar cetamina aos 14 anos e aos 22 precisei de fraldas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 215745, "titulo": "‘Nepo baby’ uproar in Philippines after Gen Z jet-setter named urban poor commissioner", "url": "https://www.scmp.com/week-asia/people/article/3371647/nepo-baby-uproar-philippines-after-gen-z-jet-setter-named-urban-poor-commissioner", "fonte_id": "scmp", "data_pub": "2026-10-21T09:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um jovem de luxo nas Filipinas foi nomeada comissionada para os pobres urbanos, levantando questionamentos sobre suas qualificações para a posição, que envolve questões como insegurança alimentar e abrigos. Zofia Canlas tomou posse como comissionada do Conselho Presidencial para os Pobres Urbanos (PCUP) na última segunda-feira, mas chamou a atenção por fotos em redes sociais mostrando seu estilo de vida fashion e viagens luxuosas.", "titulo_pt": "Escândalo com 'neto da elite' em cargo para os pobres urbanos nas filipinas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 215195, "titulo": "En una serie producida por Campanella, Matías Bagnato cuenta en primera persona el horror de la masacre de Flores", "url": "https://www.lanacion.com.ar/espectaculos/personajes/en-una-serie-producida-por-campanella-matias-bagnato-cuenta-en-primera-persona-el-horror-de-la-nid21102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-21T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Matías Bagnato, sobrevivente da masacre de Flores, conversou com o cineasta Campanella sobre a produção da série documental para HBO Max. Eles discutiram a decisão de contar a história, o papel das vítimas e a figura da mulher que ajudou Bagnato a superar o trauma.", "titulo_pt": "Em série documental produzida por Campanella, Matías Bagnato relata a masacre de Flores", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 215473, "titulo": "‘A house cannot be a privilege’: Thousands rally in Lisbon over housing crisis", "url": "https://www.euronews.com/video/2026/10/21/a-house-cannot-be-a-privilege-thousands-rally-in-lisbon-over-housing-crisis", "fonte_id": "euronews", "data_pub": "2026-10-21T08:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas se manifestaram em frente à Praça Rossio, em Lisboa, em protesto contra os altos custos imobiliários, após a polícia remover um acampamento. Eles votaram em retornar ao local no dia seguinte para acampar novamente.", "titulo_pt": "Casa não é um privilégio: milhares se manifestam em lisboa sobre crise imobiliária", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 215286, "titulo": "A student protest movement has gripped Serbia for two years. This weekend it will try to take power", "url": "https://www.theguardian.com/world/2026/oct/21/protest-movement-serbia-student-list-try-to-take-power", "fonte_id": "guardian_world", "data_pub": "2026-10-21T08:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma movimentação estudantil na Sérvia, conhecida como Student List, tem protestado por dois anos consecutivos. No próximo domingo, a organização tentará desafiar o partido no poder, que já governa há 12 anos.", "titulo_pt": "Movimento estudantil tentará desafiar partido no poder na sérvia neste domingo", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 215671, "titulo": "Woman left elderly father to starve to death while living off his pension", "url": "https://www.koreaherald.com/article/10910408", "fonte_id": "korea_herald", "data_pub": "2026-10-21T08:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher de 39 anos foi condenada a três anos e seis meses de prisão por abandonar seu pai idoso, que morreu de desnutrição. Ela não fornecia alimentos ou cuidados médicos ao pai doente, que tinha 76 anos.", "titulo_pt": "Mulher condenada por deixar pai idoso morrer de fome enquanto vivia do seu pensionista", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 215752, "titulo": "Liberty, equality, tear gas: no nation does mass protests quite like France", "url": "https://www.scmp.com/news/world/europe/article/3371632/liberty-equality-tear-gas-no-nation-does-mass-protests-quite-france", "fonte_id": "scmp", "data_pub": "2026-10-21T07:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As manifestações massivas na França são uma característica comum, envolvendo diversos setores como motoristas, agricultores e trabalhadores do turismo. Essas demonstrações de protesto são tão típicas da França quanto a 'La Marseillaise', hino nacional que reflete a luta contra a tirania.", "titulo_pt": "Liberdade, igualdade, gás de pimenta: na França, as grandes manifestações são uma tradição", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 214905, "titulo": "Educar para o futuro é fortalecer a escola e a cidadania", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/politicas-e-justica/2026/10/educar-para-o-futuro-e-fortalecer-a-escola-e-a-cidadania.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A transformação acelerada, impulsionada por tecnologias como a IA, é uma característica do nosso tempo. O artigo questiona como a escola do futuro deve ser no mundo onde as fronteiras físicas e digitais se cruzam.", "titulo_pt": "Educar para o futuro fortalece a escola e a cidadania", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 216649, "titulo": "World’s climate action falling far short: UN report", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/22/2003866407", "fonte_id": "taipei_times", "data_pub": "2026-10-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório da ONU afirma que as ações globais para combater o clima estão muito aquém das necessidades atuais. As medidas implementadas não estão sendo suficientes para atingir os objetivos climáticos estabelecidos.", "titulo_pt": "Ação global para o clima está muito aquém, diz relatório da ONU", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 216110, "titulo": "Criatura misteriosa ataca animais e assusta moradores de cidade mexicana", "url": "https://www.metropoles.com/vida-e-estilo/criatura-misteriosa-ataca-animais-e-assusta-moradores-de-cidade-mexicana", "fonte_id": "metropoles", "data_pub": "2026-10-21T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em Ciudad Juárez, no México, animais e moradores têm sido assustados por uma criatura misteriosa. Um ufólogo está investigando o caso.", "titulo_pt": "Criatura misteriosa assusta moradores e animais em cidade mexicana", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 216139, "titulo": "Nigéria registra primeiro caso de Ebola em mais de uma década", "url": "https://www.cnnbrasil.com.br/internacional/nigeria-registra-primeiro-caso-de-ebola-em-mais-de-uma-decada/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-21T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Nigéria registrou seu primeiro caso de Ebola em mais de uma década. A paciente, que retornou de uma viagem, foi isolada em Abuja e as autoridades de saúde estão monitorando a propagação do vírus na região.", "titulo_pt": "Nigéria registra primeiro caso de Ebola em mais de uma década", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 216135, "titulo": "ONU diz que mundo perde luta contra mudança climática e cita EUA como principal vilão", "url": "https://www.infomoney.com.br/mundo/onu-diz-que-mundo-perde-luta-contra-mudanca-climatica-e-cita-eua-como-principal-vilao/", "fonte_id": "infomoney", "data_pub": "2026-10-21T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ONU afirma que o mundo está perdendo a luta contra o aquecimento global, mesmo que todos os países cumpram suas promessas de redução de emissões. Segundo a organização, a Terra ainda aquecerá 2,2 graus Fahrenheit acima das temperaturas atuais, e os EUA são citados como principal responsável por esse cenário.", "titulo_pt": "ONU diz que mundo perde luta contra mudança climática e cita EUA como principal vilão", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 216045, "titulo": "Governo fecha cerco aos créditos de reciclagem de embalagens plásticas", "url": "https://veja.abril.com.br/economia/governo-fecha-cerco-aos-creditos-de-reciclagem-de-embalagens-plasticas/", "fonte_id": "veja", "data_pub": "2026-10-21T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo implementou regulamentações que exigem o rastreamento do material de embalagens plásticas utilizadas pelas indústrias, criando desafios para fabricantes e cooperativas.", "titulo_pt": "Governo fecha cerco aos créditos de reciclagem de embalagens plásticas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 216539, "titulo": "UN warns El Nino could be strongest on record as it urges world to prepare", "url": "https://www.euronews.com/2026/10/21/un-warns-elnino-could-be-strongest-on-record", "fonte_id": "euronews", "data_pub": "2026-10-21T14:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A chefe da assistência da ONU alerta que o sistema humanitário não pode lidar sozinho, e $50 milhões foram liberados para 11 países na linha de frente, incluindo Chade e Somália, em face do El Niño que pode ser o mais forte da história.", "titulo_pt": "ONU avisa que El niño pode ser o mais forte da história e pede preparação global", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 216810, "titulo": "Revealed: Expensive gas behind ‘nearly 90%’ of rise in UK electricity bills", "url": "https://www.carbonbrief.org/revealed-expensive-gas-behind-nearly-90-of-rise-in-uk-electricity-bills", "fonte_id": "carbon_brief", "data_pub": "2026-10-21T11:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O aumento significativo nos custos de gás no mercado varejista é responsável por quase 90% do aumento nas contas de energia elétrica residenciais no Reino Unido. Este aumento é atribuído principalmente ao preço elevado do gás, que tem impactado significativamente as contas de energia dos consumidores domésticos.", "titulo_pt": "Revelado: gás caro responsável por 'quase 90%' do aumento nas contas de luz no reino unido", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 216542, "titulo": "Large crowds watch as rescuers try to save stranded shark in South Korea", "url": "https://www.euronews.com/video/2026/10/21/large-crowds-watch-as-rescuers-try-to-save-stranded-shark-in-south-korea", "fonte_id": "euronews", "data_pub": "2026-10-21T10:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Oficiais em Busan realizaram o terceiro esforço para guiar um tubarão resgatado de um canal de volta ao mar. O animal atraíu mais de um milhão de visitantes.", "titulo_pt": "Grande multidão assiste resgate de tubarão preso em canal na Coreia do sul", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 216614, "titulo": "Tokyo and Osaka record latest-ever day above 30 Celsius", "url": "https://www.japantimes.co.jp/news/2026/10/21/japan/tokyo-osaka-weather/", "fonte_id": "japan_times", "data_pub": "2026-10-21T10:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Temperaturas acima de 30 graus Celsius foram registradas em Tóquio e Osaka em outubro, datas mais tardias do ano para ocorrer. O ar quente e úmido veio do sul e atingiu principalmente as áreas ao longo da costa do Pacífico.", "titulo_pt": "Tóquio e Osaka registram os dias mais quentes de outubro", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 216672, "titulo": "(LEAD) Busan authorities guide shark out of canal on third attempt", "url": "https://en.yna.co.kr/view/AEN20261021001751315", "fonte_id": "yonhap_news", "data_pub": "2026-10-21T10:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades da cidade portuária de Busan, na Coreia do Sul, tentaram guiar um tubarão de fora de um canal pela terceira vez. A ação ocorreu em 21 de outubro.", "titulo_pt": "Autoridades de Busan guiam tubarão de um canal pela terceira vez", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 215011, "titulo": "Clima: chuvas retornam ao Sul e calorão atinge até 41°C no Centro-Oeste", "url": "https://www.metropoles.com/brasil/clima-chuvas-retornam-ao-sul-e-calorao-atinge-ate-41c-no-centro-oeste", "fonte_id": "metropoles", "data_pub": "2026-10-21T08:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As chuvas retornam ao Sul do Brasil devido a uma área de baixa pressão e o avanço de frentes frias. No Centro-Oeste, temperaturas elevadas chegam a 41°C.", "titulo_pt": "Clima: chuvas retornam ao Sul e calorão atinge até 41°C no Centro-Oeste", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 215474, "titulo": "Cleanup efforts begin in flood-hit eastern Spain after deadly torrential rain", "url": "https://www.euronews.com/video/2026/10/21/cleanup-efforts-begin-in-flood-hit-eastern-spain-after-deadly-torrential-rain", "fonte_id": "euronews", "data_pub": "2026-10-21T07:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças de resgate realizaram mais de 400 salvamentos na região de Valencia, Espanha, após intensas chuvas que deixaram pelo menos quatro mortos.", "titulo_pt": "Eforças de limpeza começam em área afetada por inundações após chuva torrencial na Espanha", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 215604, "titulo": "As residents of flood-hit Chiba Prefecture rebuild, concerns about the future linger", "url": "https://www.japantimes.co.jp/news/2026/10/21/japan/chiba-rain-one-month/", "fonte_id": "japan_times", "data_pub": "2026-10-21T07:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No Chiba, no Japão, 10 pessoas morreram e 37 ficaram feridas devido ao Tufão Dujuan. Os residentes da região afetada continuam a reconstruir suas vidas, mas preocupações sobre o futuro persistem.", "titulo_pt": "Residentes da Chiba afetada pelo tufão dujuan buscam se reconstruir, mas preocupações futuras persistem", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 215475, "titulo": "Dramatic footage shows ferry engulfed in flames off Indonesia", "url": "https://www.euronews.com/video/2026/10/21/dramatic-footage-shows-ferry-engulfed-in-flames-off-indonesia", "fonte_id": "euronews", "data_pub": "2026-10-21T06:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ferry chamado KMP Batumandi pegou fogo perto do Porto de Merak na Indonésia, mas todos os passageiros e tripulantes foram resgatados.", "titulo_pt": "Imagens dramáticas mostram ferry em chamas perto da indonésia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 215477, "titulo": "How toxic wildfire haze is affecting daily life in Indonesia's cities", "url": "https://www.euronews.com/2026/10/21/how-toxic-wildfire-haze-is-affecting-daily-life-in-indonesias-cities", "fonte_id": "euronews", "data_pub": "2026-10-21T06:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos florestais têm coberto Palangkaraya, na ilha de Borneo, com fuligem tóxica por semanas, causando sintomas respiratórios persistentes, baixas nos rendimentos e interrupções no sistema educacional.", "titulo_pt": "Como a fuligem tóxica dos incêndios florestais afeta a vida diária nas cidades da indonésia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 215819, "titulo": "UNEP: Opportunity has ‘been lost’ to meet 1.5C warming limit without ‘overshoot’", "url": "https://www.carbonbrief.org/unep-opportunity-has-been-lost-to-meet-1-5c-warming-limit-without-overshoot", "fonte_id": "carbon_brief", "data_pub": "2026-10-21T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Organização das Nações Unidas para a Educação, a Ciência e a Cultura (UNEP) afirma que a oportunidade de manter o aumento da temperatura global abaixo da marca de 1,5°C sem um 'overshoot' foi perdida devido a décadas de ação climática insuficiente. Um rompimento temporário da linha de 1,5°C de aquecimento global é agora 'inevitável'.", "titulo_pt": "UNEP: oportunidade foi 'perdida' para atingir a marca de 1,5°C de aquecimento global sem 'overshoot'", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 216325, "titulo": "Controversial US-backed vaccine trial in African newborns halted", "url": "https://www.theguardian.com/world/2026/oct/21/us-vaccine-trial-african-newborns-hepatitis-b", "fonte_id": "guardian_world", "data_pub": "2026-10-21T17:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo de vacina contra hepatite B em recém-nascidos africanos, apoiado pelos EUA e que gerou reação global, foi interrompido. O pesquisador responsável, Frederik Schaltz-Buchholzer, informou que não foi fornecida a aprovação governamental necessária.", "titulo_pt": "Estudo de vacina contra hepatite b em recém-nascidos africanos, apoiado pelos EUA, é interrompido", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 216332, "titulo": "Poland’s parliament votes to ease abortion ban but faces likely veto from president", "url": "https://www.theguardian.com/world/2026/oct/21/poland-parliament-votes-ease-abortion-ban-likely-veto-president", "fonte_id": "guardian_world", "data_pub": "2026-10-21T15:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O parlamento polonês aprovou duas propostas que visam relaxar a proibição quase total de abortos, removendo alguns dos crimes relacionados a quem ajuda as mulheres a terem abortos e permitindo interrupções de gravidezes em casos específicos. No entanto, essas medidas são consideradas um passo pequeno pelos ativistas, que esperam protestos para pressionar o governo a reformar as leis do país.", "titulo_pt": "Parlamento polonês aprova medidas para relaxar banimento de abortos, mas presidente pode vetar", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 216326, "titulo": "Severely ill ICE detainees face imminent deportation to unknown African states, advocates say", "url": "https://www.theguardian.com/us-news/2026/oct/21/ice-detention-illness-deportation-florida", "fonte_id": "guardian_world", "data_pub": "2026-10-21T13:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Familiares de detentos gravemente doentes em duas prisões de imigração na Flórida relatam que autoridades planejam deportá-los para países desconhecidos na África, apesar das condições médicas agravadas. Voo programado para ocorrer a partir de quarta-feira, segundo relatos de familiares e uma organização de defesa dos trabalhadores.", "titulo_pt": "Detentos gravemente doentes enfrentam iminente deportação para países desconhecidos na áfrica, dizem familiares", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 215010, "titulo": "Polícia usou força \"justificada\" ao atirar em bebê, diz Justiça dos EUA", "url": "https://www.metropoles.com/mundo/policia-usou-forca-justificada-ao-atirar-em-bebe-diz-justica-dos-eua", "fonte_id": "metropoles", "data_pub": "2026-10-21T08:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ação policial nos Estados Unidos, que resultou no disparo em um bebê após supostos furtos de fraldas e roupas de bebê, foi justificada, segundo a Justiça. O advogado da família solicitou a divulgação das imagens da câmera corporal.", "titulo_pt": "Polícia usou força 'justificada' ao atirar em bebê, diz Justiça dos EUA", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 215507, "titulo": "‘I am still traumatised’: French police accused of brutalising minors", "url": "https://www.aljazeera.com/news/2026/10/21/i-am-still-traumatised-french-police-accused-of-brutalising-minors?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-21T07:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os policiais franceses são acusados de brutalizar menores. A violência policial e o uso de armas de contenção aumentam a desconfiança entre as autoridades e os manifestantes.", "titulo_pt": "Eu ainda estou traumatizado: policiais franceses acusados de brutalizar menores", "veiculo": "Al Jazeera English", "pais": "Catar", "c const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);

                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}

              }).join("")}
            </div>

        }).join("")}

         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);

  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">

      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));

  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

function proximaAtualizacao() {

  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {

  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
