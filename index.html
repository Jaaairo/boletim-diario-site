<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

nido e Estados Unidos. Em outro desenvolvimento, o governo dos EUA solicitou que Daniel Tirado Pantoja, um dos testemunhas envolvidos em uma operação em Houston, permanecesse detido, como parte de uma petição para libertar Tirado Pantoja. Além disso, Trump assinou uma proclamação para impor uma tarifa de 15% sobre drones e componentes provenientes da Coreia do Sul e do Japão. Em relação à segurança, um relatório preliminar dos investigadores americanos indica que a pala do rotor do motor de um voo da Ryanair se rompeu durante o voo, levando a uma tentativa de suicídio de um passageiro.\n\nTaiwan foi alvo de uma campanha de hacking usando inteligência artificial, segundo relatos. Os Estados Unidos pediram à China para parar com a pressão militar sobre Taiwan após exercícios navais realizados pela China perto das águas taiwanesas. O governo dos EUA também mencionou o Chile como parte do 'Troyano' chinês no comércio norte-americano, em um relatório da Casa Branca. Em outro desenvolvimento, a China e a Indonésia realizaram exercícios navais conjuntos nas águas leste de Taiwan, gerando irritação na província taiwanesa. A Arábia Saudita assinou um acordo de defesa em Meca com o Paquistão e a Turquia, reestruturando a arquitetura de segurança do Oriente Médio. Além disso, Israel realizou ataques em Gaza que resultaram em duas mortes, enquanto o presidente russo Vladimir Putin visitou as Ilhas Kurilas, tensionando a relação com o Japão sobre a soberania histórica da região.", "economia": "O Nubank registrou um lucro recorde de US$ 1,1 bilhão no segundo trimestre de 2023, crescimento de 17% em relação ao primeiro trimestre e de 49% comparado com o mesmo período do ano anterior. O retorno sobre o patrimônio líquido (ROE) foi de 33%, aumento em relação aos 29% do trimestre anterior, impulsionado pelo crescimento nos empréstimos e cartões de crédito. Além disso, a Petrobras atingiu um novo recorde de produção, com 4 bilhões de barris de óleo equivalente no campo de Tupi, no pré-sal da Bacia de Santos. O Ibovespa registrou sua oitava queda consecutiva em 2023, uma sequência que só foi vista sete vezes nos últimos mais de 20 anos. Ainda, a Hapvida viu suas ações cairem mais de 20% após anunciar uma queda de 95,8% no lucro líquido ajustado do segundo trimestre de 2023.", "tecnologia": "A Skytech está focada na alta demanda associada ao boom da inteligência artificial, enquanto a Apple agora envia notificações push às telas de bloqueio do iPhone quando detecta espionagem governamental nos dispositivos. O juiz James Donato ordenou que a Google faça com que seja mais fácil instalar lojas de aplicativos rivais no Android. A comunidade do Bitcoin está desenvolvendo uma rede para proteger o blockchain contra ataques quânticos, enquanto a Microsoft não utilizará mais o personagem Mico, semelhante ao Clippy, no modo de voz do Copilot. O OpenAI lançou uma prévia de uma versão acelerada do seu modelo mais recente e poderoso, com o intuito de atrair usuários corporativos, enquanto a IBM vai treinar e certificar dezenas de milhares de consultores nas tecnologias da OpenAI como parte desta parceria. A Matic lançou o Matic Cues, uma atualização que adiciona controle por voz e gestos ao aspirador robótico. Além disso, a comunidade do Bitcoin está desenvolvendo uma rede para proteger o blockchain contra ataques quânticos, enquanto a computação quântica tem oscilado entre ser considerada a inovação mais promissora e uma promessa exagerada nas tecnologias. Embora represente uma ameaça à criptografia atual, especialistas indicam que a criptografia pós-quântica (PQC) é mais uma evolução gerenciável do que um crise.", "ciencia": "Um estudo publicado na revista Nature confirmou que os pequenos pontos vermelhos observados no início do universo podem ser buracos negros envolvidos por uma estrela. Essa descoberta, que ajuda a compreender melhor a formação e evolução das estruturas cósmicas, é um dos principais eventos científicos recentes. Além disso, pesquisadores do Instituto Cooperativo para Pesquisa dos Grandes Lagos sugerem que a cobertura de gelo nos Grandes Lagos pode estabilizar ou até inverter temporariamente sua tendência decrescente, o que tem implicações significativas para a ecologia local e as dinâmicas climáticas. Outro importante avanço ocorreu com a descoberta do primeiro exoplaneta semelhante à Terra por um array de 900 telescópios proposto, que poderia detectar sua atmosfera em uma única passagem transitória, facilitando a busca por vida extraterrestre. Estes avanços científicos refletem o progresso contínuo na compreensão do universo e das condições para a vida além da Terra.", "cultura": "A Livraria Expressão Popular comemorou seus 16 anos de existência com uma festa cubana no centro de São Paulo, homenageando Fidel Castro. O evento incluiu música e culinária típica da Cuba. Em outra notícia cultural, a Cinemateca está resgatando o trabalho do diretor polonês Andrzej Wajda, um cineasta às vezes esquecido na atualidade. A exposição 'Turn the Volume Up!' abriu suas portas no Museu Nasher de Arte da Duke University em 27 de agosto, destacando a história de pessoas e artistas que se manifestaram buscando mudanças nos Estados Unidos. Além disso, arqueólogos egípcios descobriram três novos túmulos no Vale do Bahariya, datados de diferentes períodos na história antiga do Egito. Por fim, a franquia de filmes 'Ang Tanging Ina' e seu sequel continuaram a moldar o humor filipino, além do bom humor, enquanto uma artista de vídeo baseada em Oklahoma criou um novo jogo videogame que desafia o projeto 'City' do artista Michael Heizer.", "sociedade": "Um homem foi condenado no Brasil por abusar sexualmente de dois jovens indígenas na Austrália, conforme decidiu um júri australiano. Christopher Saunders, arcebispo católico emérito de 76 anos, foi julgado e condenado por 13 dos 19 cargos apresentados, relacionados ao abuso sexual que ocorreu entre 2008 e 2019 em sua diocese na costa tropical ocidental do país. Em outro caso, a Justiça do Trabalho condenou os Correios a implementar medidas de segurança após uma morte de um trabalhador no Centro de Entrega de Encomendas (CEE) de Santo André, Grande São Paulo, reforçando as discussões sobre a responsabilidade empresarial em relação à segurança dos funcionários. Além disso, um estudo analisou os atendimentos a planos de saúde e identificou falhas nos serviços prestados, levantando preocupações sobre a qualidade do cuidado médico fornecido por essas empresas.", "meio_ambiente": "A Agência apresentou quatro agricultores cujas propriedades são consideradas amigáveis aos búlbos. O Chile Carbon Forum terá sua terceira edição nos dias 6 e 7 de outubro na Faculdade de Economia e Negócios da USP, focando em padrões globais, financiamento e adaptação climática. A temperatura mais alta registrada este ano no Reino Unido foi de 38.1°C, medida no Jardim Botânico de Kew em Londres durante a quinta onda de calor veraniega. A Organização Mundial da Saúde alertou que o Ebola se espalhou para a sexta província congolesa, com mais de 2.100 mortes. Mais de 135 milhões de pessoas na Europa experimentaram temperaturas acima de 35°C, enquanto as chuvas extraordinárias previstas a partir do final de agosto podem aumentar em até 33% nas regiões mais produtivas da Argentina. A ministra do Meio Ambiente, Agnès Pannier-Runacher, pediu restrições mais rígidas no uso da água na França devido à seca que afetou cerca de 40 mil pessoas. Um número atípico de raia-dourada foi observado nas praias da Califórnia, com os animais se aproximando das costas devido ao aquecimento das águas marinhas e a presença do El Niño forte. Um vazamento de óleo de um navio-tanque, supostamente russo, atingiu as praias de Ras Madrakah na costa principal do Omã, contaminando também as praias locais. Greenpeace está pedindo uma revisão da lei de energia para examinar mais profundamente as regras sobre a produção e uso de energia. O antropoceno e o capitaloceno são discutidos como conceitos importantes que enfatizam a urgência de mudar o tratamento da natureza como mercadoria.", "direitos_humanos": "A Suécia implementou uma lei que reduziu a maioridade penal para 14 anos, entrando em vigor antes das eleições gerais. Esta medida reflete a agenda de segurança do governo conservador liderado por Ulf Kristersson. Em outro caso, um homem foi colocado na prisão preventiva após atropelar sua ex-parceira em Antofagasta, no Chile, levando-a ao hospital com risco vital. A Comissão Nacional de Direitos Humanos da Coreia decidiu que um banho público que cobrava apenas as mulheres pelo uso de toalhas e sabonete violou a proteção contra discriminações, recomendando medidas corretivas. Em contraste, no Líbano, o UNIFIL, com cerca de 7.500 militares de quase 50 países, permanecerá após o fim do mandato deste ano, conforme pediu a Human Rights Watch."}, "resumo_do_dia": {"politica_nacional": [{"id": 102724, "titulo": "Janones acusa Flávio de armação para descredibilizar Justiça Eleitoral", "url": "https://www.metropoles.com/minas-gerais/janones-acusa-flavio-de-armacao-para-descredibilizar-justica-eleitoral", "fonte_id": "metropoles", "data_pub": "2026-08-13T21:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado André Janones (Rede-MG) acusa o senador Flávio Bolsonaro de tentar descredibilizar a Justiça Eleitoral sem apresentar provas. Janones também afirma que a facada sofrida pelo presidente Jair Bolsonaro em 2018 foi forjada, embora não haja evidências.", "titulo_pt": "Janones acusa Flávio de tentativa para descredibilizar Justiça Eleitoral e diz que facada em bolsonaro foi forjada", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 102625, "titulo": "Fux diz que Justiça não pretende obrigar bancos a socorrer BRB", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/fux-diz-que-justica-nao-pretende-obrigar-bancos-a-socorrer-brb.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-13T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Luiz Fux, do STF, afirmou que a Justiça não pretende obrigar bancos ou a União a fornecerem garantias para um empréstimo bilionário destinado a socorrer o BRB. Segundo Fux, não se espera uma decisão judicial nesse sentido.", "titulo_pt": "Fux afirma que Justiça não vai obriguar bancos a socorrer BRB", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 102640, "titulo": "Entidades alertam que falta de mão de obra ameaça obras do novo PAC", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/entidades-alertam-que-falta-de-mao-de-obra-ameaca-obras-do-novo-pac.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-13T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entidades da área de infraestrutura alertam que a escassez de mão de obra pode levar o setor à colapso e ameaçar os custos e prazos das obras do novo PAC.", "titulo_pt": "Entidades alertam sobre risco de colapso no setor de infraestrutura por falta de mão de obra", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 102910, "titulo": "Às vésperas da campanha, Lula usa dados da RAIS para fazer balanço de emprego em seu governo", "url": "https://www.jota.info/executivo/as-vesperas-da-campanha-lula-usa-dados-da-rais-para-fazer-balanco-de-emprego-em-seu-governo", "fonte_id": "jota", "data_pub": "2026-08-13T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula apresentou, pela primeira vez, dados da RAIS (Relação Anual de Informações Sociais) durante uma campanha eleitoral, ao lado do ministro Luiz Marinho. O objetivo foi fazer um balanço do desempenho do emprego em seu governo.", "titulo_pt": "Lula apresenta dados da RAIS na véspera da campanha", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 102664, "titulo": "TSE torna vereador inelegível por violência política de gênero pela primeira vez", "url": "https://g1.globo.com/politica/noticia/2026/08/13/tse-torna-vereador-inelegivel-por-violencia-politica-de-genero-pela-primeira-vez.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-13T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) declarou o vereador José Sebastião Rabello, de Nova Friburgo (RJ), inelegível por violência política de gênero pela primeira vez. A condenação foi unânime e se baseia em ataques à vereadora Priscila Teixeira Pitta Muniz nas dependências da Câmara Municipal.", "titulo_pt": "TSE declara vereador inelegível por violência política de gênero pela primeira vez", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 102666, "titulo": "Caiado compara casos de Lula e Bolsonaro e volta a defender anistia ao ex-presidente", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/13/caiado-compara-casos-de-lula-e-bolsonaro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-13T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ronaldo Caiado, candidato à Presidência pelo PSD, afirmou que o presidente Lula teria sido anistiado e voltou a defender a anistia para Jair Bolsonaro caso seja eleito. O discurso foi feito durante um evento em São Paulo.", "titulo_pt": "Caiado compara casos de Lula e Bolsonaro e defende anistia ao ex-presidente", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 102630, "titulo": "É tarde demais para salvar a democracia liberal?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/martinwolf/2026/08/e-tarde-demais-para-salvar-a-democracia-liberal.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-13T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Daron Acemoglu, economista do MIT e vencedor do Prêmio Nobel de Economia em 2024, é um dos analistas mais influentes contemporâneos sobre as relações entre economia, tecnologia e política.", "titulo_pt": "É tarde demais para salvar a democracia liberal?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 102804, "titulo": "Defesa de senador aciona o STF e pede apuração de foto na piscina vazada", "url": "https://www.cnnbrasil.com.br/politica/defesa-de-senador-aciona-o-stf-e-pede-apuracao-de-foto-na-piscina-vazada/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-13T20:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A defesa do senador Weverton Rocha acionou o STF pedindo a apuração de uma foto em que ele aparece com outros políticos na piscina de um advogado investigado pela Polícia Federal. A fotografia estava em um celular apreendido em 2025.", "titulo_pt": "Defesa do senador aciona o STF e pede apuração de foto na piscina vazada", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 102679, "titulo": "Mais de 5 milhões de brasileiros estão impedidos de apostar em bets", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/mais-de-5-milhoes-de-brasileiros-estao-impedidos-de-apostar-em-bets", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-13T20:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Fazenda, Dario Durigan, informou que mais de cinco milhões de brasileiros estão impedidos de fazer apostas em plataformas online. Cerca de um milhão e duzentas mil pessoas já optaram por autoexcluir-se voluntariamente através de uma plataforma que bloqueia o acesso a esses sites.", "titulo_pt": "Mais de 5 milhões de brasileiros estão impedidos de apostar em bets", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 102641, "titulo": "Plano de governo de Flávio Bolsonaro propõe limites ao STF e rebate discurso de Lula sobre soberania", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/plano-de-governo-de-flavio-bolsonaro-propoe-limites-ao-stf-e-rebate-discurso-de-lula-sobre-soberania.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-13T20:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O plano de governo do senador Flávio Bolsonaro, candidato pelo PL à Presidência, propõe limitar o poder do STF e contrapõe as declarações de Lula sobre soberania.", "titulo_pt": "Plano de governo de Flávio Bolsonaro critica STF e desafia Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 102633, "titulo": "Lula usa divulgação de dados de emprego para fazer propaganda do governo e reforçar crítica às bets", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/lula-usa-divulgacao-de-dados-de-emprego-para-fazer-propaganda-do-governo-e-reforcar-critica-as-bets.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-13T20:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva utilizou a divulgação dos resultados de emprego da Rais para criticar gastos com jogos e promover ações do governo, antes do início da campanha.", "titulo_pt": "Lula usa dados de emprego para fazer propaganda e criticar gastos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 102667, "titulo": "Flávio Bolsonaro fala em 'valores inegociáveis' e defende reforma do judiciário em programa de governo", "url": "https://g1.globo.com/politica/blog/valdo-cruz/post/2026/08/13/flavio-bolsonaro-fala-em-alternativa-liberal-conservadora-e-defende-reforma-do-judiciario.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-13T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro (PL) apresentou as diretrizes do seu programa de governo, que incluem valores inegociáveis como respeito à liberdade, família, vida desde a concepção e propriedade privada.
