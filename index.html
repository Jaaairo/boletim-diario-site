<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 08/10/2026 19:17 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">
    <div class="modal-erro" id="senha-erro" style="display:none">Senha incorreta.</div>
    <div class="modal-btns">
      <button class="btn-sec2" onclick="fecharModal('modal-senha')">Cancelar</button>
      <button class="btn-pri" onclick="verificarSenha()">Entrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>
      <option value="erro_traducao">Erro de tradução</option>

      <option value="resumo_impreciso">Resumo impreciso</option>

    <label for="flag-nota">Nota (opcional)</label>

      <button class="btn-peri" id="btn-rm-flag" onclick="removerFlagAtual()" style="display:none;margin-right:auto">Remover</button>
      <button class="btn-sec2" onclick="fecharModal('modal-flag')">Cancelar</button>
      <button class="btn-pri" onclick="salvarFlagAtual()">Marcar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "08/10/2026 19:17", "stats": {"noticias_novas": 663, "resumos_gerados": 241}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "No segundo turno das eleições presidenciais no Brasil, Flávio Bolsonaro e Luiz Inácio Lula da Silva estão em disputa. De acordo com uma pesquisa do Datafolha, Flávio lidera com 52% dos votos válidos. O Datafolha também apontou que 46% dos entrevistados não votariam em Lula, enquanto 43% não votariam em Flávio Bolsonaro. O ministro Fux do STF concedeu acesso ao inquérito das fake news e da tentativa de golpe para a equipe técnica do STF, em resposta a pedidos do PP. Além disso, a campanha de Lula no primeiro turno teria deixado setores decisivos de fora, conforme a deputada Sâmia Bomfim. A deputada Celina Leão está à frente no segundo turno das eleições para o governo do Distrito Federal, com 55% das intenções de voto, contra 37% de Geraldo Alckmin, segundo a pesquisa do Datafolha.", "mundo": "Milhares de protestantes marcharam em Madri, um dia após a morte de María del Carmen Abascal, uma idosa de 87 anos, cujo despejo se tornou símbolo da crise imobiliária do país. Cerca de 20.000 pessoas participaram da marcha em homenagem a ela. Em outro desenvolvimento, o governo de Milei privatizou 90% das ações da Aysa, empresa de água de Buenos Aires, por 340 milhões de dólares, após uma reunião na Casa Rosada. Além disso, a Ucrânia continua a sofrer ataques de navios-tanque russos no Mar Negro, sem sinais de um retorno ao acordo das Nações Unidas para permitir a passagem de navios com grãos, óleo e fertilizantes. Por fim, o Departamento de Justiça dos EUA instruiu os procuradores a utilizar todo o espectro de poderes para recuperar fundos e buscar penas mais severas, em um esforço para combater fraudes contra o governo.\n\nSteve Witkoff e Jared Kushner se encontraram com negociadores ucranianos e autoridades europeias em Miami para apresentar novas ideias e propostas com o objetivo de romper o estaleiro na guerra entre Rússia e Ucrânia. O governo Trump espera alcançar um rompimento diplomático antes das eleições gerais e antes que o frio severo tome conta da Ucrânia. Em outro desenvolvimento, o Irã não abandonará o enriquecimento de urânio, declarou o chefe da Organização Atômica da Irã, Mohammad Eslami, em resposta a novas ameaças dos Estados Unidos contra os sites nucleares iranianos. Além disso, o presidente dos Estados Unidos, Donald Trump, afirmou que os Estados Unidos não atacarão o Irã antes das eleições de meio de mandato em novembro. Os preços do petróleo aumentaram devido a ataques a navios-tanque e à diminuição das flutuações através do Estreito de Ormuz, com o tráfego marítimo subindo para quase 90% dos níveis pré-guerra, mas caindo significativamente desde então.", "economia": "Nos últimos dias, a economia brasileira e internacional foi debatida em diversos aspectos. O Ibovespa encerrou o pregão em alta de 1%, impulsionado por Petrobras e pesquisas sobre o segundo turno das eleições, com o dólar cotado a R$ 5,02. O Tesouro Nacional realizou uma venda de títulos públicos prefixados no valor de R$ 33,28 bilhões, o maior volume desde dezembro de 2020. A Petrobras viu suas ações subirem devido à alta dos preços do petróleo, influenciada pelas tensões no Oriente Médio. O Banco Central informou que mais de 1 bilhão de chaves foram cadastradas no sistema de pagamentos instantâneos do Pix, com chaves aleatórias representando mais da metade dos registros. O debate sobre a reforma tributária também ganhou destaque, com Flávio Bolsonaro, candidato do PL, anunciando a intenção de acabar com o split payment, sob o argumento de que o mecanismo prejudica o capital de giro do pequeno empresário. As ações de empresas como Nvidia, Oracle e CoreWeave caíram após a divulgação do relatório de receita da OpenAI, que informou ter atingido aproximadamente $50 bilhões em receita anualizada no final de setembro. Ainda em relação à economia global, o Federal Reserve de Nova York descobriu que as tarifas adicionaram 2,9 pontos percentuais à inflação em 67 categorias de bens até fevereiro de 2026. A Uniqlo se aproxima da H&M e mira a liderança global com uma receita anual de 3,96 trilhões de ienes (R$ 125,5 bilhões). Ainda em destaque, a Starbucks está avaliando a possibilidade de comprar a Chipotle Mexican Grill, em uma aquisição que seria a maior já realizada no setor de restaurantes. Ainda sobre a economia, a Cade decidiu extingir definitivamente o processo sobre a Moratória da Soja e multou a Aprosoja por tentar rediscutir o arquivamento. O laboratório TSMC registrou um resultado trimestral recorde, com uma receita de NT$1,49 trilhão, o maior resultado trimestral da empresa até o momento. Ainda em relação ao mercado de trabalho, novas solicitações de benefícios por desemprego permaneceram abaixo de 200.000 por semana, um nível raramente visto na história moderna. Além disso, a Reserva Federal provavelmente vai aumentar as taxas de juros mais algumas vezes, mas não está pressionada para fazê-lo imediatamente, de acordo com as recentes comunicações do banco central.", "tecnologia": "A Anthropic lançou um novo serviço chamado OSS Scanner, que oferece exames de segurança gratuitos e periódicos para projetos de código aberto, visando ajudar a identificar vulnerabilidades de segurança mais rapidamente. Paralelamente, o Pentágono anunciou uma nova iniciativa multimilionária de cerca de 350 milhões de dólares para manter a liderança americana em computação quântica, diante da crescente concorrência com a China. A SpaceX, empresa de Elon Musk, adquiriu licenças de espectro para expandir sua oferta de serviços de celular nos Estados Unidos, pretendendo combinar sua rede de satélites Starlink com infraestrutura terrestre para oferecer cobertura nacional. A empresa pretende competir com as operadoras tradicionais AT&T, Verizon e T-Mobile, após o anúncio que levou a uma queda nas ações dessas empresas.", "ciencia": "A NASA realizou a missão SSPICY, que envolveu a utilização de uma pequena nave espacial para se aproximar de satélites desativados, demonstrando tecnologias para futuros reparos em órbita e redução de detritos espaciais. O James Webb Space Telescope da NASA identificou a galáxia anfitriã de uma explosão de rádio rápida, a mais distante já observada, contribuindo para o mapeamento da matéria intergaláctica. Um estudo realizado em cinco países latino-americanos, incluindo o Chile, desenvolveu um modelo de inteligência artificial que analisa o modo de falar para identificar sinais de envelhecimento cerebral, deterioro cognitivo e demência. Um artefato parecido com um bastão foi descoberto em um sítio arqueológico perto de Barcelona, Espanha, fornecendo evidências adicionais de que os neandertais eram habilidosos trabalhadores de madeira, sugerindo que eles eram mais complexos do que se pensava anteriormente. A Universidade de Tampere desenvolveu uma nova técnica de imagens sem lente que produz dados quantitativos precisos sobre células vivas, permitindo o monitoramento contínuo das células vivas por horas ou até mesmo dias sem a necessidade de corantes ou outros rótulos. O mês de setembro foi o mais quente da história nos Estados Unidos, com o telescópio Webb detectando sinais de colisões entre corpos do tamanho de Marte, que podem ser comparáveis ao que formou a Lua e ajudam a compreender a evolução dos planetas rochosos. Além disso, a OMS não recomenda o uso de medicamentos e cirurgias para tratar a obesidade infantil em crianças menores de 10 anos, sugerindo mudanças na alimentação e exercícios físicos como principais abordagens para prevenir a doença.", "cultura": "Anne Carson, vencedora do Nobel de Literatura, continua a receber destaque no cenário cultural, com a divulgação do prêmio gerando um aumento na busca por suas obras. A Academia Sueca anunciou que Carson, de 76 anos, venceu o Nobel de Literatura em 2026, surpreendendo-a em sua casa em Islandia. A escritora, conhecida por sua voz independente e trabalho que rompe as fronteiras entre poesia, prosa, tradução e estudos clássicos, ganhou destaque em vários artigos. Por outro lado, o Chile apresentou seu lema e identidade gráfica para a Feira do Livro de Frankfurt em 2027, visando fortalecer a projeção internacional da literatura chilena. O Festival PERFORMA, em sua sexta edição, reuniu experiências imersivas e inteligência artificial, com cinco propostas audiovisuais no Mercado Puerto de Valparaíso. Além disso, a Globo está produzindo uma vinheta de fim de ano inspirada no programa 'Tamanho Família', comandado por Márcio Garcia entre 2016 e 2020, enquanto a Mubi, durante a terceira edição de Mubi Fest, expressou interesse em incluir mais filmes chilenos na plataforma.", "sociedade": "A morte de Marco Aurélio Cardenas Acosta, um estudante de medicina baleado por um policial militar em São Paulo, levou ao reconhecimento póstumo de sua carteira profissional pelo Conselho de Medicina, destacando-o como um caso emblemático de injustiça e violência. Em outro incidente, a filha de Neymar, Helena, de 2 anos, foi alvo de ataques nas redes sociais, fazendo sua mãe buscar justiça. No Brasil, a morte de María del Carmen Abascal, uma idosa de 87 anos despejada na Espanha, se tornou um símbolo de luta contra a crise habitacional, intensificando mobilizações. Em Madri, milhares programaram marchas em memória dela, com a direita rejeitando medidas para conter a crise. No Pará, um suspeito foi filmado destruindo um caminhão com uma metralhadora após uma briga de trânsito, levando a investigação da Polícia Civil. Na França, estudantes estão ocupando as ruas em protesto, denunciando a falta de professores e a deterioração das escolas, enquanto na Polônia, um ex-aluno matou uma funcionária em uma escola primária, levando a preocupações sobre ataques 'copycat' com facas. Estes eventos refletem questões sociais e políticas complexas, incluindo violência, justiça, desigualdade e mobilizações populares.", "meio_ambiente": "A Agência da ONU registrou o pico do El Niño em dezembro de 2026, com temperaturas marítimas recordes, alertando para os efeitos intensificados deste fenômeno, que devem persistir até fevereiro de 2027. No Brasil, a ex-secretária de Meio Ambiente do Rio Grande do Norte foi denunciada pelo Ministério Público por desmatamento irregular em uma área protegida de Mata Atlântica, equivalente a 30 campos de futebol. Em um desenvolvimento positivo, a população de tartarugas gigantes de Aldabra, na ilha de Aldabra, Seychelles, atingiu um recorde de 180.000 animais, resultado de um programa de recuperação que durou décadas. A vinícola Aurora, maior cooperativa vinícola do Brasil, conquistou o selo Carbon Free e planeja incorporar essa certificação ambiental aos rótulos de seus produtos, gerando faturamento de R$ 874,8 milhões em 2025.", "direitos_humanos": "Os Estados Unidos apresentaram novas acusações contra Nicolás Maduro e sua esposa, acusando-os de tortura, além das acusações anteriores de tráfico de drogas e de armas. No Filipinas, um projeto de lei que amplia a lei de espionagem para incluir atividades durante o tempo de paz está causando preocupações sobre a repressão aos críticos. Em Hong Kong, o governo rejeitou a avaliação do Departamento de Estado dos EUA, que classificou a cidade no nível mais baixo do relatório anual sobre tráfico de pessoas. No Brasil, um ex-militar da Funai foi condenado a pagar R$ 100 mil por incentivar a violência contra indígenas em um território protegido. Na Argentina, um juiz confirmou a suspensão do mecanismo de multas a imigrantes, enquanto um caso envolvendo a morte de Diego Maradona foi reavivado com alegações de que a internação médica foi a 'mais deficiente e temerária de todos os tempos'. Em outros países, casos envolvendo LGBTfobia, violência digital, execuções capitais e processos contra líderes religiosos também foram destacados, refletindo a variedade de desafios aos direitos humanos em diferentes regiões do mundo."}, "resumo_do_dia": {"politica_nacional": [{"id": 203831, "titulo": "PGR defende fim de prisão preventiva de ex-presidente do INSS, mas ação está paralisada no STF", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/10/pgr-defende-fim-de-prisao-preventiva-de-ex-presidente-do-inss-mas-acao-esta-paralisada-no-stf.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A PGR recomendou ao STF a revogação da prisão preventiva do ex-presidente do INSS, Alessandro Stefanutto, e a substituição por medidas alternativas como tornozeleira eletrônica. A ação está paralisada no STF.", "titulo_pt": "PGR defende fim da prisão preventiva de ex-presidente do INSS, mas ação está paralisada no STF", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 203907, "titulo": "Datafolha: 25% dos eleitores de Flávio Bolsonaro dizem escolher candidato para derrotar Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/datafolha-25-dos-eleitores-de-flavio-bolsonaro-dizem-escolher-candidato-para-derrotar-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Datafolha revelou que 25% dos eleitores de Flávio Bolsonaro escolhem seu candidato com o objetivo de derrotar Lula. O percentual de eleitores que apoiam Bolsonaro por desejo de derrotá-lo é de 13%.", "titulo_pt": "25% Dos eleitores de Flávio Bolsonaro querem derrotar Lula, mostra pesquisa", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 203908, "titulo": "Senado diz a Fux que informar visitas de Vorcaro e esposa de Moraes pode expor parlamentares", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/10/senado-diz-a-fux-que-informar-visitas-de-vorcaro-e-esposa-de-moraes-pode-expor-parlamentares.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado reiterou sua oposição à divulgação do registro de visitas da esposa do ministro Alexandre de Moraes e do dono do Banco Master a gabinetes da Casa entre 2019 e 2026. A Casa argumenta que a divulgação pode expor os parlamentares.", "titulo_pt": "Senado reiteraposição contra divulgação de registros de visitas de Vorcaro e esposa de Moraes", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 203910, "titulo": "Datafolha: Governo Lula tem avaliação negativa de 40% e positiva de 35%", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/datafolha-governo-lula-tem-avaliacao-negativa-de-40-e-positiva-de-35.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa do Datafolha indica que 40% dos brasileiros avaliam o governo de Lula negativamente, enquanto 35% têm uma avaliação positiva. Anteriormente, 24% avaliavam o governo como regular.", "titulo_pt": "Datafolha: governo Lula tem 40% de avaliação negativa e 35% positiva", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 203853, "titulo": "Datafolha: 49% desaprovam e 48% aprovam governo Lula", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/10/08/datafolha-avaliacao-governo-8-outubro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-08T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha do segundo turno indica que 49% dos eleitores desaprovam o governo de Lula e 48% o aprovam. Este resultado mantém-se igual à pesquisa anterior, realizada há uma semana.", "titulo_pt": "49% Desaprovam e 48% aprovam governo Lula, segundo datafolha", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 203855, "titulo": "Augusto Cury declara apoio a Flávio Bolsonaro no segundo turno", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/08/augusto-cury-declara-apoio-a-flavio-bolsonaro-no-segundo-turno.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-08T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Augusto Cury, ex-candidato à Presidência pelo Avante, declarou apoio a Flávio Bolsonaro no segundo turno da eleição presidencial contra Luiz Inácio Lula da Silva. Na conversa por videochamada, Cury pediu que Flávio Bolsonaro se comprometesse publicamente com propostas defendidas.", "titulo_pt": "Augusto Cury declara apoio a Flávio Bolsonaro no segundo turno", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 203856, "titulo": "É #FAKE vídeo de Flávio Bolsonaro dizendo que, se eleito, vai cortar 13° e aposentadorias; fala foi manipulada com IA", "url": "https://g1.globo.com/fato-ou-fake/eleicoes/noticia/2026/10/08/e-fake-video-de-flavio-bolsonaro-dizendo-que-se-eleito-vai-cortar-13-e-aposentadorias-fala-foi-manipulada-com-ia.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-08T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Circula nas redes sociais um vídeo supostamente com Flávio Bolsonaro afirmando que, se eleito, cortará aposentadorias e 13° salário. O vídeo foi marcado como falso (FAKE) e a fala foi manipulada com inteligência artificial.", "titulo_pt": "É #FAKE vídeo de Flávio Bolsonaro dizendo que vai cortar 13° e aposentadorias; fala foi manipulada com IA", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 204086, "titulo": "Fux determina à equipe técnica do STF acesso ao inquérito das fake news e da tentativa de golpe", "url": "https://www.jota.info/stf/do-supremo/fux-determina-a-equipe-tecnica-do-stf-acesso-ao-inquerito-das-fake-news-e-da-tentativa-de-golpe", "fonte_id": "jota", "data_pub": "2026-10-08T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Fux determinou que a equipe técnica do STF terá acesso ao inquérito das fake news e da tentativa de golpe. Ele argumentou que precisa desses dados para analisar os pedidos do PP, partido aliado ao deputado Flávio Bolsonaro.", "titulo_pt": "Fux determina acesso ao inquérito das fake news e da tentativa de golpe para equipe técnica do STF", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 203960, "titulo": "Campanha de Lula no 1º turno deixou setores decisivos de fora, avalia Sâmia", "url": "https://www.metropoles.com/sao-paulo/campanha-de-lula-no-1o-turno-deixou-setores-decisivos-de-fora-avalia-samia", "fonte_id": "metropoles", "data_pub": "2026-10-08T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada Sâmia Bomfim, com a quinta maior votação para a Câmara, foi uma das parlamentares convidadas para atuar na campanha de Lula no primeiro turno.", "titulo_pt": "Campanha de Lula no 1º turno deixou setores decisivos de fora, avalia Sâmia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 203857, "titulo": "Tropa de Flávio Bolsonaro x Exército de Lula: aliados de candidatos mobilizam eleitores nas redes para atrair votos", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/08/flavio-bolsonaro-lula-campanha-redes-sociais.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-08T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 17 dias do segundo turno das eleições, aliados de Flávio Bolsonaro e Lula estão mobilizando eleitores nas redes sociais para reduzir a abstenção e atrair votos. As estratégias incluem missões para apoiadores e combate a notícias falsas.", "titulo_pt": "Tropa de Flávio Bolsonaro x Exército de Lula: aliados de candidatos mobilizam eleitores nas redes para atrair votos", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [{"titulo": "Datafolha: Lula é rejeitado por 46% e flávio Bolsonaro, por 43%", "sumario": "A pesquisa Datafolha indica que 46% dos entrevistados não votariam em Lula, enquanto 43% não votariam em Flávio Bolsonaro no segundo turno da eleição presidencial. O Datafolha realizou uma pesquisa no segundo turno das eleições presidenciais, ouvindo 2.520 pessoas entre os dias 6 e 8 de outubro. A primeira pesquisa Datafolha do segundo turno presidencial indica que Flávio Bolsonaro tem 49% das intenções de voto, contra 45% de Lula.", "artigos": [{"id": 203909, "titulo": "Datafolha: Flávio Bolsonaro é rejeitado por 43% e Lula, por 46%", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/datafolha-flavio-bolsonaro-e-rejeitado-por-43-e-lula-por-46.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha indica que 46% dos entrevistados não votariam em Lula, enquanto 43% não votariam em Flávio Bolsonaro no segundo turno da eleição presidencial.", "titulo_pt": "Datafolha: Lula é rejeitado por 46% e flávio Bolsonaro, por 43%", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 203955, "titulo": "Datafolha 2º turno: Flávio tem 52% e Lula, 48% dos votos válidos", "url": "https://www.metropoles.com/brasil/datafolha-2o-turno-flavio-tem-52-e-lula-48", "fonte_id": "metropoles", "data_pub": "2026-10-08T21:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Datafolha realizou uma pesquisa no segundo turno das eleições presidenciais, ouvindo 2.520 pessoas entre os dias 6 e 8 de outubro. Flávio Bolsonaro teve 52% dos votos válidos, enquanto Lula obteve 48%.", "titulo_pt": "Datafolha 2º turno: flávio tem 52% e Lula, 48% dos votos válidos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 203854, "titulo": "Datafolha: Flávio Bolsonaro, 49%; Lula, 45%", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/10/08/datafolha-presidente-8-outubro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-08T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A primeira pesquisa Datafolha do segundo turno presidencial indica que Flávio Bolsonaro tem 49% das intenções de voto, contra 45% de Lula. Em votos válidos, Flávio Bolsonaro lidera com 52%, enquanto Lula tem 48%.", "titulo_pt": "Datafolha: flávio Bolsonaro, 49%; Lula, 45%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 203911, "titulo": "Datafolha: Flávio Bolsonaro tem 52% e Lula, 48% em votos válidos no segundo turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/datafolha-flavio-bolsonaro-tem-52-e-lula-48-em-votos-validos-no-segundo-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Datafolha realizou seu primeiro levantamento após a definição do segundo turno da eleição presidencial, mostrando Flávio Bolsonaro com 52% e Lula com 48% dos votos válidos.", "titulo_pt": "Datafolha: flávio Bolsonaro tem 52% e Lula, 48% em votos válidos no segundo turno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 203963, "titulo": "Datafolha: Celina lidera com 55% e Grass soma 37% no segundo turno no DF", "url": "https://www.metropoles.com/distrito-federal/datafolha-celina-lidera-com-55-e-grass-soma-37-no-segundo-turno-no-df", "fonte_id": "metropoles", "data_pub": "2026-10-08T21:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Datafolha realizou um levantamento após o primeiro turno das eleições no Distrito Federal e constatou que Celina Leão lidera com 55% das intenções de voto no segundo turno, enquanto Geraldo Grass soma 37%. Também foi registrado que 3% dos eleitores ainda estão indecisos.", "titulo_pt": "Datafolha: celina lidera com 55% e Grass soma 37% no segundo turno no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 204002, "titulo": "Datafolha DF: Celina tem 60% dos votos válidos no 2° turno; Grass, 40%", "url": "https://www.cnnbrasil.com.br/eleicoes/datafolha-df-celina-tem-60-dos-votos-validos-no-2-turno-grass-40/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T21:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha realizada entre os dias 6 e 7 de outubro ouviu 910 eleitores e mostrou que Celina lidera o segundo turno com 60% dos votos válidos, enquanto Grass obteve 40%. A margem de erro é de 3 pontos percentuais e o nível de confiança é de 95%.", "titulo_pt": "Datafolha DF: celina lidera com 60% dos votos válidos no 2° turno; Grass tem 40%", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}]}], "mundo": [{"id": 204291, "titulo": "Hundreds of farmers rally in Paris against EU-Mercosur pact and import fears", "url": "https://www.euronews.com/video/2026/10/08/hundreds-of-farmers-rally-in-paris-against-eu-mercosur-pact-and-import-fears", "fonte_id": "euronews", "data_pub": "2026-10-08T21:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Centenas de agricultores franceses realizaram uma manifestação em Paris contra o acordo EU-Mercosur, alertando sobre ": "nyt_world", "data_pub": "2026-10-08T21:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de protestantes marcharam em Madri, um dia após a morte de María del Carmen Abascal, uma idosa de 87 anos, cuva despejo se tornou símbolo da crise imobiliária do país.", "titulo_pt": "Espanha: protestos vêem 'loucura' de aluguéis altos e 'mártir' em maria del carmen", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 203965, "titulo": "Al-Qaeda ameaça EUA e Israel após ataque em voo da FlyDubai", "url": "https://www.metropoles.com/mundo/al-qaeda-ameaca-eua-e-israel-apos-ataque-em-voo-da-flydubai", "fonte_id": "metropoles", "data_pub": "2026-10-08T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Al-Qaeda declarou que os Estados Unidos e Israel continuam sendo alvos do grupo terrorista após um ataque em um voo da FlyDubai. A organização terrorista ameaçou os dois países.", "titulo_pt": "Al-qaeda ameaça EUA e Israel após ataque em voo da FlyDubai", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 204281, "titulo": "Trump envoys, European officials to discuss ‘new ideas’ for Ukraine peace in Miami", "url": "https://www.france24.com/en/europe/20261008-trump-envoys-ukraine-peace-talks-miami", "fonte_id": "france24", "data_pub": "2026-10-08T21:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Enviados do presidente americano Donald Trump, juntamente com representantes europeus, irão se encontrar em Miami para discutir novas propostas de paz para terminar a guerra na Ucrânia. Steve Witkoff e Jared Kushner apresentarão ideias desenvolvidas durante conversas recentes com as partes envolvidas.", "titulo_pt": "Enviados de trump e europeus se reúnem em Miami para discutir novas propostas de paz para Ucrânia", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 204299, "titulo": "Police use tear gas and water cannons on student protestors in Paris", "url": "https://
