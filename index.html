l, "texto_pt": "A Organização Pan-Americana da Saúde (OPAS) e a Organização Mundial da Saúde (OMS) apoiam a Colômbia na próxima fase da resposta à saúde após um terremoto.", "titulo_pt": "Opas/OMS apoia colômbia na próxima fase da resposta à saúde após terremoto", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 113833, "titulo": "Como julgamento de uma mãe acusada de matar os 3 filhos impulsiona o debate sobre psicose pós-parto", "url": "https://www.bbc.com/portuguese/articles/c8rn7x81px5o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-20T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O julgamento de uma mãe acusada de matar seus três filhos está levantando discussões sobre a psicose pós-parto, uma condição psiquiátrica que pode causar mania, depressão, alucinações e delírios.", "titulo_pt": "Como julgamento de mãe acusada de matar os 3 filhos impulsiona debate sobre psicose pós-parto", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 114500, "titulo": "Bali jails Swiss tourist for insulting sacred Day of Silence", "url": "https://www.scmp.com/news/asia/east-asia/article/3364722/bali-jails-swiss-tourist-insulting-sacred-day-silence?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-20T12:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um turista suíço, Luzian Andrin Zgraggen, de 26 anos, foi condenado a um ano de prisão por insultar uma observância sagrada hindu em Bali, Indonésia. Ele violou o novo código penal indonésio ao publicar mensagens nas redes sociais sobre o Dia do Silêncio, um período em que as pessoas são encorajadas a ficar em casa e meditar em silêncio.", "titulo_pt": "Bali condena turista suíço por insultar observância sagrada", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 114613, "titulo": "Centenarians in Korea near triples in 10-year period", "url": "https://www.koreaherald.com/article/10847250", "fonte_id": "korea_herald", "data_pub": "2026-08-20T08:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de sul-coreanos com 100 anos ou mais quase triplicou nos últimos dez anos, com um aumento particularmente pronunciado entre os homens, segundo dados do Ministério de Dados e Estatísticas. Em 1º de novembro de 2025, havia 8.604 centenários, contra 3.159 em 2015.", "titulo_pt": "Centenários na Coreia do sul se aproximam de triplicar em década", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 114432, "titulo": "Local doctor in earthquake-hit Kumamoto brings medical care to evacuees", "url": "https://www.japantimes.co.jp/news/2026/08/20/japan/society/doctor-kumamoto-quake-evacuees/", "fonte_id": "japan_times", "data_pub": "2026-08-20T08:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hitoshi Kuwahara, um médico de 61 anos nascido e criado na cidade de Uki, tem suportado a saúde comunitária há cerca de três décadas. Ele está prestando assistência médica aos deslocados em áreas afetadas por terremotos.", "titulo_pt": "Médico local em Kumamoto oferece cuidados médicos aos deslocados", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 114697, "titulo": "Children account for half of suspected mpox cases in Guinea-Bissau", "url": "https://www.unicef.org/press-releases/children-account-half-suspected-mpox-cases-guinea-bissau", "fonte_id": "unicef", "data_pub": "2026-08-20T07:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A UNICEF está fortalecendo a vigilância, a prevenção e a atuação comunitária em resposta à primeira epidemia de mpox registrada em Guiné-Bissau. A metade dos casos suspeitos de mpox no país são crianças.", "titulo_pt": "Crianças representam metade dos casos suspeitos de mpox em guiné-bissau", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 114397, "titulo": "Top US law firms hit by backlash over ‘crazy’ hiring of first-year students", "url": "https://www.ft.com/content/d70655c1-63b8-4142-aae8-82db916bc045?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-20T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As firmas de Wall Street estão contratando estudantes cada vez mais cedo, gerando preocupação entre os alunos e executivos.", "titulo_pt": "Cinco grandes escritórios de advocacia dos EUA enfrentam reação negativa por 'louco' recrutamento de estudantes do primeiro ano", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 114022, "titulo": "‘Like a miracle’: 84-year-old woman pulled alive from rubble three days after Indonesian quake", "url": "https://www.theguardian.com/world/2026/aug/20/indonesia-earthquake-flores-miracle-rescue-elderly-woman-found-alive-in-rubble", "fonte_id": "guardian_world", "data_pub": "2026-08-20T00:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher de 84 anos foi encontrada viva três dias após um terremoto de magnitude 7.7 atingir a ilha de Flores, na Indonésia. O deslizamento de terra causado pelo terremoto bloqueou o acesso à sua aldeia, deixando-a enterrada sob os escombros de sua casa.", "titulo_pt": "Como um milagre: mulher de 84 anos encontrada viva três dias após terremoto na indonésia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 114019, "titulo": "More than 100 dead after goldmine collapses in Central African Republic", "url": "https://www.theguardian.com/world/2026/aug/20/gold-mine-collapse-deadly-landslide-central-african-republic", "fonte_id": "guardian_world", "data_pub": "2026-08-20T00:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 100 pessoas morreram após uma mina de ouro artesanal colapsar devido a uma avalanche de lama em uma pequena aldeia no oeste do República Centro-Africana. O colapso ocorreu por volta de 15h de terça-feira em Zamboye, a cerca de 50km de Baboua, próxima à fronteira com Camarões. O número de mortos pode aumentar com a continuidade das operações de resgate.", "titulo_pt": "Mais de 100 mortos após colapso de mina de ouro em república centro-africana", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 112593, "titulo": "Migrant workers eligible for occupational accident legal aid: Ministry", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/20/2003862809", "fonte_id": "taipei_times", "data_pub": "2026-08-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os trabalhadores migrantes agora podem se beneficiar do auxílio jurídico para acidentes de trabalho, conforme informado pelo ministério.", "titulo_pt": "Trabalhadores migrantes elegíveis para auxílio jurídico em acidentes de trabalho: ministério", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 113992, "titulo": "Ambicioso proyecto busca descontaminar el lago Villarrica en 15 años y una inversión de US$ 56 millones", "url": "https://www.latercera.com/nacional/noticia/ambicioso-proyecto-busca-descontaminar-el-lago-villarrica-en-15-anos-y-una-inversion-de-us-56-millones/", "fonte_id": "la_tercera", "data_pub": "2026-08-21T00:25:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um ambicioso projeto será implementado pelo Ministério do Meio Ambiente com o objetivo de descontaminar o Lago Villarrica em 15 anos, com uma estimativa de investimento de US$ 56 milhões. A estratégia visa reduzir a proliferação de algas e o impacto das embarcações com motor até 2041.", "titulo_pt": "Ambicioso projeto busca descontaminar o lago Villarrica em 15 anos e uma investida de 56 milhões de dólares", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 114473, "titulo": "Lack of low-carbon power could deter investment", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/21/2003862844", "fonte_id": "taipei_times", "data_pub": "2026-08-21T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A falta de fontes de energia com baixo teor de carbono pode dissuadir investimentos. O artigo sugere que a ausência de opções de energia limpa pode ser um desafio para a atração de investimentos em projetos de energia.", "titulo_pt": "Falta de energia com baixo teor de carbono pode dissuadir investimentos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 113599, "titulo": "Alemanha já contabiliza 14 mil mortes por calor extremo desde abril", "url": "https://veja.abril.com.br/mundo/alemanha-ja-contabiliza-14-mil-mortes-por-calor-extremo-desde-abril/", "fonte_id": "veja", "data_pub": "2026-08-20T22:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Alemanha registrou 14 mil mortes devido a calor extremo desde abril. O pico da mortalidade ocorreu na última semana de junho, entre os dias 22 e 28.", "titulo_pt": "Alemanha já contabiliza 14 mil mortes por calor extremo desde abril", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 114700, "titulo": "China’s solar power rollout is harming birds, a new analysis finds", "url": "https://www.scientificamerican.com/article/chinas-solar-power-rollout-is-harming-birds-a-new-analysis-finds/", "fonte_id": "scientific_american", "data_pub": "2026-08-20T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma análise recente revela que o rápido crescimento da energia solar na China está afetando a diversidade de aves no país.", "titulo_pt": "A expansão da energia solar na china está prejudicando a diversidade de aves, de acordo com uma nova análise", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 114064, "titulo": "Photos: Releasing Animals Back Into Their Habitats", "url": "https://www.theatlantic.com/photography/2026/08/photos-releasing-animals-back-their-habitats/688336/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-08-20T16:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Imagens recentes mostram o momento do lançamento de diversos animais de volta para seus habitats naturais, após reabilitação, repovoamento ou para auxiliar no crescimento de um ecossistema.", "titulo_pt": "Fotos: liberação de animais de volta para seus Habitats", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 114753, "titulo": "Factcheck: 10 flaws in the Conservative report on ‘cheap power’", "url": "https://www.carbonbrief.org/factcheck-10-flaws-in-the-conservative-report-on-cheap-power", "fonte_id": "carbon_brief", "data_pub": "2026-08-20T15:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A oposição Conservadora publicou um relatório argumentando que os preços da eletricidade no Reino Unido são altos e que seria possível reduzi-los. No entanto, o Carbon Brief identificou 10 falhas no relatório Conservador sobre energia barata.", "titulo_pt": "Verificação de fatos: 10 falhas no relatório conservador sobre 'energia barata'", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 114249, "titulo": "Drought on Serbia's Sava River reveals long-lost WWII shipwreck", "url": "http://www.euronews.com/video/2026/08/20/drought-on-serbias-sava-river-reveals-long-lost-wwii-shipwreck", "fonte_id": "euronews", "data_pub": "2026-08-20T12:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Sremska Mitrovica, um barco a vapor de mais de um século foi exposto no Rio Sava devido a uma estiagem prolongada e temperaturas elevadas que baixaram o nível da água no rio.", "titulo_pt": "Restos de barco vapor de guerra da segunda guerra mundial emergem do rio Sava na sérvia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 114212, "titulo": "Europe heatwaves: Germany and Spain report over 18,000 heat-related deaths this summer", "url": "https://www.lemonde.fr/en/environment/article/2026/08/20/europe-heatwaves-germany-and-spain-report-over-18-000-heat-related-deaths-this-summer_6756703_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-20T10:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autoridade de saúde pública da Alemanha relatou cerca de 9.600 das 14.000 mortes relacionadas ao calor deste verão ocorreram em uma semana no final de junho. O instituto de saúde pública da Espanha registrou 4.458 mortes relacionadas ao calor entre 1º de junho e 19 de agosto, o maior número para o período desde 2022.", "titulo_pt": "EUA da Europa: Alemanha e Espanha relatam mais de 18.000 mortes relacionadas ao calor neste verão", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 114452, "titulo": "Amid Low Rainfall and Scorching Heat, Bosnians Face Dire Water Shortages", "url": "https://balkaninsight.com/2026/08/20/amid-low-rainfall-and-scorching-heat-bosnians-face-dire-water-shortages/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-08-20T06:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rios secos e cidades e vilas enfrentando escassez de água por dias ou semanas estão levando à insatisfação dos bosnianos, que estão protestando contra o sistema de abastecimento de água sobrecarregado.", "titulo_pt": "Diante da baixa chuva e do calor intenso, bosnianos enfrentam severas falta de água", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 112597, "titulo": "Health agency posts sperm and egg donation rules", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/20/2003862813", "fonte_id": "taipei_times", "data_pub": "2026-08-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A agência de saúde publicou as regras para doação de esperma e ovos. O documento estabelece os parâmetros oficiais para esse processo.", "titulo_pt": "Agência de saúde publica regras para doação de esperma e ovos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 112598, "titulo": "Ministry details efforts on asphalt-related pollution", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/20/2003862814", "fonte_id": "taipei_times", "data_pub": "2026-08-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministério detalhou os esforços relacionados à poluição de asfalto. O texto não fornece mais detalhes sobre as ações específicas realizadas.", "titulo_pt": "Ministério detalha esforços sobre poluição de asfalto", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 114345, "titulo": "Four out of every five families in Gaza face 'critical or catastrophic' hunger levels, UN warns", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/four-out-every-five-families-gaza-face-critical-or-catastrophic-hunger", "fonte_id": "middle_east_eye", "data_pub": "2026-08-21T01:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Organização das Nações Unidas (ONU) alerta que 94% da população de Gaza, que ultrapassa 2,1 milhões de pessoas, necessita de abrigo e assistência básica. Além disso, quatro em cada cinco famílias enfrentam níveis 'críticos ou catastróficos' de fome em seus abrigos, que carecem de combustível, energia e itens essenciais domésticos.", "titulo_pt": "Quatro em cada cinco famílias em Gaza enfrentam 'níveis críticos ou catastróficos' de fome, avisa a ONU", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 114024, "titulo": "Court ends case against police charged over use of Taser and pepper spray on ‘vulnerable’ First Nations man", "url": "https://www.theguardian.com/australia-news/2026/aug/21/court-ends-case-queensland-police-officers-tasered-vulnerable-man-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-08-21T01:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O caso contra dois policiais, Andrew David Couchman e Ulrich Weiss, que foram acusados de cometer crimes relacionados ao uso de spray pimenta, Taser e restrições em um homem indígena 'cognitivamente e emocionalmente vulnerável' em custódia policial, foi permanentemente arquivado após uma corte identificar 'defeitos' na investigação subsequente.", "titulo_pt": "Juízo arquiva processo contra policiais acusados de uso excessivo de força em homem indígena vulnerável", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 113867, "titulo": "Datos bancarios y placas de carros: el temor de los migrantes por información compartida al ICE", "url": "https://www.lanacion.com.ar/estados-unidos/migraciones/datos-bancarios-y-placas-de-carros-el-temor-de-los-migrantes-por-informacion-compartida-al-ice-nid20082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-21T00:15:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ICE pode utilizar informações bancárias e placas de veículos para localizar pessoas, mas há limites legais para o acesso a essas informações. Migrantes temem a possibilidade de compartilhamento de dados que poderia resultar em suas localizações.", "titulo_pt": "Dados bancários e placas de carros: o medo dos migrantes sobre a compartilhamento de informações com o ICE", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 113899, "titulo": "Allanan oficinas del Senado en investigación por coimas en la Junaeb; Cepal reduce a 1,6% proyección de crecimiento para Chile, y 7 de cada 10 muertos por influenza no se vacunaron", "url": "https://www.ciperchile.cl/2026/08/20/radar-20-08-2026/?utm_source=rss&utm_medium=rss&utm_campaign=radar-20-08-2026", "fonte_id": "ciper_chile", "data_pub": "2026-08-21T00:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As oficinas do Senado foram alvo de uma investigação por supostas coimas relacionadas à Junaeb. A Cepal revisou para 1,6% a previsão de crescimento para o Chile. Sete em cada dez mortes por influenza não haviam sido vacinadas.", "titulo_pt": "Senado alvo de investigação por coimas; Cepal reduz projeção de crescimento para Chile; maioria dos mortos por influenza não se vacinou", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 113598, "titulo": "Caso Marielle: acusado pede habeas corpus para deixar presídio federal", "url": "https://veja.abril.com.br/brasil/caso-marielle-acusado-pede-habeas-corpus-para-deixar-presidio-federal/", "fonte_id": "veja", "data_pub": "2026-08-20T23:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Suel, acusado no caso Marielle, está preso desde 2023 e aguarda o julgamento pelo júri popular. Ele contestou a decisão que prorrogou sua permanência em uma unidade de segurança máxima por mais um ano.", "titulo_pt": "Acusado no caso Marielle pede habeas corpus para sair do presídio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 114331, "titulo": "Hundreds of Tibetans protest China’s ethnic unity law by shaving heads", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/20/hundreds-of-tibetans-protest-chinas-ethnic-unity-law-by-shaving-heads?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-20T20:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Centenas de tibetanos organizaram uma protesto em Nova Deli, levando muitos exilados a se rapar os cabelos como forma de expressar sua oposição à lei de unidade étnica da China.", "titulo_pt": "Centenas de tibetanos protestam na Índia ao se rapar os cabelos contra a lei de unidade étnica da China", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 113900, "titulo": "Informe noruego detectó casos de corrupción y amenazas en adopciones de 61 niños chilenos enviados a ese país entre 1987 y 2010", "url": "https://www.ciperchile.cl/2026/08/20/informe-noruego-detecto-casos-de-corrupcion-y-amenazas-en-adopciones-de-61-ninos-chilenos-enviados-a-ese-pais-entre-1987-y-2010/?utm_source=rss&utm_medium=rss&utm_campaign=informe-noruego-detecto-casos-de-corrupcion-y-amenazas-en-adopciones-de-61-ninos-chilenos-enviados-a-ese-pais-entre-1987-y-2010", "fonte_id": "ciper_chile", "data_pub": "2026-08-20T20:19:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um relatório norueguês identificou casos de corrupção e ameaças relacionados a 61 adoções de crianças chilenas enviadas ao país entre 1987 e 2010.", "titulo_pt": "Relatório norueguês detecta casos de corrupção e ameaças em adoções de 61 crianças chilenas enviadas ao país entre 1987 e 2010", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 114351, "titulo": "Opinion: Amid genocide in Gaza, why must Palestinian journalists uphold the illusion of neutrality?", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/opinion-amid-genocide-gaza-why-must-palestinian-journalists-uphold", "fonte_id": "middle_east_eye", "data_pub": "2026-08-20T20:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No dia 20 de junho de 2026, o exército israelense matou o repórter de vídeo da Al Jazeera Mubasher, Ahmed Wishah, em um ataque a drone, menos de dois meses após a morte de seu irmão, o repórter Mohammed Wishah, também morto pelo exército israelense em 8 de abril. Ahmed pediu na Al Jazeera que seu irmão fosse o último jornalista a ser morto por Israel, pedindo que o mundo parasse com a ocupação que mata jornalistas.", "titulo_pt": "Opinião: diante do genocídio em Gaza, por que os jornalistas palestinos devem manter a ilusão de neutralidade?", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 114335, "titulo": "Amputee children learn to swim after losing limbs in Israel’s war on Gaza", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/20/amputee-children-learn-to-swim-after-losing-limbs-in-israels-war-on-gaza?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-20T20:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Crianças amputadas em Gaza estão aprendendo a nadar como parte de um programa que ajuda a reerguer sua autoconfiança e mobilidade.", "titulo_pt": "Crianças amputadas em Gaza aprendem a nadar", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 114444, "titulo": "Remains of 23 Wartime Victims Unearthed from Mass Graves in Kosovo", "url": "https://balkaninsight.com/2026/08/20/remains-of-23-wartime-victims-unearthed-from-mass-graves-in-kosovo/btj/", "fonte_id": "balkan_insight", "data_pub": "2026-08-20T15:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foram descobertos os restos mortais de 23 indivíduos em três locais perto de Zubin Potok, no norte de Kosovo, durante escavações que autoridades acreditam estarem relacionadas a vítimas que foram desaparecidas forçosamente durante a guerra de 1998-99.", "titulo_pt": "Restos mortais de 23 vítimas da guerra forçadas a serem descobertos em massacres em Kosovo", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 113901, "titulo": "La eterna deuda con la salud de la niñez institucionalizada", "url": "https://www.ciperchile.cl/2026/08/20/la-eterna-deuda-con-la-salud-de-la-ninez-institucionalizada/?utm_source=rss&utm_medium=rss&utm_campaign=la-eterna-deuda-con-la-salud-de-la-ninez-institucionalizada", "fonte_id": "ciper_chile", "data_pub": "2026-08-20T14:48:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto aborda a saúde da infância institucionalizada, destacando a importância de se reconhecer e atender as necessidades de saúde dessas crianças. A entrada faz parte do site CIPER Chile.", "titulo_pt": "A eterna dívida com a saúde da infância institucionalizada", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 114446, "titulo": "Human Rights Watchdog Urges Italy, Albania to End Offshore Migrant Detention", "url": "https://balkaninsight.com/2026/08/20/human-rights-watchdog-urges-italy-albania-to-end-offshore-migrant-detention/bi/", "fonte }

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });

});

    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
