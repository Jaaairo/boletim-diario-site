eputado pede proteção para Roberta Luchsinger, alvo de ameaças por falas sobre Lula", "url": "https://veja.abril.com.br/politica/deputado-pede-protecao-para-roberta-luchsinger-alvo-de-ameacas-por-falas-sobre-lula/", "fonte_id": "veja", "data_pub": "2026-10-23T15:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um deputado solicitou proteção para a parlamentar Roberta Luchsinger, que está sendo ameaçada por comentários sobre Lula. O parlamentar Sanderson pretende chamar um lobista para discutir na Câmara dos Deputados as ameaças sofridas pela parlamentar e os eventos que envolveram o filho do presidente da República.", "titulo_pt": "Deputado pede proteção para parlamentar ameaçada e planeja debate sobre ameaças na câmara", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 221044, "titulo": "Casa de repouso: quanto custa por mês e como as famílias pagam a conta", "url": "https://exame.com/invest/minhas-financas/quanto-custa-casa-de-repouso/", "fonte_id": "exame", "data_pub": "2026-10-23T14:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A mensalidade para uma casa de repouso varia dependendo do local e das facilidades oferecidas. As famílias podem dividir a despesa de diferentes maneiras, incluindo custos individuais e acordos familiares.", "titulo_pt": "Casa de repouso: quanto custa por mês e como as famílias pagam a conta", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 221196, "titulo": "Os perigos do excesso de proteína para os adolescentes", "url": "https://www.dw.com/pt-br/os-perigos-do-excesso-de-proteína-para-os-adolescentes/a-79733074?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-10-23T13:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O excesso de proteína pode sobrecarregar o organismo e comprometer a saúde, incluindo a pele. Especialistas recomendam cautela com o consumo de shakes e suplementos de proteína.", "titulo_pt": "Perigos do excesso de proteína para os adolescentes", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 221246, "titulo": "Diretriz cria nova categoria para risco cardiovascular, mas SUS mantém protocolo de 2019", "url": "https://www.jota.info/coberturas-especiais/diretriz-cria-nova-categoria-para-risco-cardiovascular-mas-sus-mantem-protocolo-de-2019", "fonte_id": "jota", "data_pub": "2026-10-23T11:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A diretriz criou uma nova categoria para risco cardiovascular, identificando pacientes com maior probabilidade de sofrerem um novo infarto ou AVC. No entanto, o Sistema Único de Saúde (SUS) mantém seu protocolo de 2019 sem alterações.", "titulo_pt": "Diretriz cria nova categoria para risco cardiovascular, mas SUS mantém protocolo de 2019", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 221587, "titulo": "Japan calls for more support amid rising youth suicides", "url": "https://www.japantimes.co.jp/news/2026/10/23/japan/society/japan-youth-suicides-white-paper/", "fonte_id": "japan_times", "data_pub": "2026-10-23T11:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório destacou a importância de aumentar o apoio para reduzir os riscos de autolesão entre jovens. O Japão pediu mais assistência nessa área.", "titulo_pt": "Japão solicita maior apoio diante do aumento de suicídios entre jovens", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 221371, "titulo": "We’ve spent decades fighting campus sexual assault. Why haven’t colleges figured it out?", "url": "https://www.vox.com/life/507369/colleges-sexual-assault-jane-doe-cornell-frats-greek-life", "fonte_id": "vox", "data_pub": "2026-10-23T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma ex-aluna da Cornell University, identificada judicialmente como 'Jane Doe', processou a universidade e sete membros da Fraternidade Chi Phi após ser estuprada em outubro de 2024. O processo disciplinar interno da Cornell resultou na expulsão de dois dos acusados e na suspensão de outros dois.", "titulo_pt": "Passamos décadas combatendo assédio sexual nas universidades. Por que as faculdades ainda não resolveram isso?", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 221529, "titulo": "From education to cancer care: Global summit calls for better support for children", "url": "https://www.euronews.com/2026/10/23/from-education-to-cancer-care-global-summit-calls-for-better-support-for-children", "fonte_id": "euronews", "data_pub": "2026-10-23T10:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um fórum global abordou vários aspectos que afetam a vida de crianças, incluindo educação e cuidados com o câncer, destacando a necessidade de melhorar o apoio para as crianças além do simples aumento do acesso a serviços essenciais.", "titulo_pt": "De educação a cuidados com o câncer: fórum global busca melhorar apoio para crianças", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 220176, "titulo": "Foragido por feminicídio no Rio, \"Mendigato\" é preso em academia de SP", "url": "https://www.metropoles.com/sao-paulo/foragido-por-feminicidio-no-rio-mendigato-e-preso-em-academia-de-sp", "fonte_id": "metropoles", "data_pub": "2026-10-23T09:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Valdir Coimbra da Costa, conhecido como 'Mendigato', foi preso em uma academia em São Paulo. Ele é suspeito de cometer um feminicídio no Rio de Janeiro, onde teria matado e ocultado o corpo da sua ex-namorada, Cristiane dos Santos.", "titulo_pt": "Foragido por feminicídio no Rio, 'Mendigato' é preso em academia de SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 221114, "titulo": "Onda de calor brutal matou mais de 50 mil pessoas na Europa, indica análise", "url": "https://www.cnnbrasil.com.br/internacional/onda-de-calor-brutal-matou-mais-de-50-mil-pessoas-na-europa-indica-analise/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-23T17:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma análise indicou que o verão de 2026 foi provavelmente o mais perigosamente quente na Europa até hoje. Onda de calor brutal matou mais de 50 mil pessoas no continente.", "titulo_pt": "Onda de calor brutal matou mais de 50 mil pessoas na Europa, indica análise", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 221251, "titulo": "Cómo los eventos climáticos extremos amenazan la seguridad alimentaria en Chile", "url": "https://www.latercera.com/sustentabilidad/noticia/como-los-eventos-climaticos-extremos-amenazan-la-seguridad-alimentaria-en-chile/", "fonte_id": "la_tercera", "data_pub": "2026-10-23T17:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em um contexto de Dia Internacional contra o Mudança Climática, Cheaf alerta sobre os efeitos dos eventos climáticos extremos na agricultura e na segurança alimentar. Um novo relatório da ONU prevê um aquecimento global superior a 2°C neste século.", "titulo_pt": "Como os eventos climáticos extremos ameaçam a segurança alimentar no Chile", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 221034, "titulo": "Bactérias estão se alimentando de combustível vazado de navios da 2ª Guerra", "url": "https://www.metropoles.com/ciencia/bacterias-estao-se-alimentando-de-combustivel-vazado-de-navios-da-2a-guerra", "fonte_id": "metropoles", "data_pub": "2026-10-23T17:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bactérias estão se alimentando de combustível vazado de navios naufragados na Micronésia durante a 2ª Guerra Mundial. Os navios naufragaram em 1944 devido a ataques aéreos norte-americanos.", "titulo_pt": "Bactérias se alimentam de combustível de navios da 2ª Guerra em naufrágios da micronésia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 221005, "titulo": "Cinco países suspendem compras de frango brasileiro após confirmação de doença em SC", "url": "https://veja.abril.com.br/economia/cinco-paises-suspendem-compras-de-frango-brasileiro-apos-confirmacao-de-doenca-em-sc/", "fonte_id": "veja", "data_pub": "2026-10-23T16:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cinco países, incluindo Arábia Saudita, Malásia, China, Chile e México, suspenderam as compras de frango brasileiro após a confirmação de uma doença em Santa Catarina.", "titulo_pt": "Cinco países suspendem importações de frango brasileiro após confirmação de doença em SC", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 221772, "titulo": "Chart: A record two-thirds of car sales in China are now electric vehicles", "url": "https://www.carbonbrief.org/chart-a-record-two-thirds-of-car-sales-in-china-are-now-electric-vehicles", "fonte_id": "carbon_brief", "data_pub": "2026-10-23T15:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em setembro, as vendas de veículos elétricos e híbridos novos atingiram 67% do total de vendas de carros em China, um recorde.", "titulo_pt": "Gráfico: dois terços dos carros vendidos na China agora são veículos elétricos", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 221525, "titulo": "Storm Austen batters France and UK with winds of up to 160 km/h", "url": "https://www.euronews.com/video/2026/10/23/storm-austen-batters-france-and-uk-with-winds-of-up-to-160-kmh", "fonte_id": "euronews", "data_pub": "2026-10-23T13:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O temporal Austen atingiu a França e o Reino Unido com ondas gigantes, árvores arrancadas do chão e barcos danificados. Vento forte de até 160 km/h atingiu a Bretanha francesa, enquanto galhos caídos bloquearam as estradas no sul da Inglaterra.", "titulo_pt": "Temporal Austen castiga França e reino unido com ventos de até 160 km/h", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 221059, "titulo": "Gestão Sustentável: Brasil mostra que a transição climática é possível", "url": "https://exame.com/bussola/gestao-sustentavel-brasil-prova-que-a-transicao-climatica-e-possivel/", "fonte_id": "exame", "data_pub": "2026-10-23T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil registrou uma redução de 6% nas emissões de gases de efeito estufa em 2025, principalmente devido ao controle do desmatamento na Amazônia e no Cerrado.", "titulo_pt": "Gestão Sustentável: Brasil demonstra que a transição climática é possível", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 221061, "titulo": "Fogo vira caso de polícia no Amazonas, e fumaça acompanha Manaus até as urnas", "url": "https://exame.com/esg/fogo-vira-caso-de-policia-no-amazonas-e-fumaca-acompanha-manaus-ate-as-urnas/", "fonte_id": "exame", "data_pub": "2026-10-23T12:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal abriu nove procedimentos relacionados ao fogo no Amazonas. Embargos somam 250 hectares e os focos de incêndio recuaram 46%, mas as chamas ainda persistem em 30 municípios.", "titulo_pt": "Fogo vira caso de polícia no Amazonas e fumaça acompanha Manaus até as urnas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 221585, "titulo": "Government calls for stronger energy supply structure in white paper", "url": "https://www.japantimes.co.jp/news/2026/10/23/japan/japan-energy-white-paper/", "fonte_id": "japan_times", "data_pub": "2026-10-23T11:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório orçamentário de 2025 sobre energia enfatizou a necessidade de fortalecer a estrutura de oferta e demanda de energia no Japão para se preparar para emergências futuras.", "titulo_pt": "Governo destaca a necessidade de fortalecer a estrutura de energia no white paper", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 220690, "titulo": "Paper straws worse for the environment than plastic, South Korea study finds", "url": "https://www.scmp.com/week-asia/health-environment/article/3371936/paper-straws-worse-environment-plastic-south-korea-study-finds", "fonte_id": "scmp", "data_pub": "2026-10-23T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo encomendado pelo Ministério de Clima, Energia e Meio Ambiente da Coreia do Sul descobriu que os palitos de papel, amplamente promovidos como uma alternativa ecológica aos de plástico, podem ter um impacto ambiental maior do que os palitos de plástico convencionais. Este achado reavivou a discussão sobre se a mudança de material realmente reduz o desperdício.", "titulo_pt": "Palitos de papel podem ter maior impacto ambiental do que os de plástico, sugere estudo sul-coreano", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 220586, "titulo": "Flash floods swamp southeast Australia as record October rainfall forces school closures", "url": "https://www.euronews.com/2026/10/23/flash-floods-swamp-southeast-australia-as-record-october-rainfall-forces-school-closures", "fonte_id": "euronews", "data_pub": "2026-10-23T08:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Flash floods inundaram áreas do sul-leste da Austrália, causando alagamentos graves que levaram a escolas a serem fechadas devido a chuvas históricas em outubro. Um repórter de televisão teve que se despir de sapatos e óculos para resgatar um motorista cujo carro estava afundando rapidamente em Morayfield, Queensland.", "titulo_pt": "Inundações flash inundam sul-leste da austrália com chuvas de outubro recorde fechando escolas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 220182, "titulo": "Vazamento de petróleo provoca fechamento de praias nos Emirados Árabes", "url": "https://www.metropoles.com/mundo/vazamento-de-petroleo-provoca-fechamento-de-praias-nos-emirados-arabes", "fonte_id": "metropoles", "data_pub": "2026-10-23T08:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Praias nos Emirados Árabes foram fechadas devido a um vazamento de petróleo. Elas permanecerão fechadas até que equipes técnicas avaliem a situação e determinem as medidas necessárias.", "titulo_pt": "Vazamento de petróleo leva a fechamento de praias nos Emirados Árabes", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 220588, "titulo": "Taiwan: Deadly Typhoon Champi brings travel chaos and school closures", "url": "https://www.euronews.com/video/2026/10/23/taiwan-deadly-typhoon-champi-brings-travel-chaos-and-school-closures", "fonte_id": "euronews", "data_pub": "2026-10-23T07:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O furacão Champi atingiu a costa de Taiwan, causando ondas altas e deixando uma morte, 94 feridos e centenas de voos cancelados.", "titulo_pt": "Taiwan: furacão Champi causa mortes, feridos e cancelamentos de voos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 220671, "titulo": "Japan weighs how to evacuate thousands of tourists if Mount Fuji erupts", "url": "https://www.japantimes.co.jp/news/2026/10/23/japan/mount-fuji-eruption-foreign-tourists/", "fonte_id": "japan_times", "data_pub": "2026-10-23T07:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Monte Fuji, o ponto mais alto do Japão, é frequentemente considerado um vulcão inativo. No entanto, com o risco de erupção sempre presente, a preparação para desastres é crucial.", "titulo_pt": "Japão pondera como evacuar milhares de turistas se o monte Fuji erupcionar", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 220268, "titulo": "Vazamento de petróleo leva ao fechamento de praias nos Emirados Árabes", "url": "https://www.cnnbrasil.com.br/internacional/vazamento-de-petroleo-leva-ao-fechamento-de-praias-nos-emirados-arabes/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-23T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": 220182, "texto_pt": "As praias de Umm Al Quwain foram fechadas devido a um vazamento de petróleo. A medida permanecerá em vigor até que avaliações técnicas sejam concluídas. Os odores relatados por moradores de três regiões não apresentam riscos à saúde.", "titulo_pt": "Vazamento de petróleo leva ao fechamento de praias nos Emirados Árabes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 220706, "titulo": "Indonesian wildfires threaten world’s oldest cave paintings in Sulawesi", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3371884/indonesian-wildfires-threaten-worlds-oldest-cave-paintings-sulawesi", "fonte_id": "scmp", "data_pub": "2026-10-23T06:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cavernas na ilha indonésia de Sulawesi contêm pinturas rupestres datadas em mais de 67.000 anos, que estão em perigo devido às chamas e fumaça das piores queimadas da história do país, que ocorrem devido a um El Niño severo. Pesquisadores alertam que o calor e a fumaça podem acelerar o desgaste dessas obras de arte antiga.", "titulo_pt": "Incêndios na indonésia ameaçam pinturas rupestres antigas em Sulawesi", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 221465, "titulo": "Fundación Horizonte Ciudadano: Presupuesto 2027 elimina 18 programas sociales por un monto de $50 mil millones", "url": "https://www.ciperchile.cl/2026/10/23/fundacion-horizonte-ciudadano-presupuesto-2027-elimina-18-programas-sociales-por-un-monto-de-50-mil-millones/?utm_source=rss&utm_medium=rss&utm_campaign=fundacion-horizonte-ciudadano-presupuesto-2027-elimina-18-programas-sociales-por-un-monto-de-50-mil-millones", "fonte_id": "ciper_chile", "data_pub": "2026-10-23T17:59:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O orçamento de 2027 do Fundación Horizonte Ciudadano prevê a eliminação de 18 programas sociais com um valor total de $50 bilhões.", r as condenações de agressores sexuais de crianças", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 220659, "titulo": "Alleged Police Violence Against Minors Alarms Albania", "url": "https://balkaninsight.com/2026/10/23/alleged-police-violence-against-minors-alarms-albania/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-10-23T09:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 200 menores foram detidos ou acusados durante protestos em Albania, enquanto o Defensor do Povo e organizações de direitos humanos relatam acusações de violência policial e violações das medidas de proteção destinadas a crianças.", "titulo_pt": "Alegadas violências policiais contra menores alarmam Albania", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 220376, "titulo": "Rebaja de penas a abusadores de menores obliga a senadores y al gobierno a anunciar reformas para impedir el beneficio en estas condenas", "url": "https://www.latercera.com/politica/noticia/rebaja-de-penas-a-abusadores-de-menores-obliga-a-senadores-y-al-gobierno-a-anunciar-reformas-para-impedir-el-beneficio-en-estas-condenas/", "fonte_id": "la_tercera", "data_pub": "2026-10-23T00:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Senadores chilenos estão trabalhando em reformas legais para evitar que a redução de penas para abusadores de menores beneficie esses criminosos. O ministro de Justiça, Fernando Rabat, afirmou que o governo também apresentará um projeto de lei sobre o assunto.", "titulo_pt": "Senadores e governo chilenos buscam reformas para impedir benefícios para abusadores de menores", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 221645, "fonte_id": "taipei_times", "titulo": "Military to restructure on tech, firepower: source", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/24/2003866522", "data_pub": "2026-10-24T00:00:00Z", "topic               ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
