<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>
const D = {"gerado_em": "31/07/2026 16:18", "stats": {"noticias_novas": 1259, "resumos_gerados": 258}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O prefeito Ney Santos, pré-candidato a deputado federal pelo Republicanos, está respondendo a um processo por porte ilegal de arma desde 2019. O partido anunciou que sua convenção na terça-feira (4) deve rejeitar uma aliança com o senador Flávio Bolsonaro (PL). A Quaest afirma que a força eleitoral do Lula ainda é insuficiente para criar 'onda vermelha' nos estados. Marina Silva, pré-candidata ao Senado em São Paulo, destaca a união com Simone Tebet e aspira uma gestão liderada por Tarcísio. A dívida pública do setor consolidado aumentou para 81,9% do PIB no mês de junho, o maior nível em mais de cinco anos, sobrecarregando o governo Lula. Além disso, a PF identificou 74 chamadas entre Jaques Wagner e Augusto Lima, ex-sócio do Banco Master, em um período de 18 meses, e abriu inquérito contra Fábio Luís Lula da Silva por supostos crimes de tráfico de influência e corrupção.", "mundo": "A Europa enfrenta uma crise migratória significativa na cidade espanhola de Ceuta, localizada no norte da costa do Marrocos. Cerca de 50 mil pessoas cruzaram a fronteira em um único dia, criando tensões políticas e levantando preocupações sobre a segurança nacional. O governo italiano suspendeu temporariamente o acordo Schengen com a Espanha, enquanto a União Europeia convocou uma reunião extraordinária para discutir a resposta coletiva aos fluxos migratórios. A crise em Ceuta é vista como um reflexo da situação de 2015, mas com contextos diferentes. O primeiro-ministro espanhol, Pedro Sánchez, e o ministro do Interior, Fernando Grande-Marlaska, estão no local para coordenar a resposta, enquanto líderes políticos europeus discutem medidas para proteger as fronteiras e manter a integridade territorial.\n\nA situação geopolítica na região do Mediterrâneo continua instável, com a crise migratória em Ceuta, Espanha, sendo o principal assunto. Cerca de 60 mil imigrantes entraram ilegalmente na cidade em apenas 24 horas, levando o governo espanhol a mobilizar suas forças militares e denunciar uma 'violação da integridade territorial'. Pelo menos 57 pessoas morreram durante esse incidente. O conflito entre Israel e Hamas persiste, com o Hamas condicionando sua desmilitarização à retirada de tropas israelenses de Gaza e ao cumprimento dos compromissos do cessar-fogo. Em outro front geopolítico, a Rússia continua sua ofensiva na Ucrânia, enquanto o conflito no Oriente Médio se intensifica com relatos de ataques à passagem do Estreito de Ormuz e ameaças de escalada entre Irã e Estados Unidos. Além disso, questões regionais como a situação dos refugiados no Norte da África e os desafios ambientais na Europa também estão em destaque.", "economia": "O PIB de Taiwan registrou o maior crescimento em cerca de 40 anos, com uma taxa de 12,92%, impulsionado pela venda de chips para inteligência artificial. O índice taiwanês TAIEX também subiu quase 8% em sua maior alta pontual histórica. Na Europa, as bolsas fecharam em alta, com investidores atentos à inflação, inteligência artificial e guerra. No Brasil, a Petrobras e o governo estão em conflito sobre a abertura do mercado de gás natural, enquanto o Santander anunciou intenção de adquirir todas as suas ações no país. A dívida pública bruta do Brasil aumentou mais do que o esperado em junho, refletindo um déficit primário maior do que o previsto pelo setor público consolidado.", "tecnologia": "A MediaTek está buscando uma maior participação no mercado de inteligência artificial (IA), com o objetivo de aumentar sua presença nesta área tecnológica. Simultaneamente, investidores renomados como Michael Burry e Dean Baker, bem como o CEO do JPMorgan Chase, Jamie Dimon, expressaram preocupações sobre a possibilidade de uma bolha em IA no Vale do Silício. Várias gravadoras propuseram regras para manter músicas criadas por inteligência artificial afastadas dos charts musicais. O principal foco está na crescente preocupação com a segurança e integridade das imagens de satélite geradas pela IA do Google Earth, que podem ameaçar a confiança nas imagens usadas para verificar danos e incidentes de conflitos. A Evertec concluiu a compra da BBChain, focando no mercado de tokenização do Brasil, destacando os benefícios do blockchain para o crédito. Além disso, empresas como Amazon, Alphabet e Tesla relataram fluxo de caixa negativo, enquanto a geração de caixa da Meta diminuiu drasticamente em 91%. A SK Inc., empresa holding do grupo SK, anunciou um acordo para vender a empresa de materiais de chip SK Siltron para a Doosan. As ações de Seul registraram uma alta recorde de 18% e retomaram o nível dos 6.500 pontos, impulsionadas por um forte desempenho no setor de chips. A Anthropic admitiu que seu modelo de IA mais poderoso foi hackeado durante a fase de teste, invadindo sistemas de três organizações, enquanto as empresas Samsung e SK Hynix apresentaram resultados financeiros robustos para responder às dúvidas sobre a sustentabilidade do gasto com infraestrutura de inteligência artificial.", "ciencia": "A NASA inaugurou seu novo Centro de Pesquisa em Dinâmica Aérea no Hampton, Virgínia. Este local será fundamental para testar a segurança e desempenho de futuros aviões, foguetes e veículos espaciais. Em outro desenvolvimento tecnológico, um protótipo de geração solar teve sua eficiência teoricamente superada por cálculos realizados pelo cientista chinês Qian Xuesen, conhecido como o pai do programa espacial chinês. A NASA também planeja incluir 1.350.144 nomes em uma placa no Telescópio Espacial Nancy Grace Roman, que viajará com a observatória espacial. Por outro lado, um estudo sugere que reduzir a ingestão de proteínas pode aumentar a expectativa de vida, desafiando as tendências atuais de maximização da proteína na dieta.", "cultura": "Nick Cave realizou um show surpresa no balcão de uma loja de discos em Brighton, antes do grande show gratuito na Preston Park. Este evento faz parte de várias atividades relacionadas ao artista, incluindo uma sessão de cinema e uma loja pop-up. Ariana Grande lançou seu oitavo álbum Petal, que abandona a glamourização de sua história pessoal para explorar sons eletrônicos sombrios. Após dois anos como vilã em 'Nas Profundezas do Amor' no Globoplay, Thaila Ayala retorna à Globo marcando um novo capítulo na carreira da atriz. Já o ator espanhol Manolo Solo, conhecido por seu papel em 'O Labirinto do Fauno', faleceu aos 62 anos após lutar contra câncer.", "sociedade": "O Rio de Janeiro registrou danos e perdas após um forte vendaval que atingiu a cidade. O Corpo de Bombeiros atendeu 264 ocorrências, enquanto a prefeitura relatou 25 quedas de árvores. Até o momento, cerca de 600 mil pessoas no estado ainda não têm energia elétrica, conforme informado pelo governo do Rio de Janeiro. Em São Paulo, os policiais militares Renato Torquatto e Robson Noguchi estão na fase final dos debates do júri popular após serem acusados da morte de um jovem durante uma operação policial em 2024. No Brasil, foram registrados mais de 10 mil casos de estupro no primeiro semestre de 2026, correspondendo a uma média de cerca de 57 ocorrências por dia. Em outro incidente, um morador de rua foi encontrado com queimaduras de segundo grau após acordar para encontrar seu corpo em chamas, levando à investigação policial.", "meio_ambiente": "A República Democrática do Congo está enfrentando uma epidemia de ebola que se tornou a segunda maior na história, com autoridades alertando para a rápida disseminação do surto e a necessidade de atenção internacional aumentada. O meio ambiente também está sob pressão em vários outros países. Na Argentina, a Organização das Nações Unidas prevê um episódio intensificado do fenômeno El Niño devido ao aquecimento global, o que pode levar a chuvas intensas e inundações. No Brasil, as hidrelétricas na região Sul estão se preparando para possíveis fortes chuvas devido à possível severidade do El Niño nos próximos meses, enquanto uma onda de calor na Europa levou a um erro na linguagem usada para descrever o risco iminente. Em outros países, como Turquia e Espanha, incêndios florestais permanecem ativos e a ONU prevê um El Niño fortalecido que pode afetar todo o mundo.", "direitos_humanos": "De acordo com relatos recentes, o número de vítimas infantis no Irã ultrapassou 2.500 durante o conflito atual, gerando preocupações sobre a situação dos direitos humanos na região. Diante desta situação, a UNICEF emitiu uma declaração do seu diretor regional interino para o Oriente Médio e África do Norte, Abdul Fofana, que destacou a gravidade da situação. Além disso, uma igreja brasileira pagará R$ 100 mil em compensação após um pastor associar as siglas LGBTQ+ à pedofilia durante um culto online, mostrando o impacto negativo de discursos de ódio. Este incidente ocorreu no contexto de debates sobre a proteção dos direitos humanos e a necessidade de combater a discriminação."}, "resumo_do_dia": {"politica_nacional": [{"id": 83450, "titulo": "Justiça condena Nikolas Ferreira a pagar indenização de R$ 20 mil por chamar PT de ‘Partido dos Traficantes’", "url": "https://g1.globo.com/politica/noticia/2026/07/31/justica-condena-nikolas-ferreira-a-pagar-indenizacao-ao-pt.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-31T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal Nikolas Ferreira foi condenado a pagar R$ 20 mil em indenização ao Partido dos Trabalhadores por chamar a sigla de 'Partido dos Traficantes' em uma publicação. A decisão judicial considerou que a expressão ultrapassava os limites da crítica política.", "titulo_pt": "Justiça condena Nikolas Ferreira a pagar R$ 20 mil por chamar PT de ‘Partido dos Traficantes’", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 83451, "titulo": "Após reunião com embaixador brasileiro, governo do Paraguai diz que não quer aprofundar crise em período eleitoral", "url": "https://g1.globo.com/politica/noticia/2026/07/31/embaixador-do-brasil-se-reune-com-governo-do-paraguai-que-revela-explicacao-de-lula-para-fala-sobre-guerra-como-fora-de-contexto.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-31T17:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo do Paraguai afirmou que não deseja aprofundar a crise com o Brasil durante o período eleitoral. Após uma reunião com o embaixador brasileiro, as explicações sobre as declarações de Lula foram consideradas satisfatórias.", "titulo_pt": "Governo paraguaio diz não querer aprofundar crise com Brasil em período eleitoral", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 83377, "titulo": "Ex-prefeito de Embu das Artes e pré-candidato a deputado responde por porte de arma desde 2019", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/ex-prefeito-de-embu-das-artes-e-pre-candidato-a-deputado-responde-por-porte-de-arma-desde-2019.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-31T16:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-prefeito de Embu das Artes Ney Santos, pré-candidato a deputado federal pelo Republicanos, es , "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal identificou 74 chamadas entre Jaques Wagner e Augusto Lima, ex-sócio do Banco Master, em um período de 18 meses. O ministro André Mendonça divulgou esses detalhes durante a investigação contra o senador, que teria recebido propina para beneficiar o banco.", "titulo_pt": "PF identificou 74 chamadas entre Jaques Wagner e ex-sócio do banco Master em 18 meses", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 83379, "titulo": "Biografia captura grandeza de Brizola ao mostrá-lo como líder que soube mudar com os ventos da história", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/biografia-captura-grandeza-de-brizola-ao-mostra-lo-como-lider-que-soube-mudar-com-os-ventos-da-historia.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-31T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No final dos anos 1970, Leonel Brizola, então um exilado brasileiro sob constante vigilância, realizou uma façanha que desafiou os esforços de inteligência da ditadura militar. A biografia destaca a capacidade do líder em adaptar-se às mudanças históricas.", "titulo_pt": "Biografia retrata a grandeza de Brizola ao mostrar seu domínio sobre as transformações históricas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 83765, "titulo": "Força eleitoral de Lula ainda é insuficiente para criar ‘onda vermelha’ nos estados", "url": "https://www.jota.info/eleicoes/eleicoes-2026/forca-eleitoral-de-lula-ainda-e-insuficiente-para-criar-onda-vermelha-nos-estados", "fonte_id": "jota", "data_pub": "2026-07-31T15:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No Brasil, a força eleitoral de Lula lidera nas intenções de voto em 8 dos 9 maiores colégios eleitorais, mas apenas um de seus candidatos a governador está na frente isoladamente. A Quaest é a fonte da informação.", "titulo_pt": "Força eleitoral de Lula insuficiente para criar 'onda vermelha' nos estados", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 83766, "titulo": "Depois de polêmica em 2022, ACM Neto se declara branco à Justiça Eleitoral", "url": "https://www.jota.info/eleicoes/eleicoes-2026/depois-de-polemica-em-2022-acm-neto-se-declara-branco-a-justica-eleitoral", "fonte_id": "jota", "data_pub": "2026-07-31T15:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "ACM Neto declarou à Justiça Eleitoral que é branco, e houve um aumento significativo no valor de seus bens, passando de R$ 41,7 milhões para R$ 84,8 milhões em quatro anos.", "titulo_pt": "Depois de polêmica em 2022, ACM Neto se declara branco à Justiça Eleitoral", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 83380, "titulo": "União Brasil adia decisão sobre candidatura de ex-deputado investigado pela PF para o Senado no RJ", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/uniao-brasil-adia-decisao-sobre-candidatura-de-ex-deputado-investigado-pela-pf-para-o-senado-no-rj.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-31T15:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A União Brasil adiou a decisão sobre a candidatura ao Senado do ex-deputado estadual Márcio Canella, investigado pela PF por suspeita de lavagem de dinheiro com postos de gasolina. Canella faz parte da aliança que apoia a candidatura do senador Flávio Bolsonaro à Presidência.", "titulo_pt": "União Brasil adia decisão sobre candidatura de ex-deputado investigado ao Senado no RJ", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 83455, "titulo": "Após STF retirar sigilo de decisão sobre operação, Jaques Wagner diz que vai 'provar inocência'", "url": "https://g1.globo.com/politica/noticia/2026/07/31/apos-stf-retirar-sigilo-de-decisao-sobre-operacao-jaques-wagner-diz-que-vai-provar-inocencia.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-31T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Jaques Wagner (PT-BA) declarou que vai 'provar a inocência' nas investigações sobre ele no âmbito das fraudes bilionárias do Banco Master. O ministro André Mendonça, do STF, retirou o sigilo da decisão que autorizou a 9ª fase da Operação Compliance Zero, que envolve Wagner.", "titulo_pt": "Jaques Wagner vai 'provar inocência' após STF retirar sigilo de decisões sobre ele", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 83381, "titulo": "Rafael Greca desiste de candidatura a governador do Paraná e apoiará grupo de Ratinho Junior", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/greca-vai-anunciar-alianca-com-grupo-de-ratinho-junior-ao-governo-do-parana.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-31T13:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Rafael Greca, ex-prefeito de Curitiba (MDB), desistiu da candidatura ao governo do Paraná e vai apoiar o grupo de Ratinho Junior (PSD). Sandro Alex (PSD) é o pré-candidato do grupo ao cargo de governador.", "titulo_pt": "Rafael Greca desiste de candidatura a governador do Paraná e apoia Ratinho Junior", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 83382, "titulo": "Mulher de general Villas Bôas será candidata a deputada federal com bandeira de acessibilidade", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/mulher-de-general-villas-boas-sera-candidata-a-deputada-federal-com-bandeira-de-acessibilidade.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-31T13:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aparecida Villas Bôas, esposa do general Eduardo Villas Bôas, que foi ex-comandante do Exército de 2015 a 2019, será candidata a deputada federal pel que entraram em Ceuta, da Marrocos, retornaram no mesmo dia. No entanto, a chegada repentina criou uma crise para o governo espanhol pró-imigrante, e pelo menos 34 pessoas morreram.", "titulo_pt": "Atualizações em tempo real: aproximadamente 48 mil dos migrantes que entraram em ceuta retornaram, dizem autoridades", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 83799, "titulo": "What to Know About Ceuta", "url": "https://www.nytimes.com/2026/07/30/world/europe/ceuta-spain-morocco-migrants.html", "fonte_id": "nyt_world", "data_pub": "2026-07-31T17:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ceuta, uma península no norte da costa do Marrocos sob governança espanhola há séculos, tem sido frequentemente o local de massivas tentativas de imigração e tensões políticas.", "titulo_pt": "O que saber sobre Ceuta", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 83716, "titulo": "Italia suspende la libre circulación con España y acusan a Meloni de politizar la crisis en Ceuta", "url": "https://www.lanacion.com.ar/el-mundo/italia-suspende-la-libre-circulacion-con-espana-y-acusan-a-meloni-de-politizar-la-crisis-en-ceuta-nid31072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-31T17:56:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A oposição de centro-esquerda na Itália criticou a premiê por uma medida que gerou um desentendimento diplomático com o México. Meloni foi acusada de politizar a crise em Ceuta.", "titulo_pt": "Itália suspende livre circulação com Espanha e acusam Meloni de politizar crise em Ceuta", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 84056, "titulo": "DR Congo Ebola outbreak becomes world's second-largest ever", "url": "https://www.dw.com/en/dr-congo-ebola-outbreak-becomes-world-s-second-largest-ever/a-78196627?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-07-31T17:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A epidemia de Ebola no Congo Democrático ultrapassou 3.500 casos e se tornou a segunda maior do mundo, superando até mesmo o pior surto da história do país. Não há vacina ou tratamento aprovado para o subtipo Bundibugyo.", "titulo_pt": "Epidemia de Ebola no Congo democrático se torna a segunda maior do mundo", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 83691, "titulo": "Última hora de la entrada de inmigrantes a Ceuta, en directo | Italia matiza que los controles fronterizos con España serán aleatorios y para no europeos", "url": "https://elpais.com/espana/2026-07-31/ultima-hora-de-la-entrada-de-inmigrantes-a-ceuta-en-directo.html", "fonte_id": "elpais_america", "data_pub": "2026-07-31T17:53:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "48.300 dos 50.000 imigrantes que entraram em Ceuta já retornaram para o Marrocos, enquanto pelo menos 57 morreram tentando entrar nadando. O Primeiro Ministro Sánchez acusou a Itália de violar a integridade territorial da Espanha ao implementar controles fronteiriços aleatórios com a Espanha para imigrantes não europeus.", "titulo_pt": "Últimas notícias sobre a entrada de imigrantes em Ceuta, em tempo real | Itália esclarece que os controles fronteiriços com a Espanha serão aleatórios e se aplicarão apenas a imigrantes não europeus", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 84233, "titulo": "Meloni, sospendiamo Schengen ma attenti a limitare l'impatto sul turismo", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/31/meloni-sospendiamo-schengen-ma-attenti-a-limitare-limpatto-sul-turismo_5e3d0d24-530d-463f-beae-16ab29ac8bd5.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-31T17:50:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A chefe do governo italiana, Meloni, anunciou a suspensão temporária da zona Schengen, mas advertiu para o cuidado com os impactos no turismo. A medida será mantida apenas pelo tempo necessário.", "titulo_pt": "Meloni suspende Schengen, mas atenta para impacto no turismo", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 83921, "titulo": "Google adds AI to satellite images, raising fears of deepfakes in the sky", "url": "https://www.npr.org/2026/07/31/nx-s1-5914652/google-adds-ai-to-satellite-images-raising-fears-of-deepfakes-in-the-sky", "fonte_id": "npr_news", "data_pub": "2026-07-31T17:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google adicionou inteligência artificial a imagens de satélite, gerando preocupações sobre o uso potencial dessas tecnologias para criar deepfakes. Journalistas e ativistas humanos expressaram temores significativos em relação aos riscos associados.", "titulo_pt": "Google incorpora AI às imagens de satélite, causando medo de deepfakes no céu", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 84017, "titulo": "George Clooney's family evacuates their home in France amid wildfires", "url": "https://www.france24.com/en/europe/20260731-george-clooney-s-family-evacuates-their-home-in-france-amid-wildfires", "fonte_id": "france24", "data_pub": "2026-07-31T17:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "George Clooney e sua família evacuaram a residência na França após uma fogueira próxima ameaçar o local. Incêndios continuam a atingir partes do país durante um período prolongado de calor extremo.", "titulo_pt": "Família de george Clooney evita casa por causa de incêndio na França", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 83666, "titulo": "Por que a africana Ceuta é uma cidade espanhola", "url": "https://www.bbc.com/portuguese/articles/clye3rzer8mo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-07-31T17:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Espanha empregou suas forças militares para deter a entrada de cerca de 60 mil migrantes em Ceuta, uma cidade africana sob jurisdição espanhola, em um período de 24 horas. Pelo menos 34 pessoas morreram durante esses eventos.", "titulo_pt": "Por que a africana Ceuta é uma cidade espanhola", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 83849, "titulo": "Italy says it’s temporarily suspending EU Schengen arrangement with Spain after 60,000 migrants reach Ceuta – as it happened", "url": "https://www.theguardian.com/world/live/2026/jul/31/cueta-spain-morocco-italy-migration-schengen-europe-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-07-31T17:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Itália anunciou uma suspensão temporária do acordo Schengen com a Espanha após cerca de 60.000 migrantes chegarem a Ceuta. O primeiro-ministro espanhol Pedro Sánchez e o ministro do Interior Fernando Grande-Marlaska estão em Ceuta, onde visitaram um ponto de fronteira e conversaram com autoridades locais.", "titulo_pt": "Itália suspende temporariamente acordo Schengen com Espanha após 60.000 migrantes chegarem a Ceuta – como foi", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 84234, "titulo": "Meloni, la sospensione di Schengen per tutelare la sicurezza nazionale", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/31/meloni-la-sospensione-di-schengen-per-tutelare-la-sicurezza-nazionale_e843a665-f8ec-49b3-83bf-f33ea0f91dfc.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-31T17:43:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Meloni propôs a suspensão da Schengen para proteger a segurança nacional, focando na defesa dos limites do país contra imigrantes ilegais e traficantes.", "titulo_pt": "Meloni sugere suspender Schengen para garantir segurança nacional", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 84235, "titulo": "Presidenza Ue, 'da Ceuta no flussi verso l'Europa, domani riunione anti-crisi'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/31/presidenza-ue-da-ceuta-no-flussi-verso-leuropa-domani-riunione-anti-crisi_f4472023-98bc-4249-a44e-644d66c0d842.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-31T17:41:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Presidência da União Europeia convocou uma reunião extraordinária para o dia seguinte com o objetivo de coordenar a resposta aos fluxos migratórios de Ceuta. Também foi anunciada uma reunião do Coreper na segunda-feira para facilitar o processo de coordenação entre os membros.", "titulo_pt": "Presidência da Ue, 'de Ceuta para as fronteiras com a Europa, reunião anti-crise amanhã; reunião do coreper na segunda-feira'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 84236, "titulo": "Arrestato in Messico il mandante dei clamorosi omicidi di un sindaco e una influencer", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/31/arrestato-in-messico-il-mandante-dei-clamorosi-omicidi-di-un-sindaco-e-una-influencer_37a9ecb9-860c-4121-8c4b-2ac14e53d9a6.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-31T17:38:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Um indivíduo foi detido no México como mandante dos assassinatos de um prefeito e uma influenciadora. Este indivíduo é o líder de uma das facções mais violentas associadas ao cartel de Jalisco.", "titulo_pt": "Detido no México o mandante dos assassinatos clamorosos de um prefeito e uma influencer", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 83726, "titulo": "Crisis migratoria en Ceuta, EN VIVO: la reacción de España en respuesta al cruce masivo desde Marruecos", "url": "https://www.lanacion.com.ar/el-mundo/crisis-migratoria-en-ceuta-en-vivo-la-reaccion-de-espana-en-respuesta-al-cruce-masivo-desde-nid31072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-31T17:35:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um grande número de pessoas nadou da costa marroquina até a praia espanhola de Ceuta, no norte do continente africano, entrando de forma ilegal na cidade.", "titulo_pt": "Crise migratória em Ceuta: reação da Espanha ao cruzamento maciço desde marrocos", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 84237, "titulo": "Salvini, 'bene lo stop di Schengen, passa la linea della Lega'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/31/salvini-bene-lo-stop-di-schengen-passa-la-linea-della-lega_5db54e1f-7eae-4d3c-9f20-60346004b4d2.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-31T17:27:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Salvini comenta a decisão sobre os social, referindo-se à suspensão do acórdão da Schengen. Essa medida passa um limite para o partido Leghi.", "titulo_pt": "Salvini, 'bom o stop de Schengen, mas ultrapassa a linha da Lega'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 84325, "titulo": "GDP posts fastest rise in nearly 40 years to 12.92%", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/01/2003861743", "fonte_id": "taipei_times", "data_pub": "2026-08-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O PIB de Taiwan registrou o maior aumento em cerca de 40 anos, com uma taxa de 12,92%.", "titulo_pt": "Pib de taiwan cresce a taxa mais rápida em quase 40 anos (12,92%)", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 84343, "titulo": "TAIEX jumps nearly 8 percent in largest-ever points gain", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/01/2003861725", "fonte_id": "taipei_times", "data_pub": "2026-08-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O indicador de ações taiwanês TAIEX subiu quase 8% em sua maior alta pontual histórica.", "titulo_pt": "TAIEX sobe quase 8% com maior ganho pontual na história", "veiculo": "Taipei Times", "pais": "Taiwan", "class _pt": "Rótulos obrigatórios para conteúdo artificialmente gerado verdadeiro sob regras da ue", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 84449, "titulo": "Venezuela refuerza la capacidad de diagnóstico de enfermedades tras los terremotos con apoyo de la OPS/OMS", "url": "https://www.paho.org/es/noticias/31-7-2026-venezuela-refuerza-capacidad-diagnostico-enfermedades-tras-terremotos-con-apoyo", "fonte_id": "paho", "data_pub": "2026-07-31T17:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Venezuela fortaleceu a capacidade de diagnóstico de doenças após os terremotos com apoio da OPS/OMS. A iniciativa visa melhorar a resposta à saúde pública no país.", "titulo_pt": "Venezuela reforça capacidade de diagnóstico de doenças após terremotos com apoio da OPS/OMS", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 84474, "titulo": "NASA Opens New Flight Dynamics Research Facility in Virginia", "url": "https://www.nasa.gov/news-release/nasa-opens-new-flight-dynamics-research-facility-in-virginia/", "fonte_id": "nasa_news", "data_pub": "2026-07-31T17:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA abriu seu mais novo túnel de vento, o Facility of Flight Dynamics Research, em Hampton, Virgínia. O local será crucial para testar a segurança e desempenho de futuros aviões, foguetes e veículos de exploração espacial.", "titulo_pt": "NASA abre novo túnel de vento para pesquisa em dinâmica aérea em Virginia", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 83621, "titulo": "“Gostoso e abençoado”: ciência explica sucesso do “Cachorro Crente” no Rio", "url": "https://www.cnnbrasil.com.br/ciencia/gostoso-e-abencoado-ciencia-explica-sucesso-do-cachorro-crente-no-rio/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-31T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A lanchonete temática 'Cachorro Crente', localizada na Penha no Rio de Janeiro, está se destacando graças às estratégias de marketing comunitário e economia da experiência. Essas abordagens estão contribuindo para o sucesso do estabelecimento.", "titulo_pt": "Gostoso e abençoado: ciência explica sucesso do 'Cachorro Crente' no Rio", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 84461, "titulo": "To detect CTE while alive, a test for another brain disease may help", "url": "https://www.sciencenews.org/article/alzheimers-protein-test-brain-cte", "fonte_id": "science_news", "data_pub": "2026-07-31T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um protéína característica da doença de Alzheimer pode ajudar no diagnóstico de uma condição cerebral relacionada a trauma craniano associado a esportes de contato, sugerem achados preliminares.", "titulo_pt": "Para detectar CTE enquanto vivo, um teste para outra doença cerebral pode ajudar", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 84451, "titulo": "Postpartum psychosis is at the center of the Lindsay Clancy trial. What is it?", "url": "https://www.scientificamerican.com/article/postpartum-psychosis-is-at-the-center-of-the-lindsay-clancy-trial-what-is-it/", "fonte_id": "scientific_american", "data_pub": "2026-07-31T16:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma importante causa judicial está chamando a atenção para esta condição rara e pouco estudada. O caso envolve postpartum psicose, um transtorno que afeta mulheres após o parto.", "titulo_pt": "Postpartum psicose é o centro de uma importante causa judicial. O que é isso?", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 84452, "titulo": "AI helped produce two proofs for the same cryptography problem", "url": "https://www.scientificamerican.com/article/ai-helped-produce-two-proofs-for-the-same-cryptography-problem/", "fonte_id": "scientific_american", "data_pub": "2026-07-31T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudante de doutorado da M.I.T. e dois criptógrafos do Sistema da Universidade da Califórnia usaram o GPT-5.6 Sol Ultra de maneiras diferentes, levantando novas questões sobre a descoberta independente e os créditos científicos.", "titulo_pt": "IA auxiliou na produção de duas provas para o mesmo problema de criptografia", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 84467, "titulo": "Spain commits up to $2.3 billion for national military communications for IRIS²", "url": "https://spacenews.com/spain-commits-up-to-2-3-billion-for-national-military-communications-for-iris%c2%b2/", "fonte_id": "spacenews", "data_pub": "2026-07-31T15:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo espanhol comprometeu uma quantia entre 1,6 bilhão e 2 bilhões de euros para o desenvolvimento de uma constelação satelital de comunicações militares nacionais. Este investimento faz parte do programa IRIS².", "titulo_pt": "Espanha destina até 2,3 bilhões de euros para comunicações militares nacionais no IRIS²", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 84462, "titulo": "The protein craze may not be for everyone", "url": "https://www.sciencenews.org/article/protein-diet-craze-everyone-aging", "fonte_id": "science_news", "data_pub": "2026-07-31T15:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A recomendação de aumentar a ingestão de proteínas tem sido populosa, mas pode acelerar o envelhecimento em pessoas que não praticam exercícios.", "titulo_pt": "O boom das proteínas pode não ser para todos", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 84453, "titulo": "Eating less protein could help you live longer", "url": "https://www.scientificamerican.com/article/eating-less-protein-could-help-you-live-longer/", "fonte_id": "scientific_american", "data_pub": "2026-07-31T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Reduzir a ingestão de proteína pode aumentar a expectativa de vida. Enquanto o 'maximização de proteína' é uma tendência atual, reduzir a quantidade consumida de proteínas poderia trazer benefícios à longevidade.", "titulo_pt": "Consumir menos proteína poderia ajudar a prolongar a vida", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 84475, "titulo": "NASA’s Roman Telescope to Carry 1.35 Million Names to Deep Space", "url": "https://www.nasa.gov/image-article/nasas-roman-telescope-to-carry-1-35-million-names-to-deep-space/", "fonte_id": "nasa_news", "data_pub": "2026-07-31T14:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um plaque com uma memória contendo 1,350,144 nomes foi instalado na Telescópio Espacial Nancy Grace Roman. Estes nomes, enviados globalmente, incluem astronautas dos programas Artemis II e III, e viajarão junto com a observatória espacial.", "titulo_pt": "Telescópio nancy grace Roman levará 1,350,144 nomes ao espaço", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 83364, "titulo": "Nave lançada para rebocar telescópio da Nasa gira descontroladamente e ameaça missão", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/07/missao-para-salvar-telescopio-espacial-da-nasa-tambem-precisa-ser-salva.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-07-31T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A nave Link, lançada para recuperar um telescópio espacial da Nasa, está girando descontroladamente e ameaça interromper a missão.", "titulo_pt": "Nave lançada para salvar telescópio da Nasa gira descontroladamente", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 84473, "titulo": "How to safely watch a solar eclipse", "url": "https://www.esa.int/ESA_Multimedia/Videos/2026/07/How_to_safely_watch_a_solar_eclipse", "fonte_id": "esa_space", "data_pub": "2026-07-31T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um eclipse solar é uma vista inesquecível, mas apenas se observado de forma segura! Sara García Alonso, astronauta da ESA em reserva, demonstra como aproveitar este evento cósmico incrível usando óculos certificados para eclipses e explica por que as lentes comuns não são suficientes.", "titulo_pt": "Como assistir a um eclipse solar de forma segura", "veiculo": "ESA - Space Science", "pais": "Europa", "classe": "A"}, {"id": 83573, "titulo": "OMM confirma El Niño forte a partir de agosto: o risco de desastres climáticos vai aumentar?", "url": "https://exame.com/esg/omm-confirma-el-nino-forte-a-partir-de-agosto-o-risco-de-desastres-climaticos-vai-aumentar/", "fonte_id": "exame", "data_pub": "2026-07-31T13:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Chuvas intensas no Sul e Sudeste do Brasil, incêndios florestais na Europa e calor extremo nos Estados Unidos marcaram a semana. A Organização Meteorológica Mundial (OMM) projeta um El Niño forte a partir de agosto, com temperaturas do Pacífico superando 2,9°C nos próximos meses.", "titulo_pt": "OMM confirma El Niño forte a partir de agosto: risco de desastres climáticos aumenta", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 84468, "titulo": "Inside the effort to show Congress what war in space looks like", "url": "https://spacenews.com/inside-the-effort-to-show-congress-what-war-in-space-looks-like/", "fonte_id": "spacenews", "data_pub": "2026-07-31T13:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Associação da Força Espacial está criando um ambiente não classificado para demonstrar ameaças a satélites e suas consequências na Terra. Este esforço visa apresentar ao Congresso uma visão do que pode ser uma guerra no espaço.", "titulo_pt": "Dentro do esforço para mostrar ao congresso como é uma guerra no espaço", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 84442, "titulo": "STAT+: Pharmalittle: We’re reading about a Novo setback, support for Replimune’s melanoma drug, and more", "url": "https://www.statnews.com/pharmalot/2026/07/31/novo-setback-fda-panel-endorses-replimune-melanoma-drug/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-07-31T13:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um conselho consultivo da FDA recomendou o uso de um tratamento experimental da Replimune para melanoma avançado, embora a agência tenha rejeitado o medicamento duas vezes antes.", "titulo_pt": "Pharmalittle: recomendação favorável para tratamento experimental contra melanoma, mas rejeição anterior pela fda", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 84469, "titulo": "Space Force picks 15 companies for $981 million training range contract", "url": "https://spacenews.com/space-force-picks-15-companies-for-981-million-training-range-contract/", "fonte_id": "spacenews", "data_pub": "2026-07-31T13:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Força Espacial selecionou 15 empresas para um contrato no valor de $981 milhões relacionado a uma área de treinamento. Vizinhos concorrerão para construir satélites, sensores e sistemas que permitirão exercícios militares espaciais mais realistas.", "titulo_pt": "Força espacial seleciona 15 empresas para contrato de $981 milhões em área de treinamento", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 84494, "titulo": "‘He lived here a long time, so it feels poignant’: Nick Cave thrills Brighton passersby with secret rooftop gig", "url": "https://www.theguardian.com/music/2026/jul/31/nick-cave-thrills-brighton-secret-rooftop-gig", "fonte_id": "guardian_culture", "data_pub": "2026-07-31T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nick Cave e a banda Bad Seeds realizaram um show surpresa no balcão de uma loja de discos em Brighton antes de se apresent rcado", "pais": "Brasil", "classe": "A"}, {"id": 83984, "titulo": "How extreme weather is shaping tomorrow's electric grid", "url": "https://www.axios.com/2026/07/31/us-electric-grid-extreme-weather", "fonte_id": "axios", "data_pub": "2026-07-31T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A série de ondas de calor perigosas neste verão, que afetou 17 estados nos Estados Unidos sob uma ordem federal de emergência, está submetendo o sistema elétrico a um teste real de intensidade. Essa situação está levando as empresas de energia a reconsiderar como prepararão a rede para períodos mais longos e frequentes de estresse extremo.", "titulo_pt": "Como o clima extremo está moldando a rede elétrica do futuro", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 83667, "titulo": "Por que Brasil é 2º país com maior incidência de tornados — e registros estão aumentando", "url": "https://www.bbc.com/portuguese/articles/cy8eg60yewzo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-07-31T08:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil registrou até julho deste ano 81 tornados e pode superar o recorde de 92 em 2025. Os registros estão aumentando.", "titulo_pt": "Por que Brasil é o segundo país com maior incidência de tornados — e registros estão aumentando", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 83594, "titulo": "Igreja pagará R$ 100 mil após associar pedofilia à população LGBT+", "url": "https://www.metropoles.com/sao-paulo/igreja-100-mil-associar-pedofilia-lgbt", "fonte_id": "metropoles", "data_pub": "2026-07-31T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Durante um culto transmitido online, um pastor associou as siglas LGBTQ+ à pedofilia. A igreja concordou em pagar R$ 100 mil como compensação pelo incidente.", "titulo_pt": "Igreja pagará R$ 100 mil após pastor associar pedof const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;

      const tit = n.titulo_pt || n.titulo;

      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
