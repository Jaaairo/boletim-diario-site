", "provavel_duplicata_de": null, "texto_pt": "O ministro Poduje visitou a zona afetada por um tornado em Requínoa e anunciou um subsídio para as viviendas danificadas. Segundo ele, será necessário substituir todas as coberturas, techos, cercas, muros medianeiros e, em muitos casos, expandir as habitações.", "titulo_pt": "Ministro Poduje visita área afetada por tornado em Requínoa e anuncia subsídio para casas danificadas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 228819, "titulo": "“No sirve una alerta roja cuando ya está corriendo el agua”: alcaldesa de Las Condes emplaza al gobierno tras lluvias", "url": "https://www.latercera.com/nacional/noticia/no-sirve-una-alerta-roja-cuando-ya-esta-corriendo-el-agua-alcaldesa-de-las-condes-emplaza-al-gobierno-tras-lluvias/", "fonte_id": "la_tercera", "data_pub": "2026-10-27T14:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A prefeita de Las Condes pediu melhorias nos sistemas de alerta temprana e maquinaria urgente ao MOP devido às novas inundações. Ela chamou as autoridades a aprimorarem os sistemas de alerta e a fornecerem equipamentos para enfrentar o risco de novos aluvões.", "titulo_pt": "‘Não serve uma alerta vermelha quando já está correndo a água’: prefeita de Las Condes pressiona governo após chuvas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 228893, "titulo": "Greens push for human override in aged care assessment after ombudsman’s scathing report into algorithm tool", "url": "https://www.theguardian.com/australia-news/2026/oct/28/greens-push-for-human-overridge-in-aged-care-assessment-after-ombudsmans-scathing-report-into-algorithm-tool", "fonte_id": "guardian_world", "data_pub": "2026-10-27T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O líder do Partido Verde, David Shoebridge, está pressionando o governo para que altere a legislação, permitindo um override humano no sistema de avaliação de cuidados para idosos. Um relatório incisivo da ombudsman recomenda essa mudança para corrigir os resultados das avaliações feitas pelos funcionários de cuidados para idosos.", "titulo_pt": "Verdes defendem override humano em avaliação de cuidados para idosos após relatório crítico", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 229399, "titulo": "‘Avoid revealing clothes’ advice prompts revision of migrant worker textbook", "url": "https://www.koreaherald.com/article/10916679", "fonte_id": "korea_herald", "data_pub": "2026-10-27T08:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ministra do Trabalho e Emprego anunciou que revisará um manual utilizado para treinar trabalhadores migrantes antes de chegarem à Coreia do Sul, após descobrir que aconselhava a 'evitar roupas reveladoras' para prevenir violência sexual. O ministério reconheceu que o manual, usado no Sistema de Permissão de Emprego, continha 'conteúdo inadequado' em uma seção sobre direitos trabalhistas, prevenção de violência sexual e proteção de vítimas.", "titulo_pt": "Aviso de 'evitar roupas reveladoras' leva a revisão do manual para trabalhadores migrantes", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 229412, "titulo": "Lee suggests ways around legislative delays in lowering juvenile criminal age", "url": "https://www.koreaherald.com/article/10916622", "fonte_id": "korea_herald", "data_pub": "2026-10-27T08:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Lee Jae Myung sugeriu explorar alternativas para acelerar o processo legislativo enquanto sua administração considera reduzir a idade de responsabilidade penal. Durante uma reunião do Conselho de Ministros, o ministério da Justiça apresentou os resultados de uma pesquisa pública sobre o assunto.", "titulo_pt": "Lee sugere alternativas para acelerar processo legislativo sobre redução da idade penal", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 229652, "titulo": "Seca na amazônia força donos de navios a reduzir carga, e demanda aérea aumenta", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/10/seca-na-amazonia-forca-donos-de-navios-a-reduzir-carga-e-demanda-aerea-aumenta.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estiagem na Amazônia, influenciada pelo El Niño, está limitando a navegação e exigindo que os proprietários de navios reduzam a carga de contêineres. A Antaq registra restrições de navegação em trechos da região.", "titulo_pt": "Seca na amazônia força donos de navios a reduzir carga e aumenta demanda aérea", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 229867, "titulo": "Vídeo: sucuri-amarela é flagrada enrolando corpo em jacaré dentro de lago no Pantanal de Mato Grosso do Sul", "url": "https://www.cnnbrasil.com.br/ciencia/video-sucuri-amarela-e-flagrada-enrolando-corpo-em-jacare-dentro-de-lago-no-pantanal-de-mato-grosso-do-sul/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-28T00:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um vídeo registrou uma sucuri-amarela enrolando o corpo em um jacaré dentro de um lago no Pantanal de Mato Grosso do Sul. O registro foi feito durante um safari na segunda-feira (26) e, de acordo com um técnico de agropecuária, a espécie não é frequentemente observada no local.", "titulo_pt": "Vídeo: sucuri-amarela enrola corpo em jacaré dentro de lago no Pantanal de Mato Grosso do Sul", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 230474, "titulo": "Trump is making it easier for fossil fuel companies to leak methane", "url": "https://www.theverge.com/policy/1019691/gas-leak-methane-rule-rollback-trump", "fonte_id": "the_verge", "data_pub": "2026-10-27T18:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Trump está planejando anunciar mudanças que enfraquecerão as regras que protegem contra vazamentos de metano. O metano é um potente gás de efeito estufa, até 80 vezes mais eficaz que o dióxido de carbono em um horizonte de 20 anos.", "titulo_pt": "Trump facilita a liberação de metano pelas empresas de petróleo e gás", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 230556, "titulo": "Q&A: Why are UK energy bills so high – and how could they be lowered?", "url": "https://www.carbonbrief.org/qa-why-are-uk-energy-bills-so-high-and-how-could-they-be-lowered", "fonte_id": "carbon_brief", "data_pub": "2026-10-27T16:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As contas de energia no Reino Unido têm continuado a aumentar em 2026, levantando debates intensos sobre como reduzi-las.", "titulo_pt": "Perguntas e respostas: por que as contas de energia no reino unido são tão altas – e como elas poderiam ser reduzidas?", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 229505, "titulo": "Guest post: Greenland ice sheet shrinks for 30th year in a row", "url": "https://www.carbonbrief.org/guest-post-greenland-ice-sheet-shrinks-for-30th-year-in-a-row", "fonte_id": "carbon_brief", "data_pub": "2026-10-27T14:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O gelo da geleira do Groenlândia registrou a 30ª perda consecutiva de gelo em um período de 12 meses. Isso ocorreu pela 30ª vez seguida no ano.", "titulo_pt": "Post convidado: geleira do groenlândia perde gelo pela 30ª vez seguida", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 228472, "titulo": "Mundo gerará menos energia renovável pela primeira vez em cinco anos, diz presidente de agência", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/10/mundo-gerara-menos-energia-renovavel-pela-primeira-vez-em-cinco-anos-diz-presidente-de-agencia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-27T11:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O chefe da Irena, Francesco la Camera, informou que o mundo adicionará menos capacidade de energia renovável em 2026 pela primeira vez em cinco anos, devido a problemas nas redes de transmissão e barreiras comerciais.", "titulo_pt": "Mundo adicionará menos energia renovável em 2026, diz chefe da irena", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 228900, "titulo": "Melting glaciers in Dolomites reveal cache of first world war munitions", "url": "https://www.theguardian.com/world/2026/oct/27/melting-glaciers-dolomites-first-world-war-munitions-italy", "fonte_id": "guardian_world", "data_pub": "2026-10-27T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O exército italiano removeu e desativou 250 explosivos presos na geleira por mais de 100 anos, após relatos de hikers. O material, que incluía bombas de artilharia italiana e bombas de morteiro francesas, emergiu dos glaciares que estão se derretendo rapidamente na Dolomitas.", "titulo_pt": "Glaciares derretidos na dolomitas revelam arsenal de explosivos da primeira guerra mundial", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 229284, "titulo": "Climate-threatened Fijian utopia rejects calls to relocate", "url": "https://www.japantimes.co.jp/environment/2026/10/27/climate-change/fiji-island-climate-threat/", "fonte_id": "japan_times", "data_pub": "2026-10-27T04:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os residentes da Ilha Serua querem proteger sua casa ancestral e a cultura associada. A ilha é conhecida por vistas que valeriam US$ 100 milhões.", "titulo_pt": "Utopia fijiana ameaçada pelo clima rejeita propostas de relocação", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 229292, "titulo": "Borneo struggles to breathe as wildfires fill the air with toxic smog", "url": "https://www.japantimes.co.jp/news/2026/10/27/asia-pacific/science-health/borneo-health-issues-pollution/", "fonte_id": "japan_times", "data_pub": "2026-10-27T03:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 300 mil pessoas em sete províncias da Indonésia ficaram doentes por infecções respiratórias de agosto a outubro, de acordo com o ministério da Saúde. As chamas florestais dispersaram uma névoa tóxica pelo ar, dificultando a respiração.", "titulo_pt": "Borneu luta para respirar com fumaça tóxica de incêndios florestais", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 229961, "titulo": "\"Tuve más afecto en prisión que por parte de mis vecinos\": habló el bioquímico de Esquel detenido por mantener encerrada a su familia", "url": "https://www.clarin.com/sociedad/afecto-prision-parte-vecinos-hablo-bioquimico-esquel-detenido-mantener-encerrada-familia_0_KyzhvxOaHv.html", "fonte_id": "clarin", "data_pub": "2026-10-28T01:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Miguel Battista, de 71 anos, foi imputado em Esquel por privação ilegítima de liberdade e abandono de pessoa, acusado de ter mantido sua família em cárcere privado. Ele foi transferido para uma comisaria em Trevelin.", "titulo_pt": "Tive mais afeto em prisão que com meus vizinhos", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 229724, "titulo": "Jafar Panahi, que disputou Oscar, é condenado a cinco anos de prisão pelo Irã", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/jafar-panahi-que-disputou-oscar-e-condenado-a-cinco-anos-de-prisao-pelo-ira.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-28T00:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cineasta iraniano Jafar Panahi foi condenado a cinco anos e um mês de prisão pelo Tribunal Revolucionário de Teerã. Além da sentença, ele foi proibido de usar redes e viajar durante dois anos e teve seus bens confiscados.", "titulo_pt": "Jafar Panahi, vencedor do Oscar iraniano, é condenado a cinco anos de prisão", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 230397, "titulo": "191 candidates sign on to support gender equality", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/28/2003866755", "fonte_id": "taipei_times", "data_pub": "2026-10-28T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "191 candidatos assinaram um documento em apoio à igualdade de gênero. O anúncio foi feito sem detalhes adicionais sobre o contexto ou as consequências das assinaturas.", "titulo_pt": "191 Candidatos apoiam igualdade de gênero", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 230577, "titulo": "Jafar Panahi Faces Five-Year Prison Sentence in Iran After Releasing ‘It Was Just an Accident’", "url": "https://www.indiewire.com/news/general-news/jafar-panahi-sentenced-prison-iran-1235224032/", "fonte_id": "indiewire", "data_pub": "2026-10-27T21:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O cineasta iraniano Jafar Panahi foi condenado a um prazo de cinco anos de prisão após lançar o filme 'Apenas um Acidente'. Além disso, ele foi proibido de viajar e de atividades nas redes sociais por dois anos.", "titulo_pt": "Jafar Panahi enfrenta sentença de cinco anos de prisão no Irã após lançar 'apenas um acidente'", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 230502, "titulo": "Pope Leo’s cancer is ‘game changer’ for papacy, Vatican foreign minister says", "url": "https://www.scmp.com/news/world/europe/article/3372351/pope-leos-cancer-game-changer-papacy-vatican-foreign-minister-says", "fonte_id": "scmp", "data_pub": "2026-10-27T18:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O arcebispo Paul Gallagher, ministro das Relações Exteriores do Vaticano, afirmou que o diagnóstico de câncer pulmonar e a cirurgia do Papa Leo representaram um 'game changer' para a percepção da saúde e do papado pelos católicos. O papa, de 71 anos, teve um lobo pulmonar removido em 13 de outubro, e os médicos afirmam que o câncer estava localizado e não se espalhou.", "titulo_pt": "Diagnóstico de câncer pulmonar do papa Leo é 'game changer' para a percepção do seu papado, diz ministro vaticano", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 230186, "titulo": "Press must be able to work freely, warn French media outlets, after journalists assaulted at far-right rally", "url": "https://www.lemonde.fr/en/politics/article/2026/10/27/press-must-be-able-to-work-freely-warn-french-media-outlets-after-journalists-assaulted-at-far-right-rally_6765414_5.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-27T16:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante o congresso do Rassemblement National, um partido de extrema direita, jornalistas do Mediapart e Politis foram agredidos pela segurança do partido e por seus apoiantes. Mais de 40 associações de jornalistas condenaram esses atos de violência e enfatizaram a importância de que a imprensa possa cobrir rallies políticos livremente.", "titulo_pt": "Jornalistas são agredidos em congresso de partido de extrema direita; associações condenam violência", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 228995, "titulo": "Palestinians in Gaza reflect on Israeli elections: 'We are human beings just like you'", "url": "https://www.lemonde.fr/en/international/article/2026/10/27/palestinians-in-gaza-reflect-on-israeli-elections-we-are-human-beings-just-like-you_6765409_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-27T15:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os palestinos no enclave de Gaza, ainda sofrendo com ataques israelenses, expressam pouca esperança em mudanças políticas israelenses após as eleições parlamentares realizadas em 27 de outubro. No entanto, muitos continuam a esperar que um novo governo possa aliviar sua situação.", "titulo_pt": "Palestinos em Gaza refletem sobre eleições israelenses: 'somos seres humanos como vocês'}", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 229302, "titulo": "Israel keeps committing genocide in Gaza after truce, UN inquiry says", "url": "https://www.scmp.com/news/world/middle-east/article/3372344/israel-keeps-committing-genocide-gaza-after-truce-un-inquiry-says", "fonte_id": "scmp", "data_pub": "2026-10-27T14:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório da Comissão Independente Internacional de Inquérito da ONU sobre as Terras Ocupaas Palestinianas, incluindo o Jerusalém Oriental, e Israel afirmou que Israel continuou a cometer genocídio no Gaza após o cessar-fogo de outubro, brokerado pelos Estados Unidos. Israel rejeitou o relatório, considerando-o parte de uma “campanha de desinformação”.", "titulo_pt": "Israel continua cometendo genocídio no Gaza após cessar-fogo, diz relatório da ONU", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 228526, "titulo": "‘Cancelado’ na China, Mbappé se desculpa por se referir a Mao como ditador", "url": "https://www.cartacapital.com.br/mundo/cancelado-na-china-mbappe-se-desculpa-por-se-referir-a-mao-como-ditador/", "fonte_id": "cartacapital", "data_pub": "2026-10-27T13:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Kylian Mbappé se desculpou após uma montagem que o associou ao ditador Mao Zedong, o que resultou em perda de patrocínios e proibição de usar o aplicativo de redes sociais chinês.", "titulo_pt": "Mbappé se desculpa por se referir a Mao como ditador e perde patrocínios na China", "veiculo": "CartaCapital", "pais": "Brasil", "classe": " function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

}

  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
