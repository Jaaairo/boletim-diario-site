<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 26/10/2026 15:29 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">
    <div class="modal-erro" id="senha-erro" style="display:none">Senha incorreta.</div>
    <div class="modal-btns">
      <button class="btn-sec2" onclick="fecharModal('modal-senha')">Cancelar</button>
      <button class="btn-pri" onclick="verificarSenha()">Entrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>
      <option value="erro_traducao">Erro de tradução</option>
      <option value="classificacao_errada">Classificação errada</option>
      <option value="resumo_impreciso">Resumo impreciso</option>
      <option value="outro">Outro</option>
    </select>
    <label for="flag-nota">Nota (opcional)</label>
    <textarea id="flag-nota" placeholder="Descreva o problema..."></textarea>
    <div class="modal-btns">
      <button class="btn-peri" id="btn-rm-flag" onclick="removerFlagAtual()" style="display:none;margin-right:auto">Remover</button>
      <button class="btn-sec2" onclick="fecharModal('modal-flag')">Cancelar</button>
      <button class="btn-pri" onclick="salvarFlagAtual()">Marcar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "26/10/2026 15:29", "stats": {"noticias_novas": 960, "resumos_gerados": 239}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Lula foi reeleito para seu quarto mandato após uma virada histórica nas eleições, com uma margem de 4,4 milhões de votos sobre o candidato Flávio Bolsonaro. O presidente venceu em todos os estados do país, ampliando sua base de apoio. Após as eleições, vários partidos e líderes mundiais reconheceram a vitória de Lula, que agora inicia um novo governo sob desconfiança dos mercados, com desafios econômicos como ajuste fiscal e desaceleração da atividade. Lula está reorganizando seu governo, buscando se aproximar de setores que estiveram distantes em seu terceiro mandato, como evangélicos e setor agrícola, para garantir um caminho para o campo hegemônico da sociedade. Além disso, a equipe econômica do novo governo está avaliando a possibilidade de uma 'mesa com ortodoxos' e considerando um tripé de medidas de ajuste, que inclui redução de gasto tributário, racionalização de benefícios sociais e ajustes nos pisos constitucionais de saúde e educação.", "mundo": "Luiz Inácio Lula da Silva venceu a eleição presidencial no Brasil, conquistando seu quarto mandato com uma grande adesão eleitoral. Sua vitória foi destacada em jornais europeus, que também mencionaram problemas na apuração eleitoral e a recusa de Flávio Bolsonaro em reconhecer o resultado. O governo alemão comemorou a reeleição de Lula, expressando interesse em fortalecer as relações entre os países e declarando que as acusações contra Flávio Bolsonaro serão investigadas pela justiça brasileira. Em contraste, Donald Trump manteve-se em silêncio sobre a vitória de Lula, refletindo a tensão na relação entre Brasil e EUA, e a Casa Branca ainda não havia reconhecido publicamente a vitória de Lula até a manhã desta segunda-feira. Além disso, a eleição presidencial na Bulgária resultou em segundo turno entre a candidata apoiada pelo governo e o candidato da oposição, após uma baixa votação recorde. A coalizão de estudantes venceu as eleições parlamentares na Sérvia, derrotando o líder populista Aleksandar Vucic, marcando um avanço significativo na democracia do país.\n\nA geopolítica regional e global continua em movimento constante, com várias nações e grupos enfrentando desafios significativos. Em primeiro lugar, a reunião quadrilateral entre Irã, Arábia Saudita, Paquistão e Turquia em Teerã evidencia a busca por cooperação e estabilidade na região do Oriente Médio, com foco na paz e segurança. O presidente iraniano, Masoud Pezeshkian, chamou para uma maior cooperação entre os países muçulmanos para combater a agressão israelense e os esforços dos EUA para dividir o Oriente Médio. Em seguida, os ataques russos às instalações de energia na Ucrânia foram considerados por um relatório da ONU como um crime de guerra, devido ao uso de armas químicas. Além disso, a Arábia Saudita enfrenta ataques hutíes, com o parlamento egípcio aprovando auxílio militar para o país, enquanto Israel realiza operações em Hebron, deslocando milhares de famílias palestinas. Finalmente, a eleição em Israel, com candidatos buscando derrubar Netanyahu, e a reunião de Vladimir Putin com líderes iranianos e qataris refletem as tensões e alianças em constante evolução na região.", "economia": "A vitória inesperada de Lula nas eleições presidenciais no Brasil causou uma das maiores quedas dos mercados brasileiros em décadas, conforme relatado pelo Financial Times. A bolsa brasileira registrou um circuit breaker pela primeira vez desde março de 2020, e o dólar subiu 12%, refletindo a reação negativa dos investidores. O risco-Brasil disparou quase 27%, e empresas como a Petrobras experimentaram fortes quedas nas ações. Diante dessas incertezas, o Tesouro Nacional realizou uma recompra de títulos prefixados no valor de R$ 7,1 bilhões, enquanto o Banco Central aprovou novas regras para o Pix, visando aumentar a transparência e reduzir o endividamento. Além disso, a confiança do consumidor no Brasil aumentou em outubro após cinco meses consecutivos de decréscimo, segundo a FGV. No exterior, a União Europeia considera adquirir participações em projetos de minerais críticos, seguindo a estratégia dos Estados Unidos e do Japão, enquanto a China vê suas marcas de beleza buscando espaço nas prateleiras globais.", "tecnologia": "A empresa de inteligência artificial Anthropic apresentou seu pedido para uma oferta pública inicial de ações (IPO), indicando que está prestes a se listar na bolsa de valores, conforme informado pelo The Verge. O documento S-1, com 335 páginas, fornece detalhes sobre as finanças da empresa, fatores de risco e perspectivas sobre o futuro da inteligência artificial. Além disso, economistas estão preocupados com a possibilidade de uma dependência excessiva de ferramentas de IA, conforme relatado pelo The Verge. Segundo o Financial Times, a estreia de Anthropic no mercado de ações pode se tornar a maior da história do mercado de capitais.", "ciencia": "Um estudo publicado na Conservation Letters aponta lacunas na rede de áreas protegidas na Europa devido às mudanças climáticas, enfatizando a necessidade de adaptar a proteção da vida selvagem às novas condições climáticas. Além disso, pesquisadores da University of Helsinki descobriram que o conteúdo emocional pode melhorar a forma como o cérebro humano processa conversas em ambientes sociais. Em outro desenvolvimento, a NASA convidou a mídia para visitar um simulador de pouso lunar no Ames Research Center, na California, enquanto a Astranis anunciou um contrato de lançamento dedicado para a Block 4 de seus satélites. Esses eventos refletem a diversidade da ciência, abrangendo desde a conservação ambiental até a tecnologia espacial e a inteligência artificial na pesquisa biológica.", "cultura": "O prefeito de Nova York, Eric Adams, comemorou a vitória de Lula, destacando os feitos do presidente brasileiro em favor dos trabalhadores e enfatizando a unidade do povo. Em outro evento, intelectuais debateram as declarações de Javier Milei sobre a mídia, chamando-a de 'insultocracia'. No Brasil, Danni Suzuki retorna à Globo para protagonizar uma série policial erótica. O Santa Cruz recebeu uma proposta para vender seus jogos como mandante na Série B do Campeonato Brasileiro em 2027. No exterior, a South China Morning Post venceu seis prêmios no Asian Media Awards 2026, incluindo todos os prêmios na categoria de melhor fotografia jornalística. A exposição de LS Lowry no MK Gallery de Milton Keynes apresenta suas pinturas que retratam a Inglaterra do Norte com seus terrenos sujos e céus cheios de chaminés, criando uma visão de uma dystopia que sufoca o espírito. Além disso, o documentário 'Você Pode Ver Tudo' se tornou um fenômeno cultural, enquanto a escola de música Tom Jobim abre quase mil vagas gratuitas para 2027, oferecendo quase mil vagas em mais de 100 cursos e habilitações.", "sociedade": "A sociedade enfrenta diversos desafios em diferentes contextos. Em Buenos Aires, o suspeito Renato Iván Tabella foi detido pela Divisão de Homicídios da Polícia, suspeito de envolvimento em dois casos de mortes, incluindo a de uma trabalhadora sexual em Retiro. Em Goianésia, um jovem de 19 anos, Matheus Henrique Oliveira Silva, morreu após cair de um caminhão em movimento durante uma carreata pró-Bolsonaro. No Rio de Janeiro, uma deputada sugeriu que empresários demitam funcionários que apoiaram Lula, refletindo tensões políticas. Em Goseong, na Província de Gangwon, cerca de um terço dos jovens têm origem migrante, destacando a crescente diversidade demográfica. O debate sobre reúso hídrico foi abordado pela Sociedade do Canal do Maipo e pela CPI, focando em estratégias para a eficiência na utilização de água. A saúde da mulher foi discutida em diversos âmbitos, incluindo a necessidade de olhar além das campanhas específicas e a regulação equilibrada das decisões médicas. Em Goiás, um homem foi agredido por um grupo após as eleições, refletindo tensões sociais. A rejeição à família Bolsonaro e a ascensão do Partido dos Trabalhadores foram discutidas, com a próxima eleição presidencial em 2030 abrindo espaço para novas lideranças.", "meio_ambiente": "A Holanda prometeu contribuir com 500 milhões de dólares para um fundo de florestas, a ser distribuído ao longo de dez anos, em apoio à iniciativa brasileira que visa arrecadar 10 bilhões de dólares. Este compromisso surge após a reeleição do presidente Luiz Inácio Lula da Silva, que tem como prioridade a recuperação ambiental e a sustentabilidade. Em outro desenvolvimento, a vigilância ambiental do estado da Austrália Ocidental alertou que o plano da Woodside Energy para perfurar gás na costa norte do país pode causar danos significativos a recifes de coral excepcionais e aumentar o risco de vazamento de óleo, possivelmente impossível de ser reduzido a um nível aceitável. Além disso, o Banco de Desenvolvimento Asiático alertou que a Filipinas enfrenta os custos mais altos de danos aos portos devido ao clima na Ásia Oriental, com prejuízos anuais projetados em 70,2 bilhões de dólares até 2100. Finalmente, o sistema de logística reversa de embalagens agrícolas no Brasil já destinou corretamente mais de 900 mil toneladas desde 2002, tornando-se uma referência na reciclagem e na sustentabilidade financeira. No entanto, a falta de estrutura e planejamento compromete a efetividade das unidades de conservação no Brasil, conhecidas como parques de papel, que não atendem plenamente seu propósito de preservação e gestão ambiental.", "direitos_humanos": "A Comissão da ONU acusou a Rússia de cometer crimes de guerra e contra a humanidade na Ucrânia, incluindo ataques deliberados à infraestrutura energética e o tráfico de estrangeiros para o Exército russo. Em outro desenvolvimento, o chefe das Nações Unidas para os direitos humanos, Volker Turk, advertiu sobre possíveis 'limpeza étnica' em Hebron, Israel, criticando operações israelenses que deslocaram mais de 2.000 palestinos da cidade. A Human Rights Watch (HRW) pediu à Coreia do Sul que relaxasse as restrições propostas sobre as regras para o remédio abortivo. A diretora executiva do UNICEF, Catherine Russell, fez uma declaração à Segurança das Nações Unidas sobre 30 anos de proteção a crianças afetadas por conflitos armados, destacando a transformação do compromisso em impacto. Além disso, uma mulher foi assassinada em Kosovo horas após denunciar violência doméstica à polícia, levantando preocupações sobre a proteção das mulheres. O governo marroquino considera anular decisões que permitiram a libertação antecipada de condenados por abuso sexual de menores, apesar de ter descartado anteriormente a suspensão dos decretos já executados. Por fim, a descoberta de bebês orangotangos em uma plantação no estado de Odisha, Índia, expôs um comércio ilegal de primatas que está se expandindo para o país. Em um evento de campanha no Michigan, o presidente dos Estados Unidos fez comentários anti-islâmicos sobre Abdul El-Sayed. Um ativista defendeu a necessidade de novas leis para combater a repressão."}, "resumo_do_dia": {"politica_nacional": [{"id": 226987, "titulo": "GO, SP e DF lideram ranking de UFs onde Lula mais ampliou votos no 2° turno", "url": "https://www.metropoles.com/distrito-federal/go-sp-e-df-lideram-ranking-de-ufs-onde-lula-mais-ampliou-votos-no-2-turno", "fonte_id": "metropoles", "data_pub": "2026-10-26T17:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula ampliou seus votos no segundo turno das eleições em Goiás, São Paulo e Distrito Federal. Estes estados lideram o ranking de unidades federativas onde o candidato obteve maior crescimento de votos no segundo turno.", "titulo_pt": "GO, SP e DF lideram ranking de estados onde Lula mais ampliou votos no 2° turno", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 226994, "titulo": "Após endossar decisão do STF, Daniella Marques critica eleição “conturbada\"", "url": "https://www.metropoles.com/brasil/apos-endossar-decisao-do-stf-daniella-marques-critica-eleicao-conturbada", "fonte_id": "metropoles", "data_pub": "2026-10-26T17:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Daniella Marques, coordenadora econômica da campanha de Flávio Bolsonaro, inicialmente endossou a prorrogação da votação, mas posteriormente criticou as eleições como 'conturbadas'.", "titulo_pt": "Daniella Marques critica eleição 'conturbada' após endossar prorrogação", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 226996, "titulo": "Aliados organizam festa de aniversário para Lula na terça em Brasília", "url": "https://www.metropoles.com/colunas/igor-gadelha/aliados-organizam-festa-de-aniversario-para-lula-na-terca-em-brasilia", "fonte_id": "metropoles", "data_pub": "2026-10-26T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados de Lula estão organizando uma festa de aniversário para ele em Brasília, dois dias após ele conquistar seu quarto mandato como presidente.", "titulo_pt": "Aliados organizam festa de aniversário para Lula na terça em Brasília", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 227036, "titulo": "TSE vê como “inquestionável” vitória de Lula; entenda", "url": "https://www.cnnbrasil.com.br/eleicoes/tse-ve-como-inquestionavel-vitoria-de-lula-entenda/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-26T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ministros do TSE declararam que o placar elástico das eleições presidenciais torna impossível questionar o resultado favorável a Lula. A afirmação foi feita durante uma live da CNN pelo analista de política Larissa Rodrigues.", "titulo_pt": "TSE considera vitória de Lula 'inquestionável'; entenda", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 227086, "titulo": "Partidos aliados de Flávio reconhecem a vitória de Lula; Zema fala em golpe", "url": "https://www.bbc.com/portuguese/articles/cmvgx3k00d5yo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-26T17:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Partidos aliados de Flávio Bolsonaro reconheceram a vitória de Lula nas eleições, mas CarlosKeyPressed, ex-governador de Minas Gerais, afirmou que a eleição foi 'mentirosa'. Augusto Cury e Tarcísio de Freitas ainda não se pronunciaram sobre o resultado das eleições.", "titulo_pt": "Partidos aliados de Flávio reconhecem vitória de Lula; Zema fala em eleição mentirosa", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 227084, "titulo": "O que Lula 4 herdará de Lula 3", "url": "https://braziljournal.com/o-que-lula-4-herdara-de-lula-3", "fonte_id": "brazil_journal", "data_pub": "2026-10-26T16:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Já se passaram 24 anos desde a primeira vitória de Lula, e agora, como em 2002, ele iniciará um novo mandato sob desconfiança dos mercados. Lula 3 deixou para Lula 4 um endividamento público superior a 82% do PIB, contra 72% no início do seu mandato.", "titulo_pt": "O que Lula 4 herdará de Lula 3", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 226972, "titulo": "As contas da PF sobre os crimes no 2º turno das eleições", "url": "https://veja.abril.com.br/brasil/as-contas-da-pf-sobre-os-crimes-no-2o-turno-das-eleicoes/", "fonte_id": "veja", "data_pub": "2026-10-26T16:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O balanço oficial da Polícia Federal registra R$ 41,4 mil apreendidos durante o segundo turno das eleições e mais de 2,4 mil inquéritos eleitorais em andamento no país.", "titulo_pt": "Contas da PF sobre crimes no segundo turno das eleições", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 227198, "titulo": "Após vitória improvável, Lula começa a reorganizar governo para seu quarto mandato", "url": "https://www.jota.info/executivo/apos-vitoria-improvavel-lula-comeca-a-reorganizar-governo-para-seu-quarto-mandato", "fonte_id": "jota", "data_pub": "2026-10-26T15:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula está reorganizando seu governo para seu quarto mandato, com uma tendência de que o partido ganhe mais peso no Nordeste em detrimento da região paulista.", "titulo_pt": "Após vitória improvável, Lula reorganiza governo para quarto mandato, com peso maior do nordeste", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 227199, "titulo": "Lula ganha nova chance de caminhar rumo ao campo hegemônico da sociedade", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-do-bombig/lula-ganha-nova-chance-de-caminhar-rumo-ao-campo-hegemonico-da-sociedade", "fonte_id": "jota", "data_pub": "2026-10-26T15:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente e o Partido dos Trabalhadores precisam aproximar-se dos evangélicos, do setor agrícola e dos brasileiros que buscam maior segurança para prosperar.", "titulo_pt": "Lula ganha nova chance de se aproximar dos evangélicos, do agro e dos brasileiros em busca de segurança", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 226892, "titulo": "Mesmo após eleição, Goldman Sachs ainda vê oportunidades de investimento no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/mesmo-apos-eleicao-goldman-sachs-ainda-ve-oportunidades-de-investimento-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-26T15:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após as eleições presidenciais, o Goldman Sachs ainda identifica oportunidades de investimento no Brasil, mesmo prevendo que o presidente Lula não fará mudanças significativas nas contas públicas. O relatório destaca a posição estratégica do país no cenário internacional.", "titulo_pt": "Mesmo após eleição, Goldman Sachs enxerga oportunidades de investimento no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 227200, "titulo": "Em virada histórica, Lula registrou crescimento de votação em todos os estados", "url": "https://www.jota.info/eleicoes/eleicoes-2026/em-virada-historica-lula-registrou-crescimento-de-votacao-em-todos-os-estados", "fonte_id": "jota", "data_pub": "2026-10-26T14:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente reeleito ampliou sua votação em todos os estados do país, recebendo 74% dos votos adicionais entre o primeiro e o segundo turno.", "titulo_pt": "Em virada histórica, Lula registrou crescimento de votação em todos os estados", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 226850, "titulo": "SBT mantém linha pró-governo e faz editorial para apoiar Lula: 'Lado do povo'", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/10/sbt-mantem-linha-pro-governo-e-faz-editorial-para-apoiar-lula-lado-do-povo.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-26T14:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O SBT publicou um editorial em apoio à reeleição de Lula e declarou que irá apoiar o governo federal nos próximos quatro anos, após a confirmação pelo TSE. A emissora manteve sua linha pró-governo.", "titulo_pt": "SBT mantém apoio ao governo e editorializa para Lula", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 227201, "titulo": "Reajuste da tabela do Simples deve vir acompanhado de outras medidas, defende ministro", "url": "https://www.jota.info/coberturas-especiais/pulso-da-reforma/reajuste-da-tabela-do-simples-deve-vir-acompanhado-de-outras-medidas-defende-ministro", "fonte_id": "jota", "data_pub": "2026-10-26T14:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Empreendedorismo afirmou que o governo busca intensificar as negociações com o Congresso para encontrar uma solução fiscal equilibrada. O reajuste da tabela do Simples Nacional deve vir acompanhado de outras medidas, segundo a defesa do ministro.", "titulo_pt": "Reajuste da tabela do Simples deve vir acompanhado de outras medidas, defende ministro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 227202, "titulo": "JOTA Principal | Lula conquista virada histórica, promete ‘melhor mandato’ e tem desafios à frente", "url": "https://www.jota.info/newsletters/jota-principal/lula-conquista-virada-historica-desafios-a-frente", "fonte_id": "jota", "data_pub": "2026-10-26T14:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula venceu nas eleições com uma margem significativa de 4,4 milhões de votos em relação ao candidato Flávio Bolsonaro.", "titulo_pt": "Lula conquista virada histórica, promete ‘melhor mandato’ e tem desafios à frente", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 227016, "titulo": "PSD, PSDB, MDB, Republicanos e União reconhecem vitória de Lula", "url": "https://exame.com/brasil/psd-psdb-mdb-republicanos-e-uniao-reconhecem-vitoria-de-lula/", "fonte_id": "exame", "data_pub": "2026-10-26T14:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Até o momento, sete partidos não se pronunciaram sobre a reeleição de Lula. Os partidos PSD, PSDB, MDB, Republicanos e União já reconheceram a vitória do petista. Solidariedade, Avante, Mobiliza, Agir, Democracia Cristã, Missão, Democrata e PRTB ainda não se manifestaram publicamente.", "titulo_pt": "PSD, PSDB, MDB, Republicanos e União reconhecem vitória de Lula", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 227203, "titulo": "EDITORIAL: Flávio Bolsonaro deve honrar a República e aceitar o resultado das urnas", "url": "https://www.jota.info/editorial/editorial-flavio-bolsonaro-deve-honrar-a-republica-e-aceitar-o-resultado-das-urnas", "fonte_id": "jota", "data_pub": "2026-10-26T14:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro solicitou a prorrogação da votação em cinco estados. Este pedido demonstra que estender o horário de votação para permitir que mais eleitores possam votar é uma prática dentro das regras eleitorais.", "titulo_pt": "EDITORIAL: flávio Bolsonaro deve honrar a República e aceitar o resultado das urnas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 227414, "titulo": "Pope Leo XIV confirms Latin America trip after recovering from surgery", "url": "https://www.euronews.com/2026/10/26/pope-leo-xiv-confirms-latin-america-trip-after-recovering-from-surgery", "fonte_id": "euronews", "data_pub": "2026-10-26T17:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Vaticano informa que o Papa está se recuperando bem após cirurgia e confirmou a viagem à América do Sul, programada para os dias 6 a 17 de novembro, incluindo Uruguai, Argentina e Peru. Não há complicações médicas que possam impedir o percurso.", "titulo_pt": "Papa Leo XIV confirma viagem à américa do sul após recuperação de cirurgia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 227790, "titulo": "Quatro momentos em que atuação do presidente do TS al Times", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 227579, "titulo": "Musk says US$40bn chips debt closed; talks continue", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/27/2003866661", "fonte_id": "taipei_times", "data_pub": "2026-10-27T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O empresário Elon Musk disse que a dívida de US$40 bilhões com chips foi quitada; as negociações continuam.", "titulo_pt": "Musk anuncia dívida de US$40 bi com chips quitada; negociações em andamento", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 227156, "titulo": "Estudio asegura que el cibercrimen ya es la tercera economía más grande del planeta", "url": "https://www.latercera.com/mundo/noticia/estudio-asegura-que-el-cibercrimen-ya-es-la-tercera-economia-mas-grande-del-planeta/", "fonte_id": "la_tercera", "data_pub": "2026-10-26T17:53:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A companhia de cibersegurança Cybertrust projetou que, até 2030, o cibercrime movimentará cerca de 28 trilhões de dólares globalmente. Este crime virtual seria a terceira economia mais grande do planeta.", "titulo_pt": "Estudo afirma que o cibercrime já é a terceira economia mais grande do planeta", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 227090, "titulo": "Soja, café e açúcar caem nas bolsas globais com alta do dólar após eleição no Brasil", "url": "https://www.infomoney.com.br/mercados/soja-cafe-e-acucar-caem-nas-bolsas-globais-com-alta-do-dolar-apos-eleicao-no-brasil/", "fonte_id": "infomoney", "data_pub": "2026-10-26T17:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os preços das commodities como soja, café e açúcar caíram nas bolsas globais após a eleição no Brasil, devido à alta do dólar. Operadores disseram que a reviravolta foi particularmente negativa para os futuros da soja dos EUA, que concorrem com o Brasil no mercado.", "titulo_pt": "Soja, café e açúcar caem nas bolsas globais com alta do dólar após eleição no Brasil", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 227141, "titulo": "Dólar hoy y dólar blue, EN VIVO: a cuánto cotiza el oficial y cuál es el precio del paralelo este lunes 26 de octubre, minuto a minuto", "url": "https://www.lanacion.com.ar/economia/dolar/dolar-hoy-y-dolar-blue-en-vivo-a-cuanto-cotiza-el-oficial-y-cual-es-el-precio-del-paralelo-este-nid26102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-26T17:47:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O dólar oficial está cotado a R$ 1560 na venda pelo Banco Nación; o dólar blue está valendo R$ 1575. O texto também menciona o MEP e o CCL, mas não fornece detalhes específicos sobre essas moedas paralelas.", "titulo_pt": "Dólar hoje e dólar blue, em tempo real: a que preço o oficial e o paralelo nesta segunda-feira, 26 de outubro", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 227448, "titulo": "Lula’s surprise victory triggers worst rout in decades for Brazilian markets", "url": "https://www.ft.com/content/bffe028e-838d-4e74-b05e-62f6db4978db?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-26T17:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores estavam preparados para uma vitória do direitista Bolsonaro, que era visto como mais disposto a enfrentar o déficit orçamentário. A vitória surpreendente de Lula levou a uma das maiores quedas dos mercados brasileiros em décadas.", "titulo_pt": "Vitória surpresa de lula causa maior retração dos mercados brasileiros em décadas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 226882, "titulo": "Anthropic divulga pedido de IPO com crescimento explosivo, riscos e custos astronômicos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/anthropic-divulga-pedido-de-ipo-com-crescimento-explosivo-riscos-e-custos-astronomicos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-26T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic divulgou seu pedido de IPO, revelando perdas significativas e um crescimento rápido da receita. A empresa almeja criar sistemas de inteligência artificial que possam transformar a economia global, apesar dos altos custos de desenvolvimento.", "titulo_pt": "Anthropic revela pedido de IPO com crescimento rápido e altos custos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 226883, "titulo": "BC define regra para Pix no crédito e cria alertas contra endividamento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/bc-define-regra-para-pix-no-credito-e-cria-alertas-contra-endividamento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-26T16:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central aprovou três resoluções que visam aumentar a transparência e reduzir o endividamento. Agora, o banco só poderá oferecer crédito no ambiente do Pix com autorização prévia do cliente.", "titulo_pt": "BC define regras para Pix no crédito e cria alertas contra endividamento", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 226884, "titulo": "ANP reavalia manter bomba branca em postos bandeirados", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/anp-reavalia-manter-bomba-branca-em-postos-bandeirados.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-26T16:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ANP está reavaliando a liberação da instalação da bomba branca em postos de combustíveis bandeirados. O assunto está sendo estudado pelas áreas técnicas do órgão, por determinação de sua diretoria.", "titulo_pt": "ANP rea r a morte de animais nas estradas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 227146, "titulo": "Claude Duet: cómo funciona el agente de IA de Anthropic, quiénes pueden probarlo y qué tareas hace sin que se las pidan", "url": "https://www.lanacion.com.ar/tecnologia/claude-duet-como-funciona-el-agente-de-ia-de-anthropic-quienes-pueden-probarlo-y-que-tareas-hace-sin-nid22102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-26T17:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma das principais funções do Claude Duet, um agente de IA desenvolvido pela Anthropic, é executar tarefas sem instruções do usuário. O sistema pode realizar várias tarefas sem ser solicitado explícitamente a fazê-las.", "titulo_pt": "Claude Duet: como funciona o agente de IA da Anthropic, quem pode testá-lo e quais tarefas ele executa sem ser solicitado", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 227623, "titulo": "The RealReal won’t let AI agents hog designer clothing", "url": "https://www.theverge.com/news/1018713/meta-muse-agentic-shopping-ai-the-realreal", "fonte_id": "the_verge", "data_pub": "2026-10-26T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A The RealReal, uma plataforma de varejo de moda de luxo usado, atualizou seu sistema de defesa contra agentes de inteligência artificial, dificultando o processo de compra por parte desses agentes. Esta mudança ocorre após relatos de que agentes de IA poderiam explorar o sistema de reserva de itens da empresa.", "titulo_pt": "The RealReal não permitirá que agentes de IA monopolizem roupas de designer", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 227041, "titulo": "A trajetória da Anthropic, de startup de IA a IPO que definiu o setor", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/a-trajetoria-da-anthropic-de-startup-de-ia-a-ipo-que-definiu-o-setor/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-26T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic, uma empresa de inteligência artificial, protocolou seu pedido para uma oferta pública inicial de ações (IPO), o que indica que a empresa está prestes a entrar na bolsa de valores.", "titulo_pt": "Trajetória da Anthropic, de startup de IA a IPO que definiu o setor", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 227626, "titulo": "Five weird details from Anthropic’s IPO filing", "url": "https://www.theverge.com/ai-artificial-intelligence/1018738/anthropic-ipo-s1-filing-weird-details", "fonte_id": "the_verge", "data_pub": "2026-10-26T17:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anthropic finalmente apresentou seu prospecto S-1 à SEC, um documento projetado para fornecer informações aos investidores sobre a empresa, incluindo os salários dos executivos, planos de gastos com os bilhões de dólares arrecadados na oferta inicial de ações e os riscos que podem impedir a realização de suas ambições. O documento possui mais de 300 páginas.", "titulo_pt": "Cinco detalhes estranhos do prospecto de IPO da Anthropic", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 227614, "titulo": "USFK chief highlights importance of logistics solutions for sustainment capabilities", "url": "https://en.yna.co.kr/view/AEN20261027000200315", "fonte_id": "yonhap_news", "data_pub": "2026-10-26T16:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O comandante das Forças Armadas dos Estados Unidos na Coreia do Sul, General Xavier, enfatizou a importância de soluções logísticas para as capacidades de sustentação.", "titulo_pt": "Comandante das forças armadas dos EUA na Coreia do sul destaca a importância de soluções logísticas para capacidades de sustentação", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 227629, "titulo": "Instagram chases YouTube with a push for longer, widescreen videos", "url": "https://www.theverge.com/tech/1018688/instagram-longform-widescreen-video-features-youtube", "fonte_id": "the_verge", "data_pub": "2026-10-26T16:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Instagram está lançando um forte esforço para videos longos em formato horizontal, chamado de 'Features'. Adam Mosseri, o chefe do Instagram, expressou preocupações anteriores sobre o lançamento de conteúdo de longa duração no plataforma.", "titulo_pt": "Instagram busca YouTube com foco em vídeos longos e panorâmicos", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 227439, "titulo": "Economic policy vets see risks in AI overreliance", "url": "https://www.axios.com/2026/10/26/ai-economists-furman-policy", "fonte_id": "axios", "data_pub": "2026-10-26T16:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Economistas que trabalham com políticas econômicas veem riscos em uma possível excessiva dependência de ferramentas de inteligência artificial. Jason Furman, economista da Harvard, afirmou que, se retornasse ao cargo de chefe do Conselho de Conselheiros Econômicos da Casa Branca, usaria ferramentas de IA para a maioria do trabalho analítico diário, o que gerou discussão online.", "titulo_pt": "Economistas veem riscos em excessiva dependência de IA na política econômica", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 227641, "titulo": "The Anthropic S-1 Filing Is Also an AI Doomsday Primer", "url": "https://www.wired.com/story/the-anthropic-ipo-is-also-a-doomsday-primer/", "fonte_id": "wired", "data_pub": "2026-10-26T16:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Anthropic acredita que 'fechar o loop' é o melhor caminho para o êxito da IA, mas também pode representar ameaças 'existenciais' para a humanidade.", "titulo_pt": "A declaração S-1 da Anthropic também serve como um guia sobre a possível destruição pela IA", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 227630, "titulo": "Microsoft offers buyouts to 60,000 employees", "url": "https://www.theverge.com/tech/1018666/microsoft-expands-buyouts-60000-employees-eligible", "fonte_id": "the_verge", "data_pub": "2026-10-26T15:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microsoft está oferecendo demissões voluntárias a até 60.000 funcionários nos Estados Unidos, Reino Unido, Canadá e Índia. A empresa visa reduzir o quadro sem realizar demissões forçadas, oferecendo suporte financeiro e recursos de planejamento de carreira aos interessados.", "titulo_pt": "Microsoft oferece demissões voluntárias a até 60.000 funcionários", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 227434, "titulo": "Fanatics teams up with OpenAI for new AI-powered shopping suggestion feature", "url": "https://www.cnbc.com/2026/10/26/fanatics-openai-codex-sports-merchandise-shopping.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-26T15:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Fanatics está utilizando inteligência artificial para auxiliar os compradores a navegar por mais de 1,5 milhões de itens de merchandise esportivo, com uma funcionalidade chamada 'Shop the Look' que é alimentada pelo OpenAI Codex.", "titulo_pt": "Fanatics se associa ao OpenAI para nova funcionalidade de sugestão de compra baseada em ai", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 227791, "titulo": "Custos altos e resultados abaixo do esperado: empresas freiam uso da IA", "url": "https://www.dw.com/pt-br/custos-altos-e-resultados-abaixo-do-esperado-empresas-freiam-uso-da-ia/a-79731488?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-10-26T14:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas estão limitando o uso da inteligência artificial após investimentos bilionários, devido a resultados insatisfatórios, riscos de erros e preocupações com a perda de conhecimento dos funcionários.", "titulo_pt": "Custos altos e resultados abaixo do esperado: empresas reduzem uso da IA", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 227642, "titulo": "Anthropic’s IPO Prospectus Reveals What’s Under the Hood", "url": "https://www.wired.com/story/anthropic-ipo-filings-reveal-finances-risks-strategy/", "fonte_id": "wired", "data_pub": "2026-10-26T14:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Anthropic apresentou documentos em preparação para uma IPO (Oferta Pública Inicial) que oferece uma visão dos finanças da empresa, fatores de risco e perspectivas sobre o futuro da inteligência artificial.", "titulo_pt": "Prospétro da IPO da anthropic revela o que há por trás da empresa", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 227444, "titulo": "Anthropic begins countdown to IPO with prospectus filing", "url": "https://www.ft.com/content/f6ecfecd-d797-4d2c-b427-d333297949cb?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-26T14:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Anthropic apresentou um prospecto de 240.000 palavras, detalhando seu crescimento explosivo, suas perdas significativas e os riscos consideráveis.", "titulo_pt": "Anthropic inicia contagem regressiva para IPO com apresentação de prospecto", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 227014, "titulo": "De IA a cirurgias robóticas: os planos de Lula para as áreas de Ciência e Tecnologia", "url": "https://exame.com/ciencia/de-ia-a-cirurgias-roboticas-os-planos-de-lula-para-as-areas-de-ciencia-e-tecnologia/", "fonte_id": "exame", "data_pub": "2026-10-26T14:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O plano de Lula para as áreas de Ciência e Tecnologia inclui o desenvolvimento de um prontuário integrado, apoio ao diagnóstico e monitoramento de crimes ambientais por satélite.", "titulo_pt": "De IA a monitoramento de crimes ambientais: os planos de Lula para Ciência e Tecnologia", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 227651, "titulo": "Climate change exposes gaps in Europe's protected-area network", "url": "https://phys.org/news/2026-10-climate-exposes-gaps-europe-area.html", "fonte_id": "phys_org", "data_pub": "2026-10-26T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo, publicado na Conservation Letters, identifica áreas em Europa onde a estabilidade climática e as oportunidades de movimento coincidem, bem como onde existem gaps que podem comprometer a conservação. A proteção da vida selvagem está cada vez mais dependente das condições internas das áreas protegidas e das conexões entre elas à medida que o clima muda.", "titulo_pt": "Mudanças climáticas expõem brechas no sistema de áreas protegidas da Europa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 227697, "titulo": "Volcanoes lurk behind the scenes of human history", "url": "https://www.sciencenews.org/article/volcanoes-impact-human-history-climate", "fonte_id": "science_news", "data_pub": "2026-10-26T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vulcões têm influenciado o clima e a história ao causar períodos de frio após erupções, que podem levar a fome, doenças, revoltas e outros eventos.", "titulo_pt": "Vulcões escondem-se nas tramas da história humana", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 227652, "titulo": "Interfacial intelligence: A new way to design polymer brushes", "url": "https://phys.org/news/2026-10-interfacial-intelligence-polymer.html", "fonte_id": "phys_org", "data_pub": "2026-10-26T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Polímeros em escova são camadas densas de cadeias de polímeros que podem ser engenheirados para alterar como uma superfície interage com seu ambiente. Ao controlar as interações com água, íons, proteínas e outros materiais, eles podem reduzir a fricção, prevenir a aderência de materiais indesejados, melhorar a separação e suportar a funcionalidade de sensores e outros dispositivos.", "titulo_pt": "Inteligência superficial: uma nova maneira de projetar polímeros em escova", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 227735, "titulo": "Stuck for a Halloween outfit? Set phasers to stunning with the best Star Trek costumes", "url": "https://www.space.com/entertainment/space-toys-lego/stuck-for-a-halloween-outfit-set-phasers-to-stunning-with-the-best-star-trek-costumes", "fonte_id": "space_com", "data_pub": "2026-10-26T17:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Halloween está próximo, e há opções excelentes de fantasia de Star Trek disponíveis, desde as antigas séries até The Next Generation e Discovery. Estes trajes podem ser adquiridos ainda há tempo.", "titulo_pt": "Precisando de um traje para Halloween? Ajuste os phasers para impressionante com os melhores trajes de Star Trek", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 227653, "titulo": "Fractional calculus helps 1D model mimic correlations seen in 2D phase transitions", "url": "https://phys.org/news/2026-10-fractional-calculus-1d-mimic-2d.html", "fonte_id": "phys_org", "data_pub": "2026-10-26T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Acalmações de fase são fortemente limitadas pela dimensão espacial. Em sistemas unidimensionais convencionais com interações de alcance curto, as flutuações térmicas geralmente impedem que graus de liberdade contínuos mantenham ordem a distâncias longas.", "titulo_pt": "Cálculo fracionário auxilia modelo 1D a replicar correlações observadas em transições de fase 2D", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 227724, "titulo": "‘Oddball’ test lets us glimpse how monkeys see the world", "url": "https://www.newscientist.com/article/2595841-oddball-test-lets-us-glimpse-how-monkeys-see-the-world/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-10-26T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Macacos tendem a perder o foco em relação aos humanos, mas são menos confusos com imagens invertidas.", "titulo_pt": "Teste incomum nos mostra como macacos veem o mundo", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 227654, "titulo": "Clouds on a lava planet challenge what astronomers expected", "url": "https://phys.org/news/2026-10-clouds-lava-planet-astronomers.html", "fonte_id": "phys_org", "data_pub": "2026-10-26T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um planeta rochoso de lava que era considerado incapaz de ter uma atmosfera foi descoberto com uma atmosfera contendo camadas de nuvens de vapor de minerais silicáticos, similares aos compósitos que formam a quartzo e areia.", "titulo_pt": "Nuvens em um planeta de lava desafiam expectativas dos astrônomos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 227702, "titulo": "NASA Invites Media to Moon Landing Simulation Experience in California", "url": "https://www.nasa.gov/news-release/nasa-invites-media-to-moon-landing-simulation-experience-in-california/", "fonte_id": "nasa_news", "data_pub": "2026-10-26T17:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA convidou a mídia para visitar um novo simulador de pouso lunar na Ames Research Center, em California, nos dias 29 e 30 de outubro.", "titulo_pt": "NASA convida mídia para visita ao simulador de pouso lunar em California", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 226965, "titulo": "O neurocientista japonês que ensina a desamarrar aquela pessoa da sua mente", "url": "https://veja.abril.com.br/saude/o-neurocientista-japones-que-ensina-a-desamarrar-aquela-pessoa-da-sua-mente/", "fonte_id": "veja", "data_pub": "2026-10-26T17:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O neurocientista japonês explora os mecanismos do cérebro para ajudar a 'apagar' pensamentos e indivíduos tóxicos que afetam a saúde mental.", "titulo_pt": "O neurocientista japonês que ensina a desligar pensamentos e pessoas tóxicas da sua mente", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 227655, "titulo": "Emotional content can improve how people process conversations", "url": "https://phys.org/news/2026-10-emotional-content-people-conversations.html", "fonte_id": "phys_org", "data_pub": "2026-10-26T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores do University of Helsinki, liderados por Pyry Heikkinen, estudaram como o significado emocional afeta a forma como o cérebro humano prioriza informações durante conversas naturais em ambientes de festa de cochilos.", "titulo_pt": "Conteúdo emocional pode melhorar a forma como as pessoas processam conversas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 227656, "titulo": "Laser-blasted plasma shows how instabilities could heat the sun's corona", "url": "https://phys.org/news/2026-10-laser-blasted-plasma-instabilities-sun.html", "fonte_id": "phys_org", "data_pub": "2026-10-26T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A partir da superfície visível, o sol emite calor a uma temperatura relativamente baixa de 5.800 Kelvin. No entanto, na fina camada externa da atmosfera solar conhecida como corona, elétrons podem atingir temperaturas de milhões de graus, um fenômeno que astrônomos ainda não conseguiram explicar completamente.", "titulo_pt": "Plasma bombardado por laser revela instabilidades que podem aquecer a corona do sol", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 227736, "titulo": "Record breaker! Astronomers spot powerful cosmic explosion that lasted 27 days", "url": "https://www.space.com/science/astrophysics/record-breaker-astronomers-spot-powerful-cosmic-explosion-that-lasted-27-days", "fonte_id": "space_com", "data_pub": "2026-10-26T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos observaram uma notável explosão de raios gama que durou 27 dias, comparada a outras explosões do mesmo tipo como um verdadeiro Hulk.", "titulo_pt": "Recordista! Astrônomos identificam poderosa explosão cósmica que durou 27 dias", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 227657, "titulo": "World-famous or local legend? New study investigates global and local forms of collective memory and group identity", "url": "https://phys.org/news/2026-10-world-famous-local-legend-global.html", "fonte_id": "phys_org", "data_pub": "2026-10-26T16:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo investiga a diferença entre a memória coletiva global e local, usando Napoleão Bonaparte e Bernardo O'Higgins como exemplos. Enquanto Napoleão é conhecido mundialmente, O'Higgins é menos reconhecido fora do Chile.", "titulo_pt": "Famoso mundial ou lenda local? Novo estudo examina memórias coletivas globais e locais e identidades de grupo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 227658, "titulo": "Lizard tail preserved in amber sheds light on a 100-million-year-old defense mechanism", "url": "https://phys.org/news/2026-10-lizard-tail-amber-million-year.html", "fonte_id": "phys_org", "data_pub": "2026-10-26T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um lagarto que solta o cauda enquanto foge de um predador é uma cena familiar para muitos. Entender quando essa estratégia de defesa surgiu nos lagartos é um desafio, pois é difícil rastrear a origem deste mecanismo extraordinário.", "titulo_pt": "Cauda de lagarto preservada em âmbar ilumina defesa de 100 milhões de anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 227676, "titulo": "STAT+: House lawmaker probes PBMs for ‘punitive’ audits of independent pharmacies", "url": "https://www.statnews.com/pharmalot/2026/10/26/lawmaker-probes-pbms-for-punitive-audits-independent-pharmacies/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-26T16:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um parlamentar da Câmara está investigando se as três maiores empresas de gerenciamento de benefícios (PBMs) realizaram auditorias retaliatórias contra farmácias independentes.", "titulo_pt": "Deputado investiga PBMs por ‘auditores retaliatórios’ contra farmácias independentes", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 227677, "titulo": "STAT+: GSK sees its return to cancer start to pay off", "url": "https://www.statnews.com/2026/10/26/gsk-cancer-esmo-adcs-jemperli/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-26T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A GSK não tinha presença em oncologia há uma década. A empresa está prestes a obter aprovação para seu sexto medicamento contra o câncer.", "titulo_pt": "GSK vê retorno para o câncer começar a render resultados", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 227721, "titulo": "Paralelo Transversal organises Chilean house under cantilever roof", "url": "https://www.dezeen.com/2026/10/26/paralelo-transversal-casa-ensenada-chile/", "fonte_id": "dezeen", "data_pub": "2026-10-26T17:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estúdio chileno Paralelo Transversal projetou uma casa retangular com um telhado em forma de sino e uma varanda que se projeta sobre um vally em Puerto Varas, Chile. A casa, chamada Casa Ensenada, de 155 metros quadrados, foi orientada em torno de seu telhado e foi concluída em 2025 em um terreno de 1,2 acres.", "titulo_pt": "Paralelo Transversal projeta casa chilena sob telhado cantilever", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 226957, "titulo": "‘Povo unido jamais será vencido’, diz Mamdani após vitória de Lula", "url": "https://veja.abril.com.br/mundo/povo-unido-jamais-sera-vencido-diz-mamdani-apos-vitoria-de-lula/", "fonte_id": "veja", "data_pub": "2026-10-26T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O prefeito de Nova York destacou os feitos do brasileiro Lula para trabalhadores, enfatizando o fim da escala 6x1. Mamdani, após a vitória de Lula, afirmou que 'povo unido jamais será vencido'.", "titulo_pt": "‘Povo unido jamais será vencido’, diz Mamdani após vitória de Lula", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 227140, "titulo": "“Insultocracia”: intelectuales reflexionan sobre “la hoguera de Milei” y otros dichos presidenciales sobre la prensa", "url": "https://www.lanacion.com.ar/cultura/insultocracia-intelectuales-reflexionan-sobre-la-hoguera-de-milei-y-otros-dichos-presidenciales-nid26102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-26T17:48:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Intelectuais discutiram as declarações de Javier Milei sobre a mídia durante um evento na Fundação Faro; o Centro PEN da Argentina emitiu um comunicado denunciando essas afirmações.", "titulo_pt": "Insultocracia: intelectuais refletem sobre as 'hogueras' de Milei e outros comentários presidenciais sobre a mídia", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 227142, "titulo": "Sobrevivió a siete rayos, lo llamaron “el pararrayos humano” y tuvo un trágico final: “Entre una multitud siempre me alcanza a mí”", "url": "https://www.lanacion.com.ar/lifestyle/sobrevivio-a-siete-rayos-lo-llamaron-el-pararrayos-humano-y-tuvo-un-tragico-final-entre-una-multitud-nid26102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-26T17:44:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Roy Sullivan, um guarda florestal nos Estados Unidos, foi atingido por sete Raios entre 1942 e 1977. Ele sobreviveu a esses incidentes, ganhando o apelido de 'o homem-escudo de raios'.", "titulo_pt": "Sobreviveu a sete raios, foi chamado de 'o homem-escudo de raios' e teve um trágico fim", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 226845, "titulo": "Globo faz proposta ao Santa Cruz e tenta aumentar número de jogos da Série B em 2027", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/10/globo-faz-proposta-ao-santa-cruz-e-tenta-aumentar-numero-de-jogos-da-serie-b-em-2027.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-26T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Santa Cruz recebeu uma proposta da Globo para vender seus jogos como mandante na Série B do Campeonato Brasileiro de 2027. A emissora tenta aumentar o número de partidas exibidas.", "titulo_pt": "Globo faz proposta ao Santa Cruz para aumentar número de jogos da Série B", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 226846, "titulo": "Espaço grátis tem aulas, jogos e degustação de comida coreana em SP", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/blogs/k-cultura/2026/10/espaco-gratis-tem-aulas-jogos-e-degustacao-de-comida-coreana-em-sp.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-26T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O espaço gratuito Universo K-food, que oferece aulas, jogos e degustação de comida coreana, está disponível até o fim de semana no shopping Eldorado, em São Paulo. O evento ocorre até o dia 31 de outubro.", "titulo_pt": "Espaço grátis tem aulas, jogos e degustação de comida coreana em SP", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 227581, "titulo": "Walter Koenig, Star Trek’s original Pavel Chekov, dies at 90", "url": "https://www.scmp.com/news/world/uni alumnos-del-pais-necesitamos-cabezas-bien-hechas/", "fonte_id": "la_tercera", "data_pub": "2026-10-26T16:42:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Julio Castro, reitor da Universidade Andrés Bello, que possui o maior número de alunos no país, afirma que o que o país precisa são de estudantes com habilidades adaptáveis para lidar com novas oportunidades, tecnologias e ambientes em constante mudança, em vez de apenas conhecimentos amplos.", "titulo_pt": "Filósofo e reitor da maior universidade do país: 'nós precisamos de cabeças bem feitas'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 226847, "titulo": "Danni Suzuki volta à Globo após seis anos para estrelar série policial erótica", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/10/danni-suzuki-volta-a-globo-apos-seis-anos-para-estrelar-serie-policial-erotica.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-26T16:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Danni Suzuki retorna à Globo após seis anos para protagonizar a série policial erótica 'Instinto Proibido', que será lançada no Globoplay em julho de 2027.", "titulo_pt": "Danni Suzuki volta à Globo após seis anos para estrelar série policial erótica", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 227712, "titulo": "LS Lowry review – matchstick men, or the broken denizens of a smog-filled hellscape?", "url": "https://www.theguardian.com/artanddesign/2026/oct/26/ls-lowry-review-mk-gallery-milton-keynes", "fonte_id": "guardian_culture", "data_pub": "2026-10-26T16:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A exposição de LS Lowry no MK Gallery de Milton Keynes apresenta suas pinturas que retratam a Inglaterra do Norte com seus terrenos sujos, barracões em ruínas e céus cheios de chaminés, criando uma visão de uma dystopia que sufoca o espírito. A exposição oferece uma visão alternativa da história britânica, focando na era industrial.", "titulo_pt": "Revisão de LS Lowry – homens de palhaço de madeira, ou moradores quebrados de um inferno ensurdecedor de fumaça?", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 226848, "titulo": "Como Zara Larsson foi de figura coadjuvante do pop a grande estrela em um ano", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/como-zara-larsson-foi-de-figura-coadjuvante-do-pop-a-grande-estrela-em-um-ano.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-26T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Desde os dez anos, Zara Larsson, nascida em Estocolmo, passou por todos os níveis e estilos de uma aspirante ao estrelato pop desde a vitória no reality show de competição Sweden's Got Talent. Ela se transformou em uma grande estrela em um ano.", "titulo_pt": "Como Zara Larsson evoluiu de aspirante a estrela do pop a grande estrela em um ano", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 227584, "titulo": "Hong Kong’s South China Morning Post shines at Asian Media Awards with 6 prizes", "url": "https://www.scmp.com/news/hong-kong/society/article/3372209/hong-kongs-south-china-morning-post-shines-asian-media-awards-6-prizes", "fonte_id": "scmp", "data_pub": "2026-10-26T15:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A South China Morning Post venceu seis prêmios no Asian Media Awards 2026 da World Association of News Publishers, incluindo todos os prêmios na categoria de melhor fotografia jornalística. O periódico ganhou cinco prêmios de ouro e um de prata em diferentes categorias.", "titulo_pt": "South China Morning Post conquista seis prêmios no Asian Media Awards", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 226849, "titulo": "Quase 25% dos americanos
