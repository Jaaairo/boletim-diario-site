dente Xi Jinping ordenando esforços de busca e resgate. A Coreia do Sul e os Estados Unidos planejam se reunir para discutir questões internacionais, incluindo a questão dos refugiados coreanos desaparecidos no Nepal. Além disso, um encontro entre o presidente dos Estados Unidos, Donald Trump, e o líder norte-coreano, Kim Jong-un, pode ocorrer durante a cúpula Apec em Gyeongju, Coreia do Sul, em novembro, com a China expressando disposição para auxiliar na organização desse encontro.\n\nA tensão geopolítica global continua a se intensificar com ataques e confrontos em diversos pontos do mundo. Em primeiro lugar, a Ucrânia enfrenta ataques de drones russos que resultaram em pelo menos nove mortes, atingindo instalações logísticas. O presidente ucraniano, cujo avião quase foi atingido por um drone, reforçou a ameaça russa. Em seguida, o Irã e os Estados Unidos continuam em um conflito prolongado, com o presidente americano, Joe Biden, advertindo o Irã para que não se aventure em atividades relacionadas a um suposto site nuclear em Pickaxe Mountain. O Irã, por sua vez, ameaça uma escalada de guerra após as eleições legislativas americanas. Além disso, a Coreia do Norte continua a provocar preocupações, com a Coreia do Sul e os Estados Unidos em negociações sobre respostas conjuntas ao seu programa nuclear. Finalmente, a China desempenhou um papel crucial em manter a estabilidade do mercado de petróleo, armazenando petróleo e reduzindo compras desde o início da guerra no Irã, evitando uma crise energética mais grave.", "economia": "Os preços do petróleo permanecem altos devido às preocupações com tensões no Oriente Médio, pressionando os custos globais e afetando economias como a sul-coreana, que viu seu câmbio depreciar. A Petrobras aumentou o preço da gasolina para as distribuidoras, mas não para os consumidores, devido a medidas governamentais. O Banco do Japão manterá aumentos na taxa de juros para controlar a inflação, enquanto a BCE provavelmente elevará as taxas de juro devido à pressão inflacionária e aos custos dos empréstimos governamentais. A China estabeleceu regras claras sobre prazos de pagamento nas cadeias de fornecimento de automóveis, enquanto a Gem Terminal registrou um crescimento de 8,8% nas receitas consolidadas. A regulação do transporte de gás e do reconhecimento internacional de sentenças arbitrais são outros temas relevantes, com a Enflame listada na Bolsa de Shanghai e a China impulsionando a computação doméstica. A regulação do mercado de criptomoedas também avança, com a Coinbase afirmando que a regulação pode avançar independentemente do resultado da Clarity Act no Senado americano. A exportação brasileira para os Estados Unidos diminuiu em 9,7% em volume, mas aumentou em valor, refletindo a complexidade dos mercados globais.", "tecnologia": "A discussão em torno da inteligência artificial (IA) está em alta, com diversos eventos e desenvolvimentos importantes. Primeiramente, a morte de uma adolescente levantou debates sobre a possibilidade de proibir o estupro virtual em conteúdo adulto, uma prática que ganhou popularidade entre jovens, apesar dos riscos à saúde. Em seguida, a empresa DeepSeek lançou a versão V4.1 de seu modelo Flash, que superou seu modelo anterior em testes de cibersegurança e codificação, reduzindo custos de inferência e aumentando a velocidade. O Twitter, agora controlado por Elon Musk, se tornou um centro de discussão em tempo real para entusiastas de IA na Silicon Valley, refletindo a tensão entre a utilidade limitada e o perigo potencial da IA. Além disso, a preocupação com a segurança da IA cresceu, com relatos de quatro incidentes de hacking na Anthropic e a renúncia de um pesquisador expressando preocupações sobre a segurança. O debate sobre a possibilidade de extinção humana causada por IA ganhou força, com pesquisadores calculando uma probabilidade alarmante de 10% a 20% de uma catástrofe causada por IA, levando a um pânico online e uma corrida para encontrar soluções. Estes eventos refletem a complexidade e a importância da IA em nossa sociedade contemporânea.", "ciencia": "Em agosto, foi registrado a temperatura mais alta já medida na Terra, conforme informado pelo serviço climático europeu Copernicus. Este aumento foi causado pela combinação do efeito da mudança climática induzida pelo homem e do El Niño intensificado. O calor global tem levantado preocupações sobre um aumento de 20% a 30% das emissões de gases de efeito estufa devido ao aquecimento, que são emitidos por fontes naturais devido às temperaturas crescentes. Para mitigar os efeitos do aquecimento global, a Tailândia está desenvolvendo uma ideia inovadora: induzir chuvas intensas sobre o oceano com o objetivo de reduzir as intensas precipitações na terra. Além disso, a comunidade científica está preocupada com a densidade de raposas-ruivas em Seattle, que é 9 vezes maior do que nas áreas selvagens do estado de Washington, devido à adaptação das raposas-ruivas à vida urbana. Quatro cientistas japoneses receberam o prêmio Lasker: um pesquisou sobre a química do cérebro que regula o sono, enquanto um trio descobriu um tratamento com anticorpos para pacientes com hemofilia A.", "cultura": "O Fundo Rabkin anunciou os vencedores de seus prêmios de jornalismo sobre arte para 2026, com oito críticos de arte contemporâneos ganhando US$ 50.000 cada. Um destaque foi a série teen 'Two of Us', de 1994, que foi a primeira a exibir uma relação gay em programas para crianças no Reino Unido, antes de 'Byker Grove' em 1994. John Christian Caldeira Weibull, que começou a desenhar aos cinco meses de idade, se tornou o artista mais jovem a receber um Guinness World Records no campo da pintura. O British Museum vendeu um recorde de 100.000 ingressos para a exposição do famoso painel de Bayeux, que retrata a Batalha de Hastings de 1066. Na cultura britânica, 'The Paper' retorna com novos episódios, liderados por Domhnall Gleeson e Sabrina Impacciatore, enquanto o espetáculo teatral 'John Major's Rise' será apresentado no National Theatre de Londres, retratando a ascensão de John Major ao poder.", "sociedade": "Várias situações sociais e educacionais chamam a atenção em diferentes regiões do mundo. Em primeiro lugar, uma operação resgatou 479 trabalhadores em condições semelhantes à escravidão em todo o país, com os empregadores devendo pagar R$ 3,49 milhões em verbas rescisórias. Em seguida, o Nepal utilizou drones para distribuir ajuda humanitária após as enchentes, que deixaram pelo menos 1.367 mortos e mais de 5.000 desaparecidos. No Brasil, a falta de experiência trava a carreira de 1 em cada 7 jovens, conforme dados do mercado, enquanto a falta de uma regra específica dificulta a aposentadoria de pessoas trans. Além disso, a Academia Nacional de Educação propôs uma reunião federal para discutir mudanças urgentes na educação argentina devido ao retrocesso nas práticas PISA. No Rio de Janeiro, uma jovem de 18 anos foi baleada na cabeça durante um primeiro encontro, e em São Sebastião, Distrito Federal, um homem tentou assassinar a namorada em razão de ciúmes de uma foto. Em Hong Kong, o número de suicídios entre menores de 15 anos aumentou em 2025, atingindo o nível mais alto dos últimos dez anos, com a atividade nas redes sociais tendo um forte impacto nas taxas de suicídio entre jovens.", "meio_ambiente": "O verão dos Estados Unidos foi o mais quente registrado em 132 anos, de acordo com o Departamento de Meteorologia dos EUA, com uma temperatura média de 23,6°C entre junho e agosto. No Chile, o Deserto do Atacama pode experimentar uma das maiores florações em duas décadas, com as primeiras flores já aparecendo. Em contraste, o Nepal enfrenta uma grave crise hídrica, com mais de 1.370 mortes e 5.100 desaparecidos devido às inundações na fronteira com a China. Além disso, a Indonésia está lidando com um aumento nos lançamentos de gases de efeito estufa devido a incêndios florestais que estão queimando as florestas e áreas de turfa nas ilhas de Borneu e Sumatra, com as leituras de dióxido de carbono atualmente as mais altas do mundo. No Brasil, os sulistas estão sob alerta de 'grande perigo' para chuvas e granizo, enquanto a Eucatex incorporou o risco climático em sua estratégia, investindo R$ 410 milhões em expansão florestal. Nos Estados Unidos, a Califórnia criou um novo conselho ambiental composto por jovens entre 14 e 20 anos que poderão participar das decisões da Agência de Proteção Ambiental. No Brasil, 1 em cada 5 carros vendidos já é elétrico ou híbrido, conforme dados da ABVE.", "direitos_humanos": "Sete pessoas foram detidas suspeitas de tráfico de pessoas para fins de extração de órgãos, conforme informado pelo Taipei Times. Na Flórida, EUA, a Interpol buscou informações sobre 163 crianças resgatadas em uma operação que libertou menores de situações de exploração. A mãe de David Elías Ojeda Vázquez, assassinado por motochorros, expressou desejo de que Deus mude os responsáveis pelo crime. Justine Wilson, ex-esposa de Elon Musk, relatou sofrer manipulação psicológica durante o casamento, conhecida como 'gaslighting'. Scarlett e Fabiana, que se casaram em um país onde o casamento entre pessoas do mesmo sexo não está legalizado, celebraram seu casamento após quatro anos de espera. A ministra do Gênero da Coreia do Sul considera apresentar uma denúncia criminal contra a Google por expor dados de vítimas de crimes sexuais digitais. O empresário francês Olivier Bouygues e cinco funcionários foram acusados de estabelecer um sistema de recompensas para a morte de espécies em perigo em uma propriedade rural. Em um relatório, 1.063 vítimas globais foram registradas em 2025 devido a armas de cluster, um dos maiores números de vítimas anuais. A polícia de Singapura questionou cinco pessoas por comentários racistas sobre inundações no Nepal e investimento na Singapore Airlines."}, "resumo_do_dia": {"politica_nacional": [{"id": 155810, "titulo": "PF deflagra operação sobre financiamento do filme 'Dark Horse'", "url": "https://g1.globo.com/politica/blog/andreia-sadi/post/2026/09/10/pf-operacao-dark-horse.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-10T09:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal realiza uma operação para investigar o financiamento do filme 'Dark Horse', que aborda a história do ex-presidente Jair Bolsonaro. Karina Gama, Mario Frias e outras 20 pessoas são alvos das buscas. Em maio, o Intercept Brasil revelou que o senador Flávio Bolsonaro teria pedido dinheiro para financiar o filme.", "titulo_pt": "PF deflagra operação sobre financiamento do filme 'Dark Horse'", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 155870, "titulo": "Político mais bem pago do mundo vai ter aumento salarial de R$ 5,6 milhões", "url": "https://www.metropoles.com/mundo/politico-mais-bem-pago-do-mundo-vai-ter-aumento-salarial-de-r-56-milhoes", "fonte_id": "metropoles", "data_pub": "2026-09-10T09:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro de Singapura passará a receber R$ 14,5 milhões por ano, após um aumento salarial. Ele informou que irá doar o valor adicionado.", "titulo_pt": "Político mais bem pago do mundo vai ganhar R$ 5,6 milhões a mais", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 155765, "titulo": "Entidades pedem que OCDE cobre do STF julgamento sobre provas da Odebrecht anuladas por Toffoli", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/entidades-pedem-que-ocde-cobre-do-stf-julgamento-sobre-provas-da-odebrecht-anuladas-por-toffoli.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Organizações de 21 países enviaram um ofício ao G20 e à OCDE pedindo que estes acompanhem o julgamento do STF sobre recursos contestando a decisão de Toffoli que anulou provas da Odebrecht.", "titulo_pt": "Organizações internacionais pedem que OCDE acompanhe julgamento STF sobre provas Odebrecht", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 156048, "titulo": "Crise no STF: estamos protegendo a pessoa", "url": "https://www.jota.info/opiniao-e-analise/artigos/crise-no-stf-estamos-protegendo-a-pessoa", "fonte_id": "jota", "data_pub": "2026-09-10T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto destaca que a proteção do cargo no Supremo Tribunal Federal (STF) não deve ser utilizada para beneficiar aqueles que ocupam essas posições. Isso sugere uma crítica à ideia de que a imunidade de cargo possa ser usada de forma abusiva.", "titulo_pt": "Crise no STF: proteção do cargo não deve beneficiar ocupantes", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 155766, "titulo": "Apoiadores de Lula se reúnem em Brasília, pedem mobilização e criticam Mendonça", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/apoiadores-de-lula-se-reunem-em-brasilia-pedem-mobilizacao-e-criticam-mendonca.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-10T08:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um grupo de apoiadores de Lula se reuniu em Brasília para discutir estratégias de mobilização para a campanha de reeleição. Eles criticaram o ministro da Justiça e Segurança Pública, Gustavo Mendonça.", "titulo_pt": "Apoiadores de Lula se reúnem em Brasília, criticam Mendonça", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 156049, "titulo": "O antissindicalismo mudou de endereço e tem o CEP da advocacia", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-antissindicalismo-mudou-de-endereco-e-tem-o-cep-da-advocacia", "fonte_id": "jota", "data_pub": "2026-09-10T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A acusação de 'litigância predatória' foi transferida do movimento sindical para o setor da advocacia trabalhista.", "titulo_pt": "O antissindicalismo mudou de alvo e agora atinge a advocacia trabalhista", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 155811, "titulo": "É #FAKE foto de relatório da PF dizendo não ver crime em conversas de Nikolas Ferreira com Vorcaro; imagem foi criada com IA", "url": "https://g1.globo.com/fato-ou-fake/noticia/2026/09/10/e-fake-foto-de-relatorio-da-pf-dizendo-nao-ver-crime-em-conversas-de-nikolas-ferreira-com-vorcaro-imagem-foi-criada-com-ia.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-10T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Circulam nas redes sociais imagens de um suposto relatório da Polícia Federal afirmando que não há indícios de crime nas conversas entre o deputado federal Nikolas Ferreira e o ex-banqueiro Daniel Vorcaro. Essas imagens são falsas e foram criadas com inteligência artificial.", "titulo_pt": "É #FAKE imagem supostamente mostrando relatório da PF sobre conversas entre Nikolas Ferreira e Vorcaro", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 155767, "titulo": "Filho de idosos influencers, microempresário mineiro vai de Zema contra polarização", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/filho-de-idosos-influencers-microempresario-mineiro-vai-de-zema-contra-polarizacao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-10T07:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um microempresário mineiro, filho de influenciadores idosos, está concorrendo contra o governador Zema em uma eleição local. A casa do candidato está decorada com várias perucas de diferentes cores e estilos.", "titulo_pt": "Filho de influenciadores idosos, microempresário mineiro vai de Zema contra polarização", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 155768, "titulo": "Moraes e Mendonça devem satisfações, e resposta para crise é no próprio STF, dizem ex-ministros da Justiça", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/moraes-e-mendonca-devem-satisfacoes-e-resposta-para-crise-e-no-proprio-stf-dizem-ex-ministros-da-justica.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-10T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ex-ministros da Justiça afirmam que os ministros do STF Alexandre de Moraes e André Mendonça devem satisfações sobre acusações de irregularidades. Os ex-ministros consideram que a solução para a crise está no próprio STF.", "titulo_pt": "Moraes e Mendonça devem satisfações, e solução para crise está no STF, dizem ex-ministros da Justiça", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 155769, "titulo": "TRE-RJ amplia regra do TSE contra grupo paramilitar e barra candidato de 'milícia de gravata'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/tre-rj-amplia-regra-do-tse-contra-grupo-paramilitar-e-barra-candidato-de-milicia-de-gravata.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-10T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TRE-RJ ampliou a regra do TSE para impedir a participação de grupos paramilitares nas eleições e introduziu a categoria de 'milícia de gravata' para restringir o registro de candidatos acusados de fraudes em licitações.", "titulo_pt": "TRE-RJ amplia regra contra grupos paramilitares e 'milícia de gravata' em eleições", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 155770, "titulo": "PT vê campanha de Lula em risco com crise no STF e convoca reunião de emergência com aliados", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/pt-ve-campanha-de-lula-em-risco-com-crise-no-stf-e-convoca-reuniao-de-emergencia-com-aliados.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-10T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A equipe do presidente Lula (PT) expressou preocupação com a crise no STF que poderia afetar a campanha petista. Pesquisas recentes indicaram avanços de Flávio Bolsonaro (PL) na corrida presidencial.", "titulo_pt": "PT tem campanha de Lula em risco com crise no STF e reúne aliados", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 155812, "titulo": "Mendonça, Moraes, Dino e Fachin: o STF em rota de colisão - O Assunto #1801", "url": "https://g1.globo.com/podcast/o-assunto/noticia/2026/09/10/mendonca-moraes-dino-e-fachin-o-stf-em-rota-de-colisao-o-assunto-1801.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-10T03:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na quarta-feira (9), o ministro Flávio Dino suspendeu a determinação de André Mendonça de afastar Andrei Rodrigues e Leandro Almada. Mendonça havia respondido a uma determinação de Alexandre de Moraes para investigá-lo, enquanto Moraes reagiu à divulgação do sigilo de um relatório sobre suas mensagens com o dono do Banco Master.", "titulo_pt": "Mendonça, Moraes, Dino e Fachin: O STF em rota de colisão - O Assunto #1801", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 155956, "titulo": "OPINIÃO. A eleição do tudo ou nada. Por que não podemos errar de novo", "url": "https://braziljournal.com/opiniao-a-eleicao-do-tudo-ou-nada-por-que-nao-podemos-errar-de-novo/", "fonte_id": "brazil_journal", "data_pub": "2026-09-10T03:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 6 de outubro de 2022, Armínio Fraga, Pedro Malan, Edmar Bacha e Persio Arida declararam que votariam em Lula no segundo turno, esperando uma condução responsável da economia. No entanto, Lula nunca prometeu ser fiscalmente responsável.", "titulo_pt": "OPINIÃO: a eleição do tudo ou nada. Por que não podemos errar de novo", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 155813, "titulo": "Crise do STF nas campanhas: Flávio Bolsonaro intensifica ataques a Moraes, e parte da campanha de Lula defende distância do ministro", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/10/crise-no-stf-campanhas-flavio-bolsonaro-e-lula.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-10T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A crise no Supremo Tribunal Federal (STF) influenciou as campanhas presidenciais, com Lula defendendo distância de Alexandre de Moraes e Flávio Bolsonaro intensificando os ataques ao ministro. A campanha de Flávio vê o prolongamento da crise como vantajoso eleitoralmente.", "titulo_pt": "Crise do STF nas campanhas: flávio Bolsonaro amplia ataques a Moraes, enquanto Lula defende distância", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 155814, "titulo": "Eleições 2026: veja quem são os candidatos a presidente, governador, senador e deputados em todo o Brasil", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/10/eleicoes-2026-veja-quem-sao-os-candidatos-a-presidente-governador-senador-e-deputados-em-todo-o-brasil.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-10T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O G1 publicou 126 reportagens sobre candidatos às Eleições 2026, com informações detalhadas sobre candidatos a presidente, governador, senador e deputados, organizadas por estado e cargo. Os dados foram extraídos do Tribunal Superior Eleitoral (TSE) e produzidos de forma automatizada, com supervisão de jornalistas.", "titulo_pt": "Eleições 2026: veja quem são os candidatos a presidente, governador, senador e deputados em todo o Brasil", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 155815, "titulo": "Eleições 2026: O que faz o presidente?", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/10/eleicoes-2026-o-que-faz-o-presidente.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-10T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente da República é o chefe do Poder Executivo federal, responsável por administrar a máquina pública federal e coordenar as políticas nacionais. Ele também comanda a administração federal, nomeia e exonera ministros de Estado e escolhe dirigentes de órgãos e empresas públicas.", "titulo_pt": "O que faz o presidente?", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 156176, "titulo": "Why so many incumbents lost primaries this year", "url": "https://www.politico.com/news/2026/09/10/why-so-many-incumbents-lost-primaries-this-year-01070117", "fonte_id": "politico", "data_pub": "2026-09-10T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ira anti-incumbentes se manifestou em primárias de ambos os partidos este ano, e a redelimitação eleitoral não ajudou.", "titulo_pt": "Por que tanta perda de candidatos reeleitos nas primárias deste ano?", "veiculo": "Politico", "pais": "EUA", "classe": "A"}, {"id": 156151, "titulo": "Russian drones kill at least nine in strikes targeting warehouses and ports in Ukraine – Europe live", "url": "https://www.theguardian.com/world/live/2026/sep/10/russian-drone-strike-ukraine-zelenskyy-macron-nato-rutte-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-09-10T09:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Drones russos causaram pelo menos nove mortes em ataques a instalações logísticas na Ucrânia. O secretário-geral da Otan, Jens Stoltenberg, enfatizou a ameaça russa e citou um incidente recente em que o avião do presidente ucraniano quase foi atingido por um drone.", "titulo_pt": "Drones russos causam pelo menos nove mortes em ataques na Ucrânia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 156216, "titulo": "Royal family rift after popular TV news presenter chosen to succeed Ugandan king", "url": "https://www.bbc.co.uk/news/articles/c8jdpj4ydm2o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-10T09:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A família real do Tooro afirma que o rei Oyo deixou uma herança oral nomeando seu jovem filho como herdeiro do reino. Há controvérsia na família real após o escolhimento de um popular apresentador de notícias para suceder o rei Ugandês.", "titulo_pt": "Família real em desacordo após apresentador de notícias escolhido para suceder rei ugandês", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 156413, "titulo": "Feltrinelli pubblica Pasolini, si parte dal febbraio 2027", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/10/feltrinelli-pubblica-pasolini-si-parte-dal-febbraio-2027_9ab8bcce-5e92-4ae1-aba7-ac7fe24869ac.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-10T09:51:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A editora Feltrinelli publicará as principais obras de Pier Paolo Pasolini a partir de fevereiro de 2027, incluindo todas as suas obras importantes e gerenciando os direitos internacionais delas.", "titulo_pt": "Feltrinelli publicará Pasolini a partir de fevereiro de 2027", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 156217, "titulo": "'Significant casualties' after fire on cargo ship in eastern China", "url": "https://www.bbc.co.uk/news/articles/cj4jyv7l92eo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-10T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Houve vítimas após um incêndio em um navio-carga na China oriental. O presidente Xi Jinping ordenou esforços urgentes de busca e resgate.", "titulo_pt": "Vítimas após incêndio em navio-carga na China oriental", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 156107, "titulo": "With Messaging That Mirrors Putin’s, Germany’s Far-Right Party Gains Ground", "url": "https://www.nytimes.com/2026/09/10/world/europe/germany-russia-afd-putin.html", "fonte_id": "nyt_world", "data_pub": "2026-09-10T09:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O partido Alternativa para a Alemanha, que adota posições semelhantes às do Kremlin, pode governar pela primeira vez em um estado alemão.", "titulo_pt": "Com mensagens semelhantes às de Putin, partido de extrema-direita alemão pode chegar ao governo", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 156414, "titulo": "I cieli Gb verso il ritorno alla normalità dopo il caos dei voli", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/10/i-cieli-gb-verso-il-ritorno-alla-normalita-dopo-il-caos-dei-voli_749ff2f6-387b-4c4f-a5c4-aedff5e3460b.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-10T09:44:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A discussão continua sobre os reembolsos para passageiros em risco durante o período de caos nos voos. O tema gera debates sobre a adequação e a justiça dos reembolsos oferecidos.", "titulo_pt": "Céus: debate sobre reembolsos para passageiros em risco após caos nos voos", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 156223, "titulo": "'People were trampling me': Philippine ferry fire survivor recalls narrow escape", "url": "https://www.bbc.co.uk/news/articles/c5y48mxm2zjo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-10T09:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um sobrevivente relatou à BBC o caos a bordo do ferry quando ele pegou fogo perto do popular destino turístico de Coron.", "titulo_pt": "Sobrevivente relata caos no ferry que pegou fogo perto de coron", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 156415, "titulo": "Borsa: Europa poco mossa in attesa della Bce, Milano +0,28%", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/10/borsa-europa-poco-mossa-in-attesa-della-bce-milano-028_9becc5b1-ee23-4ab6-9dbe-5340cfc632e8.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-10T09:35:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Europa manteve-se estável à espera da decisão da BCE. O gás e o petróleo estão contribuindo para a inflação. As ações do futuro nos Estados Unidos variam a duas taxas.", "titulo_pt": "Bolsa: Europa em espera pela Bce, com milan +0,28%", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 155973, "titulo": "'Pior crise desde a redemocratização': como imprensa internacional noticiou novo capítulo da guerra no STF", "url": "https://www.bbc.com/portuguese/articles/cde0rn1724xo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-10T09:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A agência Bloomberg relatou que Edson Fachin implementou as medidas mais assertivas até o momento na tentativa de recuperar o controle do STF.", "titulo_pt": "Pior crise desde a redemocratização: bloomberg destaca medidas agressivas de fachin no STF", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 155894, "titulo": "Houthis assumem controle de cidade estratégica no Iêmen", "url": "https://www.cnnbrasil.com.br/internacional/houthis-assumem-controle-de-cidade-estrategica-no-iemen/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-10T09:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os houthis assumiram o controle de uma cidade estratégica no Mar Vermelho, aproximando-se do estreito de Bab el-Mandeb, uma rota global importante para o comércio marítimo.", "titulo_pt": "Houthis assumem controle de cidade estratégica no Iêmen", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 156218, "titulo": "Apple's new boss starts with big gamble on £1,999 first folding iPhone", "url": "https://www.bbc.co.uk/news/articles/clyjd1jnd03o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-10T09:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apple apresentou durante um evento o primeiro grande design change para o iPhone em quase 20 anos, anunciando um novo modelo dobrável com preço de £1,999.", "titulo_pt": "Apple's novo chefe faz aposta alta com primeiro iphone dobrável por £1,999", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 156260, "titulo": "A un año de la muerte de Charlie Kirk, su movimiento apunta a JD Vance como sucesor político", "url": "https://elpais.com/us/2026-09-10/a-un-ano-de-la-muerte-de-charlie-kirk-su-movimiento-apunta-a-jd-vance-como-sucesor-politico.html", "fonte_id": "elpais_america", "data_pub": "2026-09-10T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O movimento de Charlie Kirk, chamado Turning Point USA, está se preparando para potenciais aspirações presidenciais e está amplamente previsto que apoie o atual vice-presidente. A morte de Charlie Kirk ocorreu há um ano.", "titulo_pt": "Um ano depois da morte de Charlie Kirk, seu movimento ponto de vértice agora se dirige para o vice-presidente", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 156261, "titulo": "“Nuestra frontera está cerrada”: la ofensiva de Trump para llegar a migración cero y los túneles que la desafían", "url": "https://elpais.com/us/migracion/2026-09-10/nuestra-frontera-esta-cerrada-la-ofensiva-de-trump-para-llegar-a-migracion-cero-y-los-tuneles-que-la-desafian.html", "fonte_id": "elpais_america", "data_pub": "2026-09-10T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em resposta à intensificação da vigilância na fronteira, alguns túneis subterrâneos agora se conectam aos sistemas de drenagem e alcantarilhado. A administração de Trump buscou alcançar a migração zero, desafiada por esse novo método de entrada ilegal.", "titulo_pt": "Nossa fronteira está fechada: a ofensiva de Trump para chegar à migração zero e os túneis que a desafiam", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 156263, "titulo": "Delsa Solórzano, opositora venezolana: “Quien tiene que informar sobre los acuerdos petroleros es Delcy Rodríguez, no Trump”", "url": "https://elpais.com/america/2026-09-10/delsa-solorzano-opositora-venezolana-quien-tiene-que-informar-sobre-los-acuerdos-petroleros-es-delcy-rodriguez-no-trump.html", "fonte_id": "elpais_america", "data_pub": "2026-09-10T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Delsa Solórzano, opositora venezuelana, alerta que acordos petroleros com os Estados Unidos precisarão ser revisados no futuro. Ela prevê um processo eleitoral em um prazo não superior a 10 meses.", "titulo_pt": "Delsa Solórzano, opositora venezuelana: 'quem deve informar sobre os acordos petroleros é Delcy Rodríguez, não Trump'", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 156265, "titulo": "Un mes del terremoto en Colombia: campañas de solidaridad, polémicas del Gobierno y la tarea titánica de la reconstrucción", "url": "https://elpais.com/america-colombia/2026-09-10/un-mes-del-terremoto-en-colombia-campanas-de-solidaridad-polemicas-del-gobierno-y-la-tarea-titanica-de-la-reconstruccion.html", "fonte_id": "elpais_america", "data_pub": "2026-09-10T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente Abelardo de la Espriella se centrou na recuperação de quatro regiões afetadas pelo terremoto, que custará mais de 30 bilhões de pesos e levará pelo menos cinco anos para ser concluída.", "titulo_pt": "Um mês após o terremoto em Colombia: campanhas de solidariedade, polêmicas do governo e a titânica tarefa de reconstrução", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 156292, "titulo": "Ryanair CEO says to brace for a 'significant uplift' in airfares as oil prices soar", "url": "https://www.cnbc.com/2026/09/10/ryanair-airfare-prices-oil-iran-war.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-10T09:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Ryanair alertou que os preços das passagens aéreas podem sofrer significativas elevações devido ao aumento dos custos do combustível de aviões, que está pressionando o setor aeronáutico.", "titulo_pt": "CEO da ryanair avisa sobre possível forte aumento nos preços das passagens aéreas", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 156298, "titulo": "Coinbase CEO says clearer U.S. crypto rules are coming — with or without Senate approval", "url": "https://www.cnbc.com/2026/09/10/coinbase-ceo-brian-armstrongto-us-regulatory-clarity-regardless-of-clarity-act-vote-crypto.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-10T09:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Coinbase, Brian Armstrong, afirma que a regulação do crypto nos Estados Unidos pode avançar independentemente do resultado da Clarity Act no Senado.", "titulo_pt": "CEO da coinbase diz que regras de criptoativos nos EUA virão com ou sem aprovação do clarity act no senado", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 156293, "titulo": "An ECB rate hike is ‘all but certain’ — but investors divided on what comes next", "url": "https://www.cnbc.com/2026/09/10/ecb-interest-rate-hike-lagarde-iran.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-10T09:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A elevação da taxa de juros pela BCE é considerada praticamente certa, devido à pressão inflacionária, aos efeitos da guerra entre Estados Unidos e Irã e aos custos de empréstimos governamentais em alta.", "titulo_pt": "Aumento da taxa de juros pela bce é 'praticamente certo' — mas investidores divididos sobre o que vem next", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 156296, "titulo": "Oil prices extend gains, Brent stays above $100 a barrel on Mideast worries", "url": "https://www.cnbc.com/2026/09/10/iran-us-oil-hormuz-supply-trump-military-brent-wti.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-10T09:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Preços do petróleo mantêm-se elevados devido às preocupações de que tensões crescentes no Oriente Médio possam agravar interrupções na oferta.", "titulo_pt": "Preços do petróleo mantêm-se acima de $100 por barril devido a preocupações com tensões no oriente médio", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 156050, "titulo": "Regulação do transporte de gás: por que não pagar duas vezes pelo mesmo gasoduto", "url": "https://www.jota.info/opiniao-e-analise/artigos/regulacao-do-transporte-de-gas-por-que-nao-pagar-duas-vezes-pelo-mesmo-gasoduto", "fonte_id": "jota", "data_pub": "2026-09-10T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O método do Capital Recuperado evita a duplicidade na remuneração e garante previsibilidade para novos gasodutos. Este método é proposto como uma solução para a regulação do transporte de gás.", "titulo_pt": "Regulação do transporte de gás: por que não pagar duas vezes pelo mesmo gasoduto", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 156052, "titulo": "O reconhecimento internacional de sentenças arbitrais, judiciais e acordos mediados", "url": "https://www.jota.info/opiniao-e-analise/colunas/elas-no-jota/o-reconhecimento-internacional-de-sentencas-arbitrais-judiciais-e-acordos-mediados", "fonte_id": "jota", "data_pub": "2026-09-10T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Convenções de Nova York, da Haia e de Singapura visam assegurar a validade internacional de decisões arbitrais, judiciais e acordos mediados. Essas convenções buscam facilitar o reconhecimento e a execução dessas decisões em diversos países.", "titulo_pt": "O reconhecimento internacional de decisões arbitrais, judiciais e acordos mediados", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 156535, "titulo": "S. Korea, African nations discuss business ties at KOAFEC meeting", "url": "https://en.yna.co.kr/view/AEN20260910007400320", "fonte_id": "yonhap_news", "data_pub": "2026-09-10T07:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Representantes de South Korea e países africanos discutiram possibilidades de fortalecer as relações comerciais durante uma reunião do Fórum Econômico Sul-Coreia/Africa (KOAFEC).", "titulo_pt": "Coreia do sul e países africanos discutem negócios em encontro do KOAFEC", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 156536, "titulo": "S. Korean won falls against U.S. dollar on surge in global oil prices", "url": "https://en.yna.co.kr/view/AEN20260910007300320", "fonte_id": "yonhap_news", "data_pub": "2026-09-10T07:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O won sul-coreano caiu em relação ao dólar americano devido ao aumento das preços globais do petróleo.", "titulo_pt": "Won sul-coreano cai contra dólar americano devido à elevação dos preços globais do petróleo", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 156515, "titulo": "Gem Terminal rides China plug rule shift for 8.8% sales growth", "url": "https://www.digitimes.com/news/a20260909PD229/growth-revenue-copper-2026-materials.html", "fonte_id": "digitimes", "data_pub": "2026-09-10T06:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Gem Terminal relatou um crescimento de 8,8% nas receitas consolidadas em agosto de 2026, impulsionadas pela proximidade do prazo para a conversão das novas exigências de isolamento para pinos de tomada no China (GB 1002-2024) e por encomendas mais fortes e uma base de clientes mais ampla para seu negócio de materiais de cobre especializados.", "titulo_pt": "Gem Terminal registra crescimento de 8,8% nas vendas em agosto de 2026, impulsionado por novas regras de plugues no China", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 156518, "titulo": "China's Nvidia rivals raise prices as HBM shortage bites", "url": "https://www.digitimes.com/news/a20260910VL215/hbm-nvidia-chipmakers-cost-ascend.html", "fonte_id": "digitimes", "data_pub": "2026-09-10T06:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fabricantes chineses que competem com a Nvidia estão aumentando drasticamente os preços dos aceleradores atuais e futuros devido à escassez e ao aumento de custos da memória de alta largura de banda (HBM), adicionando uma nova restrição de custo à busca pela computação doméstica na China.", "titulo_pt": "Concorrentes chineses da Nvidia aumentam preços devido à escassez de HBM", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 155927, "titulo": "Exportações aos EUA caem 9,7% no ano; veja os produtos mais afetados pelo tarifaço", "url": "https://exame.com/brasil/exportacoes-aos-eua-caem-97-no-ano-veja-os-produtos-mais-afetados-pelo-tarifaco/", "fonte_id": "exame", "data_pub": "2026-09-10T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As exportações brasileiras para os Estados Unidos diminuíram em volume em 9,7% em 2026, mas o valor das exportações aumentou em 12,1% comparado a 2025.", "titulo_pt": "Exportações para EUA caem 9,7% no ano; valor das exportações aumenta 12,1%", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 156522, "titulo": "Enflame to list on Septemper 11 as China's four major domestic GPU makers complete IPOs", "url": "https://www.digitimes.com/news/a20260910PD222/gpu-revenue-ai-chip-2026-2025.html", "fonte_id": "digitimes", "data_pub": "2026-09-10T05:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa chinesa de chips de inteligência artificial Enflame fará sua lista na Bolsa de Valores de Shanghai em 11 de setembro de 2026, se tornando a última das quatro principais empresas de GPU chinesas a realizar uma oferta inicial de ações (IPO).", "titulo_pt": "Enflame se lista em setembro como último dos quatro principais fabricantes de GPU chineses", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 156360, "titulo": "Must high bond yields crack stocks?", "url": "https://www.ft.com/content/bdde7148-eab2-4e13-abc8-9652c52257f4?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-10T05:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O desempenho das ações é influenciado primeiramente pelo estado do mercado, e depois pela análise matemática.", "titulo_pt": "Juros altos devem abalar os mercados de ações?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 155931, "titulo": "Formada na auditoria, head técnica amplia seu papel na liderança financeira da Webmotors", "url": "https://exame.com/carreira/formada-na-auditoria-head-tecnica-amplia-seu-papel-na-lideranca-financeira-da-webmotors/", "fonte_id": "exame", "data_pub": "2026-09-10T05:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A executiva, formada em auditoria, ampliou seu papel para além da área contábil e fiscal e atualmente lidera o FP&A. Ela também exerce a função de head técnica na empresa Webmotors.", "titulo_pt": "Formada em auditoria, executiva expande papel na liderança financeira da Webmotors", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 156405, "titulo": "BOJ will keep raising benchmark rate to cap price trend at 2%, board member says", "url": "https://www.japantimes.co.jp/business/2026/09/10/economy/boj-board-member-masu-speech-rate-hike/", "fonte_id": "japan_times", "data_pub": "2026-09-10T04:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um membro do conselho do Banco do Japão afirmou que a instituição manterá aumentos na taxa de juros de referência para manter a inflação controlada em 2%. Contratos de troca mostram uma probabilidade de cerca de 97% de um aumento da taxa de juros de 1% após uma reunião de dois dias que termina em 18 de setembro.", "titulo_pt": "BOJ manterá aumentos de taxa de juros para controlar inflação em 2%, diz membro do conselho", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 156524, "titulo": "China sets clear limits on payment terms to auto suppliers", "url": "https://www.digitimes.com/news/a20260910PD210/china-automakers-government-price-miit.html", "fonte_id": "digitimes", "data_pub": "2026-09-10T04:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo chinês estabeleceu regras claras sobre prazos de pagamento nas cadeias de fornecimento de automóveis, com a Ministraio de Indústria e Informação Tecnológica (MIIT) e a Administração Nacional de Regulação do Mercado (SAMR) recentemente emitindo uma notificação conjunta para padronizar os prazos de pagamento, os procedimentos de aceitação e os métodos de pagamento para os fornecedores de automóveis.", "titulo_pt": "China define limites claros para prazos de pagamento em cadeias de suprimentos de automóveis", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 156488, "titulo": "A Teen Girl’s Death Is Prompting Calls to Ban Choking in Porn", "url": "https://www.wired.com/story/a-teen-girls-death-is-prompting-calls-to-ban-choking/", "fonte_id": "wired", "data_pub": "2026-09-10T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A morte de uma adolescente está levantando debates sobre a possibilidade de proibir a prática de estrangulamento sexual. Embora apresente vários riscos à saúde, essa prática tem ganhado popularidade entre jovens, com alguns especialistas atribuindo a normalização da prática ao conteúdo adulto.", "titulo_pt": "Morte de adolescente estimula debate sobre proibição de estrangulamento sexual em pornografia", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 156204, "titulo": "We're living in an AI twilight zone", "url": "https://www.axios.com/2026/09/10/ai-anthropic-warning-humanity", "fonte_id": "axios", "data_pub": "2026-09-10T09:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Existem duas realidades aparentemente contrárias que coexistem simultaneamente: a maioria das pessoas encontra a IA apenas modestamente útil, como uma busca Google mais inteligente, enquanto muitas pessoas que a construem ou a usam de forma obsessiva temem que ela possa causar sérios danos ou destruir a humanidade. Essa tensão entre a utilidade limitada e o perigo potencial da IA está criando confusão e medo em diversos setores, incluindo políticos, laboratórios de IA e empresas.", "titulo_pt": "Estamos vivendo uma zona de penumbra da IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 156489, "titulo": "Want to Get Off Your Phone? Mina Kimes Suggests Having a Baby", "url": "https://www.wired.com/story/user-behavior-mina-kimes/", "fonte_id": "wired", "data_pub": "2026-09-10T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A jornalista da ESPN, Mina Kimes, sugere que ter filhos pode ser uma maneira eficaz de reduzir o uso de smartphones. Ela considera essa ideia como a mais útil para se desligar do telefone.", "titulo_pt": "Quer desligar do celular? Mina Kimes sugeriu ter filhos", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 156425, "titulo": "DeepSeek says new Flash AI model beats Kimi K3 on cyber, coding benchmarks", "url": "https://www.scmp.com/tech/big-tech/article/3367051/deepseek-says-new-flash-ai-model-beats-kimi-k3-cyber-coding-benchmarks?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-10T09:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A DeepSeek lançou a versão V4.1 do seu modelo Flash, que supostamente supera seu modelo anterior em benchmarks de cibersegurança e codificação, reduzindo custos de inferência e aumentando a velocidade. O novo modelo utiliza uma arquitetura 'Causal-Encoder-Decoder' e um design 'Mixture-of-Experts' em um framework com 552 bilhões de parâmetros.", "titulo_pt": "Deepseek anuncia novo modelo Flash v4.1 que supera benchmarks de Kimi K3 em cibersegurança e codificação", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 156205, "titulo": "Elon Musk's X is the AI community group chat", "url": "https://www.axios.com/2026/09/10/elon-musk-x-ai-community-group-chat", "fonte_id": "axios", "data_pub": "2026-09-10T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2023, Elon Musk adquiriu o Twitter, intitulando-o como um 'pátio digital comum' para a humanidade. Quatro anos depois, o Twitter se tornou um grupo de discussão em tempo real para entusiastas de IA na Silicon Valley. A plataforma continua relevante por ser um local onde as pessoas que fazem notícias sobre IA discutem, explicam e às vezes revelam informações antes que elas se espalhem por outras fontes de informações.", "titulo_pt": "Elon Musk's X é um grupo de chat de comunidade de IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 156490, "titulo": "A Satellite Falling Out of Orbit Embarks on Its Final Mission", "url": "https://www.wired.com/story/satellite-falling-out-of-space-embarks-on-final-mission/", "fonte_id": "wired", "data_pub": "2026-09-10T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Antes de reentrar na atmosfera terrestre, os telescópios a bordo da missão NASA Neil Gehrels Swift Observatory foram reiniciados para realizar suas últimas observações.", "titulo_pt": "Um satélite em fim de vida realiza sua última missão", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 156061, "titulo": "“Podría acabar con todos nosotros”: las respuestas al investigador de Anthropic que renunció por temor a la IA", "url": "https://www.latercera.com/tendencias/noticia/podria-acabar-con-todos-nosotros-las-respuestas-al-investigador-de-anthropic-que-renuncio-por-temor-a-la-ia/", "fonte_id": "la_tercera", "data_pub": "2026-09-10T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Jacob Coxon, ex-investigador de Anthropic e OpenAI, alertou sobre os riscos potenciais da IA para a humanidade e questionou a corrida por desenvolver modelos cada vez mais avançados. Dois colegas também expressaram preocupações semelhantes.", "titulo_pt": "Podia acabar com todos nós: as respostas do ex-investigador de Anthropic que se demitiu por temor à IA", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 155841, "titulo": "Seu filho usa IA para estudar? Veja o que você não pode deixar de saber", "url": "https://veja.abril.com.br/coluna/planeta-ia/seu-filho-usa-ia-para-estudar-veja-o-que-voce-nao-pode-deixar-de-saber/", "fonte_id": "veja", "data_pub": "2026-09-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O guia aborda dúvidas comuns dos pais sobre o uso de inteligência artificial no estudo dos filhos. Existem maneiras corretas de integrar essas tecnologias na rotina escolar.", "titulo_pt": "Seu filho usa IA para estudar? Confira as dúvidas mais frequentes dos pais", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 156207, "titulo": "Scoop: OpenAI faces GOP-led Senate investigation into Hugging Face breach", "url": "https://www.axios.com/2026/09/10/openai-hugging-face-senate-investigation-hawley", "fonte_id": "axios", "data_pub": "2026-09-10T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um subcomitê do Senado liderado por republicanos está investigando como a OpenAI gerenciou a brecha no Hugging Face em julho. A investigação ocorre em meio a crescente preocupação no Congresso americano sobre os perigos existenciais da inteligência artificial, após alertas públicos de pesquisadores da Anthropic e da OpenAI.", "titulo_pt": "Pipa: comitê do senado republicano investigará brecha no Hugging Face da openai", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 156448, "titulo": "God told them to sell crypto. Their investors lost everything.", "url": "https://www.technologyreview.com/2026/09/10/1143588/indxcoin-god-regalados-sell-crypto-investors-lost-everything/", "fonte_id": "mit_tech_review", "data_pub": "2026-09-10T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Eli Regalado alega ter recebido instruções divinas para vender criptomoedas, mas seus investidores perderam todo o dinheiro. Ele descreve a experiência como se fosse ter uma ideia que não é sua.", "titulo_pt": "Deus lhes ordenou vender criptomoedras. Eles perderam tudo para os investidores.", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 156491, "titulo": "Our Favorite GoPro 360 Camera Is Now 40 Percent Off", "url": "https://www.wired.com/story/gopro-max-2-deal-september-2026/", "fonte_id": "wired", "data_pub": "2026-09-10T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A GoPro Max 2 está com 40% de desconto em Amazon e outras lojas. Além disso, há outras ofertas interessantes de câmeras de ação disponíveis.", "titulo_pt": "Nossa câmera GoPro 360 favorita agora está com 40% de desconto", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 156449, "titulo": "Healthcare AI’s next test is integration", "url": "https://www.technologyreview.com/2026/09/10/1141421/healthcare-ais-next-test-is-integration/", "fonte_id": "mit_tech_review", "data_pub": "2026-09-10T08:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A entrada de grandes empresas de IA no setor de saúde é um desenvolvimento significativo e bem-vindo, acelerando a base técnica disponível para o setor. As suas modelos estão cada vez mais capazes de processar registros clínicos longos, interpretar termos complexos, comparar documentação com evidências e gerar resumos coerentes a partir de grandes volumes de informações.", "titulo_pt": "Próximo desafio da IA em saúde é a integração", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 156389, "titulo": "After outrunning Bolt, China’s robot champion races towards real-world work", "url": "https://www.japantimes.co.jp/business/2026/09/10/tech/bolt-china-robot-champion-work/", "fonte_id": "japan_times", "data_pub": "2026-09-10T08:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O objetivo destaca o desafio mais difícil enfrentado pelo setor de robótica, que luta para transformar demonstrações impressionantes em trabalhadores úteis.", "titulo_pt": "Depois de superar Bolt, campeão chinês de robótica se dirige para o trabalho no mundo real", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 156572, "titulo": "Trump officials say AI will help save rural health care. Some leaders in the field don’t believe it", "url": "https://www.statnews.com/2026/09/10/rural-health-care-ai-adoption-challenges-part-4-unraveled-series/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-10T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fornecedores de saúde rurais, que vêm enfrentando dificuldades há anos, estão enfrentando cortes de quase $1 trilhão no Medicaid nos próximos dez anos. A administração Trump está apontando para a inteligência artificial como uma possível solução para ajudar a melhorar os serviços de saúde rurais.", "titulo_pt": "Trump defende AI para salvar a saúde rural, mas alguns líderes duvidam", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 156390, "titulo": "Japan’s consumer agency plans stronger curbs on ‘dark pattern’ user interfaces", "url": "https://www.japantimes.co.jp/news/2026/09/10/japan/crime-legal/dark-pattern-user-interfaces/", "fonte_id": "japan_times", "data_pub": "2026-09-10T08:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A agência de consumo do Japão planeja apresentar legislação relacionada, possivelmente incluindo uma revisão da lei de transações comerciais especificadas, para combater interfaces de usuário com 'padrões escuros'.", "titulo_pt": "Agência de consumo do Japão planeja regras mais rígidas contra 'padrões escuros' em interfaces de usuário", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 156393, "titulo": "Kenyan startup makes robotic limbs to sign for deaf kids", "url": "https://www.japantimes.co.jp/business/2026/09/10/tech/kenya-startup-robotic-limbs-sign-deaf/", "fonte_id": "japan_times", "data_pub": "2026-09-10T07:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresários Kenyatas criaram braços robóticos para ensinar sinais de libras a crianças surdas. Muitas crianças surdas no Quênia aprendem sinais diferentes e a língua local carece de termos técnicos necessários para ensinar certos assuntos.", "titulo_pt": "Empreendedor keniata desenvolve braços robóticos para ensinar sinais a crianças surdas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 156019, "titulo": "El Big Rip y el apocalipsis: la ciencia espera un final violento para el universo", "url": "https://www.lanacion.com.ar/ciencia/el-big-rip-y-el-apocalipsis-la-ciencia-espera-un-final-violento-para-el-universo-nid09092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-10T09:38:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os dados astronômicos indicam uma expansão acelerada do universo, impulsionada pela energia escura. Este fenômeno poderia levar à desintegração total das estruturas cósmicas conhecidas.", "titulo_pt": "O Big Rip e o apocalipse: a ciência espera um fim violento para o universo", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 155788, "titulo": "Canadá atrai cientistas que querem deixar ciência dos EUA sob Trump", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/canada-atrai-cientistas-que-querem-deixar-ciencia-dos-eua-sob-trump.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A epidemiologista Sheryl Magzamen, cansada dos cortes orçamentários nos Estados Unidos, mudou-se para uma universidade no Canadá. O país implementou uma estratégia para atrair cientistas internacionais.", "titulo_pt": "Canadá atrai cientistas que querem deixar ciência dos EUA sob Trump", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 156546, "titulo": "AI pinpoints when fish reach their thermal limit", "url": "https://phys.org/news/2026-09-ai-fish-thermal-limit.html", "fonte_id": "phys_org", "data_pub": "2026-09-10T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores desenvolveram um sistema baseado em inteligência artificial que automaticamente deteta o momento em que peixes perdem o equilíbrio devido ao estresse térmico. O sistema combina a DeepLabCut, que captura a postura de animais em vídeo, com o ResNet34, uma tecnologia de classificação de imagens baseada em inteligência artificial.", "titulo_pt": "IA identifica quando peixes atingem seu limite térmico", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 156547, "titulo": "Unaccounted climate feedback loops may amplify warming by 20–30% this century, but cutting emissions will reduce risks", "url": "https://phys.org/news/2026-09-unaccounted-climate-feedback-loops-amplify.html", "fonte_id": "phys_org", "data_pub": "2026-09-10T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novas pesquisas indicam que emissões induzidas pelo aquecimento—gases de efeito estufa emitidos por fontes naturais devido a temperaturas crescentes—podem ampliar o aquecimento global em aproximadamente 20% a 30% e adicionar de 0,2°C a 0,4°C de aquecimento neste século além do aquecimento humano induzido pelas atividades humanas. Esses principais drivers adicionais de aquecimento não são atualmente considerados nas projeções climáticas e políticas existentes.", "titulo_pt": "Feedbacks climáticos não contabilizados podem ampliar o aquecimento em 20% a 30% até o século xxi, mas redução das emissões diminuirá os riscos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 156548, "titulo": "As oceans warm, Florida scientists hunt for heat-resistant coral", "url": "https://phys.org/news/2026-09-oceans-florida-scientists-resistant-coral.html", "fonte_id": "phys_org", "data_pub": "2026-09-10T08:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas e voluntários treinados em mergulho estão plantando corais jovens em recifes na costa da Flórida e avaliando como outros corais estão se saindo em águas cada vez mais quentes.", "titulo_pt": "Cientistas da flórida buscam corais resistentes ao calor no oceano", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 156571, "titulo": "Opinion: John Fetterman’s post-stroke, politically problematic behaviors offer lessons about brain health on Capitol Hill", "url": "https://www.statnews.com/2026/09/10/john-fetterman-post-stroke-behavior-experts-see-neurological-changes/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-10T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Michael P.H. Stanley e Isaiah Kletenik afirmam que nada nos relatos recentes sobre John Fetterman é medicamente surpreendente. Os comportamentos políticamente problemáticos de Fetterman após o AVC não apresentam elementos surpreendentes do ponto de vista médico.", "titulo_pt": "Opinião: comportamentos políticamente problemáticos de john Fetterman após avc oferecem lições sobre saúde cerebral no congresso", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 156573, "titulo": "STAT+: Five midterm races to watch that could be crucial for vaccine policy", "url": "https://www.statnews.com/2026/09/10/2026-midterms-health-care-issues-analyzed-vaccine-policy/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-10T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Candidatos republicanos em Iowa e Florida apoiam a desconfiança em relação às vacinas, enquanto democratas em Michigan e South Carolina estão preparados para debater o assunto.", "titulo_pt": "Cinco eleições de meia legislatura para observar que podem ser cruciais para a política de vacinas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 156549, "titulo": "Online and undercover: Saving trafficked wildlife in Thailand", "url": "https://phys.org/news/2026-09-online-undercover-trafficked-wildlife-thailand.html", "fonte_id": "phys_org", "data_pub": "2026-09-10T08:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nawee Changpirom dedicou anos a resgatar animais silvestres traficados na Tailândia. Ele mesmo encontrou criaturas surpreendentes, como leopardos, pinheiros-rosas e, uma vez, um tamanduá-bandeira.", "titulo_pt": "Online e sob disfarce: salvando animais silvestres traficados na tailândia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 156593, "titulo": "Cracking the ageing code", "url": "https://www.newscientist.com/article/2587740-cracking-the-ageing-code/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-09-10T08:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a relação entre saúde financeira e longevidade humana.", "titulo_pt": "Quebrando o código do envelhecimento", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 156550, "titulo": "Coyote density is 9 times higher in Seattle than in Washington's wildlands", "url": "https://phys.org/news/2026-09-coyote-density-higher-seattle-washington.html", "fonte_id": "phys_org", "data_pub": "2026-09-10T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A densidade de raposas-ruivas em Seattle é 9 vezes maior do que nas áreas selvagens do estado de Washington. Isso ocorre porque, uma vez que as raposas-ruivas se acostumem com a vida urbana, atraídas pela abundância de alimentos e pela ausência de predadores, elas permanecem em áreas urbanas mesmo com a presença de pessoas.", "titulo_pt": "Densidade de raposas-ruivas é 9 vezes maior em Seattle do que nas áreas selvagens de Washington", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 156551, "titulo": "Global heat stuck on high. Scientists say August was Earth's hottest month they've measured.", "url": "https://phys.org/news/2026-09-global-stuck-high-scientists-august.html", "fonte_id": "phys_org", "data_pub": "2026-09-10T07:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mês de agosto registrou a temperatura mais alta já medida na Terra, de acordo com o serviço climático europeu Copernicus, devido ao duplo efeito da mudança climática causada pelo homem e do El Niño intensificado.", "titulo_pt": "Agosto registrou a temperatura mais alta na terra, de acordo com cientistas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 156552, "titulo": "Anthropic researcher resigns with warning about the dangers of AI development", "url": "https://phys.org/news/2026-09-anthropic-resigns-dangers-ai.html", "fonte_id": "phys_org", "data_pub": "2026-09-10T07:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um pesquisador da Anthropic anunciou seu desligamento da empresa, alertando sobre a falta de responsabilidade na desenvolvimento de inteligência artificial. Ele expressou preocupações semelhantes às dos internos e externos da indústria sobre o potencial da tecnologia de AI escapar do controle humano.", "titulo_pt": "Pesquisador da anthropic renuncia com advertência sobre riscos do desenvolvimento de AI", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 156553, "titulo": "A stronger-than-normal El Nino alarms scientists over Galápagos wildlife and forests", "url": "https://phys.org/news/2026-09-stronger-el-nino-alarms-scientists.html", "fonte_id": "phys_org", "data_pub": "2026-09-10T07:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A previsão de que a ocorrência deste El Niño será mais forte do que o normal alarmou a comunidade científica ecuatoriana, que alertou sobre seus impactos na flora e fauna das Ilhas Galápagos, que abrigam a maior concentração de espécies únicas do planeta.", "titulo_pt": "Um El niño mais forte do que o normal preocupa cientistas sobre a vida selvagem e as florestas das ilhas Galápagos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 156406, "titulo": "Four Japanese scientists win prestigious U.S. Lasker Awards", "url": "https://www.japantimes.co.jp/news/2026/09/10/japan/science-health/four-japanese-lasker-awards/", "fonte_id": "japan_times", "data_pub": "2026-09-10T04:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quatro cientistas japoneses receberam o prêmio Lasker, um por suas pesquisas sobre uma química do cérebro que regula o sono, e um trio por descobrir um tratamento com anticorpos para pacientes com hemofilia A.", "titulo_pt": "Quatro cientistas japoneses ganham prestigiado prêmio lasker dos estados unidos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 156579, "titulo": "APOD: 2026 September 10 – LDN 1295: The Giraffe Nebula", "url": "https://science.nasa.gov/image-article/apod-2026-september-10-ldn-1295-the-giraffe-nebula/", "fonte_id": "nasa_news", "data_pub": "2026-09-10T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem de hoje do Astronomy Picture of the Day (APOD) mostra a LDN 1295, conhecida como a Nebulosa do Girafa. Esta imagem foi publicada em 10 de setembro de 2026.", "titulo_pt": "APOD: 10 de setembro de 2026 – LDN 1295: a nebulosa do girafa", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 156595, "titulo": "Watch SpaceX launch classified mission for the US Space Force today", "url": "https://www.space.com/space-exploration/launches-spacecraft/spacex-launch-classified-space-force-mission-ussf-153", "fonte_id": "space_com", "data_pub": "2026-09-10T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX está lançando a missão classificada USSF-153 para o Exército Espacial dos Estados Unidos hoje (10 de setembro), e o público pode assistir ao vivo.", "titulo_pt": "Assistir lançamento classificado da SpaceX para a força espacial dos EUA hoje", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 156605, "titulo": "Rabkin Foundation Names Eight Winners of Its 2026 Arts Journalism Grants", "url": "https://www.artnews.com/art-news/news/rabkin-foundation-names-eight-winners-of-its-2026-arts-journalism-grants-1234797604/", "fonte_id": "artnews", "data_pub": "2026-09-10T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Fundo Rabkin anuncia os vencedores de seus prêmios de jornalismo sobre arte para 2026. Os vencedores foram escolhidos por sua 'profunda interesse nas forças que moldam o que vemos e o que não vemos'.", "titulo_pt": "Fundo rabkin anuncia vencedores dos prêmios de jornalismo sobre arte para 2026", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 156591, "titulo": "Announcing the 2026 Rabkin Prize Winners", "url": "https://hyperallergic.com/announcing-the-2026-rabkin-prize-winners/", "fonte_id": "hyperallergic", "data_pub": "2026-09-10T09:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Fundo Rabkin comemora as contribuições criativas e intelectuais dos críticos de arte contemporâneos, concedendo oito prêmios não restritos no 0T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute a importância de cuidar da democracia atualmente. Não há detalhes específicos sobre o conteúdo, apenas o foco na preservação da democracia no presente momento.", "titulo_pt": "Cuidar da democracia hoje", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 156583, "titulo": "‘Female survival in a terrifying world’: Tilda Swinton’s return in Man to Man", "url": "https://www.theguardian.com/stage/2026/sep/10/man-to-man-tilda-swinton-royal-court-manfred-karge", "fonte_id": "guardian_culture", "data_pub": "2026-09-10T09:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A peça 'Jacke wie Hose', de Manfred Karge, é sobre uma mulher que assume a identidade do marido falecido para sobreviver em um mundo terrível. A obra retrata a sobrevivência feminina durante os 12 anos de regime nazi, além de refletir divisões culturais.", "titulo_pt": "Sobrevivência feminina em mundo terrível: retorno de tilda Swinton em 'Man to Man'", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 155759, "titulo": "Globo aumenta publicidade de 'Quem Ama Cuida' para tentar conter queda de ibope", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/09/globo-aumenta-publicidade-de-quem-ama-cuida-para-tentar-conter-queda-de-ibope.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Globo planeja aumentar a publicidade de 'Quem Ama Cuida' para tentar reverter a queda de audiência da novela. A trama chega ao capítulo 100 na sexta-feira (11) e a emissora espera atrair novamente os espectadores que deixaram de assistir nos últimos meses.", "titulo_pt": "Globo intensifica publicidade de 'Quem Ama Cuida' para conter queda de ibope", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, uth trends", "url": "https://www.japantimes.co.jp/business/2026/09/10/companies/new-year-department-store-sale/", "fonte_id": "japan_times", "data_pub": "2026-09-10T07:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Algumas lojas de departamentos adaptaram pratos tradicionais de osechi para o Ano Novo, incorporando tendências jovens, como oshikatsu, e o conceito de consumo culpado, que envolve o prazer em comer alimentos ricos sem se preocupar com as calorias.", "titulo_pt": "Lojas de departamentos adaptam pratos osechi para o ano novo às tendências jovens", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 156235, "titulo": "Bayeux Tapestry exhibition at British Museum opens", "url": "https://www.lemonde.fr/en/culture/article/2026/09/10/bayeux-tapestry-enthusiasm-engulfs-the-uk-as-sold-out-exhibition-opens_6757371_30.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-10T07:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O British Museum vendeu um recorde de 100.000 ingressos para a exibição do famoso painel de Bayeux, uma obra medieval que retrata a Batalha de Hastings de 1066.", "titulo_pt": "Exibição do painel de bayeux no British Museum atrai 100.000 ingressos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 155760, "titulo": "Carol Lekker perdeu três contratos de publicidade antes de sair do SBT por polêmicas", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/09/carol-lekker-perdeu-tres-contratos-de-publicidade-antes-de-sair-do-sbt-por-polemicas.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-10T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Carol Lekker pediu aumento para continuar no Fofocalizando após três contratos de publicidade serem cancelados devido a polêmicas em julho e agosto. As marcas desistiram do negócio após a apresentadora se envolver em duas sit
