<html lang="pt-BR">

<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>
const D = {"gerado_em": "16/08/2026 19:14", "stats": {"noticias_novas": 373, "resumos_gerados": 199}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Os candidatos à Presidência da República iniciaram suas campanhas eleitorais no último domingo (16). Renan Santos, do partido Missão, realizou o ato de lançamento em São Paulo, usando um colete a prova de balas e prometendo enfrentar 'inimigos da nação'. Flávio Bolsonaro, filho do ex-presidente Jair Bolsonaro, fez seu primeiro discurso em Copacabana, no Rio de Janeiro, criticando Lula e anunciando um 'tesourão' a partir de 2024. Lula, por sua vez, focou em mulheres durante o primeiro dia de sua campanha, enquanto Flávio mencionou o INSS e Lulinha. Além disso, a campanha presidencial teve início em outros estados, com agendas programadas em São Paulo, Rio de Janeiro, Minas Gerais, Paraná, Rio Grande do Sul, Bahia e Ceará. As mulheres representam 34,8% das candidaturas registradas para as eleições de 2026, com 7.134 candidatas entre os cargos de presidente, governador, senador, deputado federal, deputado estadual e deputado distrital, conforme dados atualizados pelo Tribunal Superior Eleitoral (TSE).", "mundo": "O presidente dos Estados Unidos, Donald Trump, instruiu o Pentágono a reduzir os exercícios militares conjuntos com a Coreia do Sul, sinalizando boa vontade em relação à Coreia do Norte, que Trump descreveu como 'inofensiva e respeitosa'. Além disso, Jared Kushner, conselheiro do presidente, se reuniu com o Hamas em um esforço diplomático para avançar o plano de paz para Gaza, após Israel rejeitar o plano de Trump. No exterior, um forte pioramento do tempo na Itália resultou em uma jovem de 20 anos morrendo em um lago devido a uma tempestade repentina. A Ucrânia e a Rússia enfrentaram ataques de drones e mísseis que resultaram em 19 mortes. No Campeonato Africano de Nações Feminino, o Camarões venceu a final contra Malawi, conquistando o título pela primeira vez. Além disso, inundações históricas no Indiana e em vários estados da Venezuela deixaram várias pessoas mortas e causaram estragos significativos. No Brasil, Lula e Bolsonaro retomaram suas campanhas presidenciais em seus principais suportes eleitorais, enquanto o governo de Boric propõe retirar as prestações de saúde para condenados por crimes organizados e terrorismo.\n\nO cenário geopolítico global continua marcado por tensões e alinhamentos estratégicos. Os Estados Unidos anunciaram que exigirão de seus parceiros que escolham entre China e EUA, visando estabelecer um posicionamento claro entre as duas potências. Em desenvolvimento econômico, o governo dos EUA impôs tarifas sobre drones, aprofundando o desacoplamento econômico entre os dois países. Na região do Oriente Médio, o conflito entre Israel e Hamas persiste, com o ministro de Segurança de Israel proposto a morte de até 40 palestinos por noite em Gaza. O presidente da Turquia, Recep Tayyip Erdogan, solicitou a reabertura do Estreito de Ormuz, em meio a interrupções no fornecimento de petróleo. Além disso, o Irã advertiu que impedirá o retorno das forças americanas ao Estreito de Ormuz e ao Golfo Pérsico, estabelecendo o controle do estreito como condição para encerrar o conflito.", "economia": "A economia brasileira enfrenta desafios significativos, com destaque para a situação financeira crítica da Casas Bahia, que anunciou um prejuízo de R$ 10,1 bilhões e está avaliando novas estratégias de recuperação, incluindo possíveis pedidos de recuperação judicial ou extrajudicial. O cenário econômico também é impactado pela possível implementação de um imposto sobre riqueza na Califórnia, que está sendo combatido por bilionários como Chris Larsen e John Doerr. Além disso, o Brasil enfrenta um potencial El Niño de intensidade inédita em séculos, o que pode afetar negativamente a produção agrícola e a economia do país. Em um cenário global, as petroleiras Exxon, Chevron e Petrobras apresentaram lucros sólidos no segundo trimestre de 2026, impulsionados pelo aumento dos preços do petróleo, enquanto a Nvidia planeja investir US$ 3 bilhões na construção de data centers nos Estados Unidos.", "tecnologia": "A tecnologia está presente em diversos aspectos, desde inteligência artificial até jogos. A Nvidia reduziu a garantia de financiamento para o centro da OpenAI, enquanto a OpenAI desmontou sua equipe de preparação, levantando questionamentos sobre a segurança dos modelos de IA. A Anthropic afirma que a rejeição à tecnologia é uma crise de confiança. A OpenRouter, uma startup de gateways de IA, está prestes a ser adquirida por cerca de 7 bilhões de dólares pela Stripe. Em outra frente, a desertificação do solo no Brasil ameaça a segurança hídrica e alimentar de cerca de 39 milhões de pessoas. Outras notícias abordam a possibilidade de desaparecimento das mídias físicas de jogos, com o PlayStation planejando parar de fabricar discos em 2028, e a integração do Gemini ao Google Classroom, prometendo uma experiência de aprendizado personalizada.", "ciencia": "O Instituto de Tecnologia Industrial (ITRI), de Taiwan, desenvolveu uma tecnologia de terapia para tratar a ansiedade, oferecendo uma solução tecnológica para lidar com o estresse e a ansiedade. Em outro estudo, a pesquisadora Renata Reinheimer descobriu que os antepassados silvestres dos cultivos atuais, como trigo e milho, eram perenes, sugerindo que os cultivos modernos podem ter perdido a característica de rebrotar após a colheita. Na área de saúde, casos de puberdade precoce têm intrigado médicos em todo o mundo, incluindo no Brasil, com a condição afetando principalmente as meninas e requerendo tratamento para prevenir problemas de saúde na idade adulta. Além disso, um estudo revelou que suavemente comprimir um cristal de sulfeto de ferro pode alterar simultaneamente suas propriedades magnéticas e de condução elétrica, fornecendo uma visão mais clara de como um novo tipo de material magnético funciona. Outro avanço na área de saúde é o desenvolvimento de cães beagle geneticamente editados que não produzem o principal alérgeno canino, Can f 1, em testes iniciais, prometendo reduzir a exposição a alergenos caninos e possivelmente aliviar os sintomas de alergia a cães.", "cultura": "O filme 'Spider-Man: No Way Home', estrelado por Tom Holland, arrecadou US$ 2 bilhões em bilheteria global em apenas três semanas, sendo o segundo filme a atingir essa marca com maior velocidade, ficando atrás apenas de 'Vingadores: Ultimato'. Em Gramado, o filme 'Feito Pipa', com a participação do ator Lázaro Ramos, emocionou o público durante o Festival de Cinema de Gramado. Em Nova York, a cidade anunciou que cobrirá os custos de cuidados infantis para 22.000 famílias, o que será para crianças de seis semanas a 13 anos. O Jun Matcha Club Cafe, localizado em uma antiga garagem residencial em Panglima Polim, South Jakarta, reflete os valores do matcha, como ritual, atenção e contenção, através do uso de ofícios indonésios e materiais locais, oferecendo uma experiência mais lenta e contemplativa.", "sociedade": "Um bebê de 1 ano e meio morreu após se sufocar com restos de carne durante uma refeição em Santiago del Estero. A mãe percebeu que o filho não reagia e levou-o ao hospital em estado cianótico e hipotônico, devido à falta de oxigênio e comprometimento neurológico. O Ministério da Educação (MOE) planeja expandir o treinamento em primeiros socorros para os professores nas escolas, visando aumentar a capacidade de resposta a emergências nas instituições de ensino. Além disso, a Prefeitura de São Paulo passa a atender jovens e adultos com o programa Saúde Escolar, ampliando o número de beneficiados para mais 37 mil pessoas.", "meio_ambiente": "Um terremoto de magnitude 7,7 na Indonésia deixou 53 mortos e mais de 5 mil desabrigados na ilha de Flores, onde as operações de busca, resgate e assistência às vítimas continuam. Em meio a preocupações com eventos climáticos extremos, um climatologista alertou para a aceleração desses eventos devido às mudanças climáticas, mantendo, no entanto, uma postura otimista. A seca afeta a Itália e a Europa, com o Rio Po atingindo níveis históricos baixos e metade da Europa em estado de seca, conforme mostram imagens de satélite. No Havaí, o furacão Lala deixou cerca de 199 mil pessoas sem energia. Em países europeus, fogos florestais na Bélgica e na Grécia estão sendo combatidos por equipes de bombeiros, com dois mortos registrados em uma ilha perto de Atenas. A expansão rápida da energia solar, que atingiu 3 terawatts em 2026, também é noticiada, com a tecnologia superando marcos globais de instalação em apenas quatro anos.", "direitos_humanos": "A Comissão Nacional de Direitos Humanos criticou uma proposta de chicotear, expressando preocupações sobre as possíveis consequências da medida. Em outro desenvolvimento, o Palestine Red Crescent Society recuperou o corpo de um adolescente palestino de 14 anos, morto pelas forças israelenses em Gaza. Cinco anos após o retorno do governo do Taliban ao Afeganistão, repórteres da Le Monde conversaram com mulheres afegãs sobre suas experiências diárias de opressão e medo. Em Hong Kong, um adolescente de 14 anos foi preso suspeito de maus-tratos a um gato. Além disso, em Gaza, um médico relatou a amputação de uma menina sem anestesia. Em ataques no Território Ocidental, colonos israelenses feriram palestinos e invadiram suas comunidades. Finalmente, a Comissão Nacional de Direitos Humanos discutiu os direitos dos detidos, abordando as garantias e proteções legais para pessoas detidas."}, "resumo_do_dia": {"politica_nacional": [{"id": 106207, "titulo": "Quem são os candidatos ao governo de Roraima (RR) nas eleições de 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-os-candidatos-ao-governo-de-roraima-rr-nas-eleicoes-de-2026-agosto", "fonte_id": "jota", "data_pub": "2026-08-16T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após indefinições envolvendo o mandato-tampão no estado, cinco candidatos disputam o governo de Roraima em 2026.", "titulo_pt": "Quem são os candidatos ao governo de Roraima nas eleições de 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 106080, "titulo": "Candidatos ao Governo de Goiás iniciam campanha eleitoral; veja como foi o primeiro dia", "url": "https://g1.globo.com/go/goias/eleicoes/2026/noticia/2026/08/16/candidatos-ao-governo-de-goias-iniciam-campanha-eleitoral-veja-como-foi-o-primeiro-dia.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-16T21:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos ao Governo de Goiás, Daniel Vilela (MDB), Marconi Perillo (PSDB), Luis Cesa (PT) e Wilder Morais (PL), iniciaram a campanha eleitoral no estado, realizando carreatas e eventos em diversas cidades goianas. A primeira atividade de Daniel Vilela foi uma missa na Catedral Metropolitana de Goiânia.", "titulo_pt": "Candidatos ao Governo de Goiás iniciam campanha eleitoral; veja como foi o primeiro dia", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 106139, "titulo": "Com colete à prova de balas, Renan Santos defende plano de encarceramento", "url": "https://www.cnnbrasil.com.br/eleicoes/com-colete-a-prova-de-balas-renan-santos-defende-plano-de-encarceramento/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-16T21:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Renan Santos, candidato do partido Missão, defendeu um plano de encarceramento em um ato de campanha em São Paulo neste domingo. Durante o evento, ele explicou o slogan do partido e criticou Lula e Flávio Bolsonaro.", "titulo_pt": "Renan Santos defende plano de encarceramento em ato de campanha", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 106192, "titulo": "Advogado aponta falhas em processos que levaram Deolane à prisão", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/advogado-aponta-falhas-em-processos-que-levaram-deolane-a-prisao", "fonte_id": "metropoles", "data_pub": "2026-08-16T21:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O advogado Marcos Cebola, em uma série de vídeos intitulada 'InPrudente', detalhou supostas irregularidades que podem ter afetado o processo de prisão de Deolane Bezerra.", "titulo_pt": "Advogado destaca supostas irregularidades nos processos que levaram Deolane à prisão", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 106081, "titulo": "Polícia Federal localiza avião de Vorcaro no Paraguai", "url": "https://g1.globo.com/politica/noticia/2026/08/16/policia-federal-localiza-aviao-de-vorcaro-no-paraguai.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-16T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal localizou um avião de Daniel Vorcaro no Paraguai, que retornou ao Brasil e está no Aeroporto Internacional de Brasília para medidas judiciais. A aeronave foi encontrada em Assunção após negociações com autoridades paraguaias.", "titulo_pt": "Pf localiza avião de Vorcaro no Paraguai", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 106097, "titulo": "Última delação de grande porte no STF, acordo de Mauro Cid vai completar três anos", "url": "https://veja.abril.com.br/brasil/ultima-delacao-de-grande-porte-no-stf-acordo-de-mauro-cid-vai-completar-tres-anos/", "fonte_id": "veja", "data_pub": "2026-08-16T21:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O acordo de delação de Mauro Cid, que completará três anos, é considerado a última delação de grande porte no Supremo Tribunal Federal (STF). Nos últimos três anos, muitas propostas de delação não avançaram e permaneceram inativas na Procuradoria-Geral da República (PGR).", "titulo_pt": "Última delação de grande porte no STF, acordo de Mauro Cid completa três anos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 106098, "titulo": "Candidata à Presidência da República promete dobrar salários", "url": "https://veja.abril.com.br/politica/candidata-a-presidencia-da-republica-promete-dobrar-salarios/", "fonte_id": "veja", "data_pub": "2026-08-16T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Samara Martins, candidata à Presidência da República, promete dobrar os salários e exigir que parlamentares e seus familiares utilizem os serviços do Sistema Único de Saúde (SUS).", "titulo_pt": "Candidata à Presidência promete dobrar salários e obrigar uso do sus", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 106082, "titulo": "Mulheres representam 34,8% das candidaturas registradas para as eleições de 2026", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/16/mulheres-candidaturas-eleicoes-2026.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-16T20:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mulheres representam 34,8% das candidaturas registradas para as eleições de 2026, com 7.134 candidaturas femininas entre os cargos de presidente, governador, senador, deputado federal, deputado estadual e deputado distrital. O Tribunal Superior Eleitoral (TSE) atualizou os dados às 16h30 deste domingo (16).", "titulo_pt": "Mulheres representam 34,8% das candidaturas para as eleições de 2026", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 106065, "titulo": "Eleição terá ao menos 20,5 mil candidatos pelo país, aponta balanço do TSE", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/eleicao-tera-o-menos-205-mil-candidatos-pelo-pais-aponta-balanco-do-tse.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-16T20:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral registrou ao menos 20.496 candidatos para as eleições de 2026, que incluem cargos para presidente, governador, senador e deputados federais, estaduais e distritais. Os dados são parciais e atualizados até 16h30 deste domingo (16).", "titulo_pt": "Eleição de 2026 terá pelo menos 20.496 candidatos, indica balanço do TSE", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 106066, "titulo": "Renan Santos inicia campanha com ato em São Paulo e discursa sobre segurança", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/renan-santos-inicia-campanha-com-ato-em-sao-paulo-e-discursa-sobre-seguranca.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-16T20:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Renan Santos, candidato do partido Missão à Presidência da República, realizou o ato de lançamento de sua campanha no Largo São Francisco, no centro de São Paulo, no domingo (16).", "titulo_pt": "Renan Santos inicia campanha com ato em São Paulo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 106061, "titulo": "Estado dos EUA cria imposto para data centers e pressiona big techs", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/estado-dos-eua-cria-imposto-para-data-centers-e-pressiona-big-techs.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-16T20:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em um estado americano em meio a uma revolução tecnológica, a Virgínia se destaca com a presença de inúmeros data centers, ganhando o apelido de 'Corredor dos Data Centers'.", "titulo_pt": "Estados unidos cria imposto para data centers e pressiona as grandes tecnológicas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 106121, "titulo": "PL foi quem mais lançou candidatos ao Congresso; PCO é o que tem mais a governador", "url": "https://www.infomoney.com.br/politica/pl-foi-quem-mais-lancou-candidatos-ao-congresso-pco-e-o-que-tem-mais-a-governador/", "fonte_id": "infomoney", "data_pub": "2026-08-16T20:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A base de candidatos do PL foi a maior para o Congresso, enquanto o PCO lidera em número de candidatos a governador. A informação foi fornecida pela Justiça Eleitoral, que destaca que a base ainda será atualizada nos próximos dias.", "titulo_pt": "PL lidera em candidatos ao Congresso; PCO é o partido com mais candidatos a governador", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 106122, "titulo": "Renan Santos ataca Lula e Flávio e promete ‘exterminar’ facções", "url": "https://www.infomoney.com.br/politica/renan-santos-ataca-lula-e-flavio-e-promete-exterminar-faccoes/", "fonte_id": "infomoney", "data_pub": "2026-08-16T20:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Renan Santos, pré-candidato, criticou Lula, chamando-o de 'bêbado', e atacou o PT, acusando o partido de fazer 'assistencialismo' no governo federal.", "titulo_pt": "Renan Santos ataca Lula e Flávio e promete ‘exterminar’ facções", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 106112, "titulo": "Candidatos iniciam campanha presidencial em redutos eleitorais", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/candidatos-iniciam-campanha-presidencial-em-redutos-eleitorais", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-16T20:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos à presidência da República começaram a realizar campanha nas ruas do país neste domingo, conforme o calendário estabelecido pela Justiça Eleitoral. A campanha está permitida até 3 de outubro, com os comícios autorizados entre as 8h e a meia-noite até 1° de outubro.", "titulo_pt": "Candidatos iniciam campanha presidencial em redutos eleitorais", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 106151, "titulo": "Flávio defende castração química; Lula promete Ministério da Segurança", "url": "https://www.cnnbrasil.com.br/eleicoes/flavio-defende-castracao-quimica-lula-promete-ministerio-da-seguranca/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-16T20:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro defendeu a castração química como medida contra a violência, enquanto Lula prometeu criar um Ministério da Segurança. Os dois candidatos apresentaram propostas diferentes para enfrentar a crise de violência.", "titulo_pt": "Flávio defende castração química; Lula promete Ministério da Segurança", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 106103, "titulo": "As eleições na cidade onde Bolsonaro venceu Lula por um voto", "url": "https://veja.abril.com.br/politica/as-eleicoes-na-cidade-onde-bolsonaro-venceu-lula-por-um-voto/", "fonte_id": "veja", "data_pub": "2026-08-16T19:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O prefeito de Nanuque afirma que a disputa entre Flávio Bolsonaro e o petista será acirrada, mas espera que a direita aumente sua vantagem em 2026.", "titulo_pt": "Eleições na cidade onde Bolsonaro venceu Lula por um voto", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 105963, "titulo": "US to tell partners they must pick sides", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/17/2003862598", "fonte_id": "taipei_times", "data_pub": "2026-08-17T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Estados Unidos informará seus parceiros que eles devem escolher entre China e Estados Unidos. Este anúncio visa claramente estabelecer um posicionamento de alinhamento entre as duas potências.", "titulo_pt": "EUA avisarão parceiros que devem escolher lados", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 105964, "titulo": "Trump’s drone tariff deepens decoupling", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/17/2003862599", "fonte_id": "taipei_times", "data_pub": "2026-08-17T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos impôs tarifas sobre drones, aprofundando a desacoplamento econômico entre os EUA e China. Este movimento visa reduzir a dependência dos drones chineses, que são amplamente utilizados nos Estados Unidos.", "titulo_pt": "Tarifa sobre drones aprofunda desacoplamento dos EUA e china", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 106404, "titulo": "Nirupama Rao and Lin Minwang on the great India-China face-off", "url": "https://www.scmp.com/news/china/diplomacy/article/3364169/nirupama-rao-and-lin-minwang-great-india-china-face?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-16T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nirupama Rao, ex-secretária de Estado indiana e ex-embaixadora do Índia na China, e Lin Minwang, especialista chinês em assuntos sul-asiáticos, discutem as profundas divisões na relação entre Índia e China. O debate aborda se a maior barreira é a história ou a política, além das tensões na fronteira, o papel do Paquistão e as relações indias com outros países.", "titulo_pt": "Nirupama Rao e Lin Minwang sobre o grande confronto índia-china", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 106076, "titulo": "Trump reduz exercício militar com Seul e diz que Coreia do Norte tem sido 'inofensiva e respeitosa'", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/08/trump-reduz-exercicio-militar-com-seul-e-diz-que-coreia-do-norte-tem-sido-inofensiva-e-respeitosa.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-16T21:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, instruiu o Pentágono a reduzir substancialmente os exercícios militares conjuntos com a Coreia do Sul, previstos para começar na segunda-feira, como sinal de boa vontade em relação à Coreia do Norte. Trump afirmou que a Coreia do Norte tem sido 'inofensiva e respeitosa'.", "titulo_pt": "Trump reduz exercícios militares com Seul em sinal de boa vontade para Coreia do Norte", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 106366, "titulo": "Trump says US to scale back military drills with South Korea after it stayed out of Iran war", "url": "https://www.bbc.co.uk/news/articles/cx2lll7zvn0o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-16T21:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump decidiu reduzir a cooperação militar com a Coreia do Sul após esta recusar-se a auxiliar na guerra contra o Irã.", "titulo_pt": "Trump anuncia redução de exercícios militares com a Coreia do sul após recusa em auxiliar na guerra do Irã", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 106308, "titulo": "Australia politics live: Nationals argue gun buyback is against constitutional clause featured in The Castle", "url": "https://www.theguardian.com/australia-news/live/2026/aug/17/australia-politics-live-labor-work-rights-visa-holders-anthony-albanese-angus-taylor-pauline-hanson-liberal-party-one-nation-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-08-16T21:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O programa de compra de armas na Austrália oferecerá uma compensação fixa aos detentores de armas de fogo em New South Wales, baseada no tipo de arma. Mathias Cormann, ex-ministro das Finanças, defende o acordo GST para o estado da Austrália Ocidental, afirmando que não foi um erro financeiro e foi uma reforma importante nas relações financeiras federais.", "titulo_pt": "Política australiana em tempo real: nacionais argumentam que programa de compra de armas contraria cláusulo constitucional", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 106381, "titulo": "Hundreds of migrants arrested near Ceuta border in latest crackdown", "url": "https://www.aljazeera.com/news/2026/8/16/hundreds-of-migrants-arrested-near-ceuta-border-in-latest-crackdown?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-16T21:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 300 migrantes e 61 supostos facilitadores foram detidos durante uma tentativa maciça de migração perto da fronteira de Ceuta.", "titulo_pt": "Centenas de migrantes e suspeitos de facilitação detidos na fronteira de Ceuta", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 106064, "titulo": "Autoridade do governo Trump acusa Brasil de censura após X alterar algoritmo para eleição", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/autoridade-do-governo-trump-acusa-brasil-de-censura-apos-x-alterar-algoritmo-para-eleicao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-16T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma alta funcionária do governo Trump considerou censura uma regra eleitoral que fez o X (ex-Twitter) alterar seu algoritmo para não recomendar publicações de candidatos a usuários que não seguem suas contas.", "titulo_pt": "Autoridade do governo Trump acusa Brasil de censura após X alterar algoritmo para eleição", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 106394, "titulo": "Recap of latest developments in West Bank", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/recap-latest-developments-west-bank", "fonte_id": "middle_east_eye", "data_pub": "2026-08-16T21:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um médico palestiniano de Jerusalém foi ferido após ser agredido por setedários israelenses na cidade de Jannatah, a leste de Belém, na Cisjordânia ocupada, de acordo com a Agência Wafa. Além disso, israelenses atacaram e cercaram uma casa palestiniana no entorno do vilarejo de Beit Imrin, no noroeste de Nablus, prendendo nove pessoas após uma longa siegem, informaram fontes locais à Agência Wafa.", "titulo_pt": "Resumo das últimas desenvolvimentos na cisjordânia ocidental", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 106310, "titulo": "EE.UU. promete a Hamas retirada israelí de Gaza en paralelo al desarme de las milicias", "url": "https://www.latercera.com/mundo/noticia/eeuu-promete-a-hamas-retirada-israeli-de-gaza-en-paralelo-al-desarme-de-las-milicias/", "fonte_id": "la_tercera", "data_pub": "2026-08-16T21:44:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O enviado americano Jared Kushner afirmou durante suas negociações no Egito que Israel deve se retirar gradualmente de Gaza conforme o desarme das milícias palestinas, uma proposta diferente da defendida pelo primeiro-ministro israelense, Benjamin Netanyahu.", "titulo_pt": "EUA prometem retirada israelense de Gaza em paralelo ao desarme de milícias palestinas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 106420, "titulo": "U.S. commander calls mental health a priority after he visits USS Lincoln", "url": "https://www.washingtonpost.com/world/2026/08/16/us-commander-calls-mental-health-priority-after-he-visits-uss-lincoln/", "fonte_id": "washington_post_world", "data_pub": "2026-08-16T21:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O comandante dos Estados Unidos, Adm. Brad Cooper, reconheceu que longos períodos no mar podem ser desafiadores, mas que algumas das preocupações levantadas eram 'notícias antigas'. Recentemente, foram relatados problemas de estresse e condições ruins a bordo do USS Abraham Lincoln.", "titulo_pt": "Comandante dos EUA reconhece que saúde mental é prioridade após visita ao USS Lincoln", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 106405, "titulo": "Chokepoints and the cost of cutting off access", "url": "https://www.scmp.com/opinion/world-opinion/article/3363772/chokepoints-and-cost-cutting-access?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-16T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2022, a Ucrânia pediu a Elon Musk, CEO da SpaceX, para ativar o serviço Starlink em Sevastopol para apoiar um ataque à frota da Marinha da Rússia no Mar Negro. Musk recusou, argumentando que isso o faria 'explicitamente complice em uma grande ação de guerra'. Isso ilustra a importância decisiva de um único ator privado em pontos de acesso críticos.", "titulo_pt": "Pontos de acesso e o custo de interromper o acesso", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 106077, "titulo": "Sobe para 84 o número de mortos em naufrágio de balsa no Zimbábue", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/08/sobe-para-84-o-numero-de-mortos-em-naufragio-de-balsa-no-zimbabue.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-16T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de mortos no naufrágio de uma balsa superlotada no Zimbábue aumentou para 84 após a recuperação de mais corpos neste domingo. A informação foi dada pela polícia local.", "titulo_pt": "Número de mortos no naufrágio de balsa no Zimbábue sobe para 84", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 106421, "titulo": "Jared Kushner meets Hamas on Mideast trip to push Gaza deal", "url": "https://www.washingtonpost.com/world/2026/08/16/jared-kushner-meets-hamas-mideast-trip-push-gaza-deal/", "fonte_id": "washington_post_world", "data_pub": "2026-08-16T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jared Kushner, conselheiro do presidente dos Estados Unidos e enviado especial, está programado para se encontrar em Jerusalém na segunda-feira com o primeiro-ministro israelense Benjamin Netanyahu, após a rejeição do plano de 15 pontos apoiado por Trump.", "titulo_pt": "Jared Kushner se reúne com Hamas em viagem ao oriente médio para discutir acordo de Gaza", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 106395, "titulo": "Trump hails Saudi-Turkiye-Pakistan defence pact", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/trump-hails-saudi-turkiye-pakistan-defence-pact", "fonte_id": "middle_east_eye", "data_pub": "2026-08-16T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, comemorou o acordo de defesa assinado recentemente entre Arábia Saudita, Turquia e Paquistão. Segundo ele, o pacto representa um passo importante para a segurança do Oriente Médio.", "titulo_pt": "Trump celebra acordo de defesa entre arábia saudita, Turquia e paquistão", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 106304, "titulo": "Kushner Meets With Hamas to Advance Trump’s Gaza Plan", "url": "https://www.nytimes.com/2026/08/16/world/middleeast/kushner-hamas-talks.html", "fonte_id": "nyt_world", "data_pub": "2026-08-16T21:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jared Kushner, o sogro do presidente, se reuniu com líderes do grupo palestino-militante Hamas em Egito, conforme informaram autoridades. Ele irá em seguida se encontrar com Benjamin Netanyahu, o líder israelense.", "titulo_pt": "Kushner se reúne com Hamas para avançar o plano de Trump sobre Gaza", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 105948, "titulo": "Average annual personal income rises to record level", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/17/2003862615", "fonte_id": "taipei_times", "data_pub": "2026-08-17T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O rendimento pessoal anual médio atingiu um novo recorde. Não há detalhes adicionais sobre o aumento ou o período específico em que isso ocorreu.", "titulo_pt": "Rendimento pessoal anual médio atinge novo recorde", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 106117, "titulo": "Calma no mercado nos EUA pode esconder mudança de sentimento de investidores?", "url": "https://www.infomoney.com.br/mercados/calma-no-mercado-nos-eua-pode-esconder-mudanca-de-sentimento-de-investidores/", "fonte_id": "infomoney", "data_pub": "2026-08-16T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A curva de volatilidade do índice S&P 500 sugere que os investidores estão relativamente calmos em relação aos riscos futuros. No entanto, essa tranquilidade pode esconder mudanças no sentimento dos operadores.", "titulo_pt": "Calma no mercado nos EUA pode esconder mudança de sentimento de investidores?", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 106096, "titulo": "Casas Bahia anuncia prejuízo de R$ 10 bi e culpa juros altos e bets", "url": "https://veja.abril.com.br/economia/casas-bahia-anuncia-prejuizo-de-r-10-bi-e-culpa-juros-altos-e-bets/", "fonte_id": "veja", "data_pub": "2026-08-16T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Casas Bahia anunciou um prejuízo de R$ 10 bilhões e está considerando pedir recuperação judicial para sair da cri tar após a colheita.", "titulo_pt": "Renata Reinheimer, investigadora premiada: 'nosso sonho é que existam cultivos que possam rebrotar após a colheita'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 106223, "titulo": "Os casos de puberdade precoce que intrigam os médicos em todo o mundo (incluindo no Brasil)", "url": "https://www.bbc.com/portuguese/articles/c935ee7g059o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-16T21:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A puberdade precoce é o desenvolvimento das funções sexuais em crianças com idade avançada. A condição afeta principalmente as meninas e exige tratamento para prevenir problemas de saúde na idade adulta.", "titulo_pt": "Caso de puberdade precoce intrigam médicos no Brasil e em todo o mundo", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 106416, "titulo": "Brief firearm safety talks more than double openness to out-of-home storage", "url": "https://phys.org/news/2026-08-firearm-safety-home-storage.html", "fonte_id": "phys_org", "data_pub": "2026-08-16T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma breve conversa sobre segurança com armas de fogo pode aumentar significativamente a disposição de proprietários de armas de considerar o armazenamento temporário dessas armas fora de casa durante crises, de acordo com um estudo liderado por Rutgers.", "titulo_pt": "Conversas rápidas sobre segurança com armas podem dobrar a disposição de armazenamento temporário", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 106201, "titulo": "Cientistas revelam duas rotas cerebrais que favorecem o emagrecimento", "url": "https://www.metropoles.com/saude/duas-rotas-cerebrais-que-favorecem-o-emagrecimento", "fonte_id": "metropoles", "data_pub": "2026-08-16T20:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo com camundongos demonstrou como ativar ou bloquear um receptor específico pode influenciar na perda de peso. O mesmo receptor pode ser usado para potencializar a redução do peso de diferentes maneiras.", "titulo_pt": "Cientistas descobrem rotas cerebrais para emagrecimento", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 106417, "titulo": "Hurricane Lala pulls away from Hawaii's Big Island", "url": "https://phys.org/news/2026-08-hurricane-lala-hawaii-big-island.html", "fonte_id": "phys_org", "data_pub": "2026-08-16T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O furacão Lala se afastava da Ilha Grande de Hawaí no início de domingo, enquanto choveu forte e ventos fortes atingiam o estado dos Estados Unidos localizado no Pacífico e autoridades advertiam sobre a possibilidade de inundações perigosas.", "titulo_pt": "Furacão Lala se afasta da ilha grande de hawaí", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 106418, "titulo": "Belgium races to tame huge wildfire creeping toward Germany", "url": "https://phys.org/news/2026-08-belgium-huge-wildfire-germany.html", "fonte_id": "phys_org", "data_pub": "2026-08-16T19:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aeronaves de bombeamento de água e tratores de agricultores se uniram aos bombeiros para controlar o maior incêndio florestal da história moderna da Bélgica, que está consumindo vastas áreas de uma reserva natural difícil de acessar perto da fronteira com a Alemanha.", "titulo_pt": "Bélgica corre contra o relógio para domar grande incêndio avançando em direção à Alemanha", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 106162, "titulo": "Gatos mais mansos ao longo dos séculos? Estudo dá pista sobre felinos", "url": "https://exame.com/ciencia/gatos-mais-mansos-ao-longo-dos-seculos-estudo-da-pista-sobre-felinos/", "fonte_id": "exame", "data_pub": "2026-08-16T18:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo sugere que gatos podem ter se tornado mais mansos ao longo dos séculos, ajustando seu comportamento de acordo com as condições do ambiente. Diferentemente de muitas espécies, os gatos conseguem modificar seu comportamento de acordo com o ambiente em que vivem.", "titulo_pt": "Gatos mais mansos ao longo dos séculos? Estudo dá pista sobre felinos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 106419, "titulo": "A small squeeze reveals new clues about an unusual kind of magnet", "url": "https://phys.org/news/2026-08-small-reveals-clues-unusual-kind.html", "fonte_id": "phys_org", "data_pub": "2026-08-16T18:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade Rice descobriram que suavemente comprimir um cristal de sulfeto de ferro pode alterar simultaneamente duas de suas propriedades incomuns: seu sinal magnético pequeno e o modo como a eletricidade se move nele. O resultado fornece uma visão mais clara de como um novo tipo de material magnético funciona e sugere uma maneira simples de controlar seu comportamento.", "titulo_pt": "Um leve aperto revela novas pistas sobre um tipo incomum de magneto", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 106015, "titulo": "Gene-edited beagles produce no detectable major dog allergen, early tests find", "url": "https://phys.org/news/2026-08-gene-beagles-major-dog-allergen.html", "fonte_id": "phys_org", "data_pub": "2026-08-16T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cães beagle geneticamente editados não produzem o principal alérgeno canino, conhecido como Can f 1, em testes iniciais. Isso oferece uma promessa de reduzir a exposição a alérgenos caninos e possivelmente aliviar os sintomas de alergia a cães.", "titulo_pt": "Cães beagle geneticamente editados não produzem alérgeno canino detectável", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 106016, "titulo": "Phytophthora dieback linked to habitat loss and lower digging activity among quendas in Western Australia", "url": "https://phys.org/news/2026-08-phytophthora-dieback-linked-habitat-loss.html", "fonte_id": "phys_org", "data_pub": "2026-08-16T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa da Universidade Murdoch descobriu que a doença fúngica Phytophthora dieback, introduzida no Brasil, está indiretamente prejudicando quendas na floresta de jarrah da Western Australia ao reduzir a qualidade do habitat e diminuir a atividade de escavação desses animais. O estudo foi publicado na revista Austral Ecology.", "titulo_pt": "Doença fúngica prejudica quendas na Western Australia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 106168, "titulo": "DNA explica por que viúvas-negras devoram os machos durante o acasalamento", "url": "https://exame.com/ciencia/dna-explica-por-que-viuvas-negras-devoram-os-machos-durante-o-acasalamento/", "fonte_id": "exame", "data_pub": "2026-08-16T17:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que o comportamento de autossacrifício do macho durante o acasalamento está associado a um cromossomo sexual e pode melhorar o sucesso reprodutivo. Este comportamento é ligado a um cromossomo sexual e pode aumentar a fertilidade dos descendentes.", "titulo_pt": "DNA explica por que fêmeas negras realizam o autossacrifício durante o acasalamento", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 105612, "titulo": "Cientistas derretem diamante para entender interior de outros planetas", "url": "https://www.metropoles.com/ciencia/cientistas-derretem-diamante-para-entender-interior-de-outros-planetas", "fonte_id": "metropoles", "data_pub": "2026-08-16T17:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas submeteram diamante a altas pressões e observaram que sua estrutura resistiu até o início da fusão, fornecendo insights sobre o interior de planetas.", "titulo_pt": "Cientistas derretem d bal e acelera expansão", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/energia-solar-supera-marco-global-e-acelera-expansao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-16T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A energia solar expandiu rapidamente, atingindo 100 gigawatts em 2012 e um terawatt em 2022. O próximo terawatt foi instalado em menos de três anos, e a capacidade atingiu 3 terawatts em 2026.", "titulo_pt": "Energia solar supera marco global e acelera expansão", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 106153, "titulo": "Quase 200 mil pessoas no Havaí ficam sem energia após o furacão Lala", "url": "https://www.cnnbrasil.com.br/internacional/quase-200-mil-pessoas-no-havai-ficam-sem-energia-apos-o-furacao-lala/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-16T19:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O furacão Lala atingiu a ilha grande do Havaí com ventos e chuvas fortes, deixando cerca de 199.000 pessoas sem energia. A tempestade foi rebaixada para tempestade tropical, mas ainda apresenta condições de risco.", "titulo_pt": "Quase 200 mil pessoas no Havaí ficam sem energia após a tempestade tropical Lala", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 105659, "titulo": "Lucas, un estudiante de 14 años, creó bandejas biodegradables con cáscaras de yuca para reemplazar al telgopor y reducir la contaminación plástica", "url": "https://www.clarin.com/estados-unidos/lucas-estudiante-14-anos-creo-bandejas-biodegradables-cascaras-yuca-reemplazar-telgopor-reducir-contaminacion-plastica_0_JUn9FRxz4F.html", "fonte_id": "clarin", "data_pub": "2026-08-16T17:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudante de 14 anos do Brasil criou bandejas biodegradáveis a partir de cáscaras de yuca como alternativa ao telgopor. As bandejas podem se degr oto-de-magnitude-77-deixa-53-mortos-e-mais-de-5-mil-desabrigados-na-indonesia/", "fonte_id": "exame", "data_pub": "2026-08-16T13:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um terremoto de magnitude 7,7 causou 53 mortes e deixou mais de 5 mil pessoas desabrigadas na Indonésia. O tremor atingiu a ilha de Flores, resultando em 135 feridos e continuam os trabalhos de busca, resgate e atendimento às vítimas.", "titulo_pt": "Terremoto de magnitude 7,7 deixa 53 mortos e mais de 5 mil desabrigados na Indonésia", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 104402, "titulo": "'O planeta em que nascemos não existe mais': o climatologista que alerta para epidemia de eventos climáticos extremos, mas se mantém otimista", "url": "https://www.bbc.com/portuguese/articles/crk5rx4y3xvo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-16T09:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um climatologista alerta para a aceleração dos eventos climáticos extremos devido às mudanças climáticas, destacando que o hemisfério norte está aquecendo quase duas vezes mais rápido que o sul. Apesar das preocupações, o cientista mantém uma postura otimista.", "titulo_pt": "O planeta em que nascemos não existe mais: o climatologista que alerta para eventos climáticos extremos, mas se mantém otimista", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 104244, "titulo": "Buscas por sobreviventes continuam após forte terremoto na Indonésia", "url": "https://www.cnnbrasil.com.br/internacional/buscas-por-sobreviventes-continuam-apos-forte-terremoto-na-indonesia/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-16T08:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Buscas por sobreviventes continuam após um forte terremoto de magnitude 7,7 na Indonésia. Equipes de resgate estão vasculhando os escombros de edifícios que desabaram.", "titulo_pt": "Buscas por sobreviventes continuam após forte terremoto na Indonésia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 104888, "titulo": "New satellite images show Europe’s disappearing rivers due to drought", "url": "https://www.aljazeera.com/news/2026/8/16/new-satellite-images-show-europes-disappearing-rivers-due-to-drought?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-16T07:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novas imagens de satélite mostram que metade da Europa está em estado de seca, com rios como o Danúbio e o Rin também afetados.", "titulo_pt": "Novas imagens de satélite mostram Europa em seca com rios em baixo nível", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 104628, "titulo": "Destroyed crops, riverbed cyclists and a ‘Rock of Starvation’: how drought has devastated the Danube", "url": "https://www.theguardian.com/news/ng-interactive/2026/aug/16/danube-drought-destroyed-crops-rock-of-starvation-climate-crisis", "fonte_id": "guardian_world", "data_pub": "2026-08-16T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A seca no Danúbio tem causado danos significativos, com culturas destruídas e ciclistas percorrendo leitos de rios. O 'Pedregulho da Fome', um rochedo que emerge durante períodos de baixa água, está de novo visível em Budapeste, um sinal histórico de escassez de água e perigo de fome.", "titulo_pt": "Pedregulho da fome, ciclistas nos leitos e seca devastadora no danúbio", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 104642, "titulo": "EE.UU.: Inundaciones en Indiana dejan al menos seis muertos y obligan a rescatar a decenas de personas", "url": "https://www.latercera.com/mundo/noticia/eeuu-inundaciones-en-indiana-dejan-al-menos-seis-muertos-y-obligan-a-rescatar-a-decenas-de-personas/", "fonte_id": "la_tercera", "data_pub": "2026-08-16T04:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Inundações em cion_ar", "data_pub": "2026-08-16T21:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma nova norma migratória pode deixar fora dos Estados Unidos por até 10 anos pessoas com ajuste de estatus pendente que viajem com Advance Parole. A medida entrará em vigor no dia 13 de agosto.", "titulo_pt": "Nova norma migratória pode deixar 10 anos fora dos EUA a migrantes com estatus pendente", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 106318, "titulo": "Alegatos de racismo y acoso: lo que se sabe tras la muerte de Jason Arday, exprofesor de Cambridge acusado de plagio", "url": "https://www.latercera.com/mundo/noticia/alegatos-de-racismo-y-acoso-lo-que-se-sabe-tras-la-muerte-de-jason-arday-exprofesor-de-cambridge-acusado-de-plagio/", "fonte_id": "la_tercera", "data_pub": "2026-08-16T20:25:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ex-professor de Cambridge, Jason Arday, foi acusado de plágio e a situação envolve alegações de racismo e acoso. O primeiro-ministro do Reino Unido, Andy Burnham, considerou a situação uma tragédia em muitos níveis.", "titulo_pt": "Alegações de racismo e acoso: o que se sabe após a morte de Jason Arday, ex-professor de Cambridge acusado de plágio", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 106398, "titulo": "Remains of Palestinian teen shot by Israeli forces recovered in Gaza", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/remains-palestinian-teen-shot-israeli-forces-recovered-gaza", "fonte_id": "middle_east_eye", "data_pub": "2026-08-16T19:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Palestine Red Crescent Society recuperou o corpo de um adolescente palestino, Suhail Masoud Shalouf, de 14 anos, morto pelos forças israelenses em Gaza. O incidente ocorreu na al-Tina Street, próximo a Khan Younis.", "titulo_pt": "Restos mortais de adolescente palestino morto por forças israelenses recuperados em Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 105843, "titulo": "'We were petrified': Afghan women on the tragic day the Taliban came back", "url": "https://www.lemonde.fr/en/summer-reads/article/2026/08/16/we-were-petrified-afghan-women-on-the-tragic-day-the-taliban-came-back_6756566_183.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-16T17:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cinco anos após o retorno do governo do Taliban e a imposição de sua versão ultrapassada do direito islâmico, uma repórter especial da publicação conversou com mulheres afegãs quase invisíveis sobre suas medos diários, a opressão familiar, os casamentos forçados e seus sonhos roubados.", "titulo_pt": "Vozes de mulheres afegãs: o dia trágico em que o Taliban voltou", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 105998, "titulo": "Hong Kong boy, 14, arrested for animal cruelty after badly injured cat dies", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3364188/hong-kong-boy-14-arrested-animal-cruelty-after-badly-injured-cat-dies?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-16T10:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um adolescente de 14 anos de Hong Kong foi preso suspeito de maus-tratos após levar um gato gravemente ferido a um clínico veterinário, que posteriormente morreu. A polícia recebeu uma denúncia de um empregado de uma clínica veterinária em Cheung Sha Wan no dia 10 de agosto, às 18h25, sobre suspeita de maus-tratos ao animal.", "titulo_pt": "Menino de 14 anos de hong Kong é preso por maus-tratos após levar gato ferido a clínica que morreu", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 105910, "titulo": "Doctor describes amputating girl’s leg in Gaza without anaesthesia", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/16/doctor-describes-amputating-girls-leg-in-gaza-without-an let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);

  const arts = D.resumo_do_dia[topico] || [];

              }).join("")}

        }).join("")}
      </div>`

    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  const d = D.destaque;

  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}

  }).join("");
  return `<div>

    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>

    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

function proximaAtualizacao() {

  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;
