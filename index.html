 "classe": "A"}, {"id": 75219, "titulo": "HLB Pep advances US push with vasopressin filing", "url": "https://www.koreaherald.com/article/10821769", "fonte_id": "korea_herald", "data_pub": "2026-07-27T07:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "HLB Pep registrou seu ingrediente farmacêutico ativo vasopressin nos sistemas de Arquivo do Substancial de Medicamento do FDA dos EUA, avançando sua entrada no mercado global de medicamentos peptídicos. Vasopressin é usado para tratar choque séptico e hipotensão severa.", "titulo_pt": "HLB Pep avança com registro de vasopressin nos EUA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 74824, "titulo": "Estudo: diagnóstico de câncer de cabeça e pescoço é tardio em 70% dos casos", "url": "https://www.cnnbrasil.com.br/saude/estudo-diagnostico-de-cancer-de-cabeca-e-pescoco-e-tardio-em-70-dos-casos/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-27T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo indica que 70% dos casos de câncer de cabeça e pescoço são diagnosticados a um estágio tardio. O diagnóstico precoce é ressaltado como importante, com diferenças observadas entre pacientes atendidos pelo SUS e pela rede privada.", "titulo_pt": "Estudo: 70% dos casos de câncer de cabeça e pescoço são diagnosticados a um estágio tardio", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 75241, "titulo": "Whales at risk, hungry pelicans: Marine heat wave hits California", "url": "https://phys.org/news/2026-07-whales-hungry-pelicans-marine-california.html", "fonte_id": "phys_org", "data_pub": "2026-07-27T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em águas californianas, a pesquisadora Sara Lesser observa menos grupos de golfinhos este verão devido ao calor extremo. Uma onda marinha de calor está afetando a região.", "titulo_pt": "Baleias em risco, pelicanos famintos: onda marítima de calor atinge califórnia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 75208, "titulo": "Korea eyes global fandom leadership with 11-day mega event launching in 2027", "url": "https://www.koreaherald.com/article/10821975", "fonte_id": "korea_herald", "data_pub": "2026-07-27T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em dezembro de 2027, uma festival cultural coreano chamado Fanomenon, que se centrará nas fandoms, terá duração de 11 dias. O evento incluirá premiações, concertos e outras atividades e será organizado pelo Comitê Presidencial para Trocas Culturais Populares, com a participação do fundador da JYP Entertainment, J.Y. Park.", "titulo_pt": "Coreia planeja liderar fãs globais com festival de 11 dias em 2027", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 75299, "titulo": "A Guerrilla Girl Drops Her Mask", "url": "https://hyperallergic.com/a-guerrilla-girl-drops-her-mask/", "fonte_id": "hyperallergic", "data_pub": "2026-07-27T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Joyce Kozloff se torna a primeira membro pública do coletivo feminista. Um AI company está colocando seu nome em uma escola de arte.", "titulo_pt": "A guerrilha Girl desiste de seu máscara", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 75004, "titulo": "The Preacher", "url": "https://www.theatlantic.com/ideas/2026/07/feature-governor-wes-moore/687804/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-07-27T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Wes Moore não veio para salvar o Partido Democrata.", "titulo_pt": "O profeta", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 75290, "titulo": "Unauthorised version of Christopher Nolan’s Odyssey shared on X", "url": "https://www.theguardian.com/film/2026/jul/27/unauthorised-version-of-christopher-nolans-odyssey-shared-on-x", "fonte_id": "guardian_culture", "data_pub": "2026-07-27T09:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um vazamento não autorizado de uma versão do filme 'A Odisséia' dirigido por Christopher Nolan foi compartilhado no aplicativo X, sendo visualizado mais de 3 milhões de vezes antes de ser removido. O post que noticiou a existência do vazamento se tornou viral com mais de 3 milhões de visualizações.", "titulo_pt": "Versão não autorizada de 'a odisséia' compartilhada no X", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 75283, "titulo": "Bill Oddie, naturalist and broadcaster, dies aged 85", "url": "https://www.theguardian.com/tv-and-radio/2026/jul/27/bill-oddie-naturalist-and-broadcaster-dies", "fonte_id": "guardian_culture", "data_pub": "2026-07-27T09:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bill Oddie, um escritor, comediante e conservacionista britânico conhecido por sua expertise em vida selvagem, faleceu aos 85 anos. Ele se tornou famoso inicialmente como membro do grupo de comédia The Goodies, mas posteriormente se estabeleceu como apresentador de programas de televisão sobre natureza, incluindo BBC Springwatch e Autumnwatch.", "titulo_pt": "Bill Oddie, naturalista e apresentador de tv, morre aos 85 anos", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 75327, "titulo": "The Time Johnny Cash Almost Started a Prison Riot at San Quentin", "url": "https://lithub.com/the-time-johnny-cash-almost-started-a-prison-riot-at-san-quentin/", "fonte_id": "lithub", "data_pub": "2026-07-27T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto destaca a importância de fornecer esperança e incentivo aos presos para que se tornem cidadãos melhores durante o tempo que passam na prisão. Há menção implícita a um incidente envolvendo Johnny Cash em San Quentin, mas não há detalhes específicos sobre esse evento.", "titulo_pt": "O tempo em que Johnny Cash quase causou uma revolta prisional em San Quentin", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 75328, "titulo": "On Reckoning With the Literary World’s Unacknowledged Class System", "url": "https://lithub.com/on-reckoning-with-the-literary-worlds-unacknowledged-class-system/", "fonte_id": "lithub", "data_pub": "2026-07-27T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor se sente deslocado ao entrar em salas onde há muitos escritores, devido à sua origem imigrante e familiar modesta. Ele é o primeiro da família a frequentar uma universidade e seu pai era um soldador.", "titulo_pt": "Sobre lidar com o sistema de classes não reconhecido do mundo literário", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 75329, "titulo": "This Week in Literary History: Robert Frost’s “The Road Not Taken” is Published in The Atlantic Monthly", "url": "https://lithub.com/this-week-in-literary-history-robert-frosts-the-road-not-taken-is-published-in-the-atlantic-monthly/", "fonte_id": "lithub", "data_pub": "2026-07-27T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O poema mais famoso de Robert Frost, 'The Road Not Taken', causou confusão desde seu primeiro aparecimento. A publicação do poema ocorreu no The Atlantic Monthly em 1915.", "titulo_pt": "Esta semana na história literária: o 'caminho não tomado' de robert Frost é publicado no The Atlantic Monthly", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 75330, "titulo": "Why Black Americans Need Reparations Now", "url": "https://lithub.com/why-black-americans-need-reparations-now/", "fonte_id": "lithub", "data_pub": "2026-07-27T09:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autora, de origem haitiana americana, ouviu histórias de resistência desde a infância. Ao crescer, essas narrativas passaram a ser mais diretas.", "titulo_pt": "Por que os americanos de ascendência negra precisam de reparações agora", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 75331, "titulo": "What Barriers Do Women in Science Face When Trying to Publish?", "url": "https://lithub.com/what-barriers-do-women-in-science-face-when-trying-to-publish/", "fonte_id": "lithub", "data_pub": "2026-07-27T09:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autora frequentou o ensino médio e a universidade durante os anos de maior ativismo feminista, nos anos 1970. Ela sabia que o sexismo era um problema, mas acreditava que estava sendo resolvido.", "titulo_pt": "Quais barreiras as mulheres na ciência enfrentam ao tentar publicar?", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 75302, "titulo": "RSHP unveils tripartite Shanghai skyscraper informed by historical laneways", "url": "https://www.dezeen.com/2026/07/27/rshps-one-shanghai-tower/", "fonte_id": "dezeen", "data_pub": "2026-07-27T09:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de arquitetura britânica RSHP concluiu o One Shanghai, um arranha-céu multifuncional de 186 metros no centro de Shanghai, China. Inspirado pela malha viária histórica das vielas da cidade, o edifício de 38 andares contém espaços de escritório, comércio e áreas públicas.", "titulo_pt": "RSHP revela arranha-céu tripartido em Shanghai inspirado nas vielas históricas", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 74738, "titulo": "Preocupada com audiência abaixo do esperado, Globo relança reprise de 'Avenida Brasil'", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/07/preocupada-com-audiencia-abaixo-do-esperado-globo-relanca-reprise-de-avenida-brasil.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-07-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Globo relançou a reprise da novela 'Avenida Brasil' (2012) no Vale a Pena Ver de Novo, após registrar baixa audiência desde o início. A emissora admite internamente que os números estão abaixo do esperado.", "titulo_pt": "Globo relança reprise de 'Avenida Brasil' por causa de baixa audiência", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 75284, "titulo": "‘The plane movie I’ll watch anytime’: why Up in the Air is my feelgood movie", "url": "https://www.theguardian.com/film/2026/jul/27/up-in-the-air-george-clooney-movie", "fonte_id": "guardian_culture", "data_pub": "2026-07-27T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor descreve por que Up in the Air é seu filme confortável preferido, apreciando a atmosfera de conexões e encontros nas aeroportos. O filme, dirigido por Jason Reitman e baseado em um livro, foi lançado em 2009.", "titulo_pt": "O filme de avião que eu assisto sempre: por que Up in the Air é meu filme confortável", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 75285, "titulo": "Glitched into empty space: why video games are obsessed with the Backrooms", "url": "https://www.theguardian.com/games/2026/jul/27/video-games-obsessed-backrooms", "fonte_id": "guardian_culture", "data_pub": "2026-07-27T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O filme de horror de 2026 teve suas origens na descoberta dos desenvolvedores do jogo 'noclip', que permitiu a exploração de espaços virtuais ocultos. O conceito surgiu em um fórum da 4chan em maio de 2019 com uma foto de uma sala vazia e posteriormente se expandiu para outros jogos.", "titulo_pt": "Corrompido no vazio: por que os videogames estão fascinados pelos Backrooms", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 75332, "titulo": "“Copernicus Is Dying”", "url": "https://lithub.com/title-2/", "fonte_id": "lithub", "data_pub": "2026-07-27T08:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um caixa magro de Petco com penteado loiro afiado afirma que está falando a verdade e que há uma escassez generalizada. O autor observa o nome no crachá do funcionário.", "titulo_pt": "Copérnico está morrendo", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 74931, "titulo": "Consulado de México en Illinois: abren citas para el operativo móvil que empieza esta semana", "url": "https://www.lanacion.com.ar/estados-unidos/illinois/consulado-de-mexico-en-illinois-abren-citas-para-el-operativo-movil-que-empieza-esta-semana-nid27072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-27T08:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O consulado do México em Urbana, Illinois, está agendando consultas para um operativo móvel que ocorrerá de 28 de julho a 1º de agosto. Quatro serviços estarão disponíveis durante esse período.", "titulo_pt": "Consulado do México em Illinois: agende consultas para o operativo móvel que começa nesta semana", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}], "cultura__eventos": [], "sociedade": [{"id": 74940, "titulo": "Las preguntas e incertidumbres que deja el Plan Integral de Vivienda y Urbanismo", "url": "https://www.latercera.com/opinion/noticia/las-preguntas-e-incertidumbres-que-deja-el-plan-integral-de-vivienda-y-urbanismo/", "fonte_id": "la_tercera", "data_pub": "2026-07-27T10:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O plano integral de habitação e urbanismo levanta várias perguntas e incertezas. O documento não fornece detalhes específicos sobre os desafios ou conclusões finais.", "titulo_pt": "As dúvidas e incertezas deixadas pelo plano Integral de habitação e Urbanismo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 74766, "titulo": "Jovem de 21 anos é morto a tiros em loja de conveniência no Entorno", "url": "https://www.metropoles.com/distrito-federal/na-mira/jovem-de-21-anos-e-morto-a-tiros-em-loja-de-conveniencia-no-entorno", "fonte_id": "metropoles", "data_pub": "2026-07-27T09:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um jovem de 21 anos foi morto a tiros em uma loja de conveniência em Formosa, Goiás, no último domingo (25/7). A Polícia Civil está investigando o caso para apurar as motivações e identificar o suspeito.", "titulo_pt": "Jovem de 21 anos é morto a tiros em loja de conveniência em formosa (go)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 74853, "titulo": "La UBA advierte que casi el 50 por ciento de los jóvenes argentinos vive en condiciones de vulnerabilidad", "url": "https://www.clarin.com/sociedad/uba-advierte-50-ciento-jovenes-argentinos-vive-condiciones-vulnerabilidad_0_P5sO2Ij9nH.html", "fonte_id": "clarin", "data_pub": "2026-07-27T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um relatório da Universidade de Buenos Aires indica que 48,9% das pessoas com idades entre 18 e 29 anos estão fora do sistema educativo e laboral. Além disso, há um aumento do fenômeno chamado 'Triple Ni', composto por jovens que nem estudam, nem trabalham e nem buscam emprego.", "titulo_pt": "UBA avisa: quase metade dos jovens argentinos vive em vulnerabilidade", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 74927, "titulo": "Subsidios, justicia social y “cristianismo”: una feroz pelea entre colectiveros por el incentivo al GNC sumó ahora a la interna peronista", "url": "https://www.lanacion.com.ar/economia/subsidios-justicia-social-y-cristinanismo-una-feroz-pelea-entre-colectiveros-por-el-incentivo-al-gnc-nid27072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-27T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Quatro câmaras empresariais pediram ao governo da província de Buenos Aires que parasse com um plano para as unidades a GNC. Um conflito com a prefeita de Moreno reabriu uma divisão dentro de um setor já agitado.", "titulo_pt": "Subsídios, justiça social e 'cristianismo': intensa disputa entre coletivos por incentivo ao GNC soma nowa luta interna peronista", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 75053, "titulo": "Residents who lost their homes go back to piles of rubble and ash on Le Porge's 'Desolation Avenue'", "url": "https://www.lemonde.fr/en/environment/article/2026/07/27/residents-who-lost-their-homes-go-back-to-piles-of-rubble-and-ash-on-le-porge-s-desolation-avenue_6755868_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-27T08:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O incêndio Sauros destruiu a estrada departamental que liga o vilarejo ao penhasco turístico de Cap-Ferret. Autoridades locais buscam soluções para abrigar as pessoas que perderam suas casas.", "titulo_pt": "Moradores que perderam suas casas retornam às ruínas em 'avenida da desolação' de Le Porge", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 74865, "titulo": "A alimentação escolar como política pública de promoção da saúde", "url": "https://www.jota.info/opiniao-e-analise/colunas/advogadas-publicas-em-debate/a-alimentacao-escolar-como-politica-publica-de-promocao-da-saude", "fonte_id": "jota", "data_pub": "2026-07-27T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Resolução CD/FNDE 4/2026 enfatiza a importância do Estado na promoção de hábitos alimentares saudáveis por meio da alimentação escolar.", "titulo_pt": "A alimentação escolar como política pública de promoção da saúde", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 74845, "titulo": "As mulheres vítimas de violência doméstica que mataram seus companheiros: 'Ele disse que ia me matar, matar meu filho e depois se matar'", "url": "https://www.bbc.com/portuguese/articles/c89qe9k5xl8o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-07-27T07:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Milene e Úrsula mataram seus companheiros alegando legítima defesa após sofrerem violência doméstica. Os casos estão sendo julgados pelas autoridades para determinar se as reações foram proportionais às ameaças recebidas.", "titulo_pt": "Mulheres que mataram parceiros após violência doméstica: 'ele disse que IA me matar, matar meu filho e depois se matar'", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 75139, "titulo": "Tough new permanent residency measures trigger concern in Japan", "url": "https://www.japantimes.co.jp/news/2026/07/27/japan/japan-permanent-residency-rules-reaction/", "fonte_id": "japan_times", "data_pub": "2026-07-27T07:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O projeto de diretrizes estabeleceria requisitos mais claros sobre renda, aposentadoria, língua e integração, enquanto o governo procura endurecer os controles migratórios permanentes.", "titulo_pt": "Novas medidas permanentes de residência rigorosas causam preocupação no Japão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 74798, "titulo": "Golpes viram epidemia e crimes violentos seguem em patamares altos, diz especialista", "url": "https://exame.com/brasil/golpes-viram-epidemia-e-crimes-violentos-seguem-em-patamares-altos-diz-especialista/", "fonte_id": "exame", "data_pub": "2026-07-27T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O especialista Leonardo Silva, coordenador do Fórum Brasileiro de Segurança Pública, afirma que os golpes viraram uma epidemia no Brasil e que a violência criminosa permanece alta. Ele destaca a necessidade de integração entre polícias, União e setor privado para combater esses crimes.", "titulo_pt": "Golpes se tornam epidemia e crimes violentos mantêm patamares altos, diz especialista", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 75158, "titulo": "Child Maintenance Systems Failing Single Mothers in the Balkans and Beyond", "url": "https://balkaninsight.com/2026/07/27/child-maintenance-systems-failing-single-mothers-in-the-balkans-and-beyond/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-07-27T05:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em muitos casos, ex-maridos ou homens separados não estão pagando a pensão alimentícia, ou estão pagando menos do que o devido e com atraso, sobrecarregando as mães solteiras financeiramente.", "titulo_pt": "Sistemas de manutenção infantil falhando com mães solteiras na bósnia e além", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 74949, "titulo": "Tiroteo deja múltiples víctimas durante festival gastronómico en Seattle y desata amplio operativo policial", "url": "https://www.latercera.com/mundo/noticia/tiroteo-deja-multiples-victimas-durante-festival-gastronomico-en-seattle-y-desata-amplio-operativo-policial/", "fonte_id": "la_tercera", "data_pub": "2026-07-27T02:53:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um tiroteio ocorreu durante o encerramento do festival gastronómico Bite of Seattle, resultando em múltiplas vítimas. Autoridades estão realizando uma investigação e pediram que as pessoas evitassem a área afetada.", "titulo_pt": "Tiroteio causa várias vitimas durante festival gastronômico em Seattle e desencadeia amplo operativo policial", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 74389, "titulo": "ICE y FBI: los correos internos que abren dudas sobre quién investigará las agresiones a agentes migratorios", "url": "https://www.lanacion.com.ar/estados-unidos/ice-y-fbi-los-correos-internos-que-abren-dudas-sobre-quien-investigara-las-agresiones-a-agentes-nid26072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-27T02:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Correios internos sugerem que o FBI passaria a investigação de agressões contra agentes migratórios para o ICE, mas o DHS negou isso.", "titulo_pt": "FBI e ICE: correios internos levantam dúvidas sobre quem investigará agressões a agentes migratórios", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 74392, "titulo": "Los movimientos sociales y las centrales obreras apuestan a la manifestación por San Cayetano", "url": "https://www.lanacion.com.ar/politica/los-movimientos-sociales-y-las-centrales-obreras-apuntan-a-la-manifestacion-por-san-cayetano-nid26072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-27T01:38:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Haverá uma manifestação com o objetivo de marcar os 10 anos da primeira marcha realizada pelo dia do patrono do trabalho. A agenda de conflitos, que está em crescimento, será abordada durante a mobilização.", "titulo_pt": "Movimentos sociais e centrais sindicais apostam na manifestação por são Cayetano", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 74401, "titulo": "Qué pasará con la ciudadanía por nacimiento en Texas tras la firma de una orden de Abbott", "url": "https://www.lanacion.com.ar/estados-unidos/texas/que-pasara-con-la-ciudadania-por-nacimiento-en-texas-tras-la-firma-de-una-orden-de-abbott-nid26072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-27T01:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A ordem de Greg Abbott não altera a proteção constitucional da cidadeanidade por nascimento nos Estados Unidos, mas pode afetar processos administrativos locais. O direito à cidadeania por nascimento continua garantido pela Constituição dos EUA.", "titulo_pt": "O que muda com a ordem de Abbott sobre cidadania por nascimento em Texas?", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 74279, "titulo": "Homem ateia fogo na ex-companheira e deixa mulher gravemente ferida no DF", "url": "https://www.metropoles.com/distrito-federal/homem-ateia-fogo-na-ex-companheira-e-deixa-mulher-gravemente-ferida-no-df", "fonte_id": "metropoles", "data_pub": "2026-07-27T00:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um suspeito jogou álcool sobre a ex-companheira e ateou fogo nela, resultando em ferimentos graves. O incidente ocorreu no Distrito Federal e foi motivado pela recusa do suspeito em aceitar o fim do relacionamento.", "titulo_pt": "Suspeito atinge ex-companheira com ácido e deixa mulher gravemente ferida no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 74282, "titulo": "Após temporal, Defesa Civil envia 11 mil itens de ajuda a Ribeirão Preto", "url": "https://www.metropoles.com/sao-paulo/temporal-em-ribeirao-preto-defesa-civil-envia-11-mil-itens-de-ajuda", "fonte_id": "metropoles", "data_pub": "2026-07-27T00:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O temporal causou destelhamentos, queda de árvores e falta de energia em Ribeirão Preto, registrando 319 raios até sábado (25/7). A Defesa Civil enviou 11 mil itens de ajuda para a cidade.", "titulo_pt": "Defesa Civil envia 11 mil itens de ajuda após temporal em Ribeirão Preto", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 74939, "titulo": "MOP estima hasta US$ 700 millones para reconstrucción en Atacama y Coquimbo tras temporal", "url": "https://www.latercera.com/nacional/noticia/mop-estima-hasta-us-700-millones-para-reconstruccion-en-atacama-y-coquimbo-tras-temporal/", "fonte_id": "la_tercera", "data_pub": "2026-07-27T10:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ministério de Obras Públicas (MOP) estima que a reconstrução nas regiões de Atacama e Coquimbo, afetadas por um temporal, custará até 700 milhões de dólares. Foram registrados danos significativos, incluindo 358 estradas interrompidas, 17 pontes inoperantes e 308 sistemas de água potável rurais paralisados.", "titulo_pt": "MOP estima até r$ 700 milhões para reconstrução em Atacama e Coquimbo após temporal", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 75074, "titulo": "Spain and France wildfires force more than 300,000 to flee as Macron calls crisis meeting", "url": "https://www.cnbc.com/2026/07/27/wildfires-spain-france-bordeaux-heatwave.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-27T09:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Chamas gigantescas no Vale do Bordéus, na França, e na Espanha obrigaram mais de 300 mil pessoas a deixar suas casas. O ministro local disse que o impacto econômico foi como um 'trovão'.", "titulo_pt": "Incêndios na França e Espanha fazem mais de 300 mil pessoas fugirem; Macron convoca reunião para discutir crise", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 74814, "titulo": "Incêndios florestais em Madri seguem “fora de controle”, dizem autoridades", "url": "https://www.cnnbrasil.com.br/internacional/incendios-florestais-em-madri-seguem-fora-de-controle-dizem-autoridades/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-27T09:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Incêndios florestais em Madri continuam fora de controle, segundo autoridades. A velocidade de avanço dos focos de incêndio diminuiu.", "titulo_pt": "Incêndios florestais em Madri seguem ‘fora de controle’, dizem autoridades", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 74773, "titulo": "Clima: frio se mantém no Sul e Sudeste e massa de ar seco se espalha", "url": "https://www.metropoles.com/brasil/clima-frio-se-mantem-no-sul-e-sudeste-e-massa-de-ar-seco-se-espalha", "fonte_id": "metropoles", "data_pub": "2026-07-27T09:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O frio persiste no Sul e Sudeste do Brasil, enquanto uma massa de ar seco se espalha pelo país. Nas regiões com seca severa, as autoridades recomendam manter a hidratação constante e evitar queimadas.", "titulo_pt": "Clima: frio continua no Sul e Sudeste e massa de ar seco avança", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 74781, "titulo": "Ameaça de prejuízo com seca severa deixa economia amazônica em alerta", "url": "https://www.metropoles.com/brasil/ameaca-prejuizo-seca-severa-amazonica", "fonte_id": "metropoles", "data_pub": "2026-07-27T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A economia amazônica está em alerta devido à severa seca, que apresenta alto risco de baixa nos níveis dos rios e pode dificultar o acesso a insumos e a saída de produtos. Em 2023, já ocorreu um prejuízo de R$ 1,4 bilhão.", "titulo_pt": "Ameaça de prejuízo com seca severa coloca economia amazônica em alerta", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 74989, "titulo": "Weather tracker: Why Europe’s wildfires are proving so fierce and difficult to stop", "url": "https://www.theguardian.com/environment/2026/jul/27/weather-tracker-europe-wildfires-difficult-stop-france-spain", "fonte_id": "guardian_world", "data_pub": "2026-07-27T07:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O vento e a temperatura recorde estão alimentando a temporada de incêndios explosivos na Europa, com Espanha e França sendo particularmente afetadas. Uma combinação de inverno úmido, baixa precipitação desde o início do verão e repetidas ondas de calor recordes provavelmente explicam por que os incêndios florestais se iniciaram, se espalharam e resistiram ao controle recentemente em França e Espanha.", "titulo_pt": "Monitoramento do tempo: por que as chamas na Europa estão sendo tão intensas e difíceis de controlar", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 75142, "titulo": "Ebola outbreak in Congo set to become second-largest on record after confirmed cases reach 3,200", "url": "https://www.japantimes.co.jp/news/2026/07/27/world/science-health/ebola-congo-second-largest-cases/", "fonte_id": "japan_times", "data_pub": "2026-07-27T07:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de casos confirmados de Ebola no Congo chegou a 3.200, o que coloca a atual epidemia como a segunda maior na história após a expansão da vigilância e do processo de busca por casos anteriores.", "titulo_pt": "Epidemia de ebola no Congo se aproxima da segunda maior na história com mais de 3.200 casos confirmados", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 75106, "titulo": "Climate change presents new threat to Philippines’ UNESCO rice terraces", "url": "https://www.aljazeera.com/features/2026/7/27/climate-change-presents-new-threat-to-philippines-unesco-rice-terraces?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-27T05:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo possui recursos limitados, o que prejudica os esforços dos habitantes do Ifugao para preservar a área de patrimônio cultural das terras de arroz contra os efeitos do clima extremo.", "titulo_pt": "Mudanças climáticas representam nova ameaça aos terrenos de arroz da UNESCO nas filipinas", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 74990, "titulo": "Pedro Sánchez says Spain is suffering effects of climate crisis as firefighters battle wildfires in France", "url": "https://www.theguardian.com/world/2026/jul/26/firefighters-in-france-battle-to-prevent-huge-blaze-from-approaching-bordeaux", "fonte_id": "guardian_world", "data_pub": "2026-07-27T03:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro espanhol, Pedro Sánchez, alertou que a Espanha e a Península Ibérica estão sofrendo os efeitos da crise climática. Em simultâneo, incêndios florestais em França, especialmente perto de Bordeaux, são combatidos com dificuldade devido às condições ventosas.", "titulo_pt": "Pedro Sánchez diz que Espanha sofre as consequências da crise climática enquanto brigadistas lutam contra incêndios na França", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 74477, "titulo": "Senapred declara alerta roja en comunas de Ñuble por aumento de caudal del río Perquilauquén", "url": "https://www.latercera.com/mundo/noticia/senapred-declara-alerta-roja-en-comunas-de-nuble-por-aumento-de-caudal-del-rio-perquilauquen/", "fonte_id": "la_tercera", "data_pub": "2026-07-27T02:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Senapred declarou um alerta vermelho nas comunas de Ñuble devido ao aumento do caudal no rio Perquilauquén. A medida foi tomada após a estação hidrométrica em San Miguel atingir o limite crítico.", "titulo_pt": "Senapred declara alerta vermelho em comunas de Ñuble por aumento do caudal do rio Perquilauquén", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 74478, "titulo": "Senapred eleva a alerta roja por crecida en cuatro comunas de Ñuble tras aumento crítico de los ríos Chillán y Niblinto", "url": "https://www.latercera.com/nacional/noticia/senapred-eleva-a-alerta-roja-por-crecida-en-cuatro-comunas-de-nuble-tras-aumento-critico-de-los-rios-chillan-y-niblinto/", "fonte_id": "la_tercera", "data_pub": "2026-07-27T02:10:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Senapred elevou a alerta para nível vermelho em quatro comunas de Ñuble devido ao aumento crítico nos níveis dos rios Chillán e Niblinto. Esta medida substitui a alerta amarela vigente e representa um maior risco para a população.", "titulo_pt": "Senapred eleva alerta vermelho em quatro comunas de Ñuble após aumento crítico nos rios Chillán e Niblinto", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 74544, "titulo": "Ebola infections in DR Congo surge to 3,200, with 1,405 deaths", "url": "https://www.aljazeera.com/news/2026/7/27/ebola-infections-in-dr-congo-surge-to-3200-with-1405-deaths?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-27T01:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de infecções pelo Ebola no Congo Democrático aumentou para 3.200, com 1.405 mortes, em apenas dez dias. O surto continua se espalhando por cinco províncias.", "titulo_pt": "Infectados pelo ebola no Congo democrático chegam a 3.200, com 1.405 mortos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 74599, "titulo": "Wildfires threaten Bordeaux as France and Spain battle blazes", "url": "https://www.japantimes.co.jp/news/2026/07/27/world/wildfires-bordeaux-france-spain/", "fonte_id": "japan_times", "data_pub": "2026-07-27T00:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos florestais ameaçam Bordeaux enquanto França e Espanha lutam contra incêndios. Os incêndios são os últimos desastres relacionados a uma estiagem prolongada e sucessivas ondas de calor, intensificados pela mudança climática, segundo cientistas.", "titulo_pt": "Fogos ameaçam Bordeaux enquanto França e Espanha lutam contra as chamas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 73991, "titulo": "Typhoon Noul weakens as it lashes southern China", "url": "https://www.taipeitimes.com/News/front/archives/2026/07/27/2003861439", "fonte_id": "taipei_times", "data_pub": "2026-07-27T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O furacão Noul enfraqueceu enquanto atingia o sul da China com fortes ventos e chuvas intensas.", "titulo_pt": "Typhoon Noul enfraquece ao castigar sul da China", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 74257, "titulo": "Onda de calor e mudanças climáticas já afetam produção de azeite no Alentejo", "url": "https://veja.abril.com.br/comportamento/onda-de-calor-e-mudancas-climaticas-ja-afetam-producao-de-azeite-no-alentejo/", "fonte_id": "veja", "data_pub": "2026-07-26T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A região do Alentejo, conhecida pelo plantio de oliveiras e parreiras, tem sido afetada pela onda de calor e mudanças climáticas, impactando a produção de azeite.", "titulo_pt": "Onda de calor e mudanças climáticas já afetam produção de azeite no Alentejo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 73896, "titulo": "France fires: 'What burns is not just forests, but a way of inhabiting the land that is no longer possible'", "url": "https://www.lemonde.fr/en/opinion/article/2026/07/26/france-fires-what-burns-is-not-just-forests-but-a-way-of-inhabiting-the-land-that-is-no-longer-possible_6755855_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-26T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Philósofos e políticos franceses argumentam que a preparação para os incêndios florestais atuais não se limita à adaptação técnica, mas pode se tornar um ato democrático. Essa perspectiva sugere que o enfrentamento dos incêndios é mais do que uma questão de segurança, envolvendo também questões sociais e políticas.", "titulo_pt": "Incêndios florestais na França: 'o que arde não são apenas as florestas, mas um modo de habitar a terra que já não é possível'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 74765, "titulo": "Lei cria cadastro de condenados por violência contra a mulher no DF", "url": "https://www.metropoles.com/distrito-federal/lei-cria-cadastro-de-condenados-por-violencia-contra-a-mulher-no-df", "fonte_id": "metropoles", "data_pub": "2026-07-27T10:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A lei criará um cadastro distrital para condenados por violência contra a mulher no Distrito Federal, contendo informações como nome, foto, CPF, RG, endereço e detalhes da condenação. O acesso será restrito às autoridades.", "titulo_pt": "Lei cria cadastro de condenados por violência contra a mulher no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 75136, "titulo": "Concerns increasing over radio for abductees in North Korea", "url": "https://www.japantimes.co.jp/news/2026/07/27/japan/north-korea-abductees-radio/", "fonte_id": "japan_times", "data_pub": "2026-07-27T08:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O rádio que transmite mensagens para refugiados abduzidos na Coreia do Norte pode ser interrompido devido ao equipamento obsoleto, à diminuição da necessidade dessas estações e às tensões no Oriente Médio.", "titulo_pt": "Temores crescentes sobre o rádio para refugiados abduzidos na Coreia do norte", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 75087, "titulo": "Pregnant Palestinian woman loses child after Israeli forces obstruct ambulance", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/pregnant-palestinian-woman-miscarries-after-israeli-forces-obstruct", "fonte_id": "middle_east_eye", "data_pub": "2026-07-27T07:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher palestiniana grávida da cidade de Qaryut, perto de Nablus, perdeu seu bebê após forças israelenses obstruírem a passagem de uma ambulância no checkpoint militar Awarta. Segundo relatos, os médicos foram impedidos de passar e um membro da equipe médica foi detido enquanto a grávida, que estava na sexta semana de gestação, sofreu uma busca intensa.", "titulo_pt": "Mulher grávida palestiniana perde bebê após forças israelenses obstruírem ambulância", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 75145, "titulo": "Gaza teen triumphs in school despite war, loss and displacement", "url": "https://www.japantimes.co.jp/news/2026/07/27/world/society/gaza-teen-war-loss-displacement/", "fonte_id": "japan_times", "data_pub": "2026-07-27T06:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Saba Rabah, 18 anos, se destacou como a aluna com melhor nota na prova nacional de escola secundária do stream de ciências em Palestine.", "titulo_pt": "Teen de gaza se destaca nas provas apesar da guerra e deslocamento", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 75197, "titulo": "Myanmar military escalates civilian killings under new command, monitor reports", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3361955/myanmar-military-escalates-civilian-killings-under-new-command-monitor-reports?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-27T05:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O monitoramento de conflitos relatou que as forças militares myanmarenses intensificaram os ataques contra civis desde a posse da nova administração no país, afetado por conflitos. Essa escalada ocorre enquanto governos regionais aumentam suas iniciativas diplomáticas.", "titulo_pt": "Exército de myanmar intensifica assassinatos de civis sob nova administração, monitoramento relata", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 75152, "titulo": "Rohingya schools in Malaysia face closures amid online surge in hate speech", "url": "https://www.japantimes.co.jp/news/2026/07/27/asia-pacific/malaysia-rohingya-schools-hate-speech/", "fonte_id": "japan_times", "data_pub": "2026-07-27T04:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As escolas rohingya em Malásia podem enfrentar fechamentos devido ao aumento online de discurso de ódio. A Malásia não reconhece oficialmente os rohingyas como refugiados, classificando-os como imigrantes que entraram no país ilegalmente.", "titulo_pt": "Escolas rohingya em malásia enfrentam fechamentos devido ao aumento online de discurso de ódio", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 73990, "titulo": "Berlin Pride attack believed to be act of Islamic terror", "url": "https://www.taipeitimes.com/News/front/archives/2026/07/27/2003861438", "fonte_id": "taipei_times", "data_pub": "2026-07-27T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há suspeitas de que o ataque durante const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;

  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
