tina", "classe": "C"}, {"id": 272400, "titulo": "“¿Cuánto vale cuidar una vida?”: médicos residentes marcharon por mejores salarios", "url": "https://www.lanacion.com.ar/sociedad/cuanto-vale-cuidar-una-vida-medicos-residentes-marcharon-por-mejores-salarios-nid18112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-18T17:45:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Médicos residentes de diferentes sistemas de saúde argentinos realizaram uma marcha para exigir reajustes salariais e melhorias nas condições de trabalho.", "titulo_pt": "Quanto vale cuidar uma vida? Médicos residentes realizam manifestação por melhores salários", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 272277, "titulo": "Polícia investiga morte de pichador após perseguição em prédio de SP", "url": "https://www.metropoles.com/sao-paulo/policia-investiga-morte-de-pichador-apos-perseguicao-em-predio-de-sp", "fonte_id": "metropoles", "data_pub": "2026-11-18T17:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Imagens mostram a perseguição de um grupo ao pichador após uma intervenção em um prédio em São Paulo. O pichador, conhecido como Olodum, foi encontrado morto após desaparecer.", "titulo_pt": "Polícia investiga morte de pichador após perseguição em prédio de SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 272278, "titulo": "GDF troca gestão do Hvep e promete aumento de 25% nos atendimentos", "url": "https://www.metropoles.com/distrito-federal/gdf-troca-gestao-do-hvet-e-promete-aumento-de-25-no-numero-de-atendimentos", "fonte_id": "metropoles", "data_pub": "2026-11-18T17:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo do Distrito Federal (GDF) substituiu a gestão do Hospital Evangélico de Pituba (Hvep) e promete aumentar em 25% os atendimentos. A Secretaria de Planejamento e Administração (Sepan) afirma que a nova administração vai ampliar os serviços e melhorar a qu LT: santiago enfrenta desafio hídrico entre chuvas recordistas e calor extremo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 272202, "titulo": "Temporais ameaçam o Brasil e El Niño preocupa produção de alimentos", "url": "https://www.cnnbrasil.com.br/nacional/temporais-ameacam-o-brasil-e-el-nino-preocupa-producao-de-alimentos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-18T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O fenômeno El Niño está causando temporais no Sul do Brasil e seca no Norte. A Câmara dos Deputados aprovou um crédito extraordinário para mitigar os impactos na agricultura.", "titulo_pt": "El Niño ameaça agricultura com temporais no sul e seca no norte; câmara aprova crédito para mitigar impactos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 272245, "titulo": "Mais de 100 mi de caranguejos tomam ilha na Austrália durante migração; veja imagens", "url": "https://exame.com/ciencia/mais-de-100-mi-de-caranguejos-tomam-ilha-na-australia-durante-migracao-veja-imagens/", "fonte_id": "exame", "data_pub": "2026-11-18T14:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 100 milhões de caranguejos migram anualmente para a Ilha Christmas na Austrália para reprodução, causando o fechamento de estradas e a construção de passagens especiais.", "titulo_pt": "Mais de 100 milhões de caranguejos tomam ilha na Austrália durante migração; veja imagens", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 272253, "titulo": "COP31: 'Se você acha que as mudanças climáticas não são nada, venha ao Nepal', diz ministra", "url": "https://exame.com/esg/cop31-se-voce-acha-que-as-mudancas-climaticas-nao-sao-nada-venha-ao-nepal-diz-ministra/", "fonte_id": "exame", "data_pub": "2026-11-18T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ministra do Meio Ambiente do Nepal, Gita Chaudhary, ressaltou a urgência de justiça climática e responsabilização dos países mais poluentes após a tragédia climática que deixou mais de 1400 mortos e causou perdas equivalentes a 10% do PIB do país.", "titulo_pt": "Se você acha que as mudanças climáticas não são nada, venha ao Nepal", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 272258, "titulo": "Ciclone vai atingir o Brasil? Veja o que diz o Inmet e onde há alertas", "url": "https://exame.com/brasil/ciclone-vai-atingir-o-brasil-veja-o-que-diz-o-inmet-e-onde-ha-alertas/", "fonte_id": "exame", "data_pub": "2026-11-18T13:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Instituto Nacional de Meteorologia (Inmet) monitora a formação de um ciclone na costa argentina, enquanto a Defesa Civil prevê ventos acima de 90 km/h no Rio Grande do Sul. Até o momento, não há alertas específicos para o Brasil, mas o Inmet continua monitorando a situação.", "titulo_pt": "Ciclone pode atingir o Brasil? Veja o que diz o Inmet e onde há alertas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 272707, "titulo": "Peru releases seven pelicans rescued from El Niño's effects", "url": "https://www.euronews.com/video/2026/11/18/peru-releases-seven-pelicans-rescued-from-el-ninos-effects", "fonte_id": "euronews", "data_pub": "2026-11-18T11:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sete pelicanos recuperados foram devolvidos à natureza no Peru, que agora abriu seu primeiro centro estatal para proteger aves marinhas afetadas pelo El Niño.", "titulo_pt": "Peru libera sete pelicanos resgatados dos efeitos do El Niño", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 271310, "titulo": "Clima: país tem temporais, rajadas de vento e até queda de granizo nesta 4ª", "url": "https://www.metropoles.com/brasil/clima-pais-tem-temporais-rajadas-de-vento-e-ate-queda-de-granizo-nesta-4a", "fonte_id": "metropoles", "data_pub": "2026-11-18T09:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nesta quarta-feira, o Brasil enfrenta temporais, rajadas de vento e até queda de granizo em algumas regiões, enquanto o calor persiste em outras, com temperaturas chegando a 37°C.", "titulo_pt": "Clima: país tem temporais, rajadas de vento e queda de granizo nesta quarta-feira, com calor em algumas localidades", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 272498, "titulo": "‘Phantom forests’ in Australia’s arid outback used to create carbon credits meant to offset emissions, report claims", "url": "https://www.theguardian.com/environment/2026/nov/18/phantom-forests-in-australian-arid-outback-used-to-create-carbon-credits-meant-to-offset-emissions-report-claims", "fonte_id": "guardian_world", "data_pub": "2026-11-18T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores afirmam que 'florestas fantasma' em áreas áridas da Austrália estão sendo usadas para criar créditos de carbono que permitem às empresas de combustíveis fósseis continuarem poluindo. As empresas de créditos de carbono rejeitam essas alegações, afirmando que há apenas uma pequena aumento na cobertura de floresta e de copa, mesmo em condições úmidas.", "titulo_pt": "Florestas fantasma na áfrica de duro da austrália seriam usadas para criar créditos de carbono, afirma estudo", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 272712, "titulo": "Huge plume of gas erupts from Los Angeles landfill after drilling accident", "url": "https://www.euronews.com/2026/11/18/huge-plume-of-gas-erupts-from-los-angeles-landfill-after-drilling-accident", "fonte_id": "euronews", "data_pub": "2026-11-18T09:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um acidente de perfuração em um aterro sanitário em Los Angeles County resultou em seis pessoas levemente feridas e em uma explosão de gás e resíduos decompostos que atingiu o ar. As autoridades emitiu alertas para os moradores próximos.", "titulo_pt": "Grande pluma de gás explode em aterro sanitário após acidente de perfuração em Los Angeles", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 271465, "titulo": "Después de 180 años, reintrodujeron tortugas gigantes en una isla y seis meses después ya se había recuperado un ecosistema nunca antes visto", "url": "https://www.lanacion.com.ar/ciencia/despues-de-180-anos-reintrodujeron-tortugas-gigantes-en-una-isla-y-seis-meses-despues-ya-se-habia-nid17112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-18T09:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Foram reintroduzidas tartarugas gigantes da espécie Aldabrachelys gigantea na ilha do archipiélago Aride, após 180 anos. Em apenas seis meses, os cientistas observaram a recuperação de um ecosistema que nunca havia sido visto antes.", "titulo_pt": "Depois de 180 anos, tartarugas gigantes são reintroduzidas em uma ilha e ecosistema se recupera rapidamente", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 271331, "titulo": "COP31 entra na reta final e debate justiça climática em meio a impasses financeiros", "url": "https://exame.com/esg/cop31-entra-em-negociacoes-decisivas-e-debate-justica-climatica-em-meio-a-impasses-financeiros/", "fonte_id": "exame", "data_pub": "2026-11-18T06:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Disputas sobre a responsabilidade financeira na crise climática estão dificultando avanços em financiamento durante a COP31. Há expectativa por uma decisão importante nesta quarta-feira.", "titulo_pt": "COP31 entra na reta final e debate justiça climática em meio a impasses financeiros", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 273133, "titulo": "STJ favorece Xuxa em processo e reduz R$ 70 milhões da indenização que apresentadora deve pagar", "url": "https://veja.abril.com.br/cultura/stj-favorece-xuxa-em-processo-e-reduz-r-70-milhoes-da-indenizacao-que-apresentadora-deve-pagar/", "fonte_id": "veja", "data_pub": "2026-11-18T21:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Superior Tribunal de Justiça (STJ) reduziu a indenização que a apresentadora Xuxa deve pagar em um processo que envolve Léo Soltz, relacionado ao uso indevido de personagens da Turma do Cabralzinho. O caso está em discussão há 26 anos.", "titulo_pt": "STJ reduz indenização para Xuxa em processo sobre uso de personagens", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 273399, "titulo": "Reforma al INDH: Naciones Unidas advierte sobre posibles retrocesos en autonomía y facultades del organismo", "url": "https://www.latercera.com/nacional/noticia/reforma-al-indh-naciones-unidas-advierte-sobre-posibles-retrocesos-en-autonomia-y-facultades-del-organismo/", "fonte_id": "la_tercera", "data_pub": "2026-11-18T20:57:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O diretor do instituto indicou que o informe financiero da iniciativa poderia implicar a desvinculação de todos os seus advogados. As Nações Unidas advertiram sobre possíveis retrocessos na autonomia e nas faculdades do organismo.", "titulo_pt": "Reforma ao INDH: ONU avisa sobre possíveis retrocessos na autonomia e competências do órgão", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 272710, "titulo": "Bahrain sentences Shia clerics to life over alleged Iran plot amid torture allegations", "url": "https://www.euronews.com/2026/11/18/bahrain-sentences-shia-clerics-to-life-over-alleged-iran-plot-amid-torture-allegations", "fonte_id": "euronews", "data_pub": "2026-11-18T10:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bahrain prendeu dezenas de clérigos xiitas desde o início da guerra com o Irã em fevereiro. Autoridades acusam-os de conspirar com Teerã, enquanto grupos de direitos humanos levantam preocupações sobre tortura e confissões forçadas. Os estados do Golfo apoiaram a jurisdição de Bahrain.", "titulo_pt": "Bahrain condena clérigos xiitas a prisão perpétua em meio a acusações de tortura", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 272946, "titulo": "Remarks by UNICEF Deputy Executive Director, ASG Ted Chaiban, at the Second Global Ministerial Conference on Ending Violence Against Children", "url": "https://www.unicef.org/press-releases/remarks-unicef-deputy-executive-director-asg-ted-chaiban-second-global-ministerial", "fonte_id": "unicef", "data_pub": "2026-11-18T10:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O vice-diretor executivo adjunto da UNICEF, Ted Chaiban, participou da Segunda Conferência Global Ministerial sobre o Fim da Violência Contra Crianças. O evento teve como objetivo discutir estratégias para combater a violência contra crianças em todo o mundo.", "titulo_pt": "Comentários do vice-diretor executivo adjunto da UNICEF, Ted Chaiban, na segunda conferência Global Ministerial sobre o fim da violência contra crianças", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 272778, "titulo": "Serbia’s Criminal Police Chief Detained for Alleged Torture", "url": "https://balkaninsight.com/2026/11/18/serbias-criminal-police-chief-detained-for-alleged-torture/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-18T10:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe do Diretório de Polícia Criminal da Sérvia, Marko Kricak, foi detido sob acusações de torturar manifestantes em agosto de 2025. Ele já enfrenta outras acusações relacionadas ao abuso de poder e tortura.", "titulo_pt": "Chefe da polícia Criminal da sérvia detido suspeito de torturar protestantes", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 271736, "titulo": "‘We want to go back’: Rohingya refugees pin hopes on ICJ genocide verdict", "url": "https://www.aljazeera.com/features/2026/11/18/we-want-to-go-back-rohingya-refugees-pin-hopes-on-icj-genocide-verdict?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-18T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Refugiados rohingya, que vivem no exílio há quase uma década, esperam que o TJ Internacional decida a seu favor. No entanto, não está claro se isso ajudará a permitir seu retorno.", "titulo_pt": "Queremos voltar”: refugiados rohingya esperam decisão favorável do tj internacional", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 272546, "titulo": "¿Más poder, menos responsabilidad? La reforma al mercado de capitales y su efecto en las sociedades anónimas", "url": "https://www.ciperchile.cl/2026/11/18/mas-poder-menos-responsabilidad-la-reforma-al-mercado-de-capitales-y-su-efecto-en-las-sociedades-anonimas/?utm_source=rss&utm_medium=rss&utm_campaign=mas-poder-menos-responsabilidad-la-reforma-al-mercado-de-capitales-y-su-efecto-en-las-sociedades-anonimas", "fonte_id": "ciper_chile", "data_pub": "2026-11-18T07:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A reforma no mercado de capitais e seu impacto nas sociedades anónimas são temas abordados no texto original. O título traduzido para o português brasileiro é: 'Mais poder, menos responsabilidade? A reforma ao mercado de capitais e seu efeito nas sociedades anónimas'.", "titulo_pt": "Mais poder, menos responsabilidade? A reforma ao mercado de capitais e seu efeito nas sociedades anónimas", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 271979, "titulo": "UNICEF FAST FACTS: World leaders meet in Manila to end violence against children", "url": "https://www.unicef.org/press-releases/unicef-fast-facts-world-leaders-meet-manila-end-violence-against-children", "fonte_id": "unicef", "data_pub": "2026-11-18T06:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Membros de governos mundiais se encontram em Manila para discutir a eliminação da violência contra crianças. O evento visa promover ações para proteger os direitos das crianças.", "titulo_pt": "Fatos rápidos: líderes mundiais se reúnem em Manila para combater violência contra crianças", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 272947, "titulo": "Fast facts: World leaders meet in Manila to end violence against children", "url": "https://www.unicef.org/press-releases/fast-facts-world-leaders-meet-manila-end-violence-against-children", "fonte_id": "unicef", "data_pub": "2026-11-18T06:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Membros de governos globais se reuniram em Manila para discutir e tomar medidas para combater a violência contra crianças. O encontro visa promover ações concretas para proteger os direitos das crianças.", "titulo_pt": "Fatos rápidos: líderes mundiais se reúnem em Manila para acabar com a violência contra crianças", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 271565, "titulo": "‘Devastating consequences’: One Nation plan to slash Australia’s refugee program denounced", "url": "https://www.theguardian.com/australia-news/2026/nov/18/one-nation-refugee-intake-immigration-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-11-18T05:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O partido One Nation propôs cortar drasticamente o programa de refugiados da Austrália em 90% e eliminar o programa de vistos permanentes para pais e pais idosos. A proposta foi criticada por oponentes políticos e organizações de advocacy como uma 'ataque barato' aos refugiados.", "titulo_pt": "Consequências devastadoras: plano do one Nation para reduzir programa de refugiados da austrália condenado", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 272528, "titulo": "The Rohingya Are Not a Legal Test Case. We Are a People Waiting for Justice.", "url": "https://thediplomat.com/2026/11/the-rohingya-are-not-a-legal-test-case-we-are-a-people-waiting-for-justice/", "fonte_id": "the_diplomat", "data_pub": "2026-11-18T04:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma decisão judicial não pode devolver a um filho assassinado à sua mãe ou devolver os anos roubados a uma geração. No entanto, a reconhecimento e ser ouvidos importam.", "titulo_pt": "Os rohingyas não são um caso Legal. Somos um povo esperando justiça.", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 271641, "titulo": "Fears over impact of tear gas on women's health prompt calls for ban", "url": "https://www.lemonde.fr/en/environment/article/2026/11/18/fears-over-impact-of-tear-gas-on-women-s-health-prompt-calls-for-ban_6783098_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-18T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nove mil mulheres relataram problemas ginecológicos após exposição a gases lacrimogêneos durante protestos recentes em escolas e na sociedade francesa, conforme apresentado em testemunhos à Assembléia Nacional. Esses relatos levantaram preocupações sobre os efeitos desses gases na saúde feminina, resultando em chamados por uma proibição.", "titulo_pt": "Medo dos efeitos dos gases lacrimogêneos na saúde feminina leva a chamados por proibição", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 271980, "titulo": "At least 64 children killed and 64 injured in Yemen as intensified hostilities approach three-month mark", "url": "https://www.unicef.org/press-releases/least-64-children-killed-and-64-injured-yemen-intensified-hostilities-approach-three", "fonte_id": "unicef", "data_pub": "2026-11-18T02:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A intensificação dos conflitos no Iêmen está causando a morte e ferimentos em pelo menos 64 crianças, além de interromper o acesso a serviços de saúde, água segura, higiene, alimentos e educação. A cidade de Taiz está cada vez mais isolada.", "titulo_pt": "Pelo menos 64 crianças mortas e 64 feridas no iêmen à medida que os conflitos se intensificam, chegando ao terceiro mês", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 272779, "fonte_id": "taipei_times", "titulo": "Taiwan eyeing US-China-Russia talks", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/19/2003867998", "data_pub": "2026-11-19T00:00:00Z", "topico": "geopolitica", "idioma": "en", "titulo_pt": "Taiwan avaliando participação em negociações entre EUA, china e Rússia", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 272781, "fonte_id": "taipei_times", "titulo": "Xi welcomes Trump to China ahead of summit", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/19/2003868000", "data_pub": "2026-11-19T00:00:00Z", "topico": "geopolitica", "idioma": "en", "titulo_pt": "Xi recebe Trump na China antes de cúpula", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 272783, "fonte_id": "taipei_times", "titulo": "NASA’s Voyager 1 reaches one light-day milestone after 50 years in space", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/19/2003868002", "data_pub": "2026-11-19T00:00:00Z", "topico": "ciencia", "idioma": "en", "titulo_pt": "Voyager 1 atinge marca de um dia-luz após 50 anos no espaço", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 272784, "fonte_id": "taipei_times", "titulo": "More rational antibiotic use needed, hospital says", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/19/2003868008", "data_pub": "2026-11-19T00:00:00Z", "topico": "sociedade", "idioma": "en", "titulo_pt": "Mais uso racional de antibióticos necessário, diz hospital", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 272785, "fonte_id": "taipei_times", "titulo": "Legalize cancer drug fund: groups", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/19/2003868009", "data_pub": "2026-11-19T00:00:00Z", "topico": "sociedade", "idioma": "en", "titulo_pt": "Legalize            return `<div class="item" data-flag-url="${esc(n.url)}">

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));

  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

  return "8h";
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;

  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');

  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
