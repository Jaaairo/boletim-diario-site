 José Antonio Dias Toffoli suspendeu a campanha presidencial de Renan Santos, proibindo o uso do fundo partidário, participação em debates e presença nas redes sociais, pois Renan não informou os perfis da campanha ao registrar a candidatura.", "titulo_pt": "Por que Renan Santos teve campanha à Presidência suspensa pelo TSE", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 136401, "titulo": "Cerimedo desde la cárcel en Bolivia: “No tengo influencia en el Gobierno, le di consejos al presidente como amigo”", "url": "https://elpais.com/america/2026-08-31/cerimedo-desde-la-carcel-en-bolivia-no-tengo-influencia-en-el-gobierno-le-di-consejos-al-presidente-como-amigo.html", "fonte_id": "elpais_america", "data_pub": "2026-08-31T21:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O exconsultor de Rodrigo Paz e Javier Milei está cumprindo prisão preventiva por 180 dias acusado de tentativa de feminicídio e enriquecimento ilícito. Ele afirma não ter influência no governo e ter dado conselhos ao presidente como amigo.", "titulo_pt": "Cerimedo na cárcere em Bolivia: 'não tenho influência no governo, dei conselhos ao presidente como amigo'", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}], "mundo__eventos": [{"titulo": "Corte suprema divide-se e permite continuidade da construção do salão de Trump", "sumario": "A Suprema Corte, com votação aparente de 5 a 4, permitiu que o governo continuasse a construção de um salão de $400 milhões, projetado pelo ex-presidente Trump. A Suprema Corte dos Estados Unidos permitiu que o ex-presidente Donald Trump continue a construção de um salão de baile na Casa Branca. A Suprema Corte permitiu que a construção do salão de baile do Trump em sua propriedade na Casa Branca continue.", "artigos": [{"id": 136549, "titulo": "Divided Supreme Court lets White House continue construction on Trump’s $400 million ballroom", "url": "https://www.lemonde.fr/en/international/article/2026/08/31/divided-supreme-court-lets-white-house-continue-construction-on-trump-s-400-million-ballroom_6757028_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-31T21:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte, com votação aparente de 5 a 4, permitiu que o governo continuasse a construção de um salão de $400 milhões, projetado pelo ex-presidente Trump. O presidente Joe Biden, que substituiu Trump, pode continuar com a obra, que o Chief Justice John Roberts considera provavelmente ilegal por falta de aprovação do Congresso.", "titulo_pt": "Corte suprema divide-se e permite continuidade da construção do salão de Trump", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 136531, "titulo": "US Supreme Court clears way for Trump to keep building White House ballroom", "url": "https://www.bbc.co.uk/news/articles/c9w457e7ydlo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-31T21:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte dos Estados Unidos permitiu que o ex-presidente Donald Trump continue a construção de um salão de baile na Casa Branca. No entanto, o ministro relator John Roberts discordou, afirmando que a construção provavelmente é ilegal.", "titulo_pt": "Suprema corte permite que Trump continue a construção de salão de baile na casa branca", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 136597, "titulo": "Supreme Court allows construction of Trump’s White House ballroom to continue", "url": "https://www.ft.com/content/60b3e8d9-df14-422c-b513-9d23850b5291?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-31T21:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte permitiu que a construção do salão de baile do Trump em sua propriedade na Casa Branca continue. O projeto, avaliado em 400 milhões de dólares, deve ser concluído.", "titulo_pt": "Suprema corte permite continuação da construção do salão de baile de Trump na casa branca", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 136149, "titulo": "Suprema Corte libera construção de salão de festas de Trump na Casa Branca", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/08/suprema-corte-libera-construcao-de-salao-de-festas-de-trump-na-casa-branca.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-31T21:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte dos Estados Unidos permitiu que o governo de Donald Trump continue com a construção de seu projeto de salão de festas na Casa Branca. A decisão foi tomada após Trump contestar uma ordem judicial que havia paralisado grande parte da obra.", "titulo_pt": "Suprema Corte autoriza construção de salão de festas de Trump na Casa Branca", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}]}], "economia": [{"id": 135908, "titulo": "Global chip market to exceed US$2tn by 2030: SEMI", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/01/2003863453", "fonte_id": "taipei_times", "data_pub": "2026-09-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mercado de chips global deve ultrapassar os 2 trilhões de dólares até 2030, de acordo com a SEMI.", "titulo_pt": "Mercado de chips global atingirá US$2tn até 2030, diz SEMI", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 136113, "titulo": "Terreno da Comabem vai a leilão para pagar credores; dívida é de R$ 23 milhões", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/terreno-da-comabem-vai-a-leilao-para-pagar-credores-divida-e-de-r-23-milhoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A massa falida da Comabem Alimentação leiloou um terreno de 23,6 hectares para quitar uma dívida de R$ 23 milhões com os credores. O imóvel, equivalente a 33 campos de futebol, teve lance inicial de R$ 16,6 milhões e o leilão terminou na terça-feira (1º).", "titulo_pt": "Terreno da Comabem vai a leilão para pagar credores; dívida é de R$ 23 milhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 136548, "titulo": "EU suspends Brazilian meat imports over health concerns", "url": "https://www.lemonde.fr/en/international/article/2026/08/31/eu-suspends-brazilian-meat-imports-over-health-concerns_6757027_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-31T21:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão Europeia suspendeu as importações de carne do Brasil devido a preocupações sobre o uso inadequado de antibióticos na agricultura. A União Europeia proíbe o uso de antimicrobianos para promover o crescimento dos animais, como parte de esforços para combater a resistência antimicrobiana.", "titulo_pt": "Ue suspende importações de carne do Brasil devido a preocupações com o uso de antibióticos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 136115, "titulo": "As lições que o país deve aprender com as barreiras na carne", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/vaivem/2026/08/as-licoes-que-o-pais-deve-aprender-com-as-barreiras-na-carne.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cota chinesa de importação de carne bovina do Brasil está preenchida, e as barreiras dos europeus estão entrando em vigor, afetando o volume importado. Essas barreiras também impactam negativamente a imagem do produto brasileiro, o que deve ser observado com atenção pelo país.", "titulo_pt": "As lições que o país deve aprender com as barreiras na carne bovina", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 136553, "titulo": "Trump announced a massive oil deal with Venezuela. Why it won't lower gas prices anytime soon", "url": "https://www.cnbc.com/2026/08/31/trump-venezuela-oil-gas-price.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-31T21:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, anunciou que o país obteve controle majoritário sobre 65 bilhões de barris de reservas de petróleo provadas da Venezuela. No entanto, este acordo não deve resultar em redução dos preços da gasolina nos Estados Unidos no curto prazo.", "titulo_pt": "Trump anuncia acordo de petróleo com a Venezuela, mas redução dos preços da gasolina não será imediata", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 136333, "titulo": "Terras raras: projeto em MG atrai capital global às vésperas de marco legal", "url": "https://braziljournal.com/terras-raras-projeto-em-mg-atrai-capital-global-as-vesperas-de-marco-legal/", "fonte_id": "brazil_journal", "data_pub": "2026-08-31T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de terras raras Colosso, em Poços de Caldas, está atraindo investimentos globais antes da definição legal do setor. O empreendimento atraiu um investimento de um fundo de capital de risco.", "titulo_pt": "Terras raras: projeto em MG atrai capital global às vésperas de marco legal", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 136117, "titulo": "Nissan e Honda vão desenvolver juntas sistemas para carros definidos por software", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/nissan-e-honda-vao-desenvolver-juntas-sistemas-para-carros-definidos-por-software.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As montadoras japonesas Nissan e Honda anunciaram que desenvolverão em conjunto ECUs padronizadas para veículos definidos por software. A colaboração visa aprofundar a parceria em tecnologias avançadas para veículos automotivos.", "titulo_pt": "Nissan e Honda vão desenvolver juntas sistemas para carros definidos por software", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 136118, "titulo": "Suas opiniões sobre investimentos envelheceram?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/08/suas-opinioes-sobre-investimentos-envelheceram.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O artigo sugere que as opiniões sobre investimentos podem estar desatualizadas, comparando-as a uma pessoa que hoje escolheria um Ford Escort, um modelo considerado antigo, em vez de optar por opções mais modernas disponíveis no mercado atual.", "titulo_pt": "Suas opiniões sobre investimentos já estão desatualizadas?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 136295, "titulo": "Lula sugere que viajantes possam revender ou transferir passagens aéreas", "url": "https://www.cnnbrasil.com.br/politica/lula-sugere-que-viajantes-possam-revender-ou-transferir-passagens-aereas/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-31T20:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente sugere a possibilidade de viajantes poderem revender ou transferir passagens aéreas. O sistema proposto permitiria que os bilhetes fossem reembolsados ou repassados a quem o passageiro desejar.", "titulo_pt": "Lula sugere revenda ou transferência de passagens aéreas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 136331, "titulo": "Dólar cai 0,28%, a R$5,18, com eleições, Ptax e exterior; no ano, queda é de 5,6%", "url": "https://www.infomoney.com.br/mercados/dolar-hoje-abertura-fechamento-comercial-turismo-31082026/", "fonte_id": "infomoney", "data_pub": "2026-08-31T20:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar caiu 0,28%, cotado a R$5,18, influenciado por eleições, Ptax e movimentações do exterior. No ano, a moeda norte-americana registra uma queda de 5,6%.", "titulo_pt": "Dólar cai 0,28%, a R$5,18, com eleições, Ptax e exterior; no ano, queda é de 5,6%", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 136598, "titulo": "Elliott builds stake in French industrial gas group Air Liquide", "url": "https://www.ft.com/content/3d30f551-53af-4fab-8271-3f7fd75d5cfd?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-31T20:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O fundo de investimentos americano Elliott aumentou sua participação na empresa francesa Air Liquide, uma empresa líder no setor de gás industrial. Este movimento se alinha com a estratégia do Elliott de alvo para grandes corporações europeias nos últimos anos.", "titulo_pt": "Elliott amplia participação na empresa francesa Air Liquide", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 136122, "titulo": "IA pode acelerar ataques cibernéticos e pressionar sistema financeiro, diz conselho financeiro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/ia-pode-acelerar-ataques-ciberneticos-e-pressionar-sistema-financeiro-diz-conselho-financeiro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T20:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Conselho de Estabilidade Financeira, Andrew Bailey, alertou que a inteligência artificial pode acelerar ataques cibernéticos e pressionar o sistema financeiro global. Ele destacou que a tecnologia poderia modificar a velocidade, a escala e os aspectos econômicos de um ataque cibernético.", "titulo_pt": "IA pode acelerar ataques cibernéticos e pressionar sistema financeiro, diz conselho financeiro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 136591, "titulo": "Why Japan should care about India’s nuclear opening", "url": "https://www.japantimes.co.jp/commentary/2026/09/01/japan/japan-indias-nuclear-opening/", "fonte_id": "japan_times", "data_pub": "2026-08-31T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Japan deve decidir se deve entrar no mercado nuclear aberto recentemente na Índia e, se fizer isso, se deve exigir padrões de segurança mais rigorosos influenciados pela sua própria história nuclear.", "titulo_pt": "Por que a Japan deve se importar com a abertura nuclear da Índia", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 136123, "titulo": "Dona do Mounjaro compra empresa que testa tratamentos contra doenças autoimunes por US$ 2,88 bi", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/dona-do-mounjaro-compra-empresa-que-testa-tratamentos-contra-doencas-autoimunes-por-us-288-bi.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T20:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A farmacêutica Eli Lilly adquiriu a Merida Biosciences por até US$ 2,88 bilhões para expandir seu portfólio com tratamentos para doenças autoimunes e alérgicas graves.", "titulo_pt": "Eli lilly compra empresa de biotecnologia por US$ 2,88 bi", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 136124, "titulo": "Bancos e seguradoras se preparam para maior mudança na previdência alemã em 20 anos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/bancos-e-seguradoras-se-preparam-para-maior-mudanca-na-previdencia-alema-em-20-anos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T20:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reforma previdenciária na Alemanha, a maior em mais de duas décadas, direcionará centenas de bilhões de euros em poupança para gestoras globais de ativos, prejudicando as seguradoras.", "titulo_pt": "Bancos e seguradoras se preparam para maior mudança na previdência alemã em 20 anos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 136125, "titulo": "Desenho do regime de metas de inflação e a formação da taxa de juros no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/desenho-do-regime-de-metas-de-inflacao-e-a-formacao-da-taxa-de-juros-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Samuel Pessôa, em um artigo recente, discute uma Nota Técnica do FMI sobre a influência de metas de inflação baixas na taxa de juro de equilíbrio no Brasil. No entanto, a análise completa do documento do FMI não apóia essa conclusão.", "titulo_pt": "Desenho do regime de metas de inflação e a formação da taxa de juros no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 135885, "titulo": "Taiwan aims to train 500,000 AI pros by 2040", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/01/2003863468", "fonte_id": "taipei_times", "data_pub": "2026-09-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo de Taiwan planeja treinar 500.000 profissionais em inteligência artificial até 2040. Este objetivo visa fortalecer a indústria de tecnologia local e manter Taiwan competitivo no campo da IA.", "titulo_pt": "Taiwan visa treinar 500.000 profissionais em IA até 2040", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 135886, "titulo": "Nvidia to invest US$3.5 billion in MediaTek", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/01/2003863469", "fonte_id": "taipei_times", "data_pub": "2026-09-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia planeja investir 3,5 bilhões de dólares no MediaTek. Este investimento visa fortalecer a parceria entre as duas empresas no mercado de semicondutores e tecnologia móvel.", "titulo_pt": "Nvidia investirá 3,5 bilhões de dólares no MediaTek", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 135899, "titulo": "Smart blood tube prep tech easing nurses’ workload", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/01/2003863487", "fonte_id": "taipei_times", "data_pub": "2026-09-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova tecnologia de preparo de tubos de sangue inteligentes está facilitando a carga de trabalho das enfermeiras. Essa inovação visa simplificar os procedimentos de coleta de sangue, reduzindo a demanda de tempo e esforço das profissionais.", "titulo_pt": "Tecnologia inteligente de preparo de tubos de sangue alivia carga de trabalho das enfermeiras", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 135907, "titulo": "Integrated systems to lead AI boom: TSMC executive", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/01/2003863452", "fonte_id": "taipei_times", "data_pub": "2026-09-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um executivo da TSMC afirmou que sistemas integrados serão cruciais para impulsionar o boom da inteligência artificial. A empresa é líder mundial em fabricação de chips.", "titulo_pt": "Sistemas integrados serão chaves para o boom da IA: executivo da TSMC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 136198, "titulo": "União Europeia coloca ChatGPT em lista de plataformas sujeitas à fiscalização mais rigorosa", "url": "https://veja.abril.com.br/tecnologia/uniao-europeia-coloca-chatgpt-em-lista-de-plataformas-sujeitas-a-fiscalizacao-mais-rigorosa/", "fonte_id": "veja", "data_pub": "2026-08-31T21:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A União Europeia incluiu ChatGPT em uma lista de plataformas de inteligência artificial que estão sujeitas a fiscalização mais estrita. A empresa deve avaliar e mitigar riscos sistêmicos relacionados aos seus serviços e algoritmos.", "titulo_pt": "ChatGPT é incluído em lista de plataformas de IA sujeitas a fiscalização mais rigorosa na ue", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 136609, "titulo": "FTC lawsuit alleges Amazon has been ‘secretly and systematically’ overcharging for ads", "url": "https://www.theverge.com/tech/986982/amazon-advertising-prices-ftc-lawsuit", "fonte_id": "the_verge", "data_pub": "2026-08-31T21:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FTC e 22 procuradores-gerais dos estados estão processando a Amazon por supostamente usar uma 'sobretaxa secreta em anúncios' para aumentar os preços dos anúncios em seu site e aplicativo. De acordo com o chairman da FTC, Andrew Ferguson, os preços mais altos dos anúncios foram principalmente repassados aos consumidores americanos.", "titulo_pt": "Procuradores federais e estaduais processam a Amazon por supostos anúncios sobrecarregados", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 136556, "titulo": "Microsoft Outlook and OpenAI's ChatGPT Work are experiencing user outages", "url": "https://www.cnbc.com/2026/08/31/microsoft-outlook-and-openais-chatgpt-work-experience-outages-.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-31T21:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O serviço de ChatGPT Work da OpenAI esteve indisponível para alguns usuários na segunda-feira, e a Microsoft relatou problemas com o Exchange Online.", "titulo_pt": "ChatGPT Work da OpenAI e problemas com exchange online da microsoft", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 136206, "titulo": "Livro trata de ‘coevolução’ entre humanos e agentes de IA", "url": "https://veja.abril.com.br/cultura/livro-trata-de-coevolucao-entre-humanos-e-agentes-de-ia/", "fonte_id": "veja", "data_pub": "2026-08-31T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O livro discute a coevolução entre humanos e agentes de inteligência artificial, sugerindo um modelo de ação de máquinas dentro de limites éticos bem definidos.", "titulo_pt": "Livro trata de coevolução entre humanos e agentes de IA", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 136209, "titulo": "Menos de um ano após lançamento, anúncios no ChatGPT atingem receita bilionária", "url": "https://veja.abril.com.br/tecnologia/menos-de-um-ano-apos-lancamento-anuncios-no-chatgpt-atingem-receita-bilionaria/", "fonte_id": "veja", "data_pub": "2026-08-31T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ChatGPT foi lançado em fevereiro de 2026 e, menos de um ano após o lançamento, os anúncios na ferramenta já atingiram uma receita bilionária. A ferramenta permite que vendedores específicos anunciem seus produtos através do agente da OpenAI.", "titulo_pt": "Menos de um ano após lançamento, anúncios no ChatGPT atingem receita bilionária", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 136658, "titulo": "4 S. Korean defense companies listed among world's top 100 defense firms", "url": "https://en.yna.co.kr/view/AEN20260901000300315", "fonte_id": "yonhap_news", "data_pub": "2026-08-31T21:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quatro grandes empresas de defesa sul-coreanas foram listadas entre as 100 principais empresas de defesa do mundo.", "titulo_pt": "4 Empresas de defesa sul-coreanas entre as 100 maiores do mundo", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 136496, "titulo": "IA en la minería: déficit de trabajadores especializados impulsa su uso para conectar talento y empresas", "url": "https://www.latercera.com/mineria/noticia/ia-en-la-mineria-deficit-de-trabajadores-especializados-impulsa-su-uso-para-conectar-talento-y-empresas/", "fonte_id": "la_tercera", "data_pub": "2026-08-31T20:47:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A indústria mineira precisará de aproximadamente 37 mil novos trabalhadores até 2034, principalmente em posições técnicas. A reativação de projetos intensificou a concorrência por operadores e especialistas certificados, levando a novas ferramentas que buscam melhorar a conexão entre as empresas e os candidatos.", "titulo_pt": "IA na mineração: déficit de trabalhadores especializados impulsiona seu uso para conectar talento e empresas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 136502, "titulo": "Tim Cook se despide de Apple tras 15 años como CEO y deja el mando en manos de John Ternus con el desafío de la IA", "url": "https://www.latercera.com/pulso/noticia/tim-cook-se-despide-de-apple-asume-ternus-con-desafio-de-la-ia/", "fonte_id": "la_tercera", "data_pub": "2026-08-31T20:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Tim Cook deixou a liderança da Apple após 15 anos como CEO, passando o comando para John Ternus, com o desafio de lidar com a inteligência artificial. Durante o mandato de Cook, a capitalização bursátil da empresa aumentou mais de 13 vezes, passando de aproximadamente 348 bilhões de dólares para cerca de 4,54 trilhões de dólares.", "titulo_pt": "Tim Cook se despede da Apple após 15 anos como CEO e passa o comando para John Ternus com desafio de IA", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 136620, "titulo": "FTC accuses Amazon of running a ‘secret ad surcharge scheme’ in new lawsuit", "url": "https://techcrunch.com/2026/08/31/ftc-accuses-amazon-of-running-a-secret-ad-surcharge-scheme-in-new-lawsuit/", "fonte_id": "techcrunch", "data_pub": "2026-08-31T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FTC e 22 estados dos EUA acusam a Amazon de supostamente cobrar empresas mais caro por anúncios sem revelar isso publicamente.", "titulo_pt": "FTC e 22 estados acusam Amazon de esquema secreto de surtaxo em anúncios", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 136621, "titulo": "The Pentagon now has its own version of ChatGPT and Grok", "url": "https://techcrunch.com/2026/08/31/the-pentagon-now-has-its-own-version-of-chatgpt-and-grok/", "fonte_id": "techcrunch", "data_pub": "2026-08-31T20:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Pentágono adotará versões de OpenAI's ChatGPT e SpaceXAI's Grok, juntamente com Google's Gemini, em seu portal central de ferramentas de inteligência artificial.", "titulo_pt": "Pentágono terá suas próprias versões de ChatGPT e Grok", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 136126, "titulo": "ChatGPT apresenta instabilidade na tarde desta segunda (31)", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/chatgpt-apresenta-instabilidade-na-tarde-desta-segunda-31.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T19:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Usuários do ChatGPT, um chatbot de IA da OpenAI, relataram instabilidade no serviço a partir do início da tarde desta segunda-feira (31).", "titulo_pt": "Chatgpt apresenta instabilidade na tarde desta segunda-feira", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 136622, "titulo": "Instagram puts new limits on undisclosed AI profiles", "url": "https://techcrunch.com/2026/08/31/instagram-puts-new-limits-on-undisclosed-ai-profiles/", "fonte_id": "techcrunch", "data_pub": "2026-08-31T19:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Instagram está limitando o alcance de perfis de influenciadores criados por inteligência artificial sem ser informado aos seguidores. Isso ocorre em resposta à crescente frustração com esses perfis não revelados.", "titulo_pt": "Instagram limita alcance de perfis de influenciadores AI sem revelação", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 136632, "titulo": "Managing chronic conditions together may be key to longer lifespan, canine study finds", "url": "https://phys.org/news/2026-08-chronic-conditions-key-longer-lifespan.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ao envelhecer, muitos cães desenvolvem mais de uma condição crônica. Novas pesquisas da Faculdade de Medicina Veterinária e Ciências Biomédicas da Universidade Estadual do Texas mostram que essas condições podem significativamente reduzir a longevidade dos cães, enfatizando a importância de gerenciar múltiplas doenças de forma integrada.", "titulo_pt": "Gerenciar condições crônicas juntas pode ser crucial para uma maior longevidade, estudo canino revela", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 136633, "titulo": "ESA JUICE probe targets dark Jovian moon Kallichore in 2031", "url": "https://phys.org/news/2026-08-esa-juice-probe-dark-jovian.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A missão JUICE da ESA planeja explorar a lua joviana Kallichore em 2031. As luas menores de Júpiter podem fornecer insights importantes sobre a história do sistema solar, pois permaneceram relativamente inalteradas em comparação com as luas Galileanas.", "titulo_pt": "Missão JUICE da ESA alvo da lua joviana Kallichore em 2031", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 136634, "titulo": "Organic crystal reveals how Joule heating stabilizes resistive switching", "url": "https://phys.org/news/2026-08-crystal-reveals-joule-stabilizes-resistive.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O cristal orgânico demonstra como o aquecimento Joule estabiliza o switching resistivo. Transições metálico-índico (MITs) ocorrem quando um material muda de um estado metálico com baixa resistividade para um estado índico devido a uma mudança em um parâmetro externo, como temperatura, pressão ou campo elétrico.", "titulo_pt": "Cristal orgânico ilustra como o aquecimento Joule estabiliza o switching resistivo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 136635, "titulo": "Antarctica is home to microbes found nowhere else on Earth", "url": "https://phys.org/news/2026-08-antarctica-home-microbes-earth.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobririram microorganismos únicos em Antártica que não são encontrados em nenhum outro lugar do planeta. Os pesquisadores do CIRES concentraram-se na análise do solo, acreditando que microorganismos microscópicos poderiam ser exclusivos da região.", "titulo_pt": "Antártica abriga microorganismos únicos não encontrados em nenhum outro lugar do planeta", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 136636, "titulo": "Keeping cool saves thousands of lives yearly, but at a cost of worsening global warming, experts say", "url": "https://phys.org/news/2026-08-cool-thousands-yearly-worsening-global.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O uso de ar condicionado evita mais de 5.000 mortes por ano nos Estados Unidos, mas contribui para o aquecimento global e sobrecarrega a rede elétrica, de acordo com especialistas.", "titulo_pt": "Manter fresco salva milhares de vidas, mas agravando o aquecimento global e sobrecarregando a rede elétrica, dizem os especialistas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 136637, "titulo": "Looking for Earth 2.0 in binary systems", "url": "https://phys.org/news/2026-08-earth-binary.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos encontraram milhares de exoplanetas nas últimas décadas, mas ainda não descobriram uma planeta rochoso do mesmo tamanho da Terra orbitando na zona habitável de uma estrela semelhante ao Sol. Uma parte dessas dificuldades se deve à geografia cósmica, pois metade das estrelas semelhantes ao Sol próximas à Terra têm uma ou mais estrelas companheiras que complicam suas dinâmicas orbitais, bem como as de quaisquer planetas que possam hospedar.", "titulo_pt": "Buscando a terra 2.0 em sistemas binários", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 136661, "titulo": "NASA Welcomes Türkiye as Newest Artemis Accords Signatory", "url": "https://www.nasa.gov/organizations/oiir/artemis-accords/nasa-welcomes-turkiye-as-newest-artemis-accords-signatory/", "fonte_id": "nasa_news", "data_pub": "2026-08-31T21:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na cerimônia realizada na sede da NASA em Washington, o Reino da Turquia assinou os Acordos Artemis, se juntando a uma crescente coalizão internacional de países comprometidos com a exploração espacial pacífica e transparente. É um privilégio para a NASA receber a Turquia como o 71º signatário dos Acordos Artemis.", "titulo_pt": "NASA bem-vinda Turquia como novo signatário dos acordos Artemis", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 136638, "titulo": "Industrial-scale microbial foods—growth strategies for the next-generation protein market", "url": "https://phys.org/news/2026-08-industrial-scale-microbial-foods-growth.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pergunta não é mais se alimentos microbianos podem ser produzidos. Agora, a questão é quem será o primeiro a transformar essa tecnologia em uma indústria. Pesquisadores da KAIST analisaram as condições necessárias para o sucesso da indústria de alimentos microbianos em termos de fabricação, mercado e regulamentação, e propuseram estratégias de crescimento para a próxima geração da indústria de proteínas.", "titulo_pt": "Alimentos microbianos em escala industrial—estratégias de crescimento para o mercado de proteínas da próxima geração", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 136639, "titulo": "A Permian fossil may reveal the oldest known flowering-plant structure", "url": "https://phys.org/news/2026-08-permian-fossil-reveal-oldest.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A descoberta de um fósil permiano pode revelar a estrutura mais antiga conhecida de plantas angiospermas. Embora as plantas angiospermas sejam dominantes no ecossistema atual, há pouca informação sobre sua origem e evolução inicial.", "titulo_pt": "Um fósil permiano pode revelar a estrutura mais antiga conhecida de plantas angiospermas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 136678, "titulo": "NASA's doomed Swift space telescope restarts science work after rescue mission fails", "url": "https://www.space.com/space-exploration/missions/nasas-doomed-swift-space-telescope-restarts-science-work-after-rescue-mission-fails", "fonte_id": "space_com", "data_pub": "2026-08-31T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O telescópio espacial Swift da NASA retomou suas observações científicas após uma missão privada falhar em melhorar sua órbita decaindo, aproveitando o tempo restante em funcionamento.", "titulo_pt": "Telescópio espacial Swift da nasa retoma observações após falha na missão de resgate", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 136640, "titulo": "Farm-based nanopore sequencing study reports reliable genetic testing results", "url": "https://phys.org/news/2026-08-farm-based-nanopore-sequencing-reliable.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Universidade de Queensland testou a sequenciamento nanopore em três fazendas comerciais de gado e conseguiu produzir dados confiáveis para idade, valores genômicos de cruzamento (GBVs) e parentesco em menos de 24 horas. Este método de teste genético rápido e local é viável para produtores do norte do país.", "titulo_pt": "Estudo de sequenciamento nanopore em fazendas relata resultados de testes genéticos confiáveis", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 136630, "titulo": "New guidelines on migraine prevention reflect increasing options for patients", "url": "https://www.statnews.com/2026/08/31/migraine-prevention-medication-guidelines/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-31T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As novas diretrizes sobre prevenção de migraña refletem a crescente variedade de opções para os pacientes, de acordo com um dos autores das diretrizes lançadas recentemente.", "titulo_pt": "Novas diretrizes sobre prevenção de migraña refletem crescente variedade de opções para os pacientes", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 136660, "titulo": "Migraine drugs are getting more precise. Choosing the right one is still tricky", "url": "https://www.sciencenews.org/article/migraine-drugs-prevention-guidelines", "fonte_id": "science_news", "data_pub": "2026-08-31T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os medicamentos para prevenção de dores de cabeça migrânea estão mais precisos do que nunca, e novas diretrizes podem auxiliar os médicos a prever qual medicamento será mais eficaz para cada paciente.", "titulo_pt": "Medicamentos para prevenção de dores de cabeça migrânea estão mais pre fonte_id": "la_tercera", "data_pub": "2026-08-31T17:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em setembro, será apresentado um projeto para fortalecer a segurança em residências ameaçadas por redes de exploração infantil, incluindo controles de acesso, vigilância, patrulhamento e proteção de vítimas e denunciantes.", "titulo_pt": "Governo apresenta agenda nacional para fortalecer o sistema de proteção da infância", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 135274, "titulo": "Controle a pressão para manter distância do Alzheimer, conclui maior estudo já feito sobre o tema", "url": "https://veja.abril.com.br/saude/controle-a-pressao-para-manter-distancia-do-alzheimer-diz-maior-estudo-ja-feito-sobre-o-tema/", "fonte_id": "veja", "data_pub": "2026-08-31T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo, considerado o maior já realizado sobre o tema, concluiu que o tratamento da hipertensão pode reduzir em 15% o risco de desenvolver demência. A pesquisa foi apresentada no Congresso Europeu de Cardiologia.", "titulo_pt": "Controle a pressão para manter distância do Alzheimer, conclui maior estudo já feito sobre o tema", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 135275, "titulo": "Planos de saúde chamam a polícia", "url": "https://veja.abril.com.br/economia/planos-de-saude-chamam-a-policia/", "fonte_id": "veja", "data_pub": "2026-08-31T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As principais operadoras de planos de saúde estão intensificando suas parcerias com as Polícias Civis com o objetivo de combater as fraudes que afetam o setor. Essa medida visa restringir as atividades fraudulentas que têm causado prejuízos significativos ao setor de planos de saúde.", "titulo_pt": "Planos de saúde intensificam parcerias com polícias civis", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 135414, "titulo": "A corrida contra o tempo para resgatar mais de 600 trabalhadores presos em túneis após avalanche no Nepal e no Tibete", "url": "https://www.bbc.com/portuguese/articles/cr503rrgg6mo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-31T16:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Equipes de resgate estão realizando explosões controladas nos túneis para localizar e resgatar mais de 600 trabalhadores presos nas usinas hidrelétricas do Nepal e do Tibete. As autoridades nepalesas informaram sobre a operação.", "titulo_pt": "Corrida contra o tempo para resgatar mais de 600 trabalhadores presos em túneis após avalanche no Nepal e no Tibete", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 135283, "titulo": "Eleições 2026: o que é empate técnico nas pesquisas eleitorais", "url": "https://veja.abril.com.br/politica/eleicoes-2026-o-que-e-empate-tecnico-nas-pesquisas-eleitorais/", "fonte_id": "veja", "data_pub": "2026-08-31T16:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empate técnico nas pesquisas eleitorais ocorre quando as margens de erro dos candidatos se sobrepõem, dificultando a identificação de um líder. Entenda como a margem de erro influencia na interpretação desses levantamentos.", "titulo_pt": "Eleições 2026: o que é empate técnico nas pesquisas eleitorais", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 135862, "titulo": "Central bar packed as Hongkongers aim to raise HK$50,000 for Nepal flood relief", "url": "https://www.scmp.com/news/hong-kong/society/article/3365888/central-bar-packed-hongkongers-aim-raise-hk50000-nepal-flood-relief?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-31T15:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um bar central de Hong Kong ficou lotado com cerca de cem clientes que se reuniram para arrecadar fundos para as vítimas das cheias e deslizamentos de terra devastadores em Nepal. O número de mortos em Nepal subiu para 919, com 4.247 pessoas ainda desaparecidas, de acordo com a CCTV.", "titulo_pt": "Bar central lotado em hong kong visa arrecadar HK$50.000 para auxiliar vítimas de desastres em Nepal", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 134618, "titulo": "Kalil e especialistas comentam como agir diante de uma crise de ansiedade", "url": "https://www.cnnbrasil.com.br/saude/kalil-e-especialistas-comentam-como-agir-diante-de-uma-crise-de-ansiedade/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-31T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Maria Alice Fontes enfatizou a importância da respiração e da separação entre as sensações e a razão durante uma crise de ansiedade. Ao participar do programa CNN Sinais Vitais, ela comentou sobre maneiras de lidar com a ansiedade.", "titulo_pt": "Kalil e especialistas comentam como agir diante de uma crise de ansiedade", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 135135, "titulo": "35% of young unmarried people in Japan have no wish to get wed", "url": "https://www.japantimes.co.jp/news/2026/08/31/japan/marriage-wish-survey/", "fonte_id": "japan_times", "data_pub": "2026-08-31T08:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa mostrou que 35% das pessoas jovens e solteiras no Japão não têm desejo de se casar. Eles preferem se concentrar em hobbies.", "titulo_pt": "35% Das jovens solteiras no Japão não têm desejo de se casar", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 135022, "titulo": "Police under fire after backtracking on hanging evidence in Jeju missing woman's death", "url": "https://www.koreaherald.com/article/10857778", "fonte_id": "korea_herald", "data_pub": "2026-08-31T08:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia foi criticada após reverter sua declaração sobre a causa da morte de Jang Mi-ran, uma mulher de 37 anos que desapareceu em Jeju. Inicialmente, a polícia sugeriu que a morte foi por enforcamento com base em evidências forenses, mas posteriormente afirmou que não podia determinar a causa exata da morte.", "titulo_pt": "Polícia sob fogo após reverter declarações sobre morte por enforcamento de mulher desaparecida em Jeju", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 134520, "titulo": "Restituição do IR cai na conta nesta segunda (31); veja quem recebe no quarto e último lote", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/restituicao-do-ir-cai-na-conta-nesta-segunda-31-veja-quem-recebe-no-quarto-e-ultimo-lote.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Receita Federal efetua o pagamento do quarto lote de restituição do Imposto de Renda 2026 nesta segunda-feira (31), totalizando R$ 1,2 bilhão para 521.935 contribuintes. Este é o último lote regular, mas novos pagamentos podem ser feitos com declarações da malha fina.", "titulo_pt": "Recebimento do quarto lote de restituição do IR 2026 cai na conta nesta segunda (31)", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 135037, "titulo": "Too young for a pension, too old for youth aid: Seoul eyes midlife savings plan", "url": "https://www.koreaherald.com/article/10857618", "fonte_id": "korea_herald", "data_pub": "2026-08-31T06:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Seul planeja criar contas de poupança a longo prazo para ajudar os residentes na meia-idade a superar um período potencialmente difícil entre o último salário e o primeiro pagamento de aposentadoria. Os participantes contribuiriam 80.000 wones mensais durante 10 anos, enquanto a cidade adicionaria 20.000 wones, com a estimativa de que o saldo pudesse chegar a 16,4 milhões de wones, incluindo os retornos de investimento.", "titulo_pt": "Seul planeja plano de poupança para adultos mais velhos", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 135015, "titulo": "Pakistani nurse to be honoured for saving newborn from deadly hospital fire", "url": "https://www.scmp.com/news/asia/south-asia/article/3365802/pakistani-nurse-be-honoured-saving-newborn-deadly-hospital-fire?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-31T04:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma enfermeira paquistanesa resgatou o único bebê sobrevivente de um incêndio em uma creche de neonatos de um hospital governamental em Islamabad, que resultou na morte de 14 outros bebês. Ela será honrada com uma das maiores condecorações civis do país.", "titulo_pt": "Enfermeira paquistanesa será homenageada por salvar bebê de incêndio em hospital", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 136281, "titulo": "PLOA prevê R$ 29,7 bilhões para crédito climático em 2027", "url": "https://www.cnnbrasil.com.br/agro/ploa-preve-r-297-bilhoes-para-credito-climatico-em-2027/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-31T21:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Plano Longo Prazo de Ação (PLOA) prevê um investimento de R$ 29,7 bilhões no crédito climático em 2027, com recursos do Fundo Clima destinados à recuperação de pastagens, plantio direto, bioinsumos e sistemas integrados de produção.", "titulo_pt": "PLOA prevê R$ 29,7 bilhões para crédito climático em 2027", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 135783, "titulo": "Photos: Nearly 1,000 dead, thousands missing in Nepal–China border floods", "url": "https://www.aljazeera.com/gallery/2026/8/31/photos-nearly-1000-dead-thousands-missing-in-nepal-china-border?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-31T17:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 4.000 pessoas permanecem desaparecidas após inundações letais que atingiram Nepal e Tibet, deixando famílias em desespero.", "titulo_pt": "Imagens: quase 1.000 mortos, milhares desaparecidos nas inundações da fronteira entre Nepal e China", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 135298, "titulo": "China registra 16 mortos e 546 desaparecidos no desastre da fronteira com o Nepal", "url": "https://www.brasildefato.com.br/2026/08/31/china-registra-16-mortos-e-546-desaparecidos-no-desastre-da-fronteira-com-o-nepal/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-31T13:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No desastre de um deslizamento de lama na fronteira entre a China e o Nepal, 16 pessoas morreram e 546 desapareceram na região do posto fronteiriço de Gyirong, no Tibete, em 26 de agosto. As informações foram divulgadas pelo governo regional chinês.", "titulo_pt": "China registra 16 mortos e 546 desaparecidos no desastre da fronteira com o Nepal", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 134890, "titulo": "Flash flood hits Grand Canyon’s Phantom Ranch, more than 20 people missing", "url": "http://www.euronews.com/video/2026/08/31/flash-flood-hits-grand-canyons-phantom-ranch-more-than-20-people-missing", "fonte_id": "euronews", "data_pub": "2026-08-31T09:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma cheia repentina atingiu a Fenda do Grande Cañão perto da Ranch de Fantasma, lançando detritos no Rio Colorado, destruindo pontes de madeira e deixando mais de 20 pessoas desaparecidas ou não localizadas.", "titulo_pt": "Cheia repentina atinge fenda do grande cañão, mais de 20 pessoas desaparecidas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 134622, "titulo": "China alerta que lago formado após deslizamento pode subir com chuva", "url": "https://www.cnnbrasil.com.br/internacional/china-alerta-que-lago-formado-apos-deslizamento-pode-subir-com-chuva/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-31T08:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A China alertou que o nível do lago formado após o deslizamento pode aumentar com a chuva. A temperatura pode cair para até 8°C, com uma grande diferença entre o dia e a noite, e o clima pode ficar úmido e frio.", "titulo_pt": "China avisa que nível do lago pode subir com chuva após deslizamento", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 134872, "titulo": "Yosemite, Big Bend, Utah: Trump unleashes wave of attacks on US national parks", "url": "https://www.lemonde.fr/en/environment/article/2026/08/31/yosemite-big-bend-utah-trump-unleashes-wave-of-attacks-on-us-national-parks_6757005_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-31T08:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos está considerando transferir uma pequena parte do Parque Nacional Yosemite para um desenvolvedor privado. Este plano de expandir a área protegida tem gerado forte reação pública.", "titulo_pt": "Yosemite, Big Bend, Utah: trump lança onda de ataques aos parques nacionais dos EUA", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 135007, "titulo": "Malaysia’s air quality turns hazardous as Indonesian wildfires burn", "url": "https://www.scmp.com/week-asia/health-environment/article/3365818/malaysias-air-quality-turns-hazardous-indonesian-wildfires-burn?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-31T07:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A qualidade do ar na região de Sarawak, na Malásia, atingiu níveis perigosos devido às chamas de incêndios florestais na Indonésia. A cidade de Serian registrou um índice de poluição do ar (API) de 476, enquanto Kuching, Samarahan e Sri Aman registraram leituras acima de 300 no início da manhã.", "titulo_pt": "Qualidade do ar na malásia piora com incêndios florestais na indonésia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 134892, "titulo": "Nepal flood death toll passes 900 as search for survivors continues", "url": "http://www.euronews.com/video/2026/08/31/nepal-flood-death-toll-passes-900-as-search-for-survivors-continues", "fonte_id": "euronews", "data_pub": "2026-08-31T06:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Resgatadores em Nepal e Tibet continuaram buscando sobreviventes no domingo após cheias flash ao longo da fronteira que mataram centenas e deixaram milhares desaparecidos, com ajuda aérea sendo enviada para distritos isolados.", "titulo_pt": "Número de mortos por cheias no nepal e tibet alcança mais de 900", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 134894, "titulo": "'They wrote little letters': How kids in Portugal are making money off their neighbours' plastic waste", "url": "http://www.euronews.com/2026/08/31/i-dont-mind-begging-volta-offers-an-opportunity-to-many", "fonte_id": "euronews", "data_pub": "2026-08-31T06:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um programa de depósito de garrafas foi implementado pela primeira vez na Europa do Sul, ajudando o meio ambiente e financiando viagens incluídas nas listas de desejos de crianças portuguesas.", "titulo_pt": "Eles escreveram pequenas letras: como crianças em Portugal estão ganhando dinheiro com o lixo plástico dos vizinhos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 134950, "titulo": "Global coral reef coverage risks irreversible decline, new report warns", "url": "https://www.aljazeera.com/news/2026/8/31/global-coral-reef-coverage-risks-irreversible-decline-new-report-warns?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-31T05:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cobertura global de corais está em risco de um declínio irreversível, conforme alerta um relatório recente. Os corais representam apenas 1% da cobertura marinha, mas abrigam cerca de 25% da vida marinha.", "titulo_pt": "Cobertura global de corais em risco de declínio irreversível, alerta relatório", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 134897, "titulo": "Authorities in Nepal carry out temporary burials of unidentified flood victims causing public outrage", "url": "http://www.euronews.com/2026/08/31/authorities-in-nepal-carry-out-temporary-burials-of-unidentified-flood-victims-causing-pub", "fonte_id": "euronews", "data_pub": "2026-08-31T04:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades no Nepal realizaram sepultamentos temporários de centenas de vítimas fatais das inundações, causando indignação pública, que acusa as autoridades de não seguir os ritos hindus de sepultamento e de mal administrar a situação.", "titulo_pt": "Autoridades na Nepal realizam sepultamentos temporários de vítimas de inundações, causando indignação", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 134873, "titulo": "'No regulation exists:' Suez Canal becomes gateway for invasive species in the Mediterranean", "url": "https://www.lemonde.fr/en/summer-reads/article/2026/08/31/no-regulation-exists-suez-canal-becomes-gateway-for-invasive-species-in-the-mediterranean_6757001_183.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-31T03:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suez Canal, um canal histórico, se tornou um caminho para espécies invasoras no Mediterrâneo. A proliferação dessas espécies, nomeadas 'Lessepsian', está aumentando devido a sobrepeixe, poluição, construção costeira e mudanças climáticas.", "titulo_pt": "Nenhuma regulamentação existe:", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 136201, "titulo": "Irã condena mulheres à morte por participação em manifestações contra governo", "url": "https://veja.abril.com.br/mundo/ira-condena-mulheres-a-morte-por-participacao-em-manifestacoes-contra-governo/", "fonte_id": "veja", "data_pub": "2026-08-31T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Irã está executando mulheres por sua participação em manifestações contra o governo. Protestos contra o governo ganharam força a partir do final de dezembro, motivados pelo colapso econômico e pela desvalorização da moeda local.", "titulo_pt": "Irã executa mulheres por participação em protestos contra governo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 136405, "titulo": "Associação de cannabis medicinal contesta no STF uso de drogômetro em blitze", "url": "https://www.jota.info/saude/associacao-de-cannabis-medicinal-contesta-no-stf-uso-de-drogometro-em-blitze", "fonte_id": "jota", "data_pub": "2026-08-31T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A associação de cannabis medicinal contesta no Supremo Tribunal Federal (STF) a utilização de drogômetros em blitzes, alegando que o equipamento pode penalizar pacientes que utilizam medicamentos cannabisícolas mesmo sem comprovar alteração da capacidade psicomotora.", "titulo_pt": "Associação de cannabis medicinal contesta uso de drogômetro em blitzes no STF", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 135257, "titulo": "Israel fecha acordo de US$ 3,5 bi para defesa aérea da Grécia", "url": "https://www.poder360.com.br/poder-internacional/israel-fecha-acordo-de-us-35-bi-para-defesa-aerea-da-grecia/", "fonte_id": "poder360", "data_pub": "2026-08-31T17:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Israel e a Grécia fecharam um acordo no valor de 3,5 bilhões de dólares para a defesa aérea do país europeu. O sistema de defesa cobrirá mísseis, aeronaves e drones e faz parte do programa de modernização militar grego.", "titulo_pt": "Israel fecha acordo de 3,5 bi para defesa aérea da Grécia", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 135500, "titulo": "Corte de Talca sanciona a conservador Najle por emitir certificados que permitieron vender inmuebles embargados", "url": "https://www.ciperchile.cl/2026/08/31/corte-de-talca-sanciona-a-conservador-najle-por-emitir-certificados-que-permitieron-vender-inmuebles-embargados/?utm_source=rss&utm_medium=rss&utm_campaign=corte-de-talca-sanciona-a-conservador-najle-por-emitir-certificados-que-permitieron-vender-inmuebles-embargados", "fonte_id": "ciper_chile", "data_pub": "2026-08-31T17:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Corte de Talca sancionou o conservador Najle por emitir certificados que permitiram a venda de imóveis embargados. O caso foi publicado inicialmente pelo CIPER Chile.", "titulo_pt": "Corte de Talca sanciona conservador Najle por emitir certificados que permitiram vender imóveis embargados", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 135501, "titulo": "Imágenes históricas inéditas: las fotos del ataque a La Moneda tomadas por la cámara de uno de los aviones Hawker Hunter", "url": "https://www.ciperchile.cl/2026/08/31/imagenes-historicas-ineditas-las-fotos-del-ataque-a-la-moneda-tomadas-por-la-camara-de-uno-de-los-aviones-hawker-hunter/?utm_source=rss&utm_medium=rss&utm_campaign=imagenes-historicas-ineditas-las-fotos-del-ataque-a-la-moneda-tomadas-por-la-camara-de-uno-de-los-aviones-hawker-hunter", "fonte_id": "ciper_chile", "data_pub": "2026-08-31T15:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Foram publicadas imagens históricas inéditas do ataque a La Moneda, capturadas pela câmera de um dos aviões Hawker Hunter.", "titulo_pt": "Imagens históricas inéditas: as fotos do ataque a La Moneda tomadas por uma câmera de um avião Hawker Hunter", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 135871, "titulo": "Freed Hongkonger sent back to jail as storm delays deportation from Philippines", "url": "https://www.scmp.com/news/hong-kong/article/3365869/freed-hongkonger-sent-back-jail-storm-delays-deportation-philippines?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-31T12:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem de Hong Kong foi levado de volta para uma prisão filipina, conforme criticado por sua equipe legal como 'detenção ilegal', após o atraso na deportação devido a uma tempestade que interrompeu seu processo após sua libertação. As autoridades prisionais conduziram Tang Lung-wai ao Bureau of Immigration na sexta-feira, mas devido à suspensão das atividades governamentais devido a um tufão passando, ele foi devolvido à prisão máxima New Bilibid.", "titulo_pt": "Homem de hong kong liberado e depois enviado de volta à prisão na filipinas, devido a tempestade", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 135882, "titulo": "Countries must consider reparations for slave trade, UN committee says", "url": "https://www.scmp.com/news/world/article/3365856/countries-must-consider-reparations-slave-trade-un-committee-says?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-31T10:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um comitê da ONU afirmou que os países estão legalmente obrigados a considerar indenizações pelo comércio transatlântico de escravos e a adotar outras medidas para abordar a persistente discriminação racial. Essa obrigação surge do Convenio de 1965 sobre discriminação racial, não do que existia na época do comércio de escravos.", "titulo_pt": "Comitê da ONU diz que países devem considerar indenizações pelo tráfico de escravos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 134891, "titulo": "UN racial discrimination committee presents legal case for broad slavery reparations", "url": "http://www.euronews.com/2026/08/31/un-racial-discrimination-committee-presents-legal-case-for-broad-slavery-reparations", "fonte_id": "euronews", "data_pub": "2026-08-31T08:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um documento aprovado recentemente, mas publicado recentemente, está previsto para fornecer um novo instrumento legal que apoia as reivindicações de indenizações relacionadas à discriminação racial. Este documento, que foi aprovado pela Comissão da ONU contra a Discriminação Racial, visa fortalecer os argumentos para reparações abrangentes por escravidão.", "titulo_pt": "Comissão da ONU contra a discriminação racial apresenta caso legal para reparações amplos por escravidão", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 135502, "titulo": "Ley Lafkenche y el teatro del absurdo: cuatro ECMPO rechazados en Los Lagos", "url": "https://www.ciperchile.cl/2026/08/31/ley-lafkenche-y-el-teatro-del-absurdo-cuatro-ecmpo-rechazados-en-los-lagos/?utm_source=rss&utm_medium=rss&utm_campaign=ley-lafkenche-y-el-teatro-del-absurdo-cuatro-ecmpo-rechazados-en-los-lagos", "fonte_id": "ciper_chile", "data_pub": "2026-08-31T08:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O título refere-se à rejeição de quatro ECMPO (Entidades de Comunicação, Mídia e Publicidade) em Los Lagos, Chile, em relação ao projeto Ley Lafkenche e o teatro do absurdo.", "titulo_pt": "Ley Lafkenche e o teatro do absurdo: quatro ECMPO rejeitados em Los Lagos", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 134754, "titulo": "Australians missing in Nepal targeted by ‘heartbreaking’ and ‘abhorrent’ racist slurs", "url": "https://www.theguardian.com/australia-news/2026/aug/31/australians-missing-in-nepal-targeted-by-heartbreaking-and-abhorrent-racist-slurs", "fonte_id": "guardian_world", "data_pub": "2026-08-31T06:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Australianos desaparecidos na Nepal-Tibet são alvo de comentários racistas nas redes sociais, levando a pedidos de maior responsab o": "tecnologia", "idioma": "en", "titulo_pt": "El Niño é agora mais forte do que nos últimos 1.000 anos, sugere estudo", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 135469, "fonte_id": "jota", "titulo": "Deep fake, versão 2.0.26", "url": "https://www.jota.info/opiniao-e-analise/artigos/deep-fake-versao-2-0-26", "data_pub": "2026-08-31T16:00:00Z", "topico": "tecnologia", "idioma": "pt", "titulo_pt": "Vídeo de bolsonaro com IA na campanha de flávio testa var eleitoral", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "destaque": {"titulo_evento": "Orçamento 2027: Projeções e Desdobramentos", "texto_pt": "O orçamento de 2027, recentemente enviado ao Congresso Nacional, estabelece um superávit primário de R$ 18,6 bilhões, um marco após quatro anos consecutivos de déficit. Este valor, no entanto, é menor do que a meta inicial de R$ 83,4 bilhões, refletindo a inclusão de gastos fora do arcabouço fiscal. A equipe econômica projeta que a futura Contribuição sobre Bens e Serviços (CBS) arrecadará R$ 636 bilhões, substituindo o PIS, a Cofins e parte do IPI, com o objetivo de extinguir tributos que causam disputas judiciais. O orçamento também prevê um aumento de R$ 4 bilhões em emendas parlamentares, chegando a R$ 44,8 bilhões, um aumento significativo em relação ao orçamento de 2026. Este aumento, no entanto, não inclui as emendas de comissão, que serão decididas pelo Congresso Nacional. O superávit de R$ 18,6 bilhões representa 0,13% do PIB e marca o primeiro ano com saldo positivo após quatro anos consecutivos de déficit. Este orçamento é crucial para o planejamento financeiro do governo e pode influenciar decisões políticas e econômicas no próximo mandato presidencial, além de impactar diretamente a economia e a arrecadação fiscal do país.", "data_edicao": "2026-08-31", "artigos": [{"id": 136170, "titulo": "Orçamento de 2027 tem estimativa de superávit de R$ 83,4 bilhões", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/orcamento-de-2027-tem-estimativa-de-superavit-de-r-834-bilhoes", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-31T21:37:00Z", "topico": "politica_nacional", "idioma": "pt", "texto_resumo": "O projeto do Orçamento de 2027 foi enviado ao Congresso Nacional e estima um superávit primário de R$ 83,4 bilhões. Ainda que esse valor seja cerca de R$ 10 bilhões acima da meta, a estimativa incluindo gastos fora do arcabouço fiscal é de um superávit de R$ 18,6 bilhões.", "titulo_pt": "Orçamento de 2027 prevê superávit primário de R$ 83,4 bilhões", "texto_pt": "O projeto do Orçamento de 2027 foi enviado ao Congresso Nacional e estima um superávit primário de R$ 83,4 bilhões. Ainda que esse valor seja cerca de R$ 10 bilhões acima da meta, a estimativa incluindo gastos fora do arcabouço fiscal é de um superávit de R$ 18,6 bilhões.", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 136153, "titulo": "Orçamento: governo estima arrecadar R$ 636 bilhões com a CBS em 2027, novo tributo da reforma tributária", "url": "https://g1.globo.com/economia/noticia/2026/08/31/orcamento-governo-estima-arrecadar-r-636-bilhoes-com-a-cbs-em-2027-novo-tributo-da-reforma-tributaria.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-31T21:23:00Z", "topico": "politica_nacional", "idioma": "pt", "texto_resumo": "A equipe econômica estima que a futura Contribuição sobre Bens e Serviços (CBS), novo tributo da reforma tributária, arrecadará R$ 636 bilhões em 2027. A CBS substituirá o PIS, a Cofins e parte do IPI, com o objetivo de extinguir tributos que causam disputas judiciais no país.", "titulo_pt": "Orçamento: governo projeta arrecadar R$ 636 bilhões com a CBS em 2027, novo tributo da reforma tributária", "texto_pt": "A equipe econômica estima que a futura Contribuição sobre Bens e Serviços (CBS), novo tributo da reforma tributária, arrecadará R$ 636 bilhões em 2027. A CBS substituirá o PIS, a Cofins e parte do IPI, com o objetivo de extinguir tributos que ca          ${arts.map(n => {

           return `<div class="item" data-flag-url="${esc(n.url)}">

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  return `<div>

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;

  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

  document.querySelectorAll('[data-flag-url]').forEach(function(el) {

    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);

    btn.textContent = ativo ? '⚑' : '⚐';
  });

      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
