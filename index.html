<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

<nav id="nav"></nav>
<main id="main"></main>

</div>

<div class="modal-overlay" id="modal-flag">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

<script>
const D = {"gerado_em": "05/10/2026 15:23", "stats": {"noticias_novas": 1256, "resumos_gerados": 252}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Flávio Bolsonaro saiu como o principal vencedor do primeiro turno das eleições presidenciais de 2026, superando Lula da Silva, do PT. O Ibovespa atingiu um novo recorde histórico, refletindo a preferência do mercado pelo candidato do PL. No entanto, Lula ainda possui uma 'reserva de votos' que pode beneficiá-lo no segundo turno. O cenário político também foi marcado por vitórias do Republicanos, com Cleitinho e Tarcísio sendo eleitos governadores. Além disso, Nikolas Ferreira e Lucas Pavanato foram eleitos os deputados federais mais votados na história, superando o recorde anterior detido por Eduardo Bolsonaro. A JOTA destacou que, mesmo com a vantagem de Flávio Bolsonaro, Lula ainda tem chances de virada, especialmente se conseguir reduzir a abstenção entre os eleitores mais pobres.", "mundo": "Flávio Bolsonaro obteve uma surpreendente vitória na primeira rodada das eleições presidenciais do Brasil, com 47,03% dos votos, contra 45,16% de Lula, colocando o petista em uma situação difícil para vencer na segunda rodada, marcada para o dia 25 de outubro. Internamente, o presidente dos Estados Unidos, Donald Trump, está assumindo o controle da campanha republicana para as eleições médias de novembro, mas parece ter perdido a instintiva habilidade política que o beneficiou até agora. Na Ucrânia, a vida cotidiana na capital Kiev tem sido interrompida por alertas de artilharia e bombardeios, afetando significativamente a vida dos residentes, que, por enquanto, não se rendem a um novo exílio. Além disso, a imprensa internacional noticiou o avanço de Flávio Bolsonaro sobre Lula, citando-o como um 'troféu que falta para Trump', destacando o erro das pesquisas sobre a vitória do candidato da extrema-direita no primeiro turno das eleições presidenciais brasileiras.\n\nO programa de avaliação conjunta dos Estados Unidos em Taiwan, envolvendo reuniões e simulações de guerra, destaca a importância geopolítica da região. Em outro desenvolvimento, a retirada dos bombardeiros americanos da base no Reino Unido, em meio a suspeitas de um ataque terrorista, levanta questionamentos sobre as estratégias do Irã em relação às intenções de Trump. O Irã reafirma seu controle do Estreito de Ormuz, enquanto, em setembro, não carregou petróleo em navios-tanque, conforme informou o secretário do Tesouro dos Estados Unidos. Paralelamente, a Coreia do Norte é acusada de plantar minas na Zona de Descongelamento, com a Coreia do Sul exigindo uma investigação e a remoção das minas. A Rússia intensifica seus ataques a infraestruturas em Kiev, enquanto Israel segue uma política complacente, conforme expresso pelo termo hebraico para cegueira complacente. O declínio demográfico e a paralisia política na China são discutidos no artigo 'China’s Long Twilight', enquanto a Índia estabelece uma presença na Ásia Central ao vender seu sistema de mísseis Akash a Tajiquistão e Turcomenistão. O assassinato de Anna Yagi em Okinawa, um dos últimos de uma série de crimes cometidos por pessoal dos Estados Unidos em Okinawa, é abordado, assim como a situação em Oleshky, Ucrânia, onde ucranianos enfrentam fome, drones e minas terrestres. A diminuição da detergência russa e a não eficácia das ameaças nucleares de Putin são discutidas, bem como a proposta de focar nas comunidades locais para resolver problemas globais.", "economia": "O mercado financeiro brasileiro reagiu positivamente após o resultado do primeiro turno das eleições, com o Ibovespa atingindo 200 mil pontos e o dólar caindo para menos de R$ 5. O resultado favoreceu o candidato Flávio Bolsonaro, que obteve 47,03% dos votos válidos contra 45,16% para Lula. A expectativa de uma eventual administração de Flávio Bolsonaro levou a uma queda nas taxas de juros e uma euforia no mercado, refletida na valorização das ações da Petrobras, varejistas e bancos. O BNDES solicitou a liberação de R$ 6,5 bilhões para o programa Brasil Soberano, visando auxiliar empresas afetadas por tarifas internacionais. Em contrapartida, o euro atingiu seu nível mais baixo em 17 meses em relação ao dólar, devido a altos preços da energia e preocupações com as finanças públicas francesas. Além disso, a Saudi Aramco advertiu sobre a baixa reserva de petróleo, alertando que seria necessário dois anos para reabastecer as reservas antes da guerra no Oriente Médio, que já dura mais de sete meses.", "tecnologia": "Está sendo elaborado um plano de testes de inteligência artificial (IA) por um oficial de cybersegurança, conforme relata o Taipei Times. Detalhes específicos sobre o plano ainda não foram divulgados. Segundo o MIT Technology Review, a IA corporativa carece de conhecimento empresarial para interpretar dados de forma eficaz, o que é crucial para a tomada de decisões. A disputa pelo controle da vida digital na indústria de IA levanta preocupações sobre perda de controle e questões de confiança, conforme noticiado pelo Exame. A LG Electronics vendeu um contrato para um centro de dados de IA nos Estados Unidos, informa a Yonhap News. No cenário regulatório, Sam Altman, CEO do OpenAI, defende que os benefícios da IA superam os riscos, apesar de alguns problemas ao longo do caminho, conforme publicado pelo The Verge. A indústria de IA enfrenta desafios regulatórios, com a possibilidade de regulamentação em curso, como mencionado pelo CNBC International. A CEO da AMD, Lisa Su, visitará a Coreia do Sul para estabelecer parcerias, prevê o Euronews. A expansão da infraestrutura de centrais de dados de IA está aumentando a demanda por chips de memória, levando a um aumento de preços de smartphones, informa o Rest of World.", "ciencia": "O Prêmio Nobel de Medicina de 2026 foi concedido a Karl Deisseroth, Peter Hegemann e Georg Nagel, por suas contribuições para a optogenética, um método que utiliza luz e genética para controlar células individuais. Este avanço revolucionou a pesquisa do cérebro e a compreensão de comportamentos complexos, como aprendizado, medo, adicção e movimento. Em outro desenvolvimento científico, pesquisadores sugerem que microblazars, versões miniaturizadas de blazars, podem ser responsáveis por partículas de alta energia misteriosas que apontam para a Terra, oferecendo novos caminhos para a investigação de fenômenos cósmicos. Além disso, estudos indicam que estrelas anãs podem ser mais vorazes do que se pensava, possivelmente devorando gradualmente os astros que orbitam ao seu redor, enquanto a NASA testa métodos para prevenir a formação de gelo em aeronaves passando por nuvens com gotas de água supercongeladas. O interesse por fósseis de dinossauros continua forte, com a Sotheby's planejando outro leilão de um esqueleto de dinossauro raro três meses após vender um Tyrannosaurus rex por US$ 50,1 milhões.", "cultura": "A quarta edição da feira Affair, que acontece de 28 de outubro a 1 de novembro, oferece uma experiência única para os visitantes, permitindo que sigam seus impulsos ao comprar arte. A feira inclui performances, música e um programa especial para novos compradores. Em outro desenvolvimento cultural, a casa de leilões Christie’s planeja vender oito pinturas e uma escultura de Jeff Koons, avaliadas em US$ 100 milhões, em um leilão no dia 17 de novembro, em Nova York. O leilão terá como tema 'Heroes and Lovers', e as obras são parte da coleção pessoal de Koons. Em homenagem a John Coltrane, o Branford Marsalis Quartet e a cantora Dianne Reeves se apresentarão no Cultura Artística, em São Paulo, em 9 de setembro de 2027, às 20h, baseados no álbum 'John Coltrane and Johnny Hartman' de 1963.", "sociedade": "Os protestos nas escolas francesas continuam, com destaque para o caso de um adolescente de 15 anos que perdeu uma mão ao pegar uma granada policial durante confrontos em Lens. Essa onda de protestos, que já dura três semanas e afeta centenas de escolas, levanta preocupações sobre a resposta policial e as condições das salas de aula. Em São Paulo, a proibição de bisnagas de molhos em lanchonetes foi adiada para 2027, dando mais tempo aos estabelecimentos para se adaptarem. Na Bahia, ocorreu o assassinato de uma mulher de 47 anos, Cristina Ribeiro dos Santos, que foi morta a facadas em sua casa. Na ilha grega de Kalamos, a sala de aula ficou vazia com apenas dois alunos, indicando uma tendência de declínio populacional em escolas remotas na Europa. Além disso, um suspeito de integrar o alto escalão do PCC foi preso no litoral de São Paulo, conhecido pelo apelido de 'pato rouco', e um homem de aproximadamente 20 anos foi detido em Seul suspeito de matar um estranho idoso.", "meio_ambiente": "Inundações deixaram as ruas e estradas submersas em Catalunha, com duas pessoas mortas e uma desaparecida, além de mais de 1.500 chamadas para os serviços de bombeiros devido a fortes chuvas. O persistente período de seca está gerando preocupações sobre a segurança hídrica em redes de água na França. Em Gante, na Bélgica, os canais históricos ficaram verdes devido ao verão mais quente do registro, causando problemas para as embarcações turísticas e levantando novas preocupações sobre o clima. Um incidente comum em um depósito de reciclagem em Belo Horizonte, Brasil, assustou os moradores, mas não resultou em vítimas.", "direitos_humanos": "Um ativista rohingya denuncia que é injusto enviar refugiados de volta para Myanmar, onde enfrentam perseguição. Em Paris, um estudante norte-coreano, Kang Gyu-ri, de 25 anos, sobreviveu a uma jornada perigosa para escapar de sua nação e agora testemunha um julgamento por supostas torturas sexuais a menores. O The Guardian financiou uma cirurgia vital para um menino somali ferido em um ataque aéreo, enquanto em Hwaseong e Cheongju, na Coreia do Sul, 17 estrangeiros, incluindo bebês e crianças pequenas, estavam detidos em centros de imigração. Finalmente, uma operação policial em um bar gay em Taiwan levantou preocupações sobre a discriminação sexual, com grupos denunciando a ação policial. Estes eventos ilustram a variedade de desafios enfrentados em direitos humanos, desde a perseguição de minorias até a proteção de crianças feridas em conflitos e a luta contra a discriminação sexual."}, "resumo_do_dia": {"politica_nacional": [{"id": 195691, "titulo": "Anitta declara apoio a Eduardo Paes e desabafa: \"Medo do futuro\"", "url": "https://www.metropoles.com/colunas/lucas-pasin/anitta-declara-apoio-a-eduardo-paes-e-desabafa-medo-do-futuro", "fonte_id": "metropoles", "data_pub": "2026-10-05T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Anitta apoiou Eduardo Paes no segundo turno das eleições para o governo do Rio de Janeiro e expressou medo durante a apuração dos votos.", "titulo_pt": "Anitta declara apoio a Eduardo Paes e desabafa sobre medo do futuro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 195623, "titulo": "Difícil, mas Lula pode virar se mudar a rota e souber jogar", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/dora-kramer/2026/10/dificil-mas-lula-pode-virar-se-mudar-a-rota-e-souber-jogar.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-05T17:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O desempenho da direita foi significativo, mas não foi o suficiente para garantir que a eleição esteja decidida. Jair Bolsonaro e seus aliados não conseguiram consolidar uma vitória clara.", "titulo_pt": "Difícil, mas Lula pode virar se mudar a rota e souber jogar", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 195852, "titulo": "Projeto do fim da escala 6x1 será derrotado no Senado, mas virará último ativo eleitoral de Lula, avalia historiador", "url": "https://www.bbc.com/portuguese/articles/cxp8gl2zlez7o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-05T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O professor catedrático Luiz Felipe de Alencastro, da Universidade Sorbonne, na França, avaliou que os resultados do primeiro turno indicam uma 'reserva de votos' que beneficiará Flávio Bolsonaro no segundo turno da eleição.", "titulo_pt": "Projeto do fim da escala 6x1 será derrotado no Senado, mas virará último ativo eleitoral de Lula, avalia historiador", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 195853, "titulo": "O que está por trás da euforia do mercado com vantagem de Flávio Bolsonaro no 1º turno", "url": "https://www.bbc.com/portuguese/articles/c933xvxj7dryo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-05T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibovespa atingiu um novo recorde histórico e o dólar caiu abaixo de R$ 5 nesta segunda-feira (5/10), em meio à surpreendente vantagem de Flávio Bolsonaro no primeiro turno das eleições.", "titulo_pt": "O que está por trás da euforia do mercado com vantagem de Flávio Bolsonaro no 1º turno", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 195674, "titulo": "Paes culpa nacionalização da campanha e voto casado por revés no primeiro turno", "url": "https://veja.abril.com.br/politica/paes-culpa-nacionalizacao-da-campanha-e-voto-casado-por-reves-no-primeiro-turno/", "fonte_id": "veja", "data_pub": "2026-10-05T17:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-prefeito do Rio de Janeiro terminou em segundo lugar no primeiro turno das eleições, atrás do candidato bolsonarista Douglas Ruas. Paes foi favorito nas pesquisas, mas não conseguiu se classificar para o segundo turno.", "titulo_pt": "Paes culpa nacionalização da campanha e voto casado por revés no primeiro turno", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 195778, "titulo": "São Paulo e Minas Gerais inviabilizam palanque para Lula no 2º turno", "url": "https://www.cnnbrasil.com.br/eleicoes/sao-paulo-e-minas-gerais-inviabilizam-palanque-para-lula-no-2o-turno/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-05T17:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "São Paulo e Minas Gerais não permitirão o uso de palanques para Lula no segundo turno, o que prejudica sua campanha e beneficia Flávio Bolsonaro.", "titulo_pt": "São Paulo e Minas Gerais negam palanque para Lula no 2º turno", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 195793, "titulo": "Quem zerou na eleição? 7 candidatos não receberam nem o próprio voto", "url": "https://www.infomoney.com.br/politica/quem-zerou-na-eleicao-7-candidatos-nao-receberam-nem-o-proprio-voto/", "fonte_id": "infomoney", "data_pub": "2026-10-05T17:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em todos os cinco estados, todas as seções eleitorais foram totalizadas para o cargo de deputado estadual. No entanto, sete candidatos não receberam nem mesmo seus próprios votos.", "titulo_pt": "Quem ficou em branco na eleição? 7 candidatos não receberam nem o próprio voto", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 195680, "titulo": "Saiba os candidatos a presidente com maior e menor ‘custo por voto’ recebido", "url": "https://veja.abril.com.br/politica/saiba-os-candidatos-a-presidente-com-maior-e-menor-custo-por-voto-recebido/", "fonte_id": "veja", "data_pub": "2026-10-05T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato Zema gastou R$ 15,86 por cada voto, enquanto Cury teve despesas de apenas R$ 0,16 por voto.", "titulo_pt": "Saiba os candidatos a presidente com maior e menor 'custo por voto'", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 195685, "titulo": "A pedra no sapato de Lula para viabilizar estratégia de virada sobre Flávio Bolsonaro", "url": "https://veja.abril.com.br/politica/a-pedra-no-sapato-de-lula-para-viabilizar-estrategia-de-virada-sobre-flavio-bolsonaro/", "fonte_id": "veja", "data_pub": "2026-10-05T16:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Depois do primeiro turno, Lula planeja reduzir a abstenção para aumentar seu apoio. Uma das estratégias do petista é atrair votos que não compareceram às urnas para sua candidatura.", "titulo_pt": "Pedra no sapato de Lula para diminuir abstenção e vencer Flávio Bolsonaro", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 196258, "titulo": "Brazilian stocks jump as Bolsonaro now seen as heavy favorite to win presidency", "url": "https://www.cnbc.com/2026/10/05/brazilian-stocks-jump-bolsonaro-now-heavy-favorite-to-win-presidency.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-05T15:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações brasileiras subiram após os resultados do primeiro turno das eleições presidenciais no Brasil, com Bolsonaro se tornando favorito para a disputa final contra Lula da Silva em 25 de outubro.", "titulo_pt": "Ações brasileiras ganham força com Bolsonaro como favorito para segunda volta", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 195546, "titulo": "Dianteira de Flávio Bolsonaro gera expectativa por ajuste fiscal, mas 'pauta da vingança' pode atrapalhar", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/dianteira-de-flavio-bolsonaro-gera-expectativa-por-ajuste-fiscal-mas-pauta-da-vinganca-pode-atrapalhar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-05T15:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A liderança de Flávio Bolsonaro nas pesquisas de intenção de voto e a nova composição do Congresso Nacional em 2027 levantaram expectativas de que medidas de ajuste fiscal possam ser mais facilmente aprovadas. No entanto, uma 'pauta da vingança' pode dificultar esse processo.", "titulo_pt": "Dianteira de Flávio Bolsonaro e nova composição do congresso alimentam expectativas de ajuste fiscal, mas 'pauta da vingança' pode atrapalhar", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 195855, "titulo": "Lula x Flávio no 2º turno: para onde vão os votos de Cury, Renan e Caiado?", "url": "https://www.bbc.com/portuguese/articles/cm209062n3wgo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-05T14:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um especialista e uma pesquisa eleitoral realizada antes do primeiro turno sugerem que Flávio Bolsonaro seria o principal beneficiário de votos transferidos de eleitores da chamada terceira via.", "titulo_pt": "Lula x Flávio no 2º turno: para onde vão os votos de ciro, Renan e rui?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 195918, "titulo": "Para buscar vitória de Pirro, cabe a Lula relembrar caos bolsonarista no poder", "url": "https://www.jota.info/opiniao-e-analise/colunas/democracia-em-transe/para-buscar-vitoria-de-pirro-cabe-a-lula-relembrar-caos-bolsonarista-no-poder", "fonte_id": "jota", "data_pub": "2026-10-05T14:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto sugere que, mesmo se reeleito, Lula terá que lidar com os efeitos do governo Bolsonaro. O título indica que a "provavel_duplicata_de": null, "texto_pt": "O analista político Creomar de Souza afirma que Lula precisa fazer um gesto expressivo para inverter a situação. Segundo ele, um dos erros na campanha do candidato é a falta de diálogo com o centro.", "titulo_pt": "Lula terá que fazer gesto expressivo para virar a situação, diz analista político", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 196457, "titulo": "US defense experts to participate in meetings, war games in Taiwan joint assessment program", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/06/2003865473", "fonte_id": "taipei_times", "data_pub": "2026-10-06T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Especialistas em defesa dos Estados Unidos participarão de reuniões e jogos de guerra como parte do programa de avaliação conjunta em Taiwan.", "titulo_pt": "Especialistas em defesa dos EUA participarão de reuniões e jogos de guerra em programa de avaliação conjunta em Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 196336, "titulo": "Trump poised to ease red diesel limits in attempt to quell fuel inflation", "url": "https://www.ft.com/content/8a733f73-d506-49ae-9030-2bbf0987bc8d?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-05T17:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Trump, está prestes a anunciar uma medida para aliviar as restrições sobre o diesel vermelho durante uma visita ao estado agrícola do Nebraska. Este movimento visa combater a inflação no preço do combustível.", "titulo_pt": "Trump pode facilitar restrições ao diesel vermelho para combater inflação", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 196342, "titulo": "Rubio: No direct link between US bombers removal and UK base incident", "url": "https://www.aljazeera.com/news/2026/10/5/rubio-no-direct-link-between-us-bombers-removal-and-uk-base-incident?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-05T17:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rubio visitou a Islândia e afirmou que não há ligação direta entre a remoção dos bombardeiros dos Estados Unidos e as suspeitas de um ato terrorista no Reino Unido.", "titulo_pt": "Rubio: não há ligação direta entre remoção de bombardeiros e incidente no reino unido", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 195837, "titulo": "Corredor submarino via Cabo Verde vai ligar Brasil e Europa e reduzir passagem de dados brasileiros pelos EUA", "url": "https://www.cartacapital.com.br/do-micro-ao-macro/de-cix-cabo-verde-telecom-corredor-dados-lisboa-sao-paulo/", "fonte_id": "cartacapital", "data_pub": "2026-10-05T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O arquipélago de Cabo Verde, com menos de 600 mil habitantes, está prestes a se tornar um ponto crucial para o tráfego de dados entre o Brasil e a Europa, após a construção de um corredor submarino. O país, conhecido historicamente como escala para navios no Atlântico Sul, agora ganha destaque na área de telecomunicações.", "titulo_pt": "Corredor submarino via Cabo Verde vai ligar Brasil e Europa", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 196481, "titulo": "Ex-USFK commander warns time-based OPCON transfer could weaken deterrence against N. Korea", "url": "https://en.yna.co.kr/view/AEN20261006000200315", "fonte_id": "yonhap_news", "data_pub": "2026-10-05T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ex-comandante das Forças Armadas dos Estados Unidos na Coreia do Sul advertiu que a transferência de comando baseada no tempo poderia enfraquecer a dissuasão em relação à Coreia do Norte.", "titulo_pt": "Ex-comandante das forças armadas da Coreia do sul alerta sobre possíveis desvantagens da transferência de comando", "v ove they can give young protesters hope", "url": "https://www.theguardian.com/world/2026/oct/05/protests-in-france-and-spain-appear-disparate-but-core-issues-are-the-same", "fonte_id": "guardian_world", "data_pub": "2026-10-05T14:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em França e Espanha, as forças governantes precisam demonstrar que podem oferecer esperança aos jovens manifestantes. Ações de protesto contra a crise imobiliária e a deterioração das escolas refletem a desilusão da geração jovem com o sistema político.", "titulo_pt": "Em França e Espanha, partidos governantes devem provar que podem dar esperança aos jovens manifestantes", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 196093, "titulo": "Russia’s Air War Aims to Bleed Ukraine Dry", "url": "https://foreignpolicy.com/2026/10/05/russia-ukraine-air-war-missiles-drones-putin-strategy-victory/", "fonte_id": "foreign_policy", "data_pub": "2026-10-05T14:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O plano de Vladimir Putin para a vitória na guerra envolve um cessar-fogo que está fora de alcance. As ações aéreas russas têm como objetivo esvaziar economicamente a Ucrânia.", "titulo_pt": "Guerra aérea russa visa esgotar a economia ucraniana", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 196356, "titulo": "Murder in Okinawa: The US military’s history of alleged crime in Japan", "url": "https://www.aljazeera.com/news/2026/10/5/murder-in-okinawa-the-us-militarys-history-of-alleged-crime-in-japan?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-05T14:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O assassinato de Anna Yagi, de 39 anos, é o último de uma série de crimes cometidos por pessoal dos Estados Unidos em Okinawa.", "titulo_pt": "Morte em Okinawa: histórico de crimes envolvendo personalidades militares americanas no Japão", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 196338, "titulo": "Ellison sticks with Thompson as CNN boss amid Trump attacks", "url": "https://www.ft.com/content/17ca0b3c-604e-4690-b58a-f65dfce15b5d?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-05T14:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ellison manteve Thompson como chefe da CNN, mesmo durante ataques de Trump. Uma grande negociação para combinar Paramount e Warner Bros está prevista para ser concluída no dia seguinte.", "titulo_pt": "Ellison mantém Thompson como chefe da CNN antes de acordo paramount-warner bros", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 196357, "titulo": "US pulls bombers from UK base: Is Iran manoeuvring Trump’s war plans?", "url": "https://www.aljazeera.com/news-analysis/2026/10/5/us-pulls-bombers-from-uk-base-is-iran-maneouvering-trumps-war-plans?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-05T14:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os bombardeiros americanos foram retirados da base no Reino Unido, o que significa que os Estados Unidos perderam um ponto de lançamento conveniente, mas não sua capacidade de ataque subjacente, segundo um especialista.", "titulo_pt": "EUA removem bombardeiros da base britânica: Irã está movimentando os planos de guerra de Trump?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 196044, "titulo": "Hundreds of Australians, including war veterans, are being buried in unmarked communal graves", "url": "https://www.theguardian.com/australia-news/2026/oct/06/poor-australians-war-veterans-buried-unmarked-graves", "fonte_id": "guardian_world", "data_pub": "2026-10-05T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 100 australianos, incluindo veteranos da guerra, são enterrados em valas comuns sem marcação, frequentemente contendo quatro ou mais pessoas. Esta prática foi descrita por pare s’ created by global market turmoil", "url": "https://www.ft.com/content/ae67bb6f-f227-4679-949f-2e79e2dc33e2?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-05T17:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Patrick Pouyanné, o CEO da TotalEnergies, celebra as oportunidades criadas pela turbulência do mercado global, mesmo a empresa francesa sendo uma das mais afetadas pelo conflito no Oriente Médio.", "titulo_pt": "Ceo da totalenergies celebra oportunidades criadas pela turbulência do mercado", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 195540, "titulo": "Starbucks é processada nos EUA por conta de bebidas proteicas 'sem açúcar'", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/starbucks-e-processada-nos-eua-por-conta-de-bebidas-proteicas-sem-acucar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-05T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Starbucks foi processada por consumidores dos EUA que alegaram que a empresa anunciou falsamente oito bebidas proteicas como 'sem açúcar' porque contêm lactose, um açúcar naturalmente presente no leite.", "titulo_pt": "Starbucks é processada nos EUA por bebidas proteicas 'sem açúcar'", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 196331, "titulo": "French central bank head warns country at risk of being ‘strangled by interest rates’", "url": "https://www.ft.com/content/74c3cc77-1593-4c49-90f9-0d92fa3a2418?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-05T16:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Emmanuel Moulin, chefe do banco central francês, alerta que o país corre o risco de ser 'estrangulado por taxas de juros'. Apesar disso, ele afirma que a França ainda consegue tranquilizar os investidores em títulos do governo.", "titulo_pt": "Chefe do banco central francês avisa risco de 'estragulamento por taxas de juros'", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 195542, "titulo": "Um café gelado deveria mesmo lhe custar o emprego?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/um-cafe-gelado-deveria-mesmo-lhe-custar-o-emprego.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-05T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A questão atual no mercado de trabalho refere-se à percepção sobre levar um café gelado para uma entrevista de emprego. O texto sugere que isso é uma questão mais urgente do que outros temas como inteligência artificial ou desemprego de recém-formados e pessoas mais velhas.", "titulo_pt": "Um café gelado deveria realmente comprometer o seu emprego?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 196339, "titulo": "Citi to speed up promotion path for junior bankers as hiring war heats up", "url": "https://www.ft.com/content/41b567dc-50e9-4c41-95bb-e295caaf2340?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-05T15:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Citi vai acelerar o caminho de promoção para os bancários de investimentos de nível inicial e reduzir o programa de analista de bancos de investimento para dois anos, em resposta à intensificação da competição pelo recrutamento de jovens profissionais. A medida visa prevenir a atração de jovens trabalhadores por parte das firms de private equity.", "titulo_pt": "Citi vai acelerar promoção e reduzir programa de analistas para reagir à guerra pelo recrutamento", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 196332, "titulo": "Euro slides to 17-month low against dollar", "url": "https://www.ft.com/content/8b19b9f7-9237-47bf-bc50-d8b78aa7fe24?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-05T15:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O euro atingiu seu nível mais baixo em 17 meses em relação ao dólar devido a altos preços da energia e preocupações com as finanças públicas francesas.", "titulo_pt": "Euro cai para nível mais baixo em 17 meses contra o dólar", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 195543, "titulo": "Setor de infraestrutura vê pouca mudança com Lula ou Flávio Bolsonaro e cobra juros menores", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/10/setor-de-infraestrutura-ve-pouca-mudanca-com-lula-ou-flavio-bolsonaro-e-cobra-juros-menores.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-05T15:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A indústria de infraestrutura observa com cautela o segundo turno entre Flávio Bolsonaro e Lula, focando principalmente na redução dos juros elevados e na disponibilidade do Orçamento público para financiar projetos. O setor espera por medidas que possam facilitar o financiamento de obras.", "titulo_pt": "Setor de infraestrutura vê segundo turno com foco em juros menores e maior espaço orçamentário", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 195544, "titulo": "Arandu, antiga Reag, anuncia confirmação de oferta pública de aquisição de ações", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/10/01/6562-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post467439", "fonte_id": "folha_mercado", "data_pub": "2026-10-05T15:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Arandu Investimentos, que era conhecida como Reag, informou que o pedido de oferta pública de aquisição de ações (OPA) foi deferido pela CVM. A oferta abrange todas as ações da empresa, exceto aquelas detidas pela própria holding administradora.", "titulo_pt": "Arandu, ex-reag, confirma oferta pública de aquisição de ações", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 195550, "titulo": "Huawei anuncia acordo com Qualcomm para licenciamento de patentes", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/huawei-anuncia-acordo-com-qualcomm-para-licenciamento-de-patentes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-05T13:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Huawei anunciou um acordo com a Qualcomm para licenciamento de patentes relacionadas a inteligência artificial, 5G, computação e redes. O acordo foi anunciado na segunda-feira, 5 de maio de 2026.", "titulo_pt": "Huawei anuncia acordo com Qualcomm para licenciamento de patentes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 195553, "titulo": "CEO da Saudi Aramco diz que reserva de petróleo está muito baixa e cobra governos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/ceo-da-saudi-aramco-diz-que-reserva-de-petroleo-esta-muito-baixa-e-cobra-governos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-05T13:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CEO da Saudi Aramco, Amir Nasser, afirmou que os estoques mundiais de petróleo estão muito baixos e que seria necessário dois anos para reabastecer as reservas antes da guerra no Oriente Médio, que já dura mais de sete meses.", "titulo_pt": "CEO da Saudi Aramco alerta sobre reservas de petróleo muito baixas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 195554, "titulo": "CallMed prevê R$ 150 milhões de faturamento, impulsionada por fundo equity", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/callmed-preve-r-150-milhoes-de-faturamento-impulsionada-por-fundo-equity.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-05T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A CallMed Saúde projeta um faturamento anual de R$ 150 milhões em 2027, com um crescimento previsto de 50% nesse período. Desde a pandemia da Covid-19, a empresa dobrou seu tamanho, atendendo operadoras e hospitais no estado de São Paulo, com investimento do fundo private equity XR Advisor.", "titulo_pt": "Callmed prevê faturamento de R$ 150 milhões em 2027, impulsionada por fundo equity", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 195555, "titulo": "Ibovespa bate 200 mil pontos e dólar cai para menos de R$ 5, com euforia após resultado das eleições", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/dolar-despenca-para-abaixo-de-r-5-apos-flavio-bolsonaro-liderar-1o-turno-das-eleicoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-05T12:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibovespa atingiu 200 mil pontos e o dólar caiu para menos de R$ 5, refletindo a vantagem de Flávio Bolsonaro no primeiro turno das eleições sobre Lula. Os juros futuros também recuaram nessa segunda-feira (5).", "titulo_pt": "Ibovespa bate 200 mil pontos e dólar cai para menos de R$ 5 com resultado das eleições", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 195556, "titulo": "Claro NXT protocola oferta pública de aquisição de ações da Desktop", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/10/01/6562-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post467437", "fonte_id": "folha_mercado", "data_pub": "2026-10-05T12:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa Desktop informou que a controladora Claro NXT Telecomunicações protocolou um pedido de registro de uma oferta pública de aquisição de ações. A ação ocorreu nesta segunda-feira, 5 de maio de 2026.", "titulo_pt": "Claro NXT protocola oferta pública de aquisição de ações da Desktop", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 195558, "titulo": "Grupo Smart Fit anuncia investimento de até R$ 32 mi no Buddha Spa e mira expansão na América do Sul", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/grupo-smart-fit-anuncia-investimento-de-ate-r-32-mi-no-buddha-spa-e-mira-expansao-na-america-do-sul.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-05T12:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Grupo Smart Fit anunciou um acordo para comprar até 20% das ações da rede Buddha Spa, com um valor potencial de até R$ 32 milhões. A operação visa a expansão da rede na América do Sul.", "titulo_pt": "Smart Fit anuncia investimento de até R$ 32 mi no Buddha Spa e mira expansão na América do Sul", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 196464, "titulo": "Cyber official plans AI testing", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/06/2003865480", "fonte_id": "taipei_times", "data_pub": "2026-10-06T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um oficial de cybersegurança está planejando testes de inteligência artificial. Os detalhes específicos do plano não foram fornecidos.", "titulo_pt": "Oficial de cybersegurança planeja testes de IA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 196587, "titulo": "6 Guidelines for Governing AI", "url": "https://spectrum.ieee.org/6-guidelines-governing-ai", "fonte_id": "ieee_spectrum", "data_pub": "2026-10-05T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor, que inicialmente trabalhou em gerenciamento de produtos e análise de dados sozinho, hoje lidera a transformação empresarial de inteligência artificial na Lowe's, uma varejista de materiais de construção de grande porte. O objetivo é usar a inteligência artificial para entregar soluções, não para vendê-la.", "titulo_pt": "6 Guias para regulamentar inteligência artificial", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 196259, "titulo": "AI researcher warns 'we are racing to build and grow our own adversary' in NYC hearing", "url": "https://www.cnbc.com/2026/10/05/anthropic-openai-google-meta-execs-testify-nyc-council-ai-hearing.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-05T17:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores em inteligência artificial alertam que estamos correndo para construir e expandir nossos próprios adversários, e os principais laboratórios de IA estão sendo submetidos a uma crescente fiscalização em relação às práticas de segurança e segurança.", "titulo_pt": "Pesquisador de IA avisa: 'estamos correndo para construir e expandir nossos próprios adversários' em audiência em nova york", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 196255, "titulo": "Satya Nadella reinvented Microsoft once. Can he do it again in the AI era?", "url": "https://www.cnbc.com/2026/10/05/satya-nadella-reinvented-microsoft-once-can-he-do-it-in-the-ai-era.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-05T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Satya Nadella, que assumiu a Microsoft após Steve Ballmer em 2014, transformou a empresa em uma gigante do cloud computing. Agora, ele enfrenta o desafio de tornar a Microsoft uma potência na era da inteligência artificial.", "titulo_pt": "Satya Nadella reinventou a Microsoft uma vez. Ele pode fazê-lo novamente na era da IA?", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 196514, "titulo": "Sam Altman says ‘some bad things’ will happen, but AI is totally worth it", "url": "https://www.theverge.com/ai-artificial-intelligence/1004811/openai-altman-bad-things-ai-tradeoff", "fonte_id": "the_verge", "data_pub": "2026-10-05T16:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sam Altman acredita que os benefícios da IA serão tão grandes que a sociedade deve aceitar alguns problemas ao longo do caminho. Para ele, os riscos, como hacks e fraudes, são aceitáveis em troca do enorme potencial positivo da tecnologia.", "titulo_pt": "Sam Altman diz que 'alguns maus eventos' ocorrerão, mas a IA vale a pena", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 196203, "titulo": "Letter from Paris | Who will win the AI battle?", "url": "https://www.lemonde.fr/en/m-le-mag/article/2026/10/05/letter-from-paris-who-will-win-the-ai-battle_6758271_117.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-05T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Marie-Pierre Lannelongue, diretora editorial da revista M, escreve uma coluna duas vezes por mês sobre moda, cultura, viagens e outros assuntos.", "titulo_pt": "Carta de Paris | quem vencerá a batalha da IA?", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 196503, "titulo": "Connecting AI agents to enterprise knowledge", "url": "https://www.technologyreview.com/2026/10/05/1145580/connecting-ai-agents-to-enterprise-knowledge/", "fonte_id": "mit_tech_review", "data_pub": "2026-10-05T15:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Embora os sistemas de inteligência artificial acumulem e analisem grandes quantidades de dados, os agentes de inteligência artificial corporativa frequentemente carecem de conhecimento. Este conhecimento é essencial para que os agentes possam interpretar os dados no contexto específico de cada organização, raciocinar sobre situações, tomar decisões e, consequentemente, realizar suas funções de maneira eficaz.", "titulo_pt": "Conectando agentes de IA às informações corporativas", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 196517, "titulo": "CNN’s boss will remain as Paramount and WBD merge into Skydance", "url": "https://www.theverge.com/entertainment/1004734/cnn-ceo-mark-thompson-paramount-warner-bros", "fonte_id": "the_verge", "data_pub": "2026-10-05T14:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da CNN, Mark Thompson, continuará à frente da rede de notícias após a fusão da Paramount e Warner Bros. Discovery com a Skydance. Thompson acredita que a empresa combinada apoiará a independência da CNN na prática e na teoria.", "titulo_pt": "O chefe da cnn permanecerá à frente da rede após a fusão com a Paramount e warner bros. Discovery", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 195741, "titulo": "Demissões por IA não saíram como esperado e empresas começam a trazer funcionários de volta", "url": "https://exame.com/inteligencia-artificial/demissoes-por-ia-nao-sairam-como-esperado-e-empresas-comecam-a-trazer-funcionarios-de-volta/", "fonte_id": "exame", "data_pub": "2026-10-05T14:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas estão voltando a contratar funcionários após demissões relacionadas à automação devido à redução de equipes e aumento dos custos. O caso da Klarna ilustra que a adoção de inteligência artificial pode levar a uma reestruturação, mas também a novos desafios operacionais.", "titulo_pt": "Demissões por IA não saíram como esperado e empresas começam a recontratar funcionários", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 196518, "titulo": "Sen. Adam Schiff on AI regulation, free speech, and impeaching Trump one more time", "url": "https://www.theverge.com/podcast/1004286/senator-adam-schiff-ai-trump-regulation-corruption", "fonte_id": "the_verge", "data_pub": "2026-10-05T14:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O senador Adam Schiff, democrata da Califórnia, está envolvido em várias comissões que supervisionam tecnologia e inteligência artificial, incluindo propriedade intelectual, anti-monopólio, privacidade e tecnologia. A conversa abordará a possibilidade de regulamentar a tecnologia e o AI neste momento.", "titulo_pt": "Senador adam Schiff sobre regulação de AI, liberdade de expressão e impeachment de Trump novamente", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 195747, "titulo": "A indústria de IA pede cautela enquanto disputa o controle da nossa vida digital", "url": "https://exame.com/inteligencia-artificial/a-industria-de-ia-pede-cautela-enquanto-disputa-o-controle-da-nossa-vida-digital/", "fonte_id": "exame", "data_pub": "2026-10-05T14:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A indústria de inteligência artificial está em disputa pelo controle da nossa vida digital, envolvendo questões de confiança, mercado e autoridade cedida a esses sistemas. Alertas sobre perda de controle coexistem com o lançamento de assistentes pessoais.", "titulo_pt": "A indústria de IA pede cautela enquanto disputa o controle da nossa vida digital", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 195750, "titulo": "Quem é o homem escolhido por Trump para comandar a 'revolução da IA'", "url": "https://exame.com/inteligencia-artificial/quem-e-o-homem-escolhido-por-trump-para-comandar-a-revolucao-da-ia/", "fonte_id": "exame", "data_pub": "2026-10-05T13:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jay Clayton, atual Diretor de Inteligência Nacional, será responsável pela liderança da Força de Superinteligência da Casa Branca. Sua experiência na regulação rigorosa de criptomoedas levanta preocupações no setor de tecnologia.", "titulo_pt": "Quem é o homem escolhido por Trump para liderar a 'revolução da IA'", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 196482, "titulo": "LG Electronics wins U.S. AI data center chiller deal", "url": "https://en.yna.co.kr/view/AEN20261005005500320", "fonte_id": "yonhap_news", "data_pub": "2026-10-05T13:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "LG Electronics vendeu um contrato para um centro de dados de inteligência artificial nos Estados Unidos, através de sua subsidiária local.", "titulo_pt": "LG Electronics conquista contrato de centro de dados de IA nos EUA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 195752, "titulo": "Regulação da IA vai mudar o trabalho: o que profissionais precisarão saber para usar a tecnologia", "url": "https://exame.com/inteligencia-artificial/regulacao-da-ia-vai-mudar-o-trabalho-o-que-profissionais-precisarao-saber-para-usar-a-tecnologia/", "fonte_id": "exame", "data_pub": "2026-10-05T13:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As novas regulamentações sobre inteligência artificial estão gerando expectativas sobre a capacitação, supervisão e uso responsável da tecnologia no ambiente de trabalho. Isso indica que profissionais precisarão se adaptar a essas mudanças para aproveitar a tecnologia de forma segura e eficaz.", "titulo_pt": "Regulação da IA vai mudar o trabalho: o que profissionais precisarão saber para usar a tecnologia", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 196519, "titulo": "An open-source tool lets you delete 12GB of Apple Intelligence data on macOS", "url": "https://www.theverge.com/ai-artificial-intelligence/1004672/mac-delete-apple-intelligence-ai-tool", "fonte_id": "the_verge", "data_pub": "2026-10-05T13:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo ferramenta de código aberto permite deletar 12GB de dados de inteligência artificial do macOS com um comando de linha de comando. Antes, era possível desativar a Apple Intelligence por meio de um único ajuste de configurações, mas essa opção foi removida na versão 27 do macOS.", "titulo_pt": "Ferramenta de código aberto permite deletar 12GB de dados de inteligência artificial do macos", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 196264, "titulo": "Cerebras stock pops 9% after Sam Altman calls the chipmaker a 'close partner'", "url": "https://www.cnbc.com/2026/10/05/cerebras-cbrs-sam-altman-close-partner.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-05T13:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O preço das ações da Cerebras subiu 9% na pré-mercado após Sam Altman, CEO do OpenAI, assegurar aos investidores que a empresa é um 'parceiro próximo'.", "titulo_pt": "Ação da cerebras sobe 9% após Sam Altman garantir que a empresa é 'parceira próxima'", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 196455, "titulo": "Nobel medicine prize goes to US, German scientists", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/06/2003865466", "fonte_id": "taipei_times", "data_pub": "2026-10-06T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O prêmio Nobel de Medicina foi concedido a cientistas dos Estados Unidos e da Alemanha.", "titulo_pt": "Prêmio nobel de medicina para cientistas dos EUA e Alemanha", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 196652, "titulo": "NASA Astronaut Christina Koch at Eagles vs. Rams", "url": "https://www.nasa.gov/image-article/nasa-astronaut-christina-koch-at-eagles-vs-rams/", "fonte_id": "nasa_news", "data_pub": "2026-10-05T17:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A astronauta Christina Koch, da missão Artemis II da NASA, liderou os fãs na execução da canção de apoio dos Philadelphia Eagles durante um jogo entre os Eagles e os Rams no estádio Lincoln Financial Field em Philadelphia, no dia 4 de outubro de 2026.", "titulo_pt": "Astronauta Christina Koch leva os fãs a cantarem a canção dos Eagles em jogo de nfl", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 195675, "titulo": "Estrelas anãs devoram, aos poucos, os astros que as acompanham", "url": "https://veja.abril.com.br/ciencia/estrelas-anas-devoram-aos-poucos-os-astros-que-as-acompanham/", "fonte_id": "veja", "data_pub": "2026-10-05T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dois estudos publicados na revista 'Nature Astronomy' descrevem como estrelas anãs têm um comportamento canibal, devorando gradualmente os astros que estão ao seu redor.", "titulo_pt": "Estrelas anãs têm comportamento canibal, dizem estudos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 196632, "titulo": "Scientists may have seen dark matter. If they did, what exactly is it?", "url": "https://www.sciencenews.org/article/dark-matter-supersymmetry-higgsino", "fonte_id": "science_news", "data_pub": "2026-10-05T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma teoria sugere que a matéria escura pode ser uma partícula supersimétrica chamada 'higgsino', mas essa ideia tem alguns problemas.", "titulo_pt": "Cientistas podem ter avistado matéria escura. Se sim, qual é exatamente ela?", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 196620, "titulo": "STAT+: Prices, prices, prices", "url": "https://www.statnews.com/2026/10/05/health-care-prices-make-care-insurance-expensive-health-care-inc/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-05T16:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo explora as razões pela qual a segurância saudável é tão cara. É o último relato na série 'Fora de Bolso, Fora de Alcance', publicado pelo STAT.", "titulo_pt": "Preços, preços, preços", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 196621, "titulo": "STAT+: Utah plows ahead with more health AI pilots for prescriptions, women’s health", "url": "https://www.statnews.com/2026/10/05/utah-expands-health-ai-sandbox-picks-third-party-auditors/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-05T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Utah planeja permitir que um produto de inteligência artificial avalie pacientes e escreva novas prescrições de medicamentos sem revisão humana prévia.", "titulo_pt": "Utah avança com mais pilotos de IA em saúde, incluindo prescrições e saúde feminina", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 196653, "titulo": "NASA Testing Aims at Supercooled Large Droplet Aviation Safety", "url": "https://www.nasa.gov/image-article/nasa-testing-aims-at-supercooled-large-droplet-aviation-safety/", "fonte_id": "nasa_news", "data_pub": "2026-10-05T15:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA está utilizando sua expertise e melhorando suas instalações de teste para abordar um perigo aéreo raro, mas persistente: a formação de gelo em aeronaves que passam por nuvens contendo gotas de água muito grandes e muito frias. Este fenômeno, conhecido como 'icing por gotas supercongeladas grandes', ocorre quando as aeronaves voam por nuvens com gotas de água excepcionalmente grandes que estão abaixo do ponto de congelamento.", "titulo_pt": "NASA testa para segurança aérea em condições de gota supercongelada", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 196633, "titulo": "A ‘phoenix’ planet was born from the ashes of its dead star", "url": "https://www.sciencenews.org/article/baby-planet-from-dead-star-phoenix", "fonte_id": "science_news", "data_pub": "2026-10-05T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A descoberta de um potencial planeta sugeriu que o fim do Sol poderia levar à formação de novos mundos.", "titulo_pt": "Um 'planeta fênix' nasceu das cinzas de sua estrela morta", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 196654, "titulo": "Suspected Second-generation Planet Solves NASA Hubble Cold Case", "url": "https://science.nasa.gov/missions/hubble/suspected-second-generation-planet-solves-nasa-hubble-cold-case/", "fonte_id": "nasa_news", "data_pub": "2026-10-05T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A nova análise de dados arquivados do Hubble sugere a possibilidade de estrelas brancas mortas hospedarem sistemas planetários de segunda geração.", "titulo_pt": "Suspeita de sistema planetário de segunda geração na estrela branca morta resolvendo caso gelado da NASA Hubble", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 196665, "titulo": "Astronomers catch dwarf stars gobbling up their orbiting companions", "url": "https://www.scientificamerican.com/article/astronomers-catch-dwarf-stars-gobbling-up-their-orbiting-companions/", "fonte_id": "scientific_american", "data_pub": "2026-10-05T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos recentes sugerem que estrelas de degeneração vermelhas e brancas podem ser mais vorazes do que se pensava anteriormente, possivelmente consumindo corpos orbitais ao seu redor.", "titulo_pt": "Astrônomos capturam estrelas de degeneração devorando seus companheiros orbitantes", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 195581, "titulo": "Novo leilão da Sotheby's mostra que interesse por fósseis de dinossauros está longe de acabar", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/novo-leilao-da-sothebys-mostra-que-interesse-por-fosseis-de-dinossauros-esta-longe-de-acabar.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-05T14:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Sotheby's planeja realizar outro leilão de um esqueleto de dinossauro raro três meses após vender um Tyrannosaurus rex por US$ 50,1 milhões. Não há sinais de que o interesse dos colecionadores por esses fósseis de alto valor tenha diminuído.", "titulo_pt": "Novo leilão
