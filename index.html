<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>

</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

const D = {"gerado_em": "30/07/2026 08:07", "stats": {"noticias_novas": 761, "resumos_gerados": 250}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva é o principal foco das notícias, especialmente em relação à sua reeleição e estratégias políticas. Ele confirmou Geraldo Alckmin como vice na chapa de reeleição para a Presidência, formalizando o acordo entre PT e PSB no domingo (2/8). Além disso, os candidatos enfrentam desafios legais e éticos: Lula foi multado pelo TRE-SP por propaganda eleitoral antecipada. A disputa entre Lula e Flávio Bolsonaro divide o cenário político, com pesquisas indicando vantagens regionais para cada um. Em Minas Gerais, Cleitinho reafirmou sua candidatura apesar das declarações do Republicanos. No exterior, a Argentina negou a possibilidade de romper relações diplomáticas com o Brasil em face dos comentários críticos de Javier Milei contra Lula.", "mundo": "Um objeto não identificado causou um cratero de 10 metros de largura perto da vila de Tarnawa Kolonia na Polônia, a cerca de 100 km da fronteira com Ucrânia. O líder polonês afirmou que o projétil provavelmente era russo e que um míssil russo pode ter atingido seu território durante os ataques na Ucrânia. Em resposta a um ataque de mísseis iranianos contra bases americanas no Iraque, o Exército dos Estados Unidos realizou uma série intensa de ataques contra o Irã. As forças russas realizaram ataques aéreos em várias cidades ucranianas, resultando em pelo menos 8 civis mortos e vários feridos. O presidente da Itália, Sergio Mattarella, defendeu a ideia de uma defesa comum europeia como um meio de paz e criticou a União Europeia por considerar que ela obstaculiza a tomada de decisões mais eficazes. As tensões eleitorais imprevistas na Itália não devem alterar a realidade das questões atuais, conforme alertou Mattarella. O novo embaixador dos Estados Unidos na Coreia do Sul afirmou que a aliança entre os dois países é uma das mais fortes do mundo, enquanto o won sul-coreano fortaleceu para um novo nível em cinco meses após o Federal Reserve manter as taxas de juros estáveis. As tensões eleitorais no Brasil não afetarão as eleições internas, disse Lula, criticando ações dos EUA e da Argentina sobre a interferência nas eleições brasileiras.\n\nOs Estados Unidos e o Irã estão envolvidos em uma escalada militar intensa no Oriente Médio. Após ataques americanos a instalações iranianas, o Irã ameaçou retaliar com 'muita dureza'. O conflito se estendeu para outras nações da região: Israel atacou Gaza e a Jordânia interceptou mísseis após os EUA. Além disso, ataques russos na Polônia e na Ucrânia continuam a agitar o cenário geopolítico europeu. Em um contexto mais amplo, a China protestou contra uma declaração ofensiva do ministro de Relações Exteriores da Nova Zelândia, enquanto tensões entre EUA, China e Europa sobre exportações brasileiras de carne bovina também são notícias relevantes neste momento. A escalada militar e as tensões comerciais continuam a moldar o panorama geopolítico global.", "economia": "A Ambev registrou um lucro trimestral de R$ 3,5 bilhões, uma alta de 25% em comparação com o período anterior. As vendas da empresa cresceram 6%, impulsionadas por marcas premium e foco em wellness. O Banco da Inglaterra (BoE) está previsto para fazer um discurso assertivo, mas manter as taxas de juros inalteradas, apesar do cenário de volatilidade renovada nos preços da energia. A União Europeia está avaliando a quebra de safra de grãos devido à seca e ao calor intenso que afetam o continente, impactando a produção agrícola. O Bradesco aprovou um aumento de capital no valor máximo de R$ 10 bilhões, com uma garantia de subscrição de até R$ 8 bilhões por seus acionistas controladores.", "tecnologia": "A tecnologia está em plena expansão com diversos avanços e desafios. A plataforma BlueCruise, que permite condução sem mãos, foi integrada ao primeiro carro a usar o sistema de navegação da Apple, combinando mapas precisos com uma nova geração de assistência à direção. No mercado de inteligência artificial (IA), a Runflow, liderada pelos ex-fundadores da LinkAPI, lançou uma startup focada nesta área. Por outro lado, a Intropy, uma empresa britânica, levantou US$ 11 milhões para expandir seus serviços nos Estados Unidos. A competição na IA também reflete nas movimentações do mercado acionário: enquanto a Microsoft registrou um forte crescimento, a Meta enfrenta dificuldades em atingir suas projeções de receita. A crescente demanda por chips de inteligência artificial está direcionando as exportações sul-coreanas para Taiwan, onde empresas como TSMC realizam processos avançados de embalagem. Além disso, a preocupação crescente com o gasto em IA levou à queda das ações de empresas coreanas e chinesas, enquanto investidores buscam formas de gerir esses riscos no mercado.", "ciencia": "A justiça determinou que o livro 'Meninas Sonhadoras, Mulheres Cientistas', que havia sido retirado das escolas municipais de São José dos Campos por decisão do prefeito, volte às salas de aula. O livro retrata a vida da ex-vereadora assassinada Marielle Franco e outras mulheres cientistas, tendo sido banido em 2019. A decisão judicial ocorreu em 30/07/2026. Paralelamente, pesquisadores do IIASA desenvolveram uma ferramenta mais rápida para avaliar os impactos climáticos em regiões específicas, utilizando projeções existentes de modelos do sistema terrestre ou de impacto climático para gerar novas projeções regionais. Esta ferramenta mantém a incerteza crucial para compreender o risco climático. Além disso, astrônomos descobriram que a estrela Betelgeuse na constelação de Órion não está sozinha, com observações recentemente publicadas. Estes avanços científicos abrangem desde a biologia até a astronomia, refletindo o amplo espectro da pesquisa científica atual.", "cultura": "Um dos eventos mais importantes mencionados nos artigos é a vitória do artista Michael Zavros na categoria de escolha popular do Prêmio Archibald 2026. Zavros venceu com um retrato do líder judeu Alex Ryvchin, criado após o massacre em Bondi. O trabalho foi inspirado pelo respeito que Zavros sente por Ryvchin e pela semelhança entre os dois homens. Em outro destaque cultural, a retrospectiva de Aki Kaurismäki será realizada pelo CineSesc, exibindo longas do diretor finlandês desde 1983 até 2023, evocando a beleza dos personagens perdedores retratados em suas obras. Além disso, o National Theatre está produzindo uma peça inovadora que combina a trama de 'Eletra' de Sófocles com o filme 'Persona' de Ingmar Bergman, explorando como essas duas histórias antigas podem nos ajudar a entender melhor como vivemos hoje.", "sociedade": "O Rio de Janeiro enfrentou graves consequências após um vendaval que causou estragos e deixou 600 mil pessoas sem energia elétrica. Em São Paulo, uma ventania resultante levou a três mortes e destelhamentos, o que fez com que o Gabinete de Crise fosse mobilizado. O caso mais grave ocorreu na Fundação Carlos Chagas, onde um candidato teve sua autodeclaração racial deferida em um concurso, mas indeferida apenas quatro meses depois em outro evento. Na região do Biobío, as escolas foram suspensas devido a uma frente fria. Em Goiás, três pessoas foram mortas a tiros dentro de uma fazenda, o que levou à investigação da Polícia Civil. No Amazonas, um professor de jiu-jitsu foi flagrado agredindo um adolescente autista. Na Argentina, María Remedios del Valle, uma mulher negra, é reconhecida como a Mãe da Pátria e sua imagem está sendo estampada em moedas para celebrar seu papel histórico na independência do país.", "meio_ambiente": "Mais da metade do Reino Unido está oficialmente em estado de seca, conforme informa o Agência Ambiental do Reino Unido. O órgão relata baixos níveis nos rios, colheitas antecipadas por agricultores e aumento do risco de incêndios florestais, além de milhões de pessoas vivendo sob restrições no uso d'água. Em contraste, o sistema de saúde em Gaza está colapsando, deixando pacientes com diálise, amputados e sobreviventes de lesões graves sem cuidados essenciais. No Brasil, os efeitos do El Niño devem ultrapassar o aumento de preços dos alimentos, afetando também a geração de energia, transporte e varejo, em um cenário de juros altos e custos elevados. Além disso, um vendaval no Rio de Janeiro atingiu velocidades superiores a 100 km/h, causando ao menos duas mortes e levando à paralisação do metrô e dos aeroportos na cidade.", "direitos_humanos": "Malásia anunciou um acordo para retornar 5.000 rohingyas a Myanmar, o que gerou preocupações sobre refúgio forçado (refoulement) e os riscos de expor essa comunidade perseguida a uma situação ainda instável no país. Em outro desenvolvimento, Zhang Yabo, ex-oficial da polícia em Xinjiang, descreveu a região como um grande local de reclusão que afeta não apenas uigures inocentes, mas também os espíritos dos policiais envolvidos na execução dessa política. Na Coreia do Sul, vítimas e parentes das vítimas de uma suposta chacina no Vietnã apresentaram uma segunda petição à Comissão de Verdade, buscando justiça. Também foram relatadas preocupações sobre o aumento da escala de tráfico humano para centros de golpes em Ásia, com casos envolvendo abuso sexual. Em Cuba, um artista renomado passou cinco anos preso e relata como sobreviveu à prisão, usando sua arte para resistir. Uma foto viral de duas soldadas israelenses posando ao lado de um palestiniano cego gerou indignação online, refletindo a tensão entre Israel e Palestina. Além disso, o Alto Comissário das Nações Unidas para os Direitos Humanos visitou o Líbano para discutir violações durante a guerra entre Israel e Hezbollah e as preocupações sobre a retirada da Força Interina das Nações Unidas no país."}, "resumo_do_dia": {"politica_nacional": [{"id": 81008, "titulo": "Bancado pelo PL, Ciro Gomes é favorito contra Elmano ao governo do Ceará, diz Quaest", "url": "https://veja.abril.com.br/brasil/bancado-pelo-pl-ciro-gomes-e-favorito-contra-elmano-ao-governo-do-ceara-diz-quaest/", "fonte_id": "veja", "data_pub": "2026-07-30T09:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ciro Gomes, apoiado pelo Partido Liberal (PL), é considerado favorito nas pesquisas para as eleições governamentais no Ceará. Ex-governador que busca retornar ao cargo após 32 anos, Ciro pode interromper a sequência de cinco mandatos consecutivos de governo esquerdista no estado.", "titulo_pt": "Ciro Gomes é favorito para governo do Ceará, diz pesquisa da Quaest", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 80892, "titulo": "Hotel luxuoso em NY transforma salão histórico em quadra de tênis", "url": "https://www.poder360.com.br/poder-sportsmkt/hotel-luxuoso-em-ny-transforma-salao-historico-em-quadra-de-tenis/", "fonte_id": "poder360", "data_pub": "2026-07-30T09:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Waldorf Astoria, um hotel luxuoso em Nova York, transformou seu salão histórico Grand Ballroom em uma quadra oficial de tênis para lançar uma plataforma de experiências esportivas.", "titulo_pt": "Hotel luxuoso em NY converte salão histórico em quadra de tênis", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 80894, "titulo": "Lucro da Microsoft sobe 31% no 2º trimestre de 2026", "url": "https://www.poder360.com.br/poder-economia/lucro-da-microsoft-sobe-31-no-2o-trimestre-de-2026/", "fonte_id": "poder360", "data_pub": "2026-07-30T09:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Microsoft registrou um lucro de US$ 35,8 bilhões no segundo trimestre de 2026, aumento de 31% em comparação com o mesmo período anterior. A receita da empresa ficou em US$ 90 bilhões, crescimento de 18%, superando as expectativas que previam um faturamento de US$ 87,62 bilhões.", "titulo_pt": "Lucro da Microsoft aumenta 31% no segundo trimestre de 2026", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 80859, "titulo": "Movimentos populares criam 'brigadas de agitação e propaganda' em defesa da reeleição de Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/movimentos-populares-criam-brigadas-de-agitacao-e-propaganda-em-defesa-da-reeleicao-de-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-30T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entidades sociais e movimentos populares se reunirão em São Paulo para criar as Brigadas de Agitação e Propaganda, com o objetivo de mobilizar militantes nas ruas e redes sociais em defesa da reeleição do presidente Lula (PT). O evento está previsto para ocorrer no Sindicato dos Químicos.", "titulo_pt": "Movimentos populares criam 'brigadas de agitação e propaganda' em defesa da reeleição de Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 81051, "titulo": "Quando o Judiciário reescreve as regras do jogo", "url": "https://www.jota.info/opiniao-e-analise/artigos/quando-o-judiciario-reescreve-as-regras-do-jogo", "fonte_id": "jota", "data_pub": "2026-07-30T08:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos não podem se apropriar de condutas que, após a divulgação das propagandas, foram consideradas ilícitas. O Judiciário tem o poder de reescrever as regras do jogo durante a campanha.", "titulo_pt": "Quando o poder Judiciário redefine as regras da campanha", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 81052, "titulo": "Quando os institutos de pesquisa disputam os mesmos eleitores", "url": "https://www.jota.info/opiniao-e-analise/colunas/gestao-politica-sociedade/quando-os-institutos-de-pesquisa-disputam-os-mesmos-eleitores", "fonte_id": "jota", "data_pub": "2026-07-30T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O desafio atual pode ser interpretar as pesquisas de opinião diante de um mercado eleitoral que sofreu mudanças profundas.", "titulo_pt": "Quando os institutos de pesquisa disputam os mesmos eleitores", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 80912, "titulo": "Festas sem celular expõem dificuldade de conexão fora das telas", "url": "https://www.cnnbrasil.com.br/lifestyle/festas-sem-celular-expoem-dificuldade-de-conexao-fora-das-telas/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cerimônia de Taylor Swift, realizada sem o uso de celulares, reavivou debates sobre a dificuldade de se conectar socialmente quando os dispositivos móveis não estão presentes. O evento também destacou como a hiperconectividade pode afetar a memória e os vínculos humanos.", "titulo_pt": "Cerimônia sem celular reaviva debate sobre conexão social", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 80939, "titulo": "Estratégia cruzada: temendo desgastes, Lula e Flávio calculam ida a debates", "url": "https://www.metropoles.com/brasil/estrategia-cruzada-temendo-desgastes-lula-e-flavio-calculam-ida-a-debates", "fonte_id": "metropoles", "data_pub": "2026-07-30T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Lula considera participar de debates limitados, enquanto o sen o crime eleitoral foram atribuídos à chapa do herdeiro.", "titulo_pt": "Bolsonaro se esquiva de Moraes, mas coloca Flávio no centro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 80943, "titulo": "Resposta de Bolsonaro sobre IA cria dilema para campanha de Flávio", "url": "https://www.metropoles.com/brasil/resposta-de-bolsonaro-sobre-ia-cria-dilema-para-campanha-de-flavio", "fonte_id": "metropoles", "data_pub": "2026-07-30T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bolsonaro negou que tenha autorizado o vídeo com inteligência artificial e transferiu a responsabilidade para a campanha de Flávio. Isso criou um dilema para a campanha do senador.", "titulo_pt": "Resposta de Bolsonaro sobre IA cria dilema para campanha de Flávio", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 80944, "titulo": "Em Alagoas, JHC não bate martelo sobre chapa e Lessa diz que será vice", "url": "https://www.metropoles.com/brasil/em-alagoas-jhc-nao-bate-martelo-sobre-chapa-e-lessa-diz-que-sera-vice", "fonte_id": "metropoles", "data_pub": "2026-07-30T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-prefeito de Maceió, JHC, ainda não decidiu sobre a composição da chapa. Lessa afirmou que será vice. A decisão envolve vagas ao Senado e pressões para coligação com Lira e o PL.", "titulo_pt": "Em Alagoas, JHC não decide chapa e Lessa será vice", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 80913, "titulo": "Fies do 2º semestre divulga resultado da chamada nesta quinta-feira (30)", "url": "https://www.cnnbrasil.com.br/educacao/fies-do-2o-semestre-divulga-resultado-da-chamada-nesta-quinta-feira-30/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T07:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O resultado da chamada para o segundo semestre do Fies foi divulgado nesta quinta-feira (30). Estudantes não pré-selecionados ficarão na lista de espera.", "titulo_pt": "Fies do 2º semestre divulga resultado e mantém lista de espera", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 80914, "titulo": "Governo lança Brasil Soberano 3 sem prazo para regulamentação", "url": "https://www.cnnbrasil.com.br/economia/macroeconomia/governo-lanca-brasil-soberano-3-sem-prazo-para-regulamentacao/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T07:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo lançou a campanha Brasil Soberano 3 sem estabelecer um prazo para regulamentação. Tarifas de 12,5% e 25% impostas pelos EUA aos produtos brasileiros já estão em vigor.", "titulo_pt": "Governo lança Brasil Soberano 3 sem prazo para regulamentação", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 80964, "titulo": "A nova vitrine de SP: como Ricardo Nunes quer levar empresas e moradores de volta ao Centro", "url": "https://exame.com/revista-exame/a-nova-vitrine-da-cidade/", "fonte_id": "exame", "data_pub": "2026-07-30T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ricardo Nunes, prefeito de São Paulo, discute a recuperação da região central e os projetos que podem impulsionar um novo ciclo econômico para o centro da cidade.", "titulo_pt": "Nova vitrine de SP: como Ricardo Nunes pretende atrair empresas e moradores de volta ao Centro", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 81247, "titulo": "Missile that left crater deep inside Poland was probably Russian - Polish PM", "url": "https://www.bbc.co.uk/news/articles/cwymkgenv2ro?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-07-30T09:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um objeto não identificado causou um cratere de 10 metros de largura perto da vila de Tarnawa Kolonia, a cerca de 100 km da fronteira com Ucrânia. A polícia polonesa afirma que o projétil provavelmente era russo.", "titulo_pt": "Missile que deixou cratera profunda na polônia provavelmente era russo - PM polonês", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 81237, "titulo": "A majority of MAGA supporters would still vote for a Republican candidate despite a scandal", "url": "https://www.politico.com/news/2026/07/30/maga-trump-scandal-2026-elections-01013859", "fonte_id": "politico", "data_pub": "2026-07-30T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A maioria dos apoiadores do movimento MAGA afirmou que ainda votariam em um candidato republicano, mesmo diante de uma série de escândalos. Essa proporção é maior do que a média de eleitores republicanos e democratas.", "titulo_pt": "A maioria dos apoiadores MAGA continuaria votando em republicano em caso de escândalo", "veiculo": "Politico", "pais": "EUA", "classe": "A"}, {"id": 81219, "titulo": "Russian strikes across Ukraine kill at least 8 civilians and wound dozens", "url": "https://www.npr.org/2026/07/30/g-s1-136276/russia-ukraine-war", "fonte_id": "npr_news", "data_pub": "2026-07-30T09:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças russas realizaram ataques aéreos em várias cidades ucranianas, resultando em pelo menos 8 civis mortos e vários feridos. O ataque se soma à intensificação das operações de bombardeio diário contra as cidades ucranianas, enquanto Moscou parece tentar explorar o crítico déficit ucraniano de defesas antimísseis fornecidas pela Ocidente.", "titulo_pt": "Russo atinge várias cidades ucranianas, deixando ao menos 8 civis mortos", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 81113, "titulo": "It was ‘most likely’ a Russian cruise missile that crashed in Poland, defence minister says – Europe live", "url": "https://www.theguardian.com/world/live/2026/jul/30/europe-ukraine-russia-poland-wildfires-france-spain-greece-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-07-30T09:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O inspetor da Força Aérea Polonesa identificou dois mísseis russos como uma ameaça direta para a Polônia durante o ataque russo à Ucrânia ontem. O ministro da Defesa polonês, Władysław Kosiniak-Kamysz, afirmou que é 'mais provável' que tenha sido um míssil Kh-101 lançado por avião.", "titulo_pt": "Foi ‘provavelmente’ um míssil cruzeiro russo que caiu na polônia, diz ministro da defesa", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 81334, "titulo": "US hits multiple targets in Iran as IRGC pledges retaliation: What we know", "url": "https://www.aljazeera.com/news/2026/7/30/us-hits-multiple-targets-in-iran-as-irgc-pledges-retaliation-what-we-know?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-30T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jordan informou ter interceptado mísseis após os Estados Unidos atacarem instalações iranianas, incluindo Qeshm e Bushehr. A IRGC (Forças Revolucionárias Islâmicas do Irã) declarou que vai retaliar.", "titulo_pt": "EUA atacam múltiplos alvos no Irã; IRGC promete vingança", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 81271, "titulo": "Drone reveals charred forest landscape after wildfires scorch France", "url": "https://www.france24.com/en/video/20260730-drone-reveals-charred-forest-landscape-after-wildfires-scorch-france", "fonte_id": "france24", "data_pub": "2026-07-30T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um drone capturou imagens da destruição causada por incêndios florestais na região sudoeste da França, mostrando áreas carbonizadas, árvores derrubadas e os restos de casas destruídas perto de Le Temple. O fogo consumiu 42 mil hectares principalmente de pinheiros na área de Landes, a oeste de Bordeaux, levando autoridades a evacuar cerca de 220 mil pessoas.", "titulo_pt": "Vídeo de drone revela escala da destruição causada por incêndios florestais na França", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 81272, "titulo": "US launches wave of strikes on Iran in response to Tehran missile attack in Jordan", "url": "https://www.france24.com/en/video/20260730-us-launches-wave-of-strikes-on-iran-in-response-to-tehran-missile-attack-in-jordan", "fonte_id": "france24", "data_pub": "2026-07-30T09:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Exército dos Estados Unidos realizou uma série intensa de ataques contra o Irã em resposta a um ataque de mísseis iraniano contra bases americanas no Jordão. A retaliação dos EUA parece ter desencorajado as esperanças de que as negociações entre os dois países avançariam rapidamente.", "titulo_pt": "Estados unidos realiza onda intensa de ataques ao Irã em resposta a ataque de mísseis", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 81096, "titulo": "Poland’s Leader Says Russian Missile May Have Struck Its Territory During Ukraine Attack", "url": "https://www.nytimes.com/2026/07/30/world/europe/ukraine-poland-russia-missile.html", "fonte_id": "nyt_world", "data_pub": "2026-07-30T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O líder da Polônia afirmou que um míssil russo pode ter atingido seu território durante os ataques na Ucrânia. Até o momento, mísseis russos haviam apenas entrado temporariamente no espaço aéreo polonês sem causar danos.", "titulo_pt": "Líder da polônia diz que míssil russo pode ter atingido seu território durante ataques na Ucrânia", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 81411, "titulo": "Kosovo Detains Two on War Crime Allegations Amid Mass Grave Excavation", "url": "https://balkaninsight.com/2026/07/30/kosovo-detains-two-on-war-crime-allegations-amid-mass-grave-excavation/btj/", "fonte_id": "balkan_insight", "data_pub": "2026-07-30T09:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Duas pessoas não identificadas foram detidas em relação a acusações de crimes de guerra durante a exumação de um suposto covil com massas perto de Zubin Potok, que alguns acreditam poder conter os restos mortais de 23 albaneses kosovares desaparecidos em 1999.", "titulo_pt": "Kosovo detém duas pessoas em relação a acusações de crimes de guerra durante excavação de suposto covil com massas", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 81422, "titulo": "Mattarella, difesa comune europea non è una minaccia ma uno strumento di pace", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/30/mattarella-difesa-comune-europea-non-e-una-minaccia-ma-uno-strumento-di-pace_7c123036-1817-4cfd-bd17-eb86bb1835c9.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-30T09:43:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O presidente da Itália, Sergio Mattarella, defendeu a ideia de uma defesa comum europeia como um meio de paz e não como uma ameaça. Ele considerou grave abandonar a hipótese de uma nova Convenção UE que poderia discutir essa questão.", "titulo_pt": "Defesa comum europeia não é uma ameaça, mas um instrumento de paz", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 81423, "titulo": "Mattarella, critica l'Ue chi ostacola la possibilità di decisioni più efficaci", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/30/mattarella-critica-lue-chi-ostacola-la-possibilita-di-decisioni-piu-efficaci_94868f10-6ec2-44c5-a917-1fd5e65bb82f.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-30T09:41:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O presidente da Itália, Mattarella, criticou a União Europeia por considerar que ela obstaculiza a tomada de decisões mais eficazes. Bruxelas é acusada de falta de força adequada.", "titulo_pt": "Mattarella critica ue por obstacular decisões mais eficazes", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 81383, "titulo": "US launches strikes on Iran after Trump vows to deliver ‘beating’", "url": "https://www.ft.com/content/42e83b67-cfb8-46af-b50e-3ac77748ce38?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-30T09:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos realizaram ataques militares contra alvos do Irã após Teerã lançar mísseis balísticos contra forças americanas. O presidente dos EUA, Donald Trump, havia prometido entregar um 'castigo' ao Irã.", "titulo_pt": "EUA realiza ataques após Irã lançar mísseis em forças americanas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 81424, "titulo": "Mattarella, tensioni elettorali intempestive non tolgano attenzione ai problemi", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/30/mattarella-tensioni-elettorali-intempestive-non-tolgano-attenzione-ai-problemi_741c75f8-2de1-4b45-838b-bfc72f0a7bd3.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-30T09:37:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O presidente da Itália, Mattarella, alertou contra a distração das eleições imprevistas dos problemas existentes. Ele enfatizou que essas eleições não devem alterar a realidade das questões atuais.", "titulo_pt": "Mattarella: eleições inesperadas não devem desviar atenção para os problemas", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 81425, "titulo": "Mattarella, adattare leggi a comportamenti individuali è l'abdicazione dello Stato", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/30/mattarella-adattare-leggi-a-comportamenti-individuali-e-labdicazione-dello-stato_19138aa4-734f-4d91-ac9f-727ed6aaee2d.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-30T09:35:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O presidente da Itália, Mattarella, argumenta que adaptar leis aos comportamentos individuais é uma renúncia ao papel do Estado. Essa abordagem não fortalece a segurança.", "titulo_pt": "Mattarella: adaptação de leis aos comportamentos individuais é um abdicoção do estado", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 81248, "titulo": "Veteran Ugandan opposition leader collapses in court and in ICU, his wife says", "url": "https://www.bbc.co.uk/news/articles/c0m78xl1k2po?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-07-30T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um líder oposicionista ugandês de 70 anos, que está detido desde novembro de 2024 e é acusado de traição, caiu desmaiado em uma audiência judicial e foi levado para a unidade de cuidados intensivos (UCI).", "titulo_pt": "Líder oposicionista ugandês de 70 anos desmaia em tribunal e é internado", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 81426, "titulo": "Pnrr, raggiunti 416 obiettivi su 575, incassato 165,99 miliardi", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/30/pnrr-raggiunti-416-obiettivi-su-575-incassato-16599-miliardi_c92862f1-f7bc-4948-b74f-3d1a830f8f87.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-30T09:34:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Até o primeiro de julho do ano anterior, foram alcançados 416 objetivos dos 575 estabelecidos. O valor arrecadado foi de 165,99 bilhões.", "titulo_pt": "Pnrr, alcançaram 416 objetivos sobre 575, arrecadaram 165,99 bilhões", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 80903, "titulo": "Ambev registra alta de 25% no lucro trimestral, a R$ 3,5 bilhões", "url": "https://www.cnnbrasil.com.br/economia/negocios/ambev-registra-alta-de-25-no-lucro-trimestral-a-r-35-bilhoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T09:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Ambev registrou um lucro trimestral de R$ 3,5 bilhões, uma alta de 25% em comparação com o período anterior. A receita líquida da empresa cresceu 6%.", "titulo_pt": "Ambev registra aumento de 25% no lucro trimestral, a R$ 3,5 bilhões", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 81317, "titulo": "Samsung says chip crunch will last until 2028 as quarterly profit soars", "url": "https://www.cnbc.com/2026/07/30/samsung-q2-earnings-ai-chip-.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-30T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Samsung Electronics anunciou que o escarcéu de chips durará até 2028, enquanto seu lucro operacional trimestral superou as estimativas dos analistas.", "titulo_pt": "Samsung afirma que crise de chips vai durar até 2028 e lucro trimestral sobe acima das expectativas", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 80982, "titulo": "PIB e PCE nos EUA, desemprego no Brasil e balanço da Vale agitam os mercados nesta 5ª", "url": "https://www.infomoney.com.br/mercados/desemprego-pce-pib-eua-balanco-vale-agenda-30072026/", "fonte_id": "infomoney", "data_pub": "2026-07-30T09:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os mercados serão influenciados pelos dados do PIB e do PCE nos Estados Unidos, pelo desemprego no Brasil e pelo balanço da Vale nesta quinta-feira (30).", "titulo_pt": "PIB e PCE nos EUA, desemprego no Brasil e balanço da Vale agitam os mercados nesta 5ª", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 81379, "titulo": "BoE expected to ‘talk tough’ but leave rates on hold", "url": "https://www.ft.com/content/9c33426e-d413-4d9b-b429-34dea508195e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-30T09:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A BoE (Banco da Inglaterra) está prevista para discursar de forma assertiva, mas manterá as taxas de juros inalteradas. A decisão será tomada em um cenário de volatilidade renovada nos preços do energia.", "titulo_pt": "Boe esperada para ‘falar firme’ mas manter taxas de juros estáveis", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 80899, "titulo": "Setor de móveis não é ameaça à soberania dos EUA, diz associação", "url": "https://www.poder360.com.br/poder-economia/setor-de-moveis-nao-e-ameaca-a-soberania-dos-eua-diz-associacao/", "fonte_id": "poder360", "data_pub": "2026-07-30T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A diretora-executiva da Abimóvel, Cândida Cervieri, afirmou que o setor de móveis não representa uma ameaça à soberania dos Estados Unidos e sugere que o governo continue a dialogar com os norte-americanos sobre tarifas.", "titulo_pt": "Setor de móveis não é ameaça à soberania dos EUA, afirma abimóvel", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 81380, "titulo": "DR Congo’s cobalt boom carries an unwanted cargo: uranium", "url": "https://www.ft.com/content/77815def-6f50-4adf-8ba3-3643de7bf8ab?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-30T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A República Democrática do Congo tem produzido grande quantidade de cobalto, mas também está lidando com o risco de proliferação de minérios radioativos. Estes mesmos minérios foram usados durante a Segunda Guerra Mundial na produção de armas nucleares.", "titulo_pt": "A bolha do cobalto da república democrática do Congo transporta um carregamento indesejado: urânio", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 81389, "titulo": "Toyota sales fall for fifth month on Iran turmoil and China", "url": "https://www.japantimes.co.jp/business/2026/07/30/companies/toyota-sales-fall-june/", "fonte_id": "japan_times", "data_pub": "2026-07-30T08:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas da Toyota caíram por cinco meses consecutivos devido ao tumulto na Irân e à instabilidade na China. Os custos crescentes do petróleo e dos materiais primos, junto com rotas de suprimento interrompidas, estão pressionando fabricantes globais diante da contínua instabilidade no Oriente Médio.", "titulo_pt": "Vendas da toyota caem por cinco meses devido a turbulências na irân e China", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 81390, "titulo": "Trump’s tariffs are sending some companies back to China", "url": "https://www.japantimes.co.jp/business/2026/07/30/companies/trump-tariffs-companies-china/", "fonte_id": "japan_times", "data_pub": "2026-07-30T08:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um dos resultados surpreendentes das tarifas impostas durante um ano volátil é que a China se encontra numa posição de força relativa, com tarifas menores do que no ano anterior.", "titulo_pt": "Tarifas de trump estão fortalecendo a China", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 81313, "titulo": "Shell posts best quarterly profit in four years as Iran war boosts oil and gas prices", "url": "https://www.cnbc.com/2026/07/30/shell-2q-earnings-iran-war-oil.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-30T08:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Shell registrou o melhor lucro trimestral em quatro anos devido ao aumento das tarifas do petróleo e gás, resultado da guerra na Irã.", "titulo_pt": "Shell registra melhor lucro trimestral em quatro anos devido à guerra no Irã", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 81385, "titulo": "Chinese stocks on track for worst month in decade", "url": "https://www.ft.com/content/5052b22e-aeca-4043-88af-dd7da3661a49?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-30T08:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os mercados de ações chineses estão prestes a registrar o pior mês desde o ano passado, com investidores vendendo ativos relacionados à expansão da inteligência artificial.", "titulo_pt": "Ações chinesas podem ter pior mês em uma década", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 81053, "titulo": "O ecossistema audiovisual não cabe mais em caixas", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-ecossistema-audiovisual-nao-cabe-mais-em-caixas", "fonte_id": "jota", "data_pub": "2026-07-30T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Houve uma parceria entre o YouTube e a TV Brasil para exibir a série 'Afiadas', demonstrando como a sinergia entre plataformas digitais e televisão aberta pode ampliar o alcance da cultura nacional.", "titulo_pt": "Parceria youtube e tv Brasil expande cultura nacional", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 81386, "titulo": "Winner of US-China AI rivalry falls 2% in Hong Kong debut", "url": "https://www.ft.com/content/cc7d24ec-abfe-440b-9e85-4d725567f278?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-30T08:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Innolight, uma empresa baseada na província de Shandong que fornece equipamentos para centros de dados a grupos tecnológicos americanos e chineses, estreou em Hong Kong com uma queda de 2%. O desempenho inicial da empresa no mercado de ações foi negativo.", "titulo_pt": "Vencedor da rivalidade entre EUA e china na AI estreia com baixa de 2% em Hong Kong", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 81054, "titulo": "Nova lei do complexo industrial da saúde: o que o setor farmacêutico precisa saber", "url": "https://www.jota.info/opiniao-e-analise/artigos/nova-lei-do-complexo-industrial-da-saude-o-que-o-setor-farmaceutico-precisa-saber", "fonte_id": "jota", "data_pub": "2026-07-30T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Lei 15.471/2026 redefine as parcerias com o Sistema Único de Saúde (SUS) e a política industrial de saúde, afetando diretamente o setor farmacêutico.", "titulo_pt": "Nova lei do complexo industrial da saúde: o que o setor farmacêutico precisa saber", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 81055, "titulo": "A transação como instrumento de regulação", "url": "https://www.jota.info/opiniao-e-analise/colunas/elas-no-jota/a-transacao-como-instrumento-de-regulacao", "fonte_id": "jota", "data_pub": "2026-07-30T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Agência da União (AGU) publicou uma portaria que permite negociar dívidas com empresas para garantir a continuidade de serviços públicos. Essa medida visa facilitar acordos financeiros que assegurem o funcionamento adequado dos serviços governamentais.", "titulo_pt": "A transação como instrumento de regulação", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 81056, "titulo": "Uma leitura do artigo ‘A PEC 65: Independência financeira ou fragmentação orçamentária?’", "url": "https://www.jota.info/opiniao-e-analise/artigos/uma-leitura-do-artigo-a-pec-65-independencia-financeira-ou-fragmentacao-orcamentaria", "fonte_id": "jota", "data_pub": "2026-07-30T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A decisão de adiar a implementação da PEC 65 para uma reforma mais ampla mantém o Banco Central exposto ao risco mencionado no texto de André Lara Resende.", "titulo_pt": "Uma leitura do artigo ‘A PEC 65: independência financeira ou fragmentação orçamentária?’", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 81471, "titulo": "(LEAD) SK Innovation swings to Q2 profit on stronger lubricants earnings", "url": "https://en.yna.co.kr/view/AEN20260730009151320", "fonte_id": "yonhap_news", "data_pub": "2026-07-30T08:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SK Innovation, uma das principais empresas de energia do sul da Coreia, registrou lucro no segundo trimestre graças a melhores resultados nas vendas de lubrificantes.", "titulo_pt": "(Principal) SK Innovation inverte resultado no segundo trimestre com ganhos maiores em lubrificantes", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 81072, "titulo": "Lanzan el primer auto con Apple Maps integrado; también tiene conducción sin manos", "url": "https://www.lanacion.com.ar/autos/lanzan-el-primer-auto-con-apple-maps-integrado-y-conduccion-sin-manos-nid30072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-30T09:57:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O novo carro incorporará o sistema de navegação da Apple diretamente nas suas telas, usando os mapas da empresa. Além disso, a plataforma também utilizará BlueCruise para desenvolver a próxima geração de condução sem as mãos.", "titulo_pt": "Lançam primeiro carro com Apple Maps integrado; também tem condução sem mãos", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 80992, "titulo": "A Runflow cria agentes de AI – e atraiu os fundadores do EBANX", "url": "https://braziljournal.com/a-runflow-cria-agentes-de-ai-e-atraiu-os-fundadores-do-ebanx/", "fonte_id": "brazil_journal", "data_pub": "2026-07-30T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Edmee Moreira, Danrley Morais e Mariana Pastorelli, ex-fundadores da LinkAPI que venderam a empresa para a Semantix por quase R$ 100 milhões em 2021, agora estão lançando a Runflow, uma nova startup focada em inteligência artificial.", "titulo_pt": "A Runflow cria agentes de IA – e atraiu os fundadores do EBANX", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 81465, "titulo": "Measures to cool leveraged ETF market to come 'as early as possible': financial regulator", "url": "https://en.yna.co.kr/view/AEN20260730012000320", "fonte_id": "yonhap_news", "data_pub": "2026-07-30T09:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A reguladora financeira sul-coreana declarou que medidas para refrescar o mercado de ETFs alavancados serão implementadas 'o mais rápido possível'.", "titulo_pt": "Medidas para resfriar o mercado de etfs alavancados devem ser implementadas 'o mais rápido possível': regulador financeiro", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 81513, "titulo": "OpenAI's ChatGPT about to reach 1B weekly users as AI rivalry heats up", "url": "https://www.digitimes.com/news/a20260730VL228/openai-chatgpt-growth-claude-revenue.html", "fonte_id": "digitimes", "data_pub": "2026-07-30T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chatbot do OpenAI está prestes a atingir um novo marco de 1 bilhão de usuários semanais, segundo dados internos da empresa. Embora o objetivo original fosse alcançar este número até o final de 2025, o aplicativo continua sendo uma das aplicações online que crescem mais rapidamente desde a fundação do startup.", "titulo_pt": "ChatGPT do openai prestes a chegar a 1 bilhão de usuários semanais", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 81514, "titulo": "ASE sees full-year LEAP revenue topping US$3.5 billion amid tight packaging capacity", "url": "https://www.digitimes.com/news/a20260730PD230/ase-revenue-packaging-capacity-testing.html", "fonte_id": "digitimes", "data_pub": "2026-07-30T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ASE Tecnologia Holding relatou que a demanda crescente por embalagens e testes avançados, juntamente com o aumento do momentum de seu serviço de fabricação eletrônica (SFE), está estreitando a capacidade em ambas as embalagens avançadas e convencionais. A capacidade de classificação de wafers e teste final também está se aproximando da utilização total.", "titulo_pt": "ASE projeta receita anual LEAP superior a 3,5 bilhões de dólares diante de escassez de capacidade", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 81564, "titulo": "AI for spare parts startup Intropy raises $11M", "url": "https://tech.eu/2026/07/30/ai-for-spare-parts-startup-intropy-raises-11m/", "fonte_id": "tech_eu", "data_pub": "2026-07-30T09:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma startup de partes de reposição baseada em Londres levantou US$ 11 milhões em financiamento adicional, com planos de expandir para os Estados Unidos. A Intropy fez uma rodada de semente com o investidor líder Felix Capital e a Quiet Capital participou.", "titulo_pt": "Startup de partes de reposição AI recebe $11 milhões em financiamento", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 81463, "titulo": "AI Scammers Are Better at Building Trust Than Humans", "url": "https://www.wired.com/story/ai-scammers-are-better-at-building-trust-than-humans/", "fonte_id": "wired", "data_pub": "2026-07-30T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores colocaram uma pessoa frente a um agente Claude e descobriram que, após uma semana de troca de mensagens, o chatbot de inteligência artificial foi mais eficaz em criar 'confiança explotável' com os outros.", "titulo_pt": "Criminosos de IA são melhores em construir confiança do que humanos", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 81088, "titulo": "Netflix dejará de funcionar en estos televisores el 31 de julio", "url": "https://www.lanacion.com.ar/tecnologia/netflix-dejara-de-funcionar-en-estos-televisores-el-31-de-julio-nid30072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-30T09:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Netflix cessará a compatibilidade em televisores inteligentes a partir de 31 de julho. A plataforma não funcionará em modelos que não atendem aos requisitos de segurança e desempenho.", "titulo_pt": "Netflix deixará de funcionar nesses televisores em 31 de julho", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 81382, "titulo": "‘My life’s screwed’: Korean investors stress out after AI bubble bursts", "url": "https://www.ft.com/content/23f388eb-e8ab-4fb1-b1ca-8e04eb4561a1?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-30T09:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Millhões de investidores sul-coreanos sofreram perdas inéditas após a queda nas ações das empresas Samsung e SK Hynix.", "titulo_pt": "Vidas arruinadas: investidores sul-coreanos se estressam com rompimento da bolha do AI", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 81387, "titulo": "Docomo Financial to sell more functions to businesses", "url": "https://www.japantimes.co.jp/business/2026/07/30/docomo-financial-sell-functions-businesses/", "fonte_id": "japan_times", "data_pub": "2026-07-30T09:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Docomo Financial planeja vender mais funcionalidades para bancos regionais que buscam fortalecer programas de pontos e empresas com maior base de clientes, como transportes.", "titulo_pt": "Docomo Financial vai vender mais funcionalidades a instituições financeiras e empresas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 81307, "titulo": "Meta tanks nearly 9%, Microsoft jumps 8% as the AI trade splits Big Tech", "url": "https://www.cnbc.com/2026/07/30/microsoft-msft-meta-stock-today-earnings.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-30T09:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microsoft registrou um forte crescimento nas áreas de Azure e Copilot, enquanto Meta não atingiu as projeções de receita e viu seu fluxo de caixa livre cair drasticamente. Esses resultados levaram a movimentações divergentes no mercado acionário das duas empresas.", "titulo_pt": "Meta cai quase 9%, Microsoft ganha 8% com AI trade dividindo as grandes tecnológicas", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 81257, "titulo": "AI labs face prisoner's dilemma as momentum grows for safety slowdown", "url": "https://www.axios.com/2026/07/30/ai-safety-slowdown-anthropic-openai", "fonte_id": "axios", "data_pub": "2026-07-30T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Arquitetos de IA dos Estados Unidos estão chegando a um consenso assustador: o ritmo do progresso pode exigir uma pausa, mas nenhuma laba pode se dar ao luxo de frear sozinha. Uma petição chamada 'Pacing the Frontier' foi assinada por mais de 1.200 funcionários de empresas líderes em IA, incentivando o governo americano a apoiar um esquema internacional que possa controlar o desenvolvimento da IA.", "titulo_pt": "Laboratórios de IA enfrentam dilema do presidiário enquanto momentum cresce para uma pausa na velocidade", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 81442, "titulo": "As AI spending soars, can China’s tech giants deliver long-term profits?", "url": "https://www.scmp.com/tech/tech-trends/article/3362384/ai-spending-soars-can-chinas-tech-giants-deliver-long-term-profits?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-30T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As grandes empresas de tecnologia dos Estados Unidos enfrentam crescente atenção do mercado sobre seus orçamentos crescentes para inteligência artificial, e as principais empresas de tecnologia chinesas agora também se deparam com um desafio semelhante: demonstrar que bilhões de dólares investidos em infraestrutura de IA resultarão em lucros sustentáveis. Investidores globais estão preocupados com os gastos em IA dessas grandes empresas de tecnologia.", "titulo_pt": "Com o aumento dos gastos em AI, as gigantes tecnológicas chinesas precisam provar a viabilidade financeira", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 81464, "titulo": "I Got a Free Meal From a Private Chef—Who Filmed It All to Train Robots", "url": "https://www.wired.com/story/i-let-a-private-chef-film-my-kitchen-for-robot-training-data/", "fonte_id": "wired", "data_pub": "2026-07-30T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma startup alemã enviou um chef com câmera para o apartamento do autor. Em troca de um almoço gratuito, ele permitiu que fossem gravadas todas as suas ações culinárias para treinar robôs futuros.", "titulo_pt": "Eu recebi almoço grátis de um Chef privado—que filmou tudo para treinar robôs", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 81467, "titulo": "BOK participates in real value testing of int'l tokenization project", "url": "https://en.yna.co.kr/view/AEN20260730009200320", "fonte_id": "yonhap_news", "data_pub": "2026-07-30T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Banco da Coreia (BOK) participou nos testes de valor real de um projeto internacional de tokenização.", "titulo_pt": "Banco da Coreia participa em testes de valor real de projeto internacional de tokenização", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 81515, "titulo": "Samsung signs five-year memory deals as chip shortage stretches to 2028", "url": "https://www.digitimes.com/news/a20260730VL233/samsung-2028-demand-dram-price.html", "fonte_id": "digitimes", "data_pub": "2026-07-30T08:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Samsung assinou acordos de suprimento por cinco anos com cinco clientes de data center globais líderes e está na fase final de negociações com mais cinco, vinculando uma parte crescente da sua produção de DRAM e NAND a compromissos que se estendem por vários anos.", "titulo_pt": "Samsung firma acordos de cinco anos para suprimento de memória com clientes globais", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 81007, "titulo": "Canetas para o vício? O que diz a ciência sobre o efeito de remédios como Ozempic contra a dependência", "url": "https://veja.abril.com.br/saude/canetas-contra-o-vicio-o-que-diz-a-ciencia-sobre-o-efeito-de-remedios-como-ozempic-contra-a-dependencia/", "fonte_id": "veja", "data_pub": "2026-07-30T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Medicamentos como Ozempic são testados para tratar dependências químicas, incluindo alcoolismo. A ciência ainda investiga o efeito desses remédios na redução do vício.", "titulo_pt": "Canetas para o vício? O que a ciência diz sobre os medicamentos como Ozempic no tratamento de dependências", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 81538, "titulo": "STAT+: Tracking the FDA expert review of Replimune’s melanoma treatment", "url": "https://www.statnews.com/2026/07/30/replimune-melanoma-drug-rp1-fda-expert-meeting-live-blog/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-07-30T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os especialistas da FDA estão em reunião para avaliar o medicamento experimental contra melanoma do Replimune, RP1.", "titulo_pt": "STAT+: relatando a reunião de especialistas da FDA para revisar o tratamento experimental de melanoma do Replimune", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 81583, "titulo": "First-of-kind Guillain-Barré drug switches off part of immune system", "url": "https://www.newscientist.com/article/2582376-first-targeted-treatment-for-guillain-barre-syndrome-nears-approval/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-07-30T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tratamento que desativa a parte do sistema imunológico responsável pelo problema em síndrome de Guillain-Barré pode ser o primeiro terapia alvo aprovada para essa condição autoimune.", "titulo_pt": "Primeira terapia alvo para síndrome de Guillain-Barré inibe parte do sistema imunológico", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 80890, "titulo": "Astrônomos conseguem prova de que a estrela Betelgeuse não está só", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/07/astronomos-conseguem-prova-de-que-a-estrela-betelgeuse-nao-esta-so.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-07-30T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Astrônomos descobriram que a estrela Betelgeuse, na constelação de Órion, não está sozinha. Eles publicaram suas observações em um artigo recente.", "titulo_pt": "Astrônomos comprovam que Betelgeuse não está só", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 81543, "titulo": "The trillion-dollar question behind corporate net-zero pledges", "url": "https://phys.org/news/2026-07-trillion-dollar-corporate-net-pledges.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas estão investindo trilhões de dólares em finanças de transição climática mundialmente. No entanto, a flexibilidade contábil pode fazer com que as emissões declaradas de uma empresa variem cerca de fator dois, o suficiente para torná-la aparentemente uma líder ou um atrasado no clima. Um novo estudo propõe criar blueprints net-zero específicos do setor para fechar essa brecha.", "titulo_pt": "A questão bilionária por trás das promessas de zero líquido corporativas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 81493, "titulo": "Korean prisons use VR to put inmates in victims’ shoes", "url": "https://www.koreaherald.com/article/10826203", "fonte_id": "korea_herald", "data_pub": "2026-07-30T08:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Corregedoria da Coreia do Sul vai implementar um programa terapêutico baseado em realidade virtual (VR) em 11 instâncias prisionais para ajudar os presos a se colocarem no lugar das vítimas de seus crimes. O ministério da Justiça informou que após um teste piloto com 392 detentos, houve melhorias nas distorções cognitivas, agressividade e empatia dos participantes.", "titulo_pt": "Prisões coreanas usam realidade virtual para fazer presos se colocarem no lugar das vítimas", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 81539, "titulo": "Chronically ill people face confusion over new Medicaid work rules and ‘medically frail’ exemption", "url": "https://www.statnews.com/2026/07/30/medicaid-work-requirements-medical-frailty-exemption-coverage-loss/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-07-30T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pacientes, advogados e especialistas temem que a dificuldade na documentação de uma exceção por fraqueza médica para as exigências de trabalho do Medicaid levará a milhões de pessoas a perderem seu benefício.", "titulo_pt": "Pacientes enfrentam confusão com novas regras de trabalho do Medicaid e exceção 'frágil medicalmente'", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 81541, "titulo": "Opinion: Ten years after WHO recognition, mycetoma remains one of the world’s most neglected diseases", "url": "https://www.statnews.com/2026/07/30/mycetoma-who-neglected-disease-research-sudan/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-07-30T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O próximo década do tratamento de mycetoma determinará se a doença permanecerá negligenciada ou se tornará um exemplo de ação coletiva.", "titulo_pt": "Opinião: nos próximos 10 anos, o cuidado com o mycetoma decidirá entre negligência e ação coletiva", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 81544, "titulo": "Meet the astronomer digging into the Milky Way's 'fossils'", "url": "https://phys.org/news/2026-07-astronomer-milky-fossils.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amina Helmi é uma astrônoma que se dedica à investigação do Milky Way, conforme evidenciado por sua paixão pelo tema visível em seu pequeno escritório na Universidade de Groningen, Holanda.", "titulo_pt": "Conheça a astrônoma descobrindo os 'fósseis' da via láctea", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 81545, "titulo": "Rain dampens France fire, as Spain reports 'almost no flames'", "url": "https://phys.org/news/2026-07-dampens-france-spain-flames.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T08:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os bombeiros na França expressaram esperança de que um grande incêndio florestal não estaria mais se espalhando. Em Espanha, foi relatado que praticamente não havia chamas após um incêndio semelhante perto de Madrid.", "titulo_pt": "Chuva ameniza fogo na França, enquanto Espanha relata 'praticamente nenhum fogo'", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 81561, "titulo": "NASA Johnson Interns Shaping the Future of Exploration", "url": "https://www.nasa.gov/centers-and-facilities/johnson/nasa-johnson-interns-shaping-the-future-of-exploration/", "fonte_id": "nasa_news", "data_pub": "2026-07-30T08:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estagiários da NASA no Centro Espacial Johnson estão aplicando suas habilidades em projetos reais enquanto trabalham lado a lado com engenheiros, cientistas, comunicadores e inovadores que avançam a tripulação humana espacial. Eles ganham experiência prática, contribuem para missões reais e se preparam para ingressar na força de trabalho altamente qualificada e competitiva do aerospace nacional.", "titulo_pt": "Estagiários da NASA Johnson moldando o futuro das explorações", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 81446, "titulo": "Triassic fish for lunch? Chinese fossil reveals oldest preserved reptile stomach", "url": "https://www.scmp.com/news/china/science/article/3362341/triassic-fish-lunch-chinese-fossil-reveals-oldest-preserved-reptile-stomach?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-30T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time liderado por chineses analisou um fóssil de 240 milhões de anos que contém o estômago, fígado e tecidos intestinais mais antigos já preservados em répteis. O fóssil da Austronaga minuta do período Triásico inicial oferece uma oportunidade única para estudar como os répteis triássicos se alimentavam.", "titulo_pt": "Peixe do triásico para o almoço? Fósselia chinesa revela estômago mais antigo de réptil", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 81584, "titulo": "Flat head syndrome discovered in Iron Age skeletons", "url": "https://www.newscientist.com/article/2582200-flat-head-syndrome-discovered-in-iron-age-skeletons/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-07-30T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo de crânios antigos da Itália do século IX a.C. revela que pessoas dessa época podem ter desenvolvido cabeças planas devido a certos posicionamentos de dormir, similar ao síndrome da cabeça plana em bebês modernos.", "titulo_pt": "Síndrome da cabeça plana descoberta em crânios do idade do ferro na Itália", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 81585, "titulo": "Why the most central law in cosmology may need to be broken", "url": "https://www.newscientist.com/article/2581589-why-the-most-central-law-in-cosmology-may-need-to-be-broken/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-07-30T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O princípio cosmológico é a bas
