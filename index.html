pós acidente com navio-tanque no Mediterrâneo", "url": "https://www.dw.com/pt-br/espanha-tenta-evitar-desastre-ambiental-após-acidente-com-navio-tanque-no-mediterrâneo/a-80063833?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-26T14:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um navio-tanque com cerca de 8,2 milhões de litros de diesel virou perto da ilha de Ibiza, Espanha, deixando uma pessoa morta. A Espanha está tentando evitar um desastre ambiental.", "titulo_pt": "Espanha tenta evitar desastre ambiental após acidente com navio-tanque no Mediterrâneo", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 289430, "titulo": "Aerial footage shows diesel tanker sinking off Ibiza", "url": "https://www.euronews.com/2026/11/26/aerial-footage-shows-diesel-tanker-sinking-off-ibiza", "fonte_id": "euronews", "data_pub": "2026-11-26T14:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tanqueiro carregado com aproximadamente 7.000 toneladas de diesel virou perto da ilha de Ibiza, Espanha, levando autoridades a avaliarem o risco de poluição marinha. Um dos membros da tripulação morreu após todos os 17 passageiros serem resgatados.", "titulo_pt": "Vídeo aéreo mostra tanque de diesel virado perto de Ibiza", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 289288, "titulo": "‘Disaster’ unfolding as Sydney fire ant outbreak partly blamed on ignored biosecurity recommendations", "url": "https://www.theguardian.com/australia-news/2026/nov/27/sydney-fire-ants-outbreak-biosecurity-experts-ignored", "fonte_id": "guardian_world", "data_pub": "2026-11-26T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos afirmam que recomendações antigos do órgão de vigilância biosecuritária australianas foram ignoradas ou não implementadas pelos governos federais sucessivos, aumentando o risco de uma explosão de pragas invasoras como a descoberta de formigas de fogo em Sydney esta semana. O presidente da federação de agricultores afirma que Austrália não consegue até mesmo manter cigarros ilegítimos fora do país, muito menos pragas detectáveis.", "titulo_pt": "Desastre em andamento devido a infestação de formigas de fogo em Sydney, em parte devido a recomendações de biosegurança ignoradas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 289562, "titulo": "Deadly factory fire in Indonesia renews lack of safety enforcement fears", "url": "https://www.scmp.com/week-asia/lifestyle-culture/article/3375934/deadly-factory-fire-indonesia-renews-lack-safety-enforcement-fears", "fonte_id": "scmp", "data_pub": "2026-11-26T10:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio letal em uma fábrica de doces em Banten, na Indonésia, resultou em 26 mortos e cerca de 30 desaparecidos, levantando preocupações sobre a inconsistência na aplicação das regulamentações de segurança no trabalho no país. A falta de fiscalização adequada e práticas de operação das empresas são apontadas como fatores de risco para os trabalhadores.", "titulo_pt": "Incêndio letal em fábrica na indonésia reforça temores sobre falta de fiscalização de segurança no trabalho", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 288212, "titulo": "Mau tempo atrasa mais de 6 mil voos na véspera de Ação de Graças nos EUA", "url": "https://www.cnnbrasil.com.br/internacional/mau-tempo-atrasa-mais-de-6-mil-voos-na-vespera-de-acao-de-gracas-nos-eua/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-26T09:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tempestades nas duas costas dos Estados Unidos causaram atrasos em mais de 6 mil voos na véspera de Ação de Graças. A Parada de Ação de Graças da Macy's em Nova York foi adiada pela primeira vez devido às condições meteorológicas adversas.", "titulo_pt": "Mau tempo adia mais de 6 mil voos e parada de Ação de Graças na véspera do feriado nos EUA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 288592, "titulo": "DR Congo Ebola cases surpass 12,000 as fighting disrupts response in east", "url": "https://www.aljazeera.com/news/2026/11/26/dr-congo-ebola-cases-surpass-12000-as-fighting-disrupts-response-in-east?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-26T07:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de casos de Ebola na República Democrática do Congo ultrapassou 12.000. A situação se agrava devido a conflitos no leste do país que deslocam trabalhadores de saúde e civis.", "titulo_pt": "Casos de Ebola na república democrática do Congo superam 12.000, enquanto conflitos dificultam a resposta", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 289802, "titulo": "PF assume investigação de suspeita de tráfico internacional de bebês em Saquarema", "url": "https://veja.abril.com.br/brasil/pf-assume-investigacao-de-suspeita-de-trafico-internacional-de-bebes-em-saquarema/", "fonte_id": "veja", "data_pub": "2026-11-26T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um casal estrangeiro foi detido sob suspeita de envolvimento no tráfico internacional de bebês. A Polícia Federal assumiu a investigação no município de Saquarema.", "titulo_pt": "PF investiga suspeita de tráfico internacional de bebês em Saquarema", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 290081, "titulo": "TC declara admisible recurso para que marinos imputados por violación en Rapa Nui vayan a una cárcel común", "url": "https://www.latercera.com/nacional/noticia/tc-declara-admisible-recurso-para-que-marinos-imputados-por-violacion-en-rapa-nui-vayan-a-una-carcel-comun/", "fonte_id": "la_tercera", "data_pub": "2026-11-26T20:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A magistratura constitucional chilena passará a analisar o caso em profundidade, ouvirá as partes envolvidas e decidirá se aceitará ou rejeitara o recurso que foi apresentado pelo representante da vítima. O recurso visa permitir que marinheiros acusados de violação em Rapa Nui sejam encarcerados em uma prisão comum ao invés de uma prisional militar.", "titulo_pt": "TC decide analisar recurso para marinheiros acusados de violação em Rapa Nui serem encarcerados em prisão comum", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 289820, "titulo": "Israel ‘chancela tortura’ de prisioneiros palestinos para extrair confissões, diz relatório", "url": "https://veja.abril.com.br/mundo/israel-chancela-tortura-de-prisioneiros-palestinos-para-extrair-confissoes-diz-relatorio/", "fonte_id": "veja", "data_pub": "2026-11-26T19:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório denuncia a institucionalização de medidas especiais de interrogatório no sistema de prisioneiros palestinos, que Israel chancela, e o risco de erros judiciais irreversíveis. A nova lei de pena de morte está em vigor.", "titulo_pt": "Israel aprova tortura de prisioneiros palestinos para obter confissões, alerta relatório", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 289190, "titulo": "Confirman la condena al productor que destruyó nidos y mató pingüinos en Punta Tombo", "url": "https://www.lanacion.com.ar/sociedad/confirman-la-condena-al-productor-que-destruyo-nidos-y-mato-pinguinos-en-punta-tombo-nid26112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-26T17:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Provincial confirmou a pena de três anos de prisão condicional para o produtor acusado de destruir ninhos e matar pingüins em Punta Tombo. A fiscal Florencia Gómez salientou a importância deste julgamento para a proteção da fauna silvestre.", "titulo_pt": "Confirmação da condenação do produtor que destruiu nidos e matou pingüins em Punta Tombo", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 289133, "titulo": "Sobreviventes cobram justiça um ano após megaincêndio em Hong Kong", "url": "https://www.dw.com/pt-br/sobreviventes-cobram-justiça-um-ano-após-megaincêndio-em-hong-kong/a-80068207?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-26T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ano após o megaincêndio em Hong Kong, que deixou 168 mortos e cerca de 4.600 desalojados, sobreviventes estão pressionando por justiça. Diante da indignação pública e do trauma, as autoridades reprimem essas cobranças, evitando uma investigação independente.", "titulo_pt": "Sobreviventes cobram justiça um ano após megaincêndio em Hong Kong", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 289250, "titulo": "Campillai presenta querella contra ex alto mando de Carabineros por presuntas violaciones a los DD.HH. en el estallido social", "url": "https://www.latercera.com/nacional/noticia/campillai-presenta-querella-contra-exalto-mando-de-carabineros-por-presuntas-violaciones-a-los-ddhh-en-el-estallido-social/", "fonte_id": "la_tercera", "data_pub": "2026-11-26T16:50:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A senadora Campillai apresentou uma denúncia judicial contra ex-comandantes da Carabineros acusando-os de ter conhecimento de violações aos direitos humanos durante os protestos sociais e de não terem agido para impedir essas violações. Ela busca que essa ação judicial seja incorporada à causa contra os ex-comandados.", "titulo_pt": "Campillai apresenta denúncia contra ex-alto-comando da Carabineros por supostas violações de direitos humanos durante os protestos sociais", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 289373, "titulo": "Emilie König, France's most high-profile female jihadist, faces justice", "url": "https://www.lemonde.fr/en/france/article/2026/11/26/emilie-konig-france-s-most-high-profile-female-jihadist-faces-justice_6789302_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-26T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A julgamento de Emilie König, uma mãe de cinco filhos repatriada da Síria e acusada de conspiração terrorista, por disseminar propaganda do grupo Estado Islâmico, foi iniciado em Paris. A acusação se refere especificamente a sua suposta atividade de propaganda para o grupo extremista.", "titulo_pt": "Emilie König, mais proeminente mulher jihaldista da França, enfrenta julgamento", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 289374, "titulo": "Paris appeals court upholds trial order for Depardieu over rape claims", "url": "https://www.lemonde.fr/en/culture/article/2026/11/26/paris-appeals-court-upholds-trial-order-for-depardieu-over-rape-claims_6789301_30.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-26T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O tribunal de apelações de Paris manteve a decisão de julgamento contra Gérard Depardieu, de 77 anos, acusado de estupro de Charlotte Arnould em 2018, quando ela tinha 22 anos.", "titulo_pt": "Tribunal de apelações de paris mantém decisão de julgamento contra Depardieu por acusação de estupro", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 289369, "titulo": "Bardella's antisemitic messages: 19 elements proving he was the author, contrary to his denials", "url": "https://www.lemonde.fr/en/politics/article/2026/11/26/bardella-s-antisemitic-messages-19-elements-proving-he-was-the-author-contrary-to-his-denials_6789268_5.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-26T15:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Le Monde obteve uma conversa privada do Facebook de 2013 envolvendo Jordan Bardella, revelada pela plataforma investigativa Mediapart. As mensagens correspondem a outras declarações públicas, demonstrando que, apesar das negações repetidas, o presidente do partido de Marine Le Pen efetivamente fez comentários antissemitas.", "titulo_pt": "Mensagens antissemitas de bardella: 19 elementos provando que ele foi o autor, contra suas negações", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 289476, "titulo": "UN ruling disputes Israeli allegations used to dismiss UNRWA Gaza staff", "url": "https://www.aljazeera.com/news/2026/11/26/un-ruling-disputes-israeli-allegations-used-to-dismiss-unrwa-gaza-staff?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-26T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O tribunal levantou questões sobre a credibilidade da decisão do UNRWA de demitir seus funcionários sem evidências comprovadas. Isso questiona as alegações israelenses que justificaram a demissão.", "titulo_pt": "Julgamento questiona decisão do UNRWA em demitir funcionários em Gaza", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 289552, "titulo": "UN experts demand Vietnam explain ‘abduction’ of activists from Cambodia", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3375945/un-experts-demand-vietnam-explain-abduction-activists-cambodia", "fonte_id": "scmp", "data_pub": "2026-11-26T12:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Orientais das Nações Unidas pediram que o Vietnã explique como três ativistas pró-democracia acabaram detidos, enfrentando acusações de terrorismo, após supostamente serem sequestrados do vizinho Camboja. O Vietnã é conhecido por reprimir fortemente a oposição interna e críticos dizem que a sua apparatus de segurança atua além das fronteiras, com dissidentes desejados já sendo abduzidos no Tailândia e na Alemanha.", "titulo_pt": "Orientais das nações unidas exigem explicações do vietnã sobre suposto sequestro de ativistas pró-democracia do camboja", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 289498, "titulo": "Vietnam must explain ‘abduction’ of activists: U.N. experts", "url": "https://www.japantimes.co.jp/news/2026/11/26/asia-pacific/vietnam-activists-un-experts/", "fonte_id": "japan_times", "data_pub": "2026-11-26T12:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vietnam proíbe quase toda divergência interna e os críticos afirmam que seu aparelho de segurança estende suas atividades além das fronteiras do país. O Conselho de Direitos Humanos da ONU pede que o Vietnã explique a 'abdução' de ativistas.", "titulo_pt": "ONU pede explicação sobre 'abdução' de ativistas no vietnã", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 289370, "titulo": "'At the hospital, they didn't know if I would make it through the night': Stun grenades cause increasingly severe injuries at protests in France", "url": "https://www.lemonde.fr/en/france/article/2026/11/26/at-the-hospital-they-didn-t-know-if-i-would-make-it-through-the-night-stun-grenades-cause-increasingly-severe-injuries-at-protests-in-france_6788971_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-26T10:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Stéphanie e Jonathan, que não se conhecem, foram feridos por fragmentos de granada de eletrocutação em protestos em outubro. As lesões continuam a afetá-los.", "titulo_pt": "Hospital não sabia se eu aguentaria a noite: ferimentos cada vez mais graves por causa de granadas de eletrocutação em protestos na França", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 289439, "titulo": "UK sent Sri Lankan refugee to Eswatini in secret deal, the BBC says", "url": "https://www.euronews.com/2026/11/26/uk-sent-sri-lankan-refugee-to-eswatini-in-secret-deal-the-bbc-says", "fonte_id": "euronews", "data_pub": "2026-11-26T10:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Reino Unido supostamente enviou um refugiado sri lankês condenado por estupro para Eswa             <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
