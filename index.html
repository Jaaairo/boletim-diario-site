<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 04/11/2026 07:22 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">
    <div class="modal-erro" id="senha-erro" style="display:none">Senha incorreta.</div>
    <div class="modal-btns">
      <button class="btn-sec2" onclick="fecharModal('modal-senha')">Cancelar</button>
      <button class="btn-pri" onclick="verificarSenha()">Entrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>
      <option value="erro_traducao">Erro de tradução</option>

      <button class="btn-peri" id="btn-rm-flag" onclick="removerFlagAtual()" style="display:none;margin-right:auto">Remover</button>
      <button class="btn-sec2" onclick="fecharModal('modal-flag')">Cancelar</button>
      <button class="btn-pri" onclick="salvarFlagAtual()">Marcar</button>

  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "04/11/2026 07:22", "stats": {"noticias_novas": 851, "resumos_gerados": 234}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva foi reeleito com 64 milhões de votos, o maior número absoluto da história das eleições presidenciais brasileiras. Isso exigiu uma negociação constante e a construção de alianças amplas, devido ao fortalecimento da oposição no Congresso Nacional. O Senado Federal aprovou a Proposta de Emenda à Constituição (PEC) da Segurança Pública sem discutir os destaques que tratam da redução da maioridade penal, concedendo mais poderes ao governo federal para combater organizações criminosas e ampliando a cooperação entre União, estados e municípios. O texto agora segue para promulgação. Além disso, o governo Lula espera que o Supremo Tribunal Federal (STF) declare a lei que legalizou as apostas no Brasil inconstitucional, visando evitar uma discussão no Congresso.", "mundo": "Os democratas conquistaram o controle do Congresso americano em uma eleição intermediária de 2026, expressiva rejeição a Trump e seus aliados republicanos. As vitórias foram significativas em praticamente todos os grupos demográficos, conforme indicado pelos resultados. Essa vitória, que antecede as eleições presidenciais de 2028, veio acompanhada de tensões internas no partido, com figuras progressistas enfrentando a liderança tradicional. A nova composição do Senado inclui vários vencedores que podem ser candidatos presidenciais no futuro. No Japão, a ministra Kimi Onoda afirmou que o país não planeja aumentar o limite para trabalhadores estrangeiros, apesar da escassez de mão-de-obra. Em outra notícia, o Partido Popular Progressista (DPP) em Seul, Coreia do Sul, rejeitou uma proposta de cortar impostos sobre alimentos, dependendo da aceitação de uma proposta alternativa pelo governo.\n\nAs relações geopolíticas internacionais foram significativamente afetadas pelas recentes eleições intermédiadas nos Estados Unidos, que resultaram em vitórias significativas para os democratas. Os democratas conquistaram a maioria no Senado e estão em vias de obter uma ampla maioria na Câmara dos Representantes, representando uma rejeição severa do governo de Donald Trump. Em resposta, o presidente eleito Joe Biden intensificou as pressões sobre a China em questões como Taiwan, inteligência artificial e controles de exportação. As tensões entre as nações continuaram com o Canadá rejeitando jogar hóquei contra times russos devido à guerra na Ucrânia, enquanto o Irã enfrenta a possibilidade de uma escalada com os Estados Unidos, que não têm planos imediatos de ataque. Em uma ação militar, Washington atacou alvos iranianos no Estreito de Ormuz. A Ucrânia também enfrentou ataques russos, com pelo menos 33 mortos e 50 desaparecidos após uma bomba atingir um centro de distribuição de ajuda humanitária. A China, por sua vez, está se tornando cada vez mais importante para o futuro econômico do Golfo, mas ainda depende de rotas marítimas vulneráveis para o acesso ao petróleo do Oriente Médio.", "economia": "O Superior Tribunal de Justiça (STJ) está prestes a decidir se as empresas podem manter o benefício do Programa de Regularização Tributária (Perse) até 2027, mesmo após a lei posterior limitar o custo fiscal a R$ 15 bilhões, encerrando o programa mais cedo. O Copom manteve a taxa Selic em 13,75% e interrompeu o ciclo de cortes iniciado em março de 2026, sob pressão devido à desconfiança fiscal e à inflação crescente. O Banco Central brasileiro pode ajustar a taxa Selic para um dígito, possivelmente para a taxa simples, em uma futura reunião de política monetária. O Itaú Unibanco registrou um lucro líquido recorrente de R$ 12,617 bilhões no terceiro trimestre de 2026, focando em créditos imobiliários e consignados. A Dasa (DASA3) caiu 16% após a UBS Brasil cortar a recomendação e apontar a pressão dos juros sobre a empresa.", "tecnologia": "O campus de startups STATION F, em Paris, divulgou sua lista de 2026 Future 40, destacando startups promissoras emergentes. As empresas do ecossistema arrecadaram um recorde de €2 bilhões neste ano. Entre as empresas que obtiveram sucesso, a Revolut confirmou que sua avaliação agora é de $115 bilhões, após concluir uma venda secundária de ações, o que dobrou sua avaliação em aproximadamente dois anos. A Innodisk está aprofundando sua estratégia de centro de dados de inteligência artificial (IA) ao fornecer componentes-chave para a infraestrutura de IA, incluindo SSDs empresariais (eSSDs) e módulos de memória para servidores de IA. A empresa também anunciou a série de SSDs de centro de dados em fase de amostragem completa, enquanto os produtos DDR5 e RDIMM serão lançados em etapas para suportar o treinamento de modelos intensivos em dados, inferência e computação de alto desempenho (HPC) para provedores de serviços de nuvem e novos operadores de nuvem (Neoclouds).", "ciencia": "Estudos recentes destacam a necessidade de reavaliar como gerenciamos ameaças de espécies perigosas, uma vez que mais de 700.000 pessoas morrem anualmente de doenças transmitidas por animais. Além disso, a Organização Mundial da Saúde (OMS) afirma que a implementação de medidas climáticas e de saúde poderia salvar quase 1,6 milhão de vidas por ano. Em outro desenvolvimento, cientistas da Universidade de Cambridge descobriram um zeptoverso, um universo 100 bilhões de vezes menor que um átomo, através de um experimento no Grande Colisor de Hádrons. No campo da biologia, pesquisadores do Instituto Brasileiro de Pesquisa Agropecuária (EMBRAPA) estão estudando a relação entre a genética das vacas Nelore e os microorganismos presentes em seus estômagos, com o objetivo de desenvolver estratégias para reduzir as emissões de metano e melhorar a eficiência alimentar dos animais.", "cultura": "Em 2024, Ry Herman buscou inspiração em contos de fadas com temas LGBTQ+, encontrando conforto na persistência dessas identidades. Em outro contexto, a 27ª Bienal de Arquitetura de Seul, em colaboração com o cantão suíço de Basel-Stadt, prepara-se para celebrar a inovação arquitetônica. No cenário cultural, a exposição Alter, em Tóquio, apresenta design contemporâneo com elementos de inteligência artificial e artesanato tradicional japonês. Apesar do sucesso global da indústria de dramas sul-coreanas, ela enfrenta desafios internos relacionados às condições de trabalho precárias. Na discussão cultural, a exposição Constantinople to Istanbul no V&A em Londres celebra a coexistência de duas culturas imperiais, enquanto a série irlandesa Tall Tales and Murder oferece uma visão intensa e dinâmica dos temas sociais.", "sociedade": "A Coreia do Sul escolheu 43 regiões para uma nova iniciativa de reforma educacional, com o objetivo de melhorar as pequenas escolas, reduzir disparidades educacionais e fortalecer a cooperação entre escolas, universidades e empresas locais. As regiões selecionadas receberão financiamento, apoio administrativo e isenções regulatórias durante cinco anos, a partir de 2027, visando melhorar as oportunidades educacionais em comunidades com uma população estudantil em declínio. Em outros eventos sociais, um empresário suspeito de matar a ex-namorada, uma advogada, e o filho de 6 anos está foragido. Além disso, a Smart Fit foi condenada a pagar R$ 10 mil a um aluno que se machucou em Minas Gerais. Além disso, a Secretaria da Mulher do Distrito Federal transferiu-se para um novo local em Taguatinga, e a Secretaria de Saúde de Mato Grosso sofreu um ataque hacker, resultando na suspensão temporária dos sistemas das unidades ligadas à pasta.", "meio_ambiente": "O Brasil apresentou dois roteiros internacionais para a COP31, uma conferência do clima da ONU que acontecerá na Turquia, com o objetivo de acelerar a implementação de compromissos climáticos. Os roteiros abordam a transição para energias renováveis e a interrupção e reversão do desmatamento até 2030. O evento mais recente, o Super El Niño, intensificou e atingiu níveis inéditos, levando a declaração de estado de emergência no Peru, afetando 1.380 dos 1.800 distritos do país. Em outras regiões, inundações flash devastaram o Sudoeste dos Estados Unidos, destruindo casas e deixando moradores isolados. Além disso, a Tailândia, o Brasil e os Estados Unidos aumentaram a utilização de óleos vegetais como biocombustível em 122% desde 2020, atingindo 34,3 milhões de toneladas, com a demanda total chegando a 40,3 milhões de toneladas, incluindo a União Europeia.", "direitos_humanos": "A Grã-Bretanha incentivou crianças ucranianas refugiadas a estudar russo em escolas britânicas, em vez de ucraniano. O Ministério da Educação anunciou a criação de um novo curso de certificado de estudos gerais (GCSE) em ucraniano. Em outro desenvolvimento, o ministro Gilmar Mendes ordenou que órgãos informassem sobre casos de violência contra indígenas após as eleições. A UNICEF emitiu uma declaração sobre relatos de crianças mortas e feridas em ataques aéreos em Myanmar, expressando preocupação com a situação. Além disso, o jornal The Diplomat abordou a ameaça real de violência online contra streamers femininas na China, quando os fãs as consideram como sua propriedade, transformando a entitlement online em violência no mundo real. No entanto, o caso mais grave foi a condenação de seis ex-membros do Exército Sérvio da Bósnia a uma pena total de 83 anos de prisão por assassinatos de 44 homens e deportação de mulheres e crianças de uma vila em Sokolac em 1992."}, "resumo_do_dia": {"politica_nacional": [{"id": 244192, "titulo": "Comissão do Senado vota liberação para prefeitos e governadores tomarem crédito em ano eleitoral", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/comissao-do-senado-vota-liberacao-para-prefeitos-e-governadores-tomarem-credito-em-ano-eleitoral.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-04T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A CAE do Senado vota um projeto que libera a contratação de operações de renegociação de dívidas por prefeitos e governadores nos quatro meses antes do fim de seus mandatos. O voto ocorre nesta quarta-feira (3).", "titulo_pt": "Cae do Senado vota liberação de crédito para prefeitos e governadores em ano eleitoral", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 244249, "titulo": "Queda na receita do café leva exportadores a cobrar ação do governo Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/queda-na-receita-do-cafe-leva-exportadores-a-cobrar-acao-do-governo-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-04T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A redução na receita das exportações de café levou os exportadores a pressionar o governo Lula. Até setembro de 2026, o Brasil perdeu US$ 952 milhões com as vendas do produto, apesar da expectativa de uma safra recorde em 2026.", "titulo_pt": "Decréscimo nas exportações de café impulsiona ações do setor contra governo Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 244264, "titulo": "Trump diz que aceitará resultado de eleição, mas posta boné “veto”", "url": "https://www.poder360.com.br/poder-internacional/trump-diz-que-aceitara-derrota-mas-posta-bone-com-a-palavra-veto/", "fonte_id": "poder360", "data_pub": "2026-11-04T08:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, afirmou que aceitará o resultado das eleições, mas indicou que usará vetos para governar. Ele minimizou os resultados das eleições, afirmando que não estava na cédula.", "titulo_pt": "Trump aceita resultado das eleições, mas posta boné 'veto'", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 244198, "titulo": "MP do Imposto Seletivo deve sair nesta quarta (4)", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/11/mp-do-imposto-seletivo-deve-sair-nesta-quarta-4.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-04T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal deve enviar a medida provisória do Imposto Seletivo ao Congresso Nacional nesta quarta-feira (4).", "titulo_pt": "MP do Imposto Seletivo deve ser enviada ao congresso nesta quarta (4)", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 244241, "titulo": "Governo Lula criticou reclassificação dos desenhos bíblicos da Record antes de cancelamento", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/11/governo-lula-criticou-reclassificacao-dos-desenhos-biblicos-da-record-antes-de-cancelamento.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-04T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Justiça revogou a reclassificação dos desenhos bíblicos da Record após uma reclamação de membros do governo Lula à Coordenação-Geral de Políticas de Classificação Indicativa.", "titulo_pt": "Governo Lula criticou reclassificação dos desenhos bíblicos da Record antes de cancelamento", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 244250, "titulo": "PP se irrita com ataques a Tereza Cristina após acordo com Rogério Marinho por chefia do Senado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/pp-se-irrita-com-ataques-a-tereza-cristina-apos-acordo-com-rogerio-marinho-por-chefia-do-senado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-04T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Senadores do PP se irritaram com a candidatura de Rogério Marinho ao cargo de presidente do Senado e com ataques nas redes sociais sobre Tereza Cristina desistir de sua candidatura.", "titulo_pt": "PP se irrita com ataques a Tereza Cristina após acordo com Rogério Marinho por chefia do Senado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 244231, "titulo": "Com mercado dividido após reeleição de Lula, BC decide nesta quarta entre novo corte ou manutenção da taxa de juros", "url": "https://g1.globo.com/economia/noticia/2026/11/04/com-mercado-dividido-apos-reeleicao-de-lula-bc-decide-nesta-quarta-entre-novo-corte-ou-manutencao-da-taxa-de-juros.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-04T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Comitê de Política Monetária (Copom) do Banco Central se reúne para definir a taxa básica de juros, após cinco cortes seguidos, mantendo-a em 13,75%. Os economistas estão divididos sobre a decisão, com maioria apoiando um novo corte, mas uma parcela considerável prevendo a manutenção da taxa atual.", "titulo_pt": "Com mercado dividido após reeleição de Lula, BC decide nesta quarta entre novo corte ou manutenção da taxa de juros", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 244232, "titulo": "Em acordo, Senado tentará votar redução da maioridade penal ainda nesta semana", "url": "https://g1.globo.com/politica/noticia/2026/11/04/em-acordo-senado-tentara-votar-reducao-da-maioridade-penal-ainda-nesta-semana.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-04T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Líderes do Senado acordaram em acelerar a votação da redução da maioridade penal, com a expectativa de que o texto seja votado no plenário já na quarta-feira (4). O acordo foi feito durante a votação da Proposta de Emenda à Constituição (PEC) da Segurança Pública.", "titulo_pt": "Senado acerta para votar redução da maioridade penal ainda nesta semana", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 244251, "titulo": "Motta e Alcolumbre reforçam aproximação com o governo e vão a evento sobre mulheres", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/motta-e-alcolumbre-reforcam-aproximacao-com-o-governo-e-vao-a-evento-sobre-mulheres.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-04T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Hugo Motta, presidente da Câmara, e Davi Alcolumbre, presidente do Senado, confirmaram presença em um evento sobre a presença feminina nas instituições, demonstrando aproximação com o governo.", "titulo_pt": "Motta e Alcolumbre confirmam presença em evento sobre mulheres", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 244252, "titulo": "O homem que não quis ser ministro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/eliogaspari/2026/11/o-homem-que-nao-quis-ser-ministro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-04T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal André Janones, que liderou uma campanha nas redes sociais em apoio a Lula, decidiu não buscar um cargo ministerial. Ele justificou sua decisão, afirmando que não deseja estar sob as amarras da liturgia de um cargo público nem se comprometer com obrigações burocráticas.", "titulo_pt": "O homem que não quis ser ministro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 244253, "titulo": "Decisões do TSE e mudança na lei travam redução de partidos políticos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/decisoes-do-tse-e-mudanca-na-lei-travam-reducao-de-partidos-politicos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-04T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cláusula de barreira, aprovada em 2017, resultou na extinção de seis partidos e na diminuição do número de legendas com representação no Congresso Nacional nos primeiros cinco anos. No entanto, decisões judiciais recentes e a criação de federações partidárias em 2021 impediram a continuidade desse processo.", "titulo_pt": "Decisões do TSE e mudança na lei travam redução de partidos políticos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 244306, "titulo": "Lula tem mais um trunfo, diz cientista político após avanço de pauta do governo", "url": "https://veja.abril.com.br/politica/lula-tem-mais-um-trunfo-diz-cientista-politico-apos-avanco-de-pauta-do-governo/", "fonte_id": "veja", "data_pub": "2026-11-04T01:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Elias Tavares, cientista político, analisa os desdobramentos de uma decisão importante do Senado e seus impactos na articulação política do presidente. Lula tem mais um trunfo, segundo o especialista, após o avanço da pauta governista.", "titulo_pt": "Lula tem mais um trunfo, diz cientista político após avanço de pauta do governo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 244307, "titulo": "‘Oposição home office’ de Flávio Bolsonaro pode funcionar? O que diz cientista político", "url": "https://veja.abril.com.br/politica/oposicao-home-office-de-flavio-bolsonaro-pode-funcionar-o-que-diz-cientista-politico/", "fonte_id": "veja", "data_pub": "2026-11-04T00:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um especialista avaliou que a atuação dos irmãos Bolsonaro nos Estados Unidos pode permitir que outras lideranças da direita brasileira ganhem espaço. O foco está na possibilidade de um 'oposição home office' de Flávio Bolsonaro.", "titulo_pt": "‘Oposição home office’ de Flávio Bolsonaro pode funcionar?", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 244254, "titulo": "Governo e oposição fecham acordo para votar redução da maioridade penal, mas tema ainda divide PT", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/governo-e-oposicao-fecham-acordo-para-votar-reducao-da-maioridade-penal-mas-tema-ainda-divide-pt.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-04T00:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os senadores da base do governo e da oposição acordaram para votar a proposta de emenda constitucional (PEC) que reduz a maioridade penal. O acordo foi fechado após a aprovação da PEC da Segurança Pública.", "titulo_pt": "Governo e oposição fecham acordo para votar redução da maioridade penal, mas tema ainda divide PT", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 244233, "titulo": "Lula comemora aprovação da PEC da Segurança Pública e reforça criação de ministério", "url": "https://g1.globo.com/politica/noticia/2026/11/03/lula-comemora-aprovacao-da-pec-da-seguranca-publica.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-03T23:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva comemorou a aprovação da PEC da Segurança Pública, que amplia o poder federal e prevê punições mais severas para chefes de facções criminosas. Ele reforçou a intenção de criar o Ministério da Segurança a partir da aprovação.", "titulo_pt": "Lula comemora aprovação da PEC da Segurança Pública e reforça criação de ministério", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 244284, "titulo": "Senado aprova PEC da Segurança Pública sem redução da maioridade penal", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/senado-aprova-pec-da-seguranca-publica-sem-reducao-da-maioridade-penal", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-03T23:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O plenário do Senado Federal aprovou a Proposta de Emenda à Constituição (PEC) da Segurança Pública, que reorganiza as forças públicas para combater o crime organizado, com 75 votos favoráveis em dois turnos de votação.", "titulo_pt": "Senado aprova PEC da Segurança Pública sem redução da maioridade penal", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 244548, "titulo": "EU to lead talks on support for Ukraine with US, Nato, partners – Europe live", "url": "https://www.theguardian.com/world/live/2026/nov/04/eu-ukraine-russia-france-germany-us-nato-europe-latest-news", "fonte_id": "guardian_world", "data_pub": "2026-11-04T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão Europeia irá conduzir negociações com os Estados Unidos, França, Alemanha, Reino Unido, NATO e Banco Mundial sobre apoio a Ucrânia. O ministro das Relações Exteriores da Polônia, Radosław Sikorski, criticou os conservadores poloneses que apoiaram Trump, comparando a situação política à crucificação de Jesus Cristo.", "titulo_pt": "Ue liderará negociações sobre apoio à Ucrânia com EUA, Nato e parceiros – Europa em tempo real", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 244750, "titulo": "Ukraine: 33 dead, over 50 missing after Russian bombing in Zaporizhzhia", "url": "https://www.euronews.com/video/2026/11/04/ukraine-31-dead-over-45-missing-after-russian-bombing-in-zaporizhzhia", "fonte_id": "euronews", "data_pub": "2026-11-04T09:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Razões russas causaram a morte de 33 pessoas e deixaram mais de 50 desaparecidos após ataques em um centro de ajuda humanitária na região de Zaporizhzhia, Ucrânia, em 2 de novembro. Sobreviventes e resgatadores apresentam ferimentos graves.", "titulo_pt": "Ucrânia: 33 mortos, mais de 50 desaparecidos após bombardeio russo em Zaporizhzhia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 244771, "titulo": "Key takeaways from the 2026 midterm elections in California", "url": "https://www.aljazeera.com/news/2026/11/4/key-takeaways-from-the-2026-midterm-elections-in-california?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-04T09:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os democratas mantiveram o cargo de governador e estão na trajetória para ganhar em importantes eleições para o Congresso.", "titulo_pt": "Principais pontos das eleições médias de 2026 na califórnia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 244772, "titulo": "Who determines Iran’s fighting and negotiating position amid US threats?", "url": "https://www.aljazeera.com/news/2026/11/4/who-determines-irans-fighting-and-negotiating-position-amid-us-threats?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-04T09:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Irã está prestes a enfrentar uma nova escalada com os Estados Unidos, mas as negociações continuam.", "titulo_pt": "Quem determina a postura de luta e negociação do Irã diante dos ameaçadores estados unidos?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 244701, "titulo": "Midterms 2026: Democrats' spectacular win precedes two years of confrontation", "url": "https://www.lemonde.fr/en/international/article/2026/11/04/midterms-2026-democrats-spectacular-win-precedes-two-years-of-confrontation_6771448_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-04T09:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os resultados históricos das eleições de 2026 não garantem uma vitória automática para os democratas nas eleições presidenciais de 2028. Existem já tensões entre os novos figuras progressistas e a guarda antiga do partido, e os democratas terão de escolher cuidadosamente suas batalhas entre iniciativas radicais e um mais tradicional controle do executivo.", "titulo_pt": "Eleições de 2026: vitória democrata impressionante antecede dois anos de confronto", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 244443, "titulo": "Republicana moderada é derrotada e perde cadeira no Senado após quase 30 anos", "url": "https://www.bbc.com/portuguese/articles/cq70pdkx8wnpo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-04T08:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma republicana moderada perdeu sua cadeira no Senado após quase 30 anos de mandato. Durante sua campanha, ela tentou se distanciar do presidente Donald Trump, em um pleito marcado por controvérsias.", "titulo_pt": "Republicana moderada perde cadeira no Senado após quase 30 anos", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 244819, "titulo": "Talk of Germany joining GCAP fighter program grows, but Japanese concerns persist", "url": "https://www.japantimes.co.jp/news/2026/11/04/japan/germany-japan-gcap-fighter-jet/", "fonte_id": "japan_times", "data_pub": "2026-11-04T08:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Oficiais do Japão expressam preocupações sobre a possibilidade de Alemanha se juntar ao programa de combate GCAP, alegando que isso poderia atrasar ainda mais a introdução do avião prevista para 2035.", "titulo_pt": "Discussão sobre Alemanha ingressar no programa GCAP cresce, mas mantêm-se preocupações japonesas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 244761, "titulo": "Americans deliver stunning rebuke to Trump as blue wave sweeps country", "url": "https://www.ft.com/content/b1eb9500-612a-4bb0-bdc3-0311cfc0ec99?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-04T08:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os democratas conquistaram o Congresso enquanto os republicanos sofreram derrotas em eleições intercalares em estados como Texas e Geórgia.", "titulo_pt": "Estados unidos entregam surpreendente rejeição a Trump em onda azul que percorre todo o país", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 244774, "titulo": "Democrat Troy Jackson unseats Republican Senator Susan Collins in Maine", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/4/democrat-troy-jackson-unseats-republican-senator-susan-collins-in-maine?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-04T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O democrata Troy Jackson venceu a senadora republicana Susan Collins no estado de Maine. Este resultado indica uma mudança na composição do Senado americano.", "titulo_pt": "Democrata Troy Jackson derrota republicana Susan Collins no Maine", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 244849, "titulo": "As US-Iran war shows, China’s influence can’t secure its line to Gulf oil", "url": "https://www.scmp.com/opinion/china-opinion/article/3372480/us-iran-war-shows-chinas-influence-cant-secure-its-line-gulf-oil", "fonte_id": "scmp", "data_pub": "2026-11-04T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China está se tornando cada vez mais importante para o futuro econômico do Golfo, mas ainda depende de rotas marítimas vulneráveis para o seu acesso ao petróleo do Oriente Médio. A guerra entre EUA e Irã destaca a contradição entre a importância da China como cliente de energia, investidor e parceiro tecnológico e a sua limitada capacidade de garantir as rotas marítimas.", "titulo_pt": "A influência chinesa no golfo não pode assegurar sua linha de acesso à petróleo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 244850, "titulo": "Taiwan flags massive PLA naval mobilisation, spike in air sorties", "url": "https://www.scmp.com/news/china/military/article/3373249/taiwan-flags-massive-pla-naval-mobilisation-spike-air-sorties", "fonte_id": "scmp", "data_pub": "2026-11-04T08:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Taiwan relatou preocupação com uma mobilização naval significativa do Exército Popular de Libertação da China, com mais de 100 navios da marinha e da guarda costeira realizando manobras no Pacífico Ocidental. O número de voos de aeronaves da Força Aérea da China perto da ilha também aumentou drasticamente, atingindo o maior total diário deste ano.", "titulo_pt": "Taiwan alerta para mobilização naval e aumento de voos da força aérea da china", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 244765, "titulo": "Who are the new faces in the Senate?", "url": "https://www.ft.com/content/d808855c-7157-4f63-b511-943fd3714e34?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-04T08:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A nova composição do Senado inclui vários vencedores que são vistos como potenciais candidatos presidenciais no futuro.", "titulo_pt": "Quais são as novas caras no senado?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 244820, "titulo": "Japan unlikely to raise cap for foreign workers despite labor shortages", "url": "https://www.japantimes.co.jp/news/2026/11/04/japan/onoda-foreign-residents/", "fonte_id": "japan_times", "data_pub": "2026-11-04T08:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ministra Kimi Onoda, responsável por políticas relacionadas a estrangeiros, afirmou que a demanda por uma categoria especial de vistos deve eventualmente diminuir. O Japão não planeja aumentar o limite para trabalhadores estrangeiros apesar da escassez de mão-de-obra.", "titulo_pt": "Japão não deve aumentar limite para trabalhadores estrangeiros, diz ministra", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 244776, "titulo": "Palestinians return to ruined Hebron homes after Israel’s 10-day siege", "url": "https://www.aljazeera.com/features/2026/11/4/palestinians-return-to-ruined-hebron-homes-after-israels-10-day-siege?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-04T08:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os residentes de Hebron retornaram às suas casas destruídas após o siege de 10 dias realizado por forças israelenses.", "titulo_pt": "Palestinos retornam às casas destruídas em Hebron após operação militar israelense de 10 dias", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 244929, "titulo": "Lee voices need to revise outdated Constitution, says assembly should take lead", "url": "https://en.yna.co.kr/view/AEN20261104010600315", "fonte_id": "yonhap_news", "data_pub": "2026-11-04T08:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Lee Jae Myung expressou a necessidade de revisar a Constituição obsoleta. Ele sugeriu que a assembleia deve liderar este processo.", "titulo_pt": "Lee jae myung defende revisão da constituição obsoleta e sugere que a assembleia deve liderar", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 244768, "titulo": "Stocks recover as investors digest Democrats’ sweep", "url": "https://www.ft.com/content/a0b18705-3bd8-4886-992c-b6062fdec6ea?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-04T
