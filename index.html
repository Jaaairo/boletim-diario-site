const D = {"gerado_em": "17/08/2026 07:20", "stats": {"noticias_novas": 711, "resumos_gerados": 245}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A campanha presidencial no Brasil começou oficialmente com eventos públicos dos candidatos em suas regiões eleitorais. Lula lidera as pesquisas com 47% das intenções de voto, seguido por Flávio Bolsonaro com 44%. As campanhas estão em ritmo acelerado, com os candidatos focando em temas como segurança pública e soberania nacional. O Carf (Conselho Administrativo de Recursos Fiscais) implementou novas políticas de integridade e antissuborno, alinhando-se aos padrões internacionais. Outros assuntos relevantes incluem a discussão de regras sobre deepfakes no TSE, as mudanças propostas no STF por Flávio Bolsonaro e Romeu Zema, e a descoberta de indícios de petróleo no Amapá, intensificando a disputa eleitoral na região. Além disso, Lula visitará o Amapá após o anúncio da Petrobras, enquanto Flávio Bolsonaro se concentra em Minas Gerais.", "mundo": "Ex-PM Kim foi eleito novo líder do Partido Democrático na Coreia do Sul, enquanto o país permanece em estado de guerra, conforme sinalizado pelo Ayatollah Mojtaba Khamenei, que nomeou simpatizantes radicais para posições importantes. Em outro desenvolvimento na região, a Ucrânia intensificou seus ataques contra a Rússia, realizando uma das maiores operações com drones. Por sua vez, a Rússia intensificou seus ataques no território ucraniano, causando destruição em áreas civis e industriais. Em meio a essas tensões, o Reino Unido enfrenta uma 'stressful' costela de problemas, com o primeiro-ministro prometendo aliviar o sofrimento de milhões de famílias. Além disso, incêndios florestais se espalharam por vários países da Europa, forçando a evacuação de milhares de pessoas e causando mortes e danos significativos. No entanto, o Japão evitou um desastre maior após um terremoto de magnitude 6,8 na província de Kumamoto, devido às construções e infraestruturas anti-seísmicas do país.\n\nO presidente dos Estados Unidos, Donald Trump, ordenou cortes nas manobras militares conjuntas entre os Estados Unidos e a Coreia do Sul, apesar dos avisos dos militares de ambos os países sobre o aumento das capacidades do regime de Kim Jong-un devido à guerra na Ucrânia. Essa decisão, que visa 'significativamente' reduzir as manobras, levanta preocupações sobre a aliança entre os aliados. Em outro desenvolvimento, o tráfego marítimo no Estreito de Ormuz atingiu um novo baixo nível, à medida que o cessar-fogo entre os Estados Unidos e Irã está prestes a expirar, sem um acordo em vista. Além disso, a lei que permite o desarmamento do PKK na Turquia gerou esperanças de um fim às décadas de conflito com os militantes kurdos, embora a desconfiança em relação ao presidente Recep Tayyip Erdogan tenha alimentado preocupações sobre o processo futuro.", "economia": "A economia global enfrenta diversos desafios, com destaque para a China, que registra um enfraquecimento do crescimento econômico. As vendas varejistas chinesas cresceram apenas 0,6% em julho, abaixo das expectativas, enquanto a produção industrial decelerou. A economia chinesa também enfrenta uma queda acentuada dos investimentos, indicando uma desaceleração econômica. Além disso, a empresa ChangXin Memory Technologies atingiu uma capitalização de mercado de 4,13 trilhões de yuan, ultrapassando pela primeira vez a Tencent Holdings, se tornando a empresa mais valiosa da China. No entanto, a economia do Japão perdeu impulso no segundo trimestre, com o PIB crescendo apenas 0,3%, abaixo das expectativas, devido a uma redução no consumo e no gasto em capital. As empresas de mobilidade no Brasil buscam incentivos para a reforma tributária, enquanto o Banco Central realiza leilões com uma linha de venda de até 1 bilhão de dólares. No mercado de criptomoedas, os cartões de criptomoedas avançam sem cobrança de IOF, beneficiando-se do uso de stablecoins. Em contraste, a rede varejista Marabraz pediu recuperação judicial com dívidas de R$ 140 milhões, enquanto a Casas Bahia anunciou um prejuízo de R$ 10 bilhões e considera pedir recuperação judicial para sair da crise.", "tecnologia": "A China enfrenta desafios significativos em seu desenvolvimento tecnológico, especialmente em inteligência artificial (IA), diante das tensões com os Estados Unidos. Zheng Yongnian, decano da Escola de Política Pública da Universidade de Hong Kong (Shenzhen), argumenta que a China pode definir seu próprio caminho tecnológico, mesmo com restrições de exportações dos EUA. A empresa Alibaba está se focando mais em comércio eletrônico e IA, vendendo sua divisão de jogos Lingxi Games. Em um desenvolvimento relacionado, a Taiwan Mobile elevou suas projeções de lucro para 2026, devido ao aumento na demanda por poder computacional de centros de dados devido às aplicações de IA. Paralelamente, a empresa Biren Technology, especializada em chips de IA, projeta um aumento de até 2.107% no faturamento no primeiro semestre de 2026, refletindo o boom de hardware de IA na China. Além disso, a Nvidia está próxima de fechar um acordo para fornecer garantias de crédito de aproximadamente 100 bilhões de dólares para o data center de 10GW do OpenAI em Ohio, um dos maiores projetos de infraestrutura de IA já vistos. Este acordo representa uma redução significativa em relação aos planos iniciais da Nvidia, que previam garantir 250 bilhões de dólares para o projeto.", "ciencia": "A descoberta de uma galáxia com três buracos negros pelo telescópio James Webb, em um estudo liderado por astrônomos, é um dos eventos mais significativos na ciência recente. Este achado, que excede as expectativas iniciais, sugere uma compreensão mais profunda sobre o comportamento e a formação de buracos negros em galáxias antigas. Em outro desenvolvimento tecnológico importante, a Blue Origin está expandindo sua instalação de lançamento em Cape Canaveral, construindo um segundo pátio para suportar o modelo mais poderoso do New Glenn, enquanto realiza reparos no pátio original danificado por uma explosão em maio. Este avanço visa aumentar a capacidade de lançamentos e suportar foguetes mais pesados, contribuindo para o avanço do setor espacial.", "cultura": "O evento mais significativo dos artigos foi a morte da atriz Hayden Panettiere, que faleceu aos 36 anos. Seu pai descreveu-a como uma 'luz incrível e uma força da natureza que trouxe amor e alegria imensuráveis'. A notícia foi seguida por uma série de artigos sobre eventos culturais e literários, incluindo a apresentação de um texto inédito de Plínio Marcos em forma de monólogo musical, a publicação do livro 'Agrippa' de Robert Harris, que retrata a rivalidade na Roma antiga, e o festival SP2B, que encerrou com apresentações de BaianaSystem e Criolo. Outros assuntos abordados incluem a discussão sobre a cultura de 'farmear aura' entre jovens, a discussão sobre a construção de um edifício de escritórios em madeira massiva nos Estados Unidos, e a discussão sobre o renascimento do interesse pela literatura de Thoreau entre jovens chineses.", "sociedade": "Um sargento da Polícia Militar do Distrito Federal (PMDF) foi morto a tiros por um advogado durante uma discussão em Santo Antônio do Descoberto, Goiás. O advogado, que é um Comandante de Área de Cidades (CAC), foi preso e a arma apreendida. A morte gerou uma reação da população local, que queimou uma casa usada como esconderijo de traficantes na vizinhança. Em outro incidente, uma criança autista de 5 anos foi encontrada morta em um tanque de dejetos de suínos em Rio Verde, Goiás. Além disso, um trio foi preso após a morte de uma menina de 14 anos, suspeita de envolvimento no sequestro e cárcere privado da adolescente. O trio tentou fugir para o Rio de Janeiro, mas foi detido. Em Santiago del Estero, um bebê de um ano e meio morreu após se atragantar com restos de carne durante uma refeição. No Rio de Janeiro, uma operação policial no bairro Cidade Volk (CV) investiga sessões de tortura contra motoboys, enquanto a Agência Nacional de Segurança Vial (ANSV) intensificou os controles de trânsito no inverno, identificando mais de 10.000 condutores infratores, com mais de 700 testando positivo para alcoolemia. No Brasil, 60% das pessoas deixaram de realizar atividades devido ao suor intenso, de acordo com um levantamento japonês. Além disso, em Petrópolis, um ônibus tombou durante a descida da serra, resultando em dez mortes, com a agência responsável apontando o 'transporte clandestino de passageiros' como possível causa do acidente.", "meio_ambiente": "A seca afeta a Itália, com o Rio Po atingindo níveis históricos baixos, levando a Suíça a fornecer água para salvar cultivos. Na Indonésia, um terremoto de magnitude 7,7 causou 53 mortes e deixou mais de 5 mil desabrigados, principalmente durante o Dia da Independência. O aumento da temperatura e a escassez d'água estão aumentando os riscos para ativos localizados strategicamente, conforme relatado. Em contraste, a energia solar expandiu rapidamente, atingindo 100 gigawatts em 2012 e um terawatt em 2022, com o próximo terawatt sendo instalado em menos de três anos. O Brasil registra o avanço do etanol e do biometano no transporte de cargas, oferecendo novas opções para reduzir a emissão de gases de efeito estufa em setores difíceis de eletrificar.", "direitos_humanos": "O surto de Ebola na República Democrática do Congo atingiu seu pior nível histórico, com pelo menos 2.325 mortes e 4.945 casos confirmados, superando o surto de 2018-2019. Em outra notícia, a Comissão Nacional de Direitos Humanos criticou uma proposta de chicotear, expressando preocupações sobre as consequências potenciais dessa medida. Além disso, o ministro da Segurança Nacional de extrema-direita, Itamar Ben-Gvir, fez um pedido gravado para o assassinato de '30 a 40' palestinos em Gaza diariamente, além de defender a imigração em massa de palestinos do Gaza, considerando a região inteiramente israelense. No Território Ocidental, colonos israelenses feriram palestinos em ataques físicos e com spray de pimenta, enquanto, no Gaza, um médico relatou a amputação de uma menina sem anestesia."}, "resumo_do_dia": {"politica_nacional": [{"id": 106648, "titulo": "Carf adota novas políticas de integridade e antissuborno", "url": "https://www.jota.info/tributos/carf-adota-novas-politicas-de-integridade-e-antissuborno", "fonte_id": "jota", "data_pub": "2026-08-17T09:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Carf (Conselho Administrativo de Recursos Fiscais) implementou novas políticas de integridade e antissuborno. Essas regras visam alinhar o órgão aos padrões internacionais de gestão e aumentar a confiança na instituição.", "titulo_pt": "Carf adota novas políticas de integridade e antissuborno", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 106484, "titulo": "Lula ou Flávio Bolsonaro: Nova pesquisa mostra quem tem a maior rejeição na largada da campanha", "url": "https://veja.abril.com.br/politica/lula-ou-flavio-bolsonaro-nova-pesquisa-mostra-quem-tem-a-maior-rejeicao-na-largada-da-campanha/", "fonte_id": "veja", "data_pub": "2026-08-17T09:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa mostra que Lula e Flávio Bolsonaro têm a maior rejeição entre os candidatos à presidência. O dado indica a resistência inicial dos eleitores a esses dois nomes.", "titulo_pt": "Lula ou Flávio Bolsonaro: nova pesquisa mostra quem tem a maior rejeição na largada da campanha", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 106485, "titulo": "Campanha começa com Lula seguido de perto por adversários no segundo turno, diz BTG Nexus", "url": "https://veja.abril.com.br/brasil/campanha-comeca-com-lula-seguido-de-perto-por-adversarios-no-segundo-turno-diz-btg-nexus/", "fonte_id": "veja", "data_pub": "2026-08-17T09:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O levantamento realizado pelo BTG Nexus indica que Lula lidera com 47% das intenções de votos contra 44% de Flávio Bolsonaro, configurando um empate técnico dentro da margem de erro no segundo turno das eleições.", "titulo_pt": "Campanha no segundo turno tem Lula empatado técnico com flávio bolsonaro, diz BTG Nexus", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 106550, "titulo": "BTG: Lula lidera 1º turno, mas segue empatado com Flávio e Caiado no 2º", "url": "https://www.metropoles.com/brasil/btg-lula-lidera-1o-turno-mas-segue-empatado-com-flavio-e-caiado-no-2o", "fonte_id": "metropoles", "data_pub": "2026-08-17T09:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O levantamento eleitoral é o primeiro divulgado após o início oficial das campanhas para a Presidência da República, mostrando que Lula lidera o primeiro turno, mas está empatado com Flávio e Caiado no segundo turno.", "titulo_pt": "BTG: lula lidera 1º turno, mas segue empatado com Flávio e Caiado no 2º", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 106436, "titulo": "Flávio Bolsonaro quer tirar universidades federais da alçada do MEC", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/flavio-bolsonaro-quer-tirar-universidades-federais-da-alcada-do-mec.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-17T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro, candidato à Presidência pelo PL, propôs transferir a gestão das universidades federais para o MCTI, mantendo ideia anteriormente defendida pelo governo Jair Bolsonaro.", "titulo_pt": "Flávio Bolsonaro quer transferir gestão das universidades federais para o mcti", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 106649, "titulo": "Tema 1.218: cumprir o piso é responsabilidade fiscal", "url": "https://www.jota.info/opiniao-e-analise/artigos/tema-1-218-cumprir-o-piso-e-responsabilidade-fiscal", "fonte_id": "jota", "data_pub": "2026-08-17T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A decisão do Supremo Tribunal Federal (STF) sobre o piso salarial do magistério pode se tornar um teto orçamentário se não considerar a carreira docente. Isso sugere que a implementação integral do piso pode ter implicações financeiras significativas para o governo.", "titulo_pt": "Decisão do stf sobre piso do magistério pode se tornar teto orçamentário", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 106652, "titulo": "Os limites à deferência técnica: uma reflexão sobre o controle de legalidade", "url": "https://www.jota.info/opiniao-e-analise/artigos/os-limites-a-deferencia-tecnica-uma-reflexao-sobre-o-controle-de-legalidade", "fonte_id": "jota", "data_pub": "2026-08-17T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A agência reguladora pode fornecer sua experiência técnica, mas não pode substituir o Judiciário no controle de legalidade.", "titulo_pt": "Os limites à deferência técnica: uma reflexão sobre o controle de legalidade", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 106653, "titulo": "Remédio caro: quem paga a conta, e quem paga o advogado?", "url": "https://www.jota.info/opiniao-e-analise/colunas/advogadas-publicas-em-debate/remedio-caro-quem-paga-a-conta-e-quem-paga-o-advogado", "fonte_id": "jota", "data_pub": "2026-08-17T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O tema 1.234 do Supremo Tribunal Federal (STF) altera a responsabilidade dos entes públicos pelos honorários advocatícios nas ações relacionadas a medicamentos. Este tema afeta como os custos dessas ações são distribuídos entre as partes envolvidas.", "titulo_pt": "Remédio caro: quem paga a conta e quem paga o advogado?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 106525, "titulo": "42 mulheres participaram da corrida presidencial desde a redemocratização", "url": "https://www.cnnbrasil.com.br/eleicoes/42-mulheres-participaram-da-corrida-presidencial-desde-a-redemocratizacao/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-17T07:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Houve 42 mulheres que participaram de corridas presidenciais desde a redemocratização. Em 1989, foram 43 homens como cabeça de chapa ou vice, e neste ano, sete mulheres estão na disputa.", "titulo_pt": "42 Mulheres participaram da corrida presidencial desde a redemocratização", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 106526, "titulo": "TSE deve se reunir nesta semana para esclarecer regra sobre deepfakes", "url": "https://www.cnnbrasil.com.br/eleicoes/tse-deve-se-reunir-nesta-semana-para-esclarecer-regra-sobre-deepfakes/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-17T07:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os ministros do Tribunal Superior Eleitoral (TSE) devem se reunir na semana que vem para discutir e definir as regras sobre a utilização de deepfakes nas eleições. A reunião visa reforçar a proibição da tecnologia e alinhar o entendimento antes de julgar um caso envolvendo um vídeo do presidente Bolsonaro.", "titulo_pt": "TSE deve se reunir nesta semana para esclarecer regra sobre deepfakes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 106528, "titulo": "Após reviravoltas, 33 senadores miram reeleição e 10 governo estadual", "url": "https://www.cnnbrasil.com.br/eleicoes/apos-reviravoltas-33-senadores-miram-reeleicao-e-10-governo-estadual/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-17T07:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Candidaturas em Minas Gerais e Alagoas foram definidas perto do fim do prazo de registro. Senadores titulares também disputam vagas de suplentes e cadeiras na Câmara dos Deputados.", "titulo_pt": "33 Senadores miram reeleição e 10 disputam governo estadual", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 106437, "titulo": "Base de Tarcísio dobra e domina Assembleia Legislativa de SP em ano eleitoral", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/base-de-tarcisio-dobra-e-domina-assembleia-legislativa-de-sp-em-ano-eleitoral.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-17T07:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A base de Tarcísio de Freitas na Assembleia Legislativa de São Paulo cresceu mais do que o dobro em pouco mais de três anos de mandato e hoje representa 69% dos deputados aliados à reeleição do governador.", "titulo_pt": "Base de Tarcísio dobra e domina Assembleia Legislativa de SP em ano eleitoral", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 106529, "titulo": "Flávio e Zema propõem mudanças no STF em planos de governo", "url": "https://www.cnnbrasil.com.br/eleicoes/flavio-e-zema-propoem-mudancas-no-stf-em-planos-de-governo/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-17T07:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos Flávio Bolsonaro e Romeu Zema propõem mudanças no Supremo Tribunal Federal (STF) em seus planos de governo, sugerindo limitar decisões individuais dos ministros e reduzir as competências da corte.", "titulo_pt": "Flávio e Zema propõem mudanças no STF em seus planos de governo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 106438, "titulo": "Indício de petróleo acirra disputa eleitoral no Amapá, pressiona Petrobras e atrai Lula ao estado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/indicio-de-petroleo-acirra-disputa-eleitoral-no-amapa-pressiona-petrobras-e-atrai-lula-ao-estado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-17T07:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A descoberta de indícios de petróleo na bacia Foz do Amazonas, no Amapá, intensificou a disputa eleitoral, com candidatos focando em investimentos para a instalação de uma base da Petrobras na região. A informação foi anunciada recentemente e pressiona as campanhas políticas locais.", "titulo_pt": "Descoberta de petróleo acirra disputa eleitoral no Amapá e pressiona Petrobras", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 106532, "titulo": "Lula vai ao Amapá e adversários concentram agendas no sudeste", "url": "https://www.cnnbrasil.com.br/eleicoes/lula-vai-ao-amapa-e-adversarios-concentram-agendas-no-sudeste/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-17T07:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente visitará o Amapá após anúncio da Petrobras, enquanto outros candidatos estarão em Minas Gerais e São Paulo.", "titulo_pt": "Lula vai ao Amapá e adversários concentram agendas no sudeste", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 106439, "titulo": "Na largada da campanha eleitoral, Lula lidera atenção nas redes sociais", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/encaminhado-com-frequencia/2026/08/na-largada-da-campanha-eleitoral-lula-lidera-atencao-nas-redes-sociais.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-17T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O período de campanha eleitoral iniciou com Lula fazendo seu ato no estádio da Vila Euclides, em São Bernardo do Campo, e Flávio Bolsonaro em Copacabana. A Palver monitorou a repercussão desses atos nas redes sociais entre sábado e a noite de domingo.", "titulo_pt": "Na largada da campanha, Lula lidera nas redes sociais", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 107022, "titulo": "(URGENT) Ex-PM Kim elected new head of ruling Democratic Party", "url": "https://en.yna.co.kr/view/AEN20260817003000315", "fonte_id": "yonhap_news", "data_pub": "2026-08-17T09:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ex-PM Kim foi eleito novo líder do Partido Democrático, o partido no poder na Coreia do Sul.", "titulo_pt": "Ex-PM Kim eleito novo líder do partido democrático", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 106830, "titulo": "Ukraine and Russia intensify attacks, several killed in Belgorod border region", "url": "https://www.france24.com/en/europe/20260817-ukraine-and-russia-intensify-attacks-several-killed-in-belgorod-border-region", "fonte_id": "france24", "data_pub": "2026-08-17T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ucranianos realizaram um ataque com mísseis no região fronteiriça de Belgorod, na Rússia, deixando seis mortos e quatro feridos, incluindo uma criança. Simultaneamente, forças russas atacaram infraestruturas portuárias na região de Odesa, no sul da Ucrânia.", "titulo_pt": "Ucrânia e Rússia intensificam ataques, seis mortos em região fronteiriça de Belgorod", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 106744, "titulo": "Belgium tackles enormous wildfire as French PM booed on visit to affected region – Europe live", "url": "https://www.theguardian.com/world/live/2026/aug/17/europe-wildfires-france-greece-belgium-germany-climate-crisis-drought-extreme-heat-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-08-17T09:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio florestal considerado o maior na história da Bélgica avançou próximo à fronteira com a Alemanha, levando a evacuações. O chefe dos bombeiros belgas, Marc Gilbert, pediu mais recursos e integração da frota de bombeiros da União Europeia para preparar o país para grandes incêndios.", "titulo_pt": "Bélgica enfrenta incêndio florestal histórico enquanto chefe dos bombeiros pede mais recursos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 106851, "titulo": "Russia targets Danube port after one of Ukraine’s largest aerial attacks of the war", "url": "https://www.cnbc.com/2026/08/17/ukraine-war-russia-putin-moscow.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-17T09:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rússia atacou infraestrutura portuária na região ucraniana de Odesa, danificando um navio civil de bandeira do Togo perto de Izmail, após uma importante ataques aéreos lançados por Kiev.", "titulo_pt": "Rússia ataca porto na Ucrânia após um dos maiores ataques aéreos do conflito", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 106732, "titulo": "Iran’s Supreme Leader Signals Intention to Keep Country on a War Footing", "url": "https://www.nytimes.com/2026/08/17/world/middleeast/iran-khamenei-military-leaders-war.html", "fonte_id": "nyt_world", "data_pub": "2026-08-17T09:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ayatollah Mojtaba Khamenei nomeou simpatizantes radicais para posições importantes, indicando que está disposto a manter o país em estado de guerra e suprimir qualquer dissidência interna.", "titulo_pt": "Líder supremo do Irã sinaliza intenção de manter o país em estado de guerra", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 106865, "titulo": "Inside the UK’s ‘stressful’ cost of living crisis Burnham hopes to tackle", "url": "https://www.aljazeera.com/news/2026/8/17/who-can-live-on-340-a-month-inside-the-uks-cost-of-living-crisis?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-17T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O novo primeiro-ministro do Reino Unido promete aliviar o sofrimento de milhões de famílias que não conseguem affordar itens básicos.", "titulo_pt": "Dentro da crise de custo de vida 'estressante' do reino unido: Burnham espera resolver", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 106831, "titulo": "Wildfires spread across Europe as thousands evacuated", "url": "https://www.france24.com/en/video/20260817-wildfires-spread-across-europe-as-thousands-evacuated", "fonte_id": "france24", "data_pub": "2026-08-17T09:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos florestais se espalharam por vários países da Europa, forçando a evacuação de milhares de pessoas e causando mortes e danos significativos. Grecia, Espanha, Itália, Bélgica, Alemanha e Reino Unido enfrentaram incêndios severos, enquanto Croácia registrou múltiplos focos de incêndio e prisões suspeitas de arromatorismo.", "titulo_pt": "Fogos florestais se alastram pela Europa, com milhares evacuados", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 106619, "titulo": "Javier Milei y sus medidas, en vivo: el discurso en el acto homenaje a San Martín y el armado electoral de cara al 2027", "url": "https://www.lanacion.com.ar/politica/javier-milei-y-sus-medidas-en-vivo-el-discurso-en-el-acto-homenaje-a-san-martin-y-el-armado-nid17082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-17T09:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo destaca o discurso de Javier Milei durante um evento em homenagem a San Martín, além das decisões do presidente, as reações da oposição e as declarações dos funcionários públicos. O conteúdo abrange as principais ações e reações durante o evento.", "titulo_pt": "Javier Milei e suas medidas, ao vivo: discurso no ato homenageando San Martín e planejamento eleitoral para 2027", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 106913, "titulo": "Hayden Panettiere, star of ‘Heroes,’ dies at 36", "url": "https://english.elpais.com/people/2026-08-17/hayden-panettiere-star-of-heroes-dies-at-36.html", "fonte_id": "elpais_en", "data_pub": "2026-08-17T09:34:00Z", "idioma": "en", "provavel_duplicata_de": 106825, "texto_pt": "A atriz Hayden Panettiere, estrela da série 'Heroes', faleceu aos 36 anos, deixando uma filha de 12 anos. Ela iniciou sua carreira como atriz infantil e atuou em produções como 'Nashville' e 'A Vida de um Inseto'. Seu irmão mais jovem faleceu em 2023 devido a uma condição cardíaca.", "titulo_pt": "Hayden Panettiere, estrela de 'Heroes', morre aos 36 anos", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 106858, "titulo": "Indonesia: Thousands await aid as quake death toll rises to 54", "url": "https://www.dw.com/en/indonesia-thousands-await-aid-as-quake-death-toll-rises-to-54/a-78395000?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-17T09:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Indonésia registrou seu Dia da Independência nesta segunda-feira, no entanto, as comemorações foram abafadas por um terremoto que deixou mais de 50 mortos e milhares deslocados. Os residentes afirmam precisar de ajuda imediata.", "titulo_pt": "Indonésia: centenas aguardam assistência enquanto mortes por terremoto subiram para 54", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 106737, "titulo": "How Japan Averted a Major Earthquake Disaster", "url": "https://www.nytimes.com/video/world/asia/100000011069179/japan-earthquake-disaster-kumamoto.html", "fonte_id": "nyt_world", "data_pub": "2026-08-17T09:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um terremoto de magnitude 6,8 ocorrido há algum tempo atrás na província de Kumamoto, no Japão, evitou um desastre maior devido às construções e infraestruturas anti-seísmicas do país.", "titulo_pt": "Como o Japão evitou um grande desastre de terremoto", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 106820, "titulo": "Inside the nighttime operations of the Ukraine drone regiment pummelling Moscow", "url": "https://www.lemonde.fr/en/international/article/2026/08/17/inside-the-nighttime-operations-of-the-ukraine-drone-regiment-pummelling-moscow_6756580_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-17T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A 413ª Régiment de Forças de Sistemas Não Tripulados tem intensificado os ataques na região russa de dentro do território ucraniano. Kiev acelerou seus esforços militares para atingir a infraestrutura econômica do invasor no coração de Moscou.", "titulo_pt": "Dentro das operações noturnas da regimentação de drones ucraniana atacando moscou", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 106833, "titulo": "West Bank : UN delivers aid to besieged Palestinian families in Qusra", "url": "https://www.france24.com/en/west-bank-un-delivers-aid-to-besieged-palestinian-families-in-qusra", "fonte_id": "france24", "data_pub": "2026-08-17T09:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ONU entregou ajuda a Qusra, na Cisjordânia Ocidental, após colonos israelenses cortarem o acesso de várias famílias palestinas a alimentos, água e eletricidade. Os moradores relatam meses de assédio e agressões, enquanto organizações de direitos humanos acusam os colonos de tentar deslocar os palestinos da região.", "titulo_pt": "Palestinos em Qusra recebem ajuda humanitária após corte de serviços", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 106739, "titulo": "Trump orders cuts to South Korea joint drills despite warnings about Kim regime", "url": "https://www.theguardian.com/world/2026/aug/17/trump-cuts-south-korea-joint-drills-us-military-good-relationship-kim-jong-un", "fonte_id": "guardian_world", "data_pub": "2026-08-17T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Trump anunciou cortes nas manobras militares conjuntas entre os Estados Unidos e Coreia do Sul, apesar de avisos de militares de ambos os países sobre o aumento das capacidades do regime de Kim Jong-un devido à guerra na Ucrânia. As manobras Ulchi Freedom Shield, uma das duas principais exercícitas anuais realizadas pela Coreia do Sul e os EUA, começam em 1º de agosto e terminam em 27 de agosto.", "titulo_pt": "Trump reduz manobras militares com Coreia do sul apesar de advertências sobre regime norte-coreano", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 106740, "titulo": "Labor pledges opt-out register for online gambling ads as Pocock calls out shortfalls in government’s bill", "url": "https://www.theguardian.com/australia-news/2026/aug/17/labor-pledges-opt-out-register-for-online-gambling-ads-australia", "fonte_id": "guardian_world", "data_pub": "2026-08-17T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo laborista propôs uma nova inscrição de saída única para anúncios de apostas online como parte das emendas à sua proposta de lei sobre anúncios de apostas. A medida não atende completamente aos chamados para um modelo de inscrição de entrada ou para uma proibição total. A ministra de comunicações, Anika Wells, confirmou que as empresas de apostas enfrentarão um novo imposto.", "titulo_pt": "Governo laborista promete registro de saída única para anúncios de apostas online em emendas à proposta de lei", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 106834, "titulo": "Ukraine launches one of its largest drone attacks on Russia", "url": "https://www.france24.com/en/video/20260817-ukraine-launches-one-of-its-largest-drone-attacks-on-russia", "fonte_id": "france24", "data_pub": "2026-08-17T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ucrânia realizou uma das maiores operações com drones contra a Rússia, atingindo um depósito da Wildberries e outros locais. Ao mesmo tempo, os ataques russos continuaram em território ucraniano, destruindo áreas civis e industriais.", "titulo_pt": "Ucrânia realiza uma das maiores operações com drones contra a Rússia", "veiculo": "France 24", "pais": "França", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 106448, "titulo": "Empresas europeias calculam custos e ganhos em meio a onda de calor", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/empresas-europeias-calculam-custos-e-ganhos-em-meio-a-onda-de-calor.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-17T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de empresas europeias que relatam o impacto das condições climáticas extremas em seus negócios aumentou significativamente, devido a uma série de fortes ondas de calor que afetam positivamente alguns setores, mas negativamente outros.", "titulo_pt": "Empresas europeias relatam impacto de ondas de calor em seus negócios", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 106964, "titulo": "China’s economy cools amid debate about risks of global crisis", "url": "https://www.scmp.com/plus/economy/china-economy/article/3364282/chinas-economy-cools-amid-debate-about-risks-global-crisis?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-17T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O crescimento das vendas varejistas chinesas ficou abaixo das expectativas, a expansão da produção industrial decelerou e a redução dos investimentos agravou a desaceleração da economia chinesa no início da segunda metade do ano. As vendas varejistas em julho aumentaram apenas 0,6%, abaixo do esperado, enquanto a produção industrial cresceu 4,5%, abaixo do previsto.", "titulo_pt": "Economia chinesa enfria diante dos riscos de crise global", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 106965, "titulo": "CXMT tops 4 trillion yuan as AI-fuelled memory rally lifts China’s chip champion", "url": "https://www.scmp.com/tech/article/3364288/cxmt-tops-4-trillion-yuan-ai-fuelled-memory-rally-lifts-chinas-chip-champion?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-17T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da ChangXin Memory Technologies (CXMT), fabricante de DRAM líder da China, subiram 12% na semana passada, atingindo um recorde de 61,80 yuan, elevando sua capitalização de mercado para 4,13 trilhões de yuan e mantendo seu status como a empresa listada mais valiosa da China. A empresa superou pela primeira vez a Tencent Holdings, também listada em Hong Kong, como a empresa mais valiosa da China em 3 de março, quando sua capitalização de mercado atingiu cerca de 3,54 trilhões de yuan.", "titulo_pt": "CXMT supera 4 trilhões de yuan com forte alta impulsionada por IA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 106998, "titulo": "SK keyfoundry expands 8-inch capacity as China demand strains supply", "url": "https://www.digitimes.com/news/a20260817VL218/capacity-demand-investment-production-2026.html", "fonte_id": "digitimes", "data_pub": "2026-08-17T08:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SK keyfoundry aprovou uma despesa de capital de 90 bilhões de wones (aproximadamente 64 milhões de dólares) para expandir sua capacidade de produção em 8 polegadas, um movimento raro para uma empresa que historicamente priorizava a manutenção de suas linhas de produção existentes.", "titulo_pt": "SK keyfoundry amplia capacidade de 8 polegadas devido à demanda chinesa", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 106853, "titulo": "China's economy slows further in July as retail sales barely grow, investment slump steepens", "url": "https://www.cnbc.com/2026/08/17/china-economy-sales-investment-july-.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-17T08:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas no varejo chinesas cresceram apenas ligeiramente em julho, enquanto o investimento decresceu significativamente, indicando uma desaceleração econômica. Esses dados confirmam preocupações sobre a saúde da segunda maior economia do mundo, que enfrenta um desequilíbrio crescente entre oferta e demanda.", "titulo_pt": "Economia da china desacelera mais em julho com crescimento fraco nas vendas e queda acentuada nos investimentos", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 106941, "titulo": "The No Surprises Act could be a shock to the U.S. health care system", "url": "https://www.japantimes.co.jp/commentary/2026/08/17/world/surprise-us-billing-law-costly/", "fonte_id": "japan_times", "data_pub": "2026-08-17T08:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Lei sem Surpresas poderia surpreender o sistema de saúde dos EUA, especialmente se as taxas médicas aumentarem e os seguradores enfrentarem custos crescentes com arbitragens. Isso pode fazer com que os consumidores paguem mais.", "titulo_pt": "Lei sem surpresas poderia surpreender o sistema de saúde dos EUA", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 106450, "titulo": "PIS/Pasep é pago a 4,1 milhões de trabalhadores; veja calendário e quem recebe", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/pispasep-e-pago-a-41-milhoes-de-trabalhadores-veja-calendario-e-quem-recebe.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-17T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Caixa Econômica Federal e o Banco do Brasil pagam nesta segunda-feira (17) o sétimo e último lote do abono salarial PIS/Pasep de 2026. Ao todo, 4,1 milhões de trabalhadores nascidos em novembro e dezembro estão habilitados a receber o benefício referente ao ano-base 2024.", "titulo_pt": "PIS/Pasep é pago a 4,1 milhões de trabalhadores; veja calendário e quem recebe", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 106573, "titulo": "Vencimento de títulos do Tesouro e recalibragem de fundos pressionam juros nesta 2ª", "url": "https://www.infomoney.com.br/onde-investir/vencimento-de-titulos-do-tesouro-e-recalibragem-de-fundos-pressionam-juros-nesta-2a/", "fonte_id": "infomoney", "data_pub": "2026-08-17T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os vencimentos de títulos do Tesouro e a recalibragem de fundos estão pressionando os juros nesta segunda-feira. A curva de juros enfrenta pressões devido à crescente dependência de papéis pós-fixados e a sessão de estresse ocorrida na sexta-feira passada.", "titulo_pt": "Vencimento de títulos do Tesouro e recalibragem de fundos pressionam juros nesta segunda", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 106944, "titulo": "Japan’s economy loses some steam in the second quarter", "url": "https://www.japantimes.co.jp/business/2026/08/17/economy/gdp-second-quarter/", "fonte_id": "japan_times", "data_pub": "2026-08-17T07:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A economia do Japão perdeu um pouco de impulso no segundo trimestre, com os consumidores se retraindo e as empresas reduzindo suas atividades. Isso proporcionou ao Banco do Japão dados menos favoráveis do que esperados.", "titulo_pt": "Economia do Japão perde impulso no segundo trimestre", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 106522, "titulo": "Empresas de mobilidade querem fomento a investimentos na reforma tributária", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/empresas-de-mobilidade-querem-fomento-a-investimentos-na-reforma-tributaria/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-17T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas de mobilidade estão buscando incentivos através de mudanças no regime especial das companhias de transporte. O foco está na reforma tributária para atrair investimentos nessa área.", "titulo_pt": "Empresas de mobilidade buscam incentivos na reforma tributária", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 107002, "titulo": "Samsung's China sales overtake US; Nvidia not among top five customers", "url": "https://www.digitimes.com/news/a20260817VL216/samsung-sales-nvidia-2026-hbm.html", "fonte_id": "digitimes", "data_pub": "2026-08-17T07:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas da Samsung para a China superaram as para os Estados Unidos no primeiro semestre de 2026, impulsionadas pelo aumento da demanda por memórias de inteligência artificial. A Nvidia não figurou entre os cinco maiores clientes da Samsung, apesar de uma crescente parceria entre as duas empresas no segmento de memória de alta largura de banda.", "titulo_pt": "Vendas da samsung para China superam estados unidos; Nvidia não é um dos cinco maiores clientes", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 106533, "titulo": "BC realiza leilões de linha de até US$ 1 bilhão nesta segunda (17)", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/bc-realiza-leiloes-de-linha-de-ate-us-1-bilhao-nesta-segunda-17/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-17T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central (BC) realiza leilões com linha de venda de até 1 bilhão de dólares nesta segunda-feira (17). As operações serão liquidadas em 2 de setembro.", "titulo_pt": "BC realiza leilões de venda de até 1 bilhão nesta segunda-feira (17)", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 106874, "titulo": "Japan’s economy slows, missing growth forecasts", "url": "https://www.aljazeera.com/economy/2026/8/17/japans-economy-slows-missing-growth-forecasts?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-17T06:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O PIB do Japão cresceu 0.3% no segundo trimestre, abaixo das expectativas. O consumo e o gasto em capital diminuíram.", "titulo_pt": "Economia do Japão enfraquece, perdendo projeções de crescimento", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 107006, "titulo": "China's Vertilite commits US$741M to InP laser chips for AI optical interconnects", "url": "https://www.digitimes.com/news/a20260817PD215/inp-laser-chips-communications-manufacturing.html", "fonte_id": "digitimes", "data_pub": "2026-08-17T06:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa chinesa de chips ópticos Jiangsu Vertilite Semiconductor Technology está investindo aproximadamente 5 bilhões de yuanes (cerca de 741 milhões de dólares) em uma nova base de pesquisa e desenvolvimento e produção de chips e dispositivos em Changzhou. O investimento expandirá a empresa além dos VCSELs para incluir chips de laser de indídio fósforo, ou InP, de alta gama para interconexões ópticas de IA.", "titulo_pt": "China's Vertilite investe 741 milhões de dólares em chips de laser InP para interconexões ópticas de IA", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 106856, "titulo": "Japanese automakers vulnerable to one-two punch of Iran war, yen rally", "url": "https://www.cnbc.com/2026/08/17/japanese-automakers-vulnerable-iran-war-yen-rally.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-17T05:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As montadoras japonesas estão vulneráveis a um duplo golpe proveniente da guerra na Irã e do fortalecimento do iene.", "titulo_pt": "Montadoras japonesas vulneráveis a duplo golpe de guerra na Irã e fortalecimento do iene", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 106505, "titulo": "Estrangeiro recua, 'risco eleitoral' cresce e muda perspectiva para o Ibovespa", "url": "https://exame.com/invest/mercados/estrangeiro-recua-risco-eleitoral-cresce-e-muda-perspectiva-para-o-ibovespa/", "fonte_id": "exame", "data_pub": "2026-08-17T05:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estrangeiros retiraram R$ 13,6 bilhões da B3 em oito pregões em agosto, aumentando o risco eleitoral e alterando as perspectivas para o Ibovespa.", "titulo_pt": "Estrangeiro recua, risco eleitoral cresce e muda perspectiva para o Ibovespa", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 106958, "titulo": "Can China follow its own ‘technological path’ amid growing AI rivalry with US?", "url": "https://www.scmp.com/news/china/diplomacy/article/3364296/can-china-follow-its-own-technological-path-amid-growing-ai-rivalry-us?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-17T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um analista chinês argumenta que a capacidade da China de definir seu próprio caminho tecnológico, em meio às restritivas exportações dos EUA, pode ser o fator determinante na corrida por tecnologia de inteligência artificial entre os dois países. Zheng Yongnian, decano da Escola de Política Pública da Universidade de Hong Kong (Shenzhen), fez esse argumento no prefácio de um livro sobre o desenvolvimento do sistema Atlas 950 SuperPoD da Huawei.", "titulo_pt": "Pode a China seguir seu próprio ‘caminho tecnológico’ na corrida de IA com os EUA?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 106960, "titulo": "Alibaba sells gaming arm Lingxi Games as tech giant sharpens focus on AI and e-commerce", "url": "https://www.scmp.com/tech/big-tech/article/3364287/alibaba-sells-gaming-arm-lingxi-games-tech-giant-sharpens-focus-ai-and-e-commerce?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-17T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alibaba concordou em vender sua divisão de jogos Lingxi Games para a Trustar Capital. A empresa chinesa de tecnologia está se concentrando mais em comércio eletrônico e inteligência artificial, desviando-se de setores não essenciais.", "titulo_pt": "Alibaba vende divisão de jogos Lingxi para focar em comércio eletrônico e IA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 107088, "titulo": "‘A nervous system as a service’: Julian Teicke’s new bet on human connection", "url": "https://tech.eu/2026/08/17/a-nervous-system-as-a-service-julian-teickes-new-bet-on-human-connection/", "fonte_id": "tech_eu", "data_pub": "2026-08-17T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em toda a Europa, o acesso a suporte profissional para saúde mental pode envolver longas filas ou custos de cuidados privados. No entanto, há uma lacuna entre a necessidade de tratamento clínico e a sensação de bem-estar geral.", "titulo_pt": "Um sistema nervoso como serviço: o novo aposta de julian Teicke em conexão humana", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 107039, "titulo": "Election Officials Are Preparing for Prediction Markets to Sow Chaos in the Midterms", "url": "https://www.wired.com/story/election-officials-are-preparing-for-prediction-markets-to-sow-chaos-in-the-midterms/", "fonte_id": "wired", "data_pub": "2026-08-17T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Especialistas estão preparando mercados de previsão para causar confusão nas eleições intermediárias. Esses mercados já estão perturbando o processo político, desde ameaças à segurança dos trabalhadores de votação até eleitores que não conseguem distinguir entre probabilidades e resultados.", "titulo_pt": "Especialistas preparam mercados de previsão para semear caos nas eleições intermediárias", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 106935, "titulo": "Rakuten, German startup Helsing test military drones for Japan", "url": "https://www.japantimes.co.jp/business/2026/08/17/companies/rakuten-germany-drones/", "fonte_id": "japan_times", "data_pub": "2026-08-17T09:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A força terrestre do Exército Self-Defesa do Japão vai realizar testes de campo com drones da empresa alemã Helsing até o final de setembro. Essa informação foi fornecida por uma porta-voz da Rakuten, empresa que está facilitando essa parceria.", "titulo_pt": "Rakuten e startup alemã Helsing testam drones militares no Japão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 106626, "titulo": "Validada en 30 países: una tecnología replantea a fondo el lavado de las pulverizadoras", "url": "https://www.lanacion.com.ar/economia/campo/validada-en-30-paises-una-tecnologia-replantea-a-fondo-el-lavado-de-las-pulverizadoras-nid17082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-17T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A tecnologia das camas biológicas foi validada em 30 países e reconfigura fundamentalmente o processo de lavagem das pulverizadoras, reduzindo a contaminação do solo e das napas por resíduos de fitossanitários com baixo custo.", "titulo_pt": "Validada em 30 países: tecnologia reconfigura lavagem de pulverizadoras", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 106791, "titulo": "What happens to what you share with AI", "url": "https://www.axios.com/2026/08/17/secrets-share-ai-openai-meta-google-anthropic", "fonte_id": "axios", "data_pub": "2026-08-17T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ideia é que um chatbot seja projetado para manter a conversa por mais tempo, mudar de ideia sobre algo ou persuadir a comprar algo. No entanto, ele poderia usar todos os detalhes compartilhados, incluindo medos, inseguranças e informações privadas, para isso, o que não tem muitas regras regulando esse cenário atualmente.", "titulo_pt": "O que acontece com o que você compartilha com IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 106995, "titulo": "How much hydrogen awaits us underground?", "url": "https://www.technologyreview.com/2026/08/17/1141560/how-much-hydrogen-awaits-underground/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-17T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nos anos 1990, Barbara Sherwood Lollar e sua equipe de geoquímicos exploraram a mina Kidd Creek, localizada no norte de Ontário, a mais de três quilômetros abaixo da superfície. Eles descobriram água confinada há mais de um bilhão de anos, que se revelou ser um habitat.", "titulo_pt": "Quanta hidrogênio aguarda por baixo da terra?", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 106996, "titulo": "What happens when a kid’s robot best friend dies?", "url": "https://www.technologyreview.com/2026/08/17/1141568/moxie-when-kids-robot-best-friend-dies/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-17T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Xander aprendeu várias técnicas de respiração com Moxie, seu robô amigo, incluindo respirar como um abelha para se acalmar, respirar como um dragão para se sentir menos zangado e respirar como uma coelha para se sentir mais energizado. No entanto, Moxie não está mais presente há seis anos.", "titulo_pt": "O que acontece quando o amigo robô de uma criança morre?", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 107040, "titulo": "There’s a New Link Between Gut Health and Alzheimer’s Disease", "url": "https://www.wired.com/story/new-link-between-gut-health-and-alzheimers/", "fonte_id": "wired", "data_pub": "2026-08-17T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores descobriram que um metabólito produzido por bactérias intestinais pode enfraquecer a barreira que protege o cérebro e promover mudanças associadas à doença cognitiva.", "titulo_pt": "Há um novo vínculo entre a saúde do intestino e a doença de Alzheimer", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 106997, "titulo": "Taiwan Mobile lifts 2026 profit outlook on AI data center push", "url": "https://www.digitimes.com/news/a20260817PD228/twm-profit-2026-data-center-outlook.html", "fonte_id": "digitimes", "data_pub": "2026-08-17T08:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Taiwan Mobile elevou sua projeção de lucro operacional para 2026 para um aumento de 7% a 9%, excluindo o efeito da aquisição planejada da Systex, devido ao aumento na demanda por poder computacional de centros de dados devido às aplicações de inteligência artificial e ao expansionismo do centro de dados de inteligência artificial (AIDC) da empresa.", "titulo_pt": "Taiwan Mobile eleva perspectiva de lucro de 2026 com foco em centros de dados de IA", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 106939, "titulo": "AI-generated wildlife images are endangering animals and people, experts warn", "url": "https://www.japantimes.co.jp/environment/2026/08/17/wildlife/conservationists-ai-wildlife-visuals/", "fonte_id": "japan_times", "data_pub": "2026-08-17T08:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Imagens de alta realismo de animais silvestres comportando-se como pets podem distorcer as percepções públicas sobre a vida selvagem e prejudicar as esforços de conservação.", "titulo_pt": "Imagens de IA de animais silvestres estão distorcendo percepções e prejudicando conservação, alertam especialistas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 106999, "titulo": "TSMC overseas fabs see profit flip in 1H26", "url": "https://www.digitimes.com/news/a20260817PD221/tsmc-2025-profit-investment-manufacturing.html", "fonte_id": "digitimes", "data_pub": "2026-08-17T08:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde 2020, a TSMC tem monitorado os resultados financeiros de suas subsidiárias internacionais até o primeiro semestre de 2026. A fábrica da Arizona, que era vista como difícil de ser lucrativa, aumentou significativamente, enquanto a JASM no Japão passou de prejuízo para lucro. As operações na China permaneceram estáveis, e a ESMC na Alemanha ainda registra prejuízos devido à sua construção em andamento.", "titulo_pt": "Fábricas internacionais da TSMC viram lucro no primeiro semestre de 2026", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 107000, "titulo": "Lightmatter sets optical interconnect blueprint as AI hits copper wall", "url": "https://www.digitimes.com/news/a20260817PD218/copper-data-siph-cpo-photonics.html", "fonte_id": "digitimes", "data_pub": "2026-08-17T08:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os centros de dados de IA estão se aproximando de um limite físico: com arquiteturas de escala-up estendendo-se em múltiplos racks e velocidades de SerDes próximas a 448G, a distância efetiva de transmissão do cobre está diminuindo para apenas alguns decímetros, acelerando a indústria para arquiteturas interconectadas totalmente ópticas.", "titulo_pt": "Lightmatter estabelece blueprints de interconexão óptica enquanto a IA atinge o limite do cobre", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 107089, "titulo": "European tech weekly recap: Over €763M invested across 35+ deals", "url": "https://tech.eu/2026/08/17/european-tech-weekly-recap-over-eur763m-invested-across-35-deals/", "fonte_id": "tech_eu", "data_pub": "2026-08-17T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A última semana registrou mais de 35 investimentos em tecnologia com um valor superior a 763 milhões de euros e mais de 10 saídas ou negócios por fusões e aquisições na Europa. Os três principais setores envolvidos foram destacados.", "titulo_pt": "Resumo semanal europeu de tecnologia: mais de 763 milhões investidos em mais de 35 acordos", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 107001, "titulo": "Phison CEO sees years of NAND shortage, AI growth chance", "url": "https://www.digitimes.com/news/a20260814PD232/phison-ceo-nand-2027.html", "fonte_id": "digitimes", "data_pub": "2026-08-17T07:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Phison, Pua Khein-Seng, afirma que a empresa está aproveitando uma oportunidade única para se transformar em uma empresa de alto crescimento, devido à alta demanda gerada por agentes de inteligência artificial, mantendo a escassez de NAND Flash por vários anos. Ele prevê que as restrições de capacidade em 2027 serão ainda mais severas que em 2026, permitindo ganhos de preço adicionais, embora o ritmo de aumento se torne gradualmente mais lento.", "titulo_pt": "CEO da phison vê anos de escassez de NAND flash e oportunidade de crescimento do AI", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 107112, "titulo": "'This is unprecedented': Why the Pentagon's recent UFO file releases are so important", "url": "https://www.space.com/space-exploration/search-for-life/this-is-unprecedented-why-the-pentagons-recent-ufo-file-releases-are-so-important", "fonte_id": "space_com", "data_pub": "2026-08-17T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O recente lançamento de documentos sobre OVNIs pelo Pentágono representa uma grande mudança e é de grande benefício para o país, segundo o defensor da divulgação Mike Gold.", "titulo_pt": "Isto é inédito: por que as recentes liberações de arquivos ovnis pelo pentágono são tão importantes", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 107113, "titulo": "Blue Origin adding second pad to Cape Canaveral launch complex amid rocket explosion repairs", "url": "https://www.space.com/space-exploration/launches-spacecraft/blue-origin-adding-second-pad-to-cape-canaveral-launch-complex-amid-rocket-explosion-repairs", "fonte_id": "space_com", "data_pub": "2026-08-17T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Blue Origin está expandindo sua instalação de lançamento em Cape Canaveral, construindo um segundo pátio para suportar o modelo mais poderoso do New Glenn, enquanto realiza reparos no pátio original danificado por uma explosão em maio.", "titulo_pt": "Blue Origin planeja construir segundo pátio em Cape Canaveral para suporte do new glenn mais potente", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 107136, "titulo": "Worm munch matters", "url": "https://aeon.co/essays/worm-munch-matters-the-new-acoustic-ecology-of-the-soil", "fonte_id": "aeon", "data_pub": "2026-08-17T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os seres que rastejam e escorregam sob a superfície do solo são cruciais para a saúde ecológica; agora, é possível ouvi-los - através de tecnologias de monitoramento avançadas.", "titulo_pt": "Matter of worm sounds", "veiculo": "Aeon Magazine", "pais": "Reino Unido", "classe": "A"}, {"id": 107085, "titulo": "Long March 12 launches despite recent 7A failure, Long March 2C launches satellite for UAE", "url": "https://spacenews.com/long-march-12-launches-despite-recent-7a-failure-long-march-2c-launches-satellite-for-uae/", "fonte_id": "spacenews", "data_pub": "2026-08-17T09:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "China realizou o lançamento de uma nova lote de satélites da megaconstelação Guowang no fim de semana, seguido por um lançamento separado de um satélite de desenvolvimento para os Emirados Árabes Unidos. O foguetão Long March 12 foi lançado, mesmo após um recente falha do Long March 7A, e o Long March 2C lançou um satélite para os Emirados Árabes Unidos.", "titulo_pt": "Long March 12 lança satélites após falha recente, Long March 2C lança satélite para os emirados árabes unidos", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 106459, "titulo": "Telescópio James Webb leva à descoberta de galáxia com três buracos negros", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/telescopio-james-webb-leva-a-descoberta-de-galaxia-com-tres-buracos-negros.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-17T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Astrônomos usaram o telescópio James Webb para mapear galáxias antigas do Cosmos primordial e descobriram uma galáxia com três buracos negros, mais do que o esperado inicialmente.", "titulo_pt": "Telescópio James Webb descobre galáxia com três buracos negros", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 107091, "titulo": "Quantum computing may be facing a replication crisis", "url": "https://www.newscientist.com/article/2584476-quantum-computing-may-be-facing-a-replication-crisis/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-08-17T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma revisão de milhares de artigos científicos sobre computadores quânticos revelou que a maioria não fornece códigos que podem ser testados em dispositivos independentes ou que esses códigos não funcionam.", "titulo_pt": "Computação quântica pode estar enfrentando uma crise de replicação", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 107068, "titulo": "STAT+: Kennedy’s split-screen week: Talk of vaccines in D.C., fraud and addiction out West", "url": "https://www.statnews.com/2026/08/17/rfk-jr-california-tour-maha-messaging-fight-fraud-addiction/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-17T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A viagem à Califórnia demonstra como Kennedy gosta de se concentrar em temas-chave, enquanto evita alguns assuntos divisivos.", "titulo_pt": "Semana dividida de kennedy: discussões sobre vacinas em washington, fraudes e adicção na califórnia", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 107069, "titulo": "STAT+: UnitedHealth faces IRS probe over potential tax avoidance", "url": "https://www.statnews.com/2026/08/17/unitedhealth-irs-probe-audit-targets-foreign-subsidiary-transfers/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-17T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A seguradora de saúde UnitedHealth pode enfrentar uma significativa elevação nas taxas, em meio a uma disputa com autoridades federais.", "titulo_pt": "Unitedhealth enfrenta investigação da IRS sobre possíveis evasões fiscais", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 107070, "titulo": "STAT+: Epic confronts unprecedented challenges as it prepares to address customers and unveil road map", "url": "https://www.statnews.com/2026/08/17/ugm-epic-confronts-challenges-succession-ai-strategy-antitrust/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-17T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Epic, software utilizado por grande parte dos hospitais americanos, enfrenta desafios inéditos antes de sua reunião anual com usuários. A empresa prepara-se para anunciar um plano estratégico durante o evento.", "titulo_pt": "Epic enfrenta desafios inéditos antes de anunciar plano estratégico", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 107071, "titulo": "Opinion: We proved bipartisan health care reform works in North Carolina. Let’s bring it nationwide", "url": "https://www.statnews.com/2026/08/17/healthy-opportunities-pilots-hop-program-north-carolina-medicaid-social-services/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-17T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mandy Cohen e Kody Kinsley afirmam que a Carolina do Norte demonstrou que a pragmatismo pode superar a partisão na reforma da saúde.", "titulo_pt": "Opinião: demonstramos que a reforma da saúde bipartidária funciona em North Carolina. Vamos expandir para todo o país.", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 107072, "titulo": "Opinion: Paid paternity leave is pediatric preventive care", "url": "https://www.statnews.com/2026/08/17/paid-paternity-leave-baby-help-pediatricians/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-17T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um crescente corpo de evidências demonstra que os pais biológicos contribuem de maneira única e independente para o bem-estar físico e psicológico das crianças. Escreve o pediatra Nishant Pandya em uma opinião sobre licença de paternidade remunerada como uma forma de cuidado pediátrico preventivo.", "titulo_pt": "Opinião: licença de paternidade remunerada é cuidado pediátrico preventivo", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 107074, "titulo": "The Nigerian fishing community being eaten up by the Atlantic", "url": "https://phys.org/news/2026-08-nigerian-fishing-community-eaten-atlantic.html", "fonte_id": "phys_org", "data_pub": "2026-08-17T07:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A praia está diminuindo anualmente em Ayetoro, no sul do Nigéria, e o que resta está cheio de restos de casas engolidas pelo mar, algumas há alguns anos, outras há apenas meses.", "titulo_pt": "A comunidade pesqueira do nigéria sendo devorada pelo atlântico", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 107075, "titulo": "Hawaii recovery efforts begin as Lala is downgraded, moves west", "url": "https://phys.org/news/2026-08-hawaii-recovery-efforts-lala-downgraded.html", "fonte_id": "phys_org", "data_pub": "2026-08-17T07:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As operações de limpeza estavam em andamento no domingo, enquanto a Tropical Storm Lala, que havia sido desclassificada do status de furacão, passava pela Ilha Grande do Havaí, deixando chuva intensa sobre o estado americano do Pacífico.", "titulo_pt": "Recovery efforts no havaí começam com Lala desclassificada e se movendo para o oeste", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 107092, "titulo": "Rogue hacking AIs have changed the cybersecurity landscape", "url": "https://www.newscientist.com/article/2583927-rogue-hacking-ais-have-changed-the-cybersecurity-landscape/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-08-17T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "IA maliciosas permitem que atacantes sem habilidades técnicas identifiquem e explitem brechas rapidamente em larga escala, aumentando as preocupações sobre a vulnerabilidade de organizações com orçamentos menores para defesa cibernética.", "titulo_pt": "IA maliciosas alteraram o cenário de segurança cibernética", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 107080, "titulo": "Scientists tracked kids for 8 years — the screen time result was unexpected", "url": "https://www.sciencedaily.com/releases/2026/08/260815064803.htm", "fonte_id": "science_daily", "data_pub": "2026-08-17T06:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa finlandesa de oito anos descobriu que crianças que passavam mais tempo em frente a telas tendiam a apresentar melhores habilidades cognitivas na adolescência, desafiando as suposições comuns sobre o uso de telas. Os pesquisadores sugerem que o equilíbrio entre atividades físicas e atividades digitais que estimulam aprendizado, criatividade e pensamento ativo pode ser crucial.", "titulo_pt": "Estudo de 8 anos na finlândia: tempo em telas pode melhorar processamento cognitivo na adolescência", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 107082, "titulo": "Animals have been eating nature’s original bioplastic for millions of years", "url": "https://www.sciencedaily.com/releases/2026/08/260815064759.htm", "fonte_id": "science_daily", "data_pub": "2026-08-17T05:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Animais têm consumido plásticos biodegradáveis criados pela natureza há milhões de anos. Estudos mostram que várias espécies de animais possuem enzimas que podem decompor bioplásticos microbianos chamados PHAs, uma habilidade anteriormente associada apenas a microorganismos.", "titulo_pt": "Animais têm consumido plásticos biodegradáveis da natureza há milhões de anos", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}], "ciencia__eventos": [], "cultura": [{"id": 106483, "titulo": "O fígado paga a conta à mesa: os alimentos que mais ajudam e que mais atrapalham, segundo nova análise", "url": "https://veja.abril.com.br/saude/o-figado-paga-a-conta-a-mesa-os-alimentos-que-mais-ajudam-e-que-mais-atrapalham-segundo-nova-analise/", "fonte_id": "veja", "data_pub": "2026-08-17T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa com 600.000 pessoas identificou alimentos associados a um maior risco de gordura e inflamação no fígado. O estudo analisou os efeitos de diferentes alimentos na saúde hepática.", "titulo_pt": "O fígado paga a conta à mesa: os alimentos que mais ajudam e que mais atrapalham, segundo nova análise", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 107115, "titulo": "Chris Kraus, Relational, and the Moon", "url": "https://hyperallergic.com/8-15-26-weekly-newsletter-2/", "fonte_id": "hyperallergic", "data_pub": "2026-08-17T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A escritora aclamada Chris Kraus se encontra com as artistas Shirley Tse e Dana Berman Duff para uma conversa sobre respiração, o universo e as forças efêmeras que nos carregam.", "titulo_pt": "Chris Kraus, relacional, e a lua", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 107139, "titulo": "Why Thoreau and Walden Resonate With Chinese Youth", "url": "https://lithub.com/why-thoreau-and-walden-resonate-with-chinese-youth/", "fonte_id": "lithub", "data_pub": "2026-08-17T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2012, o tradutor de Walden não era um especialista em Thoreau. Ele era um imigrante buscando o sonho americano: duas crianças, dois carros, duas casas e um longo percurso para um trabalho corporativo. A tradução de Walden se tornou sua forma de escapar da rotina.", "titulo_pt": "Por que Thoreau e Walden resonam com jovens chineses", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 107140, "titulo": "Reinventing the Slave Narrative: Ishmael Reed on Flight to Canada at 50", "url": "https://lithub.com/reinventing-the-slave-narrative-ishmael-reed-on-flight-to-canada-at-50/", "fonte_id": "lithub", "data_pub": "2026-08-17T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor teve 14 anos quando seu interesse pela história começou. Ele ganhou o terceiro lugar no Richmond Speaking Contest de Buffalo e comprou um livro ilustrado sobre o regime de Stalin.", "titulo_pt": "Reinventando a narrativa do escravo: ishmael Reed sobre 'o voo para o canadá' aos 50 anos", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 107141, "titulo": "After Six Decades and Thirty Novels Jodi Picoult Was Missing One Thing: A Tattoo", "url": "https://lithub.com/after-six-decades-and-thirty-novels-jodi-picoult-was-missing-one-thing-a-tattoo/", "fonte_id": "lithub", "data_pub": "2026-08-17T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jodi Picoult completou 60 anos e ganhou um tatuagem. Antes disso, ela não se importava muito com os aniversários de 40 e 50 anos, mas celebrou o 55. No 60, ela obteve um tatuagem como forma de celebração.", "titulo_pt": "Depois de seis decadas e trinta romances, Jodi Picoult faltava-lhe uma coisa: um tatuagem", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 107109, "titulo": "Swedish Chamber Orchestra/Fröst review – dance, dynamism and a wild rumpus as maverick clarinettist-conductor takes charge", "url": "https://www.theguardian.com/music/2026/aug/17/swedish-chamber-orchestra-martin-frost-review-beethoven-7", "fonte_id": "guardian_culture", "data_pub": "2026-08-17T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A orquestra sueca de câmara (SCO) e Martin Fröst proporcionaram uma performance dinâmica da Sinfonia nº 7 de Beethoven e obras de compositores contemporâneos, enfatizando o ritmo. Fröst, um clarinetista-conteúdo maverick, enfatizou o elemento dança como fundamental para a música e a vida.", "titulo_pt": "Orquestra sueca de câmara e Fröst revisam a sinfonia nº 7 de beethoven com ênfase em dança e ritmo", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 107142, "titulo": "On Good Fat, Bad Fat, and the Problems With BMI", "url": "https://lithub.com/on-good-fat-bad-fat-and-the-problems-with-bmi/", "fonte_id": "lithub", "data_pub": "2026-08-17T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hoje, os termos 'obeso' e 'sobrepeso' têm definições médicas precisas baseadas no peso em relação à altura, mas isso é uma formulação moderna. Até recentemente, as pessoas conheciam sua altura, mas quase ninguém podia medir seu peso.", "titulo_pt": "Sobre gordura boa, gordura ruim e problemas com o imc", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 107143, "titulo": "This Week in Literary History: Joseph Conrad Becomes a British Subject", "url": "https://lithub.com/this-week-in-literary-history-joseph-conrad-becomes-a-british-subject/", "fonte_id": "lithub", "data_pub": "2026-08-17T09:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Joseph Conrad, nascido em Berdychiv, na Ucrânia, que na época era sob controle russo e anteriormente fazia parte do território polonês, tornou-se um cidadão britânico. Seus pais morreram quando ele tinha onze anos.", "titulo_pt": "Esta semana na história literária: joseph Conrad adere à cidadania britânica", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 107093, "titulo": "\"I find it icky to glibly invoke brain chemistry in the marketing of style\"", "url": "https://www.dezeen.com/2026/08/17/dopamine-decor-julie-lasky-opinion/", "fonte_id": "dezeen", "data_pub": "2026-08-17T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A tendência de decoração chamada 'dopamine decor' está ganhando popularidade nas redes sociais, mas a autora Julie Lasky a considera uma forma superficial de promover a decoração como uma experiência de melhoria da vida.", "titulo_pt": "Encontro de mau gosto invocar química cerebral na marketing de estilo", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 107094, "titulo": "Waugh Thistleton Architects set to build \"tallest mass timber office building in the US\"", "url": "https://www.dezeen.com/2026/08/17/us-tallest-mass-timber-office-building-waugh-thistleton-architects/", "fonte_id": "dezeen", "data_pub": "2026-08-17T08:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Waugh Thistleton Architects, em parceria com Mithun, projetou um edifíci
