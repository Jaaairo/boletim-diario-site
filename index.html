treaming na sexta-feira", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/mother-mary-com-anne-hathaway-o-que-ver-na-tv-e-no-streaming-na-sexta-feira.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-22T20:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Anne Hathaway interpreta Mother Mary, uma estrela pop que retorna aos palcos e encontra Sam Anselm, uma ex-melhor amiga e estilista com quem teve um rompimento recente.", "titulo_pt": "Mother Mary com Anne Hathaway: o que ver na TV e no streaming na sexta-feira", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 220020, "titulo": "Barbara Hepworth Sculpture Sells for $8.3 M., Leading Christie’s London Auction", "url": "https://www.artnews.com/art-news/news/barbara-hepworth-sculpture-auction-record-christies-london-1234803600/", "fonte_id": "artnews", "data_pub": "2026-10-22T20:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A escultura de Barbara Hepworth foi vendida por $8,3 milhões, liderando a leilão da Christie’s em Londres. O leilão contribuiu com £278,6 milhões para o total das leilões de outubro da Christie’s em Londres.", "titulo_pt": "Escultura de barbara Hepworth vende por $8,3 milhões, liderando leilão da Christie’s em londres", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}], "cultura__eventos": [], "sociedade": [{"id": 219670, "titulo": "Ocas indígenas são incendiadas no Guará; PCDF apura se há indício de crime", "url": "https://www.metropoles.com/distrito-federal/ocas-indigenas-sao-incendiadas-no-guara-pcdf-apura-se-ha-indicio-de-crime", "fonte_id": "metropoles", "data_pub": "2026-10-22T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ocas indígenas localizadas no Guará foram incendiadas. A Polícia Civil do Distrito Federal (PCDF) investiga se há indícios de crime. As câmeras de segurança registraram dois homens entrando e sai cado. A vacina reduziu em 58% o risco de recorrência ou morte por melanoma, mas não superou as expectativas elevadas da Wall Street.", "titulo_pt": "Ações da moderna caem após dados vazados sobre tratamento anticâncer decepcionarem expectativas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 219675, "titulo": "Jovem é assassinado a facadas em bar após defender funcionária de assédio", "url": "https://www.metropoles.com/distrito-federal/na-mira/jovem-e-assassinado-a-facadas-em-bar-apos-defender-funcionaria-de-assedio", "fonte_id": "metropoles", "data_pub": "2026-10-22T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um jovem foi assassinado a facadas em um bar após tentar defender uma funcionária de assédio sexual. O suspeito buscou uma faca em sua casa, cometeu o crime e foi cercado pela população antes de ser detido.", "titulo_pt": "Jovem é assassinado a facadas em bar após tentar defender funcionária de assédio sexual", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 219677, "titulo": "Professora é investigada por assédio sexual contra alunos de 10 e 12 anos", "url": "https://www.metropoles.com/sao-paulo/professora-e-investigada-por-assedio-sexual-contra-alunos-de-10-e-12-anos", "fonte_id": "metropoles", "data_pub": "2026-10-22T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A prefeitura de Fernandópolis, no interior do estado, já afastou uma professora acusada de assediar sexualmente dois alunos, de 10 e 12 anos, nas redes sociais.", "titulo_pt": "Professora é investigada por assédio sexual contra alunos de 10 e 12 anos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 219810, "titulo": "Encuesta nacional de personas mayores: el 84% de los chilenos cree que el país no está preparado para el envejecimiento", "url": "https://www.latercera.com/nacional/noticia/encuesta-nacional-de-personas-mayores-el-84-de-los-chilenos-cree-que-el-pais-no-esta-preparado-para-el-envejecimiento/", "fonte_id": "la_tercera", "data_pub": "2026-10-22T21:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa realizada pela Universidade de Chile e Senama mostrou que 84% dos chilenos acreditam que o país não está preparado para lidar com o envelhecimento da população. Além disso, 82% dos entrevistados consideram insuficiente o apoio oferecido às pessoas dependentes.", "titulo_pt": "Pesquisa nacional de pessoas idosas: 84% acreditam que chile não está preparado para envelhecimento populacional", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 219813, "titulo": "Clínica UC Christus, el gran damnificado del aluvión en Las Condes: cerrada sin fecha de reapertura", "url": "https://www.latercera.com/nacional/noticia/clinica-uc-christus-el-gran-damnificado-del-aluvion-cerrada-hasta-nuevo-aviso/", "fonte_id": "la_tercera", "data_pub": "2026-10-22T19:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A clínica UC Christus, localizada em Las Condes, está fechada após ser afetada por alagamentos e lama. Até o momento, não há data para o seu reabertura e as consultas presenciais permanecem suspensas enquanto se trabalha em um plano de recuperação.", "titulo_pt": "Clínica UC Christus, grande vítima da alagação em Las Condes: fechada sem data para reabertura", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 218641, "titulo": "Participação feminina nos conselhos de empresas do IBrX100 cresce 28% em cinco anos", "url": "https://veja.abril.com.br/economia/participacao-feminina-nos-conselhos-de-empresas-do-ibrx100-cresce-28-em-cinco-anos/", "fonte_id": "veja", "data_pub": "2026-10-22T17:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A participação feminina nos conselhos de empresas do IBrX100 aumentou 28% em cinco anos. No entanto, 11 companhias ainda não contam com mulheres em seus colegiados.", "titulo_pt": "Participação feminina nos conselhos de empresas do IBrX100 cresce 28% em cinco anos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 218623, "titulo": "Criança de 5 anos é atacada por escorpião no Zoológico de Brasília", "url": "https://www.metropoles.com/distrito-federal/crianca-de-5-anos-e-atacada-por-escorpiao-no-zoologico-de-brasilia", "fonte_id": "metropoles", "data_pub": "2026-10-22T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma criança de 5 anos foi atacada por um escorpião durante uma visita ao zoológico de Brasília, enquanto participava de um passeio escolar. A criança notou o animal dentro do seu sapato e foi picada.", "titulo_pt": "Criança de 5 anos é atacada por escorpião no Zoológico de Brasília", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 218624, "titulo": "Casal suspeito de matar Beatriz Vitória ia fazer tatuagem exaltando morte", "url": "https://www.metropoles.com/minas-gerais/casal-suspeito-de-matar-beatriz-vitoria-ia-fazer-tatuagem-exaltando-morte", "fonte_id": "metropoles", "data_pub": "2026-10-22T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Investigações revelaram que o casal suspeito de matar Beatriz Vitória planejava fazer uma tatuagem conjunta exaltando a morte. A polícia suspeita que o crime tenha sido motivado por ciúmes.", "titulo_pt": "Casal suspeito de matar Beatriz Vitória planejava tatuagem exaltando morte", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 218633, "titulo": "Irmãos são condenados por tentar matar vendedor de chocolates no DF", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/irmaos-sao-condenados-por-tentar-matar-vendedor-de-chocolates-no-df", "fonte_id": "metropoles", "data_pub": "2026-10-22T17:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os irmãos Jeferson Carmo e Salatiel Rodrigues foram condenados a 11 e 9 anos de prisão, respectivamente, por tentativa de homicídio contra um vendedor de chocolates em Brasília.", "titulo_pt": "Irmãos condenados por tentativa de matar vendedor de chocolates no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 219654, "titulo": "Auxílio-creche e convênio farmácia são os benefícios que mais cresceram em 2026, segundo a Flash", "url": "https://exame.com/carreira/auxilio-creche-e-convenio-farmacia-sao-os-beneficios-que-mais-cresceram-em-2026-segundo-a-flash/", "fonte_id": "exame", "data_pub": "2026-10-22T16:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa da Flash, com base em 220 profissionais de Recursos Humanos, revela que os benefícios de auxílio-creche e convênio farmácia tiveram o maior crescimento em 2026. O estudo também indica avanços na oferta de benefícios relacionados à saúde mental e crédito consignado.", "titulo_pt": "Auxílio-creche e convênio farmácia são os benefícios que mais cresceram em 2026, de acordo com a Flash", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 218885, "titulo": "Rebaja de penas a condenados por delitos sexuales contra menores complica a La Moneda e inquieta a los partidos oficialistas", "url": "https://www.latercera.com/politica/noticia/rebaja-de-penas-a-condenados-por-delitos-sexuales-contra-menores-complica-a-la-moneda-e-inquieta-a-los-partidos-oficialistas/", "fonte_id": "la_tercera", "data_pub": "2026-10-22T16:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A decisão de reduzir penas para condenados por delitos sexuais contra menores causou questionamentos sobre o critério aplicado e pressionou o Executivo a se defender. A justificativa do Palácio não conseguiu conter as críticas, nem mesmo dentro do próprio partido, e há iniciativas no Congresso para impedir que esse benefício seja concedido novamente.", "titulo_pt": "Decisão de reduzir penas para condenados por delitos sexuais contra menores complica palácio e inquieta partidos oficialistas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 218654, "titulo": "Professora fingiu estar morta para sobreviver a massacre em escola nos EUA", "url": "https://veja.abril.com.br/mundo/professora-fingiu-estar-morta-para-sobreviver-a-massacre-em-escola-nos-eua/", "fonte_id": "veja", "data_pub": "2026-10-22T16:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma professora fingiu estar morta durante um massacre a tiros em uma escola no Oregon, EUA, que resultou em uma professora e três crianças de 5, 8 e 11 anos mortas. O agressor era um ex-aluno de 16 anos que foi morto após o crime.", "titulo_pt": "Professora fingiu estar morta durante massacre em escola dos EUA", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 219007, "titulo": "'Protesting is no longer a right, but a risk we have to take': French protestors weigh whether to return to the streets", "url": "https://www.lemonde.fr/en/politics/article/2026/10/22/protesting-is-no-longer-a-right-but-a-risk-we-have-to-take-french-protestors-weigh-whether-to-return-to-the-streets_6761614_5.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-22T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os protestos em todo o país em 17 de outubro deixaram os participantes surpresos com o saque de lojas, o dano a edifícios públicos e a utilização extensa de gás lacrimogênio contra manifestações pacíficas. Alguns decidirão marchar novamente neste sábado, enquanto outros não o farão.", "titulo_pt": "Protestar já não é um direito, mas um risco que temos que correr: franceses ponderam se voltarão às ruas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 219188, "titulo": "Lai outlines climate resilience plans", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/23/2003866472", "fonte_id": "taipei_times", "data_pub": "2026-10-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lai apresentou planos para aumentar a resiliência climática. O anúncio incluiu medidas para enfrentar os efeitos das mudanças climáticas.", "titulo_pt": "Lai detalha planos de resiliência climática", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 219594, "titulo": "Elevada umidade retarda plantio de soja no Rio Grande do Sul, diz Emater", "url": "https://www.cnnbrasil.com.br/agro/elevada-umidade-retarda-plantio/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-22T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A elevada umidade tem retardado o plantio de soja no Rio Grande do Sul, de acordo com a Emater. A instituição relata que as condições meteorológicas têm dificultado a realização das sementes no estado.", "titulo_pt": "Elevada umidade retarda plantio de soja no Rio Grande do Sul, diz Emater", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 219769, "titulo": "“Nunca vimos algo así”: la advertencia de la argentina que dirige el organismo meteorológico de la ONU sobre El Niño", "url": "https://www.lanacion.com.ar/sociedad/nunca-vimos-algo-asi-la-advertencia-de-la-argentina-que-dirige-el-organismo-meteorologico-de-la-onu-nid22102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-22T21:10:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Celeste Saulo, que dirige o organismo meteorológico da ONU, advertiu que o aquecimento do Pacífico ultrapassará os registros dos últimos 40 anos. O fenômeno El Niño deve atingir seu pico no fim do ano e ter seus efeitos se estendendo até 2027.", "titulo_pt": "‘Nunca vimos algo assim’: a advertência argentina sobre El Niño", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 219796, "titulo": "When Rivers Run Low in the American West", "url": "https://www.theatlantic.com/newsletters/2026/10/the-one-resource-the-american-west-will-never-stop-fighting-over/689120/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-10-22T19:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O recurso de água é o único que a região do Oeste americano nunca parará de disputar.", "titulo_pt": "Quando os rios secam no oeste americano", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 219475, "titulo": "O que o Brasil ganha ao desmatar menos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/braulio-borges/2026/10/o-que-o-brasil-ganha-ao-desmatar-menos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-22T18:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O desmatamento na Amazônia Legal brasileira entre agosto de 2025 e julho de 2026 atingiu 3,3 mil km², o menor valor desde 1988, representando uma queda de 71% em comparação com 2022. No Cerrado, a área desmatada foi de 5,5 mil km², também a menor desde 1988, com uma redução de 48% em quatro anos.", "titulo_pt": "O que o Brasil ganha ao desmatar menos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 218874, "titulo": "Santuario Padre Hurtado busca reutilizar 70 mil litros de agua y aumentar su biodiversidad", "url": "https://www.latercera.com/sustentabilidad/noticia/santuario-padre-hurtado-busca-reutilizar-70-mil-litros-de-agua-y-aumentar-su-biodiversidad/", "fonte_id": "la_tercera", "data_pub": "2026-10-22T14:26:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Santuario Padre Hurtado, em colaboração com a Fundación Circular, transformou a piscina existente em um estanque verde, incorporando sistemas de reutilização de água e espécies que promovem a biodiversidade.", "titulo_pt": "Santuário Padre Hurtado busca reutilizar 70 mil litros de água e aumentar sua biodiversidade", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 219013, "titulo": "96% of coral reefs 'critically endangered,' at risk of collapse in 50 years", "url": "https://www.lemonde.fr/en/environment/article/2026/10/22/96-of-coral-reefs-critically-endangered-at-risk-of-collapse-in-50-years_6761515_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-22T13:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Internacional para a Conservação da Natureza declarou que 96% dos recifes de corais estão em situação criticamente endêmica e podem colapsar em 50 anos devido ao aquecimento global.", "titulo_pt": "96% Dos recifes de corais 'criticamente ameaçados,' em risco de colapso em 50 anos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 218597, "titulo": "Brasil reduz emissões em 6%, mas não cumpre meta climática de 2025", "url": "https://exame.com/esg/brasil-reduz-emissoes-em-6-mas-nao-cumpre-meta-climatica-de-2025/", "fonte_id": "exame", "data_pub": "2026-10-22T13:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil reduziu suas emissões em 6%, mas não atingiu a meta estabelecida para 2025. O levantamento do Observatório do Clima indica que o país lançou 2,06 bilhões de toneladas de CO₂ equivalente na atmosfera. A redução foi principalmente no uso da terra, enquanto a energia e os resíduos apresentaram aumento.", "titulo_pt": "Brasil reduz emissões, mas não cumpre meta climática de 2025", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 219172, "titulo": "Nearly all coral reefs risk collapse in 50 years: IUCN", "url": "https://www.japantimes.co.jp/environment/2026/10/22/climate-change/coral-reefs-collapse-50-years/", "fonte_id": "japan_times", "data_pub": "2026-10-22T12:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O IUCN, a autoridade mundial sobre vida selvagem em perigo, realizou sua primeira avaliação global e classificou 96% dos sistemas de corais como 'criticamente ameaçados'.", "titulo_pt": "Quase todos os recifes de corais correm risco de colapso em 50 anos, segundo IUCN", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 218863, "titulo": "Almost every shallow-water coral reef on the planet faces ecosystem collapse by 2075, UN advisors say", "url": "https://www.theguardian.com/australia-news/2026/oct/22/shallow-water-coral-reef-ecosystem-collapse-by-2075-un-advisors-say", "fonte_id": "guardian_world", "data_pub": "2026-10-22T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório das consultoras do United Nations sobre o aquecimento global indica que quase todas as ilhas de corais de águas rasas no planeta correm o risco de colapso ecológico antes de 2075. Cerca de 24% dessas ilhas de corais já estão em situação crítica em mais de 80 países.", "titulo_pt": "Pratically todas as ilhas de corais de águas rasas no planeta enfrentam risco de colapso ecológico até 2075, dizem conselheiros da ONU", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 219350, "titulo": "Experts: How are climate scientists using artificial intelligence?", "url": "https://www.carbonbrief.org/experts-how-are-climate-scientists-using-artificial-intelligence", "fonte_id": "carbon_brief", "data_pub": "2026-10-22T10:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial (IA) está se desenvolvendo rapidamente e está sendo cada vez mais utilizada pelos cientistas climáticos para melhor compreender o clima. Especialistas estão explorando como a IA é aplicada nesta área.", "titulo_pt": "Cientistas: como os climatologistas estão usando inteligência artificial?", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 219049, "titulo": "Australia: Bystanders dive into floodwaters to save trapped driver", "url": "https://www.euronews.com/video/2026/10/22/australia-bystanders-dive-into-floodwaters-to-save-trapped-driver", "fonte_id": "euronews", "data_pub": "2026-10-22T10:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois homens mergulharam nas águas turbulentas da cheia em Queensland, Austrália, para resgatar um motorista preso em um veículo todo-terreno que estava afundando. A resgate dramática terminou com um abraço emocional.", "titulo_pt": "Austrália: testemunhas mergulham nas águas da cheia para salvar motorista preso", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 218940, "titulo": "Big Tech’s thirst for water is sparking a global resistance", "url": "https://restofworld.org/2026/ai-datacenters-water-resistance-global/?utm_source=rss&utm_medium=rss&utm_campaign=feeds", "fonte_id": "rest_of_world", "data_pub": "2026-10-22T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A construção de um grande centro de dados da Google em Visakhapatnam, na Índia, está enfrentando resistência local devido às preocupações sobre o impacto ambiental e na vida das pessoas. A empresa afirma que seu sistema de arrefecimento de gigawatts não utilizará água da região.", "titulo_pt": "A sede da big Tech por água está despertando uma resistência global", "veiculo": "Rest of World", "pais": "EUA", "classe": "A"}, {"id": 217742, "titulo": "Santa Catarina vistoria 1,6 mil granjas após foco de Newcastle", "url": "https://www.cnnbrasil.com.br/agro/santa-catarina-vistoria-16-mil-granjas-apos-foco-de-newcastle/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-22T09:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo de Santa Catarina está realizando vistorias em 1,6 mil granjas após a confirmação de uma doença em uma granja de perus no oeste do estado. A emergência sanitária de 60 dias foi decretada em quatro municípios do estado.", "titulo_pt": "Santa Catarina vistoria 1,6 mil granjas após foco de Newcastle", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 217841, "titulo": "Del consumo energético a los materiales: qué define hoy a un edificio verdaderamente sustentable", "url": "https://www.clarin.com/arq/construccion/consumo-energetico-materiales-define-hoy-edificio-verdaderamente-sustentable_0_3RvXmNcp90.html", "fonte_id": "clarin", "data_pub": "2026-10-22T09:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O consumo energético é um indicador importante, mas não o único a ser considerado na avaliação da sustentabilidade de um edifício. Especialistas enfatizam que a sustentabilidade de um edifício envolve mais do que apenas o uso de energia.", "titulo_pt": "Do consumo energético aos materiais: o que define hoje um edifício verdadeiramente sustentável", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 217822, "titulo": "Liberan una pitón de casi 5 metros y 67 kilos, mientras Florida revela estrategia con drones para rastrear serpientes", "url": "https://www.lanacion.com.ar/estados-unidos/florida/liberan-una-piton-de-casi-5-metros-y-67-kilos-mientras-florida-revela-estrategia-con-drones-para-nid21102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-22T08:55:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A USGS libertou uma pitão de quase 5 metros e 67 kg, enquanto a Florida testa drones para monitorar serpentes invasoras em seus humedais.", "titulo_pt": "Usgs libera pitão gigante e Florida testa drones para rastrear serpentes invasoras", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 219950, "titulo": "Republican politicians have embraced anti-Indian racism — and it’s costing them votes", "url": "https://www.theverge.com/report/1017003/indian-americans-republican-racism-vivek-ramaswamy-texas", "fonte_id": "the_verge", "data_pub": "2026-10-22T19:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vasant Bhatt, um estudante da Universidade do Houston, que havia ajudado a campanha reeleitoral do Senador Ted Cruz e a campanha de Donald Trump, votou em um candidato não republicano, o que é inesperado dadas suas anteriores ações políticas.", "titulo_pt": "Políticos republicanos têm apoiado racismo anti-indígena — e isso está custando votos", "veiculo": "The Verg Chile", "pais": "Chile", "classe": "A"}, {"id": 219011, "titulo": "EU awards International Criminal Court top human rights prize", "url": "https://www.lemonde.fr/en/international/article/2026/10/22/eu-awards-international-criminal-court-top-human-rights-prize_6761484_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-22T10:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Prêmio Sakharov da União Europeia foi concedido ao Tribunal Penal Internacional por seus esforços em promover direitos humanos, apesar das sanções dos Estados Unidos contra o tribunal e seus juízes.", "titulo_pt": "Ue concede prêmio sakharov ao tribunal penal internacional", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 219225, "titulo": "Hong Kong student gets 10 years for sexually assaulting 4 underage girls", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3371798/hong-kong-student-gets-10-years-sexually-assaulting-4-underage-girls", "fonte_id": "scmp", "data_pub": "2026-10-22T10:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudante universitário de Hong Kong foi condenado a 10 anos de prisão por estuprar pelo menos quatro meninas menores de idade. O juiz Andrew Chan Hing-wai o descreveu como um 'indivíduo muito doente' que mostrou nenhuma remorsa ou empatia para com as vítimas.", "titulo_pt": "Estudante de hong Kong é condenado a 10 anos por estuprar quatro meninas menores", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 218694, "titulo": "Meta enfrenta ação coletiva na Austrália por danos causados a menores", "url": "https://www.dw.com/pt-br/meta-enfrenta-ação-coletiva-na-austrália-por-danos-causados-a-menores/a-79729544?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-10-22T09:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ações coletivas foram apresentadas na Austrália contra o Meta (anteriormente Facebook), acu const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

    const temPodcast = D.podcast && D.podcast.arquivo;

  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
