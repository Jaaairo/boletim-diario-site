const D = {"gerado_em": "18/08/2026 07:20", "stats": {"noticias_novas": 851, "resumos_gerados": 237}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O cenário político brasileiro está em destaque com a judicialização eleitoral que dobrou em relação ao ano passado, registrando um recorde histórico de ações judiciais na pré-campanha de 2026. De acordo com a diretora do Datafolha, Luciana Chong, a 'Geração Lava Jato' apoia Flávio Bolsonaro e os idosos podem se tornar um novo eleitorado importante para Lula. O Tribunal Superior Eleitoral (TSE) se reúne para discutir a proibição do uso de deepfakes na campanha eleitoral, após uma ação do PT contra a divulgação de um vídeo do ex-presidente Jair Bolsonaro produzido por inteligência artificial.", "mundo": "O ex-primeiro-ministro paquistanês Imran Khan foi hospitalizado devido a problemas de saúde, após ser condenado a 17 anos de prisão por corrupção. Paralelamente, a Ucrânia lançou mais de 600 drones na região de Moscou, em um ataque aéreo contra a capital russa. A Rússia advertiu o Reino Unido sobre o fornecimento de drones para a Ucrânia, enquanto Israel foi acusado de atrapalhar os esforços diplomáticos entre Estados Unidos e Irã. A China realizou um funeral para o ex-primeiro-ministro Zhu Rongji, que faleceu aos 97 anos, enquanto Emmanuel Macron reiterou seu discurso contra o 'defeitivismo' em Bormes-les-Mimosas, França. Em Israel, as restrições financeiras estão afetando a economia da Cisjordânia, gerando preocupações sobre a capacidade do governo palestino de manter suas finanças em dia. O presidente ucraniano Zelenskyy afirmou que a Ucrânia responderá após um ataque noturno russo que deixou 10 mortos em Kharkiv. Além disso, um terremoto de 4,7 graus de magnitude foi registrado na Espanha, com epicentro em Gójar.\n\nAs tensões geopolíticas continuam a dominar o cenário internacional. Na Ucrânia, a situação permanece volátil, com ataques de drones ucranianos a Moscou e contra-ataques russos que resultaram em 10 mortes em Kharkiv. Além disso, a Coreia do Norte e a China também são foco de preocupação, com a ideia de uma terceira guerra mundial ganhando força e a China dominando o mercado de metais rares. No Oriente Médio, a guerra civil no Iêmen continua, com 133 operações militares relatadas pelas forças armadas yemenitas. Na região, a Coreia do Sul expressou preocupação com as ameaças de Trump a suas manobras militares, enquanto a Rússia ameaçou o Reino Unido com 'consequências' após o uso de drones britânicos em território russo. Em um desenvolvimento local, um tiroteio em uma escola na Filipinas resultou em duas mortes, incluindo o atirador. Na Ásia, o Japão e o Canadá buscam aliviar tarifas e modernizar suas forças militares, respectivamente, enquanto a Alemanha e o Japão negociam um acordo de drones.", "economia": "A economia global enfrenta diversos desafios. Notadamente, a Getnet, empresa do Santander, passa a ser liderada por Cristiane Nogueira, especialista em meios de pagamento. Em um cenário de tensões geopolíticas, a Rússia demitiu um economista que havia alertado sobre a fragilidade econômica do país, enquanto a China fortaleceu sua presença como centro de negócios em yuan, lançando futuros de títulos de dívida do governo. O petróleo voltou a valer US$ 90 por barril, impulsionado por ameaças de Trump sobre o Estreito de Ormuz, levando a preocupações sobre a inflação e incertezas no mercado de títulos. No Brasil, a crise no varejo levou grandes redes a reestruturar mais de R$ 68 bilhões em dívidas, enquanto a Petrobras anunciou a descoberta de petróleo na Margem Equatorial. O Banco do Brasil enfrenta uma investigação da CVM por supostas falas que podem induzir investidores ao erro. Além disso, a GWM anunciou a conversão de caminhões para veículos que funcionam com hidrogênio, abrindo um novo mercado no país.", "tecnologia": "A Baidu, gigante tecnológica chinesa, registrou uma queda de 4% no faturamento trimestral, devido à desaceleração do setor publicitário, que não compensou o crescimento das operações de nuvem de inteligência artificial. O faturamento do segundo trimestre foi de 31,3 bilhões de yuan, abaixo da estimativa de 31,6 bilhões de yuan dos analistas. Por outro lado, a Horizon Robotics, empresa chinesa, planeja a produção em massa de sua próxima geração de chipsets de IA automotiva Journey 7 (J7) a partir de 2027, com o objetivo de expandir sua liderança no mercado chinês de auxílio à direção L2+ para o segmento de computação de alta autonomia. Além disso, a OpenAI anunciou a entrada no mercado brasileiro e minimizou o risco político com a Casa Branca, afirmando que não é vantajoso para os Estados Unidos restringir o acesso de outros países a modelos de IA avançados. Sobre a tecnologia de chamada de função, os modelos de inteligência artificial podem agora interagir com sistemas externos, consultar informações, acionar ferramentas e executar ações com base em comandos em linguagem natural, permitindo a execução real de tarefas ao invés de apenas sugerir soluções.", "ciencia": "Os cientistas japoneses realizaram experimentos que sugerem que a memória de camundongos pode persistir mesmo após a remoção de cerca de metade das conexões entre os neurônios. Este achado tem implicações significativas para a compreensão do funcionamento da memória no cérebro. Em outro desenvolvimento, a Tepco iniciou o processo de remoção de combustível nuclear usado do reator número 2 da usina de Fukushima, transferindo-o para um local de armazenamento mais seguro. Além disso, um estudo publicado na Nature News destaca que ondas de calor podem expor fragilidades nos sistemas alimentares, agravando problemas existentes e afetando a produção e distribuição de alimentos. Por fim, a Agência Espacial Europeia planeja realizar o primeiro voo espacial extraveicular feminino francês em 18 de agosto, com a astronauta Sophie Adenot, um marco histórico para a missão espacial feminina.", "cultura": "O evento mais importante dos artigos trata das Jornadas Borges, que ocorrerão durante uma semana em cinco sedes da cidade de Buenos Aires, em homenagem ao escritor argentino Jorge Luis Borges, cujo aniversário se comemora no próximo dia 24. Este evento cultural incluirá conferências e palestras que explorarão a obra e a vida do autor, destacando seu impacto na literatura universal. Em outro contexto cultural, a pós-graduanda Misaki Katayama, da Universidade de Tóquio, realiza workshops de dois dias em Hiroshima e Nagasaki, usando Minecraft para ajudar a entender as paisagens urbanas antes dos ataques atômicos, promovendo a educação para a paz. Ainda na área cultural, a artista Temi Wilkey apresenta 'Lover Girl', uma comédia intensa e íntima que explora temas de amor e desejo, questionando a natureza do amor e do corpo, em um show que busca expressar a complexidade das rupturas emocionais.", "sociedade": "Um estudante iniciou um tiroteio em uma escola secundária no sul das Filipinas, matando um colega e se suicidando, ferindo outras duas pessoas. Este incidente, ocorrido em um contexto de uso de câmeras para transmissão ao vivo, destaca a tensão social e as consequências de ações impulsivas. Em seguida, a maioridade penal no Brasil perdeu sua validade, com a justificativa de que a rigidez etária não considera o discernimento do adolescente na era digital. Um estudo indica que violência e desigualdade econômica estão custando bilhões de reais ao Brasil anualmente, afetando a arrecadação pública, atração de investimentos e o crescimento a longo prazo do país. Além disso, a maioridade penal perdeu sua validade porque a rigidez etária estabelecida há mais de 80 anos não considera o discernimento do adolescente na era digital.", "meio_ambiente": "No Brasil, as pessoas estão enfrentando climas extremos, com o sul do país experimentando frios intenses e o centro enfrentando calor antecipado devido ao ar seco. Paralelamente, um ciclone extratropical se aproxima, causando temporais, rajadas de vento fortes e queda de granizo. No exterior, a seca e as ondas de calor intensas estão afetando agricultores europeus, levando a uma crise sem precedentes. No Chile, a ministra do Meio Ambiente anunciou a postulação de recursos para criar um fundo patrimonial para os parques nacionais, comemorando os 100 anos de conservação no país. No cenário global, o segundo maior reservatório dos Estados Unidos atingiu seu nível de água mais baixo registrado, enquanto o Monte Etna eruptou em Sicília, lançando fumaça e cinzas para o céu. Além disso, incêndios florestais estão em curso na Espanha e na Bélgica, com soldados do Corpo de Bombeiros franceses e espanhóis trabalhando juntos para combater as chamas. No Reino Unido, imagens de drone mostram campos afetados pela seca. No Chile, a remoção da coroa-de-espinhos é planejada para proteger os recifes do parque, enquanto a Alemanha enfrenta baixos níveis de água no Reno devido à seca. Um relatório destaca que o aumento da temperatura e a escassez d'água estão aumentando os riscos associados a ativos estrategicamente localizados. No Brasil, o etanol e o biometano estão ganhando espaço no transporte de cargas, oferecendo novas opções para reduzir a emissão de gases de efeito estufa em setores difíceis de eletrificar.", "direitos_humanos": "Os direitos humanos foram amplamente discutidos em diversos casos ao redor do mundo. O retorno dos talibãs ao poder no Afeganistão em 2021 levou a uma grave violação dos direitos das mulheres, com a desmontagem rápida de instituições e serviços relacionados a esses direitos em poucos dias. Em outro desenvolvimento, a Comissão Nacional de Direitos Humanos criticou uma proposta de chicotear, destacando preocupações sobre as possíveis consequências da medida. Além disso, a violência cometida por seteiros israelenses contra palestinos gerou condenação internacional, enquanto a mídia foi acusada de contribuir para a morte do ex-professor Jason Arday em Londres. Em relação à saúde, o surto de Ebola na República Democrática do Congo superou o número de vítimas do surto mais grave do passado, com pelo menos 2.325 mortes. No Irã, mulheres enfrentam restrições para o uso de óvulos congelados, enquanto na Albânia, um novo guia clínico não inclui subsídios para o tratamento hormonal de gênero. Por fim, na Ucrânia, um abrigo em Kyiv oferece refúgio para mães vulneráveis que enfrentam invasão e abuso, e um político israelense fez um pedido gravado para o assassinato de palestinos em Gaza, gerando controvérsia."}, "resumo_do_dia": {"politica_nacional": [{"id": 108658, "titulo": "Judicialização eleitoral mais que dobra e pré-campanha de 2026 registra recorde histórico", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/judicializacao-eleitoral-mais-que-dobra-e-pre-campanha-de-2026-registra-recorde-historico.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-18T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Partidos políticos acionaram o TSE mais de duas vezes o número de vezes que ocorreu em 2022, e a pré-campanha de 2026 registrou o maior número de ações judiciais na história.", "titulo_pt": "Judicialização eleitoral mais que dobra e pré-campanha de 2026 registra recorde histórico", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 108674, "titulo": "Crise econômica, 'santinho' nas redes e mais: casos na Justiça mostram formas mais comuns de assédio eleitoral no trabalho", "url": "https://g1.globo.com/trabalho-e-carreira/noticia/2026/08/18/crise-economica-santinho-nas-redes-e-mais-casos-na-justica-mostram-formas-mais-comuns-de-assedio-eleitoral-no-trabalho.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-18T08:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os números de processos e denúncias por assédio moral no trabalho têm aumentado. A pesquisa do Tribunal Superior do Trabalho destaca práticas como pressão para compartilhar propaganda política, exigência de 'santinhos' nas redes sociais e ameaças relacionadas ao emprego.", "titulo_pt": "Crise econômica, 'santinho' nas redes e mais: casos na Justiça mostram formas comuns de assédio eleitoral no trabalho", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 108905, "titulo": "'Geração Lava Jato' prefere Flávio, e idosos podem ser 'novo Nordeste' de Lula, diz diretora do Datafolha", "url": "https://www.bbc.com/portuguese/articles/cx2r19g4pnxo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-18T08:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A diretora do Datafolha, Luciana Chong, afirma que a eleição está influenciada pela alta rejeição aos principais líderes políticos, o que pode levar a um segundo turno bastante disputado. Ela também sugere que a 'Geração Lava Jato' apoia Flávio e que os idosos podem se tornar um novo eleitorado importante para Lula.", "titulo_pt": "Geração Lava Jato apoia Flávio e idosos podem ser novo eleitorado para Lula, diz diretora do Datafolha", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 108675, "titulo": "VÍDEO: como são feitas as pesquisas eleitorais e como os entrevistados são escolhidos", "url": "https://g1.globo.com/politica/eleicoes/2026/videos/noticia/2026/08/18/video-como-sao-feitas-as-pesquisas-eleitorais-e-como-os-entrevistados-sao-escolhidos.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-18T08:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O diretor da Quaest e professor da FGV, Felipe Nunes, explica no vídeo como são definidos o tamanho e o perfil das amostras das pesquisas eleitorais e como os institutos escolhem os entrevistados. A chance de uma pessoa participar de uma pesquisa eleitoral é a mesma para todos.", "titulo_pt": "Como são feitas as pesquisas eleitorais e como os entrevistados são escolhidos", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 108659, "titulo": "Tarcísio manifesta solidariedade a Marina após hostilidade em SP", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/tarcisio-manifesta-solidariedade-a-marina-apos-hostilidade-em-sp.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-18T04:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador Tarcísio de Freitas, candidato à reeleição, expressou solidariedade à ex-ministra Marina Silva, candidata ao Senado por São Paulo, após ela ser alvo de hostilidade durante um evento com mulheres em favor de Fernando Haddad, candidato ao governo paulista.", "titulo_pt": "Tarcísio manifesta solidariedade a Marina após hostilidade em SP", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 108676, "titulo": "O que fizeram e disseram os candidatos à Presidência no lançamento das campanhas - O Assunto #1785", "url": "https://g1.globo.com/podcast/o-assunto/noticia/2026/08/18/o-que-fizeram-e-disseram-os-candidatos-a-presidencia-no-lancamento-das-campanhas-o-assunto-1785.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-18T03:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos à Presidência lançaram oficialmente suas campanhas no domingo (16), com discursos em diferentes localidades do Brasil. Lula (PT) discursou em São Bernardo do Campo, Flávio Bolsonaro (PL) em Copacabana, Rio de Janeiro, e outros candidatos também se pronunciaram em suas respectivas cidades.", "titulo_pt": "O que fizeram e disseram os candidatos à Presidência no lançamento das campanhas - O Assunto #1785", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 108660, "titulo": "Tarcísio começa campanha em SP com discurso nacional, calibrado para 2030", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/tarcisio-comeca-campanha-em-sp-com-discurso-nacional-calibrado-para-2030.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-18T03:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador Tarcísio de Freitas (Republicanos) iniciou sua campanha em São Paulo com um discurso que abordou temas de interesse nacional, visando uma eventual candidatura presidencial em 2030.", "titulo_pt": "Tarcísio inicia campanha em SP com discurso calibrado para 2030", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 108677, "titulo": "Mais de 3 mil candidatos trocaram de partido desde 2022; veja as legendas que mais ganharam e perderam nomes", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/18/troca-partidos-eleicoes-2026.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-18T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 3.600 candidatos que disputaram as eleições de 2022 estão concorrendo nas eleições de 2026 por partidos diferentes. O número representa cerca de 58% dos candidatos que se registraram nas duas eleições.", "titulo_pt": "Mais de 3 mil candidatos trocaram de partido desde 2022; veja as legendas que mais ganharam e perderam nomes", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 108678, "titulo": "'O Brasil pronto pra mais'; 'O Brasil vai vencer' e mais: veja slogans dos candidatos à Presidência do Brasil", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/18/o-brasil-pronto-pra-mais-o-brasil-vai-vencer-e-mais-veja-slogans-dos-candidatos-a-presidencia-do-brasil.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-18T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha presidencial começou oficialmente no domingo (16) e os candidatos já estão usando seus slogans e identidades visuais. Os partidos e candidaturas podem agora pedir votos explicitamente e distribuir materiais gráficos com seus lemas de campanha.", "titulo_pt": "Slogans dos candidatos à Presidência do Brasil já estão em vigor", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 108679, "titulo": "Número de mulheres candidatas à Presidência cai pela metade em 2026", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/18/numero-de-mulheres-candidatas-a-presidencia-cai-pela-metade-em-2026.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-18T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de mulheres candidatas à Presidência caiu pela metade nas eleições de 2026, passando de quatro em 2022 para duas. Ao todo, sete mulheres compõem as chapas neste ano, com cinco concorrendo à vice-presidência.", "titulo_pt": "Número de mulheres candidatas à Presidência cai pela metade em 2026", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 108680, "titulo": "Ministros do TSE se reúnem nesta terça para discutir uso de deepfakes na campanha eleitoral", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/18/ministros-do-tse-se-reunem-nesta-terca-para-discutir-uso-de-deepfakes-na-campanha-eleitoral.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-18T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ministros do Tribunal Superior Eleitoral (TSE) se reúnem para discutir a possibilidade de proibir o uso de deepfakes durante a campanha eleitoral e estabelecer punições para violações. A reunião ocorre após uma ação do PT contra a divulgação de um vídeo do ex-presidente Jair Bolsonaro produzido por inteligência artificial.", "titulo_pt": "Ministros do TSE se reúnem para discutir proibição de deepfakes na campanha eleitoral", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 108661, "titulo": "Houve risco iminente de golpe, diz ex-comandante da FAB no governo Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/houve-risco-iminente-de-golpe-diz-ex-comandante-da-fab-no-governo-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-18T02:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2022, Jair Bolsonaro tentou convencer os comandantes das Forças Armadas a realizar um golpe para reverter a vitória de Lula nas eleições. Ex-comandante da FAB, Carlos Baptista Júnior detalha esses encontros em seu novo livro.", "titulo_pt": "Houve risco iminente de golpe, diz ex-comandante da FAB no governo Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 108662, "titulo": "Inelegível, Marçal pode manter campanha e empurrar desfecho enquanto TSE não barrar candidatura", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/inelegivel-marcal-pode-manter-campanha-e-empurrar-desfecho-enquanto-tse-nao-barrar-candidatura.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-18T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O empresário e influenciador Pablo Marçal, inelegível, foi registrado como candidato à Presidência da República pelo partido PRTB no sábado (15). Mesmo inelegível, ele pode manter a campanha até que o TSE decida barrar sua candidatura.", "titulo_pt": "Inelegível, Marçal registra candidatura e pode manter campanha aguardando decisão do TSE", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 108663, "titulo": "TSE registra maior queda de candidaturas em 3 décadas, sob efeito de federações e de partido de Marçal", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/tse-registra-maior-queda-de-candidaturas-em-3-decadas-sob-efeito-de-federacoes-e-de-partido-de-marcal.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-18T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número total de candidatos nas eleições gerais de 2026 registrou uma diminuição significativa, a maior desde 1994. O Tribunal Superior Eleitoral registrou esta queda brusca.", "titulo_pt": "TSE registra maior queda de candidaturas em 3 décadas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 108664, "titulo": "Flávio vai a ato de aliado em MG, acena a Cleitinho e diz que esperou 'até o último minuto' por ele", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/flavio-vai-a-ato-de-aliado-em-mg-acena-a-cleitinho-e-diz-que-esperou-ate-o-ultimo-minuto-por-ele.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-18T01:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, candidato do PL à Presidência, esteve em Belo Horizonte para o lançamento da candidatura do partido ao Governo de Minas e também fez acenos ao senador Cleitinho, do Republicanos, que lidera as pesquisas no estado.", "titulo_pt": "Flávio bolsonaro se reúne com aliado em MG e acena a Cleitinho", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 108665, "titulo": "Igreja Universal mobiliza fiéis em campanha espiritual que termina no dia da eleição", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/igreja-universal-mobiliza-fieis-em-campanha-espiritual-que-termina-no-dia-da-eleicao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-18T01:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Igreja Universal do Reino de Deus lançou uma campanha chamada Desafio de Neemias que durará 52 dias. A iniciativa termina no dia da eleição.", "titulo_pt": "Igreja Universal mobiliza fiéis em campanha espiritual antes da eleição", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 109110, "titulo": "Pakistan ex-PM Imran Khan moved to hospital from jail over health concerns", "url": "https://www.france24.com/en/asia-pacific/20260818-pakistan-ex-pm-imran-khan-moved-to-hospital-from-jail-over-health-concerns", "fonte_id": "france24", "data_pub": "2026-08-18T09:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal paquistanês ordenou que o ex-prime minister Imran Khan fosse transferido de uma prisão para um hospital devido a problemas de saúde. Khan, de 73 anos, e sua esposa foram condenados a 17 anos de prisão no ano anterior por vários casos de corrupção.", "titulo_pt": "Ex-pm do paquistão Imran Khan transferido para hospital devido a problemas de saúde", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 109111, "titulo": "Ukraine launches over 600 drones at Moscow region", "url": "https://www.france24.com/en/ukraine-launches-over-600-drones-at-moscow-region", "fonte_id": "france24", "data_pub": "2026-08-18T09:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ucrânia lançou mais de 600 drones na região de Moscou, em uma das maiores ações aéreas contra a capital russa. Um ataque russo na região de Kharkiv, no leste da Ucrânia, resultou em dez mortes. Ao menos três pessoas, incluindo uma menina de 10 anos, ficaram feridas no ataque aéreo na região de Moscou.", "titulo_pt": "Ucrânia lança mais de 600 drones na região de moscou", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 109012, "titulo": "Irán acusa a Israel de sabotear los esfuerzos diplomáticos con Estados Unidos: “Es el principal obstáculo para la paz”", "url": "https://www.latercera.com/mundo/noticia/iran-acusa-a-israel-de-sabotear-los-esfuerzos-diplomaticos-con-estados-unidos-es-el-principal-obstaculo-para-la-paz/", "fonte_id": "la_tercera", "data_pub": "2026-08-18T09:56:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ministro de Exteriores de Irã, Abbas Araqchi, acusou Israel de tentar impedir um acordo com os Estados Unidos, afirmando que o país é o principal obstáculo para a paz. Araqchi disse que Israel faz tudo para evitar o sucesso do acordo e a implementação das medidas acordadas.", "titulo_pt": "Irã acusa Israel de impedir acordo com Estados Unidos para paz", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 108995, "titulo": "How Israel’s Financial Chokehold Is Stifling the West Bank Economy", "url": "https://www.nytimes.com/2026/08/18/world/middleeast/west-bank-economy.html", "fonte_id": "nyt_world", "data_pub": "2026-08-18T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As restrições intensificadas estão afetando todos os aspectos dos negócios na região, gerando preocupações sobre a capacidade do Governo Palestino de manter suas finanças em dia.", "titulo_pt": "Como o aperto financeiro israelense está sufocando a economia da cisjordânia", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 109128, "titulo": "Russia warns UK will pay for supplying drones to Ukraine", "url": "https://www.bbc.co.uk/news/articles/cy5dz0kkn0wo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-18T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Rússia acusa o Reino Unido de agravar a guerra na Ucrânia após o uso de drones britânicos, mas o Ministério da Defesa britânico afirma que está contra a agressão russa.", "titulo_pt": "Rússia ameaça reino unido por fornecimento de drones para Ucrânia", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 109169, "titulo": "Ship hit in Hormuz as Iran's top negotiator says strait to stay shut", "url": "http://www.euronews.com/2026/08/18/ship-hit-in-hormuz-as-irans-top-negotiator-says-strait-to-stay-shut", "fonte_id": "euronews", "data_pub": "2026-08-18T09:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O parlamentar Ghalibaf declarou que o estreito permanecerá fechado até que Washington retire seu bloqueio naval, libere ativos iranianos congelados e revogue sanções sobre o petróleo. Um projétil indeterminado atingiu um navio transitando pelo estreito, causando pelo menos uma vítima.", "titulo_pt": "Navio atingido no Hormuz enquanto negociador iraniano afirma que estreito permanecerá fechado", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 109143, "titulo": "Hyrox: A global fitness sensation Made in Germany", "url": "https://www.dw.com/en/hyrox-a-global-fitness-sensation-made-in-germany/a-78074218?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-18T09:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hyrox é uma forma única de treinamento que combina corrida e treinamento funcional, criada na Alemanha e que se tornou um fenômeno internacional. A ideia alemã se transformou em uma forma de esporte competitivo global.", "titulo_pt": "Hyrox: um fenômeno global de fitness originário da Alemanha", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 109009, "titulo": "Zelenskyy says Ukraine will respond after 10 killed in overnight Russian attack – Europe live", "url": "https://www.theguardian.com/world/live/2026/aug/18/ukraine-drone-attack-moscow-crimea-russia-nato-wildfires-europe-live-latest-updates", "fonte_id": "guardian_world", "data_pub": "2026-08-18T09:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente ucraniano Zelenskyy afirmou que a Ucrânia responderá após um ataque noturno russo que deixou 10 mortos. Em outro desenvolvimento, um terremoto de 4,7 magnitude foi registrado na Espanha, com epicentro em Gójar.", "titulo_pt": "Zelenskyy diz que Ucrânia responderá após ataque noturno russo que deixou 10 mortos - Europa em tempo real", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 109249, "titulo": "E' caro tazzina, espresso in media a 1,29 euro (+24,5% sul 2025)", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/18/e-caro-tazzina-espresso-in-media-a-129-euro-245-sul-2025_e4b9b214-2324-4220-a66b-29fd71ad21b9.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-18T09:33:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O espresso mais caro na Itália custa em média 1,29 euros, com um aumento de 24,5% em comparação ao ano anterior. Em Bolzano, o espresso é o mais caro, enquanto em Messina, o espresso é o mais econômico.", "titulo_pt": "Café expresso mais caro custa em média 1,29 euros, com bolzano liderando e messina sendo o mais econômico", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 109144, "titulo": "Ukraine, Russia trade strikes; Wildberries site hit again", "url": "https://www.dw.com/en/ukraine-russia-trade-strikes-wildberries-site-hit-again/a-78408178?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-18T09:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ucrânia relatou 10 mortos em um ataque com mísseis no nordeste da Oblast de Kharkiv, perto da fronteira. Rússia relatou mais de 600 drones se aproximando da área de Moscou e advertiu o Reino Unido sobre o fornecimento de drones para Kiev.", "titulo_pt": "Ucrânia e Rússia trocam ataques; site Wildberries atacado novamente", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 108822, "titulo": "Ataque da Rússia com mísseis mata pelo menos 10 pessoas em Kharkiv", "url": "https://www.cnnbrasil.com.br/internacional/ataque-da-russia-com-misseis-mata-pessoas-em-kharkiv/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-18T09:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ataque de mísseis da Rússia resultou em pelo menos 10 mortes e 17 feridos em Kharkiv. O governador da região deu esta informação.", "titulo_pt": "Ataque de mísseis da Rússia mata pelo menos 10 pessoas em Kharkiv", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 109106, "titulo": "FIFA's number three fired after criticizing Infantino", "url": "https://www.lemonde.fr/en/sports/article/2026/08/18/fifa-s-number-three-fired-after-criticizing-infantino_6756621_9.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-18T09:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O COO da FIFA, Kevin Lamour, teve seu contrato encerrado após criticar publicamente o presidente Gianni Infantino no final de julho.", "titulo_pt": "Fifa demite número três após críticas a Infantino", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 108759, "titulo": "Usina de Pivetta recebeu de empresas citadas pela PF no acordo da Oi", "url": "https://www.metropoles.com/colunas/andreza-matais/usina-heritage-pivetta-dinheiro-mt-fundos-acordo-oi-policia-federal", "fonte_id": "metropoles", "data_pub": "2026-08-18T09:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os documentos revelam que a usina de Pivetta recebeu aportes de R$ 37 milhões de empresas mencionadas na operação da Polícia Federal contra a Oi. O governador do Mato Grosso nega a acusação, afirmando que está muito longe disso.", "titulo_pt": "Usina de Pivetta recebeu aportes de empresas citadas na operação da PF contra a Oi", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 109366, "titulo": "(LEAD) USFK commander visits defense ministry after Trump's order to reduce joint exercise with S. Korea", "url": "https://en.yna.co.kr/view/AEN20260818008251315", "fonte_id": "yonhap_news", "data_pub": "2026-08-18T09:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O comandante das Forças Armadas dos Estados Unidos na Coreia do Sul, General Xavier Brunso, visitou o ministério da Defesa após a ordem do presidente americano, Donald Trump, para reduzir os exercícios militares conjuntos com a Coreia do Sul.", "titulo_pt": "Comandante das forças armadas dos EUA na Coreia do sul visita ministério da defesa após ordem de Trump", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 109099, "titulo": "Macron urges France not to give in to 'defeatism'", "url": "https://www.lemonde.fr/en/politics/article/2026/08/18/macron-urges-france-not-to-give-in-to-defeatism_6756619_5.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-18T08:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Emmanuel Macron participou da cerimônia anual em Bormes-les-Mimosas, uma cidade sul-francesa onde ele passa as férias, reiterando seu discurso contra o 'defeatismo' durante seu último ano como presidente.", "titulo_pt": "Macron incentiva França a não ceder ao 'defeatismo'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 109297, "titulo": "Chinese President Xi Jinping leads party elite in final farewell for ex-premier Zhu Rongji", "url": "https://www.scmp.com/news/china/politics/article/3364422/chinese-president-xi-jinping-leads-party-elite-final-farewell-ex-premier-zhu-rongji?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-18T08:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Xi Jinping, presidente da China, liderou a homenagem final à ex-primeira-ministra Zhu Rongji, que faleceu aos 97 anos após uma doença. Zhu, que esteve à frente da reforma econômica do país, desempenhou um papel crucial na transição da China para uma economia de mercado e no ingresso do país na Organização Mundial do Comércio (OMC).", "titulo_pt": "Xi Jinping lidera homenagem final à ex-primeira-ministra Zhu Rongji", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 108852, "titulo": "Getnet muda de CEO após cinco anos: Cristiane Nogueira assume", "url": "https://braziljournal.com/getnet-muda-de-ceo-apos-cinco-anos-cristiane-nogueira-assume/", "fonte_id": "brazil_journal", "data_pub": "2026-08-18T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cristiane Nogueira, especialista em meios de pagamento, foi escolhida para assumir a posição de CEO da Getnet, uma empresa controlada pelo Santander com sede em Madri. Ela substituirá Cassio Schmitt, que liderou a companhia por quase cinco anos e permanecerá no conselho.", "titulo_pt": "Getnet troca de CEO após cinco anos: cristiane Nogueira assume", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 109161, "titulo": "Russia says its economy is strong. It just fired a top economist who warned otherwise", "url": "https://www.cnbc.com/2026/08/18/ukraine-war-russia-economy-klepach.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-18T09:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Andrei Klepach, um economista de alto nível, foi demitido após apresentar um relatório alertando que a Rússia não poderia vencer uma guerra de attrition prolongada contra a Ucrânia.", "titulo_pt": "Rússia demite economista que alertou sobre a economia", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 109159, "titulo": "Global bond yields hit multi-decade highs as governments pay the price for U.S.-Iran stalemate", "url": "https://www.cnbc.com/2026/08/18/bond-yields-government-us10y-treasury-note-iran.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-18T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos das dívidas governamentais internacionais atingiram níveis multi-decada altos, acompanhando o aumento dos rendimentos das dívidas dos Estados Unidos, devido ao impasse entre Estados Unidos e Irã.", "titulo_pt": "Rendimentos das dívidas governamentais internacionais atingem níveis multi-decada altos devido ao impasse entre EUA e Irã", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 109164, "titulo": "Treasury yields rise as oil gains and U.S.-Iran tensions fuel inflation fears", "url": "https://www.cnbc.com/2026/08/18/treasury-yields-.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-18T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos das notas do Tesouro dos EUA de 30 anos aumentaram mais de 1 base ponto, atingindo cerca de 5,322%, ficando apenas abaixo do seu nível mais alto desde 2002. Além disso, os preços do petróleo subiram e as tensões entre EUA e Irã aumentaram preocupações sobre inflação.", "titulo_pt": "Rendimentos das notas do tesouro dos EUA de 30 anos sobem com petróleo em alta e tensões entre EUA e Irã", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 109365, "titulo": "Hyundai Motor workers again to stage partial strikes amid wage dispute", "url": "https://en.yna.co.kr/view/AEN20260818010400320", "fonte_id": "yonhap_news", "data_pub": "2026-08-18T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores da Hyundai Motor Co. planejam realizar parcialmente greves devido a uma disputa salarial. A entidade sindical da empresa anunciou a decisão na cidade de Seul em 18 de agosto.", "titulo_pt": "Trabalhadores da hyundai Motor planejam greves parciais em meio a disputa salarial", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 109177, "titulo": "Global bond sell-off deepens amid fears over inflation and AI issuance", "url": "https://www.ft.com/content/61354e68-c4ba-4716-b849-b332608c8c65?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-18T09:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os custos de empréstimos governamentais a longo prazo atingiram máximos de várias décadas. O mercado global de títulos sofreu uma venda massiva devido às preocupações sobre a inflação e a emissão de tecnologia de inteligência artificial.", "titulo_pt": "Venda em massa de títulos globais profundifica com medo de inflação e emissão de IA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 108749, "titulo": "Petróleo volta a US$ 90 com ameaça de Trump a Ormuz", "url": "https://www.poder360.com.br/poder-internacional/petroleo-volta-a-us-90-com-ameaca-de-trump-a-ormuz/", "fonte_id": "poder360", "data_pub": "2026-08-18T08:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os preços do petróleo voltaram a US$ 90 por barril devido a uma ameaça de Trump em relação ao Estreito de Ormuz, o que diminuiu as esperanças de um acordo para resolver a guerra no Oriente Médio.", "titulo_pt": "Petróleo retorna a US$ 90 com ameaça de Trump a Ormuz", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 108848, "titulo": "Dow Jones Futuro cai com petróleo em alta e incerteza sobre cessar-fogo EUA-Irã", "url": "https://www.infomoney.com.br/mercados/dow-jones-futuro-cai-com-petroleo-em-alta-e-incerteza-sobre-cessar-fogo-eua-ira/", "fonte_id": "infomoney", "data_pub": "2026-08-18T08:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Dow Jones Futuro registrou uma queda devido ao aumento do petróleo e à incerteza sobre um cessar-fogo entre EUA e Irã. O yield do Treasury de 30 anos atingiu o maior nível desde 2007.", "titulo_pt": "Dow Jones Futuro cai com petróleo em alta e incerteza sobre cessar-fogo EUA-Irã", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 108895, "titulo": "A Mesa de Diálogos do PPI e a oportunidade de fortalecer a Verificação Independente", "url": "https://www.jota.info/opiniao-e-analise/colunas/mulheres-na-regulacao/a-mesa-de-dialogos-do-ppi-e-a-oportunidade-de-fortalecer-a-verificacao-independente", "fonte_id": "jota", "data_pub": "2026-08-18T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Mesa de Diálogos do Programa de Parcerias de Infraestrutura (PPI) e a verificação independente oferecem uma oportunidade para fortalecer a segurança jurídica das concessões e parcerias público-privadas no país. Acreditação do Inmetro reforça essa segurança jurídica.", "titulo_pt": "A Mesa de Diálogos do PPI e a oportunidade de fortalecer a Verificação Independente", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 108896, "titulo": "Tema 1.299 no STJ: a modulação como caminho para a segurança jurídica", "url": "https://www.jota.info/opiniao-e-analise/artigos/tema-1-299-no-stj-a-modulacao-como-caminho-para-a-seguranca-juridica", "fonte_id": "jota", "data_pub": "2026-08-18T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O tema 1.299 no Superior Tribunal de Justiça (STJ) trata da modulação como meio de garantir a segurança jurídica. Servidores públicos podem estar em risco de perder direitos devido ao atraso na julgamento de ações rescisórias.", "titulo_pt": "Tema 1.299 no STJ: modulação como caminho para a segurança jurídica", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 109299, "titulo": "Chinese treasury futures launch cements Hong Kong as premier yuan hub", "url": "https://www.scmp.com/opinion/hong-kong-opinion/article/3364103/chinese-treasury-futures-launch-cements-hong-kong-premier-yuan-hub?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-18T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A bolsa de valores de Hong Kong lançou futuros de títulos de dívida do governo chinês a cinco anos, fortalecendo a cidade como centro principal da moeda yuan. Este contrato é o único de futuros de títulos de dívida do governo chinês no mercado offshore e oferece ferramentas de hedge para investidores internacionais, permitindo que Hong Kong gere o preço dos ativos em yuan, gerencie riscos e atenda a investidores globais.", "titulo_pt": "Lançamento de futuros de títulos do governo chinês cimenta Hong Kong como principal hub do yuan", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 108897, "titulo": "Populismo tarifário atrasará universalização do saneamento básico", "url": "https://www.jota.info/opiniao-e-analise/colunas/farol-infraestrutura/populismo-tarifario-atrasara-universalizacao-do-saneamento-basico", "fonte_id": "jota", "data_pub": "2026-08-18T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Leis municipais que reduzem tarifas sem compensação ameaçam o equilíbrio dos contratos relacionados ao saneamento básico. Populismo tarifário pode atrasar a universalização do serviço.", "titulo_pt": "Populismo tarifário ameaça universalização do saneamento básico", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 108899, "titulo": "Coaf sob pressão: os desafios enfrentados pela unidade de inteligência financeira", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-transparencia-internacional/coaf-sob-pressao-os-desafios-enfrentados-pela-unidade-de-inteligencia-financeira", "fonte_id": "jota", "data_pub": "2026-08-18T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A agenda de fortalecimento do Coaf visa unir autonomia, confidencialidade e transparência. Fortalecer o órgão não implica em eliminar controles.", "titulo_pt": "Coaf sob pressão: os desafios enfrentados pela unidade de inteligência financeira", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 109323, "titulo": "China AI chip sales scale: Biren's revenue rockets up to 21-fold", "url": "https://www.digitimes.com/news/a20260818VL213/biren-revenue-ai-chip-2026-growth.html", "fonte_id": "digitimes", "data_pub": "2026-08-18T07:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa chinesa de chips de inteligência artificial Biren prevê que suas receitas no primeiro semestre de 2026 alcancem R$1,15 a R$1,3 bilhão (US$171 a US$193 milhões), um aumento de cerca de 1852% a 2107% em comparação com o mesmo período do ano anterior. Isso ocorrerá devido ao aumento da demanda por computação GPGPU em codificação de IA, agências de IA a longo prazo e cargas de trabalho de IA gerativa, de acordo com dados do Cninfo citados em um relatório do Hong Kong Economic Times.", "titulo_pt": "Vendas de chips de IA da biren devem aumentar 21 vezes até 2026", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 109373, "titulo": "(2nd LD) Seoul shares end lower, snapping 5-day winning streak, on profit-taking", "url": "https://en.yna.co.kr/view/AEN20260818006452320", "fonte_id": "yonhap_news", "data_pub": "2026-08-18T07:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações de Seoul encerraram o dia em baixa, interrompendo uma sequência de cinco dias de ganhos devido a lucros realizados.", "titulo_pt": "Seoul encerra com baixa, interrompendo sequência de cinco dias de ganhos", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 109374, "titulo": "S. Korean won rises slightly as markets step back from U.S. rate hike expectations", "url": "https://en.yna.co.kr/view/AEN20260818008500320", "fonte_id": "yonhap_news", "data_pub": "2026-08-18T07:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O won sul-coreano teve uma leve elevação em relação ao dólar americano, com os mercados reduzindo as expectativas de aumento de juros nos Estados Unidos.", "titulo_pt": "Won sul-coreano se valoriza ligeiramente diante das expectativas reduzidas de aumento de juros nos EUA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 109353, "titulo": "Detroit startup Grounded raises $5M to customize electric and gas-powered vans", "url": "https://techcrunch.com/2026/08/18/detroit-startup-grounded-raises-5m-to-customize-electric-and-gas-powered-vans/", "fonte_id": "techcrunch", "data_pub": "2026-08-18T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup de Detroit, Grounded, levantou $5M para personalizar vans elétricas e a gasolina. A empresa passou a se focar na customização de veículos para pequenas empresas, enquanto o cenário das veículos elétricos nos Estados Unidos sofreu transformações significativas.", "titulo_pt": "Startup de detroit levanta $5M para personalizar vans elétricas e a gasolina", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 109437, "titulo": "Lithuania’s LITILIT lands €8M to take femtosecond lasers into mass manufacturing", "url": "https://tech.eu/2026/08/18/lithuanias-litilit-lands-eur8m-to-take-femtosecond-lasers-into-mass-manufacturing/", "fonte_id": "tech_eu", "data_pub": "2026-08-18T09:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de Vilnius especializada em lasers femtosecond, LITILIT, recebeu um empréstimo de €8 milhões do Banco Nacional de Desenvolvimento da Lituânia, ILTE. A companhia produz lasers utilizando tecnologia patenteada.", "titulo_pt": "LITILIT, fabricante de lasers femtosecond da lituânia, recebe empréstimo de €8 milhões", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 109291, "titulo": "Baidu’s quarterly revenue drops 4% as AI cloud surge fails to offset advertising slump", "url": "https://www.scmp.com/tech/big-tech/article/3364436/baidu-quarterly-revenue-drops-4-ai-cloud-surge-fails-offset-advertising-slump?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-18T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Baidu, gigante tecnológica chinesa, registrou uma queda de 4% no faturamento trimestral, com a desaceleração do setor publicitário não sendo compensada pelo crescimento das operações de nuvem de inteligência artificial. O faturamento do segundo trimestre foi de 31,3 bilhões de yuan, abaixo da estimativa de 31,6 bilhões de yuan dos analistas.", "titulo_pt": "Faturamento trimestral da baidu cai 4% devido à desaceleração publicitária", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 109296, "titulo": "Singapore’s universities race to embrace AI as job demands transform", "url": "https://www.scmp.com/week-asia/economics/article/3364419/singapores-universities-race-embrace-ai-job-demands-transform?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-18T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As universidades de Singapura estão adotando a tecnologia de inteligência artificial, não apenas para transformar as aulas, mas também para preparar os graduados para uma economia que valoriza a literacia em IA. No entanto, analistas afirmam que os educadores enfrentam o desafio de garantir que os alunos usem a IA para aprimorar o pensamento crítico, em vez de se basearem apenas em respostas rápidas e orientações.", "titulo_pt": "Universidades de singapura adotam IA para preparar graduados", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 109349, "titulo": "The role of the astronaut is in flux", "url": "https://www.technologyreview.com/2026/08/18/1141614/book-review-astronaut-role-in-flux/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-18T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os astronautas a bordo da missão Artemis II da NASA, que orbitou a Lua neste ano, estabeleceram um novo recorde de distância do planeta Terra, superando a marca da missão Apollo 13 de 1972 em cerca de 4.000 milhas. A missão não alcançou a touchdown histórica da Apollo 11.", "titulo_pt": "O papel do astronauta está em transformação", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 109355, "titulo": "The Powerful Chinese Model Experts Warned About—and Waited for—Is Here", "url": "https://www.wired.com/story/zai-open-weight-ai-models-release-cybersecurity-hacking/", "fonte_id": "wired", "data_pub": "2026-08-18T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O novo modelo de IA lançado pela Z.ai pode auxiliar empresas a proteger seus sistemas ou acabar nas mãos de hackers.", "titulo_pt": "O poderoso modelo chinês de IA, sobre o qual especialistas avisaram e esperaram, chegou", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 109316, "titulo": "TSC sees semiconductor material prices rise up to 15% as petrochemical costs squeeze supply", "url": "https://www.digitimes.com/news/a20260818PD216/topco-materials-2026-demand-quartz.html", "fonte_id": "digitimes", "data_pub": "2026-08-18T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Topco Scientific (TSC) informou que os custos de petroquímicos em alta estão elevando os preços dos materiais de semicondutores, como resistentes à luz e adesivos de interface térmica. A empresa apresentou essas informações durante sua conferência de resultados do segundo trimestre de 2026.", "titulo_pt": "Topco scientific vê preços de materiais de semicondutores aumentarem até 15% devido a altos custos de petroquímicos", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 109383, "titulo": "Korea’s crypto outflows reflect product gap, not stablecoin gap: First Digital CEO", "url": "https://www.koreaherald.com/article/10844474", "fonte_id": "korea_herald", "data_pub": "2026-08-18T08:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vincent Chok, CEO da First Digital, afirma que a Coreia do Sul precisa de uma variedade maior de produtos digitais além de uma stablecoin em won para manter a atividade de ativos digitais local. Segundo ele, a demanda por produtos diversificados é maior do que a falta de stablecoins.", "titulo_pt": "Saída de criptomoedas da Coreia do sul reflete falta de produtos, não de stablecoins, diz CEO", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 109384, "titulo": "Cortis looks back on breakout first year, vows to ‘keep pushing forward’", "url": "https://www.koreaherald.com/article/10844467", "fonte_id": "korea_herald", "data_pub": "2026-08-18T08:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cortis comemorou o primeiro aniversário de seu debut, marcado por atingir marcos recordes como grupo rookie de K-pop. A banda, composta por cinco membros, se estabeleceu como uma unidade autossustentável, criando música, vídeos e coreografias juntos. Eles são conhecidos como a 'Crew dos Criadores Jovens'.", "titulo_pt": "Cortis reflete sobre o primeiro ano de sucesso e promete continuar avançando", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 109317, "titulo": "Innolux posts 4th straight profit, sees consumer display slip in 3Q26", "url": "https://www.digitimes.com/news/a20260817PD225/innolux-profit-display-2026-brand.html", "fonte_id": "digitimes", "data_pub": "2026-08-18T08:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Innolux registrou lucro líquido de NT$4,65 bilhões (US$146,3 milhões) no segundo trimestre de 2026, marcando o quarto trimestre consecutivo de lucro. A fabricante de painéis advertiu que a demanda por exibições pode enfraquecer no terceiro trimestre, devido a pedidos antecipados por clientes de marca no primeiro semestre.", "titulo_pt": "Innolux mantém lucro no quarto trimestre consecutivo, mas vê demanda por exibições se enfraquecer no terceiro trimestre de 2026", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 109191, "titulo": "Chinese company unveils new ‘Superman’ humanoid robot", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/18/chinese-company-unveils-new-superman-humanoid-robot?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-18T08:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma empresa chinesa apresentou um novo robô humanoide que foi comparado ao super-herói Superman. O robô foi revelado recentemente.", "titulo_pt": "Empresa chinesa apresenta novo ‘Superman’ humanoide", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 108637, "titulo": "OpenAI anuncia negócios no Brasil e minimiza risco político com Casa Branca", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/openai-anuncia-negocios-no-brasil-e-minimiza-risco-politico-com-casa-branca.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-18T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O diretor de estratégia da OpenAI, Jason Kwon, afirmou que não é vantajoso para os Estados Unidos restringir o acesso de outros países a modelos de IA avançados. Ele minimizou o risco político com a Casa Branca em relação a essas restrições.", "titulo_pt": "Openai anuncia negócios no Brasil e minimiza risco político com Casa Branca", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 109089, "titulo": "Women are missing out on the AI jobs boom", "url": "https://www.axios.com/2026/08/18/ai-women-jobs-hiring", "fonte_id": "axios", "data_pub": "2026-08-18T07:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dados do LinkedIn mostram que, em 2025, mulheres ocuparam apenas 26% das novas posições em cargos de inteligência artificial nos Estados Unidos, contra 74% de homens. Esses cargos são alguns dos mais bem pagos e em maior crescimento no país, mas a representatividade feminina é baixa.", "titulo_pt": "Mulheres estão sendo deixadas de lado no boom de empregos de IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 109393, "titulo": "Oura takes smart ring rivalry to Samsung’s home market", "url": "https://www.koreaherald.com/article/10844256", "fonte_id": "korea_herald", "data_pub": "2026-08-18T06:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa finlandesa de tecnologia de saúde Oura lançou o Oura Ring 5 no mercado sul-coreano, em 25 de agosto, com um preço mais alto e uma assinatura obrigatória. Isso estabelece uma concorrência direta com o Galaxy Ring da Samsung em um mercado onde os anéis inteligentes ainda não alcançaram a popularidade dos relógios inteligentes.", "titulo_pt": "Oura lança anel inteligente no mercado doméstico da Samsung", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 108780, "titulo": "Function calling: a técnica que permite à IA de fato executar uma tarefa, não só sugerir como fazer", "url": "https://exame.com/inteligencia-artificial/function-calling-a-tecnica-que-permite-a-ia-de-fato-executar-uma-tarefa-nao-so-sugerir-como-fazer/", "fonte_id": "exame", "data_pub": "2026-08-18T06:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A técnica de chamada de função permite que modelos de inteligência artificial interajam com sistemas externos para consultar informações, acionar ferramentas e executar ações com base em comandos em linguagem natural.", "titulo_pt": "Chamada de função: técnica que permite à IA realmente executar uma tarefa, não só sugerir como fazer", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 108783, "titulo": "Pessoas de alta renda se sentiriam seguras com R$ 17 milhões em conta, diz Google", "url": "https://exame.com/invest/minhas-financas/pessoas-de-alta-renda-se-sentiriam-seguras-com-r-17-milhoes-em-conta-diz-google/", "fonte_id": "exame", "data_pub": "2026-08-18T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisa realizada pelo Google revela que pessoas de alta renda considerariam-se seguras com uma conta bancária de R$ 17 milhões. O principal medo desse público é o fracasso que possa levar à queda social.", "titulo_pt": "Pessoas de alta renda se sentiriam seguras com R$ 17 milhões em conta, diz pesquisa", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 109405, "titulo": "STAT+: A pill that mimics exercise? Early results on drug designed to maintain both weight loss and muscle mass", "url": "https://www.statnews.com/2026/08/18/enveda-pill-mimics-exercise-phase-one-trial-leptin-weight-loss-maintenance/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-18T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A biotecnológica coloradense Enveda divulgou resultados preliminares de um medicamento projetado para ajudar as pessoas a manterem a perda de peso após o uso de GLP-1, sem necessariamente recorrerem a exercícios físicos.", "titulo_pt": "Comprimido que imita o exercício? Resultados preliminares de medicamento para manter perda de peso e massa muscular", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 108657, "titulo": "Memória subsiste mesmo 'deletando' 50% das conexões de neurônios", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/memoria-subsiste-mesmo-deletando-50-das-conexoes-de-neuronios.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-18T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas japoneses realizaram experimentos com camundongos e descobriram que, mesmo após a deletagem de cerca de metade das conexões entre os neurônios, as memórias parecem persistir. Essa descoberta tem implicações interessantes para a compreensão do funcionamento da memória no cérebro.", "titulo_pt": "Memória persiste mesmo deletando 50% das conexões de neurônios", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 109434, "titulo": "NRO to expand use of HawkEye 360’s satellite intelligence", "url": "https://spacenews.com/nro-to-expand-use-of-hawkeye-360s-satellite-intelligence/", "fonte_id": "spacenews", "data_pub": "2026-08-18T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O contrato da NRO ampliará o uso de dados de satélite fornecidos pela HawkEye 360, permitindo maior acesso do governo dos Estados Unidos à localização de radares, navios e outros emissores eletrônicos.", "titulo_pt": "NRO vai expandir o uso de inteligência satelital da HawkEye 360", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 109442, "titulo": "Planes flying over the Atlantic will be re-routed to avoid contrails", "url": "https://www.newscientist.com/article/2585091-planes-flying-over-the-atlantic-will-be-re-routed-to-avoid-contrails/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-08-18T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Operação Azul no Céu é o primeiro teste mundial para implementar medidas de evitação de contrails em todo o espaço aéreo, com o objetivo de reduzir o impacto climático das viagens aéreas em uma escala maior.", "titulo_pt": "Voo de avião sobre o atlântico terá rota alterada para evitar contrails", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 109415, "titulo": "How tomato 'golden hour' research could help crops survive heat waves and drought", "url": "https://phys.org/news/2026-08-tomato-golden-hour-crops-survive.html", "fonte_id": "phys_org", "data_pub": "2026-08-18T08:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo identificou um período diário que poderia ajudar na criação de tomates mais resistentes à seca sem comprometer a produtividade. A pesquisa sugere que a chave para culturas resistentes não está na quantidade de água usada pelas plantas, mas no momento em que elas a utilizam.", "titulo_pt": "Pesquisa sobre 'hora dourada' de tomate pode auxiliar culturas a sobreviver a ondas de calor e secas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 109416, "titulo": "Whales spark joy in New York but face threats from boat traffic", "url": "https://phys.org/news/2026-08-whales-joy-york-threats-boat.html", "fonte_id": "phys_org", "data_pub": "2026-08-18T08:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Passageiros entusiasmados de cruzeiros na costa sul de Nova York se dirigem rapidamente para a popa à uma hora: uma baleia-baleeira está à tona, um impressionante avistamento contra o fundo icônico da cidade de Nova York.", "titulo_pt": "Baleias causam espanto em nova York, mas enfrentam ameaças de tráfego marítimo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 109417, "titulo": "Two largest U.S. reservoirs hit record lows amid Western drought", "url": "https://phys.org/news/2026-08-largest-reservoirs-lows-western-drought.html", "fonte_id": "phys_org", "data_pub": "2026-08-18T08:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os dois maiores reservatórios dos Estados Unidos atingiram níveis históricos baixos devido a uma seca severa que afeta a região ocidental do país, conforme dados divulgados no fim de semana.", "titulo_pt": "Dois maiores reservatórios dos EUA atingem níveis históricos baixos durante seca severa no oeste", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 109407, "titulo": "Opinion: 8 steps to making surrogacy more ethical for everyone involved", "url": "https://www.statnews.com/2026/08/18/mckenna-west-surrogacy-laws-ethics/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-18T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo sugere oito passos para tornar a surrogacia mais ética. Arthur Caplan critica a maneira como a surrogacia tem sido gerenciada nos Estados Unidos, usando o caso West como exemplo.", "titulo_pt": "Opinião: 8 passos para tornar a surrogacia mais ética para todos os envolvidos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 109408, "titulo": "Opinion: In parts of the world, antibiotic overuse isn’t the problem — underuse is", "url": "https://www.statnews.com/2026/08/18/antibiotic-underuse-overuse-resistance-aware/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-18T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Peter Beyer, do GARDP, afirma que a resistência antimicrobiana, como o aquecimento global, é um desafio global, mas suas causas e consequências são distribuídas de forma desigual.", "titulo_pt": "Opinião: em partes do mundo, o problema não é o excesso de uso de antibióticos, mas o uso insuficiente", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 109409, "titulo": "STAT+: How health care costs are undermining America’s public-sector employers", "url": "https://www.statnews.com/2026/08/18/public-sector-employees-health-care-costs-out-of-pocket-series-part-4/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-18T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os políticos estão considerando aumentar impostos e cortar benefícios devido ao aumento dos custos de saúde para os funcionários do setor público.", "titulo_pt": "Como os custos de saúde estão ameaçando os empregadores públicos americanos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 109418, "titulo": "Make it rain: Indonesia chases clouds to stem El Niño fires", "url": "https://phys.org/news/2026-08-indonesia-clouds-stem-el-nio.html", "fonte_id": "phys_org", "data_pub": "2026-08-18T08:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Indonésia está tentando dissipar nuvens para combater incêndios causados pelo El Niño na Borneu, que abriga florestas primárias e espécies protegidas. Meteorologista Safillah Anggie Wahyuni espera que essa abordagem possa ser uma solução para o problema.", "titulo_pt": "Chove para combater: indonésia busca nuvens para frear incêndios do El Niño na borneu", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 109419, "titulo": "Each degree of warming could add a month of intolerable heat for 1 billion people", "url": "https://phys.org/news/2026-08-degree-month-intolerable-billion-people.html", "fonte_id": "phys_org", "data_pub": "2026-08-18T08:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo de modelagem dos Estados Unidos publicado em 2023 indica que o risco que as altas temperaturas, causadas pelo aquecimento global, representam para a saúde das pessoas idosas foi subestimado. O estudo sugere que cada grau de aquecimento pode adicionar um mês de calor intolerável para cerca de um bilhão de pessoas.", "titulo_pt": "Cada grau de aquecimento pode adicionar um mês de calor intolerável para um bilhão de pessoas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 109420, "titulo": "A looming rock collapse threatens a Swiss village as thawing permafrost destabilizes the Alps", "url": "https://phys.org/news/2026-08-looming-collapse-threatens-swiss-village.html", "fonte_id": "phys_org", "data_pub": "2026-08-18T08:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma formação rochosa estável que ameaça desmoronar sobre o vilarejo suíço de Kandersteg pode levar a um deslizamento de terra que poderia ser comparado com o desastre que destruiu Blatten próximo a ele no ano anterior. Especialistas atribuem o desmoronamento a derretimento de permafrost e dinâmicas glaciais.", "titulo_pt": "Ameaça de desmoronamento de rochas sobre vila Suíça ameaça com desastre similar ao de blatten", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 109443, "titulo": "Feeding our books into generative AI risks creating a cultural void", "url": "https://www.newscientist.com/article/2584715-feeding-our-books-into-generative-ai-risks-creating-a-cultural-void/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-08-18T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ao alimentar nossos livros, jogos e filmes em modelos de inteligência artificial, existe o risco de substituir nossa história cultural por uma mistura de obras geradas automaticamente. É essencial preservar a escrita humana, afirma a colunista Annalee Newitz.", "titulo_pt": "Alimentar nossos livros em AI pode criar um vazio cultural", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 109444, "titulo": "Physicists may have solved a 30-year mystery over missing neutrinos", "url": "https://www.newscientist.com/article/2584689-physicists-may-have-solved-a-30-year-mystery-over-missing-neutrinos/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-08-18T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde os anos 1990, pesquisadores têm se perguntado se resultados inesperados de detectores de neutrinos baseados em galio indicam uma nova espécie de partícula, mas um novo estudo sugere que revisar seus cálculos poderia explicar o anomalias.", "titulo_pt": "Físicos podem ter resolvido um mistério de 30 anos sobre neutrinos perdidos", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 109315, "titulo": "Hong Kong aiming to revamp heat-stress warning system by end of this month", "url": "https://www.scmp.com/news/hong-kong/society/article/3364388/hong-kong-aiming-revamp-heat-stress-warning-system-end-month?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-18T05:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades de Hong Kong pretendem concluir a reformulação do sistema de alerta de estresse térmico da cidade até o final deste mês, conforme declarado pelo secretário de Trabalho e Bem-Estar, Chris Sun Yuk-han. A decisão foi tomada em resposta a críticas sobre a falta de aumento do nível de alerta durante temperaturas recordes.", "titulo_pt": "Hong Kong busca reformular sistema de alerta de estresse térmico até final deste mês", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 109267, "titulo": "Minecraft workshops build understanding of cityscapes before atomic bombings", "url": "https://www.japantimes.co.jp/news/2026/08/18/japan/students-workshops-cityscapes-atomic-bombings/", "fonte_id": "japan_times", "data_pub": "2026-08-18T09:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Misaki Katayama, uma pós-graduanda de 27 anos da Universidade de Tóquio que pesquisa educação para paz, tem realizado workshops de dois dias em Hiroshima e Nagasaki desde 2023. Estes workshops usam Minecraft para ajudar a compreender as paisagens urbanas antes dos ataques atômicos.", "titulo_pt": "Workshops de minecraft constrzem compreensão sobre paisagens urbanas antes dos bombardeios atômicos em hiroshima e nagasaki", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 109454, "titulo": "Phoebe Bridgers review – high priestess of ambiguity turns grief Technicolor in intimate church show", "url": "https://www.theguardian.com/music/2026/aug/18/phoebe-bridgers-review-union-chapel-london", "fonte_id": "guardian_culture", "data_pub": "2026-08-18T09:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Phoebe Bridgers realizou um show intimista na Union Chapel, em Londres, antes de se apresentar em grandes arenas. Ela tocou algumas das músicas do seu terceiro álbum, Lost Weekend, em um ambiente minimalista, com decoração minimalista e uma TV exibindo um screensaver.", "titulo_pt": "Phoebe Bridgers: alta sacerdotisa da ambiguidade transforma luto em cores intensas em show íntimo na igreja", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 108695, "titulo": "Após excesso em 'Vale Tudo', Globo impõe limite em ações de merchandising nas novelas", "url": "https://redir.folha.com.br/redir/ o crescimento a longo prazo do país.", "titulo_pt": "Violência e desigualdade drenam bilhões do Brasil por ano, aponta estudo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 108396, "titulo": "Problemas de sobredotación, licencias médicas y baja en matrícula: director (s) de Educación Pública detalla estado financiero de los SLEP", "url": "https://www.latercera.com/nacional/noticia/problemas-de-sobredotacion-licencias-medicas-y-baja-en-matricula-director-s-de-la-dep-da-cuenta-del-estado-financiero-de-los-slep/", "fonte_id": "la_tercera", "data_pub": "2026-08-17T21:04:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A matrícula nos SLEP diminuiu 16% entre 2010 e 2025, enquanto a dotação aumentou 7% em docentes e 11% em assistentes de educação nos últimos oito anos.", "titulo_pt": "Problemas de sobredotação, licenças médicas e baixa matrícula: diretores de educação Pública detalham estado financeiro dos SLEP", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 108408, "titulo": "Municipalidad de Independencia se querella contra responsables de explosión de gas que dejó cuatro personas lesionadas", "url": "https://www.latercera.com/nacional/noticia/municipalidad-de-independencia-se-querella-contra-responsables-de-explosion-de-gas-que-dejo-cuatro-personas-lesionadas/", "fonte_id": "la_tercera", "data_pub": "2026-08-17T20:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A prefeitura de Independência apresentou uma queixa para investigar as circunstâncias da ruptura de uma matriz de gás e da explosão subsequente que deixou quatro pessoas feridas.", "titulo_pt": "Prefeitura de independência inicia processo contra responsáveis por explosão de gás que deixou quatro feridos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 108405, "titulo": "Colegios alertan que Junaeb redujo sus raciones de alimentos y organismo lo atribuye a mecanismo habitual de ajuste", "url": "https://www.latercera.co
