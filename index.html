<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

const D = {"gerado_em": "23/11/2026 19:29", "stats": {"noticias_novas": 600, "resumos_gerados": 242}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Lula se reuniu com ministros no Palácio Alvorada para discutir estratégias da Petrobras, que deve apresentar seu novo Plano de Negócios 2027-2031 nesta segunda-feira (23/11). Durante o encontro, Lula recebeu quatro ministros do STF, o presidente do Senado, Rodrigo Alcolumbre, e o líder do governo no Congresso, Ricardo Motta, em um jantar no Alvorada. Isso indica que Lula busca apoio mais firme dos partidos do Centrão para iniciar seu possível quarto mandato. Outro destaque é que a Procuradoria-Geral da República ainda não estabeleceu um prazo para se manifestar sobre os relatórios da Polícia Federal que mencionam ministros do STF no caso Banco Master. Além disso, o governo estabeleceu um prazo de 90 dias para fiscalizar as empresas antes de aplicar multas relacionadas ao fim da escala 6×1, regulamentado por um decreto que, segundo a Advocacia-Geral da União, tornou desnecessária uma liminar concedida ao governador Dino.", "mundo": "O cenário internacional apresenta uma série de eventos significativos. Na América do Sul, o presidente do Catar afirmou que a região não poderá tolerar outro conflito entre EUA e Irã, e que seu país está trabalhando para reativar as negociações de paz. Na Europa, o mercado de ações europeu encerrou em rally, com o índice de Frankfurt avançando 2,15%, enquanto a Bolsa de Milão registrou alta de 0,65%. Em Israel, famílias em Koya foram alvo de tiros, tiveram suas casas incendiadas e foram forçadas a fugir após incursões israelenses. No Canadá, Na'kuset, uma longa-time defensora das comunidades indígenas, está usando suas experiências para impulsionar sua advocacy. No Brasil, a deputada estadual Monica Seixas, do PSOL-SP, foi impedida de entrar na Cisjordânia por Israel e ficou retida no aeroporto por mais de sete horas. Em um evento mais amplo, a Ucrânia afirma ter afundado primeiro uma embarcação militar russa e depois um navio mercante perto de Bengasi, na Líbia, em resposta a ataques russos a navios sancionados. Além disso, o Supremo Tribunal da Espanha concedeu anistia ao líder separatista catalão Carles Puigdemont, encerrando o processo criminal contra ele por sua suposta participação na tentativa de independência fracassada da Catalunha em 2017.\n\nA Ucrânia afundou uma corveta russa em Benghazi, na Líbia, o que aumenta o temor de uma expansão do conflito além do leste europeu. Este incidente ocorreu no porto de Benghazi, onde as duas nações estavam realizando operações conjuntas. Em outro incidente, três navios-pipa explodiram no Estreito de Ormuz após colidirem com minas navais, conforme relatos da mídia iraniana. O Tesouro dos Estados Unidos impôs sanções a mais de duas dúzias de entidades iranianas, acusando-as de tentar interromper as atividades financeiras globais do Irã. A Alemanha está avaliando relatos de inteligência que sugerem que a Rússia pode lançar uma arma nuclear em órbita no próximo mês, o que poderia causar uma rápida perda ou degradação de milhares de satélites. O encontro entre os presidentes da China, Rússia e Estados Unidos, realizado na última quinta-feira, foi criticado por alguns, que observam que a cobertura da mídia dominante pode indicar os interesses dos Estados Unidos e a possibilidade de comprometimento com os objetivos da reunião.", "economia": "O dólar atingiu R$ 6 devido a fortes movimentos na moeda americana no mercado internacional e pressões relacionadas ao ajuste fiscal no Brasil, resultando em uma desvalorização acentuada do real em relação às principais moedas emergentes. Diante disso, o Ministério da Fazenda reduziu a previsão de crescimento do PIB para 2027 para 1,8%, de 2,3% anteriormente, e elevou a estimativa de inflação para 4,5%. Economistas alertam que o governo precisa elaborar um ajuste fiscal mais amplo do que o atual plano Moretti para evitar a estagflação. O CEO do Itaú Unibanco, Milton Maluhy Filho, afirmou que o principal desafio econômico do Brasil é reduzir o custo de capital, considerando que essa redução é necessária para ampliar os investimentos privados, atrair recursos estrangeiros e sustentar o crescimento do país. Além disso, a Amazon está prestes a fechar um acordo de US$ 7,5 bilhões para adquirir a startup Decart, demonstrando o interesse das grandes empresas tecnológicas em expandir suas capacidades em inteligência artificial. A União Europeia também iniciou uma investigação contra a principal engarrafadora de Coca-Cola na Europa por suspeita de abuso de posição dominante, o que poderia levar a preços mais altos para os consumidores.", "tecnologia": "Jensen Huang foi readmitido como CEO da Nvidia, uma decisão que gerou uma forte reação no mercado. As ações da Nvidia subiram 33% e a empresa recuperou quase US$ 1 trilhão em valor de mercado. Paralelamente, as ações da SK hynix negociadas nos Estados Unidos também aumentaram 20%. A campanha para reverter a saída de Huang mobilizou mais de 200 mil pessoas e grandes fundos, fortalecendo seu peso na busca por liderança em inteligência artificial. A decisão presidencial de Donald Trump para garantir a permanência de Huang na empresa também foi um fator crucial, pois estabeleceu um precedente perigoso e fortaleceu os aliados de Huang dentro do governo. No entanto, o retorno de Huang também levantou preocupações de segurança nacional, com o líder minoritário do Senado, Chuck Schumer, advertindo que o Congresso vai buscar respostas independentemente do cargo que Huang ocupe na empresa.", "ciencia": "Um estudo recente identificou quatro variantes raras do DNA associadas à esquizofrenia, promovendo um avanço significativo no entendimento da doença e potenciais novos tratamentos. Em outro desenvolvimento, a Fiocruz, em parceria com o MS e a Universidade de Oxford, está desenvolvendo uma vacina contra o câncer, com a expectativa de iniciar os estudos clínicos no início de 2027. Outros avanços incluem a aprovação de um novo medicamento para o câncer de mama pela Anvisa, além de um estudo que revela a alta eficácia da bactéria Wolbachia em reduzir a capacidade do mosquito Aedes aegypti de transmitir a dengue. O estudo, realizado em Belo Horizonte, contou com a participação de cientistas brasileiros e de universidades norte-americanas. Além disso, a NASA está buscando parceiros para desenvolver o primeiro reator nuclear que fornecerá eletricidade na Lua, um passo crucial para a estabilização humana na superfície lunar.", "cultura": "O escritor mineiro Túlio Pires Bragança ganhou o Prêmio Caminhos de Literatura com seu romance 'Ninguém mata o soberano', que será publicado pela Editora Dublinense. Em outro destaque, o Centro Cultural Banco do Brasil (CCBB) inaugurou sua primeira unidade no Nordeste do Brasil, em Salvador, com uma exposição que homenageia a fundadora do Ilê Aiyê, Mãe Hilda, retratada em uma obra de Antônio Obá. Na área da moda, a Trama Afetiva, plataforma de moda regenerativa, apresentou sua coleção 'Micropolítica do Amor' na 58ª edição da Casa de Criadores, reaproveitando materiais descartados para criar looks inspirados em símbolos da cidade de São Paulo. Entre os lançamentos de livros, o professor Rubens Beçak, da USP, publicou um trabalho que discute a crise da democracia e sugere formas de fortalecer a participação popular. A atriz Jane Fonda, vencedora do Oscar, participa de um documentário sobre a luta contra os combustíveis fósseis, enquanto o ator Stephen Miller, ex-assessor de Trump, é retratado em uma série documental sobre sua educação política. O documentário 'Musk' conquistou grande audiência em 2026, indicando um potencial de crescimento para o cinema de não-ficção.", "sociedade": "Milhares de trabalhadores marcharam por Bruxelas, na Bélgica, contra medidas de austeridade propostas pelo governo em 23 de novembro de 2026, com confrontos levando à utilização de gás lacrimogênio e canhões de água. Em São Paulo, um estudo revelou que quase metade (45,8%) dos domicílios possuem cães ou gatos, com a capital paulista tendo aproximadamente 13 gatos para cada 100 humanos. Outros eventos incluem processos judiciais envolvendo abusos sexuais, homofobia, violência doméstica, falta de medicamentos para doenças raras, e ações de empresas de tecnologia de carros que estão sendo usadas para monitorar ex-esposas sem consentimento.", "meio_ambiente": "A COP31, uma conferência climática global, não chegou a um acordo-chave após 17 anos, marcando o primeiro fracasso de 17 anos em alcançar um acordo. As negociações, co-presididas por Turquia e Austrália, falharam devido a um impasse sobre combustíveis fósseis e apoio a países afetados pela crise climática. No entanto, a COP31 avançou na proteção dos oceanos, com novos investimentos e medidas para a proteção de recifes de coral, lideradas pelo Brasil. O ministro de Taiwan anunciou que o país continuará com o processo de redução do uso de combustíveis fósseis, mantendo a transição energética conforme planejado. As chuvas recentes aumentaram a capacidade dos mananciais de São Paulo para 67%, enquanto a Aguas Andinas inaugurou uma exposição itinerante sobre a história e a recuperação do rio Mapocho, que passa por Santiago. Além disso, um estudo realizado pela Bryant Research e pelo ProVeg indica que um mudança nas refeições do meio-dia para opções vegetarianas no país poderia reduzir as emissões de gases de efeito estufa em 15,4 milhões de toneladas por ano, equivalente às emissões de todos os voos domésticos aterrados, além de economizar cerca de R$ 611 por família anualmente.", "direitos_humanos": "A cantora iraniana Parastoo Ahmadi foi condenada a 74 chicotadas por não usar o véu durante um concerto online, conforme informou seu advogado. Ahmadi e quatro membros de sua equipe enfrentam ainda proibições de viagens e atividades artísticas por dois anos. Este caso reaviva debates sobre liberdade de expressão e direitos humanos no Irã. Além disso, dados vazados revelam que mais de 1.000 militares russos se suicidaram durante a guerra na Ucrânia, com o relatório fornecendo uma visão detalhada das perdas russas no conflito, que chegam a quase 500.000 soldados desde 2022. Em Hong Kong, a Universidade de Hong Kong adiou um curso sobre direitos humanos na China, após o coordenador Fu Hualing anunciar sua saída como decano da escola de direito, embora planeje retomar o curso posteriormente. Estes eventos destacam a diversidade dos desafios enfrentados pelos direitos humanos em diferentes partes do mundo."}, "resumo_do_dia": {"politica_nacional": [{"id": 282710, "titulo": "Leia a íntegra da portaria que regulamenta fim da 6 X 1", "url": "https://www.poder360.com.br/poder-integras/leia-a-integra-da-portaria-que-regulamenta-fim-da-6-x-1/", "fonte_id": "poder360", "data_pub": "2026-11-23T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A portaria regulamenta a diminuição da jornada de trabalho sem redução salarial e determina que o governo irá fiscalizar as empresas nos primeiros 90 dias após a implementação da nova regra.", "titulo_pt": "Leia a íntegra da portaria que regulamenta a redução da jornada de trabalho sem desconto salarial", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 282773, "titulo": "Trivia reassume na quinta (26) controle total de linhas da CPTM após falhas", "url": "https://www.metropoles.com/sao-paulo/trivia-reassume-na-quinta-26-controle-total-de-linhas-da-cptm-apos-falhas", "fonte_id": "metropoles", "data_pub": "2026-11-23T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Trivia Trens reassumiu, na quinta-feira (26), o controle total das linhas da CPTM após falhas. Esta é a segunda tentativa de transferência do serviço à Trivia Trens desde a concessão das linhas 11-Coral, 12-Safira e 13-Jade.", "titulo_pt": "Trivia reassume na quinta (26) controle total de linhas da CPTM após falhas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 282711, "titulo": "Pedidos de rescisão indireta crescem 674% em 5 anos, diz TST", "url": "https://www.poder360.com.br/poder-justica/pedidos-de-rescisao-indireta-crescem-674-em-5-anos-diz-tst/", "fonte_id": "poder360", "data_pub": "2026-11-23T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de pedidos de rescisão indireta na Justiça do Trabalho aumentou 674% em cinco anos, de acordo com dados do TST. De 2020 a 2025, o número passou de 3.560 para 27.558 casos.", "titulo_pt": "Pedidos de rescisão indireta crescem 674% em 5 anos, diz TST", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 282774, "titulo": "Heróis negros dominam tema da abertura do maior evento juridico do mundo", "url": "https://www.metropoles.com/colunas/matheus-leitao/herois-negros-dominam-tema-da-abertura-do-maior-evento-juridico-do-mundo", "fonte_id": "metropoles", "data_pub": "2026-11-23T21:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Heróis negros lideram a abertura da 25ª Conferência Nacional da Advocacia, da OAB, na Bahia.", "titulo_pt": "Heróis negros lideram abertura da 25ª conferência nacional da advocacia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 282776, "titulo": "Lula se reúne com ministros no Alvorada para debater situação da Petrobras", "url": "https://www.metropoles.com/brasil/lula-se-reune-com-ministros-no-alvorada-para-debater-situacao-da-petrobras", "fonte_id": "metropoles", "data_pub": "2026-11-23T21:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Lula se reuniu com ministros no Palácio Alvorada para discutir estratégias da Petrobras. A empresa deve apresentar seu novo Plano de Negócios 2027-2031 nesta segunda-feira (23/11).", "titulo_pt": "Lula se reúne com ministros no Alvorada para debater situação da Petrobras", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 282800, "titulo": "PGR evita cravar prazo sobre relatórios do Caso Master", "url": "https://www.cnnbrasil.com.br/politica/pgr-evita-cravar-prazo-sobre-relatorios-do-caso-master/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-23T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral da República ainda não estabeleceu um prazo para se manifestar sobre os relatórios da Polícia Federal que mencionam ministros do Supremo Tribunal Federal no caso Banco Master.", "titulo_pt": "PGR evita fixar prazo para manifestação sobre relatórios do Caso Master", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 282712, "titulo": "Entidades pedem rejeição de projeto que regula big techs", "url": "https://www.poder360.com.br/poder-congresso/entidades-pedem-rejeicao-de-projeto-que-regula-big-techs/", "fonte_id": "poder360", "data_pub": "2026-11-23T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um grupo de 22 organizações afirmou que o projeto de lei que regula as grandes tecnológicas impõe uma vigilância permanente do Estado e limita as inovações disponíveis aos consumidores.", "titulo_pt": "Organizações pedem rejeição de projeto que regula grandes tecnológicas", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 282721, "titulo": "Orçamento de 2027 do RS avança sob críticas do PT e alerta de risco de atraso nos pagamentos", "url": "https://www.brasildefato.com.br/2026/11/23/orcamento-de-2027-do-rs-avanca-sob-criticas-do-pt-e-alerta-de-risco-de-atraso-nos-pagamentos/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-23T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de orçamento do Rio Grande do Sul para 2027 enfrenta críticas do PT e um alerta sobre o risco de atraso nos pagamentos. O projeto, aprovado por nove votos a três na Comissão de Finanças, aguarda votação em plenário, prevista para 1º de dezembro, mas não cumpriu o prazo regimental para entrar na pauta.", "titulo_pt": "Orçamento de 2027 do RS enfrenta críticas e alerta de risco de atraso nos pagamentos", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 282786, "titulo": "MP recua da acusação de que Virginia lucrava com perdas de apostadores", "url": "https://www.metropoles.com/colunas/manoela-alcantara/mp-recua-da-acusacao-de-que-virginia-lucrava-com-perdas-de-apostadores", "fonte_id": "metropoles", "data_pub": "2026-11-23T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público recuou da acusação de que Virginia ganhava com as perdas dos apostadores. A ação continua sobre a publicidade feita por Virginia.", "titulo_pt": "MP recua da acusação de que Virginia lucrava com perdas de apostadores", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 282807, "titulo": "COP31: inovações não foram bem-sucedidas, mas houve avanços, diz ministro", "url": "https://www.cnnbrasil.com.br/internacional/cop31-inovacoes-nao-foram-bem-sucedidas-mas-houve-avancos-diz-ministro/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-23T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Meio Ambiente e da Mudança do Clima do Brasil, João Paulo Capobianco, afirmou que a COP31 não reforçou os compromissos estabelecidos em conferências anteriores. Houve avanços, mas as inovações propostas não foram bem-sucedidas, segundo Capobianco.", "titulo_pt": "COP31: inovações não foram bem-sucedidas, mas houve avanços, diz ministro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 282787, "titulo": "Ação popular pede liminar para barrar obras de data center em Atibaia", "url": "https://www.metropoles.com/sao-paulo/acao-popular-pede-liminar-para-barrar-obras-de-data-center-em-atibaia", "fonte_id": "metropoles", "data_pub": "2026-11-23T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma ação popular foi promovida em resposta a reportagens publicadas pelo Metrópoles, exigindo a suspensão de possíveis licenças para obras de um data center em Atibaia.", "titulo_pt": "Ação popular pede suspensão de obras de data center em Atibaia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 282929, "titulo": "AGU diz ao STF que decreto sobre fim da escala 6×1 torna liminar de Dino desnecessária", "url": "https://www.jota.info/trabalho/agu-diz-ao-stf-que-decreto-sobre-fim-da-escala-6x1-torna-liminar-de-dino-desnecessaria", "fonte_id": "jota", "data_pub": "2026-11-23T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Advocacia-Geral da União (AGU) informou ao Supremo Tribunal Federal (STF) que o decreto que regulamenta o fim da escala 6×1 tornou a liminar concedida ao governador Dino desnecessária. O órgão defendeu a validade da emenda constitucional e afirmou que a regulamentação resolveu as dúvidas sobre o assunto.", "titulo_pt": "AGU afirma que decreto sobre escala 6×1 torna liminar de Dino desnecessária", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 282789, "titulo": "Deputada do PT se revolta com Damião por abordagem a homem fumando maconha", "url": "https://www.metropoles.com/minas-gerais/deputada-do-pt-se-revolta-com-damiao-por-abordagem-a-homem-fumando-maconha", "fonte_id": "metropoles", "data_pub": "2026-11-23T21:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Álvaro Damião postou um vídeo abordando dois homens que estavam fumando maconha no centro da capital. O prefeito tem sido alvo de críticas por essa abordagem.", "titulo_pt": "Deputada do PT se revolta com Damião por abordagem a homem fumando maconha", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 283000, "titulo": "Fim da 6×1: governo define prazo de 90 dias para fiscalizar empresas antes de aplicar multas", "url": "https://veja.abril.com.br/economia/fim-da-6x1-governo-define-prazo-de-90-dias-para-fiscalizar-empresas-antes-de-aplicar-multas/", "fonte_id": "veja", "data_pub": "2026-11-23T21:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo estabeleceu um prazo de 90 dias para fiscalizar as empresas antes de aplicar multas. Durante esse período, os empregadores serão primeiramente orientados a cumprir as novas regras.", "titulo_pt": "Fim da 6×1: governo define prazo de 90 dias para fiscalizar empresas antes de aplicar multas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 282652, "titulo": "PF quer comprar 3 carros blindados para Lula por R$ 11,4 mi com proteção contra tiro de fuzil", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/pf-quer-comprar-3-carros-blindados-para-lula-por-r-114-mi-com-protecao-contra-tiro-de-fuzil.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-23T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal planeja comprar três carros blindados para a segurança do presidente Lula e outras autoridades visitantes. O custo total do projeto é de R$ 11,4 milhões.", "titulo_pt": "PF quer comprar 3 carros blindados para Lula por R$ 11,4 mi com proteção contra tiros de fuzil", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 283001, "titulo": "Carla Zambelli: como funciona o pedido feito pela defesa da ex-deputada ao STF", "url": stos", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 282949, "titulo": "Australian politics live: Labor to ‘save more than we spend’ in budget update, Chalmers says; rental affordability plummets to 14-year low", "url": "https://www.theguardian.com/australia-news/live/2026/nov/24/labor-penny-wong-us-china-anthony-albanese-final-sitting-week-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-11-23T21:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo australiano, liderado por Jim Chalmers, planeja apresentar um orçamento que irá economizar mais do que gastará. No entanto, isso não será uma atualização orçamentária de cortes drásticos. O orçamento será anunciado com poucos dias de antecedência, como é comum, e a equipe econômica está confiante de que haverá uma economia modesta no final do processo de finalização.", "titulo_pt": "Labor planeja economizar mais do que gastar no orçamento, diz Chalmers; atualização não será de cortes drásticos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 283115, "titulo": "Three tankers explode in Strait of Hormuz", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/three-tankers-explode-strait-hormuz", "fonte_id": "middle_east_eye", "data_pub": "2026-11-23T21:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três navios-pipa explodiram e pegaram fogo no Estreito de Ormuz após colidir com minas navais, segundo relatos da mídia iraniana. O guarda revolucionário iraniano afirmou que a cobertura aérea dos Estados Unidos não impediu os incidentes.", "titulo_pt": "Três navios-pipa explodem no estreito de Ormuz", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 283091, "titulo": "US escalates sanctions on Iran, targets ‘shadow banking’ networks", "url": "https://www.aljazeera.com/news/2026/11/23/us-escalates-sanctions-on-iran-targets-shadow-banking-networks?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-23T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Tesouro dos Estados Unidos impôs sanções a mais de duas dúzias de entidades iranianas, acusando-as de tentar interromper as atividades financeiras globais do Teerã.", "titulo_pt": "EUA intensifica sanções contra Irã, alvo das redes de 'banco sombra'", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 283116, "titulo": "Qatar needs US and Iran to resume talks to end war, PM says", "url": "https://www.middleeasteye.net/news/qatar-needs-us-iran-resume-talks-end-war-pm-says", "fonte_id": "middle_east_eye", "data_pub": "2026-11-23T21:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro do Catar afirmou que a região não poderá tolerar outro conflito entre EUA e Irã, e que seu país está trabalhando para reativar as negociações de paz. Durante uma reunião em Washington, o primeiro-ministro do Catar se encontrou com o secretário de Estado dos EUA, Marco Rubio.", "titulo_pt": "Catar precisa de EUA e Irã para retomar conversas de paz, diz primeiro-ministro", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 282941, "titulo": "The Woman Who Took Canada to Court Over Genocide", "url": "https://www.nytimes.com/2026/11/23/world/canada/nakuset-montreal.html", "fonte_id": "nyt_world", "data_pub": "2026-11-23T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na’kuset é uma longa-time defensora das comunidades indígenas no Canadá, usando suas experiências para impulsionar sua advocacy.", "titulo_pt": "A mulher que leu o canadá à corte sobre genocídio", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 283092, "titulo": "Israel’s southern Syria incursion triggers fear and destruction", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/23/israels-southern-syria-incursion-triggers-fear-and-destruction?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-23T21:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Famílias em Koya foram alvo de tiros, tiveram suas casas incendiadas e foram forçadas a fugir após incursões israelenses.", "titulo_pt": "Incursão israelense no sul da síria causa medo e destruição", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 282676, "titulo": "Deputada de SP tem entrada na Cisjordânia negada por governo de Israel", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/deputada-de-sp-tem-entrada-na-cisjordania-negada-por-governo-de-israel", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-23T21:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada estadual Monica Seixas, do PSOL-SP, foi impedida de entrar na Cisjordânia por Israel e ficou retida no aeroporto por mais de sete horas. Ela viajava para acompanhar a colheita de azeitonas junto com uma comitiva de parlamentares de outros países.", "titulo_pt": "Deputada de SP tem entrada na Cisjordânia negada por Israel", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 282942, "titulo": "Phumzile Mlambo-Ngcuka, South Africa’s First Female Deputy President, Has Died", "url": "https://www.nytimes.com/2026/11/23/world/africa/phumzile-mlambo-ngcuka-dead.html", "fonte_id": "nyt_world", "data_pub": "2026-11-23T21:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Phumzile Mlambo-Ngcuka, a defensora dos direitos das mulheres e da educação, liderou a organização das Nações Unidas para a igualdade de gênero e empoderamento após deixar o cargo político. Ela faleceu aos 71 anos.", "titulo_pt": "Phumzile Mlambo-Ngcuka, primeira vice-presidente feminina da áfrica do sul, faleceu", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 283130, "titulo": "Borsa: l'Europa chiude in rally col ritorno di Huang, Francoforte +2,15%", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/23/borsa-leuropa-chiude-in-rally-col-ritorno-di-huang-francoforte-215_3d5e346a-4a24-4062-86f8-635337483b70.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-23T21:12:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O mercado de ações europeu encerrou em rally, com o índice de Francoforte avançando 2,15%. Parigi subiu 1,48% e Londres, 1,3%. Wall Street também registrou ganhos, mas não foram detalhados no trecho fornecido.", "titulo_pt": "Bolsa: Europa fecha em rally com retorno de Huang, Francoforte +2,15%", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 283129, "titulo": "Borsa: Milano chiude in rialzo (+0,65%) con il ritorno di Huang in Nvidia", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/23/borsa-milano-chiude-in-rialzo-065-con-il-ritorno-di-huang-in-nvidia_02d66c84-b2b7-4183-85a4-fb11e60af267.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-23T21:11:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Bolsa de Milão encerrou em alta de 0,65% com o retorno de Huang para a Nvidia. O Ftse Mib subiu para 49.021 pontos, compensando a queda da cedola de onze títulos negociados.", "titulo_pt": "Bolsa de milão fecha em alta com retorno de Huang na Nvidia", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 283131, "titulo": "Zuppi, no alla violenza nelle piazze ma la sola repressione non educa", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/23/zuppi-no-alla-violenza-nelle-piazze-ma-la-sola-repressione-non-educa_29d387da-3258-4f07-97f9-c1409c869e57.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-23T21:08:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O presidente da Cei enfatizou que a violência nas ruas não é a solução, e que a única repressão não educa. Ele também destacou que muitas vezes a raiva é a expressão de uma sensação de solitariamente sem respostas.", "titulo_pt": "Zuppi: não à violência nas ruas, mas a repressão sozinha não educa", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 282675, "titulo": "Justiça da Espanha anistia líder separatista catalão a uma semana das eleições", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/11/justica-da-espanha-anistia-lider-separatista-catalao-a-uma-semana-das-eleicoes.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-11-23T21:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal da Espanha concedeu anistia ao líder separatista catalão Carles Puigdemont na segunda-feira (23), encerrando o processo criminal contra ele por sua suposta participação na tentativa de independência fracassada da Catalunha em 2017.", "titulo_pt": "Justiça espanhola anistia líder separatista catalão uma semana antes das eleições", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 283132, "titulo": "Delitto del trapano a Genova, carrozziere condannato a 30 anni", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/23/delitto-del-trapano-a-genova-carrozziere-condannato-a-30-anni_ac79c3c2-a372-40ba-837e-1716810ab93c.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-23T21:05:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Um carroceiro foi condenado a 30 anos de prisão no caso do assassinato de uma vítima em Genova. A sentença incluiu uma provisão de 150 mil euros para a filha da vítima.", "titulo_pt": "Caso da serra em Genova: carroceiro condenado a 30 anos e provisão para filha da vítima", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 283035, "titulo": "Mending relationships over the holidays? Considering a truce? NPR wants to know", "url": "https://www.npr.org/2026/11/23/g-s1-155085/holidays-relationships-politics-dispute", "fonte_id": "npr_news", "data_pub": "2026-11-23T20:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NPR está buscando relatos de pessoas que buscam reparar relações que se deterioraram devido a questões políticas ou sociais. Os participantes podem ser convidados para uma possível participação em um segmento futuro do programa All Things Considered.", "titulo_pt": "Reparando relações durante as festas? A NPR quer saber", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 283160, "titulo": "How to Win Big Betting on Jensen Huang? Listen to Trump", "url": "https://www.wired.com/story/how-to-win-big-betting-on-jensen-huang-listen-to-trump/", "fonte_id": "wired", "data_pub": "2026-11-23T21:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Traders de mercados de previsão lucram apostando no retorno do CEO da Nvidia, seguindo a orientação da Casa Branca. Um vencedor afirma que em 2026, Trump é presidente e qualquer escândalo é irrelevante.", "titulo_pt": "Como ganhar grande apostando em Jensen Huang? Ouça Trump", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 282930, "titulo": "CJF recebe até dezembro propostas de enunciados para interpretação do CPC", "url": "https://www.jota.info/justica/cjf-recebe-ate-dezembro-propostas-de-enunciados-para-interpretacao-do-cpc", "fonte_id": "jota", "data_pub": "2026-11-23T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Até dezembro, as propostas de enunciados para a interpretação do CPC serão recebidas. O debate sobre essas sugestões ocorrerá durante a 5ª Jornada de Direito Processual Civil, prevista para março de 2027.", "titulo_pt": "CJF recebe até dezembro propostas de enunciados para interpretação do CPC", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 282689, "titulo": "CVM suspende registro do BRB e de mais quatro empresas", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/cvm-suspende-registro-do-brb-e-de-outras-quatro-empresas", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-23T21:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Comissão de Valores Mobiliários (CVM) suspendeu o registro de companhia aberta do Banco de Brasília (BRB) e de mais quatro empresas por descumprimento das obrigações de divulgação de informações ao mercado por mais de 12 meses.", "titulo_pt": "CVM suspende registro do BRB e de outras quatro empresas", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 282932, "titulo": "Jornada 5×2: portaria do MTE reforça obrigatoriedade de dois dias de descanso por semana", "url": "https://www.jota.info/trabalho/jornada-5x2-portaria-do-mte-reforca-obrigatoriedade-de-dois-dias-de-descanso-por-semana", "fonte_id": "jota", "data_pub": "2026-11-23T21:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A portaria do MTE (Ministério do Trabalho e Emprego) estabelece a obrigatoriedade de dois dias de descanso por semana, permitindo que acordos coletivos compensem essa exigência com uma média mensal de trabalho, sem ultrapassar seis dias seguidos de trabalho.", "titulo_pt": "Portaria do MTE reforça dois dias de descanso semanal com possibilidade de acordo coletivo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 282659, "titulo": "Por que você pode perder dinheiro mesmo quando seu imóvel valoriza?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/11/por-que-voce-pode-perder-dinheiro-mesmo-quando-seu-imovel-valoriza.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-23T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Investir em imóveis é uma prática comum no Brasil para construir patrimônio. No entanto, a valorização do imóvel não garante necessariamente a rentabilidade do investimento, pois existem outros fatores que podem afetar o retorno financeiro.", "titulo_pt": "Por que você pode perder dinheiro mesmo que seu imóvel valorize?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 283163, "titulo": "Consumer sentiment falls for 2nd month in Nov. on stock market correction, high loan rates", "url": "https://en.yna.co.kr/view/AEN20261123008800320", "fonte_id": "yonhap_news", "data_pub": "2026-11-23T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A confiança do consumidor diminuiu pela segunda vez consecutiva em novembro devido a uma correção no mercado de ações e taxas de empréstimo elevadas.", "titulo_pt": "Confiança do consumidor cai pela segunda vez consecutiva em novembro, devido a correção no mercado de ações e taxas de juros altas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 282849, "titulo": "A Braskem estava com a RJ pronta. Um acordo de última hora evitou o pior", "url": "https://braziljournal.com/a-braskem-estava-com-a-rj-pronta-um-acordo-de-ultima-hora-evitou-o-pior", "fonte_id": "brazil_journal", "data_pub": "2026-11-23T20:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os advogados da Braskem estavam prontos para apresentar um pedido de recuperação judicial, pois o prazo de proteção contra execuções terminava na segunda-feira. Um acordo de última hora evitou a necessidade de recuperação judicial.", "titulo_pt": "A Braskem estava com a RJ pronta. Um acordo de última hora evitou o pior", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 282934, "titulo": "Após um ano em vigor, Agora Tem Especialistas não tem instrumentos de controle transparentes", "url": "https://www.jota.info/saude/apos-um-ano-em-vigor-agora-tem-especialistas-nao-tem-instrumentos-de-controle-transparentes", "fonte_id": "jota", "data_pub": "2026-11-23T20:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O programa Agora Tem Especialistas, em vigor há um ano, ainda não possui instrumentos de controle transparentes. Até o momento, apenas 1,3% dos atendimentos alcançaram o teto anual estabelecido.", "titulo_pt": "Agora Tem Especialistas: um ano sem controle transparente", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 282851, "titulo": "CVM suspende registro do BRB, envolvido no caso Master", "url": "https://www.dw.com/pt-br/cvm-suspende-registro-do-brb-envolvido-no-caso-master/a-80026799?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-23T20:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A CVM suspendeu o registro do BRB em resposta a empresas que não divulgaram informações obrigatórias ao mercado por mais de um ano. O banco enfrenta investigações sobre suas operações com o grupo de Daniel Vorcaro.", "titulo_pt": "CVM suspende registro do BRB envolvido em caso Master", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 282662, "titulo": "Economistas veem risco de estagflação e pedem ajuste fiscal além do plano Moretti", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/economistas-veem-risco-de-estagflacao-e-pedem-ajuste-fiscal-alem-do-plano-moretti.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-23T20:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Economistas alertam que o governo precisa elaborar um ajuste fiscal mais amplo do que o atual plano Moretti para evitar a estagflação. A inflação elevada e a economia estagnada são os principais riscos apontados.", "titulo_pt": "Economistas pedem ajuste fiscal além do Moretti para evitar estagflação", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 282664, "titulo": "Após perder mercado agrícola, Trump busca gerar entraves ao Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/vaivem/2026/11/apos-perder-mercado-agricola-trump-busca-gerar-entraves-ao-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-23T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Trump continua buscando meios para recuperar o mercado agrícola perdido, especialmente contra o Brasil, utilizando táticas como a pressão sobre as Filipinas para que elas se desfaçam de contratos com o país. O Brasil continua sendo alvo das ações do presidente americano, que busca compensar perdas no mercado internacional devido à sua política comercial.", "titulo_pt": "Trump busca novos meios para recuperar mercado agrícola perdido contra o Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 282665, "titulo": "Custo de capital é o principal desafio para crescimento do Brasil, diz CEO do Itaú", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/custo-de-capital-e-o-principal-desafio-para-crescimento-do-brasil-diz-ceo-do-itau.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-23T19:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CEO do Itaú Unibanco, Milton Maluhy Filho, afirmou que o principal desafio econômico do Brasil é reduzir o custo de capital, considerando que essa redução é necessária para ampliar os investimentos privados, atrair recursos estrangeiros e sustentar o crescimento do país.", "titulo_pt": "Custo de capital é o principal desafio para o crescimento do Brasil, segundo CEO do Itaú", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 282666, "titulo": "Venda de minas de níquel brasileiras à China preocupa indústria da União Europeia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/11/venda-de-minas-de-niquel-brasileiras-a-china-preocupa-industria-da-uniao-europeia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-23T19:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A indústria europeia pediu à União Europeia que imponha condições rigorosas ao grupo Anglo American, que pretende vender minas de níquel brasileiras a uma empresa controlada pelo governo chinês.", "titulo_pt": "Venda de minas de níquel brasileiras à China preocupa indústria da União Europeia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 282691, "titulo": "Fazenda reduz previsão do PIB e eleva inflação para 2027", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/fazenda-reduz-previsao-do-pib-e-eleva-inflacao-para-2027", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-23T19:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Fazenda reduziu a previsão de crescimento do PIB para 2027 para 1,8%, de 2,3% anteriormente, e elevou a estimativa de inflação para 4,5%, superando o limite da meta.", "titulo_pt": "Fazenda reduz projeção de PIB e eleva estimativa de inflação para 2027", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 282937, "titulo": "Atalho, freio, ponte, juro", "url": "https://www.jota.info/opiniao-e-analise/artigos/atalho-freio-ponte-juro", "fonte_id": "jota", "data_pub": "2026-11-23T19:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Além da proposta de Lara Resende, existem outras duas sugestões em discussão. A história demonstra que o Brasil não sempre adotou o que era considerado o padrão dominante.", "titulo_pt": "Atalho, freio, ponte, juro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 282938, "titulo": "Crédito da CBS: quem paga a conta quando o fornecedor não paga?", "url": "https://www.jota.info/coberturas-especiais/pulso-da-reforma/credito-da-cbs-quem-paga-a-conta-quando-o-fornecedor-nao-paga", "fonte_id": "jota", "data_pub": "2026-11-23T19:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Receita federal anunciou uma estimativa que aliviou temporariamente as finanças da CBS na estreia do trimestre, mas não esclareceu quem será responsável se o fornecedor não pagar.", "titulo_pt": "Crédito da receita: quem paga a conta quando o fornecedor não paga?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 282995, "titulo": "Nvidia recupera quase US$ 1 tri em valor de mercado após retorno de Huang", "url": "https://veja.abril.com.br/economia/nvidia-recupera-quase-us-1-tri-em-valor-de-mercado-apos-retorno-de-huang/", "fonte_id": "veja", "data_pub": "2026-11-23T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações da Nvidia subiram 31,5% e alcançaram seu maior ganho diário de valor da história. A empresa recuperou quase US$ 1 trilhão em valor de mercado após o retorno de seu fundador, Jen-Hsun Huang.", "titulo_pt": "Nvidia recupera quase r$ 1 trilhão em valor de mercado após retorno de Huang", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 282660, "titulo": "Trump teria articulado retorno de Jensen Huang ao comando da Nvidia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/trump-teria-articulado-retorno-de-jensen-huang-ao-comando-da-nvidia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-23T20:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang foi reconduzido ao cargo de presidente-executivo da Nvidia após uma série de articulações de Donald Trump, ao longo de vários dias, para garantir ao conselho de administração que Huang não era alvo de acusações criminais e não representava um risco à segurança nacional.", "titulo_pt": "Trump teria articulado retorno de Jensen Huang ao comando da Nvidia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 282818, "titulo": "Empresa de Musk é processada nos EUA pela criação de imagens sexualizadas", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/empresa-de-musk-e-processada-nos-eua-pela-criacao-de-imagens-sexualizadas/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-23T20:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa de Musk foi processada nos EUA por criar imagens sexualizadas usando a IA Grok, que gerou imagens a partir de fotografias, incluindo de crianças.", "titulo_pt": "Empresa de Musk é processada nos EUA por criação de imagens sexualizadas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 283146, "titulo": "Claude AI can review pull requests and ship fixes on its own now", "url": "https://www.theverge.com/ai-artificial-intelligence/1040134/anthropic-claude-ship-ai-pull-requests", "fonte_id": "the_verge", "data_pub": "2026-11-23T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Anthropic lançou novas funcionalidades do Claude AI para auxiliar engenheiros de software a enviar código. Agora, o Claude pode revisar, corrigir e aprovar pedidos de fusão.", "titulo_pt": "Claude AI pode agora revisar e enviar correções de pedidos de fusão sozinho", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 283063, "titulo": "\"Too big to fail\": The economic fear behind Jensen Huang's Nvidia comeback", "url": "https://www.axios.com/2026/11/23/trump-vance-jensen-huang-nvidia-ceo-return", "fonte_id": "axios", "data_pub": "2026-11-23T19:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Trump pressionou a Nvidia a readmitir Jensen Huang como CEO após aliados argumentarem que ele era 'demasiado importante para falhar' para a economia dos Estados Unidos e vítima de manobras da 'deep state'. Essa intervenção presidencial fortaleceu os aliados de Huang dentro do governo e colocou em situação incômoda aqueles que criticavam a empresa.", "titulo_pt": "Demasiado importante para falhar: o medo econômico por trás do retorno de Jensen Huang à Nvidia", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 283161, "titulo": "The Feds Left Iowans in the Dark About Plans to Blow Up Tons of Lead", "url": "https://www.wired.com/story/the-feds-left-iowans-in-the-dark-about-plans-to-blow-up-tons-of-lead/", "fonte_id": "wired", "data_pub": "2026-11-23T18:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Força Armada dos Estados Unidos planeja detonar 9.500 libras de azido de chumbo em uma instalação de armas em Iowa. Autoridades locais afirmam que obtiveram a maioria das informações através de um comunicado à imprensa.", "titulo_pt": "Autoridades locais em iowa saberam pouco sobre os planos de detonar toneladas de chumbo", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 282751, "titulo": "IA generativa chega a 53% da população mundial em três anos, aponta Stanford", "url": "https://exame.com/inteligencia-artificial/ia-generativa-chega-a-53-da-populacao-mundial-em-tres-anos-aponta-stanford/", "fonte_id": "exame", "data_pub": "2026-11-23T18:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Stanford University indica que a adoção de inteligência artificial gerativa atingiu 53% da população mundial em apenas três anos. O relatório aborda dados sobre adoção, investimento e desempenho de agentes de IA, destacando áreas onde ainda há deficiências em preparo profissional, políticas escolares e uso empresarial em larga escala.", "titulo_pt": "IA gerativa chega a 53% da população mundial em três anos, aponta Stanford", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 282754, "titulo": "Como o Vale do Silício se mobilizou para devolver a Nvidia a Jensen Huang", "url": "https://exame.com/mundo/como-o-vale-do-silicio-se-mobilizou-para-devolver-a-nvidia-a-jensen-huang/", "fonte_id": "exame", "data_pub": "2026-11-23T17:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha mobilizou mais de 200 mil pessoas e grandes fundos para reverter a saída do fundador da Nvidia, Jensen Huang, fortalecendo o peso do CEO na busca por liderança em inteligência artificial.", "titulo_pt": "Como o Vale do Silício se mobilizou para manter Jensen Huang na Nvidia", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 282133, "titulo": "CrowdStrike to buy Zscaler in $44 billion deal as AI supercharges cyberattacks", "url": "https://www.cnbc.com/2026/11/23/crowdstrike-zscaler-aquisition-ai-cyberattacks.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-23T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A CrowdStrike está adquirindo o Zscaler por 44 bilhões de dólares. A competição na área tem investido bilhões para fortalecer as defesas diante das ameaças cibernéticas impulsionadas por inteligência artificial.", "titulo_pt": "Crowdstrike adquire Zscaler por 44 bilhões de dólares enquanto competidores investem bilhões em defesas contra ameaças de IA", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 282755, "titulo": "Treinamento de IA para empresas: por onde começar a capacitar líderes e equipes", "url": "https://exame.com/blog-saint-paul/treinamento-de-ia-para-empresas-por-onde-comecar-a-capacitar-lideres-e-equipes/", "fonte_id": "exame", "data_pub": "2026-11-23T17:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O treinamento de inteligência artificial para empresas deve focar nos aspectos humanos, não apenas nas ferramentas. É necessário capacitar diretoria, gestores e equipes sobre os conceitos e impactos da IA.", "titulo_pt": "Treinamento de IA para empresas: por onde começar a capacitar líderes e equipes", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [{"titulo": "Huang readmitido como CEO da Nvidia", "sumario": "Huang foi readmitido como CEO da Nvidia. As ações da SK hynix negociadas nos Estados Unidos subiram 20% após a reinstalação de Huang como CEO da Nvidia. Jensen Huang, fundador da Nvidia há 30 anos, deixou a empresa em 12 de novembro após admitir ter sido 'infiel' a sua esposa.", "artigos": [{"id": 282274, "titulo": "Huang reinstated as Nvidia CEO", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/24/2003868271", "fonte_id": "taipei_times", "data_pub": "2026-11-24T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Huang foi readmitido como CEO da Nvidia. Não há informações adicionais sobre as razões ou detalhes específicos desta reinstalação.", "titulo_pt": "Huang readmitido como CEO da Nvidia", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 283162, "titulo": "(2nd LD) SK hynix's U.S.-traded shares surge 20 pct after Huang's reinstatement as Nvidia CEO", "url": "https://en.yna.co.kr/view/AEN20261124000252315", "fonte_id": "yonhap_news", "data_pub": "2026-11-23T21:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da SK hynix negociadas nos Estados Unidos subiram 20% após a reinstalação de Huang como CEO da Nvidia.", "titulo_pt": "Ações da SK hynix nos EUA ganham 20% após Huang ser readmitido como CEO da Nvidia", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 283148, "titulo": "How Jensen Huang ended up as Nvidia CEO again", "url": "https://www.theverge.com/tech/1040428/nvidia-jensen-huang-ceo-return", "fonte_id": "the_verge", "data_pub": "2026-11-23T19:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang, fundador da Nvidia há 30 anos, deixou a empresa em 12 de novembro após admitir ter sido 'infiel' a sua esposa. Sua era na Nvidia quase chegou ao fim.", "titulo_pt": "Como Jensen Huang se tornou novamente CEO da Nvidia", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}]}, {"titulo": "Jensen Huang volta", "sumario": "Jensen Huang voltou em uma situação que agitou os mercados e levantou preocupações de segurança nacional. O intervir de Trump para reestabelecer o chefe da Nvidia estabelece um precedente perigoso. Jensen Huang retornou à empresa e as ações da Nvidia subiram.", "artigos": [{"id": 283015, "titulo": "Jensen Huang Is Back", "url": "https://foreignpolicy.com/2026/11/23/nvidia-reinst
