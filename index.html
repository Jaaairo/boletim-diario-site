Além disso, houve uma combinação inesperada com o 'Guernica' de Picasso.", "titulo_pt": "Como ser cancelado no mundo da arte", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 81579, "titulo": "Flo wall light by Soktas", "url": "https://www.dezeen.com/2026/07/30/flo-wall-light-soktas-dezeen-showroom/", "fonte_id": "dezeen", "data_pub": "2026-07-30T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A marca de design australiana Soktas lançou uma luminária mural escultórica com um abajur de vidro fluido montado em uma placa metálica. Intendida para uso em quartos, banheiros e áreas de estar, ela projeta uma suave luz que se acumula na parede ao redor.", "titulo_pt": "Luminária mural flo lançada pela Soktas", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 81580, "titulo": "Industrial-style technology museum set to be built in Bengaluru", "url": "https://www.dezeen.com/2026/07/30/bengaluru-museum-innovation-startup-technology/", "fonte_id": "dezeen", "data_pub": "2026-07-30T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estão sendo planejados um museu de tecnologia e inovação em Bengaluru, Índia, por uma consortium de arquitetos liderado pela Heneghan Peng Architects. O museu incluirá um hub de inovação e uma galeria exibitiva.", "titulo_pt": "Museu de tecnologia e inovação planejado para ser construído em Bengaluru", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 81611, "titulo": "How Christian Europe Learned to Fear the Forest—and the Beasts Within", "url": "https://lithub.com/how-christian-europe-learned-to-fear-the-forest-and-the-beasts-within/", "fonte_id": "lithub", "data_pub": "2026-07-30T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na Idade Média inicial, os europeus começaram a associar conceitos bíblicos da selva à floresta local, refletindo uma percepção crescente de que as florestas eram assustadoras. Europa não é um continente desértico, mas essa ideia foi formada no contexto do ambiente natural europeu.", "titulo_pt": "Como a Europa cristã aprendeu a temer à floresta—e aos monstros que nela habitavam", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 80855, "titulo": "'Quem Ama Cuida' aumenta cenas com improviso de atores após pedido de diretora", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/07/quem-ama-cuida-aumenta-cenas-com-improviso-de-atores-apos-pedido-de-diretora.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-07-30T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Walcyr Carrasco permitiu que atores e atrizes da novela 'Quem Ama Cuida' possam adicionar improvisos ao texto escrito por ele e Claudia Souto. Diferentemente do passado recente, a diretora pediu mais liberdade para os artistas na interpretação dos personagens.", "titulo_pt": "Diretora de 'quem Ama Cuida' aumenta improvisação nos atores", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 81567, "titulo": "‘I had a really crippling break’: how author Michael Thomas lost 20 years to mania, depression and more", "url": "https://www.theguardian.com/books/2026/jul/30/i-had-a-really-crippling-break-how-author-michael-thomas-lost-20-years-to-mania-depression-and-more", "fonte_id": "guardian_culture", "data_pub": "2026-07-30T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2006, o romance 'Man Gone Down' fez Michael Thomas famoso e ele ganhou um prêmio de €100.000. No entanto, após esse sucesso inicial, a vida não foi fácil para ele, pois esperava produzir um segundo livro em um ano, mas isso não aconteceu.", "titulo_pt": "Eu tive uma paralisação realmente devastadora: como o autor Michael Thomas perdeu 20 anos para mania, depressão e mais", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 81571, "titulo": "How Harlan Coben became the king of potboiler TV", "url": "https://www.theguardian.com/tv-and-radio/2026/jul/30/how-harlan-coben-became-the-king-of-potboiler-tv", "fonte_id": "guardian_culture", "data_pub": "2026-07-30T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Harlan Coben se tornou o rei dos thrillers de TV com sua série mais recente 'I Will Find You' no Netflix. A plataforma está atualmente dominada por séries antigas, todas lançadas há quatro a seis anos.", "titulo_pt": "Como Harlan Coben se tornou o rei dos thrillers de TV", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 81115, "titulo": "Was Florentine friars’ fatigue-fighting elixir a precursor to Coca-Cola?", "url": "https://www.theguardian.com/world/2026/jul/30/italian-elixir-coca-cola-precursor", "fonte_id": "guardian_world", "data_pub": "2026-07-30T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um documento do século 19, descoberto por um freio italiano no arquivo de uma antiga convento em Florença, descreve uma pocição medicinal feita com folhas de coca boliviana e castanhas-de-café. O documento sugere que o elixir poderia ter sido um precursor da famosa refrigerante americana Coca-Cola.", "titulo_pt": "Documeno do século 19 pode ter sido precursor da Coca-Cola?", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 81568, "titulo": "‘They played noughts and crosses on the PM’s huge forehead!’ An Indian standup picks his favourite gen Z protest memes", "url": "https://www.theguardian.com/culture/2026/jul/30/india-gen-z-protests-cockroach-memes-modi", "fonte_id": "guardian_culture", "data_pub": "2026-07-30T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor, com 16 anos de experiência no standup comedy na Índia, observa como os geração Z estão usando memes para protestar e engajar politicamente. Eles criaram vídeos engraçados baseados em notícias políticas e usaram memes para se defenderem durante confrontos com a polícia.", "titulo_pt": "Eles jogavam xadrez no rosto do PM gigante! Um comediante indiano seleciona seus memes favoritos da geração Z", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 81569, "titulo": "‘Give respect to Africa and the bush people’: Mulatu Astatke on pioneering Ethio-jazz and honouring his roots", "url": "https://www.theguardian.com/music/2026/jul/30/ethio-jazz-mulatu-astatke-interview-music-mulatu-plays-mulatu-album", "fonte_id": "guardian_culture", "data_pub": "2026-07-30T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mulatu Astatke, considerado o pai do Ethio-jazz, enfrentou resistência quando apresentou sua música na década de 1960. Agora com 82 anos, ele continua explorando novas direções e busca reconhecimento para os artistas indígenas africanos.", "titulo_pt": "Dê respeito a áfrica e aos povos do mato: mulatu Astatke sobre o pioneirismo do Ethio-jazz e homenagem às raízes", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 81500, "titulo": "They counted themselves out. Deutsche Oper Berlin did not", "url": "https://www.koreaherald.com/article/10826027", "fonte_id": "korea_herald", "data_pub": "2026-07-30T06:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kim Geon, Choi Young e Roh Min-hyung são baixos classificados e têm altura superior a 180 centímetros. Eles têm cerca de 30 anos e foram estudantes de ópera na Universidade Nacional de Seul, mas todos chegaram à conclusão de que não eram bons o suficiente para cantar em papelagens pagas, levando-os a considerarem alternativas para seus futuros carreiras.", "titulo_pt": "Eles se contabilizaram como insuficientes. Deutsche Oper Berlin não", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 81110, "titulo": "Archibald prize 2026: portrait of Jewish leader after Bondi t : "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 80646, "titulo": "A interminável saga do imposto seletivo", "url": "https://veja.abril.com.br/coluna/luiz-gustavo-bichara/a-interminavel-saga-do-imposto-seletivo/", "fonte_id": "veja", "data_pub": "2026-07-29T22:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo tem enfrentado dificuldades para aprovar a lei que define as alíquotas do novo imposto seletivo, o que tem gerado incertezas sobre quando ele passará a ser cobrado.", "titulo_pt": "A interminável saga do imposto seletivo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 80698, "titulo": "Barracas de ambulantes são destruídas por ventos no Rio de Janeiro", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/rj/barracas-de-ambulantes-sao-destruidas-por-ventos-no-rio-de-janeiro/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T22:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Barracas de ambulantes foram derrubadas por ventos fortes na Zona Oeste do Rio de Janeiro, deixando produtos espalhados pelas vias. Moradores registraram a situação.", "titulo_pt": "Barracas de ambulantes são destruídas por ventos no Rio de Janeiro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 80315, "titulo": "Sobe para 3 o número de mortos por ventania que causou estragos em SP", "url": "https://www.metropoles.com/sao-paulo/mortos-ventania-causou-estragos-em-sp", "fonte_id": "metropoles", "data_pub": "2026-07-29T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma ventania com rajadas de 111 km/h atingiu São Paulo, causando três mortes, derrubando árvores e gerando destelhamentos. O Gabinete de Crise foi montado para lidar com a situação.", "titulo_pt": "Número de mortos por ventania em SP sobe para 3", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 81297, "titulo": "Hundreds evacuated as wildfires sweep Turkey's western and southern coasts", "url": "http://www.euronews.com/2026/07/30/hundreds-evacuated-as-wildfires-sweep-turkeys-western-and-southern-coasts", "fonte_id": "euronews", "data_pub": "2026-07-30T08:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Centenas de pessoas foram evacuadas e estradas fechadas nas regiões costeiras ocidentais e sul do Turquia devido a incêndios ativos em distritos como Kaş e Muğla, que se espalharam para seis províncias sob o efeito do calor extremo.", "titulo_pt": "Centenas evacuadas por incêndios na costa ocidental e sul do Turquia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 81287, "titulo": "How firefighters and volunteers supported by water planes imposed a major setback to the Gironde fire as it was about to swallow more homes", "url": "https://www.lemonde.fr/en/environment/article/2026/07/30/how-firefighters-and-volunteers-supported-by-water-planes-imposed-a-major-setback-to-the-gironde-fire-as-it-was-about-to-swallow-more-homes_6755990_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-30T08:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O incêndio na região de Gironde, no sul da França, avançou rapidamente para uma área residencial. No entanto, com a ajuda dos bombeiros e moradores locais, juntamente com o apoio do ar, foi possível conter o fogo no último momento.", "titulo_pt": "Bombeiros e voluntários com auxílio de aviões de água impuseram um forte revés ao incêndio na Gironde", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 81301, "titulo": "Germany heatwave sees Cologne residents cool off in mist", "url": "http://www.euronews.com/video/2026/07/30/germany-heatwave-sees-cologne-residents-cool-off-in-mist", "fonte_id": "euronews", "data_pub": "2026-07-30T06:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Colônia, Alemanha, os moradores se refrescam com chuveiros públicos enquanto as temperaturas chegam a 35°C. Os níveis baixos do Rio Rin reflectem o impacto da estação seca.", "titulo_pt": "Calor intenso em colônia: moradores se refrescam com chuveiros públicos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 80978, "titulo": "As hidrelétricas estão preparadas para os eventos climáticos extremos?", "url": "https://exame.com/esg/as-hidreletricas-estao-preparadas-para-os-eventos-climaticos-extremos/", "fonte_id": "exame", "data_pub": "2026-07-30T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As usinas hidrelétricas dependem de um cálculo que considera o pior cenário climático possível, ignorando probabilidades mais comuns. Este método é crucial para garantir a operação das usinas mesmo em eventos extremos.", "titulo_pt": "As hidrelétricas estão preparadas para os eventos climáticos extremos?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 81351, "titulo": "War and shortages push Gaza hospitals to breaking point", "url": "https://www.aljazeera.com/features/2026/7/30/war-and-shortages-push-gaza-hospitals-to-breaking-point?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-30T05:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O sistema de saúde no Gaza está colapsando, deixando pacientes com diálise, amputados e sobreviventes de lesões graves sem cuidados essenciais.", "titulo_pt": "Guerra e escassezes empurram hospitais do Gaza para o ponto crítico", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 80880, "titulo": "Efeitos do El Niño no Brasil vão além dos alimentos e devem atingir energia, transportes e varejo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/efeitos-do-el-nino-no-brasil-vao-alem-dos-alimentos-e-devem-atingir-energia-transportes-e-varejo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório da XP Investimentos indica que os efeitos do El Niño no Brasil podem ultrapassar o aumento de preços dos alimentos, afetando também a geração de energia, transporte e varejo. A pressão sobre esses setores é resultado das dificuldades na pecuária e plantio de grãos, em um cenário de juros altos e custos elevados.", "titulo_pt": "Efeitos do El Niño no Brasil vão além dos alimentos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 80654, "titulo": "Vendaval no Rio de 100 km/h deixa ao menos 2 mortos e um desaparecido", "url": "https://www.metropoles.com/brasil/vendaval-no-rio-de-100-km-h-deixa-ao-menos-2-mortos-e-um-desaparecido", "fonte_id": "metropoles", "data_pub": "2026-07-29T22:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um vendaval no Rio de Janeiro atingiu velocidades superiores a 100 km/h, causando ao menos duas mortes e deixando uma pessoa desaparecida. O evento levou à paralisação do metrô e dos aeroportos na cidade.", "titulo_pt": "Vendaval no Rio de 100 km/h deixa ao menos 2 mortos e um desaparecido", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 80353, "titulo": "Ventos acima de 100 km/h causam destruição e apagão no RJ; veja imagens", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/rj/ventos-acima-de-100-km-h-causam-destruicao-e-apagao-no-rj-veja-imagens/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma frente fria intensificou os ventos acima de 100 km/h, causando destruição e levando a apagões no Rio de Janeiro. Foram registradas 30 ocorrências atendidas pelos bombeiros e uma paralisação parcial dos trens e metrô.", "titulo_pt": "Ventos acima de 100 km/h causam destruição e apagão no RJ; veja imagens", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 79383, "titulo": "Rio é contaminado e captação de água proibida após explosão de caminhão em GO", "url": "https://www.metropoles.com/distrito-federal/entorno/rio-e-contaminado-e-captacao-de-agua-proibida-apos-explosao-de-caminhao-em-go", "fonte_id": "metropoles", "data_pub": "2026-07-29T20:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Houve uma explosão envolvendo um caminhão que transportava químicos perigosos na cidade de Professor Jamil, Goiás. Como resultado, a captação de água foi proibida e a empresa foi notificada para conter os danos ambientais.", "titulo_pt": "Rio é contaminado e captação de água proibida após explosão com caminhão em GO", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 79848, "titulo": "More than half of England 'officially in drought', UK Environment agency says", "url": "http://www.euronews.com/2026/07/29/more-than-half-of-england-officially-in-drought-uk-environment-agency-says", "fonte_id": "euronews", "data_pub": "2026-07-29T18:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais da metade da Inglaterra está oficialmente em estado de seca, segundo o Agência Ambiental do Reino Unido. O órgão relata baixos níveis nos rios, colheitas antecipadas por agricultores e aumento do risco de incêndios florestais, além de milhões de pessoas vivendo sob restrições no uso d'água.", "titulo_pt": "Mais da metade da inglaterra está oficialmente em seca", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 79654, "titulo": "Australians value batteries and EVs, but renewables industry must earn trust of regions, summit told", "url": "https://www.theguardian.com/australia-news/2026/jul/30/australians-value-batteries-and-evs-but-renewables-industry-must-earn-trust-of-regions-summit-told", "fonte_id": "guardian_world", "data_pub": "2026-07-29T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um levantamento sobre a transição para energias limpas na Austrália revelou que os australianos valorizam baterias e veículos elétricos, mas o setor de renováveis precisa ganhar a confiança das regiões. Campanhas organizadas contra energia eólica e solar foram particularmente eficazes em diminuir o apoio comunitário para essas tecnologias.", "titulo_pt": "Austrália valoriza baterias e veículos elétricos, mas setor de renováveis precisa ganhar confiança das regiões", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 79656, "titulo": "Bird flu is spreading locally and Australia faces more wildlife deaths. How bad could it get?", "url": "https://www.theguardian.com/world/2026/jul/30/bird-flu-australia-h5n1-how-will-it-affect-wildlife", "fonte_id": "guardian_world", "data_pub": "2026-07-29T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades confirmaram a transmissão local do vírus da gripe aviária H5N1 entre aves na Austrália do Sul, indicando um novo estágio no enfrentamento à infecção. O ministério da Agricultura, Pesca e Floresta anunciou 11 novas detecções suspeitas.", "titulo_pt": "Gripe aviária h5n1 se espalha localmente na austrália do sul; país entra em nova fase", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 80131, "titulo": "World falling short on 22 of 23 nature targets for 2030, says draft UN report", "url": "https://www.carbonbrief.org/world-falling-short-on-22-of-23-nature-targets-for-2030-says-draft-un-report", "fonte_id": "carbon_brief", "data_pub": "2026-07-29T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório preliminar da ONU indica que o mundo não atingirá 22 de seus 23 objetivos ambientais para 2030. A meta global de conter e revertar a perda da natureza até 2030 não será alcançada a menos que as ações dos países se acelerem.", "titulo_pt": "Mundo falha em 22 de 23 objetivos ambientais para 2030, diz relatório preliminar da ONU", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 80132, "titulo": "Climate change is driving a ‘shift’ in childhood malaria risk across Africa", "url": "https://www.carbonbrief.org/climate-change-is-driving-a-shift-in-childhood-malaria-risk-across-africa", "fonte_id": "carbon_brief", "data_pub": "2026-07-29T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As altas temperaturas estão redistribuindo o risco de malária infantil na África subsaariana, criando áreas de 'novo risco'. Este fenômeno é impulsionado pelo aquecimento global.", "titulo_pt": "Mudanças climáticas estão provocando uma 'relocalização' do risco de malária infantil na áfrica subsaariana", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 79961, "titulo": "15 elephants die from suspected poisoning in Kenyan park", "url": "https://www.scmp.com/news/world/africa/article/3362295/15-elephants-die-suspected-poisoning-kenyan-park?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-29T13:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ao menos 15 elefantes morreram devido a uma suspeita de intoxicação no Parque Nacional Amboseli, na região sul do Quênia, entre 24 de junho e 24 de julho. O Serviço de Vida Selvagem da Quênia (KWS) relatou que 10 dos animais apresentavam sintomas semelhantes.", "titulo_pt": "Pelo menos 15 elefantes morrem por suspeita de intoxicação em parque nacional do quênia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 79855, "titulo": "France veterinary team treats pets of wildfire evacuees", "url": "http://www.euronews.com/video/2026/07/29/france-veterinary-team-treats-pets-of-wildfire-evacuees", "fonte_id": "euronews", "data_pub": "2026-07-29T12:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time de veterinários francês em Bordeaux está cuidando dos animais domésticos dos evacuados das chamas no Gironde, fornecendo comida, tratamento e apoio enquanto as famílias aguardam para retornar para suas casas.", "titulo_pt": "Equipe veterinária francesa auxilia pets de evacuados por incêndios no gironde", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 81336, "titulo": "Apartheid wealth cannot buy silence on Gaza", "url": "https://www.aljazeera.com/opinions/2026/7/30/apartheid-wealth-cannot-buy-silence-on-gaza?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-30T09:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As universidades sul-africanas devem resistir aos doadores que usam poder financeiro para impor obediência política. O título traduzido é: A riqueza do apartheid não pode comprar silêncio sobre Gaza.", "titulo_pt": "A riqueza do apartheid não pode comprar silêncio sobre Gaza", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 81441, "titulo": "Malaysia’s ‘shocking’ deal to return 5,000 Rohingya to Myanmar triggers refoulement fears", "url": "https://www.scmp.com/week-asia/people/article/3362390/malaysias-shocking-deal-return-5000-rohingya-myanmar-triggers-refoulement-fears?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-30T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Malásia afirma que Myanamar concordou em receber 5.000 rohingyas, o que gerou esperança de alívio no sistema de refugiados do país, mas também alarme entre ativistas sobre os riscos de retornar um grupo perseguido a um local ainda em conflito.", "titulo_pt": "Acordo da malásia para devolver 5.000 rohingyas ao myanamar gera temores sobre refoulement", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 81388, "titulo": "He helped China repress Uyghurs. He says he’s a victim, too.", "url": "https://www.japantimes.co.jp/news/2026/07/30/asia-pacific/politics/china-uyghurs-victim/", "fonte_id": "japan_times", "data_pub": "2026-07-30T08:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Zhang Yabo, ex-oficial da polícia, descreveu Xinjiang como uma grande prisão que aprisiona não apenas inúmeros uigures inocentes 'mas também os espíritos de quem é ordenado a executar essa política.'", "titulo_pt": "Ele ajudou a reprimir uigures em xinjiang. Agora ele se diz vítima, também.", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 81481, "titulo": "Vietnamese massacre victims file 2nd petition with S. Korea's truth commission", "url": "https://en.yna.co.kr/view/AEN20260730009800315", "fonte_id": "yonhap_news", "data_pub": "2026-07-30T07:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vitimados e parentes dos falecidos da suposta chacina apresentaram uma segunda petição à Comissão de Verdade da Coreia do Sul. O evento ocorreu em Seul no dia 30 de julho.", "titulo_pt": "Vítimas de massacre vietnamita apresentam segundo pedido à comissão de verdade sul-coreana", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 81449, "titulo": "Taiwanese man jailed for 12 years in final case of beleaguered Hong Kong judge", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3362367/taiwanese-man-jailed-12-years-amid-embattled-hong-kong-judges-last-case?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-30T07:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem taiwanês foi condenado a mais de 12 anos de prisão por tráfico de cocaína para Hong Kong há sete anos, no último caso julgado pelo juiz Wilson Chan Ka-shun antes de sua aposentadoria antecipada. O juiz, que enfrentava críticas devido à sua prática recorrente de plágio judicial, realizou essa sentença em seu último dia trabalhando na corte.", "titulo_pt": "Homem da tailândia condenado a 12 anos por tráfico de drogas no último julgamento do juiz combatido de Hong Kong", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 81409, "titulo": "U.N. says human trafficking into Asian scam centers is surging", "url": "https://www.japantimes.co.jp/news/2026/07/30/ esistir.", "titulo_pt": "Na prisão, descobri que presos e guardas éramos vítimas de uma cúpula que mantém Cuba sequestrada': o artista renomado que passou 5 anos encarcerado", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 79900, "titulo": "Photo of Israeli soldiers posing next to blindfolded Palestinian fuels anger online", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/photo-israeli-soldiers-posing-next-blindfolded-palestinian-fuels-anger", "fonte_id": "middle_east_eye", "data_pub": "2026-07-29T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma foto viral de duas soldadas israelenses posando ao lado de um palestiniano cego gerou indignação na internet. A imagem, publicada no Instagram pessoal de uma ex-soldada israelense, mostra as soldadas sorrindo perto de um jovem palestiniano sentado com a cabeça baixa.", "titulo_pt": "Foto de soldados israelenses posando ao lado de palestiniano cego faz furor na internet", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 79780, "titulo": "UN High Commissioner for Human Rights: 'In Lebanon, victims need to speak out and have their voices validated'", "url": "https://www.lemonde.fr/en/international/article/2026/07/29/un-high-commissioner-for-human-rights-in-lebanon-victims-need-to-speak-out-and-have-their-voices-validated_6755972_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-29T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Volker Türk, Alto Comissário das Nações Unidas para os Direitos Humanos, visitou o Líbano em julho para discutir violações ocorridas durante a guerra entre Israel e Hezbollah, perspectivas de justiça para as vítimas e preocupações sobre a retirada da Força Interina das Nações Unidas no Líbano prevista para o final de 2026.", "titulo_pt": "Alto comissário das nações unidas para os direitos humanos: 'no líbano, vítimas precisam se manifestar e ter suas vozes reconhecidas'", "veiculo const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}

         }).join("")}

    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;

  const drillId = "drill-" + (++drillCounter);

    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">

      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>

    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>

    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
