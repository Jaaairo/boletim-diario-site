 operações policias causam danos pesados e duradouros aos negócios hispânicos em L.A.", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 71408, "titulo": "Half a year of terror for Mexico’s press", "url": "https://english.elpais.com/international/2026-07-25/half-a-year-of-terror-for-mexicos-press.html", "fonte_id": "elpais_en", "data_pub": "2026-07-25T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde janeiro, sete jornalistas foram assassinados no México, aumentando os ataques diretos a veículos de mídia locais e repórteres. Somente um caso teve prisões efetuadas.", "titulo_pt": "Metade do ano de terror para a imprensa mexicana", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 71499, "titulo": "Seven & i abandons investment talks with Poland’s Zabka", "url": "https://www.japantimes.co.jp/business/2026/07/25/companies/seveni-investment-zabka/", "fonte_id": "japan_times", "data_pub": "2026-07-25T03:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Seven & i decidiu abandonar as negociações de investimento com a Zabka da Polônia, pois não foi possível chegar a um acordo que fosse 'em melhores interesses' da empresa e dos acionistas.", "titulo_pt": "Seven & i abandona negociações de investimento com Zabka da polônia", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 71083, "titulo": "Embraer fecha 2° trimestre com carteira de US$ 34,5 bilhões, alta de 16%", "url": "https://www.cnnbrasil.com.br/economia/negocios/embraer-fecha-2-trimestre-com-carteira-de-us-345-bilhoes-alta-de-16/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-25T01:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Embraer encerrou o segundo trimestre com uma carteira de encomendas avaliada em 34,5 bilhões de dólares, representando um crescimento de 16% em comparação com o período anterior. Durante este trimestre, a empresa entregou 65 aviões, divididos entre 20 do segmento comercial e 45 executivos.", "titulo_pt": "Embraer fecha 2° trimestre com carteira de r$ 34,5 bilhões, alta de 16%", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 71084, "titulo": "Etanol é mais competitivo que gasolina em 10 estados e no DF, diz ANP", "url": "https://www.cnnbrasil.com.br/economia/macroeconomia/etanol-e-mais-competitivo-que-gasolina-em-10-estados-e-no-df-diz-anp/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-25T00:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O etanol é mais competitivo que a gasolina em 10 estados brasileiros e no Distrito Federal, segundo dados da ANP. Na média dos postos pesquisados no Brasil, o etanol apresentou paridade de 61,37%.", "titulo_pt": "Etanol é mais barato que gasolina em 10 estados e DF, diz ANP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 71429, "titulo": "GLP-1s are changing US healthcare, should everyone be on them?", "url": "https://www.aljazeera.com/video/newsfeed/2026/7/25/glp-1s-are-changing-us-healthcare-should-everyone-be-on-them?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-25T00:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os medicamentos GLP-1, originalmente desenvolvidos para o tratamento da diabetes e agora amplamente utilizados na perda de peso, estão transformando a saúde no Estados Unidos.", "titulo_pt": "GLP-1s estão mudando o cenário da saúde nos EUA", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 70703, "titulo": "TIER lifts GDP forecast to 10.38 percent", "url": "https://www.taipeitimes.com/News/biz/archives/2026/07/25/2003861326", "fonte_id": "taipei_times", "data_pub": "2026-07-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A TIER elevou sua previsão do PIB para 10,38%. Sem mais detalhes disponíveis sobre o contexto ou a justificativa dessa revisão, não há informações adicionais para incluir no resumo.", "titulo_pt": "TIER aumenta projeção do pib para 10,38%", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 71505, "titulo": "Yen’s worst week since May brings it close to ¥165 vs. dollar", "url": "https://www.japantimes.co.jp/business/2026/07/25/markets/yen-worst-week-165/", "fonte_id": "japan_times", "data_pub": "2026-07-24T23:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O iene atingiu um novo baixo nível de 40 anos, chegando perto do patamar de ¥165 por dólar após registrar uma cotação recorde de ¥163,99 na quinta-feira.", "titulo_pt": "Iene registra sua pior semana desde maio e se aproxima de ¥165 contra o dólar", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 70953, "titulo": "Dólar fica estável em R$ 5,08, mas cai 0,58% na semana", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-07/dolar-fica-estavel-em-r-508-mas-cai-058-na-semana", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-07-24T23:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar encerrou a sexta-feira estável frente ao real, cotado a R$ 5,081, após uma semana de queda de 0,58%. A bolsa teve uma baixa de mais de 1,5% influenciada pela desvalorização do petróleo.", "titulo_pt": "Dólar mantém estabilidade em R$ 5,08, mas cai 0,58% na semana", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 70954, "titulo": "Receita prevê arrecadar R$ 17,2 bilhões com IR sobre dividendos", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-07/receita-preve-arrecadar-r-172-bilhoes-com-ir-sobre-dividendos", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-07-24T22:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Receita Federal prevê arrecadar R$ 17,2 bilhões com o Imposto de Renda sobre dividendos este ano. Este valor é inferior à projeção inicial de R$ 28 bilhões no Orçamento.", "titulo_pt": "Receita projeta arrecadar R$ 17,2 bilhões com IR sobre dividendos", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 71405, "titulo": "Moody's says 'unprecedented' AI spending threatens credit quality of Amazon, Meta, Alphabet and others", "url": "https://www.cnbc.com/2026/07/24/moodys-ai-spending-credit-quality-amazon-meta-alphabet.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-24T22:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Moody's afirma que o gasto inédito com inteligência artificial está forçando até as empresas mais cash-riche do mundo a recorrerem pesadamente a dívidas, vendas de ações e movimentos fora do balanço. A agência de rating destaca que esta tendência ameaça a qualidade creditícia dessas corporações, incluindo Amazon, Meta e Alphabet.", "titulo_pt": "Moody's diz que gasto inédito com IA ameaça qualidade creditícia de grandes empresas", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 70898, "titulo": "EUA negam pedido de licença bancária da Wise por falha em combate à lavagem de dinheiro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/eua-negam-pedido-de-licenca-bancaria-da-wise-por-falha-em-combate-a-lavagem-de-dinheiro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-24T22:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Wise teve seu pedido de licença bancária nos Estados Unidos negado pelos reguladores por falhas nas verificações antilavagem de dinheiro e falta de compreensão da legislação bancária.", "titulo_pt": "EUA rejeitam pedido de licença bancária da Wise por falha em combate à lavagem de dinheiro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 70955, "titulo": "Subsídio de R$ 0,35 ao diesel não será retomado, diz ministro", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-07/subsidio-de-r-035-ao-diesel-nao-sera-retomado-diz-ministro", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-07-24T22:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Planejamento e Orçamento, Bruno Moretti, informou que o governo não pretende retomar a subvenção de R$ 0,35 por litro ao diesel, mesmo com o petróleo se aproximando novamente dos US$ 100 por barril. A decisão é baseada na avaliação de que ainda não há impacto suficiente nos preços internos para justificar a medida.", "titulo_pt": "Subsidio de R$ 0,35 ao diesel não será retomado, diz ministro", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 70900, "titulo": "Tarifas de Trump atingem 47,3% das exportações brasileiras para os EUA, diz governo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/tarifas-de-trump-atingem-473-das-exportacoes-brasileiras-para-os-eua-diz-governo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-24T21:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula estima que 47,3% das exportações brasileiras para os EUA serão afetadas pelas novas tarifas impostas pela administração de Donald Trump, após a implementação de uma tarifa de 12,5%.", "titulo_pt": "Tarifas de Trump atingem 47,3% das exportações brasileiras para os EUA, afirma governo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 70996, "titulo": "Com novo tarifaço, sobretaxas dos Estados Unidos atingem 47% das exportações do Brasil", "url": "https://veja.abril.com.br/economia/com-novo-tarifaco-sobretaxas-dos-estados-unidos-atingem-47-das-exportacoes-do-brasil/", "fonte_id": "veja", "data_pub": "2026-07-24T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A nova tarifa de 12,5% dos Estados Unidos atinge 23% das exportações brasileiras para o país. Outras sanções em vigor elevam ainda mais a proporção de produtos afetados.", "titulo_pt": "Com novo tarifaço, sobretaxas dos EUA atingem 47% das exportações do Brasil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 70998, "titulo": "Anafitra critica EUA por usar combate ao trabalho escravo para aplicar novo tarifaço ao Brasil", "url": "https://veja.abril.com.br/politica/anafitra-critica-eua-por-usar-combate-ao-trabalho-escravo-para-aplicar-novo-tarifaco-ao-brasil/", "fonte_id": "veja", "data_pub": "2026-07-24T21:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anafitra criticou os argumentos técnicos apresentados pelo governo Trump para justificar o novo tarifaço ao Brasil, relacionado ao combate ao trabalho escravo. A entidade considera que as justificativas não estão bem fundamentadas.", "titulo_pt": "Anafitra critica EUA por usar combate ao trabalho escravo como argumento para novo tarifaço no Brasil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 71485, "titulo": "Paramount agrees extensive delay in Warner Bros deal after states’ lawsuit", "url": "https://www.ft.com/content/95cad892-7933-441a-bc82-c39b1a225835?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-24T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Paramount e a Warner Bros. acordaram uma extensa prorrogação do processo de fusão até junho de 2027, após um litígio dos estados. O acordo foi congelado até que o tribunal avalie as objeções à união das duas empresas.", "titulo_pt": "Paramount e Warner Bros. Acordam extensa prorrogação do processo de fusão após ação judicial", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 71000, "titulo": "Ibovespa desvaloriza mais de 1% devido a preocupações com cenário fiscal brasileiro", "url": "https://veja.abril.com.br/economia/ibovespa-desvaloriza-mais-de-1-devido-a-preocupacoes-com-cenario-fiscal-brasileiro/", "fonte_id": "veja", "data_pub": "2026-07-24T21:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibovespa, principal índice da B3, desvalorizou mais de 1%. O dólar operava próximo à estabilidade durante o mesmo período.", "titulo_pt": "Ibovespa cai mais de 1% devido a preocupações com cenário fiscal brasileiro", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 71481, "titulo": "AI’s quest for morality", "url": "https://www.ft.com/content/bdb3b820-905b-431e-82c0-386535755af1", "fonte_id": "financial_times", "data_pub": "2026-07-25T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A indústria está buscando a ajuda de teólogos e filósofos, mas lhes está fazendo perguntas equivocadas.", "titulo_pt": "A busca da moralidade pela IA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 71545, "titulo": "89 fabs by 2030, 50 more by 2035: chip industry spreads risk through global collab", "url": "https://www.digitimes.com/news/a20260723PD229/infrastructure-taiwan-investment-manufacturing-demand.html", "fonte_id": "digitimes", "data_pub": "2026-07-25T03:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A indústria de semicondutores está planejando a construção de cerca de 89 fábricas até 2030 e mais 50 entre 2030 e 2035 para atender à demanda crescente por chips de inteligência artificial. Estima-se que os investimentos em infraestrutura de IA alcancem níveis sem precedentes, elevando a produção global de semicondutores acima dos US$1 trilhão em 2026 e expandindo o mercado para US$1,5 trilhão até 2030.", "titulo_pt": "89 Fábricas até 2030 e mais 50 entre 2030 e 2035: indústria de semicondutores se expande globalmente", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 71546, "titulo": "Trumpf's stabilizing sales point to a broader recovery in industrial demand", "url": "https://www.digitimes.com/news/a20260723PD225/demand-revenue-sales-industrial-business.html", "fonte_id": "digitimes", "data_pub": "2026-07-25T03:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas da Trumpf se estabilizaram nos resultados preliminares do exercício fiscal 2025/26, após vários anos de declínio nas encomendas e receita. A empresa, fabricante alemã de laser e equipamentos para fabricação inteligente, registrou uma receita ligeiramente maior e encomendas superiores às expectativas, indicando que a demanda pode estar se recuperando em seus principais mercados e linhas de negócio.", "titulo_pt": "Estabilização das vendas da trumpf sugere recuperação na demanda industrial", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 71547, "titulo": "PlayNitride bets on Tantium architecture, chip scaling to cut MicroLED costs 75% by 2030", "url": "https://www.digitimes.com/news/a20260723PD224/playnitride-2030-technology-production-efficiency.html", "fonte_id": "digitimes", "data_pub": "2026-07-25T03:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A PlayNitride, com sede na Taiwan, planeja reduzir os custos de produção de MicroLED em 75% até 2030 através da miniaturização dos chips e do uso de sua arquitetura proprietária Tantium. A empresa visa expandir a adoção dessa tecnologia em eletrônicos consumidores, exibições para veículos, dispositivos AR e interconexões ópticas.", "titulo_pt": "Playnitride aposta na arquitetura Tantium e na escala dos chips para reduzir custos de produção de MicroLED em 75% até 2030", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 71548, "titulo": "Qualcomm expands Galaxy AI partnership as Samsung adopts Snapdragon across new device lineup", "url": "https://www.digitimes.com/news/a20260724PD207/galaxy-qualcomm-snapdragon-samsung-smart-glasses.html", "fonte_id": "digitimes", "data_pub": "2026-07-25T03:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Qualcomm está expandindo a parceria com a linha Galaxy da Samsung, com os últimos smartphones dobráveis, relógios inteligentes e óculos inteligentes next-generation todos equipados com processadores Snapdragon. Este movimento destaca o crescente foco das duas empresas em inteligência artificial localizada e experiências interconectadas sem fio.", "titulo_pt": "Qualcomm amplia parceria Galaxy AI com adoção de Snapdragon em novos dispositivos da Samsung", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 71549, "titulo": "Exclusive: Rapidus links 2nm chips, HBM and advanced packaging in AI foundry strategy", "url": "https://www.digitimes.com/news/a20260724VL214/rapidus-2nm-manufacturing-hbm-packaging.html", "fonte_id": "digitimes", "data_pub": "2026-07-25T03:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Rapidus está considerando a tecnologia de embalagem avançada como parte central da sua estratégia para fábricas de 2nm, não apenas como um serviço de montagem downstream. A empresa planeja conectar diversos aspectos do processo de design, fabricação e testes através do seu modelo de Integração Inovadora para Fabricação (IIM-1).", "titulo_pt": "Rapidus integra embalagens avançadas em sua estratégia de fábrica de 2nm", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 71570, "titulo": "Singapore’s young workers cling to side hustles to survive the AI age: ‘it’s exhausting’", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3361820/singapores-young-workers-cling-side-hustles-survive-ai-age-its-exhausting?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-25T03:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Adele Lee, de 32 anos, trabalha como assistente pessoal durante o dia e realiza vendas de roupas usadas nas noites de terça a quinta-feira através das transmissões ao vivo do TikTok. Essas atividades adicionais geram cerca de R$1.560 por ano, ajudando-a a cobrir seus gastos extras como as parcelas de seguros.", "titulo_pt": "Jovens trabalhadores em singapura se agarram a microempreendimentos para sobreviver à era da IA: 'é cansativo'", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 71593, "titulo": "Lee’s AI power dinner over fish and chips", "url": "https://www.koreaherald.com/article/10819920", "fonte_id": "korea_herald", "data_pub": "2026-07-25T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente sul-coreano Lee Jae Myung jantou com líderes de algumas das empresas tecnológicas mais valiosas do mundo na sexta-feira à noite, em um restaurante casual em São Francisco popular entre moradores locais e pesquisadores de IA. Estavam presentes CEOs e executivos de empresas como Nvidia, Broadcom e Microsoft, além do vice-presidente sênior da Samsung e do presidente do grupo SK.", "titulo_pt": "Almoço de poder de lee com líderes de AI em san francisco", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 71550, "titulo": "Taiwan's chip partnerships widen beyond fabs to AI, photonics and quantum", "url": "https://www.digitimes.com/news/a20260723VL208/taiwan-photonics-semiconductor-industry-2026-investment.html", "fonte_id": "digitimes", "data_pub": "2026-07-25T02:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A indústria de semicondutores da Taiwan está expandindo suas parcerias além das fábricas para incluir áreas como IA, fotônica e quântica. As colaborações com os EUA, Europa e Ásia estão se aprofundando em pacotes avançados, infraestrutura de IA, pesquisa, talentos, segurança cibernética e padrões internacionais.", "titulo_pt": "Parcerias da taiwan na indústria de semicondutores se alargam para AI, fotônica e quântica", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 71551, "titulo": "Taiwan scholars see rising pressures in joint civilian-military research", "url": "https://www.digitimes.com/news/a20260723PD232/academia-sinica-president-technology-security-military.html", "fonte_id": "digitimes", "data_pub": "2026-07-25T02:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tsu-Jae Liu, presidente da Academia Nacional de Engenharia e acadêmica da Academia Sinica, destaca a crescente pressão para integrar pesquisas civis e militares, devido à entrelaçamento entre segurança econômica e segurança nacional em face das preocupações geopolíticas que estão mudando.", "titulo_pt": "Taiwanos identificam aumento da pressão na integração de pesquisa civil-militar", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 71552, "titulo": "Valeo's drone-motor deal pulls a car-parts giant into France's defense-sovereignty push", "url": "https://www.digitimes.com/news/a20260723VL207/valeo-france-automotive-europe-supplier.html", "fonte_id": "digitimes", "data_pub": "2026-07-25T02:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de tecnologia para defesa Harmattan AI escolheu o fornecedor automotivo Valeo para desenvolver e produzir um motor elétrico para drones em França. Este contrato inicial sinaliza duas mudanças maiores: as montadoras europeias estão reutilizando seu conhecimento sobre eletrificação para a defesa, e a região está correndo para proteger suas cadeias de suprimentos de drones das ameaças externas, especialmente raras terras magnéticas.", "titulo_pt": "Acordo entre valeo e harmattan ai impulsiona carros de guerra europeus", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 71402, "titulo": "SpaceX launches massive Starship rocket in first test flight since IPO", "url": "https://www.cnbc.com/2026/07/24/spacex-launches-massive-starship-rocket-in-first-test-flight-since-ipo.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-25T02:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "SpaceX está realizando o primeiro voo de teste do seu foguete Starship desde a oferta pública inicial (IPO) da empresa há um mês. O voo é parte das verificações finais antes do lançamento comercial previsto para o futuro.", "titulo_pt": "Spacex realiza primeiro voo de teste do Starship desde IPO", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 71595, "titulo": "Nvidia, SK to announce $500 billion partnership, Jensen Huang says", "url": "https://www.koreaherald.com/article/10819890", "fonte_id": "korea_herald", "data_pub": "2026-07-25T02:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Nvidia, Jensen Huang, anunciou que a empresa e o grupo sul-coreano SK Group vão revelar parcerias de negócios com valor superior a 500 bilhões de dólares. No entanto, não foram fornecidos detalhes sobre como esse número foi calculado ou qual será o período envolvido.", "titulo_pt": "Nvidia e SK anunciarão parceria de mais de 500 bilhões de dólares, diz Huang", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 71598, "titulo": "Lee’s San Francisco declaration casts Korea as hub for building, using and sharing AI", "url": "https://www.koreaherald.com/article/10819860", "fonte_id": "korea_herald", "data_pub": "2026-07-25T01:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Lee Jae Myung apresentou a Declaração de San Francisco sobre IA, posicionando a Coreia do Sul como um centro crucial para o desenvolvimento, utilização e compartilhamento da IA. Sua visão enxerga a Coreia como um local onde a IA é construída, implementada rapidamente e levada a novos mercados, com desenvolvimento responsável e centrado no ser humano transformando seus benefícios em oportunidades para todos.", "titulo_pt": "Declaração de San Francisco sobre AI reafirma papel central da Coreia do sul na economia global de IA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 71599, "titulo": "Nvidia chief pledges massive investment, cooperation with S. Korea in meeting with Lee", "url": "https://www.koreaherald.com/article/10819850", "fonte_id": "korea_herald", "data_pub": "2026-07-25T00:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente sul-coreano Lee Jae Myung se reuniu com o CEO da Nvidia, Jensen Huang, durante o qual Huang anunciou uma série de projetos de cooperação com empresas tecnológicas sul-coreanas, incluindo uma parceria comercial de US$ 500 bilhões com a SK Group. A reunião faz parte da visita de dois dias do presidente à Califórnia para promover investimentos e colaborações em inteligência artificial entre gigantes globais de tecnologia e o sul-coreano.", "titulo_pt": "Ceo da nvidia anuncia parceria de us$ 500 bilhões com Coreia do sul", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 71502, "titulo": "SpaceX conducts first successful Starship test flight since going public", "url": "https://www.japantimes.co.jp/business/2026/07/25/tech/spacex-starship-test-flight-ipo/", "fonte_id": "japan_times", "data_pub": "2026-07-25T00:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX realizou com sucesso a 13ª lançamento de teste do Starship, demonstrando novamente as modificações de voo sem problemas.", "titulo_pt": "Spacex realiza primeiro voo de teste bem-sucedido do Starship desde sua divulgação", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 71604, "titulo": "Prize honors discovery of altermagnetism as a third fundamental class of magnetism", "url": "https://phys.org/news/2026-07-prize-honors-discovery-altermagnetism-fundamental.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Prêmio Eurofísico da Divisão de Materiais Condensados da Sociedade Europeia de Física foi concedido a Professor Jairo Sinova, Dr. Libor Šmejkal e Professor Tomas Jungwirth por sua descoberta do altermagnetismo, uma nova classe fundamental de magnetismo ainda não conhecida.", "titulo_pt": "Prêmio homenageia descoberta do altermagnetismo como terceira classe fundamental de magnetismo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 71644, "titulo": "SpaceX's Starship megarocket makes the 'softest splashdown' ever after launching next-gen Starlink satellites in Flight 13 test (video)", "url": "https://www.space.com/space-exploration/launches-spacecraft/spacexs-starship-megarocket-makes-the-softest-splashdown-ever-after-launching-next-gen-starlink-satellites-in-flight-13-test-video", "fonte_id": "space_com", "data_pub": "2026-07-25T01:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX lançou o Starship, o foguete mais poderoso do mundo, em uma teste crucial na 13ª viagem de teste em 24 de julho. O voo foi um grande sucesso e terminou com um impressionante pouso suave.", "titulo_pt": "Starship, o foguete mais potente do mundo, realiza a 'pousada mais suave' na 13ª viagem de teste após lançar satélites Starlink (vídeo)", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 71605, "titulo": "Research sheds light on migration, lifestyle, health and social status in the medieval metropolis Ypers", "url": "https://phys.org/news/2026-07-migration-lifestyle-health-social-status.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T01:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Vrije Universiteit Brussel estão participando de uma exposição verão chamada wONDERLAND no Museu de Ypres. Através de pesquisas interdisciplinares em mais de mil ossos exumados, eles conseguiram dar um rosto e voz aos cidadãos medievais anônimos após séculos.", "titulo_pt": "Pesquisa ilumina migração, estilo de vida, saúde e status social na metrópole medieval de ypres", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 70698, "titulo": "Experts suggest methods to reduce oil health risks", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/07/25/2003861361", "fonte_id": "taipei_times", "data_pub": "2026-07-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos sugeriram métodos para reduzir os riscos à saúde associados ao óleo. Os especialistas apresentaram várias estratégias que podem ser implementadas para mitigar os impactos negativos do óleo na saúde humana.", "titulo_pt": "Experts sugerem métodos para reduzir riscos de saúde relacionados ao óleo", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 71606, "titulo": "Smarter, greener ways to protect fragile cultural heritage", "url": "https://phys.org/news/2026-07-smarter-greener-ways-fragile-cultural.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Organizações que preservam patrimônio cultural, como museus e bibliotecas, enfrentam o desafio de conservar objetos feitos com materiais que se deterioram naturalmente.", "titulo_pt": "Maneiras mais inteligentes e sustentáveis para proteger o patrimônio cultural frágil", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 71508, "titulo": "Japan’s average life expectancy rises in 2025", "url": "https://www.japantimes.co.jp/news/2026/07/25/japan/science-health/japan-life-expectancy-rises-2025/", "fonte_id": "japan_times", "data_pub": "2026-07-24T23:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A esperança de vida média dos homens no Japão aumentou para 81,35 anos em 2025, um aumento de 0,25 ano em comparação com o ano anterior. Para as mulheres, a expectativa de vida foi de 87,33 anos, crescendo em 0,2 ano.", "titulo_pt": "A esperança de vida média no Japão aumenta em 2025", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 71509, "titulo": "Japan identifies large share of rare earths in deep-sea mud off remote island", "url": "https://www.japantimes.co.jp/business/2026/07/25/economy/japan-rare-earths-mud-minamitorishima/", "fonte_id": "japan_times", "data_pub": "2026-07-24T23:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma análise do sedimento marinho perto da ilha de Minamitorishima identificou que elementos rares médios e pesados representam cerca de 54% do conteúdo total de raros-terrestres encontrados. Essa descoberta foi feita pelo Japão.", "titulo_pt": "Japão identifica grande parte de elementos rares no sedimento marinho perto da ilha remota minamitorishima", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 71607, "titulo": "Wound odors may unlock better traps for flesh-eating New World screwworm", "url": "https://phys.org/news/2026-07-wound-odors-flesh-world-screwworm.html", "fonte_id": "phys_org", "data_pub": "2026-07-24T22:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jessica Metcalf, professora da Universidade Estatal do Colorado, estuda o odor de feridas para desenvolver melhores armadilhas contra um parasita que causa necrose em animais. Seus trabalhos podem auxiliar na proteção de rebanhos e fauna selvagem.", "titulo_pt": "Odores de feridas podem desbloquear armadilhas mais eficazes contra parasitas carnívoros", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 70877, "titulo": "Lula cobra pressão de cientistas contra 'orçamento apertado' e pede projeto convincente", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/07/lula-cobra-pressao-de-cientistas-contra-orcamento-apertado-e-pede-projeto-convincente.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-07-24T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula pediu aos cientistas que pressionem para aumentar os investimentos do governo federal em pesquisa e educação. Ele fez esse pedido durante uma reunião na tarde desta sexta-feira (24).", "titulo_pt": "Lula cobra pressão de cientistas por aumento de investimentos em pesquisa e educação", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 71629, "titulo": "One of NASA’s crucial links to deep space is at risk of burning down", "url": "https://www.newscientist.com/article/2581311-one-of-nasas-crucial-links-to-deep-space-is-at-risk-of-burning-down/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-07-24T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Deep Space Network, que é a principal forma de comunicação com naves espaciais além da órbita terrestre, está em risco de ser afetado por um incêndio florestal próximo ao seu uma das estações localizadas no mundo.", "titulo_pt": "Uma das conexões cruciais da NASA para o espaço profundo está em perigo de ser destruída por um incêndio", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 71301, "titulo": "The ticks are winning", "url": "https://www.vox.com/climate/496736/ticks-lyme-alpha-gal-syndrome", "fonte_id": "vox", "data_pub": "2026-07-24T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os carrapatos estão se expandindo pelos Estados Unidos devido ao aquecimento global, mudanças na utilização do solo e aumento da população de cervos. Eles têm se espalhado para áreas novas e infectado mais pessoas com doenças como a doença de Lyme e a síndrome Alfa gal que causa alergia à carne de mamíferos.", "titulo_pt": "Os carrapatos estão vencendo", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 71608, "titulo": "Long-lived ytterbium states could sharpen quantum computing and atomic clocks", "url": "https://phys.org/news/2026-07-ytterbium-states-sharpen-quantum-atomic.html", "fonte_id": "phys_org", "data_pub": "2026-07-24T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Amsterdã e da Universidade de Nova Gales do Sul descobriram que íons de ytterbium podem entrar em estados longevos, quase estáveis. Esses estados prometem aplicações em computadores quânticos e relógios atômicos.", "titulo_pt": "Estados longevos de ytterbium poderiam aprimorar computação quântica e relógios atômicos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [{"titulo": "Spacex lança Starship em voo de teste bem-sucedido", "sumario": "A Starship realizou uma voo de teste bem-sucedido, demonstrando habilidades cruciais que a levam ao status de um veículo de transporte totalmente reutilizável para astronautas indo à lua. A SpaceX realizou o 13º voo suborbital de teste do Starship no dia 24 de julho, corrigindo alguns problemas observados na viagem anterior e lançando por primeira vez satélites funcionais. A SpaceX realizou o décimo terceiro voo do Starship, a versão atual do foguete, com sucesso.", "artigos": [{"id": 71619, "titulo": "SpaceX launches Starship on successful test flight", "url": "https://www.scientificamerican.com/article/spacex-launches-starship-on-successful-test-flight/", "fonte_id": "scientific_american", "data_pub": "2026-07-25T00:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Starship realizou uma voo de teste bem-sucedido, demonstrando habilidades cruciais que a levam ao status de um veículo de transporte totalmente reutilizável para astronautas indo à lua.", "titulo_pt": "Spacex lança Starship em voo de teste bem-sucedido", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 71617, "titulo": "SpaceX conducts 13th Starship test flight", "url": "https://spacenews.com/spacex-conducts-13th-starship-test-flight/", "fonte_id": "spacenews", "data_pub": "2026-07-25T00:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX realizou o 13º voo suborbital de teste do Starship no dia 24 de julho, corrigindo alguns problemas observados na viagem anterior e lançando por primeira vez satélites funcionais.", "titulo_pt": "Spacex realiza 13º voo de teste suborbital do Starship", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 70876, "titulo": "SpaceX lança Starship com sucesso e abre caminho para voo orbital", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/07/spacex-lanca-starship-com-sucesso-e-abre-caminho-para-voo-orbital.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-07-25T00:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A SpaceX realizou o décimo terceiro voo do Starship, a versão atual do foguete, com sucesso. O teste indica que um voo orbital pode estar próximo, mas ainda há ajustes necessários.", "titulo_pt": "Spacex realiza voo do Starship e avança para missões orbitais", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 70878, "titulo": "Na 3ª tentativa, SpaceX consegue lançar foguete Starship para teste", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/07/pela-3a-vez-spacex-tenta-lancar-foguete-starship-para-teste.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-07-24T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A SpaceX realizou com sucesso o lançamento do Starship para um voo de teste na terceira tentativa desde a semana passada. O veículo decolou às 19h51 da Starbase, no Texas.", "titulo_pt": "Na 3ª tentativa, SpaceX lança Starship para novo voo de teste", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}]}], "cultura": [{"id": 71392, "titulo": "With 'Music, Fashion, Film,' Charli XCX channels the raw energy of rock 'n' roll", "url": "https://www.lemonde.fr/en/culture/article/2026/07/25/with-music-fashion-film-charli-xcx-channels-the-raw-energy-of-rock-n-roll_6755815_30.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-25T03:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cantora britânica Charli XCX, após revolucionar o pop com 'Brat', toma um rumo nostálgico em sua carreira sem deixar de lado sua inovação.", "titulo_pt": "Com 'música, moda e cinema', Charli XCX canaliza a energia raw do rock 'n' roll", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 71215, "titulo": "Emociones y lenguaje líquidos en la era digital", "url": "https://www.lanacion.com.ar/ideas/emociones-y-lenguaje-liquidos-en-la-era-digital-nid25072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-25T03:10:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Emojis, reações breves e mensagens curtas; a cultura do 'curti' não apenas altera as dinâmicas de relacionamento, mas também como se sente.", "titulo_pt": "Emoções e linguagem líquidas na era digital", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 71220, "titulo": "Amigos imaginarios", "url": "https://www.lanacion.com.ar/opinion/amigos-imaginarios-nid25072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-25T03:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Chatbots de inteligência artificial que imitam conversações humanas e estão disponíveis 24 horas por dia envolvem riscos que não são bem conhecidos pela maioria das pessoas.", "titulo_pt": "Amigos imaginários", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 71221, "titulo": "Mafalda contra el hambre", "url": "https://www.lanacion.com.ar/opinion/mafalda-contra-el-hambre-nid25072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-25T03:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mais de cinco décadas atrás, o personagem Mafalda, criado por Quino, abordava ironicamente um dos problemas mais persistentes da humanidade: a fome.", "titulo_pt": "Mafalda contra a fome", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 70913, "titulo": "José Godoy e Solano Benítez discutem na Flip a beleza e o horror da arquitetura", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/202 ritora alemã compartilham experiências de quase morte", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 70961, "titulo": "Coletânea reúne poetas invisibilizadas ao longo de quatro séculos", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-07/coletanea-reune-poetas-invisibilizadas-ao-longo-de-quatro-seculos", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-07-24T22:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O livro 'Inesquecíveis: Quatro Séculos de Poetas Brasileiras' reúne o trabalho de poetas mulheres que viveram entre 1602 e 1995. A pesquisadora Ana Rüsche destaca que essas autoras não só escreviam, mas também se envolviam em atividades políticas e críticas.", "titulo_pt": "Coletânea reúne poetas invisibilizadas ao longo de quatro séculos", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 70920, "titulo": "Debate na Casa Folha une aborto e desigualdade para discutir os limites da escolha", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/07/debate-na-casa-folha-une-aborto-e-desigualdade-para-discutir-os-limites-da-escolha.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-07-24T22:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A expansão das universidades no Brasil democratizou o acesso, mas não eliminou as desigualdades sociais. As elites ainda mantêm vantagens hereditárias mesmo com políticas como as cotas.", "titulo_pt": "Debate na Casa Folha une aborto e desigualdade para discutir os limites da escolha", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 71395, "titulo": "The 'Flamingo Revolution' gives wings to Albania's youth", "url": "https://www.lemonde.fr/en/m-le-mag/article/2026/07/24/the-flamingo-revolution-gives-wings-to-albania-s-youth_6755808_117.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-24T21:29:00Z", "i 1597, "titulo": "Extreme heat to hit southeastern Korea", "url": "https://www.koreaherald.com/article/10819867", "fonte_id": "korea_herald", "data_pub": "2026-07-25T01:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A temperatura elevada continuará no país no sábado, com avisos e alertas de ondas de calor em vigor em maioria das regiões, segundo a Administração Meteorológica da Coreia. As temperaturas diurnas serão de 29 a 37 graus Celsius.", "titulo_pt": "Calor extremo atingirá a sul do país", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 71238, "titulo": "Más de 200 mil personas deben huir o confinarse ante los incendios forestales que arrasan Francia y España", "url": "https://www.latercera.com/mundo/noticia/mas-de-200-mil-personas-deben-huir-o-confinarse-ante-los-incendios-forestales-que-arrasan-francia-y-espana/", "fonte_id": "la_tercera", "data_pub": "2026-07-25T00:59:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mais de 200 mil pessoas precisam se refugiar ou se recolher diante dos incêndios florestais que atingem França e Espanha. O governo espanhol declarou o primeiro estado de emergência nacional, enquanto o presidente francês, Emmanuel Macron, pediu às Forças Armadas para mobilizar-se em apoio à segurança civil.", "titulo_pt": "Mais de 200 mil pessoas devem se refugiar ou se recolher ante os incêndios florestais que atingem França e Espanha", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 70704, "titulo": "Ministry aims to boost offshore wind generation", "url": "https://www.taipeitimes.com/News/biz/archives/2026/07/25/2003861327", "fonte_id": "taipei_times", "data_pub": "2026-07-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério tem como objetivo aumentar a geração de energia eólica offshore.", "titulo_pt": "Ministério visa aumentar geração de energia eólica offshore", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 71506, "titulo": "166,000 evacuated as wildfires spin out of control in France and Spain", "url": "https://www.japantimes.co.jp/news/2026/07/25/world/wildfires-france-spain/", "fonte_id": "japan_times", "data_pub": "2026-07-24T23:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "166 mil pessoas foram evacuadas enquanto incêndios florestais, alimentados por ventos fortes e uma seca extrema, se alastraram por florestas secas em França e Espanha. As cidades de Madrid e Paris pediram ajuda da União Europeia para lidar com as chamas.", "titulo_pt": "166 Mil evacuados enquanto incêndios descontrolados assolam França e Espanha", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 70899, "titulo": "Indígenas vão a Lula para tentar brecar dragagem acelerada do rio Tapajós", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/indigenas-vao-a-lula-para-tentar-brecar-dragagem-acelerada-do-rio-tapajos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-24T22:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva recebeu lideranças indígenas e representantes de movimentos sociais que pediram a suspensão da dragagem emergencial no rio Tapajós, no Pará. O encontro ocorreu no Palácio do Planalto na quinta-feira (23).", "titulo_pt": "Indígenas vão a Lula para tentar brecar dragagem acelerada do rio Tapajós", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 71016, "titulo": "Redução do desmatamento contrasta com argumentos dos EUA para tarifaço", "url": "https://www.brasildefato.com.br/2026/07/24/reducao-do-desmatamento-contrasta-com-argumentos-dos-eua-para-tarifaco/", "fonte_id": "brasil_de_fato", "data_pub": "2026-07-24T22:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento do Instituto do Homem e Meio Ambiente da Amazônia (Imazon) mostrou que 588 áreas prot  "titulo": "Tens of thousands flee forest wildfires in France and Spain", "url": "https://www.lemonde.fr/en/international/article/2026/07/24/tens-of-thousands-flee-forest-wildfires-in-france-and-spain_6755802_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-24T17:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 44 mil pessoas deixaram a península de Cap Ferret, famosa por seus moradores ricos, localizada ao sul da Bordeaux. Ambos os países, França e Espanha, solicitaram ajuda de combate a incêndios do EU.", "titulo_pt": "Cerca de 44 mil pessoas fogem das florestas em chamas na França e Espanha", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 70215, "titulo": "El Niño atinge intensidade jamais vista para julho e reforça risco de evento histórico", "url": "https://veja.abril.com.br/agenda-verde/el-nino-atinge-intensidade-jamais-vista-para-julho-e-reforca-risco-de-evento-historico/", "fonte_id": "veja", "data_pub": "2026-07-24T17:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O fenômeno El Niño está alcançando intensidade sem precedentes para o mês de julho, superando marcas de +2°C meses antes do observado em episódios mais intensos registrados. Isso aumenta o risco de um evento histórico.", "titulo_pt": "El Niño atinge intensidade jamais vista para julho e reforça risco de evento histórico", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 71053, "titulo": "Incêndios na região de Madrid causam evacuação de 63 mil pessoas", "url": "https://exame.com/mundo/incendios-na-regiao-de-madrid-causam-evacuacao-de-63-mil-pessoas/", "fonte_id": "exame", "data_pub": "2026-07-24T17:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Incêndios na região de Madrid causaram a evacuação de 63 mil pessoas, conforme informou o Ministério do Interior da Espanha. Trata-se dos piores incêndios registrados na história da capital espanhola.", "titulo_pt": "Incêndios na regi 3, "titulo": "Lula sanciona lei que proíbe venda e consumo de foie gras no Brasil", "url": "https://www.metropoles.com/brasil/lula-sanciona-lei-que-proibe-venda-e-consumo-de-foie-gras-no-brasil", "fonte_id": "metropoles", "data_pub": "2026-07-24T12:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A lei proíbe a venda e consumo de foie gras no Brasil, com origem no combate a maus-tratos aos animais. O foie gras é feito à base de fígado de pato ou ganso.", "titulo_pt": "Lula sanciona lei que proíbe venda e consumo de foie gras no Brasil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 69917, "titulo": "Malaysia’s refugee registration halt risks ‘ultimate disaster’ for new arrivals", "url": "https://www.scmp.com/week-asia/politics/article/3361746/malaysias-refugee-registration-halt-risks-ultimate-disaster-new-arrivals?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-24T09:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Malásia ordenou ao Alto Comissariado das Nações Unidas para os Refugiados (ACNUR) paralisar o registro de novos refugiados enquanto constrói um sistema de identificação biométrica. Especialistas em direitos humanos alertam que essa medida pode colocar em risco a capacidade dos recém-chegados comprovar sua necessidade de proteção.", "titulo_pt": "Paralisação do registro de refugiados em malásia pode ser 'disaster'", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 71318, "titulo": "Born in Jails, Popularized by Gandhi, Hunger Strikes Can Hit Authorities Hard. Conditions Apply.", "url": "https://thediplomat.com/2026/07/born-in-jails-popularized-by-gandhi-hunger-strikes-can-hit-authorities-hard-conditions-apply/", "fonte_id": "the_diplomat", "data_pub": "2026-07-24T08:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sonam Wangchuk encerrou sua fome de 26 dias em apoio à demanda do partido Cockroach Janta por demissão da ministra da const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
