dioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Norte adicionou uma segunda destructor naval à sua frota marítima. Este é o segundo destructor que a Coreia do Norte tem agora.", "titulo_pt": "Coreia do norte adiciona segundo destructor naval", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 151148, "titulo": "Lai eyes closer Japan ties in Kanagawa meeting", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/08/2003863875", "fonte_id": "taipei_times", "data_pub": "2026-09-08T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lai pretende fortalecer as relações com o Japão após uma reunião em Kanagawa. Os detalhes específicos da reunião não foram fornecidos na fonte.", "titulo_pt": "Lai visa aprofundar relações com o Japão em encontro em Kanagawa", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 151149, "titulo": "Navy fleet needs overhaul: experts", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/08/2003863876", "fonte_id": "taipei_times", "data_pub": "2026-09-08T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos afirmam que a frota naval necessita de uma revisão significativa. Nenhuma informação adicional foi fornecida sobre o estado atual ou as áreas específicas que precisam ser revistas.", "titulo_pt": "Frota naval precisa de reavaliação: especialistas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 151150, "titulo": "Court upholds and finalizes sentences in influence junket", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/08/2003863877", "fonte_id": "taipei_times", "data_pub": "2026-09-08T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O tribunal confirmou e finalizou as sentenças relacionadas a um esquema de viagens influenciais. Não foram fornecidos detalhes adicionais sobre o caso ou as sentenças específicas.", "titulo_pt": "Tribunal confirma e finaliza sentenças em caso de viagens influenciais", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 151744, "titulo": "How Tokyo is widening regional defence ties to complicate Beijing’s Taiwan calculus", "url": "https://www.scmp.com/news/china/military/article/3366646/how-tokyo-widening-regional-defence-ties-complicate-beijings-taiwan-calculus?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-07T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O risco de conflito sobre Taiwan está moldando o planejamento defensivo japonês, com Tóquio fortalecendo a segurança interna e externa para um possível combate prolongado. O Japão está rapidamente estabelecendo uma rede de parcerias de defesa que abrange o Indo-Pacífico.", "titulo_pt": "Como tóquio está ampliando as alianças regionais de defesa para complicar os cálculos de pequim sobre Taiwan", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 151648, "titulo": "Australia politics live: John Howard warns about limiting immigration; Barnaby Joyce says super plan to have ‘minute’ inflationary effect", "url": "https://www.theguardian.com/australia-news/live/2026/sep/08/barnaby-joyce-one-nation-superannuation-plan-john-howard-immigration-anthony-albanese-labor-angus-taylor-coalition-pauline-hanson-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-09-07T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "John Howard advertiu sobre o risco de limitar a imigração, argumentando que a lei dos números significa que algumas pessoas com intenções maliciosas podem entrar na Austrália. O partido One Nation propõe permitir que os cidadãos direcionem 3% de suas contribuições para previdência privada para pagar aluguel ou hipoteca.", "titulo_pt": "Política australiana em tempo real: Howard avisa sobre limitações à imigração; one nation quer plano de supercapitalização", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 151689, "titulo": "EU says no place for 'glorification of war criminals' as Mladic buried", "url": "https://www.france24.com/en/eu-says-no-place-for-glorification-of-war-criminals-as-mladic-buried", "fonte_id": "france24", "data_pub": "2026-09-07T21:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Europeia condenou qualquer 'glorificação' do criminoso de guerra Ratko Mladic em Serbia, enquanto milhares se reuniam em Belgrado para o enterro dele.", "titulo_pt": "Ue se opõe à 'glorificação' de criminoso de guerra Mladic durante funeral em belgrado", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 151690, "titulo": "Israel intensifies South Lebanon strikes, killing 13 after weeks-long lull", "url": "https://www.france24.com/en/middle-east/20260907-israeli-strikes-south-lebanon-violence", "fonte_id": "france24", "data_pub": "2026-09-07T21:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israel realizou uma série de ataques aéreos em território libanês, causando 13 mortes, incluindo mulheres e crianças, após semanas de calma relativa. O país afirmou que continuará a atacar o Hezbollah, apoiado pela Irã, por supostas violações do cessar-fogo.", "titulo_pt": "Israel intensifica ataques no sul do líbano, deixando 13 mortos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 151619, "titulo": "Containing Germany’s Far Right", "url": "https://www.nytimes.com/2026/09/07/world/germany-election-afd-indonesia-microplastics.html", "fonte_id": "nyt_world", "data_pub": "2026-09-07T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A vitória da AfD em uma eleição estadual está levando a uma reconsideração da estratégia pós-guerra da Alemanha para garantir a democracia.", "titulo_pt": "A vitória da afd exige uma reavaliação da estratégia de segurança democrática da Alemanha", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 151713, "titulo": "Oil prices surge as US-Iran strikes intensify in Strait of Hormuz", "url": "https://www.aljazeera.com/economy/2026/9/7/oil-prices-surge-as-us-iran-strikes-intensify-in-strait-of-hormuz?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-07T21:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os preços do petróleo atingiram máximos há seis semanas devido a ataques dos Estados Unidos à Irã que interromperam o tráfego no Estreito de Ormuz, um local crítico para o comércio marítimo de petróleo.", "titulo_pt": "Preços do petróleo saltam a máximos de seis semanas devido a ataques nos EUA e Irã no estreito de Ormuz", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 151732, "titulo": "Poste incrementa componente cash opas su Tim", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/07/poste-incrementa-componente-cash-opas-su-tim_d9d4c5be-3479-4639-ad4d-65ff23e30d3c.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-07T21:16:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A condição de teto de 66,67% foi abandonada. O componente cash opas su Tim foi incrementado.", "titulo_pt": "Poste aumenta componente cash opas su Tim, abandona teto de 66,67%", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 151341, "titulo": "O que falta para a AfD formar um governo na Saxônia-Anhalt, na Alemanha", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/o-que-falta-para-a-afd-formar-um-governo-na-saxonia-anhalt-na-alemanha.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-07T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A vitória expressiva do partido Alternativa para a Alemanha (AfD) na Saxônia-Anhalt levanta incertezas sobre a formação de um governo no estado, com o risco de a extrema direita assumir o poder pela primeira vez desde a Segunda Guerra Mundial, um evento político simbólico para o país.", "titulo_pt": "O que falta para a AfD formar um governo na Saxônia-Anhalt, na Alemanha", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 151164, "titulo": "Property market cooling continues, 591.com says", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/08/2003863848", "fonte_id": "taipei_times", "data_pub": "2026-09-08T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mercado imobiliário está continuando a esfriar, de acordo com a 591.com. A empresa relata que há sinais de desaceleração no setor imobiliário.", "titulo_pt": "Mercado imobiliário continua a esfriar, diz 591.Com", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 151167, "titulo": "AIDC, Bombardier sign 20-year deal", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/08/2003863851", "fonte_id": "taipei_times", "data_pub": "2026-09-08T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A AIDC (Indústria Aeronáutica e Defesa de Taiwan) e a Bombardier assinaram um acordo de 20 anos para colaboração em projetos aeronáuticos.", "titulo_pt": "AIDC e Bombardier firmam acordo de 20 anos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 151653, "titulo": "La crisis industrial golpea la cadena de pagos de casi la mitad de las empresas y crece el endeudamiento", "url": "https://www.lanacion.com.ar/economia/la-crisis-industrial-golpea-la-cadena-de-pagos-de-casi-la-mitad-de-las-empresas-y-crece-el-nid07092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-07T21:49:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa da UIA revelou que quase metade das empresas enfrenta dificuldades para cumprir com impostos e fornecedores. Um em cada dois negócios registrou uma diminuição nas vendas e seis em cada dez empresas sinalizaram problemas devido à concorrência desleal.", "titulo_pt": "A crise industrial afeta as cadeias de pagamento de quase a metade das empresas e cresce o endividamento", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 151402, "titulo": "Petróleo volta a encostar nos US$ 100 com ataque a refinaria na Arábia Saudita", "url": "https://veja.abril.com.br/economia/petroleo-volta-a-encostar-nos-us-100-com-ataque-a-refinaria-na-arabia-saudita/", "fonte_id": "veja", "data_pub": "2026-09-07T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O preço do petróleo encerrou acima de 97 dólares na Bolsa de Londres, com uma alta de 0,57%. O ataque a uma refinaria na Arábia Saudita teve impacto limitado devido ao feriado nos Estados Unidos.", "titulo_pt": "Petróleo volta a se aproximar dos 100 dólares com ataque a refinaria na Arábia Saudita", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 151488, "titulo": "Monitor da USP estima 28,5 mil pessoas em ato de Flávio Bolsonaro na Avenida Paulista", "url": "https://www.infomoney.com.br/politica/monitor-da-usp-estima-285-mil-pessoas-em-ato-de-flavio-bolsonaro-na-avenida-paulista/", "fonte_id": "infomoney", "data_pub": "2026-09-07T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O monitor da USP estimou que cerca de 28,5 mil pessoas participaram do ato de Flávio Bolsonaro na Avenida Paulista. O público foi 32,5% menor do que no ato do Dia da Independência de 2025, quando 42,2 mil pessoas estiveram presentes.", "titulo_pt": "Monitor da USP estima 28,5 mil pessoas em ato de Flávio Bolsonaro na Avenida Paulista", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 151663, "titulo": "Ezequiel Starobinsky, economista: “Hay que abordar las finanzas con inteligencia emocional y también técnica”", "url": "https://www.lanacion.com.ar/salud/ezequiel-starobinsky-economista-hay-que-abordar-las-finanzas-con-inteligencia-emocional-y-tambien-nid05092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-07T21:36:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O economista Ezequiel Starobinsky afirma que é necessário abordar as finanças com inteligência emocional e técnica. Ele argumenta que o relacionamento com o dinheiro começa na infância e deve ser visto como uma energia que circula, com o objetivo de reduzir a ansiedade associada a ele.", "titulo_pt": "Ezequiel Starobinsky, economista: ‘é preciso abordar as finanças com inteligência emocional e técnica’", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 151489, "titulo": "Quaest: 79% dizem que opinião política de liderança religiosa não influencia em voto", "url": "https://www.infomoney.com.br/politica/quaest-79-dizem-que-opiniao-politica-de-lideranca-religiosa-nao-influencia-em-voto/", "fonte_id": "infomoney", "data_pub": "2026-09-07T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo revelou que 79% das pessoas afirmam que a opinião política de líderes religiosos não influencia em seus votos. Este resultado foi consistente entre católicos e evangélicos.", "titulo_pt": "79% Afirmam que opinião política de liderança religiosa não influencia no voto", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 151517, "titulo": "Margens de esmagamento de soja na China permanecem negativas", "url": "https://www.cnnbrasil.com.br/agro/as-vesperas-da-visita/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-07T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As importações de soja dos EUA para a China resultariam em perdas mesmo sem a aplicação de tarifas, afetando os embarques entre outubro e janeiro.", "titulo_pt": "Margens de esmagamento de soja na China permanecem negativas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 151519, "titulo": "Boehringer amplia vendas em mais de 30% na avicultura no 2º trimestre", "url": "https://www.cnnbrasil.com.br/agro/boehringer-amplia-vendas-em-mais-de-30-na-avicultura-no-2o-trimestre/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-07T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Boehringer aumentou suas vendas na avicultura em mais de 30% no segundo trimestre. A empresa manteve investimentos anuais globais de cerca de R$ 3 bilhões em pesquisa e desenvolvimento.", "titulo_pt": "Boehringer amplia vendas na avicultura em mais de 30% no 2º trimestre", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 151491, "titulo": "Quaest: vantagem de Lula some e 2º turno com Flávio fica em 41% a 41%", "url": "https://www.infomoney.com.br/politica/quaest-vantagem-de-lula-some-e-2o-turno-com-flavio-fica-em-41-a-41/", "fonte_id": "infomoney", "data_pub": "2026-09-07T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa indica que a vantagem de Lula sobre Flávio Bolsonaro desapareceu, deixando o segundo turno empatado em 41% a 41%.", "titulo_pt": "Vantagem de Lula desaparece e segundo turno entre Lula e Flávio fica em 41% a 41%", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 151527, "titulo": "Moedas globais: dólar cai com força do iene em sessão limitada por feriado", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/moedas-globais-dolar-cai-com-forca-do-iene-em-sessao-limitada-por-feriado/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-07T21:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar caiu enquanto o iene japonês ganhou valor, com a moeda americana cotada a 154,38 ienes. O euro e a libra também registraram altas, valendo respectivamente US$ 1,1623 e US$ 1,3541.", "titulo_pt": "Moedas globais: dólar cai com força do iene em sessão limitada por feriado", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 151364, "titulo": "Capturar o Estado é mais rentável?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/michael-franca/2026/09/capturar-o-estado-e-mais-rentavel.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-07T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Daniel Vorcaro, um banqueiro relativamente desconhecido, construiu uma extensa rede de relações com o governo federal brasileiro e seu banco cresceu rapidamente. No entanto, tudo terminou em colapso, com o Banco Central encerrando suas operações e Vorcaro sendo preso.", "titulo_pt": "Aprender com a aberração do capitalismo brasileiro?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 151365, "titulo": "Você compraria ações da Nike se ela não se chamasse Nike?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/09/voce-compraria-acoes-da-nike-se-ela-nao-se-chamasse-nike.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-07T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Investidores brasileiros têm se voltado mais para a diversificação internacional após anos de desafios na Bolsa local. O acesso a investimentos internacionais tornou-se mais fácil nos últimos anos.", "titulo_pt": "Você compraria ações de uma empresa sem o nome Nike?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 151533, "titulo": "Bitcoin opera em baixa com Oriente Médio e Fed no radar", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/bitcoin-opera-em-baixa-com-oriente-medio-e-fed-no-radar/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-07T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Bitcoin operava em baixa de 0,54%, cotado a US$ 79.380,10, enquanto o Ethereum subia 0,24%, a US$ 2.496,19, de acordo com a plataforma Binance.", "titulo_pt": "Bitcoin opera em baixa com Oriente Médio e Fed no radar", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 151494, "titulo": "Dólar opera em queda com força do iene em sessão limitada por feriado nos EUA", "url": "https://www.infomoney.com.br/mercados/dolar-opera-em-queda-com-forca-do-iene-em-sessao-limitada-por-feriado-nos-eua/", "fonte_id": "infomoney", "data_pub": "2026-09-07T20:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar opera em queda devido ao fortalecimento do iene, em uma sessão limitada por causa do feriado nos Estados Unidos. O avanço do iene superou o pico alcançado após a intervenção coordenada pelo Japão e os Estados Unidos.", "titulo_pt": "Dólar opera em baixa com força do iene em sessão limitada por feriado nos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 151495, "titulo": "Quanto custa comer no Rock in Rio? Veja quais são as opções e os preços no festival", "url": "https://www.infomoney.com.br/minhas-financas/quanto-custa-comer-no-rock-in-rio-veja-quais-sao-as-opcoes-e-os-precos-no-festival/", "fonte_id": "infomoney", "data_pub": "2026-09-07T20:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Rock in Rio oferece 860 pontos de venda de alimentos e bebidas em uma área de 385 mil metros quadrados. O post detalha as opções disponíveis e os preços durante o festival.", "titulo_pt": "Quanto custa comer no Rock in Rio? Confira as opções e preços no festival", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 151165, "titulo": "No shortcut to excellence in chips: TSMC executive", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/08/2003863849", "fonte_id": "taipei_times", "data_pub": "2026-09-08T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa TSMC, uma das líderes mundiais em fabricação de chips, enfatiza que não há atalhos para alcançar a excelência na produção de semicondutores.", "titulo_pt": "Não há atalhos para excelência em chips: executivo da TSMC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 151166, "titulo": "Google planning layoffs in Taiwan, report says", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/08/2003863850", "fonte_id": "taipei_times", "data_pub": "2026-09-08T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Relatório indica que a Google está planejando demissões no Taiwan. A informação foi publicada pela Taipei Times.", "titulo_pt": "Google planeja demissões no Taiwan, relata taipei times", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 151549, "titulo": "Como controlar o tempo de uso do celular sem instalar outro app", "url": "https://canaltech.com.br/apps/como-controlar-tempo-de-uso-celular-sem-apps/", "fonte_id": "canaltech", "data_pub": "2026-09-07T22:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "É recomendado controlar o tempo de uso de aplicativos no celular para evitar excesso de tempo nas redes sociais, especialmente durante horários de estudos ou trabalho. Android e iOS oferecem recursos nativos para isso, como o 'Tempo de Uso' no iPhone e o 'Bem-estar Digital' no Android, que permitem criar temporizadores diários para limitar o acesso a apps específicos.", "titulo_pt": "Como controlar o tempo de uso do celular sem instalar outro app", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 151399, "titulo": "Huawei e Xiaomi lançam novos modelos a poucos dias de anúncio do primeiro dobrável da Apple", "url": "https://veja.abril.com.br/tecnologia/huawei-e-xiaomi-lancam-novos-modelos-a-poucos-dias-de-anuncio-do-primeiro-dobravel-da-apple/", "fonte_id": "veja", "data_pub": "2026-09-07T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Huawei e a Xiaomi lançaram novos modelos de smartphones a poucos dias do anúncio do primeiro iPhone dobrável pela Apple. O evento, gerenciado por John Ternus, apresentará a nova família 18 e o primeiro iPhone dobrável da empresa.", "titulo_pt": "Huawei e Xiaomi lançam novos modelos a poucos dias do primeiro iphone dobrável", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 151753, "titulo": "(Yonhap Interview) Ethereum Institutional welcomes S. Korea's push to build tokenized asset infrastructure: co-founder", "url": "https://en.yna.co.kr/view/AEN20260907009400320", "fonte_id": "yonhap_news", "data_pub": "2026-09-07T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Ethereum Institutional expressou satisfação com a iniciativa da Coreia do Sul de desenvolver infraestrutura para ativos tokenizados. A declaração foi feita em uma entrevista com a Yonhap News.", "titulo_pt": "Ethereum Institutional elogia iniciativa sul-coreana em ativos tokenizados", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 151437, "titulo": "China endurece regras e responsabiliza criadores de deepfakes e clones de voz sem consentimento", "url": "https://www.brasildefato.com.br/2026/09/07/china-endurece-regras-e-responsabiliza-criadores-de-deepfakes-e-clones-de-voz-sem-consentimento/", "fonte_id": "brasil_de_fato", "data_pub": "2026-09-07T19:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A China publicou diretrizes judiciais para julgar disputas envolvendo Inteligência Artificial, incluindo responsabilização por deepfakes, clonagem de voz e uso não autorizado de imagens. O consentimento é considerado o elemento mais importante para definir essas situações.", "titulo_pt": "China endurece regras e responsabiliza criadores de deepfakes e clones de voz sem consentimento", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 151739, "titulo": "Opaque recurrence, and other AI terms that you should probably know", "url": "https://techcrunch.com/2026/09/07/artificial-intelligence-definition-glossary-hallucinations-guide-to-common-ai-terms/", "fonte_id": "techcrunch", "data_pub": "2026-09-07T19:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O aumento do uso da inteligência artificial trouxe uma grande quantidade de novos termos e expressões. Este glossário explana algumas das palavras e frases mais importantes que você pode encontrar nessa área.", "titulo_pt": "Recorrência oculta, e outros termos de IA que você provavelmente deveria conhecer", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 151539, "titulo": "'Ninguém está preparado para as consequências da inteligência artificial', adverte cientista-chefe da OpenAI", "url": "https://www.bbc.com/portuguese/articles/cvgyevpqk3vo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-07T19:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cientista-chefe da OpenAI advertiu sobre as consequências potenciais da inteligência artificial poucos dias após o lançamento do GPT-6 Astra, considerado o produto mais poderoso da empresa até o momento.", "titulo_pt": "Ninguém está preparado para as consequências da inteligência artificial", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 151504, "titulo": "China endurece regras para combater abusos no uso da IA", "url": "https://olhardigital.com.br/2026/09/07/inteligencia-artificial/china-endurece-regras-para-combater-abusos-no-uso-da-ia/", "fonte_id": "olhar_digital", "data_pub": "2026-09-07T18:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Novas diretrizes judiciais foram estabelecidas no China para combater abusos relacionados à IA, incluindo réplicas digitais, informações falsas e discriminação de preços por algoritmos.", "titulo_pt": "China endurece regras para combater abusos no uso da IA", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 151740, "titulo": "A secret new Elizabeth Holmes documentary stuns Telluride", "url": "https://techcrunch.com/2026/09/07/a-secret-new-elizabeth-holmes-documentary-stuns-telluride/", "fonte_id": "techcrunch", "data_pub": "2026-09-07T18:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um documentário secreto sobre Elizabeth Holmes, intitulado 'Você Pode Ver Tudo', dirigido por Nathan Fielder e Lance Oppenheim, surpreendeu o público do festival de Telluride com seu acesso generoso à fundadora da Theranos.", "titulo_pt": "Um novo documentário secreto sobre Elizabeth Holmes surpreende Telluride", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 151259, "titulo": "Workshops Educate African Researchers On How to Publish With IEEE", "url": "https://spectrum.ieee.org/ieee-workshop-xplore-africa", "fonte_id": "ieee_spectrum", "data_pub": "2026-09-07T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitos pesquisadores e estudantes em Kenia, Ruanda e Uganda encontram dificuldades para acessar e publicar artigos científicos e técnicos devido a barreiras financeiras, como taxas de publicação e assinaturas de bibliotecas de pesquisa. Para auxiliar, a IEEE tornou seu Digital Library Xplore mais acessível oferecendo descontos em assinaturas e reduzindo as taxas de publicação, mas o número de artigos publicados por tecnologistas desses três países ainda é menor que o de outros países em desenvolvimento.", "titulo_pt": "Workshops Educate African Researchers On How to Publish With IEEE (workshoppes educam pesquisadores africanos sobre como publicar com a IEEE)", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 150680, "titulo": "Trump vira Lanterna Verde em vídeo de IA publicado pela Casa Branca", "url": "https://www.infomoney.com.br/mundo/trump-vira-lanterna-verde-em-video-de-ia-publicado-pela-casa-branca/", "fonte_id": "infomoney", "data_pub": "2026-09-07T17:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vídeo publicado pela Casa Branca mostra o presidente Trump usando os poderes do personagem Lanterna Verde para erguer uma barreira na fronteira, destacar a indústria americana e exibir a força militar dos Estados Unidos.", "titulo_pt": "Trump se torna Lanterna Verde em vídeo de IA publicado pela Casa Branca", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 150548, "titulo": "Apple prepara iPhone dobrável de mais de US$ 2.000 em meio a alta de custos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/apple-prepara-iphone-dobravel-de-mais-de-us-2000-em-meio-a-alta-de-custos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-07T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CEO da Apple, John Ternus, deve apresentar na quarta-feira (9) novos produtos, incluindo um iPhone dobrável com preço superior a US$ 2.000. Essa será a primeira vez que a empresa lança um dispositivo com tela dobrável e um preço tão elevado.", "titulo_pt": "Apple prepara iphone dobrável acima de r$ 2.000 com novo ceo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 151215, "titulo": "Best Tech Labor Day Sales I’d Shop Myself (2026): Vacuums, Headphones, and More", "url": "https://www.wired.com/story/tech-labor-day-sales-2026/", "fonte_id": "wired", "data_pub": "2026-09-07T16:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias tecnologias populares, incluindo aspiradores sem fio e fones de ouvido sem fio, estão com desconto durante o feriado de Dia do Trabalho este ano.", "titulo_pt": "Melhores vendas de dia do trabalho em tecnologia: aspiradores, fones de ouvido e mais", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 151212, "titulo": "What we expect from the upcoming Apple launch", "url": "https://techcrunch.com/2026/09/07/what-we-expect-from-the-upcoming-apple-launch/", "fonte_id": "techcrunch", "data_pub": "2026-09-07T15:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple lançará seu primeiro iPhone dobrável chamado Ultra em setembro, e também haverá anúncios sobre AirPods e HomePods durante o evento. O lançamento está programado para o dia 9 de setembro.", "titulo_pt": "O que esperar do próximo lançamento da Apple", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 151179, "titulo": "China’s Xiaomi unveils folding phone with home-grown chip as it takes on Apple, Huawei", "url": "https://www.scmp.com/tech/tech-trends/article/3366682/chinas-xiaomi-unveils-folding-phone-home-grown-chip-it-takes-apple-huawei?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-07T14:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Xiaomi lançou uma série de novos produtos, incluindo um telefone dobrável com chip proprietário e novos modelos do SUV premium Skynomad. A empresa chinês está intensificando sua concorrência contra rivais como Tesla, Apple e Huawei com tecnologias domesticadas.", "titulo_pt": "Xiaomi apresenta telefone dobrável com chip nacional em competição com Apple e Huawei", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 151154, "titulo": "Fossil link for sea turtles found off coast of Taiwan", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/08/2003863881", "fonte_id": "taipei_times", "data_pub": "2026-09-08T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fósseis de tartarugas marinhas foram encontrados na costa de Taiwan. Esses fósseis fornecem uma ligação importante para a evolução das tartarugas marinhas.", "titulo_pt": "Fósseis de tartarugas marinhas encontrados na costa de Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 151755, "titulo": "Park rangers and residents speak up to save Togo's last national park", "url": "https://phys.org/news/2026-09-rangers-residents-togo-national.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A alguns anos, o autor viajou com um amigo para o Parque Nacional Fazao-Malfakassa, na Togo, a última grande área protegida do país. O hotel Fazao, que abriu em 1980, foi gerido pela Fundação Suíça Franz Weber Foundation e serviu de ponto de encontro para turistas internacionais que vinham observar a vida selvagem local, incluindo elefantes e primatas.", "titulo_pt": "Guardas de parques e residentes se pronunciam para salvar o último parque nacional do Togo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 151756, "titulo": "AI governance model inspired by Pope Leo XIV aims to put ethics first", "url": "https://phys.org/news/2026-09-ai-pope-leo-xiv-aims.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da John Paul II Catholic University of Lublin e da University of Eastern Finland desenvolveram um novo modelo de governança de inteligência artificial inspirado nas doutrinas do Papa Leão XIV, com o objetivo de garantir que as tecnologias de IA sejam desenvolvidas e utilizadas de forma segura, justa e respeitando integralmente os direitos humanos.", "titulo_pt": "Modelo de governança de IA inspirado pelas doutrinas do papa leão XIV visa priorizar a ética", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 151757, "titulo": "Bumpy battery surfaces can masquerade as nanoscale ion pathways, misleading material design", "url": "https://phys.org/news/2026-09-bumpy-battery-surfaces-masquerade-nanoscale.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma indicação de que íons estão se movendo dentro de uma bateria pode, na verdade, ser uma ilusão causada por uma superfície irregular. Uma equipe de pesquisa da KAIST identificou a origem desse tipo de artefato, que pode levar os pesquisadores a interpretar incorretamente o que está acontecendo dentro da bateria, e desenvolveu um método para reduzi-lo.", "titulo_pt": "Superfícies irregulares de baterias podem enganar a detecção de caminhos de íons nanosscale", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 151758, "titulo": "War drama Pressure depicts D‑day's weather forecast—what we found when we recreated the challenge using modern systems", "url": "https://phys.org/news/2026-09-war-drama-pressure-depicts-dday.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meteorologista James Stagg deu, em junho de 1944, o que muitos consideram a mais importante previsão climática da história. A sorte de mais de 150.000 soldados aliados preparando-se para invadir as praias de Normandia em D-Day e o futuro da guerra na Europa dependiam de Stagg e suas equipes. No quartel-general em Southwick House, perto de Portsmouth, o general Dwight D. Eisenhower aguardava a previsão meteorológica.", "titulo_pt": "Drama de guerra Pressure retrata a previsão climática do d-day - o que descobrimos ao recriar o desafio usando sistemas modernos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 151759, "titulo": "Survey of young researchers raises concerns over future of science in U.S.", "url": "https://phys.org/news/2026-09-survey-young-future-science.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um terço dos jovens cientistas que haviam planejado carreiras na pesquisa acadêmica mudou de ideia no verão de 2025, de acordo com uma nova pesquisa. Eles esperam menos permanecerem na educação superior ou trabalharem nos Estados Unidos, e menos acreditam que obter um doutorado foi a decisão certa.", "titulo_pt": "Pesquisa de jovens pesquisadores levanta preocupações sobre o futuro da ciência nos estados unidos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 151760, "titulo": "From strays to territory bosses: Epigenetics makes cheetahs adaptable", "url": "https://phys.org/news/2026-09-strays-territory-bosses-epigenetics-cheetahs.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo liderado pelo Leibniz-IZW sobre leões selvagens da Namíbia demonstrou que mecanismos epigenéticos podem desempenhar um papel importante na forma como animais desenvolvem diferentes fenótipos, apesar de sua baixa diversidade genética. O trabalho foi publicado na revista Molecular Ecology.", "titulo_pt": "De sem-teto a chefes de território: mecanismos epigenéticos tornam os leões adaptáveis", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 151761, "titulo": "A child's first 5 years set them up for life. African study explores how to target education spending", "url": "https://phys.org/news/2026-09-child-years-life-african-explores.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os primeiros cinco anos de vida são fundamentais para o futuro da educação, saúde e renda das crianças. No entanto, mais de 77% das crianças em África subsaariana não têm acesso a cuidados e educação infantis, o que as coloca em risco de não atingir seu potencial de desenvolvimento.", "titulo_pt": "Os primeiros cinco anos da vida das crianças estabelecem a base para seu futuro. Estudo africano explora como direcionar o gasto em educação", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 151762, "titulo": "Deep biosphere has endured mountain-building and erosion over hundreds of millions of years", "url": "https://phys.org/news/2026-09-deep-biosphere-mountain-erosion-hundreds.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo revelou que a vida microbiana existente na profundidade da Terra persistiu e floresceu repetidamente durante centenas de milhões de anos, ao longo de eventos geológicos como a formação de montanhas e a erros. A análise de minerais, fluidos e gases de um poço de perfuração a 2,3 km de profundidade na Suécia central mostrou bursts episódicos de vida que produziam metano associados a tais eventos geológicos.", "titulo_pt": "Profundezas da biosfera sobreviveram a eventos geológicos ao longo de bilhões de anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 151763, "titulo": "The listening gap is real—how AI might help teachers bridge it", "url": "https://phys.org/news/2026-09-gap-real-ai-teachers-bridge.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um professor de quarto ano exibiu para sua classe um vídeo sobre crianças que caminham quilômetros descalças para ir à escola. Um aluno questionou a exibição, afirmando que se tratava de conteúdo sobre inteligência artificial e duvidando da sua veracidade.", "titulo_pt": "O gap de escuta é real - como a IA pode ajudar os professores a superá-lo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 151764, "titulo": "'The Jungle Book' offers an unconventional tool for undergraduate economics education", "url": "https://phys.org/news/2026-09-jungle-unconventional-tool-undergraduate-economics.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa publicada na International Journal of Pluralism and Economics Education sugere que 'O Livro da Selva' pode ser usado como uma ferramenta pedagógica inusitada para a educação econômica de graduação, introduzindo conceitos econômicos como escassez, sustentabilidade, felicidade e desenvolvimento através das histórias originais de Rudyard Kipling e as adaptações do Disney.", "titulo_pt": "O livro da selva oferece uma ferramenta inusitada para a educação econômica de graduação", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 151765, "titulo": "Weak hydrogen bonds dethrone copper as the most stable metal binder, opening a new path for metal selection", "url": "https://phys.org/news/2026-09-weak-hydrogen-bonds-dethrone-copper.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cobre deixou de ser o metal mais estável, uma posição que ocupava há décadas. Uma equipe de pesquisa da KAIST modificou apenas os vínculos de hidrogênio em volta do metal, invertendo a tendência tradicional de estabilidade dos complexos de cobre.", "titulo_pt": "Vínculos de hidrogênio desafiam cobre como metal mais estável", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 151795, "titulo": "'The Last Starship' is 2026's most slept-on space game — you need to check out this 'FTL'-like shipbuilding strategy gem", "url": "https://www.space.com/entertainment/space-games/the-last-starship-is-2026s-most-slept-on-space-game-you-need-to-check-out-this-ftl-like-shipbuilding-strategy-gem", "fonte_id": "space_com", "data_pub": "2026-09-07T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O jogo 'The Last Starship' é um jogo de estratégia de construção de naves semelhante a FTL, desenvolvido pela Introversion. É recomendado que os jogadores o experimentem antes que mais um segundo se passe.", "titulo_pt": "'The Last Starship' é o jogo espacial de 2026 mais subestimado - você precisa testar esse diamante de estratégia de construção de navios", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 151766, "titulo": "Port Hills research reveals 'fire trap' risk from non-native grass", "url": "https://phys.org/news/2026-09-port-hills-reveals-native-grass.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novas pesquisas da Te Whare Wānanga o Waitaha | University of Canterbury analisaram os efeitos do incêndio florestal nos Port Hills em fevereiro de 2024 e descobriram que algumas árvores e arbustos nativos jovens conseguiram ressurgir após sofrerem danos severos pelo fogo.", "titulo_pt": "Pesquisa revela 'armadilha de fogo' com grama não nativa nos port Hills", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 151767, "titulo": "Inexpensive blue pigment enables efficient one-step conversion of carbon dioxide to methane", "url": "https://phys.org/news/2026-09-inexpensive-blue-pigment-enables-efficient.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um pigmento azul comum pode auxiliar na conversão eficiente do dióxido de carbono (CO₂) em um combustível útil. Uma equipe de pesquisa liderada pelo Instituto Avançado para Pesquisas em Materiais da Universidade de Tohoku, em colaboração com a Universidade de Hokkaido e a startup AZUL Energy, desenvolveu um catalisador que converte CO₂ diretamente em metano (CH₄) com alta eficiência usando cianocianurato de cobre, um pigmento azul barato e amplamente disponível.", "titulo_pt": "Pigmento azul barato promove conversão eficiente de dióxido de carbono em metano", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 151768, "titulo": "Ships, ice cores and krill surveys underpin Australia's 10-year Antarctic monitoring strategy", "url": "https://phys.org/news/2026-09-ships-ice-cores-krill-surveys.html", "fonte_id": "phys_org", "data_pub": "2026-09-07T19:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A importância das embarcações na coleta de dados científicos na Antártica e no Oceano Austral foi destacada em uma conferência científica antártica de renome em Hobart. O evento, o Conferência Australiana de Pesquisa Antártica, reuniu 400 pesquisadores de todo o mundo e ocorreu biennialmente na Universidade de Tasmania.", "titulo_pt": "Navios, núcleos de gelo e pesquisas de krill suportam estratégia de monitoramento antártico australianesa de 10 anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 151397, "titulo": "Rock in Rio: verde e amarelo vira look no feriado da Independência", "url": "https://veja.abril.com.br/cultura/rock-in-rio-verde-e-amarelo-vira-look-no-feriado-da-independencia/", "fonte_id": "veja", "data_pub": "2026-09-07T21:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O público do Rock in Rio adotou uma temática brasileira durante o feriado da Independência, com cores verde e amarelo predominando nos looks. Parte do público escolheu esse tema para assistir aos shows.", "titulo_pt": "Rock in Rio: verde e amarelo se tornam look no feriado da Independência", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 151792, "titulo": "‘Musk’ Teaser: The Wealthiest Man in the World Becomes Alex Gibney’s Latest Documentary Subject", "url": "https://www.indiewire.com/news/trailers/musk-documentary-teaser-1235215370/", "fonte_id": "indiewire", "data_pub": "2026-09-07T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Bleecker Street irá lançar o documentário sobre Elon Musk nos cinemas em 16 de outubro. Alex Gibney será o diretor deste filme.", "titulo_pt": "Teaser ‘musk’: o homem mais rico do mundo vira subjeto de documentário de Alex Gibney", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 151665, "titulo": "Tulipanes: el lujo vivo y efímero que atrae turistas y dinamiza la economía", "url": "https://www.lanacion.com.ar/salud/tulipanes-el-lujo-vivo-y-efimero-que-atrae-turistas-y-dinamiza-la-economia-nid06092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-07T21:36:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A tulipa chegou aos Países Baixos no final do século XVI e gerou uma tulipomania entre a aristocracia da época. Essa flor é um luxo vivo e efímero que atrai turistas e dinamiza a economia local.", "titulo_pt": "Tulipas: o luxo vivo e efímero que atrai turistas e dinamiza a economia", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 151357, "titulo": "Como é a versão live-action do anime 'Look Back', que Kore-eda exibe em Veneza", "url ulo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 151626, "titulo": "Ana María Stuven gana el Premio Nacional de Historia 2026", "url": "https://www.latercera.com/culto/noticia/ana-maria-stuven-gana-el-premio-nacional-de-historia-2026/", "fonte_id": "la_tercera", "data_pub": "2026-09-07T20:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Ana María Stuven, jornalista da Universidade de Chile e doutora em História pela Stanford University, ganhou o Prêmio Nacional de História 2026. Seu trabalho se concentra na história das ideias políticas e no papel das mulheres na história, principalmente nos séculos XIX e XX.", "titulo_pt": "Ana María Stuven vence prêmio Nacional de história 2026", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 151359, "titulo": "Luísa Sonza canta bossa nova no Rock in Rio para uma plateia esvaziada", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/luisa-sonza-canta-bossa-nova-no-rock-in-rio-para-uma-plateia-esvaziada.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-07T20:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Luísa Sonza abriu o palco Mundo no Rock in Rio cantando bossa nova. Ela convidou Roberto Menescal, fundador do gênero, para participar da apresentação.", "titulo_pt": "Luísa Sonza canta bossa nova no Rock in Rio para plateia esvaziada", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 151742, "titulo": "[Jan-Werner Mueller] Far right’s war on modern architecture", "url": "https://www.koreaherald.com/article/10865391", "fonte_id": "korea_herald", "data_pub": "2026-09-07T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O partido de extrema-direita Alternativa para a Alemanha (AfD) tem ganhado força nas pesquisas de opinião há dois anos, mas foi impedido de assumir o poder por outros partidos que se recusam a formar coalizões com ele.  para presídio militar em SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 150807, "titulo": "Sobrevivió al ataque de un tiburón y ahora intenta rehacer su vida sin una pierna: “Esto solo me hará más fuerte”", "url": "https://www.lanacion.com.ar/lifestyle/sobrevivio-al-ataque-de-un-tiburon-y-ahora-intenta-rehacer-su-vida-sin-una-pierna-esto-solo-me-hara-nid07092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-07T17:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma vítima de ataque de tubarão sobreviveu e está tentando reerguer sua vida após perder uma perna. Sua história se tornou um mensageiro de esperança para pessoas que enfrentam desafios diários.", "titulo_pt": "Sobrevivente de ataque de tubarão perde perna, mas busca reerguer sua vida: 'isso me tornará mais forte'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 150691, "titulo": "Socorristas no Nepal reforçam buscas por 900 desaparecidos em usinas", "url": "https://www.cnnbrasil.com.br/internacional/socorristas-no-nepal-reforcam-buscas-por-900-desaparecidos-em-usinas/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-07T17:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Equipes de resgate no Nepal estão intensificando as buscas em usinas hidrelétricas, focando em trabalhadores que podem estar em túneis das estruturas. Há relatos de 900 pessoas desaparecidas.", "titulo_pt": "Socorristas no Nepal reforçam buscas por 900 desaparecidos em usinas hidrelétricas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 150925, "titulo": "CUT entrega misiva en La Moneda en que solicitan al gobierno detener proyecto de Sala Cuna Universal y formar mesa de trabajo", "url": "https://www.latercera.com/nacional/noticia/cut-entrega-misiva-en-la-moneda-en-que-solicitan-al-gobierno-detener-proyecto-de-sala-cuna-universal-y-formar-mesa-de-trabajo/", "fonte_id": "la_tercera", "data_pub": "2026-09-07T17:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A CUT entregou uma carta ao Palácio La Moneda solicitando ao governo a suspensão do projeto de Sala Cuna Universal e a formação de uma mesa de trabalho. A central enfatiza que o projeto precisa corrigir aspectos de financiamento e a participação dos agentes privados.", "titulo_pt": "CUT entrega carta ao palácio La Moneda pedindo pausa no projeto de Sala Cuna Universal", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 150928, "titulo": "Salud mental, seguridad y economía: los temas que más preocupan a los jóvenes según estudio UNAB", "url": "https://www.latercera.com/lt-board/noticia/salud-mental-seguridad-y-economia-los-temas-que-mas-preocupan-a-los-jovenes-segun-estudio-realizado-por-unab/", "fonte_id": "la_tercera", "data_pub": "2026-09-07T17:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Encuesta de Bienestar de la Juventud 2026, realizada pela Universidade Andrés Bello, revelou altas taxas de percepção de insegurança entre jovens de países da América do Sul. No que diz respeito à saúde mental, 55% dos jovens chilenos entrevistados expressaram desejo por mais apoio emocional e mental.", "titulo_pt": "Saúde mental, segurança e economia: os temas que mais preocupam os jovens, de acordo com estudo UNAB", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 150591, "titulo": "Adolescente pula de carro em movimento para fugir de sequestro no Rio; veja vídeo", "url": "https://veja.abril.com.br/brasil/adolescente-pula-de-carro-em-movimento-para-fugir-de-sequestro-no-rio-veja-video/", "fonte_id": "veja", "data_pub": "2026-09-07T17:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma adolescente pular de um carro em movimento para fugir de um sequestro ocorreu no Rio de Janeiro. A menina sofreu escoriações apenas no joelho e está bem. A família já registrou uma ocorrência na 23ª DP (Méier).", "titulo_pt": "Adolescente pula de carro em movimento para fugir de sequestro no Rio; veja vídeo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 150592, "titulo": "O novo caso do bebê torturado: o que a psicologia (não) explica", "url": "https://veja.abril.com.br/coluna/mens-sana/o-novo-caso-do-bebe-torturado-o-que-a-psicologia-nao-explica/", "fonte_id": "veja", "data_pub": "2026-09-07T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um caso de violência criminosa contra um bebê no interior de São Paulo trouxe à luz uma situação de tortura injustificável. O que poderia estar por trás dessa violência não foi esclarecido pela psicologia.", "titulo_pt": "Novo caso de bebê torturado: o que a psicologia (não) explica", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 150594, "titulo": "Monitoramento por drone mostra quantas pessoas foram ao ato de Augusto Cury em Copacabana", "url": "https://veja.abril.com.br/politica/monitoramento-por-drone-mostra-quantas-pessoas-foram-ao-ato-de-augusto-cury-em-copacabana/", "fonte_id": "veja", "data_pub": "2026-09-07T16:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um monitoramento por drone registrou a participação de pessoas no ato de Augusto Cury em Copacabana. O escritor e presidenciável ocupa o terceiro lugar nas pesquisas eleitorais para a Presidência da República em 2022.", "titulo_pt": "Monitoramento por drone registra participação no ato de Augusto Cury em Copacabana", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 150595, "titulo": "Mobilização nas redes no 7 de Setembro cai e é quase a metade do ano anterior", "url": "https://veja.abril.com.br/politica/mobilizacao-nas-redes-no-7-de-setembro-cai-e-e-quase-a-metade-do-ano-anterior/", "fonte_id": "veja", "data_pub": "2026-09-07T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A mobilização nas redes sociais no Dia da Independência (7 de Setembro) de 2026 foi quase a metade do que foi registrado no ano anterior. De acordo com o levantamento do instituto Democracia em Xeque, o acumulado até o momento foi 42% menor do que em 2025.", "titulo_pt": "Mobilização nas redes no 7 de Setembro de 2026 cai e é quase a metade do ano anterior", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 150596, "titulo": "Adolescente é apreendida com 22 peças de picanha furtadas de supermercado no Rio", "url": "https://veja.abril.com.br/brasil/adolescente-e-apreendida-com-22-pecas-de-picanha-furtadas-de-supermercado-no-rio/", "fonte_id": "veja", "data_pub": "2026-09-07T16:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma adolescente foi apreendida com 22 peças de picanha furtadas de um supermercado em Nova Iguaçu, no Rio de Janeiro. As equipes da Segurança Presente recuperaram 25 produtos avaliados em cerca de R$ 3 mil.", "titulo_pt": "Adolescente é apreendida com 22 peças de picanha furtadas de supermercado no Rio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 151171, "titulo": "Kazakhstan aims to become education hub, but experts say jobs must match skills", "url": "https://www.scmp.com/news/hong-kong/education/article/3366687/kazakhstan-aims-become-education-hub-experts-say-jobs-must-match-skills?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-07T16:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kazáquia visa se tornar um centro educacional na Ásia Central, mas especialistas afirmam que é necessário garantir que os jovens tenham acesso suficiente a oportunidades que correspondam aos seus níveis de habilidades durante a rápida transformação econômica do país. Há também planos para colaboração com universidades de Hong Kong e da China continental, devido à crescente demanda por especialistas que compreendam os ambientes de negócios de ambos os países.", "titulo_pt": "Kazáquia busca se tornar centro educacional, mas especialistas dizem que os empregos devem corresponder às habilidades", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 151524, "titulo": "Safras da Europa atingem maturação mais cedo devido às mudanças climáticas", "url": "https://www.cnnbrasil.com.br/agro/safras-da-europa-atingem/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-07T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dados da Comissão Europeia indicam que a maturação precoce de culturas como milho e colza tem ocorrido desde 2000 devido ao aquecimento global.", "titulo_pt": "Safras da Europa atingem maturação mais cedo devido às mudanças climáticas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 151439, "titulo": "China atualiza para 43 mortos pelo desastre na fronteira com Nepal e centenas seguem desaparecidos", "url": "https://www.brasildefato.com.br/2026/09/07/china-atualiza-para-43-mortos-pelo-desastre-na-fronteira-com-nepal-e-centenas-seguem-desaparecidos/", "fonte_id": "brasil_de_fato", "data_pub": "2026-09-07T19:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A China relatou 43 mortos e centenas desaparecidos após um deslizamento de terra causado pelo colapso de uma geleira no Nepal, na cidade de Gyirong, que também é conhecida como Jilong, localizada no Tibete, China.", "titulo_pt": "China atualiza para 43 mortos e centenas desaparecidos após desastre na fronteira com Nepal", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 150704, "titulo": "Itália tem verão mais quente em mais de 75 anos, diz instituto", "url": "https://www.cnnbrasil.com.br/internacional/italia-tem-verao-mais-quente-em-mais-de-75-anos-diz-instituto/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-07T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os dados indicam que 2026 será o ano mais quente na Itália desde o início da coleta de informações meteorológicas. O Instituto italiano de meteorologia registrou que 2026 terminará como o ano mais quente do país em mais de 75 anos de registro.", "titulo_pt": "Itália registra verão mais quente em mais de 75 anos, diz instituto", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 150602, "titulo": "Enorme erupção vulcânica na Indonésia cancela voos e afeta 270.000 passageiros; veja vídeo", "url": "https://veja.abril.com.br/mundo/enorme-erupcao-vulcanica-na-indonesia-cancela-voos-e-afeta-270-000-passageiros-veja-video/", "fonte_id": "veja", "data_pub": "2026-09-07T16:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma enorme erupção vulcânica no Anak Krakatoa, perto de Jacarta, Indonésia, cancelou voos e afetou cerca de 270.000 passageiros. A erupção expeliu lava e gerou uma explosão ouvida a centenas de quilômetros de distância.", "titulo_pt": "Enorme erupção vulcânica na Indonésia cancela voos e afeta 270.000 passageiros", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 151051, "titulo": "Passengers face flight chaos in Indonesia after Anak Krakatau eruption", "url": "http://www.euronews.com/video/2026/09/07/passengers-face-flight-chaos-in-indonesia-after-anak-krakatau-eruption", "fonte_id": "euronews", "data_pub": "2026-09-07T15:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias aeroportos na Indonésia foram fechados devido à erupção do vulcão Anak Krakatau, cancelando 2.300 voos e deixando mais de 268.000 passageiros em situação de espera por reembolsos.", "titulo_pt": "Viajantes enfrentam caos aéreo na indonésia após erupção do vulcão Anak Krakatau", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 150907, "titulo": "Record strength El Niño could mean bigger supermarket bills for Australians, experts warn", "url": "https://www.theguardian.com/business/2026/sep/08/record-strength-el-nino-could-mean-bigger-supermarket-bills-for-australians-experts-warn", "fonte_id": "guardian_world", "data_pub": "2026-09-07T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um El Niño extremamente forte, conforme previsto, pode levar a preços mais altos dos alimentos nos próximos 12 meses devido a condições climáticas quentes e secas nas regiões de cultivo da Austrália oriental. Especialistas alertam que isso aumentará a pressão sobre os lares já sobrecarregados com a elevação dos preços dos alimentos pós-pandemia e complicará os esforços do Banco da Reserva para controlar a inflação.", "titulo_pt": "Força recorde do El Niño pode causar aumentos nos preços dos alimentos na austrália, alertam especialistas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 150553, "titulo": "Combater poluição e mudança climática pode elevar PIB global em 2,8% até 2035, diz ONU", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/combater-poluicao-e-mudanca-climatica-pode-elevar-pib-global-em-28-ate-2035-diz-onu.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-07T13:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Combater a poluição do ar e as mudanças climáticas pode aumentar o PIB global em 2,8% até 2035, de acordo com um relatório da ONU. A maior parte da população mundial ainda está exposta a níveis de poluição acima dos padrões globais.", "titulo_pt": "Combater poluição e mudança climática pode elevar PIB global em 2,8% até 2035, diz ONU", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 149956, "titulo": "Como a China tenta cortar a poluição antes que ela chegue ao ar", "url": "https://veja.abril.com.br/coluna/giro-pelo-oriente/como-a-china-tenta-cortar-a-poluicao-antes-que-ela-chegue-ao-ar/", "fonte_id": "veja", "data_pub": "2026-09-07T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A China está investindo em energia renovável, redes elétricas inteligentes, veículos de nova energia e mudanças na indústria com o objetivo de reduzir as emissões em suas cidades.", "titulo_pt": "Como a China tenta cortar a poluição antes que ela chegue às cidades", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 150240, "titulo": "Clowns take over the streets of Brazil’s historic Mariana", "url": "http://www.euronews.com/video/2026/09/07/clowns-take-over-the-streets-of-brazils-historic-mariana", "fonte_id": "euronews", "data_pub": "2026-09-07T09:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Acerca de 100 palhaços e fãs de circo se reuniram no centro histórico da cidade de Mariana, no Brasil, para participar de um encontro internacional que celebra circo, música e cor.", "titulo_pt": "Palhaços tomam conta do centro histórico de Mariana, no Brasil", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 149928, "titulo": "Enchente relâmpago no Nepal e na China soma quase 1.400 mortos", "url": "https://www.cnnbrasil.com.br/internacional/numero-de-mortos-em-enchentes-no-nepal-sobe/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-07T09:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A enchente relâmpago que atingiu a fronteira entre Nepal e China deixou quase 1.400 mortos. O número total de desaparecidos é superior a 5 mil pessoas, e 13 mil foram resgatadas.", "titulo_pt": "Enchente relâmpago no Nepal e na China soma quase 1.400 mortos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 150381, "titulo": "Nepal’s US$2.5 billion flood bill puts UN climate fund to its biggest test yet", "url": "https://www.scmp.com/week-asia/health-environment/article/3366581/nepals-us25-billion-flood-bill-puts-un-climate-fund-its-biggest-test-yet?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-07T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nepal solicitou auxílio financeiro após as catástrofes causadas por inundações que resultaram em centenas de mortes e prejuízos econômicos bilionários. O país pediu ao Fundo da ONU para responder a perdas e danos que agilize, atue diretamente e efetivamente em meio à pior desastre natural em décadas.", "titulo_pt": "Nepal busca ajuda financeira de US$ 2,5 bilhões após inundações após desastre climático", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 150242, "titulo": "Heavy smoke and flames after Amazon cargo plane overruns runway in Miami", "url": "http://www.euronews.com/video/2026/09/07/heavy-smoke-and-flames-after-amazon-cargo-plane-overruns-runway-in-miami", "fonte_id": "euronews", "data_pub": "2026-09-07T08:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um avião de carga da Amazon perdeu o controle no runway do Aeroporto Internacional de Miami, colidiu com veículos e pegou fogo. Cinco pessoas morreram e outras cinco ficaram feridas. A FAA e o NTSB estão investigando o incidente.", "titulo_pt": "Incêndio e colisão envolvem avião de carga da Amazon no runway de Miami", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 150385, "titulo": "Malaysia lifts haze emergency in Sarawak, but warns pollution risks remain", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3366615/malaysia-lifts-haze-emergency-sarawak-warns-pollution-risks-remain?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-07T07:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Malásia encerrou a emergência devido à neblina em Sarawak, no estado de Borneu, mas advertiu que os níveis muito ruins de poluição do ar permanecem devido a incêndios florestais na Indonésia. A poluição foi tão crítica em Serian que levou a encerramento de escolas em algumas partes do estado.", "titulo_pt": "Malásia encerra emergência de neblina em Sarawak, mas alerta sobre riscos de poluição", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 150245, "titulo": "Nepal holds a day of mourning and rescue efforts continue after flash floods kill 1,300", "url": "http://www.euronews.com/2026/09/07/nepal-holds-a-day-of-mourning-and-rescue-efforts-continue-after-flash-floods-kill-1300", "fonte_id": "euronews", "data_pub": "2026-09-07T06:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nepal está em estado de luto e as operações de resgate continuam após cheias que resultaram na morte de 1.300 pessoas. As buscas se concentraram em 12 projetos hidrelétricos, onde cerca de 900 trabalhadores estão desaparecidos e aproximadamente 500 estariam presos em diversos túneis.", "titulo_pt": "Nepal realiza dia de luto e operações de resgate continuam após cheias que deixam 1.300 mortos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 149902, "titulo": "Manaus, coração da maior reserva de água do mundo, corre risco de secar até 2040", "url": "https://exame.com/esg/manaus-coracao-da-maior-reserva-de-agua-do-mundo-pode-enfrentar-escassez-ate-2040/", "fonte_id": "exame", "data_pub": "2026-09-07T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo do Trata Brasil indica que o uso descontrolado de poços subterrâneos e as mudanças climáticas podem colocar em risco o abastecimento de água da capital do Amazonas, Manaus, até 2040.", "titulo_pt": "Manaus, centro de maior reserva de água do mundo, corre risco de secar até 2040", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 150173, "titulo": "Schools Close Across Sarawak Due to Toxic Haze From Indonesian Wildfires", "url": "https://thediplomat.com/2026/09/schools-close-across-sarawak-due-to-toxic-haze-from-indonesian-wildfires/", "fonte_id": "the_diplomat", "data_pub": "2026-09-07T04:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Escolas foram fechadas em toda a Sarawak devido a uma névoa tóxica causada por incêndios florestais na Indonésia. Os incêndios têm durado semanas em grandes áreas da Sumatra e Kalimantan, agravados por uma estação seca extremamente seca.", "titulo_pt": "Escolas fechadas em Sarawak devido a névoa tóxica de incêndios florestais na indonésia", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 151654, "titulo": "El Uscis debe acatar: las nuevas condiciones para inmigrantes venezolanos que piden asilo en EE.UU. en septiembre 2026", "url": "https://www.lanacion.com.ar/estados-unidos/migraciones/el-uscis-debe-acatar-las-nuevas-condiciones-para-inmigrantes-venezolanos-que-piden-asilo-en-eeuu-nid07092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-07T21:49:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um novo julgamento da Junta de Apelações de Inmigración exigiu que o USCIS e os juízes migratórios revisem individualmente as solicitações de asilo de venezuelanos a partir de setembro de 2026. A decisão implica na avaliação se os supostos perseguidores ainda representam uma ameaça após a queda de Nicolás Maduro.", "titulo_pt": "Uscis deve acatar: novas condições para solicitações de asilo de venezuelanos nos EUA a partir de setembro 2026", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 151168, "titulo": "UN chief urges ‘accountability’ after 23 die in US immigration custody in 2026", "url": "https://www.scmp.com/news/world/united-states-canada/article/3366690/un-chief-urges-accountability-after-23-die-us-immigration-custody-2026?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-07T17:32:00Z", "idioma": "en", "provavel_duplicata_de": 151053, "texto_pt": "O diretor dos direitos humanos da ONU exigiu responsabilização por mortes em detenção de imigrantes nos EUA em 2026 e pediu para que as deportações para locais onde as pessoas enfrentam 'danos irreparáveis' sejam paradas. Segundo ele, 23 pessoas morreram em custódia de imigração nos EUA no ano passado.", "titulo_pt": "Chefe da ONU pede responsabilização após 23 mortes em detenção de imigrantes nos EUA em 2026", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 150599, "titulo": "Passageiro é amarrado com fita adesiva após ataques racistas e homofóbicos em voo nos EUA", "url": "https://veja.abril.com.br/mundo/passageiro-e-amarrado-com-fita-adesiva-apos-ataques-racistas-e-homofobicos-em-voo-nos-eua/", "fonte_id": "veja", "data_pub": "2026-09-07T16:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Arthur Layne Lundeen, de 67 anos, foi acusado de agressão de segundo grau e conduta desordeira após amarrar um passageiro com fita adesiva em um voo dos Estados Unidos. Os incidentes foram motivados por ataques racistas e homofóbicos.", "titulo_pt": "Passageiro é amarrado com fita adesiva após ataques racistas e homofóbicos em voo nos EUA", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 150906, "titulo": "Stolen Generations survivors have more health challenges than other First Nations people", "url": "https://www.theguardian.com/australia-news/2026/sep/08/stolen-generations-survivors-have-more-health-challenges-than-other-first-nations-people-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-09-07T15:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório do Australian Institute of Health and Welfare (AIHW) revela que as gerações de indígenas australianos forçosamente removidos sob políticas de integração governamentais enfrentam desafios de saúde físicos maiores em comparação com a população indígena e não-indígena em geral. O relatório foi encomendado pelo Healing Foundation, uma entidade de advocacy indígena.", "titulo_pt": "Vitima da geração roubada tem mais desafios de saúde que outros povos indígenas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 151183, "titulo": "UN rights chief warns AI could pose ‘existential’ risk to humanity’", "url": "https://www.scmp.com/news/world/europe/article/3366672/un-rights-chief-warns-ai-could-pose-existential-risk-humanity?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-07T13:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe das direitos humanos da ONU, Volker Turk, alertou que a inteligência artificial pode representar um risco existencial para a humanidade e prometeu pressionar as empresas de AI a reduzir riscos, como interrupções de serviços, comunicações e sistemas democráticos. Ele também exigiu responsabilidade sobre mortes em custódia de imigrantes nos EUA e condenou o uso supostamente autônomo de armas por Russia.", "titulo_pt": "Chefe da ONU sobre direitos humanos avisa que IA pode representar risco existencial para a humanidade", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 150998, "titulo": "Anne-Cécile Mailfert, president of Fondation Des Demmes: 'For the first time, perhaps, a gender-violence bill was shaped from the victims' perspective'", "url": "https://www.lemonde.fr/en/le-monde-festival/article/2026/09/07/anne-cecile-mailfert-president-of-fondation-des-demmes-for-the-first-time-perhaps-a-gender-violence-bill-was-shaped-from-the-victims-perspective_6757251_97.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-07T12:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anne-Cécile Mailfert, presidente da Fondation Des Demmes, participou das discussões que levaram à proposta legislativa sobre violência de gênero. Ela explica as origens, conteúdo e como a proposta chegou ao agenda parlamentar após o caso de Lyhanna, uma menina de 11 anos.", "titulo_pt": "Anne-cécile Mailfert, presidente da Fondation Des Demmes: 'pela primeira vez, talvez, uma proposta de lei sobre violência de gênero foi formulada partindo do ponto de vista das vítimas'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 150825, "titulo": "Víctimas, parejas o “narco reinas”: los estereotipos sobre las mujeres en el crimen organizado", "url": "https://www.ciperchile.cl/2026/09/07/victimas-parejas-o-narco-reinas-los-estereotipos-sobre-las-mujeres-en-el-crimen-organizado/?utm_source=rss&utm_medium=rss&utm_campaign=victimas-parejas-o-narco-reinas-los-estereotipos-sobre-las-mujeres-en-el-crimen-organizado", "fonte_id": "ciper_chile", "data_pub": "2026-09-07T12:24:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo explora os estereótipos associados às mulheres no crime organizado, abordando suas papéis como vítimas, parceiras ou 'narco rainhas'.", "titulo_pt": "Vítimas, parceiras ou 'narco rainhas': os estereótipos sobre as mulheres no crime organizado", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 151736, "titulo": "Belgrade Pride March Marks 25 Years with Call for Tolerance", "url": "https://balkaninsight.com/2026/09/07/belgrade-pride-march-marks-25-years-with-call-for-tolerance/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-09-07T10:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Centenas de pessoas participaram da marcha anual de Pride em Belgrado, celebrando 25 anos desde o primeiro evento em 2001, que foi interrompido por violência.", "titulo_pt": "Marcha de Pride em belgrado marca 25 anos com apelo à tolerância", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 151053, "titulo": "UN rights chief urges 'accountability' after 23 die in US immigration custody in 2026", "url": "http://www.euronews.com/2026/09/07/un-rights-chief-urges-accountability-after-23-die-in-us-immigration-custody-in-2026", "fonte_id": "euronews", "data_pub": "2026-09-07T10:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório conjunto da Human Rights Watch e Physicians for Human Rights, divulgado em junho, afirma que o número de mortes de pessoas em detenção da ICE atingiu o nível mais alto em mais de uma década durante o aprofundamento das medidas de repressão de Trump.", "titulo_pt": "Chefe das nações unidas pede responsabilização após 23 morrerem em custódia de imigrantes nos EUA em 2026", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 150241, "titulo": "Popular Egyptian TV presenter Sarah Khalifa faces appeal battle after death sentence", "url": "http://www.euronews.com/2026/09/07/popular-egyptian-tv-presenter-sarah-khalifa-faces-appeal-battle-after-death-sentence", "fonte_id": "euronews", "data_pub": "2026-09-07T09:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A apresentadora de TV egípcia Sarah Khalifa e 11 outras pessoas foram condenadas à morte em um caso de tráfico de drogas sintéticas. É esperado que haja uma batalha legal, incluindo apelos e desafios legais adicionais.", "titulo_pt": "Apresentadora egípcia Sarah Khalifa enfrenta batalha legal após sentença de morte", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 150208, "titulo": "New evidence reveals chemical weapons use in Sudan in 2024", "url": "https://www.lemonde.fr/en/le-monde-africa/article/2026/09/07/new-evidence-reveals-chemical-weapons-use-in-sudan-in-2024_6757239_124.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-07T08:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Documentos internos, vídeos, fotos e interceptações de telefonemas obtidos pela 'The Washington Post' e 'The New York Times' confirmam que bombas de cloro foram desenvolvidas pelo exército sudanês e utilizadas por pelo menos seis meses contra seus oponentes paramilitares.", "titulo_pt": "Novas evidências indicam uso de armas químicas no sudão em 2024", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 150450, "titulo": "Prosecutors demand 27-yr prison term for religious leader over sexual assault", "url": "https://en.yna.co.kr/view/AEN20260907005900315", "fonte_id": "yonhap_news", "data_pub": "2026-09-07T06:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Procuradores solicitaram uma pena de 27 anos de prisão para um líder religioso por supostos abusos sexuais.", "titulo_pt": "Procuradores pedem 27 anos de prisão para lí
