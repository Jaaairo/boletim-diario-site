<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

d Trump, e o presidente da China, Xi Jinping, concordaram em estabelecer marcos comuns para a inteligência artificial. Na Europa, o Reino Unido e a União Europeia chegaram a um acordo considerado um marco para facilitar o comércio e a mobilidade juvenil, mas as negociações continuam em relação às taxas de universidade.\n\nMoscou intensificou suas operações militares na Ucrânia, lançando mais de 110 mísseis que causaram ao menos oito mortes, segundo o presidente ucraniano Volodymyr Zelensky. O ataque, em resposta a um ataque ucraniano a uma ponte na Crimeia, levou à queda de um míssil na Polônia, resultando em um incidente diplomático entre Moscou e Varsóvia. Em um desenvolvimento geopolítico, um tribunal do Catar declarou inconstitucional uma lei que proibia o uso de símbolos do exército boêmio durante a guerra dos anos 90, enquanto o Emir do Catar, Sheikh Tamim bin Hamad Al Thani, apelou por esforços diplomáticos para desescalar conflitos regionais. Estes eventos refletem o cenário complexo da geopolítica global, com ações diretas e indiretas de potências mundiais influenciando a situação na Ucrânia e no Oriente Médio.", "economia": "As ações da Anthropic caíram 10% na sexta-feira, após subirem 17% em sua estreia na bolsa, refletindo preocupações com a volatilidade do mercado de inteligência artificial. Em outra notícia, o TAIEX, índice da bolsa de valores de Taiwan, registrou uma queda de 17,9% em sua pior semana desde 1991, refletindo a volatilidade do mercado de ações. Além disso, o dólar brasileiro operava estável, caminhando para subir pela quarta semana consecutiva, influenciado pelas expectativas de um novo aperto monetário pelo Fed e pela busca por ativos seguros devido às preocupações com a inteligência artificial. O Brasil perdeu investimentos bilionários em data centers devido à falta de uma política coordenada para o setor, enquanto a editora L&PM ingressou com uma ação judicial contra a OpenAI por supostas violações de direitos autorais. Ainda, a Meta reavaliou sua meta de zerar as emissões de carbono até 2030 devido ao avanço da inteligência artificial, e a Anthropic, após sua estreia histórica na bolsa, enfrentará desafios para gerar resultados financeiros que justifiquem seu valor atual.", "tecnologia": "A aprovação da venda de produtos Nvidia para a China é destaque na tecnologia, conforme informou o Departamento de Comércio dos Estados Unidos. A empresa Neuralink, liderada por Elon Musk, anunciou que um implante capaz de restaurar a visão em pessoas cegas está pronto, visando melhorar a vida de cegos através da transmissão de imagens diretamente ao cérebro. Na área de inteligência artificial, a TSMC está endurecendo as restrições para projetistas chineses de chips, limitando pedidos de fabricação avançada e suspendendo pedidos de clientes afetados. O TikTok lançou uma ferramenta global de detecção de deepfakes para figuras públicas, visando combater a desinformação gerada por inteligência artificial antes das eleições europeias do próximo ano. Além disso, a prefeita de Phoenix, Kate Gallego, busca mais investimento tecnológico na cidade, mas com condições, já que centrais de dados estão sobrecarregando recursos e gerando frustração entre os moradores.", "ciencia": "Um matemático da empresa Anthropic afirmou ter usado o chatbot Claude para tentar provar a Hipótese de Riemann, um problema matemático que permanece inabalado há mais de 160 anos. No entanto, a afirmação ainda não foi verificada por terceiros e a prova não foi revisada por especialistas externos. Em outro desenvolvimento, a Embrapa e o Instituto Ficus lançaram a plataforma Observatório do Cânhamo, que reúne informações sobre pesquisas, regras e mapas agrícolas com o objetivo de reduzir a dependência de importações do produto. Além disso, a missão BepiColombo, da Europa e do Japão, chegou ao planeta Mercúrio, o planeta mais próximo do Sol, marcando um passo importante antes de uma missão de pouso ser enviada. Estas notícias destacam avanços em diversas áreas da ciência, desde matemática e agronomia até astronomia.", "cultura": "Taiwan será o anfitrião do Simpósio Internacional das Orquídeas em 2030, com foco na promoção da pesquisa e no compartilhamento de conhecimentos sobre orquídeas de todo o mundo. Em Yorkshire, no Reino Unido, a exposição The Circus apresenta obras de Marc Chagall, retratando clowns, ringmasters e acrobatas, transportando o visitante para um mundo mágico. A Universidade Adolfo Ibáñez implementa um modelo educativo que combina formação disciplinar, Artes Liberais e novas formas de ensino, preparando profissionais para cenários de trabalho incertos. A série 'Bluey', da Austrália, conquistou o mundo, com crianças falando sotaque australiano, levando a uma maior apreciação das produções locais.", "sociedade": "No Brasil, o Dia da Consciência Negra foi lembrado com diversos eventos e discussões sobre desigualdade racial. De acordo com o EF English Proficiency Index 2026, o Brasil ocupa o quarto lugar em termos de proficiência em inglês na América Latina. Em São Paulo, um suspeito de ter matado sua namorada a facadas no Paraná foi preso em uma rodovia. O número de casos de COVID-19 aumentou em 19 estados brasileiros, mesmo com a disponibilidade excessiva de vacinas. No Rio Grande do Sul, um temporal causou destruição em várias cidades, com ruas cobertas de granizo e destroços. No Reino Unido, uma mulher foi dopada e oferecida a estranhos pelo marido durante 13 anos. Em Nova York, o prefeito Eric Adams apresentou um plano para fechar a prisão controversa de Rikers Island até 2032. Em todo o Brasil, o prazo para pedir reaplicação do Enem 2026 termina nesta sexta-feira (20).", "meio_ambiente": "A Venezuela apresentou um modelo próprio de participação comunitária na proteção ambiental e combate às mudanças climáticas durante a 31ª Conferência das Nações Unidas, ressaltando a importância de políticas locais e projetos ambientais. Em outro evento, a Venezuela participou da COP31, apresentando suas iniciativas. Na Colômbia, o hipopótamo Fiona, famoso nas redes sociais, faleceu após engolir um gorro de lã. Em São Paulo, um tapir chamado Yunga nasceu no Ecoparque, representando um avanço para a conservação de uma espécie ameaçada. No Rio Grande do Sul, um temporal com ventos de 114 km/h destelhou cerca de 5 mil casas, deixando 60 feridos e causando prejuízos.", "direitos_humanos": "A Corte Internacional de Justiça declarou que Mianmar cometeu genocídio estatal contra o povo rohingya em 2016 e 2017, considerado um julgamento histórico, pois foi a primeira vez que o órgão judicial mais importante da ONU atribuiu responsabilidade por genocídio a um país. Em outro contexto, a execução nos Estados Unidos durou uma hora e o condenado relatou ter sentido dor durante o processo. Por outro lado, o Vietnã aboliu a pena de morte para tráfico de drogas. Além disso, a UNICEF informou que as mortes de crianças na Ucrânia atingiram o nível mais alto em quase quatro anos, devido a ataques persistentes em locais como casas e jardins de infância, refletindo a gravidade da situação humanitária na região."}, "resumo_do_dia": {"politica_nacional": [{"id": 277009, "titulo": "COP31 é prorrogada após impasse sobre combustíveis fósseis", "url": "https://www.poder360.com.br/poder-internacional/cop31-e-prorrogada-apos-impasse-sobre-combustiveis-fosseis/", "fonte_id": "poder360", "data_pub": "2026-11-20T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A COP31 foi prorrogada devido a um impasse sobre a inclusão de metas relacionadas a combustíveis fósseis no acordo final. O financiamento climático também gerou divisões entre as delegações.", "titulo_pt": "COP31 é prorrogada por disputas sobre combustíveis fósseis e financiamento climático", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 277010, "titulo": "Justiça autoriza Pão de Açúcar a parcelar dívida trabalhista em 72 vezes", "url": "https://www.poder360.com.br/poder-economia/justica-autoriza-pao-de nvade a competência legislativa da União.", "titulo_pt": "STF anula lei cearense sobre registro de transferência de veículos", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 276994, "titulo": "Michelle Bolsonaro disse ficar feliz por ter uma mulher candidata no Senado, afirma Tereza Cristina", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/michelle-bolsonaro-disse-ficar-feliz-por-ter-uma-mulher-candidata-no-senado-afirma-tereza-cristina.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-20T16:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tereza Cristina, candidata a presidente do Senado, afirmou que Michelle Bolsonaro, ex-primeira-dama e senadora eleita, expressou satisfação com a presença de outra mulher na disputa pela vaga no Senado.", "titulo_pt": "Tereza Cristina diz que michelle Bolsonaro ficou feliz com a presença de outra mulher na disputa pelo Senado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 277261, "titulo": "Governo eleito pode transformar diálogo já iniciado em compromisso com resultados", "url": "https://www.jota.info/opiniao-e-analise/artigos/governo-eleito-pode-transformar-dialogo-ja-iniciado-em-compromisso-com-resultados", "fonte_id": "jota", "data_pub": "2026-11-20T16:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo eleito pode transformar o diálogo já iniciado em um compromisso com resultados. A influência sobre o Estado é exercida diariamente, e não se pode adiar mais a transparência desse processo.", "titulo_pt": "Governo eleito pode transformar diálogo em compromisso com resultados", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 276995, "titulo": "Entenda o que se sabe sobre relatórios da PF a respeito de ministros do STF e o que acontece agora", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/entenda-o-que-se-sabe-sobre-relatorios-da-pf-a-respeito-de-ministros-do-stf-e-o-que-acontece-agora.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-20T16:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF, Edson Fachin, retirou o sigilo de um relatório da Polícia Federal sobre o ministro André Mendonça, em resposta a um pedido do próprio Mendonça. O documento será examinado pela PGR para decidir se há base para uma investigação.", "titulo_pt": "Entenda o que se sabe sobre relatórios da PF a respeito de ministros do STF e o que acontece agora", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 276996, "titulo": "Moraes vota no STF para manter passaportes de Flávio Bolsonaro cancelados", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/moraes-vota-no-stf-para-manter-passaportes-de-flavio-bolsonaro-cancelados.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-20T15:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes, do STF, votou para manter o cancelamento dos passaportes de Flávio Bolsonaro e a proibição de que ele deixe o país. Isso ocorreu em resposta a uma defesa de Flávio que pediu a revogação das medidas cautelares anteriormente determinadas pelo próprio magistrado.", "titulo_pt": "Moraes vota no STF para manter cancelamento dos passaportes de Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 276966, "titulo": "Linha 6-Laranja do metrô de SP terá usina solar para ajudar na demanda por energia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/linha-6-laranja-de-metro-de-sp-tera-usina-solar-para-ajudar-na-demanda-por-energia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-20T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Linha 6-Laranja do me asse": "A"}, {"id": 276963, "titulo": "'Um mal necessário': como a Anthropic conseguiu realizar seu IPO", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/um-mal-necessario-como-a-anthropic-conseguiu-realizar-seu-ipo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-20T16:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic realizou a maior oferta pública inicial da história. Após o sucesso, Dario Amodei pediu que sua equipe descansasse um pouco antes de retornar ao trabalho.", "titulo_pt": "Um mal necessário: como a Anthropic realizou seu IPO", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 276964, "titulo": "Editora L&PM vai à Justiça contra OpenAI por suposta violação de direitos autorais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/editora-lpm-vai-a-justica-contra-openai-por-suposta-violacao-de-direitos-autorais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-20T16:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A editora L&PM ingressou com uma ação judicial contra a OpenAI por supostas violações de direitos autorais.", "titulo_pt": "Editora L&PM processa OpenAI por supostas violações de direitos autorais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 276967, "titulo": "Brasil perde investimentos bilionários em data centers por falta de política para o setor, diz VP da Scala", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/c-level-entrevista/2026/11/brasil-perde-investimentos-bilionarios-em-data-centers-por-falta-de-politica-para-o-setor-diz-vp-da-scala.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-20T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil está perdendo investimentos bilionários em data centers para ou l/", "fonte_id": "la_tercera", "data_pub": "2026-11-20T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo explora aspectos da inteligência artificial, focando em detalhes e brechas nesse campo tecnológico.", "titulo_pt": "Por entre as frestas da inteligência artificial", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 277691, "titulo": "Don’t Bring Jensen Back", "url": "https://www.wired.com/story/dont-bring-jensen-back/", "fonte_id": "wired", "data_pub": "2026-11-20T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma multidão de executivos de tecnologia está pressionando a Nvidia para recontratar Jensen Huang como CEO. No entanto, isso não é uma boa ideia.", "titulo_pt": "Não volte Jensen", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 277555, "titulo": "The AI fever in markets is breaking", "url": "https://www.ft.com/content/b1b2e948-ff5e-48c4-bc3e-f8e75c9e4af1?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-20T15:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores estão percebendo que o fascínio com a tecnologia de inteligência artificial pode estar diminuindo, com as ações dos Estados Unidos em caminho para um dos piores anos dos últimos vinte.", "titulo_pt": "A febre da IA no mercado está se dissipando", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 277515, "titulo": "As Anthropic shares tank, investors scramble to hedge. It could be very expensive", "url": "https://www.cnbc.com/2026/11/20/as-anthropic-shares-tank-investors-scramble-to-hedge-it-could-be-very-expensive.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-20T15:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As opções da Anthropic foram listadas na segunda-feira. Elas provavelmente serão caras para os investidores que buscam proteção.", "titulo_pt": "Ações da Anthropic listadas, mas podem ser muito caras para hedge", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 277507, "titulo": "SpaceX’s subsidiary Cursor tells lawmakers it's considering phasing out Chinese AI models", "url": "https://www.cnbc.com/2026/11/20/cursor-chinese-ai-models-geopolitical-risk.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-20T14:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A subsidiária da SpaceX, Cursor, está considerando parar o uso de modelos de inteligência artificial desenvolvidos na China devido a riscos geopolíticos, de acordo com um relatório da Câmara dos Representantes consultado pela CNBC.", "titulo_pt": "Subsidiária da spacex considera parar uso de modelos de IA chineses por riscos geopolíticos", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 277724, "titulo": "I Don’t Trust Visual Recordings Anymore. But One Day I Will Again", "url": "https://spectrum.ieee.org/fighting-back-against-deep-fakes", "fonte_id": "ieee_spectrum", "data_pub": "2026-11-20T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em março deste ano, uma série de e-mails e mensagens de texto de repórteres de todo o mundo interromperam um sábado tranquilo. Uma agência de notícias iraniana havia exibido um vídeo antigo supostamente mostrando um míssil Tomahawk norte-americano atingindo uma escola, com relatos de mais de 175 mortos, maioria crianças. O presidente e a força militar dos Estados Unidos negaram a responsabilidade. Diante da era das AI gerativas e dos deepfakes, todos, inclusive o autor, estavam céticos sobre a autenticidade do vídeo.", "titulo_pt": "Não confio mais em gravações visuais. Mas um dia voltarei a fazer isso.", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 277692, "titulo": "The Best Pura Deals for Cyber Week (2026)", "url": "https://www.wired.com/story/pura-black-friday-2026/", "fonte_id": "wired", "data_pub": "2026-11-20T13:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pura perfumes estão com 20% de desconto e difusores com 30% de desconto até 6 de dezembro. O autor testou três gerações de dispositivos Pura e sugere quais comprar.", "titulo_pt": "Melhores ofertas Pura para a Cyber semana (2026)", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 277649, "titulo": "The Download: inside the quest to make our minds immortal", "url": "https://www.technologyreview.com/2026/11/20/1149371/the-download-quest-to-make-minds-immortal/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-20T13:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Download desta edição da newsletter explora o esforço de cientistas para preservar a consciência individual através da tecnologia, com o objetivo de manter o funcionamento cerebral mesmo após a morte física. Alguns cientistas estão trabalhando em métodos para preservar a identidade pessoal.", "titulo_pt": "Download: dentro da busca pela imortalidade mental", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 277636, "titulo": "After Nvidia, will AMD be a target as China’s ‘2nd-choice’ supplier for AI chips?", "url": "https://www.scmp.com/tech/tech-war/article/3375249/after-nvidia-will-amd-be-target-chinas-second-choice-ai-chips", "fonte_id": "scmp", "data_pub": "2026-11-20T12:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Short sellers atacaram Advanced Micro Devices (AMD) devido a supostas conexões com empresas chinesas incluídas em lista negra pelo governo americano, fazendo com que suas ações caíssem mais de 10% em poucas horas e alimentando especulações sobre se a empresa poderia ser o próximo alvo após a Nvidia.", "titulo_pt": "Depois da Nvidia, a AMD será o próximo alvo como fornecedora chinesa de chips para IA?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 277711, "titulo": "Signal is blocking Gemini and Siri AI from reading your screen", "url": "https://www.theverge.com/ai-artificial-intelligence/1038390/signal-blocking-ai-agent-screenshots-mobile-app", "fonte_id": "the_verge", "data_pub": "2026-11-20T12:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Signal está proibindo a função de captura de tela em dispositivos Android e iOS para impedir que assistentes de inteligência artificial como Gemini e Siri leiam mensagens e outros dados dos usuários. A empresa afirma que as capacidades de inteligência artificial integradas aos sistemas operacionais, que analisam a informação na tela para aprender mais sobre o usuário, estão comprometendo a capacidade do Signal de garantir a privacidade independentemente.", "titulo_pt": "Signal proíbe captura de tela para impedir que assistentes de IA leiam mensagens", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 277387, "titulo": "Anthropic is public, now comes the hard part", "url": "https://www.axios.com/2026/11/20/anthropic-public-shareholders", "fonte_id": "axios", "data_pub": "2026-11-20T12:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Com sua oferta inicial de ações concluída, os acionistas da Anthropic estarão atentos ao progresso da empresa em se tornar uma que não depende de constantes investimentos de investidores e fornecedores. A Anthropic, junto com o OpenAI, está no centro da indústria que tem dominado os mercados de ações e dívidas nas últimas quatro anos, com investimentos em centrais de dados sendo uma parte crucial desse boom de infraestrutura de IA.", "titulo_pt": "Anthropic se torna pública, agora vem o desafio", "veiculo": "Axios", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 277623, "titulo": "Anthropic researcher says Claude has solved maths’ greatest riddle", "url": "https://www.scmp.com/news/world/united-states-canada/article/3375294/anthropic-researcher-says-claude-has-solved-maths-greatest-riddle", "fonte_id": "scmp", "data_pub": "2026-11-20T17:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um matemático da empresa de IA Anthropic afirma ter usado o chatbot Claude para provar a Hipótese de Riemann, um problema matemático que permaneceu inabalado por mais de 160 anos. No entanto, a afirmação ainda não foi verificada por terceiros e a prova não foi revisada por especialistas externos.", "titulo_pt": "Pesquisador da anthropic afirma ter resolvido o maior mistério matemático", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 277764, "titulo": "An El Niño amped by climate change has California bracing for the worst", "url": "https://www.sciencenews.org/article/el-nino-climate-change-california", "fonte_id": "science_news", "data_pub": "2026-11-20T17:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O El Niño de 1997-1998 inundou a Califórnia e causou danos globais. Agora, o mundo está se preparando para um Super El Niño que foi intensificado pelo aquecimento global.", "titulo_pt": "Um El Niño intensificado pelo clima mudou coloca a califórnia em estado de alerta", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 277026, "titulo": "Embrapa e Instituto Ficus lançam plataforma para mapear potencial produtivo do cânhamo no Brasil", "url": "https://veja.abril.com.br/brasil/embrapa-e-instituto-ficus-lancam-plataforma-para-mapear-potencial-produtivo-do-canhamo-no-brasil/", "fonte_id": "veja", "data_pub": "2026-11-20T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Embrapa e o Instituto Ficus lançaram a plataforma Observatório do Cânhamo durante a Expo Cannabis em São Paulo, que reúne informações sobre pesquisas, regras e mapas agrícolas com o objetivo de reduzir a dependência de importações do produto.", "titulo_pt": "Embrapa e Instituto Ficus lançam plataforma para mapear potencial produtivo do cânhamo no Brasil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 277771, "titulo": "AI just solved the ‘real’ Navier-Stokes problem", "url": "https://www.scientificamerican.com/article/ai-just-solved-the-real-navier-stokes-problem/", "fonte_id": "scientific_american", "data_pub": "2026-11-20T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tristan Buckmaster, professor da NYU, e Levent Alpöge, funcionário da Anthropic, apresentaram uma nova prova de Navier-Stokes blowup com auxílio de IA, dois meses após a OpenAI ter anunciado um resultado semelhante.", "titulo_pt": "IA resolviu o 'verdadeiro' problema de Navier-Stokes", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 277769, "titulo": "NASA Honor Awards Ceremony Recognizes Employees at Stennis Space Center", "url": "https://www.nasa.gov/centers-and-facilities/stennis/honor-awards-ceremony-at-stennis/", "fonte_id": "nasa_news", "data_pub": "2026-11-20T16:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante uma cerimônia de premiação realizada em 18 de novembro, funcionários do Centro Espacial Stennis, na Mississippi, foram reconhecidos por suas contribuições para a missão da NASA. Christine Powell, diretora do centro, e Jeremy Parsons, gerente do programa Artemis, apresentaram os prêmios.", "titulo_pt": "Cerimônia de premiações do NASA honors reconhece funcionários do centro espacial Stennis", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 277157, "titulo": "Flagrante no espaço: como uma gigante cósmica engoliu sua ‘irmã’ menor e gerou uma explosão colossal", "url": "https://www.cnnbrasil.com.br/ciencia/flagrante-no-espaco-como-uma-gigante-cosmica-engoliu-sua-irma-menor-e-gerou-uma-explosao-colossal/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T15:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um evento cósmico raro foi observado em tempo real, onde uma galáxia maior engoliu uma galáxia menor a 2,5 milhões de anos-luz de distância. O resultado foi uma erupção luminosa um milhão de vezes mais brilhante que o Sol.", "titulo_pt": "Flagrante no espaço: como uma galáxia gigante engoliu sua ‘irmã’ menor e gerou uma explosão colossal", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 277770, "titulo": "NASA’s Curiosity Mars Rover Collects Samples", "url": "https://www.nasa.gov/image-article/nasas-curiosity-mars-rover-collects-samples/", "fonte_id": "nasa_news", "data_pub": "2026-11-20T15:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Rover Curiosity da NASA coletou amostras de rochas na superfície de Marte, com 49 buracos de perfuração registrados em uma colagem de novembro de 2026. O rover usa seu perfurador, localizado no final do braço robótico, para colher amostras que são então analisadas por instrumentos internos.", "titulo_pt": "Rover Curiosity da nasa coleta amostras", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 277203, "titulo": "Como comprimido diário é a grande esperança contra um dos cânceres mais letais", "url": "https://www.bbc.com/portuguese/articles/c3ewvk8vglp1o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-20T15:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um comprimido diário chamado daraxonrasib parece reduzir e, possivelmente, eliminar tumores em alguns pacientes com câncer de pâncreas.", "titulo_pt": "Comprimido diário é a grande esperança contra um dos cânceres mais letais", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 277765, "titulo": "The Book Lover’s Gift Guide", "url": "https://www.sciencenews.org/article/books-favorite-read-holiday-2026-review", "fonte_id": "science_news", "data_pub": "2026-11-20T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O guia de presentes para apaixonados por livros da science_news destaca os melhores livros científicos do ano de 2026.", "titulo_pt": "Guia de presentes para amantes de livros de ciência", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 277206, "titulo": "A viagem de 8 anos que levou sonda a 'planeta misterioso' do sistema solar", "url": "https://www.bbc.com/portuguese/articles/c8vg2d3nkqe3o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-20T14:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A missão tem como objetivo fornecer a melhor visão do planeta Mercúrio, o mais próximo do Sol. Esta viagem durou 8 anos para chegar ao 'planeta misterioso' do sistema solar.", "titulo_pt": "A viagem de 8 anos que levou sonda a 'planeta misterioso' do sistema solar", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 277629, "titulo": "The real ‘fifth force’: how quantum statistics shapes our world in profound ways", "url": "https://www.scmp.com/news/china/science/article/3375177/real-fifth-force-how-quantum-statistics-shapes-our-world-profound-ways", "fonte_id": "scmp", "data_pub": "2026-11-20T14:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A física moderna reconhece quatro forças fundamentais: gravidade, eletromagnetismo e as forças fraca e forte subnucleares. Cada uma dessas forças desempenha um papel importante na nossa descrição do mundo, com a gravidade dominando o cosmos.", "titulo_pt": "A verdadeira 'quinta força': como as estatísticas quânticas moldam nosso mundo de maneiras profundos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 277734, "titulo": "STAT+: Pharmalittle: We’re reading about Sanofi eyeing Insmed, AI speeding drug development, and more", "url": "https://www.statnews.com/pharmalot/2026/11/20/sanofi-eyeing-insmed-ai-speeding-drug-development/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-20T14:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sanofi está avaliando a possibilidade de adquirir a Insmed. O FDA criticou a J&J por reclamações enganosas sobre um medicamento para câncer de bexiga. Outras notícias
