<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<main id="main"></main>

<div class="modal-overlay" id="modal-flag">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "02/08/2026 19:45", "stats": {"noticias_novas": 254, "resumos_gerados": 207}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva lançou sua candidatura à reeleição durante uma convenção do Partido dos Trabalhadores (PT) em São Paulo, com destaque para o uso de cores vermelhas e elementos como estampas de onça e chapéus Panamá. Aos 80 anos, Lula afirmou estar 'em ótima forma' e prometeu dar um 'salto além do básico' se reeleito. O evento também marcou a oficialização da chapa com Geraldo Alckmin como vice. Em Goiás, o governador Ronaldo Caiado criticou Lula e seu filho Flávio Bolsonaro, chamando o Brasil de 'sequestrado pelos dois rejeitados'. Na Paraíba, Flávio participou da oficialização de sua chapa para disputar o governo do estado. O PCB lançou Carlos Machado como candidato ao governo de São Paulo e Felipe de Oliveira Queiroz como vice. Outros partidos também definiram seus candidatos: o PRTB escolheu Leonardo Avalanche, o Democrata definiu Wilson Grassi Júnior, e o PSD oficializou Raquel Lyra à reeleição em Pernambuco.", "mundo": "A situação na cidade espanhola de Ceuta continua a provocar tensões na política europeia, com o aumento significativo da chegada de migrantes. O governo espanhol está enfrentando desafios para lidar com essa onda inesperada, que tem gerado instabilidade política no continente. Em outro desenvolvimento, Bernarda Rosalba Vera Contardo, uma chilena desaparecida durante o regime de Pinochet há 50 anos, foi encontrada viva em Santiago. No cenário político brasileiro, Arthur Lira será candidato pelo União Progressista à primeira eleição para o Senado do estado de Alagoas. Em um evento trágico na Argentina, uma nevasca intensa obrigou a retirada de emergência de mais de 200 turistas em Mendoza. Além disso, o governo da Austrália anunciou novas medidas para taxar as grandes tecnológicas que não pagarem por conteúdo jornalístico local.\n\nOs Estados Unidos expressaram preocupação com as ações militares da China, consideradas profundamente instabilizadoras. O presidente Donald Trump decidiu não atacar o Irã no momento, mas estabeleceu um prazo para as negociações com o país. A Venezuela anunciou que as negociações de transição começarão nesta semana, enquanto Taiwan reafirmou sua soberania sobre o Mar do Sul da China após ação de Manila. O número oficial de vietnamitas escolhendo Taiwan como destino para estudos aumentou.", "economia": "A AstraZeneca está negociando a fusão com a Bristol Myers Squibb, formando um dos maiores grupos farmacêuticos do mundo avaliados em quase US$ 400 bilhões. Esta parceria visa fortalecer as finanças das empresas e expandir sua presença global no setor de medicamentos. Além disso, a maior rede de cinemas do Brasil registrou um lucro recorde, ganhando destaque entre os investidores e se destacando como uma opção a longo prazo para o mercado. A Petrobras aumentou o preço do querosene de avião nas refinarias em 1,9%, equivalente a um acréscimo de R$ 0,09 por litro. Por outro lado, a Arábia Saudita e outros cinco membros da Opep+ decidiram aumentar a produção de petróleo em 188 mil barris por dia a partir de setembro. Este aumento foi uma resposta ao conflito entre Estados Unidos e Irã, que tem afetado os preços do petróleo globalmente.", "tecnologia": "A União Europeia entrou em vigor no dia 2 de fevereiro as novas regras para a regulamentação da inteligência artificial com base no 'AI Act', estabelecendo um marco legal importante para o setor. De outro lado, a marca chinesa Lepas, ligada ao grupo Chery, está confirmada para o mercado brasileiro, com foco em veículos de entrada e preços acessíveis. A empresa planeja lançar 11 modelos para competir diretamente com gigantes como Fiat e Volkswagen. Além disso, a escassez global de chips de memória afetou a disponibilidade do MacBook Air da Apple, que é seu modelo mais popular. Em relação à tecnologia, a RealorRender, uma ferramenta híbrida de inteligência artificial desenvolvida por pesquisadores alemães em colaboração com o escritório federal de segurança da Alemanha, pode detectar deepfakes com 91% de precisão e explicar os motivos pelos quais as imagens são falsas.", "ciencia": "Um eclipse solar total, conhecido como 'Eclipse do Século', será visível em vários países da África e do Oriente Médio. Este evento astronômico será o mais fotografiado na história. O fenômeno ocorre devido a uma combinação de radiação térmica e elementos rochosos após um impacto de asteroide, conforme estudos sugerem. Em outro desenvolvimento científico relevante, a resistência antimicrobiana está se espalhando pelos sistemas de água na África do Sul, levantando preocupações sobre a saúde pública e segurança alimentar. Além disso, pesquisadores da Universidade Estatal de Ohio estão examinando dentes de leite, unhas e amostras do solo para investigar os impactos potenciais de uma substância usada há décadas nas estradas do estado. Este estudo pode trazer novas descobertas sobre a evolução humana e o impacto ambiental ao longo dos séculos.", "cultura": "O Brasil e China celebram suas culturas através de uma mostra de cinema que se estende até 25 de outubro no Rio, exibindo 14 filmes, incluindo sete títulos chineses inéditos. O evento faz parte do Ano Cultural Brasil-China e oferece entrada gratuita. Paralelamente, o projeto 'ÀWA', liderado por Marcelo D2, promove a valorização das matrizes culturais afro-brasileiras através de um espetáculo cênico-musical. Em outra iniciativa cultural, Christopher Nolan defende que a crítica cinematográfica feita por aficionados não invalida o mérito do filme, apesar de identificar uma 'falha fundamental' na avaliação amadora. Por fim, a segunda temporada da série animada 'Batman: Caped Crusader' é elogiada como uma obra mestre que reflete as necessidades contemporâneas.", "sociedade": "Um suspeito armado rendeu uma família durante três horas e estuprou uma jovem na cidade de São Paulo, levando a moto antes de se acidentar contra um poste e ser preso. Em Itaquaquecetuba, um policial militar matou um suspeito disfarçado de policial durante uma tentativa de roubo. No Rio de Janeiro, equipes do CPAm apreenderam um balão gigante com 30 metros de diâmetro que caiu em Araruama. Docentes do Ctera aderiram a um paro nas províncias de Buenos Aires e CABA após as férias de inverno, enquanto o governo anunciou inspeções para garantir o funcionamento das escolas, mas não planeja realizar vigilância. O Programa Reforço Escolar será lançado na terça-feira (4/8) na cidade de Minas Gerais, atendendo até 5,8 mil estudantes com um investimento de R$ 8 milhões. Um influenciador do Ceará anunciou sua candidatura a deputado federal pelo PSB, já recebendo apoio do senador Cid Gomes. O Ministério Público do Rio Grande do Sul denunciou o proprietário de uma clínica e um engenheiro por mortes de idosos prensados em um elevador. A cidade de Angol suspendeu as aulas nas instituições municipais devido às danificações causadas pelo sistema frontal, com 76 pessoas afetadas e 25 casas com danos graves.", "meio_ambiente": "A Europa está enfrentando uma onda de calor recorde que está causando incêndios florestais e secagem do rio Danúbio, levando a uma crise energética na região. Em Washington, Estados Unidos, e no vizinho Canadá (British Columbia), as chamas atingiram mais de 100 mil hectares, forçando evacuações em massa. Na Hungria, a central nuclear de Paks parou pela primeira vez desde sua construção há 44 anos devido à falta de água para resfriar os reatores, que foi causada pela histórica baixa do rio Danúbio. Em Cuba, apagões afetaram mais da metade do país, incluindo a capital La Habana, após uma falha na rede elétrica nacional. A seca também está impactando a produção de legumes em todo o mundo, especialmente na França ocidental, onde até mesmo os sistemas de irrigação estão enfrentando dificuldades com a falta d'água e as sucessivas ondas de calor.", "direitos_humanos": "O número de mortes no massivo influxo de imigrantes para a cidade espanhola de Ceuta, na África do Norte, subiu para pelo menos 72, com cinco corpos adicionais encontrados nas praias da localidade. Este evento é descrito como um surto inédito que teve início na quinta-feira e mais de 50 mil pessoas entraram em Ceuta por terra e mar. Em outro desenvolvimento, ativistas dos direitos das pessoas com deficiência planejam realizar uma série de protestos durante o horário de pico na linha 4 do metrô de Seul, coincidindo com a votação do governo sobre a proposta de orçamento para 2027. O primeiro protesto está programado para ocorrer em 8 de agosto. Além disso, ativistas tibetanos realizaram um protesto contra a lei de unidade étnica da China em frente a um banco local. Em Israel, um vídeo da CCTV registrou o momento exato em que um menino palestino de nove anos foi baleado durante uma operação agrícola realizada por setentristas israelenses."}, "resumo_do_dia": {"politica_nacional": [{"id": 86445, "titulo": "PCB lança o historiador Carlos Machado como candidato ao governo de SP", "url": "https://www.metropoles.com/sao-paulo/pcb-candidato-governo-sp", "fonte_id": "metropoles", "data_pub": "2026-08-02T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Carlos Machado foi lançado como candidato do PCB ao governo de São Paulo durante uma convenção realizada na capital paulista no sábado (1º/8). Felipe de Oliveira Queiroz será seu vice.", "titulo_pt": "PCB lança Carlos Machado como candidato ao governo de SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 86479, "titulo": "Caiado sobre Lula e Flávio: Brasil está “sequestrado pelos dois rejeitados”", "url": "https://www.cnnbrasil.com.br/eleicoes/caiado-sobre-lula-e-flavio-brasil-esta-sequestrado-pelos-dois-rejeitados/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-02T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato do PSD, João de Jesus Caiado, criticou o presidente Lula e seu filho Flávio. Ele afirmou que o Brasil está 'sequestrado pelos dois rejeitados' e que seria o único capaz de vencer Lula em um segundo turno.", "titulo_pt": "Caiado sobre Lula e Flávio: Brasil está ‘sequestrado pelos dois rejeitados’", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 86417, "titulo": "Vermelho divide espaço com estampa de onça, broches e chapéu Panamá em convenção de Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/vermelho-divide-espaco-com-estampa-de-onca-broches-e-chapeu-panama-em-convencao-de-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-02T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O evento de lançamento da candidatura de Lula para a reeleição, realizado no domingo na Expo Center Norte, em São Paulo, destacou o vermelho como cor predominante, mas também incluiu elementos como estampas de onça e acessórios como broches e chapéus Panamá.", "titulo_pt": "Vermelho divide espaço com estampa de onça, broches e chapéu Panamá em convenção de Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 86418, "titulo": "Paulinho da Força reage a crítica de Lula e diz que ele 'está gagá'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/paulinho-da-forca-reage-a-critica-de-lula-e-diz-que-ele-esta-gaga.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-02T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Paulinho da Força, deputado federal e presidente do Solidariedade, rebateu a acusação de Lula, afirmando que o presidente 'deve estar gagá'. Lula havia criticado Paulinho por supostamente ter apoiado a Reforma Trabalhista durante o governo Temer.", "titulo_pt": "Paulinho da Força reage a crítica de Lula e diz que ele 'está gagá'", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 86481, "titulo": "PRTB oficializa Leonardo Avalanche como candidato à Presidência", "url": "https://www.cnnbrasil.com.br/eleicoes/prtb-oficializa-leonardo-avalanche-como-candidato-a-presidencia/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-02T20:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido Republicano Trabalhista Brasileiro (PRTB) oficializou Leonardo Avalanche como candidato à Presidência durante uma convenção partidária em Goiânia. O nome do vice ainda não foi anunciado.", "titulo_pt": "PRTB oficializa Leonardo Avalanche como candidato à Presidência", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 86469, "titulo": "Milei confirma corrida à reeleição em 2027 e faz mistério sobre vice, que já definiu", "url": "https://www.infomoney.com.br/mundo/milei-confirma-corrida-a-reeleicao-em-2027-e-faz-misterio-sobre-vice-que-ja-definiu/", "fonte_id": "infomoney", "data_pub": "2026-08-02T20:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Milei confirmou sua intenção de concorrer à reeleição em 2027. Ele também defendeu o fim das eleições primárias (PASO), considerando-as um 'gasto desnecessário'.", "titulo_pt": "Milei confirma corrida à reeleição em 2027 e debate sobre vice", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 86484, "titulo": "Cresce apoio a ex-secretário de Caiado para vice de Vilela em Goiás", "url": "https://www.cnnbrasil.com.br/eleicoes/cresce-apoio-a-ex-secretario-de-caiado-para-vice-de-vilela-em-goias/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-02T20:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O apoio a um ex-secretário de Caiado está crescendo como candidato a vice-governador para acompanhar a continuidade da gestão na segurança pública no estado de Goiás. Aliados veem o ex-secretário como uma escolha estratégica para garantir a continuidade das políticas de segurança.", "titulo_pt": "Cresce apoio a ex-secretário de Caiado para vice de Vilela em Goiás", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 86419, "titulo": "Em reta final de mandato, Ratinho Jr. amplia investimentos em estradas rurais", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/em-reta-final-de-mandato-ratinho-jr-amplia-investimentos-em-estradas-rurais.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-02T20:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Governo do Paraná está investindo R$ 3,56 bilhões na pavimentação de 2.639 km de estradas rurais em 272 municípios. Essas obras devem conectar comunidades, produtores e agroindústrias à malha viária estadual.", "titulo_pt": "Em reta final de mandato, Ratinho Jr. Amplia investimentos em estradas rurais", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 86452, "titulo": "Amigo de Lula, teólogo Leonardo Boff declara apoio a Ricardo Cappelli", "url": "https://www.metropoles.com/colunas/grande-angular/amigo-de-lula-teologo-leonardo-boff-declara-apoio-a-ricardo-cappelli", "fonte_id": "metropoles", "data_pub": "2026-08-02T20:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O teólogo Leonardo Boff, amigo do ex-presidente Luiz Inácio Lula da Silva, declarou seu apoio ao candidato Ricardo Cappelli. Esta declaração surpreende porque Boff é associado ao Partido dos Trabalhadores (PT), que planeja lançar Leandro Grass como candidato.", "titulo_pt": "Amigo de Lula, teólogo Leonardo Boff apóia Ricardo Cappelli", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 86420, "titulo": "Com presença de ministra das Mulheres, UGT lança cartilha contra violência de gênero", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/com-presenca-de-ministra-das-mulheres-ugt-lanca-cartilha-contra-violencia-de-genero.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-02T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A UGT lançou uma campanha com a entrega de livretos que visam valorizar as mulheres e combater os crimes de violência doméstica e feminicídio. A ministra das Mulheres participou do evento.", "titulo_pt": "UGT lança cartilha contra violência de gênero com presença da ministra", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 86421, "titulo": "Meritocracia na base e patrimonialismo no topo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/marcus-melo/2026/08/meritocracia-na-base-e-patrimonialismo-no-topo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-02T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A capacidade do Estado no Brasil tem sido gradualmente erosionada. O país teve uma evolução parcial, mas incompleta, na isolação de certos setores da administração pública dos efeitos políticos partidários, familiares e patrimonialistas.", "titulo_pt": "Meritocracia na base e patronagem no topo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 86413, "titulo": "Democrata define Wilson Grassi Júnior candidato à Presidência", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/democrata-define-wilson-grassi-junior-candidato-presidencia", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-02T19:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A convenção do Democrata no Rio de Janeiro oficializou a candidatura de Wilson Grassi Júnior à Presidência da República. Grassi Júnior, nascido em São Paulo e veterinário por formação, atuou como conselheiro na implantação do primeiro hospital público para cães e gatos do país.", "titulo_pt": "Democrata define Wilson Grassi Júnior como candidato à Presidência", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 85478, "titulo": "Caiado sobre Lula e Flávio Bolsonaro: Brasil está ‘sequestrado pelos dois rejeitados’", "url": "https://www.infomoney.com.br/politica/caiado-sobre-lula-e-flavio-bolsonaro-brasil-esta-sequestrado-pelos-dois-rejeitados/", "fonte_id": "infomoney", "data_pub": "2026-08-02T19:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador de Goiás, Ronaldo Caiado, afirmou que o Brasil está 'sequestrado pelos dois rejeitados', referindo-se ao ex-presidente Lula e ao filho do presidente Jair Bolsonaro, Flávio. Lula lidera as pesquisas de intenção de voto para a Presidência da República e também é um dos mais rejeitados.", "titulo_pt": "Caiado sobre Lula e Flávio Bolsonaro: Brasil está ‘sequestrado pelos dois rejeitados’", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 86495, "titulo": "Na Paraíba, Flávio cita Bolsa Família e coloca Nordeste como “solução”", "url": "https://www.cnnbrasil.com.br/eleicoes/na-paraiba-flavio-cita-bolsa-familia-e-coloca-nordeste-como-solucao/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-02T19:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio, candidato a presidente, participou de uma convenção do PL no estado da Paraíba. O evento oficializou a chapa encabeçada pelo senador Efraim Filho para disputar o governo do estado.", "titulo_pt": "Na Paraíba, Flávio cita Bolsa Família e coloca Nordeste como ‘solução’", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 85173, "titulo": "Mulheres vão às ruas pela votação do PL da Misoginia", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/mulheres-vao-ruas-pela-votacao-do-pl-da-misoginia", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-02T19:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Levante Mulheres Vivas convoca manifestações em diversas cidades brasileiras neste domingo para pressionar a Câmara dos Deputados a aprovar o Projeto de Lei 896/2023, conhecido como PL da Misoginia. O texto já foi aprovado no Senado e aguarda a decisão do presidente da Câmara para ser votado.", "titulo_pt": "Mulheres às ruas pela aprovação do PL da Misoginia", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 85454, "titulo": "Sem anúncio de vice e ao lado de Zema, Simões oficializa candidatura em MG", "url": "https://www.cnnbrasil.com.br/eleicoes/sem-anuncio-de-vice-e-ao-lado-de-zema-simoes-oficializa-candidatura-em-mg/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-02T19:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Simões confirmou sua candidatura ao governo de Minas Gerais, ao lado do governador Romeu Zema. O PSD oficializou Carlos Viana como candidato à reeleição para o Senado.", "titulo_pt": "Sem anúncio de vice e ao lado de Zema, Simões oficializa candidatura em MG", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 86086, "titulo": "China patrols ‘deeply destabilizing’: US", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/03/2003861830", "fonte_id": "taipei_times", "data_pub": "2026-08-03T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O patrulhamento chinês está sendo considerado profundamente instável pelos Estados Uni de": null, "texto_pt": "Os cientistas afirmam que os seres humanos ainda estão evoluindo, e com a chegada de novas tecnologias como a edição genética, nossa aparência futura pode mudar de maneiras inesperadas.", "titulo_pt": "Como os seres humanos serão no futuro?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 86653, "titulo": "Mom or not, caring for babies changes the brain", "url": "https://phys.org/news/2026-07-mom-babies-brain.html", "fonte_id": "phys_org", "data_pub": "2026-08-02T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bianca Jones Marlin, uma estudante do programa Freeman Hrabowski Scholar, investiga como o ato de cuidar de bebês afeta o cérebro e quais adaptações biológicas podem ser transmitidas para as gerações futuras.", "titulo_pt": "Cuidar de bebês muda o cérebro, independentemente da relação materna", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 86448, "titulo": "Rover Curiosity, da Nasa, encontra campos com “favos de mel” em Marte", "url": "https://www.metropoles.com/ciencia/campos-com-favos-de-mel-em-marte", "fonte_id": "metropoles", "data_pub": "2026-08-02T20:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A NASA encontrou estruturas com forma de favos de mel, entre 4 e 8 cm de diâmetro, nas superfícies de Marte. Essas estruturas são chamadas de fraturas poligonais e não estão relacionadas a abelhas.", "titulo_pt": "Rover Curiosity da Nasa encontra campos com 'favos de mel' em Marte", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 86654, "titulo": "A cooperative approach to reproductive success", "url": "https://phys.org/news/2026-08-cooperative-approach-reproductive-success.html", "fonte_id": "phys_org", "data_pub": "2026-08-02T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma equipe de biólogos evolutivos da Syracuse University, da Universidade de Siena na Itália e da Universidade de Szeged na Hungria descobriu que a fertilização pode depender menos da competição entre espermatozoides e mais da cooperação. Este estudo sugere uma realidade surpreendente sobre o processo reprodutivo.", "titulo_pt": "Uma abordagem cooperativa para o sucesso reprodutivo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 86455, "titulo": "Comer menos proteína retarda o envelhecimento, aponta estudo amplo", "url": "https://www.metropoles.com/saude/comer-proteina-envelhecimento", "fonte_id": "metropoles", "data_pub": "2026-08-02T20:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo apontou que comer menos proteína pode retardar o envelhecimento. O achado contradiz a tendência de aumento da disponibilidade de produtos ricos em proteínas nas lojas.", "titulo_pt": "Comer menos proteína pode retardar o envelhecimento, sugere estudo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 86655, "titulo": "Newly unearthed mechanism that helps plants 'feel full' could help crops use fertilizer more efficiently", "url": "https://phys.org/news/2026-07-newly-unearthed-mechanism-full-crops.html", "fonte_id": "phys_org", "data_pub": "2026-08-02T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Nova York identificaram os jogadores moleculares que permitem às plantas sentirem-se satisfeitas quando absorvem suficiente nitrogênio. Este avanço pode auxiliar na criação de culturas mais eficientes na absorção de nitrato do solo, permitindo a redução das aplicações de fertilizantes, que são custosas e prejudiciais ao meio ambiente.", "titulo_pt": "Novo mecanismo descoberto ajuda plantas a 'sentirem-se cheias' e pode melhorar a eficiência no uso de fertilizantes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 86267, "titulo": "How simple amber lights could make nights safer for insects", "url": "https://phys.org/news/2026-07-simple-amber-nights-safer-insects.html", "fonte_id": "phys_org", "data_pub": "2026-08-02T19:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 40% das espécies de insetos no mundo estão em declínio e sob ameaça de extinção. Pesquisadores sugerem que a substituição simples de iluminação artificial, como lâmpadas de estaleiro e segurança, poderia reduzir esta ameaça específica.", "titulo_pt": "Como as simples luzes âmbar podem tornar as noites mais seguras para insetos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 85561, "titulo": "El Eclipse del Siglo ya tiene fecha: “Será el evento astronómico más fotografiado de la historia”", "url": "https://www.lanacion.com.ar/ciencia/el-eclipse-del-siglo-ya-tiene-fecha-sera-el-evento-astronomico-mas-fotografiado-de-la-historia-nid01082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-02T19:16:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O eclipse solar total conhecido como o 'Eclipse do Século' ocorrerá em uma data específica e será visível de vários países da África e do Oriente Médio. Este será o evento astronômico mais fotografiado na história.", "titulo_pt": "O Eclipse do século já tem data: ‘será o evento astronômico mais fotografiado da história’", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 86268, "titulo": "Climate change could dramatically reduce water flowing from the West's headwaters", "url": "https://phys.org/news/2026-07-climate-west-headwaters.html", "fonte_id": "phys_org", "data_pub": "2026-08-02T18:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos mostram que os pequenos rios montanhosos que alimentam muitos dos rios do oeste dos Estados Unidos podem enfrentar um futuro mais seco. A base de fluxo das nascentes, que é alimentada por águas subterrâneas, tem diminuído consistentemente desde 1950 e pode reduzir em 45% a 65% até o final do século se as tendências climáticas atuais continuarem.", "titulo_pt": "Mudanças climáticas podem drasticamente reduzir a água nas nascentes do oeste", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 85462, "titulo": "Dinossauros foram “assados vivos” após asteroide atingir a Terra", "url": "https://www.cnnbrasil.com.br/ciencia/dinossauros-foram-assados-vivos-apos-asteroide-atingir-a-terra/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-02T18:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A combinação de radiação térmica com elementos rochosos teria causado calor excessivo e incendiado a superfície terrestre após o impacto do asteroide. Os dinossauros foram 'assados vivos' nesse processo.", "titulo_pt": "Dinossauros foram 'assados vivos' após impacto de asteroide", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 85568, "titulo": "Relámpagos bajo el mar: el fenómeno que orientó a los polinesios y que la ciencia no termina de explicar", "url": "https://www.lanacion.com.ar/ciencia/relampagos-bajo-el-mar-el-fenomeno-que-oriento-a-los-polinesios-y-que-la-ciencia-no-termina-de-nid02082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-02T18:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O te lapa é um relâmpago submarino misterioso que era usado pelos navegantes polinésios para orientação, mas ainda não tem uma explicação científica satisfatória.", "titulo_pt": "Relâmpagos sob a água: o fenômeno que guiava os polinesios e que a ciência ainda não explica", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 86266, "titulo": "STAT+: Michigan Supreme Court ruling allows probe into Lilly insulin pricing", "url": "https://www.statnews.com/pharmalot/2026/08/02/michigan-supreme-court-ruling-allows-probe-into-lilly-insulin-pricing/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-02T18:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A corte supreme do Michigan permitiu uma investigação sobre os preços cobrados pela Lilly para diferentes produtos pt": "A Europa enfrenta uma onda de calor recorde que está secando o rio Danúbio e causando uma crise energética na região. Na Hungria, a falta de água para resfriar reatores levou ao fechamento da principal usina nuclear do país pela primeira vez desde sua construção há 44 anos.", "titulo_pt": "Onda de calor recorde na Europa causa seca no rio Danúbio e crise energética", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 86543, "titulo": "La mitad de Cuba vuelve a las tinieblas luego de otro gran apagón en la isla comunista", "url": "https://www.lanacion.com.ar/el-mundo/la-mitad-de-cuba-vuelve-a-las-tinieblas-luego-de-otro-gran-apagon-en-la-isla-comunista-nid02082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-02T20:04:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Sete das 15 províncias cubanas, incluindo a capital La Habana, voltaram a sofrer com apagões após uma falha na rede elétrica nacional. A situação afetou novamente mais da metade do país.", "titulo_pt": "Metade de Cuba volta às trevas em novo grande apagão", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 85365, "titulo": "Criminosos armados em carro passam atirando e matam três pessoas no RJ", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/criminosos-armados-em-carro-passam-atirando-e-matam-tres-pessoas-no-rj", "fonte_id": "metropoles", "data_pub": "2026-08-02T19:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Criminosos armados em um carro efetuaram disparos de arma de fogo e resultaram na morte de três pessoas no estado do Rio de Janeiro. As vítimas, duas homens e uma mulher, ainda não foram identificadas. A Polícia Civil está investigando o caso.", "titulo_pt": "Criminosos armados em carro passam atirando e matam três pessoas no RJ", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 85921, "titulo": "Helicopters and firefighters fight fast-moving wildfire near Athens", "url": "http://www.euronews.com/video/2026/08/02/helicopters-and-firefighters-fight-fast-moving-wildfire-near-athens", "fonte_id": "euronews", "data_pub": "2026-08-02T19:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Firefighters e helicópteros lutavam contra um incêndio florestal rápido a oeste de Atenas, enquanto ventos fortes alimentavam as chamas e obrigaram operações de emergência na área.", "titulo_pt": "Caminhões de bombeiros e helicópteros combatem incêndio rápido perto de atenas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 85538, "titulo": "Expertos en climatización coinciden: \"Poner un ventilador de techo tiene un consumo medio de 0,10 € por noche\"", "url": "https://www.clarin.com/estados-unidos/expertos-climatizacion-coinciden-poner-ventilador-techo-consumo-medio-010-noche_0_UKGXW7LpAS.html", "fonte_id": "clarin", "data_pub": "2026-08-02T18:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os especialistas em climatização concordam que o uso de um ventilador de teto durante a noite custa aproximadamente 0,10 euros. Manter o quarto fresco nas noites quentes pode variar significativamente na conta de energia elétrica dependendo do dispositivo escolhido.", "titulo_pt": "Especialistas em climatização concordam: ventilador de teto custa médio de 0,10 euros por noite", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 85731, "titulo": "Two helicopters collide outside Athens as Greece battles to control wildfires", "url": "https://www.theguardian.com/world/2026/aug/02/western-europe-wildfire-crisis-retreats-greece-evacuates-hundreds-athens", "fonte_id": "guardian_world", "data_pub": "2026-08-02T17:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois helicópteros de combate a incêndios colidiram perto de Atenas, resultando na morte da tripulação de um dos aviões. O incidente ocorreu durante fortes ventos galeanos que empurravam as chamas para os bairros ocidentais da capital grega.", "titulo_pt": "Dois helicópteros colidem perto de atenas em meio às tentativas de controlar incêndios", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 85429, "titulo": "SP Climate Week começa com meta de transformar compromissos em ação rumo à COP31", "url": "https://exame.com/esg/sp-climate-week-comeca-com-meta-de-transformar-compromissos-em-acao-rumo-a-cop31/", "fonte_id": "exame", "data_pub": "2026-08-02T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entre 3 e 7 de agosto, a SP Climate Week apresenta mais de 230 eventos sobre financiamento, cidades resilientes e bioeconomia. O evento inicia na Terra Indígena com a estreia da Climate House.", "titulo_pt": "SP Climate Week começa com meta de transformar compromissos em ação rumo à COP31", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 85989, "titulo": "Heatwave forces nuclear shutdown in Hungary", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/2/08-02-2026-hungary-nuclear-plant-sv?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-02T14:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma onda de calor obrigou a interrupção da operação da maior usina nuclear da Hungria, enquanto os níveis baixos do Danúbio interferem no sistema de resfriamento.", "titulo_pt": "Onda de calor força parada na usina nuclear maior da hungria", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 86276, "titulo": "Forever chemicals and pesticides under Trump: what to know", "url": "https://phys.org/news/2026-07-chemicals-pesticides.html", "fonte_id": "phys_org", "data_pub": "2026-08-02T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde o retorno ao poder, a administração do presidente Donald Trump aprovou cinco pesticidas considerados por muitos como químicos 'forever' (PFAS), uma classe de substâncias tóxicas que estão enfrentando proibições e restrições crescentes em tod const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
