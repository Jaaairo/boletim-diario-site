<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<main id="main"></main>

</div>

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

const D = {"gerado_em": "31/10/2026 15:17", "stats": {"noticias_novas": 606, "resumos_gerados": 241}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva venceu a eleição de meio mandato nos Estados Unidos, com quase 50 milhões de americanos já votando, um número superior ao registrado nas eleições de 2022. O filósofo Renato Lessa, da PUC-Rio, afirmou que o bolsonarismo não está derrotado, mas disseminado, comprovado por empresas demitindo funcionários que votaram no Lula. A primeira-dama Rosane Giacomelli, conhecida como Janja, publicou uma foto em seu perfil no Instagram com o ator Paulo Vieira, durante uma visita ao Granja do Torto, residência oficial do presidente. Durante esse dia, o presidente Lula aproveitou o tempo com Janja e o ator Paulo Vieira. A Rede Permaperifa transforma lixões antigos em hortas comunitárias e espaços culturais na Grande São Paulo, unindo permacultura, agricultura orgânica, formação e resistência por meio de mutirões. O grupo mineiro Corpo apresentará dois espetáculos, 'Piracema' e 'Parabelo', no Teatro de Santa Isabel, no Recife, durante o feriado.", "mundo": "Na França, houve um aumento nas manifestações neste sábado, com cerca de 500 mil pessoas em todo o país, segundo os organizadores, em protestos contra o aumento do custo de vida e pela educação. Em meio a essas mobilizações, o Reino Unido anunciou que o primeiro-ministro, Keir Starmer, está disposto a pedir desculpas formais pelo papel histórico do país no tráfico de escravos. Em outro desenvolvimento, a Coreia do Sul realizou reuniões bilaterais com o ministro das Relações Exteriores da Alemanha e da Polônia. No cenário europeu, a Polônia enfrenta um bloqueio judicial ultranacionalista, com manifestantes cercando o Tribunal Constitucional para impedir a posse de um juiz indicado pelo primeiro-ministro. Além disso, a Binance reintegrou 90% dos ativos roubados durante um ataque cibernético, e a Alemanha debate a possibilidade de uma mulher ocupar a Presidência do país, em sua primeira em 77 anos de história.\n\nO G20 concluiu sua cúpula sem chegar a um consenso em relação a questões críticas, refletindo os desacordos globais em um cenário geopolítico complexo. O Irã advertiu que responderá imediatamente e sem limitações geográficas em caso de ataque. A Rússia, por outro lado, evacuou cidadãos de Oleshky, uma cidade ucraniana ocupada, durante um raro cessar-fogo local. O conflito na Ucrânia continua, com civis deixando Kherson, uma cidade ucraniana ocupada pela Rússia, em uma operação humanitária complicada. As tensões entre Estados Unidos e China sobre a questão de Taiwan permanecem, com os EUA promovendo a preparação para o combate até 2027 na Ásia-Pacífico, levantando dúvidas sobre as intenções de Beijing em relação à ilha em 2027.", "economia": "A economia brasileira e global enfrenta diversos desafios. Destaque-se a recuperação judicial da Chilli Beans, que busca reestruturar dívidas de R$ 340 milhões. Economistas propõem a tributação dos ricos como alternativa para evitar cortes nos gastos sociais, sugerindo também a revisão da meta de inflação e a implementação de um novo regime fiscal. A Binance, plataforma de criptomoedas, informou que repôs 90% dos ativos roubados após um ataque que resultou em perdas de US$ 6,3 bilhões. Em outro desenvolvimento, a China mantém uma perspectiva positiva sobre o mercado de ações, apesar do boom na inteligência artificial, enquanto a França teve sua perspectiva de crédito rebaixada pela agência Fitch devido a uma contração inesperada da economia. O governo brasileiro enfrenta tarefas urgentes para evitar um rombo fiscal em 2027, incluindo a revisão do Orçamento, a integração das promessas eleitorais e a definição das regras da reforma tributária. Além disso, a Itaipu planeja a instalação de um complexo de processamento de dados, enquanto a reforma tributária expõe problemas jurídicos em negócios digitais que expandiram sem estruturas legais adequadas.", "tecnologia": "A OpenAI reduziu sua meta de captação para US$ 10 bilhões devido às preocupações do setor de inteligência artificial, conforme relatado pelo Brasil de Fato e pelo Folha Mercado. A empresa está tentando fechar um acordo enquanto enfrenta a venda de ações de outras empresas de IA e a iminente abertura de capital da sua principal concorrente, a Anthropic. Paralelamente, a Binance cobriu 90% dos US$ 6 bilhões roubados em um ataque hacker, utilizando 10 criptomoedas, incluindo Bitcoin (BTC) e Ether (ETH), totalmente cobertas, conforme informado pelo Exame e pelo Brasil de Fato. Além disso, a China estabeleceu um sistema de avaliação de riscos para empregos na aprovação de projetos de inteligência artificial, promovendo um fórum sobre governança global com representantes de mais de 90 países, informa o Brasil de Fato.", "ciencia": "Mais de 5.000 mortes foram registradas devido à Ebola na República Democrática do Congo, conforme dados recentes do Ministério da Saúde do país, reforçando a gravidade da situação. Em um desenvolvimento científico notável, pesquisadores da Universidade Stony Brook, Museu Real de Ontário (ROM) e o Serviço Geológico de Dakota do Norte descobriram uma nova espécie de dinossauro, chamada Infernogallus jamesi, que se especializou em comer frutas, revelando uma nova dimensão da dieta dos dinossauros. Além disso, a ciência avança com o desenvolvimento de um gel baseado no kerosene que pode simplificar a armazenagem e o controle de combustíveis para foguetes e satélites. A China também planeja utilizar tecnologias avançadas, como inteligência artificial e robôs submarinos, em suas escavações arqueológicas para tracar a história chinesa e expandir seu poder cultural.", "cultura": "O evento mais importante dos artigos é a celebração do primeiro 'Mês de Halloween' em Hong Kong, com festas nas ruas e pessoas vestidas com uma variedade de trajes, incluindo búdhas dourados, latas de chá Lipton e garrafas de ketchup e mostarda. O evento reflete a crescente popularidade do Halloween na Ásia, com as ruas de Lan Kwai Fong ficando lotadas. Em outro contexto, o teatro de terror está em pleno auge, com produções como 'Blackout' e '2:22: A Ghost Story' oferecendo uma experiência de suspense intensa. Em um projeto cultural notável, o coletivo mexicano Tres transformou orina encontrada na rua e 350.000 colillas em uma reflexão artística sobre a poluição urbana. Além disso, a primeira-dama da China, Peng Liyuan, recebeu a homóloga alemã em um chá de recepção, visando demonstrar o poder de soft power da China e fortalecer as relações bilaterais. O escritor dinamarquês Jon Fosse abordou a 'maldição do Nobel', enquanto o ator Aidan Turner discutiu a evolução de sua carreira e a barba que o tornou um ícone atraente para os olhos dos fãs. Em um espetáculo animado, 'O Gatola da Cartola' transforma a desobediência em uma aventura animada, baseada na obra de Dr. Seuss, e a TV Brasil exibe um show exclusivo do sambista Caxtrinho, refletindo a perspectiva do Rio de Janeiro da Baixada Fluminense.", "sociedade": "Em cerimônia de memorial realizada em Trappes, uma semana após um ataque racista terrorista que deixou uma pessoa morta e sete feridos, o prefeito de esquerda foi acompanhado por líderes políticos de esquerda, enquanto líderes de outros espectros políticos não compareceram. O incidente em Trappes, que ocorreu em um contexto de crescente preocupação com o risco de extrema-direita na França, reflete tensões sociais e políticas. Em São Paulo, o sistema Smart Sampa, o maior de videomonitoramento da América Latina, resultou em 3.600 prisões de foragidos e 7 mil presos em flagrante, tornando-se um importante aliado na segurança da capital. No entanto, um estudo revelou que quase metade dos policiais federais relataram sofrimento psicológico, com problemas de sono e tensão constante, refletindo os desafios enfrentados pela força policial. Além disso, o Distrito Federal inaugurou 32 Unidades Básicas de Saúde (UBSs) para vacinação neste sábado, oferecendo serviços a pessoas de todas as idades, incluindo crianças, adultos, idosos e gestantes, em um esforço para ampliar a cobertura vacinal.", "meio_ambiente": "Na COP17 da Conferência sobre Biodiversidade em Yerevan, os países acordaram os principais resultados do primeiro 'exame global' do progresso em direção à reversão da perda da natureza até 2030. Em Nova York, a cidade realizou a coleta de 10.395 libras de resíduos plásticos nas estradas de Staten Island, reduzindo as emissões de carbono em 16.128,2 libras. Empresas brasileiras estão expandindo programas de reciclagem de embalagens para aumentar a logística reversa, enquanto o governo chileno inicia a reconstrução em Atacama após um sistema frontal em julho, com uma investida superior a 115 mil milhões de pesos chilenos. Além disso, o Ministério da Indústria e Comércio de Taiwan aprovou a primeira exploração de sequestramento de carbono, um passo importante para o desenvolvimento de tecnologias de sequestramento de carbono no país.", "direitos_humanos": "No Mato Grosso do Sul, após a reeleição de Lula, a Funai notificou a Polícia Federal para investigar incidentes de ataques contra indígenas, incluindo incêndios e envenenamentos. Em outro desenvolvimento, o retorno dos ancestrais kawésqar de Basileia para o Chile aborda o direito das comunidades indígenas de tomar decisões. No Iêmen, um novo surto de combates deslocou cerca de 290 mil pessoas, com mulheres grávidas em risco. Na Rússia, relatos indicam que autoridades estão usando métodos coercitivos para recrutar homens vulneráveis, em vez de oferecer incentivos financeiros, para manter tropas na guerra. Além disso, muçulmanos de Michigan, Estados Unidos, enfrentam ataques à sua fé após terem ajudado na eleição do presidente Donald Trump. Por fim, em Tacuru, dois servidores públicos confessaram ameaças contra indígenas através de áudios, embriaguez e falta de meios para executar as ameaças."}, "resumo_do_dia": {"politica_nacional": [{"id": 237361, "titulo": "L de Lula vira símbolo da esquerda em outros países", "url": "https://www.poder360.com.br/poder-internacional/l-de-lula-vira-simbolo-da-esquerda-em-outros-paises/", "fonte_id": "poder360", "data_pub": "2026-10-31T17:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Políticos e manifestantes passaram a fazer o gesto 'L' em vários países como Espanha, México, Chile, Itália, Líbano e França. Este gesto se tornou um símbolo da esquerda associado a Lula.", "titulo_pt": "L de Lula se torna símbolo da esquerda em vários países", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 237362, "titulo": "Agente do ICE aponta arma para pedestre durante operação em LA", "url": "https://www.poder360.com.br/poder-internacional/agente-do-ice-aponta-arma-para-pedestre-durante-operacao-em-la/", "fonte_id": "poder360", "data_pub": "2026-10-31T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um vídeo mostra um agente do ICE confrontando um transeunte que passeava com dois cães em Los Angeles. A prefeita da cidade pediu uma investigação sobre o incidente.", "titulo_pt": "Agente do ICE aponta arma para pedestre durante operação em LA", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 237350, "titulo": "Recorde de voto antecipado e ofensiva judicial de Trump marcam eleição de meio mandato", "url": "https://www.cartacapital.com.br/mundo/recorde-de-voto-antecipado-e-ofensiva-judicial-de-trump-marcam-eleicao-de-meio-mandato/", "fonte_id": "cartacapital", "data_pub": "2026-10-31T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quase 50 milhões de americanos já votaram, número superior ao registrado nas eleições de meio mandato de 2022. O recorde de votos antecipados e uma ofensiva judicial do ex-presidente Trump marcaram o processo eleitoral.", "titulo_pt": "Recorde de votos antecipados e ofensiva judicial de Trump marcam eleição de meio mandato", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 237510, "titulo": "'Bolsonarismo não está derrotado, está disseminado. Basta ver os patrões demitindo funcionários que votaram no Lula', diz filósofo Renato Lessa", "url": "https://www.bbc.com/portuguese/articles/cwzd679v845vo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-31T17:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O filósofo Renato Lessa, da PUC-Rio, afirma que o bolsonarismo não está derrotado, mas disseminado, comprovado por empresas demitindo funcionários que votaram no Lula. Lessa considera a carta de Flávio Bolsonaro após a vitória de Lula um erro, pois o desqualificou como líder mesmo após uma votação significativa.", "titulo_pt": "Bolsonarismo disseminado, afirma filósofo; carta de flávio bolsonaro foi tiro no pé", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 237373, "titulo": "Investigação sobre venda de decisões no STJ deve avançar nos próximos dias", "url": "https://veja.abril.com.br/brasil/investigacao-sobre-venda-de-decisoes-no-stj-deve-avancar-nos-proximos-dias/", "fonte_id": "veja", "data_pub": "2026-10-31T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma investigação sobre a venda de decisões no Superior Tribunal de Justiça (STJ) deve avançar nos próximos dias. O caso envolvendo um assessor do tribunal foi revelado pelo Radar no início de outubro.", "titulo_pt": "Investigação sobre venda de decisões no STJ deve avançar nos próximos dias", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 237375, "titulo": "PF e PGR recebem pedido para investigar boicote a comerciantes petistas", "url": "https://veja.abril.com.br/politica/pf-e-pgr-recebem-pedido-para-investigar-boicote-a-comerciantes-petistas/", "fonte_id": "veja", "data_pub": "2026-10-31T16:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Parlamentares do PT encaminharam um pedido à PF e PGR para investigar o papel de Nikolas Ferreira na propagação de uma campanha contra comerciantes petistas. O documento solicita apuração sobre as ações de Ferreira.", "titulo_pt": "Pt solicita investigação sobre boicote a comerciantes petistas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 237470, "titulo": "Após visita a Jair Bolsonaro, Carlos reafirma apoio a Rogério Marinho", "url": "https://www.cnnbrasil.com.br/politica/apos-visita-a-jair-bolsonaro-carlos-reafirma-apoio-a-rogerio-marinho/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-31T16:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador eleito Rogério Marinho, filho de Carlos, reafirmou seu apoio a Jair Bolsonaro após uma visita. Carlos mencionou que o pai está com soluços e sente saudade de Flávio Bolsonaro, irmão de Jair Bolsonaro, que está nos Estados Unidos após o segundo turno das eleições.", "titulo_pt": "Após visita a Bolsonaro, Carlos reafirma apoio a Marinho", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 237365, "titulo": "Lula aproveita sábado de “descanso” com Janja e o ator Paulo Vieira", "url": "https://www.poder360.com.br/poder-gente/lula-aproveita-sabado-de-descanso-com-janja-e-o-ator-paulo-vieira/", "fonte_id": "poder360", "data_pub": "2026-10-31T16:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A primeira-dama Rosane Giacomelli, conhecida como Janja, publicou uma foto em seu perfil no Instagram com o ator Paulo Vieira, em uma visita ao Granja do Torto, residência oficial do presidente. O encontro ocorreu durante um dia de descanso do ex-presidente Lula.", "titulo_pt": "Janja e ator Paulo Vieira se reúnem em granja do torto", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 237366, "titulo": "112 países reconheceram vitória de Lula, diz mapa do TSE", "url": "https://www.poder360.com.br/poder-eleicoes-2026/112-paises-reconheceram-eleicoes-no-brasil-diz-mapa-do-tse/", "fonte_id": "poder360", "data_pub": "2026-10-31T16:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "112 países reconheceram a vitória de Lula, de acordo com o mapa da Corte Eleitoral. Entre os países que não reconheceram os resultados estão os Estados Unidos, Argentina, Hungria e Suíça.", "titulo_pt": "112 Países reconheceram vitória de Lula, diz mapa do TSE", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 237393, "titulo": "Ministros realizam diligências em aldeias de MS e ouvem indígenas Guarani Kaiowá sobre onda de violência pós-eleição", "url": "https://www.brasildefato.com.br/2026/10/31/ministros-realizam-diligencias-em-aldeias-de-ms-e-ouvem-indigenas-guarani-kaiowa-sobre-onda-de-violencia-pos-eleicao/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-31T16:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma comitiva interministerial do governo federal viajou a Mato Grosso do Sul para investigar violações de direitos humanos contra comunidades indígenas Guarani Kaiowá após o segundo turno das eleições. O presidente Luiz Inácio Lula da Silva determinou a missão para apurar agressões e ameaças registradas nas aldeias.", "titulo_pt": "Ministros realizam diligências em aldeias de MS e ouvem indígenas Guarani Kaiowá sobre onda de violência pós-eleição", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 237351, "titulo": "Baralho cigano: veja as previsões de novembro de 2026 para os 12 signos", "url": "https://www.cartacapital.com.br/astrologia/baralho-cigano-veja-as-previsoes-de-novembro-de-2026-para-os-12-signos/", "fonte_id": "cartacapital", "data_pub": "2026-10-31T16:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Com a chegada de novembro de 2026, as energias se renovarão e os caminhos poderão ganhar novas direções. O período trará oportunidades no amor e crescimento financeiro para alguns signos, enquanto outros enfrentarão momentos de reflexão e fortalecimento espiritual, encerrando ciclos. As previsões serão detalhadas para cada signo.", "titulo_pt": "Baralho cigano: veja as previsões de novembro de 2026 para os 12 signos", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 237394, "titulo": "Rede Permaperifa transforma lixões antigos em hortas comunitárias e espaços culturais na Grande SP", "url": "https://www.brasildefato.com.br/2026/10/31/rede-permaperifa-transforma-lixoes-antigos-em-hortas-comunitarias-e-espacos-culturais-na-grande-sp/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-31T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Rede Permaperifa transforma lixões antigos na Grande São Paulo em hortas comunitárias e espaços culturais, unindo permacultura, agricultura orgânica, formação e resistência por meio de mutirões. A iniciativa engloba comunidades da região metropolitana de São Paulo e municípios do litoral paulista.", "titulo_pt": "Rede Permaperifa transforma lixões antigos em hortas comunitárias e espaços culturais na Grande SP", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 237313, "titulo": "Boulos fala em chantagem do mercado sobre ajuste fiscal e defende corte em desoneração e supersalário", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/boulos-fala-em-chantagem-do-mercado-sobre-ajuste-fiscal-e-defende-corte-em-desoneracao-e-supersalario.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-31T15:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Guilherme Boulos, do PSOL, afirma que há chantagem do mercado no debate sobre ajuste fiscal no governo Lula. Ele defende cortes em desoneração e supersalário, mas não nos benefícios dos mais pobres.", "titulo_pt": "Boulos fala em chantagem do mercado sobre ajuste fiscal e defende corte em desoneração e supersalário", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 237368, "titulo": "Comissão do Senado analisa alíquota da CBS a partir de 11 de novembro", "url": "https://www.poder360.com.br/poder-congresso/comissao-do-senado-analisa-aliquota-da-cbs-a-partir-de-11-de-novembro/", "fonte_id": "poder360", "data_pub": "2026-10-31T15:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Comissão do Senado irá analisar a alíquota da Contribuição Social sobre o Lucro Líquido a partir de 11 de novembro. Senadores têm até 15 de dezembro para debater o valor do imposto, que foi fixado em 11,3% pelo Tribunal de Contas da União.", "titulo_pt": "Comissão do Senado analisa alíquota da CBS a partir de 11 de novembro", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 237395, "titulo": "Feira do Livro de Porto Alegre abre 72ª edição com protagonismo feminino e diversidade literária", "url": "https://www.brasildefato.com.br/2026/10/31/feira-do-livro-de-porto-alegre-abre-72a-edicao-com-protagonismo-feminino-e-diversidade-literaria/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-31T15:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 72ª edição da Feira do Livro de Porto Alegre acontece até 15 de novembro na Praça da Alfândega, com mais de 700 atividades gratuitas. Heloisa Pires Lima, primeira mulher negra a ocupar o patronato, participa do evento.", "titulo_pt": "72ª feira do Livro de Porto Alegre inicia com ênfase em diversidade e protagonismo feminino", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 237352, "titulo": "“Veneno na água”: cresce ameaça a indígenas após reeleição de Lula", "url": "https://www.cartacapital.com.br/politica/veneno-na-agua-cresce-ameaca-a-indigenas-apos-reeleicao-de-lula/", "fonte_id": "cartacapital", "data_pub": "2026-10-31T15:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ameaça à comunidade indígena aumentou após a reeleição de Lula, com relatos de supostos envenenamentos e pressões por parte dos ruralistas. Uma liderança local relata essas tentativas de atropelar os indígenas.", "titulo_pt": "Veneno na água: ameaça a indígenas cresce após reeleição de Lula", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 237813, "titulo": "MAC details stark Taiwan-China divide", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/01/2003866944", "fonte_id": "taipei_times", "data_pub": "2026-11-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo de Taiwan detalhou a séria divisão entre Taiwan e China. O texto destaca as diferenças significativas entre as duas jurisdições.", "titulo_pt": "MAC detalha divisão Taiwan-China", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 237814, "titulo": "Taiwan thanks allies for supporting Strait peace", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/01/2003866945", "fonte_id": "taipei_times", "data_pub": "2026-11-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Taiwan agradeceu aos seus aliados pelo apoio à paz no Estreito de Taiwan. O país expressou gratidão pelas relações diplomáticas e políticas que contribuem para a estabilidade na região.", "titulo_pt": "Taiwan agradece aliados pela paz no estreito", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 237815, "titulo": "Lai calls for respect for all as Taiwan celebrates Pride", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/01/2003866946", "fonte_id": "taipei_times", "data_pub": "2026-11-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lai pediu respeito para todos durante as celebrações do Orgulho em Taiwan. A frase destaca a importância do respeito em um evento que comemora a diversidade sexual e de gênero no país.", "titulo_pt": "Lai solicita respeito para todos durante celebrações do orgulho em Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 237816, "titulo": "US, S Korea, Japan vow N Korea’s denuclearization", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/01/2003866947", "fonte_id": "taipei_times", "data_pub": "2026-11-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os EUA, Coreia do Sul e Japão se comprometeram com a desnuclearização da Coreia do Norte. Essa decisão visa garantir a desmilitarização nuclear do país.", "titulo_pt": "EUA, Coreia do sul e Japão se comprometem com desnuclearização da Coreia do norte", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 237817, "titulo": "G20 summit to end with no consensus on critical issues", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/01/2003866948", "fonte_id": "taipei_times", "data_pub": "2026-11-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O G20 encerrará sua cúpula sem consenso em relação a questões críticas.", "titulo_pt": "Cúpula do G20 terminará sem consenso em questões cruciais", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 237820, "titulo": "China’s military purge reduces war risk: experts", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/01/2003866956", "fonte_id": "taipei_times", "data_pub": "2026-11-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos afirmam que a purga militar da China reduz o risco de guerra. A purga tem sido vista como uma medida para fortalecer a estabilidade interna e a unidade do exército chinês.", "titulo_pt": "Purga militar da china reduz risco de guerra, dizem especialistas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 237821, "titulo": "Drone firm raided over Chinese chips", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/01/2003866957", "fonte_id": "taipei_times", "data_pub": "2026-11-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma empresa de drones foi alvo de uma operação policial relacionada com chips chineses. A investigação se concentrou na possível importação ou utilização não declarada de componentes eletrônicos chineses.", "titulo_pt": "Empresa de drones alvo em operação sobre chips chineses", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 237606, "titulo": "Syria Weighs Joining Saudi Mutual Defense Pact as Yemen War Rages", "url": "https://www.nytimes.com/2026/10/31/world/middleeast/syria-saudi-defense-pact.html", "fonte_id": "nyt_world", "data_pub": "2026-10-31T17:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Síria está considerando se juntar ao acordo de defesa mútua entre a Arábia Saudita, Turquia e Paquistão, o que poderia envolver mais países na escalada de conflito do reino com os apoiados pelo Irã, os hutis em Yemen.", "titulo_pt": "Síria evalua juntar-se ao acordo de defesa mútua do iêmen com a arábia saudita", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 237557, "titulo": "El líder supremo iraní amenaza con responder contra Estados Unidos e Israel en caso de nuevos ataques", "url": "https://www.lanacion.com.ar/el-mundo/el-lider-supremo-irani-amenaza-con-responder-contra-estados-unidos-e-israel-en-caso-de-nuevos-nid31102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-31T17:53:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mojtaba Jomeini ameaçou que o Irã responderá de forma imediata, poderosa e sem limites geográficos em caso de novos ataques contra a República Islâmica. O líder supremo iraniano fez essa declaração em resposta a possíveis ações de Estados Unidos e Israel.", "titulo_pt": "Líder supremo iraniano ameaça responder contra EUA e Israel em caso de novos ataques", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 237693, "titulo": "Ukrainian evacuees reunite with family after years trapped in Russia-occupied city", "url": "https://www.bbc.co.uk/news/articles/cqx2818elrnzo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-31T17:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cidadãos de Oleshky que estavam refugiados retornaram para se reunir com suas famílias após anos sendo presos em uma cidade ocupada pela Rússia. Os residentes de Oleshky passaram sem alimentos, água e eletricidade, com muitos tendo que cozinhar ervas de jardim para sobreviver.", "titulo_pt": "Refugiados ucranianos se reúnem com família após anos em cidade ocupada pela Rússia", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 237728, "titulo": "At least four Palestinians killed in Gaza as Israeli attacks continue", "url": "https://www.aljazeera.com/news/2026/10/31/at-least-four-palestinians-killed-in-gaza-as-israeli-attacks-continue?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-31T17:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israel realizou vários ataques em Gaza, incluindo a artilharia no acampamento de refugiados Nuseirat. Pelo menos quatro palestinos foram mortos.", "titulo_pt": "Pelo menos quatro palestinos mortos em Gaza com ataques israelenses", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 237764, "titulo": "Salvini, io non pagherei per avere la targa personalizzata", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/31/salvini-io-non-pagherei-per-avere-la-targa-personalizzata_d15dbe5d-a73f-41e1-9b9b-473f5b1f6bd3.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-31T17:46:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Salvini afirma que não pagará por uma placa personalizada para o carro até que o Milan se torne competitivo novamente. Atualmente, ele utiliza uma placa normal.", "titulo_pt": "Salvini: não pagarei pela placa personalizada até o milan voltar a ser competitivo", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 237604, "titulo": "Live Updates: Hundreds of Thousands Join Another Round of Protests in France", "url": "https://www.nytimes.com/live/2026/10/31/world/france-student-protests-halloween", "fonte_id": "nyt_world", "data_pub": "2026-10-31T17:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A interior ministry estimou que 320 mil pessoas participaram de protestos em todo o país, um número menor que os dos dois sábados anteriores. Houve confrontos entre policiais e manifestantes em Paris e outras cidades.", "titulo_pt": "Atualizações em tempo real: milhares de pessoas se juntam a mais umas rodadas de protestos na França", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 237607, "titulo": "COP17 Biodiversity Talks in Yerevan, Armenia", "url": "https://www.nytimes.com/2026/10/31/climate/cop17-biodiversity-yerevan-conclusion.html", "fonte_id": "nyt_world", "data_pub": "2026-10-31T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Países renovaram suas promessas de proteger a vida selvagem em reuniões da ONU em Yerevan, Armênia, mas as questões financeiras permanecem sem respostas.", "titulo_pt": "COP17 de biodiversidade em Yerevan, armênia", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 237336, "titulo": "Quase meio milhão de pessoas protestam na França neste sábado, segundo organizadores", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/10/quase-meio-milhao-de-pessoas-protestam-na-franca-neste-sabado-segundo-organizadores.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-10-31T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quase 500 mil pessoas participaram de manifestações em todo o país na França neste sábado, incluindo 200 mil em Paris. Segundo organizadores, a coalizão de organizações juvenis e sindicatos que representam estudantes do ensino médio e universitários organizou as manifestações.", "titulo_pt": "Quase meio milhão de pessoas protestam na França neste sábado, segundo organizadores", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 237452, "titulo": "Carros camuflados, jatos, ajuda americana: como Flávio Bolsonaro chegou aos EUA", "url": "https://www.infomoney.com.br/politica/carros-camuflados-jatos-ajuda-americana-como-flavio-bolsonaro-chegou-aos-eua/", "fonte_id": "infomoney", "data_pub": "2026-10-31T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O jornal argentino Clarín detalhou os meios utilizados pela fuga de Flávio Bolsonaro, incluindo carros camuflados e um jato. A ajuda dos Estados Unidos também foi mencionada no relato.", "titulo_pt": "Carros camuflados, jatos e ajuda americana: como Flávio Bolsonaro chegou aos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 237317, "titulo": "Chilli Beans faz pedido de recuperação extrajudicial com dívida de R$ 340 milhões", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/chilli-beans-faz-pedido-de-recuperacao-extrajudicial-com-divida-de-r-340-milhoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-31T17:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Chilli Beans, rede brasileira de óculos, relógios e acessórios, apresentou um pedido de recuperação extrajudicial para reestruturar dívidas no valor de R$ 340 milhões. O pedido foi feito na noite de sexta-feira (30).", "titulo_pt": "Chilli Beans solicita recuperação extrajudicial com dívida de R$ 340 milhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 237348, "titulo": "Economistas propõem taxar ricos em vez de cortar gastos sociais", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/economistas-propoem-taxar-ricos-em-vez-de-cortar-gastos-sociais", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-31T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Economistas e especialistas divulgaram um manifesto denunciando a pressão para cortes nos gastos sociais e propuseram a tributação dos ricos como alternativa. O documento pede também a mudança na meta de inflação e a implementação de um novo regime fiscal menos rígido.", "titulo_pt": "Economistas sugerem tributar ricos em vez de cortar gastos sociais", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 237318, "titulo": "Keeta completa um ano no Brasil distante da expansão planejada", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/keeta-completa-um-ano-no-brasil-distante-da-expansao-planejada.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-31T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Keeta, uma empresa chinesa, comemorou seu primeiro ano no Brasil com uma presença menor do que o planejado. A empresa opera sob a controladora Meituan.", "titulo_pt": "Keeta completa um ano no Brasil com presença menor do planejado", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 237476, "titulo": "Binance diz que repôs 90% dos ativos roubados após ataque de US$ 6 bilhões", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/binance-diz-que-repos-90-dos-ativos-roubados-apos-ataque-de-us-6-bilhoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-31T16:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Binance afirmou que já repôs 90% dos ativos roubados após um ataque que resultou em perdas de US$ 6 bilhões. A corretora informou que as criptomoedas como bitcoin e ether já foram completamente repostas e enfatizou que o foco agora é restaurar os saques.", "titulo_pt": "Binance diz que repôs 90% dos ativos roubados após ataque de US$ 6 bilhões", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 237320, "titulo": "Expectativas de inflação para 2027 e 2028 saltam após segundo turno", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/expectativas-de-inflacao-para-2027-e-2028-saltam-apos-segundo-turno.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-31T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As expectativas de inflação para 2027 e 2028 aumentaram após a reeleição de Luiz Inácio Lula da Silva no segundo turno, segundo pesquisa realizada pela corretora BGC Liquidez com cerca de 30 participantes do mercado.", "titulo_pt": "Expectativas de inflação para 2027 e 2028 subiram após reeleição de lula", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 237321, "titulo": "Corretoras de criptomoedas reforçam segurança após roubo de US$ 6,3 bilhões na Binance", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/10/corretoras-de-criptomoedas-reforcam-seguranca-apos-roubo-de-us-63-bilhoes-na-binance.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-31T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Corretoras de criptomoedas estão aumentando os mecanismos de segurança em resposta a um roubo recorde de US$ 6,3 bilhões da Binance, a maior plataforma de n já lançadas", "url": "https://canaltech.com.br/games/playstation-melhores-edicoes-limitadas/", "fonte_id": "canaltech", "data_pub": "2026-10-31T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os consoles PlayStation tiveram muitas edições especiais e limitadas ao longo dos seus mais de 30 anos, mas o número dessas edições diminuiu nas últimas gerações, especialmente com a existência das placas personalizáveis no PS5.", "titulo_pt": "10 Melhores edições limitadas do PlayStation já lançadas", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 237488, "titulo": "Hora de renovar o setup: selecionamos ótimos notebooks em promoção na Amazon", "url": "https://olhardigital.com.br/2026/10/31/reviews/hora-de-renovar-o-setup-selecionamos-otimos-notebooks-em-promocao-na-amazon-7/", "fonte_id": "olhar_digital", "data_pub": "2026-10-31T16:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A notícia destaca três opções de notebooks em promoção na Amazon, adequadas para uso básico e intermediário. O texto sugere que é um bom momento para pesquisar e trocar de notebook.", "titulo_pt": "Hora de renovar o setup: selecionamos ótimos notebooks em promoção na Amazon", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 237489, "titulo": "Monte seu setup: uma seleção de notebooks gamer em promoção na Amazon", "url": "https://olhardigital.com.br/2026/10/31/reviews/monte-seu-setup-uma-selecao-de-notebooks-gamer-em-promocao-na-amazon/", "fonte_id": "olhar_digital", "data_pub": "2026-10-31T16:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Amazon está oferecendo três notebooks gamer com boas opções de custo-benefício, equipados com processadores potentes, placas de vídeo dedicadas e telas de alta taxa de atualização. É um bom momento para quem deseja entrar no mundo dos jogos ou quer melhorar seu equipamento atual.", "titulo_pt": "Monte seu setup: uma seleção de notebooks gamer em promoção na Amazon", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 237498, "titulo": "O que são parâmetros de modelos de IA?", "url": "https://canaltech.com.br/inteligencia-artificial/o-que-sao-parametros-de-modelos-de-ia/", "fonte_id": "canaltech", "data_pub": "2026-10-31T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Parâmetros de modelos de inteligência artificial são valores numéricos que influenciam o processamento de informações, previsões e geração de respostas pelo modelo, sendo ajustados durante o treinamento. Esses valores ajudam a IA a relacionar palavras e prever a próxima palavra com base em tokens como palavras, partes de palavras ou sinais de pontuação.", "titulo_pt": "O que são parâmetros de modelos de IA?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 237490, "titulo": "Jet lag? Viagens longas bagunçam relógio biológico de aves, revela pesquisa", "url": "https://olhardigital.com.br/2026/10/31/ciencia-e-espaco/viagens-longas-baguncam-relogio-biologico-de-aves-revela-pesquisa/", "fonte_id": "olhar_digital", "data_pub": "2026-10-31T16:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa mostrou que as aves entram em desacordo com o relógio solar durante viagens longas no Oceano Atlântico. Este descompasso é semelhante ao jet lag experimentado por humanos.", "titulo_pt": "Jet lag? Viagens longas perturbam relógio biológico de aves, indica estudo", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 237846, "titulo": "OpenAI reportedly lowers funding target for new round", "url": "https://techcrunch.com/2026/10/31/openai-reportedly-lowers-funding-target-for-new-round/", "fonte_id": "techcrunch", "data_pub": "2026-10-31T16:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI parece não estar atingindo as expectativas em sua última rodada de financiamento. A empresa reduziu o objetivo de financiamento para a próxima rodada.", "titulo_pt": nd culling them—isn't done lightly. But it matters to Australia's threatened species", "url": "https://phys.org/news/2026-10-species-invasive-culling-isnt-australia.html", "fonte_id": "phys_org", "data_pub": "2026-10-31T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A distinção entre espécies nativas, introduzidas ou invasoras pode ter implicações críticas para a sobrevivência de outras espécies, especialmente na Austrália, onde animais considerados invasores, como coelhos europeus e porcos ferozes, são frequentemente controlados, enquanto a maioria das espécies nativas é geralmente deixada em paz.", "titulo_pt": "Chamar uma espécie de 'invasora' e matá-la não é uma decisão leve, mas é importante para as espécies ameaçadas da austrália", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 237539, "titulo": "Paris identifica local onde foi feita a primeira com seres humanos da história", "url": "https://www.dw.com/pt-br/paris-identifica-local-onde-foi-feita-a-primeira-com-seres-humanos-da-história/a-79810864?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-10-31T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores identificaram o local onde foi tirada a primeira foto com seres humanos da história, praticamente dois séculos após a imagem de Louis Daguerre. A longa exposição do fotograma fez com que outros elementos do cenário não fossem visíveis na foto final.", "titulo_pt": "Paris identifica local onde foi feita a primeira foto com seres humanos da história", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 237861, "titulo": "Ultracold atoms simulate hard-to-observe matter-antimatter pair production", "url": "https://phys.org/news/2026-10-ultracold-atoms-simulate-hard-antimatter.html", "fonte_id": "phys_org", "data_pub": "2026-10-31T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Segundo a eletrodinâmica quântica, teoria que descreve as interações entre a luz e partículas elétricamente carregadas, um campo elétrico suficientemente forte pode, em princípio, converter parte de sua energia em partículas e seus parceiros antipartículas. Os parceiros antipartículas têm a mesma massa e, para partículas elétricamente carregadas, o carregamento elétrico oposto.", "titulo_pt": "Átomos ultracômodos simulam a produção difícil de observar de pares de matéria-antimatéria", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 237415, "titulo": "Fóssil revela dinossauro que mastigava frutas há 66 milhões de anos", "url": "https://www.metropoles.com/ciencia/fossil-revela-dinossauro-que-mastigava-frutas-ha-66-milhoes-de-anos", "fonte_id": "metropoles", "data_pub": "2026-10-31T16:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um fóssil revelou a existência de um dinossauro do tamanho de um peru, há 66 milhões de anos, que tinha músculos adaptados para mastigar frutas. Essa espécie pode ter ajudado a espalhar sementes durante o período Cretáceo.", "titulo_pt": "Fóssil revela dinossauro que mastigava frutas há 66 milhões de anos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 237333, "titulo": "Van Gogh teria se inspirado em céu de julho, não de junho, para a obra 'A Noite Estrelada'", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/van-gogh-teria-se-inspirado-em-ceu-de-julho-nao-de-junho-para-a-obra-a-noite-estrelada.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-31T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Lua minguante à direita do quadro, Vênus em tons pálidos próximo ao cipreste e a disposição das estrelas podem indicar que Vincent van Gogh observou o céu que inspirou 'A Noite Estrelada' em julho, não em junho.", "titulo_pt": "Van Gogh teria se inspirado em céu de julho para 'A Noite Estrelada'", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 237862, "titulo": "Four superconducting cables link two large quantum processors into one", "url": "https://phys.org/news/2026-10-superconducting-cables-link-large-quantum.html", "fonte_id": "phys_org", "data_pub": "2026-10-31T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quatro cabos supercondutores conectam dois grandes processadores quânticos em um único sistema. Para que isso funcione, as conexões precisam transmitir informações quânticas frágeis sem as destruir.", "titulo_pt": "Quatro cabos supercondutores unem dois grandes processadores quânticos em uma única unidade", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 237886, "titulo": "Allergic reactions after sex should be listed as an antibiotic risk, experts say", "url": "https://www.newscientist.com/article/2596737-allergic-reactions-after-sex-should-be-listed-as-an-antibiotic-risk-experts-say/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-10-31T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher teve uma reação alérgica severa a um antibiótico presente no sêmen do parceiro após o sexo, levando médicos a sugerirem que esse risco seja listado nas folhas de informações do medicamento.", "titulo_pt": "Reações alérgicas após sexo devem ser listadas como risco de antibióticos, dizem especialistas", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 237797, "titulo": "DR Congo Ebola deaths top 5,000, cases recorded in other African nations", "url": "https://www.scmp.com/news/world/africa/article/3372849/dr-congo-ebola-deaths-top-5000-cases-recorded-other-african-nations", "fonte_id": "scmp", "data_pub": "2026-10-31T15:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 5.000 mortes foram registradas em decorrência da Ebola na República Democrática do Congo, de acordo com os dados mais recentes do Ministério da Saúde do país. O número de casos confirmados é de 10.351, com uma taxa de letalidade próxima de 50%. O surto também foi registrado em outros países africanos.", "titulo_pt": "Mortes por Ebola na república democrática do Congo superam 5.000", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 237863, "titulo": "Rare Iron Age Celtic helmet discovered in northeastern Poland far from its homeland", "url": "https://phys.org/news/2026-10-rare-iron-age-celtic-helmet.html", "fonte_id": "phys_org", "data_pub": "2026-10-31T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 2.400 anos atrás, em Łysa Góra, na Polônia, um grupo de pessoas quebrou e jogou um capacete de bronze celta em um poço, junto com adzes de ferro e uma foice. Capacetes semelhantes são ocasionalmente encontrados em enterros luxuosos de elite de guerreiros celtas, desde Champagne, França, até Dürrnberg, Áustria.", "titulo_pt": "Capacete do idade do ferro celta raro descoberto no nordeste da polônia longe de sua terra natal", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 237864, "titulo": "New gel fuel could make rocket and satellite propulsion easier to control", "url": "https://phys.org/news/2026-10-gel-fuel-rocket-satellite-propulsion.html", "fonte_id": "phys_org", "data_pub": "2026-10-31T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um gel baseado no kerosene foi desenvolvido por pesquisadores da Concordia e pode simplificar a armazenagem e o controle de combustíveis para foguetes e satélites.", "titulo_pt": "Novo combustível em gel poderia simplificar a propulsão de foguetes e satélites", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 237902, "titulo": "9 nightmarish sci-fi spaceships to crawl aboard for Halloween if you dare", "url": "https://www.space.com/entertainment/9-nightmarish-sci-fi-spaceships-to-crawl-aboard-for-halloween-if-you-dare", "fonte_id": "space_com", "data_pub ea robots", "url": "https://www.scmp.com/news/china/science/article/3372841/chinese-archaeologists-set-hi-tech-excavations-ai-and-deep-sea-robots", "fonte_id": "scmp", "data_pub": "2026-10-31T13:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Arqueólogos chineses estarão utilizando tecnologias avançadas, como inteligência artificial e robôs submarinos, conforme o novo plano de cinco anos, com o objetivo de tracar a história chinesa, decifrar a origem dos humanos na Ásia Oriental e expandir o poder cultural do país. Os cientistas desenvolverão tecnologias como sensores remotos, análise de DNA antigo, robôs de arqueologia submarina e modelos de inteligência artificial para a restauração virtual de artefatos arqueológicos.", "titulo_pt": "Arqueólogos chineses adotarão tecnologias avançadas em escavações", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 237904, "titulo": "On this day in space! Oct. 31, 2015: Creepy skull-shaped Halloween asteroid flies by Earth, NASA names it the 'Great Pumpkin'", "url": "https://www.space.com/space-exploration/on-this-day-in-space-october-31-2026", "fonte_id": "space_com", "data_pub": "2026-10-31T13:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 31 de outubro de 2015, um asteroide com a forma de uma cabeça de esqueleto passou pela Terra. Este asteroide foi nomeado pela NASA como 'O Grão-Pépem' em referência ao Halloween.", "titulo_pt": "31 De outubro de 2015: asteroide com forma de crânio passa pela terra, NASA o chama de 'grão-pépem'", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 237825, "titulo": "FEATURE: The unsung heroes of snake antivenom production", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/01/2003866961", "fonte_id": "taipei_times", "data_pub": "2026-11-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo destaca os heróis anônimos envolvido cinema)", "pais": "EUA", "classe": "B"}, {"id": 237386, "titulo": "Jon Fosse explica a ‘maldição do Nobel’ que ronda escritores vencedores", "url": "https://veja.abril.com.br/coluna/veja-gente/jon-fosse-explica-a-maldicao-do-nobel-que-ronda-escritores-vencedores/", "fonte_id": "veja", "data_pub": "2026-10-31T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O escritor dinamarquês Jon Fosse concedeu uma entrevista à coluna GENTE sobre a 'maldição do Nobel' que afeta os vencedores do prêmio literário.", "titulo_pt": "Jon Fosse explora a 'maldição do Nobel' que assombra escritores vencedores", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 237387, "titulo": "‘O Gatola da Cartola’ faz da desobediência uma aventura animada", "url": "https://veja.abril.com.br/coluna/veja-recomenda/o-gatola-da-cartola-faz-da-desobediencia-uma-aventura-animada/", "fonte_id": "veja", "data_pub": "2026-10-31T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A animação 'O Gatola da Cartola' se baseia na obra de Dr. Seuss, usando as travessuras do personagem como forma de entreter toda a família. O filme transforma a desobediência em uma aventura animada.", "titulo_pt": "O Gatola da Cartola: aventura animada com desobediência", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 237345, "titulo": "Maju Coutinho será substituída no Fantástico por correspondente da Globo", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/correspondente-da-globo-em-londres-vai-substituir-maju-coutinho-no-fantastico.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-31T13:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Maju Coutinho será substituída no Fantástico por Rodrigo Carvalho, correspondente da Globo em Londres, a partir de janeiro. Ela entrará em licença-maternidade para ter seu primeiro filho, Malik.", "titulo_pt": "Maju Coutinho será substituída no Fantástico por correspondente da Globo", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 237346, "titulo": "Psicopata seduz mentes em série que revê obsessão por tramas de crimes hediondos", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/psicopata-seduz-mentes-em-serie-que-reve-obsessao-por-tramas-de-crimes-hediondos.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-31T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Anos após um crime terrível ter traumatizado uma cidade, uma criança desaparecida ressurge, levando o detetive Jonah Lynn, vivido por Liev Schreiber, a reabrir o caso envolvendo o psicopata Jurek Walter, que está preso há mais de uma década.", "titulo_pt": "Psicopata seduz mentes em série que revê obsessão por tramas de crimes hediondos", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 237347, "titulo": "Diego Moschkovich apresenta Stanislávski além do 'Método' e da quarta parede", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/blogs/mise-en-scene/2026/10/diego-moschkovich-apresenta-stanislavski-alem-do-metodo-e-da-quarta-parede.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-31T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Konstantin Stanislávski, um teórico e diretor teatral russo do século XIX, é frequentemente simplificado e caricaturado, sendo lembrado mais pelo 'Método' e pela 'quarta parede' do que pelo seu legado completo. Suas ideias no teatro ocidental são geralmente reduzidas a conceitos simplificados e dogmáticos.", "titulo_pt": "Diego Moschkovich explora Stanislávski além do 'Método' e da quarta parede", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 237674, "titulo": "The Rise of the Tallboy Is a Sign of the Times", "url": "https://www.theatlantic.com/culture/2026/10/tallboys-big-beer/689231/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-10-31T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Brasil entrou em uma era de cervejas grandes. O crescimento do Tallboy, uma lata maior de cerveja, é um sinal do momento atual.", "titulo_pt": "A era das grandes cervejas chegou", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 237802, "titulo": "Soft power on display as China’s first lady Peng Liyuan hosts German counterpart", "url": "https://www.scmp.com/news/china/diplomacy/article/3372840/soft-power-display-chinas-first-lady-peng-liyuan-hosts-german-counterpart", "fonte_id": "scmp", "data_pub": "2026-10-31T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A primeira-dama da China, Peng Liyuan, recebeu sua homóloga alemã, Elke Budenbender, em Beijing para um chá de recepção, visando demonstrar o poder de soft power da cidade e fortalecer as relações bilaterais. Peng enfatizou a cooperação rica com a Alemanha em áreas como educação e cultura.", "titulo_pt": "Poder suave em exibição: primeira-dama chinesa anfitriã de sua homóloga alemã em beijing", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 237885, "titulo": "‘We freed Patrick Stewart!’ Star Trek’s Marina Sirtis on breaking in her beloved but very serious co-star", "url": "https://www.theguardian.com/culture/2026/oct/31/patrick-stewart-star-trek-marina-sirtis-picard-shakespearean", "fonte_id": "guardian_culture", "data_pub": "2026-10-31T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Marina Sirtis, atriz de Star Trek: The Next Generation, inicialmente se sentiu intimidada pelo ator Patrick Stewart, conhecido por sua seriedade no trabalho. No entanto, ela conseguiu relaxá-lo e assistiu a sua contribuição significativa para dar profundidade à série.", "titulo_pt": "Nós libertamos Patrick Stewart!", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 237391, "titulo": "Cena Musical, da TV Brasil exibe show exclusivo do sambista Caxtrinho", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-10/cena-musical-da-tv-brasil-exibe-show-exclusivo-do-sambista-caxtrinho", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-10-31T12:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cantor Caxtrinho apresenta o show 'Queda Livre' no programa Cena Musical da TV Brasil, transmitido no sábado (31) às 23h. A performance, gravada no Espaço Cultural BNDES em setembro, reflete a perspectiva do Rio de Janeiro da Baixada Fluminense.", "titulo_pt": "Caxtrinho apresenta show experimental no cena Musical", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 237675, "titulo": "Why Halloween Isn’t Just for Kids", "url": "https://www.theatlantic.com/newsletters/2026/10/halloween-adults-embrace-silliness/689228/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-10-31T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Halloween oferece a oportunidade para adultos se divertirem e exibirem o lado engraçado de suas personalidades, além de usar fantasias e comer doces.", "titulo_pt": "Por que Halloween não é só para crianças", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 237822, "titulo": "MOE sets teacher protection guides", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/01/2003866958", "fonte_id": "taipei_times", "data_pub": "2026-11-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Educação (MOE) estabeleceu orientações para proteger professores. As diretrizes visam fornecer direitos e proteção adequados aos educadores.", "titulo_pt": "MOE estabelece orientações para proteger professores", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 237406, "titulo": "DF:
