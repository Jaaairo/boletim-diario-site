      <button class="btn-peri" id="btn-rm-flag" onclick="removerFlagAtual()" style="display:none;margin-right:auto">Remover</button>
      <button class="btn-sec2" onclick="fecharModal('modal-flag')">Cancelar</button>
      <button class="btn-pri" onclick="salvarFlagAtual()">Marcar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "12/10/2026 07:23", "stats": {"noticias_novas": 665, "resumos_gerados": 246}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O senador Flávio Bolsonaro, do PL, e o presidente Lula, do PT, são os principais candidatos ao segundo turno das eleições presidenciais de 2026. Flávio teve 2,2 milhões a mais de votos que Jair Bolsonaro. Ambos escalaram candidatos a vice para a campanha. O fim da escala 6x1 é um consenso nas redes sociais e será votado no Senado nesta quarta-feira. A campanha de Lula está equilibrada, misturando esperança com críticas a Flávio. O TSE decidiu sobre as ações de Flávio contra Lula e vice-versa, o que gerou críticas internas. O Congresso Nacional terá que aprovar pautas importantes antes da posse dos novos parlamentares em fevereiro de 2027, envolvendo não-eleitos na definição de temas centrais. Além disso, o PL defende a redução do tamanho do governo federal, enquanto o PT sugere valorização dos servidores públicos. A eleição para o Congresso pode impactar decisões econômicas já previstas ou ainda pendentes, incluindo impostos e o destino de bilhões de reais destinados a estados e municípios.", "mundo": "Robert E. Hall e Michael Woodford, cidadãos dos Estados Unidos, receberam o Prêmio Nobel de Economia por suas contribuições microeconômicas na estabilização macroeconômica. Em França, Raphaël Glucksmann, fundador do partido 'Place Publique', foi escolhido como candidato do partido socialista nas eleições presidenciais de 2027, em um contexto de alerta para a 'batalha existencial' contra o extremismo de direita. A Arábia Saudita prorrogou o fechamento do aeroporto de Riad devido a ataques dos hutíes, enquanto o presidente dos Estados Unidos, Joe Biden, anunciou um suposto 'ceifamento de energia' na guerra na Ucrânia, causando confusão. Além disso, a polícia de Tóquio planeja criar uma divisão dedicada a acidentes de veículos autônomos, e a China impôs sanções a ministros de Paraguai e Belize devido aos laços diplomáticos desses países com Taiwan.\n\nA Ucrânia e a Rússia continuam em conflito. O presidente ucraniano Volodymyr Zelenskyy acusa a Rússia de violar um suposto cessar-fogo energético proposto pelo presidente americano Donald Trump. Zelenskyy afirma que a Rússia realizou ataques a instalações elétricas imediatamente após Trump anunciar o cessar-fogo. O Irã pediu à Arábia Saudita que busque a diplomacia após ataques letais dos hutis do Iêmen, enquanto a Arábia Saudita estendeu a suspensão do aeroporto devido a um novo ataque dos hutis. Além disso, a Coreia do Norte disparou múltiplos mísseis balísticos em direção ao mar, e Taiwan está monitorando uma série de exercícios de tiro ao vivo da China, com o exercício mais próximo localizado na província oriental de Zhejiang. A guerra na Ucrânia também está afetando a economia global, causando desordem econômica devido à interrupção de uma única rota crucial para o comércio marítimo e a energia.", "economia": "O Prêmio Nobel de Economia foi concedido aos economistas Robert E. Hall e Michael Woodford, reconhecendo suas contribuições significativas para a teoria econômica. A Organização dos Países Exportadores de Petróleo (Opep) reduziu sua projeção de demanda para 400 mil barris de petróleo por dia em 2026, uma queda significativa em relação à previsão inicial de 1,4 milhão de barris no início do ano. A XP Investimentos prevê que o lucro por ação das empresas do índice alcance US$ 91 no terceiro trimestre, um aumento de 31,4% em comparação com o mesmo período do ano anterior e 1,6% acima do consenso de mercado. A União Europeia planeja limitar as importações de veículos híbridos elétricos a 350.000 unidades por ano, com medidas de proteção comercial que podem entrar em vigor a partir de 1º de dezembro de 2026, estabelecendo um limite de 350.000 unidades no primeiro ano, seguido por uma expansão anual de 6% a partir do segundo ano. O presidente do Banco da Coreia afirmou que as duas taxas de juros consecutivas proporcionaram tempo para responder a riscos financeiros. O Japão está incentivando o armazenamento de petróleo e a exploração de novas fontes devido aos riscos aumentados na região do Oriente Médio. O presidente da Goldman Sachs, John Waldron, recomendou que a China liberalize regras de troca de moeda, facilite restrições de dados internacionais e aumente a transparência regulatória para fortalecer a posição de Shanghai como centro financeiro internacional.", "tecnologia": "Em setembro de 2026, a Europa registrou um aumento significativo no financiamento para empresas de tecnologia, com €15,8 bilhões investidos em 300 negócios. O Prêmio Sveriges Riksbank de Ciências Econômicas em Memória de Alfred Nobel de 2026 foi concedido a Robert Hall e Michael Woodford. O uso de inteligência artificial está se expandindo rapidamente, com a China utilizando a tecnologia para produzir vídeos e microdramas em campanhas de propaganda. No entanto, especialistas alertam sobre os riscos associados ao compartilhamento de informações pessoais com a IA, como no uso do ChatGPT. A indústria de semicondutores enfrenta desafios, com a Nanya Technology registrando lucros recordes no terceiro trimestre de 2026, enquanto a Largan prevê uma queda nas encomendas no quarto trimestre. A China está investindo em tecnologia para submarinos, reforçando a parceria com a HD Hyundai. As empresas de tecnologia estão buscando implementar medidas de segurança mais robustas para a IA, como o 'freio de emergência' proposto pela Microsoft, enquanto o uso de prompts na IA está ganhando espaço devido à importância do contexto.", "ciencia": "Cientistas descobriram um fator oculto que pode determinar o sucesso ou fracasso de reações químicas, aumentando a proporção do produto desejado de 16% para 97%. Este achado, publicado no Science Daily, foi alcançado controlando a acidez nas proximidades dos eletrodos para produzir químicos utilizados em plásticos, medicamentos e outros produtos, usando oxigênio e eletricidade em vez de oxidantes perigosos. Em outro avanço, pesquisadores descobriram uma nova espécie de peixe-nuvem endêmica da Amazônia sul do Amapá, uma descoberta que pode contribuir para entender a dispersão desses animais entre os continentes. Além disso, um estudo publicado no Exame revela que mulheres relatam mais dor que homens em todas as partes do corpo, apontando para a necessidade de pesquisas mais profundas sobre a dor feminina.", "cultura": "O Festival do Rio, que termina sua programação em 14 de outubro, vai reexibir filmes vencedores da mostra, incluindo 'A Margem do Rio', que ganhou na categoria de ficção, e 'Elza', um documentário premiado na categoria de documentário. Em uma celebração cultural, a São Paulo Fashion Week apresentará uma coleção inspirada na infância de Antonio Castro, com menos desfiles do que no ano passado. O Festival do Rio também premiou 'Santo', o melhor curta-metragem. Na área do teatro, Sacha Baron Cohen estrelará 'The Popinjay Cavalier', uma peça escrita e dirigida por Quentin Tarantino, que estreará no West End de Londres em março de 2027. O Festival do Rio também reconheceu a importância do documentário 'Elza', sobre a cantora Elza Soares.", "sociedade": "O Brasil enfrenta diversos desafios sociais e políticos, conforme destacam diversos artigos. O governo sul-coreano finalizou o Plano Básico de Prevenção ao Suicídio de 6ª geração, implementando medidas para combater o problema. Em Goiás, 33 escolas no Entorno do Distrito Federal operam sem inspeção dos bombeiros, o que representa um risco para a segurança dos alunos. O Brasil também luta contra o aumento de casos de obesidade, que pode levar à morte, conforme alerta um artigo. Além disso, a psiquiatra Lilliane, diagnosticada com câncer de mama aos 45 anos, compartilha sua experiência de passar de cuidadora para ser cuidada. No Chile, os delitos envolvendo menores aumentaram 23% nos primeiros seis meses do ano, com destaque para festas e roubos, e a lei que cria o Sistema Nacional de Apoios e Cuidados enfrenta desafios de financiamento. Em Las Condes, 2.015 moradias foram afetadas por uma aluvão, e o município realiza campanhas de vacinação preventiva. Na Coreia do Sul, a rede de creches diminuiu 41% nos últimos dez anos devido a baixas taxas de natalidade, levantando preocupações sobre a falta de cuidados infantis. O Brasil ainda luta contra o risco de câncer de mama após os 50 anos, enquanto a obesidade continua sendo uma condição crônica comum no país.", "meio_ambiente": "Centenas de milhares de pessoas marcharam por Bruxelas, exigindo ações urgentes para o clima antes da COP31, marcada para Antalya, na Turquia. Paralelamente, o Amazonas registrou um aumento de 271% nos focos de incêndio nos primeiros dias de outubro de 2025, com 1.380 ocorrências. O governo do Amazonas declarou estado de emergência em 36 cidades do estado devido ao avanço dos incêndios, considerados mais graves do que o esperado pelo ministro João Paulo Capobianco. A Força Aérea Brasileira enviou reforço aéreo para combater as queimadas, enquanto a qualidade do ar na capital e em cinco outros municípios do estado foi negativamente afetada. Além disso, o furacão Simon fortaleceu e se aproximava da costa do México, enquanto um deslizamento de terra bloqueou um rio no Nepal, causando uma nova enchente. Na Indonésia, oito orangotãos resgatados de áreas afetadas por incêndios foram libertados em uma floresta protegida.", "direitos_humanos": "Pelo menos 139 migrantes morreram em um naufrágio de embarcação perto de Djibouti, conforme informou a OIM. Este incidente destaca as condições perigosas enfrentadas por imigrantes na África Oriental. Em outro evento, um menino palestino de sete anos foi morto por forças israelenses em um acampamento de refugiados no norte da Faixa de Gaza, reforçando as tensões na região. Claudia, uma salvadorenha com TPS em Houston, teme a separação de suas filhas americanas e considera a possibilidade de deixar o país, refletindo as complexidades da situação migratória na região. Estas notícias ilustram os desafios enfrentados por imigrantes e refugiados, bem como as violações de direitos humanos em diversos contextos globais."}, "resumo_do_dia": {"politica_nacional": [{"id": 210093, "titulo": "Cotado para suceder Tarcísio, Nunes tem R$ 3,8 bi em obras para entregar até 2028", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/cotado-para-suceder-tarcisio-nunes-tem-r-38-bi-em-obras-para-entregar-ate-2028.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-12T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ricardo Nunes, prefeito do MDB e cotado para suceder Tarcísio de Freitas em 2030, possui 19 grandes obras com prazos de conclusão entre outubro de 2026 e dezembro de 2028. Estas obras devem ser entregues antes do fim do seu segundo mandato em 2028.", "titulo_pt": "Cotado para suceder Tarcísio, Nunes possui R$ 3,8 bi em obras para entregar até 2028", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 210297, "titulo": "O que Flávio Bolsonaro e Lula propõem sobre o funcionalismo público", "url": "https://www.bbc.com/portuguese/articles/c6ev3gn2k39zo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-12T08:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, filho do ex-presidente Jair Bolsonaro, propõe a redução do tamanho do governo federal através de cortes em ministérios. Jair Bolsonaro, agora candidato pelo PT, sugere a valorização dos servidores públicos.", "titulo_pt": "O que Flávio Bolsonaro e Lula propõem sobre o funcionalismo público", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 210118, "titulo": "Além do Planalto: como a eleição para o Congresso pode afetar impostos, empresas e dinheiro público", "url": "https://g1.globo.com/economia/noticia/2026/10/12/alem-do-planalto-como-a-eleicao-para-o-congresso-pode-afetar-impostos-empresas-e-dinheiro-publico.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-12T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A eleição para o Congresso em 2026 pode impactar decisões econômicas já previstas ou ainda pendentes, incluindo impostos, custos empresariais e o destino de bilhões de reais destinados a estados e municípios. Além da eleição presidencial, os novos parlamentares eleitos em 2026 terão de lidar com questões econômicas já programadas ou ainda em discussão.", "titulo_pt": "Além do Planalto: como a eleição para o Congresso pode afetar impostos, empresas e dinheiro público", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 210159, "titulo": "Para ala do PL, aposentadoria de ministros do STF é melhor que impeachment", "url": "https://www.metropoles.com/colunas/igor-gadelha/para-ala-do-pl-aposentadoria-de-ministros-do-stf-e-melhor-que-impeachment", "fonte_id": "metropoles", "data_pub": "2026-10-12T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alguns membros do Partido Liberal (PL) no Senado consideram que a aposentadoria antecipada de ministros do Supremo Tribunal Federal (STF) seria uma solução mais pacífica do que um processo de impeachment.", "titulo_pt": "Para grupo do PL, aposentadoria de ministros do STF é melhor que impeachment", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 210160, "titulo": "Deputados eleitos são em média 4 vezes mais ricos que candidatos derrotados", "url": "https://www.metropoles.com/colunas/tacio-lorran/deputados-eleitos-sao-em-media-4-vezes-mais-ricos-que-candidatos-derrotados", "fonte_id": "metropoles", "data_pub": "2026-10-12T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais da metade dos deputados federais eleitos para a próxima legislatura são milionários. Os deputados eleitos são em média 4 vezes mais ricos que os candidatos derrotados.", "titulo_pt": "Deputados eleitos são em média 4 vezes mais ricos que candidatos derrotados", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 210213, "titulo": "Infraestrutura do agro: o que Flávio Bolsonaro e Lula propõem para o setor", "url": "https://www.cnnbrasil.com.br/agro/infraestrutura-do-agro-o-que-flavio-bolsonaro-e-lula-propoem-para-o-setor/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-12T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ambos os candidatos propõem melhorias na infraestrutura agrícola, incluindo transporte, armazenagem, irrigação, conectividade e energia elétrica, mas diferem em detalhes dos projetos, metas e mecanismos de financiamento.", "titulo_pt": "Infraestrutura do agro: o que Flávio Bolsonaro e Lula propõem para o setor", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 210233, "titulo": "Apostar no rali pós-2º turno? Os riscos de investir agora para a eleição", "url": "https://www.infomoney.com.br/onde-investir/apostar-no-rali-pos-2o-turno-os-riscos-de-investir-agora-para-a-eleicao/", "fonte_id": "infomoney", "data_pub": "2026-10-12T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas recomendam cautela ao investir após o primeiro turno das eleições, destacando os riscos relacionados ao preço de entrada, tamanho da aposta, impostos e liquidez necessária para sair a tempo.", "titulo_pt": "Apostar no rali pós-2º turno? Os riscos de investir agora para a eleição", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 210298, "titulo": "Nossa Senhora Aparecida: por que a santa envolvida em polêmica eleitoral é a padroeira do Brasil?", "url": "https://www.bbc.com/portuguese/articles/cmzxlkk9wqvko?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-12T07:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Desde que 12 de outubro foi consagrado a Nossa Senhora Aparecida, surgiram muitos questionamentos sobre a lei, devido à natureza laica do Estado e à separação entre Igreja e Estado. Em 2026, a santa se viu novamente envolvida em uma nova polêmica.", "titulo_pt": "Nossa Senhora Aparecida: por que a santa envolvida em polêmica eleitoral é a padroeira do Brasil?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 210163, "titulo": "Orçamento, 6x1 e mais: não eleitos ajudam a traçar o rumo de temas centrais", "url": "https://www.metropoles.com/brasil/orcamento-6x1-e-mais-nao-eleitos-ajudam-a-tracar-o-rumo-de-temas-centrais", "fonte_id": "metropoles", "data_pub": "2026-10-12T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Congresso Nacional terá que aprovar pautas importantes antes da posse dos novos parlamentares em fevereiro de 2027. Não-eleitos estarão envolvidos na definição de temas centrais.", "titulo_pt": "Orçamento, 6x1 e mais: não eleitos ajudam a traçar o rumo de temas centrais", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 210168, "titulo": "Plenário do TSE decidirá futuro do “Exército do Lula” no WhatsApp", "url": "https://www.metropoles.com/brasil/plenario-do-tse-decidira-futuro-do-exercito-do-lula-no-whatsapp", "fonte_id": "metropoles", "data_pub": "2026-10-12T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O plenário do Tribunal Superior Eleitoral (TSE) deve decidir sobre a futura análise do caso do 'Exército do Lula' no WhatsApp. A solicitação de análise foi feita pelo juiz federal Marcelo Cueva e o TSE tem uma sessão virtual marcada para esta segunda-feira (12/10), mas o caso ainda depende da inclusão na pauta.", "titulo_pt": "Plenário do TSE decidirá sobre futuro do ‘Exército do Lula’ no WhatsApp", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 210169, "titulo": "Fim da 6x1 tem semana decisiva com luz verde de Alcolumbre e pressa de Lula", "url": "https://www.metropoles.com/brasil/fim-da-6x1-tem-semana-decisiva-com-luz-verde-de-alcolumbre-e-pressa-de-lula", "fonte_id": "metropoles", "data_pub": "2026-10-12T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado terá as últimas duas sessões de discussão antes da votação em primeiro turno. O governo prepara um calendário especial e busca apoios para a proposta.", "titulo_pt": "Fim da 6x1 tem semana decisiva com luz verde de Alcolumbre e pressa de Lula", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 210216, "titulo": "Governo amplia medidas de combustíveis e mantém custo previsto em R$ 40 bi", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/governo-amplia-medidas-de-combustiveis-e-mantem-custo-previsto-em-r-40-bi/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-12T07:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo expandiu as medidas sobre combustíveis e manteve o custo previsto em R$ 40 bilhões. A equipe econômica justifica que as ações para controlar os preços da gasolina, etanol e diesel serão compensadas pelas receitas extras esperadas com a alta do petróleo.", "titulo_pt": "Governo amplia medidas de combustíveis e mantém custo previsto em R$ 40 bi", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 210094, "titulo": "Fim da escala 6x1 é consenso nas redes sociais", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/encaminhado-com-frequencia/2026/10/fim-da-escala-6x1-e-consenso-nas-redes-sociais.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-12T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado votará nesta quarta-feira (14) a Proposta de Emenda à Constituição (PEC) que reduz a jornada máxima de trabalho de 44 para 40 horas semanais sem corte de salário e garante dois dias de descanso, conhecida como o fim da escala 6x1. O consenso nas redes sociais é a favor desta medida.", "titulo_pt": "Fim da escala 6x1 é consenso nas redes sociais", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 210119, "titulo": "Concentração de votos impede efetividade de 'puxadores de voto' do PSOL e coloca em xeque estratégia eleitoral da esquerda", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/12/concentracao-de-votos-impede-efetividade-de-puxadores-de-voto-do-psol-e-coloca-em-xeque-estrategia-eleitoral-da-esquerda.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-12T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PSOL, apesar de ter conseguido a federação necessária para atingir o percentual nacional de votos, não alcançou o mínimo estadual em oito estados, resultando em perda de vagas na Câmara dos Deputados e sem acesso a recursos públicos para o partido. Votos significativos de parlamentares como Erika Hilton e Sâmia Bomfim não foram suficientes para eleger colegas.", "titulo_pt": "Concentração de votos dificulta estratégia eleitoral do PSOL", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 210223, "titulo": "Centrão fica em alerta e direita otimista para eleição interna do Congresso", "url": "https://www.cnnbrasil.com.br/politica/centrao-fica-em-alerta-e-direita-otimista-para-eleicao-interna-do-congresso/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-12T06:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A esquerda não deve ter candidato próprio nas eleições internas do Congresso e deve seguir a postura das últimas eleições, apoiando Hugo Motta (Republicanos-PB) na reeleição à Câmara e Davi Alcolumbre (União-AP) ao Senado.", "titulo_pt": "Centrão em alerta e direita otimista para eleição interna do Congresso", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 210225, "titulo": "Flávio e Lula escalam candidatos a vice para irem à Basílica de Aparecida", "url": "https://www.cnnbrasil.com.br/eleicoes/flavio-e-lula-escalam-candidatos-a-vice-para-irem-a-basilica-de-aparecida/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-12T06:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro e Lula escalaram candidatos a vice para participarem da procissão na Basílica de Aparecida. Presidenciáveis devem também participar de atos religiosos em Brasília.", "titulo_pt": "Flávio e Lula escalam candidatos a vice para irem à Basílica de Aparecida", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 210477, "titulo": "Zelenskyy says Ukraine is ready to agree to energy ceasefire, but warns Russia must do same", "url": "https://www.cnbc.com/2026/10/12/russia-ukraine-energy-ceasefire-trump.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-12T09:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Zelenskyy afirmou que a Ucrânia está disposta a concordar com um cessar-fogo energético, mas advertiu que a Rússia também deve aceitar. Ele disse que, se a Rússia não concordar com o cessar-fogo proposto por Trump, a Ucrânia responderá.", "titulo_pt": "Zelenskyy diz que Ucrânia está pronta para aceitar cessar-fogo energético, mas Russia deve fazer o mesmo", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 210439, "titulo": "🔴 Americans Robert E. Hall and Michael Woodford win Nobel Prize in Economics", "url": "https://www.france24.com/en/europe/20261012-americans-robert-e-hall-and-michael-woodford-win-nobel-prize-in-economics", "fonte_id": "france24", "data_pub": "2026-10-12T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Robert E. Hall e Michael Woodford, cidadãos dos Estados Unidos, receberam o Prêmio Nobel de Economia.", "titulo_pt": "Americana Robert E. Hall E Michael Woodford ganham prêmio Nobel de economia", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 210456, "titulo": "Nobel Prize in Economics goes to Robert E. Hall and Michael Woodford for their microeconomic focus on stabilization policy", "url": "https://www.dw.com/en/nobel-prize-in-economics-goes-to-robert-e-hall-and-michael-woodford-for-their-microeconomic-focus-on-stabilization-policy/a-79638025?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-10-12T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Robert E. Hall e Michael Woodford receberam o Prêmio Nobel de Economia por suas contribuições microeconômicas na estabilização macroeconômica.", "titulo_pt": "Prêmio nobel de economia para hall E Woodford por suas contribuições microeconômicas na estabilização macroeconômica", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 210440, "titulo": "France: Founder of small centre-left party wins presidential primary", "url": "https://www.france24.com/en/france-founder-of-small-centre-left-party-wins-presidential-primary", "fonte_id": "france24", "data_pub": "2026-10-12T09:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em França, uma primária organizada pelos socialistas de oposição e seus aliados de centro-esquerda resultou em um claro vencedor. Raphaël Glucksmann, fundador do partido 'Place Publique', foi eleito. Ele, com 46 anos, se destaca como uma figura importante na campanha presidencial francesa, que será realizada em abril.", "titulo_pt": "França: fundador do pequeno partido centro-esquerda vence primária presidencial", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 210441, "titulo": "French police arrest 14-year-old after two teaching staff wounded by hunting rifle fire", "url": "https://www.france24.com/en/france/20261012-french-police-arrest-14-year-old-after-two-teaching-staff-wounded-by-hunting-rifle-fire", "fonte_id": "france24", "data_pub": "2026-10-12T09:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois funcionários de ensino foram feridos a bala em uma escola em Aubagne, perto de Marselha, na manhã de segunda-feira. Um adolescente de 14 anos foi preso em conexão com o incidente, segundo uma fonte policial, que disse que não há conexão com as manifestações estudantis que têm se espalhado pelo país recentemente.", "titulo_pt": "Polícia francesa prende adolescente de 14 anos após dois funcionários de ensino feridos por disparos de rifle de caça", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 210349, "titulo": "French centre left must wage ‘existential battle’ to prevent far right winning presidency", "url": "https://www.theguardian.com/world/2026/oct/12/french-centre-left-must-wage-existential-battle-to-prevent-far-right-winning-presidency", "fonte_id": "guardian_world", "data_pub": "2026-10-12T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Raphaël Glucksmann, social democrata francês, foi escolhido como candidato do partido socialista para as eleições presidenciais de 2027. Ele chamou o centro-esquerda francês a lutar uma 'batalha existencial' para impedir a vitória de Marine Le Pen, do extremo direito, nas eleições.", "titulo_pt": "Centro-esquerda francesa deve travar 'batalha existencial' para impedir vitória de le pen", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 210457, "titulo": "India news: Rahul Gandhi to march to Supreme Court", "url": "https://www.dw.com/en/india-news-rahul-gandhi-to-march-to-supreme-court/live-79638649?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-10-12T09:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Oposição está realizando uma marcha até o Supremo Tribunal Federal para exigir a renúncia do Comissário Eleitoral Gyanesh Kumar. A DW seguirá a situação.", "titulo_pt": "Notícias da Índia: rahul Gandhi marchará até o supremo tribunal federal", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 210534, "titulo": "Sala stampa vaticana, 'nodulo del Papa emerso da controlli di routine'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/12/sala-stampa-vaticana-nodulo-del-papa-emerso-da-controlli-di-routine_c574305f-0d9d-423b-890d-0b758c309906.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-12T09:33:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A investigação não surgiu de um fator imediato. A Sala de Imprensa do Vaticano informou sobre um 'nódulo do Papa emergido dos controles de rotina'.", "titulo_pt": "Sala de imprensa vaticana, 'nódulo do Papa emergido dos controles de rotina'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 210481, "titulo": "Trump turns to Russian diesel ahead of midterms, but analysts see little price relief", "url": "https://www.cnbc.com/2026/10/12/russia-ukraine-energy-ceasefire-diesel-prices.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-12T09:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, buscou alternativas russas de diesel para aliviar uma crise de suprimento antes das eleições de meios anos, mas analistas acreditam que isso não terá um impacto significativo nos preços.", "titulo_pt": "Trump busca diesel russo antes das eleições, mas analistas vêem pouco alívio nos preços", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 210549, "titulo": "Crackdown exposes limits of Modi’s playbook for maintaining power", "url": "https://www.japantimes.co.jp/news/2026/10/12/asia-pacific/mdoi-power-playbook/", "fonte_id": "japan_times", "data_pub": "2026-10-12T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O líder indiano enfrenta o desafio de como lidar com a crescente oposição, que analistas afirmam é diferente de qualquer situação que ele tenha enfrentado anteriormente.", "titulo_pt": "Repressão expõe limites do guia de Modi para manutenção do poder", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 210458, "titulo": "Germany's women: Ena Mahmutovic makes her case to become Germany's next No.1 goalkeeper", "url": "https://www.dw.com/en/germany-s-women-ena-mahmutovic-makes-her-case-to-become-germany-s-next-no-1-goalkeeper/a-79609341?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-10-12T09:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ena Mahmutovic, uma goleira de 22 anos do Bayern Munich, destacou-se na vitória da Alemanha contra a Austrália. Ela é vista como a sucessora de Ann-Katrin Berger.", "titulo_pt": "Alemanha: ena Mahmutovic faz seu caso para ser a próxima goleira número 1 do país", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 210350, "titulo": "Russia hit Ukraine power plant ‘immediately after’ Trump declared energy ceasefire, says Zelenskyy – Europe live", "url": "https://www.theguardian.com/world/live/2026/oct/12/ukraine-russia-trump-energy-ceasefire-nato-zelenskyy-nobel-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-10-12T09:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente ucraniano Volodymyr Zelenskyy afirmou que Putin 'não lê Truth Social', o site onde o presidente americano Donald Trump anunciou um cessar-fogo parcial na guerra ucraniana. Zelenskyy também disse que a proposta de Trump é 'novidade para ele' e que a Rússia deseja destruir a arquitetura de segurança existente na Europa para assegurar a dominação russa.", "titulo_pt": "Zelenskyy acusa putin de não ler site de Trump sobre cessar-fogo parcial na Ucrânia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 210640, "titulo": "(3rd LD) N. Korea fires multiple ballistic missiles after S. Korea's hypersonic weapon test", "url": "https://en.yna.co.kr/view/AEN20261012002752315", "fonte_id": "yonhap_news", "data_pub": "2026-10-12T09:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No dia 12 de outubro, o Norte Coreia disparou múltiplos mísseis balísticos. Esta ação ocorreu após o teste de uma arma hipersônica pelo Sul Coreia.", "titulo_pt": "Coreia do norte dispara múltiplos mísseis após teste de arma hipersônica da Coreia do sul", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 210299, "titulo": "Houthis atacam aeroporto da Arábia Saudita pelo 2º dia; veja o que se sabe", "url": "https://www.bbc.com/portuguese/articles/cqx29xxyl8zro?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-12T09:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O aeroporto da Arábia Saudita foi atacado novamente pelo segundo dia consecutivo por grupos houthis. Este ataque foi o mais letal na região desde maio de 2015.", "titulo_pt": "Houthis atacam aeroporto da Arábia Saudita pelo 2º dia", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 210442, "titulo": "Saudi Arabia: Riyadh airport struck again by Yemen's Houthis", "url": "https://www.france24.com/en/saudi-arabia-riyadh-airport-struck-again-by-yemen-s-houthis", "fonte_id": "france24", "data_pub": "2026-10-12T09:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo ataque atingiu o aeroporto internacional de Riad no sábado, um dia após outro ataque que resultou em pelo menos 12 mortos e mais de 300 feridos. Este foi o ataque mais letal em território saudita em mais de uma década.", "titulo_pt": "Arábia saudita: aeroporto de riad atingido novamente pelos hutis do iêmen", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 210443, "titulo": "Trump touts surprise 'energy ceasefire' – Zelensky says he hasn't seen details, Moscow silent", "url": "https://www.france24.com/en/video/20261012-trump-touts-surprise-energy-ceasefire-%E2%80%93-zelensky-says-he-hasn-t-seen-details-moscow-silent", "fonte_id": "france24", "data_pub": "2026-10-12T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, anunciou uma suposta 'ceia de energia' entre Ucrânia e Rússia, gerando confusão. Kyiv ainda não viu os detalhes do acordo e Moscou permaneceu em silêncio.", "titulo_pt": "Trump anuncia suposta 'ceia de energia' entre Ucrânia e Rússia – Zelensky não viu detalhes, moscou muda de posição", "veiculo": "France 24", "pais": "França", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 210479, "titulo": "Nobel prize in economics awarded to Robert E. Hall and Michael Woodford", "url": "https://www.cnbc.com/2026/10/12/nobel-economics-prize-winner-woodford-hall.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-12T09:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O prêmio Nobel de Economia foi concedido aos economistas Robert E. Hall e Michael Woodford. A decisão foi anunciada pela academia sueca.", "titulo_pt": "Prêmio nobel de economia concedido a Robert E. Hall E Michael Woodford", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 210202, "titulo": "Opep reduz expectativa da demanda para 400 mil barris por dia em 2026", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/opep-reduz-crescimento-da-demanda-para-400-mil-barris-por-dia-em-2026/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-12T09:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Opep reduziu a expectativa de demanda para 400 mil barris por dia em 2026, uma diminuição significativa em comparação com a projeção inicial de 1,4 milhão de barris no início do ano.", "titulo_pt": "Opep reduz expectativa da demanda para 400 mil barris por dia em 2026", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 210227, "titulo": "Temporada de balanços nos EUA terá régua mais alta e menos surpresas, diz XP", "url": "https://www.infomoney.com.br/mercados/temporada-de-balancos-nos-eua-tera-regua-mais-alta-e-menos-surpresas-diz-xp/", "fonte_id": "infomoney", "data_pub": "2026-10-12T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A XP espera que o lucro por ação das empresas do índice alcance US$ 91 no terceiro trimestre, um aumento de 31,4% em comparação com o mesmo período do ano anterior e 1,6% acima do consenso de mercado.", "titulo_pt": "Temporada de balanços nos EUA terá régua mais alta e menos surpresas, segundo XP", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 210484, "titulo": "World Bank jobs council urges 'crisis-era' employment support measures as IMF warns of AI ‘tsunami’", "url": "https://www.cnbc.com/2026/10/12/imf-world-bank-ai-jobs-inflation-.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-12T08:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A diretora-gerente do FMI, Kristalina Georgieva, alertou que a inteligência artificial está afetando o mercado de trabalho global de forma gradual, comparando-a a um 'tsunami lento'. Os jovens entrando no mercado de trabalho são particularmente vulneráveis a esses efeitos.", "titulo_pt": "Conselho do banco mundial defende medidas de apoio ao emprego em tempos de crise, enquanto fmi avisa sobre 'tsunami' da IA", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 210658, "titulo": "EU caps annual HEV imports at 350,000 to curb trade deficit with China", "url": "https://www.digitimes.com/news/a20261012PD234/eu-trade-deficit-hev-beijing-wto.html", "fonte_id": "digitimes", "data_pub": "2026-10-12T08:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Europeia planeja limitar as importações de veículos híbridos elétricos (HEVs) a 350.000 unidades por ano, com medidas de proteção comercial que podem entrar em vigor a partir de 1º de dezembro de 2026. O quadro de quatro anos estabelece um limite de 350.000 unidades no primeiro ano, seguido por uma expansão anual de 6% a partir do segundo ano, com ambos os lados comprometidos a seguir as regras da Organização Mundial do Comércio (OMC).", "titulo_pt": "Ue estipula limite anual de importações de veículos híbridos elétricos em 350.000 unidades", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 210478, "titulo": "Stellantis CEO urges incentives for carmakers who build in Europe as Chinese rivals gain ground", "url": "https://www.cnbc.com/2026/10/12/stellantis-europe-cars-chinese-rivals-evs.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-12T08:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Stellantis encorajou os reguladores europeus a criar incentivos para as montadoras que produzam veículos na região, diante da concorrência crescente de rivais chineses.", "titulo_pt": "CEO da stellantis pede incentivos para montadoras que fabricam em Europa diante da concorrência chinesa", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 210242, "titulo": "A armadilha fiscal do Réveillon", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-armadilha-fiscal-do-reveillon", "fonte_id": "jota", "data_pub": "2026-10-12T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A transição do PIS/Cofins para a CBS não está sendo resolvida pelo frete. Este é um problema fiscal relacionado à transição das contribuições.", "titulo_pt": "A armadilha fiscal do Réveillon", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 210243, "titulo": "Escalada dos juros globais eleva desafios aos ativos domésticos", "url": "https://www.jota.info/opiniao-e-analise/colunas/tendencias/escalada-dos-juros-globais-eleva-desafios-aos-ativos-domesticos", "fonte_id": "jota", "data_pub": "2026-10-12T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os juros globais estão aumentando, trazendo novos desafios para ativos locais. Há sinais que indicam que essa tendência de juros mais elevados pode se tornar estrutural no mundo.", "titulo_pt": "Aumento dos juros globais eleva desafios para ativos locais", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 210482, "titulo": "Intel, Broadcom CEOs warn capital crunch could become AI's biggest bottleneck", "url": "https://www.cnbc.com/2026/10/12/intel-broadcom-ceos-warn-capital-crunch-could-become-ai-bottleneck.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-12T08:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os CEOs das empresas Intel e Broadcom alertaram que o acesso a capital poderia se tornar um dos principais entraves para o avanço da era da inteligência artificial.", "titulo_pt": "CEOs da intel e Broadcom avisan: acesso a capital pode se tornar o maior entrave para a AI", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 210111, "titulo": "Cimed investe R$ 80 mi em marca de beleza sul-coreana e amplia portfólio para competir com multinacionais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/cimed-investe-r-80-mi-em-marca-de-beleza-sul-coreana-e-amplia-portfolio-para-competir-com-multinacionais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-12T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Cimed, empresa brasileira especializada em medicamentos genéricos, está investindo R$ 80 milhões na marca de beleza sul-coreana Mili, visando expandir seu portfólio e competir com multinacionais. A companhia almeja atingir um faturamento de R$ 5 bilhões em 2027.", "titulo_pt": "Cimed investe R$ 80 mi em marca de beleza sul-coreana e amplia portfólio", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 210246, "titulo": "Redução de benefício ou sobrecarga tributária", "url": "https://www.jota.info/opiniao-e-analise/artigos/reducao-de-beneficio-ou-sobrecarga-tributaria", "fonte_id": "jota", "data_pub": "2026-10-12T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O §7º do art. 4º da LC 224/2025 introduziu uma nova disposição sobre a redução de benefícios ou sobreposição tributária, mas não há detalhes específicos sobre o conteúdo dessas alterações nesse trecho.", "titulo_pt": "Redução de benefícios ou sobreposição tributária", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 210646, "titulo": "(2nd LD) BOK chief says back-to-back rate hikes bought time to respond to financial risks", "url": "https://en.yna.co.kr/view/AEN20261012002652320", "fonte_id": "yonhap_news", "data_pub": "2026-10-12T07:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe do Banco da Coreia afirmou que as duas taxas de juros consecutivas proporcionaram tempo para responder a riscos financeiros.", "titulo_pt": "Chefe do BOK afirma que aumentos sucessivos de juros ganharam tempo para lidar com riscos financeiros", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 210674, "titulo": "AITO doubles down on CATL as China's battery supply chain shifts toward selective diversification", "url": "https://www.digitimes.com/news/a20261012VL217/catl-seres-partnership-automotive-battery-production.html", "fonte_id": "digitimes", "data_pub": "2026-10-12T07:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As esforços para reduzir a dominância da CATL estão acelerando no panorama automotivo chinês, levando o mercado de baterias nacionais a se mover para uma modelagem de fornecimento mais diversificada, embora ainda com dependência selectiva da CATL.", "titulo_pt": "AITO aprofunda parceria com CATL à medida que a cadeia de suprimentos de baterias da China se movimenta para uma diversificação seletiva", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 210112, "titulo": "Escassez de foguetes abre uma oportunidade para as concorrentes da SpaceX", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/escassez-de-foguetes-abre-uma-oportunidade-para-as-concorrentes-da-spacex.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-12T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ano passado registrou o maior número de lançamentos de foguetes na história, com 325 lançamentos orbitais, 25% a mais do que em 2024. Isso resultou em 4.544 espaçonaves sendo colocadas em órbita, um aumento de 54% em comparação com o ano anterior.", "titulo_pt": "Escassez de foguetes abre oportunidade para concorrentes da SpaceX", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 210649, "titulo": "(LEAD) FTC head vows stern action against unfair practices burdening people", "url": "https://en.yna.co.kr/view/AEN20261012000951320", "fonte_id": "yonhap_news", "data_pub": "2026-10-12T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe do órgão antitruste da Coreia do Sul declarou que irá tomar medidas severas contra práticas desleais que pesam sobre as pessoas.", "titulo_pt": "Chefe do FTC promete ação rigorosa contra práticas desleais", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 210554, "titulo": "China’s $7.5 billion EU hybrid boom faces new curbs under deal with bloc", "url": "https://www.japantimes.co.jp/business/2026/10/12/china-hybrid-eu-curbs/", "fonte_id": "japan_times", "data_pub": "2026-10-12T06:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde que a União Europeia impôs tarifas adicionais sobre veículos elétricos chineses em 2024, as fabricantes chinesas de automóveis têm se voltado cada vez mais para a produção de híbridos plug-in.", "titulo_pt": "Boom dos veículos híbridos chineses na ue enfrenta novas restrições com acordo do bloco", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 210581, "titulo": "Mapping US chip supply chain: China accounts for far more than it appears, report says", "url": "https://www.scmp.com/tech/tech-trends/article/3370581/mapping-us-chip-supply-chain-china-accounts-far-more-it-appears-report-says?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-12T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "China representa cerca de 5% dos equipamentos e materiais diretamente fornecidos à indústria de chips dos EUA, segundo a Associação da Indústria de Semicondutores (SIA). Embora 95% dos gastos anuais de cerca de 27 bilhões de dólares dos fabricantes de chips americanos em equipamentos e materiais sejam provenientes de empresas sediadas nos EUA, Europa e Japão, a China detém mais de 90% de certos rares metais necessários para a produção de chips.", "titulo_pt": "Mapa da cadeia de suprimentos de chips dos EUA: china tem papel maior do que se pensa", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 210683, "titulo": "Learning to Play Like a Pro: Adaptive Motion Planning and Tracking for Humanoid Robots", "url": "https://content.knowledgehub.wiley.com/learning-to-play-like-a-pro-adaptive-motion-planning-and-tracking-for-humanoid-robots/", "fonte_id": "ieee_spectrum", "data_pub": "2026-10-12T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório detalha como a planificação de movimento e o rastreamento de movimento podem ser decupados para preservar o estilo atletico profissional em robôs humanoides, enfatizando a importância do controle adaptativo e consciente de velocidade. Explica como a separação de um planejador de alto nível de um tracker de baixo nível ajuda a resolver o dilema entre estilo atletico profissional e eficiência tarefa.", "titulo_pt": "Aprender a jogar como um profissional: planejamento de movimento adaptativo e rastreamento para robôs humanoides", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 210548, "titulo": "Robert Hall and Michael Woodford win 2026 Nobel economics prize", "url": "https://www.japantimes.co.jp/business/2026/10/12/nobel-economics-prize/", "fonte_id": "japan_times", "data_pub": "2026-10-12T09:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Robert Hall e Michael Woodford receberam o Prêmio Sveriges Riksbank de Ciências Econômicas em Memória de Alfred Nobel de 2026. Este foi o último prêmio a ser concedido neste ano.", "titulo_pt": "Robert Hall e Michael Woodford ganham o prêmio Nobel de economia de 2026", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 210605, "titulo": "Mars may be a hellhole, but the moon is not far behind", "url": "https://www.technologyreview.com/2026/10/12/1145760/imagining-building-cities-on-the-moon/", "fonte_id": "mit_tech_review", "data_pub": "2026-10-12T09:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Está ocorrendo uma nova corrida espacial, com Estados Unidos e China liderando a competição para a superfície lunar, além de outros países envolvidos de maneira variada.", "titulo_pt": "Marte pode ser um inferno, mas a lua não fica muito atrás", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 210586, "titulo": "Former HSBC executive launches wealth platform powered by team of AI agents", "url": "https://www.scmp.com/business/money/wealth/article/3370565/former-hsbc-executive-launches-wealth-platform-powered-team-ai-agents?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-12T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trista Sun, ex-executiva sênior do HSBC, lançou uma startup de gestão de riquezas impulsionada por inteligência artificial com o objetivo de alcançar uma avaliação de um bilhão de dólares. A Equora visa auxiliar os investidores a gerenciar suas finanças de forma proativa com a ajuda de agentes de IA.", "titulo_pt": "Ex-executiva do HSBC lança plataforma de riquezas impulsionada por IA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 210606, "titulo": "The ecologist revealing the invisible networks that revive rainforests", "url": "https://www.technologyreview.com/2026/10/12/1145745/daisy-dent-ecologist-revealing-invisible-networks-revive-rainforests/", "fonte_id": "mit_tech_review", "data_pub": "2026-10-12T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma estação de pesquisa no centro da Panamá, é possível observar a progressão do tempo no bosque, desde plantações jovens até as copas majestosas de árvores maduras. A ecologista Daisy Dent, cientista sênior da ETH Zurich, supervisiona esta sequência de áreas de pesquisa no Monumento Natural Barro Colorado.", "titulo_pt": "A ecologista revelando as redes invisíveis que revivem as florestas tropicais", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 210707, "titulo": "September 2026's top 10 European tech deals you need to know about", "url": "https://tech.eu/2026/10/12/september-2026s-top-10-european-tech-deals-you-need-to-know-about/", "fonte_id": "tech_eu", "data_pub": "2026-10-12T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em setembro de 2026, a financiamento para empresas de tecnologia na Europa atingiu €15,8 bilhões em 300 negócios, um aumento significativo em comparação com agosto, quando o valor foi de €3,2 bilhões em 165 negócios.", "titulo_pt": "Top 10 das principais negociações de tecnologia europeias de setembro de 2026", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 210300, "titulo": "'Trend' dos anos 80 no ChatGPT: o que você está entregando de graça para a IA e como se proteger", "url": "https://www.bbc.com/portuguese/articles/c5vgjmxzrxyno?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-12T08:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Milhões de pessoas estão usando o ChatGPT e outras ferramentas de IA para transformar suas selfies em fotos retrô, mas especialistas alertam sobre o risco de compartilhamento não intencional de informações pessoais. Usuários podem estar entregando mais dados do que imaginam para a inteligência artificial.", "titulo_pt": "Tendência dos anos 80 no ChatGPT: o que você está entregando de graça para a IA e como se proteger", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 210660, "titulo": "Nanya gross margin hits 85.7% as low-priced DRAM contracts roll off", "url": "https://www.digitimes.com/news/a20261012PD236/nanya-technology-low-priced-dram-gross-margin-2026.html", "fonte_id": "digitimes", "data_pub": "2026-10-12T08:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nanya Technology registrou lucros trimestrais recordes no terceiro trimestre de 2026, conforme informado em resultados não auditados divulgados em 12 de outubro. Os preços médios de venda (ASPs) de DRAM aumentaram mais de 60% trimestralmente devido ao encerramento de acordos a longo prazo (LTAs) com preços mais baixos.", "titulo_pt": "Margem bruta da nanya atinge 85,7% com expiração de contratos DRAM de baixo custo", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 210661, "titulo": "Memory surge lifts phone prices, boosting N-1 and used-device demand", "url": "https://www.digitimes.com/news/a20261012PD235/smartphone-demand-sales-2026-shipments.html", "fonte_id": "digitimes", "data_pub": "2026-10-12T08:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O aumento dos preços das memórias está elevando os preços dos smartphones, reduzindo as vendas de novos dispositivos em 2026. A demanda por smartphones da geração anterior e usados está aumentando, potencialmente levando o mercado de smartphones usados a ultrapassar 300 milhões de unidades.", "titulo_pt": "Aumento de preços de memória eleva preços dos smartphones e impulsiona demanda por dispositivos usados", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 210662, "titulo": "How 'Filter Moore's Law' is doubling revenue for a Taiwan chip filter maker", "url": "https://www.digitimes.com/news/a20261012PD221/revenue-2nm-expansion-packaging-2026.html", "fonte_id": "digitimes", "data_pub": "2026-10-12T08:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com o que a indústria chama de 'Lei de Filtração de Moore', a cada redução na nodalidade do processo, a tolerância para contaminantes moleculares no ar diminui, aumentando a demanda por filtração de forma exponencial. Para a empresa de filtração de contaminantes aéreos Ye Siang Enterprise, Taiwan, essa demanda está resultando em receita recorde.", "titulo_pt": "Como a 'lei de filtração de Moore' está dobrando o faturamento de uma empresa de filtração de chips na Taiwan", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 210663, "titulo": "Chenbro Micom expands into Nvidia Vera Rubin rack-scale systems, 2026 revenue already tops full-year 2025", "url": "https://www.digitimes.com/news/a20261012VL223/chenbro-2026-chassis-revenue-nvidia.html", "fonte_id": "digitimes", "data_pub": "2026-10-12T08:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa taiwanesa Chenbro Micom está expandindo sua participação em infraestrutura de inteligência artificial, passando a atuar em servidores de alto nível e soluções de rack, além de encadernamentos de servidores tradicionais. A empresa já está envolvida em vários projetos do plataforma Nvidia Vera Rubin, envolvendo GPUs, CPUs e armazenamento, e programas personalizados de ASICs para provedores de serviços de nuvem estão progredindo conforme programado.", "titulo_pt": "Chenbro Micom expande para sistemas Nvidia Vera Rubin de escala de rack, receita de 2026 já supera 2025", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 210244, "titulo": "Política de IA não pode se limitar à regulação", "url": "https://www.jota.info/opiniao-e-analise/artigos/politica-de-ia-nao-pode-se-limitar-a-regulacao", "fonte_id": "jota", "data_pub": "2026-10-12T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O desafio dos governos será combinar proteção de direitos, infraestrutura, dados, formação e capacidade tecnológica. Política de IA não pode se limitar à regulação.", "titulo_pt": "Política de IA não pode se limitar à regulação", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 210590, "titulo": "How China harnesses AI microdramas to shape public opinion at home and abroad", "url": "https://www.scmp.com/news/china/politics/article/3370547/how-china-harnesses-ai-microdramas-shape-public-opinion-home-and-abroad?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-12T08:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Beijing está ampliando rapidamente o uso de inteligência artificial para produzir vídeos e microdramas em suas campanhas de propaganda, alinhando-se com diretrizes que enfatizam o papel da tecnologia na fortalecimento do trabalho ideológico e na orientação da opinião pública. Esses novos conteúdos AI incorporam elementos da cultura e das políticas chinesas, diferentemente dos tópicos sensacionalistas comuns em outros conteúdos digitais chineses.", "titulo_pt": "Como a China usa inteligência artificial para produzir microdramas e moldar a opinião pública", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 210553, "titulo": "IMF chief warns of threat from AI to jobs and taxes", "url": "https://www.japantimes.co.jp/business/2026/10/12/imf-kristalina-georgieva-ai-warning/", "fonte_id": "japan_times", "data_pub": "2026-10-12T07:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kristalina Georgieva, chefe do FMI, alertou que a tecnologia da inteligência artificial já está diminuindo a demanda por muitos trabalhadores humanos ao assumir tarefas rotineiras e repetitivas.", "titulo_pt": "Chefe do fmi avisa sobre ameaça da IA aos empregos e tributos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 210665, "titulo": "Largan signals early peak-season cut, challenging phone chips in 4Q26", "url": "https://www.digitimes.com/news/a20261012PD232/smartphone-chairman-2026-ceo-market.html", "fonte_id": "digitimes", "data_pub": "2026-10-12T07:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Largan, Adam Lin, indicou que as encomendas de outubro de 2026 estão no mesmo nível das de setembro, mas começarão a diminuir em novembro, devido às reduções nas projeções dos clientes após o lançamento de novos smartphones. Isso sugere que a demanda na cadeia de suprimentos de smartphones enfraquecerá no quarto trimestre de 2026, representando desafios para fabricantes de chips de telefones e outros fornecedores que tiveram bons resultados no terceiro trimestre.", "titulo_pt": "Largan sinaliza corte na temporada alta, desafiando fabricantes de chips de telefones no 4º trimestre de 2026", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 210691, "titulo": "Popular weight loss drugs linked to a surprising fingernail problem", "url": "https://www.sciencedaily.com/releases/2026/10/261011211604.htm", "fonte_id": "science_daily", "data_pub": "2026-10-12T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos associaram medicamentos populares para perda de peso, como Ozempic e Wegovy, a altas taxas inesperadas de desprendimento de unhas, queda de cabelo e inflamação no couro cabeludo, com alguns problemas ocorrendo várias vezes mais frequentemente entre os usuários. A perda de peso sozinha não explica completamente as diferenças observadas, sugerindo que outros fatores podem estar envolvidos.", "titulo_pt": "Medicamentos para perda de peso populares ligados a um problema inesperado nas unhas", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 210693, "titulo": "Scientists find hidden driver of aging and a simple amino acid that fights memory loss in mice", "url": "https://www.sciencedaily.com/releases/2026/10/261009025708.htm", "fonte_id": "science_daily", "data_pub": "2026-10-12T09:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram que níveis decrescentes de uma proteína chamada Menin podem contribuir para o envelhecimento, e a reposição desta proteína em roedores mais velhos reverteu várias alterações relacionadas à idade em apenas 30 dias. Surpreendentemente, suplementar com um aminoácido simples chamado D-serina melhorou a memória e o aprendizado, oferecendo uma abordagem potencial para o declínio cognitivo relacionado à idade.", "titulo_pt": "Cientistas identificam proteína que pode acelerar o envelhecimento e aminoácido que melhora a memória nos roedores", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 210684, "titulo": "Hurricane Simon churns off Mexican coast after shift in course", "url": "https://phys.org/news/2026-10-hurricane-simon-churns-mexican-coast.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O hurricânio Simon mudou sua trajetória ligeiramente no domingo e está previsto para passar próximo à costa oeste do México sem atingir o território, mas trazendo fortes chuvas e ventos severos.", "titulo_pt": "Hurricânio Simon se move para perto da costa mexicana sem previsão de tocar terra", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 210685, "titulo": "World leaders urged to 'course correct' as UN nature goals fall short", "url": "https://phys.org/news/2026-10-world-leaders-urged-nature-goals.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T09:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Países se preparam para um relatório negativo na cúpula ambiental da ONU deste mês, com governos não cumprindo suas promessas de proteger as plantas, animais e ecossistemas que mantêm a vida na Terra.", "titulo_pt": "Líderes mundiais são incentivados a 'corrigir o curso' enquanto metas da ONU sobre a natureza não são atingidas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 210686, "titulo": "El Niño sets temperature record in key Pacific zone: EU monitor", "url": "https://phys.org/news/2026-10-el-nio-temperature-key-pacific.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T09:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um El Niño intensificado rompeu um recorde de temperatura em uma zona crucial do Pacífico em setembro, conforme informou o monitor climático da União Europeia. Isso indica que o padrão climático está ganhando uma força excepcional.", "titulo_pt": "El Niño quebra recorde de temperatura em zona chave do pacífico: monitor da ue", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 210687, "titulo": "Italian rice farmer beats heat with biodiversity haven", "url": "https://phys.org/news/2026-10-italian-rice-farmer-biodiversity-haven.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T09:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alice Cerutti, uma agricultora italiana, restaurou uma parte de campos de arroz em seus estados originais naturais, focando na biodiversidade em vez da produção de arroz após quatrocentos anos de cultivo.", "titulo_pt": "Agricultora italiana cria refúgio de biodiversidade em campos de arroz", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 210092, "titulo": "Pesquisadores descobrem espécie de 'peixe-nuvem' na Amazônia", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/pesquisadores-descobrem-especie-de-peixe-nuvem-na-amazonia.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-12T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores descobriram uma nova espécie de peixe-nuvem endêmica da Amazônia sul do Amapá. A espécie já pode estar ameaçada de extinção.", "titulo_pt": "Pesquisadores descobrem nova espécie de 'peixe-nuvem' na Amazônia", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 210709, "titulo": "Why the worst El Niño killed millions – and how we can avoid a repeat", "url": "https://www.newscientist.com/article/2592513-why-the-worst-el-nino-killed-millions-and-how-we-can-avoid-a-repeat/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-10-12T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mundo não enfrentou um El Niño tão forte desde os anos 1870, quando ele causou uma terrível fome global. A pergunta é se estamos melhor preparados desta vez.", "titulo_pt": "Por que o pior El Niño matou milhões - e como podemos evitar uma repetição", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 210588, "titulo": "China bets on molten salt and CO2 to help meet its power needs", "url": "https://www.scmp.com/plus/news/china/science/article/3370584/china-bets-molten-salt-and-co2-help-meet-its-power-needs?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-12T08:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China está construindo o primeiro grande projeto de geração de energia que combina tecnologias emergentes: a geração de supercrital de carbono (CO2) e a armazenamento em sal derretido em escala grande. O projeto Ruitan, em construção em Yantai, provavelmente demonstrará como a combinação dessas tecnologias pode reduzir o desperdício de energia e melhorar a estabilidade da rede elétrica.", "titulo_pt": "China aposta em sal derretido e CO2 para atender às suas necessidades energéticas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 210699, "titulo": "NASA captures a stunning transformation in Australia's red outback", "url": "https://www.sciencedaily.com/releases/2026/10/261008102710.htm", "fonte_id": "science_daily", "data_pub": "2026-10-12T08:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Australásia experimentou uma transformação notável em seu deserto normalmente seco, com flores silvestres emergindo após chuvas excepcionalmente pesadas, possivelmente criando o melhor florescimento em cerca de 20 anos. Imagens de satélite da NASA capturam essa transformação surpreendente, que incluiu até mesmo flores raras perto de um observatório espacial remoto.", "titulo_pt": "NASA registra uma transformação impressionante no deserto vermelho da austrália", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 210688, "titulo": "Rescued weather records reveal hot days became nearly twice as common in the Congo Basin over two decades", "url": "https://phys.org/news/2026-10-weather-reveal-hot-days-common.html", "fonte_id": "phys_org", "data_pub": "2026-10-12T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novos estudos, liderados pela Vrije Universiteit Brussel (VUB), mostram um claro sinal de aquecimento na Bacia do Congo desde os anos 1960, utilizando registros climáticos históricos do Congo Democrático. Esses registros vêm dos arquivos do Instituto Nacional para o Estudo e Pesquisa Agronômica (INERA) em Yangambi, Congo Democrático, e dos Arquivos Estatais da Bélgica.", "titulo_pt": "Registros climáticos resgatados revelam que dias quentes se tornaram quase o dobro de comuns na bacia do Congo ao longo de duas décadas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 210177, "titulo": "O que aconteceu em laboratório que pesquisa peste na Rússia? Caso ainda tem lacunas", "url": "https://exame.com/ciencia/o-que-aconteceu-em-laboratorio-que-pesquisa-peste-na-russia-caso-ainda-tem-lacunas/", "fonte_id": "exame", "data_pub": "2026-10-12T06:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Autoridades russas divulgaram novos dados após pedidos de esclarecimento sobre um episódio em que pesquisa sobre peste foi realizada em um laboratório, mas dúvidas sobre o ocorrido ainda persistem.", "titulo_pt": "O que aconteceu em laboratório que pesquisava peste na Rússia? Caso ainda tem lacunas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 210178, "titulo": "O que faz 'células 'zumbi' se acumularem no corpo com a idade? Estudo traz nova resposta", "url": "https://exame.com/ciencia/o-que-faz-celulas-zumbi-se-acumularem-no-corpo-com-a-idade-estudo-traz-nova-resposta/", "fonte_id": "exame", "data_pub": "2026-10-12T06:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudo sugere que células 'zumbi' se acumulam com a idade devido a uma falha no mecanismo de reciclagem celular, o que pode dificultar a ação das células de defesa durante o envelhecimento.", "titulo_pt": "O que faz 'células zumbi' se acumularem no corpo com a idade? Estudo traz nova resposta", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 210701, "titulo": "Scientists discover a hidden factor that can make or break chemical reactions", "url": "https://www.sciencedaily.com/releases/2026/10/261008005244.htm", "fonte_id": "science_daily", "data_pub": "2026-10-12T06:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram um fator oculto que pode determinar o sucesso ou falha de reações químicas, aumentando a proporção do produto desejado de 16% para 97%. Eles controlaram a acidez nas proximidades dos eletrodos para desenvolver uma possível maneira de produzir químicos usados em plásticos, medicamentos e outros produtos usando oxigênio e eletricidade em vez de oxidantes perigosos.", "titulo_pt": "Cientistas descobrem fator oculto que pode determinar o sucesso ou falha de reações químicas", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 210179, "titulo": "Obra no Maranhão revela um dos maiores dinossauros do Brasil; conheça a espécie", "url": "https://exame.com/ciencia/obra-no-maranhao-revela-um-dos-maiores-dinossauros-do-brasil-conheca-a-especie/", "fonte_id": "exame", "data_pub": "2026-10-12T06:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma nova espécie de dinossauro foi descoberta no Maranhão e viveu há cerca de 100 milhões de anos. A descoberta pode contribuir para entender a dispersão desses animais entre os continentes.", "titulo_pt": "Nova espécie de dinossauro do Maranhão pode ajudar a entender a dispersão dos gigantes entre continentes", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 210182, "titulo": "Coração pode ficar 'mais jovem' após transplante? Estudo revela mudanças moleculares", "url": "https://exame.com/ciencia/coracao-pode-ficar-mais-jovem-apos-transplante-estudo-revela-mudancas-moleculares/", "fonte_id": "exame", "data_pub": "2026-10-12T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Testes com camundongos e dados de 11 pacientes sugerem que a idade do receptor pode afetar os marcadores de envelhecimento do coração após um transplante.", "titulo_pt": "Coração pode ficar 'mais jovem' após transplante? Estudo revela mudanças moleculares", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 210725, "titulo": "Raven Chacon’s Echoes on Park Avenue", "url": "https://hyperallergic.com/raven-chacons-echoes-on-park-avenue/", "fonte_id": "hyperallergic", "dat
