telligence/986541/texas-governor-abbott-flock-cameras", "fonte_id": "the_verge", "data_pub": "2026-08-30T15:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governador do Texas, Greg Abbott, suspendeu o financiamento estatal para a aquisição de câmeras de vigilância com inteligência artificial da empresa Flock. A decisão foi tomada em resposta a críticas crescentes sobre essas câmeras e ocorreu antes da publicação de uma investigação do Texas Tribune que revelou que o estado gastou mais de 30 milhões de dólares com essas câmeras.", "titulo_pt": "Governador do texas congela financiamento para câmeras de vigilância Flock", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 134118, "titulo": "STAT+: Alnylam defends heart disease drugs after failure of AstraZeneca’s Wainua", "url": "https://www.statnews.com/2026/08/30/alnylam-attr-astrazeneca-wainua-attruby-heart-disease/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-30T17:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A falha de um ensaio clínico de doenças cardíacas da AstraZeneca está colocando a Alnylam sob pressão, que está defendendo suas próprias medicações.", "titulo_pt": "Falha de ensaio da AstraZeneca pressiona alnylam, que defende seus medicamentos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 134119, "titulo": "Infection kills gut cells, while diet reshapes existing ones, fruit fly study finds", "url": "https://phys.org/news/2026-08-infection-gut-cells-diet-reshapes.html", "fonte_id": "phys_org", "data_pub": "2026-08-30T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo da Cornell University descobriu que os intestinos usam estratégias diferentes para se reconstruir em resposta a mudanças na dieta e a infecções. A pesquisa ilumina como a saúde intestinal se adapta a condições difíceis, ecossistemas microbiológicos florescentes e dietas variáveis.", "titulo_pt": "Infecção mata células do intestino, enquanto a dieta reconfigura as existentes, mostra estudo com moscas-do-fruto", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 133735, "titulo": "Novo telescópio da Nasa descobridor de mundos terá campo de visão mais de 100 vezes maior que o Hubble; entenda o que torna ele diferente", "url": "https://www.cnnbrasil.com.br/ciencia/novo-telescopio-da-nasa-tera-campo-de-visao-mais-de-100-vezes-maior-que-o-hubble-entenda-o-que-torna-ele-diferente/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T15:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O novo telescópio da NASA foi lançado no domingo (30) com o objetivo de explorar o espaço e ajudar os astrônomos a investigar mistérios relacionados à energia escura. O equipamento terá um campo de visão 100 vezes maior que o Hubble.", "titulo_pt": "Novo telescópio da Nasa terá campo de visão 100 vezes maior que o Hubble; entenda", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 134120, "titulo": "Tropical Storm Karina strengthens into a hurricane in the Pacific, could be a major storm this week", "url": "https://phys.org/news/2026-08-tropical-storm-karina-hurricane-pacific.html", "fonte_id": "phys_org", "data_pub": "2026-08-30T15:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tropical Storm Karina se fortaleceu em uma furacão no Oceano Pacífico e pode se tornar uma tempestade de grande magnitude nesta semana, conforme previsto pelos meteorologistas. O centro do ciclone estava a uma distância significativa do continente e não representava ameaça para a terra.", "titulo_pt": "Tropical Storm Karina se fortalece em furacão no pacífico e pode se tornar uma grande tempestade esta semana", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 134122, "titulo": "New method tests magnet-powered braking for safer, more reusable spacecraft reentry", "url": "https://phys.org/news/2026-08-method-magnet-powered-safer-reusable.html", "fonte_id": "phys_org", "data_pub": "2026-08-30T15:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade Metropolitana de Tóquio desenvolveram um novo sistema para testar o aerobreaking magneto-hidrodinâmico de naves espaciais ao reentrar na atmosfera. O sistema utiliza um forte campo magnético gerado por um electromagneto para simular a reentrada de uma pequena cápsula espacial.", "titulo_pt": "Novo método testa frenagem magnética para reentrada segura e mais reutilizável de naves espaciais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 134132, "titulo": "1.4-million-year-old footprints reveal a surprisingly large human relative", "url": "https://www.sciencedaily.com/releases/2026/08/260829035221.htm", "fonte_id": "science_daily", "data_pub": "2026-08-30T15:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Achados de 1,4 milhão de anos em Kenia indicam que oito Paranthropus boisei podem ter viajado juntos, com alguns atingindo tamanhos corporais surpreendentemente grandes, humanóides. Os rastros oferecem uma rara visão de seu comportamento social e sugerem que essas espécies extintas de humanos podem ter vivido em grupos mais complexos do que se pensava anteriormente.", "titulo_pt": "Rastros de 1,4 milhão de anos revelam um grupo de humanos ancestrais surpreendentemente grandes", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 134131, "titulo": "This strange “spacetime crystal” can suddenly become a black hole", "url": "https://www.sciencedaily.com/releases/2026/08/260829035225.htm", "fonte_id": "science_daily", "data_pub": "2026-08-30T15:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Físicos matematicamente descreveram um 'crystal de espaço-tempo' estranho que pode se dissolver ou colapsar em um microscópico buraco negro após uma pequena alteração na energia. Este avanço foi alcançado através de uma técnica inusitada que envolve dimensões infinitas.", "titulo_pt": "Este estranho 'crystal de espaço-tempo' pode se transformar em um buraco negro", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 133574, "titulo": "Podemos em breve ter a tecnologia necessária para alcançar outros sistemas estelares", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/podemos-em-breve-ter-a-tecnologia-necessaria-para-alcancar-outros-sistemas-estelares.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-30T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A recente confirmação da existência de uma atmosfera em torno de um exoplaneta rochoso chamado LHS 1140b gerou grande interesse na comunidade astronômica. O planeta orbita dentro da zona habitável de sua estrela-mãe, uma anã vermelha localizada a cerca de 48 anos-luz da Terra.", "titulo_pt": "Podemos em breve ter a tecnologia necessária para alcançar outros sistemas estelares", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 134143, "titulo": "Ribbon-Cutting Event for NASA Deep Space Network’s Deep Space Station 23", "url": "https://science.nasa.gov/photojournal/ribbon-cutting-event-for-nasa-deep-space-networks-deep-space-station-23/", "fonte_id": "nasa_news", "data_pub": "2026-08-30T14:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 25 de agosto de 2026, líderes da NASA, do Jet Propulsion Laboratory e da Rede Espacial Profunda (DSN) participaram de um evento de inauguração para a antena Deep Space Station 23, localizada no complexo DSN em Goldstone, California.", "titulo_pt": "Cerimônia de lançamento para a antena Deep Space Station 23 da rede espacial profunda", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 134144, "titulo": "NASA Deep Space Network’s New Goldstone Antenna Goes Online", "url": "https://science.nasa.gov/photojournal/nasa-deep-space-networks-new-goldstone-antenna-goes-online/", "fonte_id": "nasa_news", "data_pub": "2026-08-30T14:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A antena Deep Space Station 23, uma antena multifreqüência de 34 metros, foi concluída em agosto de 2026 no complexo Goldstone do Deep Space Network, perto de Barstow, Califórnia. A antena ampliará a capacidade do DSN e melhorará as comunicações espaciais da NASA por décadas.", "titulo_pt": "Nova antena de ouro do Deep Space Network da NASA vai ao ar", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 134151, "titulo": "On this day in space! Aug. 30, 1992: Astronomers discover 1st Kuiper Belt object out beyond Pluto", "url": "https://www.space.com/space-exploration/on-this-day-in-space-august-30-2026", "fonte_id": "space_com", "data_pub": "2026-08-30T14:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 30 de agosto de 1992, astrônomos descobriram o primeiro objeto do Belo de Kuiper orbitando além de Plutão. Este achado marcou uma nova era na compreensão do sistema solar exterior.", "titulo_pt": "30 De agosto de 1992: astrônomos descobrem o primeiro objeto do belo de Kuiper além de plutão", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 134145, "titulo": "Panorama Showcasing the 34-Meter Antennas of the DSN’s Goldstone Complex", "url": "https://science.nasa.gov/photojournal/panorama-showcasing-the-34-meter-antennas-of-the-dsns-goldstone-complex/", "fonte_id": "nasa_news", "data_pub": "2026-08-30T14:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cinco antenas estão expostas ao sol no verão de 2026 no complexo Deep Space Network de Goldstone, perto de Barstow, Califórnia. A antena Deep Space Station 23, uma antena de 34 metros recentemente concluída, pode ser vista no fundo à direita, ao lado de outras três antenas de 34 metros.", "titulo_pt": "Panorama exibindo as antenas de 34 metros do complexo Goldstone do DSN", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 134124, "titulo": "Know your pest pressure: Monitoring is the foundation for managing lucerne seed wasp", "url": "https://phys.org/news/2026-08-pest-pressure-foundation-lucerne-seed.html", "fonte_id": "phys_org", "data_pub": "2026-08-30T14:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O lucerne seed wasp é uma praga grave nas culturas de alfafa, causando danos internos nos grãos que só se tornam visíveis durante a colheita, limpeza ou entrega das sementes, quando já é tarde para intervenção. Cada fêmea desta praga representa uma semente perdida, sendo as sementes infectadas removidas junto com outras impurezas durante o processo de limpeza.", "titulo_pt": "Conheça a pressão da praga: a monitoração é a base para o gerenciamento do lucerne seed wasp", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 134125, "titulo": "Aboriginal artists painted giant ancestral beings as colonization arrived, study finds", "url": "https://phys.org/news/2026-08-aboriginal-artists-giant-ancestral-colonization.html", "fonte_id": "phys_org", "data_pub": "2026-08-30T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo descobriu que artistas aborígenes pintaram gigantescos serpentes ancestrais em uma caverna da Austrália quando a colonização chegava. Uma dessas pinturas representa uma cobra de mais de 6 metros de comprimento, com cabeça de crocodilo, dentes afiados e língua longa.", "titulo_pt": "Artistas aborígenes pintaram gigantescas serpentes ancestrais quando a colonização chegava, estudo mostra", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 134061, "titulo": "Orangutan rescued from Borneo fire battles respiratory illness", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3365769/orangutan-rescued-borneo-fire-battles-respiratory-illness?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-30T13:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um agricultor chamado Jais, na província de West Kalimantan, em Borneu, encontrou um orangotango debilitado em um plantio de palma próxima a uma área de incêndio florestal. Jais deu água ao animal, que estava em estado frágil.", "titulo_pt": "Orangotango resgatado em borneu apresenta sintomas respiratórios", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 134126, "titulo": "Hollow-core fiber platform could help different quantum technologies connect", "url": "https://phys.org/news/2026-08-hollow-core-fiber-platform-quantum.html", "fonte_id": "phys_org", "data_pub": "2026-08-30T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A plataforma de fibras de núcleo vazio poderia facilitar a conectividade entre diferentes tecnologias quânticas. Um dos principais desafios é que sistemas quânticos diferentes operam frequentemente em comprimentos de onda de luz diferentes.", "titulo_pt": "Plataforma de fibras de núcleo vazio poderia auxiliar na conexão de diferentes tecnologias quânticas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 134097, "titulo": "New look", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/31/2003863396", "fonte_id": "taipei_times", "data_pub": "2026-08-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este trecho não fornece informações suficientes para um resumo. No entanto, se fosse sobre um novo visual ou aparência, poderia ser resumido da seguinte forma: Uma mudança no visual ou aparência foi implementada. Mais detalhes seriam necessários para um resumo mais preciso.", "titulo_pt": "Novo visual", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 134155, "titulo": "Dinosaur Jr. Announce 2027 Tour", "url": "https://pitchfork.com/story/dinosaur-jr-announce-2027-tour/", "fonte_id": "pitchfork", "data_pub": "2026-08-30T17:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dinosaur Jr. anunciou uma turnê para 2027 que incluirá apresentações na América do Norte, com Starcrawler como artista convidado.", "titulo_pt": "Dinosaur Jr. Anunciam turnê para 2027 com suporte de starcrawler", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 134173, "titulo": "Kacey Musgraves’s Stage Literally Caught on Fire in Boston", "url": "https://consequence.net/2026/08/kacey-musgraves-stage-fire-in-boston/", "fonte_id": "consequence_sound", "data_pub": "2026-08-30T17:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kacey Musgraves teve seu palco literalmente pegando fogo durante um show no TD Garden Arena em Boston. A cantora brincou que tinha usado muito aerossol para cabelos para o incêndio.", "titulo_pt": "Palco de kacey Musgraves pega fogo no td garden arena em Boston", "veiculo": "Consequence of Sound", "pais": "EUA", "classe": "C"}, {"id": 134174, "titulo": "Olivia Rodrigo’s Daisy Chain Fields Showed the Power of a Girls-to-the-Front Festival", "url": "https://consequence.net/2026/08/olivia-rodrigo-daisy-chain-fields-review/", "fonte_id": "consequence_sound", "data_pub": "2026-08-30T17:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O festival inaugural reuniu gerações de artistas mulheres, arrecadou US$ 20 milhões para organizações que apoiam mulheres e meninas, e ofereceu uma das experiências mais comunitárias de festivais do ano.", "titulo_pt": "Olivia Rodrigo’s Daisy Chain Fields mostrou o poder de um Festival com mulheres em primeiro lugar", "veiculo": "Consequence of Sound", "pais": "EUA", "classe": "C"}, {"id": 134181, "titulo": "‘Coyote vs. Acme,’ Viewed as Unreleasable by Warner Bros., Just Beat a Jacob Elordi and Ridley Scott Movie at the Box Office", "url": "https://www.indiewire.com/news/box-office/box-office-coyote-vs-acme-beats-jacob-elordi-ridley-scott-dog-stars-1235213602/", "fonte_id": "indiewire", "data_pub": "2026-08-30T17:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "\"Coyote vs. Acme\" ficou em segundo lugar nas bilheterias com $15,4 milhões, enquanto \"The Dog Stars\" teve um desempenho ruim com apenas $8 milhões.", "titulo_pt": "\"Coyote vs. Acme\", considerado irrelevante pela Warner Bros., bateu um filme com Jacob Elordi e Ridley Scott nas bilheterias", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 134162, "titulo": "Olivia Rodrigo Raises $20 Million With Daisy Chain Fields Festival Thanks to Matching Commitment From Melinda French Gates", "url": "https://variety.com/2026/music/news/olivia-rodrigo-raises-20-million-daisy-chain-melinda-gates-1236846915/", "fonte_id": "variety", "data_pub": "2026-08-30T17:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Olivia Rodrigo arrecadou US$ 20 milhões com sua primeira edição do festival Daisy Chain Fields, dobrando o valor inicial de US$ 10 milhões graças a um compromisso de doação de Melinda French Gates. A atriz e cantora agradeceu ao público durante seu show de abertura no festival.", "titulo_pt": "Olivia Rodrigo arrecada r$ 20 milhões com Festival Daisy Chain Fields, agradecendo a doação de Melinda Gates", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 134163, "titulo": "Katseye’s Sophia to Sit Out European Leg of ‘Wildworld’ Tour to ‘Focus on Her Well-Being’", "url": "https://variety.com/2026/music/news/katseyes-sophia-sit-european-leg-wildworld-tour-1236846911/", "fonte_id": "variety", "data_pub": "2026-08-30T17:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A membro Sophia Laforteza da banda Katseye não participará das datas da turnê 'Wildworld' na Grã-Bretanha e Europa, programada para começar na próxima segunda-feira, para se concentrar em sua bem-estar. A gravadora da banda anunciou que ela está tomando um hiato temporário do grupo.", "titulo_pt": "Sophia laforteza da katseye vai ausentar-se das datas europeias da turnê 'Wildworld' para se concentrar em sua bem-estar", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 134175, "titulo": "Chris Hansen Contemplating Legal Action Against Primetime Makers", "url": "https://consequence.net/2026/08/chris-hansen-contemplating-legal-action-against-primetime-makers/", "fonte_id": "consequence_sound", "data_pub": "2026-08-30T16:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Chris Hansen está considerando a possibilidade de tomar ações legais contra os produtores do filme produzido pela A24. O apresentador do programa 'To Catch a Predator' foi informado de que tem um caso 'decente' contra eles.", "titulo_pt": "Chris Hansen considerando ações legais contra produtores de 'to catch a predator'", "veiculo": "Consequence of Sound", "pais": "EUA", "classe": "C"}, {"id": 133796, "titulo": "De Underworld a Calvin Harris: dos generaciones de música electrónica y una misma multitud en Creamfields UK, a pesar del mal tiempo", "url": "https://www.clarin.com/espectaculos/underworld-calvin-harris-generaciones-musica-electronica-misma-multitud-creamfields-uk-pesar-mal-tiempo_0_l3PCFZFRho.html", "fonte_id": "clarin", "data_pub": "2026-08-30T16:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A terceira noite do festival Creamfields no Reino Unido foi marcada por chuva e lama, com público de várias idades que permaneceu dançando até a madrugada. A noite evidenciou a paixão pela cultura festivaleira inglesa, mesmo com as condições climáticas adversas.", "titulo_pt": "De Underworld a Calvin Harris: das gerações de música eletrônica e uma mesma multidão no Creamfields UK, apesar da chuva", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 133799, "titulo": "River vende a Freitas a Flamengo: los detalles de una negociación que sería un millonario traspaso al gigante de Brasil", "url": "https://www.clarin.com/deportes/river-vende-freitas-flamengo-detalles-negociacion-millonario-traspaso-gigante-brasil_0_EFsIzl3QXJ.html", "fonte_id": "clarin", "data_pub": "2026-08-30T16:42:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O extremo de 20 anos, Gustavo Freitas, foi bastante utilizado durante o ciclo de Eduardo Coudet no River Plate. O clube argentino e o jogador estariam negociando um transferência ao Flamengo, que seria muito lucrativa para o River.", "titulo_pt": "River vende Freitas ao Flamengo: detalhes de uma negociação que seria um trânsfere millonário", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 133628, "titulo": "A proposta da Flávio Bolsonaro sobre o fim da escala 6×1", "url": "https://veja.abril.com.br/economia/a-proposta-da-flavio-bolsonaro-sobre-o-fim-da-escala-6x1/", "fonte_id": "veja", "data_pub": "2026-08-30T16:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, candidato, expressou sua contrariedade ao modelo de escala 6×1 atualmente em discussão e defendeu a remuneração baseada no ganho por hora trabalhada.", "titulo_pt": "Proposta de Flávio Bolsonaro contra escala 6×1 e a favor de ganho por hora", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 134182, "titulo": "From Timothée Chalamet and Tom Cruise to Cynthia Erivo: It’s Time for Some Overdue Actors to Finally Win an Oscar", "url": "https://www.indiewire.com/awards/consider-this/overdue-actors-oscar-matt-damon-tom-cruise-timothee-chalamet-1235213219/", "fonte_id": "indiewire", "data_pub": "2026-08-30T16:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute atores que ainda não ganharam um Oscar, incluindo Timothée Chalamet, Tom Cruise, Cynthia Erivo, John Malkovich, Matt Damon e Glenn Close. Os nomes são classificados de acordo com a probabilidade de eles eventualmente ganharem o prêmio.", "titulo_pt": "De Timothée Chalamet e Tom Cruise a Cynthia Erivo: é tempo de alguns atores receberem finalmente o Oscar", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 134176, "titulo": "Drummer Zak Starkey Is Back in The Who After Messy Firing", "url": "https://consequence.net/2026/08/zak-starkey-back-in-the-who/", "fonte_id": "consequence_sound", "data_pub": "2026-08-30T16:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Zak Starkey, baterista, retornará ao grupo The Who durante a turnê de despedida do grupo. Ele reentrará no grupo após uma demissão problemática.", "titulo_pt": "Baterista Zak Starkey volta ao The Who durante turnê de despedida", "veiculo": "Consequence of Sound", "pais": "EUA", "classe": "C"}, {"id": 134164, "titulo": "Box Office: ‘The Dog Stars’ Bombs With $8 Million; ‘Spider-Man’ Continues Reign in Fifth Weekend", "url": "https://variety.com/2026/film/box-office/box-office-the-dog-stars-bombs-spider-man-brand-new-day-1236846879/", "fonte_id": "variety", "data_pub": "2026-08-30T16:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A adaptação do thriller post-apocalíptico 'The Dog Stars' estreou com apenas $8 milhões nos EUA, ocupando a quinta posição no fim de semana. O filme, com um orçamento superior a $80 milhões, não conseguiu se destacar durante os dias mais quentes do verão.", "titulo_pt": "Box Office: 'the Dog Stars' bomba com 8 milhões; 'Spider-Man' continua no poder no quinto fim de semana", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 133581, "titulo": "Julia Guedes, neta de Beto Guedes, faz as pazes com o peso do sobrenome em disco", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/08/julia-guedes-neta-de-beto-guedes-faz-as-pazes-com-o-peso-do-sobrenome-em-disco.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-30T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Julia Guedes, neta de Beto Guedes, lançou seu primeiro álbum, 'Vermelho', após um processo de tentar se afastar do legado familiar. O disco representa uma forma de incorporar o sobrenome em sua identidade musical.", "titulo_pt": "Julia Guedes, neta de Beto Guedes, faz as pazes com o peso do sobrenome em seu primeiro álbum", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 134055, "titulo": "HOW CULTURAL INNOVATION IS SHAPING BETTER GOVERNANCE AND SUSTAINABLE DEVELOPMENT", "url": "https://www.scmp.com/presented/news/hong-kong/education/topics/innovating-advance-humanity/article/3365124/how-cultural-innovation-shaping-better-governance-and-sustainable-development?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-30T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A discussão sobre desenvolvimento sustentável e melhoria da governança geralmente se concentra em regulamentações, conformidade e reforma econômica. No entanto, em 2025, o evento Fashion to Reconnect: A Tale of Two Style Capitals demonstrou como a inovação cultural, através da moda, pode se tornar um forte impulsionador de mudanças sistêmicas.", "titulo_pt": "Como a inovação CULTURAL está moldando uma governança melhor e desenvolvimento sustentável", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "cultura__eventos": [], "sociedade": [{"id": 133714, "titulo": "Estudante espancado na UFRJ nega acusações: ‘Não sou nazista’", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/rj/estudante-espancado-na-ufrj-nega-acusacoes-nao-sou-nazista/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T17:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudante é investigado pela Polícia Civil do Rio de Janeiro após ser espancado. O estudante nega acusações e afirma não ser nazista.", "titulo_pt": "Estudante espancado na UFRJ nega ser nazista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133715, "titulo": "Aluna e orientadora morrem e Unicamp cria procedimento inédito para defesa póstuma de tese", "url": "https://www.cnnbrasil.com.br/ciencia/aluna-e-orientadora-morrem-e-unicamp-cria-procedimento-inedito-para-defesa-postuma-de-tese/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A morte de uma aluna e sua orientadora levou à criação de um procedimento inédito pela Unicamp para a defesa póstuma da tese. A universidade desenvolveu regras para que o trabalho fosse reconhecido e publicado.", "titulo_pt": "Aluna e orientadora falecem e Unicamp cria procedimento inédito para defesa póstuma de tese", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133662, "titulo": "Malévola Alves é presa após se envolver em confusão e briga em SP", "url": "https://www.metropoles.com/colunas/fabia-oliveira/malevola-alves-e-presa-apos-se-envolver-em-confusao-e-briga-em-sp", "fonte_id": "metropoles", "data_pub": "2026-08-30T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A influenciadora Malévola Alves foi detida em São Paulo após uma briga em uma festa e posteriormente liberada após pagar fiança.", "titulo_pt": "Malévola Alves é presa após briga em festa em SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 133663, "titulo": "Costureira é morta a tiros em bar e filho é baleado ao confrontar suspeito", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/costureira-e-morta-a-tiros-em-bar-e-filho-e-baleado-ao-confrontar-suspeito", "fonte_id": "metropoles", "data_pub": "2026-08-30T17:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Adriana Silva dos Santos, de 48 anos, foi morta a tiros em um bar em Pindamonhangaba, São Paulo. Seu filho foi baleado ao tentar confrontar o suspeito.", "titulo_pt": "Costureira é morta a tiros em bar e filho é baleado ao confrontar suspeito", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 133721, "titulo": "Reta final do vestibular: por que estudar mais nem sempre ajuda", "url": "https://www.cnnbrasil.com.br/educacao/reta-final-do-vestibular-por-que-estudar-mais-nem-sempre-ajuda/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um supervisor pedagógico e uma psicóloga explicam como equilibrar a estratégia de estudos, o sono e a saúde mental dos estudantes durante a reta final do vestibular. O foco é fornecer exemplos práticos para ajudar os candidatos a se prepararem adequadamente para a prova.", "titulo_pt": "Reta final do vestibular: por que estudar mais nem sempre ajuda", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133727, "titulo": "Nepal intensifica esforços para resgatar vítimas das enchentes", "url": "https://www.cnnbrasil.com.br/internacional/nepal-intensifica-esforcos-para-resgatar-vitimas-das-enchentes/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T16:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Equipes de resgate estão tentando alcançar trabalhadores que ficaram presos em um túnel após as inundações, quatro dias após o ocorrido.", "titulo_pt": "Nepal intensifica esforços para resgatar vítimas das enchentes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133635, "titulo": "Plano de saúde já consome até 20% da folha das empresas", "url": "https://veja.abril.com.br/economia/plano-de-saude-ja-consome-ate-20-da-folha-das-empresas/", "fonte_id": "veja", "data_pub": "2026-08-30T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O custo do plano de saúde tem aumentado significativamente devido à inflação médica, transformando o benefício em um problema para os diretores financeiros das empresas. Menos de 5% das companhias estariam preparadas para gerir a saúde como um investimento.", "titulo_pt": "Plano de saúde já consome até 20% da folha das empresas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 134050, "titulo": "Pioneering Care After Crisis: It All Starts with the People", "url": "https://www.scmp.com/presented/news/hong-kong/education/topics/innovating-advance-humanity/article/3365146/pioneering-care-after-crisis-it-all-starts-people?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-30T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois de um incêndio devastador em Wang Fuk Court em Tai Po em 26 de novembro, a resposta da Universidade de Cidade de Hong Kong (CityUHK) não começou com uma memória de estratégia. A abordagem foi vista como uma responsabilidade e uma oportunidade de aplicar conhecimento, focando no cuidado das pessoas.", "titulo_pt": "Inovação no atendimento pós-crise: tudo começa pela pessoas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 134051, "titulo": "Social Transformation in the Sands", "url": "https://www.scmp.com/presented/news/hong-kong/education/topics/innovating-advance-humanity/article/3365144/social-transformation-sands?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-30T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma margem sudeste do Deserto de Tengger, onde dunas podem chegar a 30 metros de altura e avançarem significativamente a cada ano, um esforço de reflorestamento privado está tentando algo além da plantação de árvores. Fundador de Malan Lake em Alxa, Inner Mongolia, o Sr. YUEN Shu Wah está testando se a restauração do deserto pode ser bem-sucedida redesignando não apenas os paisagens, mas também os meios de subsistência e a governança.", "titulo_pt": "Transformação social nas areias", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 134054, "titulo": "FROM PATIENTS TO CITIZENS: RETHINKING SCHIZOPHRENIA CARE IN HONG KONG", "url": "https://www.scmp.com/presented/news/hong-kong/education/topics/innovating-advance-humanity/article/3365123/patients-citizens-rethinking-schizophrenia-care-hong-kong?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-30T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Hong Kong, cerca de 40.000 pessoas vivem com esquizofrenia. O sistema local está focado em estabilizar os sintomas, mas após a sua controle, surge a questão do que as pessoas retornam para suas vidas.", "titulo_pt": "De pacientes a cidadãos: refletir sobre o cuidado da esquizofreniática em HONG KONG", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 133734, "titulo": "Hospital do Nepal exibe centenas de cartazes com desaparecidos em enchentes", "url": "https://www.cnnbrasil.com.br/internacional/hospital-do-nepal-exibe-centenas-de-cartazes-com-desaparecidos-em-enchentes/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T15:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 2 mil nomes de pessoas desaparecidas foram registrados em um hospital no Nepal. Famílias de todo o mundo estão intensificando os esforços para localizar seus parentes.", "titulo_pt": "Hospital do Nepal exibe centenas de cartazes com desaparecidos em enchentes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133737, "titulo": "Temporal no Sul: cidades de SC decretam emergência; RS tem 7 feridos", "url": "https://www.cnnbrasil.com.br/nacional/sul/temporal-no-sul-cidades-de-sc-decretam-emergencia-rs-tem-7-feridos/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T15:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cidades de Santa Catarina decretaram emergência devido a temporais, enquanto no Rio Grande do Sul sete pessoas ficaram feridas. A tempestade causou danos como destelhamentos e alagamentos em diversas localidades.", "titulo_pt": "Temporal no Sul: cidades de SC decretam emergência; RS tem 7 feridos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133643, "titulo": "Enel mais que dobra investimento socioambiental no Brasil", "url": "https://veja.abril.com.br/economia/enel-mais-que-dobra-investimento-socioambiental-no-brasil/", "fonte_id": "veja", "data_pub": "2026-08-30T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Enel investiu 75,6 milhões de reais em projetos socioambientais em São Paulo, Rio de Janeiro e Ceará entre janeiro e julho. O investimento é mais de dobrado em comparação com investimentos anteriores.", "titulo_pt": "Enel duplica investimento socioambiental no Brasil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 133948, "titulo": "In Lyon and Saint-Etienne, the many benefits of Food Social Security", "url": "https://www.lemonde.fr/en/summer-reads/article/2026/08/30/in-lyon-and-saint-etienne-the-many-benefits-of-food-social-security_6756989_183.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-30T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Lyon e Saint-Etienne, canteens comunitários e lojas de solidariedade estão experimentando um programa de segurança alimentar inspirado na Sécurité sociale francesa. Muitos políticos querem que essa iniciativa seja central na campanha presidencial de 2027.", "titulo_pt": "Em Lyon e Saint-Etienne, os muitos benefícios do seguro Social alimentar", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 133750, "titulo": "O diretor de escola que salvou 900 estudantes das inundações no Nepal", "url": "https://www.bbc.com/portuguese/articles/c3d7x3p82kmo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-30T13:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um diretor de escola no Nepal salvou 900 estudantes durante inundações. Ele relata que, se tivesse agido 10 minutos mais tarde, todos estariam em perigo.", "titulo_pt": "Diretor de escola no Nepal salva 900 estudantes das inundações", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 133650, "titulo": "Organização popular e autogestão: como as comunas transformam a Venezuela e inspiram o mundo", "url": "https://www.brasildefato.com.br/2026/08/30/organizacao-popular-e-autogestao-como-as-comunas-transformam-a-venezuela-e-inspiram-o-mundo/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-30T12:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Experiências de autogestão territorial em Venezuela resistem apesar das dificuldades e constituem a base do projeto socialista bolivariano. Comunidades locais assumem a gestão de suas próprias vidas e transformações sociais.", "titulo_pt": "Organização popular e autogestão: como as comunas transformam a Venezuela e inspiram o mundo", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 133716, "titulo": "Nepal enterra quase 200 corpos em floresta por lotação de necrotérios", "url": "https://www.cnnbrasil.com.br/internacional/nepal-enterra-quase-200-corpos-em-floresta-por-lotacao-de-necroterios/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Equipes de resgate recuperaram 272 corpos não identificados provenientes do Tibete, na China, após as enchentes devastadoras na região do Himalaia. O Nepal enterrou quase 200 corpos em uma floresta devido à lotação dos necrotérios.", "titulo_pt": "Nepal enterra quase 200 corpos em floresta por lotação de necrotérios", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133718, "titulo": "“Me sinto perdida”, diz mulher no Nepal ao perder 17 familiares em enchente", "url": "https://www.cnnbrasil.com.br/internacional/me-sinto-perdida-diz-mulher-no-nepal-ao-perder-17-familiares-em-enchente/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher no Nepal relatou sentir-se perdida após perder 17 familiares em enchentes. O número de mortos em inundações no Nepal e na China ultrapassou 800 pessoas, de acordo com a atualização policial.", "titulo_pt": "‘Me sinto perdida’, diz mulher após perder 17 familiares em enchente no Nepal", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133993, "titulo": "Death toll nears 800 after Himalayan glacier collapse", "url": "https://www.aljazeera.com/news/2026/8/30/death-toll-nears-800-after-himalayan-glacier-collapse?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-30T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de mortos chega perto de 800 após o colapso de um gelo na Himaláia. Equipes especializadas de busca e resgate se juntaram às operações de recuperação em Nepal e China.", "titulo_pt": "Óbitos próximos de 800 após colapso de gelo na himaláia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 134101, "titulo": "Heavy rains batter southern region, flooding roads, trapping hikers", "url": "https://en.yna.co.kr/view/AEN20260830004300315", "fonte_id": "yonhap_news", "data_pub": "2026-08-30T13:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fortes chuvas atingiram a região sul, inundando estradas e isolando caminhantes.", "titulo_pt": "Fortes chuvas castigam região sul, inunda estradas e isolam caminhantes", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 133751, "titulo": "O país que enfrenta a escassez de água com sistemas hídricos abandonados há centenas de anos", "url": "https://www.bbc.com/portuguese/articles/c78064pyzdzo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-30T10:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A escassez de água e as mudanças climáticas estão motivando comunidades indianas a restaurar sistemas hídricos antigos, que foram construídos há centenas de anos, para colocá-los novamente em funcionamento.", "titulo_pt": "País enfrenta escassez de água com sistemas hídricos abandonados há séculos", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 133436, "titulo": "Nepal rescue effort intensifies as death toll passes 700", "url": "https://www.ft.com/content/32978145-d33e-4ee3-957b-39fcc722d2be?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-30T09:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades alertam para o aumento da água que pode complicar os esforços de resgate, enquanto mais de 3.000 pessoas permanecem desaparecidas. O número de mortos ultrapassou 700 no Nepal.", "titulo_pt": "Esforço de resgate intensifica no nepal com mortes passando de 700", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 133367, "titulo": "Nepal warns of more possible floods as communities grapple with devastation and death toll rises", "url": "http://www.euronews.com/2026/08/30/nepal-warns-of-more-possible-floods-as-communities-grapple-with-devastation", "fonte_id": "euronews", "data_pub": "2026-08-30T07:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alertas de inundações foram enviados por telefone aos residentes durante a manhã de domingo, enquanto trabalhadores de resgate tentavam evacuar uma rota principal que conecta Katmandu a uma área severamente afetada pelas inundações de quarta-feira.", "titulo_pt": "Nepal avisa sobre possíveis inundações adicionais enquanto comunidades lidam com destruição e aumento do número de mortos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 133084, "titulo": "Grileiros avançam sobre berço de nascentes em área de preservação do DF", "url": "https://www.metropoles.com/distrito-federal/grileiros-avancam-sobre-berco-de-nascentes-em-area-de-preservacao-do-df", "fonte_id": "metropoles", "data_pub": "2026-08-30T05:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A região próxima ao Privê Lago Norte II e vizinha da Serrinha do Paranoá tem importante papel hídrico e é alvo de invasões há anos.", "titulo_pt": "Grileiros avançam sobre berço de nascentes em área de preservação do DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 134022, "titulo": "Red Cross transfers freed Palestinian detainees to Gaza's Nasser Hospital", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/red-cross-transfers-freed-palestinian-detainees-gazas-nasser-hospital", "fonte_id": "middle_east_eye", "data_pub": "2026-08-30T16:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão Internacional da Cruz Vermelha (ICRC) transferiu 13 detidos palestinos libertados da fronteira de Kerem Shalom para o Hospital Nasser em Gaza, ajudando também na reunião deles com suas famílias. O ICRC afirmou que tem sido negado acesso a detidos em instalações de detenção israelenses desde outubro de 2023 e pediu às autoridades israelenses que divulguem as localizações e permitam visitas.", "titulo_pt": "Icrc transfere detidos palestinos libertados para Hospital de Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 133999, "titulo": "Rohingya crisis: Aid falls and hope fades", "url": "https://www.aljazeera.com/video/talk-to-al-jazeera/2026/8/30/rohingya-crisis-aid-falls-and-hope-fades?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-30T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O representante da UNHCR em Bangladesh, Ivo Freisen, alerta que a diminuição da assistência está diminuindo as esperanças dos refugiados rohingya.", "titulo_pt": "Crise rohingya: ajuda diminui e esperança se esvai", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 134064, "titulo": "Backlash grows after Hong Kong authorities seize second ‘fighting dog’ in week", "url": "https://www.scmp.com/news/hong-kong/society/article/3365764/backlash-grows-after-hong-kong-authorities-seize-second-fighting-dog-week?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-30T12:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades de Hong Kong enfrentam crescente rejeição após apreender um 'cão de luta' devido a uma denúncia de vizinho e detê-lo para avaliação comportamental. Esta é a segunda apreensão de cão com linhagem de pit bull na semana, ocorrendo no contexto de maior preocupação pública sobre a gestão canina, devido a uma série de ataques recentes, incluindo um em que uma mulher foi mordida e posteriormente encontrada morta.", "titulo_pt": "Rejeição cresce após autoridades de Hong Kong apreenderem segundo 'cão de luta' em uma semana", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 133484, "titulo": "Pakistan suspends 8 officials after maternity ward fire kills 14 infants", "url": "https://www.scmp.com/news/asia/south-asia/article/3365749/pakistan-suspends-8-officials-after-maternity-ward-fire-kills-14-infants?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-30T09:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo do Paquistão suspendeu oito funcionários após um incêndio em uma unidade materna de um hospital na capital do país resultar na morte de 14 bebês. Um relatório preliminar indicou que o fogo consumiu a unidade em aproximadamente dois minutos após as 6h30 de quarta-feira, com apenas um dos 15 bebês sob cuidado salvo por uma enfermeira.", "titulo_pt": "Paquistão suspende 8 funcionários após incêndio em unidade materna matar 14 bebês", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 133807, "titulo": "Granjas de bots y la extrema derecha", "url": "https://www.ciperchile.cl/2026/08/30/granjas-de-bots-y-la-extrema-derecha/?utm_source=rss&utm_medium=rss&utm_campaign=granjas-de-bots-y-la-extrema-derecha", "fonte_id": "ciper_chile", "data_pub": "2026-08-30T08:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto aborda o tema das granjas de bots e a extrema direita. Não há detalhes adicionais sobre o conteúdo do artigo.", "titulo_pt": "Granjas de bots e a extrema direita", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 133454, "titulo": "Killing of Palestinian children and teens by Israel surges in West Bank", "url": "https://www.japantimes.co.jp/news/2026/08/30/world/west-bank-palestinian-children-teens-israel/", "fonte_id": "japan_times", "data_pub": "2026-08-30T07:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dezesseis meses após outubro de 2023, 235 crianças e adolescentes palestinos foram mortos pelas forças israelenses na Cisjordânia.", "titulo_pt": "Evolução no número de crianças e adolescentes palestinos mortos por forças israelenses na cisjordânia", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 134035, "titulo": "Some migrants ready to pack bags fearing far-right win in east German state", "url": "https://www.japantimes.co.jp/news/2026/08/30/world/politics/east-germany-migrants-far-right-afd/", "fonte_id": "japan_times", "data_pub": "2026-08-30T07:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A partido anti-imigrante, islâmofóbico e pró-Rússia, AfD está prestes a vencer na estado de Saxe-Anhalt, com a possibilidade de conquistar sua primeira maioria governamental.", "titulo_pt": "Alguns imigrantes prontos para embalar suas malas diante de vitória da extrema-direita no estado alemão de saxe-anhalt", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 133105, "titulo": "Em setembro, STF julgará licença para mães adotivas e recusa de transfusão", "url": "https://www.cnnbrasil.com.br/politica/stf-julga-licenca-para-maes-adotivas-e-recusa-de-transfusao-em-setembro/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T07:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em setembro, o Supremo Tribunal Federal (STF) julgará questões relacionadas a licença para mães adotivas, recusa de transfusão sanguínea, planos de saúde de idosos, gratuidade na Justiça do Trabalho e recusa de tratamento médico.", "titulo_pt": "Em setembro, STF julgará licença para mães adotivas e recusa de transfusão", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133277, "titulo": "A lone Black woman’s defiance of Swedish neo-Nazis, 10 years on", "url": "https://www.theguardian.com/world/2026/aug/30/sweden-neo-nazi-resistance-2016-tess-asplund-far-right", "fonte_id": "guardian_world", "data_pub": "2026-08-30T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2016, Tess Asplund, uma mulher negra sozinha, levantou o punho em protesto contra uma parada de neonazistas em Estocolmo. Dez anos depois, ela vê a foto como um sinal dos mudanças na sociedade sueca, especialmente com a ascensão do extremismo de direita nas eleições.", "titulo_pt": "A defesa sozinha de uma mulher negra contra neonazistas, 10 anos depois", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 133269, "titulo": "Humanitarian crisis worsening in refuge for civilians fleeing Sudan’s civil war", "url": "https://www.theguardian.com/world/2026/aug/30/humanitarian-crisis-worsening-refuge-civilians-sudan-el-obeid", "fonte_id": "guardian_world", "data_pub": "2026-08-30T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As condições humanitárias na cidade de El Obeid e nas duas acampamentos próximos estão se agravando, com mais pessoas chegando todos os dias devido ao conflito entre as Forças Armadas Sudanêsas e a Milícia Rapid Support Forces (RSF). Segundo a ONU, mais de 15.000 famílias chegaram desde julho, somando-se a mais de 200.000 que chegaram no primeiro semestre do ano, de acordo com os dados do governo.", "titulo_pt": "Situação humanitária se agrava em refúgio para civis que fogem da guerra no sudão", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 133417, "titulo": "Amnesty urges action after Katz threatens expulsions over Gaza kites", "url": "https://www.middleeasteye.net/live-blog const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
