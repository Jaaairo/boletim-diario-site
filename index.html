: "B"}, {"id": 261772, "titulo": "Mais de 100 mil imóveis ficam sem luz após temporal em São Paulo nesta sexta", "url": "https://veja.abril.com.br/agenda-verde/mais-de-100-mil-imoveis-ficam-sem-luz-apos-temporal-em-sao-paulo-nesta-sexta/", "fonte_id": "veja", "data_pub": "2026-11-13T17:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um temporal causou interrupções de energia em mais de 100 mil imóveis em São Paulo. Além disso, houve alagamentos em várias regiões da capital.", "titulo_pt": "Mais de 100 mil imóveis ficam sem luz após temporal em São Paulo nesta sexta e alagamentos em diferentes regiões", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 262224, "titulo": "Doença de Chagas causou morte de mulher durante voo que saiu de Brasília", "url": "https://www.metropoles.com/distrito-federal/doenca-de-chagas-causou-morte-de-mulher-durante-voo-que-saiu-de-brasilia", "fonte_id": "metropoles", "data_pub": "2026-11-13T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher de 76 anos morreu devido a uma parada cardíaca causada pela Doença de Chagas durante um voo que saiu de Brasília para Porto Velho no último domingo.", "titulo_pt": "Doença de Chagas causou morte de passageira durante voo de Brasília", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 262226, "titulo": "PM da reserva e esposa são executados a tiros pelo genro em bar de MS", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/pm-da-reserva-e-esposa-sao-executados-a-tiros-pelo-genro-em-bar-de-ms", "fonte_id": "metropoles", "data_pub": "2026-11-13T17:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um policial militar da reserva e sua esposa foram executados a tiros pelo genro em um bar em Maracaju, Mato Grosso do Sul. O genro, Vantuir Chaves, de 40 anos, fugiu após o crime.", "titulo_pt": "PM da reserva e esposa são executados a tiros pelo genro em bar de MS", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 262709, "titulo": "L’Oréal propõe meta para ampliar presença de criadores negros em campanhas", "url": "https://exame.com/negocios/ampliar-presenca-de-criadores-negros-em-campanhas/", "fonte_id": "exame", "data_pub": "2026-11-13T17:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa da L'Oréal com 16.200 criadores revelou desigualdades em propostas e cachês. A empresa propôs que, até 2030, os profissionais negros devem representar pelo menos metade dos contratados para campanhas.", "titulo_pt": "L'oréal propõe meta para aumentar representatividade de criadores negros em campanhas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 262229, "titulo": "Menino de 11 anos fica preso na roda de caminhão após queda de bicicleta", "url": "https://www.metropoles.com/distrito-federal/na-mira/menino-de-11-anos-fica-preso-na-roda-de-caminhao-apos-queda-de-bicicleta", "fonte_id": "metropoles", "data_pub": "2026-11-13T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um garoto de 11 anos ficou preso na roda de um caminhão após cair de uma bicicleta e sofreu escoriações leves, além de um traumatismo craniano leve, sendo transferido para um hospital. Ele já recebeu alta médica.", "titulo_pt": "Menino de 11 anos fica preso na roda de caminhão após queda de bicicleta", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 262230, "titulo": "Homem que estuprou criança é condenado no STJ após TJGO afastar culpa", "url": "https://www.metropoles.com/distrito-federal/entorno/homem-que-estuprou-crianca-5-anos-condenado-no-stj-apos-tjgo-afastar-culpa", "fonte_id": "metropoles", "data_pub": "2026-11-13T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior de Justiça (STJ) rejeitou a absolvição de um homem que havia sido condenado pelo Tribunal de Justiça de Goiás (TJGO) por estuprar uma criança. A sentença original, que impunha mais de 8 anos de prisão, foi confirmada.", "titulo_pt": "Homem condenado a mais de 8 anos de prisão por estupro de criança é reafirmado pelo STJ", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 261953, "titulo": "Por qué hay cada vez más infartos en gente joven, según un cardiólogo", "url": "https://www.lanacion.com.ar/sociedad/por-que-hay-cada-vez-mas-infartos-en-gente-joven-segun-un-cardiologo-nid12112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-13T17:18:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O cardiólogo Jorge Tartaglione alertou que a cardiopatia não é mais uma condição exclusiva de idosos. Ele destacou os sintomas frequentemente ignorados que podem indicar o problema.", "titulo_pt": "Por que há cada vez mais infartos em jovens, segundo um cardiólogo", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 262345, "titulo": "Climate index unfairly ranks Taiwan: minister", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/14/2003867722", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro taiwanês fez uma declaração afirmando que um índice climático está injustamente classificando Taiwan. Não foram fornecidos detalhes adicionais sobre o índice ou as razões específicas da classificação.", "titulo_pt": "Índice climático classifica injustamente Taiwan, afirma ministro", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 263065, "titulo": "Tanker collides with New Orleans river cruise carrying 129 passengers, rescue operation underway", "url": "https://www.euronews.com/2026/11/13/tanker-collides-with-new-orleans-river-cruise-carrying-129-passengers-rescue-operation-und", "fonte_id": "euronews", "data_pub": "2026-11-13T21:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um navio-tanque colidiu parcialmente com um cruzeiro fluvial em Nova Orleans, transportando aproximadamente 129 passageiros. Várias pessoas foram resgatadas enquanto as operações de busca e resgate continuavam.", "titulo_pt": "Tanque colide com cruzeiro fluvial em nova Orleans com 129 passageiros a bordo; operações de resgate em andamento", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 262833, "titulo": "Fundo global para preservação de florestas lançado por Lula pode fracassar por falta de dinheiro?", "url": "https://www.dw.com/pt-br/fundo-global-para-preservação-de-florestas-lançado-por-lula-pode-fracassar-por-falta-de-dinheiro/a-79939532?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-13T19:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Fundo Florestas Tropicais para Sempre, lançado no Brasil no ano passado por Lula, visa tornar a conservação florestal mais rentável do que o desmatamento. No entanto, a falta de recursos pode impedir que a iniciativa seja implementada.", "titulo_pt": "Lançamento do fundo florestas tropicais para sempre pode falhar por falta de recursos?", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 263082, "titulo": "How will the US deal with Nvidia scandal?", "url": "https://www.aljazeera.com/video/inside-story/2026/11/13/how-will-the-us-deal-with-nvidia-scandal?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-13T18:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO de uma gigante da tecnologia renunciou e vai depor perante o Congresso.", "titulo_pt": "Como o EUA vão lidar com a escândalo da Nvidia?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 261985, "titulo": "RADAR LT: Tecnología de monitoreo busca proteger aves amenazadas en el Humedal Río Maipo", "url": "https://www.latercera.com/videos/noticia/radar-lt-tecnologia-de-monitoreo-busca-proteger-aves-amenazadas-en-el-humedal-rio-maipo/", "fonte_id": "la_tercera", "data_pub": "2026-11-13T17:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Através de dispositivos de monitoramento bioacústico e transmissores satelitais, a iniciativa visa estudar espécies ameaçadas de aves, monitorar seus deslocamentos e fornecer informações cruciais para fortalecer a sua conservação.", "titulo_pt": "RADAR LT: tecnologia de monitoramento busca proteger aves ameaçadas no Humedal Río Maipo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 261817, "titulo": "Na COP31, Brasil quer apresentar ao mundo roteiro para cidades mais resilientes", "url": "https://exame.com/esg/na-cop31-brasil-quer-apresentar-ao-mundo-roteiro-para-cidades-mais-resilientes/", "fonte_id": "exame", "data_pub": "2026-11-13T14:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro das Cidades pretende apresentar uma proposta para cidades mais resilientes na COP31, inspirada nos roteiros para o fim do desmatamento e a transição para energias renováveis.", "titulo_pt": "No COP31, Brasil quer apresentar roteiro para cidades mais resilientes", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 262271, "titulo": "North Macedonia: Kriva Palanka seeks help over 1,000 free-roaming cows", "url": "https://www.euronews.com/video/2026/11/13/north-macedonia-kriva-palanka-seeks-help-over-1000-free-roaming-cows", "fonte_id": "euronews", "data_pub": "2026-11-13T14:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de mil vacas estão soltas em Kriva Palanka, na Macedônia do Norte, causando danos e preocupando os residentes. O prefeito pede que o governo declare um estado de crise por 30 dias.", "titulo_pt": "Macedônia do norte: kriva Palanka busca ajuda para 1.000 vacas soltas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 262304, "titulo": "Delhi overtakes Lahore as world’s most polluted city", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/13/delhi-overtakes-lahore-as-worlds-most-polluted-city?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-13T13:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A capital indiana Nova Deli superou Lahore, na Paquistão, como a cidade mais poluída do mundo.", "titulo_pt": "Nova deli ultrapassa Lahore como a cidade mais poluída do mundo", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 261835, "titulo": "COP31: rascunho da decisão final inclui Mapas do Caminho e financiamento climático", "url": "https://exame.com/esg/cop31-rascunho-da-decisao-final-inclui-mapas-do-caminho-e-financiamento-climatico/", "fonte_id": "exame", "data_pub": "2026-11-13T12:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A presidência da conferência apresentou um rascunho da decisão final, incluindo os Mapas do Caminho e financiamento climático. As disputas sobre tecnologia, transparência e comércio internacional permanecem sem solução.", "titulo_pt": "COP31: rascunho da decisão final inclui Mapas do Caminho e financiamento climático", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 260943, "titulo": "Clima: combinação entre calor e alta umidade provoca muita chuva nesta 6ª", "url": "https://www.metropoles.com/brasil/clima-combinacao-entre-calor-e-alta-umidade-provoca-muita-chuva-nesta-6a", "fonte_id": "metropoles", "data_pub": "2026-11-13T09:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A combinação de calor e alta umidade está causando muita chuva no Centro-Sul do Brasil e em áreas do Norte e Nordeste. Pancadas de chuva e tempestades são esperadas.", "titulo_pt": "Clima: calor e alta umidade provocam chuva intensa no centro-sul e norte/nordeste", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 261068, "titulo": "Amazônia queimando afeta a saúde e o bolso do Brasil inteiro, diz bióloga dedicada a combater o fogo na floresta", "url": "https://www.bbc.com/portuguese/articles/cr20v7g9jyy3o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-13T09:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A bióloga Erika Berenguer, da Universidade de Oxford e Lancaster, expressa tristeza com os incêndios na Amazônia, mas defende a continuidade dos esforços de preservação, afirmando que o futuro será ainda mais difícil.", "titulo_pt": "Amazônia em chamas afeta todo o Brasil, diz bióloga", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 260900, "titulo": "Efeitos já devastadores do El Niño pelo país expõem fragilidade do poder público diante da crise", "url": "https://veja.abril.com.br/brasil/efeitos-ja-devastadores-do-el-nino-pelo-pais-expoem-fragilidade-do-poder-publico-diante-da-crise/", "fonte_id": "veja", "data_pub": "2026-11-13T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O El Niño já está causando efeitos devastadores em todo o país, revelando a fragilidade do poder público diante da crise. O desprezo pela prevenção resultou em uma situação de grande despreparo dos municípios.", "titulo_pt": "Efeitos devastadores do El Niño expõem fragilidade do poder público", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 261157, "titulo": "Storm Charles causes floods and flight cancellations across southern Europe", "url": "https://www.theguardian.com/environment/2026/nov/13/storm-charles-floods-flight-cancellations-southern-europe-weather", "fonte_id": "guardian_world", "data_pub": "2026-11-13T08:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A tempestade Charles causou alagamentos e cancelamentos de voos na Europa do Sul nos últimos dias. Em Portugal e no sul de Espanha, o sistema trouxe fortes chuvas e ventos, com uma rajada de vento de 84,5 mph registrada em Funchal e 183 voos cancelados em Lisboa em uma só noite. Também houve interrupções na Colúmbia canadense devido a fortes chuvas e ventos.", "titulo_pt": "Tempestade Charles causa inundações e cancelamentos de voos na Europa do sul", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 260851, "titulo": "Crédito climático com juros de 1% bancado pelo governo financia apartamentos de luxo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/11/credito-climatico-com-juros-de-1-bancado-pelo-governo-financia-apartamentos-de-luxo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um programa de financiamento climático do governo federal, com juros baixos de 1% ao ano, tem sido usado para financiar a construção de prédios de luxo, incluindo apartamentos que custam mais de R$ 6 milhões.", "titulo_pt": "Crédito climático com juros baixos bancado pelo governo financia apartamentos de luxo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 262363, "titulo": "EDITORIAL: Nuclear power on the ballot again", "url": "https://www.taipeitimes.com/News/editorials/archives/2026/11/14/2003867701", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A questão nuclear está novamente em discussão no referendo. O editorial destaca que o tema voltou à pauta política.", "titulo_pt": "EDITORIAL: energia nuclear novamente em votação", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 262557, "titulo": "Fast facts: Ebola outbreak toll on children six months into the response – UNICEF", "url": "https://www.unicef.org/press-releases/fast-facts-ebola-outbreak-toll-children-six-months-response-unicef", "fonte_id": "unicef", "data_pub": "2026-11-13T19:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório destaca os impactos dos surtos de Ebola nos children seis meses após a resposta inicial. Os dados mostram o efeito desse surto em crianças.", "titulo_pt": "Fatos rápidos: impacto do surto de ebola nos children seis meses após a resposta - UNICEF", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 263064, "titulo": "Gadi Eisenkot accuses Netanyahu's 'racist' campaign against Israeli arabs", "url": "https://www.lemonde.fr/en/international/article/2026/11/13/gadi-eisenkot-accuses-netanyahu-s-racist-campaign-against-israeli-arabs_6780259_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-13T18:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois partidos árabes-maiores, Raam e a Lista Conjunta, conquistaram 19 cadeiras na última eleição, possivelmente se tornando os mediadores-chave nas tentativas de Gadi Eisenkot de formar um governo.", "titulo_pt": "Gadi Eisenkot acusa campanha racista de Netanyahu contra árabes israelenses", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 262290, "titulo": "Jerusalem Daily: Baby dies from cold in Gaza", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/13/jerusalem-daily-baby-dies-from-cold-in-gaza?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-13T16:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um bebê morreu de frio em Gaza, enquanto 53 países pediam a Israel que permitisse a entrada de ajuda humanitária.", "titulo_pt": "Jerusalém diária: bebê morre de frio em Gaza", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 262136, "titulo": "Nuevo informe: Sernageomin insiste en que proyecto del hermano del ministro Quiroz no permite descartar “remociones en masa”", "url": "https://www.ciperchile.cl/2026/11/13/nuevo-informe-sernageomin-insiste-en-que-proyecto-del-hermano-del-ministro-quiroz-no-permite-descartar-remociones-en-masa/?utm_source=rss&utm_medium=rss&utm_campaign=nuevo-informe-sernageomin-insiste-en-que-proyecto-del-hermano-del-ministro-quiroz-no-permite-descartar-remociones-en-masa", "fonte_id": "ciper_chile", "data_pub": "2026-11-13T16:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Sernageomin reiterou que o projeto do irmão do ministro Quiroz não permite descartar a possibilidade de 'remoções em massa' no relatório. O órgão insiste que as evidências não são suficientes para excluir essa hipótese.", "titulo_pt": "Novo relatório: sernageomin reitera que projeto do irmão do ministro Quiroz não descarta 'remoções em massa'", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 262177, "titulo": "'How can medical staff and patients be exposed to this?': Gaza's Nasser Hospital hit again by Israel amid Hamas accusations", "url": "https://www.lemonde.fr/en/international/article/2026/11/13/how-can-medical-staff-and-patients-be-exposed-to-this-gaza-s-nasser-hospital-hit-again-by-israel-amid-hamas-accusations_6779898_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-13T14:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O hospital Nasser em Gaza foi atingido novamente por Israel, algo que ocorre com frequência desde há três anos. A Israel acusa o movimento islâmico Hamas de usar o hospital como um ponto de base.", "titulo_pt": "Como médicos e pacientes podem ser expostos a isso? Hospital de gaza atingido novamente por Israel durante acusações de Hamas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 261917, "titulo": "Chuvas e chegada do inverno agravam crise humanitária dos palestinos na Faixa de Gaza", "url": "https://www.dw.com/pt-br/chuvas-e-chegada-do-inverno-agravam-crise-humanitária-dos-palestinos-na-faixa-de-gaza/a-79938350?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-13T13:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Milhares de palestinos, incluindo crianças, grávidas e bebês, enfrentam condições precárias em Gaza devido às chuvas e ao inverno, com barracas inundadas e falta de roupas adequadas. O impasse entre Israel e Hamas impede a reconstrução de Gaza e a chegada de ajuda humanitária.", "titulo_pt": "Chuvas e inverno agravam crise humanitária dos palestinos na Faixa de Gaza", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 263001, "titulo": "Reporting on and Responding to Violence Against Women in Tajikistan", "url": "https://thediplomat.com/2026/11/reporting-on-and-responding-to-violence-against-women-in-tajikistan/", "fonte_id": "the_diplomat", "data_pub": "2026-11-13T13:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A entrevista com Nushofarin Noziri explora como a mídia influencia as percepções públicas e, consequentemente, as respostas da força policial ao violência contra mulheres no Tajiquistão.", "titulo_pt": "Entrevista sobre a mídia e a violência contra mulheres no tajiquistão", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 261547, "titulo": "'Empowering women is a business imperative'", "url": "https://www.koreaherald.com/article/10936673", "fonte_id": "korea_herald", "data_pub": "2026-11-13T08:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A executiva LG Group Yun Yuh-soon, de 71 anos, publicou um livro intitulado 'O Tempo de Acordar a Metade'. O livro destaca que organizações que não reconhecem e desenvolvem o potencial das mulheres desperdiçam metade de seu talento.", "titulo_pt": "O tempo de acordar a metade", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 261377, "titulo": "UNRWA funding cuts deepen hardship for Palestinian refugees in Lebanon", "url": "https://www.aljazeera.com/features/2026/11/13/unrwa-funding-cuts-deepen-hardship-for-palestinian-refugees-in-lebanon?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-13T04:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As cortesias de financiamento e a guerra de Israel deixaram os palestinos em Líbano em situações cada vez mais difíceis.", "titulo_pt": "Cortes de financiamento e const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
