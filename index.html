ata_de": null, "texto_pt": "Tássio Maia dos Santos, ex-atacante do Botafogo que havia se aposentado em 2019, morreu durante um forte temporal em Rio de Janeiro. O muro onde ele estava se desmoronou. As fortes rajadas de vento superando os 100 km/h causaram danos e interromperam o funcionamento do aeroporto Santos Dumont.", "titulo_pt": "Faleceu um ex-jogador do Botafogo: tinha 41 anos e foi uma das vítimas do temporal em rio de Janeiro", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 82956, "titulo": "La participación de mujeres se achica mientras se acercan a las jefaturas y sigue siendo baja en directorios, especialmente en bancos", "url": "https://www.latercera.com/pulso/noticia/la-participacion-de-mujeres-se-achica-mientras-se-acercan-a-las-jefaturas-y-sigue-siendo-baja-en-directorios-especialmente-en-bancos/", "fonte_id": "la_tercera", "data_pub": "2026-07-30T21:04:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A participação feminina nos diretórios de bancos e filiais bancárias no Chile representava 17,2% no fechamento de 2025 e 14,4% nas sociedades de apoio ao giro. O relatório de gênero da CMF destaca uma diferença salarial entre homens e mulheres e a baixa presença delas em cargos gerenciais.", "titulo_pt": "Participação feminina diminui nos diretórios bancários enquanto persiste brecha salarial", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 82962, "titulo": "Impacto en España por ingreso masivo de migrantes a Ceuta: cruzaron a nado desde Marruecos", "url": "https://www.latercera.com/videos/noticia/el-impactante-registro-de-una-llegada-masiva-de-inmigrantes-a-espana-nadaron-desde-marruecos/", "fonte_id": "la_tercera", "data_pub": "2026-07-30T20:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo de Pedro Sánchez anunciou o deslocamento do Exército para a cidade autônoma de Ceuta, localizada na costa africana, em resposta ao ingresso massivo de migrantes que cruzaram a nado desde Marrocos.", "titulo_pt": "Impacto em Espanha por influxo maciço de migrantes a Ceuta: cruzaram a nado desde marrocos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 81822, "titulo": "Mulher é atraída para apartamento, espancada e estuprada no RJ", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/mulher-e-atraida-para-apartamento-espancada-e-estuprada-no-rj", "fonte_id": "metropoles", "data_pub": "2026-07-30T17:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher foi levada para um apartamento, espancada até desmaiar e estuprada enquanto inconsciente. O suspeito foi detido na quarta-feira (29/7).", "titulo_pt": "Mulher é espancada e estuprada após ser levada a apartamento no RJ", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 82054, "titulo": "Ministra de Salud reconoce deuda con la primera infancia: “Hemos fallado”", "url": "https://www.latercera.com/nacional/noticia/ministra-de-salud-reconoce-deuda-con-la-primera-infancia-hemos-fallado/", "fonte_id": "la_tercera", "data_pub": "2026-07-30T17:47:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A ministra de Saúde Chomali participou da apresentação de um relatório do Observatório Infância da Fundación Colunga, que oferece uma visão sobre a situação dos bebês e crianças com até 5 anos no país. Durante o evento, ela reconheceu que há uma dívida com a infância.", "titulo_pt": "Ministra de saúde reconhece dívida com a primeira infância: 'hemos fallado'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 83195, "titulo": "Massa de ar polar traz risco de geada em 5 estados. Saiba onde", "url": "https://www.metropoles.com/brasil/massa-de-ar-polar-traz-risco-de-geada-em-5-estados-saiba-onde", "fonte_id": "metropoles", "data_pub": "2026-07-30T22:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma frente fria está causando temperaturas baixas entre quinta-feira (30/7) e sexta-feira (31/7), com possibilidade de geada em cinco estados do Sul do Brasil.", "titulo_pt": "Massa de ar polar traz risco de geada em cinco estados do sul", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 82687, "titulo": "Alemanha registra quase 10 mil mortes relacionadas ao calor, diz instituto", "url": "https://www.cnnbrasil.com.br/internacional/alemanha-registra-quase-10-mil-mortes-relacionadas-ao-calor-diz-instituto/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Alemanha registrou quase 10 mil mortes relacionadas ao calor, de acordo com o órgão de saúde alemão. A maior parte dessas mortes aconteceu em pessoas com 75 anos ou mais.", "titulo_pt": "Alemanha registra quase 10 mil mortes relacionadas ao calor, informa instituto", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 83175, "titulo": "Incêndios na França forçam George Clooney e família a deixar propriedade", "url": "https://exame.com/pop/incendios-na-franca-forcam-george-clooney-e-familia-a-deixar-propriedade/", "fonte_id": "exame", "data_pub": "2026-07-30T19:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "George Clooney e sua família tiveram que deixar a propriedade em Brignoles, França, enquanto bombeiros lutavam contra incêndios no sul do país.", "titulo_pt": "Incêndios na França obrigam George Clooney e família a abandonarem propriedade", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 83009, "titulo": "Europe’s heating climate sparks ‘major intensification’ of fires: Report", "url": "https://www.aljazeera.com/news/2026/7/30/europes-heating-climate-sparks-major-intensification-of-fires-report?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-30T17:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aumento do clima nas regiões sul da Europa dobrou a probabilidade de incêndios florestais desde 1981, segundo pesquisadores.", "titulo_pt": "Aumento do clima na Europa do sul intensifica 'gravemente' os incêndios: relatório", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 81751, "titulo": "Filhotes de arara exclusiva do Nordeste brasileiro nascem na Bélgica; veja", "url": "https://www.cnnbrasil.com.br/ciencia/filhotes-de-arara-exclusiva-do-nordeste-brasileiro-nascem-na-belgica-veja/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Duas araras-de-lear, uma espécie ameaçada de extinção localizada na Caatinga da Bahia, foram nascidas em um zoológico belga. Este é agora o único centro público no mundo a ter conseguido reproduzir as três espécies de araras-azuis.", "titulo_pt": "Filhotes de arara-de-lear, exclusiva do Nordeste brasileiro, nascem na Bélgica; veja", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 81921, "titulo": "Promessa de gás a US$ 5 põe ANP e PPSA sob pressão máxima", "url": "https://veja.abril.com.br/coluna/radar-economico/promessa-de-gas-a-us-5-poe-anp-e-ppsa-sob-pressao-maxima/", "fonte_id": "veja", "data_pub": "2026-07-30T16:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O preço de gás anunciado pelo governo é mais baixo do que o valor cobrado pela Petrobras para escoar e processar o produto, colocando a ANP e PPSA sob pressão. A promessa de gás a US$ 5 põe as agências reguladoras em situação delicada.", "titulo_pt": "Promessa de gás a US$ 5 coloca ANP e PPSA sob pressão", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 82977, "titulo": "France's grape harvest threatened by drought, despite promising 2026 vintage", "url": "https://www.lemonde.fr/en/economy/article/2026/07/30/france-s-grape-harvest-threatened-by-drought-despite-promising-2026-vintage_6756010_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-30T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A colheita de uvas está programada para começar mais cedo, no início de agosto. Apesar da falta de água que afetou as videiras, o vintage pode ainda ser excelente, já que não sofreu com doenças.", "titulo_pt": "Colheita de uvas ameaçada por secas, mas vintage promissor", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 82455, "titulo": "Correcting climate ‘misperceptions’ may not boost climate action", "url": "https://www.carbonbrief.org/correcting-climate-misperceptions-may-not-boost-climate-action", "fonte_id": "carbon_brief", "data_pub": "2026-07-30T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa indica que o público geral subestima o apoio à ação climática e sobreestima as ações reais tomadas por outras pessoas para abordar o clima. Corrigir essas percepções incorretas pode não necessariamente aumentar a ação climática.", "titulo_pt": "Corrigir 'percepções errôneas' sobre o clima pode não melhorar as ações climáticas", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 81843, "titulo": "Quando os rios adoecem", "url": "https://www.jota.info/opiniao-e-analise/colunas/em-clima-de-justica/quando-os-rios-adoecem", "fonte_id": "jota", "data_pub": "2026-07-30T15:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O garimpo e a degradação silenciosa dos sistemas aquáticos da Amazônia descrevem como atividades ilegais e o uso inadequado estão afetando os rios e lagos da região amazônica, causando danos sutis mas significativos ao ecossistema.", "titulo_pt": "Quando os rios adoecem", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 81973, "titulo": "Firefighters race to extinguish blazes across EU as fire weather breaks records", "url": "https://www.theguardian.com/world/2026/jul/30/fire-weather-eu-wildfires-data", "fonte_id": "guardian_world", "data_pub": "2026-07-30T15:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Condições quentes, secas e ventosas na Europa estão 43% mais severas do que a média dos últimos 20 anos. Incêndios florestais em todo o Mediterrâneo são controlados por bombeiros enquanto as condições climáticas extremas batem recordes de severidade para esta época do ano.", "titulo_pt": "Bombeiros correm contra o tempo para apagar incêndios na Europa com condições meteorológicas recorde", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 82152, "titulo": "Unprecedented drought hits central France: 'Nothing grows anymore, it has become a desert'", "url": "https://www.lemonde.fr/en/environment/article/2026/07/30/unprecedented-drought-hits-central-france-nothing-grows-anymore-it-has-become-a-desert_6756006_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-30T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma seca sem precedentes atinge o centro da França, com apenas três dos 35 riachos monitorados pelo Serviço Francês de Biodiversidade ainda fluindo. As condições são as mais baixas desde que o monitoramento começou em 2012.", "titulo_pt": "Seca sem precedentes atinge centro da França: 'nada cresce mais, tornou-se um deserto'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 82456, "titulo": "Factcheck: No, Europe is not having its ‘quietest’ year for wildfires", "url": "https://www.carbonbrief.org/factcheck-no-europe-is-not-having-its-quietest-year-for-wildfires", "fonte_id": "carbon_brief", "data_pub": "2026-07-30T14:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na última semana, críticos do clima e comentaristas de direita compartilharam gráficos nas redes sociais sugerindo erroneamente que a Europa está experimentando seu ano mais calmo em termos de incêndios florestais. O Carbon Brief refuta essa afirmação, indicando que não é verdade que este seja o ano menos propício a incêndios na região.", "titulo_pt": "Verificação de fatos: não, Europa não está tendo seu ‘ano mais calmo’ em termos de incêndios florestais", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 82180, "titulo": "Drone footage captures massive Castellon wildfire in eastern Spain", "url": "http://www.euronews.com/video/2026/07/30/drone-footage-captures-massive-castellon-wildfire-in-eastern-spain", "fonte_id": "euronews", "data_pub": "2026-07-30T13:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos selvagens continuam a queimar em Espanha, com equipes lutando contra incêndios em Castellón e Zamora. Milhares de pessoas foram evacuadas e aviões estão auxiliando nos esforços de combate aos incêndios.", "titulo_pt": "Vídeo por drone captura grande incêndio em castellón, Espanha", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 82181, "titulo": "EU's competition chief Ribera slams climate deniers as fires rage: 'They are lying'", "url": "http://www.euronews.com/2026/07/30/they-are-lying-teresa-ribera-slams-climate-deniers-as-fires-rage-in-euronews-interview", "fonte_id": "euronews", "data_pub": "2026-07-30T13:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A comissária europeia de Competição, Margrethe Vestager, criticou políticos europeus que duvidam da ciência climática e ignoram as políticas ambientais como ideológicas. Ela acusou esses parlamentares de 'perigosos e estúpidos' durante uma entrevista à Euronews.", "titulo_pt": "Comissária europeia ataca negadores do clima: 'eles estão mentindo'", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 81966, "titulo": "Fifteen elephant deaths at Kenya park may be due to cyanide poisoning", "url": "https://www.theguardian.com/environment/2026/jul/30/elephant-deaths-kenya-park-cyanide-poisoning-wildlife", "fonte_id": "guardian_world", "data_pub": "2026-07-30T12:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Kenya Wildlife Service (KWS) informou que a morte de 15 elefantes perto de um parque na região sul do país, ocorrida recentemente, pode ter sido causada pelo consumo de pesticidas usados em plantações de tomates próximas. Análises realizadas nos corpos dos animais detectaram traços de cianeto, substância utilizada no controle predatório e como fumigante na agricultura, que também é empregada por caçadores ilegais.", "titulo_pt": "Dezessete mortes de elefantes em parque da kenia podem ser resultado de envenenamento com cianeto", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 82184, "titulo": "Crete wildfire kills two firefighters as fierce flames spread in Greece", "url": "http://www.euronews.com/video/2026/07/30/crete-wildfire-kills-two-firefighters-as-fierce-flames-spread-in-greece", "fonte_id": "euronews", "data_pub": "2026-07-30T11:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogo selvagem continua a queimar na ilha de Creta, Grécia, onde dois bombeiros morreram com ventos fortes alimentando as chamas e aviões participando dos esforços de resgate.", "titulo_pt": "Incêndio em creta mata dois bombeiros", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 82333, "titulo": "Safeguarding rights", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/07/31/2003861707", "fonte_id": "taipei_times", "data_pub": "2026-07-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto trata de temas relacionados à proteção dos direitos, mas não fornece detalhes específicos sobre o conteúdo. Sem informações adicionais, não é possível fornecer um resumo mais amplo.", "titulo_pt": "Garantindo os direitos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 83209, "titulo": "Nove imigrantes morrem tentando cruzar fronteira entre Marrocos e Espanha", "url": "https://www.cnnbrasil.com.br/internacional/imigrantes-morrem-tentando-cruzar-fronteira-entre-marrocos-e-espanha/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-3 function toggleDrill(id) {

}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>

    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
