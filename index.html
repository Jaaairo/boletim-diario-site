<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

const D = {"gerado_em": "25/07/2026 09:54", "stats": {"noticias_novas": 473, "resumos_gerados": 221}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Partido dos Trabalhadores formalizou Fernando Haddad como candidato ao governo de São Paulo, com o objetivo de fortalecer o discurso do presidente Lula contra Tarcísio de Freitas. A convenção para oficializar a candidatura ocorrerá em Campinas neste sábado e reunirá lideranças políticas. Em outro desenvolvimento, o Tribunal de Justiça do Estado de São Paulo prorrogou a prisão preventiva do vereador Senival Moura (PT), acusado de lavagem de dinheiro em favor da facção criminosa PCC. Além disso, o evento literário Flip está progredindo para um amadurecimento dos debates e a biópsia líquida é capaz de detectar quatro vezes mais casos de câncer do que os métodos tradicionais. Por fim, Eduardo da Fonte, do partido Progressistas (PP) de Pernambuco, está na chapa que concorrerá contra o Partido dos Trabalhadores no estado, prometendo alinhamento com Lula.", "mundo": "As tensões internacionais e os desafios sociais continuam a marcar o cenário global. Na Síria, uma colisão entre dois ônibus na estrada que liga Deir al-Zor a Damasco resultou em pelo menos 35 mortos e 30 feridos. Em outro incidente grave, um vídeo circulando no aplicativo X foi refutado como falso, mostrando supostamente um míssil iraniano destruindo um avião-bombardeiro B-52 dos Estados Unidos no Mar Cáspio. Na Europa Ocidental, incêndios florestais estão se espalhando, com centenas de milhares de pessoas sendo evacuadas na Espanha e França. No Irã, a tensão permanece alta após ataques americanos há cerca de duas semanas. Em uma notícia mais local, um ministro da Educação do Canadá foi preso sob suspeita de espionagem para um país não identificado em solo belga. Na Índia, o ministro da Educação renunciou após pressão de jovens manifestantes que denunciaram a divulgação antecipada de provas nacionais. A situação econômica na Alemanha é criticamente fraca, com perdas mensais significativas na indústria. Além disso, o presidente ucraniano Zelensky relatou um ataque de navio-arma no Mar Cáspio direcionado ao Irã.\n\nA situação geopolítica na região do Oriente Médio e África do Norte continua instável, com diversos incidentes e conflitos que afetam a segurança regional. Em primeiro lugar, os ataques israelenses em Gaza resultaram em pelo menos seis mortos e 27 feridos, refletindo o aumento da tensão entre Israel e os palestinos. Além disso, as detenções de cerca de 60 palestinos durante operações militares israelenses na Cisjordânia e a escalada da violência no Território Ocidental preocupam a União Europeia, que pede calma às partes envolvidas. Em outro frente, o conflito entre Arábia Saudita e Iêmen continua, com o Irã negando-se a ser responsabilizado pelo conflito e defendendo uma solução não-militar. O presidente dos Estados Unidos, Joe Biden, expressou sua preocupação em relação ao apoio potencial de líderes russos e chineses ao Irã, enquanto as forças militares americanas continuam preparadas para novas ações contra o país persa. Na Síria, o secretário-geral da ONU, António Guterres, realizou uma visita oficial após 17 anos, reafirmando seu apoio à transição pós-Assad. Por fim, os conflitos no Golfo do Omã e na estratégia de Teerã continuam a ameaçar a segurança marítima regional, com o Irã mantendo sua postura de não-aceitação da pressão internacional.", "economia": "O evento mais significativo mencionado nos artigos é a expansão da Sanfarma através do uso de personagens licenciados, como os da Disney e Turma da Mônica, além de entrar em novos mercados. A empresa busca faturar R$ 150 milhões com essa estratégia, que visa atrair mais clientes e aumentar sua presença no mercado farmacêutico brasileiro. Em outro destaque, a Embraer encerrou o segundo trimestre com uma carteira de encomendas avaliada em US$ 34,5 bilhões, um aumento de 16% em comparação com o período anterior, refletindo a crescente demanda por aviões comerciais e executivos. Além disso, o etanol se tornou mais competitivo que a gasolina em 10 estados brasileiros e no Distrito Federal, segundo dados da ANP, indicando uma vantagem econômica para os consumidores em determinadas regiões.", "tecnologia": "A China concluiu o primeiro túnel de alta velocidade sob o Rio Yangtze, um marco na construção da linha que ligará a região interior do país à costa. Este projeto faz parte dos esforços maiores para melhorar as infraestruturas de transporte no país. Em outro desenvolvimento tecnológico, a inteligência artificial (IA) está ganhando destaque em diversos setores, incluindo trabalho e produção. Empresas como a Oakmont estão explorando o potencial do uso de câmeras corporais para empresas privadas, enquanto a plataforma Substack busca expandir seu mercado no Brasil. No entanto, a IA também enfrenta críticas por questões éticas e de controle, com modelos avançados escapando de testes restritos e reavivando preocupações sobre sua potencial perigosidade. Além disso, a indústria de semicondutores está planejando investir em novas fábricas para atender à demanda crescente por chips de IA, com estimativas que os investimentos alcancem níveis sem precedentes nos próximos anos. Estes avanços tecnológicos refletem a crescente importância e impacto da IA no mundo contemporâneo, desde as rotinas diárias até as estratégias globais de negócios e políticas tecnológicas.", "ciencia": "A SpaceX realizou com sucesso o décimo terceiro voo suborbital do Starship, um avanço significativo para a empresa em direção ao seu objetivo de voos orbitais. Este teste crucial, realizado no dia 24 de julho, não apenas corrigiu problemas observados na viagem anterior, mas também lançou pela primeira vez satélites funcionais, abrindo caminho para futuros lançamentos comerciais e possíveis missões à Lua. Em outro avanço tecnológico, pesquisadores da Vrije Universiteit Brussel participaram de uma exposição verão chamada wONDERLAND no Museu de Ypres, utilizando ossos exumados há mil anos para dar um rosto e voz aos cidadãos medievais anônimos. Paralelamente, estudos sobre metabolitos secundários provenientes de microrganismos, plantas e organismos marinhos revelaram uma diversidade notável de estruturas químicas com amplas aplicações em biotecnologia, agricultura e medicina, destacando a importância da pesquisa científica na busca por novas soluções para problemas globais. Além disso, um medicamento capaz de reduzir o colesterol até 60% com poucos efeitos colaterais já foi desenvolvido, mostrando potencial transformador na maneira como se trata esta condição de saúde.", "cultura": "O evento mais importante desta edição se destaca pela sua abordagem da cultura pop e cinematográfica, com a série 'Furious', que é elogiada por sua abordagem feminista. A atriz Zezé Motta, aos 82 anos, continua ativa na carreira, celebrando o relançamento do filme 'Xica da Silva'. Em outro destaque cultural, a arquitetura contemporânea é destacada em projetos como o banheiro público no Parque Zoológico de Tóquio, no Japão, que incorpora elementos naturais. A literatura também ganha espaço com a seleção de livros para leitura de férias feita por renomados autores e debates sobre a inclusão das mulheres na tradição literária ocidental. O festival literário Flip em Paraty oferece uma programação diversificada, incluindo homenagens a personalidades da cultura e discussões sobre arquitetura como um fenômeno ambíguo.", "sociedade": "Um jornalista foi assassinado a facadas no Setor Bueno, bairro nobre de Goiânia. Delson Carlos Barros, colunista social e comunicador local, foi encontrado morto em um apartamento. As circunstâncias do caso ainda estão sendo investigadas pelas autoridades locais. Em outra notícia, a assistência alimentar americana enfrenta desafios devido à retirada de milhões de pessoas do Programa de Ajuda Nutricional Suplementar (SNAP), aumentando o peso das food banks e agências estaduais. Um estudo intitulado 'Public Health Needs MAHA' sugere que a área de saúde pública deve reconhecer as demandas do movimento insurgente, enquanto um relatório indica que cidades mais segregadas apresentam serviços públicos de menor qualidade e arrecadação mais baixa em IPTU. Além disso, o ministro da Educação da Índia renunciou após semanas de protestos exigindo sua demissão por supostas faltas nas provas de admissão e irregularidades no sistema educacional.", "meio_ambiente": "Incêndios florestais devastaram vastas áreas na Espanha e França, obrigando a evacuação de mais de 200 mil pessoas. Em Madrid e Ávila, os incêndios descontrolados causaram danos significativos, com o céu laranja e o sol vermelho em cidades afetadas. A situação é vista como uma catástrofe pela administração espanhola, que declarou estado de emergência nacional. Na França, a intensidade dos incêndios foi inesperada, levando bombeiros e autoridades a serem pegos de surpresa. As ondas de calor também se tornaram um problema global, com eventos climáticos extremos colocando em risco patrimônios culinários e causando danos duradouros à infraestrutura essencial, como estradas e trilhos ferroviários. O Brasil proibiu a produção e venda de iguarias obtidas por alimentação forçada de animais, afetando principalmente o foie gras, enquanto empresas como a Malwee investem em rastreabilidade para cumprir metas ambientais.", "direitos_humanos": "Volker Turk foi reeleito para mais quatro anos como chefe das Nações Unidas para os direitos humanos, com 144 votos a favor e apenas 10 contra. Esta vitória ocorreu apesar da oposição dos Estados Unidos, Israel e Rússia. Em outros eventos, Navid Manafi Rasi, um gay que fugiu do Irã devido à perseguição por sua orientação sexual, contou sua história de liberdade no Brasil. O conflito israelense-palestiniano está causando um aumento nos nascimentos prematuros e colocando a saúde materna em risco no Gaza. Foram realizados funerais noturnos para quatro palestinos mortos perto de Nablus, enquanto os filhos de Lorenzo Salgado Araujo, um imigrante morto por agentes do ICE em Texas, relataram seu luto e pediram responsabilização aos legisladores."}, "resumo_do_dia": {"politica_nacional": [{"id": 71767, "titulo": "Site de ingressos é alvo do governo por falta de transparência", "url": "https://www.poder360.com.br/poder-justica/site-de-ingressos-e-alvo-do-governo-por-falta-de-transparencia/", "fonte_id": "poder360", "data_pub": "2026-07-25T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senacon informou que o site Viagogo não oferece transparência suficiente, induzindo os clientes a acreditarem que é a vendedora primária.", "titulo_pt": "Site de ingressos viagogo é alvo do governo por falta de transparência", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 71768, "titulo": "São Paulo é condenado a pagar R$ 4,6 mi por venda de Beraldo", "url": "https://www.poder360.com.br/poder-sportsmkt/sao-paulo-e-condenado-a-pagar-r-46-mi-por-venda-de-beraldo/", "fonte_id": "poder360", "data_pub": "2026-07-25T11:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça determinou que o São Paulo deve pagar R$ 4,6 milhões a um empresário por conta de uma comissão não paga. O clube afirma que recorrerá da decisão.", "titulo_pt": "São Paulo condenado a pagar R$ 4,6 mi por venda de Beraldo", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 71769, "titulo": "54 mil estudantes são convocados para provas seleção de intercâmbio", "url": "https://www.poder360.com.br/poder-educacao/54-mil-estudantes-sao-convocados-para-provas-selecao-de-intercambio/", "fonte_id": "poder360", "data_pub": "2026-07-25T11:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "54 mil estudantes participarão de avaliações para a seleção de intercâmbio nas escolas estaduais das 91 Unidades Regionais de Ensino entre os dias 3 e 7 de agosto.", "titulo_pt": "54 Mil estudantes convocados para provas de seleção de intercâmbio", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 71770, "titulo": "Com saída de Barbosa, DC lança Clariana ao Planalto", "url": "https://www.poder360.com.br/poder-eleicoes-2026/com-saida-de-barbosa-dc-lanca-clariana-ao-planalto/", "fonte_id": "poder360", "data_pub": "2026-07-25T11:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Clariana foi lançada pelo Partido Democrático Cristão (DC) como candidata ao cargo de presidente. Ela se junta a Samara Martins, da União Produtiva (UP), como as duas mulheres oficiais na disputa presidencial.", "titulo_pt": "Com saída de Barbosa, DC lança Clariana para presidência", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 71702, "titulo": "Haddad terá candidatura ao governo de SP homologada em convenção do PT neste sábado", "url": "https://veja.abril.com.br/brasil/haddad-tera-candidatura-ao-governo-de-sp-homologada-em-convencao-do-pt-neste-sabado/", "fonte_id": "veja", "data_pub": "2026-07-25T11:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A candidatura de Haddad ao governo do estado de São Paulo será oficializada durante uma convenção do PT em Campinas. O evento reunirá lideranças políticas, incluindo Lula.", "titulo_pt": "Candidatura de haddad ao governo de SP será homologada em convenção do PT neste sábado", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 71771, "titulo": "Biópsia líquida ajuda a identificar 4 vezes mais casos de câncer", "url": "https://www.poder360.com.br/poder-saude/biopsia-liquida-ajuda-a-identificar-4-vezes-mais-casos-de-cancer/", "fonte_id": "poder360", "data_pub": "2026-07-25T11:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo indica que a biópsia líquida é capaz de detectar quatro vezes mais casos de câncer do que métodos tradicionais. Além disso, a tecnologia ajuda a reduzir o número de tumores descobertos após a aparência dos sintomas ou durante atendimentos de emergência.", "titulo_pt": "Biópsia líquida identifica 4 vezes mais casos de câncer", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 71688, "titulo": "Encontro debaterá governança territorial e uso de inteligência de dados para orientar políticas públicas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/encontro-debatera-governanca-territorial-e-uso-de-inteligencia-de-dados-para-orientar-politicas-publicas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-25T11:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um encontro será realizado em Brasília nesta segunda-feira (27) para discutir a governança territorial e o uso de inteligência de dados como ferramenta para orientar políticas públicas no país.", "titulo_pt": "Encontro debaterá governança territorial e uso de inteligência de dados para orientar políticas públicas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 71772, "titulo": "O que a ciência sabe sobre transtorno de múltiplas identidades", "url": "https://www.poder360.com.br/poder-saude/o-que-a-ciencia-sabe-sobre-transtorno-de-multiplas-identidades/", "fonte_id": "poder360", "data_pub": "2026-07-25T11:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O transtorno de múltiplas identidades é uma condição resultante de traumas na infância que afeta a memória e a percepção do eu. O quadro caracteriza-se por lapsos de memória e despersonalização.", "titulo_pt": "O que a ciência sabe sobre transtorno de múltiplas identidades", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 71773, "titulo": "Starship lança 20 satélites e pousa intacta no Índico", "url": "https://www.poder360.com.br/poder-internacional/starship-lanca-20-satelites-e-pousa-intacta-no-indico/", "fonte_id": "poder360", "data_pub": "2026-07-25T11:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Starship lançou 20 satélites e pousou intacta no Oceano Índico. Durante o teste, houve uma falha no retorno do propulsor, mas os principais objetivos da missão foram atingidos.", "titulo_pt": "Starship lança 20 satélites e pousa intacta no Índico", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 71711, "titulo": "Melhor da semana: Flip ruma a um amadurecimento de debates", "url": "https://veja.abril.com.br/coluna/veja-gente/melhor-da-semana-flip-ruma-a-um-amadurecimento-de-debates/", "fonte_id": "veja", "data_pub": "2026-07-25T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O evento literário Flip, que completa sua 24ª edição, está progredindo para um amadurecimento dos debates.", "titulo_pt": "Melhor da semana: flip avança rumo a um amadurecimento de debates", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 71774, "titulo": "Nome do PP de Pernambuco ao Senado promete alinhamento com Lula", "url": "https://www.poder360.com.br/poder-eleicoes-2026/nome-do-pp-de-pernambuco-ao-senado-promete-alinhamento-com-lula/", "fonte_id": "poder360", "data_pub": "2026-07-25T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eduardo da Fonte, do partido Progressistas (PP) de Pernambuco, está na chapa que concorre contra o Partido dos Trabalhadores (PT) no estado. Ele afirma ter pautas em comum com o presidente Lula.", "titulo_pt": "Deputado do PP de Pernambuco ao Senado promete alinhamento com Lula", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 71775, "titulo": "Telemedicina amplia adesão em tratamentos contra tabagismo", "url": "https://www.poder360.com.br/poder-saude/telemedicina-amplia-adesao-em-tratamentos-contra-tabagismo/", "fonte_id": "poder360", "data_pub": "2026-07-25T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A telemedicina tem aumentado a adesão aos tratamentos contra o tabagismo, oferecendo acompanhamento virtual que orienta grupos e fornece apoio psicológico para a cessação do hábito de fumar.", "titulo_pt": "Telemedicina amplia adesão em tratamentos contra tabagismo", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 71712, "titulo": "Com Milei, sem vice e sem Michelle: como será convenção de Flávio e do PL em SP", "url": "https://veja.abril.com.br/brasil/com-milei-sem-vice-e-sem-michelle-como-sera-convencao-de-flavio-e-do-pl-em-sp/", "fonte_id": "veja", "data_pub": "2026-07-25T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A convenção do senador Flávio Bolsonaro e do Partido Liberal (PL) está programada para ocorrer em São Paulo, com a participação do deputado federal Matheus Mollefe. A campanha do senador enfrenta desafios próximos às eleições, mas continua sendo considerado o nome mais competitivo contra Lula.", "titulo_pt": "Com Milei, sem vice e sem Michelle: como será a convenção de Flávio e do PL em SP", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 71857, "titulo": "Eleições 2026: o que está em jogo nas convenções partidárias?", "url": "https://www.jota.info/eleicoes/eleicoes-2026/eleicoes-2026-o-que-esta-em-jogo-nas-convencoes-partidarias", "fonte_id": "jota", "data_pub": "2026-07-25T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Candidatos à Presidência continuam buscando apoio político para formar chapas nas convenções partidárias.", "titulo_pt": "Eleições 2026: o que está em jogo nas convenções partidárias?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 71689, "titulo": "Aliados de Lula criam plataforma interativa direcionada a jovens de 16 a 30 anos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/aliados-de-lula-criam-plataforma-interativa-direcionada-a-jovens-de-16-a-30-anos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-25T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Instituto Lula e lideranças jovens do PT e de centrais sindicais lançaram uma plataforma interativa para jovens entre 16 e 30 anos, com o objetivo de engajar esse público estratégico na disputa eleitoral.", "titulo_pt": "Aliados de Lula criam plataforma interativa para jovens", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 71718, "titulo": "Dia da Mulher Negra Latino-Americana e Caribenha: mulheres cobram políticas de igualdade racial e maior participação em espaços de decisão", "url": "https://www.brasildefato.com.br/2026/07/25/dia-da-mulher-negra-latino-americana-e-caribenha-mulheres-cobram-politicas-de-igualdade-racial-e-maior-participacao-em-espacos-de-decisao/", "fonte_id": "brasil_de_fato", "data_pub": "2026-07-25T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A data celebra o papel das mulheres negras na história, cultura e luta por direitos. Elas exigem políticas de igualdade racial e maior representatividade nos espaços de decisão.", "titulo_pt": "Dia da Mulher Negra Latino-Americana e Caribenha: mulheres cobram políticas de igualdade racial e maior participação em espaços de decisão", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 72093, "titulo": "Lawmakers return from historic Beijing trip with insights on Hong Kong’s  em pelo menos 35 mortes e 30 feridos. O acidente ocorreu na estrada que liga Deir al-Zor a Damasco, conforme informou um funcionário do Ministério da Saúde à agência estatal SANA.", "titulo_pt": "Colisão entre dois ônibus mata ao menos 35 e deixa 30 feridos na Síria", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 71986, "titulo": "Sextortion: That's the threat for women who are simply trying to buy clean water", "url": "https://www.npr.org/2026/07/25/g-s1-133450/sexual-violence-women-clean-water-nairobi-kenya", "fonte_id": "npr_news", "data_pub": "2026-07-25T11:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Nairobi, na maior favela da cidade, o acesso à água é limitado e pode estar sob controle de cartéis locais. Isso aumenta o risco de ameaças sexuais e agressões para as mulheres que tentam comprar água limpa.", "titulo_pt": "Sextorsão: o perigo para mulheres que apenas querem comprar água limpa", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 71920, "titulo": "Live Updates: Hundreds of Thousands Flee as Fires Rage in Spain and France", "url": "https://www.nytimes.com/live/2026/07/25/world/france-spain-wildfires-evacuations", "fonte_id": "nyt_world", "data_pub": "2026-07-25T11:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos estão se espalhando em Espanha e França, com brigadistas trabalhando para conter as chamas que se aproximam de Madrid e Bordeaux. Centenas de milhares de pessoas estão sendo evacuadas.", "titulo_pt": "Atualizações em tempo real: centenas de milhas fugem diante das chamas nos estados de Espanha e França", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 72001, "titulo": "SpaceX's Starship splashes down in Indian Ocean after successful test flight", "url": "https://www.france24.com/en/americas/20260725-spacex-starship-splashes-down-in-indian-ocean-after-successful-test-flight", "fonte_id": "france24", "data_pub": "2026-07-25T11:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa espacial americana SpaceX realizou com sucesso um voo de teste do seu foguete Starship, de 14 andares, decolando da Texas e pousando suavemente na Índia Ocidental. Este foi o primeiro sucesso desde que o bilionário Elon Musk lançou a SpaceX ao público em junho.", "titulo_pt": "Teste bem-sucedido do Starship da spacex termina com pouso no oceano índico", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 71976, "titulo": "France and Spain race to control wildfires as more than 250,000 evacuated – live", "url": "https://www.theguardian.com/world/live/2026/jul/25/france-spain-wildfires-latest-news-updates-madrid-cap-ferret-bordeaux-gironde", "fonte_id": "guardian_world", "data_pub": "2026-07-25T11:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A França e a Espanha estão correndo para controlar incêndios florestais, enquanto mais de 250.000 pessoas foram evacuadas. O primeiro-ministro francês, Sébastien Lecornu, solicitou o uso antecipado de um avião militar Airbus A400M para auxiliar no combate aos grandes incêndios na região de Gironde.", "titulo_pt": "França e Espanha em corrida contra incêndios; mais de 250.000 evacuados", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 71987, "titulo": "Why these cancer patients face a lonely fight", "url": "https://www.npr.org/2026/07/25/g-s1-135365/cancer-breast-chemotherapy-nigeria", "fonte_id": "npr_news", "data_pub": "2026-07-25T11:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nigéria enfrenta um rápido aumento no número de casos de câncer, e pacientes relatam frequentemente sentir-se isolados na luta contra a doença.", "titulo_pt": "Por que esses pacientes oncológicos enfrentam uma batalha sozinhos", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 72052, "titulo": "Palestinian killed in Israeli strike on Gaza City", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/palestinian-killed-israeli-strike-gaza-city", "fonte_id": "middle_east_eye", "data_pub": "2026-07-25T11:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um palestino foi morto e outro ferido durante um ataque israelense no bairro de Sheikh Radwan, na cidade de Gaza, conforme informou a agência Wafa, citando fontes médicas. Um drone israelense teria alvejado ciclistas e pedestres.", "titulo_pt": "Palestino morto em ataque israelense em Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 71927, "titulo": "Canadian Intern at NATO Military HQ Is Arrested on Suspicion of Spying", "url": "https://www.nytimes.com/2026/07/25/world/europe/nato-canada-china-arrest-spying.html", "fonte_id": "nyt_world", "data_pub": "2026-07-25T11:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma interina de origem chinesa foi presa sob suspeita de espionagem para um país não identificado na Bélgica. O NATO Military HQ onde ela trabalhava não teve seu nome divulgado.", "titulo_pt": "Interina de origem chinesa é detida por suspeita de espionagem", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 71928, "titulo": "Latest updates.", "url": "https://www.nytimes.com/live/2026/07/25/world/france-spain-wildfires-evacuations/france-spain-wildfires-evacuations", "fonte_id": "nyt_world", "data_pub": "2026-07-25T11:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Incêndios estão se espalhando para áreas urbanas e 200 mil pessoas já foram evacuadas ou permanecem em casa.", "titulo_pt": "Atualizações mais recentes.", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 72077, "titulo": "Circa 250mila evacuati negli incendi fra Francia e Spagna", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/25/circa-250mila-evacuati-negli-incendi-fra-francia-e-spagna_9d6603d1-dd0a-458a-914f-3c8fceaf7109.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-25T11:17:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Incêndios se alastram no sul-oeste da França e próximo a Madrid. Cerca de 250 mil pessoas foram evacuadas por causa dos incêndios.", "titulo_pt": "Aproximadamente 250 mil evacuados nos incêndios entre França e Espanha", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 72038, "titulo": "Two buses collide in Syria, killing at least 35 people", "url": "https://www.aljazeera.com/news/2026/7/25/two-buses-collide-in-syria-killing-at-least-35-people?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-25T11:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois ônibus colidiram na Síria, resultando em pelo menos 35 mortos. Um dos ônibus transportava membros das Forças de Segurança Interna, enquanto o outro levava civis.", "titulo_pt": "Dois ônibus colidem na síria, deixando ao menos 35 mortos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 72030, "titulo": "Germany news: Industry hemorrhaging 15,000 jobs a month", "url": "https://www.dw.com/en/germany-news-industry-hemorrhaging-15-000-jobs-a-month/live-78101249?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-07-25T11:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A chefe da indústria Tanja Gönner afirma que a situação é crítica, mas oferece oportunidades. As autoridades de segurança alertam sobre clubes racistas em Bayreuth durante o festival do mesmo nome.", "titulo_pt": "Alemanha: indústria perde 15 mil postos de trabalho por mês", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 72039, "titulo": "India’s youth protesters are fighting Modi with irreverent humour and memes", "url": "https://www.aljazeera.com/news/2026/7/25/indias-youth-protesters-are-fighting-modi-with-irreverent-humour-and-memes?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-25T11:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Protestantes jovens na Índia estão usando humor irônico e memes nas mesmas plataformas de mídia social utilizadas pelo governo Modi para construir sua marca política.", "titulo_pt": "Jovens indianos protestam contra Modi usando humor e memes", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 72031, "titulo": "Could 'mesh networks' help overcome authoritarians' internet blocks?", "url": "https://www.dw.com/en/could-mesh-networks-help-overcome-authoritarians-internet-blocks/a-78055915?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-07-25T11:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em países autoritários, o estado pode monitorar as comunicações online ou bloqueá-las durante crises políticas. No entanto, existem alternativas que os ativistas podem usar para manter contato.", "titulo_pt": "Poderiam 'redes de malha' auxiliar na superação dos bloqueios de internet por parte de autoridades?", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 71779, "titulo": "Ricardo Nunes afirma que SP não deve ter megashow na avenida Paulista em 2026", "url": "https://www.infomoney.com.br/brasil/ricardo-nunes-afirma-que-sp-nao-deve-ter-megashow-na-avenida-paulista-em-2026/", "fonte_id": "infomoney", "data_pub": "2026-07-25T11:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O prefeito de São Paulo, Ricardo Nunes, declarou que a cidade não deverá sediar um megashow na Avenida Paulista em 2026. Ele atribuiu essa decisão a 'indivíduos com questões pessoais' no Ministério Público e no Poder Judiciário.", "titulo_pt": "Ricardo Nunes afirma que SP não terá megashow na avenida Paulista em 2026", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 71780, "titulo": "Mesmo com guerra, fluxo de comércio global cresce pelo segundo mês seguido", "url": "https cera", "data_pub": "2026-07-25T11:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A nova gerente geral da Cinemark no Chile, Karina Ventura, destaca que o desafio para a indústria é encontrar uma forma de conviver com as plataformas de streaming. A empresa possui 22 locais no país, sendo nove na Região Metropolitana, e detém 37% do mercado, com a principal concorrência vinda da Cinépolis.", "titulo_pt": "Cinemark se aproxima das cifras pré-pandemia e reflete sobre o streaming", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 71903, "titulo": "La paradoja de la invariabilidad tributaria ante el TC", "url": "https://www.latercera.com/opinion/noticia/la-paradoja-de-la-invariabilidad-tributaria-ante-el-tc/", "fonte_id": "la_tercera", "data_pub": "2026-07-25T11:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute a contradição entre a invariabilidade tributária e as decisões do Tribunal Constitucional. Ele explora como essas duas ideias podem entrar em conflito na prática.", "titulo_pt": "A paradoxa da invariabilidade tributária frente ao TC", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 71905, "titulo": "La presión financiera sobre CMPC de cara a su megaproyecto Natureza en Brasil", "url": "https://www.latercera.com/pulso/noticia/la-presion-financiera-sobre-cmpc-de-cara-a-su-megaproyecto-natureza-en-brasil/", "fonte_id": "la_tercera", "data_pub": "2026-07-25T11:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As receitas da CMPC caíram 50% no primeiro trimestre deste ano, e a expectativa é de nova contração no segundo trimestre. O projeto Natureza em Brasil custará cerca de US$4,6 bilhões, uma quantia maior que o valor atual da empresa na bolsa de valores, levantando preocupações sobre a necessidade de um aumento de capital adicional de até US$1 bilhão.", "titulo_pt": "A pressão financeira sobre CMPC em relação ao seu grande projeto Natureza no Brasil", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 71786, "titulo": "Institucionais ganham espaço no curto prazo e mudam dinâmica do varejo", "url": "https://www.infomoney.com.br/mercados/institucionais-ganham-espaco-no-curto-prazo-e-mudam-dinamica-do-varejo/", "fonte_id": "infomoney", "data_pub": "2026-07-25T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Instituições financeiras estão aumentando sua participação no mercado a curto prazo e alterando a dinâmica do varejo. Especialistas discutem como esse fluxo pode afastar os preços dos fundamentos e avaliam que a Bolsa brasileira está valendo a pena.", "titulo_pt": "Institucionais ganham espaço no curto prazo e mudam dinâmica do varejo", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 71787, "titulo": "Expert XP 2026 termina com premiação, João Fonseca, CEOs e influencers", "url": "https://www.infomoney.com.br/carreira/expert-xp-2026-termina-com-premiacao-joao-fonseca-ceo-e-influencers/", "fonte_id": "infomoney", "data_pub": "2026-07-25T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O evento Expert XP 2026 aconteceu durante três dias no São Paulo Expo e reuniu executivos, CEOs e influenciadores, tanto nacionais quanto internacionais. O evento encerrou com uma premiação.", "titulo_pt": "Expert XP 2026 termina com premiação, CEOs e influencers", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 72069, "titulo": "Investors increase bets on Federal Reserve rate rise after oil price surge", "url": "https://www.ft.com/content/5019e030-796d-47e8-9f13-bee34de1d374?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-25T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores aumentaram suas apostas de que a taxa de juros será elevada pela Reserva Federal nos próximos dias, devido ao forte aumento dos preços do petróleo. A próxima reunião do banco central americano está sendo considerada crucial ", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 71604, "titulo": "Prize honors discovery of altermagnetism as a third fundamental class of magnetism", "url": "https://phys.org/news/2026-07-prize-honors-discovery-altermagnetism-fundamental.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Prêmio Eurofísico da Divisão de Materiais Condensados da Sociedade Europeia de Física foi concedido a Professor Jairo Sinova, Dr. Libor Šmejkal e Professor Tomas Jungwirth por sua descoberta do altermagnetismo, uma nova classe fundamental de magnetismo ainda não conhecida.", "titulo_pt": "Prêmio homenageia descoberta do altermagnetismo como terceira classe fundamental de magnetismo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 71644, "titulo": "SpaceX's Starship megarocket makes the 'softest splashdown' ever after launching next-gen Starlink satellites in Flight 13 test (video)", "url": "https://www.space.com/space-exploration/launches-spacecraft/spacexs-starship-megarocket-makes-the-softest-splashdown-ever-after-launching-next-gen-starlink-satellites-in-flight-13-test-video", "fonte_id": "space_com", "data_pub": "2026-07-25T01:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX lançou o Starship, o foguete mais poderoso do mundo, em uma teste crucial na 13ª viagem de teste em 24 de julho. O voo foi um grande sucesso e terminou com um impressionante pouso suave.", "titulo_pt": "Starship, o foguete mais potente do mundo, realiza a 'pousada mais suave' na 13ª viagem de teste após lançar satélites Starlink (vídeo)", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 71605, "titulo": "Research sheds light on migration, lifestyle, health and social status in the medieval metropolis Ypers", "url": "https://phys.org/news/2026-07-migration-lifestyle-health-social-status.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T01:20:00Z", ub": "2026-07-25T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor se sentiu inspirado pela relação de Zendaya e Hunter Schafer na série Euphoria para expressar sua orientação sexual a seu amigo Ellen, com quem tinha uma longa amizade. O amor surgiu durante o último ano do ensino médio, quando os dois tinham 17 anos.", "titulo_pt": "Euphoria me deu coragem para confessar meu sentimento para minha amiga – agora estamos juntos", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 72143, "titulo": "Treasure as trinkets: Zendaya’s earrings renew debate on ownership of ancient artefacts", "url": "https://www.theguardian.com/culture/2026/jul/25/treasure-as-trinkets-zendayas-earrings-renew-debate-on-ownership-of-ancient-artefacts", "fonte_id": "guardian_culture", "data_pub": "2026-07-25T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Zendaya, que interpreta a deusa Ateneu no filme The Odyssey, causou indignação ao usar brincos supostamente feitos com artefatos iranianos datados do 1º milênio a.C. durante uma sessão de fotos em Londres. O incidente reavivou o debate sobre a propriedade de antiguidades arqueológicas.", "titulo_pt": "Joias como trinkets: os brincos de zendaya renovam debate sobre apropriação de artefatos antigos", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 72156, "titulo": "Lit Hub Weekly: July 20 – 24, 2026", "url": "https://lithub.com/lit-hub-weekly-july-20-24-2026/", "fonte_id": "lithub", "data_pub": "2026-07-25T10:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Steven W. Thrasher examina, a partir de Dr. Abdul El-Sayed e Brad Lander, o silenciamento das mulheres na tradição literária ocidental, focando no 'Odisseia' e em como a cultura clássica pode incluir o estupro.", "titulo_pt": "Cultura clássica é muitas coisas, incluindo literalmente culturismo de estupro: rebecca solnit sobre a odisseia e a tradição literária el Mann e o elenco de Manhunter refletiram sobre a criação do filme, que retrata uma descida perturbadora para um submundo criminal. A obra é considerada uma das maiores explorações cinematográficas desse universo por Mann.", "titulo_pt": "Pessoas que cometem crimes hediondos podem ser vítimas: michael Mann reflete sobre a força provocativa de Manhunter aos 40 anos", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 72089, "titulo": "Out of the shadows: Japanese women building a life beyond motherhood", "url": "https://www.japantimes.co.jp/news/2026/07/25/japan/society/japan-childless-women/", "fonte_id": "japan_times", "data_pub": "2026-07-25T08:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher está liderando o esforço para construir uma comunidade onde a vida sem filhos, seja por escolha ou circunstância, é um norma social aceita.", "titulo_pt": "Deixando de lado as sombras: mulheres japonesas construindo uma vida além da maternidade", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 72140, "titulo": "The perfect books for the beach … picked by Freida McFadden, Mick Herron, Robert Harris and more", "url": "https://www.theguardian.com/books/ng-interactive/2026/jul/25/the-perfect-books-for-the-beach-picked-by-freida-mcfadden-mick-herron-robert-harris-and-more", "fonte_id": "guardian_culture", "data_pub": "2026-07-25T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autores como Freida McFadden, Mick Herron e Robert Harris selecionaram livros para leitura de férias que variam entre sagas históricas e romances de pequenas vilas. O conselho dado é que a mistura de gêneros e tamanhos de livros seja balanceada para evitar confusão, problemas de saúde e culpa durante as férias.", "titulo_pt": "Os livros perfeitos para o beach, escolhidos por Freida McFadden, Mick Herron, Robert Harris e outros", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 72131, "titulo": "Artists with disabilities put technology in pursuit of the senses", "url": "https://www.koreaherald.com/article/10820043", "fonte_id": "korea_herald", "data_pub": "2026-07-25T07:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma galeria compacta perto da Estação Séul, uma faixa de luz percorre um cômodo oval. Ao entrar no caminho da luz, o espaço responde com som e a experiência se torna coletiva entre os visitantes.", "titulo_pt": "Artistas com deficiências buscam sensações através da tecnologia", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 71686, "titulo": "Como Moacir Santos, que faria cem anos, criou um universo musical próprio", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/07/como-moacir-santos-que-faria-cem-anos-criou-um-universo-musical-proprio.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-07-25T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Moacir Santos, que completaria cem anos, criou um estilo musical único. O violonista Mario Adnet encontrou desafios na recriação de partituras do maestro pernambucano, notadamente em sua complexidade rítmica.", "titulo_pt": "Como Moacir Santos, que faria cem anos, criou um universo musical próprio", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 71687, "titulo": "Veja destaques da programação da Flip neste sábado (25) em Paraty", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/07/veja-destaques-da-programacao-da-flip-neste-sabado-25-em-paraty.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-07-25T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 24ª edição da Festa Literária Internacional de Paraty ocorre até o domingo, 26 de julho. A programação inclui uma homenagem a Orides Fontela, com curadoria de Rita Pal 2026-07-25T09:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos florestais perto de Madrid e Ávila obrigaram centenas de milhares a serem evacuados, tornando o céu laranja e o sol vermelho em cidades afetadas.", "titulo_pt": "Sol vermelho, céu laranja enquanto madri enfrenta sua pior queimada na história", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 72101, "titulo": "Who pays when overheated roads melt and rails buckle?", "url": "https://www.scmp.com/opinion/world-opinion/article/3361626/who-pays-when-overheated-roads-melt-and-rails-buckle?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-25T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ondas de calor causam danos duradouros e caros à infraestrutura essencial, como estradas e trilhos ferroviários, mesmo após a temperatura abaixar. Este ano registrou temperaturas recordes, demonstrando o aumento da frequência e intensidade dessas ondas de calor.", "titulo_pt": "Quem paga quando estradas aquecidas derretem e trilhos se curvam?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 71799, "titulo": "Fim de semana terá virada no clima com chuva forte e granizo", "url": "https://olhardigital.com.br/2026/07/25/ciencia-e-espaco/fim-de-semana-tera-virada-no-clima-com-chuva-forte-e-granizo/", "fonte_id": "olhar_digital", "data_pub": "2026-07-25T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Instituto Nacional de Meteorologia (Inmet) alerta para tempestades, granizo e mudanças no clima em várias regiões do Brasil durante o fim de semana, com chuva forte e períodos de baixa umidade.", "titulo_pt": "Fim de semana terá virada no clima com chuva forte e granizo", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 72021, "titulo": "Monsoon floods kill at least 41 in India's Assam state", "url": "http://www.euronews.com/video/2026/07/25/assam-monsoon-flooding-kills-at-least-41-as-rescue-operations-continue", "fonte_id": "euronews", "data_pub": "2026-07-25T08:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Flooding causada pela monção submergiu casas e estradas no estado de Assam, Índia. Ao menos 41 pessoas morreram e operações de resgate continuam.", "titulo_pt": "Inundações monçônicas matam pelo menos 41 em estado indiano", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 71822, "titulo": "Por que o Brasil proibiu a produção e a venda de iguaria que pode chegar a R$ 5.000/kg", "url": "https://exame.com/agro/por-que-o-brasil-proibiu-a-producao-e-a-venda-de-iguaria-que-pode-chegar-a-r-5-000-kg/", "fonte_id": "exame", "data_pub": "2026-07-25T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil proibiu a produção e venda de iguarias obtidas por alimentação forçada de animais, afetando principalmente o foie gras, que é produzido com fígados de patos e gansos.", "titulo_pt": "Por que o Brasil proibiu a produção e a venda de iguaria que pode chegar a R$ 5.000/kg", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 71828, "titulo": "Malwee reduz emissões em 42% e aposta em rastreabilidade para cumprir metas", "url": "https://exame.com/esg/malwee-reduz-emissoes-em-42-e-aposta-em-rastreabilidade-para-cumprir-metas/", "fonte_id": "exame", "data_pub": "2026-07-25T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Malwee reduziu suas emissões em 42% e está investindo na rastreabilidade para atingir suas metas ambientais. Um novo relatório socioambiental da varejista têxtil detalha as mudanças estratégicas e as melhorias nos indicadores de emissões, água e resíduos.", "titulo_pt": "Malwee reduz emissões em 42% e aposta em rastreabilidade para cumprir metas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 72044, "titulo": "Wildfires in Spain and France force evacuation of 200,000 people", "url": "https://www.aljazeera.com/news/2026/7/25/wildfires-in-spain-and-france-force-evacuation-of-200000-people?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-25T07:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos florestais na Espanha e França obrigaram o deslocamento de 200 mil pessoas. A França pediu ajuda internacional, enquanto a Espanha declarou estado de emergência nacional.", "titulo_pt": "Incêndios em Espanha e França forçam evacuação de 200 mil pessoas", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 71975, "titulo": "Herbicide banned in 70 countries to be pulled from sale in Australia by chemical maker", "url": "https://www.theguardian.com/environment/2026/jul/25/herbicide-parkinsons-disease-paraquat-pulled-from-sale-australia-syngenta", "fonte_id": "guardian_world", "data_pub": "2026-07-25T04:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Syngenta, fabricante de um herbicida banrado em mais de 70 países e associado à doença de Parkinson, vai parar de vender paraquat na Austrália devido a novas regulamentações. Essa decisão foi tomada após anúncios de restrições recentes sobre o highly poisonous químico pela Autoridade Australiana de Pesticidas e Medicamentos Veterinários.", "titulo_pt": "Herbicida banrado em 70 países será retirado da venda na austrália", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 71231, "titulo": "Vuelven malas condiciones de ventilación: declaran alerta ambiental para este sábado en la Región Metropolitana", "url": "https://www.latercera.com/nacional/noticia/vuelven-malas-condiciones-de-ventilacion-declaran-alerta-ambiental-para-este-sabado-en-la-region-metropolitana/", "fonte_id": "la_tercera", "data_pub": "2026-07-25T03:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A autoridade ambiental declarou uma alerta ambiental para este sábado na Região Metropolitana devido a condições ruins de ventilação. É recomendado evitar o uso de ca const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

    drillCounter = 0;
