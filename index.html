      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "21/11/2026 07:21", "stats": {"noticias_novas": 571, "resumos_gerados": 242}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O ex-presidente Jair Bolsonaro foi internado para realizar exames devido a dores abdominais. Sua esposa Michelle já havia retornado ao Brasil, informou o ex-presidente. Em outros desenvolvimentos, o Supremo Tribunal Federal (STF) enfrenta uma crise de legitimidade. Especialistas avaliam que Lula pode apoiar acordos no STF que mantêm o status quo se sua popularidade estiver alta. O STF também está sob pressão para não perder o único satélite responsável por comunicações críticas, com o governo tendo cerca de seis anos para substituí-lo. Além disso, a Procuradoria-Geral da República (PGR) está avaliando relatórios da Polícia Federal (PF) sobre ministros do STF para decidir se justificam a abertura de uma investigação.", "mundo": "As negociações da 31ª Conferência das Nações Unidas sobre Mudanças Climáticas (COP31), realizada em Antalya, Turquia, estão em impasse, com foco nas discussões sobre combustíveis fósseis e financiamento climático. Países de quase 200 nações estão em desacordo, dificultando o alcance de um novo acordo global. Em outros desenvolvimentos, a Dinamarca acusa a Rússia de tentativa de assassinato contra um rapper ucraniano-americano em Copenhague, o que resultou na expulsão de um diplomata russo e em restrições mais rigorosas para vistos de turismo para cidadãos russos. Além disso, o Reino Unido e a União Europeia assinaram três acordos em Bruxelas, visando reduzir burocracia para exportações de alimentos, conectar sistemas de troca de emissões e facilitar a vida e trabalho de jovens entre os dois lados do Canal da Mancha, marcando um novo esforço para redefinir as relações após o Brexit.\n\nDois navios petroleiros sofreram ataques quase simultâneos no Estreito de Ormuz, levando a preocupações sobre a segurança do fornecimento de petróleo global. O Irã reiterou suas condições para a reabertura do estreito, enquanto os Estados Unidos impuseram sanções a quatro iranianos acusados de serem 'guardiões do petróleo', indicando tensões crescentes na região. Em meio a esses eventos, a China buscou expandir sua influência global durante cúpulas internacionais, enquanto a Arábia Saudita interceptou três mísseis hutíes dirigidos a Riad, refletindo a escalada de tensões na península do Golfo. Além disso, o presidente dos Estados Unidos, Donald Trump, ameaçou aplicar uma taxa sobre empresas tecnológicas americanas que construam centros de dados de IA no exterior, enquanto o Reino Unido e a União Europeia concordaram em redefinir as negociações após o Brexit. Estes incidentes refletem a complexidade da geopolítica global atual, marcada por tensões regionais, disputas estratégicas e esforços para manter a ordem internacional.", "economia": "A economia global enfrenta diversos desafios e incertezas, conforme mostram os principais eventos abordados nos artigos. O presidente Lula surpreendeu o mercado financeiro, segundo o cientista político Leonardo Barreto, pois sua agenda econômica não se alinha com a atual situação econômica do Brasil. No exterior, as ações de tecnologia nos Estados Unidos caíram drasticamente. A CVC negou acusações de manipulação contábil, enquanto a Nvidia enfrenta uma investigação da SEC. Na área de tecnologia, a Zscaler viu seu valor de mercado disparar 18% após relatos de que a CrowdStrike estaria em negociações para adquiri-la. No setor de defesa, empresas de construção estão apostando em projetos militares na Europa para compensar o mercado residencial fraco. Em termos de investimentos, a soja teve uma recuperação parcial após quatro sessões de queda em Chicago, enquanto o milho e o trigo encerraram a semana com perdas. O Reino Unido e a União Europeia chegaram a um acordo para interligar seus mercados de carbono a partir de 2028, com o objetivo de aumentar a liquidez e auxiliar as empresas a evitar bilhões de euros em tarifas de carbono na fronteira. Além disso, o TAIEX, índice da bolsa de valores de Taiwan, caiu quase 18% em sua pior semana desde 1991, refletindo vulnerabilidades conhecidas que estão deixando pequenas empresas europeias cada vez mais expostas a ataques cibernéticos.", "tecnologia": "A bolsa de valores de Wall Street teve uma das piores semanas desde a crise do coronavírus devido às preocupações sobre os modelos de negócios das principais empresas de tecnologia, incertezas sobre o futuro dos centros de dados e problemas enfrentados pela Nvidia. Em outro desenvolvimento, a empresa de inteligência artificial Anthropic teve um IPO recorde na Nasdaq, arrecadando US$8,134 bilhões com uma oferta inicial de ações acima do esperado, alimentando as expectativas de um IPO futuro para o rival OpenAI. A Nextlink, uma subsidiária de nuvem da Far EasTone Telecommunications, retornou à lucratividade operacional nos primeiros três trimestres de 2026, com uma receita recorde de aproximadamente US$126 milhões, um crescimento anual de 29,4%. Além disso, a Meta está reconsiderando seus objetivos de sustentabilidade para 2030 em face das emissões recordes de seus centros de dados de IA, enquanto a Comissão de Valores Mobiliários dos Estados Unidos está investigando a Nvidia sobre suas práticas contábeis.", "ciencia": "Um matemático da Anthropic, com a ajuda de uma IA chamada Claude, pode ter resolvido a hipótese de Riemann, um dos maiores problemas abertos da matemática há 167 anos, gerando admiração e incerteza na comunidade matemática. Paralelamente, a NASA selecionou 302 projetos inovadores de pequenas empresas, investindo até US$ 171 milhões, para atender às necessidades tecnológicas mais críticas da agência em explorações lunares e marcianas, estimulando a economia espacial americana. Em outro avanço, pesquisadores descobriram que uma espécie de peixe nativo do Rio Missouri Superior, no estado de Montana, vive até 130 anos, mais do que o triplo da estimativa anterior, com base em datação por radiocarbono. Outro estudo revelou que dois novos espécimes de tardígrados marinhos foram descritos no sedimento do Senghor Seamount, próximo à costa de Cabo Verde, por um grupo internacional de pesquisadores. Além disso, a SpaceX lançou uma missão classificada para o Exército Espacial dos Estados Unidos, enviando um carregamento desconhecido para a órbita a partir da costa central da Califórnia.", "cultura": "O evento mais importante dos artigos é a estreia do Grand Theft Auto VI (GTA 6), que gerou um recorde de $3,79 bilhões em vendas no primeiro dia de lançamento, estabelecendo um novo recorde para o lançamento de qualquer produto de entretenimento. O jogo, desenvolvido pela Rockstar Games, também gerou R$ 22,3 bilhões no Brasil, consolidando-se como o maior lançamento da história do entretenimento. Em outro destaque cultural, a exposição de Philippe Parreno no Museu de Arte Contemporânea de Sydney é imprevisível, influenciada por dados em tempo real vindo de uma fazenda espanhola, destacando a interação entre arte e tecnologia. Em um contexto global, o Simpósio Internacional das Orquídeas em Taiwan em 2030 visa promover a pesquisa e o compartilhamento de conhecimentos sobre orquídeas de todo o mundo. Além disso, a música rock chilena é homenageada em Concepción, onde 21% dos habitantes consideram a música como um dos principais símbolos da cidade. No cinema, a crítica destaca o filme 'Blade Runner 2099', que, apesar de sua complexidade, é uma adaptação de sucesso para a televisão, enquanto os livros 'Underworld' de Don DeLillo e 'The Luminaries' de Eleanor Catton são recomendados para leitura durante os dias mais curtos do outono.", "sociedade": "Em 2025, um homem foi condenado por iniciar um incêndio durante o Réveillon em Los Angeles, que se tornou um dos mais destrutivos na história da Califórnia e resultou na morte de 12 pessoas. Em outro evento, um grupo da tribo Awa-Guaja emergiu brevemente do isolamento em 16 de novembro, após pelo menos 50 anos, levantando preocupações sobre sua sobrevivência. Na Europa, jovens de mais de 25 países protestaram contra o aumento do custo de vida, crise habitacional e gastos militares. No Brasil, o Dia da Consciência Negra foi marcado por discussões sobre cotas no ensino superior e pela decisão do Supremo Tribunal Federal sobre o uso das cotas. Além disso, o agronegócio terá de adotar uma nova jornada de trabalho de 5 dias semanalmente, e o governo de Nova York apresentou um plano para fechar a prisão controversa de Rikers Island até 2032.", "meio_ambiente": "A 31ª Conferência das Nações Unidas sobre Mudanças Climáticas (COP31), realizada em Antalya, Turquia, enfrentou atrasos e desafios significativos. Não houve um acordo final, e houve discussões sobre a continuidade do uso de combustíveis fósseis. Na reunião, a China se comprometeu a promover a eletrificação de sua economia através de fontes de energia de baixo carbono e a auxiliar outros países a adotar a mesma estratégia. A Venezuela apresentou um modelo de participação comunitária na proteção ambiental, destacando a importância de iniciativas locais na conservação do território. O relatório Destination Climate RiskScan indica que o risco associado às altas temperaturas está se intensificando, exigindo adaptação do setor turístico e redução das emissões de gases de efeito estufa. Além disso, a China, França e Panamá enviaram uma carta reiterando a necessidade de um acordo que inclua uma transição clara e firme das energias fósseis.", "direitos_humanos": "O Brasil enfrenta questões relacionadas ao racismo e aos direitos humanos, conforme mostrou uma pesquisa que aborda a presença desse racismo no país. O Senado francês aprovou uma lei que presume a legalidade dos disparos policiais, concedendo um benefício de dúvida aos agentes, o que gerou debates sobre a justiça e a brutalidade policial. A ONU declarou que a Mianmar cometeu genocídio contra a minoria rohingya, uma decisão histórica que atribui responsabilidade a um país pela prática de genocídio. Em outro desenvolvimento, a Bahia lidera o registro de ações de racismo na justiça, refletindo a intensidade do problema no estado mais negro do país. Além disso, o Brasil reconhece terras indígenas e a visita de Lula a Raoni destaca a importância do respeito às comunidades indígenas."}, "resumo_do_dia": {"politica_nacional": [{"id": 278461, "titulo": "Cid Gomes promete relatório do Novo Desenrola para dezembro", "url": "https://www.poder360.com.br/poder-congresso/cid-gomes-promete-relatorio-do-novo-desenrola-para-dezembro/", "fonte_id": "poder360", "data_pub": "2026-11-21T09:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cid Gomes promete entregar relatório do Novo Desenrola para dezembro. A medida autoriza o governo a comprar até R$ 15 bilhões em dívidas de pessoas inadimplentes.", "titulo_pt": "Cid Gomes promete relatório do Novo Desenrola para dezembro", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 278462, "titulo": "Público rejeita notícias feitas por IA, mas usa ferramenta para busca", "url": "https://www.poder360.com.br/nieman/publico-rejeita-noticias-feitas-por-ia-mas-usa-ferramenta-para-busca/", "fonte_id": "poder360", "data_pub": "2026-11-21T09:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O público rejeitou notícias produzidas por inteligência artificial, segundo pesquisa do Reuters Institute. No entanto, as ferramentas de busca que utilizam IA continuam a ser utilizadas pelos usuários.", "titulo_pt": "Público rejeita notícias feitas por IA, mas usa ferramentas para busca", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 278463, "titulo": "União poderá ajudar municípios a elaborar plano diretor", "url": "https://www.poder360.com.br/poder-congresso/uniao-podera-ajudar-municipios-a-elaborar-plano-diretor/", "fonte_id": "poder360", "data_pub": "2026-11-21T09:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A União pode auxiliar os municípios na elaboração de seus planos diretores, mas isso dependerá da disponibilidade orçamentária e financeira locais. A proposta altera o Estatuto da Cidade e estabelece essas condições para o apoio federal.", "titulo_pt": "União poderá auxiliar municípios na elaboração de planos diretores", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 278567, "titulo": "Seria possível um Judiciário sem o Supremo Tribunal Federal?", "url": "https://www.jota.info/opiniao-e-analise/colunas/observatorio-constitucional/seria-possivel-um-judiciario-sem-o-supremo-tribunal-federal", "fonte_id": "jota", "data_pub": "2026-11-21T09:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A crise de legitimidade do Judiciário reavivou o debate sobre o papel histórico do Supremo Tribunal Federal (STF) e a necessidade de um código de ética para o tribunal.", "titulo_pt": "Seria possível um Judiciário sem o Supremo Tribunal Federal?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 278464, "titulo": "Senado aprova regras de qualidade e segurança para implantes cirúrgicos", "url": "https://www.poder360.com.br/poder-congresso/senado-aprova-regras-de-qualidade-e-seguranca-para-implantes-cirurgicos/", "fonte_id": "poder360", "data_pub": "2026-11-21T09:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado aprovou um projeto que estabelece regras de qualidade e segurança para implantes cirúrgicos, exigindo que a Anvisa autorize a produção e a comercialização desses dispositivos. O texto também amplia o controle sobre falhas relacionadas a esses produtos.", "titulo_pt": "Senado aprova regras de qualidade e segurança para implantes cirúrgicos", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 278423, "titulo": "Senadores ainda defendem PEC que regulamenta fim da 6x1, apesar de decreto e portarias do governo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/senadores-ainda-defendem-pec-que-regulamenta-fim-da-6x1-apesar-de-decreto-e-portarias-do-governo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-21T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os senadores continuam a discutir uma PEC que regulamenta o fim da escala 6x1, apesar do governo Lula já ter publicado portarias sobre o assunto. A intenção é discutir casos específicos na PEC, mesmo com as regras já estabelecidas por portarias.", "titulo_pt": "Senadores mantêm discussão sobre PEC para regulamentar fim da 6x1, em face de portarias governamentais", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 278451, "titulo": "Com nordestinidade e poesia, Nando Cordel lança disco gravado em turnê pelo Nordeste", "url": "https://www.cartacapital.com.br/blogs/augusto-diniz/com-nordestinidade-e-poesia-nando-cordel-lanca-disco-gravado-em-turne-pelo-nordeste/", "fonte_id": "cartacapital", "data_pub": "2026-11-21T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nando Cordel lança um disco gravado durante uma turnê pelo Nordeste, incorporando nordestinidade e poesia em suas composições. O artista reúne mais de 700 canções gravadas por diversos intérpretes.", "titulo_pt": "Com nordestinidade e poesia, Nando Cordel lança disco gravado em turnê pelo Nordeste", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 278465, "titulo": "Telebras estima iniciar operação de data center de IA em 1 ano", "url": "https://www.poder360.com.br/poder-infra/telebras-estima-iniciar-operacao-de-data-center-de-ia-em-1-ano/", "fonte_id": "poder360", "data_pub": "2026-11-21T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Telebras estima iniciar operações de um data center para inteligência artificial em um ano. Anatel designou R$ 375 milhões em recursos restantes do leilão do 5G para este projeto.", "titulo_pt": "Telebras estima iniciar operação de data center de IA em 1 ano", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 278466, "titulo": "Projeto cria auxílio financeiro temporário para mulheres vítimas de violência", "url": "https://www.poder360.com.br/poder-congresso/projeto-cria-auxilio-financeiro-temporario-para-mulheres-vitimas-de-violencia/", "fonte_id": "poder360", "data_pub": "2026-11-21T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto prevê um auxílio financeiro temporário para mulheres vítimas de violência, que será pago pelos municípios e pelo Distrito Federal. Este benefício será incluído no conjunto de medidas da Lei Maria da Penha.", "titulo_pt": "Projeto cria auxílio financeiro temporário para mulheres vítimas de violência", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 278467, "titulo": "Brasil corre contra o tempo para não perder único satélite de defesa", "url": "https://www.poder360.com.br/poder-infra/brasil-corre-contra-o-tempo-para-nao-perder-unico-satelite-de-defesa/", "fonte_id": "poder360", "data_pub": "2026-11-21T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo tem cerca de seis anos para substituir o único satélite responsável por comunicações críticas. O Brasil corre contra o tempo para não perder essa capacidade de defesa espacial.", "titulo_pt": "Brasil corre contra o tempo para não perder único satélite de defesa", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 278468, "titulo": "Infra em 1 Minuto: transportadoras tentam evitar revisão tarifária", "url": "https://www.poder360.com.br/poder-infra/infra-em-1-minuto-transportadoras-tentam-evitar-revisao-tarifaria/", "fonte_id": "poder360", "data_pub": "2026-11-21T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pedro Rodrigues, do CBIE, critica a pressão exercida por empresas de gás sobre a ANP e defende a independência da agência. Transportadoras tentam evitar uma revisão tarifária.", "titulo_pt": "Infra em 1 Minuto: transportadoras tentam evitar revisão tarifária", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 278544, "titulo": "Postura de Lula sobre STF depende de popularidade, diz especialista", "url": "https://www.cnnbrasil.com.br/politica/postura-de-lula-sobre-stf-depende-de-popularidade-diz-especialista/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-21T07:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um especialista avaliou que Lula pode apoiar acordos no STF que mantêm o status quo se sua popularidade estiver alta. A declaração foi feita por Leonardo Barreto, da Think Policy, ao World Wide.", "titulo_pt": "Postura de Lula sobre STF depende da popularidade, diz especialista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 278424, "titulo": "Comissão do PT que organiza posse de Lula avalia transferir gastos de festival para governo e criar feriado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/comissao-do-pt-que-organiza-posse-de-lula-avalia-transferir-gastos-de-festival-para-governo-e-criar-feriado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-21T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma comissão do PT que organiza a posse do presidente Lula planeja transferir os custos do festival musical para o governo federal. O objetivo é criar um feriado na data da posse, diferente do que ocorreu em 2023.", "titulo_pt": "Comissão do PT planeja transferir gastos do festival da posse de Lula para governo e criar feriado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 278425, "titulo": "Câmara envia ao Senado projeto que revoga Lei de Alienação Parental", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/camara-envia-ao-senado-projeto-que-revoga-lei-de-alienacao-parental.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-21T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara dos Deputados enviou ao Senado um projeto de lei que visa revogar a Lei de Alienação Parental. Este é um resumo da newsletter Todas, publicado em 11/21/2026 às 04h00.", "titulo_pt": "Câmara envia ao Senado projeto que revoga Lei de Alienação Parental", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 278504, "titulo": "Moraes manda PF prender goiano condenado a 14 anos pelos atos de 8/1", "url": "https://www.metropoles.com/colunas/manoela-alcantara/moraes-manda-pf-prender-goiano-condenado-a-14-anos-pelos-atos-de-8-1", "fonte_id": "metropoles", "data_pub": "2026-11-21T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O juiz federal Sérgio Moraes expediu um mandado de prisão contra Gibrail Pereira de Souza, um condenado a 14 anos de prisão por crimes cometidos durante os atos de 8 de março. Souza está sob monitória eletrônica.", "titulo_pt": "Moraes determina prisão de condenado por crimes dos atos de 8/3", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 278546, "titulo": "PGR avalia se relatórios da PF sobre ministros justificam investigação", "url": "https://www.cnnbrasil.com.br/politica/pgr-avalia-se-relatorios-da-pf-sobre-ministros-justificam-investigacao/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-21T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral da República (PGR) está avaliando se os relatórios da Polícia Federal (PF) sobre ministros do Supremo Tribunal Federal (STF) justificam a abertura de uma investigação. Os relatórios sobre ministros Moraes, Mendonça, Kassio e Toffoli estão sob análise, com prazo regimental de 15 dias, podendo ser prorrogado sem sanções. As menções a outros ministros já foram arquivadas por Fachin, pois não apresentaram indícios relevantes de relação com Vorcaro.", "titulo_pt": "PGR analisa relatórios da PF sobre ministros do stf", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 278752, "titulo": "Fight over fossil fuels leaves COP31 climate talks in deadlock", "url": "https://www.bbc.co.uk/news/articles/c6ly5w40eg07o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-21T09:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Países de quase 200 nações estão em impasse para tentar alcançar um novo acordo climático global. As negociações sobre o uso de combustíveis fósseis estão causando dificuldades nas discussões climáticas da COP31.", "titulo_pt": "Disputa sobre combustíveis fósseis deixa COP31 de acordo climático em impasse", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 278777, "titulo": "Denmark accuses Russia of assassination plot, expels diplomat", "url": "https://www.france24.com/en/denmark-accuses-russia-of-assassination-plot-expels-diplomat", "fonte_id": "france24", "data_pub": "2026-11-21T09:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Dinamarca acusa Moscou de estar por trás de um suposto tentativa de assassinato contra um rapper ucraniano-americano em Copenhague, aumentando as tensões entre a Europa e a Rússia. Como resposta, autoridades dinamarquesas ordenaram a expulsão de um diplomata russo e anunciaram restrições mais rigorosas para vistos de turismo para cidadãos russos.", "titulo_pt": "Dinamarca acusa Rússia de plano de assassinato e expulsa diplomata", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 278778, "titulo": "Houthis launch strikes on Saudi Arabia", "url": "https://www.france24.com/en/houthis-launch-strikes-on-saudi-arabia", "fonte_id": "france24", "data_pub": "2026-11-21T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Houthi rebeldes, apoiados pelo Irã, continuam a trocar disparos com a coalizão liderada por Arábia Saudita. A coalizão afirmou que interceptou e destruiu três mísseis balísticos lançados em direção a Riad no sábado de manhã, marcando o segundo ataque Houthis contra a capital saudita em dias recentes.", "titulo_pt": "Houthis lançam ataques contra arábia saudita", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 278779, "titulo": "Russian projectiles hit Poland as NATO tensions rise", "url": "https://www.france24.com/en/russian-projectiles-hit-poland-as-nato-tensions-rise", "fonte_id": "france24", "data_pub": "2026-11-21T09:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três projéteis russos caíram na Polônia, levando a condenações da OTAN como uma grave violação do espaço aéreo polonês. A tensão entre a Europa e a Rússia permanece alta, com tropas de oito países da OTAN em exercícios na Lituânia vizinha.", "titulo_pt": "Projetil russo atinge polônia como tensões da Otan aumentam", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 278532, "titulo": "Dois navios petroleiros sofrem ataques próximo ao Estreito de Ormuz", "url": "https://www.cnnbrasil.com.br/noticias/dois-navios-petroleiros-sofrem-ataques-proximos-ao-estreito-de-ormuz/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-21T09:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dois navios petroleiros sofreram ataques quase simultaneamente no Estreito de Ormuz. Não houve feridos e ainda não se conhece o impacto ambiental dos incidentes.", "titulo_pt": "Dois navios petroleiros sofrem ataques próximo ao Estreito de Ormuz", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 278872, "titulo": "Morta la stilista Raffaella Curiel", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/21/morta-la-stilista-raffaella-curiel_e89128b5-11eb-4019-8641-3e844d5ef397.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-21T09:46:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A estilista Raffaella Curiel faleceu. Ela tinha 83 anos.", "titulo_pt": "Morta a estilista Raffaella Curiel", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 278706, "titulo": "Rejoining EU ‘on the table’ as UK strikes deals on trade and young people", "url": "https://www.theguardian.com/politics/2026/nov/21/rejoining-eu-uk-trade-youth-deals-ed-miliband", "fonte_id": "guardian_world", "data_pub": "2026-11-21T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ed Miliband afirmou que todas as opções estão abertas em futuras negociações, incluindo a possibilidade do Reino Unido reentrar na União Europeia. Andy Burnham pode ter discussões informais com líderes europeus sobre o tema.", "titulo_pt": "Reingresso do reino unido na ue está na mesa após acordos sobre comércio e jovens", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 278781, "titulo": "EU, UK reach reset deal after Brexit", "url": "https://www.france24.com/en/eu-uk-reach-reset-deal-after-brexit", "fonte_id": "france24", "data_pub": "2026-11-21T09:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Reino Unido e a União Europeia assinaram três acordos durante uma cúpula em Bruxelas, visando reduzir burocracia para exportações de alimentos, conectar sistemas de troca de emissões e permitir que milhares de jovens trabalhem e vivam mais facilmente entre os dois lados do Canal da Mancha. Os acordos marcam um novo esforço para redefinir as relações após oBrexit.", "titulo_pt": "Reino unido e ue assinam acordos para redefinir relações após Brexit", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 278756, "titulo": "Deal with EU not dependent on tuition fees agreement, Miliband says", "url": "https://www.bbc.co.uk/news/articles/cm9w9p4geke8o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-21T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe da diplomacia britânica, Miliband, afirmou que um acordo com a União Europeia não depende de uma redução nas taxas de ensino para estudantes da UE no Reino Unido. Informações provenientes de Bruxelas sugeriam que a UE poderia não aplicar um acordo mais amplo até que as taxas fossem reduzidas para os estudantes europeus.", "titulo_pt": "Acordo com a ue não depende de acordo sobre taxas de ensino, diz Miliband", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 278753, "titulo": "FBI reportedly investigating apparent hack of its criminal database", "url": "https://www.bbc.co.uk/news/articles/cvze7de86pk3o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-21T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O FBI está investigando um suposto hacking do banco de dados criminal do National Crime Information Center, usado por órgãos de polícia federal e local para compartilhar informações.", "titulo_pt": "FBI investiga suposto hacking do banco de dados criminal", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 278814, "titulo": "Iran’s IRGC downs US drone over Hormuz as efforts to end war remain stalled", "url": "https://www.aljazeera.com/news/2026/11/21/irans-irgc-downs-us-drone-over-hormuz-as-efforts-to-end-war-remain-stalled?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-21T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Irã reiterou suas condições para o reabertura do Estreito de Ormuz, enquanto os Estados Unidos impuseram sanções a quatro iranianos acusados de serem 'guardiões do petróleo'. As negociações para encerrar a guerra permanecem estagnadas.", "titulo_pt": "Irã downeja drone dos EUA no estreito de Ormuz enquanto sanções são impostas e negociações se estagnam", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 278636, "titulo": "Trilateral en Shenzhen: la cumbre donde Trump presumió, Putin volvió y Xi ganó", "url": "https://elpais.com/internacional/2026-11-21/trilateral-en-shenzhen-la-cumbre-donde-trump-presumio-putin-volvio-y-xi-gano.html", "fonte_id": "elpais_america", "data_pub": "2026-11-21T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos recebeu tratamento favorável durante sua visita à China, após a derrota eleitoral no meio do mandato. Putin participou de uma cúpula tripartida em Shenzhen, enquanto Xi Jinping presidiu a reunião.", "titulo_pt": "Trilateral em Shenzhen: Trump foi agasalhado, Putin participou e Xi jinping liderou", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 278637, "titulo": "La histórica salida a Bolsa de Anthropic añade más riesgo al ecosistema de financiación circular de la IA", "url": "https://elpais.com/us/2026-11-21/la-historica-salida-a-bolsa-de-anthropic-anade-mas-riesgo-al-ecosistema-de-financiacion-circular-de-la-ia.html", "fonte_id": "elpais_america", "data_pub": "2026-11-21T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Anthropic realizou uma oferta inicial de ações, adicionando riscos à cadeia de financiamento circular entre grandes empresas de inteligência artificial. Essas empresas se relacionam entre si por meio de alianças que incluem a troca de financiamento, participação em capital e contratos de exclusividade.", "titulo_pt": "Saída à Bolsa da Anthropic aumenta riscos no ecosistema de financiamento circular da IA", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 278638, "titulo": "El requisito imposible que dejó a Colombia sin escudo antidrones", "url": "https://elpais.com/america-colombia/2026-11-21/el-requisito-imposible-que-dejo-a-colombia-sin-escudo-antidrones.html", "fonte_id": "elpais_america", "data_pub": "2026-11-21T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ministro de Defesa acusa seu antecessor de ter bloqueado a aquisição de sistemas antidrones. Documentos internos mostram que um comitê técnico da própria Força Pública foi o responsável por bloquear a compra, pois nenhum sistema atendia aos requisitos estabelecidos.", "titulo_pt": "Requisito impossível deixou colômbia sem escudo antidrones", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 278639, "titulo": "Los españoles en Latinoamérica votan con una urna separada por la Ley de Nietos", "url": "https://elpais.com/mexico/2026-11-21/los-espanoles-en-latinoamerica-votan-con-una-urna-separada-por-la-ley-de-nietos.html", "fonte_id": "elpais_america", "data_pub": "2026-11-21T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Miles de residentes no exterior podem votar a partir deste sábado em eleições latino-americanas, que estão sendo realizadas sob a Lei de Nietos, que suspendeu o voto para os nacionalizados por causa da Lei de Memória Democrática.", "titulo_pt": "Espanhóis no exterior podem votar em urnas separadas pela lei de Nietos", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 278649, "titulo": "La pareja chilena que, con humor negro, denuncia la “ceguera selectiva” sobre la salud de la mujer", "url": "https://elpais.com/chile/2026-11-21/la-pareja-chilena-que-con-humor-negro-denuncia-la-ceguera-selectiva-sobre-la-salud-de-la-mujer.html", "fonte_id": "elpais_america", "data_pub": "2026-11-21T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Endometriose, transtorno disfórico menstrual e migrañas são algumas das condições que demoram anos para serem diagnosticadas e tratadas. O médico Juan Villagra e a jornalista Patricia Mieres, baseados em suas experiências pessoais e profissionais, buscam, através da Escuela La Tribu, evitar que essas experiências se repitam.", "titulo_pt": "Ocasionalmente, a dupla chilena usa humor negro para denunciar a 'cegueira selectiva' em relação à saúde feminina", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 278543, "titulo": "Exôdo de ações tech anula ganhos do Nasdaq com temor sobre IA de volta", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/exodo-de-acoes-tech-anula-ganhos-do-nasdaq-com-temor-sobre-ia-de-volta/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-21T07:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há preocupações sobre como as políticas democratas poderiam afetar o ritmo de construção de data centers e sobre o futuro da Nvidia após a renúncia do CEO Jensen Huang. Essas incertezas estão levando a um exílio de ações de tecnologia que está anulando os ganhos do Nasdaq.", "titulo_pt": "Exílio de ações tech anula ganhos do Nasdaq com temor sobre IA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 278499, "titulo": "Escala de trabalho 5x2 começa a valer dia 16 de dezembro. Tire suas dúvidas", "url": "https://www.metropoles.com/brasil/escala-de-trabalho-5x2-comeca-a-valer-dia-16-de-dezembro-tire-suas-duvidas", "fonte_id": "metropoles", "data_pub": "2026-11-21T07:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A jornada de trabalho será reduzida para 42 horas a partir do dia 16 de dezembro, com duas folgas semanais e um novo cálculo para a hora extra. Este novo sistema visa esclarecer as principais dúvidas sobre a nova regra.", "titulo_pt": "Escala de trabalho 5x2 entra em vigor no dia 16 de dezembro. Respondendo suas dúvidas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 278438, "titulo": "Boeing não descarta novas demissões em meio a atraso na produção do 737 MAX", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/boeing-nao-descarta-novas-demissoes-em-meio-a-atraso-na-producao-do-737-max.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-21T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Boeing não confirmou se realizará novas demissões em massa após a próxima rodada de cortes, programada para 9 de dezembro. A empresa foi questionada sobre isso durante uma declaração feita na quinta-feira (19) em resposta a um sindicato da companhia.", "titulo_pt": "Boeing não descarta novas demissões em meio a atraso na produção do 737 MAX", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 278887, "titulo": "India wants the world’s pension billions. Will regulatory hurdles slow the bet?", "url": "https://www.scmp.com/week-asia/economics/article/3375263/india-wants-worlds-pension-billions-will-regulatory-hurdles-slow-bet", "fonte_id": "scmp", "data_pub": "2026-11-21T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Raghupati Mishra, um consultor de gestão e finanças de Mumbai, está satisfeito com a expressway de seis faixas entre Bhubaneswar e Chandikhole, operada por um importante fundo de pensão canadense, que facilitou seus viajantes para a divina Jagannath Temple. A estrada boa reduziu o tempo do trajeto para menos de uma hora.", "titulo_pt": "Índia quer bilhões de pensões do mundo. Barragens regulatórias frearão a aposta?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 278921, "titulo": "Korea Investment Holdings turns to Cardif Life after KDB deal falls through", "url": "https://www.koreaherald.com/article/10942860", "fonte_id": "korea_herald", "data_pub": "2026-11-21T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Korea Investment Holdings, em busca de entrar no mercado de seguros, buscou a adesão da Cardif Life Insurance, uma empresa menor do grupo BNP Paribas, após a falha na aquisição da KDB Life Insurance. A transação fornecerá ao grupo financeiro uma base de financiamento a longo prazo e criar synergias com suas operações existentes de corretagem e gestão de ativos.", "titulo_pt": "Korea Investment Holdings busca Cardif Life após fracasso na aquisição da KDB", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 278568, "titulo": "Transação tributária e devedor contumaz", "url": "https://www.jota.info/opiniao-e-analise/artigos/transacao-tributaria-e-devedor-contumaz", "fonte_id": "jota", "data_pub": "2026-11-21T06:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A proibição de transação com o devedor contumaz implica em identificar um inadimplemento caracterizado por dolo, má-fé e fraude, e avaliar os impactos arrecadatórios disso.", "titulo_pt": "Transação tributária e devedor contumaz", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 278555, "titulo": "Agenda de Lula não cabe na economia do Brasil, diz cientista político", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/agenda-de-lula-nao-cabe-na-economia-do-brasil-diz-cientista-politico/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-21T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cientista político Leonardo Barreto afirmou que o mau humor do mercado financeiro reflete a apreensão sobre as políticas fiscais e os impactos das propostas do governo para o setor produtivo. A agenda econômica do presidente Lula não se encaixa na atual situação econômica do Brasil, segundo Barreto.", "titulo_pt": "Agenda de Lula não se encaixa na economia do Brasil, diz cientista político", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 278796, "titulo": "Europe's cyber weak spot is the everyday businesses nobody thought to protect", "url": "https://www.cnbc.com/2026/11/21/cyber-attacks-fridges-cybersecurity.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-21T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vulnerabilidades conhecidas estão deixando pequenas empresas europeias cada vez mais expostas a ataques cibernéticos, devido à capacidade dos criminosos cibernéticos de operar de forma mais eficiente e rápida com a ajuda da inteligência artificial.", "titulo_pt": "O ponto fraco cibernético da Europa são as pequenas empresas que ninguém pensou em proteger", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 278797, "titulo": "An early breakdown in the polar vortex is threatening already depleted gas stocks", "url": "https://www.cnbc.com/2026/11/21/polar-vortex-europe-gas-prices.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-21T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O desmoronamento precoce do vórtice polar pode agravar a situação de estoques de gás já baixos na Europa. O clima mais frio e ventos mais lentos podem estressar o mercado de gás europeu, que começou o inverno com os níveis mais baixos de armazenamento em mais de uma década.", "titulo_pt": "Desmoronamento precoces do vórtice polar ameaçam estoques de gás já baixos na Europa", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 278569, "titulo": "A volta dos que não foram: a revogação do reporte obrigatório de sustentabilidade", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-volta-dos-que-nao-foram-a-revogacao-do-reporte-obrigatorio-de-sustentabilidade", "fonte_id": "jota", "data_pub": "2026-11-21T05:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute os argumentos a favor e contra a revogação do reporte obrigatório de sustentabilidade por parte da CVM, além de mencionar os pontos que ficaram de fora do debate.", "titulo_pt": "A volta dos que não foram: a revogação do reporte obrigatório de sustentabilidade", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 278848, "titulo": "CVC claims accounting manipulation in €3bn Advent pastry ingredients deal", "url": "https://www.ft.com/content/06999b01-07f1-44a1-8eab-a5d5e7ecd70f?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-21T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A CVC nega acusações de manipulação contábil relacionada à venda de uma empresa italiana para a Advent. A empresa americana afirma que o desempenho financeiro da Irca não foi exagerado antes do acordo de venda.", "titulo_pt": "CVC nega manipulação contábil em acordo de venda de €3bi da Advent para ingredientes de pastas da irca", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 278849, "titulo": "Builders bet on €620bn defence infrastructure boom in Europe", "url": "https://www.ft.com/content/b647fcba-e5e6-4ca2-8417-8c9146eac39e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-21T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas de construção estão focando em projetos militares para desenvolver bases, aeroportos e pontes na Europa, em uma tentativa de compensar o mercado residencial fraco.", "titulo_pt": "Construtoras apostam em boom de infraestrutura militar de €620bi na Europa", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 278570, "titulo": "Restrição de transferência sobre imóvel de terceiro não denunciado", "url": "https://www.jota.info/opiniao-e-analise/artigos/restricao-de-transferencia-sobre-imovel-de-terceiro-nao-denunciado", "fonte_id": "jota", "data_pub": "2026-11-21T04:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A restrição de transferência sobre um imóvel pertencente a um terceiro não notificado não pode criar responsabilidade objetiva em matéria penal. Qualquer tentativa de atribuir responsabilidade deve ser rejeitada.", "titulo_pt": "Restrição de transferência sobre imóvel de terceiro não notificado não gera responsabilidade penal", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 278441, "titulo": "Lula 4 terá, de saída, escalada de alimentos e queda na renda disponível das famílias", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/lula-4-tera-de-saida-escalada-de-alimentos-e-queda-na-renda-disponivel-das-familias.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-21T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma conjuntura desfavorável está se formando para as famílias brasileiras, com pressão nos preços dos alimentos e queda na renda disponível, em um cenário de desaceleração econômica e aumento das dívidas.", "titulo_pt": "Lula 4 terá, de saída, aumento dos preços dos alimentos e redução da renda disponível das famílias", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 278442, "titulo": "Nova pesquisa do IBGE pode ajudar a combater a pobreza", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/laura-machado/2026/11/nova-pesquisa-do-ibge-pode-ajudar-a-combater-a-pobreza.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-21T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa do IBGE pode fornecer informações cruciais sobre as condições financeiras das famílias mais pobres no Brasil, incluindo microempreendedores individuais e trabalhadores por aplicativo. Essas informações são essenciais para a elaboração de políticas públicas adequadas às necessidades desses grupos.", "titulo_pt": "Nova pesquisa do IBGE pode ajudar a combater a pobreza", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 278775, "titulo": "El curioso alivio de estar solo en recesión técnica", "url": "https://www.ciperchile.cl/2026/11/20/el-curioso-alivio-de-estar-solo-en-recesion-tecnica/?utm_source=rss&utm_medium=rss&utm_campaign=el-curioso-alivio-de-estar-solo-en-recesion-tecnica", "fonte_id": "ciper_chile", "data_pub": "2026-11-21T00:19:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto trata sobre um fenômeno incomum de alívio associado a estar em recuperação econômica durante uma recessão técnica.", "titulo_pt": "O curioso alívio de estar sozinho em uma recessão técnica", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 278566, "titulo": "Ataques cibernéticos, IA ou atualizações pendentes: o que há por trás da onda de apagões dos últimos dias", "url": "https://www.bbc.com/portuguese/articles/c3grendp775qo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-21T09:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Não há evidências de que os recentes problemas tecnológicos estejam relacionados, mas as ocorrências sucessivas podem causar preocupações. Microsoft, PHP, Java e o sistema de aviação estão entre os sistemas afetados.", "titulo_pt": "Ataques cibernéticos, IA ou atualizações pendentes: o que há por trás da onda de apagões dos últimos dias", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 278769, "titulo": "Wall Street reels as AI-linked companies spark massive sell-off in the US", "url": "https://www.lemonde.fr/en/economy/article/2026/11/21/wall-street-reels-as-ai-linked-companies-spark-massive-sell-off-in-the-us_6785968_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-21T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A bolsa de valores de Wall Street sofreu uma das piores semanas desde a crise do coronavírus, devido às preocupações sobre os modelos de negócios das principais empresas de tecnologia, incertezas sobre o futuro dos centros de dados e problemas enfrentados pela gigante Nvidia.", "titulo_pt": "Wall Street oscila com venda massiva de ações de empresas ligadas à IA nos EUA", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 278666, "titulo": "Popstars en la era IA", "url": "https://www.lanacion.com.ar/economia/negocios/popstars-de-la-era-ia-nid21112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-21T09:15:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A nova tecnologia promete sistemas cada vez mais autônomos, que podem substituir tarefas humanas, e o futuro parece depender mais do que nunca de líderes como Jensen Huang, Dario Amodei, Mark Zuckerberg, Peter Thiel e Elon Musk.", "titulo_pt": "Popstars na era da inteligência artificial", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 278916, "titulo": "Anthropic IPO success boosts hopes for OpenAI listing", "url": "https://www.koreaherald.com/article/10944733", "fonte_id": "korea_herald", "data_pub": "2026-11-21T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anthropic teve um debut na Nasdaq recorde, arrecadando $81,34 bilhões com uma oferta inicial de ações acima do esperado. O valor total do acordo, incluindo uma venda privada separada, foi de $107,34 bilhões. Apesar das preocupações sobre as avaliações do AI, o sucesso de Anthropic alimentou as expectativas de um IPO futuro para o rival OpenAI.", "titulo_pt": "Sucesso da IPO do anthropic alimenta expectativas de IPO do OpenAI", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 278918, "titulo": "Kona I turns payment cards into lifestyle accessories with first pop-up", "url": "https://www.koreaherald.com/article/10944725", "fonte_id": "korea_herald", "data_pub": "2026-11-21T07:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kona I inaugurou sua primeira loja pop-up, chamada Kona Card Atelier, no Hyundai Seoul em Yeouido, onde exibe mais de 100 cartões limitados, incluindo designs de ouro, joalheria e metais. A empresa busca atraír mais clientes de cartões metálicos e demonstrar suas capacidades de fabricação.", "titulo_pt": "Kona I transforma cartões de pagamento em acessórios de estilo de vida com seu primeiro pop-up", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 278886, "titulo": "Xi, Trump agree military AI decisions must involve humans, Bessent says", "url": "https://www.scmp.com/news/china/diplomacy/article/3375321/xi-trump-agree-military-ai-decisions-must-involve-humans-bessent-says", "fonte_id": "scmp", "data_pub": "2026-11-21T07:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Presidentes Xi Jinping e Donald Trump concordaram durante a cúpula do APEC que a tomada de decisões militares envolvendo IA deve sempre envolver humanos. Essa conclusão foi considerada um avanço no encontro entre os líderes chineses e americanos do dia anterior.", "titulo_pt": "Xi e Trump concordam que decisões militares com IA devem envolver humanos, diz tesoureiro americano", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 278890, "titulo": "UN talks pledge to draft ‘killer robot’ rules by 2028 after Russian pushback", "url": "https://www.scmp.com/news/world/europe/article/3375318/un-talks-pledge-draft-killer-robot-rules-2028-after-russian-pushback", "fonte_id": "scmp", "data_pub": "2026-11-21T06:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As discussões da ONU sobre o regulamento de armas com baixa ou nenhuma supervisão humana terminaram com um compromisso de discutir mais para elaborar novas regras em dois anos, resultado enfraquecido pela oposição da Rússia e decepcionante para os grupos de direitos humanos. Os defensores haviam solicitado regras legais dentro de um prazo mais curto para regular sistemas de armas que podem identificar e atingir alvos com diferentes níveis de autonomia, às vezes chamados de 'robôs assassinos'.", "titulo_pt": "Negociações da ONU prometem regras para 'robôs assassinos' até 2028, após rejeição russa", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 278891, "titulo": "Using IDs to check concert tickets, combat scalping could slow entry: tourism chief", "url": "https://www.scmp.com/news/hong-kong/hong-kong-economy/article/3375317/using-ids-check-concert-tickets-combat-scalping-could-slow-entry-tourism-chief", "fonte_id": "scmp", "data_pub": "2026-11-21T06:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A chefe da Cultura, Esportes e Turismo de Hong Kong, Rosanna Law Shuk-pui, alertou que exigir que fãs apresentem cartões de identidade que correspondam aos nomes em seus ingressos para concertos poderia retardar o acesso aos locais. Ela também mencionou que a cidade pode registrar cerca de 55 milhões de chegadas de visitantes este ano, 1,2 milhão a mais do que a estimativa anterior do governo de 53,8 milhões.", "titulo_pt": "Requisito de identificação pode atrasar entrada em concertos, diz chefe do turismo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 278892, "titulo": "China’s EV adoption rate to top 70% as petrol cars take brunt of drop in overall sales", "url": "https://www.scmp.com/business/china-business/article/3375236/chinas-ev-adoption-rate-top-70-petrol-cars-take-brunt-drop-overall-sales", "fonte_id": "scmp", "data_pub": "2026-11-21T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em novembro deste ano, sete em cada dez compradores de carros na China continental escolherão veículos elétricos (VEs), de acordo com uma consórcio da indústria. As vendas totais de veículos a gasolina diminuíram significativamente, enquanto as fabricantes chinesas de carros esperavam entregar 1,15 milhão de VEs (incluindo veículos elétricos puros e híbridos plug-in) para clientes na China continental, equivalente a 70,6% das vendas totais de carros.", "titulo_pt": "Adoção de ve atinge 70% no mercado chinês de carros em novembro", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 278908, "titulo": "(LEAD) Lee visits AI data center construction site in Ulsan", "url": "https://en.yna.co.kr/view/AEN20261121001051320", "fonte_id": "yonhap_news", "data_pub": "2026-11-21T05:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Lee Jae Myung visitou um site de construção de um centro de dados de inteligência artificial em Ulsan. A visita ocorreu em 21 de novembro em Seul, de acordo com a Yonhap.", "titulo_pt": "Lee visita site de construção de centro de dados de IA em Ulsan", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 278489, "titulo": "De que forma a inteligência artificial redefine o papel dos gestores nas empresas", "url": "https://exame.com/inteligencia-artificial/de-que-forma-a-inteligencia-artificial-redefine-o-papel-dos-gestores-nas-empresas/", "fonte_id": "exame", "data_pub": "2026-11-21T05:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisas mostram que o sucesso da inteligência artificial nas empresas depende da habilidade dos gestores em reorganizar processos, administrar riscos e preparar as equipes.", "titulo_pt": "Como a inteligência artificial está remodelando o papel dos gestores nas empresas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 278844, "titulo": "The AI cyber threat is already here", "url": "https://www.ft.com/content/3cf882c6-0be6-43f5-b01e-b6f765686c8b?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-21T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O perigo da ameaça cibernética por inteligência artificial já está presente. O conflito cibernético é apenas o começo.", "titulo_pt": "A ameaça cibernética da IA já chegou", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 278855, "titulo": "Anthropic’s post-debut stumble delivers reality check for AI trade", "url": "https://www.japantimes.co.jp/business/2026/11/21/markets/anthropic-ai-stocks/", "fonte_id": "japan_times", "data_pub": "2026-11-21T04:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A desaceleração significativa do mercado de AI demonstrou que, mesmo uma lista inicial bem-sucedida não foi capaz de dissipar a desconfiança que paira sobre o setor.", "titulo_pt": "Desempenho pós-listagem do AI oferece check de realidade para o mercado", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 278932, "titulo": "Nextlink launches AI transformation project as revenue reaches record high", "url": "https://www.digitimes.com/news/a20261119PD221/revenue-demand-business-growth-adoption.html", "fonte_id": "digitimes", "data_pub": "2026-11-21T04:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A demanda persistente pela adoção de nuvem empresarial e pela implementação de inteligência artificial levou a um aumento nas receitas das empresas que oferecem soluções de nuvem com inteligência artificial. A Nextlink, uma subsidiária de nuvem da Far EasTone Telecommunications, retornou à lucratividade operacional nos primeiros três trimestres de 2026 e registrou uma receita recorde de aproximadamente US$126 milhões, com um crescimento anual de 29,4%.", "titulo_pt": "Nextlink lança projeto de transformação por IA com receita recorde", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 278933, "titulo": "Apple's agent push turns operating-system access into AI's next battleground", "url": "https://www.digitimes.com/news/a20261120VL221/apple-apps-meta-siri.html", "fonte_id": "digitimes", "data_pub": "2026-11-21T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apple está intensificando sua investida no campo da inteligência artificial (IA), expôs uma nova disputa estratégica entre fornecedores de agências: a empresa que controla o sistema operacional pode eventualmente determinar o nível de autonomia que esses agentes têm. Com modelos de IA avançados capazes de navegar em sites, controlar aplicativos e executar tarefas multifacetadas, a luta pelo controle do sistema operacional pode se tornar um fator crucial na autonomia desses assistentes virtuais.", "titulo_pt": "Apple's push para IA cria novo campo de batalha na agência de agentes", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 278934, "titulo": "SolidWizard sees AI, semiconductor orders through 2027", "url": "https://www.digitimes.com/news/a20261118PD209/semiconductors-2027-investment-software-demand.html", "fonte_id": "digitimes", "data_pub": "2026-11-21T04:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A crescente investimento em inteligência artificial, semicondutores e computação de alto desempenho está impulsionando a demanda por software avançado, proporcionando à SolidWizard Technology, empresa de soluções de design 3D e inteligência artificial, uma visibilidade forte de pedidos de clientes de inteligência artificial e semicondutores até 2027. A receita consolidada da SolidWizard para os primeiros três trimestres de 2026 foi de NT$1,328 bilhão (US$40,4 milhões), um aumento de 13,61% em comparação com o mesmo período do ano anterior.", "titulo_pt": "Solidwizard vê pedidos de AI e semicondutores até 2027", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 278940, "titulo": "Opinion: How Kennedy and MAHA could help stop measles", "url": "https://www.statnews.com/2026/11/21/rfk-jr-maha-measles-outbreak-elimination-status-promote-mmr-vaccine/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-21T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kennedy e MAHA afirmam não serem anti-vacina. Eles podem provar isso promovendo a vacina MMR, escreve Brinda Adhikari.", "titulo_pt": "Opinião: como Kennedy e MAHA poderiam ajudar a parar a sarampo?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 278436, "titulo": "Pesquisadores vão investigar as raízes dos crânios devolvidos por Harvard ao Brasil", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/pesquisadores-vao-investigar-as-raizes-dos-cranios-devolvidos-por-harvard-ao-brasil.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-21T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dois crânios do século 19, supostamente de escravos, foram devolvidos pela Universidade Harvard ao Brasil. Agora, pesquisadores planejam examinar os crânios para obter informações sobre as pessoas e decidir sobre seu destino.", "titulo_pt": "Pesquisadores investigarão crânios devolvidos por Harvard ao Brasil", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 278920, "titulo": "Why do we drink coffee? It's about more than what's in the cup", "url": "https://www.koreaherald.com/article/10942866", "fonte_id": "korea_herald", "data_pub": "2026-11-21T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Peter Giuliano tem memórias iniciais de café ligadas ao seu avô, em sua infância em uma casa italiana imigrante nos Estados Unidos. Essa experiência pessoal de infância levou-o a uma carreira de quase quatro décadas no setor de café.", "titulo_pt": "Por que bebemos café? É mais do que o que está no copo", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 278981, "titulo": "SpaceX launches classified mission for US Space Force from California", "url": "https://www.space.com/space-exploration/launches-spacecraft/spacex-falcon-9-classified-space-force-launch-ussf-317", "fonte_id": "space_com", "data_pub": "2026-11-21T05:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX lançou uma missão classificada para o Exército Espacial dos Estados Unidos hoje (20 de novembro), enviando um carregamento desconhecido para a órbita a partir da costa central da Califórnia.", "titulo_pt": "Spacex realiza missão classificada para força espacial dos EUA da califórnia", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 278955, "titulo": "APOD: 2026 November 21 – Voyager’s Neptune", "url": "https://science.nasa.gov/image-article/apod-2026-november-21-voyagers-neptune/", "fonte_id": "nasa_news", "data_pub": "2026-11-21T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia da APOD em 2026, 21 de novembro, apresenta a Voyager's Neptune, capturado pela Voyager. O texto não fornece detalhes adicionais sobre a imagem.", "titulo_pt": "Imagem do dia: 21 de novembro de 2026 – neptuno por Voyager", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 278957, "titulo": "Math Puzzle: The longest shuffle", "url": "https://www.scientificamerican.com/article/math-puzzle-longest-shuffle/", "fonte_id": "scientific_american", "data_pub": "2026-11-21T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O desafio é encontrar a baralhada mais complexa ou trabalhosa possível.", "titulo_pt": "Puzzle matemático: o baralhamento mais trabalhoso", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 278943, "titulo": "What makes rock deep beneath continents break away and sink?", "url": "https://phys.org/news/2026-11-deep-beneath-continents.html", "fonte_id": "phys_org", "data_pub": "2026-11-21T04:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O processo de formação de montanhas geralmente é associado à elevação do terreno. No entanto, em algumas regiões geológicas, rochas densas na base da crosta podem se tornar instáveis, quebrar e descer por centenas de quilômetros até o manto, arrastando parte da crosta rígida da Terra (a litosfera) consigo. Seis imagens sísmicas sugerem que esse fenômeno, conhecido como derramamento litosférico, ocorreu sob os Andes centrais e a Sierra Nevada da Califórnia.", "titulo_pt": "O que faz as rochas profundas sob continentes se separarem e afundarem?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 278944, "titulo": "Device that measures strawberry skin's strength will aid breeders", "url": "https://phys.org/news/2026-11-device-strawberry-skin-strength-aid.html", "fonte_id": "phys_org", "data_pub": "2026-11-21T03:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um dispositivo desenvolvido por estudantes de engenharia da Universidade de Queensland permitirá que variedades de morangos mais resistentes sejam identificadas com mais facilidade. O protótipo mede a força da casca do morango, um fator importante na seleção genética para o programa de melhoramento genético de morangos da Departamento de Indústrias Primárias da Queensland, Austrália.", "titulo_pt": "Dispositivo que mede a força da casca do morango auxiliará na seleção genética", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 278945, "titulo": "Quantum software matches classical benchmark for a molecular interaction", "url": "https://phys.org/news/2026-11-quantum-software-classical-benchmark-molecular.html", "fonte_id": "phys_org", "data_pub": "2026-11-21T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A previsão de como moléculas interagem é crucial para a descoberta de novos medicamentos, fornecendo informações sobre a ação do medicamento no corpo humano e seus possíveis efeitos colaterais. Software quântico está se mostrando capaz de igualar os modelos clássicos computacionais em tais interações, mesmo quando as interações são complexas demais para serem tratadas por computadores convencionais.", "titulo_pt": "Software quântico atinge patamar clássico em interações moleculares", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 278946, "titulo": "The call of the seamount: Two new armored tardigrades described in the Atlantic", "url": "https://phys.org/news/2026-11-seamount-armored-tardigrades-atlantic.html", "fonte_id": "phys_org", "data_pub": "2026-11-21T02:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo internacional de pesquisadores, liderado pelo Senckenberg am Meer em Wilhelmshaven, descreveu duas novas espécies de tardígrados marinhos encontradas na sedimento do Senghor Seamount, próximo à costa de Cabo Verde. O estudo, que inclui descrições taxonômicas detalhadas das novas espécies, foi publicado na revista", "titulo_pt": null, "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 278477, "titulo": "‘A variante parece ter maior transmissibilidade’, diz infectologista sobre alta da covid-19", "url": "https://veja.abril.com.br/saude/a-variante-parece-ter-maior-transmissibilidade-diz-infectologista-sobre-alta-da-covid-19/", "fonte_id": "veja", "data_pub": "2026-11-21T00:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma variante da COVID-19, conhecida como Linhagem XFG ou Stratus, está aumentando a transmissão do vírus, de acordo com um infectologista. Essa linhagem responde por 90% das amostras analisadas pelo Ministério da Saúde.", "titulo_pt": "Infectologista destaca maior transmissibilidade da variante xfg", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 278947, "titulo": "Broadening the role of RNA: A messenger, a mediator and now a condensate coordinator", "url": "https://phys.org/news/2026-11-broadening-role-rna-messenger-condensate.html", "fonte_id": "phys_org", "data_pub": "2026-11-21T00:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novas pesquisas sobre condensados, compartimentos celulares que atuam como centros para facilitar reações biológicas, continuam a revelar insights novos sobre como as células funcionam. Amy Gladfelter, professora da Duke University e atual co-diretora do curso de fisiologia do MBL, e Dragomir Milovanovic, professor da Instituição de Bioquímica da Universidade de Berlim, que é ex-aluno do curso de fisiologia do MBL e ex-bolsista Whitman, estão entre os pesquisadores que estão avançando o campo.", "titulo_pt": "Expansão do papel da RNA: mensageira, mediadora e agora coordenadora de condensados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 278941, "titulo": "STAT+: FDA rejects Capricor Therapeutics’ Duchenne therapy, a decision that was a long time coming", "url": "https://www.statnews.com/2026/11/20/fda-rejects-capricor-duchenne-therapy/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-20T23:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA rejeitou uma terapia celular desenvolvida pela Capricor Therapeutics para pacientes com distrofia muscular de Duchenne.", "titulo_pt": "FDA rejeita terapia celular da Capricor Therapeutics para distrofia muscular de Duchenne", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 278948, "titulo": "'Forever' chemicals? Don't be so sure, says engineer", "url": "https://phys.org/news/2026-11-chemicals-dont.html", "fonte_id": "phys_org", "data_pub": "2026-11-20T22:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na planta de tratamento de água de Filtração Ashburton, em Baltimore, 14 estudantes da Universidade do Maryland observaram seis grandes tanques de cloro usados para desinfetar a água que chega do Reservatório Liberty antes de ser direcionada para as torneiras das casas locais. A água passa pelo processo de desinfecção para eliminar bactérias e outros patógenos.", "titulo_pt": "Químicos 'eternos'? Não seja tão certo, diz engenheiro", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 278972, "titulo": "Mathematicians are amazed by ‘holy grail’ proof of Riemann hypothesis", "url": "https://www.newscientist.com/article/2600235-mathematicians-are-amazed-by-holy-grail-proof-of-riemann-hypothesis/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-20T22:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Matemáticos expressaram admiração, incerteza e pelo menos uma declaração de que têm uma prova concorrente em andamento após se espalhar a notícia de que um pesquisador Anthropic utilizou IA para encontrar uma resposta a uma das questões mais antigas do campo da matemática.", "titulo_pt": "Matemáticos impressionados com 'graal' prova da hipótese de Riemann", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 278956, "titulo": "Curiosity Spots Drifting Twilight Clouds", "url": "https://science.nasa.gov/photojournal/curiosity-spots-drifting-twilight-clouds/", "fonte_id": "nasa_news", "data_pub": "2026-11-20T22:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A rover Curiosity da NASA capturou nuvens que se moviam no entardecer em 31 de outubro de 2026, durante o 5.061º dia do seu missionário em Marte. Essas nuvens, conhecidas como nuvens do entardecer, aparecem apenas por um curto período no outono no Crater Gale.", "titulo_pt": "Curiosity captura nuvens do entardecer em marte", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 278958, "titulo": "Maren Hassinger Won’t Be Weighed Down", "url": "https://www.artnews.com/art-in-america/aia-reviews/maren-hassinger-bampfa-retrospective-berkeley-1234806748/", "fonte_id": "artnews", "data_pub": "2026-11-21T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A retrospectiva de Maren Hassinger na Berkeley Art Museum and Pacific Film Archive destaca sua paixão por metais e movimento.", "titulo_pt": "Maren Hassinger não será pesação", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 278610, "titulo": "Concepción, capital del rock chileno: la música como sello de identidad penquista", "url": "https://www.latercera.com/esto-es-chile/biobio/noticia/concepcion-capital-del-rock-chileno-la-musica-como-sello-de-identidad-penquista/", "fonte_id": "la_tercera", "data_pub": "2026-11-21T09:15:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa realizada pelo Esto es Chile em Biobío mostrou que 21% dos habitantes de Concepción consideram o rock e a música como um dos principais símbolos da cidade, acima do Salto do Laja, Lota e os clubes de futebol. Esta tradição remonta aos anos 1960 e inclui artistas como Los Tres, Los Bunkers e De Saloon como protagonistas.", "titulo_pt": "Concepción, capital do rock chileno: música como sinal de identidade penquista", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 278612, "titulo": "Ed Sheeran llega a Chile: cómo intentó sacudirse de la mayor crisis de su carrera", "url": "https://www.latercera.com/culto/noticia/ed-sheeran-llega-a-chile-en-medio-de-la-mayor-polemica-de-su-carrera-macklemore-palestina-renuncias-y-presiones/", "fonte_id": "la_tercera", "data_pub": "2026-11-21T09:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A decisão de Ed Sheeran de não incluir o rapper americano em seus shows por suas declarações sobre Palestina levantou questionamentos e cancelamentos. O incidente precede os dois shows do britânico no Estadio Bicentenario de La Florida no fim de semana.", "titulo_pt": "Ed Sheeran chega ao Chile: como sua decisão afastou um rapper dos shows e gerou questionamentos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 278959, "titulo": "Light in the dark: 20 long books for short winter days", "url": "https://www.theguardian.com/books/ng-interactive/2026/nov/21/light-in-the-dark-20-long-books-for-short-winter-days", "fonte_id": "guardian_culture", "data_pub": "2026-11-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto sugere que é hora de se dedicar a grandes e importantes livros literários, como Underworld de Don DeLillo e The Luminaries de Eleanor Catton, durante os dias mais curtos do outono. O objetivo é se acomodar com um bom livro enquanto o outono se transforma no inverno.", "titulo_pt": "Luz na escuridão: 20 longos livros para dias curtos de outono", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 278960, "titulo": "‘In the office, there was a sharp intake of breath’: why has the BBC decided to celebrate Christmas earlier than ever?", "url": "https://www.theguardian.com/tv-and-radio/2026/nov/21/why-bbc-showing-christmas-shows-earlier-than-ever", "fonte_id": "guardian_culture", "data_pub": "2026-11-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O BBC iPlayer está disponibilizando programas especiais de Natal a partir de 27 de novembro, um mês antes da exibição na televisão. Essa mudança marca uma datação mais precoce do Natal nos programas da BBC, que tradicionalmente acontecia apenas nas semanas que antecedem o dia 25.", "titulo_pt": "Na BBC, programas de natal estão sendo lançados no iplayer muito antes da data oficial", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 278967, "titulo": "‘Trust was hard won’: Bell Pond, summer 1983, Worcester, Massachusetts – in pictures", "url": "https://www.theguardian.com/artanddesign/gallery/2026/nov/21/bell-pond-monograph-stephen-dirado-photographer", "fonte_id": "guardian_culture", "data_pub": "2026-11-21T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Stephen DiRado, um fotógrafo, visitou um lago público chamado Bell Pond em Worcester, Massachusetts, durante um período de calor intenso. Ele continuou a voltar e tirar fotos íntimas da comunidade trabalhadora local.", "titulo_pt": "‘Confiança foi conquistada com esforço’: bell Pond, verão de 1983, Worcester, Massachusetts – em imagens", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 278853, "titulo": "Susumu Hirasawa’s -will-have-no-idea-what-is-happening-in-this-sci-fi-sequel-why-is-it-even-on-tv", "fonte_id": "guardian_culture", "data_pub": "2026-11-21T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O filme 'Blade Runner 2099' é considerado difícil de seguir para os espectadores, oferecendo um enredo complexo e personagens com pouca visibilidade. O autor questiona por que franquias populares como James Bond não foram adaptadas para a televisão, sugerindo que tal adaptação poderia ser excessiva para o público.", "titulo_pt": "Blade Runner 2099: fãs não entenderão o que está acontecendo nesta sequência de ficção científica. Por que está na TV?", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 278506, "titulo": "Menescal, Danilo Caymmi e Patty Ascher trazem essência da Bossa Nova ao DF", "url": "https://www.metropoles.com/metropoles-music/bossa-nova", "fonte_id": "metropoles", "data_pub": "2026-11-21T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Roberto Menescal, Danilo Caymmi e Patty Ascher participam do Festival Estilo Brasil, trazendo a essência da Bossa Nova. Menescal explica como o termo Bossa Nova surgiu na década de 1950.", "titulo_pt": "Menescal, Danilo Caymmi e Patty Ascher apresentam Bossa Nova no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 278963, "titulo": "Hungry for action? Our critics’ verdicts on the week’s UK cinema releases", "url": "https://www.theguardian.com/film/ng-interactive/2026/nov/21/hungry-for-action-our-critics-verdicts-on-the-weeks-uk-cinema-releases", "fonte_id": "guardian_culture", "data_pub": "2026-11-21T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Filmes como 'Hunger Games: Caça ao Jogador', 'Elizabeth Holmes de Perto', 'Helen Mirren como Patricia Highsmith' e 'A Ajuda de Maradona' estão entre as últimas estreias no cinema britânico.", "titulo_pt": "Famélicos por ação? A avaliação dos críticos sobre as últimas est
