talhes exatos dos acontecimentos, enquanto as manifestações continuam violentas em todo o país. Em outro desenvolvimento, a Coreia do Norte parece estar surpresa com os resultados da explosão no DMZ e com as operações de desminagem realizadas pelo Sul, segundo relatos da Yonhap News. Além disso, a Ucrânia tem impedido as tentativas de Moscou de cercar as cidades fortificadas no Donbas. Moscou afirma que a captura da região é inevitável. Por fim, o presidente dos Estados Unidos, Joe Biden, anunciou um acordo voluntário entre grandes empresas de inteligência artificial para o uso de controles internos, auditorias externas e supervisão por conselhos de administração, mas o acordo não cria um sistema legal de fiscalização comparável.\n\nA Rússia está sendo acusada de usar uma estratégia de terror na Ucrânia, segundo a presidente da Comissão Europeia, Ursula von der Leyen, após ataques em várias cidades ucranianas. Além disso, relatos indicam um ataque com faca em uma escola técnica na Polônia, que deixou pelo menos sete pessoas feridas. Em contraste, o governo francês suspendeu o uso de granadas de choque pela polícia durante as manifestações estudantis. O conflito na Faixa de Gaza continua, com ataques israelenses que resultaram em pelo menos quatro mortes palestinas, incluindo um trabalhador da Defesa Civil, um menino e outra pessoa. O filme 'Naza', que aborda o uso de inteligência artificial por Israel para matar civis em Gaza, será lançado no Brasil. A Coreia do Sul pediu desculpas à Coreia do Norte por um acidente com uma mina terrestre, enquanto Israel realizou cerimônias para marcar o terceiro aniversário do ataque ao festival Nova, que desencadeou a guerra no Gaza. Além disso, a China inaugurou sua terceira base militar no exterior, desta vez em Laos, enquanto a Grã-Bretanha declarou o sionismo como uma forma de racismo, com a Green Party votando para declarar o sionismo como uma forma de racismo.", "economia": "A economia mundial enfrenta diversos desafios, como a crise hídrica na Tailândia, que já resultou em 60 mortes e causou danos significativos à economia local, sobrecarregando a capital Bangkok. O Banco Central da Índia aumentou pela primeira vez desde 2023 a taxa de juros em resposta à inflação e ao crescimento econômico do país. A Shell prevê margens de refino recordes devido à guerra prolongada no Oriente Médio, que elevou os preços do petróleo. A diretora-gerente do FMI, Kristalina Georgieva, alertou sobre ameaças à economia global, incluindo a alta dos juros a longo prazo nos Estados Unidos e Japão, e a dívida pública recorde. O governo de Lula vetou as apostas online, liberando aproximadamente R$ 40 bilhões por ano no orçamento das famílias, mas a circulação de links de apostas ilegais manteve-se estável, contrariando as expectativas. A Agência Nacional do Petróleo realiza dois leilões com 326 blocos de petróleo, considerados os maiores já realizados, incluindo áreas no pré-sal e na Bacia do Ceará. O preço do petróleo aumentou devido a preocupações com ataques hutitas à Arábia Saudita e ameaças de ataques a navios-pipa no Estreito de Ormuz. Agentes de inteligência artificial podem custar a bancos cerca de 500 bilhões de dólares, mas também beneficiarão as instituições. Um estrangeiro investiu R$ 10 bilhões na bolsa após o primeiro turno das eleições, o maior aporte diário do ano. O conflito alheio oferece ao Brasil a oportunidade de investir em pesquisa e desenvolvimento de defesa. A indústria relojoeira suíça está encolhendo, mas os relógios estão se tornando mais luxuosos, com modelos desejados frequentemente entrando em lista de espera. Os aeroportos da Zurich Airport Brasil estão recuperando a demanda perdida devido ao impacto da guerra no Irã. Uma forte onda de vendas de títulos do governo dos EUA está afetando o setor corporativo, obrigando empresas a reformular seus planos de financiamento. A fortuna de André Esteves aumentou em US$ 2,7 bilhões devido à euforia do mercado financeiro local. A Segunda Turma do TST condenou a CRBS S.A., empresa do grupo Ambev, a pagar adicional de periculosidade a um vendedor que usava motocicleta diariamente no trabalho. A tributação foi listada como a prioridade número um pelas empresas para o próximo governo, segundo uma sondagem do FGV Ibre. Uma entidade de supervisão no Japão realizou uma busca em quatro grandes fabricantes de cerveja suspeitas de terem formado uma aliança para estabelecer preços de cerveja. A Comissão Europeia está avaliando a possibilidade de impor uma taxa geral a todas as grandes empresas para evitar a isenção de grupos de serviços digitais americanos. A Blue Owl está planejando intensificar sua presença no setor de seguros. A fiscalização intensificada tem abalado os mais ricos da China e as empresas em Hong Kong, Singapura e Tóquio que administram seus recursos financeiros. Após o governo de Lula vetar as apostas online, pelo menos 36 das 188 marcas autorizadas iniciaram rodadas de demissões. A BMW está produzindo sua próxima geração de automóveis em uma fábrica centenária no centro de Munique, apostando no sucesso da Série 3 para enfrentar a crise do setor na Alemanha.", "tecnologia": "A Europa enfrenta desafios para se tornar uma líder global em tecnologia, conforme destacado pela DIGITALEUROPE. A região abriga muitas empresas promissoras, mas ainda há um longo caminho a percorrer para transformá-las em players internacionais. Em outra notícia, a AMD, liderada por Lisa Su, enfatiza a importância da Coreia do Sul como parceiro estratégico para processadores de inteligência artificial. Por outro lado, a Coreia do Sul está investindo em tecnologia espacial, com o lançamento bem-sucedido do foguete Nuri, indicando um movimento para uma indústria espacial integrada no país. No setor de semicondutores, a Samsung planeja pagar um bônus especial aos funcionários da sua divisão de semicondutores em 2027, enquanto a MintNeuro, uma spin-off da Imperial College London, levantou $5 milhões para desenvolver chips especializados para dispositivos neurais. Além disso, a startup Atoco desenvolveu máquinas que capturam água do ar em climas extremamente secos, utilizando materiais especializados. Em um contexto mais amplo, a inteligência artificial está ganhando destaque, com a Common Sense Media considerando que ChatGPT para adolescentes é um 'risco inaceitável'. A Ploomes, uma startup de CRM, investiu R$ 25 milhões em inteligência artificial para desenvolver o Estúdio IA, que personaliza o CRM e otimiza as operações comerciais.", "ciencia": "O Prêmio Nobel de Química de 2026 foi concedido a Henri B. Kagan e Kenso Soai, por suas descobertas sobre efeitos não-lineares e autocatálise na síntese orgânica assímetrica, que têm impacto significativo na farmacologia. Essa pesquisa permitiu às moléculas 'escolherem um lado', revolucionando a produção de medicamentos e sendo crucial para o desenvolvimento de novos tratamentos contra o câncer. Além disso, a NASA divulgou uma imagem impressionante do amanhecer em Marte, capturada pelo rover Curiosity, mostrando a luz do sol banhando rochas antigas formadas há bilhões de anos. Estudos chineses também indicaram que um sistema de míssil com o mais recente sistema de detecção por laser (lidar) poderia detectar e rastrear um caça F-35 a uma distância de até 61,5 km, além do desenvolvimento de um relógio atômico mais preciso do mundo.", "cultura": "O Festival de Vinhos e Gastronomia de Hong Kong, que acontecerá no final de outubro, terá horário estendido até 1h da manhã em duas noites e contará com 10% a mais de estandes, anunciou o Turismo de Hong Kong. Além disso, o mês de novembro será dedicado a um mês gourmet para aumentar o gasto dos visitantes e incentivar estadias mais longas. Em outro evento cultural, a 27ª edição do Festival Satyrianas, em São Paulo, apresentará mais de 400 atrações, incluindo peças de teatro, danças e filmes, entre sexta-feira (9) e segunda-feira (12), em locais próximos à praça Franklin Roosevelt, na Consolação, São Paulo. O festival celebra a cultura de São Paulo e a cidade de São Paulo, com destaque para o trabalho dos Satyros, que organizam o evento.", "sociedade": "Trabalhadores da Minera Centinela, filiada ao grupo Luksic, iniciaram uma greve após as negociações não terem chegado a um acordo, acusando a empresa de praticar discriminação salarial contra os empregados. Em outra notícia, a mãe do filho e da nora localizou os corpos deles mortos a facadas em João Pessoa, Paraíba, após perder contato com os dois. O funeral do tio de Guilherme Boulos, que faleceu após ser atropelado em São Paulo, está programado para acontecer nesta quarta-feira (7/10). A Polícia Federal realiza uma operação no Aeroporto Internacional de Guarulhos na quarta-feira (7/10) para combater o tráfico de cocaína envolvendo terceirizados do local. Além disso, a discussão sobre a revogação da lei da alienação parental continua, alegando possíveis abusos em casos de disputas familiares. João Munhoz Neto, namorado de Isabelle Caracristi, foi indiciado por violência psicológica e fraude processual no caso da morte da vítima, de 22 anos.", "meio_ambiente": "Um tribunal australiano decidiu que a aprovação do aumento da mina de carvão de MACH Energy em Hunter Valley, NSW, é inválida, estabelecendo um importante precedente para casos ambientais. Um parlamentar australiano acredita que advogados devem aproveitar este julgamento para intervir judicialmente contra aprovações de carvão. Segundo médicos, a fumaça de queimadas pode alcançar os alvéolos e entrar na corrente sanguínea, acentuando a importância de medidas preventivas como lavagens nasais e umidificadores. O aquecimento global e o uso humano da água estão levando ao encolhimento do Mar do Cáspio, com partes do norte do mar enfrentando uma situação semelhante à do Mar Aral, levantando preocupações sobre a segurança da infraestrutura energética nos Estados Unidos, já que severos temporais estão se tornando uma crescente ameaça para a infraestrutura energética e centrais de dados.", "direitos_humanos": "Em um caso individual, uma garota de 13 anos de Tuvalu pediu aos líderes mundiais que agissem sobre o clima, destacando a urgência das mudanças climáticas para países vulneráveis. Além disso, em Israel, foram relatadas 263 mortes de jornalistas e trabalhadores de mídia em três anos, segundo o diretor da Oficina de Mídia do Governo de Gaza, denunciando uma violência sistemática contra a liberdade de imprensa. Em outro desenvolvimento, Christa Pike, uma mulher que sobreviveu a uma execução fracassada nos EUA, permanece consciente e recebe cuidados médicos intensivos. Seus advogados pedem que as autoridades preservem evidências da execução falhada. Por fim, em um julgamento, a Disney afirmou que o ex-presidente dos Estados Unidos, Donald Trump, praticava censura e violava a Constituição ao pressionar a empresa a alterar decisões editoriais, alegando medo de represálias e dano irreparável."}, "resumo_do_dia": {"politica_nacional": [{"id": 200040, "titulo": "Lula faz novo ataque a Flávio: \"Defendam o Brasil da família Bolsonaro\"", "url": "https://www.metropoles.com/brasil/lula-faz-novo-ataque-a-flavio-defendam-o-brasil-da-familia-bolsonaro", "fonte_id": "metropoles", "data_pub": "2026-10-07T11:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva (PT) publicou um vídeo no aplicativo X criticando Flávio Bolsonaro, filho do presidente Jair Bolsonaro, em uma nova ofensiva contra a família Bolsonaro.", "titulo_pt": "Lula ataca Flávio Bolsonaro: 'defendam o Brasil da família Bolsonaro'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 200017, "titulo": "Flávio Bolsonaro mira mais apoios do Centrão; Lula faz reunião por ofensiva nas redes", "url": "https://veja.abril.com.br/politica/flavio-bolsonaro-mira-mais-apoios-do-centrao-lula-faz-reuniao-por-ofensiva-nas-redes/", "fonte_id": "veja", "data_pub": "2026-10-07T11:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro busca apoios do Centrão para sua campanha, já tendo o endosso de União Brasil e PP, e aguardando o Republicanos. Jair Bolsonaro realiza uma reunião com lideranças políticas da esquerda para uma ofensiva nas redes sociais.", "titulo_pt": "Flávio Bolsonaro busca apoios do Centrão; jair Bolsonaro reúne campeões de votos da esquerda", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 200120, "titulo": "Fraude no INSS: MPF denuncia 35 pessoas por desvio de R$ 86 milhões em MG", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/mg/fraude-no-inss-mpf-denuncia-35-pessoas-por-desvio-de-r-86-milhoes-em-mg/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-07T10:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público Federal denunciou 35 pessoas por fraude no INSS no estado de Minas Gerais, onde desviaram R$ 86 milhões. O grupo criou identidades fictícias para obter benefícios assistenciais voltados para idosos, e o esquema durou mais de 20 anos.", "titulo_pt": "Fraude no INSS: MPF denuncia 35 pessoas por desvio de R$ 86 milhões em MG", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 199907, "titulo": "A nudez das licitações de concessão de saneamento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/mauricio-portugal-ribeiro/2026/10/a-nudez-das-licitacoes-de-concessao-de-saneamento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entre março e setembro, três leilões de saneamento fracassaram: a PPP de esgoto de 216 municípios de Goiás, a PPP de esgoto do Ceará e a concessão de 40 municípios de Rondônia. Estes leilões vazios ocorreram em um setor que desde 2020 vinha registrando ágios de três dígitos, sugerindo problemas nos editais e contratos.", "titulo_pt": "A nudez das licitações de saneamento", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 199908, "titulo": "Aurora Coop capta R$ 300 mi do BNDES para expandir exportações", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/aurora-coop-capta-r-300-mi-do-bndes-para-expandir-exportacoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Aurora Coop, uma das maiores cooperativas agroindustriais do país, recebeu aprovação para um financiamento de R$ 300 milhões do BNDES para expandir suas exportações. Os recursos fazem parte do Plano Brasil Soberano, criado pelo governo federal para proteger a indústria nacional de sanções comerciais.", "titulo_pt": "Aurora Coop recebe R$ 300 mi do BNDES para expandir exportações", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 200155, "titulo": "Carf afasta extensão de coisa julgada e mantém cobrança de IPI sobre filial da Havan", "url": "https://www.jota.info/tributos/carf-afasta-extensao-de-coisa-julgada-e-mantem-cobranca-de-ipi-sobre-filial-da-havan", "fonte_id": "jota", "data_pub": "2026-10-07T09:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho Administrativo de Recursos Fiscais (Carf) decidiu não estender a coisa julgada e manteve a cobrança do IPI sobre a filial da Havan. O estabelecimento principal não alcança o centro de distribuição devido à autonomia tributária.", "titulo_pt": "Carf mantém cobrança de IPI sobre filial da Havan", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 199909, "titulo": "Senador eleito em MT, Mauro Mendes (União Brasil) critica fim da 6x1 e defende modelo de trabalho dos EUA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/senador-eleito-em-mt-mauro-mendes-uniao-brasil-critica-fim-da-6x1-e-defende-modelo-de-trabalho-dos-eua.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador eleito Mauro Mendes (União Brasil) criticou o fim da escala 6x1 e propôs mudanças na legislação trabalhista brasileira, usando como exemplo o modelo dos Estados Unidos. As declarações foram feitas em uma entrevista coletiva após uma reunião com representantes do PL e da coligação do União.", "titulo_pt": "Senador eleito critica fim da 6x1 e defende modelo trabalhista dos EUA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 199936, "titulo": "Bancada evangélica perde força na Alesp, com 12 deputados não reeleitos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/bancada-evangelica-perde-forca-na-alesp-com-12-deputados-nao-reeleitos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-07T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A bancada de deputados evangélicos na Assembleia Legislativa de São Paulo (Alesp) deve perder influência no próximo mandato, após 12 deputados não serem reeleitos nas últimas eleições.", "titulo_pt": "Bancada evangélica perde força na Alesp, com 12 deputados não reeleitos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 200156, "titulo": "Reformismo fraco não afasta a crise do Supremo", "url": "https://www.jota.info/opiniao-e-analise/colunas/america-latina-democracia-incompleta/reformismo-fraco-nao-afasta-a-crise-do-supremo", "fonte_id": "jota", "data_pub": "2026-10-07T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto sugere que a adoção do modelo da Suprema Corte dos Estados Unidos não resolve a questão de legitimidade do Supremo Tribunal Federal no Brasil.", "titulo_pt": "Reformismo fraco não resolve problema de legitimidade do stf", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 200157, "titulo": "Até o processo tem regras", "url": "https://www.jota.info/opiniao-e-analise/artigos/ate-o-processo-tem-regras", "fonte_id": "jota", "data_pub": "2026-10-07T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) extrapola frequentemente o objeto dos processos em reclamações, embargos e decisões monocráticas, segundo a fonte.", "titulo_pt": "Até o processo tem regras", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 200158, "titulo": "O interesse recursal das empresas contratadas nos Tribunais de Contas", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-interesse-recursal-das-empresas-contratadas-nos-tribunais-de-contas", "fonte_id": "jota", "data_pub": "2026-10-07T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As empresas contratadas podem recorrer nos Tribunais de Contas mesmo que não tenham causado a irregularidade. Elas têm interesse e legitimidade para fazer isso.", "titulo_pt": "Interesse recursal das empresas contratadas nos Tribunais de Contas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 200138, "titulo": "'Desafio de Flávio é ser presidente de direita normal', avalia economista Samuel Pessôa", "url": "https://www.bbc.com/portuguese/articles/crn8w7jw76djo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-07T08:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O economista Samuel Pessôa avaliou que, se eleito, Flávio Bolsonaro terá uma relação pacífica com o mercado financeiro, enquanto Lula enfrentará pressões para ajustar as contas públicas.", "titulo_pt": "Desafio de Flávio é ser presidente de direita normal, diz economista", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 199937, "titulo": "'Canetada do TSE foi mortal para Lula e afetou eleições nos estados', diz marqueteiro de Douglas Ruas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/canetada-do-tse-foi-mortal-para-lula-e-afetou-eleicoes-nos-estados-diz-marqueteiro-de-douglas-ruas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-07T07:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O marqueteiro Paulo Vasconcelos afirmou que a decisão do TSE de alterar as regras do debate da TV Globo afetou os resultados das eleições em favor do senador Flávio Bolsonaro e seus aliados nos estados. Este marqueteiro atribuiu a este 'canetismo' o impacto negativo na campanha do candidato Douglas Ruas.", "titulo_pt": "Canetada do TSE foi decisiva para flávio bolsonaro e afetou eleições nos estados, afirma marqueteiro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 199915, "titulo": "Entenda julgamento no STF sobre reajuste de planos de saúde de idosos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/entenda-julgamento-no-stf-sobre-reajuste-de-planos-de-saude-de-idosos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal decidiu sobre a possibilidade de reajuste de mensalidades de planos de saúde para idosos, considerando contratos assinados antes de 2004. A decisão afeta tanto os beneficiários de planos antigos quanto as operadoras de saúde, estabelecendo regras para os valores a serem ressarcidos.", "titulo_pt": "Entenda julgamento no STF sobre reajuste de planos de saúde de idosos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 199916, "titulo": "O que pode mudar com o fim da escala 6x1? Senado retoma discussão nesta quarta-feira (7)", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/o-que-pode-mudar-com-o-fim-da-escala-6x1-senado-retoma-discussao-nesta-quarta-feira-7.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado retoma a discussão sobre a PEC 221, que propõe a escala 5x2 sem diminuir o salário, após o fim da escala 6x1. A PEC também reduz a jornada de trabalho para 40 horas semanais.", "titulo_pt": "O que pode mudar com o fim da escala 6x1? Senado retoma discussão nesta quarta-feira", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 199938, "titulo": "Centrão se alinha à direita e passa a defender impeachment de ao menos um ministro do STF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/centrao-se-alinha-a-direita-e-passa-a-defender-impeachment-de-ao-menos-um-ministro-do-stf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-07T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Integrantes do Centrão aderiram à agenda do PL e passaram a defender o impeachment de um ministro do STF para 'equilibrar os Poderes' e conter o uso político de investigações contra parlamentares. O movimento ocorre após partidos de direita crescerem no Congresso.", "titulo_pt": "Centrão adere à agenda do pl e defende impeachment de ministro do STF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 200402, "titulo": "Chemistry Nobel awarded for solving mystery of life's asymmetry", "url": "https://www.bbc.co.uk/news/articles/c6ly038jg0d4o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-07T11:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O prêmio Nobel de Química foi concedido aos cientistas franceses e japoneses por resolver o mistério da assimetria da vida.", "titulo_pt": "Nobel de química concedido por resolver mistério da assimetria da vida", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 200474, "titulo": "Germany: Ex-spy chief sent to pretrial detention on treason charges", "url": "https://www.dw.com/en/germany-ex-spy-chief-sent-to-pretrial-detention-on-treason-charges/a-79576300?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-10-07T11:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "August Hanning, ex-chefe de inteligência, foi detido preventivamente após sua prisão na terça-feira. O caso levantou questionamentos sobre a transparência quando ex-agents deixam o governo.", "titulo_pt": "Alemanha: ex-chefe de inteligência detido preventivamente por acusações de traição", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 200283, "titulo": "Russia ‘pursuing strategy of terror’, EU’s von der Leyen says after deadly strikes on Ukraine – Europe live", "url": "https://www.theguardian.com/world/live/2026/oct/07/russia-ukraine-war-zelenskyy-putin-france-protests-europe-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-10-07T11:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A presidente da UE, Ursula von der Leyen, afirma que a Rússia está adotando uma estratégia de terror após ataques em várias cidades ucranianas. Além disso, relatos indicam um ataque com faca em uma escola técnica em Ostrołęka, Polônia, que deixou pelo menos sete pessoas feridas, incluindo duas gravemente.", "titulo_pt": "Ue: Rússia adota estratégia de terror após ataques em Ucrânia; polônia registra novo ataque", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 200599, "titulo": "Mercedes chiude un 'trimestre record' per i veicoli elettrici, +61%", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/07/mercedes-chiude-un-trimestre-record-per-i-veicoli-elettrici-61_fe972e52-77c8-4d56-b964-15e7188ef94c.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-07T11:41:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Mercedes encerrou um trimestre com vendas recorde de veículos elétricos. Os pedidos para os modelos CLA, GLC, GLB e GLA esgotaram para todo o ano de 2026 e foram estendidos até 2027.", "titulo_pt": "Mercedes encerra trimestre com vendas recorde de veículos elétricos, +61%", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 200233, "titulo": "Premio Nobel de Química para Henri Kagan y Kenso Soai por arrojar luz en el misterio de las asimetrías de la naturaleza", "url": "https://elpais.com/ciencia/2026-10-07/premio-nobel-de-quimica.html", "fonte_id": "elpais_america", "data_pub": "2026-10-07T11:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Real Academia de Ciências da Suécia concedeu o Prêmio Nobel de Química a Henri Kagan e Kenso Soai por sua contribuição na compreensão das asimetrias na natureza, o que é crucial para a produção de fármacos.", "titulo_pt": "Prêmio Nobel de Química para Henri Kagan e Kenso Soai por esclarecer o mistério das asimetrias na natureza", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 200600, "titulo": "Georgieva (Fmi), allarme sul debito, i governi davanti a scelte 'molto dure'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/07/georgieva-fmi-allarme-sul-debito-i-governi-davanti-a-scelte-molto-dure_485243c5-d289-497b-86ac-4a3b3b40db4a.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-07T11:40:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A diretora gerente do FMI, Georgieva, alerta sobre o risco de dívida e as decisões difíceis que os governos enfrentam. É urgente reconstituir espaço fiscal para enfrentar o choque energético que aumenta os custos.", "titulo_pt": "Georgieva alerta sobre risco de dívida e decisões difíceis dos governos", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 200601, "titulo": "Firmato contratto per dirigenti medici, fino a 560 euro al mese in più", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/07/firmato-contratto-per-dirigenti-medici-fino-a-560-euro-al-mese-in-piu_d336921c-b8d9-46d0-b2a6-0f4e5f74bf47.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-07T11:37:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O contrato foi assinado envolvendo 138 mil profissionais de saúde, médicos, enfermeiros, veterinários e outras profissões relacionadas à saúde, estendendo um benefício financeiro de até 560 euros mensais.", "titulo_pt": "Contrato assinado para diretores médicos, com adicional de até 560 euros mensais", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 200301, "titulo": "Malawians Struggle to Survive After Fleeing Anti-Immigrant Violence", "url": "https://www.nytimes.com/2026/10/07/world/africa/malawi-returnees-south-africa.html", "fonte_id": "nyt_world", "data_pub": "2026-10-07T11:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias milhares de malawianos retornaram a Malawi devido à violência anti-imigrante na África do Sul, interrompendo fluxos financeiros essenciais e deixando famílias com dificuldades para se alimentar.", "titulo_pt": "Malawianos lutam para sobreviver após fugirem da violência anti-imigrante na áfrica do sul", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 200397, "titulo": "France halts use of stun grenades after boy's hand blown off in student protests", "url": "https://www.bbc.co.uk/news/articles/cqzjx7z2r4gko?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-07T11:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A França suspendeu o uso de granadas de choque após reclamações de que a polícia usou força excessiva contra adolescentes durante as manifestações estudantis. Um menino teve a mão cortada por uma granada de choque, o que levou à medida.", "titulo_pt": "França suspende uso de granadas de choque após acidente com menino", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 200153, "titulo": "JOTA Principal | Flávio Bolsonaro celebra desempenho do PL no Legislativo e promete ‘mudar a Constituição’", "url": "https://www.jota.info/newsletters/jota-principal/flavio-bolsonaro-mudar-a-constituicao", "fonte_id": "jota", "data_pub": "2026-10-07T11:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, candidato do PL, fez um discurso após receber apoio formal de Ronaldo Caiado e da federação União Brasil–PP.", "titulo_pt": "Flávio Bolsonaro comemora desempenho do PL no Legislativo e promete alterar a Constituição", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 200602, "titulo": "Annotazioni false, indagati 8 agenti della polizia locale di Rimini", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/07/annotazioni-false-indagati-8-agenti-della-polizia-locale-di-rimini_9397e234-3d33-488f-8b44-777cba9dd20e.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-07T11:27:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Oito agentes da polícia local de Rimini foram acusados de falsidade, violência privada, calúnia e lesões. Foi solicitada a aplicação de medidas interditivas.", "titulo_pt": "Anotações falsas, investigados 8 agentes da polícia local de Rimini", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 200399, "titulo": "Trump to speak to Putin about plague lab worker's death in Russia", "url": "https://www.bbc.co.uk/news/articles/cqgm0vrl3xp7o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-07T11:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há preocupações de que a morte possa ter sido causada por pneumonia bubônica, levantando pedidos de maior transparência da Rússia. Trump está previsto para conversar com Putin sobre o caso do trabalhador do laboratório.", "titulo_pt": "Trump vai conversar com Putin sobre morte de trabalhador em laboratório de plaga na Rússia", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 200522, "titulo": "US military aid to Israel continues three years into Gaza genocide", "url": "https://www.aljazeera.com/news/2026/10/7/how-us-military-aid-to-israel-continues-three-years-into-gaza-genocide?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-07T11:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ajuda militar e as transferências de armas para Israel continuam inalteradas. Enquanto a opinião pública americana muda.", "titulo_pt": "Ajuda militar dos EUA a Israel continua três anos após genocídio no Gaza", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 200549, "titulo": "Forty percent of US Latinos report being worse off financially than a year ago", "url": "https://english.elpais.com/economy-and-business/2026-10-07/forty-percent-of-us-latinos-report-being-worse-off-financially-than-a-year-ago.html", "fonte_id": "elpais_en", "data_pub": "2026-10-07T11:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa da UnidosUS revela que 83% dos hispanófones nos Estados Unidos consideram o custo de vida como sua principal preocupação. Os latinos formam um eleitorado decisivo em 12 das 37 distritos mais competitivos.", "titulo_pt": "Quarenta por cento de Latinos americanos relatam estar pior financeiramente há um ano", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 200294, "titulo": "Ukraine Claws Back Land in the Donbas, Thwarting a Russian Push", "url": "https://www.nytimes.com/2026/10/07/world/europe/ukraine-battlefield-operation-vivaldi.html", "fonte_id": "nyt_world", "data_pub": "2026-10-07T11:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kyiv tem impedido até o momento as tentativas de Moscou de cercar as cidades fortificadas ucranianas no Donbas. Moscou afirma que a captura da região é inevitável.", "titulo_pt": "Ucrânia restaura terras no Donbas, fracassando o avanço russo", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 200290, "titulo": "U.S. Formally Seeks Information From Russia About Possible Plague Death", "url": "https://www.nytimes.com/2026/10/07/world/europe/russia-plague-us-trump-state-department.html", "fonte_id": "nyt_world", "data_pub": "2026-10-07T11:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos formalmente solicitaram informações à Rússia sobre um possível óbito por peste. A falta de detalhes das autoridades russas tem preocupado os funcionários dos EUA e outras partes do mundo.", "titulo_pt": "EUA formalmente solicitam informações à Rússia sobre possível óbito por peste", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 200641, "titulo": "‘Nothing is left’: deadly floods slam Thai economy and strain Bangkok ahead of IMF meeting", "url": "https://www.scmp.com/week-asia/health-environment/article/3370074/nothing-left-deadly-floods-slam-thai-economy-and-strain-bangkok-ahead-imf-meeting?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-07T11:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Floods em monção na Tailândia já resultaram em 60 mortes desde meados de setembro, causando danos econômicos significativos, como a destruição de residências e cultivos, a morte de animais e a inundações em fábricas. A capital Bangkok enfrentou fortes chuvas em 300mm em apenas três dias no final de setembro, sobrecarregando seu sistema de drenagem.", "titulo_pt": "Nada resta: inundações monçonicas atingem a economia tailandesa e sobrecarregam Bangkok antes da reunião do fmi", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 199901, "titulo": "BC da Índia aumenta taxa de juros pela primeira vez desde 2023", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/10/01/6562-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post467441", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T11:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O banco central da Índia aumentou pela primeira vez desde 2023 a taxa de juros, devido à aceleração da inflação, alta dos preços globais da energia e ao forte crescimento econômico do país.", "titulo_pt": "BC da Índia aumenta taxa de juros pela primeira vez desde 2023", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 199902, "titulo": "Shell prevê margens de refino recordes com guerra duradoura no Oriente Médio", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/shell-preve-margens-de-refino-recordes-com-guerra-duradoura-no-oriente-medio.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T11:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Shell espera que as margens de refino no terceiro trimestre atinjam US$ 42 por barril, um recorde histórico, devido à guerra prolongada no Oriente Médio que reduziu o abastecimento de combustíveis e elevou os preços.", "titulo_pt": "Shell prevê margens de refino recorde com guerra no Oriente Médio", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 199903, "titulo": "Chefe do FMI vê economia mundial ameaçada por guerra, IA e dívida pública recorde", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/chefe-do-fmi-ve-economia-mundial-ameacada-por-guerra-ia-e-divida-publica-recorde.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T11:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A diretora-gerente do FMI, Kristalina Georgieva, alertou que a economia mundial enfrenta ameaças devido aos preços elevados da energia, à dívida pública recorde e aos riscos associados ao crescimento dos investimentos em inteligência artificial.", "titulo_pt": "Chefe do FMI vê economia mundial ameaçada por alta dos preços, dívida e IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 199904, "titulo": "Veto às bets pode liberar até R$ 40 bilhões por ano no orçamento das famílias", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/veto-as-bets-pode-liberar-ate-r-40-bilhoes-por-ano-no-orcamento-das-familias.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo de Luiz Inácio Lula da Silva vetou as apostas online, conhecidas como bets, e isso pode liberar aproximadamente R$ 40 bilhões por ano no orçamento das famílias, estimado como o valor que os apostadores perderam com as empresas autorizadas até então.", "titulo_pt": "Veto às bets pode injetar até R$ 40 bilhões por ano no orçamento das famílias", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 199906, "titulo": "Circulação de links de bets ilegais fica estável após veto de Lula, mostra levantamento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/circulacao-de-links-de-bets-ilegais-fica-estavel-apos-veto-de-lula-mostra-levantamento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A circulação de links de plataformas de apostas ilegais no WhatsApp e no Telegram manteve-se estável nos dez primeiros dias após a proibição das apostas online. Este resultado contraria as expectativas de representantes do setor, que temiam que a medida ampliasse o mercado ilegal.", "titulo_pt": "Circulação de links de apostas ilegais fica estável após veto de Lula, mostra levantamento", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 199976, "titulo": "Aneel adia discussão sobre fim de contrato com a Enel em São Paulo", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/aneel-adia-discussao-sobre-fim-de-contrato-com-enel-em-sao-paulo", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-07T10:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Agência Nacional de Energia Elétrica (Aneel) adiou o julgamento sobre a suspensão do contrato de concessão com a Enel SP, que distribui energia na região metropolitana de São Paulo, para uma reunião em 60 dias. O adiamento ocorreu após um pedido de vista de um diretor da Aneel.", "titulo_pt": "Aneel adia julgamento sobre fim de contrato com Enel em São Paulo", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 199977, "titulo": "ANP espera leiloar mais de 320 blocos de petróleo nesta quarta", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/anp-espera-leiloar-mais-de-320-blocos-de-petroleo-nesta-quarta", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-07T10:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Agência Nacional do Petróleo, Gás Natural e Biocombustíveis (ANP) realiza dois leilões nesta quarta-feira (7), oferecendo 326 blocos de exploração e produção de petróleo e gás natural. Os leilões são considerados os maiores já realizados pela agência e incluem áreas no pré-sal e na Bacia do Ceará, Margem Equatorial.", "titulo_pt": "ANP realiza leilões com mais de 320 blocos de petróleo nesta quarta", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 200615, "titulo": "IMF chief concerned about high Japan and U.S. long-term rates", "url": "https://www.japantimes.co.jp/business/2026/10/07/imf-chief-concern-rates/", "fonte_id": "japan_times", "data_pub": "2026-10-07T10:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A chefe do FMI, Kristalina Georgieva, expressou preocupação com o aumento das taxas de juros a longo prazo no Japão, que atingiram seu nível mais alto em cerca de 30 anos. Ela também mencionou que as taxas de juros a longo prazo nos Estados Unidos estão elevadas.", "titulo_pt": "Chefe do fmi preocupada com altas taxas de juros a longo prazo no Japão e EUA", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 200470, "titulo": "Oil rises as concerns over Houthi attacks on Saudi Arabia eclipse supply recovery", "url": "https://www.cnbc.com/2026/10/07/oil-prices-today-brent-wti-hormuz.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-07T08:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O preço do petróleo aumentou devido às preocupações com os ataques dos hutitas a Saudi Arabia e com as ameaças de ataques a navios-pipa no Estreito de Ormuz por parte da Irã, o que reavivou as preocupações sobre a segurança das suprimentos petrolíferos.", "titulo_pt": "Oleo sobe devido a preocupações com ataques hutitas e ameaças iranianas", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 200560, "titulo": "AI agents could cost banks $500bn — by winning savers better rates", "url": "https://www.ft.com/content/a21ec190-edcd-454e-886a-302b0a16ea82?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-07T08:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Agentes de inteligência artificial podem custar a bancos cerca de 500 bilhões de dólares, ao ganhar melhores taxas para poupanças. No entanto, os bancos também beneficiarão da adoção de AI.", "titulo_pt": "Agentes de IA podem custar bancos us$ 500 bilhões — ao ganhar melhores taxas para poupanças", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 200071, "titulo": "Estrangeiro despeja R$ 10 bi na bolsa após 1º turno, maior aporte diário do ano", "url": "https://exame.com/invest/mercados/estrangeiro-despeja-r-10-bi-na-bolsa-apos-1o-turno-maior-aporte-diario-do-ano/", "fonte_id": "exame", "data_pub": "2026-10-07T08:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estrangeiro investiu R$ 10 bilhões na bolsa após o primeiro turno das eleições, o maior aporte diário do ano. Este fluxo superou o total de setembro e equivale a um quarto do investimento estrangeiro no mercado ao longo de todo o ano.", "titulo_pt": "Estrangeiro despeja R$ 10 bi na bolsa após 1º turno, maior aporte diário do ano", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 200159, "titulo": "O conflito alheio é a chance do Brasil", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-conflito-alheio-e-a-chance-do-brasil", "fonte_id": "jota", "data_pub": "2026-10-07T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil tem a oportunidade de investir em pesquisa e desenvolvimento de defesa enquanto outros países se dedicam à produção de armas.", "titulo_pt": "O conflito alheio é a chance do Brasil", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 200160, "titulo": "Privatização afasta débito em favor da ex-estatal, mas não sanção no TCU", "url": "https://www.jota.info/opiniao-e-analise/colunas/controle-publico/privatizacao-afasta-debito-em-favor-da-ex-estatal-mas-nao-sancao-no-tcu", "fonte_id": "jota", "data_pub": "2026-10-07T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A privatização de uma empresa estatal reduz o débito, mas não resolve a questão da sanção no Tribunal de Contas da União (TCU). O texto questiona a utilidade de manter a competência sancionadora sem que haja ressarcimento financeiro.", "titulo_pt": "Privatização reduz débito, mas não resolve sanção no TCU", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 199911, "titulo": "A indústria relojoeira suíça está encolhendo, mas também está ficando mais rica e luxuosa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/a-industria-relojoeira-suica-esta-encolhendo-mas-tambem-esta-ficando-mais-rica-e-luxuosa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A indústria relojoeira suíça está encolhendo, mas os relógios estão se tornando mais luxuosos. Comprar um Rolex requer frequentemente entrar em uma lista de espera, pois os modelos desejados não estão disponíveis imediatamente e o preço médio de varejo é de cerca de 14 mil francos suíços (R$ 83,7 mil).", "titulo_pt": "A indústria relojoeira Suíça está encolhendo, mas ficando mais luxuosa", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 199912, "titulo": "Aeroportos recuperam demanda após impacto da guerra, diz CEO da Zurich Airport", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/10/aeroportos-recuperam-demanda-apos-impacto-da-guerra-diz-ceo-da-zurich-airport.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os aeroportos da Zurich Airport Brasil estão recuperando a demanda perdida devido ao impacto da guerra do Irã, que aumentou o preço do QAV e afetou a oferta de voos. O CEO da companhia, Ricardo Gesse, fez essa declaração em uma entrevista à Folha.", "titulo_pt": "Aeroportos da Zurich Airport Brasil recuperam demanda após impacto da guerra, afirma CEO", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 200642, "titulo": "Hong Kong tech index to harness fast-growth companies in bid for better performance", "url": "https://www.scmp.com/business/markets/article/3370073/hong-kong-tech-index-harness-fast-growth-companies-bid-better-performance?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-07T11:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa que compila o índice de ações de Hong Kong incluirá 10 empresas tecnológicas em rápido crescimento com pelo menos 500 milhões de Hong Kong dollars em vendas anuais no índice tecnológico da cidade, em uma tentativa de revitalizar o índice que tem perdido performance em relação aos pares globais. A medida faz parte de uma série de novas ações para reformar o Hang Seng Tech Index.", "titulo_pt": "Índice de tecnologia de hong Kong vai incorporar empresas em rápido crescimento para melhorar desempenho", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 200722, "titulo": "Samsung Electronics to pay chip division special bonus in spring 2027", "url": "https://www.koreaherald.com/article/10896185", "fonte_id": "korea_herald", "data_pub": "2026-10-07T11:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Samsung Electronics planeja pagar um novo bônus especial de desempenho aos funcionários da sua divisão de semicondutores em março ou abril de 2027, após aprovação na assembleia geral de acionistas marcada para março do mesmo ano. Os detalhes sobre o pagamento, as regras de elegibilidade e as condições financeiras foram informados aos funcionários na tarde desta semana.", "titulo_pt": "Samsung Electronics vai pagar bônus especial para divisão de chips em 2027", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 200804, "titulo": "MintNeuro raises $5M to scale chips purpose-built for neural devices", "url": "https://tech.eu/2026/10/07/mintneuro-raises-5m-to-scale-chips-purpose-built-for-neural-devices/", "fonte_id": "tech_eu", "data_pub": "2026-10-07T11:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "MintNeuro, uma spinoff da Imperial College London que desenvolve chips especializados para dispositivos neurais, incluindo implantes e wearables, levantou $5 milhões para acelerar sua escala comercial. A empresa está desenvolvendo tecnologia para esse propósito específico.", "titulo_pt": "Mintneuro arrecada $5 milhões para escalar chips especializados para dispositivos neurais", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 199905, "titulo": "'Para mudar tecnologia, é preciso mudar quem a faz', diz brasileira destaque em lista de IA pela Time", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/para-mudar-tecnologia-e-preciso-mudar-quem-a-faz-diz-brasileira-destaque-em-lista-de-ia-pela-time.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-07T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A brasileira destacada na lista de IA pela Time afirma que mudanças tecnológicas requerem a mudança na composição do setor. Ela sugere o uso de modelos de código aberto e a capacitação de grupos sub-representados para tornar o mercado de inteligência artificial mais inclusivo e menos dependente de corporações estrangeiras.", "titulo_pt": "Para mudar tecnologia, é preciso mudar quem a faz", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 200744, "titulo": "OpenAI Wants Its New Agent to Run Your Life. Mine Said It Loved Me", "url": "https://www.wired.com/story/openai-wants-its-new-agent-to-run-your-life-mine-said-it-loved-me/", "fonte_id": "wired", "data_pub": "2026-10-07T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O agente criado pela OpenAI está projetado para automatizar tarefas online, como a compra de móveis. Durante a experiência inicial, o assistente sempre ativo apresentou bugs e não conseguiu completar um captcha.", "titulo_pt": "Openai quer que seu novo agente gerencie sua vida online. O meu disse que Me amava", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 200805, "titulo": "DIGITALEUROPE: Europe can’t regulate its way to tech leadership", "url": "https://tech.eu/2026/10/07/digitaleurope-europe-cant-regulate-its-way-to-tech-leadership/", "fonte_id": "tech_eu", "data_pub": "2026-10-07T10:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Europa possui muitas empresas tecnológicas promissoras, mas transformá-las em players globais continua sendo um desafio persistente. Cecilia Bonefeld-Dahl, diretora-geral da DIGITALEUROPE, aborda esse problema.", "titulo_pt": "Europa não pode se tornar líder em tecnologia apenas por meio de regulamentação", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 200746, "titulo": "A Mysterious Nonprofit Run by SpaceXAI’s Top Lawyer Is Paying the Salaries of Government Workers", "url": "https://www.wired.com/story/mysterious-nonprofit-spacexai-national-design-studio-elon-musk-doge/", "fonte_id": "wired", "data_pub": "2026-10-07T10:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A National Design Studio é uma organização sem fins lucrativos liderada pelo chefe jurídico da SpaceXAI que está pagando os salários de funcionários do governo. A WIRED descobriu que alguns membros da National Design Studio estão em empréstimo de uma organização sem fins lucrativos gerida pela SpaceXAI.", "titulo_pt": "Orgânica sem fins lucrativos, dirigida pelo advogado de IA da spacex, paga salários de funcionários do governo", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 200328, "titulo": "Could the future of AI be determined by Florida Republicans?", "url": "https://www.vox.com/politics/505319/ron-desantis-ai-james-uthmeier-openai-lawsuit", "fonte_id": "vox", "data_pub": "2026-10-07T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois republicanos da Flórida propuseram uma visão alternativa para o futuro do Partido Republicano em relação à inteligência artificial, enquanto o presidente Donald Trump defendia que o partido se posicionasse fortemente a favor de AI.", "titulo_pt": "O futuro da IA poderia ser determinado pelos republicanos da flórida?", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 200396, "titulo": "Conflict in the Red Sea is forcing cloud giants to find a new route for the internet", "url": "https://restofworld.org/2026/google-meta-red-sea-subsea-cables-houthi-yemen/?utm_source=rss&utm_medium=rss&utm_campaign=feeds", "fonte_id": "rest_of_world", "data_pub": "2026-10-07T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 12 de setembro de 2026, pescadores motorizados passavam por um navio comercial ancorado perto da costa do Iêmen, nas águas do Estreito de Bab al-Mandeb, crucial para exportações de petróleo saudita. Desde 11 de setembro de 2026, os hutis, apoiados pelo Irã, controlam uma ilha chamada Mayyun no meio do estreito, aumentando a tensão na região.", "titulo_pt": "Conflito no mar vermelho força gigantes da nuvem a encontrar novo caminho para a internet", "veiculo": "Rest of World", "pais": "EUA", "classe": "A"}, {"id": 200747, "titulo": "A Startup Has a Plan to Make Water From Air Using Data Centers’ Waste Heat", "url": "https://www.wired.com/story/startup-atoco-makes-water-from-air-using-data-centers/", "fonte_id": "wired", "data_pub": "2026-10-07T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup Atoco desenvolveu máquinas que podem capturar água do ar em climas extremamente secos sem a necessidade de energia elétrica. Essas máquinas utilizam materiais especializados para recolher água mesmo em ambientes com ar muito seco.", "titulo_pt": "Startup tem plano de produzir água do ar usando calor residual de centrais de dados", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 200673, "titulo": "Micron's Taiwan union wins strike vote with 99% support", "url": "https://www.digitimes.com/news/a20261007PD252/micron-taiwan-strike-labor-ceo.html", "fonte_id": "digitimes", "data_pub": "2026-10-07T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um sindicato na unidade de Taoyuan da Micron Technology em Taiwan obteve o direito de parar as atividades e estabelecer linhas de greve. Os votos foram contados na noite de 6 de outubro, após seis dias de votação com 99% do suporte.", "titulo_pt": "Sindicato da micron technology em Taiwan ganha direito a greve com 99% do apoio", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 200616, "titulo": "Topix’s largest-ever overhaul to cull hundreds of Japan stocks", "url": "https://www.japantimes.co.jp/business/2026/10/07/topix-revamp-cull-stocks/", "fonte_id": "japan_times", "data_pub": "2026-10-07T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Japan Exchange Group anunciou que 683 empresas estão sendo preparadas para serem removidas do Topix devido a novas regras de inclusão mais rigorosas.", "titulo_pt": "Maior reformulação da topix catará centenas de empresas japonesas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 200706, "titulo": "Lee calls for further advances in satellite technology after watching Nuri launch", "url": "https://en.yna.co.kr/view/AEN20261007010000315", "fonte_id": "yonhap_news", "data_pub": "2026-10-07T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Lee Jae Myung pediu avanços adicionais em tecnologia de satélites após assistir ao lançamento do Nuri.", "titulo_pt": "Lee pede avanços em tecnologia de satélites após assistir ao lançamento do Nuri", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 200726, "titulo": "AI glasses solve Suneung question during parliamentary audit, raising cheating concerns", "url": "https://www.koreaherald.com/article/10896147", "fonte_id": "korea_herald", "data_pub": "2026-10-07T09:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O deputado do Partido Democrático da Coreia, Kim Moon-soo, usou óculos inteligentes para resolver uma pergunta do exame de entrada universitário durante uma auditoria parlamentar. O ministro da Educação, Choi Kyo-jin, informou que o governo está preparando diretrizes para identificar óculos inteligentes antes do exame Suneung, mas não deu detalhes sobre a implementação.", "titulo_pt": "Óculos inteligentes resolvem questão do exame Suneung durante auditoria parlamentar, gerando preocupações sobre fraude", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 200415, "titulo": "3 years later, Netanyahu faces reckoning over Oct. 7 in Israeli election", "url": "https://www.axios.com/2026/10/07/netanyahu-oct-7-warning-israel-election-polls", "fonte_id": "axios", "data_pub": "2026-10-07T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israel está comemorando o terceiro aniversário dos ataques terroristas de 7 de outubro, três semanas antes de uma eleição onde o ex-presidente Benjamin Netanyahu enfrentará uma avaliação crucial de sua responsabilidade pela pior falha de segurança da história do país. As pesquisas sugerem que ele pode manter seu cargo, mas a data continua sendo um fator significativo na campanha.", "titulo_pt": "3 Anos depois, Netanyahu enfrenta julgamento sobre os ataques de outubro", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 200416, "titulo": "\"Not safe for kids\": advocacy group urges OpenAI to keep teens off ChatGPT", "url": "https://www.axios.com/2026/10/07/chatgpt-teens-safety-risk-common-sense-media", "fonte_id": "axios", "data_pub": "2026-10-07T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Common Sense Media está pedindo a OpenAI que impeça os adolescentes de usar ChatGPT, afirmando que o novo experiência para adolescentes apresenta um 'Risco Indevido'. Testes extensos revelaram falhas nas medidas de proteção projetadas para proteger os usuários mais jovens.", "titulo_pt": "Não seguro para crianças: grupo de advocacy pede que OpenAI impeça adolescentes de usar ChatGPT", "veiculo": "Axios", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 200760, "titulo": "ER visits from people born outside the U.S. dropped after ICE raids", "url": "https://www.statnews.com/2026/10/07/health-news-er-visits-from-people-born-outside-the-u-s-dropped-after-ice-raids/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-07T11:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa mostrou que as visitas de pessoas nascidas fora dos Estados Unidos a três urgências de Los Angeles diminuíram drasticamente após as operações de detenção da ICE aumentarem no ano anterior.", "titulo_pt": "Visitas a urgências de pessoas nascidas fora dos EUA diminuíram após operações da ICE", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 200767, "titulo": "'Real opportunity' to boost low-carbon European holidays", "url": "https://phys.org/news/2026-10-real-opportunity-boost-carbon-european.html", "fonte_id": "phys_org", "data_pub": "2026-10-07T11:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores afirmam que os turistas britânicos e o setor turístico têm uma 'verdadeira oportunidade' de migrar para férias de baixo carbono na Europa.", "titulo_pt": "Verdadeira oportunidade para férias de baixo carbono na Europa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 200306, "titulo": "El chileno que abrió una nueva luz en la investigación sobre el cáncer", "url": "https://www.latercera.com/lt-board/noticia/el-chileno-que-abrio-una-nueva-luz-en-la-investigacion-sobre-el-cancer/", "fonte_id": "la_tercera", "data_pub": "2026-10-07T11:36:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Rodrigo Aguilar, um investigador do Instituto de Ciências Biomédicas da Universidad Andrés Bello, dedicou sua carreira a estudar o ácido ribonucleico (ARN), que pode ser crucial na criação de novos medicamentos contra o câncer.", "titulo_pt": "O chileno que abriu uma nova luz na pesquisa sobre o câncer", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 200212, "titulo": "El Premio Nobel de Química 2026 fue para los científicos Henri B. Kagan y Kenso Soai", "url": "https://www.lanacion.com.ar/sociedad/el-premio-nobel-de-quimica-2026-fue-para-henri-b-kagan-y-kenso-soai-nid07102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-07T11:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Prêmio Nobel de Química de 2026 foi concedido aos cientistas Henri B. Kagan e Kenso Soai. Este é o terceiro anúncio de prêmios Nobel desta semana, com o Prêmio Nobel de Literatura previsto para ser anunciado na próxima terça-feira.", "titulo_pt": "Prêmio Nobel de Química 2026 foi para Henri B. Kagan e Kenso Soai", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 200768, "titulo": "Plants, people and progress for native prairie seeds", "url": "https://phys.org/news/2026-10-people-native-prairie-seeds.html", "fonte_id": "phys_org", "data_pub": "2026-10-07T11:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há esforços em andamento em grande parte do centro dos Estados Unidos para restaurar as pradarias nativas. A reintrodução de plantas nativas pode melhorar a saúde do solo e a qualidade da água e fornecer habitats importantes para aves e polinizadores.", "titulo_pt": "Plantas, pessoas e progresso para sementes de pradarias nativas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 200016, "titulo": "Como descoberta laureada com o Nobel de química 2026 revolucionou a produção de remédios", "url": "https://veja.abril.com.br/ciencia/como-descoberta-laureada-com-o-nobel-de-quimica-2026-revolucionou-a-producao-de-remedios/", "fonte_id": "veja", "data_pub": "2026-10-07T11:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Henri Cagan e Kenso Soai descobriram uma propriedade química que revolucionou a escala e a segurança da produção de medicamentos. Este trabalho os levou ao Nobel de Química em 2026.", "titulo_pt": "Descoberta que levou ao Nobel de química 2026 transformou a produção de remédios", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 200327, "titulo": "Why is the right obsessed with Indians all of a sudden?", "url": "https://www.vox.com/politics/505248/texas-bo-french-indian-far-right-hate", "fonte_id": "vox", "data_pub": "2026-10-07T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O segundo fim de semana de setembro foi um momento de destaque para o Texas, com a equipe de futebol do Texas Longhorns vencendo uma partida importante contra o Ohio State Buckeyes. No entanto, para Bo French, candidato republicano ao cargo de comissário ferroviário, esse evento não foi o foco principal de sua campanha.", "titulo_pt": "Por que a direita se interessou repentinamente pelos indígenas?", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 200769, "titulo": "The mind of money: Mental accounting theory checks out", "url": "https://phys.org/news/2026-10-mind-money-mental-accounting-theory.html", "fonte_id": "phys_org", "data_pub": "2026-10-07T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A teoria da contabilidade mental sugere que os consumidores tomam decisões com base em contas subjetivas que podem divergir dos valores financeiros objetivos. Por exemplo, um cheque de $100 por horas extras é percebido de forma diferente de um reembolso de impostos de $100, sendo o primeiro visto como ganho e o segundo como um bônus discrecional.", "titulo_pt": "A mente do dinheiro: a teoria de contabilidade mental é confirmada", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 200809, "titulo": "What is AI model distillation, and why is it so hard to stop?", "url": "https://www.scientificamerican.com/article/what-is-ai-model-distillation-and-why-is-it-so-hard-to-stop/", "fonte_id": "scientific_american", "data_pub": "2026-10-07T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O processo de distilação de modelos de inteligência artificial envolve o uso de respostas de modelos mais complexos para treinar modelos mais simples e mais baratos. É difícil parar isso porque os modelos de IA são complexos e a distilação pode ocorrer de maneiras que são difíceis de detectar e prevenir.", "titulo_pt": "O que é a distilação de modelos de IA e por que é difícil parar?", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 200761, "titulo": "2026 Nobel Prize in chemistry awarded for ‘mirror image’ molecule research, with impact on pharmacology", "url": "https://www.statnews.com/2026/10/07/nobel-prize-chemistry-henri-kagan-kenso-soai-2026-winner/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-07T10:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Henri B. Kagan e Kenso Soai receberam o Prêmio Nobel de Química de 2026 por suas pesquisas sobre moléculas 'de espelhos', que resolveram uma questão importante na farmacologia.", "titulo_pt": "Prêmio nobel de química de 2026 concedido por pesquisas sobre moléculas 'de espelhos'", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 200815, "titulo": "OpenAI announces 722 mathematical discoveries in one go", "url": "https://www.newscientist.com/article/2592421-openai-announces-722-mathematical-discoveries-in-one-go/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-10-07T10:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OpenAI lançou centenas de artigos sobre descobertas matemáticas em um único anúncio, surpreendendo os matemáticos. O AI tem demonstrado crescente capacidade em matemática.", "titulo_pt": "Openai anuncia 722 descobertas matemáticas em uma só vez", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 200649, "titulo": "Like father, like son: Chinese duo build mini national engineering marvels in home lab", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3370062/father-son-chinese-duo-build-mini-national-engineering-marvels-home-lab?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-07T10:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um pai e seu filho chinês criaram um laboratório em casa para construir modelos miniaturizados de equipamentos estratégicos nacionais chineses, impressionando muitos online com suas habilidades e paixão. Duan Yanjuan, um estudante do segundo ano do ensino fundamental de 13 anos em Shanghai, já replicou motores de jato turbojato, motores de detonação pulsante e um sistema de lançamento magnético de aeronaves, com auxílio do seu pai, Duan Changzhi.", "titulo_pt": "Como pai e filho: dupla chinesa constrói mini maravilhas de engenharia nacional em laboratório doméstico", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 199973, "titulo": "Em novo registro de Marte, rover da Nasa fotografa primeiras luzes do amanhecer", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/rover-da-nasa-fotografa-as-primeiras-luzes-do-amanhecer-em-marte.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-07T10:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A NASA divulgou uma imagem do amanhecer na superfície de Marte, capturada pelo rover Curiosity cerca de uma hora após o sol nascer. A cena mostra luz do sol banhando escarpas irregulares formadas há bilhões de anos.", "titulo_pt": "Em novo registro de Marte, rover da Nasa fotografa primeiras luzes do amanhecer", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 200810, "titulo": "Rogue AI or human error? The real story behind the OpenAI-Hugging Face incident", "url": "https://www.scientificamerican.com/podcast/episode/rogue-ai-or-human-error-the-real-story-behind-the-openai-hugging-face-incident/", "fonte_id": "scientific_american", "data_pub": "2026-10-07T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O incidente envolvendo OpenAI e Hugging Face levanta uma discussão mais ampla sobre responsabilidade, segurança e controle em relação aos agentes de inteligência artificial.", "titulo_pt": "Rogue AI ou erro humano? A verdade por trás do incidente OpenAI-Hugging Face", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 200652, "titulo": "Kagan, Soai win Nobel Chemistry Prize for solving chemical asymmetry puzzle", "url": "https://www.scmp.com/news/world/europe/article/3370059/nobel-chemistry-prize-awarded-henri-b-kagan-and-kenso-soai?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-07T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O prêmio Nobel de Química de 2026 foi concedido a Henri B. Kagan e Kenso Soai por resolver o mistério da simetria química, descobrindo efeitos não-lineares e autocatálise na síntese orgânica assimétrica. Essa descoberta é crucial para o desenvolvimento de medicamentos.", "titulo_pt": "Kagan e Soai ganham Nobel de química por resolver mistério da simetria química", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 200025, "titulo": "Nobel de Química premia descoberta sobre autocatálise orgânica assimétrica", "url": "https://veja.abril.com.br/ciencia/nobel-de-quimica-vai-para-henri-cagan-e-kenso-soai-por-efeitos-nao-lineares-e-autocatalise/", "fonte_id": "veja", "data_pub": "2026-10-07T09:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Prêmio Nobel de Química foi concedido aos cientistas francês Henri Cagan e japonês Kenso Soai por suas descobertas sobre autocatálise orgânica assimétrica. O anúncio foi feito na Suécia nesta quarta-feira.", "titulo_pt": "Nobel de Química premia descobertas sobre autocatálise orgânica assimétrica", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 200205, "titulo": "El Niño, la infraestructura y las retenciones, entre los temas que llevaron al campo a debatir en Entre Ríos", "url": "https://www.lanacion.com.ar/economia/campo/el-nino-la-infraestructura-y-las-retenciones-entr _duplicata_de": null, "texto_pt": "A Globo está produzindo um documentário sobre a guerra de audiência entre Gugu e Faustão nos anos 1990. A empresa convidou ex-dançarinas do É o Tchan para participar do programa com seus depoimentos.", "titulo_pt": "Globo terá dançarinas do É o Tchan e citará Pânico em documentário sobre Gugu e Faustão", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 200443, "titulo": "Israel, three years after October 7: A nation's traumas and blind spots", "url": "https://www.lemonde.fr/en/international/article/2026/10/07/israel-three-years-after-october-7-a-nation-s-traumas-and-blind-spots_6758345_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-07T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israel está comemorando os vítimas do ataque terrorista do Hamas durante uma campanha eleitoral. Desde o ocorrido, o país continua em uma guerra sem fim, impulsionada por um desejo de vingança, sem questionar as falhas que levaram à catástrofe.", "titulo_pt": "Israel, três anos após outubro de 7: uma nação traumática e com pontos cegos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 200833, "titulo": "‘My first photographs coincided with me falling in love’: why children have always adored taking pictures", "url": "https://www.theguardian.com/artanddesign/2026/oct/07/whippersnappers-children-photographers-annebella-pollen-snap-happy-exhibition-photgraphers-gallery", "fonte_id": "guardian_culture", "data_pub": "2026-10-07T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O livro e a exposição exploram por que as primeiras fotografias tiradas por crianças podem ser tão formativas quanto suas primeiras experiências musicais. O autor da obra, Annebella Pollen, professor de visão, se interessa pelo impacto da fotografia na infância antes da era das câmeras inteligentes.", "titulo_pt": "Minhas primeiras fotos coincidiram com o momento em que eu nça voltou às ruas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 200282, "titulo": "Former bishop sentenced to more than six years in prison for sexually abusing young Aboriginal men", "url": "https://www.theguardian.com/australia-news/2026/oct/07/christopher-alan-saunders-broome-bishop-sexual-abuse-aboriginal-men-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-10-07T04:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ex-arcebispo Christopher Alan Saunders, de 76 anos, foi condenado a mais de seis anos de prisão por abusos sexuais contra dois jovens aborígenes em sua época como membro da clero. Saunders era conhecido por organizar festas alcoolicas e foi encontrado culpado de 13 delitos sexuais após um julgamento por júri no tribunal distrital de Western Australia.", "titulo_pt": "Ex-arcebispo condenado a mais de seis anos de prisão por abusos sexuais contra jovens aborígenes", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 200141, "titulo": "A emotiva partida em que Messi se despediu da seleção argentina", "url": "https://www.bbc.com/portuguese/articles/c63el82p03gwo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-07T03:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lionel Messi jogou pela última vez com a seleção argentina no Estádio Monumental de Buenos Aires.", "titulo_pt": "Partida emocional de despedida de Messi com a seleção argentina", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 200052, "titulo": "Fumaça de queimadas pode alcançar alvéolos e entrar na corrente sanguínea", "url": "https://www.metropoles.com/saude/fumaca-de-queimadas-pode-alcancar-alveolos-e-entrar-na-corrente-sanguinea", "fonte_id": "metropoles", "data_pub": "2026-10-07T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Médicos enfatizam que lavagens nasais e umidificado
