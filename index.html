frey-epstein-sexual-abuse-interlochen-center-arts", "fonte_id": "npr_news", "data_pub": "2026-08-10T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório recente detalha mais de 70 acusações de abuso sexual por parte de cerca de 50 adultos, empregados ou afiliados à escola Interlochen Arts Camp. Estes ex-alunos relatam casos de supostos abusos cometidos por Jeffrey Epstein.", "titulo_pt": "Escola de artes onde Epstein teria abusado de alunos revela décadas de abuso", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 96275, "titulo": "Voters are sick of the two-party system. A new poll shows they're open to big changes", "url": "https://www.npr.org/2026/08/10/nx-s1-5920312/proportional-representation-poll", "fonte_id": "npr_news", "data_pub": "2026-08-10T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo levantamento mostra que os eleitores americanos estão dispostos a considerar mudanças significativas no sistema partidário, com apoio para uma representação proporcional. Este sistema elege múltiplos representantes em um distrito de acordo com a proporção dos votos recebidos por cada partido.", "titulo_pt": "Eleitores americanos abertos a mudanças significativas no sistema partidário", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 96145, "titulo": "Embraer dobra projeção de fluxo de caixa livre para 2026, a US$ 400 milhões", "url": "https://www.infomoney.com.br/mercados/embraer-embj3-projecao-2026/", "fonte_id": "infomoney", "data_pub": "2026-08-10T09:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Embraer aumentou sua projeção de fluxo de caixa livre para 2026, projetando US$ 400 milhões. A empresa também elevou a estimativa da margem EBIT ajustada para entre 10,0% e 10,6%.", "titulo_pt": "Embraer duplica projeção de fluxo de caixa livre para 2026, estipulando US$ 400 milhões", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 96151, "titulo": "Para o Fed de St. Louis, AI não garante inflação menor, e o Fed precisa apertar", "url": "https://braziljournal.com/para-o-fed-de-st-louis-ai-nao-garante-inflacao-menor-e-o-fed-precisa-apertar/", "fonte_id": "brazil_journal", "data_pub": "2026-08-10T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Kevin Warsh, novo chairman do Federal Reserve, acredita que a inteligência artificial pode aumentar a produtividade de forma rápida e significativa, o que poderia levar a juros mais baixos. No entanto, essa visão não é compartilhada por todos no Federal Reserve.", "titulo_pt": "Para o Fed de St. Louis, AI não garante inflação menor, e o Fed precisa apertar", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 96152, "titulo": "Os planos da Ecopetrol para a Brava e para o Brasil", "url": "https://braziljournal.com/os-planos-da-ecopetrol-para-a-brava-e-para-o-brasil/", "fonte_id": "brazil_journal", "data_pub": "2026-08-10T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Ecopetrol, após adquirir o controle da Brava Energia, planeja usar o Brasil como sua principal plataforma de crescimento internacional. A estatal colombiana já possui participação em projetos no país, incluindo o projeto Orca no pré-sal e em onze blocos exploratórios.", "titulo_pt": "Os planos da Ecopetrol para a Brava e para o Brasil", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 96146, "titulo": "Tegma compra 70% da Transcopa por R$99,4 mi", "url": "https://www.infomoney.com.br/mercados/tegma-compra-70-da-transcopa-por-r994-mi/", "fonte_id": "infomoney", "data_pub": "2026-08-10T09:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa Tegma adquiriu 70% da Transcopa por R$99,4 milhões. A compra será paga à vista no encerramento da operação e a liquidação financeira incluirá ajustes a serem determinados.", "titulo_pt": "Tegma compra 70% da Transcopa por R$99,4 mi", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 96078, "titulo": "El Niño já mexe com preços no mercado livre de energia e deixa cenário futuro incerto", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/el-nino-ja-mexe-com-precos-no-mercado-livre-de-energia-e-deixa-cenario-futuro-incerto.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os geradores, comercializadores e clientes do mercado livre de energia já perceberam os primeiros impactos do El Niño no Brasil. O aumento das chuvas no Sul e as piores expectativas sobre o fenômeno afetaram os preços dos contratos de fornecimento nas últimas semanas.", "titulo_pt": "El Niño já mexe com preços no mercado livre de energia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 96079, "titulo": "Anvisa proíbe seis produtos à base de sal vendidos sem CNPJ", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/anvisa-proibe-seis-produtos-a-base-de-sal-vendidos-sem-cnpj.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anvisa proibiu a fabricação, importação e comercialização de seis produtos à base de sal vendidos como suplementos para atletas e recuperação muscular. Esses produtos não possuíam o CNPJ necessário.", "titulo_pt": "Anvisa proíbe venda de seis produtos à base de sal sem CNPJ", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 96103, "titulo": "Acordos no delivery aumentam investimentos e expandem negócios", "url": "https://www.metropoles.com/conteudo-especial/mercado-de-delivery-contratos-exclusivos", "fonte_id": "metropoles", "data_pub": "2026-08-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As discussões sobre acordos no setor de entrega de alimentos estão sendo avaliadas por especialistas e restaurantes. Os acordos têm sido vistos como fatores positivos para aumentar os investimentos e expandir os negócios.", "titulo_pt": "Acordos no delivery ganham destaque em discussões sobre investimentos e expansão", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 96192, "titulo": "La reforma tributaria marcha lenta por su alta complejidad", "url": "https://www.lanacion.com.ar/economia/la-reforma-tributaria-marcha-lenta-por-su-alta-complejidad-nid10082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-10T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Projeções privadas sugerem que a reforma tributária, visando eliminar os impostos mais distorcivos sem comprometer o equilíbrio fiscal, levará mais de uma década para ser concluída. A complexidade do processo é apontada como principal obstáculo.", "titulo_pt": "Reforma tributária avança com lentidão devido à alta complexidade", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 96195, "titulo": "La automotriz japonesa que mantiene congelados los precios de sus autos desde hace casi un año", "url": "https://www.lanacion.com.ar/autos/la-automotriz-japonesa-que-mantiene-congelados-los-precios-de-sus-autos-desde-hace-casi-un-ano-nid10082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-10T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Honda, uma montadora japonesa, manteve os preços dos seus veículos estáveis por quase um ano. Entre janeiro e julho, a empresa registrou 3527 patentes em um mercado que tem uma retração de 12%.", "titulo_pt": "A montadora japonesa honda mantém os preços dos seus carros congelados há quase um ano", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 96360, "titulo": "Marine heatwaves strike as climate change plays out ‘in front of our eyes’", "url": "https://www.ft.com/content/a7e8c998-575e-4d5a-9adb-2b0afd160da0?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-10T08:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Registros de temperatura marinha foram quebrados no mês de julho, conforme relatado pelo relatório do Copernicus. O aumento das ondas de calor marinhas está ocorrendo conforme o aquecimento global se manifesta diante dos nossos olhos.", "titulo_pt": "Ondas de calor marinhas atingem como o clima muda ‘diante dos nossos olhos’", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 96149, "titulo": "Futuros de NY operam mistos com petróleo estável e foco na inflação", "url": "https://www.infomoney.com.br/mercados/futuros-de-ny-operam-mistos-com-petroleo-estavel-e-foco-na-inflacao/", "fonte_id": "infomoney", "data_pub": "2026-08-10T08:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os futuros da bolsa de Nova York operam com variações mistas, influenciados pelo petróleo estável e pela expectativa dos dados sobre inflação nos Estados Unidos na quarta-feira. O mercado também acompanha as negociações relacionadas ao Estreito de Ormuz.", "titulo_pt": "Futuros de NY operam mistos com petróleo estável e foco na inflação", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 96419, "titulo": "Coupang expands global shelf with over 600 overseas brands", "url": "https://www.koreaherald.com/article/10836449", "fonte_id": "korea_herald", "data_pub": "2026-08-10T08:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A gigante de e-commerce Coupang anunciou que mais de 600 marcas internacionais se juntaram ao seu serviço de comércio internacional, Rocket Jikgu. O serviço, inicialmente lançado para produtos dos Estados Unidos em 2017, agora inclui itens de países como Japão e Hong Kong, expandindo a variedade de produtos disponíveis para os consumidores coreanos para incluir beleza e moda além de alimentos e suplementos.", "titulo_pt": "Coupang amplia prateleira global com mais de 600 marcas internacionais", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 96261, "titulo": "A filantropia merece ser tributada?", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-filantropia-merece-ser-tributada", "fonte_id": "jota", "data_pub": "2026-08-10T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Projeto de Lei Provisório 11/2026 visa fornecer ao terceiro setor as condições institucionais que historicamente não foram concedidas.", "titulo_pt": "A filantropia merece ser tributada?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 96322, "titulo": "Treasury yields inch lower as investors look ahead to key inflation data", "url": "https://www.cnbc.com/2026/08/10/us-treasury-yields-investors-eye-key-inflation-data-.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-10T08:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos dos títulos do Tesouro dos EUA caíram levemente no início da semana, enquanto os investidores aguardam dados econômicos importantes, especialmente os indicadores de inflação.", "titulo_pt": "Rendimentos das dívidas do tesouro norte-americano se movem em baixa ante expectativas de dados inflacionários", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 96200, "titulo": "Illinois cierra el 15 de agosto la ayuda para pagar gas y electricidad: puede terminar antes si se agotan los fondos", "url": "https://www.lanacion.com.ar/estados-unidos/illinois/illinois-cierra-el-15-de-agosto-la-ayuda-para-pagar-gas-y-electricidad-puede-terminar-antes-si-se-nid10082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-10T08:07:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A ajuda para pagar gas e eletricidade em Illinois terminará no dia 15 de agosto. Para se inscrever, as solicitações devem ser feitas antes desta data, e os detalhes sobre qualificação, limites de renda e documentos necessários foram divulgados.", "titulo_pt": "Illinois encerra ajuda para pagar gas e eletricidade no dia 15 de agosto", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 96131, "titulo": "Moagem de cana no Centro-Sul cai 14,5% em junho, aponta Unica", "url": "https://www.cnnbrasil.com.br/agro/moagem-de-cana-no-centro-sul-cai-145-em-junho-aponta-unica/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-10T08:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A moagem de cana-de-açúcar no Centro-Sul do Brasil diminuiu 14,5% em junho, segundo a Unica. No acumulado da safra, foram processadas 214,5 milhões de toneladas.", "titulo_pt": "Moagem de cana no Centro-Sul cai 14,5% em junho", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 96475, "titulo": "July 2026's top 10 European tech deals you need to know about", "url": "https://tech.eu/2026/08/10/july-2026s-top-10-european-tech-deals-you-need-to-know-about/", "fonte_id": "tech_eu", "data_pub": "2026-08-10T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em julho de 2026, a financiamento tecnológico na Europa manteve-se resiliente apesar da diminuição no número de negócios. As empresas levantaram €8,6 bilhões em 267 rodadas de financiamento, contra €8,3 bilhões em 293 negociações em junho.", "titulo_pt": "Top 10 dos principais negócios tecnológicos europeus em julho de 2026", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 96383, "titulo": "Can CATL’s battery breakthrough push flying cars closer to a commercial reality in China?", "url": "https://www.scmp.com/business/china-evs/article/3363540/can-catls-battery-breakthrough-push-flying-cars-closer-commercial-reality-china?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-10T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Contemporary Amperex Technology Ltd (CATL), maior fabricante mundial de baterias para veículos elétricos, está se envolvendo no desenvolvimento de sistemas de bateria para voos autônomos após um teste de segurança bem-sucedido. O sucesso na implementação dessas baterias poderia fortalecer a posição chinesa no setor de energias renováveis e na mobilidade futura, segundo analistas.", "titulo_pt": "CATL pode levar veículos voadores mais perto da realidade comercial na China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 96153, "titulo": "OPINIÃO. A AI está vivendo 1997", "url": "https://braziljournal.com/opiniao-a-ai-esta-vivendo-1997/", "fonte_id": "brazil_journal", "data_pub": "2026-08-10T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em algum momento dos anos 1990, as empresas começaram a perceber a necessidade de 'estar na internet', criando sites institucionais básicos que não transformavam significativamente suas operações. Atualmente, a tecnologia da inteligência artificial está passando por uma fase semelhante, com muitas empresas ainda investindo em soluções básicas.", "titulo_pt": "A IA está vivendo 1997", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 96161, "titulo": "Por que empresas de IA estão destruindo milhares de livros ao redor do mundo", "url": "https://www.bbc.com/portuguese/articles/ce974m350pdo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-10T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas de inteligência artificial começaram a enviar pedidos massivos de livros antigos para sebos em vários países. Esses livros estão sendo destruídos por causa dessas solicitações.", "titulo_pt": "Por que empresas de IA estão destruindo milhares de livros ao redor do mundo", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 96385, "titulo": "China halts drone shows across the country as airspace controls tighten", "url": "https://www.scmp.com/news/china/politics/article/3363535/china-halts-drone-shows-across-country-airspace-controls-tighten?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-10T09:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Exibições de drones programadas em atrativos turísticos e eventos ao redor do país foram canceladas, conforme a China intensifica o controle sobre voos baixos. Várias localidades, incluindo Inner Mongolia, Gansu, Shandong, Guangdong e Hainan, anunciaram o cancelamento de shows de drones programados a partir daquele fim de semana.", "titulo_pt": "China suspende exibições de drones em todo o país com aumento do controle do espaço aéreo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 96452, "titulo": "(2nd LD) Gov't to enact special law this year to designate special zone for AI investment projects", "url": "https://en.yna.co.kr/view/AEN20260810002652315", "fonte_id": "yonhap_news", "data_pub": "2026-08-10T09:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo planeja aprovar uma lei especial este ano para designar uma zona específica para projetos de investimento em inteligência artificial.", "titulo_pt": "Governo vai enactar lei especial este ano para zonear investimentos em IA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 96476, "titulo": "Revolut clinches French banking licence", "url": "https://tech.eu/2026/08/10/revolut-clinches-french-banking-licence/", "fonte_id": "tech_eu", "data_pub": "2026-08-10T09:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Revolut conquistou uma licença bancária francesa, expandindo assim seus padrões regulatórios na Europa Ocidental, sua região de maior crescimento. A empresa, considerada a mais valiosa do setor tecnológico europeu, anunciou o feito.", "titulo_pt": "Revolut conquista licença bancária francesa", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 96123, "titulo": "Especialistas explicam ao Dr. Kalil redução de riscos em cirurgias com IA", "url": "https://www.cnnbrasil.com.br/saude/especialistas-explicam-ao-dr-kalil-reducao-de-riscos-em-cirurgias-com-ia/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Radiologistas discutem com o Dr. Kalil sobre a influência da inteligência artificial na medicina e a necessidade de formação crítica para os médicos, conforme relatado no programa CNN Sinais Vitais.", "titulo_pt": "Especialistas explicam ao Dr. Kalil impacto da IA na medicina e importância da formação crítica", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 96196, "titulo": "Único", "url": "https://www.lanacion.com.ar/cultura/unico-nid10082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-10T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto original não fornece conteúdo suficiente para um resumo. No entanto, o título 'Único' foi traduzido para 'Único' em português brasileiro.", "titulo_pt": "Único", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 96287, "titulo": "Exclusive: Sanders calls for AI development pause", "url": "https://www.axios.com/2026/08/10/sanders-ai-development-pause", "fonte_id": "axios", "data_pub": "2026-08-10T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O senador Bernie Sanders (I-Vt.) está pedindo que CEOs de empresas de IA pausem o desenvolvimento dessa tecnologia, alegando que os legisladores intervirão se nada for feito. Sanders está aumentando as pressões sobre a indústria de IA antes das eleições, seguindo sua abordagem progressista no tema.", "titulo_pt": "Sanders exige pausa no desenvolvimento de IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 96288, "titulo": "How Kevin Warsh is rewiring the Fed", "url": "https://www.axios.com/2026/08/10/kevin-warsh-fed-economy-rates-ai", "fonte_id": "axios", "data_pub": "2026-08-10T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kevin Warsh, presidente do Federal Reserve, está tentando redefinir a abordagem da instituição para orientar a economia, enquanto utiliza as ferramentas padrão de política monetária para combater a inflação persistente. Um evento de mercado em julho mostrou os riscos dessa abordagem multifacetada.", "titulo_pt": "Como Kevin Warsh está remodelando o Fed", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 96414, "titulo": "AI for science needs reasoning, not just data", "url": "https://www.technologyreview.com/2026/08/10/1141384/ai-agents-for-science/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-10T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cada alguns décadas, alguém anuncia que a ciência atingiu seu limite. Albert Michelson, um físico respeitado, escreveu em 1903 que 'todos os fatos da física foram descobertos'. Nos anos 80, Stephen Hawking previu que a física teórica poderia estar quase concluída no final do século.", "titulo_pt": "Inteligência artificial na ciência precisa de raciocínio, não apenas de dados", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 96415, "titulo": "These startups are chasing the next big thing in LLMs", "url": "https://www.technologyreview.com/2026/08/10/1141511/these-startups-are-chasing-the-next-big-thing-in-llms/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-10T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A série What's Next do MIT Technology Review examina indústrias, tendências e tecnologias para oferecer uma visão antecipada do futuro. Um artigo de 2017 da Google descreveu um novo método chamado 'Atenção é tudo que você precisa', que revolucionou a pesquisa em redes neurais de linguagem.", "titulo_pt": "Estas startups perseguem o próximo grande avanço em modelos de processamento de linguagem de grande porte", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 96442, "titulo": "Hotai Leasing to debut on the Taiwan stock market on August 11", "url": "https://www.digitimes.com/news/a20260810PD246/taiwan-2026-market-launch-vehicle.html", "fonte_id": "digitimes", "data_pub": "2026-08-10T08:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A unidade de serviços de mobilidade integral da Hotai Motor, a Hotai Leasing, fará sua estreia no mercado de ações da Taiwan em 11 de agosto. Em julho de 2026, a Hotai Leasing registrou faturamento consolidado de NT$2,7 bilhões (US$83,8 milhões), um aumento de 7% em comparação com o mesmo período do ano anterior.", "titulo_pt": "Hotai Leasing fará sua estreia no mercado de ações da Taiwan em 11 de agosto", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 96443, "titulo": "Sony, TSMC to spend US$6.3 billion on Japan image sensor venture, Nikkei says", "url": "https://www.digitimes.com/news/a20260810VL211/sony-tsmc-sensor-nikkei-production.html", "fonte_id": "digitimes", "data_pub": "2026-08-10T08:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Sony e a TSMC planejam investir aproximadamente 1 trilhão de ienes (cerca de US$6,3 bilhões) em uma joint venture para produzir em massa sensores de imagem avançados no Japão, com produção comercial prevista para começar em 2029. A Sony detém cerca de 60% da empresa e a TSMC, cerca de 40%.", "titulo_pt": "Sony e TSMC investirão US$6,3 bilhões em joint venture de sensores de imagem no Japão", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 96389, "titulo": "How the guest list for Beijing’s summer retreat reveals its tech priorities", "url": "https://www.scmp.com/news/china/politics/article/3363523/how-guest-list-beijings-summer-retreat-reveals-its-tech-priorities?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-10T08:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo central chinês convidou cerca de 60 especialistas em ciência, tecnologia e academia para seu retiro anual no verão, enfatizando a ênfase do país na inovação e na superação de 'pontos de gargalo' diante da forte competição com os Estados Unidos. O encontro ocorreu no resort costeiro de Beidaihe entre os dias 1 e 7 de agosto.", "titulo_pt": "Como a lista de convidados do retiro veraniego de Beijing reflete suas prioridades tecnológicas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 96089, "titulo": "Três fatores do estilo de vida na meia-idade são ligados a 13 anos a mais livres de Alzheimer na velhice", "url": "https://veja.abril.com.br/saude/tres-fatores-do-estilo-de-vida-na-meia-idade-sao-ligados-a-13-anos-a-mais-livres-de-alzheimer-na-velhice/", "fonte_id": "veja", "data_pub": "2026-08-10T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo demonstra que fatores do estilo de vida na meia-idade, como mudanças em hábitos saudáveis e o controle de problemas de saúde, podem contribuir para uma redução significativa no risco de desenvolver Alzheimer na velhice. Os pesquisadores associam essas práticas a um aumento potencial de 13 anos sem o risco desse mal de Alzheimer.", "titulo_pt": "Três fatores do estilo de vida na meia-idade estão ligados a 13 anos a mais livres de Alzheimer na velhice", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 96384, "titulo": "Lightning hits China Southern Airbus A321 while taxiing, 20 strike marks found", "url": "https://www.scmp.com/news/china/politics/article/3363538/lightning-hits-china-southern-airbus-a321-while-taxiing-20-strike-marks-found?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-10T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um voo da China Southern Airlines teve que abandonar o embarque e retornar à porta de desembarque no aeroporto de Shenzhen após um Airbus A321 ser atingido por relâmpagos durante o taxiamento. Foram encontradas 20 marcas de impacto de relâmpago na aeronave.", "titulo_pt": "Voo da China Southern é interrompido por relâmpagos enquanto taxiava no aeroporto de shenzhen", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 96208, "titulo": "Animales extintos: el \"falso pingüino\" del Atlántico norte que no podía volar y que fue cazado ferozmente por el humano", "url": "https://www.clarin.com/internacional/animales-extintos-falso-pinguino-atlantico-norte-podia-volar-cazado-ferozmente-humano_0_Q0yWmeXAwl.html", "fonte_id": "clarin", "data_pub": "2026-08-10T09:15:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O alca gigante era uma espécie de ave não voladora que se adaptou para se tornar um nadador especializado. A caça descontrolada levou à sua rápida extinção no meio do século XIX.", "titulo_pt": "Animais extintos: o 'falso pingüino' do atlântico norte que não podia voar e foi caçado ferozmente pelo humano", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 96084, "titulo": "Soltar bolhas ajuda cachalotes em repouso a evitar que flutuem até a superfície", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/soltar-bolhas-ajuda-cachalotes-em-repouso-a-evitar-que-flutuem-ate-a-superficie.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cachalotes conseguem permanecer repousando abaixo da superfície do oceano graças à liberação de bolhas, que ajudam a compensar as forças que tentariam fazer sua cabeça flutuar. Este é um achado recente de cientistas.", "titulo_pt": "Soltar bolhas ajuda cachalotes em repouso a evitar que flutuem até a superfície", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 96470, "titulo": "Opinion: We prepared for Ebola — but not this Ebola", "url": "https://www.statnews.com/2026/08/10/ebola-outbreak-zaire-ebolavirus-bundiugyo-diagnostics-therapeutics/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-10T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os autores argumentam que a preparação não pode se limitar à otimização de investimentos para epidemias passadas. O foco deve ser adaptado às novas realidades.", "titulo_pt": "Opinião: nossa preparação foi para Ebola, mas não para este Ebola", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 96471, "titulo": "STAT+: The promise of radiopharmaceuticals smacks into safety concerns", "url": "https://www.statnews.com/2026/08/10/radiopharmaceuticals-clinical-trials-progress-setbacks/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-10T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apesar do entusiasmo sobre o potencial dos radiofármacos como tratamentos contra o câncer, os desenvolvedores de medicamentos estão enfrentando novos desafios.", "titulo_pt": "A promessa dos radiofármacos como tratamento para o câncer bate de frente com preocupações de segurança", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 96472, "titulo": "Opinion: How should states reach out to Medicaid enrollees affected by changes? Our research gives a hint", "url": "https://www.statnews.com/2026/08/10/medicaid-work-requirement-changes-states-contact/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-10T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa questiona como os estados podem melhorar a comunicação com beneficiários de Medicaid que estão enfrentando prazos para renovação e como fornecer apoio nas exigências burocráticas.", "titulo_pt": "Como os estados devem se comunicar com beneficiários de Medicaid afetados por mudanças?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 96520, "titulo": "Could the northern lights be visible during the total solar eclipse on Aug.12? Maybe.", "url": "https://www.space.com/stargazing/auroras/could-the-northern-lights-be-visible-during-the-total-solar-eclipse-on-aug-12-maybe", "fonte_id": "space_com", "data_pub": "2026-08-10T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "É possível que as auroras boreais sejam visíveis durante a totalidade solar do dia 12 de agosto, no entanto, as chances são pequenas.", "titulo_pt": "As auroras boreais poderiam ser vistas durante o eclipse solar total em 12 de agosto?", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 96473, "titulo": "Western Europe experienced hottest June-July on record: EU monitor", "url": "https://phys.org/news/2026-08-western-europe-experienced-hottest-june.html", "fonte_id": "phys_org", "data_pub": "2026-08-10T06:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ocidente da Europa registrou o verão mais quente de junho e julho em sua história, conforme relatado pelo monitor do aquecimento global da União Europeia. O aumento das temperaturas é atribuído ao aquecimento climático.", "titulo_pt": "Oeste da Europa registra verão mais quente de junho e julho", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 96400, "titulo": "Chinese researchers use microbubbles to shrink aggressive liver tumours: paper", "url": "https://www.scmp.com/news/china/science/article/3363499/chinese-researchers-use-microbubbles-shrink-aggressive-liver-tumours-paper?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-10T06:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores chineses descobriram um método seguro para diminuir tumores avançados de um tipo agressivo do câncer hepático, o que pode permitir o uso de bolhas microscópicas para melhorar os tratamentos atuais. Essas bolhas, geralmente com alguns micrômetros de diâmetro, foram originalmente projetadas como agentes de contraste em imagens por ultrassom, mas cientistas têm explorado seu potencial terapêutico.", "titulo_pt": "Pesquisadores chineses usam bolhas microscópicas para reduzir tumores agressivos do fígado", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 96521, "titulo": "What time is the total solar eclipse on Aug. 12, 2026?", "url": "https://www.space.com/stargazing/solar-eclipses/what-time-is-the-total-solar-eclipse-on-aug-12-2026", "fonte_id": "space_com", "data_pub": "2026-08-10T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo fornece horários-chave para alguns dos destinos mais populares de observação da eclipsesolar total programada para 12 de agosto de 2026.", "titulo_pt": "Qual é a hora do eclipse solar total em 12 de agosto de 2026?", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 95992, "titulo": "APOD: 2026 August 10 – Three Galaxy Pairs", "url": "https://science.nasa.gov/image-article/apod/apod-2026-august-10-three-galaxy-pairs/", "fonte_id": "nasa_news", "data_pub": "2026-08-10T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia da APOD exibe três pares de galáxias, destacando a beleza e complexidade do universo. Esta imagem foi publicada em 10 de agosto de 2026.", "titulo_pt": "APOD: 10 de agosto de 2026 – três pares de galáxias", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 95790, "titulo": "China releases powerful DNA-screening AI tool for free to help fight rare diseases", "url": "https://www.scmp.com/news/china/science/article/3363246/china-releases-powerful-dna-screening-ai-tool-free-help-fight-rare-diseases?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-10T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China lançou uma poderosa ferramenta de inteligência artificial para a detecção genética, gratuitamente, com o objetivo de auxiliar no combate a doenças raras. Este sistema de IA pode acelerar o processo de diagnóstico dessas condições genéticas.", "titulo_pt": "China libera ferramenta de IA avançada gratuita para ajudar no combate a doenças raras", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 95379, "titulo": "Katrin Andreasson, neuróloga de Stanford: “Ahora conocemos al menos una gran razón por la que envejecemos”", "url": "https://www.lanacion.com.ar/lifestyle/katrin-andreasson-neurologa-de-stanford-ahora-conocemos-al-menos-una-gran-razon-por-la-que-nid09082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-10T02:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Stanford identificou que recuperar um mecanismo de limpeza celular pode impedir o deterioramento dos órgãos em roedores. A neurologista Katrin Andreasson anunciou a descoberta.", "titulo_pt": "Katrin Andreasson, neurologista da Stanford: 'já conhecemos uma grande razão do envelhecimento'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 95990, "titulo": "Katalyst Space makes progress in restoring control of Swift servicing spacecraft", "url": "https://spacenews.com/katalyst-space-makes-progress-in-restoring-control-of-swift-servicing-spacecraft/", "fonte_id": "spacenews", "data_pub": "2026-08-10T00:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa que desenvolveu um foguetão para reajustar a órbita de uma estação espacial da NASA está progredindo na recuperação do controle sobre seu próprio satélite Swift, que enfrentou problemas.", "titulo_pt": "Katalyst Space avança no restabelecimento do controle do satélite de serviço Swift", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 95971, "titulo": "STAT+: A shortage of two Sanofi medicines for Pompe disease rattles patients", "url": "https://www.statnews.com/pharmalot/2026/08/09/sanofi-pompe-disease-drug-shortage-myozyme-nexviazyme/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-09T23:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sanofi está enfrentando escassez de dois medicamentos para o tratamento da doença de Pompe, causando preocupação entre os grupos de pacientes.", "titulo_pt": "Escassez de dois medicamentos para a doença de Pompe preocupa pacientes", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 96290, "titulo": "French state heritage architects block roof-insulation projects over height restrictions", "url": "https://www.lemonde.fr/en/money-investments/article/2026/08/10/french-state-heritage-architects-block-roof-insulation-projects-over-height-restrictions_6756335_102.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-10T09:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Arquitetos de patrimônio do estado francês impediram projetos de isolamento das telhas, que envolvem levantar lousas de zinco para isolá-las, sobretudo devido a restrições de altura. Este procedimento é autorizado pelo plano urbano bioclimático de Paris, mas enfrenta resistência por parte dos guardiões do patrimônio arquitetônico da cidade.", "titulo_pt": "Arquitetos de patrimônio franceses bloqueiam projetos de isolamento das telhas por restrições de altura", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 96515, "titulo": "Eight Books That Puncture the Myths of Silicon Valley", "url": "https://lithub.com/eight-books-that-puncture-the-myths-of-silicon-valley/", "fonte_id": "lithub", "data_pub": "2026-08-10T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Silicon Valley está passando por tempos estranhos. Tecnologia não parece mais ser uma indústria isolada, mas sim a infraestrutura que suporta praticamente todas as outras indústrias. A IA é um componente crucial disso.", "titulo_pt": "Oito livros que desmascaram os mitos da Silicon Valley", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 96516, "titulo": "How JD Salinger’s Experience of WWII Suffused All of His Writing, Even Catcher in the Rye", "url": "https://lithub.com/how-jd-salingers-experience-of-wwii-suffused-all-of-his-writing-even-catcher-in-the-rye/", "fonte_id": "lithub", "data_pub": "2026-08-10T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O 'bíblia de escudo do coração' era um livro bíblico miniaturizado, fornecido pelo governo e carregado pelos soldados nas batalhas da Segunda Guerra Mundial. Este item era frequentemente encontrado em bolsos padrão dos uniformes militares.", "titulo_pt": "Como a experiência de JD Salinger na segunda guerra mundial influenciou sua escrita, incluindo o guardião das rosas", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 96517, "titulo": "The Toxic Appeal of “Big-Reveal” Content on Social Media", "url": "https://lithub.com/the-toxic-appeal-of-big-reveal-content-on-social-media/", "fonte_id": "lithub", "data_pub": "2026-08-10T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A subgênero de retratos familiares (e posteriormente, vídeos) focados na concepção, gestação e nascimento é um produto recente das redes sociais. Ao longo de mais de um século, as famílias vêm posando para fotos com sorrisos forçados.", "titulo_pt": "A atração toxicamente toxicosa do conteúdo 'revelação grande' nas redes sociais", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 96518, "titulo": "For 50 Years the Major Oil Companies Have Known They’re Destroying the Planet", "url": "https://lithub.com/for-50-years-the-major-oil-companies-have-known-theyre-destroying-the-planet/", "fonte_id": "lithub", "data_pub": "2026-08-10T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante mais de meio século, as principais empresas de petróleo têm conhecimento sobre a destruição do planeta. No final do primeiro século d.C., o governador romano, filósofo e naturalista Plínio o Velho observou como a mineração alterava um cenário na região das alturas da Espanha.", "titulo_pt": "Por 50 anos as principais empresas de petróleo sabem que estão destruindo o planeta", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 96076, "titulo": "'Achei que a hora de voltar era agora', diz Sheron Menezzes sobre retorno às novelas da Globo", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/08/achei-que-a-hora-de-voltar-era-agora-diz-sheron-menezzes-sobre-retorno-as-novelas-da-globo.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sheron Menezzes retornou às novelas da Globo para gravar a novela 'Por Você', no papel de Bela. Ela foi uma das primeiras do elenco a chegar e começou imediatamente as gravações.", "titulo_pt": "Sheron Menezzes diz que achou o momento certo para voltar às novelas da Globo", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 96094, "titulo": "Quadrinista francesa desmistifica tabus sobre saúde mental e identidade", "url": "https://veja.abril.com.br/cultura/quadrinista-francesa-desmistifica-tabus-sobre-saude-mental-e-identidade/", "fonte_id": "veja", "data_pub": "2026-08-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A quadrinista francesa Lou Lubie lançou duas obras que abordam temas relacionados à saúde mental e identidade. Em 'Cara ou Coroa' e 'Raízes', ela discute o impacto da ciclotimia e do racismo capilar.", "titulo_pt": "Quadrinista francesa desmistifica tabus sobre saúde mental e identidade", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 96124, "titulo": "Jon Batiste sobre sucesso de “Soul”: “A música é a linguagem do invisível”", "url": "https://www.cnnbrasil.com.br/pop/musica/jon-batiste-sobre-sucesso-de-soul-a-musica-e-a-linguagem-do-invisivel/", "fonte_id": "cnn_brasil", "data_pub": "2026- 52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autora foi batizada com o nome Eleanor porque nasceu uma semana após Eleanor Roosevelt visitar Kansas City para apoiar seu marido na campanha. Na época, ela e seus pais residiam em Rolla, Missouri.", "titulo_pt": "Soliluz encontra você", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 96289, "titulo": "In Japan, 'calf hair harassment' exposes gender-based appearance conflicts between women and men", "url": "https://www.lemonde.fr/en/international/article/2026/08/10/in-japan-calf-hair-harassment-exposes-gender-based-appearance-conflicts-between-women-and-men_6756332_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-10T08:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As altas temperaturas de verão levaram o governo metropolitano do Tóquio a iniciar uma campanha que promove um código de vestimenta mais relaxado no ambiente de trabalho. No entanto, algumas mulheres japonesas, que não suportam a visão de pelos corporais, denunciaram o que chamam de 'harassment visual'.", "titulo_pt": "Em tóquio, 'calf hair harassment' expõe conflitos de aparência entre homens e mulheres", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 96491, "titulo": "Ancient Roman pottery discovered in shipwreck off Sicilian coast – video", "url": "https://www.theguardian.com/world/video/2026/aug/10/ancient-roman-pottery-discovered-in-shipwreck-off-sicilian-coast-video", "fonte_id": "guardian_culture", "data_pub": "2026-08-10T08:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Itália encontrou o naufrágio de uma embarcação romana perto da costa siciliana. Os mergulhadores descobriram centenas de amphorae e partes de âncoras no navio, localizado a cerca de 3 milhas do município de Mazara del Vallo.", "titulo_pt": "Pottery antiga romana encontrada em naufrágio próximo à costa siciliana – vídeo", "veiculo": "The Guardian Culture", "pais": "Rein onários se juntaram a um grupo de organização online desde que ele foi lançado em 5 de agosto.", "titulo_pt": "Funcionários da SK hynix formam sindicato para defender bônus", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 95374, "titulo": "La alarmante declinación educativa argentina", "url": "https://www.lanacion.com.ar/opinion/la-alarmante-declinacion-educativa-argentina-nid10082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-10T03:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A deterioração educacional argentina está causando um declínio na coesão social e, por extensão, nas possibilidades de desenvolvimento do país.", "titulo_pt": "A alarmante declínua educacional argentina", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 95113, "titulo": "Tarcísio defende vacina contra sarampo após fala de Eduardo Bolsonaro", "url": "https://www.metropoles.com/sao-paulo/tarcisio-defende-vacina-contra-sarampo-apos-fala-de-eduardo-bolsonaro", "fonte_id": "metropoles", "data_pub": "2026-08-10T02:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eduardo Bolsonaro afirmou ter assinado um termo que o isenta de vacinar sua filha para matricular-se em uma escola nos Estados Unidos e criticou a exigência de vacinação no Brasil. Tarcísio Meira, ministro da Saúde, defendeu a vacina contra sarampo.", "titulo_pt": "Tarcísio meira defende vacina contra sarampo após declaração de Eduardo Bolsonaro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 95846, "titulo": "Disabled activists' protest temporarily disrupts Yongsan Station", "url": "https://en.yna.co.kr/view/AEN20260810003600315", "fonte_id": "yonhap_news", "data_pub": "2026-08-10T01:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo que defende os direitos das pessoas com deficiência realizou uma manifestação surpresa que temporariamente interrompeu as operações da Estação Yongsan.", "titulo_pt": "Grupos de direitos das pessoas com deficiência realizam protesto surpreendente na estação Yongsan", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 95126, "titulo": "Diniz destaca desempenho do Corinthians mesmo com salários atrasados", "url": "https://www.metropoles.com/esportes/diniz-destaca-atuacao-do-corinthians-mesmo-com-salario-atrasado", "fonte_id": "metropoles", "data_pub": "2026-08-10T01:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Corinthians venceu o Red Bull Bragantino por 2 a 0 no Brasileirão. O elenco alvinegro enfrenta dificuldades com salários atrasados.", "titulo_pt": "Diniz destaca bom desempenho do Corinthians diante dos salários em atraso", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 95342, "titulo": "Mayores de 60 años aún no logran meta de vacunación contra la influenza", "url": "https://www.latercera.com/nacional/noticia/mayores-de-60-anos-aun-no-logran-meta-de-vacunacion-contra-la-influenza/", "fonte_id": "la_tercera", "data_pub": "2026-08-10T01:08:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A campanha de vacinação contra a influenza para pessoas acima de 60 anos começou em 1º de março, mas ainda faltam mais de 1.500.000 indivíduos dessa faixa etária a serem imunizados. Apesar do inverno estar próximo ao fim e o pico já ter passado, os especialistas não descartam a possibilidade de um novo surto.", "titulo_pt": "Pessoas acima de 60 anos ainda não atingiram meta de vacinação contra a influenza", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 96237, "titulo": "Weather tracker: Europe breaks more heat records as temperatures soar", "url": "https://www.theguardian.com/environment/2026/aug/10/weather-tracker-europe-break-heat-records-temperatures-drought-wildfires", "fonte_id": "guardian_world", "data_pub": "2026-08-10T09:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Temperaturas extremamente altas estão quebrando recordes em toda a Europa, intensificando secas e incêndios florestais. Um sistema de alta pressão está causando temperaturas acima de 40°C em vários países europeus, incluindo Áustria e Eslováquia.", "titulo_pt": "Rastreador do tempo: Europa quebra mais recordes de calor com temperaturas elevadas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 96292, "titulo": "Greece battles new wildfire near Athens driven by strong winds", "url": "https://www.lemonde.fr/en/international/article/2026/08/10/greece-battles-new-wildfire-near-athens-driven-by-strong-winds_6756333_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-10T08:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Grécia enfrenta um novo incêndio florestal perto de Atenas, impulsionado por fortes ventos. Este é o segundo incêndio na região esta estação do ano, após outro que ocorreu há dez dias e destruiu mais de 11.000 hectares de florestas pinheiras e áreas agrícolas.", "titulo_pt": "Grécia combate novo incêndio perto de atenas impulsionado por ventos fortes", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 96397, "titulo": "Discovery of almost 1,000 weapons in Indonesian school fuels safety fears", "url": "https://www.scmp.com/week-asia/people/article/3363504/discovery-almost-1000-weapons-indonesian-school-fuels-safety-fears?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-10T06:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ministro indonésio pediu melhor proteção para os alunos após a descoberta de quase 1.000 armas em uma escola privada em South Jakarta. A polícia apreendeu 995 rifles de ar e um revólver vivo na instituição ligada à Fundação Harapan Ibu Islamic School Foundation.", "titulo_pt": "Descoberta de quase 1.000 armas em escola indonésia aumenta preocupações com a segurança", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 96140, "titulo": "Europa bate recorde de temperatura em verão de ondas de calor e incêndios", "url": "https://www.cnnbrasil.com.br/internacional/europa-bate-recorde-de-temperatura-em-verao-de-ondas-de-calor-e-incendios/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-10T06:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Europa registrou recorde de temperatura no verão, com junho e julho tendo média 2,79°C acima do padrão. Além disso, uma estiagem severa reduziu os níveis dos rios, aumentando riscos à população e aos serviços de abastecimento de energia.", "titulo_pt": "Europa quebra recorde de temperatura em verão com ondas de calor e incêndios", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 96353, "titulo": "Wildfires bear down on homes in Canada’s Okanagan region", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/10/wildfires-bear-down-on-homes-in-canadas-okanagan-region?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-10T04:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio florestal rápido no estado canadense de British Columbia obrigou milhares de pessoas a deixarem suas casas.", "titulo_pt": "Incêndios florestais ameaçam residências na região okanegana do canadá", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 96404, "titulo": "Haze returns to Malaysia’s Sarawak, Selangor as Indonesian wildfires burn out of control", "url": "https://www.scmp.com/week-asia/health-environment/article/3363488/haze-returns-malaysias-sarawak-selangor-indonesian-wildfires-burn-out-control?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-10T04:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A névoa voltagem retornou à Malásia, com pelo menos dois estados registrando leituras de ar insalubre na segunda-feira. O fogo florestal em andamento na Indonésia está enviando nuvens de fumaça para o norte, afetando as regiões vizinhas.", "titulo_pt": "Névoa volta a assolar malásia com incêndios florestais na indonésia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 95674, "titulo": "Western Europe sets new temperature record as heat waves continue to pummel region", "url": "http://www.euronews.com/2026/08/10/western-europe-sets-new-temperature-record-as-heat-waves-continue-to-pummel-region", "fonte_id": "euronews", "data_pub": "2026-08-10T04:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Europa Ocidental registrou novos recordes de temperatura durante o último mês, conforme informou o Copernicus. Além disso, o mar registrou as temperaturas médias mais altas para julho já registradas em áreas além das regiões polares sem geleiras sazonais.", "titulo_pt": "Europa ocidental bate recorde de temperatura enquanto ondas de calor continuam a atingir região", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 95753, "titulo": "Italy’s record-low Po River forces farmers to weigh crop switch", "url": "https://www.japantimes.co.jp/environment/2026/08/10/climate-change/italy-po-river-farmers-crop/", "fonte_id": "japan_times", "data_pub": "2026-08-10T03:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Rio Po, na Itália, está registrando níveis históricamente baixos devido a oscilações climáticas extremas entre inundações e secas, forçando agricultores a considerar mudanças nas culturas. Essas variações climáticas estão também levando indústrias a competirem por um recurso que elas costumavam ter acesso sem restrições.", "titulo_pt": "Níveis históricos baixos do rio Po pressionam agricultores a mudarem as culturas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 95792, "titulo": "Indonesia’s Mount Bromo wildfire put out but new fires threaten in unusually dry season", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3363481/indonesias-mount-bromo-wildfire-put-out-new-fires-threaten-unusually-dry-season?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-10T03:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio que consumiu 550 hectares no Parque Nacional de Mount Bromo, na Indonésia, foi extinto. No entanto, novos focos de calor apareceram nas áreas ao redor do caldeirão do vulcão, em um período excepcionalmente seco.", "titulo_pt": "Incêndio no Mount Bromo extinto, mas novos focos surgem em época seca", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 95760, "titulo": "Indonesia closes national park as wildfire spreads", "url": "https://www.japantimes.co.jp/news/2026/08/10/asia-pacific/indonesia-national-park-wildfire/", "fonte_id": "japan_times", "data_pub": "2026-08-10T02:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio destruiu 176 hectares desde que começou na última segunda-feira perto do popular destino turístico de Mount Bromo, na East Java. Uma unidade nacional de parque foi fechada devido à propagação das chamas.", "titulo_pt": "Indonésia fecha parque nacional devido a incêndio que se espalha", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 95844, "titulo": "S. Korea assumes co-chairship of International Climate Councils Network working group", "url": "https://en.yna.co.kr/view/AEN20260810003900315", "fonte_id": "yonhap_news", "data_pub": "2026-08-10T01:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul assumiu a vice-presidência de um grupo de trabalho da Rede das Councils Internacionais sobre Clima. Este grupo trabalha na International Climate Councils Network.", "titulo_pt": "Coreia do sul assume vice-liderança em grupo de trabalho da rede internacional sobre clima", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 95424, "titulo": "Hong Kong records hottest day ever as Typhoon Dolphin fuels heatwave", "url": "https://www.theguardian.com/world/2026/aug/10/hong-kong-heat-record-hottest-day-ever-typhoon-dolphin", "fonte_id": "guardian_world", "data_pub": "2026-08-10T01:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hong Kong registrou sua temperatura mais alta histórica, com 36,9°C no domingo, devido ao passingo do Furacão Dolphin. Este é o registro máximo desde que os registros meteorológicos começaram há 142 anos.", "titulo_pt": "Hong Kong registra dia mais quente da história durante furacão", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 95352, "titulo": "“Al borde de la extinción”: DiCaprio alerta riesgo de “destruir” hábitat de ranita del Pehuenche por proyecto eléctrico en la cordillera del Maule", "url": "https://www.latercera.com/nacional/noticia/al-borde-de-la-extincion-dicaprio-alerta-riesgo-de-destruir-habitat-de-ranita-del-pehuenche-por-proyecto-electrico-en-la-cordillera-del-maule/", "fonte_id": "la_tercera", "data_pub": "2026-08-10T00:06:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ator americano DiCaprio alertou para o risco de destruição do habitat da ranita do Pehuenche, uma espécie catalogada como En Peligro Crítico com menos de mil exemplares em estado silvestre. Ele chamou a atenção para um projeto elétrico na Cordilheira do Maule que ameaça essa população.", "titulo_pt": "\"A beira da extinção\": dicaprio alerta risco de destruir habitat da ranita do Pehuenche por projeto elétrico na cordilheira do Maule", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 95817, "titulo": "Wildfire forces 20,000 evacuations in western Canada", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/10/2003862223", "fonte_id": "taipei_times", "data_pub": "2026-08-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio florestal obrigou a evacuação de 20.000 pessoas na região ocidental do Canadá.", "titulo_pt": "Incêndio causa 20.000 desalojamentos no oeste do canadá", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 95421, "titulo": "Canadian government steps in as ‘out of control’ wildfires force thousands to flee", "url": "https://www.theguardian.com/world/2026/aug/09/canada-british-columbia-government-wildfires", "fonte_id": "guardian_world", "data_pub": "2026-08-09T18:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo canadense anunciou que fornecerá assistência urgente à província de British Columbia, que enfrenta 102 incêndios florestais simultâneos. Os incêndios, considerados 'fora de controle', obrigaram cerca de 22.000 pessoas a deixarem suas casas.", "titulo_pt": "Governo canadense intervirá em incêndios florestais 'descontrolados' na british columbia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 95712, "titulo": "Wildfires in Albania and Spain cause hundreds to evacuate", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/9/wildfires-in-albania-and-spain-cause-hundreds-to-evacuate?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-09T16:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Incêndios florestais se alastraram perto da capital do Albânia e em áreas sulistas de Espanha, obrigando centenas a deixar suas casas.", "titulo_pt": "Fogos florestais no albânia e Espanha fazem centenas evadirem", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 96417, "titulo": "Police to strengthen whistleblower protections following investigative authority reform", "url": "https://www.koreaherald.com/article/10836507", "fonte_id": "korea_herald", "data_pub": "2026-08-10T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Agência Nacional de Polícia da Coreia anunciou que vai fortalecer as medidas para incentivar denúncias e proteger os informantes após uma reforma legal que concede autoridade investigativa exclusivamente à polícia. O objetivo é reforçar o controle interno e aumentar a confiança dos policiais em relatar irregularidades.", "titulo_pt": "Polícia coreana vai fortalecer proteção a denunciantes após reforma", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 96263, "titulo": "De tabu individual a dever coletivo: o direito à dignidade menstrual de meninas", "url": "https://www.jota.info/opiniao-e-analise/artigos/de-tabu-individual-a-dever-coletivo-o-direito-a-dignidade-menstrual-de-meninas", "fonte_id": "jota", "data_pub": "2026-08-10T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A falta de políticas e debates contribui para a naturalização do sofrimento de meninas e mulheres em relação ao direito à dignidade menstrual. O título traduzido é: 'De tabu individual a dever coletivo: o direito à dignidade menstrual de meninas.'", "titulo_pt": "De tabu individual a dever coletivo: o direito à dignidade menstrual de meninas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 96201, "titulo": "Encontraron ocho cuerpos desmembrados en una mina ilegal de oro en Ecuador", "url": "https://www.lanacion.com.ar/el-mundo/encontraron-ocho-cuerpos-desmembrados-en-una-mina-ilegal-de-oro-en-ecuador-nid10082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-10T06:43:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Oito corpos desmembrados foram encontrados em duas fossas, a cerca de dois metros de profundidade, em uma mina ilegal de ouro no Equador. O operativo foi iniciado após várias famílias relatarem que perderam o contato com parentes.", "titulo_pt": "Encontraram oito corpos desmembrados em uma mina ilegal de ouro no equador", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 96399, "titulo": "Hong Kong police arrest 8 over HK$6.2 million ‘sugar baby’ dating scam", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3363500/hong-kong-police-arrest-8-over-hk62-million-sugar-baby-dating-scam?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-10T06:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia de Hong Kong prendeu oito pessoas por supostamente participar de uma quadrilha de estelionato que enganou vítimas, incluindo professores e trabalhadores da saúde, sacando cerca de HK$6.2 milhões (US$790.000) sob a pretexto de pagamentos legais para formalizar contratos de 'sugar baby'. Foram investigados 80 casos envolvendo estelionatários que usaram o dating compensado como uma tática para atrair vítimas entre fevereiro e julho deste ano.", "titulo_pt": "Polícia de hong Kong prende oito por esquema de 'sugar baby'", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 96329, "titulo": "Union documents 108 Israeli attacks against Palestinian journalists in July", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/union-documents-108-israeli-attacks-against-palestinian-journalists-july", "fonte_id": "middle_east_eye", "data_pub": "2026-08-10T06:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Sindicato dos Jornalistas Palestinos documentou 108 ataques israelenses contra jornalistas e trabalhadores da mídia palestinos em julho. Esses ataques incluíram detenções, agressões físicas, interrogatórios, uso de granadas de efeito sonoro e gás lacrimogêneo, violência por parte de colonos, busca e apreensão nas residências e locais de trabalho desses profissionais, bem como o sequestro de equipamentos jornalísticos.", "titulo_pt": "Documentos da união registram 108 ataques israelenses contra jornalistas palestinos em julho", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 96403, "titulo": "Court approves last attempt by 11 jailed opposition figures to clear their names", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3363492/court-approves-last-attempt-11-jailed-opposition-figures-clear-their-name?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-10T05:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal de Hong Kong aprovou um último esforço de 11 políticos e ativistas oposicionistas presos para anular suas condenações por conspiração ao subversivo em uma importante audiência de segurança nacional. A decisão foi tomada após uma análise de cinco questões legais pelo Tribunal de Recursos.", "titulo_pt": "Tribunal aprova último esforço de 11 oposicionistas presos para anular condenações", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 95381, "titulo": "Las 12 agencias de la Policía de Nueva York que deberán terminar sus acuerdos con el ICE antes del 25 de agosto", "url": "https://www.lanacion.com.ar/estados-unidos/nueva-york/ice-en-nueva-york-las-12-agencias-policiales-que-deberan-terminar-sus-acuerdos-287g-antes-del-25-de-nid09082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-10T01:47:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A nova lei de Kathy Hochul exige que 12 agências da Polícia de Nova York encerrarem seus acordos com o ICE antes do dia 25 de agosto. Essa medida visa limitar a cooperação entre as forças policiais locais e as imigrações federais.", "titulo_pt": "As 12 agências da polícia de nova York que deverão terminar acordos com o ICE antes do 25 de agosto", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 95800, "titulo": "Youth membership in Hong Kong uniformed groups drops 8% over 5 years", "url": "https://www.scmp.com/news/hong-kong/society/article/3363447/youth-membership-hong-kong-uniformed-groups-drops-8-over-5-years?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-10T00:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A adesão de jovens aos grupos uniformizados na Hong Kong diminuiu 8% nos últimos cinco anos     ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";

};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
