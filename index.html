<html lang="pt-BR">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

const D = {"gerado_em": "22/08/2026 07:23", "stats": {"noticias_novas": 649, "resumos_gerados": 233}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A campanha para o Senado no estado de São Paulo enfrenta novos desafios, com a articulação de apoios entre a ministra Simone Tebet (PSB) e o presidente do PSD, Gilberto Kassab. No Supremo Tribunal Federal, Gilmar Mendes autorizou um julgamento virtual sobre a validade das mudanças na Lei da Ficha Limpa, o que pode afetar os resultados das eleições de outubro. A pesquisa Datafolha mostra que Lula lidera com 47% das intenções de voto contra Flávio Bolsonaro, que tem 43%, em cenário de segundo turno, mantendo a disputa equilibrada. Além disso, a gestão do presidente Lula enfrenta críticas, com a avaliação negativa de seu governo aumentando de 38% para 41% entre julho e agosto, enquanto a avaliação positiva permaneceu estável em 33%.", "mundo": "O mundo enfrenta diversos desafios e avanços em diferentes regiões. Na África, a expansão da produção chinesa de veículos elétricos e tecnologias verdes é vista como uma oportunidade para o continente adquirir tecnologia e desenvolver seu setor. Por outro lado, os EUA e partes da Europa consideram a produção chinesa excessiva. Em Israel, um ex-diplomata britânico e francês enviou uma carta a Macron e Burnham acusando Israel de praticar limpeza étnica e pedindo medidas para pressionar o país a aceitar um Estado palestino. No Oriente Médio, a morte de um adolescente palestiniano de 17 anos, vítima de um ataque de colonos em território palestino ocupado da Cisjordânia, reforça os conflitos na região. Além disso, o Canadá promete retaliar com tarifas iguais às impostas pelos EUA após falhas nas negociações de comércio, enquanto o Qatar corta gastos públicos devido à contracção da economia causada pelo conflito entre EUA e Irã no Estreito de Ormuz.\n\nA tensão geopolítica continua a dominar os cenários internacionais. O Irã reagiu com firmeza às novas sanções dos Estados Unidos, considerando-as uma 'declaração de guerra a todos os países'. Paralelamente, o Irã permitiu que navios petroleiros iraquianos passem pelo Estreito de Ormuz, uma ação que contrasta com as afirmações de Donald Trump de que o Estreito é território americano. Em outro desenvolvimento, o Canadá anunciou que irá reagir às tarifas impostas pelos Estados Unidos, aplicando tarifas equivalentes, o que pode aprofundar as tensões comerciais entre os dois aliados históricos. A hostilidade entre Estados Unidos e Irã persiste, com nenhum avanço nas negociações de paz, enquanto o presidente iraniano afirma que é hora de encerrar a guerra com os EUA a partir de uma posição de força. Além disso, o Pentágono demitiu os líderes da revista Stars and Stripes após relatórios sobre condições precárias a bordo do USS Abraham Lincoln, refletindo a tensa relação entre o Pentágono e a mídia independente.", "economia": "A economia global enfrenta diversos desafios neste momento. Na América do Norte, os Estados Unidos aplicaram tarifas de 50% sobre produtos canadenses, afetando um comércio valorizado em cerca de 20 bilhões de dólares, após falhas nas negociações. Em contraste, a Shein, uma gigante do varejo, luta para expandir além de suas conquistas iniciais, enquanto a empresa brasileira Zaffari prepara um complexo imobiliário integrado ao Bourbon Shopping em São Paulo. O Banco Mundial projeta uma contração de 6,4% na economia do Líbano, afetada pela guerra, enquanto a Argentina desconsiderou uma denúncia sobre supostas fraudes envolvendo a transferência de ações da empresa Bioceres. No cenário corporativo, a Petz Cobasi projeta faturar R$ 8 bilhões em 2026, apesar de enfrentar desafios devido a juros altos e concorrência, enquanto a J&F, dos irmãos Batista, adquire a fabricante de material bélico Avibras. Em meio a essas notícias, a Bolsa de Valores subiu quase 2% e o dólar fechou a R$ 5,142, o menor nível em mais de 10 dias, refletindo alívios no mercado externo.", "tecnologia": "TikTok concordou em pagar 400 milhões de dólares para resolver uma ação judicial nos Estados Unidos relacionada a violações de leis de privacidade infantil, conforme acordado com o Departamento de Justiça dos EUA. Este acordo é uma vitória importante para os americanos e seus pais. Em outro desenvolvimento, a Samsung aprovou um plano de retorno aos acionistas para 2026, estimado em aproximadamente 64 a 79 bilhões de dólares, o maior já realizado por uma empresa sul-coreana. Além disso, a tecnologia de direção autônoma está se aperfeiçoando, mas ainda enfrenta barreiras de segurança e confiança, com a utilização de radares como parte fundamental do sistema de 'olhos' dos veículos autônomos.", "ciencia": "A China está prestes a lançar a missão Chang'e-7, com o objetivo de procurar água na superfície da Lua, marcando um importante passo na exploração lunar. Em um estudo liderado pela NASA, microorganismos terrestres podem sobreviver na superfície lunar, levantando preocupações sobre a possibilidade de transferência de vida da Terra para a Lua. Além disso, pesquisadores da Universidade de Tampere desenvolveram uma plataforma de hidrogel que facilita a criação de biomateriais personalizados para engenharia de tecidos, potencializando avanços em medicina regenerativa. A China também está buscando gelo em crateras da Lua, enquanto a Unicamp desenvolveu uma técnica que permite avaliar a vida útil de baterias de lítio sem precisar abrir as unidades, crucial para dispositivos eletrônicos e veículos elétricos.", "cultura": "O evento mais importante dos artigos é a pré-estreia do filme 'Muito Prazer', que ocorrerá na próxima segunda-feira (24) às 20h, no Espaço Petrobras de Cinema, promovida pela Folha. O diretor Jorge Furtado e os atores Luisa Arraes, Daniel de Oliveira, Samantha Jones e Felipe Velozo participarão da sessão. O filme faz parte de uma série de eventos culturais que marcam o início do mês. Outros assuntos abordados incluem a literatura, com a reedição de obras de Cassandra Rios, a primeira escritora brasileira a vender mais de 1 milhão de exemplares, e a poesia ambiental, que ganha força com a obra de um poeta britânico antológico. A tecnologia também está presente, com o lançamento de um livro de memórias de Tim Berners-Lee, inventor da internet, que serve como manifesto para resgatar a internet a seus propósitos originais. Além disso, a cultura pop é representada pela série 'Pablo e Luisão', que encerrou sua primeira temporada com alta audiência na Globo, e pelo show de Anitta, que realizou debates na Feira do Livro, atraindo um público de aproximadamente 100 mil pessoas. Ainda são discutidos temas como a relação pessoal, com Mel Robbins recomendando a aplicação da regra dos cinco segundos para mudar hábitos, e a importância do amor, com o espetáculo de stand-up 'Aphrodite' de Elouise Eftos questionando se o amor é real.", "sociedade": "Um caso importante de violência doméstica ocorreu em Minas Gerais, quando uma mulher esfaqueou o marido, acusado de violência doméstica, e foi posteriormente presa. O caso mostra a complexidade das relações familiares e a necessidade de medidas mais eficazes para prevenir e combater a violência doméstica. Em outro incidente, um trabalhador foi atacado e queimado por um suspeito, resultando em lesões graves, com a orelha quase queimada e a mão atrofiada. Este caso destaca a necessidade de medidas de segurança e prevenção em áreas urbanas. No tema de segurança, uma operação da Polícia Federal em São Paulo está investigando um esquema de tráfico de drogas e lavagem de dinheiro associado a um campo de society, com cinco imóveis sequestrados. Na área da saúde, a definição do autismo continua sendo um ponto central de debate, com especialistas discutindo a validade de considerar indivíduos autistas como um grupo único. Além disso, a dengue na Malásia tem aumentado, com 55 mortes e 58.079 casos registrados. O prefeito do Rio de Janeiro pediu que os moradores se protejam devido a ventos fortes, enquanto um entregador foi preso por espancamento em Copacabana, ocorrido após ser acusado injustamente de roubo.", "meio_ambiente": "A Organização Não-Governamental Habitat para a Humanidade Brasil alerta para os riscos do fenômeno 'Super El Niño', que será um dos mais intensos desde 1950, segundo relatos. O evento está causando preocupação com a possibilidade de aumento de eventos como enchentes, deslizamentos de terra, estiagens e queimadas, especialmente no Brasil. Em contraste, o Chile tem um projeto ambicioso do Ministério do Meio Ambiente para descontaminar o Lago Villarrica em 15 anos, com um investimento estimado de US$ 56 milhões. Paralelamente, a China enfrenta a ameaça crescente de incêndios florestais devido ao El Niño, o que está levando a um aumento no número de mortes devido ao calor extremo. Além disso, o governo chinês publicou um estudo que sugere que a expansão da energia solar pode reduzir a biodiversidade, especialmente a diversidade de aves, em áreas onde é implantada.", "direitos_humanos": "Um tribunal no Reino Unido decidiu que o Home Office não pode deportar muitos jovens e homens vítimas de tráfico para a Albânia, após um relatório que indicou que muitos homens albaneses, identificados como potenciais vítimas de tráfico no Reino Unido, foram devolvidos ao seu país mesmo sendo considerados seguros lá. Em outro caso, a senadora Damares afirmou que as mortes de Yanomamis representam uma das maiores crises humanitárias do país, com uma comissão solicitando investigação sobre o destino de uma verba bilionária destinada à assistência aos Yanomamis. A Organização das Nações Unidas (ONU) alertou que 94% da população de Gaza, que ultrapassa 2,1 milhões de pessoas, necessita de abrigo e assistência básica, com quatro em cada cinco famílias enfrentando níveis 'críticos ou catastróficos' de fome em seus abrigos. Além disso, a ONU alertou para uma nova crise de fome em Somalia, com a ameaça de estação de fome a milhões de pessoas no país, e a Al Jazeera investigou como o território palestino é apropriado, com colonos israelenses atacando seis vezes por dia na Cisjordânia ocupada."}, "resumo_do_dia": {"politica_nacional": [{"id": 117130, "titulo": "Campanha de Tebet mira apoio de Kassab e de prefeitos do PSD em São Paulo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/campanha-de-tebet-mira-apoio-de-kassab-e-de-prefeitos-do-psd-em-sao-paulo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-22T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Articuladores da campanha de Simone Tebet (PSB) ao Senado em São Paulo estão tentando persuadir o presidente do PSD, Gilberto Kassab, a permitir que seus prefeitos apoiem a ex-ministra do governo Lula (PT).", "titulo_pt": "Campanha de Tebet busca apoio de Kassab e prefeitos do PSD em São Paulo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 117353, "titulo": "Mandato para ministros do STF não é a solução", "url": "https://www.jota.info/opiniao-e-analise/colunas/observatorio-constitucional/mandato-para-ministros-do-stf-nao-e-a-solucao", "fonte_id": "jota", "data_pub": "2026-08-22T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A proposta de mandato para ministros do STF não é apresentada como a solução para os problemas do tribunal. A insistência nessa ideia seria um erro de diagnóstico e aumentaria as disfunções já existentes.", "titulo_pt": "Proposta de mandato para ministros do STF não é a solução", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 117354, "titulo": "O panóptico invertido: quem fiscaliza o STF?", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-panoptico-invertido-quem-fiscaliza-o-stf", "fonte_id": "jota", "data_pub": "2026-08-22T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto destaca que investigar a origem de uma notícia vazada contradiz as decisões do Supremo Tribunal Federal sobre sigilo de fonte e liberdade de imprensa.", "titulo_pt": "O panóptico invertido: quem fiscaliza o STF?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 117356, "titulo": "A uniformidade jurisprudencial do IBS e da CBS: reflexões após o 9º Congresso da ABDF", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-uniformidade-jurisprudencial-do-ibs-e-da-cbs-reflexoes-apos-o-9o-congresso-da-abdf", "fonte_id": "jota", "data_pub": "2026-08-22T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto reflete sobre a uniformidade jurisprudencial do IBS e da CBS, baseado em discussões do 9º Congresso da ABDF. Uma homenagem ao professor Gustavo Brigagão é mencionada.", "titulo_pt": "Uniformidade jurisprudencial do IBS e da CBS: reflexões após o 9º Congresso da ABDF", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 117131, "titulo": "Cármen Lúcia rejeita tese de 'deepfake do bem' e compara vídeos de IA a foto de Tancredo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/carmen-lucia-rejeita-tese-de-deepfake-do-bem-e-compara-videos-de-ia-a-foto-de-tancredo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-22T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ministra do STF Cármen Lúcia rejeitou a tese de 'deepfake do bem' e comparou os vídeos de inteligência artificial que imitam pessoas a uma famosa foto de Tancredo Neves no hospital em 1985.", "titulo_pt": "Cármen Lúcia rejeita 'deepfake do bem' e compara vídeos de IA a foto de Tancredo neves", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 117219, "titulo": "Lula e Flávio fazem atos simultâneos neste sábado no Rio. Veja agenda", "url": "https://www.metropoles.com/brasil/flavio-e-lula-fazem-atos-simultaneos-neste-sabado-no-rio-veja-agenda", "fonte_id": "metropoles", "data_pub": "2026-08-22T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula e Flávio Bolsonaro realizam atos simultâneos no sábado (22/8) na região Sudeste, marcando a fase inicial da campanha eleitoral.", "titulo_pt": "Lula e Flávio fazem atos simultâneos neste sábado no Rio. Veja agenda", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 117220, "titulo": "Gilmar Mendes vai abrir divergência em dois pontos na Lei da Ficha Limpa", "url": "https://www.metropoles.com/colunas/ramiro-brites/gilmar-mendes-lei-ficha-limpa", "fonte_id": "metropoles", "data_pub": "2026-08-22T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Gilmar Mendes devolveu o caso ao Supremo Tribunal Federal após pedidos de vistas. O julgamento está previsto para meados de setembro.", "titulo_pt": "Gilmar Mendes abrirá divergência em dois pontos na Lei da Ficha Limpa", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 117222, "titulo": "Eleição no Brasil pode decidir futuro de relações com Israel e Ucrânia", "url": "https://www.metropoles.com/mundo/eleicao-no-brasil-pode-decidir-futuro-de-relacoes-com-israel-e-ucrania", "fonte_id": "metropoles", "data_pub": "2026-08-22T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Relações diplomáticas entre Brasil, Ucrânia e Israel estão em baixa devido às tensões nas guerras na Europa e no Oriente Médio. A eleição no Brasil pode influenciar o futuro dessas relações.", "titulo_pt": "Eleição no Brasil pode decidir futuro das relações com Ucrânia e Israel", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 117223, "titulo": "Lula resiste a desgaste e Flávio não decola", "url": "https://www.metropoles.com/blog-do-noblat/lula-resiste-a-desgaste-e-flavio-nao-decola", "fonte_id": "metropoles", "data_pub": "2026-08-22T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Datafolha indica que Lula mantém uma posição sólida, enquanto Flávio enfrenta dificuldades após um escândalo envolvendo Vorcaro. Os vazamentos seletivos sobre Lula e Flávio não afetaram as avaliações positivas de Lula.", "titulo_pt": "Lula mantém força e Flávio enfrenta desafios", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 117251, "titulo": "Inquéritos sobre Lulinha e Master só devem ser concluídos após eleições", "url": "https://www.cnnbrasil.com.br/politica/inqueritos-sobre-lulinha-e-master-so-devem-ser-concluidos-apos-eleicoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-22T07:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal pediu prorrogação de 60 dias para investigar Daniel Vorcaro e o Banco do Brasil (BRB). Este adiamento deve prolongar as apurações sobre Lulinha e Master.", "titulo_pt": "Inquéritos sobre Lulinha e Master só devem ser concluídos após eleições", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 117132, "titulo": "Datafolha: Lula lidera entre mulheres e mais pobres, e Flávio Bolsonaro, entre evangélicos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/datafolha-lula-lidera-entre-mulheres-e-mais-pobres-e-flavio-bolsonaro-entre-evangelicos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-22T03:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha revela que Lula lidera com 47% das intenções de voto contra Flávio Bolsonaro, que tem 43%, em cenário de segundo turno. Este resultado é semelhante ao de julho, quando Lula tinha 48% e Flávio, 43%.", "titulo_pt": "Datafolha: lula lidera entre mulheres e mais pobres, e Flávio Bolsonaro, entre evangélicos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 117133, "titulo": "Biografia de Carlos Lacerda narra virulência com que defendeu do comunismo ao golpismo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/biografia-de-carlos-lacerda-narra-virulencia-com-que-defendeu-do-comunismo-ao-golpismo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-22T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Carlos Lacerda era descrito como alguém que não dormia muito e nem deixava que os outros descansassem, segundo Newton Carlos. O governador Juracy Magalhães comparou Lacerda a um macaco em uma loja de louças, indicando seu comportamento agitado e intranquilo.", "titulo_pt": "Biografia de Carlos Lacerda retrata sua postura combativa contra o comunismo e o golpismo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 117164, "titulo": "Lula cobra maior agilidade de BB e Caixa na liberação de crédito a motoristas de app e táxi", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/lula-cobra-maior-agilidade-de-bb-e-caixa-na-liberacao-de-credito-a-motoristas-de-app-e-taxi.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-22T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva se reuniu com os presidentes do Banco do Brasil e da Caixa Econômica Federal para pressionar por maior agilidade na liberação de crédito para motoristas de aplicativos e taxistas. Lula está insatisfeito com o ritmo atual dos financiamentos.", "titulo_pt": "Lula pressiona BB e Caixa por maior agilidade na liberação de crédito para motoristas de aplicativos e taxistas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 117199, "titulo": "Pesquisa Datafolha mostra como está a disputa ao Senado no segundo maior colégio eleitoral do Brasil", "url": "https://veja.abril.com.br/politica/pesquisa-datafolha-mostra-como-esta-a-disputa-ao-senado-no-segundo-maior-colegio-eleitoral-do-brasil/", "fonte_id": "veja", "data_pub": "2026-08-22T01:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha revela o cenário atual da disputa ao Senado no segundo maior colégio eleitoral do Brasil, onde 45% dos eleitores ainda estão indecisos ou não escolheram nenhum nome.", "titulo_pt": "Pesquisa Datafolha mostra como está a disputa ao Senado no segundo maior colégio eleitoral do Brasil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 117178, "titulo": "Veja como foi a sexta-feira (21) dos candidatos a presidente", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/veja-como-foi-sexta-feira-21-dos-candidatos-presidente", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-22T01:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nesta sexta-feira (21), os candidatos à Presidência da República realizaram diversos atos, incluindo debates e entrevistas. A agenda da candidata Clariana Barão foi cancelada, mas ela publicou um vídeo sobre combate à violência de gênero.", "titulo_pt": "Veja como foi a sexta-feira dos candidatos a presidente", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 117134, "titulo": "Em Minas, Lula diz que adversários mentem e chama Zema de 'comedor de banana com casca'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/em-minas-lula-diz-que-adversarios-mentem-e-chama-zema-de-comedor-de-banana-com-casca.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-22T00:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula criticou o ex-governador Romeu Zema e o ex-presidente Jair Bolsonaro durante uma visita oficial em Governador Valadares, Minas Gerais. Ele acusou os adversários de mentir e chamou Zema de 'comedor de banana com casca'.", "titulo_pt": "Lula critica Zema e bolsonaro em visita oficial em Minas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 117678, "titulo": "Why China’s EV boom is seen as an ‘unparalleled opportunity’ in Africa", "url": "https://www.scmp.com/news/china/diplomacy/article/3364799/why-chinas-ev-boom-seen-unparalleled-opportunity-africa?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-22T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A África vê a expansão da produção chinesa de veículos elétricos e tecnologias verdes como uma oportunidade para adquirir tecnologia e desenvolver o setor, enquanto os governos dos EUA e algumas partes da Europa consideram a produção chinesa excessiva. A China é líder global na indústria de veículos elétricos, produzindo quase 75% dos veículos elétricos do mundo e dominando a cadeia de suprimentos, o que reduziu os custos desses veículos e componentes.", "titulo_pt": "Por que o boom de veículos elétricos da China é visto como uma 'oportunidade sem precedentes' na áfrica", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 117430, "titulo": "What Does Harry and Meghan’s Return to England Mean for Their Children?", "url": "https://www.nytimes.com/2026/08/22/world/europe/harry-meghan-children-schools.html", "fonte_id": "nyt_world", "data_pub": "2026-08-22T09:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A volta de Harry e Meghan a Inglaterra permitirá que Archie e Lilibet se eduquem como
