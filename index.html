</div>

<script>
const D = {"gerado_em": "19/08/2026 07:22", "stats": {"noticias_novas": 812, "resumos_gerados": 240}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Brasil enfrenta diversos desafios políticos e sociais neste momento. A presidência do Superior Tribunal de Justiça (STJ) foi assumida pelo ministro Herman Benjamin, que terá que lidar com investigações envolvendo outros ministros. As eleições de 2026 continuam com foco nas candidatas, que representam 34,9% das candidaturas. A campanha de Flávio Bolsonaro decidiu participar apenas do primeiro turno se Lula estiver presente, para evitar conflitos. O Tribunal Superior Eleitoral encerrou uma ação do PT sobre o fundo eleitoral, após a sigla desistir. O plano de governo de Fernando Haddad destaca a segurança pública, contrastando com a associação tradicional da esquerda a esse tema. Candidatos suspeitos de ligações com facções criminosas continuam a registrar suas candidaturas, apesar da pressão do Ministério Público. O plano de governo de Tarcísio de Freitas enfatiza a dimensão social, diferentemente da imagem de bolsonarista que o ajudou a ganhar a eleição em 2022. A campanha de Flávio Bolsonaro quer revisitar a reforma tributária, mas não detalha como reduzir a alíquota do IVA. O plano registrado por Haddad foca a segurança pública, contrastando com a imagem tradicional da esquerda. A Telefônica e o governo de São Paulo fecharam um acordo para encerrar disputas judiciais de 20 anos. O STF suspendeu por 90 dias a aplicação de multas da NR-1, regras de saúde mental. O CNJ restituiu o cargo de um juiz que sugeriu venda do Banco Santos ao Master, mas vetou sua atuação no processo de falência. O Brasil também discute ideias controversas como a castração química e a lotação de prisões com adolescentes para combater o crime organizado.", "mundo": "A Ucrânia enfrenta uma série de desafios políticos e econômicos, com investigações sobre corrupção e a possibilidade de eleições presidenciais. Recentemente, o ministro da Transformação Digital Mykhailo Fedorov chamou para novas eleições, rompendo com o presidente Volodymyr Zelensky e marcando um novo desafio para o governo. Paralelamente, a Ucrânia luta contra um surto de Ebola que já infectou mais de 5.000 pessoas, enquanto voluntários e padres trabalham para restaurar a Catedral Dormição em Kiev após um incêndio causado por drones russos. Além disso, as tensões comerciais continuam, com o presidente dos Estados Unidos, Donald Trump, adiando o anúncio de tarifas sobre importações canadenses e sugerindo a possibilidade de reviver o Pipeline Keystone XL.\n\nOs conflitos geopolíticos continuam a dominar o cenário internacional. A Ucrânia enfrenta intensos ataques aéreos russos, resultando em pelo menos cinco mortes. O conflito persiste, com Israel continuando a atacar zonas no sul do Líbano, apesar de um acordo de alto-fogão com os Estados Unidos. A Coreia do Norte criticou as manobras militares conjuntas entre EUA e Coreia do Sul, considerando-as uma ameaça à segurança regional. Em outro front, o Irã está avaliando possíveis ataques a alvos americanos na Europa, enquanto o Emirados Árabes Unidos impôs um embargo comercial indefinido ao Irã em resposta a supostos ataques com mísseis. As tensões na região do Mar do Norte também aumentaram, com incidentes envolvendo grandes embarcações causando problemas de segurança em tentativas de travessias para a Inglaterra. Estes eventos refletem a complexidade e a instabilidade da atual situação geopolítica global.", "economia": "A ata da última decisão de juros do Federal Reserve (Fed) é o principal indicador do dia, refletindo a reação dos investidores à inflação e aos déficits governamentais crescentes. O rendimento dos títulos do Tesouro americano de 30 anos atingiu o nível mais alto desde 2007. Em contraste, a China enfrenta uma queda rara no lucro líquido da empresa de licor Moutai, refletindo preocupações econômicas. No Brasil, a venda da unidade de cimento da CSN Cimentos segue indefinida devido a divergências sobre o valor final do negócio. As recuperações judiciais aumentaram 66% com juros altos e crédito restrito, puxadas pelo agronegócio, enquanto a Cosan comunica a intenção de deixar a Bolsa de Nova York e manter ações na B3, visando simplificar a estrutura da companhia e reduzir custos.", "tecnologia": "A empresa chinesa Unitree teve um desempenho extraordinário em sua estreia na bolsa de Shanghai, com o valor das ações subindo 600% nas negociações iniciais. Este sucesso reflete o interesse crescente no setor de robótica, especialmente em robôs humanoides. Paralelamente, a SK hynix anunciou um plano para comprar e cancelar 40 trilhões de wones de suas próprias ações, o maior programa de compra de ações já realizado por uma empresa listada na Coreia do Sul. Este movimento indica a confiança da empresa na longa vida do ciclo de memória de inteligência artificial. Além disso, a Innolux, uma empresa de display, prevê um significativo crescimento nas entregas de produtos, refletindo a demanda crescente por tecnologia avançada. Estes eventos destacam a dinâmica do mercado tecnológico, com destaque para a expansão de empresas chinesas e sul-coreanas, bem como a confiança em tecnologias relacionadas à inteligência artificial.", "ciencia": "Astrônomos descobriram um gigante rochoso, conhecido como 'mega-Earth', 23 vezes mais massivo que a Terra, em um recente achado que desafia as expectativas atuais na pesquisa espacial. Paralelamente, uma pesquisa da Universidade de Cambridge mostrou que políticos britânicos sobreestimam significativamente a oposição pública a políticas climáticas, sugerindo que medidas mais ambiciosas podem ser adotadas com base em dados mais precisos. Outro destaque foi a publicação de imagens da NASA mostrando uma cratera na superfície da Lua causada pelo impacto de um foguete da SpaceX, evidenciando o impacto crescente do comércio espacial na superfície lunar. Além disso, cientistas da Universidade de Oldenburg desenvolveram técnicas para controlar com precisão os campos elétricos de luz, permitindo manipular a dinâmica de elétrons individuais em experimentos, um avanço significativo na física quântica. Por fim, um estudo da Universidade de Michigan mostrou que, no contexto de serviços de processamento de dados, a melhor abordagem pode ser priorizar os clientes de maior gasto em uma fila posterior, enquanto as tarefas menores são concluídas primeiro, contradizendo a noção comum de que os clientes de maior valor devem ser atendidos com prioridade.", "cultura": "A cultura global tem sido rica e diversificada, com diversos eventos e iniciativas destacados. A cantora Shakira fez uma doação generosa de 1 milhão de dólares para a reconstrução de escolas na Colômbia após um terremoto, enquanto a fundação de Howard Buffett planeja construir 10 escolas no estado de Chocó. Em Londres, David Shrigley está exibindo suas obras ao lado de pinturas de mestres holandeses e flamencos do século XVII, explorando temas contemporâneos nas obras originais. A cidade de Seul, na Coreia do Sul, está combatendo o avanço de jovens cicadas em um parque ecológico, com a prefeitura colocando faixas informativas no local. O diretor britânico John Irvin, conhecido por dirigir a minissérie vencedora de Bafta 'Tinker Tailor Soldier Spy', faleceu aos 86 anos, deixando um legado importante na indústria cinematográfica. Além disso, o SBT está comemorando seus 45 anos com a exibição de episódios raros de 'Chaves', que foram resgatados de seu acervo, restaurados e tratados com tecnologia. A atriz brasileira Laura Cardoso, que se opôs a tratamentos estéticos e criticou a preferência pela beleza física em novelas, faleceu aos 98 anos, deixando um legado importante na televisão. O presidente Lula declarou luto de três dias em homenagem a Glória Menezes e Laura Cardoso, que faleceram nesta terça-feira, 18, deixando um legado importante na televisão brasileira.", "sociedade": "A sociedade enfrenta diversos desafios e situações complexas. No Brasil, por exemplo, o presidente Lula decretou luto oficial de três dias após a morte de duas atrizes, Glória Menezes e Laura Cardoso. O país também luta contra a violência doméstica, como no caso do empresário Ivo Kos, que foi preso por violência contra a esposa, com a ajuda de um segurança privado. A especialista Beatriz Accioly defende uma abordagem integral no combate à violência doméstica. No exterior, Bangladesh lançou um serviço de ônibus exclusivo para mulheres, chamado 'Pink Bus', em Daca, para oferecer transporte seguro. Em Hong Kong, a população diminuiu pela primeira vez em mais de 20 anos, com o número de nascimentos caindo abaixo de 30.000. Na Colômbia, agricultores enfrentam a crise após um terremoto de magnitude 7,4, com bandeiras 'Ajuda, SOS' alertando para a situação crítica. No Chile, o Dia Nacional da Solidariedade foi comemorado com projeções em homenagem ao santo chileno San Alberto Hurtado.", "meio_ambiente": "Um grande incêndio em um centro de reciclagem em Deptford, sul de Londres, chamou a atenção como o evento mais importante, com 15 viaturas de bombeiros e aproximadamente 100 bombeiros trabalhando para controlar as chamas. O Super El Niño, um fenômeno climático que ganha força no Pacífico, pode superar recordes e causar aumento de calor extremo, seca, incêndios e chuvas intensas até 2027, conforme alerta do jornal Veja. Além disso, a prefeitura metropolitana de Seul planeja cobrir todos os passeios com sombra até 2028 para combater as ondas de calor. Também foi acordado um aumento de 25% na quota anual de atum azul do Pacífico para 2027 e 2028, a partir da atual quota de 11.869 toneladas, conforme informado pelo Japan Times.", "direitos_humanos": "Um tribunal sírio condenou Wassim al-Assad, primo do presidente Bashar al-Assad, à morte por crimes contra a humanidade, por múltiplos assassinatos e por assassinatos acompanhados de tortura e brutalidade durante a guerra civil que durou quase 14 anos. Em outro caso, o Ministério Público Federal processou Renan Santos e o Movimento Renovação Liberal por supostos discursos de ódio contra indígenas. Além disso, milhares de pessoas lamentaram a morte de Jason Arday em Londres, acusando a mídia de ter contribuído intensamente e de maneira racista para sua morte. Em Hong Kong, os pais de um bebê perderam uma ação legal para recuperar seu filho, que foi levado para a guarda das autoridades de assistência social. A indústria de tecnologia tem retratado o desenvolvimento da inteligência artificial da China como uma ameaça existencial, mas a realidade não é tão simples. A estação de rádio Radio Begum, criada por mulheres para mulheres, é a única conexão com o mundo exterior para muitas mulheres afegãs, oferecendo esperança em meio ao regime do Talibã."}, "resumo_do_dia": {"politica_nacional": [{"id": 111248, "titulo": "Salomão assume a presidência do STJ em meio a investigações envolvendo outros ministros", "url": "https://www.jota.info/justica/salomao-assume-a-presidencia-do-stj-em-meio-a-investigacoes-envolvendo-outros-ministros", "fonte_id": "jota", "data_pub": "2026-08-19T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Salomão assumiu a presidência do STJ e terá que implementar o filtro de relevância e indicar as listas tríplices para as vagas em aberto. Além disso, ele se encontra em meio a investigações envolvendo outros ministros.", "titulo_pt": "Salomão assume a presidência do STJ em meio a investigações", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 111107, "titulo": "Com salários de até R$ 3,4 mil, DF tem 1.887 vagas nesta 4ª feira", "url": "https://www.metropoles.com/distrito-federal/com-salarios-de-ate-r-34-mil-df-tem-1-887-vagas-nesta-4a-feira", "fonte_id": "metropoles", "data_pub": "2026-08-19T09:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Distrito Federal oferece 1.887 vagas de emprego, com salários que podem chegar a R$ 3,4 mil. O cargo de calceteiro é o que oferece a maior remuneração, com R$ 3,4 mil e 10 vagas disponíveis na Asa Sul.", "titulo_pt": "Com salários de até R$ 3,4 mil, DF tem 1.887 vagas nesta quarta-feira", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 111249, "titulo": "Com composição completa, Carf afasta concomitância de multa isolada e de ofício", "url": "https://www.jota.info/tributos/composicao-completa-carf-afasta-concomitancia-multa-isolada-de-oficia", "fonte_id": "jota", "data_pub": "2026-08-19T09:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho Administrativo de Recursos Fiscais (Carf) manteve a composição completa e decidiu que não há concomitância entre a aplicação de multas tributárias isoladas e de ofício. O placar foi de 9 votos a favor e 1 contra, fortalecendo a tese contra a aplicação simultânea dessas multas.", "titulo_pt": "Com composição completa, Carf afirma não haver concomitância entre multas isoladas e de ofício", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 111020, "titulo": "Sociedade de Pediatria desaconselha fotos com pacientes em redes sociais e upload de imagens de IA", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/sociedade-de-pediatria-desaconselha-fotos-com-pacientes-em-redes-sociais-e-upload-de-imagens-de-ia.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-19T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Sociedade Brasileira de Pediatria recomenda que médicos não compartilhem fotos com pacientes em redes sociais profissionais. Essa orientação foi emitida em resposta às novas regras do ECA Digital.", "titulo_pt": "Sociedade de Pediatria desaconselha fotos com pacientes em redes sociais e upload de imagens de IA", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 111250, "titulo": "O municipalismo acabou?", "url": "https://www.jota.info/opiniao-e-analise/colunas/gestao-politica-sociedade/o-municipalismo-acabou", "fonte_id": "jota", "data_pub": "2026-08-19T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A estratégia de aproximação com prefeituras no Maranhão não assegura que esses aliados institucionais sejam também aliados eleitorais. Isso sugere que a lealdade política pode variar entre contextos institucionais e eleitorais.", "titulo_pt": "O municipalismo terminou?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 111254, "titulo": "Exceção Romeu e Julieta sob o crivo do STF", "url": "https://www.jota.info/opiniao-e-analise/colunas/defensor-legis/excecao-romeu-e-julieta-sob-o-crivo-do-stf", "fonte_id": "jota", "data_pub": "2026-08-19T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O caso Romeu e Julieta foi admitido para análise pelo Superior Tribunal de Justiça (STJ), indicando que a questão envolvendo a idade mínima para casamento é complexa. A controvérsia sobre a idade mínima não é superada pela proximidade dos envolvidos.", "titulo_pt": "Exceção Romeu e Julieta sob o crivo do STF", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 111120, "titulo": "O dia em que Brizola decidiu fazer a elite engolir o \"sapo barbudo\"", "url": "https://www.metropoles.com/blog-do-noblat/ricardo-noblat/o-dia-em-que-brizola-decidiu-fazer-a-elite-engolir-o-sapo-barbudo", "fonte_id": "metropoles", "data_pub": "2026-08-19T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Durante a eleição de 1989, Tancredo Neves Filho, conhecido como Brizola, decidiu transferir votos sem a necessidade de ordens do líder, mostrando que o voto popular é o verdadeiro motor da eleição. A lição evidencia que a transferência de votos não é determinada por ordens superiores, mas sim pelo desejo do eleitorado.", "titulo_pt": "O dia em que Brizola fez a elite engolir o 'sapo barbudo'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 111021, "titulo": "Flávio Bolsonaro decide só ir a debates no 1º turno com Lula para evitar ser alvo da própria direita", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/flavio-bolsonaro-decide-so-ir-a-debates-no-1o-turno-com-lula-para-evitar-ser-alvo-da-propria-direita.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-19T07:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de Flávio Bolsonaro decidiu que ele só irá aos debates do primeiro turno se Lula participar, para evitar conflitos com os outros candidatos. Isso foi informado pela campanha do próprio candidato.", "titulo_pt": "Flávio Bolsonaro decide ir a debates no 1º turno com Lula para evitar confrontos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 111022, "titulo": "TSE encerra ação do PT após desistência e destrava repasses do fundo eleitoral", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/08/tse-encerra-acao-do-pt-apos-desistencia-e-destrava-repasses-do-fundo-eleitoral.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-19T02:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral encerrou uma ação do PT que buscava aumentar o valor do fundo eleitoral para as eleições de 2026, após a sigla desistir da proposta. O colegiado acolheu a desistência de forma unânime.", "titulo_pt": "TSE encerra ação do PT sobre fundo eleitoral após desistência", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 111023, "titulo": "Candidatas mulheres são um terço do total há quatro eleições nacionais; veja perfil de 2026", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/candidatas-mulheres-sao-um-terco-do-total-ha-quatro-eleicoes-nacionais-veja-perfil-de-2026.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-19T02:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O percentual de candidaturas femininas nas eleições de 2026 é de 34,9%, uma pequena variação positiva em relação às eleições de 2022, que registraram 33,8%. Este é o quarto pleito nacional consecutivo em que as mulheres representam um terço das candidaturas.", "titulo_pt": "Candidatas mulheres são um terço do total há quatro eleições nacionais; veja perfil de 2026", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 111024, "titulo": "MPF processa Renan Santos e MBL por ofensas a indígenas e pede R$ 500 mil de indenização", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/mpf-processa-renan-santos-e-mbl-por-ofensas-a-indigenas-e-pede-r-500-mil-de-indenizacao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-19T02:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público Federal no Pará processou Renan Santos, candidato à Presidência pelo partido Missão, por ofensas a indígenas do estado e solicitou uma indenização no valor de R$ 500 mil.", "titulo_pt": "MPF processa Renan Santos por ofensas a indígenas e pede R$ 500 mil de indenização", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 111025, "titulo": "Eleições 2026: Confira a agenda de Lula, Flávio Bolsonaro e outros presidenciáveis", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/eleicoes-2026-confira-a-agenda-de-lula-flavio-bolsonaro-e-outros-presidenciaveis.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-19T02:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nesta terça-feira (18), os candidatos à Presidência realizam agendas de campanha em diversos estados brasileiros. A Folha de S.Paulo lista os principais compromissos divulgados pelas campanhas.", "titulo_pt": "Eleições 2026: confira a agenda de Lula, Flávio Bolsonaro e outros presidenciáveis", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 111026, "titulo": "Flávio toca um disco velho", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/eliogaspari/2026/08/flavio-toca-um-disco-velho.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-19T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula realizou uma visita a São Bernardo para lembrar greves históricas de 1979. Flávio Bolsonaro voltou a utilizar um discurso inconsistente semelhante ao de seu pai.", "titulo_pt": "Flávio toca um disco velho", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 111027, "titulo": "Plano registrado por Haddad foca segurança em contraste com imagem da esquerda; conheça propostas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/plano-registrado-por-haddad-foca-seguranca-em-contraste-com-imagem-da-esquerda-conheca-propostas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-19T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O plano de governo de Fernando Haddad, candidato do PT, destaca a segurança pública como prioridade. Este foco contrasta com a associação tradicional da esquerda à questão, que historicamente foi vista como um desafio para a esquerda.", "titulo_pt": "Plano de Haddad enfatiza segurança pública em contraste com imagem da esquerda", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 111028, "titulo": "Plano de governo de Tarcísio destaca social em contraste com imagem de bolsonarista; conheça propostas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/plano-de-governo-de-tarcisio-destaca-social-em-contraste-com-imagem-de-bolsonarista-conheca-propostas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-19T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O plano de governo de Tarcísio de Freitas enfatiza a dimensão social, diferentemente da imagem de bolsonarista associada a grandes obras que o ajudou a ganhar a eleição em 2022.", "titulo_pt": "Plano de governo de Tarcísio destaca social em contraste com imagem de bolsonarista", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 111029, "titulo": "Partidos lançam candidatos suspeitos de elo com facções apesar de pressão do Ministério Público", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/partidos-lancam-candidatos-suspeitos-de-elo-com-faccoes-apesar-de-pressao-do-ministerio-publico.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-19T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Candidatos suspeitos de terem ligações com facções criminosas registraram suas candidaturas para as eleições de 2026, apesar da pressão do Ministério Público para que os partidos criassem regras contra a infiltração desses grupos na política.", "titulo_pt": "Partidos lançam candidatos suspeitos de ligação com facções apesar da pressão do Ministério Público", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 111422, "titulo": "Striking hospital employees sound alarm over workplace violence", "url": "https://www.npr.org/2026/08/19/nx-s1-5930385/nurses-strike-hospital-workplace-violence-patient-attacks", "fonte_id": "npr_news", "data_pub": "2026-08-19T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores de hospitais em greve relatam preocupações com a violência dos pacientes. Os trabalhadores de hospitais têm sete vezes mais chances de sofrer ferimentos devido a atos violentos do que o trabalhador médio.", "titulo_pt": "Grevistas de hospitais alertam sobre violência dos pacientes", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 111340, "titulo": "Fresh Ukraine corruption probe adds to pressure on Zelenskyy ahead of key vote – Europe live", "url": "https://www.theguardian.com/world/live/2026/aug/19/europe-ukraine-zelenskyy-mykhailo-fedorov-parliament-vote-corruption-probe-russia-belgium-wildfires-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-08-19T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma investigação sobre parlamentares não identificados ocorre horas antes de um voto no parlamento sobre o sucessor de Mykhailo Fedorov. Em Estonia, o governo investiga se a Rússia esteve envolvida em um incêndio em um prédio usado por uma empresa de defesa. A Milrem Robotics, fabricante de sistemas de armas militares semiautônomas, foi alvo do ataque no final de semana.", "titulo_pt": "Nova investigação de corrupção na Ucrânia aumenta pressão em Zelenskyy antes de votação crucial – Europa em tempo real", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 111465, "titulo": "US charges 17 Iranians over 'massive' cyber theft campaign", "url": "https://www.bbc.co.uk/news/articles/c1m14n4llvvo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-19T09:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Justiça dos Estados Unidos acusa 17 iranianos de participar de uma campanha de cibercrime considerada massiva. De acordo com as autoridades, muitos dos supostos ataques cibernéticos foram realizados em nome do governo iraniano.", "titulo_pt": "EUA acusam 17 iranianos de cibercrime massivo", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 111487, "titulo": "Ukraine anti-graft agencies uncover alleged laundering group tied to presidential official", "url": "https://www.france24.com/en/europe/20260819-ukraine-anti-graft-agencies-uncover-alleged-laundering-group-tied-to-presidential-official", "fonte_id": "france24", "data_pub": "2026-08-19T09:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As agências antissequestro da Ucrânia revelaram a existência de um grupo, incluindo um funcionário do presidente, envolvido no lavagem de 150 milhões de hryvnias (aproximadamente US$3,35 milhões) usados para pagar fianças em um esquema de corrupção no setor energético.", "titulo_pt": "Agências antissequestro da Ucrânia descobrem grupo suspeito de lavagem de dinheiro envolvendo funcionário presidencial", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 111507, "titulo": "Nord Stream: Second suspect arrested over pipeline blasts", "url": "https://www.dw.com/en/nord-stream-second-suspect-arrested-over-pipeline-blasts/a-78427413?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-19T09:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um suspeito ucraniano, supostamente um nadador-salvador treinado, foi detido na Croácia por investigadores alemães. Ele é fortemente suspeito de ter causado as explosões nos dutos Nord Stream em colaboração com outros.", "titulo_pt": "Nord Stream: suspeito ucraniano detido na croácia", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 111535, "titulo": "María Consuelo Araújo, the ambassador De la Espriella hopes will shore up Bogotá’s alliance with the United States", "url": "https://english.elpais.com/international/2026-08-19/maria-consuelo-araujo-the-ambassador-de-la-espriella-hopes-will-shore-up-bogotas-alliance-with-the-united-states.html", "fonte_id": "elpais_en", "data_pub": "2026-08-19T09:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "María Consuelo Araújo será a nova embaixadora em Washington, uma posição de grande interesse para o presidente colombiano, com o objetivo de fortalecer sua relação com Trump.", "titulo_pt": "María Consuelo Araújo, a embaixadora que o presidente colombiano espera fortalecer a aliança com os estados unidos", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 111560, "titulo": "At least five killed in Russian air attacks on Ukraine", "url": "https://www.aljazeera.com/news/2026/8/19/at-least-five-killed-in-russian-air-attacks-on-ukraine?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-19T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos cinco pessoas morreram em ataques aéreos russos em território ucraniano. De acordo com o Ministério da Defesa russo, 453 drones ucranianos foram abatidos em diversas regiões durante a noite.", "titulo_pt": "Pelo menos cinco mortos em ataques aéreos russos na Ucrânia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 111088, "titulo": "O jogo pesado de Kushner: um dia com o Hamas, outro com Netanyahu", "url": "https://veja.abril.com.br/coluna/mundialista/o-jogo-pesado-de-kushner-um-dia-com-o-hamas-outro-com-netanyahu/", "fonte_id": "veja", "data_pub": "2026-08-19T09:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O genro do presidente dos Estados Unidos, Jared Kushner, tem realizado negociações difíceis com o Hamas e o governo de Israel, Netanyahu, buscando alcançar acordos que possam levar à estabilização de Gaza.", "titulo_pt": "O jogo pesado de Kushner: um dia com o Hamas, outro com Netanyahu", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 111625, "titulo": "Suspend Officers Suspected of Beating Serb, Kosovo Police Inspectorate Says", "url": "https://balkaninsight.com/2026/08/19/suspend-officers-suspected-of-beating-serb-kosovo-police-inspectorate-says/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-08-19T09:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inspeção independente iniciou uma investigação sobre acusações de que um homem sérvio de Kosovo foi agredido por policiais durante uma operação em sua casa na vila de Dren, no município de Zubin Potok.", "titulo_pt": "Iniciada investigação sobre suposto caso de agressão policial a homem sérvio em dren, Kosovo", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 111328, "titulo": "Kyiv’s Dormition Cathedral is Revived after Russian Drone Strike", "url": "https://www.nytimes.com/2026/08/19/world/europe/ukraine-kyiv-cathedral-russia-drone-strike.html", "fonte_id": "nyt_world", "data_pub": "2026-08-19T09:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Voluntários e padres se reuniram para limpar a Catedral Dormição em Kiiv, que ainda cheirava a fumaça após um grande incêndio, em preparação para uma celebração anual.", "titulo_pt": "Catedral dormição em kiiv é restaurada após ataque de Drone russo", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 111423, "titulo": "Congo's Ebola outbreak reaches 5,000 cases as it outpaces response efforts", "url": "https://www.npr.org/2026/08/19/g-s1-139164/congo-ebola-outbreak", "fonte_id": "npr_news", "data_pub": "2026-08-19T09:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O surto de Ebola na República Democrática do Congo registrou até agora 5.021 casos, com 2.378 mortes. O surto infectou e causou mais mortes com maior velocidade do que qualquer outro surto histórico.", "titulo_pt": "Surto de Ebola na república democrática do congo atinge 5.000 casos", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 111489, "titulo": "Meta knowingly hooked children and misled public, prosecutors tell court", "url": "https://www.france24.com/en/video/20260819-meta-knowingly-hooked-children-and-misled-public-prosecutors-tell-court", "fonte_id": "france24", "data_pub": "2026-08-19T09:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Meta é acusada de conscientemente viciar e explorar crianças, de acordo com depoimentos em uma corte federal nos Estados Unidos. Estados Unidos estão pedindo uma multa de aproximadamente 200 bilhões de dólares à empresa por designar produtos que seriam viciantes para jovens usuários.", "titulo_pt": "Meta conscientemente viciou e explorou crianças, acusa juízo", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 111367, "titulo": "Israel vuelve a atacar zonas del sur de Líbano a pesar del alto el fuego", "url": "https://www.latercera.com/mundo/noticia/israel-vuelve-a-atacar-zonas-del-sur-de-libano-a-pesar-del-alto-el-fuego/", "fonte_id": "la_tercera", "data_pub": "2026-08-19T09:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em 26 de junho, Líbano e Israel chegaram a um acordo inicial com a mediação dos Estados Unidos, estabelecendo as bases para um alto elogado permanente. Apesar disso, Israel continuou a atacar zonas no sul do Líbano.", "titulo_pt": "Israel volta a atacar sul do Líbano, apesar do alto elogado", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 111565, "titulo": "US pilot lands jet without front wheels after landing gear failure", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/19/us-pilot-lands-jet-without-front-wheels-after-landing-gear-failure?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-19T09:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um piloto dos Estados Unidos pousou um jato sem as rodas da frente após falha no sistema de aterrissagem.", "titulo_pt": "Piloto dos EUA pousa jato sem rodas da frente após falha no sistema de aterrissagem", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 111537, "titulo": "Iran reportedly weighs attacks on U.S. targets in Europe as UAE severs trade with Tehran", "url": "https://www.cnbc.com/2026/08/19/us-iran-war-trump-hormuz.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-19T08:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades iranianas estão avaliando possíveis ataques a alvos americanos na Europa, enquanto as negociações entre Washington e Teerã estão em pausa. O Emirados Árabes Unidos suspendeu as relações comerciais com o Irã.", "titulo_pt": "Irã considera ataques a alvos americanos na Europa após emirados árabes cortarem comércio com teerã", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 111478, "titulo": "French government apologizes for tax data hack, but struggles to contain fallout", "url": "https://www.lemonde.fr/en/politics/article/2026/08/19/french-government-apologizes-for-tax-data-hack-but-struggles-to-contain-fallout_6756663_5.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-19T08:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro do Orçamento francês, David Amiel, anunciou medidas de emergência após um ataque cibernético significativo. Além disso, a administração tributária revelou outro vazamento em seus sistemas.", "titulo_pt": "Governo francês se desculpa por vazamento de dados fiscais, mas luta para contornar os efeitos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 111032, "titulo": "Como uma empresa que imitou a marca Jordan driblou a Nike na China", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/como-uma-empresa-que-imitou-a-marca-jordan-driblou-a-nike-na-china.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-19T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Acima da entrada da ampla sede corporativa da Qiaodan, em Xiamen, China, um logotipo vermelho exibe a silhueta de um atleta. A empresa parece ter imitado a marca Jordan, o que pode ter lhe dado vantagem sobre a Nike no mercado chinês.", "titulo_pt": "Como a empresa qiaodan, que imitou a marca Jordan, driblou a Nike na China", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 111540, "titulo": "Treasury yields pull back from multi-decade highs ahead of FOMC minutes", "url": "https://www.cnbc.com/2026/08/19/treasury-yields-multi-decade-highs-bonds-inflation.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-19T08:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A taxa de juros do título do Tesouro dos Estados Unidos de 10 anos, um indicador-chave para empréstimos governamentais, caiu 2 pontos base para 4,686%. Os minutos da reunião do FOMC estão prestes a serem divulgados.", "titulo_pt": "Taxa de juros do tesouro dos EUA recua para níveis multi-decênios antes da divulgação dos minutos do FOMC", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 111251, "titulo": "Uma análise da decisão da ANPD sobre o Discord", "url": "https://www.jota.info/opiniao-e-analise/artigos/uma-analise-da-decisao-da-anpd-sobre-o-discord", "fonte_id": "jota", "data_pub": "2026-08-19T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A decisão da ANPD sobre o Discord aborda a arquitetura de risco das plataformas e a responsabilidade civil preventiva.", "titulo_pt": "Análise da decisão da ANPD sobre o Discord", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 111252, "titulo": "Quando preservar a empresa deixa de preservar o sistema", "url": "https://www.jota.info/opiniao-e-analise/artigos/quando-preservar-a-empresa-deixa-de-preservar-o-sistema", "fonte_id": "jota", "data_pub": "2026-08-19T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O novo provimento do CNJ sobre recuperação judicial é considerado positivo, mas não aborda o problema fundamental da recuperação judicial.", "titulo_pt": "Preservar a empresa ou o sistema: dilema na recuperação judicial", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 111703, "titulo": "POSCO, Chinese firm to collaborate on battery materials business", "url": "https://en.yna.co.kr/view/AEN20260819010000320", "fonte_id": "yonhap_news", "data_pub": "2026-08-19T08:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A POSCO Group, maior siderúrgica da Coreia do Sul, anunciou uma colaboração com uma empresa chinesa para o negócio de materiais de baterias.", "titulo_pt": "POSCO e empresa chinesa irão colaborar no negócio de materiais de baterias", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 111255, "titulo": "A reforma trabalhista e os desafios dos precedentes na Justiça do Trabalho", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-reforma-trabalhista-e-os-desafios-dos-precedentes-na-justica-do-trabalho", "fonte_id": "jota", "data_pub": "2026-08-19T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute como equilibrar a segurança jurídica com a proteção ao trabalhador na implementação de precedentes obrigatórios.", "titulo_pt": "A reforma trabalhista e os desafios dos precedentes na Justiça do Trabalho", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 111218, "titulo": "Descoberta na Foz do Amazonas só será 'passaporte para o futuro' se modelo adotado no pré-sal mudar, diz ex-diretor da Petrobras", "url": "https://www.bbc.com/portuguese/articles/ckgdxxxj3p4o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-19T07:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ildo Sauer, professor do Instituto de Energia e Ambiente da USP e ex-diretor da Petrobras, considera a descoberta de petróleo na Foz do Amazonas como 'muito animadora', mas alerta para a necessidade de cautela, destacando a importância de mudanças no modelo adotado no pré-sal para que a descoberta possa se tornar 'passaporte para o futuro'.", "titulo_pt": "Descoberta na Foz do Amazonas só será 'passaporte para o futuro' se modelo do pré-sal mudar, diz ex-diretor da Petrobras", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 111704, "titulo": "(LEAD) Korean won strengthens past 1,400-per-dollar level", "url": "https://en.yna.co.kr/view/AEN20260819006251315", "fonte_id": "yonhap_news", "data_pub": "2026-08-19T07:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 19 de agosto, o won sul-coreano se fortaleceu, ultrapassando o nível de 1.400-won por dólar.", "titulo_pt": "Won sul-coreano fortalece-se acima de 1.400-won por dólar", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 111182, "titulo": "Os novos desafios dos BCs com a venda em massa no mercado de títulos", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/os-novos-desafios-dos-bcs-com-a-venda-em-massa-no-mercado-de-titulos/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-19T07:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O rendimento dos títulos do Tesouro americano de 30 anos atingiu o nível mais alto desde 2007, refletindo a reação dos investidores à inflação e aos déficits governamentais crescentes.", "titulo_pt": "Novos desafios dos BCs com a venda em massa no mercado de títulos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 111708, "titulo": "SK hynix to buy back 40 tln won worth of common shares", "url": "https://en.yna.co.kr/view/AEN20260819008600320", "fonte_id": "yonhap_news", "data_pub": "2026-08-19T07:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SK hynix, empresa sul-coreana de semicondutores, anunciou que irá comprar de volta 40 trilhões de wones em ações comuns. O anúncio foi feito em Seul no dia 19 de agosto.", "titulo_pt": "SK hynix vai comprar de volta ações por 40 trilhões de wones", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 111033, "titulo": "Países do Oriente Médio buscam ampliar estoques de petróleo no exterior com prolongamento da guerra", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/paises-do-oriente-medio-buscam-ampliar-estoques-de-petroleo-no-exterior-com-prolongamento-da-guerra.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-19T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Gigantes do setor energético do Oriente Médio estão transferindo mais petróleo para estoques seguros fora da região do Golfo Pérsico devido ao prolongamento do conflito. Essa mudança reflete a necessidade de proteger os suprimentos de petróleo.", "titulo_pt": "Países do Oriente Médio ampliam estoques de petróleo no exterior devido ao conflito", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 111034, "titulo": "24% das empresas não sabem impacto da reforma tributária, aponta levantamento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/08/24-das-empresas-nao-sabem-impacto-da-reforma-tributaria-aponta-levantamento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-19T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Praticamente uma em cada quatro empresas ainda não simulou os impactos financeiros da reforma tributária, que será implementada entre 2026 e 2033, substituindo os tributos atuais por dois novos: a CBS e o IBS.", "titulo_pt": "25% Das empresas não simularam impactos financeiros da reforma tributária, mostra levantamento", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 111712, "titulo": "S. Korea's venture investments touch new high in H1: data", "url": "https://en.yna.co.kr/view/AEN20260819007900320", "fonte_id": "yonhap_news", "data_pub": "2026-08-19T06:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os investimentos de startups na Coreia do Sul atingiram um novo recorde no primeiro semestre de 2023, de acordo com dados divulgados em 19 de agosto de 2023.", "titulo_pt": "Investimentos em startups da Coreia do sul atingem novo recorde no primeiro semestre", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 111148, "titulo": "Ata do Fed, leilão de títulos dos EUA e fluxo cambial no Brasil: o que move os mercados", "url": "https://exame.com/invest/mercados/ata-do-fed-leilao-de-titulos-dos-eua-e-fluxo-cambial-no-brasil-o-que-move-os-mercados/", "fonte_id": "exame", "data_pub": "2026-08-19T05:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O principal indicador do dia é a divulgação da ata da última decisão de juros do Federal Reserve (Fed, o banco central dos Estados Unidos). O leilão de títulos dos EUA e o fluxo cambial no Brasil também influenciam os mercados.", "titulo_pt": "Ata do Fed, leilão de títulos dos EUA e fluxo cambial no Brasil: o que move os mercados", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 111151, "titulo": "Economistas decretam morte dos juros zero e alertam para mundo de incerteza permanente", "url": "https://exame.com/invest/mercados/economistas-decretam-morte-dos-juros-zero-e-alertam-para-mundo-de-incerteza-permanente/", "fonte_id": "exame", "data_pub": "2026-08-19T05:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Economistas indicam que a era dos juros zero terminou e que o mundo enfrentará um período de incerteza contínua. O Brasil pode encontrar oportunidades nesse novo cenário, apesar de expectativas de choques econômicos e juros mais altos.", "titulo_pt": "Economistas anunciam fim dos juros zero e incerteza permanente", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 111551, "titulo": "Iran eyes military targets in Europe if Trump escalates war, insiders say", "url": "https://www.ft.com/content/9ea0cde8-129e-4d88-976f-e367b7dd4d2c?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-19T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Insiders afirmam que o Irã considera alvos militares na Europa como possíveis retaliações se os EUA escalarem a guerra. Muitos na capital iraniana veem uma nova conflito como inevitável.", "titulo_pt": "Irã considera alvos militares na Europa em caso de escalada de guerra por parte dos EUA, dizem fontes", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 111699, "titulo": "Relativity Networks raises $22 million to bring a faster kind of fiber to data centers", "url": "https://techcrunch.com/2026/08/19/relativity-networks-raises-22-million-to-bring-a-faster-kind-of-fiber-to-data-centers/", "fonte_id": "techcrunch", "data_pub": "2026-08-19T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Relativity Networks levantou $22 milhões para desenvolver fibras ópticas de núcleo vazio, uma tecnologia pouco utilizada que permite uma transmissão de dados 30% mais rápida do que a fibra convencional.", "titulo_pt": "Relativity Networks arrecada $22 milhões para tecnologia de fibra óptica mais rápida em data centers", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 111786, "titulo": "Flip raises $25M to expand AI platform for frontline workers", "url": "https://tech.eu/2026/08/19/flip-raises-25m-to-expand-ai-platform-for-frontline-workers/", "fonte_id": "tech_eu", "data_pub": "2026-08-19T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A plataforma de experiência do funcionário Flip levantou $25 milhões em nova financiamento para expandir sua tecnologia baseada em IA para trabalhadores da linha de frente. Investidores existentes Notion Capital e HV Capital aumentaram suas participações.", "titulo_pt": "Flip arrecada $25 milhões para expandir plataforma de IA para trabalhadores da linha de frente", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 111787, "titulo": "Beyond AI scribes: Aisel raises €1.7M to tackle psychiatry’s capacity crisis", "url": "https://tech.eu/2026/08/19/beyond-ai-scribes-aisel-raises-eur17m-to-tackle-psychiatrys-capacity-crisis/", "fonte_id": "tech_eu", "data_pub": "2026-08-19T09:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aisel Health, uma empresa de HealthTech da Dinamarca, recebeu €1,7 milhão em uma rodada de pré-série A para desenvolver um Sistema Operacional específico para psiquiatria e saúde mental.", "titulo_pt": "Aisel health arrecada €1,7 milhão para avançar na psiquiatria", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 111446, "titulo": "Exclusive: GOP warns AI companies that data centers are politically radioactive", "url": "https://www.axios.com/2026/08/19/gop-data-center-memo-ai-election", "fonte_id": "axios", "data_pub": "2026-08-19T09:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O braço de campanha do Partido Republicano no Senado enviou um memorando privado a empresas de inteligência artificial alertando que as visões negativas sobre os centros de dados dos EUA estão prejudicando as chances de reeleição do Senador Jon Husted (Republicano) em Ohio. Os democratas estão usando essa questão como um ponto crucial em sua campanha contra Husted.", "titulo_pt": "Republicanos alertam empresas de IA sobre riscos políticos dos centros de dados", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 111720, "titulo": "Hot or Not Built the Internet We’re Still Swiping Through", "url": "https://www.wired.com/story/hot-or-not-built-the-internet-were-still-swiping-through/", "fonte_id": "wired", "data_pub": "2026-08-19T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O site Hot or Not ensinou aos usuários a classificar pessoas em larga escala. Dating apps modernas estão tentando se libertar da cultura criada pelo site após 26 anos.", "titulo_pt": "Quente ou não construiu a Internet que ainda estamos deslizando", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 111451, "titulo": "Behind the Curtain: The new existential threat to AI", "url": "https://www.axios.com/2026/08/19/data-centers-ai-political-opinion", "fonte_id": "axios", "data_pub": "2026-08-19T09:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A principal ameaça à AI e à economia relacionada a ela não está relacionada a energia, chips ou China, mas sim à crescente oposição pública aos centros de dados dos EUA. Políticos e público estão se voltando contra esses centros físicos de crescimento da AI, o que pode comprometer a revolução AI.", "titulo_pt": "Por trás da cortina: o novo perigo existencial para a IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 111649, "titulo": "China joins Musk’s SpaceX with reusable rocket breakthroughs", "url": "https://www.scmp.com/plus/news/china/science/article/3364562/china-joins-musks-spacex-reusable-rocket-breakthroughs?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-19T09:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa chinesa LandSpace bem-sucedidamente lançou o foguete Zhuque-3 e recuperou sua primeira etapa, um avanço na capacidade de desenvolver foguetes reutilizáveis que podem reduzir os custos de lançamentos espaciais. A etapa do foguete de 66 metros pousou na província de Gansu, no noroeste da China, após um voo de oito minutos que colocou um satélite de internet Honghu-3 em órbita.", "titulo_pt": "China se junta a musk's SpaceX com avanços em foguetes reutilizáveis", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 111671, "titulo": "Child-monitoring apps might need a reboot", "url": "https://www.technologyreview.com/2026/08/19/1141623/child-monitoring-apps-need-reboot/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-19T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pam Wisniewski passou sua adolescência digital, onde encontrou tanto o melhor quanto o pior da internet. Ela deixou um lar abusivo aos 14 anos, onde foi isolada em uma trailer, e se conectou online, aprendendo a usar AOL Instant Messenger.", "titulo_pt": "Apps de monitoramento infantil podem precisar de um upgrade", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 111721, "titulo": "Flock Has a Powerful New AI Tool for Police. We Got Its Code", "url": "https://www.wired.com/story/flock-safety-os-investigate/", "fonte_id": "wired", "data_pub": "2026-08-19T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Flock desenvolveu um novo sistema de inteligência artificial para uso policial que vai além do rastreamento de placas de veículos. A WIRED reconstruiu o sistema para confirmar suas capacidades avançadas.", "titulo_pt": "Flock tem um novo potente ferramenta de IA para polícias. Nós obtemos seu código", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 111678, "titulo": "SK hynix unleashes W40tr buyback amid AI windfall", "url": "https://www.koreaherald.com/article/10845792", "fonte_id": "korea_herald", "data_pub": "2026-08-19T08:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SK hynix anunciou que comprará e cancelará 40 trilhões de wones (cerca de 28 bilhões de dólares) de suas próprias ações, aumentando significativamente sua política de retorno aos acionistas. A empresa também elevou seu objetivo de retorno aos acionistas para 2025-2027 para mais de 50% do fluxo de caixa livre acumulado, de um plano anterior de retornar até 50%.", "titulo_pt": "SK hynix lança programa de recompra de ações W40tr em meio a ganhos de IA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 111253, "titulo": "IA e epistemologia jurídica: preguiça ou ampliação cognitiva?", "url": "https://www.jota.info/opiniao-e-analise/colunas/ia-regulacao-democracia/ia-e-epistemologia-juridica-preguica-ou-ampliacao-cognitiva", "fonte_id": "jota", "data_pub": "2026-08-19T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O uso crescente da inteligência artificial no Direito levanta preocupações sobre a estagnação do conhecimento jurídico.", "titulo_pt": "IA e epistemologia jurídica: preguiça ou ampliação cognitiva?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 111747, "titulo": "SK Hynix to cancel record KRW40tn in shares, signalling confidence in a long AI memory cycle", "url": "https://www.digitimes.com/news/a20260819VL214/hbm-earnings-cash-flow.html", "fonte_id": "digitimes", "data_pub": "2026-08-19T08:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SK hynix aprovou um plano para comprar e cancelar ações no valor de 40 trilhões de wones (aproximadamente 29 bilhões de dólares), o maior programa de compra de ações já realizado por uma empresa listada na Coreia do Sul. Este movimento indica confiança na longa ciclo de memória de inteligência artificial.", "titulo_pt": "SK Hynix anunciará maior compra de ações da história na Coreia do sul, sinalizando confiança em ciclo de IA", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 111681, "titulo": "SK Biopharmaceuticals settles first US patent dispute over Xcopri", "url": "https://www.koreaherald.com/article/10845774", "fonte_id": "korea_herald", "data_pub": "2026-08-19T08:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "SK Biopharmaceuticals chegou a um acordo com a empresa farmacêutica indiana MSN Laboratories no âmbito de uma disputa de patentes nos Estados Unidos sobre cenobamate, medicamento contra a epilepsia vendido como Xcopri nos EUA. A resolução marca o primeiro passo na estratégia da empresa para proteger os direitos de propriedade intelectual do Xcopri no maior mercado farmacêutico do mundo.", "titulo_pt": "SK Biopharmaceuticals resolve primeiro conflito de patentes dos EUA sobre Xcopri", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 111788, "titulo": "Singular Photonics lands $2.15M to develop next-generation image sensors", "url": "https://tech.eu/2026/08/19/singular-photonics-lands-215m-to-develop-next-generation-image-sensors/", "fonte_id": "tech_eu", "data_pub": "2026-08-19T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa escocesa Singular Photonics levantou $2,15 milhões em uma rodada de financiamento sob assinatura para acelerar o desenvolvimento de suas sensores de imagem baseados em SPAD (Single-Photon Avalanche Diode) da próxima geração.", "titulo_pt": "Singular Photonics arrecada $2,15 milhões para desenvolver sensores de imagem da próxima geração", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 111789, "titulo": "Medly AI raises $8M to bring AI-powered tutoring to more students", "url": "https://tech.eu/2026/08/19/medly-ai-raises-8m-to-bring-ai-powered-tutoring-to-more-students/", "fonte_id": "tech_eu", "data_pub": "2026-08-19T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup britânica de tecnologia educacional Medly AI levantou $8 milhões em financiamento de semente para expandir sua plataforma de preparação para exames com inteligência artificial tanto no Reino Unido quanto em mercados internacionais. A rodada foi liderada pela Felix Capital.", "titulo_pt": "Medly AI arrecada $8 milhões para expandir plataforma de tutoria com IA", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 111559, "titulo": "Chinese humanoid robot maker surges 600% in trading debut", "url": "https://www.ft.com/content/14cd8246-7fb1-4f8f-81b4-8de11ced79e5?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-19T07:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa chinesa de robôs humanoides Unitree teve um desempenho extraordinário em sua estreia na bolsa de Shanghai, com o valor das ações subindo 600% nas negociações iniciais. Os investidores demonstraram grande interesse pelas ações da empresa.", "titulo_pt": "Fabricante chinês de robôs humanoides vê valor das ações disparar 600% em estreia na bolsa", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 111804, "titulo": "Astronomers discover a giant, rocky 'mega-Earth' 23 times more massive than our planet", "url": "https://www.space.com/astronomy/exoplanets/astronomers-discover-a-giant-rocky-mega-earth-23-times-more-massive-than-our-planet", "fonte_id": "space_com", "data_pub": "2026-08-19T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos descobriram um gigante rochoso, conhecido como 'mega-Earth', 23 vezes mais massivo que a Terra. Este não era o que se esperava encontrar.", "titulo_pt": "Astrônomos descobrem mega-earth 23 vezes mais massivo que a terra", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 111271, "titulo": "Un estudio reveló por qué las señales extraterrestres podrían llegar a la Tierra sin que podamos detectarlas", "url": "https://www.lanacion.com.ar/ciencia/un-estudio-revelo-por-que-las-senales-extraterrestres-podrian-llegar-a-la-tierra-sin-que-podamos-nid18082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-19T09:19:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Investigadores do Instituto SETI identificaram um fenômeno que poderia distorcer as señales de rádio extraterrestres antes de elas deixarem seus sistemas de origem, o que poderia explicar por que essas señales não são detectadas na Terra.", "titulo_pt": "Estudo revela por que sinais extraterrestres podem chegar à terra sem serem detectados", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 111449, "titulo": "Why the U.S. grid's extreme heat problem is changing", "url": "https://www.axios.com/2026/08/19/extreme-heat-electric-grid-utilities-demand", "fonte_id": "axios", "data_pub": "2026-08-19T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A energia solar e as baterias estão facilitando a atendência da demanda de eletricidade durante dias de calor extremo, mas as temperaturas elevadas a longo prazo estão expondo vulnerabilidades no sistema de distribuição de energia. Aumentos nos períodos de calor extremo, devido ao aquecimento global, combinados com a eletrificação e a expansão de centrais de dados, estão sobrecarregando partes do sistema de distribuição de energia.", "titulo_pt": "Por que o problema de calor extremo na rede elétrica dos EUA está mudando", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 111017, "titulo": "Via Láctea devorou galáxia anã cerca de 11,8 bilhões de anos atrás", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/via-lactea-devorou-galaxia-ana-cerca-de-118-bilhoes-de-anos-atras.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-19T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas observaram aglomerados de estrelas próximos ao centro da Via Láctea e encontraram evidências de que nossa galáxia engoliu uma galáxia anã há cerca de 11,8 bilhões de anos. Isso ocorreu quando o Universo tinha menos de 15% de sua idade atual.", "titulo_pt": "Via Láctea devorou galáxia anã há cerca de 11,8 bilhões de anos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 111722, "titulo": "UK politicians vastly overestimate public opposition to climate policies, study finds", "url": "https://phys.org/news/2026-08-uk-politicians-vastly-overestimate-opposition.html", "fonte_id": "phys_org", "data_pub": "2026-08-19T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Universidade de Cambridge sugere que membros do Parlamento do Reino Unido dos três maiores partidos políticos sobreestimam significativamente os níveis de oposição pública a propostas importantes de políticas climáticas. O trabalho foi publicado em Communications Sustainability.", "titulo_pt": "Políticos do reino unido sobreestimam resistência pública a políticas climáticas, estudo mostra", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 111785, "titulo": "Fly around Schiaparelli Crater with Mars Express", "url": "https://www.esa.int/ESA_Multimedia/Videos/2026/08/Fly_around_Schiaparelli_Crater_with_Mars_Express", "fonte_id": "esa_space", "data_pub": "2026-08-19T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A missão Mars Express da ESA realiza uma viagem virtual ao redor do cráter Schiaparelli, um dos maiores de Marte, com 460 km de diâmetro. Embora aparentemente relativamente plano, o cráter pode ter sido preenchido ao longo dos últimos bilhões de anos por sedimentos transportados pelo vento, água ou lava, ou por uma combinação desses fatores.", "titulo_pt": "Voe ao redor do cráter Schiaparelli com a Mars Express", "veiculo": "ESA - Space Science", "pais": "Europa", "classe": "A"}, {"id": 111723, "titulo": "Climate change main driver of European ocean warming: Study", "url": "https://phys.org/news/2026-08-climate-main-driver-european-ocean.html", "fonte_id": "phys_org", "data_pub": "2026-08-19T08:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indicou que o aquecimento global é o principal motivo do aumento nas temperaturas marítimas da Europa, elevando cerca de 2°C no Mediterrâneo este verão e afetando severamente os ecossistemas.", "titulo_pt": "Clima mudante é principal responsável pelo aquecimento marinho na Europa: estudo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 111724, "titulo": "Italian scientists bet on octopus to fight crab invasion", "url": "https://phys.org/news/2026-08-italian-scientists-octopus-crab-invasion.html", "fonte_id": "phys_org", "data_pub": "2026-08-19T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Italianos lançam milhares de jovens octôpodes de uma embarcação de pesca no Adriático com o objetivo de combater uma espécie de caranguejo invasor que tem prejudicado as pesca locais.", "titulo_pt": "Italianos apostam em octópodes para combater invasão de caranguejos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 111772, "titulo": "Accrediting body considers changes to racism curriculum standards for public health schools", "url": "https://www.statnews.com/2026/08/19/public-health-education-accrediting-body-ceph-walks-dei-tightrope/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-19T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo quecredita escolas de saúde pública está considerando a remoção de exigências específicas para programas ensinarem sobre vieses estruturais e racismo.", "titulo_pt": "Grupo de credenciamento considera mudanças no currículo sobre racismo para escolas de saúde pública", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 111773, "titulo": "STAT+: In wake of boy’s death, gene editing experts dissect Huidagene’s decisions", "url": "https://www.statnews.com/2026/08/19/huidagene-clinical-trial-deaths-experts-dissect-study-design/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-19T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos questionam as melhorias técnicas que Huidagene tentou implementar quando usou uma estratégia de tratamento para distrofia muscular de Duchenne que foi largamente abandonada pelas empresas norte-americanas.", "titulo_pt": "Diante da morte do menino, especialistas
