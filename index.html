<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

 A coalisão liderada por Arábia Saudita realizou bombardeios em Sanaa, Yemen, resultando em pelo menos 27 mortos, a maioria mulheres e crianças. O grupo Houthis em Yemen informou que pelo menos 25 pessoas foram mortas e 30 ficaram feridas em ataques aéreos. O Ministério das Relações Exteriores do Iraque, Fuad Hussein, afirmou que o país tem evidências de que terceiros estão usando seu território para atacar vizinhos. As Forças Armadas dos Estados Unidos estão buscando restringir o comércio terrestre iraniano, com o objetivo de impedir o transporte de sistemas de armas avançados e outros materiais sujeitos a sanções.", "economia": "A Berkshire Hathaway registrou uma redução de 28% nos lucros no terceiro trimestre, mas realizou recompras de ações no valor de US$ 9,6 bilhões e manteve US$ 377 bilhões em caixa, acelerando as recompras e expandindo os investimentos sob o novo CEO, Greg Abel. O dólar subiu 10% após a eleição, mas os bancos veem o Congresso como um contrapeso para as incertezas fiscais. O PIB de São Paulo cresceu 1,5% até agosto, impulsionado por agropecuária e serviços, com destaque para o setor de serviços que avançou 0,9% na comparação anual. A Tania Bulhões está expandindo sua produção de fragrâncias para um novo complexo de R$ 70 milhões em Uberaba, prevendo que toda a linha de fragrâncias seja produzida no local até 2027. Além disso, a Panvel registrou um crescimento de 35,4% no lucro líquido ajustado no terceiro trimestre, impulsionado por estratégias digitais e produtos GLP-1. A Casas Bahia adiou o lançamento do balanço do terceiro trimestre para dezembro, devido aos processos operacionais da recuperação judicial em andamento. A Anvisa ordenou o recolhimento de lotes falsificados de creatina e Ômega 3, publicada nesta sexta-feira. A Medida Provisória 1.399/2026 assegura neutralidade arrecadatória para 2027, mas implica em desafios relacionados ao calendário, legalidade e coerência extrafiscal.", "tecnologia": "A Tesla planeja expandir a produção do Cybertruck antes de encerrar a linha de produção em sua fábrica no Texas em 2027, com o objetivo de redirecionar os recursos para o desenvolvimento do Cybercab, um táxi autônomo da marca. A empresa de Elon Musk também enfrenta preocupações sobre a segurança cibernética, com o Departamento de Comércio dos EUA e a Nvidia sendo investigados por possíveis falhas na supervisão das empresas chinesas aprovadas para lidar com seus chips de IA. A Inteligência Artificial (IA) continua a desafiar a segurança cibernética, com a possibilidade de ataques a infraestruturas críticas devido a falhas de segurança em dispositivos conectados à internet. A indústria de jogos e tecnologia também está em destaque, com a Meta adiando regras para a coleta de conteúdo jornalístico para treinar IA, enquanto a IonQ projeta uma receita de US$505 a US$515 milhões para 2026 devido ao crescimento da computação quântica. Além disso, a WT Microelectronics projeta um crescimento a longo prazo da inteligência artificial com a recuperação dos mercados automotivo e industrial, enquanto a Taiwan lança uma iniciativa avançada de memória para enfrentar a crescente demanda por inteligência artificial.", "ciencia": "A NASA está recrutando novos astronautas para a próxima geração de exploradores, com foco no retorno à Lua, na construção de uma base lunar e na preparação para missões tripuladas à Marte. Este anúncio marca um passo significativo na exploração espacial, oferecendo oportunidades para cientistas e entusiastas. Em outra notícia, pesquisadores canadenses descobriraram uma nova espécie de baleia-calça recém-nascida perto da costa canadense, uma descoberta que gerou grande entusiasmo na comunidade científica. Além disso, a NASA convidou o público a enviar seus nomes para a lua de Saturno, Titan, como parte de sua missão Dragonfly, programada para 2034. Estes eventos refletem a diversidade de avanços científicos e descobertas em diferentes campos, desde a exploração espacial até a descoberta de novas espécies marinhas e a pesquisa sobre doenças cardíacas.", "cultura": "O Uruguai celebrou a declaração do Papa Francisco de que o mate é um símbolo de amizade e integra o cotidiano dos uruguaios, durante uma missa em Paysandú. O evento cultural marcou um momento de união e tradição para o povo uruguaio. Em outro destaque, a morte do guitarrista Richard Lloyd, figura central da banda de rock Television, foi uma perda irreparável para a cena musical dos anos 1970. O diretor chileno Sebastián Lelio, falecido aos 52 anos, também foi homenageado com um velório na Cineteca Nacional, reunindo familiares, atores e representantes do mundo cultural. Na área cultural, a cidade de Paris prestou homenagem ao documentarista Patricio Guzmán, com aplausos e cantos de ativistas e integrantes do grupo Quilapayún. Em Buenos Aires, cinco festivais ao ar livre foram sugeridos para encerrar o ano com música, incluindo o Folha Gourmet Festival, que, apesar da chuva, continuava atraente para o público. A devolução de 40 artefatos do Benin para a Nigéria, realizada pela Suécia, foi um momento significativo na repatriação cultural, destacando a importância da devolução de bens culturais aos seus países de origem.", "sociedade": "Três corpos foram encontrados na casa de um suspeito de um ataque que matou seis pessoas na Polônia, conforme informaram as autoridades. O suspeito, um homem de 25 anos com posições ultranacionalistas, feriu outras 15 pessoas. Em outro caso, o lutador Lucas Portela Fontana Gomes, conhecido por suas lutas, agrediu três moradoras em apartamentos vizinhos no Rio de Janeiro e foi preso com prisão preventiva convertida. A Defesa Civil Nacional orientou a população a preparar kits de sobrevivência para situações de emergência, gerando controvérsia. Um metalúrgico de 39 anos foi morto durante uma abordagem da Polícia Militar na zona leste de São Paulo. A Defesa Civil emitiu um alerta extremo devido à chegada de uma frente fria com chuva forte e rajadas de vento no Rio de Janeiro. A Rede D’Or lançou uma campanha nacional para divulgar seu novo curso de Medicina no Rio de Janeiro, com ação publicitária e experiências presenciais. O Peru proibiu eletrônicos, maquiagem e cabelo longo nas escolas, com violações resultando em expulsão, e um estudo da Pfizer estimou que as perdas de produtividade no Brasil devido a mortes prematuras relacionadas ao câncer causadas pela falta de prevenção são de R$ 45,7 bilhões.", "meio_ambiente": "A COP 31, realizada entre 9 e 20 de novembro no Brasil, se concentrará na implementação dos compromissos do Acordo de Paris, com o Chile destacando financiamento, mitigação, adaptação e eletrificação. A diretoria regional da Conaf em Valparaíso alertou para a necessidade de medidas preventivas contra incêndios florestais. No Rio de Janeiro, uma forte chuva causou alagamentos em várias regiões, incluindo Duque de Caxias e Niterói, levando o estado ao estágio 2 de alerta.", "direitos_humanos": "Durante uma visita ao Uruguai, o Papa Francisco (e não Leão XIV, que não foi Papa) defendeu a dignidade do trabalhador, criticando a avaliação do valor humano baseada apenas em critérios econômicos ou de rendimento. Este evento, ocorrido em um contexto global de debates sobre trabalho e direitos humanos, enfatiza a importância da perspectiva moral na discussão sobre trabalho. Paralelamente, a Síria proibiu as mulheres de se inscreverem em cursos das novas faculdades voltados para defesa e segurança do país, causando controvérsia no país e intensificando o debate sobre igualdade de gênero e os direitos das mulheres. Em outro contexto, um líder de seita no Quênia foi condenado a 200 anos de prisão por ser responsável pela morte de 190 crianças, incentivando seguidores a deixarem seus filhos morrerem de fome. Estes casos ilustram as múltiplas facetas da questão dos direitos humanos, desde a dignidade do trabalho até a proteção de crianças e a igualdade de gênero."}, "resumo_do_dia": {"politica_nacional": [{"id": 250913, "titulo": "Ataque a tiros deixa 5 mortos e mais de 10 feridos na Polônia", "url": "https://www.poder360.com.br/poder-internacional/ataque-a-tiros-deixa-5-mortos-e-mais-de-10-feridos-na-polonia/", "fonte_id": "poder360", "data_pub": "2026-11-07T21:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem atirou em pessoas em uma praça de Cracóvia, Polônia, deixando 5 mortos e mais de 10 feridos. O suspeito foi baleado pela polícia e levado ao hospital.", "titulo_pt": "Ataque a tiros em cracóvia deixa 5 mortos e mais de 10 feridos", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 250897, "titulo": "Flávio Bolsonaro diz que Nunes Marques 'não sabe do que está falando' sobre a eleição", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/flavio-bolsonaro-diz-que-nunes-marques-nao-sabe-do-que-esta-falando-sobre-a-eleicao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-07T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro afirmou que o presidente do TSE, Kassio Nunes Marques, não sabe do que está falando ao declarar que as eleições foram justas e reconhecer a vitória de Lula.", "titulo_pt": "Flávio Bolsonaro critica Nunes Marques sobre declarações sobre eleições", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 250898, "titulo": "Ministro do STJ decreta prisão de desembargadora condenada após Procuradoria relatar saída do país", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/ministro-do-stj-decreta-prisao-de-desembargadora-condenada-apos-procuradoria-relatar-saida-do-pais.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-07T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Og Fernandes, do STJ, determinou a prisão da desembargadora Sandra Inês Rusciolelli, condenada a 14 anos e 20 dias de prisão, em regime inicial fechado, pelos crimes de corrupção passiva e lavagem de dinheiro. A decisão foi tomada após a Procuradoria relatar que a desembargadora havia saído do país.", "titulo_pt": "Ministro do STJ determina prisão de desembargadora condenada após relatório de saída do país", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 250926, "titulo": "MPF investiga possíveis falhas em prorrogação de concessão de ferrovia", "url": "https://veja.abril.com.br/brasil/mpf-investiga-possiveis-falhas-em-prorrogacao-de-concessao-de-ferrovia/", "fonte_id": "veja", "data_pub": "2026-11-07T21:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público Federal (MPF) solicitou ao Tribunal de Contas da União (TCU) informações atualizadas sobre a análise do processo de renovação de concessão de uma ferrovia. A investigação visa apurar possíveis falhas no procedimento.", "titulo_pt": "MPF investiga possíveis falhas na prorrogação de concessão de ferrovia", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 250899, "titulo": "Fundação Brumadinho leva à COP31 proposta para mineração segura de terras raras", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/fundacao-brumadinho-leva-a-cop31-proposta-para-mineracao-segura-de-terras-raras.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-07T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Fundação Memorial de Brumadinho apresentará à COP31, na Turquia, uma proposta para a mineração segura de terras raras, com acompanhamento das comunidades locais. A fundação visa garantir a extração de minerais críticos de forma mais segura após o desastre de 2019 em Brumadinho.", "titulo_pt": "Fundação de Brumadinho apresenta proposta para mineração segura de terras raras à COP31", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 250915, "titulo": "Polícia indicia Milton Leite e pede prisão preventiva por elo com PCC", "url": "https://www.poder360.com.br/poder-justica/policia-indicia-milton-leite-e-pede-prisao-preventiva-por-elo-com-pcc/", "fonte_id": "poder360", "data_pub": "2026-11-07T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relatório indica que Milton Leite tinha um vínculo com o PCC através de empresas administradas por ele, e que ele teria ocultado e destruído provas relacionadas. A polícia o indiciou e pediu a prisão preventiva.", "titulo_pt": "Polícia indicia Milton Leite e pede prisão preventiva por ligação com PCC", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 250916, "titulo": "AGU leva ao STF pedido de R$ 533 milhões extras para Judiciário e MP", "url": "https://www.poder360.com.br/poder-justica/agu-leva-ao-stf-pedido-de-r-533-milhoes-extras-para-judiciario-e-mp/", "fonte_id": "poder360", "data_pub": "2026-11-07T20:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho da Justiça Federal e a Procuradoria Geral da República apresentaram um pedido ao Supremo Tribunal Federal (STF) para obter R$ 533 milhões adicionais para o Judiciário e o Ministério Público. Eles argumentam que há falta de recursos para implementar uma decisão do STF relacionada a benefícios remuneratórios.", "titulo_pt": "AGU apresenta pedido de R$ 533 milhões extras para Judiciário e MP ao STF", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 250905, "titulo": "Cinco estados brasileiros registram aumento de casos graves de Covid-19", "url": "https://www.cartacapital.com.br/saude/cinco-estados-brasileiros-registram-aumento-de-casos-graves-de-covid-19/", "fonte_id": "cartacapital", "data_pub": "2026-11-07T20:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os estados do Mato Grosso, Distrito Federal, São Paulo, Rio de Janeiro e Santa Catarina têm registrado aumento de casos graves de Covid-19, conforme informado pelo InfoGripe.", "titulo_pt": "Cinco estados brasileiros registram aumento de casos graves de Covid-19", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 250917, "titulo": "Flávio diz que pai ficou com lágrimas nos olhos após ordem de Moraes", "url": "https://www.poder360.com.br/poder-justica/flavio-diz-que-pai-ficou-com-lagrimas-nos-olhos-apos-ordem-de-moraes/", "fonte_id": "poder360", "data_pub": "2026-11-07T20:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro relatou que seu pai, Jair Bolsonaro, ficou emocionado após receber uma determinação judicial para entregar passaportes. O congressista deixou o Brasil no dia seguinte à decisão do juiz Moraes.", "titulo_pt": "Flávio relata reação de bolsonaro à ordem de Moraes", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 250918, "titulo": "Lula promete live na Turquia e pede que militância fique de “prontidão”", "url": "https://www.poder360.com.br/poder-governo/lula-promete-live-na-turquia-e-pede-que-militancia-fique-de-prontidao/", "fonte_id": "poder360", "data_pub": "2026-11-07T20:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula prometeu realizar uma live na Turquia e pediu que a sua militância esteja pronta. André Janones também viajará para o país para a COP-31.", "titulo_pt": "Lula promete live na Turquia e pede prontidão à militância", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 250951, "titulo": "Sidônio pede para sair e quer trabalhar no exterior; ministro nega", "url": "https://www.metropoles.com/colunas/matheus-leitao/sidonio-pede-para-sair-e-quer-vender-reeleicao-de-lula-no-exterior", "fonte_id": "metropoles", "data_pub": "2026-11-07T20:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Secom negou que Sidônio tenha pedido para sair do cargo e queira trabalhar no exterior. O ministro também mencionou que já enviou Rafael Marroquim para o exterior e que essa decisão envolveu vários autores.", "titulo_pt": "Sidônio pede saída e quer trabalhar no exterior; ministro nega", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 250968, "titulo": "Lula pede ‘prontidão’ ao ‘Exército’ de Janones e confirma live na Turquia", "url": "https://www.infomoney.com.br/politica/lula-exercito-janones-prontidao-live-turquia/", "fonte_id": "infomoney", "data_pub": "2026-11-07T20:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula viajará para a COP31 acompanhado pelo deputado Janones e confirmou uma live na Turquia. Ele pediu prontidão ao 'Exército' de Janones, que é um grupo de WhatsApp com mais de 10 milhões de membros.", "titulo_pt": "Lula pede 'prontidão' ao 'Exército' de Janones e confirma live na Turquia", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 250961, "titulo": "Com tornados no RS e alagamentos no Sudeste, temporais mantêm Centro-Sul em alerta até domingo", "url": "https://www.brasildefato.com.br/2026/11/07/com-tornados-no-rs-e-alagamentos-no-sudeste-temporais-mantem-centro-sul-em-alerta-ate-domingo/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-07T20:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os temporais afetaram o Centro-Sul do Brasil no sábado (7), causando tornados no Rio Grande do Sul, alagamentos em Santa Catarina e no Rio de Janeiro, e quedas de árvores em São Paulo e no Paraná. A previsão é de melhora no Sul a partir do domingo (8), mas há risco de chuvas intensas.", "titulo_pt": "Com tornados no RS e alagamentos no Sudeste, temporais mantêm Centro-Sul em alerta até domingo", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 250922, "titulo": "“Não sabe do que fala”, diz Flávio sobre aval de Nunes Marques à eleição", "url": "https://www.poder360.com.br/poder-eleicoes-2026/nao-sabe-do-que-fala-diz-flavio-sobre-aval-de-nunes-marques-a-eleicao/", "fonte_id": "poder360", "data_pub": "2026-11-07T20:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro questionou a avaliação do presidente do TSE, Luís Roberto Barroso, sobre o aval para a eleição. Ele levantou suspeitas de fraude sem apresentar provas.", "titulo_pt": "Flávio diz 'não sabe do que fala' sobre aval de barroso à eleição", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 250906, "titulo": "PGR pede suspensão de ações contra proibição de bets", "url": "https://www.cartacapital.com.br/justica/pgr-pede-suspensao-de-acoes-contra-proibicao-de-bets/", "fonte_id": "cartacapital", "data_pub": "2026-11-07T19:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O procurador-geral da República, Paulo Gonet, solicitou a suspensão das ações judiciais contra a proibição de apostas esportivas. Ele argumentou que a situação judicial atual causa insegurança jurídica.", "titulo_pt": "PGR pede suspensão de ações contra proibição de apostas", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 250934, "titulo": "STF só deve julgar revelações do escândalo do Banco Master em 2027", "url": "https://veja.abril.com.br/brasil/stf-so-deve-julgar-revelacoes-do-escandalo-do-banco-master-em-2027/", "fonte_id": "veja", "data_pub": "2026-11-07T19:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) só deve julgar as revelações do escândalo do Banco Master em 2027. Edson Fachin, presidente da Corte, impediu as investigações em seu gabinete até o final de janeiro.", "titulo_pt": "STF só deve julgar revelações do escândalo do Banco Master em 2027", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 250771, "titulo": "Taiwan Strait peace a priority: IPAC", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/08/2003867350", "fonte_id": "taipei_times", "data_pub": "2026-11-08T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A paz no Estre gem exata dos aviões.", "titulo_pt": "Segunda frota de caças F-16V dos EUA esperada hoje", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 250780, "titulo": "2026 Elections: Taipei mayoral rivals step up campaigns; back allies in Kaohsiung", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/08/2003867364", "fonte_id": "taipei_times", "data_pub": "2026-11-08T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As candidaturas à prefeitura de Taipei intensificaram suas campanhas eleitorais, enquanto apoiam aliados na cidade de Kaohsiung.", "titulo_pt": "Eleições de 2026: candidatos à prefeitura de taipei aumentam campanha e apoiam aliados em Kaohsiung", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 250941, "titulo": "EUA oferta recompensa de US$ 15 milhões por chefe de facção da Venezuela", "url": "https://www.metropoles.com/mundo/eua-oferta-recompensa-de-us-15-milhoes-por-chefe-de-faccao-da-venezuela", "fonte_id": "metropoles", "data_pub": "2026-11-07T21:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo dos EUA ofereceu uma recompensa de 15 milhões de dólares pela captura de Juan Gabriel Rivas Núñez, chefe de uma facção na Venezuela. Rivas chegou a ser detido no Brasil, mas conseguiu fugir em 2025.", "titulo_pt": "EUA oferecem recompensa de 15 milhões por chefe de facção da Venezuela", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 251190, "titulo": "Ukraine: Russian strikes hit Kyiv region, damaging infrastructure", "url": "https://www.euronews.com/video/2026/11/07/ukraine-russian-strikes-hit-kyiv-region-damaging-infrastructure", "fonte_id": "euronews", "data_pub": "2026-11-07T21:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Infraestruturas no Kyiv region, Ucrânia, foram danificadas por ataques russos. Um jardim de infância foi destruído em Kiev e o sistema de energia do país enfrenta novas investidas.", "titulo_pt": "Ucrânia: ataques russos danificam infraestrutura em Kyiv e destruíram um jardim de infância", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 251230, "titulo": "Tusk, 'ritrovati tre corpi nella casa dell'attentatore di Cracovia'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/07/tusk-ritrovati-tre-corpi-nella-casa-dellattentatore-di-cracovia_21bc52f8-2062-4637-8467-812b3634b198.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-07T21:42:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Foram encontrados três corpos na casa do atacante de Cracóvia. Poderiam ser membros de sua família.", "titulo_pt": "Tusk, três corpos encontrados na casa do atentador de cracóvia", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 251231, "titulo": "Tusk, 'non abbiamo mai avuto casi di terrorismo così efferati prima d'ora'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/07/tusk-non-abbiamo-mai-avuto-casi-di-terrorismo-cosi-efferati-prima_2c2968bf-cffa-4a8f-8818-01ae9bc89416.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-07T21:39:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O ataque em Cracóvia é descrito como um caso de terrorismo extremamente violento. Não se registrou terrorismo tão brutal anteriormente.", "titulo_pt": "Tusk, 'nunca tivemos casos de terrorismo tão brutais antes'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 251232, "titulo": "Ministro interni polacco, 'il killer affascinato da ideologie di estrema destra'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/07/ministro-interni-polacco-il-killer-affascinato-da-ideologie-di-estrema-destra_281128ae-e042-4f84-875d-fccedfa87363.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-07T21:39:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O ministro dos Internos da Polônia expressou apoio a um assassino fascinado pelas ideologias de extrema-direita. Nutria posições muito radi : "2026-11-07T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ter 30 ações na carteira pode não garantir maior diversificação, já que alguém com apenas dez ações pode estar mais diversificado. A diversificação não depende apenas do número de ações, mas também da sua composição.", "titulo_pt": "Ter 30 ações pode ser menos diversificado do que ter dez?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 250981, "titulo": "O que são fundos imobiliários e como funcionam os investimentos", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/o-que-sao-fundos-imobiliarios-e-como-funcionam-os-investimentos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-07T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fundos imobiliários permitem investir em imóveis e títulos relacionados ao mercado imobiliário através da compra de cotas. Esses investimentos oferecem diferentes tipos, formas de rendimento e possuem riscos específicos, além de métodos para começar a investir.", "titulo_pt": "O que são fundos imobiliários e como funcionam os investimentos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 250967, "titulo": "Anvisa selecionará até 8 IFAs fabricados no Brasil para certificação", "url": "https://www.infomoney.com.br/brasil/anvisa-selecionara-ate-8-ifas-fabricados-no-brasil-para-certificacao/", "fonte_id": "infomoney", "data_pub": "2026-11-07T20:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anvisa abriu um chamamento público para selecionar até 8 insumos farmacêuticos ativos (IFAs) fabricados no Brasil para certificação. O objetivo é avaliar a qualidade desses insumos.", "titulo_pt": "Anvisa selecionará até 8 IFAs fabricados no Brasil para certificação", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 250988, "titulo": "CVS prepara divisão de seu império de saúde de US$ 117 bi", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/cvs-prepara-divisao-de-seu-imperio-de-saude-de-us-117-bi/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-07T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A CVS, gigante do setor de saúde, está planejando desfazer as fusões que uniram suas farmácias, a seguradora Aetna e a gestora de saúde Caremark em um único conglomerado.", "titulo_pt": "CVS prepara divisão de seu império de saúde de US$ 117 bi", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 250970, "titulo": "Polônia: Sobe para 6 número de mortos em ataque a tiros na Cracóvia", "url": "https://www.infomoney.com.br/mundo/polonia-sobe-para-6-numero-de-mortos-em-ataque-a-tiros-na-cracovia/", "fonte_id": "infomoney", "data_pub": "2026-11-07T19:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O atirador foi atingido durante um confronto com a polícia e levado ao hospital para uma cirurgia. O número de mortos no ataque a tiros em Cracóvia, Polônia, aumentou para seis.", "titulo_pt": "Polônia: número de mortos em ataque a tiros em Cracóvia sobe para seis", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 250996, "titulo": "Três maiores bancos lucram R$ 22,61 bi no 3º trimestre, avanço de 2,4%", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/tres-maiores-bancos-lucram-r-2261-bi-no-3o-trimestre-avanco-de-24/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-07T19:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os três maiores bancos privados de varejo do Brasil lucraram R$ 22,61 bilhões no terceiro trimestre, um aumento de 2,4% em comparação com o esperado.", "titulo_pt": "Três maiores bancos lucram R$ 22,61 bi no 3º trimestre, avanço de 2,4%", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 250971, "titulo": "Ueno Bank: BC já devolveu US$ 158 milhões, mas 669 mil contas aguardam", "url": "https://www.infomoney.com.br/mercados/ueno-bank-669-mil-contas-devolucao-dinheiro-paraguai/"  "Brasil", "classe": "B"}, {"id": 250746, "titulo": "Berkshire Hathaway steps up share buybacks with $9.6bn of purchases", "url": "https://www.ft.com/content/1f153350-2377-4e48-a073-0539376eab4c?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-07T16:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Berkshire Hathaway aumentou as compras de ações em $9,6 bilhões. O desempenho foi afetado pela desaceleração na área de seguros, com uma queda de 5,8% no lucro operacional trimestral em comparação com o mesmo período do ano anterior.", "titulo_pt": "Berkshire Hathaway intensifica compras de ações com investimento de 9,6 bilhões de dólares", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 251243, "titulo": "Megaspeed exec was recruited to spy on Nvidia CEO, according to US intelligence memo", "url": "https://techcrunch.com/2026/11/07/chinese-exec-was-recruited-to-spy-on-nvidia-ceo-according-to-us-intelligence-memo/", "fonte_id": "techcrunch", "data_pub": "2026-11-07T21:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Segundo um memorando divulgado este ano, a inteligência dos EUA afirma que a Ministry of State Security da China recrutou uma executiva de tecnologia feminina para espionar o CEO da Nvidia.", "titulo_pt": "Executiva da megaspeed foi recrutada para espionar CEO da Nvidia, de acordo com memorando da inteligência dos EUA", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 251193, "titulo": "\"Congress will investigate\": Nvidia CEO Jensen Huang faces probe over alleged Chinese spy ties", "url": "https://www.axios.com/2026/11/07/jensen-huang-nvidia-congress-china-spy", "fonte_id": "axios", "data_pub": "2026-11-07T21:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Nvidia, Jensen Huang, está enfrentando crescente investigação parlamentar após relatos sugerirem que ele teve um relacionamento românti ado-pode-acumular-bacterias-7-cuidados-para-evitar-riscos-a-saude/", "fonte_id": "canaltech", "data_pub": "2026-11-07T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ar-condicionado pode acumular bactérias e fungos, especialmente quando não é limpo regularmente e há umidade no aparelho. Isso pode prejudicar a qualidade do ar e causar alergias e irritações respiratórias. É importante manter a higiene do equipamento e seguir as recomendações de manutenção.", "titulo_pt": "Ar-condicionado pode acumular bactérias? 7 cuidados para evitar riscos à saúde", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 250804, "titulo": "Binance CFO is leaving to ‘pursue a new venture’ after $6.3 billion hack", "url": "https://techcrunch.com/2026/11/07/binance-cfo-is-leaving-to-pursue-a-new-venture-after-6-3-billion-hack/", "fonte_id": "techcrunch", "data_pub": "2026-11-07T17:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CFO da Binance está deixando a empresa para 'persegui um novo empreendimento' menos de uma semana após um hack que roubou $6,3 bilhões em criptomoedas dos usuários da Binance.", "titulo_pt": "CFO da binance deixa a empresa após hack de $6,3 bilhões", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 250805, "titulo": "Amazon’s new basic Kindle proves you don’t need all the bells and whistles", "url": "https://techcrunch.com/2026/11/07/amazons-new-basic-kindle-proves-you-dont-need-all-the-bells-and-whistles/", "fonte_id": "techcrunch", "data_pub": "2026-11-07T17:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O novo Kindle básico da Amazon custa mais do que antes, mas seu design mais leve e tela melhorada oferecem uma boa razão para optar por este modelo em vez dos mais caros.", "titulo_pt": "Novo Kindle básico da amazon mostra que não são necessárias todas as funcionalidades", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 250512, "titulo": "Como usar o mapa do Gemini para encontrar novos lugares?", "url": "https://canaltech.com.br/inteligencia-artificial/como-usar-o-mapa-do-gemini-para-encontrar-novos-lugares/", "fonte_id": "canaltech", "data_pub": "2026-11-07T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Google lançou uma nova ferramenta chamada ‘Mapa’ para o aplicativo Gemini em celulares, permitindo que os usuários escolham uma região no mapa e recebam informações, recomendações e sugestões sobre locais de interesse.", "titulo_pt": "Como usar o mapa do Gemini para encontrar novos lugares?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 250817, "titulo": "The UV-tracking Gem made me rethink how sunlight affects my health, not just my appearance", "url": "https://www.theverge.com/tech/1023230/the90-gem-necklace-hands-on-impressions", "fonte_id": "the_verge", "data_pub": "2026-11-07T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em agosto, a autora estava em uma festa ao ar livre em Los Angeles, onde as temperaturas chegaram aos 90 graus Fahrenheit. Ela estava protegida por uma tenda e um ventilador, mas após meia hora, sentiu-se exausta e tontura.", "titulo_pt": "O gioiela que rastreia a radiação uv me fez reconsiderar como a luz solar afeta minha saúde, não apenas meu aspecto", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 250513, "titulo": "Você sabe instalar a cadeirinha de bebê no carro de acordo com a lei?", "url": "https://canaltech.com.br/carros/voce-sabe-instalar-a-cadeirinha-de-bebe-no-carro-de-acordo-com-a-lei/", "fonte_id": "canaltech", "data_pub": "2026-11-07T16:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "É obrigatório no Brasil usar dispositivos de retenção adequados para crianças menores de 10 anos ou com altura inferior a 1,45 metros, que devem viajar no banco traseiro. Descumprir essa regra resulta em uma multa e perda de pontos na carteira de habilitação.", "titulo_pt": "Você sabe como instalar a cadeirinha de bebê no carro de acordo com a lei?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}], "tecnologia__eventos": [], "ciencia": [{"id": 250786, "titulo": "MOA unveils blast disease-resistant rice variety", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/08/2003867370", "fonte_id": "taipei_times", "data_pub": "2026-11-08T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A MOA lançou uma nova variedade de arroz resistente à doença explosiva. Este arroz foi desenvolvido para resistir a esse tipo específico de doença, melhorando a resistência agrícola.", "titulo_pt": "MOA apresenta variedade de arroz resistente à doença explosiva", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 251245, "titulo": "Student finds proof of rare wild cat in northern New Mexico", "url": "https://phys.org/news/2026-11-student-proof-rare-wild-cat.html", "fonte_id": "phys_org", "data_pub": "2026-11-07T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "William Grooms usou câmeras de detecção de movimento para documentar a vida selvagem no Carso Nacional Forest em Nuevo México durante o verão passado. Este foi seu primeiro período no campo para uma pesquisa de dois anos que investiga como a estrutura florestal influencia a biodiversidade nas Montanhas Rochosas do Sul.", "titulo_pt": "Aluno encontra provas de gato selvagem raro no norte do novo México", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 251248, "titulo": "Lowering blood pressure after stroke or with diabetes poses challenges, in research and practice", "url": "https://www.statnews.com/2026/11/07/new-studies-on-blood-pressure-management-aha-conference-news/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-07T21:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pressão arterial alta é conhecida como o assassino silencioso. Pesquisadores estão descobrindo novas maneiras de combater essa condição.", "titulo_pt": "Ação contra a pressão arterial alta, o assassino silencioso, enfrenta desafios na pesquisa e na prática", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 250945, "titulo": "Estudo com planta invasora mostra bons resultados para tratar o alcoolismo", "url": "https://www.metropoles.com/saude/estudo-com-planta-invasora-mostra-bons-resultados-para-tratar-o-alcoolismo", "fonte_id": "metropoles", "data_pub": "2026-11-07T21:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo mostrou que o consumo de um extrato de uma planta invasora reduziu o consumo excessivo de álcool de 2,15 para 1,42 por semana entre os participantes com alcoolismo.", "titulo_pt": "Estudo com planta invasora mostra bons resultados para tratar o alcoolismo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 251246, "titulo": "The hidden ways insects support animal life—from habitat to health—go way beyond being food", "url": "https://phys.org/news/2026-11-hidden-ways-insects-animal-life.html", "fonte_id": "phys_org", "data_pub": "2026-11-07T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Existem pelo menos 14 milhões de espécies de insetos na Terra, que desempenham papéis altamente diversificados na sustentação do mundo natural. Insetos fornecem inúmeros benefícios conhecidos, como a polinização de flores silvestres e culturais por abelhas e hoverflies, e o decomposador de excrementos por escaravelhos.", "titulo_pt": "Modos ocultos dos insetos que suportam a vida animal vão além de serem alimento", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 251247, "titulo": "Different text genres help doctoral students adapt their writing to reach new readers", "url": "https://phys.org/news/2026-11-text-genres-doctoral-students-readers.html", "fonte_id": "phys_org", "data_pub": "2026-11-07T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Diferentes gêneros acadêmicos, como resumos acadêmicos, postagens em blogs e artigos de divulgação pública, exigem habilidades de escrita distintas. Dominar um gênero não garante automaticamente a capacidade de escrever em outro.", "titulo_pt": "Diferentes gêneros de texto auxiliam estudantes doutorais a se adaptarem para alcançar novos leitores", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 251249, "titulo": "NASA Seeks Next Generation of Explorers to Join Astronaut Corps", "url": "https://www.nasa.gov/news-release/nasa-seeks-next-generation-of-explorers-to-join-astronaut-corps/", "fonte_id": "nasa_news", "data_pub": "2026-11-07T18:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA está buscando novos astronautas para compor a próxima geração de exploradores. Os candidatos serão parte do retorno à Lua, do desenvolvimento de uma base lunar e da preparação para as primeiras missões tripuladas à Marte.", "titulo_pt": "NASA busca nova geração de exploradores para corpo de astronautas", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 250831, "titulo": "Two paths, one flux: Trapped ions simulate Aharonov–Bohm interference in a lattice gauge theory", "url": "https://phys.org/news/2026-11-paths-flux-ions-simulate-aharonovbohm.html", "fonte_id": "phys_org", "data_pub": "2026-11-07T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores demonstraram o efeito Aharonov-Bohm em uma simulação quântica de uma teoria de gauge em malha usando um computador quântico de íons presos híbrido. Isso foi realizado em um estudo publicado na Nature Physics.", "titulo_pt": "Dois caminhos, um fluxo: íons presos simulam o efeito aharonov-bohm em uma teoria de gauge em malha", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 250832, "titulo": "Earth's gravity may have kept the early moon's volcanic heart beating", "url": "https://phys.org/news/2026-11-earth-gravity-early-moon-volcanic.html", "fonte_id": "phys_org", "data_pub": "2026-11-07T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Terra pode ter mantido o coração vulcânico da lua jovem em atividade por bilhões de anos. Acreditava-se que a lua fosse um objeto estático que se resfriou rapidamente após sua formação, cerca de 4,5 bilhões de anos atrás, mas material lunar recolhido pela missão Chang'e-5 indica atividade vulcânica recente, cerca de 2 bilhões de anos atrás.", "titulo_pt": "A gravidade da terra pode ter mantido o coração vulcânico da lua jovem em atividade", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 250862, "titulo": "This Week In Space podcast: Episode 235 — Robots in Dark and Scary Places", "url": "https://www.space.com/entertainment/space-movies-shows/this-week-in-space-podcast-episode-235-robots-in-dark-and-scary-places", "fonte_id": "space_com", "data_pub": "2026-11-07T17:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na 235ª edição do This Week In Space, Tariq Malik, Rod Pyle e Dr. Jim Green discutem sobre a exploração planetária passada, presente e futura.", "titulo_pt": "Esta semana no espaço: episódio 235 — robôs em lugares escuros e assustadores", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 250828, "titulo": "STAT+: BIO joins the legal fight against Medicare pilot that ties drug prices to peer countries", "url": "https://www.statnews.com/2026/11/07/bio-sues-to-block-globe-drug-pricing-model/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-07T16:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A BIO está se envolvendo na luta legal contra um programa piloto do Medicare que relaciona os preços de medicamentos aos países de referência. O modelo testa a abordagem de favorito nacional do governo Trump em relação aos preços de medicamentos, mas seu impacto provavelmente será limitado.", "titulo_pt": "BIO entra na luta legal contra programa piloto do Medicare que relaciona preços de medicamentos aos países de referência", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 251009, "titulo": "O que falta para a versão em comprimido do Ozempic chegar às farmácias?", "url": "https://exame.com/brasil/o-que-falta-para-a-versao-em-comprimido-do-ozempic-chegar-as-farmacias/", "fonte_id": "exame", "data_pub": "2026-11-07T16:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Novo Nordisk informou que o medicamento Ozempic em forma de comprimido estará disponível nas farmácias 'nos próximos trimestres', após a aprovação da Anvisa.", "titulo_pt": "O que falta para a versão em comprimido do Ozempic chegar às farmácias?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 250863, "titulo": "On this day in space! Nov. 7, 1992: NASA launches Mars Global Surveyor, its 1st Mars mission in 20 years at the time, to map the Red Planet like never before", "url": "https://www.space.com/space-exploration/on-this-day-in-space-november-7-2026", "fonte_id": "space_com", "data_pub": "2026-11-07T16:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 7 de novembro de 1996, a NASA lançou a missão Mars Global Surveyor, sua primeira missão ao planeta Marte em 20 anos, com o objetivo de mapear o planeta de forma inédita.", "titulo_pt": "7 De novembro de 1996: NASA lança missão Mars Global Surveyor, sua primeira missão ao marte em 20 anos", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 250833, "titulo": "Scientists discover new jellyfish species in waters off Alicante in Spain", "url": "https://phys.org/news/2026-11-scientists-jellyfish-species-alicante-spain.html", "fonte_id": "phys_org", "data_pub": "2026-11-07T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Mediterrânea ainda abriga espécies desconhecidas pela ciência. Uma delas é a Copula lucentia, uma pequena medusa com apenas alguns milímetros de comprimento, descoberta nas águas próximas a El Campello, em Alicante, e formalmente descrita em 2024 por uma equipe de pesquisa da Laboratório Marinho da Universidade de Alicante, em Dénia.", "titulo_pt": "Cientistas descobrem nova espécie de medusa no mar mediterrâneo, perto de Alicante", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 250834, "titulo": "Heavy rain can more than double glacier speeds in Alaska", "url": "https://phys.org/news/2026-11-heavy-glacier-alaska.html", "fonte_id": "phys_org", "data_pub": "2026-11-07T15:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em condições de chuva intensa, geleiras no Alasca podem dobrar ou até mais do que dobrar sua velocidade de movimento. Geralmente, as geleiras se movem lentamente, mas em alguns casos, ocorrem surtos que aumentam drasticamente sua velocidade.", "titulo_pt": "Chuva intensa pode dobrar a velocidade das geleiras no alasca", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 250449, "titulo": "Cientistas encontram indícios de sangue em dinossauro do Brasil", "url": "https://www.dw.com/pt-br/cientistas-encontram-indícios-de-sangue-em-dinossauro-do-brasil/a-79886270?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-07T15:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas identificaram estruturas microscópicas que parecem ser glóbulos vermelhos fossilizados em ossos do Aratasaurus museunacionali. Uma equipe internacional realizou a descoberta.", "titulo_pt": "Cientistas encontram indícios de glóbulos vermelhos em dinossauro do Brasil", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 246472, "titulo": "Cat How", "url": "https://www.itsnicethat.com/career-predictions/cat-how", "fonte_id": "its_nice_that", "data_pub": "2026-11-09T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A história se concentra na vida de um gato, retratando seus hábitos e sentimentos cotidianos. O filme explora a perspe com/esg/o-custo-de-envelhecer-a-conta-bilionaria-da-falta-de-prevencao-em-saude-no-brasil/", "fonte_id": "exame", "data_pub": "2026-11-07T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Pfizer estimou que as perdas de produtividade no Brasil devido a mortes prematuras relacionadas ao câncer causadas pela falta de prevenção são de R$ 45,7 bilhões. O relatório destaca os benefícios econômicos da prevenção e da vacinação de idosos.", "titulo_pt": "Custo de envelhecer: conta bilionária da falta de prevenção em saúde no Brasil", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 251045, "titulo": "Construyen la represa más grande del mundo con 27 espejos para combatir el frío extremo", "url": "https://www.lanacion.com.ar/el-mundo/construyen-la-represa-mas-grande-del-mundo-con-27-espejos-para-combatir-el-frio-extremo-nid07112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-07T21:26:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O projeto, que custará mais de 4 bilhões de dólares, incorpora uma tecnologia inovadora de espejos solares para combater as temperaturas extremas. A represa será a maior do mundo e utilizará 27 espejos solares.", "titulo_pt": "Construem a represa mais grande do mundo com 27 espejos para combater o frio extremo", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 250999, "titulo": "Chuva forte alaga ruas, derruba árvore e leva Rio ao estágio 2 de alerta", "url": "https://exame.com/brasil/chuva-forte-alaga-ruas-derruba-arvore-e-leva-rio-ao-estagio-2-de-alerta/", "fonte_id": "exame", "data_pub": "2026-11-07T18:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A forte chuva causou alagamentos em seis pontos na capital do estado, bem como em Duque de Caxias e Niterói. O Rio de Janeiro foi levado ao estágio 2 de alerta.", "titulo_pt": "Chuva forte alaga ruas e leva Rio ao estágio 2 de alerta", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 250322, "titulo": "Novo tornado causa estragos no Rio Grande do Sul", "url": "https://veja.abril.com.br/agenda-verde/novo-tornado-causa-estragos-no-rio-grande-do-sul/", "fonte_id": "veja", "data_pub": "2026-11-07T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um novo tornado causou estragos no Rio Grande do Sul, afetando o município de Santo Augusto na madrugada.", "titulo_pt": "Novo tornado causa estragos no Rio Grande do Sul", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 250542, "titulo": "Dirección regional de Conaf en Valparaíso llama a tomar precauciones para evitar incendios forestales", "url": "https://www.latercera.com/nacional/noticia/direccion-regional-de-conaf-en-valparaiso-llama-a-tomar-precauciones-para-evitar-incendios-forestales/", "fonte_id": "la_tercera", "data_pub": "2026-11-07T15:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A direção regional da Conaf em Valparaíso recomendou medidas preventivas para evitar incêndios florestais. A diretora regional enfatizou a responsabilidade de todos em tomar precauções para evitar incidentes lamentáveis.", "titulo_pt": "Direção regional da Conaf em Valparaíso pede cautela para prevenir incêndios florestais", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 251092, "titulo": "COP 31: Chile llega a Antalya con el desafío urgente de convertir los compromisos climáticos en acciones concretas", "url": "https://www.latercera.com/pulso/noticia/cop-31-chile-llega-a-antalya-con-el-desafio-urgente-de-convertir-los-compromisos-climaticos-en-acciones-concretas/", "fonte_id": "la_tercera", "data_pub": "2026-11-07T10:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A COP 31 será realizada entre 9 e 20 de novembro na Turquia, focando na implementação dos compromissos do Acordo de París. O Chile prioriza financiamento, mitigação, adaptação e electrificação, enquanto especialistas recomendam acelerar a redução de combustíveis fósseis e de gases de efeito estufa de curto prazo.", "titulo_pt": "COP 31: chile chega a Antalya com o desafio urgente de transformar compromissos climáticos em ações concretas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 250122, "titulo": "Air in India’s capital ranked world’s most polluted on eve of Diwali", "url": "https://www.scmp.com/news/asia/south-asia/article/3373637/air-indias-capital-ranked-worlds-most-polluted-eve-diwali", "fonte_id": "scmp", "data_pub": "2026-11-07T06:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cidade de Nova Deli foi classificada como a mais poluída do mundo entre as cidades maiores no sábado de manhã, de acordo com um grupo suíço chamado IQAir. Antes do festival hindu Diwali, a previsão é de que a poluição se agrave.", "titulo_pt": "Aérea de nova deli é classificada como a mais poluída do mundo no dia anterior ao Diwali", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 249911, "titulo": "What’s the point? Ten years after the Paris treaty, are climate talks getting anywhere?", "url": "https://www.theguardian.com/environment/ng-interactive/2026/nov/07/whats-the-point-ten-years-after-the-paris-treaty-are-climate-talks-getting-anywhere", "fonte_id": "guardian_world", "data_pub": "2026-11-07T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O objetivo principal de temperatura do Acordo de Paris não foi alcançado, mas especialistas afirmam que o acordo ainda serve como um importante norte moral para o progresso. Antes do summit de 2025 na cidade de Belém, no Brasil, os anfitriões retiraram do debate os planos de ação climática detalhados de cada país, argumentando que esses planos são responsabilidade dos governos nacionais.", "titulo_pt": "Qual o propósito? Dez anos após o acordo de Paris, as negociações sobre o clima estão progredindo?", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 250053, "titulo": "CDC reports more than 5,000 measles cases, highest number in 35 years", "url": "https://www.aljazeera.com/news/2026/11/7/cdc-reports-more-than-5000-measles-cases-highest-number-in-35-years?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-07T01:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CDC relatou mais de 5.000 casos de sarampo, o maior número em 35 anos. Cerca de 60% dos casos confirmados são crianças e adolescentes.", "titulo_pt": "CDC relata mais de 5.000 casos de sarampo, maior número em 35 anos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 248750, "titulo": "Ministry to test impact of carbon capture schemes", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/07/2003867322", "fonte_id": "taipei_times", "data_pub": "2026-11-07T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério planeja testar o impacto das propostas de captura de carbono. A intenção é avaliar a eficácia dessas iniciativas ambientais.", "titulo_pt": "Ministério vai testar impacto de propostas de captura de carbono", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 251036, "titulo": "Huir a los 90 años: una dura travesía y una historia que desnuda la gravísima crisis humanitaria en Yemen", "url": "https://www.clarin.com/mundo/huir-90-anos-dura-travesia-historia-desnuda-gravisima-crisis-humanitaria-yemen_0_gfbI6VucDp.html", "fonte_id": "clarin", "data_pub": "2026-11-07T21:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mais de 22 milhões de pessoas, metade da população, precisam de assistência humanitária no Yemen após 12 anos de conflito. Jum'ah teve que fugir novamente, desta vez carregada pelo seu yerno. A agência da ONU para refugiados declarou emergência para acelerar a ajuda.", "titulo_pt": "Fugir aos 90 anos: uma dura jornada e uma história que expõe a grave crise humanitária no Yemen", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 251175, "titulo": "Rebajas de condena: lo que el Estado le debe a la niñez", "url": "https://www.ciperchile.cl/2026/11/07/rebajas-de-condena-lo-que-el-estado-le-debe-a-la-ninez-victima/?utm_source=rss&utm_medium=rss&utm_campaign=rebajas-de-condena-lo-que-el-estado-le-debe-a-la-ninez-victima", "fonte_id": "ciper_chile", "data_pub": "2026-11-07T20:48:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute as reduções de condenação e o que o Estado deve fazer em relação à infância. Não há detalhes adicionais sobre o conteúdo do artigo.", "titulo_pt": "Descontos na condenação: o que o Estado deve fazer pela criança", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 251176, "titulo": "Ukrainian war orphans' long road to healing: 'We don't talk to him about his parents' death. We wait for him to ask questions'", "url": "https://www.lemonde.fr/en/international/article/2026/11/07/ukrainian-war-orphans-long-road-to-healing-we-don-t-talk-to-him-about-his-parents-death-we-wait-for-him-to-ask-questions_6774517_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-07T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de crianças ucranianas cujos pais morreram na guerra estão sendo cuidadas em orfanatos pós-soviéticos, por famílias de acolhimento ou por organizações não-governamentais que tentam curar seus ferimentos psicológicos. Essas crianças não são incentivadas a discutir a morte dos pais, esperando-se que elas abordem o assunto por conta própria.", "titulo_pt": "Crianças órfãs ucranianas em longo caminho para se curar: 'não falamos com ele sobre a morte dos pais. Aguardamos que ele pergunte sobre isso'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 250338, "titulo": "Em visita ao Uruguai, papa Leão XIV defende dignidade do trabalhador contra lógica de produtividade", "url": "https://www.brasildefato.com.br/2026/11/07/em-visita-ao-uruguai-papa-leao-xiv-defende-dignidade-do-trabalhador-contra-logica-de-produtividade/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-07T17:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O papa Leão XIV defendeu a dignidade do trabalhador durante seu primeiro pronunciamento oficial no Uruguai, criticando a avaliação do valor humano baseada em critérios econômicos ou de rendimento.", "titulo_pt": "Papa Leão XIV defende dignidade do trabalhador contra lógica de produtividade no Uruguai", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 250768, "titulo": "Top China university stops using AI to spot absent-minded students after backlash", "url": "https://www.scmp.com/news/china/science/article/3373599/top-china-university-stops-using-ai-spot-absent-minded-students-after-backlash", "fonte_id": "scmp", "data_pub": "2026-11-07T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma universidade de elite na província oriental de Jiangsu, na China, revogou uma característica controversa de seu sistema de rastreamento de aulas baseado em IA após forte reação pública. O sistema, que registra a presença completa dos alunos, foi atualizado recentemente e causou indignação quando supostamente foi revelado por capturas de tela.", "titulo_pt": "Universidade chinesa de elite revoga uso de IA para identificar alunos distraídos após reação pública", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 250451, "titulo": "Síria bane mulheres em faculdades com cursos voltados à defesa e segurança do país", "url": "https://www.dw.com/pt-br/síria-bane-mulheres-em-faculdades-com-cursos-voltados-à-defesa-e-segurança-do-país/a-79848120?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-07T10:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Síria proibiu as m const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}
