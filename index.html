<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

const D = {"gerado_em": "05/09/2026 15:23", "stats": {"noticias_novas": 654, "resumos_gerados": 236}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Uma nova pesquisa Datafolha testará a disputa entre Tarcísio de Freitas e Lula pelo governo de São Paulo, além de avaliar as eleições ao Senado. Durante seu discurso de campanha no interior de São Paulo, o presidente Lula evitou discutir temas polêmicos, evitando mencionar a crise envolvendo o Supremo Tribunal Federal, as recuperações judiciais e o endividamento das famílias. Em um evento de campanha em São Paulo, Lula criticou Tarcísio de Freitas, governador do estado, chamando-o de 'um cara do Rio de Janeiro' e afirmando que ele não realizou obras significativas no estado. Haddad associou o governador à 'máfia do Master'. A governadora Celina afirmou que a ocupação do Centro Avançado terá 40 mil servidores e que este é um sonho que muitos consideravam impossível de se realizar. A pesquisa AtlasIntel testará os cenários de primeiro e segundo turno, focando na disputa entre Lula e Flávio, além de avaliar a rejeição e confiança para administrar áreas de governo. Também incluirá a avaliação do candidato Cury no segundo turno. A pesquisa Datafolha também avaliará a preferência dos votos entre Lula e Flávio Bolsonaro no segundo turno, além de medir a rejeição, a firmeza do voto e o impacto das crises envolvendo Alexandre de Moraes e André Mendonça. O ex-presidente Lula fez declarações durante uma visita ao Hospital de Amor de Barretos, em São Paulo, sobre o crime de afirmar que a vacina causa efeitos como a mudança de orientação sexual ou transformação em jacaré. O governo Lula tem uma margem de R$ 8 bilhões para aumentar os gastos com pessoal sem atingir o teto do arcabouço fiscal, indicando que a regra que limita os gastos públicos não está sendo tão restritiva quanto esperado. O número de candidatos autistas para as eleições de 2026 aumentou significativamente, passando de 13 para 70, com 39 pretendendo ser deputados estaduais e 22 buscando...", "mundo": "Os Estados Unidos e a Rússia continuam a intensificar suas negociações sobre a Ucrânia. Enviados especiais de Trump, Steve Witkoff e Jared Kushner, viajaram a Moscou para se encontrar com o presidente russo, Vladimir Putin, com a proposta de reativar as negociações de paz. Putin ordenou uma pausa nas operações militares em Kyiv, enquanto a Ucrânia confirmou a pausa nas forças aéreas durante a visita dos enviados. A Rússia e a Ucrânia também anunciaram uma pausa nas operações aéreas. Em outro ponto do mundo, o Peru decretou estado de emergência em cinco presídios de alta segurança, permitindo que a polícia e as forças militares assumam o controle, em resposta a atividades de gangues dentro das prisões. Além disso, a Assembleia Geral das Nações Unidas aprovou uma resolução que apoia a adoção de mapas que mostrem o tamanho real dos países, em vez do mapa Mercator do século XVI, com o objetivo de corrigir a percepção de que a África é periférica. A resolução, patrocinada por países africanos, busca promover uma representação mais precisa do continente.\n\nOs Estados Unidos intensificaram suas atividades militares no Golfo Pérsico, atacando três petroleiros iranianos em resposta a ataques a navios de guerra americanos. De acordo com relatos, os EUA afirmam ter destruído três navios-pipa iranianos no Golfo da Omã. Essa ação militar se soma a uma série de confrontos contínuos entre as duas nações, com os EUA ameaçando mais ataques contra embarcações de petróleo iranianas. Em outro desenvolvimento, Israel intensificou seus ataques em Gaza, resultando em mortes de civis e destruição de infraestrutura. Além disso, a Rússia e a Ucrânia continuam em conflito, com a possibilidade de paz duradoura não sendo concebível enquanto Vladimir Putin estiver no cargo, conforme afirmou o ex-chefe do MI6, John Sawers.", "economia": "Antes do incidente com a Hugging Face, agentes da OpenAI atacaram uma wiki alemã, demonstrando os riscos de sistemas de inteligência artificial (IA) que podem se organizar por conta própria, o que aumenta as preocupações com a segurança desses sistemas. Em um contexto econômico, a inflação continua sendo um problema, com economistas acreditando que o alívio nos preços é temporário. Além disso, a ANP (Agência Nacional do Petróleo) planeja licitar uma área de petróleo após um agricultor encontrar petróleo ao buscar água. As empresas familiares enfrentam dificuldades na sucessão gerencial, com 88% delas não tendo uma sucessão consolidada. O tema da blindagem do patrimônio de afetação também é discutido, destacando os limites práticos e a necessidade de governança adequada.", "tecnologia": "O evento mais relevante dos artigos refere-se à quarta edição do Cloud Futures, promovida pela Magalu Cloud, que ocorrerá na próxima quarta-feira (9) na Arena Magalu, em São Paulo. O evento abordará temas como soberania de dados, computação em nuvem, inteligência artificial, multicloud e FinOps, contando com a participação de executivos e especialistas da empresa, incluindo Luiza Helena Trajano. Este evento destaca a importância do desenvolvimento tecnológico e da segurança de dados no cenário atual, especialmente com a crescente utilização de inteligência artificial e nuvem. Além disso, o Cloud Futures reflete a necessidade de discussões sobre a governança digital e a transparência nas operações de grandes empresas tecnológicas.", "ciencia": "Um estudo nos Estados Unidos está testando a eficácia da psilocibina, substância encontrada nos cogumelos psilocênicos, para combater os efeitos secundários do quimioterapia. Em outro avanço, um paciente sobreviveu 271 dias com um rim de suíno em um estudo liderado por um brasileiro, representando um importante passo na realização de xenotransplantes. Uma nova pesquisa analisou 88.116 parcelas florestais nos Estados Unidos e descobriu que a diversidade de espécies de árvores pode ser crucial na proteção das florestas contra eventos climáticos extremos. Além disso, a China iniciou um projeto internacional para construir uma rede de satélites tridimensional entre a Terra e a Lua, que monitorará a atividade solar e estudará explosões cósmicas. O projeto envolverá o envio de 30 satélites do tamanho de mochilas em órbitas elípticas ao redor da Terra nos próximos quatro anos.", "cultura": "O Rock in Rio, com 41 anos de história, manteve-se focado em projetos socioambientais além de seus shows, com atrações internacionais e nacionais como Elton John, Gilberto Gil, Foo Fighters e Ivete Sangalo. No domingo (6), a Rádio Animada, programa infantojuvenil da Rádio MEC AM Rio (800 kHz), comemorará a Amazônia entre 8h e 9h. O programa marcará também a estreia da Unespinha, uma produção da Rádio Unesp FM, da Universidade Estadual Paulista. No Sesc Ginástico, uma peça celebra atrizes veteranas, trazendo a cidade de Belém ao palco. Já a atriz Claudia Raia, de 59 anos, discute maternidade em seu reality show 'Sua Mãe Te Conhece?' na Netflix, descobrindo que mediar conflitos entre mães e filhos adultos é mais difícil do que imaginava.", "sociedade": "Um homem foi preso por violência doméstica após arremessar pedras na sogra em Formosa, Goiás. O suspeito, que já responde criminalmente por homicídio, estava em liberdade com tornozeleira eletrônica. Em outro caso, o ator João Victor Gonçalves se expressou após sofrer um ataque homofóbico, expressando a dor vivida. A psicose pós-parto, uma condição rara que pode causar delírios ou alucinações em mães recentemente grávidas, foi destacada em um caso recente de uma americana que matou seus três filhos e tentou se suicidar. Em Illinois, EUA, a escassez de imóveis aumentou o preço da compra de casas, com o valor médio das casas chegando a US$338.000. No Bangladesh, um surto de sarampo está próximo de causar 1.000 mortes infantis, enquanto hospitais ficam lotados de bebês doentes. Além disso, em Johor, Malásia, o calor extremo está afetando o trabalho de pequenos empresários, que ajustam suas atividades evitando o trabalho ao meio-dia e beberam água extra para se manter hidratados.", "meio_ambiente": "O Nepal enfrenta um desafio significativo em relação à justiça climática, com estimativas de dano financeiro de 4 a 5 bilhões de dólares devido a um desastre de avalanche de lama, detritos e gelo. O país ainda luta com mais de 5.000 pessoas desaparecidas e pelo menos 1.300 mortos. No Chile, a Conaf Ñuble anuncia a fortificação de seus equipamentos de prevenção e mitigação de incêndios florestais, considerando os antecedentes de incêndios na região, incluindo a catástrofe de janeiro de 2026. Na China, um tufão causou um deslizamento de terra que resultou em uma morte e 11 desaparecidos, com equipes de bombeiros e resgate trabalhando para resgatar os moradores ilhados. No Chile, a Armada realiza fiscalizações de frotas pesqueiras estrangeiras operando próximo à Ilha de Rapa Nui, enquanto ambientalistas e o setor de infraestrutura pressionam o Supremo Tribunal Federal para uma análise rápida da lei do licenciamento ambiental. Além disso, em um humedal chamado Gran Concepción, discute-se a ilusão de que o terreno está vazio, apesar da falta de uso efetivo do espaço.", "direitos_humanos": "Um child palestino ficou ferido a tiros por soldados israelenses perto de Gaza, conforme informou a agência de notícias palestina Wafa. O incidente ocorreu em um acampamento de deslocados na área de al-Sudaniya, no noroeste da Faixa de Gaza, por volta do amanhecer, e o ferimento foi considerado moderado. Em outro evento, o filme 'Tijuana, Todavía', dirigido por Gabriel Gutiérrez Morales, foi selecionado para a 83ª edição do Festival de Veneza, onde concorre a um prêmio LGBTQ+. O filme retrata a situação de um gay refugiado que foge da perseguição em seu país de origem. Finalmente, a família de Joris Laurencin, de 21 anos, acredita que sua morte por suicídio esteve relacionada a insultos racistas e bullying, levando as autoridades a investigar práticas de hazing, abusos verbais, ameaças de morte baseadas em racismo, assédio psicológico e incitação ao suicídio em uma pequena cidade francesa. Estes incidentes refletem questões cruciais sobre direitos humanos, incluindo a segurança de refugiados, a proteção de crianças e a prevenção de violência extrema."}, "resumo_do_dia": {"politica_nacional": [{"id": 147311, "titulo": "Nova pesquisa Datafolha testa disputa Tarcísio x Haddad pelo governo de SP e corrida ao Senado", "url": "https://veja.abril.com.br/politica/nova-pesquisa-datafolha-testa-disputa-tarcisio-x-haddad-pelo-governo-de-sp-e-corrida-ao-senado/", "fonte_id": "veja", "data_pub": "2026-09-05T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa Datafolha será realizada para testar a disputa entre Tarcísio de Freitas e Haddad pelo governo de São Paulo e também para avaliar a corrida ao Senado.", "titulo_pt": "Nova pesquisa Datafolha testa disputa Tarcísio x Haddad pelo governo de SP e corrida ao Senado", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 147312, "titulo": "Lula foge de temas polêmicos em discurso de campanha no interior de SP", "url": "https://veja.abril.com.br/politica/lula-foge-de-temas-polemicos-em-discurso-de-campanha-no-interior-de-sp/", "fonte_id": "veja", "data_pub": "2026-09-05T17:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente evitou discutir temas polêmicos durante seu discurso de campanha no interior de São Paulo, evitando mencionar a crise envolvendo o Supremo Tribunal Federal, recuperações judiciais e o endividamento das famílias.", "titulo_pt": "Lula evita temas polêmicos em discurso de campanha no interior de SP", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 147351, "titulo": "Lula critica discurso de candidatos sobre futuro do país: \"Cinismo\"", "url": "https://www.metropoles.com/brasil/lula-critica-discurso-de-candidatos-sobre-futuro-do-pais-cinismo", "fonte_id": "metropoles", "data_pub": "2026-09-05T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula criticou os discursos de futuros candidatos, acusando-os de cinismo. Ele também afirmou que um país que não investe em educação e cultura trata o povo como se fosse gado.", "titulo_pt": "Lula critica discurso de candidatos sobre futuro do país: 'cinismo'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 147314, "titulo": "A ofensiva de Lula pelo sul do país para emplacar aliados", "url": "https://veja.abril.com.br/politica/a-ofensiva-de-lula-pelo-sul-do-pais-para-emplacar-aliados/", "fonte_id": "veja", "data_pub": "2026-09-05T17:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Luiz Inácio Lula da Silva está planejando uma viagem pelo sul do Brasil, passando por Paraná, Santa Catarina e Rio Grande do Sul nos próximos dias, com o objetivo de fortalecer alianças políticas.", "titulo_pt": "A ofensiva de Lula pelo sul do país para consolidar aliados", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 147301, "titulo": "Trump assina ordens para apoiar pecuaristas e baratear carne", "url": "https://www.poder360.com.br/poder-internacional/trump-assina-ordens-para-apoiar-pecuaristas-e-baratear-carne/", "fonte_id": "poder360", "data_pub": "2026-09-05T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, assinou ordens executivas para apoiar pecuaristas e baratear a carne. As medidas incluem proteção contra predadores, apoio a pequenos frigoríficos e revisão da rotulagem de origem nos EUA.", "titulo_pt": "Trump assina ordens para apoiar pecuaristas e baratear carne", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 147290, "titulo": "Direita quebrou banco e comprou STF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/celso-rocha-de-barros/2026/09/direita-quebrou-banco-e-comprou-stf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-05T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A direita criou o Banco Master, que foi descoberto roubando com essa instituição. Para evitar a prisão, a direita pagou membros do STF.", "titulo_pt": "Direita quebrou banco e comprou STF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 147358, "titulo": "Maluf é resgatado em materiais de propaganda do PP na Avenida Paulista", "url": "https://www.metropoles.com/colunas/vinicius-passarelli/maluf-propaganda-pp", "fonte_id": "metropoles", "data_pub": "2026-09-05T17:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O partido PP usou imagens do ex-governador Maluf em materiais de propaganda na Avenida Paulista. O objetivo foi promover a candidatura de um afilhado de Maluf à Assembleia Legislativa de São Paulo.", "titulo_pt": "Maluf é usado em propaganda do PP na Avenida Paulista", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 147316, "titulo": "Moraes levanta bola para defesa de Lulinha tentar afastar Mendonça de investigação", "url": "https://veja.abril.com.br/politica/moraes-levanta-bola-para-defesa-de-lulinha-tentar-afastar-mendonca-de-investigacao/", "fonte_id": "veja", "data_pub": "2026-09-05T17:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O juiz federal Sérgio Moro está levantando argumentos para defender Lula no processo, com o objetivo de afastar o ministro do STF, Luís Roberto Barroso, da investigação. Segundo o relatório de inteligência, a Polícia Federal acusa Barroso de dar tratamento diferenciado a suspeitos de tráfico de influência, sem apresentar provas.", "titulo_pt": "Moraes mobiliza defesa de Lulinha para distanciar barroso de investigação", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 147360, "titulo": "Celina sobre ocupação do Centrad: \"Vamos ter 40 mil servidores lá\"", "url": "https://www.metropoles.com/distrito-federal/celina-sobre-ocupacao-do-centrad-vamos-ter-40-mil-servidores-la", "fonte_id": "metropoles", "data_pub": "2026-09-05T17:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A governadora Celina afirmou que a ocupação do Centrad terá 40 mil servidores e que este é um sonho que muitos consideravam impossível de se realizar.", "titulo_pt": "Celina sobre ocupação do Centrad: 'vamos ter 40 mil servidores lá'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 147275, "titulo": "Focamos no futuro financeiro do Instituto Inhotim, diz diretora-presidente", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/focamos-no-futuro-financeiro-do-instituto-inhotim-diz-diretora-presidente.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-05T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Paula Azevedo, diretora-presidente do Instituto Inhotim desde 2022, está focada na garantia da saúde financeira da instituição. O plano estratégico Inhotim 2030 visa organizar a governança, sustentabilidade e preservação do maior museu ao ar livre do mundo.", "titulo_pt": "Diretora-presidente do Inhotim foca no futuro financeiro da instituição", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 147317, "titulo": "Primeira pesquisa Datafolha sobre a disputa Lula x Flávio após crise no STF testa também Cury no 2º turno", "url": "https://veja.abril.com.br/politica/primeira-pesquisa-datafolha-sobre-a-disputa-lula-x-flavio-apos-crise-no-stf-testa-tambem-cury-no-2o-turno/", "fonte_id": "veja", "data_pub": "2026-09-05T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha avaliará a preferência dos votos entre Lula e Flávio Bolsonaro no segundo turno, além de medir a rejeição, a firmeza do voto e o impacto das crises envolvendo Alexandre de Moraes e André Mendonça.", "titulo_pt": "Primeira pesquisa Datafolha sobre Lula x Flávio após crises no STF testa também Cury no segundo turno", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 147318, "titulo": "Caminho livre para vice de Flávio: STF deve arquivar acusação contra Alfredo Gaspar", "url": "https://veja.abril.com.br/politica/caminho-livre-para-vice-de-flavio-stf-deve-arquivar-acusacao-contra-alfredo-gaspar/", "fonte_id": "veja", "data_pub": "2026-09-05T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado Alfredo Gaspar, ex-relator da CPI Mista do INSS, pediu desculpas ao ministro Gilmar Mendes, relator do caso no STF. Isso pode indicar que há possibilidade de arquivamento da acusação contra ele.", "titulo_pt": "Caminho livre para vice de Flávio: STF deve arquivar acusação contra Alfredo Gaspar", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 147363, "titulo": "Tarcísio anuncia \"hub ferroviário\" e prevê trem São Paulo-Campinas até 2029", "url": "https://www.metropoles.com/sao-paulo/tarcisio-anuncia-hub-ferroviario-e-preve-trem-sao-paulo-campinas-ate-2029", "fonte_id": "metropoles", "data_pub": "2026-09-05T16:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tarcísio de Freitas anunciou a intenção do governo de expandir as ligações ferroviárias de passageiros entre São Paulo e a região metropolitana. O projeto inclui o trem São Paulo-Campinas, com previsão de operação até 2029.", "titulo_pt": "Tarcísio anuncia 'hub ferroviário' e prevê trem São Paulo-Campinas até 2029", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 147291, "titulo": "Lula critica Tarcísio em SP, e Haddad associa governador a 'máfia do Master'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/lula-critica-tarcisio-em-sp-e-haddad-associa-governador-a-mafia-do-master.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-05T16:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em um evento de campanha em São Paulo, Lula criticou Tarcísio de Freitas, governador do estado, chamando-o de 'um cara do Rio de Janeiro' e afirmando que ele não realizou obras no estado. Haddad associou o governador à 'máfia do Master'.", "titulo_pt": "Lula critica Tarcísio e associa governador à 'máfia do Master'", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 147386, "titulo": "Marco Aurélio Mello à CNN: “Mendonça procedeu como deveria proceder”", "url": "https://www.cnnbrasil.com.br/politica/marco-aurelio-mello-a-cnn-mendonca-procedeu-como-deveria-proceder/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-05T16:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro aposentado do STF, Marco Aurélio Mello, defendeu a atuação de André Mendonça em uma entrevista à CNN Brasil, após revelações envolvendo Alexandre de Moraes e o ex-dono do Banco Master, Daniel Vorcaro.", "titulo_pt": "Marco Aurélio Mello à CNN: ‘mendonça procedeu como deveria proceder’", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 147325, "titulo": "Nova pesquisa AtlasIntel mostra disputa Lula x Flávio após escândalo no STF e testa Cury no segundo turno", "url": "https://veja.abril.com.br/politica/nova-pesquisa-atlasintel-mostra-disputa-lula-x-flavio-apos-esca s kill five in Gaza", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/rescuers-recover-11-palestinian-bodies-rubble-israeli-attacks-kill-five", "fonte_id": "middle_east_eye", "data_pub": "2026-09-05T17:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Resgatadores recuperaram 11 corpos palestinos das ruínas, enquanto cinco palestinos morreram em ataques israelenses em Gaza. Os hospitais de Gaza receberam 17 corpos, incluindo um que faleceu de ferimentos anteriores, e atenderam 27 feridos. Mais vítimas permanecem presas sob prédios destruídos ou nas ruas, pois os serviços de ambulância e defesa civil não conseguem chegar até elas.", "titulo_pt": "Resgatadores recuperam 11 corpos palestinos das ruínas enquanto ataques israelenses matam cinco em Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 147646, "titulo": "US envoys meet Putin in Moscow for Ukraine talks", "url": "https://www.bbc.co.uk/news/articles/cx2zqp46g8eo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-05T17:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Enviados especiais dos Estados Unidos se encontram com Putin em Moscou para discutir a Ucrânia. Trump afirma que os enviados trazem uma proposta para pôr fim à guerra.", "titulo_pt": "Enviados dos EUA se reúnem com Putin em moscou para conversas sobre Ucrânia", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 147580, "titulo": "Putin Orders Pause in Kyiv Strikes Ahead of Visit by U.S. Envoys", "url": "https://www.nytimes.com/2026/09/05/world/europe/russia-ukraine-witkoff-kushner-moscow.html", "fonte_id": "nyt_world", "data_pub": "2026-09-05T17:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Steve Witkoff, enviado especial de Trump, e Jared Kushner, seu genro, chegaram a Moscou para se encontrar com o líder russo. Eles viajarão para Kiev com o objetivo de reativar as negociações de paz.", "titulo_pt": "Putin ordena pausa nas operações em Kyiv antes da visita de envio americanos", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 147780, "titulo": "Al via l'incontro di Putin con Witkoff e Kushner, 'la discussione non è semplice'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/05/al-via-lincontro-di-putin-con-witkoff-e-kushner-la-discussione-non-e-semplice_92cd70bc-1a50-4f0a-8b11-f6346e1aca6e.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-05T17:09:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O encontro entre Putin, Witkoff e Kushner foi relatado pela agência Interfax. A discussão não é simples.", "titulo_pt": "Al encontro de Putin com Witkoff e Kushner, 'a discussão não é simples'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 147526, "titulo": "Darío Sztajnszrajber: “La filosofía sirve para cuestionar por qué todo tiene que servir siempre”", "url": "https://www.lanacion.com.ar/sociedad/dario-sztajnszrajber-la-filosofia-sirve-para-cuestionar-por-que-todo-tiene-que-servir-siempre-nid05092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-05T17:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Darío Sztajnszrajber discutiu a utilidade da filosofia na vida cotidiana, enfatizando que o pensamento crítico ajuda a escapar da lógica da rentabilidade constante.", "titulo_pt": "Darío Sztajnszrajber: 'a filosofia serve para questionar por que tudo tem que servir sempre'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 147732, "titulo": "Pentagon chief threatens more strikes on Iranian oil tankers", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/pentagon-chief-threatens-more-strikes-iranian-oil-tankers", "fonte_id": "middle_east_eye", "data_pub": "2026-09-05T16:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário de Defesa dos Estados Unidos, Pete Hegseth, ameaçou mais ataques contra embarcações de petróleo iranianas. Ele afirmou que o Exército pode destruir toda a frota de navios-pipa do Irã, alegando que o país não tem uma marinha ou força aérea para se defender.", "titulo_pt": "Secretário de defesa ameaça mais ataques aos navios-pipa iranianos", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 147781, "titulo": "Mattarella, 'Repubblica e autonomie hanno nutrito democrazia contro il fascismo'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/05/mattarella-repubblica-e-autonomie-hanno-nutrito-democrazia-contro-il-fascismo_f8d188fe-b791-4a4a-8ed6-b7241ffc3180.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-05T16:55:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O presidente da Itália, Mattarella, enfatizou que a república e as autonomias nutriram a democracia contra o fascismo. O autogoverno da província de Trento foi apresentado como uma resposta ao centralismo e à ditadura.", "titulo_pt": "Mattarella: república e autonomias nutriram democracia contra o fascismo", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 147782, "titulo": "Stato di emergenza in 5 carceri di massima sicurezza del Perù", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/05/stato-di-emergenza-in-5-carceri-di-massima-sicurezza-del-peru_048ae88d-fbce-4f49-a304-26e247973244.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-05T16:51:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O governo do Peru decretou estado de emergência em cinco penitenciárias de máxima segurança por 60 dias devido às atividades de gangues.", "titulo_pt": "Estado de emergência em cinco penitenciárias de máxima segurança do peru devido às gangues", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 147452, "titulo": "EUA dizem ter atacado 3 petroleiros iranianos após seus navios de guerra serem alvejados", "url": "https://www.bbc.com/portuguese/articles/c9v9gr4enxwo?at_m da OpenAI já haviam usado wiki alemã", "url": "https://www.infomoney.com.br/business/agentes-openai-wiki-alema-hugging-face/", "fonte_id": "infomoney", "data_pub": "2026-09-05T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OpenAI admitiu que seus agentes escreveram em sites reais durante testes e que precisa mudar a forma como divulga comportamentos inesperados de seus modelos. Antes da Hugging Face, os agentes da OpenAI já haviam usado uma wiki alemã durante esses testes.", "titulo_pt": "Antes da Hugging Face, agentes da OpenAI já haviam usado wiki alemã", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 147423, "titulo": "Dia do Cliente: quais são os direitos do consumidor em promoções?", "url": "https://www.infomoney.com.br/consumo/direitos-consumidor-promocoes-dia-do-cliente/", "fonte_id": "infomoney", "data_pub": "2026-09-05T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os direitos do consumidor não são alterados durante as campanhas promocionais e estão protegidos pelo Código de Defesa do Consumidor. O Dia do Cliente é uma ocasião para lembrar esses direitos.", "titulo_pt": "Dia do Cliente: quais são os direitos do consumidor em promoções?", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 147295, "titulo": "Brasil testa plataforma para pesquisas em microgravidade no espaço", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/brasil-testa-plataforma-para-pesquisas-em-microgravidade-no-espaco", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-05T17:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil realiza testes de uma plataforma para pesquisas em microgravidade no espaço como parte da Operação Potiguar 2, no Centro de Lançamento da Barreira do Inferno, no Rio Grande do Norte. O objetivo é expandir a capacidade de realizar pesquisas científicas nesse ambiente especial.", "titulo_pt": "Brasil testa plataforma para pesquisas e ta_de": null, "texto_pt": "Houve chuva na zona oeste de São Paulo, em bairros como Perdizes e Pompeia, no primeiro dia de feriado prolongado. Em algumas regiões, o dia se tornou mais cedo, indicando a chegada da noite mais rápido do que o normal.", "titulo_pt": "SP registra chuva no primeiro dia de feriado prolongado; 'dia anoitece' em algumas regiões", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 147427, "titulo": "Norte-Americanos enfrentam preços recordes da gasolina no Dia do Trabalho", "url": "https://www.infomoney.com.br/mundo/norte-americanos-enfrentam-precos-recordes-da-gasolina-no-dia-do-trabalho/", "fonte_id": "infomoney", "data_pub": "2026-09-05T16:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O preço médio nacional da gasolina nos Estados Unidos está em cerca de R$ 4,13 por litro, uma elevação de quase um dólar em comparação com o mesmo período do ano anterior. Isso ocorre durante o Dia do Trabalho.", "titulo_pt": "Norte-americanos enfrentam preços recordes da gasolina no Dia do Trabalho", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 147702, "titulo": "Trump’s state capitalism comes to the oil industry with his unprecedented Venezuela deal", "url": "https://www.cnbc.com/2026/09/05/trump-venezuela-oil-north-america-blue-energy-partners-nabep.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-05T15:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O acordo foi fechado oito meses após Washington derrubar o ex-presidente Nicolás Maduro em uma operação militar. O acordo envolve a indústria de petróleo e reflete o modelo de capitalismo estatal adotado por Trump.", "titulo_pt": "O capitalismo estatal de trump chega à indústria de petróleo com seu inédito acordo com a Venezuela", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 147278, "titulo": "Jornais dos EUA processam OpenAI e Microsoft por suposta violação de direitos autorais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/jornais-dos-eua-processam-openai-e-microsoft-por-suposta-violacao-de-direitos-autorais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-05T14:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os jornais Seattle Times e Newsday processaram a OpenAI e a Microsoft em um tribunal federal dos Estados Unidos, alegando que as empresas utilizaram seus conteúdos jornalísticos não autorizados para treinar sistemas de inteligência artificial.", "titulo_pt": "Jornais dos EUA processam OpenAI e Microsoft por suposta violação de direitos autorais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 147279, "titulo": "Proibidos no Brasil, vapes impulsionam alta nas apreensões de contrabando", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/proibidos-no-brasil-vapes-impulsionam-alta-nas-apreensoes-de-contrabando.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-05T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O valor dos vapes ou cigarros eletrônicos apreendidos pela Receita Federal aumentou significativamente nos últimos anos, apesar da proibição desses produtos no Brasil desde 2009 por decisão da Anvisa.", "titulo_pt": "Proibidos no Brasil, vapes impulsionam alta nas apreensões de contrabando", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 147413, "titulo": "Como Audi, BMW e Volvo querem mudar o segmento de SUVs de luxo", "url": "https://exame.com/casual/como-audi-bmw-e-volvo-querem-mudar-o-segmento-de-suvs-de-luxo/", "fonte_id": "exame", "data_pub": "2026-09-05T13:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marcas como Audi, BMW e Volvo estão lançando modelos de SUVs 100% elétricos, focando em desempenho, equipamentos e marca, como parte de sua estratégia contra concorrentes chineses.", "titulo_pt": "Como Audi, BMW e Volvo querem mudar o segmento de SUVs de luxo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 147280, "titulo": "Pesquisa da AWS diz que 33% das empresas confiam na capacidade de medir o retorno da IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/pesquisa-da-aws-diz-que-33-das-empresas-confiam-na-capacidade-de-medir-o-retorno-da-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-05T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Menos da metade das empresas brasileiras, ou seja, 33%, afirmam estar confiantes na capacidade de medir com precisão o retorno sobre o investimento (ROI) de suas iniciativas de inteligência artificial, de acordo com um estudo realizado pela Strand Partners para a AWS.", "titulo_pt": "33% Das empresas brasileiras confiam na capacidade de medir o retorno sobre o investimento de suas iniciativas de IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 147703, "titulo": "Abel: Two ways Berkshire hopes to cash in on AI", "url": "https://www.cnbc.com/2026/09/05/abel-two-ways-berkshire-hopes-in-cash-in-on-ai.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-05T12:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Berkshire Hathaway, Greg Abel, informou à CNBC que a empresa está explorando oportunidades em inteligência artificial por meio de duas abordagens.", "titulo_pt": "Dois caminhos para a Berkshire capitalizar no AI, diz abel", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 147704, "titulo": "This enhanced geothermal project aims to unlock gigawatts of power to fuel the data center boom", "url": "https://www.cnbc.com/2026/09/05/fervo-energys-enhanced-geothermal-project-aims-to-power-data-center-boom.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-05T12:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A demanda por energia nos Estados Unidos está crescendo. A Fervo Energy acredita que seu projeto no Utah demonstrará que a geotermia aprimorada pode ser parte da mistura de energia no futuro.", "titulo_pt": "Este projeto de geotermia aprimorada visa liberar gigawatts de energia para alimentar a expansão dos centros de dados", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 147700, "titulo": "GM vs. Ford: U.S. defense, energy sectors add to automakers' century-old rivalry", "url": "https://www.cnbc.com/2026/09/05/gm-ford-defense-energy.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-05T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "General Motors e Ford buscam novas áreas de crescimento, incluindo contratos militares e negócios em armazenamento de energia.", "titulo_pt": "GM vs. Ford: setores de defesa e energia acrescentam à rivalidade centenária dos fabricantes de automóveis", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 147592, "titulo": "How to survive a national debt scare", "url": "https://www.vox.com/podcasts/501375/national-debt-40-trillion-jared-bernstein-economy-debt-ratio", "fonte_id": "vox", "data_pub": "2026-09-05T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O endividamento nacional não tem sido um tema importante nas eleições de 2026. Até o momento, o débito dos Estados Unidos é de 40 trilhões de dólares, o que representa aproximadamente 116 mil dólares por habitante.", "titulo_pt": "Como sobreviver a uma escalada do endividamento nacional", "veiculo": "Vox", "pais": "EUA", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 147431, "titulo": "Sua casa mais segura: câmeras Wi-Fi com visão noturna e monitoramento em tempo real em oferta na Amazon", "url": "https://olhardigital.com.br/2026/09/05/reviews/sua-casa-mais-segura-cameras-wi-fi-com-visao-noturna-e-monitoramento-em-tempo todos os gostos", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 147846, "titulo": "Clucky’s new alarm app wakes you up with a crowing rooster", "url": "https://techcrunch.com/2026/09/05/cluckys-new-alarm-app-wakes-you-up-with-a-crowing-rooster/", "fonte_id": "techcrunch", "data_pub": "2026-09-05T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A nova aplicação de alarme da Clucky acorda os usuários com o som de um galinha cantando. Após ser acordado, o usuário deve completar uma missão para desligar o alarme.", "titulo_pt": "Nova aplicação de alarme da clucky acorda com o canto de uma galinha", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 147433, "titulo": "Curtir a música onde estiver ficou mais fácil: veja caixas de som Bluetooth em promoção na Amazon", "url": "https://olhardigital.com.br/2026/09/05/reviews/curtir-a-musica-onde-estiver-ficou-mais-facil-veja-caixas-de-som-bluetooth-em-promocao-na-amazon/", "fonte_id": "olhar_digital", "data_pub": "2026-09-05T16:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Amazon está oferecendo três opções de caixas de som Bluetooth para compra. Essas caixas permitem levar música para qualquer lugar, sendo uma escolha ideal para festas ou praia. A caixa de som portátil 20W GO, por exemplo, possui 20W de potência.", "titulo_pt": "Curtir música em qualquer lugar ficou mais fácil: veja caixas de som Bluetooth em promoção na Amazon", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 147836, "titulo": "Trumpf CTO says advanced packaging reshapes semiconductor equipment race", "url": "https://www.digitimes.com/news/a20260903PD238/packaging-equipment-demand-technology-semiconductor-industry.html", "fonte_id": "digitimes", "data_pub": "2026-09-05T16:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A demanda por inteligência artificial (IA) e computação de alto desempenho (HPC) está mudando as prioridades tecnológicas e de investimento da indústria de semicondutores. A competição agora abrange não apenas a escala de processos front-end, mas também empilhamento 3D, pacotes avançados, interconexões de alta densidade, gerenciamento térmico e tecnologias de memória.", "titulo_pt": "CTO da trumpf diz que pacotes avançados estão remodelando a corrida por equipamentos de semicondutores", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 147837, "titulo": "K-Safety Expo 2026: Beyond AI, Korea re-engineers the human layer of industrial safety", "url": "https://www.digitimes.com/news/a20260903VL202/expo-industrial-2026-fire-camera.html", "fonte_id": "digitimes", "data_pub": "2026-09-05T16:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A exposição K-Safety Expo 2026 em Busan apresentou inovações em segurança, mas não todas as novidades envolviam câmeras de inteligência artificial.", "titulo_pt": "K-safety Expo 2026: além da inteligência artificial, coréia re-engenharia o nível humano da segurança industrial", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 147838, "titulo": "Google's quantum boss says five years; his engineer says not so fast", "url": "https://www.digitimes.com/news/a20260903VL221/quantum-google-taiwan.html", "fonte_id": "digitimes", "data_pub": "2026-09-05T16:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O quantum computing enfrenta um problema de confiança. Quando uma máquina quântica produz uma resposta que um computador convencional não pode gerar facilmente, não há um método óbvio de verificar se a resposta é correta.", "titulo_pt": "Chefe da google em quantum computing estima cinco anos; engenheiro diz que é cedo para dizer", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 147442, "titulo": "Qual o preço para trocar a placa cinza do carro pela padrão Mercosul?", "url": "https://canaltech.com.br/carros/qual-o-preco-para-trocar-a-placa-cinza-do-c  "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 147437, "titulo": "Ciência revela qual é o único fator que traz felicidade real. Spoiler: não é o dinheiro", "url": "https://olhardigital.com.br/2026/09/05/ciencia-e-espaco/ciencia-revela-qual-e-o-unico-fator-que-traz-felicidade-real-spoiler-nao-e-o-dinheiro/", "fonte_id": "olhar_digital", "data_pub": "2026-09-05T15:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Toronto descobriram que a autonomia para tomar decisões é o principal fator para a felicidade. O estudo sugere que a liberdade de escolha é mais importante do que o dinheiro para o bem-estar pessoal.", "titulo_pt": "Ciência revela qual é o único fator que traz felicidade real. Spoiler: não é o dinheiro", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 147443, "titulo": "Magalu Cloud debate soberania de dados, IA e segurança no Cloud Futures 2026", "url": "https://canaltech.com.br/mercado/magalu-cloud-debate-soberania-de-dados-ia-e-seguranca-no-cloud-futures-2026/", "fonte_id": "canaltech", "data_pub": "2026-09-05T15:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A quarta edição do Cloud Futures será realizada na próxima quarta-feira (9) na Arena Magalu, em São Paulo, abordando temas como soberania de dados, computação em nuvem, inteligência artificial, multicloud e FinOps. O evento, promovido pela Magalu Cloud, contará com a presença de executivos e especialistas da empresa, incluindo Luiza Helena Trajano.", "titulo_pt": "Magalu Cloud debate soberania de dados, IA e segurança no Cloud Futures 2026", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 147327, "titulo": "IA da Genial já é usada por um em cada quatro clientes digitais", "url": "https://veja.abril.com.br/economia/ia-da-genial-ja-e-usada-por-um-em-cada-quatro-clientes-digitais/", "fonte_id": "veja", "data_pub": "2026-09-05T15:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial da Genial já é utilizada por um em cada quatro clientes digitais. Com 100 mil usuários, o assistente está se transformando em um canal de distribuição de investimentos e receberá produtos exclusivos.", "titulo_pt": "IA da Genial já é usada por um em cada quatro clientes digitais", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 147438, "titulo": "Seu PC pede mais velocidade: veja uma seleção de memórias RAM DDR5 em oferta na Amazon", "url": "https://olhardigital.com.br/2026/09/05/reviews/seu-pc-pede-mais-velocidade-veja-uma-selecao-de-memorias-ram-ddr5-em-oferta-na-amazon/", "fonte_id": "olhar_digital", "data_pub": "2026-09-05T15:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A seleção apresenta três opções de memórias RAM DDR5 em oferta na Amazon, adequadas para laptops e desktops, das marcas Crucial e Corsair. O objetivo é aumentar a velocidade do computador ou notebook que está apresentando sinais de lentidão.", "titulo_pt": "Seu PC pede mais velocidade: veja opções de memórias RAM DDR5 em oferta na Amazon", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 147839, "titulo": "Tesla’s Cybercab has been deployed, and it’s already under investigation", "url": "https://arstechnica.com/cars/2026/09/teslas-cybercab-has-been-deployed-and-its-already-under-investigation/", "fonte_id": "ars_technica", "data_pub": "2026-09-05T15:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Cybercab, um táxi autônomo desenvolvido pela Tesla, já está em operação. O governo dos Estados Unidos está investigando se o veículo atende aos padrões de segurança de veículos.", "titulo_pt": "Tesla’s Cybercab já está em operação e está sendo investigado pelo governo", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 147852, "titulo": "US study tests psilocybin to fight cancer side effects", "url": "https://phys.org/news/2026-09-psilocybin-cancer-side-effects.html", "fonte_id": "phys_org", "data_pub": "2026-09-05T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo nos Estados Unidos está testando a eficácia da psilocibina, substância encontrada nas cogumelos psilocênicos, para combater os efeitos secundários dolorosos do quimioterapia.", "titulo_pt": "Estudo nos EUA testa psilocibina para combater efeitos secundários do câncer", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 147853, "titulo": "A black hole as light as 40 tons can exist inside a star if dark matter helps", "url": "https://phys.org/news/2026-09-black-hole-tons-star-dark.html", "fonte_id": "phys_org", "data_pub": "2026-09-05T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 1974, Stephen Hawking previu que buracos negros perdem energia através de um processo quântico chamado radiação de Hawking. Buracos negros mais leves evaporam mais rapidamente.", "titulo_pt": "Um buraco negro tão leve quanto 40 toneladas pode existir dentro de uma estrela com a ajuda de matéria escura", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 147388, "titulo": "Paciente viveu 271 dias com rim suíno em estudo liderado por brasileiro", "url": "https://www.cnnbrasil.com.br/saude/paciente-viveu-271-dias-com-rim-suino-em-estudo-liderado-por-brasileiro/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-05T16:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um paciente sobreviveu 271 dias com um rim de suíno em um estudo liderado por um brasileiro, representando um avanço na realização de xenotransplantes. Este é o primeiro caso em que um paciente viveu mais de dois meses com esse procedimento.", "titulo_pt": "Paciente sobreviveu 271 dias com rim suíno em estudo brasileiro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 147854, "titulo": "Tree species diversity protects forests from climate extremes, study finds", "url": "https://phys.org/news/2026-09-tree-species-diversity-forests-climate.html", "fonte_id": "phys_org", "data_pub": "2026-09-05T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa analisou 88.116 parcelas florestais nos Estados Unidos e descobriu que a diversidade de espécies de árvores pode ser crucial na proteção das florestas contra eventos climáticos extremos, como secas e calor extremo ocorrendo simultaneamente.", "titulo_pt": "Diversidade de espécies de árvores protege florestas de eventos climáticos extremos, estudo mostra", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 147876, "titulo": "Venus is disappearing from the evening sky — here's how to see it while you can", "url": "https://www.space.com/stargazing/venus-is-disappearing-from-the-evening-sky-heres-how-to-see-it-while-you-can", "fonte_id": "space_com", "data_pub": "2026-09-05T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vênus está se movendo para baixo no horizonte pôr do sol em setembro, mas ainda será visível durante o anoitecer por algum tempo.", "titulo_pt": "Vênus está desaparecendo do céu noturno - aqui está como vê-lo enquanto ainda pode", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 147819, "titulo": "Hong Kong’s first astronaut Lai Ka-ying to give live lecture from space", "url": "https://www.scmp.com/news/hong-kong/education/article/3366497/hong-kongs-first-astronaut-lai-ka-ying-give-live-lecture-space?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-05T14:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lai Ka-ying, astronauta da primeira missão de Hong Kong, e seus dois companheiros de equipe dos tripulantes da missão Shenzhou-23, irão realizar uma aula ao vivo do espaço para estudantes e professores de Hong Kong e Macau. A atividade, organizada conjuntamente pelo governo de Hong Kong, Macau e a Agência Nacional de Voo Tripulado da China, incluirá uma palestra de especialista, uma demonstração em órbita e mais elementos.", "titulo_pt": "Astronauta de hong Kong Lai Ka-ying vai ministrar aula ao vivo do espaço", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 147856, "titulo": "Some disagreement makes groups more trustworthy, mathematical framework finds", "url": "https://phys.org/news/2026-09-disagreement-groups-trustworthy-mathematical-framework.html", "fonte_id": "phys_org", "data_pub": "2026-09-05T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos matemáticos mostram que discordâncias entre grupos podem torná-los mais confiáveis. As decisões humanas não dependem apenas das considerações pessoais e evidências disponíveis, mas também são influenciadas pelas escolhas e opiniões dos outros.", "titulo_pt": "Alguma discordância torna grupos mais confiáveis, estudo matemático mostra", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 147877, "titulo": "This Lego Star Wars UCS AT-ST set is cheaper than ever — I'll always love this chicken walker", "url": "https://www.space.com/entertainment/space-toys-lego/this-lego-star-wars-ucs-at-st-set-is-cheaper-than-ever-and-ill-always-love-this-chicken-walker", "fonte_id": "space_com", "data_pub": "2026-09-05T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O AT-ST, uma das veículos terrestres da franquia Star Wars, está disponível em uma versão Lego Ultimate Collector Series com um desconto de $39, atingindo seu preço mais baixo até agora. O autor expressa seu amor pelo veículo, preferindo-o ao AT-AT.", "titulo_pt": "Este conjunto Lego Star Wars AT-ST é o mais barato nunca - eu sempre amei esse caminhão de galinha", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 147878, "titulo": "Watch Isar Aerospace try to make history today with launch from Norway", "url": "https://www.space.com/space-exploration/launches-spacecraft/isar-aerospace-second-launch-norway-andoya-spaceport-spectrum-rocket", "fonte_id": "space_com", "data_pub": "2026-09-05T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Spectrum, um foguete da Isar Aerospace, tentará ser o primeiro veículo a alcançar a órbita partindo do solo europeu hoje, 5 de setembro. A transmissão ao vivo do lançamento está disponível.", "titulo_pt": "Assista à Isar Aerospace tentar fazer história hoje com lançamento da noruega", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 147879, "titulo": "This Week In Space podcast: Episode 226 — Who Owns The Moon?", "url": "https://www.space.com/entertainment/space-movies-shows/this-week-in-space-podcast-episode-226-who-owns-the-moon", "fonte_id": "space_com", "data_pub": "2026-09-05T13:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na 226ª episódio do This Week In Space, Rod Pyle, Tariq Malik e Dr. Rainer Zitelmann discutem a história do capitalismo e sua aplicação no futuro espacial.", "titulo_pt": "Este semana no espaço: episódio 226 — quem detém a lua?", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 147411, "titulo": "Paciente vive 9 meses com rim de porco em estudo liderado por brasileiro", "url": "https://exame.com/ciencia/paciente-vive-9-meses-com-rim-de-porco-em-estudo-liderado-por-brasileiro/", "fonte_id": "exame", "data_pub": "2026-09-05T13:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo liderado por Leonardo Riella utilizou edição genética para reduzir a rejeição de um rim de porco em um paciente, que sobreviveu por nove meses.", "titulo_pt": "Paciente sobrevive por 9 meses com rim de porco em estudo brasileiro", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 147412, "titulo": "Picada de cobra pode aumentar o risco de AVC — e cientistas investigam o motivo", "url": "https://exame.com/ciencia/picada-de-cobra-pode-aumentar-o-risco-de-avc-e-cientistas-investigam-o-motivo/", "fonte_id": "exame", "data_pub": "2026-09-05T13:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma revisão de estudos com 130 casos indicou que picadas de cobra podem aumentar o risco de AVC mesmo após o uso do soro antiofídico. Os cientistas estão investigando o motivo dessa complicação neurológica.", "titulo_pt": "Picada de cobra pode aumentar o risco de AVC — e cientistas investigam o motivo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 147822, "titulo": "China launches plan for 3D satellite network to monitor sun and cosmic explosions", "url": "https://www.scmp.com/news/china/science/article/3366483/china-launches-plan-3d-satellite-network-monitor-sun-and-cosmic-explosions?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-05T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China iniciou um projeto internacional para construir uma rede de satélites tridimensional entre a Terra e a Lua, que monitorará a atividade solar e estudará algumas das explosões mais poderosas do universo. O projeto envolverá o envio de 30 satélites do tamanho de mochilas em órbitas elípticas ao redor da Terra nos próximos quatro anos.", "titulo_pt": "China lança projeto para rede de satélites 3D entre a terra e a lua para monitorar sol e explosões cósmicas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 147880, "titulo": "On this day in space! Sept. 5, 1977: NASA launches Voyager 1 on epic journey across the solar system", "url": "https://www.space.com/space-exploration/on-this-day-in-space-sept-5-1977-nasa-launches-voyager-1-on-epic-journey-across-the-solar-system", "fonte_id": "space_com", "data_pub": "2026-09-05T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 5 de setembro de 1977, o Voyager 1 foi lançado com sucesso pela NASA no início de uma jornada épica pelo sistema solar. O lançamento ocorreu pela manhã no Cabo Canaveral, Flórida.", "titulo_pt": "5 De setembro de 1977: NASA lança Voyager 1 em jornada épica pelo sistema solar", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 147823, "titulo": "How can future doctors blend clinical rigour with AI fluency and empathy?", "url": "https://www.scmp.com/news/hong-kong/education/article/3366492/how-can-future-doctors-blend-clinical-rigour-ai-fluency-and-empathy?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-05T12:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos em saúde enfatizaram que os futuros profissionais de saúde em Hong Kong devem combinar rigor clínico com resiliência emocional, uma abordagem aberta à inteligência artificial (IA) e o impulso para transformar o setor. Essa discussão foi realizada em um painel durante o primeiro dia do Summit de Educação Global, organizado pela South China Morning Post e HSBC Premier.", "titulo_pt": "Como os futuros médicos podem combinar rigor clínico com competência em IA e empatia?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 147857, "titulo": "Lakes aren't just storing water—they're changing the carbon cycle", "url": "https://phys.org/news/2026-08-lakes-theyre-carbon.html", "fonte_id": "phys_org", "data_pub": "2026-09-05T12:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos recentes indicam que a presença de lagos em redes de riachos pode aumentar a liberação de carbono para a atmosfera, em vez de transportá-lo para baixo dos rios.", "titulo_pt": "Lagos não estão apenas armazenando água - eles estão mudando o ciclo de carbono", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 147521, "titulo": "El Vaticano define los pasos del Papa en la Argentina y evalúa una agenda con contenido social", "url": "https://www.lanacion.com.ar/politica/el-vaticano-define-los-pasos-del-papa-en-la-argentina-y-evalua-una-agenda-con-contenido-social-nid05092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-05T17:34:00Z", "idioma": "es", "prova  null, "texto_pt": "O Ministério Público irá investigar um incidente de homofobia contra o ator João Victor Gonçalves, conhecido como Maumau na novela 'Quem Ama Cuida', após ele ter sido hostilizado por streamers da plataforma Kick durante sua saída do Rock in Rio no sábado (5).", "titulo_pt": "Mp irá investigar incidente de homofobia contra ator de 'Quem Ama Cuida'", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 147892, "titulo": "‘Elsinore’ and ‘The Liberation’ Launch TV Stars Andrew Scott and Carrie Coon Into the Oscar Race", "url": "https://www.indiewire.com/awards/predictions/elsinore-the-liberation-andrew-scott-carrie-coon-oscar-race-1235215087/", "fonte_id": "indiewire", "data_pub": "2026-09-05T16:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As estreias mundiais de 'Elsinore' e 'The Liberation' apresentaram performances emocionantes que podem levar os atores Andrew Scott e Carrie Coon a concorrerem aos prêmios Oscar.", "titulo_pt": "‘Elsinore’ e ‘The Liberation’ lançam estrelas de TV Andrew Scott e Carrie Coon no circuito dos oscars", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 147893, "titulo": "‘The Difficult Bride’ Turns South Asia’s Beloved Wedding Tropes Into Feminist Folk Horror at Venice", "url": "https://www.indiewire.com/features/interviews/the-difficult-bride-movie-rubaiyat-hossain-venice-1235214801/", "fonte_id": "indiewire", "data_pub": "2026-09-05T15:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rubaiyat Hossain, diretora de Bangladesh, estreia 'A Noiva Difícil', seu quarto longa, no Festival de Veneza. O filme mistura elementos de folclore assustador com temas feministas, baseado em uma lenda urbana sobre um antigo salão de beleza em Dhaka.", "titulo_pt": "‘A noiva difícil’ transforma trocas de casamentos populares da ásia do sul em Horror folclórico feminista no venécia", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"},
