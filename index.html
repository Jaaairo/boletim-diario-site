<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">

  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>

</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "31/08/2026 19:19", "stats": {"noticias_novas": 595, "resumos_gerados": 228}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O projeto de orçamento de 2027, enviado pelo governo Lula ao Congresso Nacional, prevê um superávit primário de R$ 83,4 bilhões. No entanto, R$ 18,6 bilhões desse valor só serão confirmados se considerarmos o superávit sem gastos fora do arcabouço fiscal. Este será o primeiro ano com saldo positivo nas contas públicas após quatro anos consecutivos de déficit. Além disso, o governo propõe um novo salário mínimo de R$ 1.741 para 2027, um aumento de R$ 120 em relação ao valor atual. Renan Santos, candidato à Presidência pelo partido Missão, anunciou que vai pedir uma liminar contra a decisão do TSE que suspendeu sua propaganda eleitoral e vetou repasses de recursos, considerando a decisão autoritária e irracional. O governo também incluiu um imposto seletivo, conhecido como 'imposto do pecado', que visa arrecadar R$ 41,9 bilhões, incidindo sobre bebidas alcoólicas, refrigerantes e cigarros.", "mundo": "A Suprema Corte dos Estados Unidos permitiu que o presidente Donald Trump continue com a construção de um salão de festas na Casa Branca, um projeto avaliado em 400 milhões de dólares. Esta decisão foi considerada provavelmente ilegal pelo Chief Justice John Roberts. No entanto, a construção foi liberada em resposta a um pedido de Trump. Em outro desenvolvimento, a presidente do Peru, Keiko Fujimori, pediu ao Congresso o poder de legislar por decreto em segurança e economia, devido à escalada da criminalidade no país. Além disso, a Índia está intensificando suas relações com a China em vista do Brics, com encontros diplomáticos recentes. Por fim, o presidente dos Estados Unidos, Donald Trump, ameaçou retaliar contra ataques iranianos a alvos americanos no Oriente Médio, em resposta a ataques iranianos em uma ilha no Estreito de Ormuz, o início de uma escalada após um mês de calma.\n\nOs principais eventos geopolíticos desta edição incluem a escalada de tensões entre Estados Unidos e Irã, com ataques e contra-ataques que ameaçam a estabilidade regional. O Irã afirmou que não está interessado em uma guerra adicional, mas os Estados Unidos realizaram ataques que resultaram na morte de civis, incluindo crianças. Além disso, a cúpula do Conselho de Cooperação de Xangai, envolvendo o Irã, a Rússia e a China, testou a força do bloco criado para rivalizar com os EUA, sob pressão de novas sanções americanas. Em outro desenvolvimento, a Polônia investiga possíveis atos de terrorismo relacionados a um incêndio em uma fábrica de drones, suspeitando de intervenção russa e conexão com serviços de inteligência estrangeiras. Estes eventos refletem a complexidade e a volatilidade da atual cena geopolítica global, marcada por conflitos regionais e competição entre potências mundiais.", "economia": "O mercado global de chips deve ultrapassar 2 trilhões de dólares até 2030, conforme prevê a SEMI. No Brasil, o governo Lula planeja um Orçamento de 2027 com um superávit primário de R$ 18,6 bilhões, equivalente a 0,13% do PIB. As exportações brasileiras de equipamentos para a indústria de petróleo para a Guiana somaram US$ 1,8 bilhão desde 2020, impulsionando a presença da indústria brasileira na região. A justiça do Rio de Janeiro decretou a falência do grupo Refit, que foi alvo de operações contra fraudes no mercado de combustíveis. Além disso, as ações das petrolíferas brasileiras subiram em bloco com o avanço do petróleo, contribuindo para a alta do Ibovespa em mais de 1% na segunda-feira (31).", "tecnologia": "A União Europeia incluiu ChatGPT em uma lista de plataformas de inteligência artificial (IA) sujeitas a fiscalização mais rigorosa, conforme informado em um relatório publicado pela Veja. O objetivo é avaliar e mitigar riscos sistêmicos relacionados aos serviços e algoritmos da OpenAI. Em Taiwan, o governo planeja treinar 500.000 profissionais em IA até 2040, com o objetivo de fortalecer a indústria local e manter a competitividade no campo da IA. A TSMC, líder mundial em fabricação de chips, destaca que sistemas integrados serão cruciais para impulsionar o boom da IA. A TSMC planeja investir em parcerias com outras empresas, como a Nvidia, que anunciou um investimento de 3,5 bilhões de dólares no MediaTek. Em outro desenvolvimento, a Microsoft enfrenta instabilidade no serviço de Outlook, com a empresa testando uma correção para os problemas de longa duração que resultaram em atrasos e falhas no envio de e-mails.", "ciencia": "A NASA nomeou seu mais recente telescópio espacial em homenagem à astrônoma Nancy Grace Roman, reconhecendo suas significativas contribuições para a astrofísica. Após um lançamento perfeito, o telescópio Nancy Grace Roman está em uma missão para esclarecer algumas das maiores mistérias do universo. Em outra notícia, a descoberta de um fósil permiano pode revelar a estrutura mais antiga conhecida de plantas angiospermas, uma descoberta crucial para entender a evolução inicial dessas plantas dominantes em ecossistemas atuais. Além disso, a primeira astronauta francesa a realizar uma caminhada espacial retornou à Estação Espacial Internacional (ISS) para concluir reparos, enquanto a descoberta de microorganismos únicos em Antártica, que não são encontrados em nenhum outro lugar do planeta, reforça a importância da pesquisa em ambientes extremos. Estudos sobre câncer de mama, migrações de aves e a evolução das plantas angiospermas são alguns dos outros temas abordados, destacando a diversidade e a importância da pesquisa científica em diversos campos.", "cultura": "A 40ª edição do festival Burning Man, que acontece no Nevada, apresenta obras de arquitetos que participaram do evento ao longo dos anos, incluindo BIG e Arthur Mamou-Mani. O festival, fundado em 1986 por Larry Harvey e Jerry James, é uma celebração da criatividade e da comunidade, inicialmente como um ritual de solstício. Em outro destaque, o Baltimore Museum of Art anunciou novas adições à sua coleção, que incluem compras, doações e promessas de doações, abrangendo diferentes períodos, culturas e materiais. A quarta edição da TENNOZ ART WEEK 2026, que ocorrerá em setembro em Tennoz, Tóquio, incluirá uma feira de arte, estúdios abertos e uma noite de museus, em colaboração com Tokyo Gendai.", "sociedade": "O Ministério da Saúde expandiu as categorias de subsídio de saúde, incluindo novos serviços e tratamentos, com o objetivo de melhorar o acesso à assistência médica. Em outro desenvolvimento, o Conselho Nacional de Justiça simplificou os processos de inventário em cartórios para famílias sem liquidez financeira, mas a cobrança do imposto permanece. Na área de educação financeira, especialistas sugerem estratégias para ensinar jovens sobre dinheiro, considerando os altos níveis de endividamento das famílias no Brasil. A Receita Federal liberou o quarto lote de restituição do Imposto de Renda, totalizando R$ 1,2 bilhão para 521.935 contribuintes. Além disso, a Coreia do Sul planeja criar contas de poupança a longo prazo para ajudar os residentes na meia-idade a superar um período potencialmente difícil entre o último salário e o primeiro pagamento de aposentadoria.", "meio_ambiente": "Mais de 4.000 pessoas permanecem desaparecidas após inundações letais que atingiram Nepal e Tibet, deixando famílias em desespero, informou a Al Jazeera. A China alertou que o nível do lago formado após o deslizamento pode aumentar com a chuva, alertando para o risco de aumento do nível do lago. No Parque Nacional Yosemite, nos Estados Unidos, o governo está considerando transferir uma pequena parte para um desenvolvedor privado, o que tem gerado forte reação pública. A qualidade do ar na região de Sarawak, na Malásia, atingiu níveis perigosos devido às chamas de incêndios florestais na Indonésia, informou o South China Morning Post.", "direitos_humanos": "O Irã condenou mulheres à morte por participar de manifestações contra o governo, um evento que ganhou força a partir do final de dezembro, motivado pelo colapso econômico e pela desvalorização da moeda local. Em outro desenvolvimento, um homem de Hong Kong foi levado de volta para uma prisão filipina após atrasos na deportação devido a uma tempestade, levando sua equipe legal a criticar a detenção como 'ilegal'. A ONU afirmou que os países estão legalmente obrigados a considerar indenizações pelo comércio transatlântico de escravos e a adotar medidas para abordar a persistente discriminação racial, baseando-se no Convenio de 1965 sobre discriminação racial."}, "resumo_do_dia": {"politica_nacional": [{"id": 136139, "titulo": "Raquel Lyra aciona polícia por circulação de cartazes com acusações sobre morte do marido", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/raquel-lyra-aciona-policia-por-circulacao-de-cartazes-com-acusacoes-sobre-morte-do-marido.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-31T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A governadora de Pernambuco, Raquel Lyra, registrou boletins de ocorrência nas polícias Federal e Civil após cartazes acusando-a de matar o marido, Fernando Lucena, circularem no Recife. A candidata à reeleição tomou esta medida após a disseminação dessas acusações.", "titulo_pt": "Raquel Lyra denuncia polícia por circulação de cartazes acusando-a de matar marido", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 136404, "titulo": "Justiça de Alagoas emite mandado de prisão contra candidato a deputado com base em processo que não existe", "url": "https://www.jota.info/eleicoes/eleicoes-2026/justica-de-alagoas-emite-mandado-de-prisao-contra-candidato-a-deputado-com-base-em-processo-que-nao-existe", "fonte_id": "jota", "data_pub": "2026-08-31T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um magistrado afirmou que seu login e conta foram usados indevidamente, resultando no mandado de prisão contra Cleitin Mil Graus, candidato a deputado estadual de Goiás. O processo utilizado para emitir o mandado de prisão não existe de fato.", "titulo_pt": "Justiça de Alagoas emite mandado de prisão contra candidato a deputado sem base em processo existente", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 136200, "titulo": "Governo Lula entrega para sucessor seu primeiro orçamento com as contas no azul", "url": "https://veja.abril.com.br/economia/governo-lula-entrega-para-sucessor-seu-primeiro-orcamento-com-as-contas-no-azul/", "fonte_id": "veja", "data_pub": "2026-08-31T21:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto orçamentário de 2027 prevê um superávit primário de R$ 18,6 bilhões. Se confirmado, será apenas o segundo resultado positivo das contas públicas em 12 anos.", "titulo_pt": "Governo Lula entrega para sucessor seu primeiro orçamento com as contas no azul", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 136132, "titulo": "Renan Santos diz que vai pedir liminar contra suspensão de candidatura", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/renan-santos-diz-que-vai-pedir-liminar-contra-suspensao-de-candidatura", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-31T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato à Presidência Renan Santos (Missão) anunciou que vai pedir uma liminar contra a decisão do TSE que suspendeu sua propaganda eleitoral. Ele considerou a decisão autoritária e irracional.", "titulo_pt": "Renan Santos vai pedir liminar contra suspensão de propaganda eleitoral", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 136141, "titulo": "Justiça determina remoção de posts dos governos Tarcísio e Nunes por postagens sobre ações oficiais", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/justica-determina-remocao-de-posts-dos-governos-tarcisio-e-nunes-por-postagens-sobre-acoes-oficiais.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-31T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TRE-SP determinou que o governo e a prefeitura de São Paulo removam postagens nas redes sociais que mostravam entregas do governo durante o defeso eleitoral. Essas postagens eram consideradas como publicidade institucional não autorizada.", "titulo_pt": "Justiça determina remoção de postagens sobre entregas do governo durante defeso eleitoral", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 136142, "titulo": "Renan Santos sugere que decisão de Toffoli é represália por críticas sobre Master", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/renan-santos-sugere-que-decisao-de-toffoli-e-represalia-por-criticas-sobre-master.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-31T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Renan Santos, candidato à Presidência pelo partido Missão, criticou a decisão do ministro Dias Toffoli, que o proibiu de participar de debates e fazer propaganda eleitoral digital, chamando-a de 'cassação branca' e sugerindo que se trata de uma represália às críticas do partido sobre a relação do ministro com o caso do Banco Master.", "titulo_pt": "Renan Santos acusa Toffoli de represália em decisão sobre sua candidatura", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 136152, "titulo": "Para taxar cigarros, bebidas alcoólicas e refrigerantes, governo inclui 'imposto do pecado' no orçamento de 2027", "url": "https://g1.globo.com/economia/noticia/2026/08/31/para-taxar-cigarros-bebidas-alcoolicas-e-refrigerantes-governo-inclui-imposto-do-pecado-no-orcamento-de-2027.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-31T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo incluiu no projeto de lei do orçamento de 2027 um imposto seletivo, conhecido como 'imposto do pecado', que visa arrecadar R$ 41,9 bilhões. Este imposto incidirá sobre bebidas alcoólicas, refrigerantes e cigarros.", "titulo_pt": "Para taxar cigarros, bebidas alcoólicas e refrigerantes, governo inclui 'imposto do pecado' no orçamento de 2027", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 136154, "titulo": "Orçamento 2027: governo prevê Bolsa Família sem reajuste no próximo ano", "url": "https://g1.globo.com/economia/noticia/2026/08/31/orcamento-2027-governo-preve-bolsa-familia-sem-reajuste-no-proximo-ano.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-31T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo do presidente Luiz Inácio Lula da Silva (PT) não propôs reajuste no Bolsa Família para 2027, mantendo a mesma estimativa de gastos de R$ 157,1 bilhões, menor que o orçamento previsto para 2026 e 2025. Desde março de 2023, o programa não teve reajuste.", "titulo_pt": "Orçamento 2027: governo não prevê reajuste para Bolsa Família", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 136143, "titulo": "Decisão de Toffoli contra Renan Santos é alvo de críticas no TSE, e ministros defendem debate em plenário", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/decisao-de-toffoli-contra-renan-santos-e-alvo-de-criticas-no-tse-e-ministros-defendem-debate-em-plenario.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-31T21:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A decisão do ministro Dias Toffoli que afetou a campanha de Renan Santos (Missão) à Presidência da República gerou críticas no TSE, com ministros defendendo que o tema seja discutido em plenário.", "titulo_pt": "Decisão de Toffoli sobre Renan Santos é criticada no TSE, e ministros querem debate em plenário", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 136155, "titulo": "Comissão adia votação do fim da taxa das blusinhas para terça-feira", "url": "https://g1.globo.com/politica/noticia/2026/08/31/comissao-adia-votacao-do-fim-da-taxa-das-blusinhas-para-terca-feira.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-31T20:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A votação da medida provisória que elimina a chamada taxa das blusinhas foi adiada para terça-feira (1 de fevereiro) após a suspensão da sessão pela comissão mista. Antes de ser votado, o parecer precisa ser alinhado com os presidentes da Câmara e do Senado.", "titulo_pt": "Votação do fim da taxa das blusinhas é adiada para terça-feira", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 136145, "titulo": "Assim como Renan, Nikolas e Janones usam perfis não indicados ao TSE em campanha", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/assim-como-renan-nikolas-e-janones-usam-perfis-nao-indicados-ao-tse-em-campanha.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-31T20:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nikolas Ferreira e André Janones, candidatos a deputado federal, usam perfis nas redes sociais para campanha que não foram indicados ao TSE. Renan Santos também usa um perfil não indicado, conforme relatório.", "titulo_pt": "Assim como Renan, Nikolas e Janones usam perfis não indicados ao TSE em campanha", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 136156, "titulo": "Orçamento 2027: proposta do governo limita reajustes de servidores públicos seguindo 'gatilho' da regra fiscal", "url": "https://g1.globo.com/economia/noticia/2026/08/31/orcamento-2027-proposta-do-governo-limita-reajustes-de-servidores-publicos-seguindo-gatilho-da-regra-fiscal.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-31T20:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A proposta de Orçamento de 2027 do governo limita os reajustes de servidores públicos, seguindo uma regra fiscal que entra em vigor após o registro de déficit fiscal. Essa regra visa contornar gastos públicos no ano seguinte a um rombo nas contas do governo, podendo ser interrompida apenas com superávit primário.", "titulo_pt": "Proposta de orçamento 2027 limita reajustes de servidores públicos com base em regra fiscal", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 136146, "titulo": "Prêmio Fetisov de Jornalismo recebe inscrições até 15 de setembro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/novo-em-folha/2026/08/premio-fetisov-de-jornalismo-recebe-inscricoes-ate-15-de-setembro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-31T20:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jornalistas podem inscrever trabalhos na edição 2026 do FJA até 15 de setembro. As reportagens devem ter sido publicadas entre 1º de junho de 2025 e 31 de maio de 2026.", "titulo_pt": "Prêmio Fetisov de Jornalismo recebe inscrições até 15 de setembro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [{"titulo": "Orçamento de 2027 prevê salário mínimo de R$ 1.741", "sumario": "O projeto da Lei Orçamentária de 2027, enviado ao Congresso, estabelece um salário mínimo de R$ 1.741 para 2027, representando um aumento nominal de 7,4% em relação ao valor atual. O governo de Luiz Inácio Lula da Silva (PT) propôs um salário mínimo de R$ 1.741 em 2027, conforme o PLOA apresentado em 31 de agosto de 2026. O governo propôs um salário mínimo de R$ 1.741 para 2027, um aumento de R$ 120 em relação ao atual valor de R$ 1.621.", "artigos": [{"id": 136171, "titulo": "Orçamento de 2027 prevê salário mínimo de R$ 1.741", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/orcamento-de-2027-preve-salario-minimo-de-r-1741", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-31T20:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto da Lei Orçamentária de 2027, enviado ao Congresso, estabelece um salário mínimo de R$ 1.741 para 2027, representando um aumento nominal de 7,4% em relação ao valor atual. Este valor é R$ 24 superior ao proposto na Lei de Diretrizes Orçamentárias.", "titulo_pt": "Orçamento de 2027 prevê salário mínimo de R$ 1.741", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 136120, "titulo": "Proposta de Orçamento indica salário mínimo de R$ 1.741 em 2027", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/proposta-de-orcamento-indica-salario-minimo-de-r-1741-em-2027.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T20:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo de Luiz Inácio Lula da Silva (PT) propôs um salário mínimo de R$ 1.741 em 2027, conforme o PLOA apresentado em 31 de agosto de 2026.", "titulo_pt": "Proposta de Orçamento indica salário mínimo de R$ 1.741 em 2027", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 136159, "titulo": "Orçamento 2027: governo prevê aumento do salário mínimo para R$ 1.741 no próximo ano", "url": "https://g1.globo.com/economia/noticia/2026/08/31/orcamento-2027-governo-preve-aumento-do-salario-minimo-para-r-1741-no-proximo-ano.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-31T20:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo propôs um salário mínimo de R$ 1.741 para 2027, um aumento de R$ 120 em relação ao atual valor de R$ 1.621. O valor final será atualizado até o fim do ano.", "titulo_pt": "Orçamento 2027: governo prevê aumento do salário mínimo para R$ 1.741 no próximo ano", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}]}], "mundo": [{"id": 135887, "titulo": "Iran president says more war not in Tehran’s interest", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/01/2003863470", "fonte_id": "taipei_times", "data_pub": "2026-09-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente do Irã afirmou que uma guerra adicional não está no interesse de Teerã. Ele sinalizou que o país não busca conflitos mais amplos.", "titulo_pt": "Presidente do Irã diz que mais guerra não está no interesse de teerã", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 136505, "titulo": "Paxton allies launch $15 million ad campaign", "url": "https://www.politico.com/news/2026/08/31/ken-paxton-ad-campaign-01057911", "fonte_id": "politico", "data_pub": "2026-08-31T21:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo campanha publicitária de 15 milhões de dólares foi lançada para destacar o registro de Paxton como procurador-geral e criticar James Talarico por ser considerado fraco no que diz respeito à China.", "titulo_pt": "Aliados de paxton lançam campanha publicitária de 15 milhões de dólares", "veiculo": "Politico", "pais": "EUA", "classe": "A"}, {"id": 136411, "titulo": "Lionel Messi’s Retirement From Soccer Sparks Heartbreak Across Argentina", "url": "https://www.nytimes.com/2026/08/31/world/americas/lionel-messi-retirement-soccer-argentina.html", "fonte_id": "nyt_world", "data_pub": "2026-08-31T21:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A aposentadoria de Lionel Messi da seleção nacional de futebol, embora prevista, causou preocupações sobre a qualidade reduzida da equipe e tristeza pelo fim da carreira icônica do jogador.", "titulo_pt": "Aposentadoria de Messi da seleção nacional deixa Argentina em choque", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 136140, "titulo": "Moraes marca julgamento de ação contra Eduardo Bolsonaro por atuação nos EUA", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/08/moraes-marca-julgamento-de-acao-contra-eduardo-bolsonaro-por-atuacao-nos-eua.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-31T21:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes, do STF, agendou o julgamento da ação penal contra Eduardo Bolsonaro para os dias 11 a 18 de setembro. A investigação se refere à atuação do deputado federal licenciado no exterior.", "titulo_pt": "Moraes agendou julgamento de ação contra Eduardo Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 136402, "titulo": "Fujimori pide gobernar por decreto para atajar la inseguridad en Perú", "url": "https://elpais.com/america/2026-08-31/fujimori-pide-gobernar-por-decreto-para-atajar-la-inseguridad-en-peru.html", "fonte_id": "elpais_america", "data_pub": "2026-08-31T21:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A presidente peruana pede ao Congresso o poder de legislar por decreto em segurança, economia e outras matérias, devido à escalada criminal que testa seu governo.", "titulo_pt": "Fujimori solicita poderes para decretos para combater a criminalidade no peru", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 136596, "titulo": "Europeans shun Russian finance minister at US-hosted G20 meeting", "url": "https://www.ft.com/content/16285abd-6bc2-4a38-942c-5206c79f4c4b?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-31T21:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro financeiro da Rússia, Anton Siluanov, foi excluído da foto do evento, apesar de ter realizado uma reunião produtiva com o secretário do Tesouro dos EUA, Scott Bessent, durante a reunião do G20 em solo americano.", "titulo_pt": "Européus evitam ministro financeiro russo em reunião do G20 nos EUA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 136599, "titulo": "India needs to make up its mind about economic ties with China", "url": "https://www.scmp.com/opinion/asia-opinion/article/3365334/india-needs-make-its-mind-about-economic-ties-china?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-31T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Índia está intensificando suas relações com a China em vista do Brics, com encontros diplomáticos recentes. No entanto, a Índia permanece hesitante em termos de engajamento econômico com a China.", "titulo_pt": "Índia precisa se decidir sobre relações econômicas com a China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 136570, "titulo": "Poland opens terror probe into fire at drone factory", "url": "https://www.aljazeera.com/news/2026/8/31/poland-opens-terror-probe-into-fire-at-drone-factory?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-31T21:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Polônia investiga possíveis atos de terrorismo relacionados a um incêndio em uma fábrica de drones. Suspeita de intervenção russa e ligação com serviços de inteligência estrangeiros.", "titulo_pt": "Polônia investiga incêndio em fábrica de drones suspeito de ser ato
