<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

</div>

<script>
const D = {"gerado_em": "26/11/2026 07:31", "stats": {"noticias_novas": 792, "resumos_gerados": 249}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Brasil enfrenta diversos desafios políticos e legais no novo governo de Luiz Inácio Lula da Silva. O presidente avança nas negociações para formar seu governo, com destaque para a indicação do senador Camilo Santana para a Casa Civil. A esquerda, por outro lado, luta para acomodar aliados derrotados nas eleições de 2026. O Judiciário também está em pauta, com a PGR denunciando o deputado Gustavo Gayer e 24 outras pessoas por suposto desvio de verba parlamentar. O STF divergiu do TST em uma ação trabalhista, exigindo o valor exato da causa. Além disso, o caso Van Hattem aumentou a tensão entre o bolsonarismo e o STF, enquanto o Senado aprovou um projeto que reduz a quarentena para políticos assumirem cargos em estatais ou agências reguladoras, gerando debate sobre a transparência do governo Lula em questões de direitos humanos nas empresas.", "mundo": "Os líderes da União Europeia se prepararam para discussões difíceis sobre o orçamento e a Ucrânia durante a reunião do Conselho Europeu em Bruxelas. António Costa afirmou que o próximo orçamento plurianual é o item mais importante da pauta. Em outro desenvolvimento, o chefe do Comitê do Partido Comunista em Shanghai, Chen Jining, foi suspenso temporariamente para investigação devido a suspeitas de corrupção. Segundo a campanha antidesonestidade de ampla escala na China, um quarto membro do Politburo já foi derrubado antes de uma importante renovação de liderança no próximo ano. A Coreia do Sul obteve uma vitória final no caso ISDS apresentado pela família Dayyani do Irã, enquanto o nomeado para o cargo de Ministro da Unificação, Hong Ihk-pyo, prometeu uma abordagem pragmática nas relações com a Coreia do Norte. O Brasil criticou a recomendação norte-americana de novas tarifas sobre aeronaves e açúcar importados do Brasil, afirmando que não se submeterá a pressões para alterar regras relacionadas ao Pix. O governo brasileiro considera inaceitável o novo tarifaço proposto pelo governo dos Estados Unidos e ameaça retaliar com mais tarifas.\n\nA Coreia do Norte manteve sua postura nuclear firme, conforme declarado por Kim Jong-un, afirmando que a posse de armas nucleares é essencial para a soberania do país. Em contraste, a União Europeia enfrenta uma fase de instabilidade política, com protestos motivados por uma crise de acessibilidade e deterioração dos serviços públicos, ameaçando sua capacidade de agir. Na Ásia, o Japão protestou contra novas tarifas americanas e acusações de excesso de capacidade de produção, enquanto os Estados Unidos mantêm pressão sobre a China, com divergências entre funcionários sobre acusações de espionagem chinesa. Entre os incidentes regionais, a Arábia Saudita sofreu um ataque a uma de suas maiores refinarias de petróleo, levando a tensões geopolíticas, e a Coreia do Sul discute com a Rússia sobre a aproximação de aviões de combate russos. No contexto internacional, a conferência da ONU sobre o tratado de proibição nuclear oferece uma oportunidade para questionar o dogma da detergência nuclear, enquanto a Rússia e os Estados Unidos continuam a pressionar a Ucrânia para evitar ações que ampliem a guerra.", "economia": "A China reagiu com tarifas após uma investigação sobre possíveis subsídios desiguais dados a empresas locais por outros países, conforme relatado pelo Financial Times. Em outro desenvolvimento, o Banco da Reserva da Coreia (BOK) elevou a taxa-chave para 3,25% em resposta à inflação persistente e às fortes exportações de semicondutores. Isso levou a projeções de crescimento para 2026 e 2027 mais altas. A Petrobras planeja retirar 27 plataformas antigas de produção de petróleo do mar até 2031, um projeto que custará US$ 11,2 bilhões. Além disso, a Cosan está negociando a venda de participações minoritárias em três subsidiárias: Rumo, Compass e Moove, com o objetivo de reduzir sua dívida, conforme informado pela Reuters. O governo Trump propõe novas tarifas sobre 14 economias, incluindo a China e a União Europeia, em uma medida que visa combater o 'excesso de capacidade', segundo relatos do Financial Times.", "tecnologia": "No cenário da indústria tecnológica, uma notícia chama a atenção: Elon Musk prometeu doar duas ações da SpaceX para cada criança nos Estados Unidos, avaliadas em 18 bilhões de dólares, com o objetivo de beneficiar o futuro do país. Este anúncio segue outros movimentos da empresa, como a doação de uma ação de capital classificado A da SpaceX para cada conta ativa do Trump Account, com Musk igualando a doação. Além disso, a Nvidia enfrenta restrições de exportação dos Estados Unidos que podem afetar suas entregas de chips para a Ásia Oriental, especialmente para a China, que depende fortemente de tecnologia de inteligência artificial. Paralelamente, a China busca liderar no desenvolvimento de interfaces cerebro-computador (ICC), enquanto empresas como a Neuralink se aproximam do mercado com seus dispositivos implantáveis. No Brasil, a Avra, uma startup que desenvolveu um modelo de inteligência artificial para decisões de crédito, levantou 6 milhões de dólares para expandir suas operações, enquanto a Samsung reorganizou suas unidades de memória e LSI de sistemas com o objetivo de melhorar a competitividade de seus processadores de inteligência artificial.", "ciencia": "Um estudo liderado por pesquisadores da Universidade de Tóquio descobriu pela primeira vez que algumas proteínas Cas12m podem cortar DNA, esclarecendo as diferenças estruturais entre as variáveis ativas e inativas. A missão espacial Hera da Agência Espacial Europeia divulgou imagens próximas do asteroide Dimorphos, quatro anos após a NASA colidir propositalmente um módulo nele. Segundo o estudo, o vírus Ebola é mais letal para humanos devido a agregados que formam dentro das células dos hospedeiros, enquanto a resistência bacteriana está se espalhando mesmo para os medicamentos de último recurso, alerta a OMS. Além disso, devido ao aquecimento global, o Reino Unido poderia se tornar um habitat mais agradável para peregrinos-falcões, e a Austrália está em negociações para enviar a primeira astronauta australiana oficialmente financiada para uma missão espacial futura.", "cultura": "Arqueólogos descobriram vestígios da civilização ptolemaica sob a nova Alexandria, no Egito, sugerindo a possibilidade de ter encontrado a tumba de Alexandre, o Grande. Este achado histórico, que poderia mudar a compreensão da história antiga, foi relatado pela La Nación. Em outro desenvolvimento cultural, a cidade de Leonida no Grand Theft Auto VI oferece alternativas a personagens envolvidos em atividades criminosas, incluindo trilhas de montanha e oportunidades de observação de aves. A exposição 'Soulbreaker Codex', um livro de arte conceitual futurista, foi projetado para refletir a estética da PC Music. Além disso, o documentário 'An Eye for an Eye', sobre uma mulher ameaçada de execução no Irã, explora temas de justiça retributiva. A cantora Sandra Sá comemorou o primeiro ano do Teatro Baccarelli em Heliópolis, São Paulo, com uma celebração musical, enquanto o cantor Andrey Mira estreou na ópera 'Os Pescadores de Pérolas' no Theatro Municipal de São Paulo após se recuperar da Covid-19.", "sociedade": "A expectativa de vida em Cuba diminuiu pela primeira vez em quase 80 anos, segundo a Organização Mundial da Saúde, devido a uma contração econômica sem precedentes durante o embargo petrolífero imposto pelo governo Trump. A situação de saúde na ilha enfrenta desafios significativos devido à crise econômica. No Brasil, o Dia Internacional de Eliminação da Violência contra a Mulher foi marcado por um femicídio no Chile e por uma investigação de agressão sexual contra a mãe da vítima. Além disso, um suspeito de ter cometido um femicídio está sendo buscado. No âmbito social, um estudo revelou que a operação Escudo e Verão na Baixada Santista teve um impacto duradouro na saúde mental da população local, causando medo constante, insônia e ansiedade. Em Goiás, um empresário é suspeito de ter atirado em um cachorro e fugido da polícia em uma denúncia de trabalho análogo a escravidão. No Chile, o processo de mudança demográfica é questionado, enquanto no Japão, pessoas trabalham após os 100 anos, motivadas pela necessidade econômica e pelo conceito de ikigai. Ainda no Japão, cafeterias comunitárias para crianças atingiram um recorde de 13.800, e jovens sul-coreanos estão consumindo álcool em doses altas, especialmente entre as meninas.", "meio_ambiente": "O meio ambiente enfrenta diversos desafios em diferentes partes do mundo. A COP31, que terminou em um 'fracasso' devido a impasses entre grandes potências e bloqueios em temas centrais, reforçou a urgência de ações climáticas. A Amazônia foi transformada em uma fonte de emissões de carbono, devido ao desmatamento e aos incêndios, acentuados pela crise climática. Em seguida, a Indonésia enfrenta uma série de desastres ambientais, incluindo inundações em minas ilegais que já resultaram em pelo menos 13 mortes e 26 trabalhadores presos. Finalmente, o Brasil lida com um surto de mpox, que aumentou 40% neste ano, e enfrenta riscos de doenças infecciosas devido ao El Niño, com chuvas intensas e calor.", "direitos_humanos": "O Brasil lidera o ranking de feminicídios na América Latina e Caribe, com 1.453 casos em um ano, de acordo com um relatório da CNN Brasil. Em outro desenvolvimento, a ONG Repórteres Sem Fronteiras alertou que as novas leis de defesa no Reino Unido podem ter 'significativas' implicações para os direitos humanos, destacando a falta de garantias de acesso a água potável e condições humanas para detidos. Além disso, a Arábia Saudita intensificou a repressão a dissidentes, com mais de 200 execuções e aplicações de chibatadas, conforme relatório da DW Brasil. No Nepal, o governo iniciou o processo legal para declarar mortos milhares de pessoas desaparecidas após as inundações de verão, enquanto a UNICEF apelou para apoio urgente para ajudar as crianças a enfrentarem o inverno. Em outro caso, a ONU denunciou que a China está usando indevidamente o sistema Interpol para perseguir dissidentes, e a Rússia mantinha em segredo o número de mortes de soldados durante a guerra na Ucrânia, com relatos indicando que 720 soldados morriam por dia em um momento."}, "resumo_do_dia": {"politica_nacional": [{"id": 288167, "titulo": "Relatório da PF sobre Nunes Marques inclui episódios conhecidos do ministro", "url": "https://www.metropoles.com/brasil/relatorio-da-pf-sobre-nunes-marques", "fonte_id": "metropoles", "data_pub": "2026-11-26T09:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relatório da Polícia Federal sobre Nunes Marques abrange episódios conhecidos do ministro, diferentemente dos relatórios sobre Dias Toffoli e Alexandre de Moraes, em que alguns episódios não foram incluídos.", "titulo_pt": "Relatório da PF sobre Nunes Marques inclui episódios conhecidos do ministro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 288168, "titulo": "Grupo Fictor é alvo da polícia de SP; Justiça manda bloquear R$ 4,3 bilhões", "url": "https://www.metropoles.com/sao-paulo/grupo-fictor-e-alvo-de-operacao-da-policia-de-sp-contra-fraude-financeira", "fonte_id": "metropoles", "data_pub": "2026-11-26T09:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça determinou o bloqueio de R$ 4,3 bilhões no grupo Fictor, que anunciou a intenção de comprar o Banco Master em novembro de 2025.", "titulo_pt": "Grupo Fictor é alvo da polícia de SP; Justiça bloqueia R$ 4,3 bilhões", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 288151, "titulo": "Lula avança em conversas e quer fazer primeira escalações para Esplanada até semana que vem", "url": "https://veja.abril.com.br/politica/lula-avanca-em-conversas-e-quer-fazer-primeira-escalacoes-para-esplanada-ate-semana-que-vem/", "fonte_id": "veja", "data_pub": "2026-11-26T09:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula está avançando nas conversas para formar seu governo e pretende nomear os primeiros ministros para o comando da Casa Civil até a próxima semana. Camilo Santana é o principal nome cotado para este cargo.", "titulo_pt": "Lula avança em conversas e quer nomear primeiro ministros para Esplanada até semana que vem", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 288104, "titulo": "Entidades veem falta de transparência do governo Lula em ação sobre direitos humanos nas empresas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/entidades-veem-falta-de-transparencia-do-governo-lula-em-acao-sobre-direitos-humanos-nas-empresas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-26T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Aliança pelos Direitos Humanos em Cadeias Produtivas, formada por 18 ONGs e entidades de defesa do trabalho, criticou a falta de transparência do governo Lula na elaboração da Política de Direitos Humanos e Empresas.", "titulo_pt": "Entidades reclamam falta de transparência do governo Lula na política de direitos humanos nas empresas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 288181, "titulo": "Caso Van Hattem volta a elevar tensão entre bolsonarismo e o STF", "url": "https://www.metropoles.com/brasil/caso-van-hattem-volta-a-elevar-tensao-entre-bolsonarismo-e-o-stf", "fonte_id": "metropoles", "data_pub": "2026-11-26T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado Marcel van Hattem pode ser processado por supostos ataques a um delegado da Polícia Federal. A situação gerou reação do presidente do Senado, Davi Alcolumbre.", "titulo_pt": "Caso Van Hattem aumenta tensão entre bolsonarismo e STF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 288183, "titulo": "Centrão confirma \"janela de oportunidade\" para PEC do ajuste fiscal", "url": "https://www.metropoles.com/brasil/centrao-confirma-janela-de-oportunidade-para-pec-do-ajuste-fiscal", "fonte_id": "metropoles", "data_pub": "2026-11-26T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Centrão confirmou a existência de uma 'janela de oportunidade' para a aprovação da Proposta de Emenda à Constituição (PEC) do ajuste fiscal. Após a aprovação do primeiro pacote de medidas, aliados do ministro Motta defendem novas ações para controlar os gastos. O governo ainda analisa a proposta.", "titulo_pt": "Centrão confirma 'janela de oportunidade' para PEC do ajuste fiscal", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 288220, "titulo": "Sem apoio a Hugo, ala pragmática do PL teme risco de isolamento na Câmara", "url": "https://www.cnnbrasil.com.br/politica/sem-apoio-a-hugo-ala-pragmatica-do-pl-teme-risco-de-isolamento-na-camara/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-26T07:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ala pragmática do Partido Liberal (PL) teme ser isolada na Câmara caso não apoie a recondução do atual presidente da Casa. A maioria bolsonarista se opõe a compor com Hugo, o atual presidente, e a decisão pode afetar os espaços em cargos e comandos de comissões.", "titulo_pt": "Sem apoio a Hugo, ala pragmática do PL teme risco de isolamento na Câmara", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 288278, "titulo": "Judiciário: reformar sem domesticar", "url": "https://www.jota.info/opiniao-e-analise/artigos/judiciario-reformar-sem-domesticar", "fonte_id": "jota", "data_pub": "2026-11-26T07:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto sugere que mandatos e indicações múltiplas podem renovar o STF (Supremo Tribunal Federal) sem afetar a independência da corte.", "titulo_pt": "Judiciário: reformar sem comprometer a independência", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 288227, "titulo": "Aliados derrotados nas eleições buscam espaço no novo governo Lula", "url": "https://www.cnnbrasil.com.br/politica/aliados-derrotados-nas-eleicoes-buscam-espaco-no-novo-governo-lula/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-26T06:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados que perderam nas eleições buscam influência no governo de Luiz Inácio Lula da Silva. O presidente é pressionado a oferecer cargos ou posições de poder a aqueles que apoiaram sua campanha.", "titulo_pt": "Aliados derrotados nas eleições buscam espaço no novo governo Lula", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 288257, "titulo": "Senado quer políticos nas estatais e agências reguladoras. Chamem a polícia", "url": "https://braziljournal.com/senado-quer-politicos-nas-estatais-e-agencias-reguladoras-chamem-a-policia", "fonte_id": "brazil_journal", "data_pub": "2026-11-26T03:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado aprovou com urgência um projeto que reduz a quarentena de 30 dias para que políticos possam assumir cargos em estatais ou agências reguladoras. O texto foi aprovado em apenas dois dias, semelhante à velocidade com que os parlamentares costumam agir em benefício próprio.", "titulo_pt": "Senado quer políticos em estatais e agências reguladoras e agilizou a aprovação", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 288105, "titulo": "Ala de Valdemar admite que PL deve romper com Hugo Motta e teme 'anos de seca' na Câmara", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/ala-de-valdemar-admite-que-pl-deve-romper-com-hugo-motta-e-teme-anos-de-seca-na-camara.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-26T03:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ala do PL ligada a Valdemar Costa Neto admite que o partido deve romper com Hugo Motta, presidente da Câmara. Eles prevêem 'anos de seca' mesmo com a maior bancada da Casa, após perderem o cabo de guerra contra o setor pró-Nikolas Ferreira.", "titulo_pt": "Ala do PL admite rompimento com Hugo Motta e preve 'anos de seca'", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 288106, "titulo": "Sem Haddad, Camilo Santana ganha força para assumir Casa Civil de Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/sem-haddad-camilo-santana-ganha-forca-para-assumir-casa-civil-de-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-26T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Camilo Santana (PT-CE) ganhou força para liderar a Casa Civil após Fernando Haddad (PT) indicar que não assumirá um cargo no governo, informaram aliados de Lula (PT).", "titulo_pt": "Sem Haddad, Camilo Santana ganha força para assumir Casa Civil de Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 288107, "titulo": "A esquerda vê racismo em tudo, até no arroz por cima do feijão, diz Rafael Satiê, deputado eleito pelo PL", "url": "https://redir.folha.com.br/redir/online/poder : "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 288550, "titulo": "Wreckage and burnt vehicles as fuel tanker fire kills 31 on Cairo highway", "url": "https://www.euronews.com/video/2026/11/26/wreckage-and-burnt-vehicles-as-fuel-tanker-fire-kills-31-on-cairo-highway", "fonte_id": "euronews", "data_pub": "2026-11-26T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio causado por um acidente envolvendo um caminhão tanque de combustível na Rodovia Anel de Giza, em Waraq, resultou em pelo menos 31 mortos e 21 feridos. O incidente destaca os perigos das estradas no Egito.", "titulo_pt": "Incêndio de caminhão-tanque mata 31 e deixa 21 feridos na rodovia de Cairo", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 288584, "titulo": "Explosion rocks Bangkok oil depot", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/26/explosion-rocks-bangkok-oil-depot?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-26T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma grande explosão em um depósito de óleo em Bangkok lançou chamas e fumaça para o céu.", "titulo_pt": "Explosão atinge depósito de óleo em Bangkok", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 288143, "titulo": "Status nuclear da Coreia do Norte é “inviolável”, diz Kim Jong-un", "url": "https://www.poder360.com.br/poder-internacional/status-nuclear-da-coreia-do-norte-e-inviolavel-diz-kim-jong-un/", "fonte_id": "poder360", "data_pub": "2026-11-26T09:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Kim Jong-un afirmou que o status nuclear da Coreia do Norte é inviolável e que a posse de armas nucleares representa a defesa da soberania do país, descartando a possibilidade de desnuclearização.", "titulo_pt": "Status nuclear da Coreia do Norte é ‘inviolável’, diz Kim Jong-un", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 288298, "titulo": "Javier Milei nt-research/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-26T09:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em um evento em Zagreb, BIRN lançou a pesquisa croata para seu banco de dados Bitter Land sobre massacres de guerra, enquanto a ONG Documenta apresentou seu novo Livro do Recordatório croata.", "titulo_pt": "Vítimas da guerra e massacres documentados por novas pesquisas independentes", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 288671, "titulo": "Shanghai party chief’s downfall shows reach of anti-corruption drive", "url": "https://www.scmp.com/plus/news/china/politics/article/3375916/shanghai-party-chiefs-downfall-shows-reach-anti-corruption-drive", "fonte_id": "scmp", "data_pub": "2026-11-26T09:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe do Comitê do Partido Comunista em Shanghai, Chen Jining, foi colocado sob investigação por corrupção, conforme a campanha antidesonestidade de ampla escala na China derrubou um quarto membro do Politburo antes de uma importante renovação de liderança no próximo ano. A Central Commission for Discipline Inspection e o National Commission of Supervision estão investigando o caso.", "titulo_pt": "Decadência do chefe do partido de shanghai mostra alcance da campanha antidesonestidade", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 288116, "titulo": "França tem novo dia de mobilização com estudantes, professores e policiais nas ruas", "url": "https://www.cartacapital.com.br/mundo/franca-tem-novo-dia-de-mobilizacao-com-estudantes-professores-e-policiais-nas-ruas/", "fonte_id": "cartacapital", "data_pub": "2026-11-26T09:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Houve uma nova mobilização na França com a participação de estudantes, professores e policiais. As forças policiais reclamam de falta de reconhecimento do governo durante a onda de protestos recentes.", "titulo_pt": "França tem novo dia de mobilização com estudantes, professores e policiais nas ruas", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 288435, "titulo": "Details of two treaties at heart of Andy Burnham’s EU reset to be published", "url": "https://www.theguardian.com/politics/2026/nov/26/treaties-andy-burnham-eu-reset-published", "fonte_id": "guardian_world", "data_pub": "2026-11-26T09:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Detalhes de dois tratados cruciais para o plano de Andy Burnham de redefinir as relações do Reino Unido com a UE serão publicados na quinta-feira, junto com a lei que implementará essas mudanças no direito britânico. Os tratados incluem uma cláusula de término de 10 anos, que prevê que, se um dos lados encerrar o acordo, terá que pagar para reconstruir as instalações de verificação de fronteiras.", "titulo_pt": "Detalhes dos dois tratados centrais do plano de Andy Burnham para redefinir as relações com a ue serão publicados", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 288464, "titulo": "How Europe Comes Apart", "url": "https://www.foreignaffairs.com/europe/elections-how-europe-comes-apart-mujtaba-rahman", "fonte_id": "foreign_affairs", "data_pub": "2026-11-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Europeia está enfrentando uma fase de instabilidade política que poderia ameaçar seu futuro, não através da dissolução formal, mas pelo gradual enfraquecimento de sua capacidade de agir. Nos últimos meses, a Europa tem sido abalada por protestos motivados por uma crise comum de acessibilidade, serviços públicos em deterioração e confiança diminuída nos governos para melhorar os padrões de vida, especialmente para jovens.", "titulo_pt": "Como a Europa se divide", "veiculo": "Foreign Affairs", "pais": "EUA", "classe": "A"}, {"id": 288585, "titulo": "Israeli attacks on Gaza kill senior education official, seven other people", veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 288080, "titulo": "INSS libera 13º a 2,6 mi de segurados em novembro e dezembro; veja quem recebe", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/inss-libera-13o-a-26-mi-de-segurados-em-novembro-e-dezembro-veja-quem-recebe.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-26T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O INSS liberou o 13º salário a 2,6 milhões de aposentados e pensionistas em novembro e dezembro. Os pagamentos começaram na terça-feira (24) para quem recebeu o benefício a partir de maio deste ano.", "titulo_pt": "INSS libera 13º a 2,6 milhões de segurados em novembro e dezembro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 288083, "titulo": "Petrobras prevê retirar do mar 27 plataformas de petróleo até 2031; custo é de US$ 11,2 bi", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/petrobras-preve-retirar-do-mar-27-plataformas-de-petroleo-ate-2031-custo-e-de-us-112-bi.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-26T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petrobras planeja retirar 27 plataformas antigas de produção de petróleo do mar até 2031, um aumento de 50% em comparação com o plano anterior. O custo estimado dessa operação é de US$ 11,2 bilhões.", "titulo_pt": "Petrobras planeja retirar 27 plataformas antigas de produção de petróleo até 2031; custo previsto é de US$ 11,2 bi", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 288086, "titulo": "Cosan negocia reduzir participação na Rumo, Compass e Moove, diz agência", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/cosan-negocia-reduzir-participacao-na-rumo-compass-e-moove-diz-agencia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-26T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Cosan está negociando a venda de participações minoritárias em três subsidiárias: Rumo, Compass e Moove, com o objetivo de reduzir sua dívida, segundo informações fornecidas por três fontes à agência Reuters.", "titulo_pt": "Cosan negocia vender participações em Rumo, Compass e Moove para reduzir dívida", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 288279, "titulo": "O seguro que pode tirar obras do abandono", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-seguro-que-pode-tirar-obras-do-abandono", "fonte_id": "jota", "data_pub": "2026-11-26T06:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A regulamentação da cláusula de retomada pode aproximar a função do seguro garantia da entrega efetiva de infraestrutura.", "titulo_pt": "Seguro que pode evitar obras abandonadas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 288787, "titulo": "China scales, Japan supplies, Korea builds — three AI playbooks behind a 60%-plus grip on the global PCB market", "url": "https://www.digitimes.com/news/a20261125PD229/pcb-investment-demand-high-end-infrastructure.html", "fonte_id": "digitimes", "data_pub": "2026-11-26T06:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A crescente investimento global na infraestrutura de inteligência artificial está aumentando a demanda por placas de circuito impresso (PCB) de alta qualidade, substratos de IC e interconexões de alta velocidade, e as principais fabricantes asiáticas de PCB estão acelerando as mudanças em suas linhas de produtos e capacidade. De acordo com a Associação Taiwanês de Placas de Circuitos Impressos (TPCA), China, Japão e Coreia do Sul estão utilizando suas próprias forças industriais para construir cadeias de suprimento para fabricação de alta qualidade, materiais críticos e embalagens avançadas.", "titulo_pt": "China, Japão e Coreia dominam 60% ou mais do mercado global de pcbs com abordagens únicas", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 288716, "titulo": "BOK raises 2027 growth outlook to 4.1%, lifts key rate to 3.25%", "url": "https://www.koreaherald.com/article/10950549", "fonte_id": "korea_herald", "data_pub": "2026-11-26T06:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Banco da República da Coreia (BOK) elevou suas projeções de crescimento para 2026 e 2027, projetando expansão de 3,9% no ano que vem e 4,1% em 2027, devido a exportações sólidas de semicondutores e investimentos em infraestrutura de inteligência artificial. A taxa de juros-chave foi aumentada para 3,25% devido à inflação persistente e fortes exportações.", "titulo_pt": "BOK eleva projeções de crescimento para 2027 e aumenta taxa de juros para 3,25%", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 288280, "titulo": "Retenção previdenciária de 3,5% para optantes da CPRB até 2027", "url": "https://www.jota.info/opiniao-e-analise/artigos/retencao-previdenciaria-de-35-para-optantes-da-cprb-ate-2027", "fonte_id": "jota", "data_pub": "2026-11-26T05:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Superintendência de Controle e Fiscalização Tributária (SC Cosit) emitiu a Comunicação de Saneamento Contábil (SC Cosit) 219/2026, esclarecendo sobre a retenção previdenciária de 3,5% para contribuintes optantes pelo Regime Próprio de Previdência Social (RPPS) até 2027.", "titulo_pt": "Esclarecimento sobre retenção previdenciária de 3,5% para optantes da CPRB até 2027", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 288192, "titulo": "IPCA-15, PEC dos gastos e feriado nos EUA: o que move o mercado", "url": "https://exame.com/invest/mercados/ibovespa-hoje-26-11-2026/", "fonte_id": "exame", "data_pub": "2026-11-26T05:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A prévia da inflação IPCA-15 e as mudanças na política de gastos podem influenciar as apostas para a taxa Selic. O feriado de Ação de Graças nos Estados Unidos fechará as bolsas locais e reduzirá a liquidez no mercado.", "titulo_pt": "IPCA-15, PEC dos gastos e feriado nos EUA: o que move o mercado", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 288610, "titulo": "Huang’s return is a terrible signal for US capitalism", "url": "https://www.ft.com/content/cd688a72-04ed-40fb-9c26-5cae522a0abd", "fonte_id": "financial_times", "data_pub": "2026-11-26T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O retorno de Huang destaca a importância dos direitos dos acionistas, que agora estão em risco. O escândalo na Nvidia ilustra por que esses direitos são cruciais.", "titulo_pt": "Retorno de huang é um sinal ruim para a capitalismo dos EUA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 288729, "titulo": "42 state AGs are trying to stop Character.AI from selling users’ chats", "url": "https://www.theverge.com/policy/1042620/character-ai-sale-state-ags-block-selling-users-chats", "fonte_id": "the_verge", "data_pub": "2026-11-26T09:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo de 42 procuradores-gerais de estados estão tentando impedir que a Character.AI venda os dados dos usuários durante seus procedimentos de Chapter 11 de falência. Os procuradores acusam a empresa de planejar leiloar as conversas privadas de mais de 21 milhões de contas dos Estados Unidos.", "titulo_pt": "42 Procuradores-gerais de estados tentam impedir que Character.AI venda dados de usuários", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 288260, "titulo": "Avra faz rodada para escalar sua AI para PMEs", "url": "https://braziljournal.com/avra-faz-rodada-para-escalar-sua-ai-para-pmes", "fonte_id": "brazil_journal", "data_pub": "2026-11-26T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Avra, uma startup brasileira que desenvolveu um modelo de inteligência artificial para decisões de crédito, fraudes e aquisição de clientes, levantou US$ 6 milhões para financiar a evolução de sua tecnologia e esforços comerciais. A rodada foi liderada pelo fundo argentino NXTP e contou com a participação de investidores como ClockTower Ventures, Credit Saison, Vivo Ventures e Endeavor.", "titulo_pt": "Avra realiza rodada para escalar sua IA para PMEs", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 288774, "titulo": "General Catalyst backs 17-year-old Austrian's quant trading startup", "url": "https://tech.eu/2026/11/26/general-catalyst-backs-17-year-old-austrians-quant-trading-startup/", "fonte_id": "tech_eu", "data_pub": "2026-11-26T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um jovem austro-alemão de 17 anos, medalhista na Olimpíada Internacional de Matemática, levantou fundos pré-seed liderados por General Catalyst para sua startup de negócios de trading quantitativo, que visa competir com empresas como Jane Street e Cita.", "titulo_pt": "General Catalyst apóia startup de trading quantitativo de jovem austro-alemão de 17 anos", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 288670, "titulo": "Hong Kong exports post fastest growth in 70 years on AI-related goods", "url": "https://www.scmp.com/news/hong-kong/hong-kong-economy/article/3375917/hong-kong-exports-post-fastest-growth-70-years-ai-related-goods", "fonte_id": "scmp", "data_pub": "2026-11-26T09:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As exportações de Hong Kong registraram o maior crescimento anual em mais de 70 anos, com uma alta de 65,6% em outubro, impulsionadas por bens relacionados à inteligência artificial. O valor das exportações atingiu um recorde de HK$764,5 bilhões (US$98 bilhões) no mês, embora novas tarifas dos Estados Unidos possam afetar o futuro.", "titulo_pt": "Exportações de hong Kong registram maior crescimento anual em mais de 70 anos, impulsionadas por bens relacionados à inteligência artificial", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 288632, "titulo": "U.S. chip curbs and distillation crackdown to impact Chinese AI model progress", "url": "https://www.japantimes.co.jp/business/2026/11/26/companies/china-ai-development-hurdles/", "fonte_id": "japan_times", "data_pub": "2026-11-26T09:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ações americanas visam limitar o uso de seus modelos de chips para treinar outros, enquanto Washington estabelece novas regras para o acesso à potência de computação.", "titulo_pt": "Restrições de chips e repressão à destilação impactarão o progresso dos modelos de IA chineses", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 288775, "titulo": "Audun raises $3M to modernise debt collection with AI", "url": "https://tech.eu/2026/11/26/audun-raises-3m-to-modernise-debt-collection-with-ai/", "fonte_id": "tech_eu", "data_pub": "2026-11-26T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa norueguesa Audun, especializada em coleta de dívidas com inteligência artificial, levantou $3 milhões em financiamento de investidores como Alliance VC, Y Combinator, Robinhood Ventures, Skyfall, First Degree e investidores europeus e norte-americanos.", "titulo_pt": "Audun arrecada $3 milhões para modernizar coleta de dívidas com IA", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 288673, "titulo": "Huawei advances home-grown chip design ecosystem while eyeing global push to rival Nvidia", "url": "https://www.scmp.com/tech/big-tech/article/3375902/huawei-advances-home-grown-chip-design-ecosystem-while-eyeing-global-push-rival-nvidia", "fonte_id": "scmp", "data_pub": "2026-11-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Huawei e uma parceira local de software afirmaram ter feito avanços em ferramentas de design de chips nacionais, baseadas na Lei de Escalabilidade Tau da empresa. Isso representa mais um esforço para desenvolver uma cadeia de suprimentos de semicondutores auto-suficiente na China.", "titulo_pt": "Huawei avança no ecossistema de design de chips domésticos enquanto mira em empurrão global para rivalizar com a Nvidia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 288615, "titulo": "Global stocks steady after volatile US trading over AI risks", "url": "https://www.ft.com/content/6e217409-9fbb-456c-b405-2eb15bb69679?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-26T08:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ações tecnológicas foram afetadas este mês devido às preocupações sobre a sustentabilidade de um boom na inteligência artificial. O mercado de ações global se estabilizou após uma sessão volátil nos EUA relacionada aos riscos de AI.", "titulo_pt": "Ações globais se estabilizam após sessão volátil nos EUA sobre riscos de AI", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 288680, "titulo": "Carmakers look to strengthen China’s electric mobility lead at Guangzhou auto show", "url": "https://www.scmp.com/business/china-business/article/3375841/carmakers-look-strengthen-chinas-electric-mobility-lead-guangzhou-auto-show", "fonte_id": "scmp", "data_pub": "2026-11-26T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fabricantes de carros chineses, enfrentando vendas fracas no mercado interno, exibirão tecnologias de veículos elétricos durante a Guangzhou International Automobile Exhibition, buscando liderar a transição verde do setor automotivo global. Várias montadoras, incluindo a BYD, maior fabricante de carros do país, e a Nio, construtora de carros elétricos premium, participarão para promover suas tecnologias e expandir suas vendas internacionais.", "titulo_pt": "Fabricantes de carros chineses buscam liderar transição verde no automóvel global na feira de Guangzhou", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 288704, "titulo": "Global Innovation Center seeks to turn carbon cuts into farm income", "url": "https://www.koreaherald.com/article/10950846", "fonte_id": "korea_herald", "data_pub": "2026-11-26T07:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Centro de Inovação Global, uma entidade internacional de cooperação em ciência e tecnologia, lançou um comitê agrícola na Coreia do Sul com o objetivo de transformar a redução de carbono em uma nova fonte de renda para os agricultores, ao mesmo tempo em que aborda preocupações relacionadas ao clima e à segurança alimentar. O comitê, fundado na Divisão de Meio Ambiente e Energia do GIC, realizou sua cerimônia de lançamento na Namseoul University, em Cheonan, província de Chungcheong do Sul, reunindo governantes e pesquisadores.", "titulo_pt": "Centro de inovação global busca transformar cortes de carbono em renda agrícola", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 288742, "titulo": "Samsung reorganizes memory, system LSI units to boost AI chip competitiveness", "url": "https://en.yna.co.kr/view/AEN20261126010000320", "fonte_id": "yonhap_news", "data_pub": "2026-11-26T07:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Samsung reorganizou suas unidades de memória e LSI de sistemas com o objetivo de melhorar a competitividade de seus processadores de inteligência artificial. A ação ocorreu em Seul no dia 26 de novembro.", "titulo_pt": "Samsung reorganiza unidades de memória e LSI de sistemas para aumentar competitividade de chips de IA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 288222, "titulo": "Queda nas ações de tecnologia continua, impulsionada por temores com IA", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/queda-nas-acoes-de-tecnologia-continua-impulsionada-por-temores-com-ia/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-26T07:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A queda nas ações das empresas de tecnologia continua, apesar da reintegração temporária de Jensen Huang como CEO, que causou uma alta momentânea. Os temores sobre os retornos financeiros das empresas de inteligência artificial prevaleceram nesse cenário.", "titulo_pt": "Queda nas ações de tecnologia persiste, com temores sobre IA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 288082, "titulo": "Projeto usa IA para analisar carne, soja e madeira e facilitar fiscalização de exigências internacionais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/11/projeto-usa-ia-para-analisar-carne-soja-e-madeira-e-facilitar-fiscalizacao-de-exigencias-internacionais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-26T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Commodities brasileiras, como carne, soja e madeira, enfrentam crescentes exigências para acessar mercados internacionais, especialmente a União Europeia, que começará a restringir a entrada de itens sem garantia de origem e conformidade ambiental a partir de 30 de dezembro.", "titulo_pt": "Projeto usa IA para analisar carne, soja e madeira e facilitar fiscalização de exigências internacionais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 288683, "titulo": "China pushes brain-computer interface breakthroughs as Neuralink advances towards market", "url": "https://www.scmp.com/business/china-business/article/3375858/china-pushes-brain-computer-interface-breakthroughs-neuralink-advances-towards-market", "fonte_id": "scmp", "data_pub": "2026-11-26T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas chinesas estão competindo para alcançar avanços em interfaces cerebro-computador (ICC) enquanto a Neuralink, empresa de Elon Musk, se aproxima do mercado com seus dispositivos implantáveis. Beijing busca liderar nos EUA estabelecendo padrões e ampliando aplicações reais, vendo a ICC como uma indústria estratégica.", "titulo_pt": "China busca avanços em interfaces cerebro-computador enquanto Neuralink se aproxima do mercado", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 288562, "titulo": "SpaceX, Musk pledge to donate a share each to active Trump Accounts", "url": "https://www.cnbc.com/2026/11/25/spacex-musk-trump-account-stock.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-26T06:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX anunciou que doará uma ação da companhia de seu capital classificado A para cada conta ativa do Trump Account, e o CEO Elon Musk irá igualar essa doação.", "titulo_pt": "Spacex e Musk prometem doar uma ação cada para contas ativas do Trump account", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 288229, "titulo": "Elon Musk promete duas ações da SpaceX para cada criança nos EUA", "url": "https://www.cnnbrasil.com.br/economia/money/tecnologia/elon-musk-promete-duas-acoes-da-spacex-para-cada-crianca-nos-eua-entenda/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-26T06:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Elon Musk prometeu doar US$ 18 bilhões, dividindo o valor entre as ações da SpaceX e sua própria participação. Cada criança nos Estados Unidos receberá duas ações da empresa.", "titulo_pt": "Elon Musk promete duas ações da SpaceX para cada criança nos EUA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 288755, "titulo": "Some miniature Cas12m proteins can cut DNA after all", "url": "https://phys.org/news/2026-11-miniature-cas12m-proteins-dna.html", "fonte_id": "phys_org", "data_pub": "2026-11-26T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo de pesquisa internacional, liderado por Hayato Morinaga, Satoshi N. Omura e Osamu Nureki da Universidade de Tóquio, demonstrou pela primeira vez que algumas proteínas Cas12m têm um estado ativo capaz de cortar DNA. A equipe também esclareceu as diferenças estruturais entre as variáveis ativas e inativas.", "titulo_pt": "Algumas proteínas Cas12m podem cortar DNA, afinal", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 288553, "titulo": "New images show stadium-sized crater on asteroid NASA crashed into", "url": "https://www.euronews.com/2026/11/26/new-images-show-stadium-sized-crater-on-asteroid-nasa-crashed-into", "fonte_id": "euronews", "data_pub": "2026-11-26T09:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A espaçonave Hera da Europa divulgou suas primeiras imagens próximas do asteroide Dimorphos, quatro anos após a NASA colidir propositalmente um módulo nele.", "titulo_pt": "Novas imagens mostram cratera do tamanho de um estádio em asteroide atingido pela NASA", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 288344, "titulo": "Investigador chileno está creando una “píldora de ejercicio” para pacientes que no pueden entrenar", "url": "https://www.latercera.com/tendencias/noticia/investigador-chileno-esta-creando-una-pildora-de-ejercicio-para-pacientes-que-no-pueden-entrenar/", "fonte_id": "la_tercera", "data_pub": "2026-11-26T09:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um acadêmico chileno está investigando o uso de moléculas produzidas pelos músculos com o objetivo de proteger o fígado e desenvolver um medicamento para pacientes que não podem se exercitar devido a problemas de saúde.", "titulo_pt": "Investigador chileno desenvolve 'pílula de exercício' para pacientes que não podem se exercitar", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 288346, "titulo": "La OMS asegura que los antibióticos están dejando de funcionar contra infecciones comunes", "url": "https://www.latercera.com/tendencias/noticia/la-oms-asegura-que-los-antibioticos-estan-dejando-de-funcionar-contra-infecciones-comunes/", "fonte_id": "la_tercera", "data_pub": "2026-11-26T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A OMS alerta que os antibióticos estão perdendo sua eficácia contra infecções comuns, incluindo bactérias resistentes a medicamentos de última linha. A resistência bacteriana está se espalhando mesmo para os medicamentos considerados de último recurso.", "titulo_pt": "OMS avisa que antibióticos estão deixando de funcionar contra infecções comuns", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 288115, "titulo": "Estudo explica por que vírus Ebola é muito mais letal em pessoas", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/estudo-explica-por-que-virus-ebola-e-muito-mais-letal-em-pessoas.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-26T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vírus Ebola é altamente letal para humanos, matando cerca de 50% de suas vítimas, mas convive em paz com seus reservatórios naturais, os morcegos. A explicação para essa diferença pode estar nos agregados que o vírus forma dentro das células dos hospedeiros.", "titulo_pt": "Estudo explica por que vírus Ebola é muito mais letal em humanos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 288827, "titulo": "AI solved the hardest problem in maths – is there anything it can’t do?", "url": "https://www.newscientist.com/article/2600704-ai-solved-the-hardest-problem-in-maths-is-there-anything-it-cant-do/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ano passado viu a resolução de problemas matemáticos de longa data por inteligência artificial, demonstrando seu bom desempenho na área. No entanto, o colunista Jacob Aron sugere que isso não implica que a IA possa abordar áreas como biologia ou mudanças climáticas.", "titulo_pt": "A IA resolveu o problema mais difícil da matemática – há algo que ela não possa fazer?", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 288271, "titulo": "O que revelam imagens do asteroide atingido deliberadamente pela Nasa para testar defesas da Terra", "url": "https://www.bbc.com/portuguese/articles/cmx29v1ekq9qo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-26T08:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2022, a NASA enviou uma espaçonave para colidir com Dimorphos, um asteroide de 150 metros de diâmetro, como parte de um teste para preparar a defesa da Terra contra futuras ameaças de asteroides.", "titulo_pt": "O que revelam imagens do asteroide atingido deliberadamente pela Nasa para testar defesas da Terra", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 288756, "titulo": "Dragonflies feast on other insects during autumn migrations", "url": "https://phys.org/news/2026-11-dragonflies-feast-insects-autumn-migrations.html", "fonte_id": "phys_org", "data_pub": "2026-11-26T07:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dragonflies alimentam-se de uma variedade de insetos, incluindo outros dragões de fogo, durante suas migrações no outono. Estudos realizados no Passo de Bujaruelo, na Serra dos Pirineus, demonstraram esse comportamento alimentar durante as migrações de milhões de insetos por ano.", "titulo_pt": "Libélulas se alimentam durante migrações no outono", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 288225, "titulo": "Cometa que orbita próximo do Sol, em uma região vizinha da Terra, é descoberto por telescópio espacial europeu", "url": "https://www.cnnbrasil.com.br/ciencia/cometa-que-orbita-proximo-do-sol-em-uma-regiao-vizinha-da-terra-e-descoberto-por-telescopio-espacial-europeu/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-26T06:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um cometa chamado C/2026 S1 foi identificado por um software instalado no telescópio espacial Euclid. O objeto pode fornecer informações sobre a origem da água na Terra.", "titulo_pt": "Cometa que orbita próximo do Sol, em uma região vizinha da Terra, é descoberto por telescópio espacial europeu", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 288226, "titulo": "Planeta Vênus poderá ser visto a olho nu em todo o Brasil no fim de novembro", "url": "https://www.cnnbrasil.com.br/ciencia/planeta-venus-podera-ser-visto-a-olho-nu-em-todo-o-brasil-no-fim-de-novembro/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-26T06:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O planeta Vênus poderá ser visto a olho nu no céu da manhã antes do nascer do Sol em todo o Brasil no fim de novembro. É recomendado observar a direção leste, cerca de meia hora antes do nascer do dia.", "titulo_pt": "Vênus poderá ser visto a olho nu em todo o Brasil no fim de novembro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 288828, "titulo": "The defence tech revolution is changing how we innovate", "url": "https://www.newscientist.com/article/2599276-the-defence-tech-revolution-is-changing-how-we-innovate/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-26T06:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas de tecnologia militar estão pulando os programas tradicionais de aquisição para fornecer tecnologia de baixo custo e adaptável rapidamente. Especialistas afirmam que isso tem importantes implicações para inovadores, investidores e a sociedade em geral.", "titulo_pt": "A revolução na tecnologia de defesa está mudando como inovamos", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 288805, "titulo": "APOD: 2026 November 26 – Eye in the Sky: The Milky Way over Lençóis", "url": "https://science.nasa.gov/image-article/apod-2026-november-26-eye-in-the-sky-the-milky-way-over-lencois/", "fonte_id": "nasa_news", "data_pub": "2026-11-26T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia do APOD em 26 de novembro de 2026 mostra a Via Láctea sobre o Lençóis, Brasil. Este é um registro astronômico que destaca a visão do céu noturno da região.", "titulo_pt": "Olho no céu: a via láctea sobre Lençóis", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 288806, "titulo": "Seeking Refuge on Resolution Island", "url": "https://science.nasa.gov/earth/earth-observatory/seeking-refuge-on-resolution-island/", "fonte_id": "nasa_news", "data_pub": "2026-11-26T05:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nova Zelândia tem planejado usar a Ilha Resolution como um habitat livre de predadores para aves nativas, mas coelhos-pilhórios nadadores demonstraram uma determinação própria.", "titulo_pt": "Buscando refúgio na ilha Resolution", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 288757, "titulo": "World's fastest animal could nearly double its livable territory by 2080 in the UK due to climate change", "url": "https://phys.org/news/2026-11-world-fastest-animal-livable-territory.html", "fonte_id": "phys_org", "data_pub": "2026-11-26T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com um novo estudo, a área adequada para peregrinos-falcões no Reino Unido poderia aumentar em 74% até 2080, devido a aquecimento global e mudanças climáticas. Isso poderia tornar o Reino Unido um habitat mais agradável para o animal mais rápido do mundo.", "titulo_pt": "O animal mais rápido do mundo poderia quase dobrar seu território habitável no reino unido até 2080 devido ao aquecimento global", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 288758, "titulo": "Sending an Australian astronaut to space is expensive. How do we work out if it's worth it?", "url": "https://phys.org/news/2026-11-australian-astronaut-space-expensive-worth.html", "fonte_id": "phys_org", "data_pub": "2026-11-26T04:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Austrália está em negociações com a Agência Espacial Europeia (ESA) para possivelmente enviar Katherine Bennell-Pegg, diretora de tecnologia espacial da Agência Espacial Austrália e ex-aluna de treinamento da ESA, para uma missão espacial futura. Se aceita, ela se tornaria a primeira astronauta australiana oficialmente financiada.", "titulo_pt": "Levar uma astronauta australiana ao espaço custa caro. Como sabemos se vale a pena?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 288759, "titulo": "New eyes in the sky make timber harvesting and forest conservation easier and more efficient", "url": "https://phys.org/news/2026-11-eyes-sky-timber-harvesting-forest.html", "fonte_id": "phys_org", "data_pub": "2026-11-26T03:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dave Sandilands, piloto do University of Maine, realizou uma pesquisa aérea em áreas florestais de Maine, no norte e leste do estado, em nome da New England Forestry Foundation. Seus voos permitiram o monitoramento de áreas como a Pingree Easement, importante para ninhos de falcões-pretos, e outras regiões em Washington County.", "titulo_pt": "Novas perspectivas no céu simplificam a extração de madeira e a conservação florestal", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 288825, "titulo": "Lucy McRae creates replicant birth bags for Blade Runner 2099 show where \"violence and femininity coexist\"", "url": "https://www.dezeen.com/2026/11/26/lucy-mcrae-replicant-birth-bags-blade-runner-2099/", "fonte_id": "dezeen", "data_pub": "2026-11-26T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lucy McRae criou designs táteis e personalizados para a série de ficção científica Blade Runner 2099, desviando-se do aspecto tradicionalmente frio e metálico dos filmes. Estes designs são para sacos de parto de replicantes e refletem a coexistência de violência e feminilidade na série.", "titulo_pt": "Lucy McRae cria sacos de parto de replicantes para show de Blade Runner 2099", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 288296, "titulo": "Oculta bajo cinco millones de habitantes: habrían hallado la tumba de Alejandro Magno", "url": "https://www.lanacion.com.ar/ciencia/oculta-bajo-cinco-millones-de-habitantes-habrian-hallado-la-tumba-de-alejandro-magno-nid25112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-26T09:22:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Arqueólogos descobriram vestígios da civilização ptolemaica sob a nova Alexandria, que governou a região há milhares de anos. A tumba de Alejandro Magno poderia estar entre os achados.", "titulo_pt": "Oculta em meio a cinco milhões de habitantes: arqueólogos podem ter encontrado a tumba de Alejandro Magno", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 288813, "titulo": "Seven beautiful places to visit in GTA VI, from mountains trails to an afternoon at the zoo", "url": "https://www.theguardian.com/games/2026/nov/26/seven-beautiful-places-to-visit-in-gta-vi-from-mountains-trails-to-an-afternoon-at-the-zoo", "fonte_id": "guardian_culture", "data_pub": "2026-11-26T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cidade de Leonida oferece vários locais para se deslocar do crime e da violência, incluindo montanhas com trilhas para bicicleta e caminhada, além de oportunidades de caça. O Monte Kalaga é destacado como um local notável, onde se pode observar aves, como um águia, em vez de caçar cervos.", "titulo_pt": "Sete belos lugares para visitar em GTA VI, desde trilhas montanhosas até um dia no zoológico", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 288307, "titulo": "Raúl Becerra: de las cinco veces en que estuvo “a punto” de morir a La noticia rebelde y todas sus grandes creaciones", "url": "https://www.lanacion.com.ar/espectaculos/personajes/raul-becerra-de-las-cinco-veces-en-que-estuvo-a-punto-de-morir-a-semanario-insolito-la-noticia-nid26112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-26T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo fala sobre os programas que Raúl Becerra mais gostou e por que a televisão não é mais a mesma. Ele também menciona as cinco vezes em que Becerra esteve perto de morrer.", "titulo_pt": "Raúl Becerra: de suas cinco vezes próximas à morte aos programas que mais gostou e a evolução da televisão", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 288308, "titulo": "Almodóvar y la perfección del cincuenta por ciento", "url": "https://www.lanacion.com.ar/cultura/almodovar-y-la-perfeccion-del-cincuenta-por-ciento-nid26112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-26T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute o trabalho de Almodóvar e sua abordagem na perfeição do cincento por cento. Não há detalhes específicos sobre o conteúdo do artigo além do título e do subtítulo apresentados.", "titulo_pt": "Almodóvar e a perfeição do cinquenta por cento", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 288310, "titulo": "Puedes verlo todo: el documental que se filmó en secreto, recaudó millones de dólares y puede hacer historia en los Oscar", "url": "https://www.lanacion.com.ar/espectaculos/cine/puedes-verlo-todo-el-documental-que-se-filmo-en-secreto-recaudo-millones-de-dolares-y-puede-hacer-nid26112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-26T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um documentário foi lançado esta semana nas salas argentinas, mostrando os 34 dias antes da prisão de Elizabeth Holmes, fundadora da Theranos, por estelionato e fraude. O filme reuniu milhões de dólares em bilheteria.", "titulo_pt": "Você pode ver tudo: o documentário que foi filmado em segredo, arrecadou milhões e pode fazer história nos Oscar", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 288348, "titulo": "Del MTV de Los Bunkers al Nacional con El Macha: el salto del Cuarteto Austral, las cuerdas pop de la música chilena", "url": "https://www.latercera.com/culto/noticia/del-mtv-de-los-bunkers-al-nacional-con-el-macha-el-salto-del-cuarteto-austral-las-cuerdas-pop-de-la-musica-chilena/", "fonte_id": "la_tercera", "data_pub": "2026-11-26T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O quarteto de música de câmara composto por mulheres está prestes a comemorar 10 anos de carreira no Teatro CA660 da Fundação Corpartes. Antes disso, eles conversam com Culto sobre sua história e os intercâmbios únicos com a música popular que experimentaram.", "titulo_pt": "Do MTV dos Los Bunkers ao Nacional com o Macha: o salto do Cuarteto Austral, as cordas pop da música chilena", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 288846, "titulo": "This illustrated A.G. Cook book is a multi-media manual that embodies PC Music", "url": "https://www.itsnicethat.com/articles/jacob-hulmston-martin-uhrecky-the-soulbreaker-codex-graphic-design-publication-project-261126", "fonte_id": "its_nice_that", "data_pub": "2026-11-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Soulbreaker Codex não foi projetado para ser um antigo objeto, mas um artefato de um mundo futurista distante. O livro
