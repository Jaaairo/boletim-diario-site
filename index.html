<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>

</header>
<nav id="nav"></nav>
<main id="main"></main>

</div>

</div>

<script>
const D = {"gerado_em": "29/07/2026 09:34", "stats": {"noticias_novas": 755, "resumos_gerados": 242}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Na quarta-feira (29/7), pesquisas eleitorais continuam a mostrar movimentações importantes no cenário político brasileiro. Em Minas Gerais, Flávio Bolsonaro e Lula estão tecnicamente empatados com 40% das intenções de voto cada um para o segundo turno da eleição presidencial, conforme pesquisa divulgada pela Futura/Apex. No estado de São Paulo, Tarcísio de Freitas lidera com 41% das intenções de voto no primeiro turno contra Fernando Haddad, que tem 26%, segundo pesquisas da Quaest e Genial/Quaest. Na Bahia, Jaques Wagner, alvo de investigações por suspeita de corrupção, registra uma diminuição nas intenções de voto e um aumento na rejeição, enquanto ACM Neto e Jerônimo Rodrigues empatam tecnicamente no primeiro turno da disputa pelo governo. Além disso, pesquisas indicam que Marina Silva e Simone Tebet lideram a corrida para as duas vagas ao Senado em São Paulo com 14% e 12% das intenções de voto, respectivamente. No âmbito político-estatal, o governo do Paraná enfrenta uma investigação por contrato sem licitação com o Google, enquanto a AGU luta para acessar informações sobre honorários distribuídos às carreiras jurídicas do Executivo.", "mundo": "Os Estados Unidos e Arábia Saudita realizaram ataques aéreos conjuntos contra alvos militantes no Iraque, o que levou a uma escalada de tensões regionais. Após o incidente, os preços globais do petróleo subiram, refletindo preocupações com a estabilidade na região crítica do Oriente Médio. Em meio à crise energética global, os EUA e Irã retomaram hostilidades, com o Irã atacando forças americanas no Oriente Médio ontem. Além disso, Bill Gates planeja visitar a Coreia do Sul em breve, enquanto Jean-Pascal van Ypersele, climatologista belga, alerta sobre a urgência da ação climática diante das recentes ondas de calor na Europa.\n\nA situação geopolítica no Oriente Médio permanece instável com ataques e operações militares intensificadas. O Irã atacou bases americanas no região, enquanto o presidente americano Donald Trump se reuniu com o primeiro-ministro israelense Benjamin Netanyahu. Isso levou os Estados Unidos a interceptar um suposto ataque iraniano e realizar operações conjuntas com a Arábia Saudita contra milícias apoiadas pelo Irã no Iraque. Paralelamente, o Iraque ofereceu à Turquia 1 milhão de barris de petróleo por dia, em meio à retomada dos ataques entre EUA e Irã que elevaram o preço do petróleo acima dos US$ 87 por barril. Em outro desenvolvimento, a Ucrânia intensificou suas operações com drones contra o maior varejista online da Rússia, Wildberries, aumentando a pressão sobre a economia de guerra de Moscou.", "economia": "O mercado financeiro e econômico brasileiro e internacional registrou vários movimentos importantes recentemente. O Brasil enfrenta um desafio com a possível elevação dos impostos sobre serviços de água e esgoto, resultado da reforma tributária, o que pode impactar significativamente o setor de saneamento. Até agora, não há definição sobre o tamanho do aumento nas tarifas ou quando isso ocorrerá. No exterior, o índice FTSE 100 atingiu um novo recorde histórico no Reino Unido, enquanto o mercado asiático viu quedas expressivas em empresas relacionadas à inteligência artificial devido a resultados insatisfatórios da SK Hynix. Além disso, a Shein, uma empresa chinesa de moda online, está aguardando sua estreia na Bolsa de Valores de Hong Kong e pode intensificar a concorrência no varejo brasileiro. No Rio de Janeiro, o mercado de combustíveis se recompõe após a paralisação das atividades da Refit, com várias empresas ocupando o espaço deixado pela companhia.", "tecnologia": "A tecnologia continua avançando, com destaque para a inteligência artificial (IA). A Google lançou recentemente o agente de IA Gemini Spark no mercado de Hong Kong, removendo as geofences regionais para seus serviços de geração de IA. Por outro lado, a Apple está facilitando pagamentos mensais para seus produtos, mas críticos consideram isso 'financialização da crise de acessibilidade'. A empresa SK hynix negou que o boom de memórias para IA esteja chegando ao fim, citando contratos de suprimento a longo prazo com 10 clientes e uma demanda crescente além das memórias de alta largura de banda. A China está se organizando para fornecer substratos de vidro para o packaging de chips de IA, com a recente parceria entre a Intel e a Lens Technology no desenvolvimento de tecnologia through-glass via (TGV). Além disso, a maior fabricante de baterias para veículos elétricos do mundo está expandindo sua atuação em áreas como inteligência artificial, redes elétricas e navios. A empresa 1X apresentou um par de robôs altamente dextros que podem ser melhores do que humanos na preparação de refeições, seguido por uma carta aberta assinada por economistas renomados alertando sobre o risco de IA roubar empregos.", "ciencia": "A NASA divulgou imagens de um agujero negro errante que devorou uma estrela, um achado que pode revolucionar a busca por agujeres negros no universo. Paralelamente, a China planeja fortalecer sua versão do Muro Verde global e está investigando a possibilidade de reprodução humana em espaço, o que questiona a viabilidade da perpetuação da espécie fora da Terra. Além disso, os casos de covid-19 estão aumentando na China em julho, com o vírus voltando a ser um dos patógenos respiratórios mais comuns no país. Na área do avanço tecnológico, uma startup chinesa baseada em Beijing conseguiu arrecadar cerca de 14 milhões de dólares para construir uma constelação orbital de satélites destinados ao monitoramento de objetos espaciais, alinhando-se com a crescente indústria chinesa de consciência situacional espacial.", "cultura": "O cineasta João Moreira Salles estreou seu mais recente documentário, 'Minha Terra Estrangeira', no Festival Bonito Cinesur. Neste filme, ele convidou Louise Botkay e o Coletivo Lakapoy para seguir o líder indígena Almi, destacando a representatividade indígena que vai além de candidatos eleitos. Além disso, Dua Lipa será curadora do Festival de Literatura de Londres em 2026, entrevistando autores como Zadie Smith e Patti Smith no evento. Já o álbum 'My Skyscraper', lançado recentemente pelo músico Steven Hall aos 69 anos, é uma releitura que mistura diversos gêneros como disco, folk, synth-pop e ópera chinesa, sendo elogiado por críticos após seu relançamento em 2025.", "sociedade": "Em Goiás, três pessoas foram mortas a tiros dentro de uma fazenda em Goiatuba, levando à investigação das motivações dos assassinatos. Em Minas Gerais, um servidor do cemitério de Senhora dos Remédios é acusado de exigir R$ 500 via Pix para realizar sepultamentos, conforme denunciado pelo Ministério Público de Minas Gerais. Na Argentina, inspiradas pela 'Mãe da Pátria', mulheres negras reivindicam histórias e pautas importantes. Em um caso na Coreia do Sul, o Corpo de Guardas Costeiros permitiu que um membro acusado de assédio sexual retorne ao trabalho na mesma estação onde o subordinado trabalha, levando a discussões sobre mudanças legislativas. No Chile, autoridades discutem medidas para melhorar a proteção social, focando em nascimentos, velhice e emprego formal. Em Atacama e Coquimbo, milhares de pessoas permanecem isoladas há cerca de uma semana devido a um sistema frontal que mantém o país sob alerta com tornados, chuvas intensas e ventos fortes. Além disso, as regiões chilenas de Atacama e Magallanes estão sob alerta sanitária por hantavirus, com medidas preventivas contra influenza aviar e dengue válidas até julho de 2027.", "meio_ambiente": "As temperaturas atingiram marcas históricas no Sudeste do país durante uma onda de calor nacional, gerando preocupações ambientais e sociais. No exterior, o Parque Nacional Amboseli na Quênia está investigando a morte inesperada de 15 elefantes em um mês, suspeitando de substâncias tóxicas. Além disso, fortes ondas na Praia Seabright, Califórnia, levaram a um resgate de emergência.", "direitos_humanos": "Em 2025, foi registrado o ano com mais ataques antissemitas nos últimos décadas, com mais de 23.000 incidentes registrados em sete países, incluindo Austrália, Reino Unido e França. Paralelamente, duas livrarias independentes em Hong Kong foram revistadas pela polícia este mês após a suspeita de exibição e venda de materiais seditivos, levando à prisão de cinco pessoas. No Chile, Sergio Jadue foi absolvido no processo judicial por suposta violação, enquanto o Ministério das Obras Públicas anunciou uma investida de US$15 bilhões em projetos de infraestrutura pública. Em um contexto separado, famílias refugiadas do Sudão enfrentam a escassez de água e a perda de esperança de retornar às suas casas no acampamento de refugiados do Chade, lutando contra a fome e os crimes cometidos em seu país de origem."}, "resumo_do_dia": {"politica_nacional": [{"id": 78564, "titulo": "Genial/Quaest: governo Tarcísio é aprovado por 55% dos eleitores em SP", "url": "https://www.metropoles.com/sao-paulo/genial-quaest-governo-tarcisio-e-aprovado-por-55-dos-eleitores-em-sp", "fonte_id": "metropoles", "data_pub": "2026-07-29T10:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa divulgada nesta quarta-feira (29/7) indica que 55% dos eleitores de São Paulo aprovam o governo do governador Tarcísio.", "titulo_pt": "Governo Tarcísio é aprovado por 55% dos eleitores em SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 78528, "titulo": "O impacto do caso Master sobre as chances de reeleição de Jaques Wagner na Bahia", "url": "https://veja.abril.com.br/brasil/o-impacto-do-caso-master-sobre-as-chances-de-reeleicao-de-jaques-wagner-na-bahia/", "fonte_id": "veja", "data_pub": "2026-07-29T10:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Jaques Wagner, alvo de investigações da Polícia Federal por suspeita de receber propina do Vorcaro, registra diminuição nas intenções de voto e aumento na rejeição, conforme pesquisa Genial/Quaest.", "titulo_pt": "Impacto do caso Master reduz chances de reeleição de Jaques Wagner na Bahia", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 78491, "titulo": "Quaest na Bahia: 57% aprovam governo de Jerônimo Rodrigues, e 34% desaprovam", "url": "https://g1.globo.com/ba/bahia/eleicoes/2026/noticia/2026/07/29/quaest-bahia-avaliacao-governo-julho.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-29T10:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Quaest revelou que 57% dos eleitores da Bahia aprovam o governo de Jerônimo Rodrigues (PT), enquanto 34% desaprovam. O levantamento também indica que 37% avaliam o governo positivamente e 23% negativamente.", "titulo_pt": "57% Aprovam governo de Jerônimo Rodrigues na Bahia, segundo pesquisa quaest", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 78492, "titulo": "Quaest na Bahia: Lula tem 52%, e Flávio Bolsonaro, 18% das intenções de voto no estado", "url": "https://g1.globo.com/ba/bahia/eleicoes/2026/noticia/2026/07/29/quaest-bahia-presidente-julho.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-29T10:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest revelou que, na Bahia, Lula tem 52% das intenções de voto para a eleição presidencial, enquanto Flávio Bolsonaro tem 18%. O levantamento também incluiu cenários de segundo turno com outros candidatos.", "titulo_pt": "Lula lidera em pesquisa para presidente na Bahia, com 52%; Flávio Bolsonaro tem 18%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 78485, "titulo": "Genial/Quaest: ACM Neto e Jerônimo Rodrigues empatam na Bahia, com 39% e 38% no 1º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/genialquaest-acm-neto-e-jeronimo-rodrigues-empatam-na-bahia-com-39-e-38-no-1o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-29T10:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa divulgada pela Quaest indica que ACM Neto e Jerônimo Rodrigues estão empatados na Bahia, com 39% e 38% das intenções de voto respectivamente no primeiro turno da eleição para governador.", "titulo_pt": "ACM Neto e Jerônimo Rodrigues empatam na Bahia, com 39% e 38% no 1º turno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 78494, "titulo": "Quaest na Bahia: Rui Costa e Jaques Wagner aparecem à frente na disputa pelo Senado", "url": "https://g1.globo.com/ba/bahia/eleicoes/2026/noticia/2026/07/29/quaest-senado-bahia.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-29T10:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest revela que Rui Costa (PT) lidera a disputa pelo Senado na Bahia com 22% das intenções de voto, seguido por Jaques Wagner (PT) com 16%. O levantamento foi realizado entre os dias 23 e 27 de julho com 1.200 eleitores.", "titulo_pt": "Rui Costa e Jaques Wagner lideram disputa pelo Senado na Bahia, mostra pesquisa", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 78495, "titulo": "Quaest em São Paulo: Marina Silva e Simone Tebet lideram corrida para as duas vagas ao Senado no estado", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/07/29/quaest-sp-senado-julho.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-29T10:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest mostra que Marina Silva (Rede) e Simone Tebet (PSB) lideram a corrida para as duas vagas ao Senado em São Paulo, com 14% e 12% das intenções de voto, respectivamente. As eleições ocorrerão em outubro, juntamente com outras posições como governador e deputados.", "titulo_pt": "Quaest em São Paulo: marina Silva e Simone Tebet lideram corrida para duas vagas ao Senado", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 78496, "titulo": "Quaest em São Paulo: 55% aprovam governo de Tarcísio, e 29% desaprovam", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/07/29/quaest-sp-aprovacao-julho.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-29T10:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest indica que 55% dos eleitores de São Paulo aprovam o governo de Tarcísio de Freitas, enquanto 29% desaprovam. A aprovação do governador é de 41% no primeiro turno das eleições.", "titulo_pt": "Quaest em São Paulo: 55% aprovam governo de Tarcísio e 29% desaprovam", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 78497, "titulo": "Quaest na Bahia: ACM Neto e Jerônimo Rodrigues têm empate técnico na disputa para o governo da Bahia no 1º turno", "url": "https://g1.globo.com/ba/bahia/eleicoes/2026/noticia/2026/07/29/quaest-bahia-governador-julho.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-29T10:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest divulgada na quarta-feira (29) aponta empate técnico entre ACM Neto (União Brasil) e Jerônimo Rodrigues (PT) para o governo da Bahia no primeiro turno. Os dois candidatos têm 38% das intenções de voto cada, com Jerônimo sendo o atual governador e tentando a reeleição.", "titulo_pt": "ACM Neto e Jerônimo Rodrigues empatam técnico na disputa pelo governo da Bahia no 1º turno", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 78498, "titulo": "Quaest em São Paulo: Tarcísio tem 41%; Haddad, 26% no 1° turno", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/07/29/quaest-em-sao-paulo-tarcisio-tem-41percent-haddad-26percent-no-1-turno.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-29T10:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest indica que Tarcísio de Freitas lidera com 41% das intenções de voto no primeiro turno, seguido por Fernando Haddad com 26%. No cenário do segundo turno, Tarcísio tem 48%, contra 32% de Haddad.", "titulo_pt": "Quaest em São Paulo: tarcísio lidera com 41%; Haddad tem 26% no 1º turno", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 78486, "titulo": "Genial/Quaest: Tarcísio mantém vantagem em SP e tem 41% contra 26% de Haddad no 1º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/genialquaest-tarcisio-mantem-vantagem-em-sp-e-tem-41-contra-26-de-haddad-no-1o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-29T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador Tarcísio de Freitas (Republicanos) lidera uma nova pesquisa Genial/Quaest, com 41% das intenções de voto no primeiro turno contra Fernando Haddad (PT), que tem 26%.", "titulo_pt": "Tarcísio mantém vantagem em SP e tem 41% contra 26% de Haddad no 1º turno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 78509, "titulo": "Ministério Público investiga contrato sem licitação do governo do Paraná com o Google", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/07/ministerio-publico-investiga-contrato-sem-licitacao-do-governo-do-parana-com-o-google.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-29T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público do Paraná está investigando um contrato sem licitação entre o governo estadual e o Google, que foi usado como padrão tecnológico na administração pública. Os promotores questionam a decisão tomada pela Celepar, estatal de processamento de dados.", "titulo_pt": "Mp investiga contrato sem licitação do governo do Paraná com o Google", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 78532, "titulo": "O que mudou na briga Tarcísio x Haddad após desistência de dois rivais de direita, segundo a Quaest", "url": "https://veja.abril.com.br/brasil/o-que-mudou-na-briga-tarcisio-x-haddad-apos-desistencia-de-dois-rivais-de-direita-segundo-a-quaest/", "fonte_id": "veja", "data_pub": "2026-07-29T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A saída de Kataguiri e Serra da corrida presidencial deu um leve impulso ao governador Tarcísio, enquanto o ex-ministro Haddad permaneceu estagnado, segundo uma pesquisa publicada.", "titulo_pt": "O que mudou na briga Tarcísio x Haddad após desistência de dois rivais de direita", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [{"titulo": "Futura/Apex: Flávio bolsonaro e Lula empatam no segundo turno em MG; Zema venceria", "sumario": "Uma pesquisa divulgada nesta quarta-feira (29/7) indica que Flávio Bolsonaro e Lula estão empatados no segundo turno da eleição em Minas Gerais, dentro da margem de erro. Flávio Bolsonaro tem 40% das intenções de voto contra Lula, que tem 35%, no segundo turno da eleição em São Paulo. A pesquisa Quaest divulgada em São Paulo indica que Flávio Bolsonaro e Lula estão tecnicamente empatados com 34% e 30% das intenções de voto, respectivamente, no primeiro turno da eleição presidencial.", "artigos": [{"id": 78552, "titulo": "Futura/Apex: em MG, Lula e Flávio empatam no 2º turno; Zema venceria", "url": "https://www.metropoles.com/minas-gerais/futura-apex-em-mg-lula-e-flavio-empatam-no-2o-turno-zema-venceria", "fonte_id": "metropoles", "data_pub": "2026-07-29T11:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa divulgada nesta quarta-feira (29/7) indica que Flávio Bolsonaro e Lula estão empatados no segundo turno da eleição em Minas Gerais, dentro da margem de erro. Zema teria vencido a pesquisa.", "titulo_pt": "Futura/Apex: Flávio bolsonaro e Lula empatam no segundo turno em MG; Zema venceria", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 78608, "titulo": "Quaest em SP: Flávio tem 40% e Lula, 35% no 2º turno", "url": "https://www.cnnbrasil.com.br/eleicoes/quaest-em-sp-flavio-tem-40-e-lula-35-no-2o-turno/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T10:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro tem 40% das intenções de voto contra Lula, que tem 35%, no segundo turno da eleição em São Paulo. O presidente empata tecnicamente com Romeu Zema e Ronaldo Caiado.", "titulo_pt": "Quaest em SP: flávio tem 40% e Lula, 35% no 2º turno", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 78493, "titulo": "Quaest em São Paulo: Flávio Bolsonaro tem 34% e Lula 30% das intenções de voto no estado no 1° turno", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/07/29/quaest-sp-presidente-julho.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-29T10:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest divulgada em São Paulo indica que Flávio Bolsonaro e Lula estão tecnicamente empatados com 34% e 30% das intenções de voto, respectivamente, no primeiro turno da eleição presidencial. Renan Santos, Romeu Zema e Ronaldo Caiado também aparecem empatados com 3% dos votos cada um.", "titulo_pt": "Quaest em São Paulo: flávio Bolsonaro e Lula empatam tecnicamente no 1° turno", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}]}], "mundo": [{"id": 78864, "titulo": "Fifa offers $40m if nations back controversial plan", "url": "https://www.bbc.co.uk/sport/football/articles/cvg7vglq9wpo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-07-29T11:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Fifa estabeleceu uma data limite para 19 de setembro, exigindo que as federações assintam a um plano controverso para acessar fundos. Muitas associações nacionais expressaram desaprovação em relação ao plano de financiamento da entidade global antes de uma reunião emergencial da Uefa.", "titulo_pt": "Fifa oferece $40mi se países aceitarem plano controverso", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 78901, "titulo": "Gaza residents flee before Israeli strike hits mosque area", "url": "http://www.euronews.com/video/2026/07/29/gaza-residents-flee-before-israeli-strike-hits-mosque-area", "fonte_id": "euronews", "data_pub": "2026-07-29T11:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Residentes de Gaza estão fugindo antes que um ataque israelense atinja uma área próxima a mesquitas. Explosões, chamas e fumaça podem ser vistos subindo para o céu durante as noites após um aviso de evacuação.", "titulo_pt": "Cidadãos de gaza fogem antes de ataque israelense em áreas próximas a mesquitas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 78740, "titulo": "Japan ‘Races Against Time’ to Reach People Trapped After Large Quake", "url": "https://www.nytimes.com/2026/07/28/world/asia/japan-earthquake-kumamoto-rescue-survivors.html", "fonte_id": "nyt_world", "data_pub": "2026-07-29T11:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Equipes de resgate estão trabalhando para libertar pessoas presas em edifícios derrubados após um terremoto de magnitude 6,8 que atingiu Kumamoto na quinta-feira.", "titulo_pt": "Japão 'corre contra o tempo' para resgatar pessoas presas após grande terremoto", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 78860, "titulo": "Oscar-winning songwriter Glen Hansard killed in crash", "url": "https://www.bbc.co.uk/news/articles/c3ekn9d37qvo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-07-29T11:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Glen Hansard, de 56 anos, faleceu em um acidente de carro. Ele era conhecido por ter vencido o Oscar de melhor canção pelo filme 'Uma Noite Especial', lançado em 2007.", "titulo_pt": "Músico premiado com oscar morre em acidente", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 78915, "titulo": "France: DJ Kavinsky found dead at Paris home", "url": "https://www.dw.com/en/france-dj-kavinsky-found-dead-at-paris-home/a-78159118?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-07-29T11:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vincent Belorgey, conhecido como DJ Kavinsky, uma estrela da cena eletrônica francesa, foi encontrado morto em sua casa em Paris. Ele era famoso por seu single 'Nightcall', que foi tocado na cerimônia de encerramento dos Jogos Olímpicos de 2024 em Paris.", "titulo_pt": "França: DJ Kavinsky encontrado morto em casa parisiense", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 79010, "titulo": "Giorgetti, su pirateria tv grande lavoro Gdf, incomprensibili le polemiche", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/29/giorgetti-su-pirateria-tv-grande-lavoro-gdf-incomprensibili-le-polemiche_3a92b0fd-035b-4097-95b0-d5b35c31b728.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-29T11:24:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Giorgetti discursou sobre a pirataria de TV e o grande trabalho realizado pela Gdf. Houve incompreensão sobre as polêmicas envolvendo o divêto publicitário das apostas esportivas.", "titulo_pt": "Giorgetti sobre pirataria de tv e grandes esforços da Gdf; incompreensões sobre debate das apostas esportivas", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 78782, "titulo": "Pedro Sánchez says next 12 hours will be ‘decisive’ in battle to contain wildfires – Europe live", "url": "https://www.theguardian.com/world/live/2026/jul/29/france-spain-wildfires-heatwave-extreme-heat-europe-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-07-29T11:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo espanhol considera os próximos 12 horas decisivas para conter incêndios em Gironde e Madrid. A União Europeia espera semanas difíceis, com medo de novos focos de incêndio na Itália e Grécia durante o verão.", "titulo_pt": "Sánchez afirma que as próximas 12 horas serão 'decisivas' na batalha para conter os incêndios - Europa em tempo real", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 78739, "titulo": "Iran War Live Updates: U.S. and Saudi Airstrikes Drag More Countries Into Fighting", "url": "https://www.nytimes.com/live/2026/07/28/world/iran-us-strikes-iraq-trump", "fonte_id": "nyt_world", "data_pub": "2026-07-29T11:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os preços globais do petróleo subiram na quarta-feira após a divulgação de que os Estados Unidos e a Arábia Saudita realizaram ataques aéreos conjuntos contra proxy iranianos no Iraque, o que trouxe mais países para a luta.", "titulo_pt": "Atualizações da guerra do Irã: Airstrikes dos EUA e arábia saudita levantam preços do petróleo", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 78916, "titulo": "Japan: Hospitals struggle after deadly Kumamoto earthquake", "url": "https://www.dw.com/en/japan-hospitals-struggle-after-deadly-kumamoto-earthquake/live-78155782?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-07-29T11:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um terremoto de magnitude 7,1 atingiu o sul do Japão, causando mais de uma dúzia de mortes e danos generalizados. Equipes de resgate estão procurando sobreviventes.", "titulo_pt": "Japão: hospitais lutam após terremoto letal em Kumamoto", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 78917, "titulo": "Germany: How effective are exit programs for Islamists?", "url": "https://www.dw.com/en/germany-how-effective-are-exit-programs-for-islamists/a-78156050?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-07-29T11:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alemanha implementou vários programas para auxiliar indivíduos a se distanciarem do cenário islâmico radical. Após o ataque terrorista islamista no evento de orgulho gay em Berlim, críticos afirmam que esses programas não são eficazes.", "titulo_pt": "Alemanha: quão eficientes são os programas de saída para extremistas islâmicos?", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 79011, "titulo": "Intesa oltre le attese, l'utile del semestre a 5,5 miliardi", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/29/intesa-oltre-le-attese-lutile-del-semestre-a-55-miliardi_f641ce38-60ae-411c-83b9-d3fdd56c62d7.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-29T11:14:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Intesa Sanpaolo, além das expectativas, obteve um lucro líquido de 5,5 bilhões de euros no semestre. A operação na Mps fortaleceu o grupo financeiro.", "titulo_pt": "Intesa acima das expectativas, lucro de 5,5 bilhões e operação na mps", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 78490, "titulo": "Pressão máxima: governo espera nova ofensiva dos EUA contra o Brasil", "url": "https://g1.globo.com/politica/blog/andreia-sadi/post/2026/07/29/governo-espera-nova-ofensiva-dos-eua-contra-o-brasil.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-29T11:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo brasileiro espera uma nova escalada da crise diplomática com os Estados Unidos nos próximos dias ou semanas. A decisão de negar vistos a dois representantes dos EUA foi vista como parte de uma disputa geopolítica pelo comando político da América Latina.", "titulo_pt": "Pressão máxima: governo espera nova ofensiva dos EUA contra o Brasil", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 78855, "titulo": "More than 100 aftershocks hit Japan after deadly quake that killed 13", "url": "https://www.bbc.co.uk/news/articles/cgk43y21j0do?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-07-29T11:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de cem réssquakes atingiram o Japão após um terremoto letal que deixou 13 mortos. As autoridades estão pedindo para a população permanecer alerta, pois os réssquakes podem chegar a magnitude 7.", "titulo_pt": "Mais de cem réssquakes atingiram o Japão após terremoto letal", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 79081, "titulo": "Bill Gates planning to visit S. Korea next month: industry sources", "url": "https://en.yna.co.kr/view/AEN20260729010900320", "fonte_id": "yonhap_news", "data_pub": "2026-07-29T11:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bill Gates está planejando visitar a Coreia do Sul no próximo mês, segundo fontes da indústria.", "titulo_pt": "Bill Gates planeja visita à Coreia do sul em julho: fontes da indústria", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 78892, "titulo": "Germany's Merz faces unprecedented rebellion within his party", "url": "https://www.lemonde.fr/en/international/article/2026/07/29/germany-s-merz-faces-unprecedented-rebellion-within-his-party_6755957_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-29T11:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Após uma remodelação do gabinete visando fortalecer sua autoridade, a crítica interna ao chanceler alemão está aumentando dentro do CDU.", "titulo_pt": "Merz enfrenta rebelião inédita dentro de seu partido", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 78902, "titulo": "Iraq eyes supplying Turkey with 1 million oil barrels a day amid Hormuz crisis", "url": "http://www.euronews.com/2026/07/29/iraq-eyes-supplying-turkey-with-1-million-oil-barrels-a-day-amid-hormuz-crisis", "fonte_id": "euronews", "data_pub": "2026-07-29T11:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro do Iraque, Ali Zeydi, visitou Ancara e ofereceu ao Turquia a suprimento de 1 milhão de barris de petróleo por dia. Esta oferta ocorre enquanto o Turquia busca reduzir sua dependência das rotas interrompidas no Golfo Pérsico.", "titulo_pt": "Iraque considera fornecer à Turquia 1 milhão de barris de petróleo diariamente durante crise do Hormuz", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 78507, "titulo": "Ida de brasileiro para Heineken faz maior empresa de café do mundo buscar CEO", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/cafe-na-prensa/2026/07/ida-de-brasileiro-para-heineken-faz-maior-empresa-de-cafe-do-mundo-buscar-ceo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-29T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O brasileiro Rafael Oliveira, recentemente confirmado como futuro CEO da Global Coffee Co, deixou a empresa poucos meses após sua nomeação. A Global Coffee Co, maior empresa de café do mundo, agora busca novamente um novo líder executivo.", "titulo_pt": "Chegada de brasileiro à Heineken e saída inesperada impactam busca por CEO na global coffee co", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 78508, "titulo": "Lucro do Santander cai para R$ 3 bilhões no 2º tri com piora na inadimplência", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/lucro-do-santander-cai-para-r-3-bilhoes-no-2o-tri-com-piora-na-inadimplencia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-29T10:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Santander Brasil registrou um lucro líquido gerencial de R$ 3 bilhões no segundo trimestre de 2026, uma diminuição de 17,6% em comparação com o mesmo período do ano anterior e de 20,4% em relação ao primeiro trimestre daquele ano. O resultado foi impactado pela elevação na inadimplência.", "titulo_pt": "Lucro do Santander cai para R$ 3 bilhões no 2º tri com piora na inadimplência", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 78985, "titulo": "FTSE 100 hits all-time high as ‘anti-tech’ index shines in global chip rout", "url": "https://www.ft.com/content/2e3048dc-e003-44be-957c-3f119bde3f48?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-29T10:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O índice FTSE 100 atingiu um novo recorde histórico, enquanto o índice ‘anti-tecnologia’ se destacou durante a correção das ações de chips em todo o mundo. As bolsas do Reino Unido recuperaram-se da venda de ações após a guerra na Irã, impulsionadas por bancos e empresas de petróleo.", "titulo_pt": "FTSE 100 atinge novo recorde enquanto índice ‘anti-tecnologia’ brilha em correção global de ações de chips", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 78613, "titulo": "Bolsas da Ásia fecham mistas, e Kospi recua apesar de recorde da SK Hynix", "url": "https://www.cnnbrasil.com.br/economia/mercado/bolsas-da-asia-fecham-mistas-e-kospi-recua-apesar-de-recorde-da-sk-hynix/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T10:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As bolsas da Ásia fecharam com resultados mistos, enquanto o índice Kospi recuou apesar do recorde alcançado pela SK Hynix. Persistentes dúvidas sobre a sustentabilidade do ciclo de investimentos continuam pressionando os mercados.", "titulo_pt": "Bolsas da Ásia fecham mistas, com Kospi em recuo apesar de recorde de SK Hynix", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 78519, "titulo": "Beneficiários com NIS de final 8 recebem Bolsa Família de julho", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-07/beneficiarios-com-nis-de-final-8-recebem-bolsa-familia-de-julho", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-07-29T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Caixa Econômica Federal realiza o pagamento do Bolsa Família de julho para beneficiários com NIS final 8 nesta quarta-feira (29). O valor médio do benefício é de R$ 679,19. Os pagamentos antecipados foram feitos em 20 de julho para moradores de 175 municípios em situação de emergência ou calamidade pública nos estados do Amazonas, Paraíba, Paraná, Rio Grande do Norte, Roraima e Sergipe.", "titulo_pt": "Beneficiários com NIS final 8 recebem Bolsa Família de julho", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 78588, "titulo": "A reforma tributária vai bater na conta de água. Só falta saber quanto e quando", "url": "https://braziljournal.com/a-reforma-tributaria-vai-bater-na-conta-de-agua-so-falta-saber-quanto-e-quando/", "fonte_id": "brazil_journal", "data_pub": "2026-07-29T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reforma tributária aumentará os impostos sobre serviços de água e esgoto, afetando o setor de saneamento. No entanto, ainda não se conhece com precisão a magnitude do aumento nas tarifas nem a data prevista para isso ocorrer.", "titulo_pt": "Reforma tributária vai impactar conta de água, mas detalhes são incertos", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 78989, "titulo": "Kumamoto Prefecture gripped by massive economic fallout after earthquake", "url": "https://www.japantimes.co.jp/business/2026/07/29/companies/businesses-impacted-kumamoto-quake/", "fonte_id": "japan_times", "data_pub": "2026-07-29T09:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A região de Kumamoto enfrenta severos impactos econômicos após o terremoto, com centros comerciais e fábricas colapsados, resultando em mortes. A produção foi interrompida e as comunicações e transportes permanecem perturbados.", "titulo_pt": "Kumamoto enfrenta forte queda econômica após terremoto", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 78511, "titulo": "Cabos de fibra óptica sob rios da Amazônia são aposta contra apagões de rede no Norte", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/cabos-de-fibra-optica-sob-rios-da-amazonia-sao-aposta-contra-apagoes-de-rede-no-norte.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-29T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cabos de fibra óptica foram instalados sob rios da Amazônia, incluindo o rio Branco em Caracaraí, Roraima. Esta infraestrutura visa prevenir apagões na rede de comunicação no Norte do país.", "titulo_pt": "Fibra óptica sob rios da Amazônia para evitar apagões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 78777, "titulo": "Shares in Asian chip firms plunge further as AI sell-off continues", "url": "https://www.theguardian.com/business/2026/jul/29/asian-chip-firms-shares-plunge-ai-sell-off-stock-markets", "fonte_id": "guardian_world", "data_pub": "2026-07-29T08:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações de empresas asiáticas relacionadas à inteligência artificial caíram mais após resultados insatisfatórios da SK Hynix, uma fabricante sul-coreana de chips. O índice Kospi de Seul, que é dominado por fabricantes de semicondutores, caiu até 12,6% em um momento, atingindo seu nível mais baixo desde abril.", "titulo_pt": "Ações de empresas asiáticas de chip caem após resultados decepcionantes da sk hynix", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 78631, "titulo": "Benefícios do Pix superam custos impostos ao Brasil pelas tarifas de Trump, diz Nobel de Economia", "url": "https://www.bbc.com/portuguese/articles/c1l1dq48843o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-07-29T08:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O economista americano Joseph Stiglitz afirma que as tarifas impostas pelos EUA ao Brasil são motivadas por uma tentativa de punir o país pela busca por maior independência digital e resistência a pressões externas. Segundo ele, os benefícios do Pix superam os custos associados às tarifas de Trump.", "titulo_pt": "Benefícios do Pix superam custos das tarifas de Trump, diz Nobel de Economia", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 78638, "titulo": "Relevância do recurso especial: como funcionará o STJ com o novo filtro?", "url": "https://www.jota.info/opiniao-e-analise/artigos/relevancia-do-recurso-especial-como-funcionara-o-stj-com-o-novo-filtro", "fonte_id": "jota", "data_pub": "2026-07-29T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O modelo adotado pelo STF permite fortalecer a função de formar precedentes vinculantes sem limitar excessivamente os jurisdicionados. O STJ também poderá implementar um novo filtro com similar objetivo.", "titulo_pt": "Relevância do recurso especial: como o STJ funcionará com o novo filtro?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 78640, "titulo": "A Copa migrou para o digital — e ficaram aprendizados para a regulação", "url": "https://www.jota.info/opiniao-e-analise/colunas/radar-de-evidencias/a-copa-migrou-para-o-digital-e-ficaram-aprendizados-para-a-regulacao", "fonte_id": "jota", "data_pub": "2026-07-29T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Copa migrou para o digital, trazendo aprendizados sobre gratuidade, interatividade, publicidade e moderação. Esses elementos já se tornaram relevantes na transição entre radiodifusão e plataformas digitais.", "titulo_pt": "A Copa migrou para o digital — e ficaram aprendizados para a regulação", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 78641, "titulo": "A ilegal Resolução ANP 1.003/26 e o acesso de terceiros a terminais de gás natural liquefeito", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-ilegal-resolucao-anp-1-003-2026-e-o-acesso-de-terceiros-a-terminais-de-gas-natural-liquefeito", "fonte_id": "jota", "data_pub": "2026-07-29T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O regulamento ANP 1.003/26 estabeleceu obrigações e deveres que não estavam fundamentados na legislação existente, violando a lei. Isso gerou acesso de terceiros a terminais de gás natural liquefeito.", "titulo_pt": "A ilegal Resolução ANP 1.003/26 e o acesso de terceiros a terminais de gás natural liquefeito", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 79090, "titulo": "(LEAD) Samsung C&T Q2 net profit jumps 73.9 pct on diversified business portfolio", "url": "https://en.yna.co.kr/view/AEN20260729007551320", "fonte_id": "yonhap_news", "data_pub": "2026-07-29T07:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Samsung C&T Corp., empresa de construção e comércio, registrou um lucro líquido no segundo trimestre que aumentou 73,9% em comparação com o mesmo período do ano anterior, graças a uma carteira diversificada de negócios.", "titulo_pt": "Lucro líquido da Samsung C&T no segundo trimestre cresce 73,9%", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 79091, "titulo": "(LEAD) KAI Q2 net falls 35.2 pct on delayed recognition of aircraft orders", "url": "https://en.yna.co.kr/view/AEN20260729007651320", "fonte_id": "yonhap_news", "data_pub": "2026-07-29T07:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A KAI, a única empresa de aviação da Coreia do Sul, registrou uma queda de 35,2% nos lucros líquidos no segundo trimestre devido à atraso na reconhecimento de pedidos de aviões.", "titulo_pt": "Lucros líquidos da KAI caem 35,2% no segundo trimestre devido atraso em reconhecimento de pedidos de avião", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 79093, "titulo": "(2nd LD) Seoul shares dip nearly 6 pct on extended chip rout amid AI skepticism", "url": "https://en.yna.co.kr/view/AEN20260729006752320", "fonte_id": "yonhap_news", "data_pub": "2026-07-29T07:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações de Seul caíram aproximadamente 6% na sessão de terça-feira, refletindo uma forte queda no setor de chips e preocupações com a inteligência artificial.", "titulo_pt": "Seul registra baixa de cerca de 6% em sessão marcada por desvalorização do setor de semicondutores", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 79026, "titulo": "Google makes Gemini Spark AI agent available to Hongkongers as it lowers geofences", "url": "https://www.scmp.com/tech/article/3362278/google-makes-gemini-spark-ai-agent-available-hongkongers-it-lowers-geofences?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-29T11:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google lançou recentemente o agente de inteligência artificial Gemini Spark no mercado de Hong Kong, permitindo que os usuários locais tenham acesso direto a um assistente inteligente para gerenciar fluxos de trabalho digitais complexos. A empresa decidiu remover as geofences regionais para seus serviços de IA geração em março deste ano.", "titulo_pt": "Google lança agente AI Gemini Spark no mercado de hong kong após remover geofences", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 79103, "titulo": "Mac Mini Availability: Long Waits and Higher Prices", "url": "https://www.wired.com/story/mac-mini-availability/", "fonte_id": "wired", "data_pub": "2026-07-29T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Devido ao aumento no processamento de IA local e à escassez contínua de memória, é extremamente difícil adquirir um Mac Mini. As pessoas estão enfrentando longas filas de espera e pagando preços mais altos para obter o produto.", "titulo_pt": "Disponibilidade do mac Mini: longas fila de espera e preços maiores", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 79151, "titulo": "AI Hyper-Scaling Digital Inequality", "url": "https://spectrum.ieee.org/ai-digital-divide", "fonte_id": "ieee_spectrum", "data_pub": "2026-07-29T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial está se tornando rapidamente parte da infraestrutura diária, mas isso varia de região para região. Embora haja discussões sobre AI para todos e estratégias nacionais de IA, a inclusão digital e a literacia digital ainda enfrentam desigualdades em muitas partes do mundo.", "titulo_pt": "Escalonação exagerada da IA e desigualdade Digital", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 79115, "titulo": "SK hynix rejects peak fears after record quarter", "url": "https://www.koreaherald.com/article/10824859", "fonte_id": "korea_herald", "data_pub": "2026-07-29T10:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "SK hynix negou que o boom de memórias para IA esteja chegando ao fim, citando contratos de suprimento a longo prazo com 10 clientes, investimentos sustentados das grandes tecnológicas e demanda crescente além da memória de alta largura de banda. A empresa afirmou que espera que as investidas em infraestrutura de IA mantenham-se sólidas por pelo menos mais um ano.", "titulo_pt": "SK hynix rejeita preocupações sobre o pico do boom de memórias para IA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 79104, "titulo": "No, You Probably Shouldn’t Lease Your iPhone", "url": "https://www.wired.com/story/apple-products-are-all-just-subscription-services-now/", "fonte_id": "wired", "data_pub": "2026-07-29T10:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple está facilitando pagamentos mensais para seus produtos, mas críticos chamam isso de 'financialização da crise de acessibilidade'.", "titulo_pt": "Não, provavelmente você não deveria alugar seu iphone", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 79106, "titulo": "More Typos, Fewer Em Dashes: Writers Are Creating an Anti-AI ‘Literary Counterculture’", "url": "https://www.wired.com/story/more-typos-fewer-em-dashes-writers-are-creating-an-anti-ai-literary-counterculture/", "fonte_id": "wired", "data_pub": "2026-07-29T10:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Escritores, jornalistas e usuários ativos do LinkedIn estão adotando narrativas pessoais e idiossincrasias para evitar serem confundidos com bots de inteligência artificial.", "titulo_pt": "Mais erros ortográficos, menos pontilhões: escritores criadam uma 'contecultura literária' anti-ia", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 79033, "titulo": "China’s Type 076 amphibious assault ship Sichuan in final tests with drone catapult", "url": "https://www.scmp.com/news/china/military/article/3362271/chinas-type-076-amphibious-assault-ship-sichuan-final-tests-drone-catapult?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-29T10:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China exibiu imagens computadorizadas mostrando como sua primeira embarcação de assalto amphibio Tipo 076 lançará drones GJ-21 de baixo rastro. O navio Sichuan, com uma plataforma de pouso de 250 metros e 62 metros de largura, está na fase final de testes.", "titulo_pt": "China exibe imagens computadorizadas do tipo 076 amphibioso lançando drones", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 79107, "titulo": "How to Bring a Geothermal Well Back from the Dead", "url": "https://www.wired.com/story/zanskar-geothermal-well-back-from-dead/", "fonte_id": "wired", "data_pub": "2026-07-29T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup Zanskar criou uma das poços geotérmicos mais produtivos dos EUA em um parque termelétrico que vinha operando em declínio há anos.", "titulo_pt": "Como reviver um poço geotérmico em declínio", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 79084, "titulo": "(2nd LD) Chief regulator expresses regret over leveraged ETF-led volatility", "url": "https://en.yna.co.kr/view/AEN20260729003652320", "fonte_id": "yonhap_news", "data_pub": "2026-07-29T09:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe da reguladora financeira expressou pesar sobre a volatilidade liderada por ETFs alavancados. A declaração ocorreu em Seul, Coreia do Sul, no dia 29 de julho.", "titulo_pt": "Chefe da reguladora expressa arrependimento sobre volatilidade liderada por etfs alavancados", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 79040, "titulo": "Chinese AI start-up Moonshot seeks influential ambassadors to widen Kimi’s global reach", "url": "https://www.scmp.com/tech/article/3362261/chinese-ai-start-moonshot-seeks-influential-ambassadors-widen-kimis-global-reach?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-29T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A start-up chinesa Moonshot AI lançou um programa de ambasciadores para expandir a influência global do seu modelo Kimi K3, semelhante aos sistemas fronteiriços americanos. O objetivo é construir comunidades e promover o uso mais amplo entre desenvolvedores e criadores.", "titulo_pt": "Start-up chinesa Moonshot busca ambasciadores para ampliar influência global do Kimi k3", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 79108, "titulo": "Boomers Can’t Stop Gifting Their Grandkids AI-Generated Slop Books", "url": "https://www.wired.com/story/boomers-cant-stop-gifting-their-grandkids-ai-generated-slop-books/", "fonte_id": "wired", "data_pub": "2026-07-29T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pais estão se incomodando com histórias de noite confusas que contêm personagens baseados em fotos reais dos próprios filhos. Esses livros são gerados por inteligência artificial.", "titulo_pt": "Baby boomers irritados com histórias confusas geradas por IA para netos", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 79109, "titulo": "NASA’s New 3D Model Shows the Earth Is a Lumpy Mess", "url": "https://www.wired.com/story/nasas-new-3d-model-shows-lumpy-earth/", "fonte_id": "wired", "data_pub": "2026-07-29T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Modelos de mapeamento gravitacional da NASA mostram que a Terra não é uma esfera perfeita, apresentando variações significativas na sua superfície e interior.", "titulo_pt": "Nasa cria novo modelo 3D mostrando que a terra é um bagunço límbico", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 78899, "titulo": "Anthropic's lonely island", "url": "https://www.axios.com/2026/07/29/anthropic-claude-open-models-ban-china", "fonte_id": "axios", "data_pub": "2026-07-29T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anthropic é simultaneamente a startup mais valiosa do mundo e o líder isolado na área de IA avançada. A empresa rejeitou assinar um manifesto aberto, o que tem estressado suas relações com desenvolvedores, policymaker e parceiros enquanto se prepara para uma possível oferta inicial de ações avaliada em trilhões de dólares.", "titulo_pt": "Anthropic: ilha isolada no oceano da IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 78512, "titulo": "Maior fabricante de baterias para veículos elétricos do mundo muda foco para IA, redes elétricas e navios", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/maior-fabricante-de-baterias-para-veiculos-eletricos-do-mundo-muda-foco-para-ia-redes-eletricas-e-navios.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-29T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A maior fabricante de baterias para veículos elétricos do mundo está mudando seu foco para áreas como inteligência artificial, redes elétricas e navios. Em um galpão industrial na China, uma simulação foi realizada para testar a resistência das baterias a descargas elétricas massivas, imitando o impacto de um raio.", "titulo_pt": "Maior fabricante de baterias para veículos elétricos do mundo muda foco para IA, redes elétricas e navios", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 79110, "titulo": "ICE’s New Detention Center Contracts Declare State Laws ‘Shall Not Apply’", "url": "https://www.wired.com/story/ices-new-detention-contracts-declare-state-law-shall-not-apply/", "fonte_id": "wired", "data_pub": "2026-07-29T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Agência ICE publicou novos termos de contrato que anulam a aplicação das leis estaduais nos quatro centros de detenção sob sua responsabilidade, um dia após um juiz federal ordenar que esses centros fossem abertos para inspetores de saúde estatais.", "titulo_pt": "Novos contratos da ice negam aplicação de leis estaduais em centros de detenção", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 78990, "titulo": "Overcoming the AI wisdom gap", "url": "https://www.japantimes.co.jp/commentary/2026/07/29/world/overcoming-ai-wisdom-gap/", "fonte_id": "japan_times", "data_pub": "2026-07-29T08:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aumenta o uso de assistentes virtuais com inteligência artificial (IA) para apoio emocional e orientação moral. Os chatbots de IA se tornam parte do cotidiano das pessoas.", "titulo_pt": "Superando a brecha da sabedoria da IA", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 79157, "titulo": "Disclosing past substance use in medical and dental school applications could hurt admissions prospects, study finds", "url": "https://phys.org/news/2026-07-disclosing-substance-medical-dental-school.html", "fonte_id": "phys_org", "data_pub": "2026-07-29T11:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 80% dos médicos e dentistas acreditam que candidatos que revelam um histórico de uso de substâncias nas aplicações para faculdades de medicina ou odontologia podem prejudicar suas chances de serem admitidos, conforme constatado por uma pesquisa realizada pela Columbia University Mailman School of Public Health e pelo University of Miami Miller School of Medicine.", "titulo_pt": "Revelar uso de substâncias no aplicativo para faculdades de medicina ou odontologia pode prejudicar chances de admissão, estudo mostra", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 79172, "titulo": "Neuroscientists pinpoint how smells bring back childhood memories", "url": "https://www.scientificamerican.com/article/neuroscientists-pinpoint-how-smells-bring-back-childhood-memories/", "fonte_id": "scientific_american", "data_pub": "2026-07-29T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ciência neurológica identificou o motivo pelo qual os cheiros
