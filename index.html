-ao-aeroporto-de-brasilia-quem-e-ciro-o-amigao-de-vorcaro", "fonte_id": "metropoles", "data_pub": "2026-09-06T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ciro e Vorcaro se conheceram há seis anos em um camarote do Mineirão e a amizade evoluiu para uma relação profissional. Essa amizade contribuiu para aproximar o advogado do banqueiro.", "titulo_pt": "De minas a Brasília: quem é Ciro, o amigo de Vorcaro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 148401, "titulo": "Carf derruba cobrança bilionária de IRPJ e CSLL contra Petrobras", "url": "https://www.jota.info/tributos/carf-derruba-cobranca-bilionaria-de-irpj-e-csll-contra-petrobras", "fonte_id": "jota", "data_pub": "2026-09-06T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho Administrativo de Recursos Fiscais (Carf) rejeitou a cobrança bilionária de Imposto de Renda e Contribuição Social sobre Lucros e Lucros Participações (CSLL) contra a Petrobras. Os conselheiros seguiram o voto do relator que considerou o método utilizado pelo fisco para calcular a cobrança inadequado.", "titulo_pt": "Carf descarta cobrança bilionária de IRPJ e CSLL contra Petrobras", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 148471, "titulo": "El nuevo perfil de las \"agtech\" argentinas: maximizan insumos, reducen desperdicios y mejoran procesos", "url": "https://www.clarin.com/economia/nuevo-perfil-agtech-argentinas-maximizan-insumos-reducen-desperdicios-mejoran-procesos_0_eo6dkE2zi4.html", "fonte_id": "clarin", "data_pub": "2026-09-06T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As startups argentinas especializadas em serviços para o setor rural passaram de oferecer soluções disruptivas para aprimorar a tecnologia existente. Eles buscam maximizar o uso de insumos, reduzir desperdícios e melhorar os processos.", "titulo_pt": "Novo perfil das 'agtech' argentinas: otimizam tecnologia, maximizam insumos e reduzem desperdícios", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 148305, "titulo": "China tenta coibir guerra de preço agressiva entre montadoras", "url": "https://www.poder360.com.br/poder-china/china-tenta-coibir-guerra-de-preco-agressiva-entre-montadoras/", "fonte_id": "poder360", "data_pub": "2026-09-06T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A China está incentivando as empresas a cumprir mais rigorosamente as normas locais enquanto se expandem para o exterior. A medida visa coibir uma possível guerra de preços entre montadoras.", "titulo_pt": "China tenta impedir guerra de preço agressiva entre montadoras", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 148402, "titulo": "Como a multa de R$ 14 mil à Telekall escalou aos R$ 153 milhões do TikTok", "url": "https://www.jota.info/opiniao-e-analise/artigos/como-a-multa-de-r-14-mil-a-telekall-escalou-aos-r-153-milhoes-do-tiktok", "fonte_id": "jota", "data_pub": "2026-09-06T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A multa de R$ 14 mil aplicada à Telekall aumentou significativamente para R$ 153 milhões no caso do TikTok. O potencial sancionatório da Lei Geral de Proteção de Dados (LGPD) era previsível e pode transformar a conformidade em questões financeiras importantes para as empresas.", "titulo_pt": "Como a multa de R$ 14 mil à Telekall escalou aos R$ 153 milhões do TikTok", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 148403, "titulo": "E se o Estado pudesse fazer mais com o mesmo dinheiro?", "url": "https://www.jota.info/opiniao-e-analise/artigos/e-se-o-estado-pudesse-fazer-mais-com-o-mesmo-dinheiro", "fonte_id": "jota", "data_pub": "2026-09-06T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Proposta de Emenda à Constituição 17/24, pronta para ser votada no plenário da Câmara, pode focar o debate eleitoral na eficiência do Estado. O título traduzido é: 'E se o Estado pudesse fazer mais com o mesmo dinheiro?'", "titulo_pt": "E se o Estado pudesse fazer mais com o mesmo dinheiro?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 148404, "titulo": "Lei de Arbitragem, 30 anos: desafio é chegar aos pequenos e médios empresários", "url": "https://www.jota.info/opiniao-e-analise/artigos/lei-de-arbitragem-30-anos-desafio-e-chegar-aos-pequenos-e-medios-empresarios", "fonte_id": "jota", "data_pub": "2026-09-06T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Câmaras como a CEMAAC trabalham para diminuir os custos e tornar a arbitragem mais acessível a pequenos e médios negócios. O desafio é levar o método de resolução de disputas a empresas menores.", "titulo_pt": "Lei de Arbitragem, 30 anos: desafio é chegar aos pequenos e médios empresários", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 148384, "titulo": "Sem Tim Cook perde o brilho? Apple fica de fora de recomendações de ações globais", "url": "https://www.infomoney.com.br/onde-investir/carteira-recomendada-acoes-internacionais-setembro-2026/", "fonte_id": "infomoney", "data_pub": "2026-09-06T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Apple foi excluída de recomendações de ações globais, coincidindo com a saída de Tim Cook da liderança da empresa. A decisão tem outra motivação: uma rotação dentro da tese de inteligência artificial.", "titulo_pt": "Sem Tim Cook, apple sai das recomendações de ações globais", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 148385, "titulo": "“SoHo paulistano”: Accor aposta em Pinheiros – e diária média cresce mais de 20%", "url": "https://www.infomoney.com.br/business/soho-paulistano-accor-aposta-em-pinheiros-e-diaria-media-cresce-mais-de-20/", "fonte_id": "infomoney", "data_pub": "2026-09-06T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Accor está investindo em Pinheiros, convertendo um hotel da bandeira Hilton para Grand Mercure. A diária média aumentou mais de 20% e o hotel mantém uma ocupação de 70%.", "titulo_pt": "‘Soho paulistano’: accor investe em Pinheiros e diária média cresce mais de 20%", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 148386, "titulo": "Sua empresa usa IA. Mas ela está gerando resultado?", "url": "https://www.infomoney.com.br/carreira/ia-nas-empresas-resultado-governanca/", "fonte_id": "infomoney", "data_pub": "2026-09-06T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A adoção de inteligência artificial em empresas avançou mais rapidamente do que o impacto financeiro observado. Embora haja preocupações crescentes entre as lideranças sobre o controle e a responsabilidade de sistemas mais autônomos, as empresas que conseguem capturar valor estão redesenhando seus processos.", "titulo_pt": "Sua empresa usa IA. Mas ela está gerando resultado?", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 148405, "titulo": "Doenças raras: o custo de descobrir tarde demais", "url": "https://www.jota.info/opiniao-e-analise/artigos/doencas-raras-o-custo-de-descobrir-tarde-demais", "fonte_id": "jota", "data_pub": "2026-09-06T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sem informações precisas e diagnóstico precoce, aumentar o acesso a tratamentos para doenças raras não resolve completamente o problema. O atraso no diagnóstico pode ser custoso para os pacientes e os sistemas de saúde.", "titulo_pt": "Doenças raras: o custo de diagnóstico tardio", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 148775, "titulo": "Which overseas property markets will be the winners and losers if Fed raises US rates?", "url": "https://www.scmp.com/business/article/3366386/which-overseas-property-markets-will-be-winners-and-losers-if-fed-raises-us-rates?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-06T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Comentários do presidente do Federal Reserve, Kevin Warsh, em um evento econômico anual em Jackson Hole sugerem que uma elevação das taxas de juros nos Estados Unidos está próxima, o que terá impactos significativos em mercados imobiliários e investidores globais. Embora a taxa-alvo do Fed tenha permanecido entre 3,5% e 3,75% em julho, os comentários de Warsh sobre a necessidade de aprimorar o controle da inflação aumentaram as expectativas de um aumento das taxas.", "titulo_pt": "Quais mercados imobiliários internacionais serão vencedores e perdedores se o Fed aumentar as taxas de juros?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 148370, "titulo": "Com dívida de R$ 17 bilhões, Casas Bahia pagou propina milionária em SP", "url": "https://www.metropoles.com/colunas/ramiro-brites/casas-bahia-propina-sp", "fonte_id": "metropoles", "data_pub": "2026-09-06T07:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Casas Bahia teria pago uma propina milionária de R$ 2,98 milhões para obter vantagens em créditos de ICMS em São Paulo. A informação foi divulgada pelo Ministério Público de São Paulo (MPSP) e a empresa tinha uma dívida de R$ 17 bilhões.", "titulo_pt": "Com dívida de R$ 17 bilhões, Casas Bahia pagou propina de R$ 2,98 milhões em SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 148349, "titulo": "Análise: Guerra encarece o custo do dinheiro nos EUA e no mundo", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/analise-guerra-encarece-o-custo-do-dinheiro-nos-eua-e-no-mundo/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-06T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tensões geopolíticas, inflação e dívida de US$ 40 trilhões estão perturbando o mercado de títulos de dívida dos Estados Unidos.", "titulo_pt": "Análise: guerra encarece o custo do dinheiro nos EUA e no mundo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 148453, "titulo": "“Este es el camino”: el sector que puede crecer 5% anual en la próxima década y aportar US$85.000 millones", "url": "https://www.lanacion.com.ar/economia/campo/este-es-el-camino-el-sector-que-puede-crecer-5-anual-en-la-proxima-decada-y-aportar-us85000-millones-nid06092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-06T06:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A agroindústria pode crescer a uma taxa anual de 5% na próxima década, gerando US$85 bilhões. O desenvolvimento de novas investimentos pode impulsionar este setor.", "titulo_pt": "Este é o caminho: o setor que pode crescer 5% anual na próxima década e aportar US$85 bilhões", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 148756, "titulo": "Economy, housing, foreign policy in focus as Assembly gears up to grill Lee government", "url": "https://www.koreaherald.com/article/10863944", "fonte_id": "korea_herald", "data_pub": "2026-09-06T05:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As principais partes políticas da Coreia do Sul estão prestes a questionar o governo Lee sobre suas políticas econômicas, imobiliárias, de foreign policy e de segurança no decorrer de sessões de interpelação e confirmação de nomes de ministros. Essas sessões começam com discussões sobre assuntos políticos e seguem com economia, assuntos externos, unificação e segurança.", "titulo_pt": "Economia, habitação, política externa em pauta durante sessões de interpelação do governo Lee", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 148759, "titulo": "Going local, cutting carbon: Inside Hyundai's US steel expansion", "url": "https://www.koreaherald.com/article/10863927", "fonte_id": "korea_herald", "data_pub": "2026-09-06T04:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Hyundai Motor Group, que já constrói carros nos Estados Unidos há duas décadas, está expandindo suas operações para a produção de aço, com um novo complexo de fundição a arco elétrico planejado em Louisiana. O projeto, avaliado em US$ 5,8 bilhões, fornecerá aço para as fábricas da Hyundai e da Kia nos estados da Alabama e Geórgia, marcando uma nova fase na expansão da empresa no país.", "titulo_pt": "Vai local e corta carbono: a expansão de aço da Hyundai nos EUA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 148391, "titulo": "Marte tem encontro “às escondidas” com a Lua neste domingo (6)", "url": "https://olhardigital.com.br/2026/09/06/ciencia-e-espaco/marte-tem-encontro-as-escondidas-com-a-lua-neste-domingo-6/", "fonte_id": "olhar_digital", "data_pub": "2026-09-06T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Embora a conjunção entre Marte e Lua não seja visível, os dois planetas poderão ser observados próximos no céu da madrugada deste domingo (6).", "titulo_pt": "Marte tem encontro ‘às escondidas’ com a Lua neste domingo (6)", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 148572, "titulo": "José Tolentino de Mendonça: “La transformación de la IA es tan grande que puede escaparse de las manos del hombre”", "url": "https://www.latercera.com/mundo/noticia/jose-tolentino-de-mendonca-la-transformacion-de-la-ia-es-tan-grande-que-puede-escaparse-de-las-manos-del-hombre/", "fonte_id": "la_tercera", "data_pub": "2026-09-06T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O cardenal português José Tolentino de Mendonça lançou uma Trienal de Arte contemporâneo como forma de valorizar o aspecto humano frente ao avanço das tecnologias. Ele afirma que o arte é um meio privilegiado para promover a comunicação entre grupos humanos.", "titulo_pt": "José Tolentino de Mendonça: 'a transformação da IA é tão grande que pode escapar das mãos do homem'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 148286, "titulo": "Nvidia desafia Apple, Intel e AMD com PCs equipados com superchip de IA e preços altos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/nvidia-desafia-apple-intel-e-amd-com-pcs-equipados-com-superchip-de-ia-e-precos-altos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-06T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Nvidia e a Microsoft forneceram mais detalhes sobre o lançamento dos primeiros computadores com o superchip RTX Spark, que incorpora tecnologia de inteligência artificial. Os preços desses PCs serão altos.", "titulo_pt": "Nvidia e microsoft detalham lançamento de PCs com superchip de IA e preços elevados", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 148711, "titulo": "Turning dual-use technology into defense capability", "url": "https://www.japantimes.co.jp/commentary/2026/09/06/japan/dual-use-defense-technology/", "fonte_id": "japan_times", "data_pub": "2026-09-06T06:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Japão precisa de um processo end-to-end que possa transformar tecnologias de uso dual em capacidades operacionais em larga escala e com velocidade significativa.", "titulo_pt": "Transformar tecnologias de uso dual em capacidade defensiva", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 148356, "titulo": "O método de 4 etapas para transformar uma resposta genérica da IA em algo realmente útil", "url": "https://exame.com/inteligencia-artificial/o-metodo-de-4-etapas-para-transformar-uma-resposta-generica-da-ia-em-algo-realmente-util/", "fonte_id": "exame", "data_pub": "2026-09-06T06:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O método proposto envolve várias etapas para transformar uma resposta insatisfatória da inteligência artificial em algo útil. Começa com a utilização de uma resposta inicial como ponto de partida para aperfeiçoar o pedido, adicionando contexto e definindo critérios mais claros.", "titulo_pt": "O método de 4 etapas para transformar uma resposta genérica da IA em algo realmente útil", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 148357, "titulo": "Gestão pós-layoffs: o que os CEOs precisam aprender com a crise das big techs", "url": "https://exame.com/exame-in/gestao-pos-layoffs-o-que-os-ceos-precisam-aprender-com-a-crise-das-big-techs/", "fonte_id": "exame", "data_pub": "2026-09-06T06:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O conselheiro e pesquisador Rafael Camilo, ex-Google e Twitter, examina no seu novo livro o impacto estrutural das demissões em massa na indústria de tecnologia.", "titulo_pt": "Gestão pós-demissões em massa: o que os CEOs precisam aprender com a crise das grandes empresas de tecnologia", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 148781, "titulo": "Chinese military university urged to revise AI course to ‘educate for war’", "url": "https://www.scmp.com/news/china/military/article/3366490/chinese-military-university-urged-revise-ai-course-educate-war?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-06T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade Nacional de Defesa Tecnológica propuseram uma reformulação do curso 'Princípios e Práticas de Inteligência Artificial' para estudantes de pós-graduação, com foco no 'educação para guerra', incorporando cenários de combate para preparar melhor oficiais futuros para a guerra inteligente. Este esforço ocorre enquanto a China busca cultivar mais profissionais especializados em IA.", "titulo_pt": "Universidade militar chinesa sugerida para reformular curso de IA com foco em 'educação para guerra'", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 148754, "titulo": "APR's Medicube tests negative for banned dye tied to unauthorized seller", "url": "https://www.koreaherald.com/article/10863947", "fonte_id": "korea_herald", "data_pub": "2026-09-06T05:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa sul-coreana de beleza APR informou que testes laboratoriais realizados em instituições certificadas, incluindo no próprio país, não detectaram a presença de Sudan Red, um corante industrial proibido, em duas loteações do creme Medicube, que foram objeto de recall pela agência reguladora de saúde de Singapura. A empresa enviou amostras do creme Medicube PDRN Pink Collagen Capsule Cream aos laboratórios, referentes aos lotes 2E122I.2E117I e 2E191G.2E193G, e os testes não encontraram o corante proibido.", "titulo_pt": "Apr testa negativo para corante proibido em creme Medicube", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 148361, "titulo": "5 erros que fazem seus prompts funcionarem mal mesmo quando a ferramenta é boa", "url": "https://exame.com/inteligencia-artificial/erros-que-fazem-seus-prompts-funcionarem-mal-mesmo-quando-a-ferramenta-e-boa/", "fonte_id": "exame", "data_pub": "2026-09-06T05:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um comando mal formulado pode prejudicar a resposta de uma inteligência artificial. O artigo lista os problemas mais comuns e sugere como reformular os pedidos para obter resultados mais precisos.", "titulo_pt": "5 Erros que fazem seus prompts funcionarem mal mesmo quando a ferramenta é boa", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 148761, "titulo": "SK Innovation to co-host Ulsan Forum on AI in manufacturing", "url": "https://www.koreaherald.com/article/10863923", "fonte_id": "korea_herald", "data_pub": "2026-09-06T04:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SK Innovation, em parceria com a Câmara de Comércio e Indústria de Ulsan, co-organizará o 2026 Ulsan Forum, focado na transformação da indústria de manufatura através da inteligência artificial e inovação local. O evento, com o tema 'Líder AX, Vida Inteligente Ulsan', ocorrerá na próxima sexta-feira no Centro de Exposições e Convenções de Ulsan.", "titulo_pt": "SK Innovation vai co-organizar fórum de Ulsan sobre IA na indústria de manufatura", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 148763, "titulo": "LG Electronics targets actuators, B2B appliances as next growth engines", "url": "https://www.koreaherald.com/article/10863921", "fonte_id": "korea_herald", "data_pub": "2026-09-06T04:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "LG Electronics está posicionando os actuadores robóticos, que são os mecanismos que movem os robôs, como o próximo motor de crescimento. A empresa está prestes a obter seu primeiro grande pedido de uma gigante tecnológica global, com a produção em massa em preparo.", "titulo_pt": "LG eletrônicos alinha actuadores robóticos e aplicações B2B como novos motores de crescimento", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 148600, "titulo": "Labor plans crackdown on social media algorithms as Taylor says he’s ‘deeply sceptical’", "url": "https://www.theguardian.com/australia-news/2026/sep/06/labor-plans-crackdown-on-social-media-algorithms-as-taylor-says-hes-deeply-sceptical", "fonte_id": "guardian_world", "data_pub": "2026-09-06T04:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Partido Trabalhista planeja introduzir legislação para controlar os algoritmos de mídias sociais, mas enfrenta forte oposição do Partido Coalition, que acusa o governo de tentar censurar a internet. A ministra de Comunicações, Anika Wells, deve apresentar projetos de lei que criem uma obrigação de cuidado digital, enquanto o líder da oposição, Angus Taylor, se manifestou com ceticismo sobre essas medidas.", "titulo_pt": "Trabalhistas planejam reprimir algoritmos de mídias sociais, mas enfrentam ceticismo de Taylor", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 148676, "titulo": "UBS demands new junior bankers show AI proficiency", "url": "https://www.ft.com/content/76b370ff-b5f6-4e22-aa30-da08b1abb8f8?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-06T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jovens graduados e estágio na UBS devem demonstrar competência em usar inteligência artificial para melhorar os resultados e a eficiência. A instituição suíça exige que os candidatos mostrem como podem aplicar a tecnologia no trabalho.", "titulo_pt": "UBS exige que novos bancários jovens demonstrem proficiência em AI", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 148787, "titulo": "Tesla to exhibit Cybercab robotaxi in China: can it spark buzz amid slow sales?", "url": "https://www.scmp.com/business/china-evs/article/3366461/tesla-exhibit-cybercab-robotaxi-china-can-it-spark-buzz-amid-slow-sales?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-06T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tesla está enfrentando vendas mais fracas no mercado chinês neste ano, mas pretende gerar interesse em seu segundo maior mercado ao exibir seu novo veículo autônomo, o Cybercab, que não possui volante, pedais ou espelhos retrovisores. O veículo será apresentado em cidades chinesas importantes, incluindo Beijing e Shanghai, a partir do meio de setembro.", "titulo_pt": "Tesla vai exibir o Cybercab em China: será que desperta interesse com vendas lentas?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 148723, "titulo": "German rocket reaches space as Europe enters satellite launch race", "url": "https://www.japantimes.co.jp/news/2026/09/06/world/science-health/german-rocket-space-satellite/", "fonte_id": "japan_times", "data_pub": "2026-09-06T01:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um foguete não tripulado atingiu a órbita espacial, sendo o primeiro voo comercial a fazê-lo a partir da Europa continental. Várias nações europeias afirmam ter interesse em participar do mercado crescente de missões espaciais.", "titulo_pt": "Foguete alemão atinge órbita espacial em corrida europeia por lançamentos de satélites", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 148395, "titulo": "LOUD vence NRG em série de cinco mapas, vai à final do VCT Americas e garante vaga no Champions", "url": "https://olhardigital.com.br/2026/09/05/games-e-consoles/loud-vence-nrg-e-vai-a-final-do-vct-americas/", "fonte_id": "olhar_digital", "data_pub": "2026-09-06T00:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A equipe brasileira LOUD venceu a NRG em uma série de cinco mapas e avançou à final do VCT Americas, enfrentando a 100 Thieves no próximo domingo. Este resultado também garantiu à LOUD uma vaga no Champions após três anos.", "titulo_pt": "LOUD vence NRG e avança para a final do VCT Americas e Champions", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}], "tecnologia__eventos": [], "ciencia": [{"id": 148285, "titulo": "Expedição na mata atlântica busca microrganismos para construir banco de moléculas", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/expedicao-na-mata-atlantica-busca-microrganismos-para-construir-banco-de-moleculas.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-06T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma expedição científica na mata atlântica buscou microrganismos em diferentes substratos com o objetivo de identificar moléculas potencialmente úteis para a agricultura e a indústria de cosméticos.", "titulo_pt": "Expedição na mata atlântica procura microrganismos para banco de moléculas", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 148772, "titulo": "Study that argued China’s solar policy hurt birds may have miscounted 2 billion egrets", "url": "https://www.scmp.com/news/china/science/article/3366286/study-argued-chinas-solar-policy-hurt-birds-may-have-miscounted-2-billion-egrets?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-06T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo publicado em uma das revistas científicas mais influentes do mundo sugeriu que a expansão da energia solar incentivada pelo governo na China estava prejudicando a diversidade de aves. No entanto, surgiram acusações de que a análise pode ter contabilizado 2,1 bilhões de gaivotas-pé-branco em um único parque, número maior que a população global da espécie. O estudo levantou debates acalorados nas redes sociais sobre as narrativas negativas associadas ao setor de energia verde da China.", "titulo_pt": "Estudo que afirmou que a política solar chinesa prejudica as aves pode ter contabilizado 2 bilhões de gaivotas em um único parque", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 148706, "titulo": "He wasn’t cut out for space travel. He explored Antarctica instead.", "url": "https://www.japantimes.co.jp/environment/2026/09/06/earth-science/katsutada-kaminuma-antarctic-research/", "fonte_id": "japan_times", "data_pub": "2026-09-06T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Katsutada Kaminuma é um dos principais especialistas em Antártica no Japão, cuja paixão por explorar terras inexploradas o levou a se dedicar a estudos sobre o continente antártico.", "titulo_pt": "Ele não estava destinado para viajar no espaço. Ele explorou a antártica em seu lugar.", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 148798, "titulo": "Germany's Isar Aerospace launches rocket into orbit from Norway", "url": "https://phys.org/news/2026-09-germany-isar-aerospace-rocket-orbit.html", "fonte_id": "phys_org", "data_pub": "2026-09-06T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa alemã Isar Aerospace lançou um foguete em órbita a partir da Noruega no sábado, enquanto a Europa se esforça para aumentar sua capacidade de enviar satélites ao espaço de forma econômica e independente dos Estados Unidos.", "titulo_pt": "Aeronáutica alemã lança foguete em órbita da noruega", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 148801, "titulo": "Indonesia’s most dangerous fires are burning underground", "url": "https://www.sciencedaily.com/releases/2026/09/260904000318.htm", "fonte_id": "science_daily", "data_pub": "2026-09-06T07:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As chamas perigosas do pântano na Indonésia estão aumentando no início da temporada de incêndios de 2026 devido ao El Niño mais forte e a uma severa estiagem que estão secando pântanos que podem queimar por meses debaixo da superfície. Essas chamas lentas e escondidas são particularmente destrutivas porque liberam muito mais partículas finas e poluentes do que os típicos incêndios florestais tropicais, e fumaça densa pode dificultar sua detecção por satélite.", "titulo_pt": "As chamas mais perigosas da indonésia estão queimando subterraneamente", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 148776, "titulo": "Indonesia’s Anak Krakatoa volcano erupts, disrupting flights at 6 airports", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3366530/indonesias-anak-krakatoa-volcano-erupts-disrupting-flights-6-airports?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-06T07:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Aeroporto Internacional de Jakarta parou suas operações após a erupção do vulcão Anak Krakatoa, que disparou cinzas a mais de 150 km de distância, afetando milhares de passageiros. Duas novas erupções foram registradas no domingo.", "titulo_pt": "Vulcão Anak Krakatoa erupta, interrompendo operações em aeroportos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 148799, "titulo": "Haze emergency grips Malaysian Borneo town", "url": "https://phys.org/news/2026-09-haze-emergency-malaysian-borneo-town.html", "fonte_id": "phys_org", "data_pub": "2026-09-06T07:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aneiedade de fumaça aguda pairava sobre a cidade malaysiana de Serian, invadindo casas e envolvendo os estandes de rua, enquanto os residentes enfrentavam uma emergência de qualidade do ar causada por fuligem transfronteiriça proveniente das chamas em curso na Indonésia.", "titulo_pt": "Emergência de neblina assola cidade malaysiana", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 148805, "titulo": "AI can now control fusion plasma faster than humans can react", "url": "https://www.sciencedaily.com/releases/2026/09/260903064215.htm", "fonte_id": "science_daily", "data_pub": "2026-09-06T07:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Princeton testaram um sistema de IA que pode monitorar e controlar plasma de fusão em milissegundos, reagindo muito mais rápido do que um operador humano. Em uma experiência, a IA previu uma instabilidade prejudicial cerca de 200 milissegundos antes de sua ocorrência e ajustou o plasma para impedir sua formação.", "titulo_pt": "IA pode agora controlar plasma de fusão mais rápido do que humanos reagiriam", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 148802, "titulo": "Scientists find a weak spot in one of the deadliest brain cancers", "url": "https://www.sciencedaily.com/releases/2026/09/260903064242.htm", "fonte_id": "science_daily", "data_pub": "2026-09-06T06:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os cientistas identificaram uma nova estratégia que pode enfraquecer as defesas do glioblastoma contra o tratamento, ao bloquear uma proteína chamada SET, o que impede a formação de tumores em modelos pré-clínicos. Alvo de proteínas relacionadas torna as células cancerosas mais vulneráveis à radioterapia.", "titulo_pt": "Cientistas encontram ponto fraco em um dos cânceres cerebrais mais letais", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 148359, "titulo": "Everest está derretendo mais rápido — e xixi de alpinistas pode estar entre as causas", "url": "https://exame.com/ciencia/everest-esta-derretendo-mais-rapido-e-xixi-de-alpinistas-pode-estar-entre-as-causas/", "fonte_id": "exame", "data_pub": "2026-09-06T05:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo calculou o calor gerado pelas atividades no Acampamento Base do Everest e estimou que esse calor é equivalente ao derretimento de 2.492 toneladas de gelo e neve. O xixi de alpinistas pode contribuir para esse fenômeno.", "titulo_pt": "Everest está derretendo mais rápido — e xixi de alpinistas pode estar entre as causas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 148768, "titulo": "Dementia rate of over-65s expected to rise to 10% by 2040", "url": "https://www.koreaherald.com/article/10863897", "fonte_id": "korea_herald", "data_pub": "2026-09-06T03:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A taxa de demência entre pessoas com mais de 65 anos no sul da Coreia deve aumentar para 10% em 2040, de acordo com uma análise do Ministério da Saúde e Assistência Social. A taxa de demência para essa faixa etária está prevista para chegar a 11,81% em 2050.", "titulo_pt": "Taxa de demência entre pessoas acima de 65 anos deve chegar a 10% em 2040, na Coreia do sul", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 148795, "titulo": "In an era of extreme summers, it’s time to look beyond air conditioning", "url": "https://www.scmp.com/opinion/hong-kong-opinion/article/3365989/era-extreme-summers-its-time-look-beyond-air-conditioning?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-06T01:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Departamento de Trabalho recentemente melhorou o sistema de Alerta de Estresse Termal no Trabalho, facilitando o envio de alertas mais elevados para que empregadores e trabalhadores, especialmente aqueles que trabalham ao ar livre, possam reagir rapidamente em dias muito quentes. No entanto, a maior parte das ações que podemos tomar é emitir avisos e recomendar medidas passivas de mitigação, como flexibilizar a escala de trabalho, descansar na sombra e se manter hidratado.", "titulo_pt": "Em uma era de verões extremos, é hora de olhar além do ar condicionado", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 148800, "titulo": "A mysterious signal around Earth could be dark matter", "url": "https://www.sciencedaily.com/releases/2026/09/260904000328.htm", "fonte_id": "science_daily", "data_pub": "2026-09-06T00:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas usaram a Terra como um detector de grande escala, utilizando seu campo magnético e atmosfera, para procurar pela uma das formas mais leves de matéria escura propostas. Embora tenham melhorado os limites para axions ultraleves, encontraram sinais intrigantes de fótons escuros que ainda precisam ser explicados.", "titulo_pt": "Sinal misterioso na terra pode ser matéria escura", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 148803, "titulo": "80,000-year-old “arrowheads” rewrite human history", "url": "https://www.sciencedaily.com/releases/2026/09/260903064233.htm", "fonte_id": "science_daily", "data_pub": "2026-09-06T00:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Arqueólogos identificaram pequenos projetilares de 80.000 anos em Uzbekistão que podem ter sido usados como flechas. A descoberta sugere que tecnologia projetilar sofisticada pode ter aparecido na Ásia Central muito antes da chegada de Homo sapiens na Europa.", "titulo_pt": "80.000-Ano-antiga-'flechas'-re-escrevem-a-história-da-humanidade", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 148807, "titulo": "Heart disease and kidney disease can fuel each other. New guidelines aim to break the cycle", "url": "https://www.sciencedaily.com/releases/2026/09/260902234447.htm", "fonte_id": "science_daily", "data_pub": "2026-09-06T00:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Doenças cardíacas e doenças renais crônicas podem agravar reciprocamente, mas novas diretrizes sugerem que exames simples e tratamentos precoces podem significativamente reduzir os riscos. Testes de sangue e urina, combinados com terapias comprovadas para o coração e os rins, podem auxiliar no diagnóstico precoce e na prevenção de complicações graves.", "titulo_pt": "Doenças cardíacas e renais podem se agravar mutuamente. Novas diretrizes buscam interromper o ciclo", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 148398, "titulo": "Como proteger as boas bactérias da sua boca", "url": "https://www.bbc.com/portuguese/articles/c780ev8nvyqo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-05T23:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A microbiota oral desempenha um papel crucial na manutenção da saúde bucal e corporal. É importante entender quais alimentos contribuem para a manutenção da saúde e da diversidade dos micróbios presentes na boca.", "titulo_pt": "Como proteger as boas bactérias da sua boca", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 148335, "titulo": "Leonardo DiCaprio lança documentário sobre comunidade indígena brasileira", "url": "https://www.cnnbrasil.com.br/pop/cinema/leonardo-dicaprio-lanca-documentario-sobre-comunidade-indigena-brasileira/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-06T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Leonardo DiCaprio lançou um documentário sobre . Essa solicitação visa agilizar o processo e garantir a aplicação da lei de forma mais eficiente.", "titulo_pt": "Ambientalistas e setor de infraestrutura cobram agilidade na análise da lei do licenciamento pelo STF", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 148023, "titulo": "Suíça tenta frear derretimento de geleira com lã de ovelha — e o teste dá resultado", "url": "https://exame.com/ciencia/suica-tenta-frear-derretimento-de-geleira-com-la-de-ovelha-e-o-teste-da-resultado/", "fonte_id": "exame", "data_pub": "2026-09-05T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um experimento na geleira Tsanfleuron na Suíça comparou mantas biodegradáveis feitas de lã de ovelha com coberturas sintéticas usadas para proteger o gelo. O teste mostrou resultados positivos.", "titulo_pt": "Suíça testa lã de ovelha para frear derretimento de geleira e o resultado é positivo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 147655, "titulo": "Nepal demands greater climate justice amid staggering flood costs", "url": "https://www.lemonde.fr/en/economy/article/2026/09/05/nepal-demands-greater-climate-justice-amid-staggering-flood-costs_6757198_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-05T16:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Nepal sofreu grandes danos financeiros devido a uma avalanche de lama, detritos e gelo em 26 de agosto, com estimativas de dano entre 4 e 5 bilhões de dólares. O desastre afetou setores-chave do país, como o turismo e a energia hidrelétrica.", "titulo_pt": "Nepal pede por maior justiça climática diante dos custos astronômicos das cheias", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 147429, "titulo": "Tufão Saudel provoca deslizamento na China; 1 morre e 11 desaparecem", "url": "https://www.infomoney.com.br/mundo/tufao-saudel-deslizamento-china-morto-desaparecidos/", "fonte_id": "infomoney", "data_pub": "202 function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">

    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });

}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
