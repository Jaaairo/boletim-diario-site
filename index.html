<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

avançaram em direção ao palácio presidencial em um tentativo de golpe. Na Somália, forças turcas e somalias libertaram um navio sequestrado por piratas, resultando nas mortes de 14 suspeitos de serem piratas e na destruição de quatro embarcações usadas pelos atacantes. Em Nepal, a ira está crescendo entre sobreviventes de inundações repentinamente, que acusam o governo de atrasos na entrega de ajuda e na localização de parentes desaparecidos. Por fim, o ex-conselheiro de Trump Gabriel Perez pagou uma multa de $65.000 e devolveu mais de $107.000 em lucros ilícitos em uma investigação envolvendo o uso de informações confidenciais.\n\nO Irã declarou que manterá o fechamento do Estreito de Ormuz até que as ações militares dos Estados Unidos contra o país cessem, conforme informado pela Guarda Revolucionária Iraniana. No contexto geopolítico, Israel atacou um comandante do Hamas dentro de um hospital em Gaza, contribuindo para a instabilidade no cessar-fogo estabelecido em outubro de 2025. A construção do muro fronterizo de 100 quilômetros entre Arizona e México avança em uma área que a Nação Tohono O’odham considera parte do seu território ancestral. Além disso, o número de mortos em enchentes no Nepal e na China ultrapassou 680, com cerca de 3.000 pessoas desaparecidas nos dois países, e o Irã prometeu resistir às sanções impostas pelos Estados Unidos, afirmando que diplomacia e defesa são inseparáveis.", "economia": "Em 2026, o Brasil foi classificado no top 5 dos melhores países para estrangeiros viverem, de acordo com um ranking. Este reconhecimento destaca o atraente cenário econômico e de qualidade de vida do país. Os Correios, por outro lado, registraram um prejuízo de R$ 2,4 bilhões no segundo trimestre de 2026, representando uma redução de 5,5% em comparação com o mesmo período do ano anterior. O governo Lula anunciou exportações de produtos agrícolas para a Costa Rica, Malásia e Nigéria, ampliando assim o alcance de suas vendas internacionais. Além disso, o Federal Reserve pode ter mudado sua abordagem, focando em um caminho prospectivo, conforme sugerido pelo evento de Jackson Hole. Estes eventos refletem a diversidade de notícias econômicas em andamento, abrangendo desde o desempenho das empresas e setores até questões internacionais e políticas governamentais.", "tecnologia": "A NASA está se preparando para lançar o Telescópio Espacial Nancy Grace Roman, que será usado por cientistas para investigar mistérios do universo. Este lançamento, programado para um horário ainda não divulgado, representa um avanço significativo na pesquisa espacial. Paralelamente, a Sony Music e a Warner Music ingressaram com uma ação judicial contra a Anthropic, acusando-a de pirataria no treinamento de inteligência artificial, destacando questões legais e éticas em torno do uso de dados musicais. A indústria automotiva também está evoluindo com a adoção da arquitetura zonal, que promete simplificar a estrutura elétrica dos veículos e facilitar o desenvolvimento de tecnologias inovadoras.", "ciencia": "Um estudo da NASA, liderado pelo engenheiro Nshan Kazaryan, que foi responsável pela comunicação com as sondas Voyager 1 e Voyager 2, busca estender a vida útil dessas naves espaciais, que foram lançadas há quase 50 anos. O projeto é crucial para a continuidade das missões científicas que as sondas Voyager estão realizando, explorando os limites do sistema solar e além. Paralelamente, cientistas sul-africanos estão investigando a causa das mortes em massa de sardinhas no país, suspeitando que um herpesvírus, o PHV, possa estar envolvido. Este é o primeiro registro do vírus em sardinhas, destacando a importância de estudos mais aprofundados sobre a saúde marinha. Ao mesmo tempo, pesquisadores do Instituto Charles de Praga desenvolveram um photocatodo avançado que converte gás de efeito estufa em etanol usando luz solar, uma tecnologia que pode ter implicações significativas na produção de combustíveis verdes e sustentáveis.", "cultura": "A indústria de beleza sul-coreana, conhecida como K-Beauty, tem se destacado no mercado global, superando os Estados Unidos para se tornar a segunda maior exportadora de cosméticos do mundo. Este fenômeno cultural não se limita apenas à produção e comercialização de produtos, mas também influencia tendências estéticas e de cuidados pessoais. Em outro destaque, a série 'Alucinação', que explorará a juventude e a maturidade do cantor e compositor Belchior, traz à tona a importância da cultura brasileira e sua representatividade no cenário artístico. Além disso, a cantora Kacey Musgraves homenageou Dolly Parton com uma performance dupla em Boston, destacando a influência mútua entre artistas e a continuidade da tradição musical americana.", "sociedade": "Um homem foi preso após esfaquear sua companheira na Praça do Bicalho, em Taguatinga, no Distrito Federal, levando-a ao Hospital Regional de Taguatinga em estado grave. Em Guarulhos, São Paulo, quatro indivíduos que se passavam por policiais civis foram detidos pela polícia militar. Eles eram vistos com uniformes da Polícia Civil e uma pistola calibre 380 em um carro furtado. Na cidade de Nova York, jovens estão buscando formas atípicas de se sustentar, como viver com freiras ou dividir casas com idosos, devido a dificuldades econômicas. Em uma comunidade indígena no Distrito Federal, um incêndio atingiu residências, mas não houve feridos. O governo do Nepal solicitou apoio técnico para localizar quase 3 mil desaparecidos, recusando equipes estrangeiras de resgate. Além disso, estima-se que 93,6% das vítimas de violência doméstica no Brasil não estejam registradas oficialmente. A Europa lidera os casos de violência doméstica contra brasileiras no exterior em 2024, com 45% dos registros.", "meio_ambiente": "Em 26 de agosto, um desastre causado por enxurradas catastróficas na região Himalayense da fronteira entre Nepal e Tibet deixou mais de 600 mortos e milhares desaparecidos, incluindo 933 funcionários de centrais hidroelétricas e 622 turistas estrangeiros. As autoridades consideram que este evento é um alerta para as futuras consequências da mudança climática. Em outros lugares, o Instituto Nacional de Meteorologia (Inmet) emitiu um alerta para regiões que podem experimentar um nível muito baixo de umidade do ar, comparável a desertos como o Saara, enquanto o Cemaden prevê pelo menos seis ondas de calor no Brasil devido ao fenômeno El Niño forte. A biodiversidade está se integrando na gestão corporativa com o Marco Global da Biodiversidade e o TNFD, incentivando as empresas a serem mais transparentes e a gerir os riscos relacionados à natureza. Além disso, kits solares plugáveis, que custam aproximadamente R$1.000, podem pagar-se em três anos, de acordo com um especialista, e sua legalização no Brasil, como no Reino Unido, poderia economizar até R$370 por ano nas contas de energia dos brasileiros e ajudar no combate às mudanças climáticas.", "direitos_humanos": "A situação dos direitos humanos em vários países continua preocupante. No Nepal, cerca de 900 trabalhadores de usinas de energia estão desaparecidos, com 361 já resgatados, o que levanta preocupações sobre a segurança e os direitos desses trabalhadores. Em um caso judicial no Brasil, a justiça decidiu soltar Germán Andrés Naranjo Maldini, um chileno preso por ofensas racistas e homofóbicas durante um voo da Latam, após considerar alterações no processo. Internamente, a Procuradoria Federal da República investiga a venda de mercúrio a garimpeiros ilegais na Amazônia através do TikTok, o que denota preocupações com a segurança ambiental e social. No exterior, a situação dos refugiados em Gaza continua sendo um desafio, com críticas à afirmação israelense sobre a melhora nas estatísticas de malnutrição. A UNICEF comemorou a libertação de mulheres e crianças no Haiti, apelando por uma proteção mais forte para as crianças no país."}, "resumo_do_dia": {"politica_nacional": [{"id": 132693, "titulo": "Renan Santos defende tecnologia para reduzir fila do SUS e nova reforma trabalhista", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/08/29/renan-santos-defende-ia-para-reduzir-fila-do-sus-e-reforma-para-formalizar-trabalho-por-aplicativo.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-29T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Renan Santos, candidato pelo Missão à Presidência, defendeu a implementação de um prontuário único eletrônico com inteligência artificial no SUS e uma nova reforma trabalhista para proteger trabalhadores de aplicativos e informais. O candidato apontou a falta de integração dos dados de saúde como uma das principais causas das dificuldades no sistema.", "titulo_pt": "Renan Santos defende tecnologia para reduzir fila do SUS e nova reforma trabalhista", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 132677, "titulo": "Lula convida empresários e banqueiros para jantar no Alvorada, e campanha busca aproximação com PIB", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/lula-convida-empresarios-e-banqueiros-para-jantar-no-alvorada-e-campanha-busca-aproximacao-com-pib.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-29T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva (PT) convidou empresários e banqueiros para um jantar no Palácio da Alvorada na segunda-feira (31). A campanha do presidente busca aproximar-se desses setores econômicos.", "titulo_pt": "Lula convida empresários e banqueiros para jantar no Alvorada, e campanha busca aproximação com o PIB", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 132698, "titulo": "Flávio Bolsonaro apoia exploração de petróleo na Foz do Amazonas", "url": "https://veja.abril.com.br/brasil/flavio-bolsonaro-apoia-exploracao-de-petroleo-na-foz-do-amazonas/", "fonte_id": "veja", "data_pub": "2026-08-29T21:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro defendeu a exploração de petróleo na Foz do Amazonas durante um evento de campanha. O candidato apresentou suas propostas para o setor energético no mesmo encontro.", "titulo_pt": "Flávio Bolsonaro apoia exploração de petróleo na Foz do Amazonas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 132684, "titulo": "Filho de Eymael herda jingle histórico do pai para candidatura a deputado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/filho-de-eymael-herda-jingle-historico-do-pai-para-candidatura-a-deputado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-29T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "José Carlos Eymael, filho de José Maria Eymael, está concorrendo a deputado federal por São Paulo usando o jingle e o nome de urna do pai.", "titulo_pt": "Filho de Eymael herda jingle histórico do pai para candidatura a deputado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 132783, "titulo": "Justiça condena Estado de Goiás a indenizar goleiro baleado por PM em campo", "url": "https://www.metropoles.com/distrito-federal/entorno/justica-condena-estado-de-goias-a-indenizar-goleiro-baleado-por-pm-em-campo", "fonte_id": "metropoles", "data_pub": "2026-08-29T20:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O goleiro Ramon Souza foi baleado com um tiro de bala de borracha disparado por um policial militar durante um jogo de futebol em Goiás. O Estado de Goiás foi condenado a pagar indenização por danos morais ao goleiro.", "titulo_pt": "Justiça condena Estado de Goiás a indenizar goleiro baleado por PM em campo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 132785, "titulo": "Justiça blinda Serrinha do Paranoá contra futuras negociações imobiliárias", "url": "https://www.metropoles.com/colunas/grande-angular/justica-blinda-serrinha-do-paranoa-contra-futuras-negociacoes-imobiliarias", "fonte_id": "metropoles", "data_pub": "2026-08-29T20:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Vara do Meio Ambiente proibiu a inclusão da Serrinha do Paranoá em futuras negociações imobiliárias. O local havia sido considerado para operações de capitalização do BRB.", "titulo_pt": "Justiça protege Serrinha do Paranoá de futuras negociações imobiliárias", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 132742, "titulo": "Em Angra, Flávio defende destravar licenças ambientais para liberar resorts", "url": "https://www.cnnbrasil.com.br/eleicoes/em-angra-flavio-defende-destravar-licencas-ambientais-para-liberar-resorts/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T20:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio, candidato do PL, defendeu a destravação de licenças ambientais para permitir a construção de resorts e a conclusão das obras da usina de Angra 3.", "titulo_pt": "Flávio defende destravar licenças ambientais e conclui obras de Angra 3", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 132685, "titulo": "Alckmin reúne ex-secretários de SP que lançam manifesto em apoio a Haddad", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/alckmin-reune-ex-secretarios-de-sp-que-lancam-manifesto-em-apoio-a-haddad.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-29T20:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ex-secretários do estado de São Paulo lançaram um manifesto em defesa de Fernando Haddad (PT) para governar o estado. Geraldo Alckmin (PSB), vice-presidente, articulou a iniciativa após já ter governado o estado quatro vezes.", "titulo_pt": "Ex-secretários de SP lançam manifesto em apoio a Haddad", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 132752, "titulo": "Lula defende igualdade de gênero em cargos de gestão em evento com mulheres", "url": "https://www.cnnbrasil.com.br/eleicoes/lula-defende-igualdade-de-genero-em-cargos-de-gestao-em-evento-com-mulheres/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T19:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula defendeu a igualdade de gênero em cargos de gestão durante um evento com mulheres, destacando a votação do fim da escala 6x1 que permite a mulheres e homens terem mais tempo para cuidar de suas vidas pessoais.", "titulo_pt": "Lula defende igualdade de gênero em cargos de gestão em evento com mulheres", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 132706, "titulo": "Ato de Lula em Belo Horizonte tem manifestação de petistas insatisfeitos", "url": "https://veja.abril.com.br/brasil/ato-de-lula-em-belo-horizonte-tem-manifestacao-de-petistas/", "fonte_id": "veja", "data_pub": "2026-08-29T19:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Houve uma manifestação de petistas insatisfeitos durante um ato de Lula em Belo Horizonte. Os petistas reclamaram sobre a divisão de recursos de campanha dentro do partido.", "titulo_pt": "Ato de Lula em Belo Horizonte tem petistas insatisfeitos com divisão de recursos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 132694, "titulo": "Lula, Flávio Bolsonaro, Caiado e Augusto Cury estreiam propaganda eleitoral no rádio e na TV; veja estratégias", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/29/lula-flavio-bolsonaro-caiado-e-augusto-cury-estreiam-propaganda-eleitoral-no-radio-e-na-tv-veja-estrategias.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-29T19:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Neste sábado (29), Lula, Flávio Bolsonaro, Ronaldo Caiado e Augusto Cury exibiram seus primeiros programas de propaganda eleitoral gratuita no rádio e na TV, conforme determina a lei eleitoral. Os tempos variaram entre 35 segundos e 5 minutos e 31 segundos para cada candidato.", "titulo_pt": "Lula, Flávio Bolsonaro, Caiado e Augusto Cury estreiam propaganda eleitoral no rádio e na TV; veja os tempos", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 132686, "titulo": "Em Angra, Flávio Bolsonaro defende Angra 3 e licenças para obras de resorts", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/em-angra-flavio-bolsonaro-defende-angra-3-e-licencas-para-obras-de-resorts.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-29T19:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro, candidato à Presidência, defendeu a ampliação da geração nuclear e o destravamento de licenças ambientais para obras de infraestrutura, incluindo resorts, durante uma visita a Angra. Ele considera o setor de energia uma prioridade para o seu eventual governo.", "titulo_pt": "Flávio Bolsonaro defende energia nuclear e licenças para resorts em Angra", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 132707, "titulo": "Lula inicia horário eleitoral em situação desconfortável, afirma cientista político", "url": "https://veja.abril.com.br/politica/lula-inicia-horario-eleitoral-em-situacao-desconfortavel-afirma-cientista-politico/", "fonte_id": "veja", "data_pub": "2026-08-29T19:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cientista político observa que, em 2006, Lula utilizou a estrutura do governo para minimizar o impacto do escândalo do mensalão e chegou perto de vencer nas primeiras votações. A situação atual de Lula é considerada desconfortável.", "titulo_pt": "Lula inicia horário eleitoral em situação desconfortável, afirma cientista político", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 132708, "titulo": "Governo planeja aporte de 6 bilhões aos Correios em 2027", "url": "https://veja.abril.com.br/brasil/governo-planeja-aporte-de-6-bilhoes-aos-correios-em-2027/", "fonte_id": "veja", "data_pub": "2026-08-29T19:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo planeja investir 6 bilhões de reais nos Correios em 2027, como parte de esforços para reestruturar a empresa. Os Correios já recorreram a um empréstimo de 12 bilhões de reais em 2025.", "titulo_pt": "Governo planeja aporte de 6 bilhões aos Correios em 2027", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 132687, "titulo": "Justiça de SP nega recurso do governo e mantém agências em contrato de comunicação", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/justica-de-sp-nega-recurso-do-governo-e-mantem-agencias-em-contrato-de-comunicacao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-29T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal de Justiça de São Paulo negou um recurso do governo Tarcísio para desfazer um contrato com a agência de publicidade Cálix, que está envolvida na Secretaria de Comunicação do governo.", "titulo_pt": "Justiça de SP mantém agência cálix em contrato de comunicação", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 132688, "titulo": "Advogada interrompe décadas de hegemonia de Eymael na candidatura do DC à Presidência", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/advogada-interrompe-decadas-de-hegemonia-de-eymael-na-candidatura-do-dc-a-presidencia.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-29T18:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A candidatura do Democratas (DC) à Presidência não contará com a figura tradicional de Eymael. A partido escolheu Clariana Zacarkim Barão, uma advogada de 39 anos que nunca disputou uma eleição.", "titulo_pt": "Advogada interrompe décadas de hegemonia de Eymael na candidatura do DC à Presidência", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 132583, "titulo": "US to control 65 billion barrels of Venezuelan oil, Trump announces", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/30/2003863361", "fonte_id": "taipei_times", "data_pub": "2026-08-30T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos anunciará o controle de 65 bilhões de barris de petróleo venezuelano. Donald Trump fez o anúncio.", "titulo_pt": "EUA anunciam controle de 65 bilhões de barris de petróleo venezuelano", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 133001, "titulo": "Is the Irtysh River the choke-free Arctic shipping gateway that China needs?", "url": "https://www.scmp.com/news/china/diplomacy/article/3365692/irtysh-river-choke-free-arctic-shipping-gateway-china-needs?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-29T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "China e Rússia estariam considerando a possibilidade de transformar um grande rio em uma rota de transporte de cargas para o resto do mundo, com o Irtysh River, de 4.248 km, central na esteira desse projeto, servindo como uma alternativa à rota marítima global.", "titulo_pt": "O Irtysh River: a rota de cargas segura para o ártico que China precisa?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 132923, "titulo": "Israeli Settlers Attack Palestinians, Drawing Sharp Rebukes", "url": "https://www.nytimes.com/2026/08/29/world/middleeast/israel-settlers-west-bank-attacks-netanyahu-rebuke.html", "fonte_id": "nyt_world", "data_pub": "2026-08-29T21:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israelenses sequestraram palestinos em uma agressão violenta no sábado, o que levou a fortes repreensões de Benjamin Netanyahu e outros responsáveis.", "titulo_pt": "Israelenses atacam palestinos, recebendo fortes repreensões", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 132924, "titulo": "‘A New Form of U.S. Colonialism’: Venezuelans Bristle at U.S. Oil Takeover", "url": "https://www.nytimes.com/2026/08/29/world/americas/venezuela-oil-us-takeover.html", "fonte_id": "nyt_world", "data_pub": "2026-08-29T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um acordo que dá controle majoritário dos vastos reservatórios de petróleo venezuelanos para os Estados Unidos está atingindo o núcleo da identidade nacional venezuelana.", "titulo_pt": "Uma nova forma de colonialismo dos EUA: venezuelanos reagem a tomada de controle do petróleo", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 132960, "titulo": "Israeli army says struck Hamas commander in Gaza hospital compound", "url": "https://www.lemonde.fr/en/international/article/2026/08/29/israeli-army-says-struck-hamas-commander-in-gaza-hospital-compound_6756975_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-29T21:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O exército israelense afirma ter atingido um comandante do Hamas no complexo do Hospital Al-Aqsa Martyrs em Deir al-Balah, na Gaza central, embora não possa confirmar imediatamente se ele foi morto. Uma agência de defesa civil de Gaza, operada pelo Hamas, relatou que quatro pessoas morreram em outros ataques na região no sábado.", "titulo_pt": "Exército israelense diz ter atingido comandante do Hamas em hospital de Gaza", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 133011, "titulo": "N. Korea replaces defense minister with Kim Song-gi in military reshuffle: state media", "url": "https://en.yna.co.kr/view/AEN20260830000300315", "fonte_id": "yonhap_news", "data_pub": "2026-08-29T21:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Norte Coreano substituiu seu ministro da Defesa, Kim Jong-un, por Kim Song-gi em uma reorganização militar.", "titulo_pt": "Norte Coreia substitui ministro da defesa com Kim Song-gi em reorganização militar", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 132987, "titulo": "Hormuz remains closed until US military actions end, Iran says", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/hormuz-remains-closed-until-us-military-actions-end-iran-says", "fonte_id": "middle_east_eye", "data_pub": "2026-08-29T21:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Guarda Revolucionária Iraniana afirmou que o Estreito de Ormuz permanece fechado até que as ações militares dos Estados Unidos contra o Irã terminem. O porta-voz do Ministério dos Assuntos Exteriores iraniano, Kazem Gharibabadi, reiterou que o estreito permanece fechado e que Teerã não está pressionado para reabri-lo.", "titulo_pt": "Ormuz permanecerá fechado até que as ações militares dos EUA terminem, diz Irã", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 132844, "titulo": "Oficial y confirmado: avanza la construcción del muro fronterizo de 100 kilómetros entre Arizona y México", "url": "https://www.lanacion.com.ar/estados-unidos/arizona/oficial-y-confirmado-avanza-la-construccion-del-muro-fronterizo-de-100-kilometros-entre-arizona-y-nid30082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-29T21:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A construção do muro fronterizo de 100 quilômetros entre Arizona e México avança, em uma área que a Nação Tohono O’odham considera parte do seu território ancestral.", "titulo_pt": "Oficial e confirmado: avanço na construção do muro fronterizo de 100 quilômetros entre Arizona e México", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 132996, "titulo": "Ranucci contesta formalmente la rimozione da Report, 'è illegittima'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/29/ranucci-contesta-formalmente-la-rimozione-da-report-e-illegittima_bb5e1a6c-d460-4376-9880-a8bba92fee42.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-29T21:10:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O advogado de Ranucci pediu esclarecimentos e documentos à RAI sobre a remoção de seu programa da emissora. Ranucci contesta formalmente a remoção de seu programa da emissora, considerando-a ilegítima.", "titulo_pt": "Ranucci contesta formalmente a remoção de seu programa da rai", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 132951, "titulo": "Milo Yiannopoulos, far-right critic of U.S. immigration, is deported from U.S.", "url": "https://www.npr.org/2026/08/29/nx-s1-5948731/milo-yiannopoulos-arrested-overstaying-us-visa", "fonte_id": "npr_news", "data_pub": "2026-08-29T21:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milo Yiannopoulos, um comentarista controverso que criticava o feminismo e o Islã, foi deportado dos Estados Unidos. Ele era um apoiador entusiasta das medidas de repressão à imigração do presidente Trump.", "titulo_pt": "Milo Yiannopoulos, crítico da imigração nos EUA, é deportado", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 132713, "titulo": "Venezuela confirma acordo com EUA sobre petróleo", "url": "https://www.poder360.com.br/poder-internacional/venezuela-confirma-acordo-com-eua-sobre-petroleo/", "fonte_id": "poder360", "data_pub": "2026-08-29T21:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Venezuela confirmou um acordo com os Estados Unidos sobre petróleo. Delcy Rodríguez declarou que essa iniciativa reflete o fortalecimento das relações bilaterais entre os países.", "titulo_pt": "Venezuela confirma acordo com EUA sobre petróleo", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 132973, "titulo": "Anger mounts in Nepal over the government’s response to flash flood", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/29/anger-mounts-in-nepal-over-the-governments-response-to-flash-flood?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-29T20:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ira cresce no Nepal enquanto sobreviventes das cheias acusam o governo de atrasos na entrega de ajuda e na localização de parentes desaparecidos.", "titulo_pt": "Aira cresce no Nepal em relação à resposta do governo às cheias", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 132672, "titulo": "Soldados atacam aeroporto em tentativa de golpe no Níger, diz governo militar", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/08/soldados-atacam-aeroporto-em-tentativa-de-golpe-no-niger-diz-governo-militar.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-29T20:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Soldados atacaram o principal aeroporto internacional de Niamey, capital do Níger, e avançaram em direção ao palácio presidencial. Eles também tomaram temporariamente a emissora nacional nas primeiras horas de sábado.", "titulo_pt": "Soldados atacam aeroporto em niamey em tentativa de golpe, diz governo militar", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 132970, "titulo": "Turkish, Somali forces free vessel seized by pirates in Somalia", "url": "https://www.dw.com/en/turkish-somali-forces-free-vessel-seized-by-pirates-in-somalia/a-78560087?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-29T20:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças turcas e somalis libertaram o navio MV LUTUF, que havia sido sequestrado por piratas perto da costa da Somália. A operação de 10 dias resultou na morte de 14 suspeitos de serem piratas e na destruição de quatro barcos utilizados pelos atacantes.", "titulo_pt": "Turcos e somalis libertam navio sequestrado por piratas na somália", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 132961, "titulo": "Netanyahu condemns settler attack in flashpoint West Bank village", "url": "https://www.lemonde.fr/en/international/article/2026/08/29/netanyahu-condemns-settler-attack-in-flashpoint-west-bank-village_6756974_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-29T20:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Soldados e policiais fronteiriços israelenses foram enviados após relatos de que radicais israelenses haviam chegado à área e que confrontos violentos ocorreram, incluindo a arremessação de pedras contra palestinos e civis adicionais. O presidente Isaac Herzog condenou o ataque, e o ministério das Relações Exteriores de Israel o chamou de 'escândalo'.", "titulo_pt": "Netanyahu condena ataque dos setleres em vilarejo álgido da cisjordânia", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 132875, "titulo": "El Ejército de EE UU derriba con láser tres drones cerca de la frontera con México", "url": "https://elpais.com/mexico/2026-08-29/el-ejercito-de-ee-uu-derriba-con-laser-tres-drones-cerca-de-la-frontera-con-mexico.html", "fonte_id": "elpais_america", "data_pub": "2026-08-29T20:36:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Exército dos Estados Unidos utilizou um laser para derrubar três drones perto da fronteira com o México. A operação ocorreu na região texana de Reynosa e visava dispositivos usados por traficantes de imigrantes indocumentados para monitorar autoridades.", "titulo_pt": "Exército dos EUA derroba com laser três drones perto da fronteira com México", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 132759, "titulo": "Varejo enfrenta tri difícil, mas C&A se destaca, diz Morgan Stanley", "url": "https://www.infomoney.com.br/mercados/varejo-enfrenta-tri-dificil-mas-ca-se-destaca-diz-morgan-stanley/", "fonte_id": "infomoney", "data_pub": "2026-08-29T22:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O varejo brasileiro enfrenta desafios, com o Mercado Livre consolidando sua liderança e concorrentes locais continuando a ter dificuldades. A C&A se destaca neste cenário.", "titulo_pt": "Varejo enfrenta tri difícil, mas C&A se destaca, diz Morgan Stanley", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 132761, "titulo": "Tarcísio diz que Flávio já prestou esclarecimentos sobre ‘Dark Horse’", "url": "https://www.infomoney.com.br/politica/tarcisio-diz-que-flavio-ja-prestou-esclarecimentos-sobre-dark-horse/", "fonte_id": "infomoney", "data_pub": "2026-08-29T21:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador Tarcísio disse que Flávio Bolsonaro já prestou esclarecimentos sobre o caso 'Dark Horse'. Além disso, Flávio participará do programa eleitoral de Tarcísio, assim como o senador também será incluído em algumas peças.", "titulo_pt": "Tarcísio afirma que Flávio já prestou esclarecimentos sobre 'Dark Horse'", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 132679, "titulo": "Prejuízo dos Correios cai no 2º trimestre de 2026 e soma R$ 2,4 bilhões", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/prejuizo-dos-correios-cai-no-2o-trimestre-de-2026-e-soma-r-24-bilhoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-29T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Correios registraram um prejuízo de R$ 2,4 bilhões no segundo trimestre de 2026, representando uma redução de 5,5% em comparação com o prejuízo de R$ 2,53 bilhões no mesmo período do ano anterior. O resultado foi uma melhora de 24,4% em relação ao prejuízo de R$ 3,16 bilhões observado no primeiro trimestre de 2026.", "titulo_pt": "Prejuízo dos Correios cai no 2º trimestre de 2026 e soma R$ 2,4 bilhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 132937, "titulo": "El dilema de la próxima presidencia del Banco Central ante el fin del mandato de Rosanna Costa", "url": "https://www.latercera.com/pulso/noticia/el-dilema-de-la-proxima-presidencia-del-banco-central-ante-el-fin-del-mandato-de-rosanna-costa/", "fonte_id": "la_tercera", "data_pub": "2026-08-29T21:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Rosanna Costa, economista que está no comando do Banco Central há cinco anos, encerrará seu mandato em fevereiro. O presidente Kast e o ministro Quiroz decidirão se ela continuará como presidente até 2029 ou se haverá um novo líder, o que exigiria sua renúncia. Sebastián Claro, Felipe Larraín e Juan Andrés Fontaine são possíveis alternativas para o cargo.", "titulo_pt": "O dilema da próxima presidência do Banco Central diante do fim do mandato de Rosanna Costa", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 132765, "titulo": "Setores de comércio, serviços e turismo lançam campanha para adiar votação da 6×1", "url": "https://www.infomoney.com.br/politica/setores-de-comercio-servicos-e-turismo-lancam-campanha-para-adiar-votacao-da-6x1/", "fonte_id": "infomoney", "data_pub": "2026-08-29T20:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entidades do comércio, serviços e turismo lançaram uma campanha para adiar a votação da proposta 6×1. Eles argumentam que a discussão do tema deva aguardar após as eleições e alertam para os riscos econômicos associados.", "titulo_pt": "Setores de comércio, serviços e turismo lançam campanha para adiar votação da 6×1", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 132766, "titulo": "Guerra pesa sobre economia do Irã, conforme EUA intensificam sanções", "url": "https://www.infomoney.com.br/mundo/guerra-pesa-sobre-economia-do-ira-conforme-eua-intensificam-sancoes/", "fonte_id": "infomoney", "data_pub": "2026-08-29T19:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A guerra comercial entre EUA e Irã continua, com as sanções americanas sendo intensificadas. Teerã afirma que não recuará diante da pressão dos Estados Unidos.", "titulo_pt": "Guerra comercial pesa na economia do Irã, enquanto EUA aumentam sanções", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 132680, "titulo": "Por que restaurantes estão acabando com as gorjetas nos EUA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/por-que-restaurantes-estao-acabando-com-as-gorjetas-nos-eua.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-29T19:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A sommelier Caroline Kraetzer ganha US$ 40 por hora em São Francisco, quase o dobro do que recebem a maioria dos profissionais de serviços locais. Este aumento salarial está sendo adotado em restaurantes para eliminar as gorjetas.", "titulo_pt": "Por que restaurantes nos EUA estão aumentando os salários para eliminar as gorjetas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 132767, "titulo": "Novo Desenrola: programa de renegociação de dívidas termina nesta segunda-feira", "url": "https://www.infomoney.com.br/minhas-financas/novo-desenrola-programa-de-renegociacao-de-dividas-termina-nesta-segunda-feira/", "fonte_id": "infomoney", "data_pub": "2026-08-29T19:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O programa Novo Desenrola, que oferecia renegociação de dívidas para consumidores com renda de até cinco salários mínimos, terminou nesta segunda-feira. O programa atendeu a esses consumidores oferecendo condições mais favoráveis para quitação de débitos.", "titulo_pt": "Novo Desenrola: programa de renegociação de dívidas encerra nesta segunda-feira", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 132768, "titulo": "Colonos israelenses realizam ai-corta-acesso-de-empresa-comprada-por-spacex-e-alfineta-musk/", "fonte_id": "olhar_digital", "data_pub": "2026-08-29T18:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OpenAI anunciou que vai encerrar o acesso da plataforma Cursor aos seus modelos de inteligência artificial. A empresa, recentemente adquirida pela SpaceX, terá seu acesso cortado.", "titulo_pt": "Openai corta acesso de empresa comprada por SpaceX", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 133007, "titulo": "Sony Music and Warner Chappell are suing Anthropic", "url": "https://www.theverge.com/ai-artificial-intelligence/986438/sony-music-warner-chappell-anthropic-lawsuit-copyright", "fonte_id": "the_verge", "data_pub": "2026-08-29T18:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sony Music e Warner Chappell ajuizaram uma ação contra a Anthropic na Corte Distrital dos Estados Unidos para o Noroeste da Califórnia, pedindo danos por milhares de obras autorais protegidas por direitos autorais, solicitando até US$ 150.000 por obra e até US$ 25.000 por caso em que dados de copyright identificáveis foram removidos.", "titulo_pt": "Sony Music e Warner Chappell agridem Anthropic em ação judicial", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 132850, "titulo": "Los especialistas en neurología coinciden: no sirven las siestas prolongadas para compensar deudas de sueño", "url": "https://www.lanacion.com.ar/sociedad/los-especialistas-en-neurologia-coinciden-no-sirven-las-siestas-prolongadas-para-compensar-deudas-de-nid29082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-29T21:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Especialistas em neurologia concordam que as siestas prolongadas não compensam as deudas de sono. Pablo Ferrero, um neurólogo, detalhou aspectos importantes para otimizar o descanso, incluindo a escolha do equipamento e hábitos noturnos necessários.", "titulo_pt": "Especialistas em neurologia concordam: siestas prolongadas não compensam deudas de sono", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 133009, "titulo": "Strategic irrigation stress can lift lucerne seed yield and returns", "url": "https://phys.org/news/2026-08-strategic-irrigation-stress-lucerne-seed.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O cultivo de sementes de lucerne não necessariamente produz mais se receber mais água. Um experimento de cinco anos, realizado perto de Keith, no Sul da Austrália, mostrou que adiar estratégicamente a irrigação até que as plantas mostrassem sinais precoces de caída das folhas geralmente aumentou a produção de sementes e forneceu a maior margem bruta constante.", "titulo_pt": "Irrigação estratégica pode aumentar a produção de sementes de lucerne e lucratividade", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132746, "titulo": "Especialistas no Chile alertam que geleiras dos Andes podem repetir Nepal", "url": "https://www.cnnbrasil.com.br/internacional/especialistas-no-chile-alertam-que-geleiras-dos-andes-podem-repetir-nepal/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas chilenos alertam que geleiras dos Andes podem sofrer um destino semelhante ao que afetou geleiras no Nepal. Pesquisadores recomendam um monitoramento mais rigoroso de áreas montanhosas, utilizando observações por satélite, drones, estações meteorológicas e modelos hidrodinâmicos.", "titulo_pt": "Especialistas no Chile alertam que geleiras dos Andes podem repetir Nepal", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133010, "titulo": "Airborne tuberculosis bacteria may mutate as they dry, revealing a target to curb drug resistance", "url": "https://phys.org/news/2026-08-airborne-tuberculosis-bacteria-mutate-dry.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tuberculócitos expelidos no ar dos indivíduos infectados seca e forma partículas infecciosas, sendo apenas superadas pela varicela em contagiosidade. Estudos realizados por investigadores da Weill Cornell Medicine descobriram mecanismos específicos que permitem que os tuberculócitos não apenas sobrevivam à secagem, mas também gerem mutações relacionadas à resistência antimicrobiana, sugerindo que a transmissão envolve mais do que o simples movimento passivo de bactérias entre pessoas e pode ser um período durante o qual o patógeno evolui.", "titulo_pt": "Bactérias de tuberculose no ar podem mutar à medida que secam, indicando um alvo para combater a resistência a medicamentos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132747, "titulo": "‘Supermachos’ são criados por cientistas para combater espécie invasora de peixe", "url": "https://www.cnnbrasil.com.br/ciencia/supermachos-sao-criados-por-cientistas-para-combater-especie-invasora-de-peixe/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T19:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas criaram trutas-das-fontes que são todos machos, com o objetivo de combater uma espécie invasora de peixe. A população resultante será composta apenas por machos idosos, incapazes de se reproduzir.", "titulo_pt": "Supermachos de truta são criados para combater espécie invasora de peixe", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 132621, "titulo": "How everyday household tasks impact relationships", "url": "https://phys.org/news/2026-08-everyday-household-tasks-impact-relationships.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa da Universidade de Queensland examinou os impactos das tarefas domésticas no bem-estar das relações casais, considerando os carregamentos físico, cognitivo e emocional associados à administração da casa. O estudo analisou o que é chamado de 'tri-load' doméstico, que inclui tarefas físicas, cognitivas e emocionais.", "titulo_pt": "Como tarefas domésticas diárias afetam as relações", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132622, "titulo": "Most people would sacrifice some life satisfaction in exchange for a more equal society", "url": "https://phys.org/news/2026-08-people-sacrifice-life-satisfaction-exchange.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa questiona qual tipo de sociedade as pessoas prefeririam viver, uma igualitária com baixo padrão de vida geral ou uma desigual com maioria prosperando, mas minoria em dificuldades. Ela sugere uma escolha entre sociedades antes do nascimento sem conhecimento do próprio destino.", "titulo_pt": "A maioria sacrificaria algum nível de satisfação pessoal por uma sociedade mais igualitária", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132623, "titulo": "How plastic welds retain a molecular 'memory' of their former surfaces to strengthen pipe joints", "url": "https://phys.org/news/2026-08-plastic-welds-retain-molecular-memory.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T17:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A soldagem de plástico é uma parte crucial da engenharia diária, especialmente para evitar vazamentos em tubos subterrâneos de água e gás. A razão pela qual as juntas soldadas de tubos de polietileno podem ser tão fortes quanto o próprio tubo ou até mais forte permanece um mistério por décadas.", "titulo_pt": "Como soldas de plástico mantêm uma 'memória' molecular das superfícies antigas para fortalecer as junções de tubos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132624, "titulo": "A never-before-seen picture of eagle migrations", "url": "https://phys.org/news/2026-08-picture-eagle-migrations.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 1899, os cientistas começaram a rastrear a migração de aves colocando anéis identificadores nos tornozelos das aves, mas os percursos entre os pontos de captura permaneciam desconhecidos. Hoje, os rastreadores GPS permitem que os pesquisadores vejam todos os estágios da migração de aves, transformando a migração de uma descrição teórica em um mapa exato. No entanto, muitos caminhos das espécies em suas respectivas rotas de migração ainda não foram descritos.", "titulo_pt": "Imagem inédita da migração de águias", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132625, "titulo": "Takeaway cups may be releasing microplastics into your coffee", "url": "https://phys.org/news/2026-08-takeaway-cups-microplastics-coffee.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Queensland descobriram que os copos de papel usados para bebidas de takeout, quando expostos a líquidos quentes, liberam milhões de partículas de microplástico.", "titulo_pt": "Garrafas descartáveis podem liberar microplásticos no seu café", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132796, "titulo": "Eleições 2026: MP pede bloqueio de mais de 900 candidaturas e SP lidera pedidos", "url": "https://exame.com/brasil/eleicoes-2026-mp-pede-bloqueio-de-mais-de-900-candidaturas-e-sp-lidera-pedidos/", "fonte_id": "exame", "data_pub": "2026-08-29T15:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público pediu o bloqueio de mais de 900 candidaturas para as eleições de 2026, com mais de 70% dos pedidos voltados para candidatos a deputado estadual e federal. Condenações e irregularidades nas contas são alguns dos motivos para esses pedidos.", "titulo_pt": "Eleições 2026: MP pede bloqueio de mais de 900 candidaturas e SP lidera pedidos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 132797, "titulo": "Pesquisadores acham fósseis de tubarões no Egito e descoberta revela 'outro' segredo dos desertos", "url": "https://exame.com/ciencia/pesquisadores-acham-fosseis-de-tubaroes-no-egito-e-descoberta-revela-grande-segredo-dos-desertos/", "fonte_id": "exame", "data_pub": "2026-08-29T15:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fósseis de tubarões foram encontrados no Planalto de Abu-Tartur, Egito, indicando que a região era um ecossistema marinho há milhões de anos. Essa descoberta revela a existência de um ambiente marinho em um local atualmente desértico.", "titulo_pt": "Pesquisadores acham fósseis de tubarões no Egito e descoberta revela 'outro' segredo dos desertos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 132645, "titulo": "This Week In Space podcast: Episode 225 — Get a Grip!", "url": "https://www.space.com/entertainment/space-movies-shows/this-week-in-space-podcast-episode-225-get-a-grip", "fonte_id": "space_com", "data_pub": "2026-08-29T15:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rod Pyle, Tariq Malik e Adam Kall de KMI discutem como seu trabalho na Estação Espacial Internacional pode fornecer respostas para a mitigação de detritos orbitais.", "titulo_pt": "Este semana no espaço: episódio 225 — pegue um peso!", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 132106, "titulo": "Nasa tenta prolongar vida das sondas Voyager, lançadas há quase 50 anos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/nasa-tenta-prolongar-vida-das-sondas-voyager-lancadas-ha-quase-50-anos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-29T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nshan Kazaryan, engenheiro da Nasa responsável tes do DF", "url": "https://www.metropoles.com/distrito-federal/paula-belmonte-promete-garantir-direito-de-trabalho-a-feirantes-do-df", "fonte_id": "metropoles", "data_pub": "2026-08-29T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Paula Belmonte, candidata ao GDF e deputada distrital do PSDB, visitou a Ceasa e a Feira do Cruzeiro no sábado (29/8).", "titulo_pt": "Paula Belmonte promete garantir direito de trabalho a feirantes do DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 132223, "titulo": "Jovem de 18 anos morre com tiro acidental ao manusear arma com namorada", "url": "https://www.metropoles.com/brasil/jovem-de-18-anos-morre-com-tiro-acidental-ao-manusear-arma-com-namorada", "fonte_id": "metropoles", "data_pub": "2026-08-29T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um jovem de 18 anos morreu após um tiro acidental durante o manuseio de uma arma com a sua namorada, de 15 anos, na cidade de Rosário, no Maranhão, nesta sexta-feira.", "titulo_pt": "Jovem de 18 anos morre com tiro acidental ao manusear arma com namorada", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 132224, "titulo": "Incêndio atinge residências em comunidade indígena no DF", "url": "https://www.metropoles.com/distrito-federal/incendio-atinge-residencias-em-comunidade-indigena-no-df", "fonte_id": "metropoles", "data_pub": "2026-08-29T16:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um incêndio atingiu residências em uma comunidade indígena no Distrito Federal. Duas equipes do Corpo de Bombeiros, composta por 10 militares e drones, estiveram presentes no local para monitorar a ocorrência, mas não houve feridos.", "titulo_pt": "Incêndio atinge residências em comunidade indígena no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 132430, "titulo": "Capturan a hombre por femicidio en Laja: Fiscalía pedirá ampliar detención", "url": "https://www.latercera.com/nacional/noticia/capturan-a-hombre-por-femicidio-en-laja-fiscalia-pedira-ampliar-detencion/", "fonte_id": "la_tercera", "data_pub": "2026-08-29T16:22:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma vítima de 25 anos foi encontrada morta em uma residência. A investigação revelou que a versão inicial fornecida pelo suspeito era falsa.", "titulo_pt": "Homem é capturado por femicídio em Laja: procuradoria solicitará prorrogação da prisão", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 132986, "titulo": "Sudan’s date palm trees under threat from drought and wildfires", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/29/sudans-date-palm-trees-under-threat-from-drought-and-wildfires?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-29T18:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Sudão, as palmeiras de dátilo são uma linha de subsistência econômica para os habitantes do Estado do Norte. Essas árvores estão em perigo devido à seca e incêndios florestais.", "titulo_pt": "Palmeiras de dátilo do sudão ameaçadas por seca e incêndios", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 132958, "titulo": "Will this summer's climate disasters push French politicians and citizens to act?", "url": "https://www.lemonde.fr/en/environment/article/2026/08/29/will-this-summer-s-climate-disasters-push-french-politicians-and-citizens-to-act_6756972_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-29T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forasteiras, incêndios florestais e secas, todos acentuados pelo aquecimento global, não causam mudanças nas atitudes públicas sem uma forte vontade política. No entanto, há uma sensação crescente de necessidade de proteção e medidas concretas.", "titulo_pt": "Esses desastres climáticos de verão irão empurrar os políticos e cidadãos franceses a agirem?", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 132214, "titulo": "Temporais deixam ao menos três mortos e causam estragos no Sul", "url": "https://www.metropoles.com/brasil/temporais-deixam-ao-menos-tres-mortos-e-causam-estragos-no-sul", "fonte_id": "metropoles", "data_pub": "2026-08-29T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Temporais intensos causaram três mortes e deixaram estragos nos estados do Rio Grande do Sul e Santa Catarina. Uma frente fria está avançando para o Sudeste.", "titulo_pt": "Temporais deixam três mortos e causam estragos no Sul", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 132256, "titulo": "Inmet emite alerta para estados que podem ter “secura de deserto”; veja lista", "url": "https://www.cnnbrasil.com.br/nacional/brasil/inmet-emite-alerta-para-estados-que-podem-ter-secura-de-deserto-veja-lista/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Instituto Nacional de Meteorologia (Inmet) emitiu um alerta para estados que podem experimentar uma umidade relativa do ar muito baixa, comparável a desertos como o Saara. A umidade pode variar entre 20% e 12%, níveis muito baixos.", "titulo_pt": "Inmet emite alerta para estados com 'secura de deserto'", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 132168, "titulo": "Marina rebate Flávio Bolsonaro sobre clima: ‘Saneamento é importante, mas não resolve mudança do clima’", "url": "https://veja.abril.com.br/politica/marina-rebate-flavio-bolsonaro-sobre-clima-saneamento-e-importante-mas-nao-resolve-mudanca-do-clima/", "fonte_id": "veja", "data_pub": "2026-08-29T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marina Silva rebateu Flávio Bolsonaro ao afirmar que saneamento é importante, mas não resolve a mudança do clima. Durante uma agenda com Haddad em Osasco, ela acusou o candidato do PL de 'negacionista' após uma sabatina no Jornal Nacional.", "titulo_pt": "Marina rebate Flávio Bolsonaro sobre clima: 'saneamento é importante, mas não resolve mudança do clima'", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 132794, "titulo": "Em ano de El Niño forte, Brasil terá ao menos seis ondas de calor até dezembro", "url": "https://exame.com/esg/em-ano-de-el-nino-forte-brasil-tera-ao-menos-seis-ondas-de-calor-ate-dezembro/", "fonte_id": "exame", "data_pub": "2026-08-29T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Cemaden prevê que, com o fenômeno El Niño forte, o Brasil terá pelo menos seis ondas de calor até dezembro. O fenômeno, combinado com o aquecimento global, pode aumentar a frequência e intensidade de eventos extremos, com risco de incêndio em 35% do território.", "titulo_pt": "Em ano de El Niño forte, Brasil terá ao menos seis ondas de calor até dezembro", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 132568, "titulo": "Man held after laundry capsules dumped into pond, killing catfish and injuring turtles", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3365720/man-held-after-laundry-capsules-dumped-pond-killing-catfish-and-injuring-turtles?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-29T15:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem de 42 anos foi preso após supostamente descartar cápsulas de lavagem em um lago, matando um tilápia e ferindo 30 tartarugas em Ma On Shan, na China. A polícia foi notificada por um vigilante que encontrou grande quantidade de espuma no lago, onde as tartarugas eram mantidas.", "titulo_pt": "Homem preso após descartar cápsulas de lavagem em lago, matando peixe e ferindo tartarugas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 132268, "titulo": "Após enchentes, Nepal estima que reconstrução custará até US$ 5 bilhões", "url": "https://www.cnnbrasil.com.br/internacional/apos-enchentes-nepal-estima-que-reconstrucao-custara-ate-us-5-bilhoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T15:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Nepal estima que a reconstrução após as enchentes possa custar até US$ 5 bilhões. Prejuízos e danos ainda estão sendo avaliados pelo ministro das Finanças.", "titulo_pt": "Após enchentes, Nepal estima que reconstrução custará até US$ 5 bilhões", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 131638, "titulo": "A biodiversidade entrou no compliance", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-biodiversidade-entrou-no-compliance", "fonte_id": "jota", "data_pub": "2026-08-29T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A biodiversidade está se integrando na compliance corporativo com o Marco Global da Biodiversidade e o TNFD (Taskforce on Nature-related Financial Disclosures) incentivando as empresas a serem mais transparentes e a gerir os riscos relacionados à natureza.", "titulo_pt": "A biodiversidade entrou no compliance", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 131761, "titulo": "Plug-in solar panels could save households up to $370 a year – if Australia made them legal as in the UK", "url": "https://www.theguardian.com/environment/2026/aug/29/plug-in-solar-panels-could-save-households-370-a-year-and-experts-say-australia-should-copy-the-uk-in-legalising-them", "fonte_id": "guardian_world", "data_pub": "2026-08-29T05:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A instalação de kits solares plugáveis, que custam aproximadamente $1.000, pode pagar-se em três anos, de acordo com um especialista. Uma organização de advocacy sugere que a legalização desses kits no Australia, como no Reino Unido, poderia economizar até $370 por ano nas contas de energia dos australianos e ajudar no combate às mudanças climáticas.", "titulo_pt": "Kit solar plugável poderia economizar até $370 por ano para os australianos se a austrália legalizasse como no reino unido", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 132004, "titulo": "US families hold out hope for relatives lost in Nepal floods", "url": "https://www.scmp.com/news/asia/south-asia/article/3365688/us-families-hold-out-hope-relatives-lost-nepal-floods?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-29T05:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mukti Patel está reunida com familiares e amigos em sua casa em Richmond, Virginia, desde que seu pai, irmã e outras duas relações desapareceram nas cheias catastróficas perto da fronteira entre Nepal e China. Ela ainda não fala em passado, pois não há informações sobre o paradeiro deles.", "titulo_pt": "Famílias americanas mantêm esperança por parentes desaparecidos nas cheias no Nepal", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 131765, "titulo": "‘Winter panic’: EU gas stores at their lowest level in 13 years", "url": "https://www.theguardian.com/business/2026/aug/29/european-gas-stores-lowest-13-years-eu-price", "fonte_id": "guardian_world", "data_pub": "2026-08-29T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Europa está prestes a entrar no inverno com seus estoques de gás em níveis historicamente baixos, com 63% de capacidade no final de agosto, abaixo da média de 80% registrada nos últimos anos. Especialistas advertiram que essa situação pode causar 'pânico de inverno' entre os comerciantes de energia.", "titulo_pt": "Pânico de inverno: estoques de gás da Europa estão nos níveis mais baixos em 13 anos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 132038, "titulo": "Flood devastation", "url": "https://www.koreaherald.com/article/10856068", "fonte_id": "korea_herald", "data_pub": "2026-08-29T03:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um desastre de enxu
