-cacador.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-17T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa publicada na revista Current Biology revela que as fêmeas de bonobos são caçadoras agressivas, desafiando a ideia tradicional de que apenas os machos são caçadores. Este achado contrasta com a reputação pacifista desses primatas, que são próximos dos seres humanos em termos evolutivos.", "titulo_pt": "Fêmeas de bonobos são caçadoras ferozes, desafiando conceito tradicional", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 269182, "titulo": "AI models abandon climate facts to please users, UNESCO report finds", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/17/ai-models-abandon-climate-facts-to-please-users-unesco-report-finds?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-17T08:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório da UNESCO descobriu que modelos de IA abandonam fatos climáticos para concordar com os usuários em oito dos dez testes realizados.", "titulo_pt": "Modelos de IA abandonam fatos climáticos para agradar usuários, diz relatório da UNESCO", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 269421, "titulo": "Cosmo Bee to flight-test Honeybee Hall thruster with D-Orbit in 2027", "url": "https://spacenews.com/cosmo-bee-to-flight-test-honeybee-hall-thruster-with-d-orbit-in-2027/", "fonte_id": "spacenews", "data_pub": "2026-11-17T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup sul-coreana de propulsão espacial Cosmo Bee planeja realizar um teste orbital em 2027 do seu propelentele 10 mN-class Honeybee Hall com a empresa de serviços espaciais D-Orbit.", "titulo_pt": "Cosmo Bee vai realizar teste orbital do propelentele Honeybee Hall com D-Orbit em 2027", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 269332, "titulo": "UN climate chief warns of AI 'double-edged sword' at COP31", "url": "https://www.koreaherald.com/article/10939914", "fonte_id": "korea_herald", "data_pub": "2026-11-17T05:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe da ONU para assuntos climáticos enfatizou o potencial e os perigos da inteligência artificial na luta contra o aquecimento global durante a COP31. Um voluntário chamado 'Pacto Artificial Inteligente de Antalya' foi lançado na Turquia para explorar a tecnologia na busca de soluções climáticas e avaliar seus riscos ambientais crescentes.", "titulo_pt": "Chefe da ONU sobre clima avisa sobre a 'lâmina de dupla face' da IA na COP31", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 269424, "titulo": "APOD: 2026 November 17 – Milky Way versus Aurora", "url": "https://science.nasa.gov/image-article/apod-2026-november-17-milky-way-versus-aurora/", "fonte_id": "nasa_news", "data_pub": "2026-11-17T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia do APOD em 17 de novembro de 2026 mostra a galáxia do céu noturno, com a Via Láctea em confronto com as auroras polares.", "titulo_pt": "APOD: 17 de novembro de 2026 – via láctea versus auroras", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 269425, "titulo": "Tossing Fireworks from Cloud to Cloud", "url": "https://science.nasa.gov/earth/earth-observatory/tossing-fireworks-from-cloud-to-cloud/", "fonte_id": "nasa_news", "data_pub": "2026-11-17T05:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Para muitos astronautas, a impressionante visão de relâmpagos é um dos aspectos mais notáveis ao olharem para a Terra a partir da Estação Espacial Internacional.", "titulo_pt": "Jogando fogos de artifício de nuvem para nuvem", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 269362, "titulo": "The sun, Earth, Jupiter and white dwarfs: Potential traps for dark matter", "url": "https://phys.org/news/2026-11-sun-earth-jupiter-white-dwarfs.html", "fonte_id": "phys_org", "data_pub": "2026-11-17T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A matéria escura continua evadindo a detecção direta. Partículas mais lentas dela podem deixar sinais demasiadamente fracos para os detectores registrar, mas mais fáceis de serem capturadas por planetas e estrelas, potencialmente produzindo efeitos que os instrumentos atuais poderiam buscar.", "titulo_pt": "O sol, a terra, júpiter e gigantes brancos: possíveis armadilhas para matéria escura", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 269363, "titulo": "What makes food 'organic?' For many consumers, the answer isn't always on the label", "url": "https://phys.org/news/2026-11-food-consumers-isnt.html", "fonte_id": "phys_org", "data_pub": "2026-11-17T04:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A palavra 'orgânico' é comum nos supermercados, mas pode ter significados diferentes para diferentes pessoas. Consumidores muitas vezes não encontram respostas claras sobre o que exatamente significa um produto ser orgânico apenas lendo a etiqueta.", "titulo_pt": "O que significa 'orgânico'? Para muitos consumidores, a resposta não está sempre na etiqueta", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 269364, "titulo": "Report finds consistent pandemic learning loss and gaps between grades and test scores across Canada", "url": "https://phys.org/news/2026-11-pandemic-loss-gaps-grades-scores.html", "fonte_id": "phys_org", "data_pub": "2026-11-17T03:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório nacional identificou decréscimos no desempenho dos alunos em todas as províncias e territórios canadáries examinados, com a inflação das notas ocultando os danos causados pela pandemia de COVID-19.", "titulo_pt": "Relatório encontra perdas consistentes no aprendizado e gaps entre notas e pontuações de teste no canadá", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 269365, "titulo": "Mourning Notcho: What one whale's death teaches us about ecological grief", "url": "https://phys.org/news/2026-11-notcho-whale-death-ecological-grief.html", "fonte_id": "phys_org", "data_pub": "2026-11-17T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um passageiro da BC Ferries encontrou-se com um humpback whale que foi fatalmente atingido pelo barco. Este incidente levanta questões sobre o luto ecológico.", "titulo_pt": "Mourning Notcho: o que a morte de uma baleia nos ensina sobre o luto ecológico", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 268938, "titulo": "Rocky, 50 años después: el guion rechazado, el perro vendido y el Oscar que cambió la historia del cine", "url": "https://www.lanacion.com.ar/espectaculos/cine/rocky-50-anos-despues-el-guion-rechazado-el-perro-vendido-y-el-oscar-que-cambio-la-historia-del-cine-nid17112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-17T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O filme de 1976 não só catapultou Sylvester Stallone à fama, mas também iniciou uma das sagas cinematográficas mais consistentes e bem-sucedidas na história do cinema.", "titulo_pt": "Rocky, 50 anos depois: o filme que lançou uma saga cinematográfica", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 268939, "titulo": "Nicolás Occhiato: del desafío de actuar con Oscar Martínez y la nueva alianza de Luzu a las comparaciones con Tinelli y Suar", "url": "https://www.lanacion.com.ar/espectaculos/personajes/nicolas-occhiato-del-desafio-de-actuar-con-oscar-martinez-y-la-nueva-alianza-de-luzu-a-las-nid17112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-17T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Nicolás Occhiato estreia a série 'Somos así', produzida pela Nadie dice nada, em parceria com outros apresentadores do programa, que será exibida pela Disney+ a partir desta quarta-feira.", "titulo_pt": "Nicolás Occhiato: estreia série com nadie dice nada e estreia na disney+", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 268941, "titulo": "Evocaciones navideñas", "url": "https://www.lanacion.com.ar/cultura/evocaciones-navidenas-nid17112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-17T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto evoca lembranças natalinas, mas não fornece detalhes adicionais sobre o conteúdo.", "titulo_pt": "Lembranças natalinas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 269432, "titulo": "Black timber elements traverse concrete fragrance store in Tokyo", "url": "https://www.dezeen.com/2026/11/17/xinu-tokyo-esrawe-studio-cadena-concepts/", "fonte_id": "dezeen", "data_pub": "2026-11-17T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Duas empresas de design mexicanas, Esrawe Studio e Cadena Concepts, criaram um interior fragmentado para uma loja de perfumes em Tóquio, usando elementos de madeira escura angular que cortam um prédio de concreto. A marca do perfume é Xinú.", "titulo_pt": "Elementos de madeira escura percorrem loja de perfumes em concreto em tóquio", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 269438, "titulo": "Belonging by Sonia Gandhi review – India’s elder stateswoman breaks her silence", "url": "https://www.theguardian.com/books/2026/nov/17/belonging-by-sonia-gandhi-review-indias-elder-stateswoman-breaks-her-silence", "fonte_id": "guardian_culture", "data_pub": "2026-11-17T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sonia Gandhi, uma política italiana que se tornou influente na maior democracia do mundo, relata sua extraordinária jornada política. A história abrange desde seu romance com um membro de uma família política indiana até sua ascensão ao poder, atravessando décadas de história nacional e experiências de privilégio e dificuldade.", "titulo_pt": "Pertencimento por Sonia Gandhi: a senhora da política indiana rompe o silêncio", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 269467, "titulo": "How to Make the Ink Used to Write Hamlet, the Declaration of Independence, and Beethoven’s Fifth", "url": "https://lithub.com/how-to-make-the-ink-used-to-write-hamlet-the-declaration-of-independence-and-beethovens-fifth/", "fonte_id": "lithub", "data_pub": "2026-11-17T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este é o método para produzir a tinta usada para escrever Magna Carta, Hamlet, o Diário de Samuel Pepys, Robinson Crusoé, Viagem de Gulliver, Candide, a Declaração de Independência, A Defesa dos Direitos da Mulher, a Sinfonia Nona de Beethoven, Os Miseráveis, e tudo o que está entre esses trabalhos.", "titulo_pt": "Como fazer a tinta usada para escrever Hamlet, a declaração de independência e a sinfonia nona de Beethoven", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 269468, "titulo": "How Anita Brookner Restarted Her Life at 52", "url": "https://lithub.com/how-anita-brookner-restarted-her-life-at-52/", "fonte_id": "lithub", "data_pub": "2026-11-17T08:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anita Brookner tinha 52 anos quando começou sua carreira literária. Ela já tinha um romance, um agente literário e em breve teria um editor. Embora ainda ensinasse, isso duraria por alguns anos a mais.", "titulo_pt": "Como Anita Brookner reiniciou sua vida aos 52 anos", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 269469, "titulo": "Why I Had to Write My Memoir Under a Pseudonym", "url": "https://lithub.com/why-i-had-to-write-my-memoir-under-a-pseudonym/", "fonte_id": "lithub", "data_pub": "2026-11-17T08:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Azra Liaqat Khan escreveu seu memoir usando um pseudônimo porque Lil Wayne, em uma música, questionou a autenticidade do nome do artista Juicy J. Ela poderia ter usado o nome Azra Liaqat Khan, mas optou por um pseudônimo para evitar que seus alunos leiam seu memoir.", "titulo_pt": "Por que tive que escrever meu Memoir usando um pseudônimo", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 269470, "titulo": "On Brian Blanchfield’s Proxies and the Respite of Queer Stories", "url": "https://lithub.com/on-brian-blanchfields-proxies-and-the-respite-of-queer-stories/", "fonte_id": "lithub", "data_pub": "2026-11-17T08:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2018, um novo amigo me deu o livro 'Proxies' de Brian Blanchfield, com um sorriso compreensivo e a promessa de que eu iria amar. O autor do texto admitiu que ele e o amigo estavam no início de sua amizade.", "titulo_pt": "Sobre Brian Blanchfield e 'Proxies' e a respiada das histórias gays", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 269471, "titulo": "Song and Spirit: On Understanding My Grandmother’s Deeply-Held Devotion", "url": "https://lithub.com/song-and-spirit-on-understanding-my-grandmothers-deeply-held-devotion/", "fonte_id": "lithub", "data_pub": "2026-11-17T08:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A narradora e sua prima Rhonda dormiam entre tias quando perceberam que a avó estava acordada. A avó gostava de se levantar sozinha no início da manhã.", "titulo_pt": "Canção e espírito: sobre entender a profunda devocion da minha avó", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 269472, "titulo": "Gary Shteyngart, Solvej Balle, Don DeLillo, and more: 20 new books out today!", "url": "https://lithub.com/gary-shteyngart-solvej-balle-don-delillo-and-more-20-new-books-out-today/", "fonte_id": "lithub", "data_pub": "2026-11-17T08:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há lançamentos significativos de livros hoje, incluindo o primeiro coletânea de ensaios de Gary Shteyngart, o retorno de Solvej Balle com o quinto volume de sua série bem-sucedida e uma reedição de Don DeLillo com um título secreto e erótico.", "titulo_pt": "Gary Shteyngart, Solvej Balle e Don DeLillo: 20 novos livros lançados hoje!", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 269473, "titulo": "The Key Biscayne Affair", "url": "https://lithub.com/the-key-biscayne-affair/", "fonte_id": "lithub", "data_pub": "2026-11-17T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os problemas começaram assim que o grupo aterrissou em Miami. Eles foram recebidos por homens de casacos pretos e conduzidos a uma pequena sala. Nico e o narrador estavam entre os passageiros.", "titulo_pt": "O caso de Key Biscayne", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 268715, "titulo": "Crise financeira na Academia Internacional de Cinema paralisa pagamentos e aulas", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/crise-financeira-na-academia-internacional-de-cinema-paralisa-pagamentos-e-aulas.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-17T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Academia Internacional de Cinema (AIC) enfrenta uma crise financeira e operacional que está afetando o pagamento de professores, a continuidade das aulas e o atendimento aos alunos.", "titulo_pt": "Crise financeira na Academia Internacional de Cinema paralisa pagamentos e aulas", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 268716, "titulo": "Espetáculo usa rebeldia do corpo para desafiar a violência do machismo", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/espetaculo-usa-rebeldia-do-corpo-para-desafiar-a-violencia-do-machi rdian Culture", "pais": "Reino Unido", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 269267, "titulo": "Philippine police foil Columbine-style school shooting plot after FBI tip-off", "url": "https://www.scmp.com/week-asia/people/article/3374729/philippine-police-foil-columbine-style-school-shooting-plot-after-fbi-tip", "fonte_id": "scmp", "data_pub": "2026-11-17T09:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia filipina impediu um suposto plano de mass shooting envolvendo três adolescentes em uma escola no norte do país após uma denúncia do FBI. Agentes de várias agências de law enforcement realizaram operações em Batac City, Ilocos Norte, no fim de semana para prender os suspeitos.", "titulo_pt": "Polícia filipina impede plano de mass shooting após denúncia do FBI", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 268915, "titulo": "Se agudiza la crisis en Camioneros: Hugo Moyano vació un sanatorio clave de su obra social", "url": "https://www.clarin.com/politica/agudiza-crisis-camioneros-hugo-moyano-vacio-sanatorio-clave-obra-social_0_ZBO03xKXSZ.html", "fonte_id": "clarin", "data_pub": "2026-11-17T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O sanatório de importância para a obra social de Camioneros em Avellaneda, Buenos Aires, parou de prestar serviços médicos a partir do dia 15 de dezembro. Os salários dos funcionários foram pagos em parcelas.", "titulo_pt": "Agravamento da crise em Camioneros: hugo Moyano vazou um sanatório importante de sua obra social", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 268781, "titulo": "E os mais pobres, hein?", "url": "https://www.metropoles.com/blog-do-noblat/enquetes/e-os-mais-pobres-hein", "fonte_id": "metropoles", "data_pub": "2026-11-17T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A enquete discute a situação dos mais pobres. Não há detalhes adicionais sobre os resultados ou perguntas da enquete.", "titulo_pt": "E os mais pobres?", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 268823, "titulo": "Para 66%, negros e brancos não tem mesmas oportunidades de emprego e renda", "url": "https://www.cnnbrasil.com.br/nacional/brasil/para-66-negros-e-brancos-nao-tem-mesmas-oportunidades-de-emprego-e-renda/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-17T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo revela que a grande maioria (66%) dos entrevistados considera que negros e brancos não têm oportunidades iguais no mercado de trabalho e na renda. Mais de 70% dos moradores da capital baiana também não percebem igualdade de chances de renda para a população local.", "titulo_pt": "Para 66%, negros e brancos não têm mesmas oportunidades de emprego e renda", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 268824, "titulo": "Quase 80% das pessoas reconhecem racismo onde moram, diz estudo", "url": "https://www.cnnbrasil.com.br/nacional/brasil/quase-80-das-pessoas-reconhecem-racismo-onde-moram-diz-estudo/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-17T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo do Instituto Cidades Sustentáveis e Ipsos-Ipec revela que quase 80% das pessoas reconhecem o racismo em suas comunidades. A percepção do preconceito racial aumentou em comparação ao ano anterior.", "titulo_pt": "Quase 80% das pessoas reconhecem racismo onde moram, diz estudo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 268825, "titulo": "Para 81%, violência policial afeta principalmente os negros, diz estudo", "url": "https://www.cnnbrasil.com.br/nacional/brasil/para-81-violencia-policial-afeta-principalmente-os-negros-diz-estudo/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-17T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo revela que 81% das pessoas consideram que a violência policial afeta principalmente os negros. O levantamento também indica que a maioria da população apoia o enfrentamento da discriminação através de políticas públicas específicas.", "titulo_pt": "Para 81%, violência policial atinge principalmente negros, diz estudo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 269184, "titulo": "How women scavenge scraps from lithium to earn a living in Nigeria", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/17/how-women-scavenge-scraps-from-lithium-to-earn-a-living-in-nigeria?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-17T07:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias mulheres sequestram restos de resíduos deixados por mineradoras de lítio no Nígeria, buscando pedaços de minério para revender. Essa atividade é uma forma de ganhar dinheiro para elas.", "titulo_pt": "Como mulheres reciclam resíduos de lítio para ganhar dinheiro no nígeria", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 269302, "titulo": "Police book 86 people over illegal drug network", "url": "https://en.yna.co.kr/view/AEN20261117006500315", "fonte_id": "yonhap_news", "data_pub": "2026-11-17T07:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia sul-coreana prendeu 86 pessoas suspeitas de participar de uma rede ilegal de drogas.", "titulo_pt": "Polícia prende 86 pessoas em rede de tráfico de drogas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 268678, "titulo": "Pessoas com burnout e outros transtornos se sobrecarregam ao precisar provar que estão doentes", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/equilibrioesaude/2026/11/pessoas-com-burnout-e-outros-transtornos-se-sobrecarregam-ao-precisar-provar-que-estao-doentes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": ores", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 268748, "titulo": "Quem deve tomar uma nova dose da vacina diante do aumento de casos de covid", "url": "https://veja.abril.com.br/saude/quem-deve-tomar-uma-nova-dose-da-vacina-diante-do-aumento-de-casos-de-covid/", "fonte_id": "veja", "data_pub": "2026-11-17T01:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A infectologista Rosana Richtmann detalha quais grupos devem se vacinar novamente diante do aumento de casos de COVID-19 e destaca o crescimento no número de internações.", "titulo_pt": "Quem precisa se vacinar novamente diante do aumento de casos de covid-19?", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 268694, "titulo": "A educação ajuda a legitimar as posições sociais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/michael-franca/2026/11/a-educacao-ajuda-a-legitimar-as-posicoes-sociais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T00:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma jovem de origem desfavorecida estuda à noite após o trabalho para ingressar em uma universidade de prestígio, enquanto outra de origem abastada dedica o dia à preparação. A nota final serve para ordenar o desempenho, mas não reflete totalmente as capacidades de cada uma, uma vez que as condições de estudo foram diferentes.", "titulo_pt": "A educação ajuda a legitimar as posições sociais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 268922, "titulo": "Botellas de plástico y residuos que flotan: cómo es el nuevo sistema para evitar que toneladas de basura lleguen al Riachuelo", "url": "https://www.clarin.com/ciudades/botellas-plastico-residuos-flotan-nuevo-sistema-evitar-toneladas-basura-lleguen-riachuelo_0_KkPgQ54jAG.html", "fonte_id": "clarin", "data_pub": "2026-11-17T09:01:00Z", "idioma": "es", "provav n push at global climate talks is stalling", "url": "https://www.japantimes.co.jp/environment/2026/11/17/electrification-global-climate-talks/", "fonte_id": "japan_times", "data_pub": "2026-11-17T06:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O esforço visa reduzir emissões transferindo o transporte, edificações e indústria para dispositivos elétricos mais eficientes em energia.", "titulo_pt": "Por que o impulso para a eletrificação nos debates climáticos globais está se estagnando", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 269038, "titulo": "European-made pesticides named in 1,605 poisoning reports in Brazil last year", "url": "https://www.theguardian.com/environment/2026/nov/17/european-made-pesticides-named-1605-brazil-poisoning-reports", "fonte_id": "guardian_world", "data_pub": "2026-11-17T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 1.600 relatos de intoxicações por pesticidas fabricados na Europa foram registrados no Brasil no ano passado. Aproximadamente um terço desses casos envolveu produtos químicos proibidos no uso nas fazendas da União Europeia devido aos riscos para a saúde humana e o meio ambiente.", "titulo_pt": "Pesticidas fabricados na Europa são citados em mais de 1.600 relatos de intoxicação no Brasil", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 269428, "titulo": "Revealed: Russia, Saudi Arabia and Australia are largest CO2 exporters of all time", "url": "https://www.carbonbrief.org/revealed-russia-saudi-arabia-and-australia-are-largest-co2-exporters-of-all-time", "fonte_id": "carbon_brief", "data_pub": "2026-11-17T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Russia, Arábia Saudita e Austrália foram os maiores exportadores de dióxido de carbono (CO2) em toda a história, de acordo com um relatório do Carbon Brief.", "titulo_pt": "Revelado: Rússia, arábia saudita e austrália são os maiores exportadores de CO2 de todos os tempos", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 268142, "titulo": "O que se sabe sobre a primeira morte por mpox confirmada no Brasil", "url": "https://veja.abril.com.br/saude/o-que-se-sabe-sobre-a-primeira-morte-por-mpox-confirmada-no-brasil/", "fonte_id": "veja", "data_pub": "2026-11-16T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil registrou sua primeira morte por mpox e há mais de mil casos confirmados. O Ministério da Saúde adquiriu 25 mil doses de imunizantes para grupos prioritários.", "titulo_pt": "O que se sabe sobre a primeira morte por mpox confirmada no Brasil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 268513, "titulo": "Photos: California residents gather to watch massive El Nino-fuelled waves", "url": "https://www.aljazeera.com/gallery/2026/11/16/photos-california-residents-gather-to-watch-massive-el-nino-fuelled-waves?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-16T20:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A National Weather Service alertou que ondas de mais de 10 metros podem afetar partes da costa da Califórnia nos Estados Unidos. Os residentes da Califórnia estão reunidos para assistir às ondas massivas alimentadas pelo El Niño.", "titulo_pt": "Fotos: residentes da califórnia se reúnem para assistir às ondas gigantes alimentadas pelo El niño", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 268287, "titulo": "As 'cidades perdidas' da Amazônia que ficaram ocultas por séculos", "url": "https://www.bbc.com/portuguese/watch/c9e85x7ly1x6o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-16T20:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tecnologia Lidar revelou novas descobertas arqueológicas que mostram como sociedades antigas construíram assentamentos, redes de conexão e obras de engenharia na Amazônia. Es at.com/2026/11/tibets-top-elected-leader-on-repression-reincarnation-and-the-future-for-tibetans/", "fonte_id": "the_diplomat", "data_pub": "2026-11-16T15:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O líder eleito do governo em exile tibetano, Sikyong Penpa Tsering, declarou que o povo tibetano está sofrendo uma morte lenta e que está sendo sufocado gradualmente.", "titulo_pt": "Líder tibetano em exile sobre repressão, Reincarnation e o futuro dos tibetanos", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 267641, "titulo": "Julien Laroche-Joubert, key player in Le Monde's digital transformation, dies", "url": "https://www.lemonde.fr/en/obituaries/article/2026/11/16/julien-laroche-joubert-key-player-in-le-monde-s-digital-transformation-dies_6782077_15.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-16T14:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Julien Laroche-Joubert, que liderou a transformação digital do Le Monde desde 2011 e também contribuiu como escritor sobre cultura popular, faleceu em 15 de novembro aos 53 anos.", "titulo_pt": "Julien Laroche-Joubert, chave na transformação digital do Le Monde, morre", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 267710, "titulo": "‘My arms are empty’: Tragedy strikes Gaza family after baby dies from cold", "url": "https://www.aljazeera.com/features/2026/11/16/my-arms-are-empty-gaza-mothers-brace-for-another-winter-of-cold-and-fear?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-16T14:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um bebê de nove meses morreu de hipotermia em uma tenda de deslocamento dentro da Faixa de Gaza, durante o retorno das temperaturas mais baixas do inverno.", "titulo_pt": "Minhas braços estão vazios: tragédia atinge família gazaense após bebê morrer de frio", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 267642, "titulo": "IC const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
