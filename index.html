<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

s, rebeldes apoiados pelo Irã, nas cidades do sul do país, aumentando a tensão na região. A guerra entre o Irã e os Estados Unidos intensificou-se com ataques mútuos a navios no Estreito de Ormuz, o que fez com que o petróleo Brent subisse acima de US$ 100 por barril. O presidente dos Estados Unidos, Donald Trump, declarou que a guerra com o Irã terminará imediatamente após as eleições de meio de mandato, em novembro, alegando que Teerã tenta influenciar a votação, mas não resistirá por muito tempo devido à pressão econômica dos EUA. A União Europeia concedeu 115 milhões de euros à Espanha como ajuda emergencial para fortalecer a segurança fronteiriça e auxiliar nos retornos após o influxo massivo de migrantes em Ceuta, resultando em várias mortes, principalmente por afogamento. Além disso, a inteligência espanhola informou o Marrocos sobre chamados nas redes sociais para uma fuga massiva à fronteira de Ceuta, o que resultou em mais de 100 mortes e uma crise política na Espanha.\n\nA geopolítica global está em foco com várias tensões e desafios em diferentes regiões. Em primeiro lugar, a China continua a exercer pressão sobre Taiwan e os Estados Unidos. Um especialista da Stanford University sugere que ambos os lados devem se unir para combater essa pressão. Em seguida, a região do Oriente Médio enfrenta uma série de conflitos e operações militares, com Israel realizando ataques em territórios vizinhos. A coalisão liderada por Arábia Saudita acusa o grupo hutista de atacar cidades no sul do país. Além disso, o Irã foi encaminhado à Conferência das Nações Unidas de Segurança pela Agência Internacional de Energia Atômica por supostas não conformidades nucleares, um passo que pode intensificar as tensões internacionais. Finalmente, as relações entre Israel e o Reino Unido se deterioraram após Londres liderar movimentos para impor sanções contra assentamentos israelenses ilegais, levando a retaliações israelitas e debates sobre o impacto dessas medidas no processo de paz palestino-israelense.", "economia": "As exportações chinesas bateram um recorde, aumentando 41% devido a uma forte demanda global. As vendas globais de notebooks devem diminuir 8%, segundo a MIC. O Ibovespa caiu quase 1% devido à elevação do preço do petróleo, que atingiu US$ 100. O governo anunciou novas medidas para conter os preços dos combustíveis, incluindo a ampliação da desoneração da gasolina para R$ 0,63 por litro. O Tesouro dos EUA planeja recomprar US$ 6 bilhões em títulos de 10 a 20 anos, elevando os rendimentos das dívidas governamentais. O CNJ propôs regras para o pagamento e gestão de precatórios, enquanto a Febraban relatou que o sistema de autorregulação do consignado aplicou mais de 2,2 mil punições. A economia moderna está se tornando cada vez mais igual, levantando questionamentos sobre a necessidade de diversidade e experimentação. O Banco Reserve Australiano (RBA) enfrenta dificuldades em controlar a inflação, que permanece acima de seu alvo de 2,5%, devido a fatores como a elevação dos preços do petróleo e a expansão do investimento em centros de dados.", "tecnologia": "A Apple lançou seu primeiro telefone dobrável, o iPhone Fold, no evento de lançamento de novos produtos em 9 de setembro, após anos de especulações. Os novos iPhones 13 Pro e Pro Max tiveram seus preços aumentados em US$ 100, iniciando em US$ 1.199 e US$ 1.299, respectivamente. A TSMC, líder global em fabricação de chips, viu sua participação de mercado aumentar gradualmente. A Suno lançou seu primeiro modelo de música baseado em inteligência artificial, o v6, com a colaboração da indústria fonográfica. A inteligência artificial está sendo usada para ajustar bocas de atores em dublagens no Prime Video, tornando a dublagem mais natural. A Apple também lançou novas funcionalidades de inteligência artificial da Siri, como Resumo Siri, Retrocesso em Tempo Real, Reconhecimento de Som e Reconhecimento Musical. A utilização de anúncios de campanha gerados por inteligência artificial está dificultando a confiança dos eleitores em suas próprias percepções, com especialistas em tecnologia política afirmando que essa tendência pode aprofundar a desconfiança já existente em instituições e políticos nos Estados Unidos. O investimento global em infraestrutura de inteligência artificial pode ultrapassar 31 trilhões de dólares, de acordo com a consultoria PwC, com o gasto anual com data centers mais que dobrando até meados do século.", "ciencia": "A NASA concedeu um contrato de serviços de lançamento à Relativity Space Inc., permitindo o uso do Terran R em futuras missões. Em um desenvolvimento histórico, a China encontrou restos fossilizados que pertencem a um possível membro da população denisovana, um grupo de hominídeos extintos, revelando detalhes sobre a vida de parentes humanos. A inteligência artificial (IA) pode ter resolvido uma das maiores dúvidas matemáticas, as equações de Navier-Stokes, embora isso tenha levantado controvérsia. A NASA's Chandra observou novos objetos em outras galáxias que emitem raios-X de baixa energia e radiação ultravioleta intensa, possivelmente ajudando a responder questões astrosfísicas pendentes. Além disso, a vacina Shingrix contra o herpes zóster pode proteger o coração, reduzindo o risco de doenças cardíacas.", "cultura": "O documentário 'Musk', dirigido pelo cineasta americano Alex Gibney, explorou as ações e futurismo de Elon Musk, gerando preocupações públicas sobre seu impacto na sociedade. Paralelamente, a Academia Brasileira de Cinema anunciou que seis filmes brasileiros continuam na disputa para representar o país no Oscar 2027, com a decisão final prevista para 16 de setembro. Na área cinematográfica, a Bienal do Livro de São Paulo notificou a editora Fruto Proibido após cenas polêmicas com beijos em máscaras em seu estande viralizarem nas redes sociais.", "sociedade": "A cidade de Taipei planeja intensificar as inspeções de segurança alimentar para melhorar a monitoração e garantir a qualidade dos alimentos na região. Em um caso de violência, uma jovem de 18 anos foi baleada durante um encontro no Rio de Janeiro, levando a uma investigação policial. No campo, Nicolás Pino venceu Marcos Pereda em uma disputa de poder na Sociedade Rural, uma entidade influente, apesar de ambas terem agendas semelhantes. No que diz respeito à educação, a Academia Nacional de Educação propôs uma reunião federal para discutir mudanças urgentes na educação argentina devido ao retrocesso nas práticas PISA, sugerindo maior autonomia para escolas estatais e privadas. No contexto do trabalho, trabalhadores demitidos da Casas Bahia relataram não ter recebido valores de FGTS, seguro-desemprego e verbas rescisórias, conforme informado pela CNTC. Além disso, a Operação Lightning Bug II resgatou 45 crianças em situação de exploração sexual, tráfico humano ou que haviam fugido de casa nos Estados Unidos. No Bangladesh, mais de 1.000 crianças morreram devido à epidemia de sarampo desde março, de acordo com autoridades de saúde. Em relação ao trabalho informal, a economia informal na África é impulsionada pela pobreza, desemprego e burocracia, forçando milhões de pessoas a trabalharem em atividades não regulamentadas, não tributadas e sem proteção governamental.", "meio_ambiente": "O verão nos Estados Unidos registrou a temperatura mais alta desde 1880, conforme informou o Departamento de Meteorologia dos EUA, superando os recordes de 1936 e 2021, de acordo com a NOAA. Paralelamente, a Eucatex investiu R$ 410 milhões em expansão florestal, incorporando o risco climático em sua estratégia de negócios. No Chile, o Deserto do Atacama pode experimentar uma das maiores florações em duas décadas, com as primeiras flores já aparecendo. No Nepal, mais de 1.370 pessoas morreram devido às inundações na fronteira com a China, enquanto o Nepal também está utilizando drones para enviar ajuda humanitária a comunidades isoladas afetadas por inundações. A Indonésia enfrenta um aumento nos lançamentos de gases de efeito estufa devido a incêndios florestais nas ilhas de Borneu e Sumatra, com as emissões de fogo atingindo 19,7 milhões de toneladas métricas de dióxido de carbono. No Brasil, 1 em cada 5 carros vendidos já é elétrico ou híbrido, representando 22% das vendas de carros leves em agosto. A Califórnia criou um novo conselho ambiental composto por jovens entre 14 e 20 anos, permitindo-lhes participar das decisões da Agência de Proteção Ambiental. A SMA impôs uma multa de mais de 669 milhões de pesos chilenos a uma empresa de saúde por infrações ambientais na planta de tratamento de esgoto de San Ramón. O clima instável avançou pelo Sul e Sudeste do Brasil nesta quarta-feira, com previsão de chuva intensa, raios, rajadas de vento e possibilidade de granizo em várias regiões.", "direitos_humanos": "Sete pessoas foram detidas suspeitas de tráfico de pessoas para fins de extração de órgãos, conforme informado pelo Taipei Times. Na Flórida, EUA, a Interpol buscou informações sobre 163 crianças resgatadas em uma operação que libertou menores de situações de exploração. A mãe de David Elías Ojeda Vázquez, assassinado por motochorros, expressou desejo de que Deus mude os responsáveis pelo crime. Justine Wilson, ex-esposa de Elon Musk, relatou sofrer manipulação psicológica durante o casamento, conhecida como 'gaslighting'. Scarlett e Fabiana, que se casaram em um país onde o casamento entre pessoas do mesmo sexo não está legalizado, celebraram seu casamento após quatro anos de espera. A ministra do Gênero da Coreia do Sul considera apresentar uma denúncia criminal contra a Google por expor dados de vítimas de crimes sexuais digitais. O empresário francês Olivier Bouygues e cinco funcionários foram acusados de estabelecer um sistema de recompensas para a morte de espécies em perigo em uma propriedade rural. Em um relatório, 1.063 vítimas globais foram registradas em 2025 devido a armas de cluster, um dos maiores números de vítimas anuais. A polícia de Singapura questionou cinco pessoas por comentários racistas sobre inundações no Nepal e investimento na Singapore Airlines."}, "resumo_do_dia": {"politica_nacional": [{"id": 155047, "titulo": "Fachin marca para dia 15 julgamento sobre diálogos entre Moraes e Vorcaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/fachin-marca-para-dia-15-julgamento-sobre-dialogos-entre-moraes-e-vorcaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-09T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF, Luiz Edson Fachin, convocou uma sessão extraordinária para o dia 15 de julho para julgar o relatório da Polícia Federal que aponta Alexandre de Moraes como o interlocutor de Daniel Vorcaro. A sessão será realizada no plenário do Supremo Tribunal Federal.", "titulo_pt": "Fachin marca sessão para julgamento sobre diálogos entre Moraes e Vorcaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 155048, "titulo": "Fachin diz que decisões de Mendonça e Dino sobre a PF representam 'grave lesão à ordem pública'; leia íntegra", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/fachin-diz-que-decisoes-de-mendonca-e-dino-sobre-a-pf-representam-grave-lesao-a-ordem-publica-leia-integra.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-09T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF, Edson Fachin, suspendeu as decisões de André Mendonça e Flávio Dino sobre o comando da Polícia Federal e afastou Alexandre de Moraes da relatoria do inquérito das fake news.", "titulo_pt": "Fachin suspende decisões de Mendonça e Dino sobre a PF e afasta moraes", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 155085, "titulo": "Ministério da Justiça diz que PF seguirá com 'independência', AGU que Fachin 'restaura a ordem pública'; a reação à decisão do STF", "url": "https://g1.globo.com/politica/noticia/2026/09/09/decisao-fachin-mendonca-dino-repercussao.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-09T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF, ministro Edson Fachin, suspendeu as decisões dos ministros André Mendonça e Flávio Dino. A AGU e o Ministério da Justiça e Segurança Pública se posicionaram em reação à decisão, mantendo a confiança nas instituições e afirmando que a Polícia Federal continuará com suas funções.", "titulo_pt": "AGU e Justiça reagem à decisão de Fachin sobre PF", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 155086, "titulo": "Presidenciáveis reagem à decisão de Fachin que mantém Andrei da PF e tira Moraes do inquérito das fake news", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/09/presidenciaveis-reacao-decisao-de-fachin-andrei-pf-moraes.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-09T21:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos à Presidência reagiram à decisão do ministro Edson Fachin do STF, que manteve o diretor-geral da Polícia Federal, Andrei Rodrigues, no cargo e suspendeu a reintegração de Flávio Dino aos cargos envolvidos no inquérito das fake news.", "titulo_pt": "Presidenciáveis reagem à decisão de Fachin que mantém Andrei da PF e tira Moraes do inquérito das fake news", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 155087, "titulo": "PF manda intimar Galípolo, Campos Neto e André Esteves para dar depoimentos sobre Banco Master", "url": "https://g1.globo.com/politica/noticia/2026/09/09/pf-manda-intimar-galipolo-campos-neto-e-andre-esteves-para-dar-depoimentos-sobre-banco-master.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-09T21:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal intimou o atual presidente do Banco Central, Gabriel Galípolo, o ex-presidente Roberto Campos Neto, o diretor de fiscalização do Banco Central, Ailton de Aquino Santos, e o dono do BTG Pactual, André Esteves, para prestar depoimentos sobre a fiscalização do Banco Master. Todos serão ouvidos como testemunhas e têm o compromisso legal de fornecer informações verídicas.", "titulo_pt": "PF intimará Galípolo, Campos Neto e Esteves para depoimentos sobre Banco Master", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 155239, "titulo": "Governo marca leilão do Aeroporto de Brasília e inclui bloco de 10 terminais", "url": "https://www.infomoney.com.br/economia/governo-marca-leilao-do-aeroporto-de-brasilia-e-inclui-bloco-de-10-terminais/", "fonte_id": "infomoney", "data_pub": "2026-09-09T21:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo publicou o edital do leilão do Aeroporto de Brasília, que engloba investimentos de R$ 1,2 bilhão e a inclusão de dez aeroportos regionais.", "titulo_pt": "Governo realiza leilão do Aeroporto de Brasília com investimentos de r$ 1,2 bilhão e dez aeroportos regionais", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 155240, "titulo": "Governo diz que corte de tributos sobre combustíveis não exigirá espaço fiscal extra", "url": "https://www.infomoney.com.br/politica/governo-diz-que-corte-de-tributos-sobre-combustiveis-nao-exigira-espaco-fiscal-extra/", "fonte_id": "infomoney", "data_pub": "2026-09-09T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo anunciou a redução de impostos sobre gasolina e etanol e uma nova subvenção ao diesel como medidas para mitigar os efeitos da guerra no Oriente Médio, afirmando que essas ações cabem no espaço fiscal já previsto.", "titulo_pt": "Governo diz que corte de tributos sobre combustíveis não exigirá espaço fiscal extra", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 155299, "titulo": "Guerra Moraes x Mendonça: o que Fachin decidiu e o que acontece agora com os ministros do STF", "url": "https://www.bbc.com/portuguese/articles/c5y423dne20o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-09T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Supremo Tribunal Federal (STF) decidiu derrubar decisões de outros ministros sobre a Polícia Federal, retirou um inquérito sobre fake news do ministério de Morais e paralisou uma investigação contra um ministro que estava sendo investigado por Mendonça.", "titulo_pt": "Guerra Moraes x Mendonça: o que Fachin decidiu e o que acontece agora com os ministros do STF", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 155144, "titulo": "A decisão que falta para Fachin retomar de vez o comando do STF", "url": "https://www.metropoles.com/colunas/matheus-leitao/a-decisao-que-falta-para-fachin-retomar-de-vez-o-comando-do-stf", "fonte_id": "metropoles", "data_pub": "2026-09-09T21:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fachin limitou temporariamente os poderes de Moraes, no entanto, ainda não determinou o futuro das investigações sob a responsabilidade de Mendonça.", "titulo_pt": "A decisão pendente que permitirá a Fachin reassumir plenamente o comando do STF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 155596, "titulo": "Brazil scraps tax on small parcels as Chinese platforms lose US and EU access", "url": "https://www.scmp.com/news/china/article/3366975/brazil-scraps-tax-small-parcels-chinese-platforms-lose-us-and-eu-access?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-09T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Brasil eliminou a taxa federal sobre pequenos pacotes importados de fora do país, em contraste com os esforços dos EUA e da União Europeia para fechar uma brecha que permitiu o rápido crescimento de gigantes chineses como Shein e Temu. A medida visa agradar ao eleitorado brasileiro antes das eleições presidenciais de 4 de outubro, mesmo que isso cause um prejuízo na base tributária do país.", "titulo_pt": "Brasil elimina taxa em pequenos pacotes enquanto plataformas chinesas perdem acesso nos EUA e EU", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 155049, "titulo": "Aliados de Mendonça comemoram decisão de Fachin que suspende procedimento da PGR", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/aliados-de-mendonca-comemoram-decisao-de-fachin-que-suspende-procedimento-da-pgr.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-09T21:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados do ministro André Mendonça comemoraram a decisão do presidente do STF, Edson Fachin, de suspender um procedimento da PGR que buscava apurar relatórios da PF.", "titulo_pt": "Aliados de Mendonça comemoram decisão de Fachin que suspende procedimento da PGR", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 155148, "titulo": "STF não pode se curvar a paixões políticas, diz Faculdade de Direito da USP", "url": "https://www.metropoles.com/sao-paulo/stf-nao-pode-se-curvar-a-paixoes-politicas-diz-faculdade-de-direito-da-usp", "fonte_id": "metropoles", "data_pub": "2026-09-09T21:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Faculdade de Direito da USP emitiu uma nota expressando preocupação com o momento gravíssimo vivido pelo STF, onde destaca a necessidade de o tribunal não se curvar a paixões políticas.", "titulo_pt": "Faculdade de Direito da USP afirma que STF não deve se curvar a paixões políticas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 155050, "titulo": "Supremo em crise é perigo para a democracia", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/maria-herminia-tavares/2026/09/supremo-em-crise-e-perigo-para-a-democracia.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-09T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O destino da democracia no Brasil está nas mãos de dez ministros do Supremo Tribunal Federal, que devem garantir que o país funcione dentro da ordem constitucional.", "titulo_pt": "Supremo em crise representa perigo para a democracia", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 155355, "titulo": "Após divergências em dados de emendas, Dino cobra identificador único para rastreio", "url": "https://www.jota.info/stf/do-supremo/apos-divergencias-em-dados-de-emendas-dino-cobra-identificador-unico-para-rastreio", "fonte_id": "jota", "data_pub": "2026-09-09T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Supremo Tribunal Federal ordenou que uma proposta para um identificador único para rastreamento de emendas seja apresentada até o final de novembro. O governador Dino, após divergências em dados de emendas, solicitou essa medida.", "titulo_pt": "Dino cobra identificador único para rastreamento de emendas após divergências", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 155223, "titulo": "Cury defende lista tríplice para escolha de diretor-geral da PF", "url": "https://www.cnnbrasil.com.br/eleicoes/cury-defende-lista-triplice-para-escolha-de-diretor-geral-da-pf/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-09T21:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato do Avante à Presidência, Cury, defendeu durante a Bienal do Livro a adoção do modelo lista tríplice para a escolha do diretor-geral da Polícia Federal, argumentando que isso aumentaria a independência da corporação.", "titulo_pt": "Cury defende lista tríplice para escolha do diretor-geral da PF", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 155121, "titulo": "Guerra de decisões de Mendonça e Dino é ‘grave lesão à ordem pública’, diz Fachin", "url": "https://veja.abril.com.br/brasil/guerra-de-decisoes-de-mendonca-e-dino-e-grave-lesao-a-ordem-publica-diz-fachin/", "fonte_id": "veja", "data_pub": "2026-09-09T20:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Fachin do STF criticou os ministros Luís Roberto Barroso e Luiz Fux por não terem aguardado as análises deles antes de tomarem suas decisões. Fachin considerou que essa guerra de decisões é uma 'grave lesão à ordem pública'.", "titulo_pt": "Guerra de decisões de Mendonça e Dino é 'grave lesão à ordem pública', diz Fachin", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 154822, "titulo": "Taiwan, U.S. must counter China gray-zone pressure: Stanford scholar", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/10/2003864022", "fonte_id": "taipei_times", "data_pub": "2026-09-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um scholar da Stanford University afirma que Taiwan e os Estados Unidos devem combater a pressão da China no 'grau cinza'.", "titulo_pt": "Taiwan e EUA devem contrabalançar pressão cinza-china, diz scholar da stanford", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 155423, "titulo": "U.S. Designates Ecuador’s Los Tiguerones Gang as Terrorist Group", "url": "https://www.nytimes.com/2026/09/09/world/americas/ecuador-los-tiguerones-terrorist.html", "fonte_id": "nyt_world", "data_pub": "2026-09-09T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos designaram a gangue Los Tiguerones como grupo terrorista. Essa é uma tática cada vez mais comum dos Estados Unidos, embora não vá afetar significativamente as finanças da gangue.", "titulo_pt": "EUA designam gangue Los Tiguerones como grupo terrorista", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 155339, "titulo": "Malvinas 2026: un discurso, mil conjeturas", "url": "https://www.lanacion.com.ar/economia/malvinas-2026-un-discurso-mil-conjeturas-nid09092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-09T21:38:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute as expectativas para o aniversário dos 40 anos do conflito das Malvinas em 2026, levantando várias especulações e hipóteses sobre como esse evento será comemorado ou abordado.", "titulo_pt": "Malvinas 2026: um discurso, mil conjeturas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 155452, "titulo": "Australia politics live: Malinauskas warns Albanese not to follow One Nation down rabbit hole of migration cuts", "url": "https://www.theguardian.com/australia-news/live/2026/sep/10/anthony-albanese-labor-uk-west-bank-trade-ban-kevin-rudd-diplomacy-one-nation-pauline-hanson-liberal-party-angus-taylor-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-09-09T21:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Peter Malinaukas advertiu Anthony Albanese para não seguir o caminho de One Nation, sugerindo que o problema real na Austrália é uma crise habitacional, não uma crise migratória. Ele enfatizou a necessidade de explicar aos australianos que o foco deve ser na política de habilidades para atrair trabalhadores necessários.", "titulo_pt": "Política australiana em tempo real: malinauskas avisa Albanese sobre o caminho de One Nation", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 155755, "titulo": "Peter Thiel-backed firm to make low-cost missiles amid U.S. shortage", "url": "https://www.washingtonpost.com/technology/2026/09/09/peter-thiel-backed-firm-make-low-cost-missiles-amid-us-shortage/", "fonte_id": "washington_post_world", "data_pub": "2026-09-09T21:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma start-up de defesa apoiada por Peter Thiel obteve contratos no valor aproximado de 150 milhões de dólares para produzir mísseis de baixo custo, com as entregas previstas para começar em 2027.", "titulo_pt": "Empresa apoiada por peter thiel vai produzir mísseis de baixo custo diante de escassez nos EUA", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 155579, "titulo": "Drone almost struck Zelenskyy’s plane, says Ukraine", "url": "https://www.ft.com/content/4fc1dc2e-f0d7-433c-8e96-bc1e8923dcbc?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-09T21:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um oficial viajando com o presidente ucraniano Zelenskyy afirma que um drone quase atingiu o seu avião. Eles acreditam que um dispositivo militar russo foi utilizado no incidente.", "titulo_pt": "Drone quase atingiu avião de Zelenskyy, diz oficial ucraniano", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 155507, "titulo": "Spanish intelligence warned of Ceuta mass crossing plans before surge", "url": "https://www.bbc.co.uk/news/articles/ced7vj2gv82o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-09T21:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Documentos desclassificados mostram que autoridades espanholas e marroquinas foram alertadas sobre chamadas em redes sociais para um grande cruzamento de imigrantes um dia antes do ingresso de centenas de milhares de pessoas em Ceuta.", "titulo_pt": "Inteligência espanhola alertou sobre planejamento de grande cruzamento de imigrantes em Ceuta antes do surto", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 155061, "titulo": "Houthis atacam cidades do sul da Arábia Saudita pelo segundo dia consecutivo", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/houthis-atacam-cidades-do-sul-da-arabia-saudita-pelo-segundo-dia-consecutivo.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-09T21:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os houthis, grupo rebelde do Iêmen apoiado pelo Irã, atacaram as cidades do sul da Arábia Saudita de Abha, Khamis Mushait e Jazan por dois dias consecutivos, aumentando a tensão na região.", "titulo_pt": "Houthis atacam cidades do sul da Arábia Saudita pelo segundo dia consecutivo", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 155421, "titulo": "Yemen Tilts Toward Full-Scale War as Saudi-Houthi Clashes Escalate", "url": "https://www.nytimes.com/2026/09/09/world/middleeast/saudi-yemen-strilkes.html", "fonte_id": "nyt_world", "data_pub": "2026-09-09T21:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Yemen está prestes a entrar em guerra total após intensificação dos confrontos entre as forças sauditas e o movimento hutí. As rotas de exportação de petróleo da Arábia Saudita estão novamente em risco.", "titulo_pt": "Iêmen se preponta para guerra total com escalada das confrontações saudita-hutí", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 155514, "titulo": "Trump 'believes in the power of his own charisma', analyst says", "url": "https://www.france24.com/en/tv-shows/a-propos/20260909-trump-believes-in-the-power-of-his-own-charisma-analyst-says", "fonte_id": "france24", "data_pub": "2026-09-09T21:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os republicanos iniciaram sua convenção inusitada para as eleições de meios mandatos em Dallas, com foco central no presidente Trump, independentemente das preferências dos candidatos. Trump acredita na força do próprio encanto pessoal.", "titulo_pt": "Trump acredita na força do próprio encanto pessoal, analista diz", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 155475, "titulo": "What India Gets Out of BRICS", "url": "https://foreignpolicy.com/2026/09/09/india-brics-summit-new-delhi-global-south/", "fonte_id": "foreign_policy", "data_pub": "2026-09-09T21:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Antes do encontro dos líderes do grupo, Nova Deli está fazendo tudo para destacar suas prioridades. A India está se esforçando para aproveitar ao máximo o BRICS.", "titulo_pt": "O que a Índia gana com o BRICS", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 155422, "titulo": "Back to School, Now With A.I.", "url": "https://www.nytimes.com/2026/09/09/world/10int-theworld-web-ai-education.html", "fonte_id": "nyt_world", "data_pub": "2026-09-09T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este ano está se tornando um experimento global em educação: será que os alunos podem aderir às inovações tecnológicas sem perderem suas habilidades de raciocínio crítico?", "titulo_pt": "De volta às aulas, agora com inteligência artificial", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 155756, "titulo": "TPS expires for an immigrant group shielded from deportation for decades", "url": "https://www.washingtonpost.com/immigration/2026/09/09/they-were-given-refuge-us-decades-now-their-benefit-is-expiring/", "fonte_id": "washington_post_world", "data_pub": "2026-09-09T20:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Imigrantes da El Salvador foram os primeiros a serem concedidos o status de proteção temporária. O governo de Trump tem cancelado esse status para centenas de imigrantes que fugiram de guerra e desastres.", "titulo_pt": "TPS expira para um grupo de imigrantes protegidos por décadas", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 155515, "titulo": "Trump claims firefighters carried him to safety ‘right after’ 9/11, but his account is disputed", "url": "https://www.france24.com/en/trump-claims-firefighters-carried-him-to-safety-right-after-9-11-but-his-account-is-disputed-1", "fonte_id": "france24", "data_pub": "2026-09-09T20:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Donald Trump afirmou que dois bombeiros o levaram a salvo perto do Edifício US Steel logo após os ataques do 11 de setembro, embora ele tenha posteriormente negado estar no World Trade Center no dia do colapso. Suas declarações sobre o que aconteceu e seu suposto papel no Ground Zero mudaram várias vezes ao longo dos anos.", "titulo_pt": "Trump afirma que bombeiros o levaram a salvo após 11 de setembro, mas versão é contestada", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 155477, "titulo": "Conductor Julian Wachner receives suspended sentence for possession of child sex abuse material", "url": "https://www.npr.org/2026/09/09/nx-s1-5962805/conductor-julian-wachner-suspended-sentence-for-possession-of-child-sex-abuse-material", "fonte_id": "npr_news", "data_pub": "2026-09-09T20:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ex-conductor proeminente e amplamente gravado Julian Wachner foi condenado a cerca de seis anos de probatória por cinco acusações de posse de material sexual infantil em Indianapolis.", "titulo_pt": "Conductor Julian Wachner recebe sentença suspensa por posse de material sexual infantil", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 155532, "titulo": "Two Palestinians injured in Israeli military raid south of Nablus", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/two-palestinians-injured-israeli-forces-south-nablus", "fonte_id": "middle_east_eye", "data_pub": "2026-09-09T20:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois palestinos ficaram feridos após serem agredidos por forças israelenses durante uma operação militar na cidade de Awarta, sul de Nablus, em terras ocupadas da Cisjordânia. De acordo com a Wafa, viaturas blindadas israelenses realizaram incursões no local, disparando balas reais, gases lacrimogêneos e granadas de efeito moral.", "titulo_pt": "Dois palestinos feridos em operação militar israelense na região de Nablus", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 154825, "titulo": "Exports hit record on 41% rise", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/10/2003863978", "fonte_id": "taipei_times", "data_pub": "2026-09-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As exportações atingiram um recorde com um aumento de 41%.", "titulo_pt": "Exportações registram recorde com aumento de 41%", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 154827, "titulo": "Global notebook shipments tipped to drop 8%, MIC says", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/10/2003863980", "fonte_id": "taipei_times", "data_pub": "2026-09-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas globais de notebooks devem diminuir em 8% segundo a MIC. Esta previsão foi fornecida pela instituição de pesquisa.", "titulo_pt": "Vendas globais de notebooks devem cair 8%, diz MIC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 155580, "titulo": "LIV races to re-sign golfers to clinch $300mn bankruptcy rescue", "url": "https://www.ft.com/content/326beea4-5d90-474b-be3d-af9038cbecfc?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-09T21:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A LIV Golf está negociando para recontratar golfers com novas condições, onde os jogadores substituiriam reivindicações por contratos antigos por ações em uma nova liga.", "titulo_pt": "LIV golf corre para renegociar contratos com golfeiros para assegurar resgate de falência de us$ 300 milhões", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 155248, "titulo": "Renato Ejnisman é o novo sócio da Laplace", "url": "https://braziljournal.com/renato-ejnisman-e-o-novo-socio-da-laplace/", "fonte_id": "brazil_journal", "data_pub": "2026-09-09T21:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Renato Ejnisman, ex-chefe do IB do Santander, se tornou sócio da Laplace, uma boutique de M&A liderada por Renato Carvalho, Allan Libman, Daniel Assa e Guilherme Rocha. Ejnisman afirmou que a decisão foi para deixar de ser executivo e passar a ser sócio.", "titulo_pt": "Renato Ejnisman se torna novo sócio da Laplace", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 155340, "titulo": "Los psicólogos coinciden: que una persona corrija constantemente a las demás significa que siente incomodidad ante la incertidumbre", "url": "https://www.lanacion.com.ar/lifestyle/los-psicologos-coinciden-que-una-persona-corrija-constantemente-a-las-demas-significa-que-siente-nid09092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-09T21:38:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Psicólogos concordam que a tentativa constante de uma pessoa em ter sempre a razão pode indicar desconforto com a incertidão. Uma especialista em saúde mental apontou os motivos que levam a esse comportamento.", "titulo_pt": "Psicólogos: quem sempre tenta ter a razão sente incômodo com a incerteza", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 155140, "titulo": "Autorregulação do consignado já aplicou mais 2,2 mil punições, diz Febraban", "url": "https://www.metropoles.com/brasil/autorregulacao-do-consignado-ja-aplicou-mais-22-mil-punicoes-diz-febraban", "fonte_id": "metropoles", "data_pub": "2026-09-09T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O sistema de autorregulação do consignado aplicou mais de 2,2 mil punições, segundo a Febraban. As punições incluem advertências, multas e até a suspensão de instituições por assédio, falta de transparência e contratação irregular.", "titulo_pt": "Autorregulação do consignado já aplicou mais de 2,2 mil punições, diz Febraban", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 155354, "titulo": "CNJ propõe regras para pagamento e gestão de precatórios", "url": "https://www.jota.info/justica/cnj-propoe-regras-para-pagamento-e-gestao-de-precatorios", "fonte_id": "jota", "data_pub": "2026-09-09T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho Nacional de Justiça (CNJ) propõe regras para o pagamento e gestão de precatórios. O conselho também discute limites à venda de créditos e recebe sugestões para aprimorar uma minuta de resolução geral sobre o tema.", "titulo_pt": "CNJ propõe regras para pagamento e gestão de precatórios", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 155143, "titulo": "Governo amplia desoneração da gasolina para R$ 0,63 por litro", "url": "https://www.metropoles.com/brasil/governo-amplia-desoneracao-da-gasolina-para-r-063-por-litro", "fonte_id": "metropoles", "data_pub": "2026-09-09T21:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo anunciou novas medidas para conter os preços dos combustíveis, incluindo a ampliação da desoneração da gasolina para R$ 0,63 por litro. Essas medidas foram tomadas após aumentos recentes no preço do petróleo.", "titulo_pt": "Governo amplia desoneração da gasolina para R$ 0,63 por litro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 155069, "titulo": "PF intima Galípolo, Campos Neto e André Esteves a depor como testemunhas em inquérito sobre Master", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/pf-intima-galipolo-campos-neto-e-andre-esteves-a-depor-como-testemunhas-em-inquerito-sobre-master.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-09T20:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal intimou Gabriel Galípolo, presidente do Banco Central, e Roberto Campos Neto, ex-chefe da autoridade monetária, a depor como testemunhas em um inquérito sobre a fiscalização do Banco Master, que será liquidado em novembro de 2025.", "titulo_pt": "PF intimou Galípolo, Campos Neto e Esteves a depor como testemunhas em inquérito sobre Master", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 155128, "titulo": "Ibovespa cai quase 1% de olho em alta do petróleo, que atingiu US$ 100", "url": "https://veja.abril.com.br/economia/ibovespa-cai-quase-1-de-olho-em-alta-do-petroleo-que-atingiu-us-100/", "fonte_id": "veja", "data_pub": "2026-09-09T20:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibovespa caiu quase 1% em resposta à alta do preço do petróleo, que atingiu US$ 100. Mercados operam monitorando o ambiente geopolítico externo, especialmente a situação tensa no Oriente Médio.", "titulo_pt": "Ibovespa cai quase 1% com alta do petróleo e tensão no oriente médio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 155070, "titulo": "A economia moderna está um pouco... igual demais?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/a-economia-moderna-esta-um-pouco-igual-demais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-09T20:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A economia moderna está um pouco... igual demais. O texto destaca a importância da disciplina para garantir que ideias economicamente inviáveis falhem e do pluralismo para testar diversas ideias, com a economia gerando constantemente novos experimentos.", "titulo_pt": "A economia moderna está um pouco... Igual demais?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 155099, "titulo": "Subsídios à gasolina e ao diesel são ampliados após alta do petróleo", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/subsidios-gasolina-e-ao-diesel-sao-ampliados-apos-alta-do-petroleo", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-09T19:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal ampliou as medidas de subsídio para os combustíveis após a elevação dos preços internacionais do petróleo, reduzindo tributos na gasolina em R$ 0,63 por litro e autorizando uma subvenção inicial de R$ 1 por litro de diesel. Essas ações substituem e expandem a política anterior de subsídios para mitigar o impacto da alta dos preços internacionais sobre os combustíveis no Brasil.", "titulo_pt": "Subsídios à gasolina e ao diesel são ampliados após alta do petróleo", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 155526, "titulo": "Trump says oil and gas prices won't fall until 'right after' midterm election", "url": "https://www.cnbc.com/2026/09/09/trump-oil-gas-prices-midterm-elections.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-09T19:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Donald Trump afirmou que os preços do petróleo e do gás, elevados devido à guerra com a Irã, não cairão até logo após as eleições de meios mandatos.", "titulo_pt": "Trump diz que preços de petróleo e gás não cairão até 'logo após' as eleições de meios mandatos", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 155073, "titulo": "Sem dinheiro, holding do Master em Cayman faz assembleia com credores que pedem US$ 1 bi", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/sem-dinheiro-holding-do-master-em-cayman-faz-assembleia-com-credores-que-pedem-us-1-bi.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-09T19:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A consultoria Grant Thornton realizou a primeira assembleia com credores da Titan Capital Holding, uma holding do Banco Master nas Ilhas Cayman, onde foram discutidos o formação de um comitê de credores e a apresentação do primeiro relatório, que não foi positivo.", "titulo_pt": "Sem recursos, holding do Master em ilhas Cayman realiza assembleia com credores que pedem US$ 1 bi", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 155505, "titulo": "Energy Department raises 2027 diesel price outlook by 33 cents amid Iran war", "url": "https://www.axios.com/2026/09/09/energy-department-hikes-2027-diesel-price-outlook", "fonte_id": "axios", "data_pub": "2026-09-09T19:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Energia aumentou sua projeção para os preços do diesel nos Estados Unidos em 2027 em 33 centavos, devido à escassez global de suprimentos que mantêm as reservas internas excepcionalmente baixas. Isso sugere que os americanos podem enfrentar altos custos de combustível por mais tempo, conforme reconheceu o presidente Trump que as cotações do petróleo podem não diminuir até após as eleições legislativas de outubro.", "titulo_pt": "Departamento de energia eleva projeção de preços do diesel em 2027 devido à guerra do Irã", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 155361, "titulo": "TCU e contas vinculadas em concessões", "url": "https://www.jota.info/opiniao-e-analise/colunas/controle-publico/tcu-e-contas-vinculadas-em-concessoes", "fonte_id": "jota", "data_pub": "2026-09-09T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os primeiros votos no caso do setor ferroviário no Tribunal de Contas da União (TCU) indicam uma solução favorável ao modelo das contas vinculadas.", "titulo_pt": "TCU e contas vinculadas no setor ferroviário", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 154803, "titulo": "Brace for new AI threats ahead of elections, AIT head says", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/10/2003863996", "fonte_id": "taipei_times", "data_pub": "2026-09-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe do AIT alertou para novos ameaças de inteligência artificial antes das eleições. Ele recomendou que as pessoas estejam preparadas para
