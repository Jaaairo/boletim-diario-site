<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

</div>

<div class="modal-overlay" id="modal-flag">

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

<script>
const D = {"gerado_em": "28/11/2026 07:21", "stats": {"noticias_novas": 617, "resumos_gerados": 242}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A posse do presidente Lula em 5 de janeiro promete ser um momento histórico, com a inscrição de cerca de 1.200 ônibus para transportar simpatizantes. O PT também se articula para nomear lideranças, com pelo menos três petistas almejando a chefia de gabinete. Em contrapartida, aliados de Geraldo Alckmin consideram que Fernando Haddad permanecerá próximo a Lula e pode retornar à gestão federal. O governo federal está avaliando a transferência da Abin para o Ministério da Justiça, enquanto a Fundação FHC se manifestou sobre declarações do presidente Lula. O Banco do Brasil passará de uma vitrine do governo Lula em 2023 para enfrentar desafios relacionados ao crédito rural e à reestruturação a partir de 2027. O futuro ministro da Fazenda, Luiz Carlos Trabuco, será apresentado às propostas de ajuste em discussão, e o presidente do TSE, Alexandre de Moraes, atendeu a 68% dos pedidos da campanha de Flávio Bolsonaro. O caso Master mantém uma disputa no STF sobre quem será o responsável pelas investigações, e o ministro Fachin autorizou o repasse de R$ 316,4 milhões do banco Master para o BRB. O ex-ministro Henrique Meirelles alerta que a dívida pública pode levar o Brasil a repetir a crise de 2015 e 2016, e o ministro Toffoli prorrogou até março de 2027 a suspensão de sanções ao Rio de Janeiro por causa da dívida com a União.", "mundo": "As eleições espanholas estão em destaque com movimentações intensas de partidos de esquerda e direita. O primeiro-ministro Pedro Sánchez tenta manter a maioria progressista, enquanto o candidato do Partido Popular, Alberto Núñez Feijóo, busca mobilizar os votos conservadores. As eleições, marcadas para este domingo, podem resultar em um governo de direita ou na reeleição de Sánchez. Em outro destaque, a Ucrânia apresentou uma proposta de cessar-fogo no Mar Negro para facilitar as exportações de alimentos, uma medida que aguarda uma resposta de Moscou. Além disso, o governo brasileiro planeja aproveitar a 69ª Cúpula do Mercosul para aproximar o bloco comercial dos mercados do Caribe e da América Central, com a transferência da presidência do Mercosul do Uruguai para a Argentina.\n\nA guerra na Ucrânia continua a se espalhar pela Europa, com divergências sobre controle territorial e a posição da Otan impedindo avanços nas negociações para encerrar o conflito, conforme relatado pela CNN Brasil. Em Gaza, dois funcionários da Médicos Sem Fronteiras foram mortos em um ataque israelense, elevando o número de membros da organização falecidos para 17. O conflito no Oriente Médio também se intensificou, com o Irã atacando navios no Estreito de Ormuz e a Arábia Saudita interceptando um míssil hutita em direção a Riyadh. As eleições locais na Taiwan estão ocorrendo em um cenário apertado, com possíveis implicações para a eleição presidencial de 2028, enquanto a China realiza exercícios militares para testar táticas de pouso.", "economia": "O dólar caiu quase 4% e encerrou o dia a R$ 5,51, em resposta à confirmação de Luiz Carlos Trabuco como novo ministro da Fazenda, conforme anunciado pela Agência Brasil Economia. Este movimento refletiu a confiança dos mercados em relação às medidas fiscais que Trabuco pode implementar, apesar das críticas de economistas que acreditam que são necessários ajustes significativos no valor de R$ 400 bilhões. O Banco do Brasil, por sua vez, deveria ter sido mais cauteloso na concessão de crédito, segundo o economista Aod Cunha, para evitar uma nova diminuição no lucro líquido. Além disso, o Banco Central anunciou medidas para reduzir o endividamento com novas regras que entrarão em vigor em 2027. Em outro desenvolvimento, a B3 anunciou o desenvolvimento de um criptoativo atrelado ao real em parceria com instituições financeiras, visando permitir operações com ações usando este novo ativo digital.", "tecnologia": "A Coreia do Sul intensificou seus esforços para liderar o desenvolvimento de inteligência artificial (IA) durante a cerimônia de enterramento de pedra para a construção de um importante centro de dados de IA em Gangwon, no dia 28 de novembro. O presidente Yoon Suk Yeol prometeu mobilizar recursos para avançar na tecnologia. Em contraste, a Coreia do Sul enfrenta crescentes preocupações sobre o uso de IA para trapaças durante o Teste de Proficiência em Coreano (TOPIK), com medidas de segurança aprimoradas para evitar fraudes. No exterior, hackers conseguiram acessar o sistema Cloud One da Força Aérea dos Estados Unidos, levantando preocupações sobre a segurança de dados militares. Além disso, a Wellysun, fabricante de módulos eletrônicos de controle automotivo, acelerou sua transformação para se tornar um parceiro estratégico para módulos eletrônicos de alta gama, focando em áreas como refrigeração líquida de IA, comunicações ópticas NPO e sistemas autônomos. A LG AI Research automatizou a preparação de dados, construindo modelos de base especializados e estabelecendo um laboratório autônomo para facilitar a adoção e o uso contínuo de IA, especialmente no setor de manufatura.", "ciencia": "A NASA divulgou imagens inéditas da Terra capturadas por dois satélites em direção a Marte, revelando a missão Escapade realizada a uma distância de 62.000 quilômetros. Em pesquisa científica, o Telescópio do Horizonte Eventual (EHT) produziu imagens detalhadas de jatos relativísticos emanando de 3C 84 e do buraco negro supermassivo no centro da galáxia M87*, entre 2024 e 2026. A Universidade de Duisburg-Essen descobriu que o dióxido de carbono (CO₂) ajuda a moldar a superfície de seu próprio catalisador quando reestruturado usando pulsos de voltagem, permitindo a conversão preferencial de CO₂ em ácido formílico. Além disso, a China defende seu acesso a plataformas de perfuração em Abu Dhabi, desafiando bloqueios de guerra no Estreito de Ormuz. A pesquisa sobre a barreira que pode impedir que certos medicamentos de ácidos nucleicos promissores atinjam seus alvos dentro de compartimentos subcelulares, publicada na Nature Cell Biology, pode auxiliar no desenvolvimento de estratégias de entrega de medicamentos mais eficazes. A Áustria experimentou uma seca excepcional em 2026, com precipitação cerca de um terço menor do que a média anual, levantando questões sobre a relação entre a disponibilidade de água e o aquecimento global.", "cultura": "A semana cultural foi repleta de novidades e eventos importantes. O Museu de Londres, resultado da transformação do Mercado Geral de Smithfield, inaugurou recentemente suas portas, oferecendo uma visão moderna e interativa da história da cidade. Em outro destaque, a Árvore de Natal da Lagoa no Rio de Janeiro será inaugurada com fogos de artifício e um concerto da Orquestra Petrobras Sinfônica, prometendo um espetáculo noturno de luzes e som. Ainda em Londres, a saia usada por Keira Knightley no filme 'Atonement' será leiloada em dezembro, com estimativa de valor entre 130.940 e 157.125 dólares. Entre as novidades cinematográficas, a nova animação da Disney 'Enfeitiçadas: Bem-Vindas a Hexa' estreia, explorando o conflito entre gerações de mulheres. O Nômade Festival em São Paulo, com shows de Anitta e BaianaSystem, promete agitar o público no mês de abril. Na cultura audiovisual, a série 'Gordon' debate os anos 60 e 70 na Argentina, enquanto o documentário 'Heal' acompanha a Princesa de Gales, Catherine, em sua jornada após o tratamento contra o câncer. Além disso, o romance de Philip K. Dick de 1968, base de 'Blade Runner', é o mais assistido no Prime Video no Brasil, reforçando sua relevância cultural.", "sociedade": "A sociedade brasileira enfrenta diversos desafios em diferentes frentes. A expectativa de vida das mulheres no Brasil atingiu pela primeira vez 80 anos, segundo dados do IBGE, refletindo a melhoria nas condições de saúde e bem-estar. No entanto, a pobreza persiste, com diferentes metodologias sendo usadas para medir seu impacto, conforme analisado pela DW. A expectativa de vida das mulheres supera 80 anos, mas a diferença entre homens e mulheres é de 6,6 anos, de acordo com o IBGE. Em Fortaleza, as escolas reduziram o tempo de aulas devido ao calor extremo, enquanto a campanha Dia D contra a dengue foi lançada com o objetivo de combater o mosquito Aedes aegypti. Além disso, a sociedade também enfrenta desafios relacionados à saúde mental, com o especialista Geraldo Lorenzi destacando a importância do sono para o reparo de neurônios e músculos. A pobreza e a falta de reciprocidade emocional podem levar a uma sensação de solidão na aposentadoria, mesmo com contato frequente com familiares. Outros temas relevantes incluem a campanha de vacinação contra meningite em São Paulo, o Dia D contra a dengue, a greve de trabalhadores em escolas na Coreia do Sul, e a prisão de um capitão da PM que teria afirmado não querer trabalhar com mulheres. A justiça condenou um vereador por transfobia, enquanto um mutirão de castração gratuita de animais ocorre neste sábado em São Paulo. Além disso, a sociedade também se depara com desafios na gestão de pessoas, com empresas premiadas no Melhores em Gestão de Pessoas 2026 oferecendo bolsas de estudo e apoio psicológico para funcionários e familiares.", "meio_ambiente": "O fenômeno El Niño, intensificado pelo aquecimento global, tem causado eventos climáticos extremos em vários países. No Chile, a ministra do Meio Ambiente, Maisa Rojas, destaca os desafios de enfrentar as consequências do El Niño, como incêndios, chuvas intensas, aluviões e tornados, que podem se repetir na primavera. As mudanças climáticas também afetam a região da Patagônia chilena, que enfrentará volumes reduzidos de água nos rios no próximo verão. Em Roraima, a seca severa afeta 95% do estado, isolando comunidades ribeirinhas, em um terceiro evento associado ao El Niño e ao aquecimento do Atlântico Norte em 11 anos. O AquaRio inaugurou um laboratório para a reprodução de corais ameaçados, enquanto o aumento do nível do mar pode expor mais de sete milhões de pessoas a inundações em cidades africanas costeiras até 2050. Além disso, a seca no Pantanal, intensificada pelo El Niño, continua preocupante, após anos extremos de seca e fogo na região.", "direitos_humanos": "Os palestinos em Jerusalém Oriental enfrentam diversos abusos de direitos humanos, como expulsões, fechamento de livrarias, demolição de casas e violência por parte de colonos israelenses, criando um ambiente hostil para a comunidade palestina. Além disso, famílias relatam que parentes ainda estão detidos em prisões israelenses, mesmo após cumprir suas penas, indicando persistência de problemas legais e humanitários. Em outro caso, um professor na Malásia foi condenado a 60 anos de prisão e 24 chicotadas por abusar sexualmente oito meninas em uma escola primária, evidenciando a necessidade de medidas rigorosas contra abusos na educação. Esses eventos refletem a ampla gama de desafios enfrentados em diferentes regiões do mundo, com foco especial na questão palestina e nas violações de direitos humanos na educação."}, "resumo_do_dia": {"politica_nacional": [{"id": 292366, "titulo": "Posse de Lula deve ter controle de ônibus na chegada ao DF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/posse-de-lula-deve-ter-controle-de-onibus-na-chegada-ao-df.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-28T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido dos Trabalhadores (PT) recebeu inscrições de aproximadamente 1.200 ônibus para transportar simpatizantes à posse de Lula, marcada para 5 de janeiro. A expectativa é que haja um grande número de militantes presentes.", "titulo_pt": "Posse de Lula deve ter controle de ônibus na chegada ao DF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 292451, "titulo": "A jogada de Lula", "url": "https://www.metropoles.com/blog-do-noblat/enquetes/a-jogada-de-lula", "fonte_id": "metropoles", "data_pub": "2026-11-28T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A matéria trata de uma enquete relacionada a uma jogada estratégica do ex-presidente Lula, mas não fornece detalhes adicionais sobre o conteúdo da enquete ou a estratégia em si.", "titulo_pt": "A jogada de Lula", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 292494, "titulo": "Análise: Banco do Brasil passa de vitrine do governo Lula a desafio em 2027", "url": "https://www.cnnbrasil.com.br/economia/analise-banco-do-brasil-passa-de-vitrine-do-governo-lula-a-desafio-em-2027/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-28T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco do Brasil passou de uma vitrine do governo Lula em 2023 para enfrentar desafios relacionados ao crédito rural e à reestruturação a partir de 2027.", "titulo_pt": "Análise: banco do Brasil passa de vitrine do governo Lula a desafio em 2027", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 292455, "titulo": "Três petistas se articulam para virar chefe de gabinete de Lula", "url": "https://www.metropoles.com/colunas/igor-gadelha/tres-petistas-se-articulam-para-virar-chefe-de-gabinete-de-lula", "fonte_id": "metropoles", "data_pub": "2026-11-28T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pelo menos três lideranças do PT estão se articulando para assumir a chefia de gabinete de Lula no Palácio do Planalto. O cargo é almejado por essas lideranças, que mantêm contatos com o presidente.", "titulo_pt": "Três petistas buscam chefiar gabinete de Lula", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 292458, "titulo": "Entorno crê que ausência não é definitiva e que Haddad pode voltar à gestão", "url": "https://www.metropoles.com/colunas/vinicius-passarelli/entorno-cre-que-ausencia-nao-e-definitiva-e-que-haddad-pode-voltar-a-gestao", "fonte_id": "metropoles", "data_pub": "2026-11-28T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados de Haddad consideram que ele permanecerá próximo a Lula e pode retornar à gestão federal nos próximos quatro anos.", "titulo_pt": "Aliados acreditam que ausência não é definitiva e Haddad pode voltar à gestão", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 292460, "titulo": "Por que a chegada de Trabuco tirou o chão de Flávio Bolsonaro", "url": "https://www.metropoles.com/blog-do-noblat/ricardo-noblat/por-que-a-chegada-de-trabuco-tirou-o-chao-de-flavio-bolsonaro", "fonte_id": "metropoles", "data_pub": "2026-11-28T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro teve uma falha na sua estadia nos Estados Unidos, após uma fuga, enquanto Trabalho, do PT, surpreendeu a oposição com uma estratégia chamada Trabuco.", "titulo_pt": "Por que a chegada de Trabuco abalou Flávio Bolsonaro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 292502, "titulo": "Nos EUA há um mês, Flávio segue votando e recebendo salário de senador", "url": "https://www.cnnbrasil.com.br/politica/nos-eua-ha-um-mes-flavio-segue-votando-e-recebendo-salario-de-senador/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-28T07:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, senador pelo Rio de Janeiro e derrotado nas eleições presidenciais, tem participado de votações e continua recebendo salário, graças a sessões semipresenciais no Senado.", "titulo_pt": "Flávio bolsonaro segue votando e recebendo salário de senador nos EUA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 292576, "titulo": "Emendas pressionam capacidade de execução das prefeituras menores", "url": "https://www.jota.info/opiniao-e-analise/artigos/emendas-pressionam-capacidade-de-execucao-das-prefeituras-menores", "fonte_id": "jota", "data_pub": "2026-11-28T07:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As emendas parlamentares pressionam a capacidade de execução das prefeituras menores. A carga dessas emendas é mais pesada em cidades com menor estrutura administrativa.", "titulo_pt": "Emendas pressionam capacidade de execução das prefeituras menores", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 292367, "titulo": "Governo avalia transferir Abin para Ministério da Justiça em Lula 4", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/governo-avalia-transferir-abin-para-ministerio-da-justica-em-lula-4.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-28T07:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal está avaliando a possibilidade de transferir a Abin (Agência Brasileira de Inteligência) da Casa Civil para o Ministério da Justiça, em um contexto de discussões sobre a criação do Ministério da Segurança Pública.", "titulo_pt": "Governo considera transferir Abin para Ministério da Justiça em Lula 4", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 292503, "titulo": "Emendas limitam políticas públicas de longo prazo, diz cientista política", "url": "https://www.cnnbrasil.com.br/politica/emendas-limitam-politicas-publicas-de-longo-prazo-diz-cientista-politica/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-28T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A professora Vanessa Elias de Oliveira avaliou aspectos que dificultam a governabilidade do Executivo, incluindo o poder de parte significativa do orçamento pelo Congresso e as judicializações contra o Estado.", "titulo_pt": "Emendas limitam políticas públicas de longo prazo, diz cientista política", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 292504, "titulo": "Força do Congresso e emendas desafiam governabilidade, diz Carlos Melo", "url": "https://www.cnnbrasil.com.br/politica/forca-do-congresso-e-emendas-desafiam-governabilidade-diz-carlos-melo/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-28T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O professor do Insper, Carlos Melo, no WW Especial, identificou a crise de liderança, a falta de articulação entre os Poderes e a politização da Justiça como desafios para a governabilidade do país.", "titulo_pt": "Força do Congresso e emendas desafiam governabilidade, diz Carlos Melo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 292505, "titulo": "Caso Master mantém disputa no STF sobre quem vai comandar investigações", "url": "https://www.cnnbrasil.com.br/politica/caso-master-mantem-disputa-no-stf-sobre-quem-vai-comandar-investigacoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-28T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O caso Master mantém uma disputa no Supremo Tribunal Federal (STF) sobre quem será o responsável pelas investigações. Sem acordo entre os ministros, o impasse pode se estender até 2027.", "titulo_pt": "Caso Master mantém disputa no STF sobre comandante das investigações", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 292510, "titulo": "Lula quer garantir ministérios-chave antes de dividir Esplanada com centrão", "url": "https://www.cnnbrasil.com.br/politica/lula-quer-garantir-ministerios-chave-antes-de-dividir-esplanada-com-centrao/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-28T06:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula intensificou as discussões sobre ministérios-chave, anunciou a nomeação de Trabuco para a Fazenda e encaminhou a definição de Camilo para comandar a Casa Civil.", "titulo_pt": "Lula quer garantir ministérios-chave antes de dividir Esplanada com centrão", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 292368, "titulo": "Fundação FHC lamenta fala de Lula que chamou ex-presidente de 'morto-vivo'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/fundacao-fhc-lamenta-fala-de-lula-que-chamou-ex-presidente-de-morto-vivo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-28T04:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Fundação Fernando Henrique Cardoso se manifestou na sexta-feira (27) sobre declarações do presidente Lula, que chamou FHC de 'morto-vivo' durante um evento no Rio de Janeiro. A entidade negou que tenha havido uma visita recente de Lula a FHC e afirmou que o último encontro entre os dois ocorreu em junho de 2024.", "titulo_pt": "Fundação FHC se pronuncia sobre declarações de Lula que chamou FHC de 'morto-vivo'", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 292374, "titulo": "Fios clandestinos terão prazo para ser regularizados; entenda regras aprovadas pelo Congresso sobre compartilhamento de postes", "url": "https://g1.globo.com/politica/noticia/2026/11/28/fios-clandestinos-terao-prazo-para-ser-regularizados-entenda-regras-aprovadas-pelo-congresso-sobre-compartilhamento-de-postes.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-28T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Congresso Nacional aprovou um projeto de lei que redefine as regras para o compartilhamento dos postes de energia elétrica, criando mecanismos para regularizar instalações clandestinas e dando mais previsibilidade às disputas pelo uso dessa infraestrutura. O Brasil possui mais de 53 milhões de postes, utilizados por diversas empresas como internet, telefonia e TV por assinatura.", "titulo_pt": "Fios clandestinos terão prazo para ser regularizados; entenda as novas regras sobre compartilhamento de postes", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 292375, "titulo": "Nas escolas, 1 em cada 8 meninos admite ter criado nudes com IA; alunas e professoras são as vítimas", "url": "https://g1.globo.com/politica/noticia/2026/11/28/safernet-estudo-deepfake-escola.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-28T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo da ONG SaferNet Brasil revelou que 12,4% dos meninos adolescentes ouvidos admitiram ter criado pelo menos um deepfake sexual. Deepfakes são imagens ou vídeos manipulados usando inteligência artificial, frequentemente alterando rostos ou corpos para mostrar pessoas nuas ou realizando atos pornográficos.", "titulo_pt": "Em escolas, 1 em cada 8 meninos admite ter criado deepfakes sexuais com IA; alunas e professoras são as vítimas", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 292760, "titulo": "Gaza’s chess players survive a genocide and rebuild a community", "url": "https://www.aljazeera.com/features/2026/11/28/gazas-chess-players-survive-a-genocide-and-rebuild-a-community?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-28T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os jogadores de xadrez de Gaza estão retomando a prática do esporte após três anos de genocídio.", "titulo_pt": "Jogadores de xadrez de gaza retornam ao esporte após três anos de genocí  "Toda sucessão deve ser conversada. Foque na TIR da união familiar", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 292573, "titulo": "O silêncio da EC 141/26 sobre o segundo repouso remunerado", "url": "https://www.jota.info/opiniao-e-analise/colunas/regulacao-e-novas-tecnologias/o-silencio-da-ec-141-26-sobre-o-segundo-repouso-remunerado", "fonte_id": "jota", "data_pub": "2026-11-28T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute a questão sobre se o aditivo ou a vigência imediata se aplicam ao segundo repouso remunerado mencionado na EC 141/26.", "titulo_pt": "O silêncio da EC 141/26 sobre o segundo repouso remunerado", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 292498, "titulo": "Banco do Brasil deveria ter sido mais cauteloso com crédito, diz economista", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/banco-do-brasil-deveria-ter-sido-mais-cauteloso-com-credito-diz-economista/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-28T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O economista Aod Cunha afirmou que o Banco do Brasil deveria ter sido mais cauteloso na concessão de crédito para evitar uma nova diminuição no lucro líquido.", "titulo_pt": "Economista diz que banco do Brasil deveria ter sido mais cauteloso com crédito", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 292345, "titulo": "Data centers usam recursos brasileiros sem contribuir para desenvolvimento do país, diz Nina da Hora", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/data-centers-usam-recursos-brasileiros-sem-contribuir-para-desenvolvimento-do-pais-diz-nina-da-hora.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-28T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cientista da computação Nina da Hora afirma que a política de atração de data centers para o Brasil pode aprofundar a dependência tecnológica do país, já que as empresas multinacionais recebem recursos brasileiros sem garantir o desenvolvimento de tecnologias nacionais.", "titulo_pt": "Data centers aproveitam recursos brasileiros sem promover desenvolvimento tecnológico, alerta Nina da Hora", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 292347, "titulo": "Entenda as limitações impostas pelo BC para reduzir endividamento com crédito", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/entenda-as-limitacoes-impostas-pelo-bc-para-reduzir-endividamento-com-credito.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-28T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central anunciou medidas para reduzir o endividamento, com novas regras entrando em vigor em 1º de julho e 1º de novembro de 2027. As medidas foram anunciadas na quarta-feira (25).", "titulo_pt": "Entenda as limitações impostas pelo BC para reduzir o endividamento", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 292464, "titulo": "Empresa dribla punição do governo para ganhar novo contrato de R$ 156 mil", "url": "https://www.metropoles.com/colunas/tacio-lorran/empresa-dribla-punicao-do-governo-para-ganhar-novo-contrato-de-r-156-mil", "fonte_id": "metropoles", "data_pub": "2026-11-28T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público descobriu que uma empresa de fachada foi utilizada para desobedecer uma punição do governo. Como resultado, a recomendação é revogar um novo contrato no valor de R$ 156 mil.", "titulo_pt": "Empresa usa empresa fantasma para ganhar contrato de R$ 156 mil, diz mp", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 292732, "titulo": "Saudi Arabia shifts Vision 2030 spending amid economic and security pressure", "url": "https://www.cnbc.com/2026/11/28/saudi-arabia-vision-2030-spending.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-28T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Reino Árabe Saudita está mudando sua abordagem do Vision 2030, passando de um foco em 'gastos e implementação a qualquer custo' para uma abordagem em que a 'gastos e implementação com o custo certo' são prioridades, conforme declarado pelo Ministro de Economia Faisal Alibrahim à CNBC.", "titulo_pt": "Arábia saudita altera gastos do Vision 2030 diante da pressão econômica e de segurança", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 292733, "titulo": "Africa’s richest man is taking his mega-refinery public in a blockbuster IPO", "url": "https://www.cnbc.com/2026/11/28/dangote-refinery-oil-ipo-nigeria-africa-energy.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-28T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O IPO da Refinaria Dangote pode valer cerca de 47 bilhões de dólares, sendo esperado o maior listing de ações na bolsa africana.", "titulo_pt": "O mais rico da áfrica lista sua refinaria em IPO de grande escala", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 292577, "titulo": "Brasil amplia instrumentos de combate à pirataria audiovisual", "url": "https://www.jota.info/opiniao-e-analise/artigos/brasil-amplia-instrumentos-de-combate-a-pirataria-audiovisual", "fonte_id": "jota", "data_pub": "2026-11-28T05:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil expandiu os meios para combater a pirataria audiovisual, estabelecendo procedimentos para a remoção de conteúdos ilegais e o bloqueio de domínios, mesmo sem uma decisão judicial prévia.", "titulo_pt": "Brasil amplia ferramentas contra pirataria audiovisual", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 292759, "titulo": "Five US multinationals pay more tax to Ireland than anywhere else", "url": "https://www.ft.com/content/ec489542-0968-45d7-9dd7-985ad679f9b2?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-28T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novos dados mostram que cinco multinacionais dos Estados Unidos pagam mais impostos para Dublin do que em qualquer outro lugar. A análise sugere que a capital irlandesa se tornou 'a sede fiscal das corporações americanas'.", "titulo_pt": "Cinco multinacionais dos EUA pagam mais impostos para dublin do que em qualquer outro lugar", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 292348, "titulo": "Proteja o que tem valor", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/flavio-augusto/2026/11/proteja-o-que-tem-valor.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-28T04:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Guardamos nossos pertences valiosos em cofres para protegê-los de roubos. Desde cedo, aprendemos a ser cautelosos com nossos bens, especialmente em locais públicos.", "titulo_pt": "Proteja o que tem valor", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 292578, "titulo": "EUDR e o futuro do comércio global", "url": "https://www.jota.info/opiniao-e-analise/artigos/eudr-e-o-futuro-do-comercio-global", "fonte_id": "jota", "data_pub": "2026-11-28T04:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute rastreabilidade, exclusões ecológicas e a soberania ambiental do Brasil no contexto do futuro do comércio global.", "titulo_pt": "EUDR e o futuro do comércio global", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 292349, "titulo": "IA vira economista e produz profusão de estudos, mas erra e ainda não iguala humanos em boas ideias", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/ia-vira-economista-e-produz-profusao-de-estudos-mas-erra-e-ainda-nao-iguala-humanos-em-boas-ideias.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-28T03:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 1930, John Maynard Keynes previu que o acúmulo de capital e o avanço tecnológico permitiriam que as gerações futuras levassem uma vida de conforto e lazer. A inteligência artificial tem produzido numerosos estudos, mas ainda não iguala os humanos em qualidade de ideias.", "titulo_pt": "IA se torna economista, mas ainda não supera humanos em boa ideia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 292719, "titulo": "S&P threatens to downgrade France's credit rating as country enters recession", "url": "https://www.lemonde.fr/en/politics/article/2026/11/28/s-p-threatens-to-downgrade-france-s-credit-rating-as-country-enters-recession_6790324_5.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-28T02:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A agência de rating norte-americana S&P manteve a nota de crédito A+ de França, mas alterou sua perspectiva, abrindo caminho para uma possível redução da nota no médio prazo. O déficit orçamentário agravado tem inquietado os investidores.", "titulo_pt": "S&P ameaça rebaixar a nota de crédito da França ao entrar em recessão", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 292351, "titulo": "B3 quer usar criptoativo atrelado ao real em operações com ações; entenda", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/b3-quer-usar-criptoativo-atrelado-ao-real-em-operacoes-com-acoes-entenda.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-28T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A B3, em parceria com várias instituições financeiras, anunciou o desenvolvimento de um criptoativo atrelado ao real. O objetivo é permitir operações com ações usando este novo ativo digital.", "titulo_pt": "B3 quer usar criptoativo atrelado ao real em operações com ações; entenda", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 292352, "titulo": "'Desafio do setor não é falta de demanda, é baixar custo da moradia', diz Eduardo Fischer, CEO da MRV", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/desafio-do-setor-nao-e-falta-de-demanda-e-baixar-custo-da-moradia-diz-eduardo-fischer-ceo-da-mrv.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-28T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A MRV&Co, maior incorporadora de habitação popular do Brasil, está reduzindo a exposição a operações mais sensíveis aos juros e concentrando esforços no mercado nacional, onde vê oportunidades de crescimento apesar de desafios como o custo elevado do crédito, a pressão sobre os materiais de construção e a falta de trabalhadores.", "titulo_pt": "Desafio do setor não é falta de demanda, é baixar custo da moradia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 292598, "titulo": "Un compromiso “muy flexible” que llegó tarde: la COP31 y el manejo de la IA", "url": "https://www.latercera.com/nacional/noticia/un-compromiso-muy-flexible-que-llego-tarde-la-cop31-y-el-manejo-de-la-ia/", "fonte_id": "la_tercera", "data_pub": "2026-11-28T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A ONU estima que a huella hídrica dos centros de dados em 2030 será equivalente às necessidades de água de toda a população da África subsaariana e que a ocupação do solo por esses centros ultrapassará 14.500 km², área que dobrou o tamanho da área metropolitana de Jacarta.", "titulo_pt": "Um compromisso 'muito flexível' que chegou tarde: a COP31 e o gerenciamento da IA", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 292602, "titulo": "Adiós de Llanos marca fin de una era en la Segunda Sala: “Hice mi aporte a la defensa de los derechos de las personas y acceso a la justicia”", "url": "https://www.latercera.com/nacional/noticia/adios-de-llanos-marca-fin-de-una-era-en-la-segunda-sala-hice-mi-aporte-a-la-defensa-de-los-derechos-de-las-personas-y-acceso-a-la-justicia/", "fonte_id": "la_tercera", "data_pub": "2026-11-28T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ministro Llanos se aposentou após uma notável carreira judicial de 45 anos. Sua saída marca o fim de uma era, encerrando um legado iniciado por ex-supremos que investigaram casos de direitos humanos.", "titulo_pt": "Fim de uma era com a aposentadoria de Llanos na Segunda Sala", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 292900, "titulo": "Column: Beyond lithium and rare earths, fluorspar is a hidden chokepoint for chip production", "url": "https://www.digitimes.com/news/a20261127PD209/lithium-production-cobalt-materials-gallium.html", "fonte_id": "digitimes", "data_pub": "2026-11-28T07:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O debate sobre minerais críticos tem se concentrado em metais e metais semioorgânicos como lítio, cobalto, rares, grafite, gálio e germanio, como se a rivalidade geopolítica se desse apenas em eletródeos de baterias e materiais epitáxicos de chips. No entanto, uma cadeia de suprimentos menos visível, mas igualmente frágil, está por trás da fabricação de semicondutores: a cadeia fluoremática que começa com a fluoropasta, uma mineral composta principalmente de cálcio flúor (CaF2).", "titulo_pt": "Além de lítio e rares, fluoropasta é um ponto de gargalo oculto na produção de chips", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 292901, "titulo": "PCB supply risks may rival chip shortages, threatening next wave of AI and electronics growth", "url": "https://www.digitimes.com/news/a20261127PD226/pcb-demand-supply-chain-capacity-medical.html", "fonte_id": "digitimes", "data_pub": "2026-11-28T07:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Associação Global de Eletrônicos informa que as faltas na cadeia de suprimentos de placas de circuito impresso estão se agravando, com empresas dos setores automotivo, industrial, médico e de telecomunicações relatando que a demanda crescente por inteligência artificial está consumindo a capacidade limitada. Isso está resultando em prazos de entrega estendidos e restrições de suprimento, colocando a produção em risco.", "titulo_pt": "Riscos de suprimento de placas de circuito impresso podem igualar escassez de chips, ameaçando o próximo ciclo de crescimento de AI e eletrônicos", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 292902, "titulo": "Nvidia's Southeast Asia shipment freeze tests Taiwan's AI-server manufacturing hedge", "url": "https://www.digitimes.com/news/a20261127VL214/ai-server-capacity-manufacturing-regulation-nvidia-taiwan.html", "fonte_id": "digitimes", "data_pub": "2026-11-28T07:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A suspensão das exportações de servidores AI para a Ásia Oriental testa a capacidade das fabricantes taiwanesas de servidores AI como uma alternativa industrial para as incertezas geopolíticas da competição tecnológica entre Estados Unidos e China.", "titulo_pt": "Paralisação das exportações de servidores ai para a ásia oriental testa a fabricação taiwanesa", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 292903, "titulo": "Samsung, SK Hynix pursue different DRAM designs", "url": "https://www.digitimes.com/news/a20261127VL215/samsung-dram-sk-hynix-data-production.html", "fonte_id": "digitimes", "data_pub": "2026-11-28T07:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Samsung e SK Hynix estão adotando abordagens diferentes para aumentar a densidade de memória DRAM, enquanto os capacitores usados para armazenar dados se tornam mais difíceis de miniaturizar. Samsung está desenvolvendo células de memória empilhadas verticalmente, enquanto a SK Hynix está testando um design que elimina completamente o capacitor.", "titulo_pt": "Samsung e SK Hynix buscam designs diferentes para DRAM", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 292904, "titulo": "Samsung hesitates to take on Nvidia in robot chips", "url": "https://www.digitimes.com/news/a20261127VL217/samsung-robot-chips-nvidia-demand.html", "fonte_id": "digitimes", "data_pub": "2026-11-28T07:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em outubro, a Coreia do Sul pediu à Samsung Eletrônicos para desenvolver uma alternativa nacional ao plataforma de computação robótica Jetson Thor da Nvidia, mas a fabricante de chips expressou reservas sobre a demanda no mercado, conforme relatado pela emissora sul-coreana MTN, citando um oficial do governo.", "titulo_pt": "Samsung hesita em competir com a Nvidia em chips robóticos", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 292905, "titulo": "LG AI Research targets data and model bottlenecks in smart manufacturing", "url": "https://www.digitimes.com/news/a20261126PD233/data-lg-adoption-manufacturing-materials.html", "fonte_id": "digitimes", "data_pub": "2026-11-28T07:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A LG AI Research está automatizando a preparação de dados, construindo modelos de base especializados e estabelecendo um laboratório autônomo para facilitar a adoção e o uso contínuo de IA, especialmente no setor de manufatura.", "titulo_pt": "LG AI Research almeja superar gargalos de dados e modelos em fabricação inteligente", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 292906, "titulo": "GenAI fails to spur upgrades as smartphone shipments face 2027 decline", "url": "https://www.digitimes.com/news/a20261127PD206/shipments-2027-2026-genai-sales.html", "fonte_id": "digitimes", "data_pub": "2026-11-28T07:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As preços de memória estão aumentando, o que deve levar a uma queda superior a 15% nas remessas globais de smartphones em 2026. A pesquisa prevê que as remessas de smartphones caiam ainda mais em 6% em 2027, devido a aumentos de custos, redução de modelos intermediários e de entrada por parte das marcas e a atraso nas atualizações pelos consumidores.", "titulo_pt": "Genai não impulsiona atualizações enquanto remessas de smartphones devem cair 20% em 2027", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 292907, "titulo": "Alpha Networks to ship 1.6T switches in small volumes in December", "url": "https://www.digitimes.com/news/a20261127PD205/alpha-networks-shipments-2026-revenue-data-center.html", "fonte_id": "digitimes", "data_pub": "2026-11-28T07:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alpha Networks planeja iniciar as entregas em pequenas volumes de seus switches de 1,6T em dezembro de 2026, com o objetivo de expandir as entregas para clientes de grandes data centers em 2027. A empresa também está em negociações ativas com várias grandes empresas de data centers para impulsionar o crescimento de suas operações.", "titulo_pt": "Alpha Networks vai iniciar pequenas entregas de switches de 1,6T em dezembro de 2026", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 292908, "titulo": "Jingcai eyes gradual 2027 recovery with Zero Code smart displays", "url": "https://www.digitimes.com/news/a20261127PD204/2027-recovery-demand-equipment-2026.html", "fonte_id": "digitimes", "data_pub": "2026-11-28T07:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jingcai Optoelectronics espera uma recuperação gradual em 2027 com o aumento da demanda para alguns projetos importantes e a retomada de encomendas. A empresa planeja expandir suas operações para incluir displays industriais de grande porte, painéis de aplicação especializada e soluções de exibição inteligente Zero Code para entrar em novos mercados.", "titulo_pt": "Jingcai mira recuperação gradual em 2027 com displays inteligentes Zero Code", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 292909, "titulo": "Wellysun accelerates transformation, targets AI liquid cooling, NPO, autonomous systems", "url": "https://www.digitimes.com/news/a20261127PD202/liquid-cooling-revenue-communications-shipments-2026.html", "fonte_id": "digitimes", "data_pub": "2026-11-28T07:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Wellysun, fabricante de módulos eletrônicos de controle automotivo, realizou uma conferência de investidores em 26 de novembro de 2026. A empresa está acelerando sua transformação para se tornar um parceiro estratégico para módulos eletrônicos de alta gama, focando em quatro áreas: refrigeração líquida de IA, comunicações ópticas NPO, sistemas autônomos e satélites em baixa órbita.", "titulo_pt": "Wellysun acelera transformação, almeja sistemas autônomos e refrigeração líquida de IA", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 292884, "titulo": "(2nd LD) Lee vows all-out efforts to lead AI race at data center groundbreaking in Gangwon", "url": "https://en.yna.co.kr/view/AEN20261128001552315", "fonte_id": "yonhap_news", "data_pub": "2026-11-28T06:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Lee Jae Myung prometeu mobilizar esforços para levar Coreia do Sul à frente na corrida de inteligência artificial durante a cerimônia de inauguração de um centro de dados em Gangwon. O evento ocorreu em Seul no dia 28 de novembro.", "titulo_pt": "Lee promete esforços totais para liderar corrida de IA em cerimônia de inauguração de centro de dados", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 292508, "titulo": "Falha de software interrompe chegada da espaçonave bilionária a Mercúrio; Japão e Europa são responsáveis pelo projeto", "url": "https://www.cnnbrasil.com.br/ciencia/falha-de-software-interrompe-chegada-da-espaconave-bilionaria-a-mercurio-japao-e-europa-sao-responsaveis-pelo-projeto/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-28T06:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um problema técnico alterou a trajetória da espaçonave, que passará 75 horas orbitando Mercúrio, reduzindo a margem para correções futuras. Japão e Europa são responsáveis pelo projeto.", "titulo_pt": "Falha de software altera trajetória da espaçonave a Mercúrio; Japão e Europa são responsáveis", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 292471, "titulo": "É preciso entender a IA para evitar novos ataques hackers, diz co-CEO da Binance", "url": "https://exame.com/future-of-money/e-preciso-entender-a-ia-para-evitar-novos-ataques-hackers-diz-co-ceo-da-binance/", "fonte_id": "exame", "data_pub": "2026-11-28T06:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O co-CEO da Binance enfatizou a importância de compreender a inteligência artificial (IA) para prevenir novos ataques cibernéticos. A corretora está melhorando sua cibersegurança e expandindo sua atuação além das criptomoedas.", "titulo_pt": "É preciso entender a IA para evitar novos ataques hackers, diz co-ceo da Binance", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 292472, "titulo": "IA no navegador: o que muda quando o assistente lê, compara e preenche a página por você", "url": "https://exame.com/inteligencia-artificial/ia-no-navegador-o-que-muda-quando-o-assistente-le-compara-e-preenche-a-pagina-por-voce/", "fonte_id": "exame", "data_pub": "2026-11-28T06:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ferramentas de inteligência artificial que podem interagir diretamente com sites estão começando a automatizar tarefas que antes exigiam uma sequência de cliques e consultas manuais.", "titulo_pt": "IA no navegador: o que muda quando o assistente lê, compara e preenche a página por você", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 292607, "titulo": "Identifican una proteína que conecta el reloj biológico con la inmunidad vegetal", "url": "https://www.lanacion.com.ar/economia/campo/tecnologias/identifican-una-proteina-que-conecta-el-reloj-biologico-con-la-inmunidad-vegetal-nid28112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-28T09:56:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Cientistas do Conicet identificaram uma proteína que conecta o relógio biológico das plantas com sua capacidade de enfrentar doenças. Este avanço abre possibilidades para o desenvolvimento de engenharia genética para culturas como soja, trigo e milho.", "titulo_pt": "Cientistas identificam proteína que conecta relógio biológico com imunidade vegetal", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 292344, "titulo": "Diários desvelam trajetória de historiadora negra que fez carreira no Senegal", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/diarios-desvelam-trajetoria-de-historiadora-negra-que-fez-carreira-no-senegal.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-28T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A historiadora negra descreve sua chegada ao Senegal, onde enfrenta dificuldades com a língua francesa e acredita que precisará retornar à escola para aprender o básico.", "titulo_pt": "Diários revelam trajetória de historiadora negra no Senegal", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 292941, "titulo": "CRISPR is now being used to control genes, not just edit them", "url": "https://www.newscientist.com/article/2601111-crispr-is-now-being-used-to-control-genes-instead-of-editing-them/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tratamentos baseados em CRISPR que funcionam ao ativar ou desativar genes estão sendo testados em ensaios clínicos e podem ser ainda mais poderosos do que a edição genética convencional.", "titulo_pt": "CRISPR agora está sendo usado para controlar genes, não apenas editar", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 292622, "titulo": "La NASA reveló imágenes inéditas de la Tierra tomadas por dos satélites que se dirigen a Marte", "url": "https://www.lanacion.com.ar/el-mundo/la-nasa-revelo-imagenes-ineditas-de-la-tierra-tomadas-por-dos-satelites-que-se-dirigen-a-marte-nid28112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-28T06:56:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A NASA divulgou imagens inéditas da Terra capturadas por dois satélites que viajam em direção a Marte. A missão Escapade realizou as fotografias a uma distância de 62.000 quilômetros.", "titulo_pt": "A NASA revelou imagens inéditas da terra tomadas por dois satélites que se dirigem a Marte", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 292847, "titulo": "Chinese engineers defy Hormuz blockade to install Abu Dhabi drilling rigs", "url": "https://www.scmp.com/news/china/article/3376116/chinese-engineers-defy-hormuz-blockade-install-abu-dhabi-drilling-rigs", "fonte_id": "scmp", "data_pub": "2026-11-28T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Engenheiros chineses defiam bloqueios de guerra no Estreito de Ormuz para instalar plataformas de perfuração em Abu Dhabi. Uma equipe da Honghua Group, filial do grupo estatal Dongfang Electric Group, transportou dois equipamentos de perfuração inteligentes para Abu Dhabi e levantou o tripé de uma terceira plataforma no mesmo local.", "titulo_pt": "Engenheiros chineses desafiam bloqueio de guerra para instalar plataformas de perfuração em Abu Dhabi", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 292927, "titulo": "APOD: 2026 November 28 – Apollo 17 VIP Site Anaglyph", "url": "https://science.nasa.gov/image-article/apod-2026-november-28-apollo-17-vip-site-anaglyph/", "fonte_id": "nasa_news", "data_pub": "2026-11-28T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia da APOD em 28 de novembro de 2026 apresenta o site VIP do Apollo 17, mostrando uma visão tridimensional do local onde a missão lunar realizou suas atividades. A imagem é um anaglofisco, permitindo visualização 3D com óculos especiais.", "titulo_pt": "APOD: 28 de novembro de 2026 – Site VIP do Apollo 17 em anaglofisco", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 292928, "titulo": "Math Puzzle: A disagreeable drive", "url": "https://www.scientificamerican.com/article/math-puzzle-disagreeable-drive/", "fonte_id": "scientific_american", "data_pub": "2026-11-28T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O desafio matemático proposto neste texto é um acertijo mental para o fim de semana. Os leitores são incentivados a participar imediatamente.", "titulo_pt": "Puzzle matemático: uma viagem desagradável", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 292910, "titulo": "Researchers explore the use of AI and smart sensors to improve food safety quickly, affordably", "url": "https://phys.org/news/2026-11-explore-ai-smart-sensors-food.html", "fonte_id": "phys_org", "data_pub": "2026-11-28T04:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O projeto smartJAN, desenvolvido pelo grupo de pesquisa eVIDA da Universidade de Deusto em colaboração com Kernet e Fundación Miranda, criou um protótipo funcional capaz de detectar a presença de LTPs (proteínas de transferência de lípidos), uma família de proteínas de plantas que inclui alérgenos capazes de provocar reações alérgicas severas. Esses alérgenos são particularmente relevantes na região Mediterrânea.", "titulo_pt": "Pesquisadores exploram o uso de IA e sensores inteligentes para melhorar a segurança alimentar de forma rápida e econômica", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 292813, "titulo": "Evidence of deepest explosive volcanic eruption found in Pacific trench", "url": "https://www.japantimes.co.jp/news/2026/11/28/world/science-health/deepest-explosive-volcanic-eruption/", "fonte_id": "japan_times", "data_pub": "2026-11-28T03:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores estão investigando como erupções explosivas ocorreram a uma profundidade de 6.500 metros abaixo do nível do mar. Eles buscam entender o mecanismo desses eventos vulcânicos extremamente profundos.", "titulo_pt": "Evidências de erupção vulcânica mais profunda encontradas na fossa do pacífico", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 292911, "titulo": "Event Horizon Telescope views the dynamics and geometry of a black hole jet in extreme detail", "url": "https://phys.org/news/2026-11-event-horizon-telescope-views-dynamics.html", "fonte_id": "phys_org", "data_pub": "2026-11-28T02:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Telescópio do Horizonte Eventual (EHT), uma colaboração internacional de cientistas e observatórios de rádio, produziu imagens detalhadas de jatos relativísticos emanando de 3C 84 e do buraco negro supermassivo no centro da galáxia M87* entre 2024 e 2026. Este projeto, que já nos proporcionou a primeira imagem de um buraco negro em 2019, continua a revelar novos detalhes sobre a dinâmica e a geometria desses fenômenos interestelares.", "titulo_pt": "Telescópio do horizonte eventual observa detalhadamente os jatos de um buraco negro em 3c 84 e m87*", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 292912, "titulo": "Should space data centers run on solar panels, nuclear reactors or both?", "url": "https://phys.org/news/2026-11-space-centers-solar-panels-nuclear.html", "fonte_id": "phys_org", "data_pub": "2026-11-28T01:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a possibilidade de usar fontes de energia alternativas, como reatores nucleares, para alimentar os centros de dados espaciais, em vez dos painéis solares, que contribuem significativamente para o peso desses sistemas.", "titulo_pt": "Os centros de dados espaciais deveriam ser alimentados por painéis solares ou reatores nucleares, ou ambos?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 292913, "titulo": "New technologies help Natural History Museum uncover 92 species in its transformed gardens", "url": "https://phys.org/news/2026-11-technologies-natural-history-museum-uncover.html", "fonte_id": "phys_org", "data_pub": "2026-11-28T00:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Jardim Transformado do Museu de História Natural em South Kensington está revelando novos insights sobre a vida selvagem urbana de Londres. Entre as 92 espécies registradas pela primeira vez no local entre julho de 2024 e o final de 2025 estão a imponente lagarta imperatriz e a pequena libélula-damselfly com olhos vermelhos.", "titulo_pt": "Novas tecnologias ajudam museu de história Natural a descobrir 92 espécies em seus jardins transformados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 292914, "titulo": "RNA discovery reveals how gut bacterium adapts to life in intestinal mucus", "url": "https://phys.org/news/2026-11-rna-discovery-reveals-gut-bacterium.html", "fonte_id": "phys_org", "data_pub": "2026-11-28T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores identificaram um regulador-chave que ajuda bactérias do intestino a se adaptarem ao ambiente mucoso, onde nutrientes são escassos e as condições são severas. Este estudo foi realizado em colaboração entre o Instituto Helmholtz para Pesquisa em RNA-Baseada em Infeções (HIRI), a Chair de Microbiologia da Julius-Maximilians-Universität em Würzburg, e cientistas do Vanderbilt Health nos Estados Unidos.", "titulo_pt": "Descoberta de RNA revela como bactéria do intestino se adapta ao muco intestinal", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 292915, "titulo": "AI simulates electron hops over far longer times than conventional quantum calculations", "url": "https://phys.org/news/2026-11-ai-simulates-electron-longer-conventional.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T23:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial pode simular os movimentos de elétrons em materiais por períodos muito mais longos do que os cálculos quantíicos convencionais. Isso permite prever como um material reagirá, mesmo que os átomos permaneçam estáticos, pois o movimento de elétrons pode alterar significativamente a distribuição de carga elétrica e a reatividade química do material.", "titulo_pt": "IA simula movimentos de elétrons em períodos muito mais longos do que cálculos quantíicos convencionais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 292916, "titulo": "Targeted conversion of carbon dioxide into chemical feedstocks: CO₂ helps shape its own catalyst", "url": "https://phys.org/news/2026-11-conversion-carbon-dioxide-chemical-feedstocks.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T23:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Electroquímicos da Universidade de Duisburg-Essen descobriram, por meio de simulações computacionais, que o dióxido de carbono (CO₂) ajuda a moldar a superfície de seu próprio catalisador quando este é reestruturado usando pulsos de voltagem. Os cálculos sugerem que isso permite a conversão preferencial de CO₂ em ácido formílico.", "titulo_pt": "Conversão alvo de dióxido de carbono em substratos químicos: CO₂ ajuda a moldar seu próprio catalisador", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 292917, "titulo": "Rocks under the lens: A simple microscope opens new possibilities for quantitative rock analysis", "url": "https://phys.org/news/2026-11-lens-simple-microscope-possibilities-quantitative.html", "fonte_id": "phys_org", "data_pub": "2026-11-27T23:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pedras contêm informações valiosas sobre a história da Terra. O tamanho, forma e orientação das partículas minerais que as compõem podem revelar como as rochas foram formadas, deformadas e mudaram profundamente abaixo da superfície. No entanto, coletar essas informações tradicionalmente requer equipamentos especializados e análise demorada.", "titulo_pt": "Pedras sob o microscópio: um microscópio simples abre novas possibilidades para o análise quantitativa de rochas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 292942, "titulo": "Five novelty streetwear products that add a touch of fun to the everyday", "url": "https://www.dezeen.com/2026/11/28/novelty-streetwear-products-elevate-everyday/", "fonte_id": "dezeen", "data_pub": "2026-11-28T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Dezeen listou cinco produtos de streetwear inusitados de grandes marcas, incluindo uma mochila hoodie para esconder burritos do Chipotle e Crocs em forma de grandes blocos de Lego. Esses itens adicionam um toque de diversão ao cotidiano.", "titulo_pt": "Cinco produtos de streetwear novos que trazem diversão ao cotidiano", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 292944, "titulo": "The Met’s Orientalism Exhibition Puts Edward Said on Display—and His Critique Aside", "url": "https://www.artnews.com/art-in-america/aia-reviews/met-orientalism-edward-said-osman-hamdi-bey-jean-leon-gerome-1234808013/", "fonte_id": "artnews", "data_pub": "2026-11-28T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A exposição do Met sobre orientalismo não parece abordar as premissas ideológicas da representação orientalista, mas sim as torna novamente respeitáveis.", "titulo_pt": "Exposição do Met sobre orientalismo exibe Edward Said e ignora sua crítica", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 292839, "titulo": "More than a lanyard: making hidden disabilities visible at Hong Kong airport", "url": "https://www.scmp.com/news/hong-kong/society/article/3376126/more-lanyard-making-hidden-disabilities-visible-hong-kong-airport", "fonte_id": "scmp", "data_pub": "2026-11-28T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lisa De Vriese, uma ilustradora de 34 anos que vive com o distúrbio de espectro de hiperelasticidade (HSD), chegou exausta e em dor após uma viagem de 16 horas do Belgica ao Aeroporto Internacional de Hong Kong. Durante sua passagem pela imigração e alfândega, ela se sentiu panificada devido à sua condição crônica que causa dor diária, fadiga e inestabilidade articular.", "titulo_pt": "Mais do que um lanyard: tornando deficiências ocultas visíveis no aeroporto de Hong Kong", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 292583, "titulo": "Paula Carrasco, escritora: “Por mucho que tratemos de acallarla, la memoria siempre está latiendo”", "url": "https://www.latercera.com/culto/noticia/paula-carrasco-escritora-por-mucho-que-tratemos-de-acallarla-la-memoria-siempre-esta-latiendo/", "fonte_id": "la_tercera", "data_pub": "2026-11-28T09:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Paula Carrasco, escritora e psicóloga chilena, baseou seu novo livro 'Sangue Negro' em um recorte infantil relacionado ao fogo. O romance, ambientado em um povoado do Cordillerano, explora segredos familiares e a influência
