<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>
const D = {"gerado_em": "17/11/2026 07:32", "stats": {"noticias_novas": 808, "resumos_gerados": 252}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Senado retoma a votação do projeto de ajuste fiscal, após aprovar o texto-base na semana passada. A análise inclui quatro destaques que podem alterar regras sobre gastos públicos, créditos tributários e repasses a Estados e municípios. Paralelamente, a Polícia Federal deve apresentar relatórios ao juiz Fachin sobre ministros do Supremo Tribunal Federal, em um caso que completa um ano sem conclusão. O presidente Lula enfrenta desafios para formar uma base no Congresso, especialmente com o Centrão, e defende o projeto de ajuste fiscal, minimizando a reação do mercado. Além disso, o partido PP estuda lançar o secretário da Segurança Pública de São Paulo para a prefeitura de São Paulo em 2028, e a defesa de Daniel Vorcaro, fundador do Master, tenta reverter sua prisão após um ano no caso.", "mundo": "A Turquia realizou uma intervenção significativa na mídia, tomando o controle da estação de televisão Sozcu TV, uma das últimas estações independentes do país, e colocando-a sob supervisão do estado. No contexto geopolítico, o presidente dos Estados Unidos, Donald Trump, iniciou uma viagem de 48 horas pela Ásia, com encontros com líderes chineses e russos. Em um conflito na Ucrânia, ataques causaram danos significativos à ponte de Kerch, interrompendo o acesso terrestre entre a Rússia e a Península de Crimea. Na política sérvia, a vitória da Lista Estudantil nas eleições históricas levou os novos deputados a se reunirem para a sessão inaugural do novo parlamento, marcando o início de um novo governo após 14 anos de liderança do populista Aleksandar Vučić.\n\nAs tensões geopolíticas continuam a se aprofundar, com o Japão acusando a Rússia de invadir seu espaço aéreo, levando a despistagem de caças. Em outro desenvolvimento, a Ucrânia danificou a ponte de Kerch, que liga a Rússia à Crimeia, enquanto a Rússia bombardeou pontes em Kyiv, intensificando os ataques em infraestrutura crítica. Durante a cúpula do APEC em Manila, Donald Trump se reunirá com Xi Jinping, marcando o quarto encontro entre os líderes desde uma trégua nos relacionamentos entre Washington e Pequim. No entanto, há sinais de que a trégua está começando a se deteriorar. Além disso, Israel continua sua operação no sul do Líbano, causando consequências devastadoras para a população local, enquanto o primeiro-ministro Benjamin Netanyahu alerta que a Europa está entre os objetivos dos misseis iranianos. Além disso, o Irã escalou as ameaças, e um terceiro porta-aviões dos Estados Unidos chegou ao Golfo Pérsico, aumentando as preocupações com a possibilidade de uma ressurgência de tensões militares.", "economia": "A Coreia do Sul está prestes a alcançar uma marca histórica de exportações de 1 trilhão de dólares, conforme informou o Fundo Monetário Internacional (FMI), refletindo o boom nas exportações de chips. Em contraste, a Apple enfrentará um julgamento em junho de 2027 na França por supostas práticas de obsolescência programada, o que poderia afetar significativamente a empresa. No Brasil, o Santander realiza um leilão com 195 imóveis residenciais em 20 estados, com lances a partir de R$ 34 mil, enquanto o aluguel residencial continua a subir acima da inflação em várias regiões do país. A reforma da Previdência do Brasil também está em pano de fundo, com novas regras para aposentadoria a partir de 2027, enquanto o mercado financeiro brasileiro discute como evitar novas quebras de bancos, como a do Master, que já custou mais de R$ 75 bilhões ao Fundo Garantidor de Créditos (FGC) e outras instituições. Além disso, a Taiwan está considerando medidas fiscais mais rigorosas para combater transações imobiliárias rápidas, enquanto o Japão registra um paradoxo econômico com o dólar taiwanês atingindo seu nível mais baixo em uma década, apesar do boom na inteligência artificial no país.", "tecnologia": "O Departamento de Justiça dos Estados Unidos está investigando criminalmente a Megaspeed, uma empresa de computação em nuvem com sede em Singapura, por supostas violações de controles de exportação de chips dos EUA. Esta investigação, aberta pelo Departamento de Comércio em 2024, surgiu após a detecção de atividades suspeitas durante o monitoramento de possíveis divagações de semicondutores sensíveis. Paralelamente, a startup alemã Nomadic levantou $6 milhões em uma rodada de financiamento de semente para desenvolver drones autônomos que se carregam diretamente de linhas de alta tensão. A adesso Ventures, unidade de venture capital do grupo adesso, concluiu o primeiro fechamento de sua segunda fundo, arrecadando mais de 26 milhões de euros. Além disso, a Coreia do Sul se juntou a uma iniciativa espacial liderada pela OTAN na área de Starlift para melhorar suas capacidades de lançamento, enquanto a Hyundai Motor adquiriu integralmente a Boston Dynamics, acelerando seu esforço para comercializar o robô humanoide Atlas. Estes eventos refletem a crescente importância da tecnologia em diversos setores, desde a segurança cibernética até a inovação industrial, com destaque para questões relacionadas à inteligência artificial e à sustentabilidade.", "ciencia": "Um estudo revolucionário, realizado pela Universidade de St Andrews em parceria com instituições internacionais, permitiu a sequência completa do genoma de uma baleia-joré sem a necessidade de amostras invasivas, utilizando 'snot' coletado por drones. Este é o primeiro caso histórico mundial de genoma completo de uma baleia sequenciado dessa forma. Paralelamente, um relatório da UNESCO mostrou que modelos de inteligência artificial (IA) abandonaram fatos climáticos para concordar com os usuários em oito dos dez testes realizados, destacando a necessidade de maior transparência e precisão na IA climática. Este evento é crucial para entender os desafios éticos e científicos associados à IA no combate às mudanças climáticas.", "cultura": "O evento mais importante dos artigos é a escolha de Robert Pattinson como novo James Bond. Após a confirmação do ator, ainda há questões a serem resolvidas, como o roteiro, título, cenário, elenco, branding e promoção. Paralelamente, a Academia Internacional de Cinema enfrenta uma crise financeira que está afetando o pagamento de professores, a continuidade das aulas e o atendimento aos alunos. A escolha de Robert Pattinson também levantou discussões sobre a próxima novela de Walcyr Carrasco, que afirmou aceitar as decisões da empresa em relação a uma cena de sexo entre os personagens Mau Mau e Felipe na novela 'Quem Ama Cuida'. Além disso, a escritora Conceição Evaristo, que completa 80 anos, será homenageada em uma ópera intitulada 'Conceição Evaristo - Uma Ópera Escrevivência', que estreia no Teatro São Pedro em São Paulo. A cantora Mariah Carey realiza um show natalino único no Nubank Parque em São Paulo no dia 17 de dezembro, enquanto Gilberto Gil será agraciado com o título de doutor honoris causa pela Universidade de São Paulo em cerimônia marcada para o dia 9 de dezembro.", "sociedade": "Um suposto plano de mass shooting em uma escola filipina foi impedido após denúncias do FBI, com a participação de várias agências de law enforcement. Em contraste, no Brasil, a situação social revela a persistência do racismo e do desigual acesso a oportunidades de emprego e renda, com 81% das pessoas acreditando que a violência policial afeta principalmente os negros. No Brasil, um projeto de lei propõe garantir 30 dias úteis de férias a trabalhadores, enquanto a polícia investiga um incidente onde uma menina de 5 anos foi atingida por um tiro dentro de casa no Rio de Janeiro. No exterior, a Costa Rica enfrenta um aumento da criminalidade organizada, com um jornalista sendo assassinado, enquanto a Costa do Marfim prepara-se para uma possível volta do sarampo, apesar de melhorias no México.", "meio_ambiente": "A COP31, realizada no Azerbaijão, discutiu a transição energética justa e o financiamento para proteger oceanos e florestas. Ministros, cientistas e lideranças indígenas debateram investimentos, direitos territoriais e cooperação internacional. No entanto, o esforço para eletrificar o transporte, edificações e indústria está estagnado, com 24 nações não apoiando a meta reconhecida de aumentar a participação da eletricidade no consumo final de energia global para 35% até 2035. No Brasil, um sistema chamado 'llave de paso' foi instalado no Puente La Noria para interceptar até 80% dos resíduos flutuantes antes que eles cheguem ao Río de la Plata. Além disso, o Brasil registrou sua primeira morte por mpox e adquiriu 25 mil doses de imunizantes para grupos prioritários. No exterior, Hong Kong estabeleceu sua primeira rota marítima verde com a Grécia para promover a decarbonização marítima, enquanto a Tailândia relatou a ocorrência de peixes com lesões incomuns, conhecidos localmente como 'peixes-zumbi', levantando preocupações sobre a poluição do rio Mekong com metais pesados.", "direitos_humanos": "Um dos principais temas abordados nos artigos é a ameaça de morte feita pelo filho de um dos narcotraficantes mais procurados de Rosário, Esteban Alvarado, após sua detenção. Santino Alvarado, de 21 anos, ameaçou a Polícia de Rosário, dizendo que se seus pais não fossem libertados, a família começaria a matar inocentes. Em outro desenvolvimento, a ONU documentou uma grave crise de direitos humanos no Bangladesh, enquanto o país pagava as instituições responsáveis por essa crise para desempenharem um papel de manutenção da paz em outros lugares. Além disso, a justiça na Macedônia do Norte argumentou pela necessidade de melhor proteção para vítimas de feminicídio, com a necessidade de uma coleta mais rápida de evidências após relatos de abuso e penas mais severas para os assassinos."}, "resumo_do_dia": {"politica_nacional": [{"id": 268744, "titulo": "Com ajuste fiscal sob pressão do mercado e da esquerda, Senado retoma votação", "url": "https://veja.abril.com.br/economia/com-ajuste-fiscal-sob-pressao-do-mercado-e-da-esquerda-senado-retoma-votacao/", "fonte_id": "veja", "data_pub": "2026-11-17T09:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado retoma a votação do projeto de ajuste fiscal após aprovação do texto-base na semana passada. A Casa vai analisar destaques ao projeto.", "titulo_pt": "Senado retoma votação do ajuste fiscal", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 268771, "titulo": "Caso Master: PF deve apresentar nesta 4ª relatórios sobre ministros do STF", "url": "https://www.metropoles.com/brasil/caso-master-pf-deve-apresentar-nesta-4a-relatorios-sobre-ministros-do-stf", "fonte_id": "metropoles", "data_pub": "2026-11-17T09:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal deve apresentar relatórios sobre ministros do Supremo Tribunal Federal (STF) ao juiz federal Renato Fehér Fachin nesta quarta-feira. A entrega desses documentos ocorre 12 dias após o afastamento dos delegados que coordenavam o Caso Master.", "titulo_pt": "PF deve apresentar relatórios sobre ministros do STF a fachin nesta quarta-feira", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 268779, "titulo": "Com salários de até R$ 3,5 mil, DF tem 719 vagas de emprego nesta terça", "url": "https://www.metropoles.com/distrito-federal/com-salarios-de-ate-r-35-mil-df-tem-719-vagas-de-emprego-nesta-terca", "fonte_id": "metropoles", "data_pub": "2026-11-17T09:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Distrito Federal oferece 719 vagas de emprego com salários até R$ 3,5 mil, abrangendo diversos níveis de escolaridade e funções sem exigência de experiência profissional.", "titulo_pt": "DF tem 719 vagas de emprego com salários até R$ 3,5 mil nesta terça", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 268765, "titulo": "Saiba quais ações estão na pauta do STJ nesta 3ª feira", "url": "https://www.poder360.com.br/poder-justica/saiba-quais-acoes-estao-na-pauta-do-stj-nesta-3a-feira-2/", "fonte_id": "poder360", "data_pub": "2026-11-17T09:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Superior Tribunal de Justiça (STJ) julgará nesta terça-feira ações envolvendo auxílio-acidente, devolução de pagamentos indevidos pelo Instituto Nacional de Seguro Social (INSS) e revisão de recuperação judicial.", "titulo_pt": "Saiba quais ações estão na pauta do STJ nesta terça-feira", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 268766, "titulo": "Caso Master faz 1 ano com apuração sobre ministros do STF travada", "url": "https://www.poder360.com.br/poder-justica/caso-master-faz-1-ano-com-apuracao-sobre-ministros-do-stf-travada/", "fonte_id": "poder360", "data_pub": "2026-11-17T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O caso Master, que envolve mensagens suspeitas, completa um ano sem conclusão da apuração sobre ministros do STF. Fachin determinou a investigação das citações aos 10 ministros.", "titulo_pt": "Caso Master completa 1 ano com apuração sobre ministros do STF travada", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 268767, "titulo": "Primeira prisão de Daniel Vorcaro completa 1 ano; relembre", "url": "https://www.poder360.com.br/poder-justica/primeira-prisao-de-daniel-vorcaro-completa-1-ano-relembre/", "fonte_id": "poder360", "data_pub": "2026-11-17T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Daniel Vorcaro, fundador do Master, completou um ano preso em novembro de 2025. Ele foi solto em novembro de 2025, mas voltou a ser detido em março de 2026 e continua buscando liberdade.", "titulo_pt": "Primeira prisão de Daniel Vorcaro completa 1 ano; relembre", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 268768, "titulo": "Vorcaro tenta reverter prisão após 1 ano de caso Master", "url": "https://www.poder360.com.br/poder-justica/vorcaro-tenta-reverter-prisao-apos-1-ano-de-caso-master/", "fonte_id": "poder360", "data_pub": "2026-11-17T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A defesa do réu tenta reverter sua prisão após um ano no caso Master, acionando a Comissão Interamericana de Direitos Humanos para revisar a prisão e questionar a relatoria provisória do juiz Fachin.", "titulo_pt": "Vorcaro tenta reverter prisão após 1 ano de caso Master", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 268770, "titulo": "Senado vota 4 destaques do ajuste fiscal nesta 3ª feira", "url": "https://www.poder360.com.br/poder-congresso/senado-vota-4-destaques-do-ajuste-fiscal-nesta-3a-feira/", "fonte_id": "poder360", "data_pub": "2026-11-17T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado vai votar 4 destaques relacionados ao ajuste fiscal nesta terça-feira. As propostas poderão modificar regras sobre gastos públicos, créditos tributários e repasses a Estados e municípios.", "titulo_pt": "Senado vota 4 destaques do ajuste fiscal nesta terça-feira", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 268724, "titulo": "Lei de Drogas consumiu R$ 14,5 bilhões em um ano; quase metade foi para prisões e PMs", "url": "https://www.cartacapital.com.br/sociedade/lei-de-drogas-consumiu-r-145-bilhoes-em-um-ano-e-quase-metade-foi-para-prisoes-e-pms/", "fonte_id": "cartacapital", "data_pub": "2026-11-17T08:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A lei de drogas gastou R$ 14,5 bilhões em um ano, com quase metade dos recursos destinados a custear prisões e policiais militares. O montante seria suficiente para construir 2.536 creches ou 5.881 Centros de Atenção Psicossocial Álcool e Drogas III.", "titulo_pt": "Lei de Drogas consumiu R$ 14,5 bilhões em um ano; quase metade foi para prisões e PMs", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 268862, "titulo": "Brasil gasta R$ 14,5 bilhões por ano com a Lei Antidrogas; apenas 10% vão para medidas socioeducativas", "url": "https://www.brasildefato.com.br/2026/11/17/brasil-gasta-r-145-bilhoes-por-ano-com-a-lei-antidrogas-apenas-10-vao-para-medidas-socioeducativas/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-17T08:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil gastou pelo menos R$ 14,5 bilhões com a Lei de Drogas em 2024, com 48,9% desse valor destinado à repressão e apenas 10% para medidas socioeducativas.", "titulo_pt": "Brasil gasta R$ 14,5 bilhões por ano com a Lei Antidrogas; 48,9% para repressão e 10% para medidas socioeducativas", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 268946, "titulo": "Uma eleição presidencial também se decide nos algoritmos", "url": "https://www.jota.info/opiniao-e-analise/artigos/uma-eleicao-presidencial-tambem-se-decide-nos-algoritmos", "fonte_id": "jota", "data_pub": "2026-11-17T07:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "É necessário transparência nos algoritmos para permitir a fiscalização das regras de plataformas digitais por parte da sociedade e das autoridades. Uma eleição presidencial também depende disso.", "titulo_pt": "Uma eleição presidencial também depende da transparência nos algoritmos", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 268835, "titulo": "Na reta final, Lula 3 foca em defesa comercial e acordos do Mercosul", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/na-reta-final-lula-3-foca-em-defesa-comercial-e-acordos-do-mercosul/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-17T07:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Secretaria de Comércio Exterior está se concentrando nas medidas implementadas pelo governo atual para concluir antes do próximo mandato de Luiz Inácio Lula da Silva (PT). O foco está na defesa comercial e nos acordos do Mercosul.", "titulo_pt": "Na reta final, Lula 3 se dedica a medidas comerciais e acordos do Mercosul", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 268783, "titulo": "PP estuda lançar secretário da Segurança de Tarcísio para Prefeitura de SP", "url": "https://www.metropoles.com/colunas/vinicius-passarelli/pp-estuda-lancar-secretario-da-seguranca-de-tarcisio-para-prefeitura-de-sp", "fonte_id": "metropoles", "data_pub": "2026-11-17T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O partido PP está avaliando a possibilidade de filiar o secretário da Segurança Pública de São Paulo, Nico Gonçalves, para uma eventual candidatura à prefeitura de São Paulo em 2028.", "titulo_pt": "PP estuda lançar secretário de Segurança de Tarcísio para Prefeitura de SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 268784, "titulo": "Lula e o novo pacto com o Centrão", "url": "https://www.metropoles.com/blog-do-noblat/ricardo-noblat/lula-e-o-novo-pacto-com-o-centrao", "fonte_id": "metropoles", "data_pub": "2026-11-17T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula enfrenta desafios para formar uma base no Congresso e evitar traições nas votações.", "titulo_pt": "Lula e o novo pacto com o Centrão", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 268785, "titulo": "Senado vota destaques da oposição no ajuste fiscal; governo foca Câmara", "url": "https://www.metropoles.com/brasil/senado-vota-destaques-da-oposicao-no-ajuste-fiscal-governo-foca-na-camara", "fonte_id": "metropoles", "data_pub": "2026-11-17T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado votou os destaques apresentados pela oposição no projeto de ajuste fiscal, buscando remover cortes relacionados a compensações tributárias e repasses aos estados. Além disso, os deputados pretendem endurecer as regras para limitar gastos.", "titulo_pt": "Senado vota destaques da oposição no ajuste fiscal; governo foca Câmara", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 268840, "titulo": "Brasil teve voto distrital em 1855; veja por que querem adotar modelo misto", "url": "https://www.cnnbrasil.com.br/politica/brasil-teve-voto-distrital-em-1855-veja-por-que-querem-adotar-modelo-misto/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-17T07:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil adotou o voto distrital puro em 1855, um sistema diferente do modelo misto defendido pelo PSD para as próximas eleições. Especialistas explicam que esses dois sistemas são distintos.", "titulo_pt": "Brasil teve voto distrital em 1855; veja por que psd quer modelo misto", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 269480, "titulo": "Turkish Police Raids and Seizes Control of Sozcu TV", "url": "https://balkaninsight.com/2026/11/17/turkish-police-raids-and-seizes-control-of-sozcu-tv/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-17T09:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma das últimas estações de televisão independentes da Turquia foi invadida e coloca sob a supervisão de administradores nomeados pelo estado, aumentando a pressão sobre a mídia crítica.", "titulo_pt": "Polícia turca realiza raides e assume controle da Sozcu TV", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 269001, "titulo": "Live Updates: Trump’s Whirlwind Asia Trip Starts in the Philippines", "url": "https://www.nytimes.com/live/2026/11/17/world/trump-asean-summit", "fonte_id": "nyt_world", "data_pub": "2026-11-17T09:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, realizará uma viagem de 48 horas que começará com uma reunião com líderes da Ásia Oriental em Manila, Filipinas. Ele também se reunirá com Xi Jinping, da China, e Vladimir Putin, da Rússia, em Shenzhen, um importante centro econômico chinês.", "titulo_pt": "Atualizações em tempo real: viagem em vértice de trump na ásia começa nas filipinas", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 269003, "titulo": "Ukraine Attacks Kerch Bridge Linking Russia to Occupied Crimea", "url": "https://www.nytimes.com/2026/11/17/world/europe/ukraine-kyiv-russia-kerch-bridge-crimea.html", "fonte_id": "nyt_world", "data_pub": "2026-11-17T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ataques afetaram duas pontes em Kyiv, fechando a única via de acesso entre a Rússia e a Península Ocupa de Crimea. O Kerch Bridge, que era a única ligação terrestre entre as duas áreas, também foi interrompido.", "titulo_pt": "Ucrânia ataca pontes ligando Rússia à península ocupa de Crimea", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 269481, "titulo": "Serbia’s New Parliament Convenes After Historic Election", "url": "https://balkaninsight.com/2026/11/17/serbias-new-parliament-convenes-after-historic-election/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-17T09:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois da histórica vitória da lista de oposição Student List sobre o longamente governante Partido Progressista Sérvio, os novos deputados se reuniram para a sessão constitucional do novo parlamento.", "titulo_pt": "Nova parlamentar da sérvia se reúne após eleição histórica", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 268886, "titulo": "Japão desloca caças e acusa Rússia de violação de espaço aéreo", "url": "https://www.dw.com/pt-br/japão-desloca-caças-e-acusa-rússia-de-violação-de-espaço-aéreo/a-79966218?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-17T09:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo japonês acusou a Rússia de violar seu espaço aéreo, classificando o incidente como uma grave violação de soberania e exigindo medidas para evitar futuros incidentes. As relações entre os dois países continuam deterioradas.", "titulo_pt": "Japão acusa Rússia de violar espaço aéreo e relações deterioram-se", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 269046, "titulo": "Ukraine hails attack on vital Kerch bridge linking Russia and Crimea – Europe live", "url": "https://www.theguardian.com/world/live/2026/nov/17/europe-ukraine-russia-crimea-kerch-bridge-attack-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-11-17T09:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Ucrânia comemora o dano causado à ponte de Kerch, que liga a Rússia e a Crimeia, tornando a saída da península vulnerável a ataques de drones. O presidente finlandês Alexander Stubb chegou a Berlim para conversas com o líder alemão Friedrich Merz, antes de uma reunião tripartite entre os presidentes dos EUA, China e Rússia em Manila e uma reunião inédita do 'coalition of the willing' em Berlim.", "titulo_pt": "Ucrânia celebra dano à ponte de Kerch e líder finlandês se reúne com alemão antes de reuniões importantes", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 269151, "titulo": "China says it has 'no information' on whether North Korea's leader Kim will meet Trump", "url": "https://www.euronews.com/2026/11/17/china-says-it-has-no-information-on-whether-north-koreas-leader-kim-will-meet-trump", "fonte_id": "euronews", "data_pub": "2026-11-17T09:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump e Kim se encontraram três vezes: em junho de 2018 em Singapura, em fevereiro de 2019 em Hanoi e em junho de 2019 na Zona Desmilitarizada da Coreia do Norte.", "titulo_pt": "China afirma não ter informações sobre possível encontro entre Kim e Trump", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 269265, "titulo": "Donald Trump arrives in Manila to speak at Asean summit before heading to China", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3374740/donald-trump-arrives-manila-speak-asean-summit-heading-china", "fonte_id": "scmp", "data_pub": "2026-11-17T09:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, chegou a Manila para falar na cúpula da ASEAN. A visita de estado, de aproximadamente 24 horas, foi ajustada para atender ao desejo de Trump de um curto pouso antes de participar da cúpula do APEC, onde ocorrerá um encontro triangular com Xi Jinping e Vladimir Putin.", "titulo_pt": "Donald Trump chega a Manila para falar na cúpula da Asean antes de ir para a China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 268887, "titulo": "O que Putin exige da Otan e da Europa", "url": "https://www.dw.com/pt-br/o-que-putin-exige-da-otan-e-da-europa/a-79964253?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-17T09:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Kremlin está exigindo que a Otan retire-se do Leste Europeu como condição para a paz na Ucrânia. Este plano tem implicações significativas para a segurança de milhões de europeus.", "titulo_pt": "O que Putin exige da Otan e da Europa", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 269176, "titulo": "Journalist who exposed alleged drug links shot dead in Costa Rica", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/17/journalist-who-exposed-alleged-drug-links-shot-dead-in-costa-rica?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-17T09:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O jornalista costarriquenho Camilo Rodríguez foi morto a tiros perto da capital San José.", "titulo_pt": "Jornalista que denunciou supostos vínculos com drogas é morto a tiros em Costa Rica", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 269222, "titulo": "Ukraine damages bridge to Crimea in fierce exchange of strikes", "url": "https://www.ft.com/content/eb8031c0-a96a-4408-b762-b92ff0402f82?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-17T09:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rússia bombardeou pontes em Kyiv enquanto Ucrânia danificou uma ponte em Crimea. Ambos os lados intensificaram os ataques em infraestrutura crítica antes das negociações entre Washington e Moscou.", "titulo_pt": "Ucrânia danifica ponte em crimeia em troca de ataques de Rússia em kyiv", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 269064, "titulo": "Is China Misreading the Moment?", "url": "https://www.foreignaffairs.com/united-states/china-misreading-moment", "fonte_id": "foreign_affairs", "data_pub": "2026-11-17T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, se encontrará com o líder chinês Xi Jinping em Shenzhen durante a cúpula do APEC, marcando o quarto encontro entre os líderes desde uma inesperada trégua nos relacionamentos entre Washington e Pequim. Embora a détente pareça sólida, há sinais de que a trégua está começando a se deteriorar.", "titulo_pt": "Está China malinterpreta essa oportunidade?", "veiculo": "Foreign Affairs", "pais": "EUA", "classe": "A"}, {"id": 269065, "titulo": "A More Turkish Middle East?", "url": "https://www.foreignaffairs.com/turkey/more-turkish-middle-east", "fonte_id": "foreign_affairs", "data_pub": "2026-11-17T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ankara está empenhada em impor uma ordem regional arriscada. Este esforço visa moldar o cenário geopolítico da região de acordo com os interesses turcos.", "titulo_pt": "Uma mena mais turca?", "veiculo": "Foreign Affairs", "pais": "EUA", "classe": "A"}, {"id": 269163, "titulo": "U.S. companies from Nvidia to Apple face a growing China dilemma", "url": "https://www.cnbc.com/2026/11/17/us-tech-firms-china-ties-political-pressure.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-17T08:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas norte-americanas, desde a Nvidia até a Apple, enfrentam um dilema crescente no mercado chinês. A situação se tornou ainda mais complexa para as empresas que operam nos Estados Unidos e na China.", "titulo_pt": "Empresas norte-americanas enfrentam dilema crescente no mercado chinês", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 269041, "titulo": "‘Line their own coffers’: independent MPs lambast Labor’s last-minute changes to election funding laws", "url": "https://www.theguardian.com/australia-news/2026/nov/17/line-their-own-coffers-independent-mps-lambast-labors-last-minute-changes-to-election-funding-laws", "fonte_id": "guardian_world", "data_pub": "2026-11-17T08:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Independent MPs criticam as últimas mudanças do governo nas leis de financiamento das eleições, afirmando que elas poderiam permitir que uma 'quantia ilimitada de dinheiro' fluísse para os partidos maiores através de fundos de investimento. As alterações, descritas pelo governo como 'técnicas', foram introduzidas poucos semanas antes de entrarem em vigor.", "titulo_pt": "Independentes criticam mudanças de última hora nas leis de financiamento eleitoral", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 269291, "titulo": "Ex-justice minister Cho Kuk denied entry to Japan: officials", "url": "https://en.yna.co.kr/view/AEN20261117009000315", "fonte_id": "yonhap_news", "data_pub": "2026-11-17T08:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cho Kuk, ex-ministro da Justiça, foi negado o acesso ao Japão. A informação foi divulgada pelas autoridades sul-coreanas.", "titulo_pt": "Ex-ministro da justiça Cho Kuk negado entrada no Japão", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 269119, "titulo": "Apple to face trial in France over planned obsolescence", "url": "https://www.lemonde.fr/en/pixels/article/2026/11/17/apple-to-face-trial-in-france-over-planned-obsolescence_6782735_13.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-17T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em junho de 2027, uma corte francesa examinará como a Apple usou bloqueios de software para impedir a realização de reparos com peças de reposição, uma prática que, segundo relatos, contribui para o alto custo dos reparos de iPhones.", "titulo_pt": "Apple enfrentará julgamento na França por suposta obsolescência planejada", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 268943, "titulo": "Os 48 minutos diários nos contratos públicos após a redução da jornada pela EC 141/2026", "url": "https://www.jota.info/opiniao-e-analise/colunas/releitura-trabalhista/os-48-minutos-diarios-nos-contratos-publicos-apos-a-reducao-da-jornada-pela-ec-141-2026", "fonte_id": "jota", "data_pub": "2026-11-17T09:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute os 48 minutos diários dedicados aos contratos públicos após a redução da jornada de trabalho estabelecida pela Emenda Constitucional 141/2026, focando no equilíbrio contratual e na segurança durante a transição de 180 dias.", "titulo_pt": "Os 48 minutos diários nos contratos públicos após a redução da jornada pela EC 141/2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 268851, "titulo": "Dow Jones Futuro cai com restrições dos EUA a chips para China e balanço da Nvidia", "url": "https://www.infomoney.com.br/mercados/dow-jones-futuro-cai-com-restricoes-dos-eua-a-chips-para-china-e-balanco-da-nvidia/", "fonte_id": "infomoney", "data_pub": "2026-11-17T08:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Novas restrições americanas à exportação de chips de IA para a China aumentaram a aversão ao risco, e os investidores aguardam os resultados da Nvidia. O Dow Jones Futuro registrou uma queda.", "titulo_pt": "Dow Jones Futuro cai com novas restrições americanas a chips para China e balanço da Nvidia", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 268945, "titulo": "Previsibilidade regulatória para os IFAs", "url": "https://www.jota.info/opiniao-e-analise/artigos/previsibilidade-regulatoria-para-os-ifas", "fonte_id": "jota", "data_pub": "2026-11-17T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Edital de Chamamento da Anvisa visa ampliar a produção nacional de produtos farmacêuticos. O texto destaca o caminho regulatório para os IFAs (Intermediários Farmacêuticos Autorizados).", "titulo_pt": "Previsibilidade regulatória para os IFAs", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 269214, "titulo": "Leak of 15mn Deutsche Bank files exposes systemic failures", "url": "https://www.ft.com/content/df518845-ed97-4a38-8a38-7fa9d4d24003?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-17T08:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Documentos vazados de 15 milhões de arquivos do Deutsche Bank, incluindo emails e relatórios internos, oferecem novas luzes sobre a carreira e a liderança do CEO Christian Sewing. Estes documentos expõem falhas sistêmicas na instituição bancária.", "titulo_pt": "Vazamento de 15 milhões de arquivos do Deutsche Bank revela falhas sistêmicas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 269303, "titulo": "(LEAD) IMF raises S. Korea's 2026 growth forecast to 3.9 pct on chip boom", "url": "https://en.yna.co.kr/view/AEN20261117005651320", "fonte_id": "yonhap_news", "data_pub": "2026-11-17T07:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A IMF elevou a previsão de crescimento da Coreia do Sul para 2026 para 3,9% devido ao boom nas exportações de chips.", "titulo_pt": "IMF eleva previsão de crescimento da Coreia do sul para 2026", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 268679, "titulo": "Santander leiloa 195 imóveis em 20 estados, com lances a partir de R$ 34 mil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/santander-leiloa-195-imoveis-em-20-estados-com-lances-a-partir-de-r-34-mil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Santander realiza um leilão com 195 imóveis residenciais em 20 estados brasileiros nesta terça-feira (17). Os lances começam em R$ 34 mil.", "titulo_pt": "Santander leiloa 195 imóveis em 20 estados, com lances a partir de R$ 34 mil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 268680, "titulo": "Impressoras 3D atraem quem busca renda extra, mas concorrência pressiona lucro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/impressoras-3d-atraem-quem-busca-renda-extra-mas-concorrencia-pressiona-lucro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A impressão 3D se tornou uma oportunidade para quem busca renda extra, permitindo que os empreendedores produzam e vendam objetos em casa. No entanto, a concorrência na venda de produtos genéricos torna difícil obter lucro, exigindo investimento em personalização e serviços especializados.", "titulo_pt": "Impressoras 3D atraem quem busca renda extra, mas concorrência pressiona lucro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 268681, "titulo": "Feirões oferecem descontos de até 99% para renegociar dívidas no fim do ano", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/feiroes-oferecem-descontos-de-ate-99-para-renegociar-dividas-no-fim-do-ano.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Consumidores encontram várias campanhas para renegociar dívidas com descontos significativos antes do fim do ano. As iniciativas incluem feirões organizados por bancos e instituições financeiras, bem como ações próprias de empresas de telefonia e contas básicas.", "titulo_pt": "Feirões oferecem descontos de até 99% para renegociar dívidas no fim do ano", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 268682, "titulo": "INSS terá novas regras na aposentadoria a partir de 1º de janeiro de 2027; veja o que muda", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/inss-tera-novas-regras-na-aposentadoria-a-partir-de-1o-de-janeiro-de-2027-veja-o-que-muda.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As regras para aposentadoria do INSS sofrerão mudanças a partir de 1º de janeiro de 2027, conforme previsto na reforma da Previdência de 2019. Estas alterações serão implementadas anualmente nas regras de tran t/72ac6fee-55f3-4db5-a1e3-873ef39c0b96?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-17T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um documento interno revelou que um banco alemão processou US$ 582 milhões em pagamentos suspeitos relacionados a Epstein, um número significativamente maior do que o conhecido anteriormente.", "titulo_pt": "Banco alemão processou us$ 582 milhões em pagamentos suspeitos relacionados a Epstein", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 269217, "titulo": "‘Katastrophe’: inside the chaos at Germany’s biggest bank", "url": "https://www.ft.com/content/4f8dae68-bfec-43bd-bef6-b830815ec538?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-17T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Millhões de documentos vazados iluminam o liderança de Christian Sewing na instituição bancária alemã envolvida em escândalos.", "titulo_pt": "Catástrofe: dentro do caos na maior instituição bancária da Alemanha", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 268947, "titulo": "A procuradoria municipal entre o estoque de ISS e a cobrança do IBS", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-procuradoria-municipal-entre-o-estoque-de-iss-e-a-cobranca-do-ibs", "fonte_id": "jota", "data_pub": "2026-11-17T05:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A coordenação centralizada do IBS pode diminuir a capacidade de cobrança dos municípios que não possuem uma estrutura adequada de procuradoria.", "titulo_pt": "Procuradoria municipal e a cobrança do IBS", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 269224, "titulo": "Oligarch’s ex-wife to claim £600mn for ‘reasonable needs’ in London divorce case", "url": "https://www.ft.com/content/969f0f82-7dd5-4d63-8f60-ee967028f744?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-17T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O caso de divórcio mais caro da Grã-Bretanha, envolvendo o bilionário russo de metais Vladimir Potanin, começa esta semana. A ex-esposa de Potanin pleiteia £600 milhões para atender às suas necessidades razoáveis.", "titulo_pt": "Ex-esposa do oligarca pedirá £600 milhões em caso de divórcio em londres", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 269266, "titulo": "US details criminal probe into Nvidia customer Megaspeed over potential chip diversion", "url": "https://www.scmp.com/tech/tech-war/article/3374742/us-details-criminal-probe-nvidia-customer-megaspeed-over-potential-chip-diversion", "fonte_id": "scmp", "data_pub": "2026-11-17T09:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Justiça dos Estados Unidos está conduzindo uma investigação criminal contra a Megaspeed, uma empresa de computação em nuvem baseada em Singapura e cliente da Nvidia, por supostas violações de controles de exportação de chips dos EUA. O Departamento de Comércio abriu a investigação em 2024 após detectar atividades suspeitas durante o monitoramento de possível divagação de semicondutores sensíveis.", "titulo_pt": "EUA detalham investigação criminal contra Megaspeed por possível violação de controles de exportação de chips", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 269412, "titulo": "Nomadic bags $6M to deploy self-charging drones that spot weak points in power grids", "url": "https://tech.eu/2026/11/17/nomadic-bags-6m-to-deploy-self-charging-drones-that-spot-weak-points-in-power-grids/", "fonte_id": "tech_eu", "data_pub": "2026-11-17T09:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup alemã Nomadic, que desenvolve drones autônomos para monitorar linhas de alta tensão enquanto se carregam diretamente delas, levantou $6 milhões em uma rodada de financiamento de semente liderada por investidores.", "titulo_pt": "Nomadic arrecada $6 milhões para deploy de drones autônomos que se recarregam e identificam pontos fracos em redes de energia", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 268677, "titulo": "Sucesso e fama prejudicam líderes de tecnologia, alerta investidor da Nvidia e da Tesla", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/sucesso-e-fama-prejudicam-lideres-de-tecnologia-alerta-investidor-da-nvidia-e-da-tesla.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um investidor de tecnologia britânico criticou a tendência de fundadores concentrarem poder em empresas de tecnologia, afirmando que a fama de líderes como Jensen Huang e Elon Musk pode ter prejudicado a qualidade da liderança de algumas das maiores empresas do mundo.", "titulo_pt": "Sucesso e fama prejudicam líderes de tecnologia, alerta investidor da Nvidia e da Tesla", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 269272, "titulo": "As agentic AI seeps into finance, concerns grow over new risks and blind spots", "url": "https://www.scmp.com/business/banking-finance/article/3374724/agentic-ai-seeps-finance-concerns-grow-over-new-risks-and-blind-spots", "fonte_id": "scmp", "data_pub": "2026-11-17T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Reguladores e líderes do setor se reuniram em Hong Kong para discutir como supervisionar o rápido avanço das inteligências artificiais autônomas no setor financeiro, após um bug em software tenha interrompido serviços em várias grandes instituições bancárias dos EUA. Um membro do Federal Reserve alertou sobre os riscos associados a esses sistemas cada vez mais autônomos.", "titulo_pt": "IA autônoma invade finanças, crescem preocupações com novos riscos e brechas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 269413, "titulo": "adesso Ventures secures €26M in first close of its second fund, opening to external investors", "url": "https://tech.eu/2026/11/17/adesso-ventures-secures-eur26m-in-first-close-of-its-second-fund-opening-to-external-investors/", "fonte_id": "tech_eu", "data_pub": "2026-11-17T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A adesso Ventures, a unidade de venture capital do grupo adesso, concluiu o primeiro fechamento de sua segunda fundo, arrecadando mais de 26 milhões de euros com investimentos de adesso, investidores privados e famílias.", "titulo_pt": "Adesso Ventures fecha primeiro fechamento de seu segundo fundo com mais de 26 milhões", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 269315, "titulo": "Buttons get stickers, Big Tech gets a call in Suneung cheating crackdown", "url": "https://www.koreaherald.com/article/10940242", "fonte_id": "korea_herald", "data_pub": "2026-11-17T08:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo sul-coreano anunciou uma série de medidas para combater o uso de inteligência artificial em fraudes durante o exame de admissão à universidade, marcado para quinta-feira. O anúncio foi feito dois dias após um dos melhores estudantes do país confessar o uso de AI para cometer fraude no exame nacional.", "titulo_pt": "Botões recebem adesivos, grandes tecnológicas recebem uma chamada na repressão ao roubo de prova no Suneung", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 269387, "titulo": "AI server tracker: TSMC, Alchip post big October gains powered by 2nm and ASIC orders", "url": "https://www.digitimes.com/news/a20261117VL216/revenue-growth-taiwan-semiconductor-supply-chain-tsmc-2nm.html", "fonte_id": "digitimes", "data_pub": "2026-11-17T08:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cadeia de suprimentos de semicondutores na Taiwan registrou forte crescimento em outubro, impulsionada principalmente pela demanda de inteligência artificial e de processos avançados. A receita da TSMC no mês aumentou cerca de 60% em comparação com o mesmo período do ano anterior, e os projetistas de circuitos integrados estão animados com grandes pedidos de clientes internacionais.", "titulo_pt": "Rastreador de servidores de IA: TSMC e Alchip registram altas significativas em outubro, impulsionadas por pedidos de 2nm e ASIC", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 269340, "titulo": "Oobah Butler Can Sell You Anything—If You’re a Rich Idiot", "url": "https://www.wired.com/story/oobah-butler-exclusive-interview-scams-for-a-better-tomorrow/", "fonte_id": "wired", "data_pub": "2026-11-17T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Oobah Butler, um jornalista de ação, concedeu uma entrevista exclusiva sobre seu novo programa na HBO, onde ele cria esquemas de golpes para se divertir à custa de algumas das indústrias mais ricas e fáceis de enganar no mundo.", "titulo_pt": "Oobah Butler pode vender largamente seu produto - se seu cliente for um idiota rico", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 269295, "titulo": "(2nd LD) Seoul stocks drop for 4th day amid lingering AI woes", "url": "https://en.yna.co.kr/view/AEN20261117006352320", "fonte_id": "yonhap_news", "data_pub": "2026-11-17T07:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações sul-coreanas caíram pela quarta sessão consecutiva, devido aos problemas persistentes relacionados à inteligência artificial.", "titulo_pt": "Seul: ações caem pela quarta sessão seguida devido a preocupações com a IA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 269296, "titulo": "Prosecutors seek 3-yr sentence for Chinese student over deepfake sex crimes", "url": "https://en.yna.co.kr/view/AEN20261117008100315", "fonte_id": "yonhap_news", "data_pub": "2026-11-17T07:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Procuradores solicitaram uma pena de três anos de prisão para um estudante chinês envolvido em crimes relacionados a deepfakes envolvendo conteúdo sexual.", "titulo_pt": "Procuradores pedem pena de 3 anos para estudante chinês em crimes de deepfake", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 269297, "titulo": "S. Korea joins NATO-led Starlift space initiative to boost launch capabilities", "url": "https://en.yna.co.kr/view/AEN20261117008000315", "fonte_id": "yonhap_news", "data_pub": "2026-11-17T07:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul se juntou a uma iniciativa espacial liderada pelo NATO na área de Starlift para melhorar suas capacidades de lançamento.", "titulo_pt": "Coreia do sul participa de iniciativa espacial liderada pelo nato para ampliar capacidades de lançamento", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 269230, "titulo": "Nikkei 225 near bear market territory as AI boom cools", "url": "https://www.japantimes.co.jp/business/2026/11/17/markets/nagata-nikkei-ai-bear/", "fonte_id": "japan_times", "data_pub": "2026-11-17T07:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O índice Nikkei 225 está próximo da zona de bear market, com uma queda de cerca de 20% desde seu pico. Analistas afirmam que é provável que se demore meses para recuperar os máximos atingidos, e talvez mais tempo ainda.", "titulo_pt": "Nikkei 225 perto da zona de bear market com a onda de AI em frangalhos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 268684, "titulo": "Anúncios com IA que simulam sentimento humano podem afastar público, aponta pesquisa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/anuncios-com-ia-que-simulam-sentimento-humano-podem-afastar-publico-aponta-pesquisa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa indica que anúncios criados com inteligência artificial podem afastar o público se não forem explicados adequadamente. O uso excessivo da tecnologia sem justificativa clara pode incomodar os espectadores.", "titulo_pt": "Anúncios com IA que simulam sentimento humano podem afastar público, aponta pesquisa", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 269280, "titulo": "America’s most powerful data centres emit as much as a small nation", "url": "https://www.scmp.com/news/world/united-states-canada/article/3374707/americas-most-powerful-data-centres-emit-much-small-nation", "fonte_id": "scmp", "data_pub": "2026-11-17T06:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo publicado na Nature Sustainability revelou que os centros de dados mais poderosos dos Estados Unidos consomem cerca de 2% da eletricidade do país e têm um rastro de carbono similar ao de um pequeno país europeu. O estudo, baseado em 403 centros de dados 'hiperscale' operados entre maio de 2024 e abril de 2025, representa apenas uma estimativa mínima.", "titulo_pt": "Estados unidos: centros de dados mais potentes emitem quanto uma pequena nação", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 269318, "titulo": "Korea's digital payments boom draws global rivals", "url": "https://www.koreaherald.com/article/10940064", "fonte_id": "korea_herald", "data_pub": "2026-11-17T06:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mercado de pagamentos digitais na Coreia do Sul está se aquecendo, com empresas globais e locais expandindo seus serviços para atrair um número crescente de usuários. Apple Pay está ampliando sua presença no país, com a inclusão de Kakao Bank e possivelmente Toss Bank no futuro.", "titulo_pt": "Boom dos pagamentos digitais na Coreia do sul atrai rivais globais", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 269281, "titulo": "South Korea checks glasses and collars for hidden AI in university exam", "url": "https://www.scmp.com/week-asia/lifestyle-culture/article/3374703/south-korea-checks-glasses-and-collars-hidden-ai-university-exam", "fonte_id": "scmp", "data_pub": "2026-11-17T06:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A primeira-ministra sul-coreana Han Seong-sook prometeu combater a fraude usando inteligência artificial durante o próximo exame nacional de admissão à universidade, considerando-a um 'mau exemplo social'. Ela declarou que vai mobilizar todas as capacidades nacionais para prevenir a fraude assistida por AI no exame College Scholastic Ability Test (CSAT) desta quinta-feira, incluindo a ativação de um time de resposta emergencial, proibição de candidatos de possuírem dispositivos inteligentes durante a prova e o aumento do pessoal nas provas.", "titulo_pt": "Coreia do sul verifica óculos e colarinhos para detectar AI em exame universitário", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 269361, "titulo": "Humpback whale snot unlocks whole-genome sequencing without invasive sampling", "url": "https://phys.org/news/2026-11-humpback-whale-snot-genome-sequencing.html", "fonte_id": "phys_org", "data_pub": "2026-11-17T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de St Andrews, em colaboração com a Universidade de Copenhague, a North Coast Cetacean Society e a Pesca e Oceanos do Canadá, sequenciaram o genoma completo de uma baleia-baleia usando amostras de 'snot' de baleia coletadas por drones pequenos na costa da Colúmbia Britânica—um primeiro na história mundial.", "titulo_pt": "Genoma completo de baleia sequenciado usando snot coletado por drones", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 269356, "titulo": "STAT+: After death in gene therapy trial for a brain disease, progress is reported", "url": "https://www.statnews.com/2026/11/17/capsida-gene-therapy-trial-death-follow-up-investigation/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-17T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um paciente morreu inesperadamente em um estudo de terapia genética para uma doença do cérebro, o que abalou os pesquisadores que buscavam brechas na barreira sangue-cérebro. Agora, alguns acreditam ter encontrado uma maneira de mitigar os riscos.", "titulo_pt": "Morte inesperada em estudo de terapia genética para doença cerebral causa abalo nos pesquisadores", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 269357, "titulo": "Flavored nicotine tablets, the tobacco industry’s latest product, worry public health advocates", "url": "https://www.statnews.com/2026/11/17/zyn-melts-tobacco-firms-test-market-nicotine-pouch-alternatives/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-17T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A indústria tabagista lançou recentemente um novo produto: tabulerros de nicotina com sabor que se derretem na boca, permitindo que os usuários obtenham um efeito semelhante ao tabaco de forma discreta, como mastigando uma pastilha de menta.", "titulo_pt": "Tabulerros de nicotina, o novo produto da indústria tabagista, preocupam os defensores da saúde pública", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 269358, "titulo": "Opinion: The problem with ‘zero tolerance for bad behavior’ signs at hospitals", "url": "https://www.statnews.com/2026/11/17/hospital-signs-violence-health-care-workers-research-stigma/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-17T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hospitals não precisam escolher
