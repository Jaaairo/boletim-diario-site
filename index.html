<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "23/10/2026 19:20", "stats": {"noticias_novas": 566, "resumos_gerados": 236}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Rio de Janeiro terá uma nova contagem dos votos para as cadeiras na Assembleia Legislativa (Alerj) após uma decisão do Tribunal Regional Eleitoral (TRE). Por outro lado, a ministra Cármen Lúcia rejeitou um pedido do PT para transporte interestadual gratuito no segundo turno das eleições, argumentando que a medida seria difícil de ser implementada neste ano. O governador eleito de Minas Gerais, Cleitinho Azevedo, reafirmou seu apoio a Flávio Bolsonaro, mas manteve uma postura discreta durante a campanha. O candidato ao governo do Espírito Santo, Lorenzo Pazolini, denunciou ligações automatizadas que simulam pesquisas eleitorais e criticam seu próprio candidato e Flávio Bolsonaro. A live de 24 horas anunciada pelo deputado André Janones após o debate presidencial enfrenta uma limitação técnica da Meta, dona do Instagram e do Facebook. Além disso, o ministro Floriano Peixoto determinou que o ministro Nunes Marques se abstenha de tomar decisões que possam invalidar o canal de comunicação entre o ex-presidente Lula e o partido.", "mundo": "O México entrou em greve nacional a partir de 26 de outubro, em protesto contra a segurança nas estradas, extorsões e custos operacionais. A Argentina encerrou a investigação contra o presidente Javier Milei e sua irmã por supostas fraudes com criptomoedas, arquivando o caso. A Ucrânia registrou mais de 19 mil mortes civis desde o início da guerra com a Rússia, além de 762 mortes de crianças. O presidente dos Estados Unidos, Donald Trump, declarou que pode realizar 'outra pequena Epic Fury' contra o Irã, enquanto o governo dos EUA considera bloquear a certificação da eleição no Senado de Alaska. Em outro desenvolvimento, o Chile registrou uma retração do PIB e um aumento do desemprego em meio a um ajuste fiscal. Na América Latina, o presidente de El Salvador, Nayib Bukele, ordenou o envio de forças especiais ao Haiti após quatro soldados salvadorenhos desaparecerem em uma emboscada. As operações militares da Rússia contra a capital ucraniana, Kiev, estão se intensificando, tornando 2026 um dos anos mais sangrentos para a cidade durante a longa guerra. Além disso, Paris prepara-se para mais um fim de semana de protestos, com lojistas protegendo suas vitrines para o 'segundo ato' da manifestação.\n\nA geopolítica global enfrenta um cenário de tensões significativas. Na Ucrânia, um acordo de cessar-fogo temporário foi alcançado entre Rússia e Ucrânia na cidade de Oleshky, na região de Kherson, permitindo a entrega de ajuda humanitária e a evacuação de civis. No entanto, a situação permanece volátil, com o presidente ucraniano Volodymyr Zelensky expressando esperança de que Pequim possa usar sua influência sobre Moscou para ajudar a pôr fim à guerra. Em outro front, Israel e os Estados Unidos estão preparando-se para possíveis novos ataques contra o Irã, com o embaixador dos EUA na Turquia, Tom Barrack, sinalizando a possibilidade de um ataque neste fim de semana. A escalada de tensões no Oriente Médio é acompanhada por declarações de diplomatas e ministros de relações exteriores de vários países, que chamam pela implementação urgente de uma solução de dois estados e pela desmilitarização da região. Além disso, a China está utilizando barcos de milícias para aumentar as disposições para a guerra, enquanto o exército dos Estados Unidos está ativando uma bateria de defesa aérea em Guam em resposta a ameaças de mísseis da Coreia do Norte e da China. Essas ações refletem a crescente complexidade e intensidade das tensões geopolíticas mundiais.", "economia": "O mercado financeiro brasileiro e internacional enfrenta uma série de eventos e decisões que impactam a economia. O Ibovespa subiu 7% entre o primeiro e o segundo turno da eleição, refletindo a expectativa de uma mudança de governo, com as ações do varejo liderando os ganhos. O dólar caiu quase 1%, cotado a R$ 4,98, refletindo expectativas sobre as eleições presidenciais. O Banco Central anunciou medidas para coibir abusos nas ofertas de crédito que favoreçam o superendividamento, visando proteger os consumidores. Além disso, o BC aprovou resoluções que visam proteger os consumidores do endividamento, incluindo medidas contra ofertas inadequadas ou abusivas e maior transparência nas operações de crédito. No comércio internacional, o presidente dos Estados Unidos planeja reduzir algumas tarifas sobre o Canadá para ajudar candidatos a senadores em estados-chave. As bolsas da Europa fecharam com resultados mistos, com destaque para a queda do FTSE 100, DAX e CAC 40, enquanto o FTSE MIB, Ibex 35 e PSI 20 apresentaram ganhos.", "tecnologia": "A tecnologia avança em diversos setores, com destaque para a integração da inteligência artificial e as inovações em microeletrônica. A National Taiwan University (NTU) abriu suas instalações de chips para pesquisadores universitários, visando promover avanços em microeletrônica. O Google atualizou sua política de privacidade, permitindo que os dados do Gmail e Google Fotos sejam usados para publicidade alvo, desde que os recursos de inteligência artificial personalizados estejam ativados. Além disso, a American Express está cortando 5% de sua força de trabalho para se preparar para a chegada da inteligência artificial, enquanto a Intel obteve uma isenção após preocupações de que uma proibição americana sobre robôs fabricados no exterior poderia afetar as fábricas de semicondutores. Em outro desenvolvimento, a OpenAI está treinando seus modelos de inteligência artificial mais avançados sem acesso à internet, criando um ambiente de teste offline para minimizar riscos de hacking. Ainda na área de inteligência artificial, a rastreabilidade nas decisões da AI é debatida, destacando a necessidade de considerar vieses e erros dos programadores. O uso de agentes de inteligência artificial em contas bancárias é uma preocupação crescente, com instituições como a JPMorgan implementando medidas para mitigar riscos à segurança financeira.", "ciencia": "O Ministério da Saúde planeja implementar cirurgias urológicas pelo SUS utilizando tecnologia robótica em um centro universitário em Minas Gerais. Esta iniciativa, que marcará o primeiro uso de cirurgia robótica pelo Sistema Único de Saúde no Brasil, faz parte de um esforço para modernizar o sistema de saúde e oferecer tratamentos mais avançados a pacientes, especialmente aqueles com câncer de próstata. Paralelamente, pesquisadores do AIST desenvolveram um novo método de detecção de fotões baseado na observação direta dos fluxos magnéticos gerados em um supercondutor, um avanço que pode revolucionar a forma como se mede a quantidade de luz em dispositivos de detecção de fotões. Além disso, cientistas do Instituto para o Design de Proteínas (IPD) e a NVIDIA, em colaboração, criaram um modelo de geração unificado para o design de proteínas, que utiliza inteligência artificial para criar novas sequências e estruturas de proteínas, alcançando taxas de sucesso computacional cinco a dez vezes superiores aos modelos anteriores. Este avanço tem potencial para acelerar o desenvolvimento de novos medicamentos e tratamentos biológicos.", "cultura": "O evento mais significativo dos artigos é a série documental 'Marília Mendonça: Sentimento Louco', lançada no Prime Video. A série, autorizada pela família da cantora, presta homenagem à artista sem abordar sua vida política. O festival Rock The Mountain reúne artistas consagrados e novos talentos em duas edições, destacando a presença de Jorge Ben Jor e Jorja Smith. Além disso, o pianista uruguaio Enrique Graf se apresentará no Teatro Colón com obras de Mozart e Liszt. O artigo também destaca a transformação de Alexander Skarsgård em uma personagem com partes do corpo feitas de vime, a exposição 'The Center Cannot Hold' na Toronto Biennial, que explora a reação dos artistas ao período capitalista tardio, e a série 'I Love Boosters', que retrata a mobilização de manifestantes em desfiles de moda no contexto das eleições presidenciais brasileiras.", "sociedade": "Um oficial da Polícia Militar está sendo investigado por supostos casos de abuso. Em São Paulo, a Vigilância Sanitária realizou uma inspeção em um hospital onde 36 bebês morreram, com a polícia investigando o caso. Uma falsa nutricionista foi presa em um residencial de luxo no Rio de Janeiro, condenada a 16 anos de prisão por estelionato. Em um evento global, jovens de diversos países, incluindo a França e a Índia, estão nas ruas em protesto contra a desigualdade e serviços públicos falhantes. Um condestável de Hong Kong, paralizado em um ataque durante o serviço em 2005, faleceu aos 52 anos, sendo homenageado com honras completas. O prefeito de Cotia, Wellington Formiga, é acusado de assédio eleitoral por pressionar comissionados a apoiarem Xaropinho em sua campanha para deputado federal. Além disso, o Ministério Público do Trabalho da Bahia processou uma rede de supermercados por adotar uniformes com o número '22' estampado, associado a um candidato. O governo sul-coreano continua expandindo o apoio para crianças com deficiências, mas não houve um aumento correspondente no número de professores necessários para educá-las. A Anvisa endureceu as regras para o uso da polilaminina após registrar nove mortes relacionadas ao medicamento. Um adolescente foi flagrado com ferimentos no braço e barriga, planejando possíveis ataques a policiais militares e agentes de ensino.", "meio_ambiente": "A Europa enfrentou uma onda de calor extremo que resultou na morte de mais de 50 mil pessoas, conforme uma análise recente. Este evento reforça as preocupações sobre a segurança alimentar no Chile, onde a agricultura está sofrendo severas consequências. Em um contexto de Dia Internacional Contra a Mudança Climática, a ONU prevê um aquecimento global superior a 2°C neste século. No Brasil, o país registrou uma redução de 6% nas emissões de gases de efeito estufa em 2025, principalmente devido ao controle do desmatamento na Amazônia e no Cerrado. As distribuidoras de energia estão intensificando seus planos para as eleições devido a uma previsão de frente fria e ciclone extratropical que podem afetar o fornecimento de energia nas áreas votantes. Além disso, um vazamento de petróleo nos Emirados Árabes levou ao fechamento de praias, enquanto o furacão Champi atingiu Taiwan, causando mortes e cancelamentos de voos.", "direitos_humanos": "Um homem armado atirou de carro em Trappes e Verrière, perto de Paris, matando uma pessoa e ferindo uma menina de 12 anos e mais quatro pessoas. Isso levou Macron a condenar o racismo na sociedade francesa após chamar o incidente de 'ataque terrorista racista'. Em El Fasher, na região de Darfur, a população diminuiu para apenas 7% do número registrado no ano anterior, segundo a Amnesty International. A organização relatou que mortes, torturas e desaparições são comuns desde que as Forças de Suporte Rápidas, apoiadas pelos Emirados Árabes Unidos, tomaram o controle da cidade há um ano. Na Argentina, a Equipe Argentina de Antropologia Forense identificou restos mortais de oito desaparecidos durante a ditadura, permitindo a recuperação de centenas de fragmentos ósseos de vítimas não identificadas. Além disso, o parecer solicitado pela Guatemala ao Tribunal Interamericano de Direitos Humanos pode expandir a proteção legal da democracia e ter impacto no Poder Judiciário brasileiro, conforme informou o Jota."}, "resumo_do_dia": {"politica_nacional": [{"id": 222045, "titulo": "RJ terá retotalização de votos para cadeiras na Alerj após decisão do TRE", "url": "https://www.cnnbrasil.com.br/eleicoes/rj-tera-retotalizacao-de-votos-para-cadeiras-na-alerj-apos-decisao-do-tre/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-23T21:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Rio de Janeiro terá uma nova apuração dos votos para as cadeiras na Assembleia Legislativa (Alerj), após uma decisão do Tribunal Regional Eleitoral (TRE). A nova contagem poderá mudar a distribuição das 70 vagas da assembleia.", "titulo_pt": "RJ terá retotalização de votos para cadeiras na Alerj após decisão do TRE", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 221960, "titulo": "Campanhas de Celina e Grass firmam compromisso por reta final \"respeitosa\"", "url": "https://www.metropoles.com/distrito-federal/campanhas-de-celina-e-grass-firmam-compromisso-por-reta-final-respeitosa", "fonte_id": "metropoles", "data_pub": "2026-10-23T21:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um termo de compromisso foi assinado no TRE-DF pelos advogados das campanhas de Celina e Grass na quinta-feira (22/10). O compromisso visa garantir uma reta final respeitosa entre as duas campanhas.", "titulo_pt": "Campanhas de Celina e Grass firmam compromisso pela reta final respeitosa", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 221891, "titulo": "Prêmio de jornalismo sobre transparência pública recebe inscrições até 25 de outubro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/novo-em-folha/2026/10/premio-de-jornalismo-sobre-transparencia-publica-recebe-inscricoes-ate-25-de-outubro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-23T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As inscrições para o 8º Prêmio Livre.jor de Jornalismo-Mosca, que celebra reportagens sobre transparência e acesso à informação pública, estão abertas até 25 de outubro. A premiação é voltada a jornalistas e estudantes.", "titulo_pt": "Prêmio de jornalismo sobre transparência pública recebe inscrições até 25 de outubro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 222113, "titulo": "Cármen Lúcia nega ação do PT que pedia transporte interestadual grátis no 2º turno", "url": "https://www.jota.info/eleicoes/eleicoes-2026/carmen-lucia-nega-acao-do-pt-que-pedia-transporte-interestadual-gratis-no-2o-turno", "fonte_id": "jota", "data_pub": "2026-10-23T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ministra Cármen Lúcia rejeitou uma ação do PT que solicitava transporte interestadual gratuito no segundo turno das eleições. Ela argumentou que não há previsão na decisão do STF e que a medida seria difícil de ser implementada neste ano.", "titulo_pt": "Cármen Lúcia nega ação do PT sobre transporte interestadual gratuito no 2º turno", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 221892, "titulo": "Cleitinho reafirma apoio a Flávio Bolsonaro após recado de Lula, mas mantém discrição no 2º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/cleitinho-reafirma-apoio-a-flavio-bolsonaro-apos-recado-de-lula-mas-mantem-discricao-no-2o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-23T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador eleito de Minas Gerais, Cleitinho Azevedo, reafirmou seu apoio a Flávio Bolsonaro na corrida presidencial, mas manteve uma postura discreta em ações de campanha. Cleitinho participa de forma pontual de atos de campanh /10/24/2003866530", "fonte_id": "taipei_times", "data_pub": "2026-10-24T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China está usando barcos de milícias para aumentar as disposições para a guerra. Essa ação envolve a mobilização de recursos não-tradicionais para a preparação militar.", "titulo_pt": "China usando barcos de milícias para intensificar preparação para guerra", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 221650, "titulo": "Beijing targeting family of ‘separatists’: US report", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/24/2003866531", "fonte_id": "taipei_times", "data_pub": "2026-10-24T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório dos Estados Unidos afirma que Beijing está alvo da família de indivíduos considerados separatistas.", "titulo_pt": "Beijing alvo da família de 'separatistas', diz relatório dos EUA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 222296, "titulo": "Israeli raids, demolitions and settler attacks hit Palestinians across West Bank", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-raids-demolitions-and-settler-attacks-hit-palestinians-across", "fonte_id": "middle_east_eye", "data_pub": "2026-10-23T21:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças israelenses e colonos realizaram operações de demolição, operações de busca e ataques em várias áreas da Cisjordânia ocupada. Em Hebron, um fabrica de cerâmica e sete dunams de terra palestina foram derrubados por bulldozers israelenses, enquanto as ruas da cidade foram fechadas e um edifício residencial de três apartamentos foi iniciado a ser demolido.", "titulo_pt": "Operações israelenses, demolições e ataques de colonos afetam palestinos em todo o cisjordânia ocupada", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 222337, "titulo": "Gli autotrasportatori in Messico procl gações de corrupção com evidências encontradas no laptop do filho do ex-presidente dos EUA.", "titulo_pt": "Agentes do FBI são acusados de dificultar investigações sobre família Biden", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 222315, "titulo": "Masked gunmen kill seven in attack on church funeral in Jordan", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/23/aje-onl-nf_masked-gunmen-kill-seven-in-attack-on-church-jordan-231026?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-23T21:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ataque a tiros realizado por dois homens mascarados em uma igreja durante um funeral em Karak, Jordânia, deixou pelo menos sete mortos e 34 feridos.", "titulo_pt": "Assaltantes mascarados matam sete em ataque a igreja durante funeral em jordânia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 222297, "titulo": "Israeli occupation ‘main source of instability’ in region: Egypt, Turkey, Saudi Arabia and Pakistan say", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-occupation-main-source-instability-region-egypt-turkey-saudi", "fonte_id": "middle_east_eye", "data_pub": "2026-10-23T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ministros de relações exteriores de Egito, Arábia Saudita, Turquia e Paquistão afirmaram que a ocupação israelense é a principal fonte de instabilidade na região e além dela, e chamaram pela implementação urgente de uma solução de dois estados. Eles reafirmaram o apoio a um estado palestino nos limites de 1967, com Jerusalém Oriental como sua capital.", "titulo_pt": "Ocupação israelense é principal fonte de instabilidade, afirmam egito, Turquia, arábia saudita e paquistão", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 221881, "titulo": "Argentina arquiva investigação contra Milei e irmã por escândalo com criptomoeda", "url": "https://redir. n. Os moradores foram interrogados e depois liberados.", "titulo_pt": "Idf inicia operação antiterrorista em Hebron, moradores interrogados e liberados", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 222282, "titulo": "Ebola: Kenya announces second death", "url": "https://www.dw.com/en/ebola-kenya-announces-second-death/a-79747550?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-10-23T21:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A saúde Keniana anunciou a segunda morte por Ebola, envolvendo uma mulher de 65 anos que era parente de um homem que faleceu com a doença no mês anterior. A mulher apresentou sintomas durante o período de quarentena em Nairobi.", "titulo_pt": "Kenya registra segundo óbito por ebola", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 222079, "titulo": "Como o Rio Grande do Sul foi de reduto da esquerda a bastião do agronegócio", "url": "https://www.bbc.com/portuguese/articles/cwnv02eg0807o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-23T21:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Rio Grande do Sul, que historicamente era um reduto da esquerda, passou a ser um bastião do agronegócio. Este fenômeno é explicado pela mudança política do estado, incluindo o governo do PT e a organização do MST.", "titulo_pt": "Como o Rio Grande do Sul passou de reduto da esquerda a bastião do agronegócio", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 222253, "titulo": "Spiking ambulance response times spur calls for real-time tracking", "url": "https://www.politico.com/newsletters/new-york-playbook-pm/2026/10/23/spiking-ambulance-response-times-spur-calls-for-real-time-tracking-01134181", "fonte_id": "politico", "data_pub": "2026-10-23T21:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As respostas das ambulâncias em Nova York estão aumentando, com o t andidatos em estados-chave.", "titulo_pt": "Trump reduzirá tarifas canadenses após pressão dos republicanos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 221883, "titulo": "EUA autorizam liberação emergencial de até 400 mil barris de petróleo da reserva estratégica", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/10/01/6562-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post467525", "fonte_id": "folha_mercado", "data_pub": "2026-10-23T20:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Energia dos Estados Unidos autorizou uma transferência emergencial de até 400 mil barris de petróleo bruto da Reserva Estratégica de Petróleo para resolver uma interrupção no abastecimento que afetava uma refinaria da Phillips 66 em Lake Charles, Louisiana.", "titulo_pt": "EUA autorizam liberação emergencial de até 400 mil barris de petróleo da reserva estratégica", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 222291, "titulo": "US designates helium as critical material as Europe faces supply squeeze", "url": "https://www.euronews.com/2026/10/23/us-designates-helium-as-critical-material-as-europe-faces-supply-squeeze", "fonte_id": "euronews", "data_pub": "2026-10-23T19:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos declararam o hélio como material crítico devido à guerra no Oriente Médio e às restrições de exportação da Rússia e da China, o que está comprimindo as suprimentos globais de um gás essencial para a produção de chips, deixando a Europa em busca de garantir sua parte.", "titulo_pt": "EUA declaram hélio como material crítico diante da escassez europeia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 222295, "titulo": "Zuckerberg’s deal to stay in California cheered by wealth tax campaign", "url": "https://www.ft.com/content/859676ae-5fa4-489a texto_pt": "A OpenAI está treinando seus modelos de inteligência artificial mais avançados sem acesso à internet após uma série de incidentes de hacking. A empresa criou um ambiente de teste offline onde os modelos podem interagir com conteúdo da web indexado e armazenado localmente, sem risco de afetar sistemas externos.", "titulo_pt": "Agora, a openai treina seus modelos de IA avançados sem acesso à internet", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 222362, "titulo": "VCs, Superhuman Mail founder share red flags about product-market fit", "url": "https://techcrunch.com/2026/10/23/vcs-superhuman-mail-founder-share-red-flags-about-product-market-fit/", "fonte_id": "techcrunch", "data_pub": "2026-10-23T20:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores renomados de Iconiq e Sapphire Ventures, juntamente com o fundador de Superhuman Mail, Rahul Vohra, compartilham os conselhos para o desenvolvimento de produtos bem-sucedidos.", "titulo_pt": "Investidores e fundador do Superhuman Mail compartilham sinais vermelhos sobre a adequação produto-mercado", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 222077, "titulo": "OPINIÃO. A rastreabilidade nas decisões da AI", "url": "https://braziljournal.com/opiniao-a-rastreabilidade-nas-decisoes-da-ai", "fonte_id": "brazil_journal", "data_pub": "2026-10-23T20:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 1878, Friedrich Nietzsche escreveu sobre o 'espírito livre', que busca pensar de forma independente. Hoje, a sociedade tenta mecanizar os processos com a ajuda da inteligência artificial, mas esquece que essa tecnologia carrega vieses e erros dos programadores.", "titulo_pt": "OPINIÃO: a rastreabilidade nas decisões da IA", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 222351, "titulo": "Hegseth warns prediction market bets warp military judgment, endanger troops", "url": "https://arstechnica.com/tech-policy/2026/10/pentagon-memo-on-prediction-markets-says-insider-bets-put-troops-lives-at-risk/", "fonte_id": "ars_technica", "data_pub": "2026-10-23T20:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um memorando do Pentágono alerta que apostas em mercados de previsão podem distorcer a julgamento militar e colocar soldados em risco. O memorando também afirma que insider trading fornece informações cruciais sobre operações militares para inimigos do Estados Unidos.", "titulo_pt": "Hegseth alerta que apostas em mercados de previsão podem distorcer julgamento militar e colocar soldados em risco", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 222352, "titulo": "Updated Google privacy policy says your Gmail might be used for advertising", "url": "https://arstechnica.com/gadgets/2026/10/updated-google-privacy-policy-says-your-gmail-might-be-used-for-advertising/", "fonte_id": "ars_technica", "data_pub": "2026-10-23T20:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A atualização da política de privacidade do Google permite que o Gmail seja usado para publicidade alvo. Ativar a Personal Intelligence fornece mais dados para o alinhamento de anúncios.", "titulo_pt": "Atualização da política de privacidade do Google pode usar o Gmail para publicidade", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 222363, "titulo": "TechCrunch Founder Summit 2026 roundtables: Go deeper on the challenges founders are solving right now", "url": "https://techcrunch.com/2026/10/23/techcrunch-founder-summit-2026-roundtables-go-deeper-on-the-challenges-founders-are-solving-right-now/", "fonte_id": "techcrunch", "data_pub": "2026-10-23T20:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O TechCrunch Founder Summit 2026 ocorrerá em 4 de novembro na SoWa Power Station em Boston, reunindo fundadores, investidores e operadores para um dia completo de conversas abertas, sessões práticas, pitchs ao vivo, networking e rodas de conversa mais profundas.", "titulo_pt": "Techcrunch Founder Summit 2026: aprofunde-se nos desafios que os fundadores estão resolvendo atualmente", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 222190, "titulo": "Cómo la IA está redefiniendo la innovación curricular de las universidades", "url": "https://www.latercera.com/educacion/noticia/como-la-ia-esta-redefiniendo-la-innovacion-curricular-de-las-universidades/", "fonte_id": "la_tercera", "data_pub": "2026-10-23T19:38:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A chegada da inteligência artificial e as transformações do século XXI desafiam as universidades a reformular seus currículos, enfatizando a adaptabilidade, o pensamento crítico e o aprendizado contínuo. Especialistas discutiram como a formação deve se alinhar com as novas demandas do mercado de trabalho, o uso ético da tecnologia e os desafios do desenvolvimento sustentável.", "titulo_pt": "Como a IA está redefinindo a inovação curricular das universidades", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 222353, "titulo": "Inside the Pentagon, the pressure is on to find a home for a new spaceport", "url": "https://arstechnica.com/space/2026/10/senior-commander-says-space-force-needs-new-spaceport-by-2030/", "fonte_id": "ars_technica", "data_pub": "2026-10-23T19:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Space Force está avaliando diferentes opções para localizar um novo espaçoporto, incluindo parcerias público-privadas, instalações federais e terras estatais.", "titulo_pt": "Dentro do pentágono, a pressão é para encontrar um local para um novo espaçoporto", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 222359, "titulo": "Jack Dorsey’s Block made an AI model that talks to you like an awkward new friend", "url": "https://www.theverge.com/ai-artificial-intelligence/1017906/jack-dorsey-block-dessa-ai-voice-speech", "fonte_id": "the_verge", "data_pub": "2026-10-23T19:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Block, de Jack Dorsey, lançou um modelo de IA chamado Dessa, treinado apenas em conversas humanas. As demonstrações mostram conversas ocasionalmente desconfortáveis e estranhas.", "titulo_pt": "Jack dorsey's Block lançou um modelo de IA que se comunica como um novo amigo incômodo", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 222364, "titulo": "Carta and NewView partner, hoping to entice more startups to let employees sell shares early", "url": "https://techcrunch.com/2026/10/23/carta-and-newview-partner-hoping-to-entice-more-startups-to-let-employees-sell-shares-early/", "fonte_id": "techcrunch", "data_pub": "2026-10-23T19:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova iniciativa visa estimular mais startups a permitir que funcionários vendam ações antes do prazo estipulado, tornando o processo de transação mais fácil. O programa espera atraír mais empresas para adotar essa prática.", "titulo_pt": "Nova iniciativa e parceiro carta esperam atrair mais startups a permitir a venda antecipada de ações pelos funcionários", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 222354, "titulo": "Spotify ramps up policy enforcement on family plans", "url": "https://arstechnica.com/gadgets/2026/10/spotify-ramps-up-policy-enforcement-on-family-plans/", "fonte_id": "ars_technica", "data_pub": "2026-10-23T19:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Spotify está intensificando o cumprimento de suas políticas para os planos familiares, exigindo que os usuários compartilhem seus assinamentos e possam validar a relação familiar através de um código QR.", "titulo_pt": "Spotify intensifica controle em planos familiares", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 222365, "titulo": "From Toast to Bessemer: Who founders will hear from at TechCrunch Founder Summit 2026", "url": "https://techcrunch.com/2026/10/23/from-toast-to-bessemer-who-founders-will-hear-from-at-techcrunch-founder-summit-2026/", "fonte_id": "techcrunch", "data_pub": "2026-10-23T19:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O TechCrunch Founder Summit 2026, realizado em parceria com a Fidelity Private Shares, é um evento de um dia que aborda mais do que apenas financiamento e inteligência artificial, explorando os desafios reais de encontrar clientes, construir equipes, aprimorar a apresentação do negócio, desenvolver liderança de fundador e escalar empresas, tanto dentro quanto fora dos tradicionais hubs de startups.", "titulo_pt": "Do pão ao Bessemer: quem fundadores ouvirão no TechCrunch Founder Summit 2026", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 222050, "titulo": "Centro universitário em MG será o primeiro com cirurgia robótica pelo SUS", "url": "https://www.cnnbrasil.com.br/saude/centro-universitario-em-mg-sera-o-primeiro-com-cirurgia-robotica-pelo-sus/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-23T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Saúde planeja oferecer gratuitamente cirurgias urológicas pelo SUS, utilizando tecnologia robótica, para pacientes com câncer de próstata. A iniciativa começará em um centro universitário em Minas Gerais e será estendida para outros quatro hospitais.", "titulo_pt": "Centro universitário em MG será o primeiro a oferecer cirurgia robótica pelo SUS", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 222368, "titulo": "Counting magnetic flux quanta offers new way to measure photon numbers", "url": "https://phys.org/news/2026-10-magnetic-flux-quanta-photon.html", "fonte_id": "phys_org", "data_pub": "2026-10-23T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores do AIST observaram diretamente os fluxos magnéticos gerados em um supercondutor por absorção de fotões e demonstraram um novo princípio de detecção de fotões que identifica o número de fotões com base no número desses fluxos magnéticos.", "titulo_pt": "Contagem de fluxos magnéticos oferece nova maneira de medir o número de fótons", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 222369, "titulo": "'It's pretty toxic… but just a little, I want to be like that': What young men think of manosphere content", "url": "https://phys.org/news/2026-10-pretty-toxic-young-men-manosphere.html", "fonte_id": "phys_org", "data_pub": "2026-10-23T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Conteúdo que promove masculinidade sugere a jovens homens otimização pessoal e sucesso, mas frequentemente resulta em danos à saúde, comportamentos arriscados, padrões inatingíveis, estereótipos de gênero e misoginia. A misoginia é o maior preditor de extremismo violento.", "titulo_pt": "É bem tóxico... Mas apenas um pouco, quero ser assim: como os jovens homens pensam sobre o conteúdo do manosphere", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 222370, "titulo": "Scientists demonstrate AI-designed enzyme for drug synthesis", "url": "https://phys.org/news/2026-10-scientists-ai-enzyme-drug-synthesis.html", "fonte_id": "phys_org", "data_pub": "2026-10-23T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas desenvolveram um modelo de geração unificado RFD4-Proteina para o design de proteínas, em colaboração com o Instituto para o Design de Proteínas (IPD) e a NVIDIA. Este modelo utiliza inteligência artificial para criar novas sequências e estruturas de proteínas, alcançando taxas de sucesso computacional cinco a dez vezes superiores aos modelos anteriores e gerando candidatos cinco a dez vezes mais rapidamente.", "titulo_pt": "Cientistas demonstram enzima ai para síntese de medicamentos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 222411, "titulo": "On this day in space! Oct. 23, 2007: NASA launches Harmony module to ISS on STS-120 space shuttle mission", "url": "https://www.space.com/space-exploration/on-this-day-in-space-october-23-2026", "fonte_id": "space_com", "data_pub": "2026-10-23T20:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 23 de outubro de 2007, a nave espacial Discovery lançou o módulo Harmony para a Estação Espacial Internacional (ISS). Este evento foi significativo para a expansão da ISS.", "titulo_pt": "23 De outubro de 2007: NASA lança módulo Harmony para ISS com missão da discovery", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 222371, "titulo": "Chemically modified sugars enable direct nanostructure formation", "url": "https://phys.org/news/2026-10-chemically-sugars-enable-nanostructure-formation.html", "fonte_id": "phys_org", "data_pub": "2026-10-23T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores do AIST demonstraram a síntese de materiais carbônicos nanoporosos e com estruturas nanoestratificadas através de um processo simples que envolve a modificação química de açúcares comuns, como sacarose e frutose.", "titulo_pt": "Açúcares modificados permitem a formação direta de nanoestruturas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 222372, "titulo": "The psychology of why we overpay for used cars—study points to left-digit bias", "url": "https://phys.org/news/2026-10-psychology-overpay-cars-left-digit.html", "fonte_id": "phys_org", "data_pub": "2026-10-23T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos mostram que os consumidores frequentemente ignoram informações relevantes durante compras, como taxas e detalhes técnicos. Um estudo específico destaca o fenômeno da 'diferença de algarismo esquerdo', que explica por que as pessoas podem pagar mais por veículos usados.", "titulo_pt": "A psicologia por trás do porquê pagamos mais por carros usados—estudo aponta para a preferência pelo primeiro dígito", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 222373, "titulo": "Designing better adsorbents to remove PFAS from water", "url": "https://phys.org/news/2026-10-adsorbents-pfas.html", "fonte_id": "phys_org", "data_pub": "2026-10-23T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade do Tohoku revisaram características moleculares cruciais para o desenvolvimento de materiais mais eficazes na remoção de PFAS da água. O estudo foi publicado na revista ACS Materials Au.", "titulo_pt": "Projeto de adsorventes melhores para remover PFAS da água", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 222374, "titulo": "Plain silicon grating reveals a hidden 'twist' in light from electron beams", "url": "https://phys.org/news/2026-10-plain-silicon-reveals-hidden-electron.html", "fonte_id": "phys_org", "data_pub": "2026-10-23T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 1953, dois físicos demonstraram que um feixe de elétrons passando por uma grade emitirá luz cuja cor depende apenas da velocidade dos elétrons e do espaçamento da grade. Esta fenômeno, conhecido como radiação de Smith-Purcell, se tornou uma ferramenta útil para construir fontes de luz compactas e ajustáveis e para rastrear feixes de partículas sem tocá-los.", "titulo_pt": "Grade simples de silício revela um 'girar' oculto na luz emitida por feixes de elétrons", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 221952, "titulo": "‘Precisamos de mais mulheres nos estudos sobre câncer de pulmão’, diz médica premiada em congresso europeu", "url": "https://veja.abril.com.br/saude/precisamos-de-mais-mulheres-nos-estudos-sobre-cancer-pulmao-diz-medica-premiada-em-congresso-europeu/", "fonte_id": "veja", "data_pub": "2026-10-23T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A médica premiada Pilar Garrido destacou a necessidade de incluir mais mulheres em estudos sobre câncer de pulmão. Ela alerta para fatores de risco que desafiam a prevenção da doença entre mulheres.", "titulo_pt": "Necessitamos de mais mulheres nos estudos sobre câncer de pulmão", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 222375, "titulo": "Elections are more predictable than they look", "url": "https://phys.org/news/2026-10-elections.html", "fonte_id": "phys_org", "data_pub": "2026-10-23T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa mostra que as eleições para o congresso nos Estados Unidos seguem padrões estatísticos fortes, mesmo que as eleições individuais possam surpreender. A polarização política e a percepção de cada eleição como única e imprevisível estão sendo desafiadas por essa nova pesquisa.", "titulo_pt": "Eleições para o congresso são mais previsíveis do que se pensa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 222376, "titulo": "Bacteria reinvent their weapons through selection, chance and gene swapping", "url": "https://phys.org/news/2026-10-bacteria-reinvent-weapons-chance-gene.html", "fonte_id": "phys_org", "data_pub": "2026-10-23T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitos dos antibióticos mais potentes vêm de bactérias e pertencem a uma classe de compostos conhecidos como peptídeos não-ribossomais (NRP). Estes são produzidos por grandes maquinários enzimáticos bacterianos que funcionam como linhas de montagem moleculares, concatenando aminoácidos para formar peptídeos.", "titulo_pt": "Bactérias reinventam suas armas através da seleção, do acaso e da troca de genes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 222401, "titulo": "Nov. 5: Satellite Mission Management at the Edge", "url": "https://spacenews.com/satellite-mission-management-at-the-edge-event/", "fonte_id": "spacenews", "data_pub": "2026-10-23T19:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceNews convidará os leitores a explorar como tecnologi idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em setembro, a comunidade do Reddit de Singapura reagiu ao novo aplicativo de relacionamento do governo chamado FirstDate. O autor do relato tentou se cadastrar no aplicativo, mas foi informado que só era permitido usar endereços de email institucionais.", "titulo_pt": "As governanças asiáticas que desejam estimular o namoro têm dificuldades para atrair usuários", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 221975, "titulo": "Prefeito é acusado de assédio eleitoral por exigir apoio a Xaropinho", "url": "https://www.metropoles.com/colunas/demetrio-vecchioli/prefeito-e-acusado-de-assedio-eleitoral-por-exigir-apoio-a-xaropinho", "fonte_id": "metropoles", "data_pub": "2026-10-23T21:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O prefeito de Cotia, Wellington Formiga, teria pressionado comissionados a apoiarem Xaropinho em sua campanha para deputado federal. Essa ação teria sido considerada como assédio eleitoral.", "titulo_pt": "Prefeito é acusado de assédio eleitoral por pressionar comissionados a apoiarem candidato", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 222069, "titulo": "Análise: Como os protestos na França impactam as marcas de luxo?", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/analise-como-os-protestos-na-franca-impactam-as-marcas-de-luxo/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-23T20:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As marcas de luxo LVMH, Gucci e Hermès registraram quedas na bolsa de valores durante as tensões políticas e a crise estrutural no setor de luxo na França. O editor de Economia da CNN, Pedro Zanatta, explica o tema no programa Bastidores CNN.", "titulo_pt": "Análise: como os protestos na França afetam as marcas de luxo?", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 221982, "titulo": "'A Professora de Françês': o terror à brasileira que faz do conservadorismo um pesadelo", "url": "https://exame.com/casual/o-terror-a-brasileira-que-transforma-o-afeto-em-controle-e-o-conservadorismo-em-pesadelo/", "fonte_id": "exame", "data_pub": "2026-10-23T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O filme 'A Professora de Francês', dirigido por Grace Passô e exibido na 50ª Mostra de Cinema de São Paulo, usa o gênero do terror social para explorar as feridas causadas pelo fanatismo e pelo preconceito velado antes das eleições brasileiras.", "titulo_pt": "A Professora de francês: o terror à brasileira que faz do conservadorismo um pesadelo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 221027, "titulo": "Empresário é alvo do MPT por obrigar funcionários a usar adereços políticos", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/empresario-e-alvo-do-mpt-por-obrigar-funcionarios-a-usar-aderecos-politicos", "fonte_id": "metropoles", "data_pub": "2026-10-23T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público do Trabalho (MPT) investiga uma empresa em Itabaiana, Sergipe, por obrigar funcionários a usar adereços políticos. De acordo com denúncias, o empresário ameaçou cortar o salário de quem não fizesse propaganda para seu candidato.", "titulo_pt": "Empresário é alvo do MPT por obrigar funcionários a usar adereços políticos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 221109, "titulo": "Idosa de 78 anos é presa após desafiar e impedir o trabalho de um robô entregador", "url": "https://www.cnnbrasil.com.br/curiosidades/idosa-de-78-anos-e-presa-apos-desafiar-e-impedir-o-trabalho-de-um-robo-entregador/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-23T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma idosa de 78 anos foi detida após desafiar e impedir a passagem de um robô entregador, em defesa dos empregos humanos. A professora aposentada foi presa por essa ação.", "titulo_pt": "Idosa de 78 anos é detida após desafiar robô entregador", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 221030, "titulo": "Criança picada por escorpião no Zoológico de Brasília tem alta hospitalar", "url": "https://www.metropoles.com/distrito-federal/crianca-picada-por-escorpiao-no-zoologico-de-brasilia-tem-alta-hospitalar", "fonte_id": "metropoles", "data_pub": "2026-10-23T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma criança de 5 anos foi picada por um escorpião que estava dentro de seu tênis no Zoológico de Brasília. Ela foi atendida no local e posteriormente levada para o hospital, mas já recebeu alta médica.", "titulo_pt": "Criança picada por escorpião no Zoológico de Brasília recebe alta hospitalar", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 221116, "titulo": "Anvisa endurece regras para uso de polilaminina após registro de 9 mortes", "url": "https://www.cnnbrasil.com.br/saude/anvisa-endurece-regras-para-uso-de-polilaminina-apos-registro-de-9-mortes/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-23T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anvisa endureceu as regras para o uso da polilaminina após registrar nove mortes relacionadas ao medicamento. A agência restringiu a inserção de pacientes em programas de uso compassivo devido a evidências que não atendem aos critérios para testes clínicos.", "titulo_pt": "Anvisa endurece regras para uso de polilaminina após nove mortes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 221038, "titulo": "Jovem de 24 anos morre após cirurgia maxilar e família denuncia erro médico", "url": "https://www.metropoles.com/sao-paulo/jovem-de-24-anos-morre-apos-cirurgia-maxilar-e-familia-denuncia-erro-medico", "fonte_id": "metropoles", "data_pub": "2026-10-23T16:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Kethiny Evinlyn, de 24 anos, faleceu após uma cirurgia maxilar. Sua família afirma que ela foi direto para a UTI após a cirurgia e morreu alguns dias depois, sem que a equipe médica fornecesse explicações detalhadas.", "titulo_pt": "Jovem de 24 anos morre após cirurgia maxilar e família denuncia erro médico", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 221040, "titulo": "Bomba estoura em adolescente que planejava ataque a escola na zona leste", "url": "https://www.metropoles.com/sao-paulo/bomba-estoura-em-adolescente-que-planejava-ataque-a-escola-na-zona-leste", "fonte_id": "metropoles", "data_pub": "2026-10-23T16:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um adolescente foi flagrado com ferimentos no braço e barriga. Ele estava planejando possíveis ataques a policiais militares e agentes de ensino.", "titulo_pt": "Bomba estoura em adolescente que planejava ataque a escola na zona leste", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 221072, "titulo": "Representantes de cidades da América Latina se reúnem na China para discutir energia limpa, agricultura e cooperação local", "url": "https://www.brasildefato.com.br/2026/10/23/representantes-de-cidades-da-america-latina-se-reunem-na-china-para-discutir-energia-limpa-agricultura-e-cooperacao-local/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-23T16:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Representantes de cidades e províncias de mais de 30 países latino-americanos e caribenhos se reuniram em Yulin, na China, para discutir energia limpa, agricultura e cooperação local. O encontro faz parte do IV Fórum de Cooperação entre Governos Locais China-América Latina e Caribe, incluído no Plano de Ação Conjunto China-Celac.", "titulo_pt": "Representantes de cidades da América Latina se reúnem na China para discutir energia limpa, agricultura e cooperação local", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 221017, "titulo": "Deputado pede proteção para Roberta Luchsinger, alvo de ameaças por falas sobre Lula", "url": "https://veja.abril.com.br/politica/deputado-pede-protecao-para-roberta-luchsinger-alvo-de-ameacas-por-falas-sobre-lula/", "fonte_id": "veja", "data_pub": "2026-10-23T15:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um deputado solicitou proteção para a parlamentar Roberta Luchsinger, que está sendo ameaçada por comentários sobre Lula. O parlamentar Sanderson pretende chamar um lobista para discutir na Câmara dos Deputados as ameaças sofridas pela parlamentar e os eventos que envolveram o filho do presidente da República.", "titulo_pt": "Deputado pede proteção para parlamentar ameaçada e planeja debate sobre ameaças na câmara", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 222048, "titulo": "Carta Santarém: mineração responsável e transparência de dados na Amazônia", "url": "https://www.cnnbrasil.com.br/infra/carta-santarem-mineracao-responsavel-e-transparencia-de-dados-na-amazonia/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-23T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Anderson Baranov destaca a necessidade de transparência, rigor técnico e compromisso com a sustentabilidade na mineração contemporânea na Amazônia.", "titulo_pt": "Carta Santarém: mineração responsável e transparência na Amazônia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 222051, "titulo": "Distribuidoras de energia reforçam plano para eleições por risco climático", "url": "https://www.cnnbrasil.com.br/infra/distribuidoras-de-energia-reforcam-plano-para-eleicoes-por-risco-climatico/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-23T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As distribuidoras de energia estão intensificando seus planos para as eleições devido a uma previsão de frente fria e ciclone extratropical que podem afetar o fornecimento de energia nas áreas votantes.", "titulo_pt": "Distribuidoras de energia reforçam plano para eleições por risco climático", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 221114, "titulo": "Onda de calor brutal matou mais de 50 mil pessoas na Europa, indica análise", "url": "https://www.cnnbrasil.com.br/internacional/onda-de-calor-brutal-matou-mais-de-50-mil-pessoas-na-europa-indica-analise/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-23T17:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma análise indicou que o verão de 2026 foi provavelmente o mais perigosamente quente na Europa até hoje. Onda de calor brutal matou mais de 50 mil pessoas no continente.", "titulo_pt": "Onda de calor brutal matou mais de 50 mil pessoas na Europa, indica análise", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 221251, "titulo": "Cómo los eventos climáticos extremos amenazan la seguridad alimentaria en Chile", "url": "https://www.latercera.com/sustentabilidad/noticia/como-los-eventos-climaticos-extremos-amenazan-la-seguridad-alimentaria-en-chile/", "fonte_id": "la_tercera", "data_pub": "2026-10-23T17:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em um contexto de Dia Internacional contra o Mudança Climática, Cheaf alerta sobre os efeitos dos eventos climáticos extremos na agricultura e na segurança alimentar. Um novo relatório da ONU prevê um aquecimento global superior a 2°C neste século.", "titulo_pt": "Como os eventos climáticos extremos ameaçam a segurança alimentar no Chile", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 221034, "titulo": "Bactérias estão se alimentando de combustível vazado de navios da 2ª Guerra", "url": "https://www.metropoles.com/ciencia/bacterias-estao-se-alimentando-de-combustivel-vazado-de-navios-da-2a-guerra", "fonte_id": "metropoles", "data_pub": "2026-10-23T17:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bactérias estão se alimentando de combustível vazado de navios naufragados na Micronésia durante a 2ª Guerra Mundial. Os navios naufragaram em 1944 devido a ataques aéreos norte-americanos.", "titulo_pt": "Bactérias se alimentam de combustível de navios da 2ª Guerra em naufrágios da micronésia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 221005, "titulo": "Cinco países suspendem compras de frango brasileiro após confirmação de doença em SC", "url": "https://veja.abril.com.br/economia/cinco-paises-suspendem-compras-de-frango-brasileiro-apos-confirmacao-de-doenca-em-sc/", "fonte_id": "veja", "data_pub": "2026-10-23T16:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cinco países, incluindo Arábia Saudita, Malásia, China, Chile e México, suspenderam as compras de frango brasileiro após a confirmação de uma doença em Santa Catarina.", "titulo_pt": "Cinco países suspendem importações de frango brasileiro após confirmação de doença em SC", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 221772, "titulo": "Chart: A record two-thirds of car sales in China are now electric vehicles", "url": "https://www.carbonbrief.org/chart-a-record-two-thirds-of-car-sales-in-china-are-now-electric-vehicles", "fonte_id": "carbon_brief", "data_pub": "2026-10-23T15:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em setembro, as vendas de veículos elétricos e híbridos novos atingiram 67% do total de vendas de carros em China, um recorde.", "titulo_pt": "Gráfico: dois terços dos carros vendidos na China agora são veículos elétricos", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 221525, "titulo": "Storm Austen batters France and UK with winds of up to 160 km/h", "url": "https://www.euronews.com/video/2026/10/23/storm-austen-batters-france-and-uk-with-winds-of-up-to-160-kmh", "fonte_id": "euronews", "data_pub": "2026-10-23T13:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O temporal Austen atingiu a França e o Reino Unido com ondas gigantes, árvores arrancadas do chão e barcos danificados. Vento forte de até 160 km/h atingiu a Bretanha francesa, enquanto galhos caídos bloquearam as estradas no sul da Inglaterra.", "titulo_pt": "Temporal Austen castiga França e reino unido com ventos de até 160 km/h", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 221059, "titulo": "Gestão Sustentável: Brasil mostra que a transição climática é possível", "url": "https://exame.com/bussola/gestao-sustentavel-brasil-prova-que-a-transicao-climatica-e-possivel/", "fonte_id": "exame", "data_pub": "2026-10-23T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil registrou uma redução de 6% nas emissões de gases de efeito estufa em 2025, principalmente devido ao controle do desmatamento na Amazônia e no Cerrado.", "titulo_pt": "Gestão Sustentável: Brasil demonstra que a transição climática é possível", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 221061, "titulo": "Fogo vira caso de polícia no Amazonas, e fumaça acompanha Manaus até as urnas", "url": "https://exame.com/esg/fogo-vira-caso-de-policia-no-amazonas-e-fumaca-acompanha-manaus-ate-as-urnas/", "fonte_id": "exame", "data_pub": "2026-10-23T12:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal abriu nove procedimentos relacionados ao fogo no Amazonas. Embargos somam 250 hectares e os focos de incêndio recuaram 46%, mas as chamas ainda persistem em 30 municípios.", "titulo_pt": "Fogo vira caso de polícia no Amazonas e fumaça acompanha Manaus até as urnas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 221585, "titulo": "Government calls for stronger energy supply structure in white paper", "url": "https://www.japantimes.co.jp/news/2026/10/23/japan/japan-energy-white-paper/", "fonte_id": "japan_times", "data_pub": "2026-10-23T11:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório orçamentário de 2025 sobre energia enfatizou a necessidade de fortalecer a estrutura de oferta e demanda de energia no Japão para se preparar para emergências futuras.", "titulo_pt": "Governo destaca a necessidade de fortalecer a estrutura de energia no white paper", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 220690, "titulo": "Paper straws worse for the environment than plastic, South Korea study finds", "url": "https://www.scmp.com/week-asia/health-environment/article/3371936/paper-straws-worse-environment-plastic-south-korea-study-finds", "fonte_id": "scmp", "data_pub": "2026-10-23T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo encomendado pelo Ministério de Clima, Energia e Meio Ambiente da Coreia do Sul descobriu que os palitos de papel, amplamente promovidos como uma alternativa ecológica aos de plástico, podem ter um impacto ambiental maior do que os palitos de plástico convencionais. Este achado reavivou a discussão sobre se a mudança de material realmente reduz o desperdício.", "titulo_pt": "Palitos de papel podem ter maior impacto ambiental do que os de plástico, sugere estudo sul-coreano", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 220586, "titulo": "Flash floods swamp southeast Australia as record October rainfall forces school closures", "url": "https://www.euronews.com/2026/10/23/flash-floods-swamp-southeast-australia-as-record-october-rainfall-forces-school-closures", "fonte_id": "euronews", "data_pub": "2026-10-23T08:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Flash floods inundaram áreas do sul-leste da Austrália, causando alagamentos graves que levaram a escolas a serem fechadas devido a chuvas históricas em outubro. Um repórter de televisão teve que se despir de sapatos e óculos para resgatar um motorista cujo carro estava afundando rapidamente em Morayfield, Queensland.", "titulo_pt": "Inundações flash inundam sul-leste da austrália com chuvas de outubro recorde fechando escolas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 220182, "titulo": "Vazamento de petróleo provoca fechamento de praias nos Emirados Árabes", "url": "https://www.metropoles.com/mundo/vazamento-de-petroleo-provoca-fechamento-de-praias-nos-emirados-arabes", "fonte_id": "metropoles", "data_pub": "2026-10-23T08:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Praias nos Emirados Árabes foram fechadas devido a um vazamento de petróleo. Elas permanecerão fechadas até que equipes técnicas avaliem a situação e determinem as medidas necessárias.", "titulo_pt": "Vazamento de petróleo leva a fechamento de praias nos Emirados Árabes", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 220588, "titulo": "Taiwan: Deadly Typhoon Champi brings travel chaos and school closures", "url": "https://www.euronews.com/video/2026/10/23/taiwan-deadly-typhoon-champi-brings-travel-chaos-and-school-closures", "fonte_id": "euronews", "data_pub": "2026-10-23T07:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O furacão Champi atingiu a costa de Taiwan, causando ondas altas e deixando uma morte, 94 feridos e centenas de voos cancelados.", "titulo_pt": "Taiwan: furacão Champi causa mortes, feridos e cancelamentos de voos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 220671, "titulo": "Japan weighs how to evacuate thousands of tourists if Mount Fuji erupts", "url": "https://www.japantimes.co.jp/news/2026/10/23/japan/mount-fuji-eruption-foreign-tourists/", "fonte_id": "japan_times", "data_pub": "2026-10-23T07:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Monte Fuji, o ponto mais alto do Japão, é frequentemente considerado um vulcão inativo. No entanto, com o risco de erupção sempre presente, a preparação para desastres é crucial.", "titulo_pt": "Japão pondera como evacuar milhares de turistas se o monte Fuji erupcionar", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 222196, "titulo": "Macron condemns racism after one killed in ‘terrorist’ shooting near Paris", "url": "https://www.theguardian.com/world/2026/oct/23/macron-condemns-racism-after-one-killed-in-terrorist-shooting-near-paris", "fonte_id": "guardian_world", "data_pub": "2026-10-23T21:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem armado atirou de carro em Trappes e Verrière, perto de Paris, matando uma pessoa e ferindo uma menina de 12 anos e mais quatro pessoas. Macron condenou a racismo na sociedade francesa após o que ele chamou de 'ataque terrorista racista'.", "titulo_pt": "Macron condena racismo após morte em disparo 'terrorista' perto de Paris", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 222153, "titulo": "Detuvieron en Esquel a un bioquímico que tenía en cautiverio dentro de la casa a su esposa y sus hijos", "url": "https://www.lanacion.com.ar/seguridad/detuvieron-en-esquel-a-un-bioquimico-que-tenia-en-cautiverio-dentro-de-la-casa-a-su-esposa-y-sus-nid23102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-23T21:39:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O juiz determinou a prisão preventiva do bioquímico Miguel Edgardo Battista, de 71 anos, acusado de privar ilegalmente sua esposa e filhos da liberdade e de abandoná-los em casa.", "titulo_pt": "Bioquímico de 71 anos é detido em Esquel após ter esposa e filhos em cárcere privado em casa", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 222300, "titulo": "'Everybody is terrorised': El-Fasher population drops to just seven percent of last year's high, Amnesty says", "url": "https://www.middleeasteye.net/news/everybody-terrorised-el-fasher-population-drops-just-7-percent-last-years-high-amnesty-says", "fonte_id": "middle_east_eye", "data_pub": "2026-10-23T20:12:00Z", "idioma": "en", "provavel_duplicat function toggleDrill(id) {
