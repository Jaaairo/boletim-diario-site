<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 19/11/2026 15:31 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">
    <div class="modal-erro" id="senha-erro" style="display:none">Senha incorreta.</div>
    <div class="modal-btns">

  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>

      <button class="btn-pri" onclick="salvarFlagAtual()">Marcar</button>

  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "19/11/2026 15:31", "stats": {"noticias_novas": 939, "resumos_gerados": 251}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva apresentou várias medidas e anúncios importantes para o Brasil. Entre elas, a proposta de gratuidade no transporte público aos finais de semana, como parte da redução gradual da carga horária semanal, que passará de 44 horas para 42 horas a partir de dezembro de 2023 e para 40 horas em dezembro de 2027. Lula também anunciou a criação de um novo ministério para políticas voltadas aos idosos, embora o nome da pasta ainda não tenha sido definido. Além disso, o governo prometeu manter os direitos sociais durante o mandato, rejeitando especulações sobre a futura equipe ministerial. Em outro desenvolvimento, o Senado aprovou alterações no Acordo da Lei Kandir, elevando o piso de repasses e antecipando compensações para os estados, mas a proposta ainda precisa ser aprovada pela Câmara dos Deputados.", "mundo": "A Corte Internacional de Justiça declarou que a Birmanha cometeu genocídio contra a minoria rohingya em 2017, em uma sentença inédita que resultou em milhares de mortes. O Reino Unido e a União Europeia terão uma cúpula em Bruxelas para discutir o futuro relacionamento entre os dois, com tensões persistindo sobre o papel do Reino Unido na definição de regras futuras para alimentos e agricultura na UE. O encontro entre Xi, Trump e Putin em Shenzhen não alcançou os grandes objetivos declarados, sendo considerado histórico como o primeiro encontro entre os líderes dos três países, mas provavelmente não terá um impacto significativo. Além disso, a Corte Internacional de Justiça condenou a Birmanha por genocídio em relação à ofensiva contra os rohingyas, sendo este o primeiro caso em que a principal corte da ONU condena um Estado por genocídio, podendo servir como precedente para processos futuros.\n\nA crise no Oriente Médio representa a maior ameaça à segurança energética global na história, conforme alerta a Agência Internacional de Energia, devido à interrupção das suprimentos de petróleo através do Estreito de Ormuz. Em Shenzhen, China, Donald Trump, Xi Jinping e Vladimir Putin realizaram uma reunião tripla inédita, focando em temas como armas nucleares e a guerra na Ucrânia, mas sem anunciar acordos. O Irã está gradualmente implementando sua estratégia de afetar o Ocidente, enquanto Israel realiza uma operação terrestre significativa na Faixa de Gaza, denunciada pelo Hamas. A Coreia do Norte está expandindo sua capacidade de enriquecimento de urânio, levando a preocupações internacionais sobre a estabilidade nuclear. Além disso, a Alemanha sediou uma reunião de aliados ocidentais para reforçar a solidariedade com a Ucrânia, enquanto a Arábia Saudita relata novos ataques atribuídos aos hutis.", "economia": "O dólar permaneceu acima dos R$1.000 por duas sessões seguidas, atingindo um novo máximo próximo a dois anos, segundo relatos do [la_tercera]. A partir do dia 16 de dezembro, a jornada semanal de trabalho será reduzida, aumentando o valor das horas extras para os trabalhadores mensalistas, conforme informado pelo [folha_mercado]. A empresa de inteligência artificial Anthropic estreou na Nasdaq com uma oferta inicial de ações (IPO) recorde, avaliada em 1,5 trilhões de dólares, conforme noticiado pelo [euronews] e [dw_brasil]. O ouro caiu significativamente desde o recorde de janeiro, devido a juros mais altos e a uma moeda americana mais forte, o que altera o caso de investimento para o metal precioso, conforme relatado pelo [cnbc_international]. O Banco do Brasil notificou os correntistas sobre a acessibilidade indevida de dados pessoais, incluindo nome, CPF, email, agência e número da conta, devido a um acesso feito por meio de uma credencial válida utilizada por terceiros, conforme informado pelo [jota].", "tecnologia": "A TSMC, líder mundial na fabricação de chips, está endurecendo as restrições sobre chips de inteligência artificial para a China em resposta às novas regras dos EUA. A empresa gastou US$500 milhões para adquirir 0,03% da Anthropic, refletindo a crescente importância do setor de IA. A Anthropic, avaliada em US$1,5 trilhão na Nasdaq, é considerada um investimento obrigatório. Kristalina Georgieva, diretora gerente do FMI, alertou para mais correções no mercado de IA, sugerindo um cenário volátil para o setor. Segundo o Financial Times, a Anthropic precisa se tornar uma plataforma completa de tecnologia empresarial após sua oferta inicial de ações.", "ciencia": "Um estudo recente publicado na revista Applied Sciences mostrou que o pantanal artificial Tancat de la Pipa, projetado para reduzir a poluição por microplásticos na Albufera de Valência, conseguiu diminuir a poluição em 36%. Mesmo com o Mar Adriático aquecendo rapidamente, os góbios pretos (Gobius niger) estão crescendo de tamanho, conforme relatado por pesquisadores da Universidade de Viena. Um espécime de orca de quase 8 metros de comprimento, encontrado no Mar do Norte há mais de 2 milhões de anos, indica que as orcas evoluíram para se alimentar de mamíferos marinhos mais cedo do que se pensava. Um novo material metal-orgânico combina a condutividade metálica com potencial para eletrônica sensível à luz, crucial para a eletrônica moderna. Um estudo recente publicado na Royal Society Open Science mostrou que a estrutura de bico de um dinossauro hadrosauroid italiano, Tethyshadros insularis, não era composta por projeções ósseas visíveis, mas sim por um bico semelhante ao de uma ave escondido sob essas projeções. Cientistas concordam que as pessoas que vivem mais tempo se movimentam de forma natural em seus ambientes, sem necessariamente fazer exercícios específicos. O foguete Voyager 1, o mais distante da humanidade, atingiu uma distância equivalente a um dia-luz do Sol após mais de 49 anos de viagem contínua. A NASA realizou um teste do motor RS-25 número 10001 no estádio de testes Fred Haise em Stennis Space Center, Mississippi, em 18 de novembro, que durou três minutos e 20 segundos. A NASA Science Data Powers New Method to Discover Hard-to-Find Pulsars, desenvolvido com base em dados da missão Fermi, auxiliou uma equipe internacional de cientistas a desenvolver um método para descobrir pulsares cerca de um milhão de vezes mais rápido do que antes. A NASA exibiu seus primeiros fósseis de dinossauro, pertencentes a um sauropode de mais de 20 metros que viveu há cerca de 100 milhões de anos, em uma exposição no Centro de Descobertas da Herança de Hong Kong. O uso de terapia hormonal para menopausa entre mulheres com idades entre 40 e 74 anos aumentou mais do que o dobro entre 2023 e 2026, de acordo com um estudo baseado em uma base de dados de farmácias dos Estados Unidos. Um medicamento experimental, que atua sobre a mesma enzima inibida pelo Viagra, foi testado em 1.535 participantes de 13 países e mostrou potencial para reduzir o declínio cognitivo associado ao Alzheimer. A biotecnológica Erasca pode ter desenvolvido um medicamento antineoplásico mais potente e melhor tolerado para o tratamento de câncer de RAS em comparação com a Revolution Medicines. As águas do oceano na costa da Califórnia estão em níveis históricos, o que pode levar a inundações severas durante o inverno, devido à combinação de El Niño e marés rei. A descoberta de um sítio arqueológico antigo maia não foi feita por inteligência artificial, mas gerou debates sobre o uso dessa tecnologia na ciência.", "cultura": "Em Padre Miguel, na zona oeste do Rio de Janeiro, foi inaugurado um busto de Dandara, líder quilombola, na véspera do Dia da Consciência Negra. Esta iniciativa visa valorizar a cultura negra e homenagear líderes históricos. Por outro lado, a Band decidiu não produzir um programa com Luciana Gimenez para 2027, devido à falta de interesse do mercado publicitário. O projeto, inicialmente previsto para 2027, foi adiado e posteriormente deixado de lado. A atriz Sophie Charlotte será uma das apresentadoras da 54ª edição do Emmy Internacional, que acontecerá na próxima segunda-feira (23), em Nova York. Além disso, Marília Mendonça lançará um novo álbum póstumo nesta quinta-feira (19), às 21h, intitulado 'Manuscritos - Capítulo II', com 12 músicas de uma live realizada em 2021 durante a pandemia de Covid-19.", "sociedade": "O empresário Eric Conrado foi declarado réu e teve prisão preventiva decretada após ser acusado de matar sua namorada, uma advogada, e o filho dela, de 6 anos. Em Minas Gerais, o governador Romeu Zema foi criticado nas redes sociais por substituir a coronel Cleide, a primeira mulher a comandar a Polícia Militar do estado. Dezenas de cães foram abandonados na Granja do Torto, e a comunidade busca pessoas interessadas em castrar e adotar os animais. Em São Paulo, o feriado da Consciência Negra terá atendimento presencial interrompido no Poupatempo e no Detran, enquanto o transporte público funcionará com operação especial. A cidade de Goiás terá que pagar uma indenização por causa da morte de um jovem que teve meningite, devido a falhas na investigação dos sintomas apresentados em uma unidade de saúde. O estudo da Harvard sobre longevidade, iniciado em 1938, revelou que a amizade é mais importante do que os exames médicos para a saúde e o bem-estar ao longo da vida. Além disso, um homem de 51 anos, Marcelo Cunha Massari, foi preso por feminicídio de uma tatuadora encontrada morta em uma praça de São Paulo.", "meio_ambiente": "No penúltimo dia da COP31, os debates se concentraram em investimentos, justiça climática e soluções práticas, com negociações em andamento na reta final. A ministra do Meio Ambiente do Nepal, Gita Chaudhary, enfatizou a urgência de justiça climática e a responsabilidade dos países mais poluentes, após a tragédia climática que deixou mais de 1.400 mortos e causou perdas equivalentes a 10% do PIB do país. A conferência termina oficialmente na sexta-feira, com expectativa por uma decisão importante. Em Minas Gerais, um decreto foi emitido reconhecendo a responsabilidade compartilhada no licenciamento ambiental, servindo como modelo para outros estados. As inundações recentes na região de Prachinburi, na Tailândia, revelaram problemas de poluição por resíduos na 'área de descarte de lixo', localizada entre Bangkok e a principal zona industrial do leste do país. Além disso, o fenômeno El Niño deve afetar as áreas mais vulneráveis do Brasil, especialmente aquelas com menor capacidade de adaptação às mudanças climáticas, levando o governo a mobilizar equipes para monitorar a situação.", "direitos_humanos": "A Corte Internacional de Justiça declarou que Myanmar é responsável por genocídio contra o povo rohingya, em um julgamento histórico que reconhece genocídio pela primeira vez desde a fundação da corte há 80 anos. Além disso, Myanmar também foi condenada por genocídio em um julgamento do tribunal mais alto das Nações Unidas, reforçando a gravidade das violações dos direitos humanos no país. Em outro caso, quatro homens britânicos foram condenados por estupro e assédio sexual em um julgamento que lembra o caso de Dominique Pelicot em França. No Brasil, pais foram condenados a até 87 anos de prisão pelo assassinato e tortura de seu filho de dois anos, enquanto um pastor maranhense foi condenado a 100 anos de prisão por torturar e abusar sexualmente fiéis. Em nível global, um em cada quatro mulheres no mundo inteiro não têm poder para negar consentimento sexual em suas relações matrimoniais, especialmente em regiões como África ocidental e central, onde quase metade das mulheres (45%) não podem dizer não em seus casamentos."}, "resumo_do_dia": {"politica_nacional": [{"id": 274642, "titulo": "Transporte gratuito no fim de semana complementa escala 5x2, diz Lula", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/transporte-gratuito-no-fim-de-semana-complementa-escala-5x2-diz-lula", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-19T17:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva anunciou que o governo federal vai propor a gratuidade no transporte público aos fins de semana para complementar a escala 5x2. A medida visa assegurar que os trabalhadores possam aproveitar as duas folgas semanais. A proposta de gratuidade é complementar à redução gradual da carga horária semanal, que passará de 44 horas para 42 horas a partir de dezembro de 2023 e para 40 horas em dezembro de 2027.", "titulo_pt": "Gratuidade no transporte aos fins de semana complementa escala 5x2, diz Lula", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 274574, "titulo": "Senado encomenda novo retrato de Davi Alcolumbre por R$ 11,4 mil", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/11/senado-encomenda-novo-retrato-de-davi-alcolumbre-por-r-114-mil.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-19T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado Federal encomendou um novo retrato a óleo do presidente Davi Alcolumbre, pelo valor de R$ 11,4 mil, para ser exposto no Salão Nobre da Casa em Brasília.", "titulo_pt": "Senado encomenda novo retrato de Davi Alcolumbre por R$ 11,4
