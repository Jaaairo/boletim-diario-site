do às escolas.", "titulo_pt": "Aumento no desemprego relacionado às escolas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 121339, "titulo": "Médico dá dicas de segurança para mães e pais ensinarem crianças a se protegerem diante de situações perigosas", "url": "https://www.cnnbrasil.com.br/curiosidades/medico-da-dicas-de-seguranca-para-maes-e-pais-ensinarem-criancas-a-se-protegerem-diante-de-situacoes-perigosas/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-24T23:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O médico Caio Pádua oferece dicas para educar crianças sobre a identificação de situações perigosas e como agir nelas.", "titulo_pt": "Médico dá dicas de segurança para ensinar crianças a se protegerem em situações perigosas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 122400, "titulo": "Indonesia battles haze as wildfires rage across South Sumatra forests", "url": "https://www.aljazeera.com/gallery/2026/8/25/indonesia-battles-haze-as-wildfires-rage-across-south-sumatra-forests?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-25T09:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Indonésia implementa medidas de emergência e orações para combater as intensas queimadas e neblina tóxica nas florestas de Sul de Sumatra.", "titulo_pt": "Indonésia enfrenta fuligem e incêndios florestais em sul de Sumatra", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 122055, "titulo": "Clima: ar polar mantém frio no Sul e tempo seco castiga parte do país", "url": "https://www.metropoles.com/brasil/clima-ar-polar-mantem-frio-no-sul-e-tempo-seco-castiga-parte-do-pais", "fonte_id": "metropoles", "data_pub": "2026-08-25T08:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O frio persiste no Sul do país devido à influência de ar polar, enquanto o interior enfrenta calor extremo e sérias condições de seca, com a umidade do ar caindo a níveis críticos.", "titulo_pt": "Clima: ar polar mantém frio no Sul e seca intensa castiga o interior", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 122056, "titulo": "Tornado deixa ao menos 39 feridos na França e 300 casas afetadas", "url": "https://www.metropoles.com/mundo/tornado-deixa-ao-menos-39-feridos-na-franca-e-300-casas-afetadas", "fonte_id": "metropoles", "data_pub": "2026-08-25T08:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um tornado causou ferimentos em pelo menos 39 pessoas e afetou 300 casas em 10 aldeias na França. Cerca de 2.800 casas em 10 aldeias ficaram sem eletricidade devido às condições climáticas extremas.", "titulo_pt": "Tornado deixa ao menos 39 feridos e 2.800 casas sem eletricidade na França", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 122407, "titulo": "Global ocean temperatures hit record high as El Nino intensifies", "url": "https://www.aljazeera.com/news/2026/8/25/global-ocean-temperatures-hit-record-high-as-el-nino-intensifies?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-25T08:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As temperaturas das águas oceânicas atingiram níveis recordes devido ao intensificado fenômeno El Niño e ao aquecimento global, conforme alerta o Copernicus. Este fenômeno está causando uma 'estresse inédito' nas águas do mundo.", "titulo_pt": "Temperaturas oceânicas atingem recordes com intensificação do El niño e efeitos do aquecimento global", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 122602, "titulo": "S. Korea's first carbon-neutral music festival to open in Incheon", "url": "https://en.yna.co.kr/view/AEN20260825008800315", "fonte_id": "yonhap_news", "data_pub": "2026-08-25T06:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul está prestes a sediar seu primeiro festival musical com foco na neutralidade de carbono, que será realizado em Incheon. O evento visa reduzir a emissão de gases de efeito estufa.", "titulo_pt": "Primeiro festival musical carbono-neutro da Coreia do sul será realizado em Incheon", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 122382, "titulo": "Tornado rips through French village, injuring at least 31", "url": "http://www.euronews.com/video/2026/08/25/tornado-rips-through-french-village-injuring-at-least-31", "fonte_id": "euronews", "data_pub": "2026-08-25T06:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tornado passou pelo vilarejo francês de Pomas, causando danos em residências e telhados e ferindo pelo menos 31 pessoas. Fortes tempestades atingiram a região de Aude.", "titulo_pt": "Tornado atinge vilarejo francês, ferindo ao menos 31 pessoas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 122528, "titulo": "As toxic haze spreads, can Indonesia make land burners pay?", "url": "https://www.scmp.com/week-asia/health-environment/article/3365159/toxic-haze-spreads-can-indonesia-make-land-burners-pay?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-25T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Presidente de Indonesia, Prabowo Subianto, prometeu tomar medidas firmes contra grandes corporações responsáveis pelas grandes queimadas florestais e incêndios de terra, que estão espalhando neblina tóxica para a Malásia. Ele afirmou que punirá as empresas com base na lei se forem comprovadamente culpadas.", "titulo_pt": "Nuvem de fumaça tóxica se espalha, pode a indonésia fazer quem queima pagar?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 122228, "titulo": "‘Like smoking a cigarette’: Indonesia chokes on haze as blazes intensify amid super ‘El Niño’", "url": "https://www.theguardian.com/world/2026/aug/25/indonesia-wildfires-kalimantan-smoke-super-el-nino", "fonte_id": "guardian_world", "data_pub": "2026-08-25T04:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos em Kalimantan, na Indonésia, devastaram milhares de hectares de floresta, lançando fumaça sufocante que atingiu a Malásia e colocou Singapura em alerta. Suwadi, morador local, afirma que cada respiração é como fumar um cigarro.", "titulo_pt": "Como fumar um cigarro: indonésia sufoca com fumaça de incêndios em meio a super ‘El Niño’", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 122273, "titulo": "Hasta 35°C: DMC emite aviso meteorológico por altas temperaturas en dos regiones del país", "url": "https://www.latercera.com/nacional/noticia/hasta-35c-dmc-emite-aviso-meteorologico-por-altas-temperaturas-en-dos-regiones-del-pais/", "fonte_id": "la_tercera", "data_pub": "2026-08-25T04:08:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Meteorologia e Ciências do Clima (DMC) emitiu um aviso meteorológico para altas temperaturas que durará desde a tarde de 25 de agosto até a tarde de 27 de agosto. As altas temperaturas afetarão duas regiões do país.", "titulo_pt": "Até 35°C: DMC emite aviso meteorológico por altas temperaturas em duas regiões do país", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 121503, "titulo": "Sube la temperatura, pero sigue el frío: así estará el clima en el AMBA durante la última semana de agosto", "url": "https://www.lanacion.com.ar/clima/buenos-aires/ciudad-de-buenos-aires/sube-la-temperatura-pero-sigue-el-frio-asi-estara-el-clima-en-el-amba-durante-la-ultima-semana-de-nid24082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-24T23:22:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Haverá uma recuperação térmica, mas o inverno persistirá por mais um mês. Há probabilidade de chuvas no próximo dia 26 de agosto.", "titulo_pt": "Aumenta a temperatura, mas o frio continua: assim será o clima no AMBA na última semana de agosto", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 121195, "titulo": "Febre do Nilo Ocidental: SP registra dois casos da doença e SC tem morte", "url": "https://veja.abril.com.br/saude/febre-do-nilo-ocidental-sp-registra-dois-casos-da-doenca-e-sc-tem-morte/", "fonte_id": "veja", "data_pub": "2026-08-24T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A doença do Nilo Ocidental foi registrada em São Paulo com dois casos confirmados, e houve uma morte relacionada à doença no estado de Santa Catarina. A doença é transmitida por pernilongos e pode causar alterações neurológicas graves.", "titulo_pt": "Febre do Nilo Ocidental: SP registra dois casos e SC tem morte", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 120713, "titulo": "Greta Thunberg joins 10,000 climate marchers in Stockholm", "url": "http://www.euronews.com/video/2026/08/24/greta-thunberg-joins-10000-climate-marchers-in-stockholm", "fonte_id": "euronews", "data_pub": "2026-08-24T15:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 10.000 pessoas marcharam por Stockholm no domingo, exigindo ações mais robustas contra o clima, um mês antes da eleição geral na Suécia.", "titulo_pt": "Greta Thunberg participa da marcha climática com 10.000 pessoas em estocolmo", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 120526, "titulo": "Australia has just 12,000 sea lions left – and ‘carnage’ may await them as bird flu takes hold, scientists warn", "url": "https://www.theguardian.com/world/2026/aug/25/australia-has-just-12000-sea-lions-left-and-carnage-may-await-them-as-bird-flu-takes-hold-scientists-warn", "fonte_id": "guardian_world", "data_pub": "2026-08-24T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Australásia tem apenas 12.000 lobos-marinhos restantes, e cientistas advertiram que a gripe aviária H5N1 pode causar 'carnage' nessas populações após a confirmação do vírus em um lobo-marinheiro-nariz-longo na Austrália do Sul.", "titulo_pt": "Austrália tem apenas 12.000 lobos-marinhos e 'carnage' pode se aproximar com a gripe aviária", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 120832, "titulo": "4 arrested as Kenya investigates 18 elephant deaths in Amboseli", "url": "https://www.scmp.com/news/world/africa/article/3365098/4-arrested-kenya-investigates-18-elephant-deaths-amboseli?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-24T13:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quatro suspeitos foram detidos durante uma investigação sobre a morte de 18 elefantes no ecossistema de Amboseli, na Kenya. O ministério do Turismo e da Vida Selvagem informou que substâncias, incluindo químicos, foram apreendidos. Os suspeitos foram libertados em liberdade provisória, mas os resultados preliminares dos exames sugerem a possibilidade de envolvimento de uma substância tóxica.", "titulo_pt": "Quatro detidos na investigação sobre mortes de 18 elefantes em Amboseli, na Kenya", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 120234, "titulo": "Plástico que polui praias revela desafio da transição energética a partir da Amazônia", "url": "https://exame.com/esg/plastico-que-polui-praias-revela-desafio-da-transicao-energetica-a-partir-da-amazonia/", "fonte_id": "exame", "data_pub": "2026-08-24T12:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O lixo plástico está se acumulando nas praias da Amazônia. Ciência, inovação e políticas públicas buscam alternativas ao uso do petróleo.", "titulo_pt": "Plástico que polui praias amazônicas revela desafio da transição energética", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 120716, "titulo": "Tens of thousands evacuated as Hawk wildfire nears western US city of Reno", "url": "http://www.euronews.com/2026/08/24/tens-of-thousands-evacuated-as-hawk-wildfire-nears-western-us-city-of-reno", "fonte_id": "euronews", "data_pub": "2026-08-24T11:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dezenas de milhares de pessoas foram evacuadas à medida que o incêndio de Hawk se aproxima da cidade ocidental de Reno nos Estados Unidos. Não houve mortes relatadas, mas seis pessoas foram feridas, incluindo três resgatadores, e várias casas nas montanhas foram destruídas.", "titulo_pt": "Dezenas de milhares evacuados à medida que incêndio de Hawk se aproxima de Reno", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 122398, "titulo": "What would justice look like if there were no Rohingya left in Myanmar?", "url": "https://www.aljazeera.com/opinions/2026/8/25/what-would-justice-look-like-if-there-were-no-rohingya-left-in-myanmar?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-25T09:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde 2017, os Rohingya continuam sendo forçados a fugir do Myanmar devido à continuidade do genocídio.", "titulo_pt": "O que a justiça pareceria se os Rohingya não estivessem mais no Myanmar?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 122378, "titulo": "UN and Red Cross warn 'risks have intensified,' urge regulation of killer robots", "url": "http://www.euronews.com/2026/08/25/un-and-red-cross-warn-risks-have-intensified-urge-regulation-of-killer-robots", "fonte_id": "euronews", "data_pub": "2026-08-25T09:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ONU e a Cruz Vermelha alertam que os riscos associados aos sistemas de armas autônomos letais aumentaram e chamam para uma regulação dessas tecnologias. Estes sistemas são compreendidos como armas que selecionam alvos e aplicam força sem intervenção humana.", "titulo_pt": "ONU e cruz vermelha alertam sobre riscos intensificados de robôs assassinos e pedem regulamentação", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 122050, "titulo": "PF conclui investigação sobre grupo que torturava bebês e animais", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/pf-conclui-investigacao-sobre-grupo-que-torturava-bebes-e-animais", "fonte_id": "metropoles", "data_pub": "2026-08-25T09:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal concluiu uma investigação sobre um grupo que praticava tortura em bebês e animais. Foram analisados mais de 80 vídeos, além de perícias que permitiram identificar vítimas e individualizar 19 episódios.", "titulo_pt": "PF conclui investigação sobre grupo que torturava bebês e animais", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 122381, "titulo": "Indonesian Muslims brave choking smoke to pray for rain as country battles wildfires", "url": "http://www.euronews.com/2026/08/25/indonesian-muslims-brave-choking-smoke-to-pray-for-rain-as-country-battles-wildfires", "fonte_id": "euronews", "data_pub": "2026-08-25T08:27:00Z", "idioma": "en", "provavel_duplicata_de": 122302, "texto_pt": "Muslims em Indonesia estão rezando para pedir chuva enquanto serviços de emergência lutam contra incêndios alimentados por um padrão climático El Niño intensificado e uma estação seca prolongada, que geraram fumaça densa que se espalhou para Malásia e Brunei.", "titulo_pt": "Muçulmanos indonésios rezam para chuva enquanto enfrentam incêndios", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 122523, "titulo": "‘Children were in pieces’: memories still raw 6 months after Iran school strike", "url": "https://www.scmp.com/news/world/middle-east/article/3365173/children-were-pieces-memories-still-raw-6-months-after-iran-school-strike?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-25T07:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Masoumeh Zakeri, mãe de uma menina de nove anos falecida em um ataque a escola em Irã, relata constantemente revisi   const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
