obriu que 25,7% dos japoneses planejam usar os benefícios do corte de impostos em alimentos para economizar, enquanto 49,7% não pretendem alterar seus planos de consumo.", "titulo_pt": "25,7% Do Japão planejam usar corte de impostos em alimentos para economizar, diz pesquisa", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 244193, "titulo": "Copom deve manter Selic em 13,75% e interromper ciclo de cortes", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/copom-deve-manter-selic-em-1375-e-interromper-ciclo-de-cortes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-04T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Copom deve manter a taxa Selic em 13,75% e interromper o ciclo de reduções iniciado em março de 2026. A decisão ocorrerá nesta quarta-feira (4) de abril de 2026.", "titulo_pt": "Copom deve manter Selic em 13,75% e encerrar ciclo de cortes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 244194, "titulo": "TJ-SP garante justiça gratuita a desempregada; juiz citou até Pix de R$ 200", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/tj-sp-garante-justica-gratuita-a-desempregada-juiz-citou-ate-pix-de-r-200.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-04T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 1ª Turma Recursal Cível do TJ-SP garantiu justiça gratuita a uma desempregada que teve o benefício negado por realizar um Pix de R$ 200 entre contas próprias, contratar um advogado e ter renda de R$ 85 mil um ano antes de perder o trabalho. A ação contesta cláusulas consideradas abusivas em um contrato de consórcio.", "titulo_pt": "TJ-SP garante justiça gratuita a desempregada; juiz considerou Pix de R$ 200 e renda anterior", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 244196, "titulo": "Unilever cortará 1 bilhão de euros em custos após cisão da divisão de alimentos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/unilever-cortara-1-bilhao-de-euros-em-custos-apos-cisao-da-divisao-de-alimentos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-04T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Unilever planeja cortar 1 bilhão de euros em custos após a divisão de alimentos ser separada. A empresa busca mostrar aos investidores que a separação preparou o terreno para um crescimento mais acelerado.", "titulo_pt": "Unilever planeja cortar 1 bilhão de euros em custos após divisão de alimentos ser separada", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 244197, "titulo": "Fim da 6x1 pode acirrar negociações coletivas e limitar reajuste e condições de plano de saúde empresarial", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/fim-da-6x1-pode-acirrar-negociacoes-coletivas-e-limitar-reajuste-e-condicoes-de-plano-de-saude-empresarial.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-04T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O fim da escala 6x1 pode afetar as negociações coletivas no próximo ano, com menos chances de reajustes salariais e manutenção de benefícios como o plano de saúde empresarial. Isso pode aumentar a resistência dos empregadores a esses custos.", "titulo_pt": "Fim da 6x1 pode intensificar negociações coletivas e limitar reajustes e planos de saúde", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 244382, "titulo": "Decisão do Copom, Caged e emprego nos EUA: o que move os mercados após 6ª queda da Bolsa", "url": "https://exame.com/invest/mercados/decisao-do-copom-caged-e-emprego-nos-eua-o-que-move-os-mercados-apos-6a-queda-da-bolsa/", "fonte_id": "exame", "data_pub": "2026-11-04T05:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil enfrentará a quarta queda consecutiva da Bolsa, influenciada por decisões do Copom, dados do Caged e indicadores do emprego nos Estados Unidos. As ações de empresas como Axia, Prio, Vibra, Totvs, Smart Fit, Tenda, C&A, Pague Menos e Grupo Pão de Açúcar também serão avaliadas.", "titulo_pt": "Decisão do Copom, Caged e emprego nos EUA: o que move os mercados após 4ª queda da Bolsa", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 244825, "titulo": "Japanese stocks sink as U.S. midterm results hit tech shares", "url": "https://www.japantimes.co.jp/business/2026/11/04/markets/japan-stocks-sink/", "fonte_id": "japan_times", "data_pub": "2026-11-04T05:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações tecnológicas do Japão caíram significativamente, com o Nikkei 225 caindo até 4,8%. As ações de chip e relacionadas a IA foram as piores performantes, declinando mais de 13%.", "titulo_pt": "Ações japonesas caem com resultados dos EUA impactando setor tecnológico", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 244423, "titulo": "No apagar das luzes do PIS e da Cofins, ainda há espaço para discutir o holdback", "url": "https://www.jota.info/opiniao-e-analise/artigos/no-apagar-das-luzes-do-pis-e-da-cofins-ainda-ha-espaco-para-discutir-o-holdback", "fonte_id": "jota", "data_pub": "2026-11-04T05:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O encerramento das contribuições do PIS e da Cofins destaca a necessidade de identificar valores que foram indevidamente tributados e recuperá-los. A discussão sobre o holdback ainda está em aberto.", "titulo_pt": "No apagar das luzes do PIS e da Cofins, ainda há espaço para discutir o holdback", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 244984, "titulo": "Supa raises £21M in seed funding to transform UK residential block management", "url": "https://tech.eu/2026/11/04/supa-raises-ps21m-in-seed-funding-to-transform-uk-residential-block-management/", "fonte_id": "tech_eu", "data_pub": "2026-11-04T09:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de proptech britânica Supa levantou £21 milhões em financiamento de semente para expandir sua plataforma de gerenciamento imobiliário baseada em inteligência artificial. O financiamento inclui uma rodada de capital de risco co-ledida por 2150 e OpenOcean.", "titulo_pt": "Supa levanta r$ 178 milhões em financiamento de semente para transformar o gerenciamento de edifícios residenciais no reino unido", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 244985, "titulo": "Lazzaro One lands pre-seed funding to advance maritime intelligence technology", "url": "https://tech.eu/2026/11/04/lazzaro-one-lands-pre-seed-funding-to-advance-maritime-intelligence-technology/", "fonte_id": "tech_eu", "data_pub": "2026-11-04T09:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup alemã Lazzaro One recebeu uma rodada de financiamento de pré-série de seis dígitos do fundo de pré-série B#, administrado por IBB Ventures. Os recursos serão utilizados para avançar no desenvolvimento de tecnologia de inteligência marítima.", "titulo_pt": "Lazzaro One conquista financiamento de pré-série para avançar em tecnologia marítima", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 244329, "titulo": "Bayer anuncia parceria inédita com empresa brasileira de biotecnologia", "url": "https://www.cnnbrasil.com.br/agro/bayer-anuncia-parceria-inedita-com-empresa-brasileira-de-biotecnologia/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-04T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Bayer anunciou uma parceria inédita com a empresa brasileira de biotecnologia IdeeLab, de Piracicaba (SP), para desenvolver um produto voltado para o combate a doenças foliares da soja. O produto deve ser lançado no mercado em quatro anos.", "titulo_pt": "Bayer anuncia parceria inédita com empresa brasileira de biotecnologia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 244987, "titulo": "STATION F startups raise record €2B as campus unveils 2026 Future 40", "url": "https://tech.eu/2026/11/04/station-f-startups-raise-record-2b-as-campus-unveils-2026-future-40/", "fonte_id": "tech_eu", "data_pub": "2026-11-04T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A STATION F divulgou sua lista de 2026 Future 40, destacando startups promissoras emergentes de seu campus em Paris, enquanto empresas ao longo de sua ecossistema arrecadaram um recorde de €2 bilhões este ano. Seis empresas...", "titulo_pt": "STATION F revela Future 40 de 2026 com startups emergentes e arrecadação recorde de €2 bilhões", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 244988, "titulo": "Revolut confirms $115BN valuation, after completing secondary sale", "url": "https://tech.eu/2026/11/04/revolut-confirms-115bn-valuation-after-completing-secondary-sale/", "fonte_id": "tech_eu", "data_pub": "2026-11-04T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Revolut confirmou que sua avaliação agora é de $115 bilhões, após concluir uma venda secundária de ações, o que dobrou sua avaliação em aproximadamente dois anos.", "titulo_pt": "Revolut confirma avaliação de $115 bilhões após venda secundária de ações", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 244894, "titulo": "Innodisk advances AI data center push with eSSD, DDR5 products", "url": "https://www.digitimes.com/news/a20261104PD249/innodisk-data-center-ddr5-ssd-memory-module.html", "fonte_id": "digitimes", "data_pub": "2026-11-04T08:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Innodisk está aprofundando sua estratégia de centro de dados de inteligência artificial (IA) ao fornecer componentes-chave para infraestrutura de IA, incluindo SSDs empresariais (eSSDs) e módulos de memória para servidores de IA. A série de SSDs de centro de dados da empresa está em fase de amostragem completa, enquanto os produtos DDR5 e RDIMM serão lançados em etapas para suportar o treinamento de modelos intensivos em dados, inferência e computação de alto desempenho (HPC) para provedores de serviços de nuvem e novos operadores de nuvem (Neoclouds).", "titulo_pt": "Innodisk avança na estratégia de centro de dados de IA com essds e produtos DDR5", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 244895, "titulo": "Raydium faces 4Q26 slowdown after AI capacity fears fuel customer stockpiling", "url": "https://www.digitimes.com/news/a20261104PD244/driver-ic-raydium-demand-capacity-revenue.html", "fonte_id": "digitimes", "data_pub": "2026-11-04T08:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Raydium Semiconductor registrou receita consolidada de NT$6,57 bilhões (aproximadamente US$200 milhões) no terceiro trimestre de 2026, uma diminuição de 3,8% em comparação com o trimestre anterior, mas um aumento de 21,0% em comparação com o mesmo período do ano anterior. A margem bruta atingiu 26,4%, aumentando 0,7 ponto percentual em relação ao trimestre anterior, mas diminuindo 2,2 pontos percentuais em comparação com o ano anterior. O lucro operacional diminuiu 13,1% em comparação com o trimestre anterior e 11,7% em comparação com o mesmo período do ano anterior, para NT$310 milhões.", "titulo_pt": "Raydium enfrenta desaceleração no 4º trimestre de 2026 devido a medos de capacidade em AI e estoque de clientes", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 244896, "titulo": "Broadcom loses final appeal over Samsung chip supply deal", "url": "https://www.digitimes.com/news/a20261104VL221/samsung-broadcom-supreme-smartphone-2023.html", "fonte_id": "digitimes", "data_pub": "2026-11-04T08:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Corte Suprema da Coreia do Sul confirmou uma multa de 18,664 bilhões de wones (aproximadamente US$13,9 milhões) contra a Broadcom por pressionar a Samsung Eletrônicos a um acordo de fornecimento a longo prazo de componentes para smartphones, interrompendo o suprimento. O julgamento legal da empresa americana de chips chegou ao fim.", "titulo_pt": "Corte suprema confirma multa a broadcom por pressionar fornecimento à Samsung", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 244872, "titulo": "SK Inc. scraps SK ecoplant IPO plan, seeks full ownership", "url": "https://www.koreaherald.com/article/10926072", "fonte_id": "korea_herald", "data_pub": "2026-11-04T08:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SK Inc., empresa holding do grupo SK, decidiu realizar uma oferta de compra por 16,43 milhões de ações da SK ecoplant, com o objetivo de tornar a filial uma subsidiária integralmente controlada e encerrar seu plano de oferta pública inicial de ações. A oferta está programada para ocorrer de 25 de outubro a 24 de novembro.", "titulo_pt": "SK Inc. Cancela plano de IPO da SK ecoplant e busca total controle", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 244897, "titulo": "Onsemi to buy Ferric for US$600M to strengthen AI processor power delivery", "url": "https://www.digitimes.com/news/a20261104PR201/onsemi-processor-technology-revenue-growth.html", "fonte_id": "digitimes", "data_pub": "2026-11-04T08:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Onsemi concordou em adquirir a Ferric, Inc., desenvolvedora de tecnologia de regulador de tensão integrada (IVR), por US$600 milhões em dinheiro mais até US$175 milhões condicionados a metas de receita. A empresa também aumentou seu objetivo de receita para centrais de dados de IA em 2030 em US$500 milhões, para mais de US$3 bilhões.", "titulo_pt": "Onsemi adquire Ferric por US$600 milhões para fortalecer o poder de entrega de processadores de IA", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 244930, "titulo": "Hyundai Motor to showcase hydrogen technologies at local expo", "url": "https://en.yna.co.kr/view/AEN20261104010500320", "fonte_id": "yonhap_news", "data_pub": "2026-11-04T08:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Hyundai Motor Group anunciou que exibirá suas tecnologias de hidrogênio em uma exposição local. O evento ocorrerá em Seul, Coreia do Sul, no dia 4 de novembro.", "titulo_pt": "Hyundai Motor apresentará tecnologias de hidrogênio em exposição local", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 244880, "titulo": "Imported vehicle sales jump 29.3% in Oct. on strong EV demand", "url": "https://www.koreaherald.com/article/10925922", "fonte_id": "korea_herald", "data_pub": "2026-11-04T07:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas de veículos importados na Coreia do Sul aumentaram 29,3% em outubro em comparação com o mesmo mês do ano anterior, impulsionadas pela forte demanda por veículos elétricos (EVs). As novas inscrições aumentaram para 31.117 unidades em outubro, contra 24.064 no ano anterior, de acordo com a Associação de Importadores e Distribuidores de Veículos Automotores da Coreia (KAIDA).", "titulo_pt": "Vendas de veículos importados crescem 29,3% em outubro por conta do forte demanda por evs", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 244881, "titulo": "Lee calls for 'cybersecurity czar' amid wave of cyberattacks", "url": "https://www.koreaherald.com/article/10925917", "fonte_id": "korea_herald", "data_pub": "2026-11-04T07:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Lee Jae Myung pediu a criação de um poderoso coordenador nacional de cibersegurança em resposta a uma onda de ataques cibernéticos em empresas e instituições financeiras importantes. Ele argumentou que os sistemas de segurança existentes, que se concentram em inspeções e respostas após os ataques, mostraram limitações diante das técnicas de hacking cada vez mais sofisticadas.", "titulo_pt": "Lee sugere 'czar de cibersegurança' diante de onda de ataques cibernéticos", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 244349, "titulo": "Empresas de tecnologia devem captar mais capital para bancar IA", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/empresas-de-tecnologia-devem-captar-mais-capital-para-bancar-ia/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-04T07:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas de tecnologia devem captar mais capital para financiar a inteligência artificial devido à alta demanda por poder computacional. Líderes financeiros alertam para o risco de correção no mercado e aumento da volatilidade diante dessa situação.", "titulo_pt": "Empresas de tecnologia devem captar mais capital para bancar a IA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 244853, "titulo": "Tencent unveils Hy4 as open-weight AI race with DeepSeek, Z.ai, Alibaba heats up", "url": "https://www.scmp.com/tech/big-tech/article/3373227/tencent-unveils-hy4-open-weight-ai-race-deepseek-zai-alibaba-heats", "fonte_id": "scmp", "data_pub": "2026-11-04T07:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A gigante chinesa de tecnologia Tencent lançou seu mais recente modelo de inteligência artificial, o Hy4, buscando desafiar rivais abertos de ponta com capacidades agêntes aprimoradas projetadas para impulsionar seu ecossistema de software empresarial. O modelo de grande linguagem (LLM) introduziu compreensão visual pela primeira vez, capaz de processar imagens, analisar gráficos complexos e realizar raciocínio matemático visual.", "titulo_pt": "Tencent lança Hy4, seu mais recente modelo de IA, competindo com rivais abertos de ponta", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 244195, "titulo": "Motores de aviões aposentados viram alternativa para abastecer data centers em meio à corrida da IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/11/motores-de-avioes-aposentados-viram-alternativa-para-abastecer-data-centers-em-meio-a-corrida-da-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-04T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em vastas extensões do deserto de Sonora, no Arizona, milhares de aeronaves aposentadas ficam estacionadas em cemitérios de metal. Essas aeronaves estão sendo consideradas como alternativa para abastecer data centers, em meio à crescente demanda por energia para a corrida da inteligência artificial.", "titulo_pt": "Antigos aviões viram alternativa para abastecer data centers na corrida da IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 244954, "titulo": "Study calls for a rethink on how we manage the threats posed by hazardous species", "url": "https://phys.org/news/2026-11-rethink-threats-posed-hazardous-species.html", "fonte_id": "phys_org", "data_pub": "2026-11-04T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos indicam que a maneira como gerenciamos as ameaças representadas por espécies perigosas precisa ser reavaliada. Anualmente, mais de 700.000 pessoas morrem de doenças transmitidas por animais, picadas de cobras matam até 500.000 pessoas e a perda de cultivo devido a pragas custa aproximadamente 220 bilhões de dólares.", "titulo_pt": "Estudo sugere reavaliação no manejo de espécies perigosas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 244288, "titulo": "Anvisa aprova nova semaglutida em comprimido para o tratamento da obesidade", "url": "https://veja.abril.com.br/saude/anvisa-aprova-nova-semaglutida-em-comprimido-para-o-tratamento-da-obesidade/", "fonte_id": "veja", "data_pub": "2026-11-04T09:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anvisa aprovou o Wegovy pill 25 mg, um medicamento em forma de comprimido para o tratamento da obesidade, que possui o mesmo princípio ativo e indicação da versão injetável. É o primeiro agonista do GLP-1 em pílula a ser aprovado no Brasil.", "titulo_pt": "Anvisa aprova comprimido para tratamento da obesidade", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 244955, "titulo": "Six measures could save 1.6 million lives a year: WHO", "url": "https://phys.org/news/2026-11-million-year.html", "fonte_id": "phys_org", "data_pub": "2026-11-04T09:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Organização Mundial da Saúde (OMS) afirmou que a implementação de algumas medidas climáticas e de saúde poderia salvar quase 1,6 milhão de vidas por ano e gerar trilhões de dólares para a economia.", "titulo_pt": "Seis medidas poderiam salvar 1,6 milhão de vidas por ano, diz a OMS", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 244449, "titulo": "O que é o zeptoverso descoberto por cientistas, mundo 100 bilhões de vezes menor que um átomo", "url": "https://www.bbc.com/portuguese/articles/c6lye81l3ezro?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-04T09:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas da Universidade de Cambridge, no Reino Unido, descobriram um zeptoverso, um universo 100 bilhões de vezes menor que um átomo, através de um experimento no Grande Colisor de Hádrons.", "titulo_pt": "O que é o zeptoverso descoberto por cientistas, 100 bilhões de vezes menor que um átomo", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 244952, "titulo": "Opinion: I moved to Europe for free health care. I miss my patient portal", "url": "https://www.statnews.com/2026/11/04/moving-to-europe-free-health-care-differences/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-04T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autora, Mariska Breland, explica que, na Malta, ela paga pela saúde, mas de forma diferente. Ela sente saudades do portal do paciente que tinha em seu país de origem.", "titulo_pt": "Opinião: eu me mudei para a Europa por atendimento gratuito à saúde. Eu sinto saudade do meu portal do paciente", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 244246, "titulo": "DNA de ossos descobertos em caverna revela espécie bovina da Era do Gelo", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/dna-de-ossos-descobertos-em-caverna-revela-especie-bovina-da-era-do-gelo.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-04T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma espécie de bovino da Era do Gelo foi descoberta através do DNA de ossos encontrados em uma caverna. Este achado foi publicado em um artigo na revista Current Biology.", "titulo_pt": "DNA de ossos em caverna revela nova espécie de bovino da Era do Gelo", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 244928, "titulo": "S. Korea experiences 5th warmest Oct. this year", "url": "https://en.yna.co.kr/view/AEN20261104009800315", "fonte_id": "yonhap_news", "data_pub": "2026-11-04T08:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A temperatura média em Coreia do Sul em outubro deste ano atingiu 15,8°C, sendo o quinto outubro mais quente na história registrada.", "titulo_pt": "Coreia do sul registra outubro como o quinto mais quente deste ano", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 244934, "titulo": "S. Korea will not be affected by NASA's Swift telescope crashing back to earth: KASA", "url": "https://en.yna.co.kr/view/AEN20261104008500320", "fonte_id": "yonhap_news", "data_pub": "2026-11-04T07:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul não será afetada pelo telescópio NASA Swift que está caindo de volta à Terra. O telescópio está em desuso e sua reentrada na atmosfera terrestre está prevista para breve.", "titulo_pt": "Coreia do sul não será afetada pelo telescópio NASA Swift caindo de volta à terra", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 244989, "titulo": "APOD: 2026 November 4 – The Not-So-Hidden Galaxy, IC 342", "url": "https://science.nasa.gov/image-article/apod-2026-november-4-the-not-so-hidden-galaxy-ic-342/", "fonte_id": "nasa_news", "data_pub": "2026-11-04T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia da APOD em 4 de novembro de 2026 mostra a Galáxia IC 342, que não é tão oculta quanto se pensa. A galáxia é visível, mas sua posição na direção do centro da Via Láctea dificulta sua observação.", "titulo_pt": "A galáxia IC 342, não tão oculta", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 244990, "titulo": "Before the Dawn in America’s Heartland", "url": "https://science.nasa.gov/earth/earth-observatory/before-the-dawn-in-americas-heartland/", "fonte_id": "nasa_news", "data_pub": "2026-11-04T05:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astronautas tiveram uma visão panorâmica das luzes noturnas do Meio-Oeste americano sem quase nenhuma nuvem no céu.", "titulo_pt": "Antes da alvorada no interior dos estados unidos", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 244956, "titulo": "Testing Einstein's laws from the bottom of the Mediterranean Sea", "url": "https://phys.org/news/2026-11-einstein-laws-bottom-mediterranean-sea.html", "fonte_id": "phys_org", "data_pub": "2026-11-04T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da colaboração internacional KM3NeT analisaram 5.828 eventos candidatos a neutrinos atmosféricos detectados pelo telescópio de neutrinos KM3NeT/ORCA, localizado no fundo do Mar Mediterrâneo, para investigar a possibilidade de que as leis da física não sejam consistentes em todo o universo.", "titulo_pt": "Testando as leis de Einstein no fundo do mar mediterrâneo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 244957, "titulo": "Loophole listing keeps seafood qualifying as critically endangered on the menu", "url": "https://phys.org/news/2026-11-loophole-seafood-critically-endangered-menu.html", "fonte_id": "phys_org", "data_pub": "2026-11-04T04:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A espécie de peixe vermelho (Centroberyx affinis), uma das mais sobreexplotadas da Austrália, continuará sendo servida nos pratos de restaurantes após ser classificada como 'dependente de conservação'. Esta classificação é um buraco no sistema que permite que espécies criticamente ameaçadas continuem a ser comercializadas e vendidas como peixes de mesa.", "titulo_pt": "Loophole mantém peixe criticamente ameaçado na mesa do jantar", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 244958, "titulo": "Who killed British archaeologist James Starkey? Archival records shed light on an 88-year-old mystery", "url": "https://phys.org/news/2026-11-british-archaeologist-james-starkey-archival.html", "fonte_id": "phys_org", "data_pub": "2026-11-04T03:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O pesquisador descobriu evidências que podem esclarecer o assassinato do arqueólogo britânico James Starkey, ocorrido há 88 anos enquanto ele se deslocava da cidade antiga de Lachish para Jerusalém. A investigação revelou possíveis suspeitos e motivações para o crime.", "titulo_pt": "Quem matou o arqueólogo britânico James Starkey? Arquivos desvendam mistério de 88 anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 244959, "titulo": "Researchers develop sensors for continuous corn growth monitoring", "url": "https://phys.org/news/2026-11-sensors-corn-growth.html", "fonte_id": "phys_org", "data_pub": "2026-11-04T03:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores desenvolveram sensores para monitorar continuamente o crescimento de milho. Esses sensores podem fornecer dados que auxiliam na determinação do melhor momento para aplicar nitrogênio e na avaliação das respostas das plantas a diversos tratamentos.", "titulo_pt": "Pesquisadores desenvolvem sensores para monitorar o crescimento contínuo de milho", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 244960, "titulo": "How anxiety over climate change affects college students", "url": "https://phys.org/news/2026-11-anxiety-climate-affects-college-students.html", "fonte_id": "phys_org", "data_pub": "2026-11-04T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudantes universitários se preocupam com o clima, sentindo-se impotentes e frustrados com o futuro da Terra, segundo nova pesquisa interdisciplinar da Universidade do Utah. Recursos para ajudar os estudantes a lidarem com essa ansiedade são escassos.", "titulo_pt": "Como a ansiedade sobre o clima afeta os estudantes universitários", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 244961, "titulo": "One in 15 adults has experienced AI-generated image-based abuse, study finds", "url": "https://phys.org/news/2026-11-adults-experienced-ai-generated-image.html", "fonte_id": "phys_org", "data_pub": "2026-11-04T02:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo indicou que cerca de um em cada 15 adultos no mundo ocidental já sofreu abuso baseado em imagens geradas por inteligência artificial. O levantamento, que incluiu mais de 7.200 adultos dos Estados Unidos, Reino Unido e Austrália, revelou que 7% das pessoas entrevistadas tiveram ao menos uma experiência com abuso de imagem gerado por IA desde os 18 anos.", "titulo_pt": "Um em cada 15 adultos já sofreu abuso baseado em imagens geradas por IA, mostra estudo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 245036, "titulo": "Ry Herman on Finding Inspiration in Queer Fairytales", "url": "https://lithub.com/ry-herman-on-finding-inspiration-in-queer-fairytales/", "fonte_id": "lithub", "data_pub": "2026-11-04T09:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No verão de 2024, Ry Herman buscou por contos de fadas com subtextos LGBTQ+. Em um momento de novas ameaças às identidades LGBTQ+, Ry Herman encontrou conforto na evidência de que essas identidades sempre existiram, mesmo em contos de fadas.", "titulo_pt": "Ry Herman sobre a busca por inspiração em contos de fadas lgbtq+", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 245037, "titulo": "Please Don’t Put in the Novel That I Died: Olivia Manning’s (Lightly) Fictionalized Novels", "url": "https://lithub.com/please-dont-put-in-the-novel-that-i-died-olivia-mannings-lightly-fictionalized-novels/", "fonte_id": "lithub", "data_pub": "2026-11-04T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Olivia Manning, a britânica autora de novelas, morreu em 1980. Ela desejava fama durante sua vida, não após a morte. Manning teve ressentimentos, como não ter sido indicada para o Booker e não ter recebido uma crítica solo em jornais dominicais.", "titulo_pt": "Por favor, não coloque na Novel que eu morri: as novelas levemente ficcionais de olivia Manning", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 245038, "titulo": "Building a Community of Imposters: What It Means To Be a Literary Translator Today", "url": "https://lithub.com/building-a-community-of-imposters-what-it-means-to-be-a-literary-translator-today/", "fonte_id": "lithub", "data_pub": "2026-11-04T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Miranda recebeu uma nota inesperada, um termo em espanhol, 'de la nada', que não pode ser traduzido literalmente como 'out of the blue'.", "titulo_pt": "Construindo uma comunidade de implantados: o que significa ser um tradutor literário hoje", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 244543, "titulo": "‘Not been this excited in a long time’: US expats ride the blue wave at Australian midterms watch parties", "url": "https://www.theguardian.com/australia-news/2026/nov/04/not-been-this-excited-in-a-long-time-us-expats-ride-the-blue-wave-at-australian-midterms-watch-parties", "fonte_id": "guardian_world", "data_pub": "2026-11-04T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de cem expatriados americanos e entusiastas das eleições se reuniram em um pub de Sydney para assistir aos resultados das eleições intermunicipais dos EUA. A atmosfera mudou rapidamente de ansiedade para celebração com a chegada das notícias de vitória democrata.", "titulo_pt": "Não estamos tão animados há muito tempo: expatriados americanos comemoram eleições intermunicipais na austrália", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 245039, "titulo": "A Syllabus for Attention: Megan Mayhew Bergman on John Elder’s Reading Life", "url": "https://lithub.com/a-syllabus-for-attention-megan-mayhew-bergman-on-john-elders-reading-life/", "fonte_id": "lithub", "data_pub": "2026-11-04T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2001, quando a autora chegou ao Convenio de Pão Escritor em Vermont, os participantes deixaram seus telefones sem sinal. Não havia conexão. Isso proporcionou uma imersão quase física sem distrações.", "titulo_pt": "Um Syllabus para a atenção: megan Mayhew Bergman sobre a vida de leitura de John Elder", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 244239, "titulo": "Rodrigo Faro fala sobre retorno à Globo e admite que 'pirou' por audiência: 'Era vaidade'", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/11/rodrigo-faro-fala-sobre-retorno-a-globo-e-admite-que-pirou-por-audiencia-era-vaidade.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-04T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Rodrigo Faro retornou à Globo como apresentador do reality Herança em Jogo, do Globoplay. Ele admite que o trabalho anterior o consumia mais, mas acredita que este novo projeto se encaixa melhor em sua fase atual.", "titulo_pt": "Rodrigo Faro retorna à Globo e reconhece que trabalho anterior era mais intenso", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 244529, "titulo": "Libertad reclinada", "url": "https://www.lanacion.com.ar/cultura/libertad-reclinada-nid04112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-04T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute um tema relacionado à liberdade, embora sem detalhes específicos sobre o conteúdo. O título 'Libertad reclinada' foi traduzido para 'Liberdade reclinada'.", "titulo_pt": "Liberdade reclinada", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 244531, "titulo": "Cómo será el Festival de Cine de Mar del Plata según sus directores: entradas más baratas, menos cantidad de títulos, films “de calidad” y el desafío de llenar las salas", "url": "https://www.lanacion.com.ar/espectaculos/cine/como-sera-el-festival-de-cine-de-mar-del-plata-segun-sus-directores-entradas-mas-baratas-menos-nid04112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-04T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os diretores do Festival de Cine de Mar del Plata, Gabriel Lerman e Jorge Stamadianos, anunciaram que a próxima edição terá mais documentários e filmes de qualidade, além de sessões com ingressos esgo nsporte em julho de 2023 após um evento musical no Mineirão. Ela foi condenada a receber R$300 mil de indenização pela justiça.", "titulo_pt": "MG: justiça condena aplicativo a indenizar passageira violada em R$300 mil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 243652, "titulo": "Homem que matou namorada e arrastou corpo com caminhão se entrega à PCGO", "url": "https://www.metropoles.com/distrito-federal/motorista-que-atropelou-e-arrastou-namorada-com-caminhao-se-entrega-a-pcgo", "fonte_id": "metropoles", "data_pub": "2026-11-03T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Larissa Pereira Macêdo, de 32 anos, foi morta após ser atropelada e arrastada por um caminhão em Aparecida de Goiânia, Goiás. O suspeito do crime se entregou à Polícia Civil de Goiás (PCGO).", "titulo_pt": "Homem que matou namorada e arrastou corpo com caminhão se entrega à PCGO", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 243790, "titulo": "Dirigentes de distintos espacios atribuyeron el ataque contra las mujeres trans a los “discursos de odio” y apuntaron contra Milei", "url": "https://www.lanacion.com.ar/politica/referentes-de-la-politica-repudiaron-el-ataque-a-las-mujeres-trans-en-los-bosques-de-palermo-lo-nid03112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-03T21:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Dirigentes de diferentes espaços atribuíram o ataque contra as mulheres trans a discursos de ódio e citaram o discurso do Presidente contra a comunidade LGBTIQ+ no Foro de Davos, chamando para não naturalizar o ódio.", "titulo_pt": "Dirigentes atribuem ataque às mulheres trans a discursos de ódio e lembram discurso do presidente contra a lgbtiq+", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 243655, "titulo": "Secretaria da Mulher do DF passa a funcionar no Centrad, em Taguatinga", "url": "https://www.metropoles.com/distrito-federal/secretaria-da-mulher-do-df-passa-a-funcionar-no-centrad-em-taguatinga", "fonte_id": "metropoles", "data_pub": "2026-11-03T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Secretaria da Mulher do Distrito Federal passou a funcionar no Centrad, localizado em Taguatinga. Antes, a pasta tinha duas sedes no Plano Piloto.", "titulo_pt": "Secretaria da Mulher do DF passa a funcionar no Centrad, em Taguatinga", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 243841, "titulo": "Discussão de trânsito pode ter motivado morte de turista na Via Dutra", "url": "https://veja.abril.com.br/brasil/discussao-de-transito-pode-ter-motivado-morte-de-turista-na-via-dutra/", "fonte_id": "veja", "data_pub": "2026-11-03T20:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um jovem de 28 anos, que estava viajando de São Paulo para o Rio de Janeiro com dois amigos, foi baleado durante uma discussão no trânsito.", "titulo_pt": "Discussão no trânsito pode ter causado morte de turista na Via Dutra", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 244399, "titulo": "Clima: calorão e umidade favorecem formação de temporais nesta 4ª", "url": "https://www.metropoles.com/brasil/clima-calorao-e-umidade-favorecem-formacao-de-temporais-nesta-4a", "fonte_id": "metropoles", "data_pub": "2026-11-04T09:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Inmet prevê chuva intensa, ventos fortes e possibilidade de granizo no Sul do Brasil. O Centro-Oeste e o Sudeste também têm risco de tempestades.", "titulo_pt": "Clima: calorão e umidade favorecem formação de temporais nesta quarta-feira", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 244269, "titulo": "Peru declara emergência em mais de 70% de seus municípios devido às chuvas do El Niño", "url": "https://www.cartacapital.com.br/mundo/peru-declara-emergencia-em-mais-de-70-de-seus-municipios-devido-as-chuvas-do-el-nino/", "fonte_id": "cartacapital", "data_pub": "2026-11-04T00:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Peru declarou emergência em mais de 70% de seus municípios devido às chuvas associadas ao fenômeno El Niño, afetando 1.380 dos 1.800 distritos do país.", "titulo_pt": "Peru declara emergência em mais de 70% de seus municípios devido às chuvas do El Niño", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 243287, "titulo": "Flu epidemic might end this week, CDC reports", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/04/2003867133", "fonte_id": "taipei_times", "data_pub": "2026-11-04T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com o CDC, uma epidemia de gripe no Taiwan pode ter chegado ao fim esta semana.", "titulo_pt": "Epidemia de gripe pode terminar esta semana, relata CDC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 244374, "titulo": "O plano brasileiro para enfrentar a crise climática", "url": "https://braziljournal.com/o-plano-brasileiro-para-enfrentar-a-crise-climatica", "fonte_id": "brazil_journal", "data_pub": "2026-11-03T23:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil apresentou dois roteiros internacionais para a COP31, uma conferência do clima da ONU que ocorrerá na Turquia, visando acelerar a implementação de compromissos climáticos. Os roteiros abordam a transição para longe dos combustíveis fósseis e a interrupção e reversão do desmatamento até 2030.", "titulo_pt": "Plano brasileiro para enfrentar a crise climática", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 243572, "titulo": "Uso de óleos vegetais para biocombustível sobe 122% desde 2020", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/vaivem/2026/11/uso-de-oleos-vegetais-para-biocombustivel-sobe-122-desde-2020.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-03T20:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A utilização de óleos vegetais como biocombustível aumentou 122% desde 2020, atingindo 34,3 milhões de toneladas em Tailândia, Brasil e Estados Unidos. Incluindo a União Europeia, a demanda total chega a 40,3 milhões de toneladas.", "titulo_pt": "Uso de óleos vegetais para biocombustível sobe 122% desde 2020", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 244389, "titulo": "Holanda investe US$ 500 milhões no Fundo Florestas Tropicais", "url": "https://exame.com/esferabrasil/holanda-investe-us-500-milhoes-no-fundo-florestas-tropicais/", "fonte_id": "exame", "data_pub": "2026-11-03T20:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Fundo Florestas Tropicais, lançado na COP 30, combina recursos públicos e privados para proteger mais de 1 bilhão de hectares de florestas com base em metas verificadas.", "titulo_pt": "Holanda investe r$ 1 bilhão no Fundo Florestas Tropicais", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 242783, "titulo": "Plantio da soja ganha ritmo, mas irregularidade das chuvas preocupa", "url": "https://www.cnnbrasil.com.br/agro/plantio-da-soja-ganha-ritmo-mas-irregularidade-das-chuvas-preocupa/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-03T17:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O plantio da soja na safra 2026/27 está avançado, superando o ritmo observado nas últimas cinco temporadas. A previsão de chuvas para o início de novembro será crucial para o desenvolvimento das lavouras e a janela para a segunda safra.", "titulo_pt": "Plantio da soja avança, mas previsão de chuvas no início de novembro é crucial", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 242753, "titulo": "Ciclone coloca cidades do Paraná sob alerta para tempestades", "url": "https://www.metropoles.com/brasil/ciclone-coloca-cidades-do-parana-sob-alerta-para-tempestades", "fonte_id": "metropoles", "data_pub": "2026-11-03T17:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Instituto Nacional de Meteorologia (Inmet) emitiu um alerta vermelho para a quarta-feira, 4 de novembro, para as cidades do Paraná devido a uma tempestade com potencialmente fortes ventos.", "titulo_pt": "Ciclone coloca cidades do Paraná sob alerta vermelho para tempestades", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 242854, "titulo": "Brasil lança plano de ação global para transição energética", "url": "https://www.dw.com/pt-br/brasil-lança-plano-de-ação-global-para-transição-energética/a-79845717?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-03T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil encerrou sua presidência no processo climático da ONU anunciando um plano de ação global para a transição energética, focado em conter o desmatamento e acelerar a descontinuação dos combustíveis fósseis, baseado em acordos já existentes.", "titulo_pt": "Brasil lança plano de ação global para transição energética", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 242798, "titulo": "Como saber se uma empresa cuida das pessoas e do meio ambiente", "url": "https://www.cnnbrasil.com.br/comportamento/casa-e-decoracao/como-saber-se-uma-empresa-cuida-das-pessoas-e-do-meio-ambiente/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-03T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Relatórios ASG, selos auditados e rankings independentes são ferramentas que ajudam a verificar a sustentabilidade ambiental e social de uma empresa através de indicadores verificáveis.", "titulo_pt": "Como saber se uma empresa cuida das pessoas e do meio ambiente", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 243463, "titulo": "UK climate minister Katie White: COP31 must respond to ‘really scary’ science", "url": "https://www.carbonbrief.org/uk-climate-minister-katie-white-cop31-must-respond-to-really-scary-science", "fonte_id": "carbon_brief", "data_pub": "2026-11-03T16:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ministra do Clima do Reino Unido, Katie White, afirmou que as próximas negociações climáticas COP31 em Antalya, Turquia, devem responder às últimas pesquisas sobre o aquecimento global, que são consideradas realmente assustadoras.", "titulo_pt": "Ministra do clima do reino unido: COP31 deve responder a ciência ‘realmente assustadora’ sobre o aquecimento global", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 242888, "titulo": "COP30 apresenta dois mapas do caminho para acelerar transição energética e combate ao desmatamento", "url": "https://www.jota.info/coberturas-especiais/matriz/cop30-apresenta-dois-mapas-do-caminho-para-acelerar-transicao-energetica-e-combate-ao-desmatamento", "fonte_id": "jota", "data_pub": "2026-11-03T16:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O COP30 apresentou dois mapas que propõem ações coordenadas para desacelerar a utilização de combustíveis fósseis no setor energético e para reverter a perda florestal até 2030.", "titulo_pt": "COP30 apresenta dois mapas para acelerar a transição energética e combater o desmatamento", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 243187, "titulo": "Flash floods devastate US Southwest, sweeping away homes and cars", "url": "https://www.euronews.com/video/2026/11/03/flash-floods-devastate-us-southwest-sweeping-away-homes-and-cars", "fonte_id": "euronews", "data_pub": "2026-11-03T14:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Inundações flash devastam o Sudoeste dos Estados Unidos, destruindo casas e deixando moradores isolados, obrigando centenas a evacuarem.", "titulo_pt": "Inundações em massa devastam sudoeste dos EUA, destruindo casas e forçando evacuações", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 243464, "titulo": "State of the climate: 2026 likely to tie with 2024 as the warmest year on record", "url": "https://www.carbonbrief.org/state-of-the-climate-2026-likely-to-tie-with-2024-as-the-warmest-year-on-record", "fonte_id": "carbon_brief", "data_pub": "2026-11-03T13:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Com mais de três quartos do ano passados, é quase certo que 2026 será o ano mais quente ou o segundo mais quente na história. É altamente provável que 2026 se iguale ao ano de 2024 como o mais quente registrado.", "titulo_pt": "Estado do clima: 2026 provavelmente igualará 2024 como o ano mais quente da história", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 242980, "titulo": "Brazil publishes first global ‘roadmap’ for phasing out fossil fuels", "url": "https://www.theguardian.com/environment/2026/nov/03/brazil-first-global-roadmap-phasing-out-fossil-fuels", "fonte_id": "guardian_world", "data_pub": "2026-11-03T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo do Brasil lançou o primeiro roadmap global para a faseamento dos combustíveis fósseis, mostrando que os países podem iniciar a redução da dependência desses recursos sem aguardar novas tecnologias ou mudanças econômicas. O país, anfitrião da COP26 do ano anterior, apresentou o plano como parte de um esforço para passar do negociar para o implementar na conferência climática global.", "titulo_pt": "Brasil lança primeiro roadmap global para fasear combustíveis fósseis", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 242745, "titulo": "Entenda os mapas do caminho para fósseis e desmatamento apresentados pelo Brasil", "url": "https://exame.com/esg/entenda-os-mapas-do-caminho-para-fosseis-e-desmatamento-apresentados-pelo-brasil/", "fonte_id": "exame", "data_pub": "2026-11-03T12:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil apresentou mapas para atingir os compromissos de fósseis e desmatamento durante sua presidência da COP30. Esses documentos serão apresentados na COP31 na Turquia.", "titulo_pt": "Entenda os mapas do caminho para fósseis e desmatamento apresentados pelo Brasil", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 244844, "titulo": "Abandoned by parents after cancer diagnosis, Chinese woman dies after solo battle", "url": "https://www.scmp.com/news/people-culture/china-personalities/article/3373208/abandoned-parents-after-cancer-diagnosis-chinese-woman-dies-after-solo-battle", "fonte_id": "scmp", "data_pub": "2026-11-04T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma influenciadora chinesa conhecida por sua luta contra o câncer ósseo, após seus pais a abandonarem após o diagnóstico, faleceu em um hospital em Shanghai. O anúncio foi feito em uma postagem de obituário em suas redes sociais, onde ela escreveu sua própria homenagem.", "titulo_pt": "Abandonada pelos pais após diagnóstico de câncer, influenciadora chinesa morre em batalha sozinha", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 244653, "titulo": "Reforma al INDH: el Leviatán sin contrapesos", "url": "https://www.ciperchile.cl/2026/11/04/reforma-al-indh-el-leviatan-sin-contrapesos/?utm_source=rss&utm_medium=rss&utm_campaign=reforma-al-indh-el-leviatan-sin-contrapesos", "fonte_id": "ciper_chile", "data_pub": "2026-11-04T07:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute uma reforma proposta para o INDH, que é comparado ao Leviatã sem contrapesos. O INDH, na abordagem apresentada, seria dotado de poderes considerados excessivos sem equilíbrios adequados.", "titulo_pt": "Reforma ao INDH: o leviatã sem contrapesos", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 244549, "titulo": "UK apologises to Ukrainian child refugees who were told to study Russian", "url": "https://www.theguardian.com/education/2026/nov/04/ukrainian-gcse-uk-apologises-child-refugees", "fonte_id": "guardian_world", "data_pub": "2026-11-04T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Grã-Bretanha se retratou com crianças ucranianas refugiadas que foram incentivadas a estudar russo em escolas britânicas, em vez de ucraniano. O Ministério da Educação anunciou a criação de um novo curso de certificado de estudos gerais (GCSE) em ucraniano.", "titulo_pt": "Reino unido se retrata com refugiados ucranianos que estudaram russo", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 243279, "titulo": "Bureau outlines proposed changes to repression laws", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/04/2003867125", "fonte_id": "taipei_times", "data_pub": "2026-11-04T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O bureau apresentou propostas para alterar as leis de repressão. As mudanças sugeridas visam modificar o sistema legal existente.", "titulo_pt": "Bureau apresenta propostas para alterar leis de repressão", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 243844, "titulo": "Gilmar Mendes manda intimar órgãos para informarem sobre violência contra indígenas após as eleições", "url": "https://www.jota.info/stf/do-supremo/gilmar-mendes-manda-intimar-orgaos-para-informarem-sobre-violencia-contra-indigenas-apos-as-eleicoes", "fonte_id": "jota", "data_pub": "2026-11-03T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes ordenou que órgãos informassem sobre casos de violência contra indígenas após as eleições. Uma comitiva do governo Lula esteve na região no fim de semana.", "titulo_pt": "Gilmar Mendes intimará órgãos sobre violência contra indígenas após as eleições", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 243836, "titulo": "Gilmar cobra informações sobre relat Activists", "url": "https://thediplomat.com/2026/11/with-copyright-complaints-even-imposters-can-silence-karakalpak-activists/", "fonte_id": "the_diplomat", "data_pub": "2026-11-03T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um indivíduo que se passava por um editor do The Diplomat apresentou uma queixa de direitos autorais à Meta contra um ativista de Karakalpak. Mesmo sendo um impostor, a publicação foi removida.", "titulo_pt": "Com queixas de direitos autorais, inclusive falsos editores podem silenciar ativistas de Karakalpak", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 243304, "titulo": "Bosnian Serb Army Ex-Members Jailed for 83 Years for Sokolac Crimes", "url": "https://balkaninsight.com/2026/11/03/bosnian-serb-army-ex-members-jailed-for-83-years-for-sokolac-crimes/btj/btj-bosnia-and-herzegovina/", "fonte_id": "balkan_insight", "data_pub": "2026-11-03T11:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Seis ex-membros do Exército Sérvio da Bósnia foram condenados a uma pena total de 83 anos de prisão por assassinatos de 44 homens e deportação de mulheres e crianças de uma vila em Sokolac em 1992.", "titulo_pt": "Ex-membros do exército sérvio da bósnia condenados a 83 anos de prisão por Crimes em Sokolac", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 243448, "titulo": "UNICEF statement on reports of children killed and injured in airstrikes in Myanmar", "url": "https://www.unicef.org/press-releases/unicef-statement-reports-children-killed-and-injured-airstrikes-myanmar-0", "fonte_id": "unicef", "data_pub": "2026-11-03T10:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A UNICEF emitiu uma declaração sobre relatos de crianças mortas e feridas em ataques aéreos em Myanmar. A organização expressou preocupação com a situação e destacou a vulnerabilidade das crianças nesses incidentes.", "titulo_pt": "Deklaração da UNICEF sobre relatos de crianças mortas e feridas em ataques aéreos em Myanmar", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 243449, "titulo": "Increased attacks disrupt children's education as air-raid alarms affect nearly two-thirds of school days in Ukraine", "url": "https://www.unicef.org/press-releases/increased-attacks-disrupt-childrens-education-air-raid-alarms-affect-nearly-two", "fonte_id": "unicef", "data_pub": "2026-11-03T10:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aumento de ataques está interrompendo a educação de crianças, com alarmes de artilharia atingindo quase dois terços dos dias letivos nas escolas ucranianas.", "titulo_pt": "Aumento de ataques interrompe educação de crianças em quase dois terços dos dias letivos nas escolas ucranianas devido a alarmes de artilharia", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 242394, "titulo": "2 Pakistani police officers guarding polio workers killed by suspected militants", "url": "https://www.scmp.com/news/asia/south-asia/article/3373114/2-pakistani-police-officers-guarding-polio-workers-killed-suspected-militants", "fonte_id": "scmp", "data_pub": "2026-11-03T08:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois policiais paquistaneses foram mortos a tiros por suspeitos de militantes enquanto protegiam trabalhadores contra a poliomielite durante uma campanha de vacinação porta-a-porta em Mohmand, uma região do distrito de Khyber Pakhtunkhwa que fronteira com o Afeganistão. Um terceiro policial ficou ferido.", "titulo_pt": "Dois policiais protegendo trabalhadores de vacinação contra a poliomielite são mortos a tiros por suspeitos de militantes no paquistão", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 242608, "titulo": "Albanian Journalists Complain of Police Violence, Abuse During Anti-Govt Protests", "url": "https://balkaninsight.com/2026/11/03/albanian-journalists-complain-of-police-violence-abuse-during-anti-govt-protests/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-03T06:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nos últimos dois semanas, jornalistas e vigilantes da mídia relataram dezenas de casos de abuso verbal e violência física contra profissionais de imprensa cobrindo protestos anti-governamentais em Albania. Na maioria das vezes, os policiais eram os agressores.", "titulo_pt": "Jornalistas albaneses relatam abuso policial durante protestos anti-governo", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 242454, "titulo": "S. Korea to hold separate memorial for Sado mine forced labor victims for 3rd straight year", "url": "https://en.yna.co.kr/view/AEN20261103009600315", "fonte_id": "yonhap_news", "data_pub": "2026-11-03T06:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul realizará uma cerimônia de memorial separada para vítimas de trabalho forçado no mineiro de Sado pela terceira vez consecutiva.", "titulo_pt": "Coreia do sul realizará memorial separado para vítimas do trabalho forçado no mineiro de Sado pela terceira vez consecutiva", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 242319, "titulo": "‘Going hungry’: Garment workers in Bangladesh say wages barely cover needs", "url": "https://www.aljazeera.com/news/2026/11/3/going-hungry-garment-workers-in-bangladesh-say-wages-barely-cover-needs?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-03T05:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores da indústria de vestuário em Bangladesh, um dos principais exportadores mundiais de vestuário, realizaram manifestações para pedir aumentos salariais mais significativos. Eles afirmam que os salários actuais são insuficientes para atender às suas necessidades básicas.", "titulo_pt": "Faminto: trabalhadores da indústria de vestuário em Bangladesh exigem salários melhores", const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);

function toggleDrill(id) {
  const el = document.getElementById(id);

  const aberta = el.classList.toggle("aberta");

}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;

    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">

        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}

  return `<div>

    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>

    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

function filtrarSecao(topico) {

  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {

function proximaAtualizacao() {

  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

};

  const list = Object.values(flags);

  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');

  if (!FLAG_ON) return '';

  const su = esc(url).replace(/"/g, '&quot;');

  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
