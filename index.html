financiamento de US$ 500 bilhões a ser preenchido. A indústria terá que enfrentar a realidade de que, mesmo com menos dependência das placas de GPU da Nvidia, ainda há uma forte dependência do orçamento da empresa.", "titulo_pt": "O boom da IA sobreviverá sem Jensen Huang, mas há um buraco de us$ 500 bilhões a ser preenchido", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 261406, "titulo": "Microsoft races to restore services after global outage", "url": "https://www.ft.com/content/025b2769-bca8-4a74-b9f5-5d7ad7da32c7?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-13T09:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microsoft está correndo para restaurar seus serviços após uma interrupção global que afetou Outlook e Teams. A empresa afirma que o problema não foi causado por atividade cibernética maliciosa.", "titulo_pt": "Microsoft corrige serviços após interrupção global", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 261498, "titulo": "Personal data of startup support program participants leaked in cyber attack", "url": "https://en.yna.co.kr/view/AEN20261113008500315", "fonte_id": "yonhap_news", "data_pub": "2026-11-13T09:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ataque cibernético resultou na exposição de informações pessoais de participantes de um programa de apoio a startups governamental em Seul, Coreia do Sul, em 13 de novembro.", "titulo_pt": "Dados pessoais de participantes de programa de apoio a startups expostos em ataque cibernético", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 261555, "titulo": "CI Guarantee marks 30th anniversary with AI-driven innovation push", "url": "https://www.koreaherald.com/article/10936573", "fonte_id": "korea_herald", "data_pub": "2026-11-13T07:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A CI Guarantee, principal provedora de garantias do setor construtivo da Coreia do Sul, comemorou seu 30º aniversário anunciar planos para acelerar inovações baseadas em IA e expandir serviços financeiros digitais. O evento foi realizado em 250 convidados no Westin Josun Seoul, incluindo representantes do governo e do setor.", "titulo_pt": "CI garantia comemora 30 anos com impulso à inovação baseada em IA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 260853, "titulo": "Setor financeiro precisa de cientistas para modelar risco climático, diz pesquisador turco", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/11/setor-financeiro-precisa-de-cientistas-para-modelar-risco-climatico-diz-pesquisador-turco.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bancos, gestoras, seguradoras e investidores precisam recorrer a cientistas do clima para reformular seus modelos de avaliação de riscos climáticos, segundo recomendação do especialista Levent Kurnaz, feita durante uma apresentação para executivos do setor de seguros na COP31 em Antália, Turquia.", "titulo_pt": "Setor financeiro precisa de cientistas para modelar risco climático, diz especialista", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 261456, "titulo": "Jensen Huang’s abrupt exit stuns Nvidia’s China staff, clouding the outlook in a key market", "url": "https://www.scmp.com/tech/big-tech/article/3374316/jensen-huangs-abrupt-exit-stuns-nvidias-china-staff-clouding-outlook-key-market", "fonte_id": "scmp", "data_pub": "2026-11-13T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A renúncia repentina de Jensen Huang surpreendeu alguns funcionários da Nvidia na China e levantou dúvidas sobre o futuro das operações da empresa norte-americana em um mercado que seu co-fundador havia cultivado por anos, segundo fontes da empresa. Um funcionário disse que não entende por que Huang foi solicitado a renunciar, afirmando que ninguém beneficia com sua saída.", "titulo_pt": "Saída repentina de jensen Huang surpreende funcionários chineses da Nvidia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 261557, "titulo": "Google clears key map security checks in Korea, taps Tmap as local partner", "url": "https://www.koreaherald.com/article/10936561", "fonte_id": "korea_herald", "data_pub": "2026-11-13T06:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul confirmou que a Google implementou as medidas de segurança necessárias para exportar dados de mapa detalhados da Coreia do Sul, levando a empresa tecnológica americana um passo mais perto de oferecer serviços de navegação completos após quase 20 anos de obstáculos regulatórios. Uma comissão interagência verificou a conformidade da Google com as condições de segurança associadas à sua aprovação para exportar dados de mapa em escala 1:5.000.", "titulo_pt": "Google atende verificações de segurança e tem parceiro local na Tmap para oferecer serviços de navegação", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 261430, "titulo": "China’s access to Nvidia chips in doubt as curbs gain traction in U.S. Congress", "url": "https://www.japantimes.co.jp/news/2026/11/13/world/china-access-nvidia-chips-doubt/", "fonte_id": "japan_times", "data_pub": "2026-11-13T06:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As exportações de chips avançados da Nvidia para a China estão em dúvida devido a restrições propostas pelo Congresso dos Estados Unidos. A empresa é crucial para o desenvolvimento de modelos de inteligência artificial nos Estados Unidos, o que intensifica a corrida para construir sistemas de IA superiores em relação à China.", "titulo_pt": "Acesso da china aos chips Nvidia em dúvida com curtos trâmites no congresso dos EUA", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 260980, "titulo": "Instabilidade da Microsoft afeta inteligência e polícia da Austrália", "url": "https://www.cnnbrasil.com.br/economia/money/tecnologia/instabilidade-da-microsoft-afeta-inteligencia-e-policia-da-australia/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-13T06:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo da Austrália acionou um acordo de prioridade para a recuperação dos serviços da Microsoft devido a uma instabilidade. A empresa não acredita que a interrupção tenha sido causada por um ataque cibernético.", "titulo_pt": "Instabilidade da Microsoft afeta inteligência e polícia da Austrália", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 260918, "titulo": "Microsoft corre para restabelecer serviços após falha global afetar Outlook, Teams e Copilot", "url": "https://exame.com/tecnologia/microsoft-corre-para-restabelecer-servicos-apos-falha-global-afetar-outlook-teams-e-copilot/", "fonte_id": "exame", "data_pub": "2026-11-13T06:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Microsoft identificou uma recuperação parcial dos serviços após uma falha global que afetou Outlook, Teams e Copilot. A empresa descartou, até o momento, a possibilidade de um ataque cibernético.", "titulo_pt": "Microsoft corre para restabelecer serviços após falha global afetar Outlook, Teams e Copilot", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 261402, "titulo": "Value Nvidia, not Huang", "url": "https://www.ft.com/content/1f76f0b0-96c6-41de-9725-9051545d32af?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-13T06:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia é uma empresa de alto valor, mas o foco não deve estar em seu fundador, Jen-Hsun Huang. O mercado de trabalho está estagnado.", "titulo_pt": "Valor da Nvidia, não de Huang", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 261434, "titulo": "AI industry weighs future without Nvidia’s Huang", "url": "https://www.japantimes.co.jp/business/2026/11/13/tech/ai-sector-after-huang/", "fonte_id": "japan_times", "data_pub": "2026-11-13T06:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Houve uma queda repentina de Huang, fundador da Nvidia, em meio a crescentes preocupações sobre a solidez financeira das grandes investidas da indústria da inteligência artificial.", "titulo_pt": "Indústria de IA pesa futuro sem Huang da Nvidia", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 261563, "titulo": "Samsung Biologics labor dispute widens as union seeks FKTU affiliation", "url": "https://www.koreaherald.com/article/10936486", "fonte_id": "korea_herald", "data_pub": "2026-11-13T06:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A disputa trabalhista na Samsung Biologics está avançando, com o sindicato dos trabalhadores pressionando para se associar à Federação das Entidades Sindicais do Korea (FKTU), enquanto uma segunda parcial de greve entra em sua segunda semana, antes de negociações coletivas planejadas para a próxima semana. O sindicato planeja realizar um voto online de sexta-feira a terça-feira para decidir se deve se associar à segunda maior organização sindical do país, um movimento que poderia fortalecer sua posição nas negociações com a administração.", "titulo_pt": "Disputa trabalhista na samsung Biologics se amplia com sindicato buscando associação à FKTU", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 260924, "titulo": "Startup brasileira contrata US$ 50 milhões em nuvem com AWS e Oracle", "url": "https://exame.com/inteligencia-artificial/ai-cube-aws-oracle-50-milhoes/", "fonte_id": "exame", "data_pub": "2026-11-13T06:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A AI.CUBE contratou US$ 50 milhões em serviços de nuvem da AWS e da Oracle para operações de inteligência artificial. A maior parte desses recursos será utilizada para atividades no Brasil.", "titulo_pt": "Startup brasileira contrata US$ 50 milhões em nuvem com AWS e Oracle", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 261459, "titulo": "China’s SMIC sees AI computing crunch until 2028 as Nvidia heat risks tighter chip curbs", "url": "https://www.scmp.com/tech/big-tech/article/3374305/chinas-smic-sees-ai-computing-crunch-until-2028-nvidia-heat-risks-tighter-chip-curbs", "fonte_id": "scmp", "data_pub": "2026-11-13T05:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SMIC, empresa chinesa de fabricação de semicondutores, espera que o aumento constante de centrais de dados mantenha a potência de computação da inteligência artificial em falta nos próximos dois anos. Essa previsão ocorre em meio a uma intensificação da vigilância sobre o ex-presidente da Nvidia, Jensen Huang, o que pode acelerar a dependência da China de fábricas nacionais de semicondutores.", "titulo_pt": "SMIC vê computação de IA em falta até 2028 devido ao risco de restrições mais apertadas de chips da Nvidia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 261435, "titulo": "As a crippling outage causes chaos in Japan, the fax gains favor", "url": "https://www.japantimes.co.jp/business/2026/11/13/microsoft-outage-fax-machine/", "fonte_id": "japan_times", "data_pub": "2026-11-13T05:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apesar de um problema global na Microsoft 365, alguns têm elogiado o fax como uma ferramenta confiável diante de interrupções online.", "titulo_pt": "Saída do fax: ferramenta confiável em meio a interrupções online", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 261516, "titulo": "Light-activated molecules in porous crystals show potential for quantum chemical sensing", "url": "https://phys.org/news/2026-11-molecules-porous-crystals-potential-quantum.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo internacional de pesquisadores, liderado por Nobuhiro Yanai da Universidade de Tóquio e Michael R. Wasielewski da Northwestern University, criou pares radicais polarizados em estruturas cristalinas porosas (MOFs), que são materiais compostos por íons metálicos ligados por moléculas orgânicas.", "titulo_pt": "Moléculas ativadas pela luz em cristais porosos mostram potencial para detecção química quantica", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 261517, "titulo": "An iconic puzzle comes home as production of the Rubik's Cube returns to Hungary", "url": "https://phys.org/news/2026-11-iconic-puzzle-home-production-rubik.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de meio século atrás, um arquiteto, escultor e professor húngaro inventou o que se tornaria um dos queixos mais populares e amados do mundo, um queixo colorido e mentalmente desafiador com seis faces: o Rubik's Cube.", "titulo_pt": "Um queixo icônico retorna à hungria com a produção do Rubik's Cube", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 261541, "titulo": "Senator-elect Abdul El-Sayed on restoring trust in science, the state of public health, and RFK Jr.", "url": "https://www.statnews.com/2026/11/13/senator-abdul-el-sayed-interview-public-health-rfk-jr-trust-in-science/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-13T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O eleito senador Abdul El-Sayed conversa com o STAT sobre como restaurar a confiança na ciência, o estado da saúde pública e a relação com RFK Jr.", "titulo_pt": "Eleito senador Abdul El-Sayed sobre restaurar confiança na ciência, saúde pública e RFK Jr.", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 261542, "titulo": "STAT+: Oura’s acquisition of health tech startup raises conflict-of-interest questions for Eli Lilly, experts say", "url": "https://www.statnews.com/2026/11/13/oura-acquisition-counsel-health-eli-lilly/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-13T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A aquisição recente da empresa de tecnologia de saúde Oura pela empresa de telemedicina está levantando questões sobre possíveis conflitos de interesse entre a Eli Lilly, que produz medicamentos GLP-1, e a nova empresa de telemedicina.", "titulo_pt": "Aquisição da oura pela empresa de tecnologia de saúde levanta questões sobre conflitos de interesse com a Eli Lilly", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 261543, "titulo": "5 takeaways from STAT’s investigation of the sprawling ‘three-parent IVF’ industry", "url": "https://www.statnews.com/2026/11/13/fertility-tourism-5-takeaways-mrt-investigation/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-13T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A investigação da STAT sobre o setor de turismo reprodutivo revelou que clínicas estão oferecendo uma técnica de fertilização in vitro com três paisgenses não comprovada para mulheres mais velhas. O relatório destaca cinco pontos-chave sobre essa indústria.", "titulo_pt": "5 Pontos principais da investigação da STAT sobre a indústria de fertilização in vitro com três paisgenses", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 261544, "titulo": "Opinion: STAT+: ‘What will I do with the time I have left?’: What it’s like to find out you might develop Alzheimer’s", "url": "https://www.statnews.com/2026/11/13/alzheimers-disease-biomarker-tests-psychological-legal-challenges/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-13T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor Jason Karlawish afirma que as pessoas temem mais a perda da mente do que o fim da vida ou da morte física.", "titulo_pt": "O que me fará falta no tempo restante?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 261545, "titulo": "STAT+: Across the U.S., homegrown experiments aim to save kids from their phones", "url": "https://www.statnews.com/2026/11/13/phone-addiction-young-people-fight-back-attention-activism/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-13T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jovens estão buscando maneiras de recuperar a sua atenção e combater a influência das grandes empresas de tecnologia, enquanto os pesquisadores ainda buscam entender a adição a telefones celulares.", "titulo_pt": "Nos estados unidos, experimentos locais buscam salvar crianças das suas telas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 261420, "titulo": "Japan team creates ‘planimal’ hybrid plant-animal cells in world first", "url": "https://www.japantimes.co.jp/news/2026/11/13/japan/science-health/plant-animal-cells/", "fonte_id": "japan_times", "data_pub": "2026-11-13T09:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas do Japão criaram células híbridas plantas-animais que produzem proteínas úteis de ambos os reinos e podem ser cultivadas usando fotossíntese, oferecendo novas possibilidades para a produção de medicamentos e carne.", "titulo_pt": "Equipe japonesa cria células híbridas plantas-animais em primeiro mundo", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 260847, "titulo": "Pela 1ª vez, SpaceX tentará pousar propulsor e nave do Starship no mesmo teste", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/pela-1a-vez-spacex-tentara-pousar-propulsor-e-nave-do-starship-no-mesmo-teste.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-13T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A SpaceX está prestes a realizar o 15º voo integrado do Starship, tentando pela primeira vez recuperar tanto o estágio inferior quanto o superior do foguete, guiando-os de volta à plataforma de lançamento no Texas.", "titulo_pt": "SpaceX tentará recuperar propulsor e nave do Starship no mesmo teste", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 261628, "titulo": "Why we buy: 5 thinking errors companies exploit to make you shop", "url": "https://www.newscientist.com/article/2598587-why-we-buy-5-thinking-errors-companies-exploit-to-make-you-shop/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-13T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor David Robson explora a psicologia por trás do impulso de comprar coisas e como os varejistas aproveitam as falhas cognitivas do consumidor para incentivá-lo a fazer compras. O texto se aproxima da Black Friday, uma data tradicional de vendas nos Estados Unidos.", "titulo_pt": "Por que compramos: 5 erros de pensamento que as empresas exploram para fazer você comprar", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 261655, "titulo": "'Don't panic': SpaceX pens familiar message on Starship ahead of historic double-catch test flight", "url": "https://www.space.com/space-exploration/launches-spacecraft/dont-panic-spacex-pens-familiar-message-on-starship-ahead-of-historic-double-catch-test-flight", "fonte_id": "space_com", "data_pub": "2026-11-13T08:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX marcou a frase 'Não se preocupe' no foguete Starship que vai executar uma missão histórica hoje (13 de novembro). Esta não é a primeira vez que a empresa usa essa frase.", "titulo_pt": "'Não se preocupe': spacex marca mensagem familiar no Starship antes de voo histórico", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 261429, "titulo": "Japan’s second bird flu case this season confirmed in Chiba", "url": "https://www.japantimes.co.jp/news/2026/11/13/japan/bird-flu-chiba/", "fonte_id": "japan_times", "data_pub": "2026-11-13T06:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A prefectura de Chiba confirmou o segundo caso de gripe aviária na temporada, ordenando a cativeira de aproximadamente 40.000 galinhas produtoras de ovos em uma fazenda em Asahi.", "titulo_pt": "Segundo caso de gripe aviária desta temporada confirmado na prefectura de Chiba", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 261610, "titulo": "APOD: 2026 November 13 – NGC 206 and the Star Clouds of Andromeda", "url": "https://science.nasa.gov/image-article/apod-2026-november-13-ngc-206-and-the-star-clouds-of-andromeda/", "fonte_id": "nasa_news", "data_pub": "2026-11-13T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem de hoje do Astronomy Picture of the Day (APOD) em 13 de novembro de 2026 apresenta a NGC 206, uma nuvem de estrelas no satélite de Andrômeda. A imagem destaca a estrutura e a beleza das estrelas e nuvens de gás na região.", "titulo_pt": "APOD: 13 de novembro de 2026 – NGC 206 e as nuvens estelares de andrômeda", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 261656, "titulo": "Watch SpaceX attempt a historic Starship launch and double-catch landing today (Nov. 13)", "url": "https://www.space.com/space-exploration/launches-spacecraft/spacex-launching-historic-double-catch-starship-test-flight-today-watch-it-live", "fonte_id": "space_com", "data_pub": "2026-11-13T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "SpaceX planeja lançar seu foguete Starship em uma missão inédita de captura dupla hoje (13 de novembro), e o público pode assistir ao vivo.", "titulo_pt": "Assista à tentativa histórica de lançamento e aterrissagem dupla da Starship da SpaceX hoje (13)", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 261611, "titulo": "A Global Rebound for Mangroves", "url": "https://science.nasa.gov/earth/earth-observatory/a-global-rebound-for-mangroves/", "fonte_id": "nasa_news", "data_pub": "2026-11-13T05:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois de décadas em declínio, esta espécie de floresta ecologicamente significativa está se recuperando.", "titulo_pt": "Uma reversão Global para as manguezais", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 261518, "titulo": "Children are not colorblind: Why early conversations about race are essential", "url": "https://phys.org/news/2026-11-children-colorblind-early-conversations-essential.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T04:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Discutir racismo com crianças pode parecer desafiador para pais, cuidadores e educadores devido à sensibilidade das diferenças entre as pessoas e à revelação de vieses implícitos e privilégios significativos por parte de alguns.", "titulo_pt": "Crianças não são cegas para a cor: por que conversas sobre raça na infância são essenciais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 261634, "titulo": "How Does an Artist Know When She’s Done? A Major Marisa Merz Retrospective Turns the Question on Its Head", "url": "https://www.artnews.com/art-in-america/aia-reviews/marisa-merz-arte-povera-turin-retrospective-1234805723/", "fonte_id": "artnews", "data_pub": "2026-11-13T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três espaços em Turim estão comemorando a única mulher do movimento Arte Povera com uma importante retrospectiva de Marisa Merz.", "titulo_pt": "Como uma artista sabe quando está pronta? Uma importante retrospectiva de Marisa Merz vira a pergunta de cabeça", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 261621, "titulo": "Studio Octopi revives art deco pavilion and lido on Scottish coast", "url": "https://www.dezeen.com/2026/11/13/tarlair-outdoor-pool-pavilion-studio-octopi-andrew-doolan-award/", "fonte_id": "dezeen", "data_pub": "2026-11-13T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O restauro de um pavilhão e um lido de estilo art déco, localizados perto de MacDuff, no Aberdeenshire, foi selecionado para a final do Prêmio Melhor Edifício em Escócia da Royal Incorporação de Arquitetos da Escócia (RIAS). A restauração foi documentada em um vídeo produzido por Jim Stephenson e está sendo publicado em uma série de filmes em colaboração entre a Dezeen e a RIAS.", "titulo_pt": "Estúdio Octopi revive pavilhão e lido art déco na costa escocesa", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 260834, "titulo": "Netflix esconde documentário de Suzane von Richthofen após críticas sobre realização", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/11/netflix-esconde-documentario-de-suzane-von-richthofen-apos-criticas-sobre-realizacao.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-13T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Netflix ajustou seu algoritmo e orientou sua equipe de redes sociais a divulgar discretamente o documentário 'O Tempo Não Apaga', que retrata a vida atual de Suzane von Richthofen, condenada pelo assassinato de seus pais em 2002. As medidas foram tomadas após críticas sobre a realização do documentário.", "titulo_pt": "Netflix esconde documentário de Suzane von Richthofen após críticas", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 260902, "titulo": "Aquiles e o jabuti", "url": "https://veja.abril.com.br/coluna/alexandre-schwartsman/aquiles-e-o-jabuti/", "fonte_id": "veja", "data_pub": "2026-11-13T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo ignora o conceito de ajuste fiscal.", "titulo_pt": "Aquiles e o sapo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 261622, "titulo": "Gen Z apps inform approachable wayfinding for V&A East Storehouse", "url": "https://www.dezeen.com/2026/11/13/va-east-storehouse-wayfinding-graphics/", "fonte_id": "dezeen", "data_pub": "2026-11-13T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estúdio de design de Hackney, Fieldwork Facility, criou um sistema de orientação para o V&A East Storehouse em Londres, inspirado em aplicativos para gerações Z. O objetivo era atrair visitantes desconfiados dos museus.", "titulo_pt": "Apps para gerações Z inspiram orientação acessível para V&A East Storehouse", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 261674, "titulo": "Everybody’s First Drafts Are Bad", "url": "https://lithub.com/everybodys-first-drafts-are-bad/", "fonte_id": "lithub", "data_pub": "2026-11-13T08:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro romance é comparado a um lenço de lã de acrílico feito pela primeira vez, que não sai retinho ou alinhado. Ele parece mais com um rio em um mapa do que com um romance bem estruturado.", "titulo_pt": "Toda primeira versão de um romance é ruim", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 261675, "titulo": "There’s Always Next Year: What the Buffalo Bills Taught Me About Writing and Hope", "url": "https://lithub.com/theres-always-next-year-what-the-buffalo-bills-taught-me-about-writing-and-hope/", "fonte_id": "lithub", "data_pub": "2026-11-13T08:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A frase original sugere que os escritores adoram falar sobre a dificuldade de escrever. O autor cita Stephen King, que comparou o processo de escrita à travessia do Oceano Atlântico em uma banheira, e Red Smith, embora o atribuído a ele seja frequentemente enganoso.", "titulo_pt": "Sempre há o ano que vem: o que os Buffalo Bills Me ensinarão sobre escrita e esperança", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 261069, "titulo": "'Rosa e Azul': a história sombria do quadro mais famoso do Masp — e o fim trágico de uma das meninas", "url": "https://www.bbc.com/portuguese/articles/cmy4xjed4x1ko?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-13T08:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um livro lançado no Reino Unido apresenta a história por trás do famoso retrato de duas crianças, pintado pelo impressionista Pierre-Auguste Renoir em 1881. Este quadro, conhecido como 'Rosa e Azul', tem uma história sombria e o fim trágico de uma das meninas retratadas.", "titulo_pt": "Rosa e Azul: a história sombria do quadro mais famoso do Masp — e o fim trágico de uma das meninas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 261676, "titulo": "What We Lose When We Don’t Archive Black Motherhood", "url": "https://lithub.com/what-we-lose-when-we-dont-archive-black-motherhood/", "fonte_id": "lithub", "data_pub": "2026-11-13T08:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autora não encontrou palavras para confortá-la ou ajudá-la quando estava grávida. Ela percebeu pela primeira vez que não tinha maneira de expressar ou lidar com essa situação.", "titulo_pt": "O que perdemos quando não arquivamos a maternidade negra", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 261677, "titulo": "Can You Write a Poetry Collection That’s a Page-Turner?", "url": "https://lithub.com/can-you-write-a-poetry-collection-thats-a-page-turner/", "fonte_id": "lithub", "data_pub": "2026-11-13T08:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autora começou a escrever sua segunda coleção de poesia, 'Future Tense', uma memória em verso, com a intenção de criar algo que geralmente não se associa a coleções de poesia: um livro que mantenha o leitor interessado e empenhado em ler. O livro registra três anos de luta para se tornar.", "titulo_pt": "Você pode escrever uma coleção de poesia que seja um empolgante?", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 261614, "titulo": "Sheherazaad: Khudgarzi review | Ammar Kalia's global album of the month", "url": "https://www.theguardian.com/music/2026/nov/13/sheherazaad-khudgarzi-review", "fonte_id": "guardian_culture", "data_pub": "2026-11-13T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sheherazaad, uma vocalista e compositora sul-asiática americana, lançou seu álbum de estreia global 'Khudgarzi'. O álbum apresenta arranjos dreamy e reverbados, vocais virtuosos e influências de PJ Harvey e Massive Attack, criando uma obra única e desarmante. A música de Sheherazaad é mais sombria e introspectiva, utilizando arranjos acústicos ríspidos para explorar sua herança musical de maneira distinta.", "titulo_pt": "Khudgarzi: álbum global do mês de Ammar Kalia", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 261613, "titulo": "‘Would you breastfeed your own father?’ The goofy, spiky world of art-pop duo Charlotte Adigéry and Bolis Pupul", "url": "https://www.theguardian.com/music/2026/nov/13/interview-art-pop-duo-charlotte-adigery-and-bolis-pupul", "fonte_id": "guardian_culture", "data_pub": "2026-11-13T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Charlotte Adigéry e Bolis Pupul, um duo artístico belga, estão explorando temas pessoais em seu trabalho após misturar pop e política em seus primeiros projetos. Durante uma visita a Ghent, eles examinam uma escultura em pedra antiga chamada Mammelokker, que está localizada em uma construção do século XVIII.", "titulo_pt": "‘Você amamentaria seu próprio pai?’: o mundo hilariante e crítico de Charlotte Adigéry e Bolis Pupul", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 260835, "titulo": "Globo usou medo de nova reclassificação como desculpa para mudar cena de 'Quem Ama Cuida'", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/11/globo-usou-medo-de-nova-reclassificacao-como-desculpa-para-mudar-cena-de-quem-ama-cuida.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-13T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Globo decidiu não exibir uma cena que mostraria a primeira vez do casal Mau Mau e Felipe em 'Quem Ama Cuida', novela das nove da emissora. O clima entre os membros da produção ficou ruim após essa decisão.", "titulo_pt": "Globo não exibe cena de primeiro beijo em 'Quem Ama Cuida'", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 261431, "titulo": "NHK reveals performers for annual New Year’s Eve spectacle ‘Kohaku’", "url": "https://www.japantimes.co.jp/culture/2026/11/13/entertainment-news/kohaku-uta-gassen-lineup/", "fonte_id": "japan_times", "data_pub": "2026-11-13T06:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NHK, emissora de televisão japonesa, anunciou os artistas que se apresentarão no espetáculo anual de Réveillon 'Kohaku'. Cutie Street, Macaroni Empitsu e L'Arc-en-Ciel estão entre os grupos confirmados para se apresentar.", "titulo_pt": "NHK anuncia artistas para o espetáculo de réveillon 'Kohaku'", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 261620, "titulo": "TV tonight: an absorbing investigation about the Albanian mafia", "url": "https://www.theguardian.com/tv-and-radio/2026/nov/13/tv-tonight-an-absorbing-investigation-about-the-albanian-mafia", "fonte_id": "guardian_culture", "data_pub": "2026-11-13T06:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "John Sparks investiga as surpreendentes ligações da máfia albanesa olescente de 16 anos com grupo é preso no DF", "url": "https://www.metropoles.com/distrito-federal/na-mira/jovem-que-comemorou-morte-de-adolescente-de-16-anos-com-grupo-e-preso-no-df", "fonte_id": "metropoles", "data_pub": "2026-11-13T09:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um jovem foi preso no Distrito Federal suspeito de participar da execução de um adolescente de 16 anos, que ocorreu em 14 de outubro em São Sebastião. O crime foi cometido por três pessoas, e o preso é considerado um dos executores.", "titulo_pt": "Jovem que comemorou morte de adolescente de 16 anos com grupo é preso no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 260951, "titulo": "Referência em doação de leite materno, banco do DF precisa de contribuições", "url": "https://www.metropoles.com/conteudo-especial/df-doacao-de-leite-materno", "fonte_id": "metropoles", "data_pub": "2026-11-13T09:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Distrito Federal é o único lugar no mundo que atinge a autossuficiência em leite humano nas unidades neonatais. O banco de leite do DF precisa de doações.", "titulo_pt": "Referência em doação de leite materno, banco do DF precisa de contribuições", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 260927, "titulo": "Mulheres são maioria no Brasil, mas comandam só 13% das prefeituras, diz IBGE", "url": "https://exame.com/brasil/mulheres-sao-maioria-no-brasil-mas-comandam-so-13-das-prefeituras-diz-ibge/", "fonte_id": "exame", "data_pub": "2026-11-13T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No Brasil, mulheres ocupam apenas 13% das prefeituras, enquanto 68,2% dos gestores são brancos. Dos 5.570 municípios pesquisados, apenas 749 são comandados por mulheres.", "titulo_pt": "Mulheres são maioria no Brasil, mas comandam só 13% das prefeituras, diz IBGE", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 261167, "titulo": "More than ogramas-de-proteccion-y-la-mitad-de-los-vertederos-del-pais-no-tiene-autorizacion-sanitaria/?utm_source=rss&utm_medium=rss&utm_campaign=gobierno-y-camioneros-acuerdan-fin-del-paro-con-rebaja-de-142-en-el-diesel-41-mil-ninos-esperan-cupo-en-programas-de-proteccion-y-la-mitad-de-los-vertederos-del-pais-no-tiene-autorizacion-sanitaria", "fonte_id": "ciper_chile", "data_pub": "2026-11-12T23:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo e os camioneiros acordaram o fim do paro com uma redução de $142 no preço do diesel. Além disso, cerca de 41 mil crianças aguardam um cupo em programas de proteção social, e metade dos aterros sanitários no país não possui autorização sanitária.", "titulo_pt": "Governo e camioneros acordam fim do paro com desconto no diesel; 41 mil crianças aguardam cupo e metade dos aterros não têm autorização sanitária", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 260467, "titulo": "Colectivos se suman al paro de camioneros y bloquean ruta acceso sur", "url": "https://www.latercera.com/videos/noticia/colectivos-se-suman-al-paro-de-camioneros-y-bloquean-ruta-acceso-sur/", "fonte_id": "la_tercera", "data_pub": "2026-11-12T21:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um centenar de coletivos se mobilizou para bloquear a Autopista Acceso Sur, em Puente Alto, como uma forma de apoio ao paro de camioneros contra as aumentos de combustível.", "titulo_pt": "Coletivos se somam ao paro de camioneros e bloqueiam via de acesso sul", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 260282, "titulo": "Violência doméstica associada ao vício em apostas cresce 75% em um ano", "url": "https://www.metropoles.com/brasil/violencia-domestica-associada-ao-vicio-em-apostas-cresce-75-em-um-ano", "fonte_id": "metropoles", "data_pub": "2026-11-12T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": 260238, "texto_pt": "Um levantamento realizado pelo Ministério da Justiça, com base em a.abril.com.br/economia/justica-rejeita-recurso-que-pedia-indenizacao-da-bombril-por-analogia-de-cabelo-crespo-a-palha-de-aco/", "fonte_id": "veja", "data_pub": "2026-11-12T20:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa Bombril teve seu recurso negado pela justiça, que não aceitou a analogia entre o cabelo crespo e a esponja de aço Krespinha. A marca foi relançada em 2020 e retirada de linha pouco depois de gerar repercussão negativa.", "titulo_pt": "Justiça nega recurso da Bombril sobre analogia de cabelo crespo a esponja de aço", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 260410, "titulo": "Nova onda de covid-19 traz alerta para pessoas em tratamento de diabetes e obesidade", "url": "https://veja.abril.com.br/saude/nova-onda-de-covid-19-traz-alerta-para-pessoas-em-tratamento-de-diabetes-e-obesidade/", "fonte_id": "veja", "data_pub": "2026-11-12T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A nova onda de covid-19 apresenta um alerta para pessoas em tratamento de diabetes e obesidade, que estão no grupo de maior risco para complicações da infecção. Essas pessoas têm motivos válidos para se vacinar.", "titulo_pt": "Nova onda de covid-19 traz alerta para pessoas em tratamento de diabetes e obesidade", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 260387, "titulo": "Assédio sexual no Exército alemão é mais disseminado do que indicam registros", "url": "https://www.dw.com/pt-br/assédio-sexual-no-exército-alemão-é-mais-disseminado-do-que-indicam-registros/a-79928530?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-12T20:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento revela que o assédio sexual no Exército alemão é mais disseminado do que indicam os registros oficiais. Mulheres jovens são as principais vítimas e apenas uma parte dos casos é denunciada.", "titulo_pt": "Assédio sexual no Exército alemão é mais disseminado do que indicam os registros", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 260392, "titulo": "Mulheres mais inteligentes são tratadas de forma pior por colegas, aponta estudo", "url": "https://www.dw.com/pt-br/mulheres-mais-inteligentes-são-tratadas-de-forma-pior-por-colegas-aponta-estudo/a-79931636?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-12T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mulheres com maior pontuação em testes de inteligência foram avaliadas negativamente pelos colegas, recebendo menos apoio e sofrendo mais prejuízos. Este fenômeno não ocorre entre homens.", "titulo_pt": "Mulheres mais inteligentes são tratadas de forma pior por colegas, aponta estudo", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 259487, "titulo": "Hochul cambia su promesa de no subir impuestos en Nueva York: “Si necesitamos más recursos, encontraremos la manera”", "url": "https://www.lanacion.com.ar/estados-unidos/nueva-york/hochul-cambia-su-promesa-de-no-subir-impuestos-en-nueva-york-si-necesitamos-mas-recursos-nid11112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-12T17:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Hochul abriu a possibilidade de aumentar os impostos em Nova York para financiar cuidados infantis. Após sua reeleição, ela afirmou que encontrará maneiras de obter mais recursos se necessário.", "titulo_pt": "Hochul abre a possibilidade de aumentar impostos em nova York", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 260943, "titulo": "Clima: combinação entre calor e alta umidade provoca muita chuva nesta 6ª", "url": "https://www.metropoles.com/brasil/clima-combinacao-entre-calor-e-alta-umidade-provoca-muita-chuva-nesta-6a", "fonte_id": "metropoles", "data_pub": "2026-11-13T09:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A combinação de calor e alta umidade está causando muita chuva no Centro-Sul do Brasil e em áreas do Norte e Nordeste. Pancadas de chuva e tempestades são esperadas.", "titulo_pt": "Clima: calor e alta umidade provocam chuva intensa no centro-sul e norte/nordeste", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 261068, "titulo": "Amazônia queimando afeta a saúde e o bolso do Brasil inteiro, diz bióloga dedicada a combater o fogo na floresta", "url": "https://www.bbc.com/portuguese/articles/cr20v7g9jyy3o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-13T09:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A bióloga Erika Berenguer, da Universidade de Oxford e Lancaster, expressa tristeza com os incêndios na Amazônia, mas defende a continuidade dos esforços de preservação, afirmando que o futuro será ainda mais difícil.", "titulo_pt": "Amazônia em chamas afeta todo o Brasil, diz bióloga", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 260900, "titulo": "Efeitos já devastadores do El Niño pelo país expõem fragilidade do poder público diante da crise", "url": "https://veja.abril.com.br/brasil/efeitos-ja-devastadores-do-el-nino-pelo-pais-expoem-fragilidade-do-poder-publico-diante-da-crise/", "fonte_id": "veja", "data_pub": "2026-11-13T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O El Niño já está causando efeitos devastadores em todo o país, revelando a fragilidade do poder público diante da crise. O desprezo pela prevenção resultou em uma situação de grande despreparo dos municípios.", "titulo_pt": "Efeitos devastadores do El Niño expõem fragilidade do poder público", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 261157, "titulo": "Storm Charles causes floods and flight cancellations across southern Europe", "url": "https://www.theguardian.com/environment/2026/nov/13/storm-charles-floods-flight-cancellations-southern-europe-weather", "fonte_id": "guardian_world", "data_pub": "2026-11-13T08:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A tempestade Charles causou alagamentos e cancelamentos de voos na Europa do Sul nos últimos dias. Em Portugal e no sul de Espanha, o sistema trouxe fortes chuvas e ventos, com uma rajada de vento de 84,5 mph registrada em Funchal e 183 voos cancelados em Lisboa em uma só noite. Também houve interrupções na Colúmbia canadense devido a fortes chuvas e ventos.", "titulo_pt": "Tempestade Charles causa inundações e cancelamentos de voos na Europa do sul", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 260851, "titulo": "Crédito climático com juros de 1% bancado pelo governo financia apartamentos de luxo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/11/credito-climatico-com-juros-de-1-bancado-pelo-governo-financia-apartamentos-de-luxo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um programa de financiamento climático do governo federal, com juros baixos de 1% ao ano, tem sido usado para financiar a construção de prédios de luxo, incluindo apartamentos que custam mais de R$ 6 milhões.", "titulo_pt": "Crédito climático com juros baixos bancado pelo governo financia apartamentos de luxo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 260394, "titulo": "Governo anuncia pacote de R$ 39 bilhões na COP31 em projetos para transição climática e energética", "url": "https://veja.abril.com.br/agenda-verde/governo-anuncia-pacote-de-r-39-bilhoes-na-cop31-em-projetos-para-transicao-climatica-e-energetica/", "fonte_id": "veja", "data_pub": "2026-11-12T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo anunciou um pacote de R$ 39 bilhões para projetos de transição climática e energética. O investimento contará com apoio do BNDES, do GCF e de investidores privados.", "titulo_pt": "Governo anuncia pacote de R$ 39 bilhões em projetos de transição climática e energética", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 260333, "titulo": "Arborização de cafezais ajuda no combate às mudanças climáticas", "url": "https://www.cnnbrasil.com.br/agro/arborizacao-de-cafezais-ajuda-no-combate-as-mudancas-climaticas/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-12T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A arborização de cafezais ajuda a proteger a produção de ondas de calor e secas prolongadas sem comprometer a colheita mecanizada. Esta técnica beneficia tanto os produtores quanto o meio ambiente, auxiliando no combate às mudanças climáticas.", "titulo_pt": "Arborização de cafezais ajuda no combate às mudanças climáticas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 260408, "titulo": "Sangue de tamanduás e antas da Amazônia já tem microplásticos, segundo novo estudo", "url": "https://veja.abril.com.br/ciencia/sangue-de-tamanduas-e-antas-da-amazonia-ja-tem-microplasticos-segundo-novo-estudo/", "fonte_id": "veja", "data_pub": "2026-11-12T20:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo publicado na revista Nature detectou microplásticos no sangue de animais da Amazônia, como tamanduás e antas, que vivem a até 100 km de instalações humanas.", "titulo_pt": "Sangue de tamanduás e antas da Amazônia já tem microplásticos, de acordo com novo estudo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 260295, "titulo": "Por causa do El Niño, governo do Pará decreta emergência ambiental e climática por 120 dias", "url": "https://exame.com/esg/por-causa-do-el-nino-governo-do-para-decreta-emergencia-ambiental-e-climatica-por-120-dias/", "fonte_id": "exame", "data_pub": "2026-11-12T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo do Pará decretou uma emergência ambiental e climática devido à influência do El Niño, que durará 120 dias. Durante esse período, todas as autorizações e concessões para o uso do fogo no estado estão suspensas.", "titulo_pt": "Devido ao El Niño, governo do Pará declara emergência ambiental e climática por 120 dias", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 260073, "titulo": "COP31: How Ed Miliband answered Carbon Brief readers’ questions", "url": "https://www.carbonbrief.org/cop31-how-ed-miliband-answered-carbon-brief-readers-questions", "fonte_id": "carbon_brief", "data_pub": "2026-11-12T16:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ed Miliband, ex-secretário de Estado britânico e veterano das conferências COP, participou de uma entrevista com o Carbon Brief durante a COP31 em Antalya, Turquia, respondendo a perguntas dos leitores do site.", "titulo_pt": "COP31: como Ed Miliband respondeu às perguntas dos leitores do Carbon Brief", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 259413, "titulo": "Temporais no Brasil: entenda como El Niño influencia eventos meteorológicos", "url": "https://www.cnnbrasil.com.br/nacional/brasil/temporais-no-brasil-entenda-como-el-nino-influencia-eventos-meteorologicos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-12T16:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O fenômeno El Niño modifica a circulação atmosférica no Brasil, podendo causar períodos de chuva intensa e tempestades severas. A ocorrência de tornados, no entanto, depende de condições específicas.", "titulo_pt": "Temporais no Brasil: entenda como El Niño influencia eventos meteorológicos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 259588, "titulo": "The planet ‘is being killed’, Greta Thunberg tells Cop31 climate summit", "url": "https://www.theguardian.com/environment/2026/nov/12/greta-thunberg-cop31-climate-summit", "fonte_id": "guardian_world", "data_pub": "2026-11-12T16:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Greta Thunberg criticou os governos mundiais por sua falha em prevenir o colapso ambiental. Ela afirmou que a 'planeta está sendo morto, e sabemos por quem', durante sua primeira aparição na conferência anual das Nações Unidas sobre clima em Antalya, Turquia.", "titulo_pt": "Planeta 'está sendo morto', afirma Greta Thunberg em conferência climática", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 259371, "titulo": "Cinema movido a energia solar percorre o Nordeste em ação sustentável", "url": "https://exame.com/bussola/cinema-movido-a-energia-solar-percorre-o-piaui-em-acao-sustentavel/", "fonte_id": "exame", "data_pub": "2026-11-12T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma iniciativa gratuita da AXIA Energia e Brazucah Produções está percorrendo o Nordeste com uma van equipada com placas solares para exibir filmes e oferecer uma estação de ciências.", "titulo_pt": "Cinema movido a energia solar percorre o Nordeste em ação sustentável", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 258552, "titulo": "“Não há contradição” entre petróleo e transição energética, diz ministro", "url": "https://www.cnnbrasil.com.br/internacional/coletiva-transicao-energetica-petroleo-venezuela-brasil-cop-31/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-12T09:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro João Paulo Capobianco afirmou que não há contradição entre o petróleo e a transição energética durante a COP31. Essa declaração foi feita um dia após o presidente discutir investimentos no setor petrolífero com a Venezuela.", "titulo_pt": "Não há contradição entre petróleo e transição energética, diz ministro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 258536, "titulo": "Ponto de recarga para carros elétricos é destruído por incêndio no DF", "url": "https://www.metropoles.com/distrito-federal/ponto-de-recarga-para-carros-eletricos-e-destruido-por-incendio-no-df", "fonte_id": "metropoles", "data_pub": "2026-11-12T09:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um incidente de incêndio destruiu um ponto de recarga para carros elétricos na noite de 11 de novembro na Avenida Alagados, em Santa Maria (DF). Não houve registros de vítimas.", "titulo_pt": "Ponto de recarga para carros elétricos é destruído por incêndio no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 258663, "titulo": "Cubrieron parte de un glaciar con lana de oveja y redujeron su deshielo en más del 50%", "url": "https://www.lanacion.com.ar/ciencia/cubrieron-parte-de-un-glaciar-con-lana-de-oveja-y-redujeron-su-deshielo-en-mas-del-50-nid11112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-12T09:14:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um experimento suíço demonstrou que o uso de fibras naturais, como lã de ovelha, pode reduzir o deshielo de glaciares em mais de 50%. Este método evita a degradação ambiental associada aos materiais sintéticos.", "titulo_pt": "Parte de um glaciar foi coberta com lã de ovelha e seu deshielo foi reduzido em mais de 50%", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 261547, "titulo": "'Empowering women is a business imperative'", "url": "https://www.koreaherald.com/article/10936673", "fonte_id": "korea_herald", "data_pub": "2026-11-13T08:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A executiva LG Group Yun Yuh-soon, de 71 anos, publicou um livro intitulado 'O Tempo de Acordar a Metade'. O livro destaca que organizações que não reconhecem e desenvolvem o potencial das mulheres desperdiçam metade de seu talento.", "titulo_pt": "O tempo de acordar a metade", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 261377, "titulo": "U  "2026-11-13T00:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente da Fepal, Fatima Ali, afirmou que a Palestina é uma prisão a céu aberto onde Israel promove uma limpeza étnica. Ela comentou sobre os últimos episódios em Gaza e Cisjordânia, bem como os ataques de israelenses a causa palestina no Brasil.", "titulo_pt": "Palestina é prisão a céu aberto com limpeza étnica, afirma presidente da Fepal", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 261281, "titulo": "Tras adoptar doctrina de que las decisiones de la Comisión de Rebaja de Condenas son irrevocables: Rabat igual rechazó 22 reducciones", "url": "https://www.ciperchile.cl/2026/11/12/tras-adoptar-doctrina-de-que-las-decisiones-de-la-comision-de-rebaja-de-condenas-son-irrevocables-rabat-igual-rechazo-22-reducciones/?utm_source=rss&utm_medium=rss&utm_campaign=tras-adoptar-doctrina-de-que-las-decisiones-de-la-comision-de-rebaja-de-condenas-son-irrevocables-rabat-igual-rechazo-22-reducciones", "fonte_id": "ciper_chile", "data_pub": "2026-11-12T23:04:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A cidade de Rabat rejeitou 22 pedidos de redução de condenações, mesmo após a adoção de uma doutrina que considera as decisões da Comissão de Rebaja de Condenações irrevocáveis.", "titulo_pt": "Após adotar doutrina de que decisões da comissão de Rebaja de condenações são irrevogáveis, rabat rejeitou 22 reduções", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 260261, "titulo": "No Peru, papa prega contra machismo e pede que Igreja enfrente abusos", "url": "https://www.poder360.com.br/poder-internacional/no-peru-papa-prega-contra-machismo-e-pede-que-igreja-enfrente-abusos/", "fonte_id": "poder360", "data_pub": "2026-11-12T21:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O papa fez declarações contra o machismo e pediu que a Igreja enfrentasse abusos durante suas atividades em Lima, Peru. O Peru é o terceiro p ackdown-continues", "fonte_id": "middle_east_eye", "data_pub": "2026-11-12T15:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A organização LGBTQ+ mais antiga da Turquia, Lambda Istanbul, teve seu escritório fechado pelas autoridades, que alegaram ser um 'clube social não autorizado'. O fechamento visa, segundo a organização, 'isolar' pessoas LGBTQ+ e privá-las de um espaço para organizar-se.',", "titulo_pt": "Escritório da organização LGBTQ+ mais antiga da Turquia fechado", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 259829, "titulo": "10 Palestinians killed since dawn", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/11-palestinians-killed-dawn", "fonte_id": "middle_east_eye", "data_pub": "2026-11-12T15:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dez palestinos foram mortos em ataques israelenses em Gaza desde o amanhecer, incluindo dois ataques a hospitais que resultaram em pelo menos sete mortes. Um ataque noturno a um hospital médico Nasser em Khan Younis causou a morte de seis pessoas, entre elas cirurgiões e pacientes, e um ataque a um veículo por um drone israelense no sul de Deir al-Balah também resultou em várias vítimas.", "titulo_pt": "10 Palestinos mortos em ataques israelenses em gaza desde o amanhecer", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 261579, "titulo": "Conflict and disease outbreaks deepen DR Congo’s hunger crisis as record numbers are projected to face acute food insecurity", "url": "https://www.unicef.org/press-releases/conflict-and-disease-outbreaks-deepen-dr-congos-hunger-crisis-record-numbers-are", "fonte_id": "unicef", "data_pub": "2026-11-12T15:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Organização das Nações Unidas para Alimentação e Agricultura (FAO), o Programa das Nações Unidas para Alimentação e Assistência (WFP), a UNICEF e a Organização Mundial da Saúde (OMS) estão pedindo const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
