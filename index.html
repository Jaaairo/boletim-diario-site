elve-a-casa-y-se-reencuentra-con-los-fieles-en-chiclayo.html", "fonte_id": "elpais_america", "data_pub": "2026-11-14T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Papa Francisco visitou a cidade de Chiclayo, onde foi bispo por cerca de dez anos, reencontrando-se com a comunidade local. A visita teve um impacto significativo que vai além do âmbito religioso.", "titulo_pt": "Leão XIV retorna a Chiclayo e se reencontra com os fiéis", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 263492, "titulo": "La caída de Jensen Huang de la cima de Nvidia", "url": "https://elpais.com/us/2026-11-14/la-caida-de-jensen-huang-de-la-cima-de-nvidia.html", "fonte_id": "elpais_america", "data_pub": "2026-11-14T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Huang Jensen, CEO do maior fabricante de chips do mundo, saiu repentinamente de suas funções. Uma cronologia foi fornecida para entender essa rápida saída.", "titulo_pt": "A queda de Jensen Huang do topo da Nvidia", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 263495, "titulo": "La República Evangélica de Colombia", "url": "https://elpais.com/america-colombia/2026-11-14/la-republica-evangelica-de-colombia.html", "fonte_id": "elpais_america", "data_pub": "2026-11-14T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O projeto de poder evangélico, que ganha força no continente, cresce durante a presidência de Abelardo de La Espriella. De suas igrejas, surge a batalha cultural que promove o ultradireitismo.", "titulo_pt": "A República Evangélica da colômbia", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 263498, "titulo": "La huida y protección del exfiscal Zuany por Estados Unidos refuerza las críticas de México por violación a su soberanía", "url": "https://elpais.com/mexico/2026-11-14/la-huida-y-proteccion-del-exfiscal-zuany-por-estados-unidos-refuerza-las-criticas-de-mexico-por-violacion-a-su-soberania.html", "fonte_id": "elpais_america", "data_pub": "2026-11-14T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Novas revelações sugerem que o ex-fiscal Zuany teve uma colaboração mais profunda e antiga com a CIA dos Estados Unidos. Essas revelações intensificam as críticas de México sobre a suposta violação de sua soberania.", "titulo_pt": "Fuga e proteção do ex-fiscal Zuany por Estados Unidos aprofundam críticas de México sobre violação de soberania", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 263499, "titulo": "Un ecuatoriano lucha por su vida tras el desplome del edificio en Brooklyn: “Está en una situación grave”", "url": "https://elpais.com/us/2026-11-14/un-ecuatoriano-lucha-por-su-vida-tras-el-desplome-del-edificio-en-brooklyn-esta-en-una-situacion-grave.html", "fonte_id": "elpais_america", "data_pub": "2026-11-14T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Álvaro Miguel Caizaguano, um ecuatoriano, foi ferido no colapso de um prédio em Brooklyn. Seus parentes em Equador estão preocupados e impotentes, incapazes de auxiliá-lo à distância.", "titulo_pt": "Ecuatoriano ferido no colapso de edifício em Brooklyn está em situação grave", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 263500, "titulo": "Los ette ennaka, el pueblo indígena que lucha por recuperar su lugar en la Sierra Nevada de Colombia", "url": "https://elpais.com/america-colombia/2026-11-14/los-ette-ennaka-el-pueblo-indigena-que-lucha-por-recuperar-su-lugar-en-la-sierra-nevada-de-colombia.html", "fonte_id": "elpais_america", "data_pub": "2026-11-14T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O grupo indígena, anteriormente conhecido como chimilas, foi drasticamente reduzido, chegando a ser considerado desaparecido em alguns registros. Agora, com cerca de 4.000 pessoas, eles buscam ser reconhecidos na área sagrada ao redor da Sierra Nevada na Colômbia.", "titulo_pt": "Os ette ennaka, o povo indígena que luta por recuperar seu lugar na Sierra Nevada da colômbia", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 263502, "titulo": "‘Los culpables’ lleva al cine ‘el caso de la Guardería ABC’ de Diego Enrique Osorno con Gael García Bernal", "url": "https://elpais.com/mexico/2026-11-14/los-culpables-lleva-al-cine-el-caso-de-la-guarderia-abc-de-diego-enrique-osorno-con-gael-garcia-bernal.html", "fonte_id": "elpais_america", "data_pub": "2026-11-14T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A produção da Amazon se baseia na investigação 'Nosotros somos los culpables' do jornalista mexicano Diego Enrique Osorno, que aborda o caso da Guardería ABC, onde morreram 49 crianças em Sonora em 2009. Gael García Bernal atua no filme.", "titulo_pt": "‘Os culpáveis’ leva ao cinema o caso da Guardería ABC de Diego Enrique Osorno com Gael García Bernal", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 263610, "titulo": "New French protests focus on children and police", "url": "https://www.lemonde.fr/en/france/article/2026/11/14/new-french-protests-focus-on-children-and-police_6780622_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-14T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Protestos na França estão programados para o quinto sábado consecutivo, com uma grande manifestação em Paris e várias outras no país. Na capital, o movimento dos Casacos Amarelos se junta a estudantes do ensino médio, sindicatos e outros ativistas que defendem direitos dos crianças ou se opõem a um projeto de lei que aumenta a proteção policial no uso de armas.", "titulo_pt": "Novos protestos franceses se concentram em crianças e policiais", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 263667, "titulo": "Qatar and Turkiye sign a mutual defence pact: What do we know?", "url": "https://www.aljazeera.com/news/2026/11/14/qatar-and-turkiye-sign-a-mutual-defence-pact-what-do-we-know?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-14T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Qatar e Turquia assinaram um pacto mutual de defesa, no contexto da guerra entre EUA e Irã, com o objetivo de dissuadir ataques, não de formar uma aliança ofensiva.", "titulo_pt": "Qatar e Turquia assinam pacto mutual de defesa", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 263633, "titulo": "Hungary: Millions in hidden cash found in Orban graft probe", "url": "https://www.dw.com/en/hungary-millions-in-hidden-cash-found-in-orban-graft-probe/a-79946923?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-14T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores em Hungria encontraram quantias em dinheiro vivo enterradas em florestas e escondidas em edifícios. O dinheiro foi apreendido durante uma investigação contra um ex-ministro acusado de receber milhões em propinas.", "titulo_pt": "Hungria: milhões em dinheiro escondido encontrado na investigação sobre corrupção de Orban", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 263232, "titulo": "Desgaste com voz faz Lula cancelar declarações nas Filipinas", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/11/desgaste-com-voz-faz-lula-cancelar-declaracoes-nas-filipinas.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-11-14T09:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva (PT) cancelou pelo menos dois pronunciamentos durante sua visita às Filipinas devido ao desgaste vocal e à rouquidão.", "titulo_pt": "Desgaste vocal faz Lula cancelar declarações nas Filipinas", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 263634, "titulo": "US loses measles-elimination status after 26 years, WSJ reports", "url": "https://www.dw.com/en/us-loses-measles-elimination-status-after-26-years-wsj-reports/a-79946974?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-14T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Organização Pan-Americana da Saúde teria retirado o status de eliminação da rubéola dos Estados Unidos após 26 anos, devido a suas piores epidemias de rubéola em mais de três décadas.", "titulo_pt": "EUA perde status de eliminação de rubéola após 26 anos", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 263668, "titulo": "Nearly $20m found in Hungary’s forests, buildings amid corruption probe", "url": "https://www.aljazeera.com/news/2026/11/14/hungarian-investigators-uncover-19-5m-hidden-in-forests-and-buildings?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-14T09:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ex-ministro está sendo investigado por supostos casos de corrupção durante o governo de Orbán, enquanto a nova administração húngara realiza uma investigação. Foi encontrada uma quantia próxima a 20 milhões de dólares em florestas e edifícios húngaros.", "titulo_pt": "Próximo a 20 milhões de dólares encontrados emhungria durante investigação de corrupção", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 263418, "titulo": "Carf afasta IRPJ e CSLL sobre incentivos de ICMS da Cervejaria Petrópolis", "url": "https://www.jota.info/tributos/carf-afasta-irpj-e-csll-sobre-incentivos-de-icms-da-cervejaria-petropolis", "fonte_id": "jota", "data_pub": "2026-11-14T09:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Corte de Contas da Federação (Carf) decidiu que não são aplicáveis IRPJ e CSLL sobre os incentivos de ICMS concedidos à Cervejaria Petrópolis. O valor em discussão no processo é de aproximadamente R$ 200 milhões.", "titulo_pt": "Carf descarta IRPJ e CSLL sobre incentivos de ICMS da Cervejaria Petrópolis", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 263449, "titulo": "El trigo evoluciona favorablemente y se abre una oportunidad en Brasil", "url": "https://www.lanacion.com.ar/economia/campo/el-trigo-evoluciona-favorablemente-y-se-abre-una-oportunidad-en-brasil-nid14112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-14T08:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O trigo da campanha 2026/27 encontra-se em boas condições, exceto por alguns problemas específicos. No Brasil, há uma redução na produção.", "titulo_pt": "O trigo evolui favoravelmente e abre uma oportunidade no Brasil", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 263359, "titulo": "Dúvidas fiscais tiram Brasil do destaque entre emergentes, dizem analistas", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/duvidas-fiscais-tiram-brasil-do-destaque-entre-emergentes-dizem-analistas/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-14T07:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Analistas apontam que dúvidas fiscais estão afetando o desempenho do Brasil em comparação com outros emergentes, como o sul-coreano e o mexicano. Um ETF brasileiro está se desempenhando de forma contrária a esses mercados.", "titulo_pt": "Dúvidas fiscais afastam Brasil dos emergentes, dizem analistas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 263630, "titulo": "Analysis: Companies love a ‘rockstar’ CEO. Until they depend on one", "url": "https://www.cnbc.com/2026/11/14/nvidia-jensen-huang-ceo-succession-risk.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-14T07:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A saída de Jensen Huang está testando os planos de sucessão e governança da Nvidia, e oferece lições para empresas que elevam seus CEOs a uma posição de estrela.", "titulo_pt": "Análise: empresas adoram um 'rockstar' CEO. Até que dependem de um", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 263217, "titulo": "Metade das condenações por assédio eleitoral no trabalho é de até R$ 10 mil, diz estudo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/metade-das-condenacoes-por-assedio-eleitoral-no-trabalho-e-de-ate-r-10-mil-diz-estudo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-14T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo realizado pela Turivius, uma plataforma de inteligência jurídica, analisou 500 decisões judiciais sobre assédio eleitoral no ambiente de trabalho e constatou que metade das condenações resultaram em indenizações de até R$ 10 mil. Foram identificadas 261 condenações pela Justiça.", "titulo_pt": "Metade das condenações por assédio eleitoral no trabalho é de até R$ 10 mil, mostra estudo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 263221, "titulo": "Governo lança ofensiva para aprovar na Câmara regulação de big techs", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/governo-lanca-ofensiva-para-aprovar-na-camara-regulacao-de-big-techs.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-14T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula está mobilizando esforços para desmistificar o discurso de censura em torno do projeto de regulação dos mercados digitais e planeja votar o PL 4.675/2025 na Câmara dos Deputados na próxima semana.", "titulo_pt": "Governo lula lança ofensiva para aprovar regulação de big techs na Câmara", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 263424, "titulo": "Marcas no Brasil: o fim do volume e a era da estratégia", "url": "https://www.jota.info/opiniao-e-analise/artigos/marcas-no-brasil-o-fim-do-volume-e-a-era-da-estrategia", "fonte_id": "jota", "data_pub": "2026-11-14T04:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As mudanças nas taxas do INPI e o aumento do rigor nas buscas prévias devem tornar o registro de marcas mais estratégico no Brasil.", "titulo_pt": "Marcas no Brasil: o fim do volume e a era da estratégia", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 263222, "titulo": "Obra propõe erradicar miséria com os mesmos R$ 331 bi gastos hoje em programas sociais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/obra-propoe-erradicar-miseria-com-os-mesmos-r-331-bi-gastos-hoje-em-programas-sociais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-14T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil gasta atualmente R$ 331 bilhões com programas sociais como Bolsa Família e BPC. O relatório propõe usar os mesmos recursos para erradicar a miséria.", "titulo_pt": "Obra sugere erradicar miséria com os mesmos R$ 331 bi gastos hoje em programas sociais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 262348, "titulo": "Prosecutors indict 26 in cryptocurrency fraud", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/14/2003867725", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os procuradores acusaram 26 pessoas de fraude com criptomoedas.", "titulo_pt": "Procuradores acusam 26 em fraude com criptomoedas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 262358, "titulo": "ASE investing NT$100 billion in Kaohsiung", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/14/2003867696", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ASE está investindo NT$100 bilhões em Kaohsiung. Este investimento destina-se a projetos no porto de Kaohsiung.", "titulo_pt": "ASE investindo NT$100 bilhões em Kaohsiung", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 263701, "titulo": "Sam Bankman-Fried would have made nearly $40bn in Anthropic IPO", "url": "https://www.ft.com/content/0ef40ac9-6d01-428f-98c8-a52bf5b9a787?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-13T23:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sam Bankman-Fried, um magnata do criptocâmbio preso, perdeu a oportunidade de ganhar cerca de 40 bilhões de dólares com a IPO do Anthropic, uma empresa de laboratório de IA em que ele havia investido precocemente.", "titulo_pt": "Sam Bankman-Fried perde chance de ganhar 40 bi em IPO do Anthropic", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 263718, "titulo": "U.S. air travel resumption will ‘take time’ after hours-long stop", "url": "https://www.japantimes.co.jp/news/2026/11/14/world/departing-us-flights-grounded-canceled/", "fonte_id": "japan_times", "data_pub": "2026-11-13T23:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O reinício dos voos nos Estados Unidos após uma paralisação de horas deixou centenas de milhares de passageiros em situação incerta, com alguns passageiros sendo removidos de seus aviões momentos antes do decolagem.", "titulo_pt": "Reinício dos voos nos EUA após paralisação demorada levará 'tempo'", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 263425, "titulo": "PL 4675: falta coerência regulatória entre proteção da concorrência e proteção de dados pessoais", "url": "https://www.jota.info/opiniao-e-analise/artigos/pl-4675-falta-coerencia-regulatoria-entre-protecao-da-concorrencia-e-protecao-de-dados-pessoais", "fonte_id": "jota", "data_pub": "2026-11-13T23:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A efetividade da regulação digital depende das instituições e das condições para que cada uma exerça adequadamente suas competências. PL 4675 aborda a falta de coerência entre a proteção da concorrência e a proteção de dados pessoais.", "titulo_pt": "PL 4675: falta de coerência entre proteção da concorrência e proteção de dados pessoais", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 263227, "titulo": "BC aprova compra de banco pelo Nubank, que passará a ter licença bancária no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/bc-aprova-compra-de-banco-pelo-nubank-que-passara-a-ter-licenca-bancaria-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T23:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Nubank confirmou que o Banco Central aprovou a compra do Banco Porto Real de Investimentos. Com esta aquisição, o Nubank obterá uma licença bancária no Brasil, permitindo-lhe usar a nomenclatura 'banco' conforme a legislação vigente.", "titulo_pt": "BC aprova compra do banco porto real pelo Nubank, que passará a ter licença bancária no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 263269, "titulo": "Receita cancelará dívidas de MEIs vencidas até esta sexta-feira", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/receita-cancelara-dividas-de-meis-vencidas-ate-esta-sexta-feira", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-13T23:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As dívidas de contribuição previdenciária dos Microempreendedores Individuais (MEIs) vencidas até esta sexta-feira (13) serão canceladas automaticamente pela Receita Federal. Para manter o benefício, os MEIs devem manter as parcelas do DAS em dia entre janeiro e junho de 2027.", "titulo_pt": "Receita cancelará dívidas de MEIs vencidas até esta sexta-feira", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 263229, "titulo": "CEO da Anthropic diz não estar muito preocupado com turbulência no mercado antes do IPO", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/ceo-da-anthropic-diz-nao-estar-muito-preocupado-com-turbulencia-no-mercado-antes-do-ipo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T22:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CEO da Anthropic, Dario Amodei, afirmou que a empresa não está muito preocupada com a volatilidade do mercado antes do aguardado IPO. Essa declaração foi feita durante uma entrevista com o presidente do J.P. Morgan, Jamie Dimon, nesta sexta-feira (13).", "titulo_pt": "CEO da Anthropic não se preocupa com turbulência no mercado antes do IPO", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 263442, "titulo": "El desafío de asesorar en la era de la inteligencia artificial", "url": "https://www.lanacion.com.ar/economia/negocios/el-desafio-de-asesorar-en-la-era-de-la-ia-nid14112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-14T09:18:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Grandes empresas do setor estão reconsiderando seus modelos de negócios, estruturas organizacionais e tarifas de consultoria diante da inteligência artificial, que pode realizar tarefas que antes exigiam semanas de trabalho em apenas minutos.", "titulo_pt": "O desafio de consultoria na era da inteligência artificial", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 263723, "titulo": "Hong Kong police to activate AI facial recognition across surveillance network", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3374436/hong-kong-police-activate-ai-facial-recognition-across-surveillance-network", "fonte_id": "scmp", "data_pub": "2026-11-14T09:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia de Hong Kong vai ativar a reconhecimento facial baseado em inteligência artificial em sua rede de vigilância inteligente a partir de segunda-feira, conforme declarou o comissário da força policial, Joe Chow Yat-ming. A tecnologia permitirá identificar pessoas mesmo com máscaras ou métodos de evasão.", "titulo_pt": "Polícia de hong Kong ativar reconhecimento facial com IA em rede de vigilância", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 263724, "titulo": "Hong Kong to trial electronic proxy voting platform to curb bid-rigging at estates", "url": "https://www.scmp.com/news/hong-kong/society/article/3374434/hong-kong-trial-electronic-proxy-voting-platform-curb-bid-rigging-estates", "fonte_id": "scmp", "data_pub": "2026-11-14T09:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2024, Hong Kong planeja lançar um teste de plataforma eletrônica para votação por procuração com o objetivo de implementar um limite futuro para o número de procuradores e reduzir a corrupção na atribuição de contratos para condomínios residenciais privados. A decisão foi anunciada pela secretária de Assuntos de Cidade e Jovens, Alice Mak Mei-kuen, após o incêndio fatal em Tai Po há aproximadamente um ano.", "titulo_pt": "Hong Kong vai testar plataforma eletrônica de votação por procuração para combater corrupção em condomínios", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 263485, "titulo": "El impacto del escándalo de Nvidia en la carrera por el dominio de la IA", "url": "https://www.latercera.com/mundo/noticia/el-impacto-del-caso-nvidia-en-la-carrera-por-el-dominio-de-la-ia/", "fonte_id": "la_tercera", "data_pub": "2026-11-14T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O CEO da Nvidia, Jensen Huang, admitiu ter uma relação extraconjugal que envolveu uma agente de inteligência chinesa. Essa revelação levou à renúncia de Huang e gerou preocupações sobre a segurança nacional dos Estados Unidos.", "titulo_pt": "O impacto do escândalo da Nvidia na corrida pelo dominio da IA", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 263454, "titulo": "La IA corre, el juicio camina", "url": "https://www.lanacion.com.ar/economia/negocios/la-ia-corre-el-juicio-camina-nid14112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-14T07:45:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial amplia a capacidade de análise e acelera os processos, mas revela uma nova limitação: a necessidade de tempo e critério para tomar decisões.", "titulo_pt": "A IA corre, o julgamento avança", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 263751, "titulo": "ICT ministry to inspect domestic disruptions after Microsoft services outage", "url": "https://en.yna.co.kr/view/AEN20261114002000315", "fonte_id": "yonhap_news", "data_pub": "2026-11-14T07:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministério da Ciência, Tecnologia e Comunicações planeja investigar interrupções domésticas após um problema nos serviços da Microsoft. A investigação visa entender os impactos locais e possíveis soluções.", "titulo_pt": "Ministério da ICT vai investigar interrupções domésticas após problema nos serviços da Microsoft", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 263779, "titulo": "Outlook Went Down? Microsoft May Owe You Money", "url": "https://www.wired.com/story/outlook-went-down-microsoft-may-owe-you-money/", "fonte_id": "wired", "data_pub": "2026-11-14T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Se seus serviços de negócios da Microsoft estiverem fora do ar na última semana, você provavelmente tem direito a um crédito parcial no seu próximo faturamento mensal.", "titulo_pt": "Outlook Down? Microsoft pode devolver dinheiro", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 263422, "titulo": "Shadow AI e os limites da governança no trabalho", "url": "https://www.jota.info/opiniao-e-analise/artigos/shadow-ai-e-os-limites-da-governanca-no-trabalho", "fonte_id": "jota", "data_pub": "2026-11-14T06:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A política que proíbe o uso de inteligência artificial pode coexistir com seu uso diário, sem autorização, pelos empregados.", "titulo_pt": "Política anti-ai e a coexistência com o uso não autorizado", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 263697, "titulo": "The Nvidia board’s artificial independence", "url": "https://www.ft.com/content/e141a5ea-5aa4-491b-88a4-369cfc67693a", "fonte_id": "financial_times", "data_pub": "2026-11-14T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A diretoria da Nvidia parece estar cansada de lidar com questões de governança corporativa.", "titulo_pt": "Diretoria da Nvidia cansada de governança", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 263699, "titulo": "Nvidia’s cult of personality was bound to end badly", "url": "https://www.ft.com/content/546ec5eb-fbc2-4600-9794-12b1749c1a04", "fonte_id": "financial_times", "data_pub": "2026-11-14T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Nvidia demonstrava sinais de arrogância corporativa, que frequentemente antecedem problemas graves. É importante prestar atenção a esses sinais.", "titulo_pt": "A cultura de personalidade da nvidia estava destinada a terminar mal", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 263707, "titulo": "Microsoft says services fully restored after outage roiled world", "url": "https://www.japantimes.co.jp/business/2026/11/14/microsoft-outage-recovered/", "fonte_id": "japan_times", "data_pub": "2026-11-14T04:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O acesso a todas as principais aplicações da Microsoft foi totalmente restaurado após um problema que paralisou escritórios governamentais, traders e empresas em todo o mundo.", "titulo_pt": "Microsoft anuncia que serviços foram totalmente restaurados após interrupção global", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 263735, "titulo": "Cleaner, smarter, big data: the PLA’s bet on ‘sunshine’ military recruitment", "url": "https://www.scmp.com/news/china/military/article/3374390/cleaner-smarter-big-data-plas-bet-sunshine-military-recruitment", "fonte_id": "scmp", "data_pub": "2026-11-14T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Exército Chinês está utilizando big data para melhorar o recrutamento e combater a corrupção em vista do seu centenário no próximo ano. Como parte de uma reforma chamada 'recrutamento de sol a sol', o Exército Popular de Libertação foi instruído a usar sistemas baseados em dados ao longo do processo de recrutamento, visando criar uma força militar focada em preparação para guerra.", "titulo_pt": "Limpo, inteligente, big data: a aposta do PLA em um recrutamento 'de sol a sol'", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 263767, "titulo": "Microsoft apologizes as global service outage stretches into second day", "url": "https://www.koreaherald.com/article/10936977", "fonte_id": "korea_herald", "data_pub": "2026-11-14T03:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microsoft se retratou após um desligamento global que afetou seus serviços de e-mail e software de escritório durar mais de um dia, afetando empresas e agências governamentais em todo o mundo. O problema começou por volta da meia-noite de quinta-feira em Seoul, Coreia do Sul.", "titulo_pt": "Microsoft se retrata com interrupção global em seus serviços persiste por dois dias", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 263563, "titulo": "Of Course Americans Blamed the Ground Stop on AI", "url": "https://www.theatlantic.com/ideas/2026/11/faa-grounding-flights-cancelled/689444/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-11-14T01:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois de qualquer problema ocorrer, as pessoas tendem a especular sobre as causas. O incidente envolvendo a parada de solo no sistema de inteligência artificial foi atribuído aos usuários americanos.", "titulo_pt": "Claro que os americanos culparam o Ground Stop pelo AI", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 263780, "titulo": "The FAA Nationwide Ground Stop Is Over", "url": "https://www.wired.com/story/the-faa-nationwide-ground-stop-is-over/", "fonte_id": "wired", "data_pub": "2026-11-14T01:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A interrupção nacional da FAA durou cinco horas e terminou na sexta-feira à noite. Embora os voos possam retomar, os efeitos desta paralisação serão sentidos durante todo o fim de semana.", "titulo_pt": "A paralisação nacional da FAA está terminada", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 263739, "titulo": "Don’t take Nvidia CEO Jensen Huang’s ‘sex’ scandal at face value", "url": "https://www.scmp.com/opinion/china-opinion/article/3374017/dont-take-nvidia-ceo-jensen-huangs-sex-scandal-face-value", "fonte_id": "scmp", "data_pub": "2026-11-14T01:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alice Huang, supostamente namorada do CEO da Nvidia, Jensen Huang, foi acusada de envolvimento com a China. Jensen Huang renunciou ao cargo de CEO na empresa na quinta-feira. O texto faz referência a uma série britânica de espionagem para contextualizar a acusação.", "titulo_pt": "Não julgue a escândalo de ‘sex’ do CEO da Nvidia por sua aparência", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 263722, "titulo": "Wearing briefs boosts erectile dysfunction risk, finds 26,000-man study in China", "url": "https://www.scmp.com/news/china/science/article/3374313/wearing-briefs-boosts-erectile-dysfunction-risk-finds-26000-man-study-china", "fonte_id": "scmp", "data_pub": "2026-11-14T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo com 26.000 homens, publicado na Asian Journal of Andrology, sugere que usar calcinhas apertadas em vez de boxers pode aumentar o risco de disfunção erétil, ejaculação prematura e prostatite. O ajuste apertado também afeta a qualidade do esperma.", "titulo_pt": "Usar calcinhas apertadas aumenta risco de disfunção erétil, de acordo com estudo com 26 mil homens", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 263208, "titulo": "Ação humana devasta redes sociais que conectam elefantes fêmeas", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/acao-humana-devasta-redes-sociais-que-conectam-elefantes-femeas.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-14T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A presença humana está alterando as populações de elefantes-asiáticos, desestruturando suas redes sociais e reduzindo os contatos entre indivíduos. Isso está resultando em grupos menores e mais isolados.", "titulo_pt": "Ação humana desestrutura redes sociais de elefantes-asiáticos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 263824, "titulo": "New Scientist readers on how the magazine has shaped their lives", "url": "https://www.newscientist.com/article/2595857-new-scientist-readers-on-how-the-magazine-has-shaped-their-lives/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-14T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Para comemorar o 70º aniversário da revista, os leitores foram questionados sobre como eles primeiramente encontraram New Scientist e por que continuam a lê-lo até hoje.", "titulo_pt": "Leitores do new Scientist relatam como a revista moldou suas vidas", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 263790, "titulo": "SpaceX's Starship soars into orbit after booster explosion prevents an unprecedented double catch", "url": "https://phys.org/news/2026-11-spacex-starship-soars-orbit-booster.html", "fonte_id": "phys_org", "data_pub": "2026-11-14T06:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A tentativa de SpaceX de recuperar completamente o Starship na plataforma de lançamento falhou após o foguete explodir no Golfo do México. No entanto, a espaçonave ainda conseguiu entrar em órbita em seu teste mais ousado até agora.", "titulo_pt": "Espaçox's Starship decola para órbita após explosão do foguete impedir recuperação inédita", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 263291, "titulo": "Semana na COP31 fecha com esperados impasses nas negociações, protestos e cobranças da juventude", "url": "https://exame.com/esg/semana-na-cop31-fecha-com-impasses-nas-negociacoes-protestos-e-cobrancas-da-juventude/", "fonte_id": "exame", "data_pub": "2026-11-14T06:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No último dia da COP31, ocorreram impasses nas negociações, protestos e a Marcha pelo Clima. O Brasil buscava avanços nos acordos de Belém enquanto outros países divergiam sobre a decisão final.", "titulo_pt": "Semana na COP31 encerra com impasses, protestos e marcha pela climatologia", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 263729, "titulo": "Chinese scientists fired after child dies in world’s first brain gene-editing attempt", "url": "https://www.scmp.com/news/china/science/article/3374429/chinese-scientists-fired-after-child-dies-worlds-first-brain-gene-editing-attempt", "fonte_id": "scmp", "data_pub": "2026-11-14T06:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas envolvidos no primeiro tentativa mundial de edição genética no cérebro de uma criança, que resultou na morte de uma menina de seis anos em Shanghai, foram demitidos após uma investigação oficial que descobriu que eles violaram regras de pesquisa e receberam dinheiro da família da menina. A investigação, ordenada pelo Comitê Municipal do Partido Comunista de Shanghai e pelo governo local, concluiu que os pesquisadores não compartilharam resultados preocupantes de testes em macacos com os médicos da menina antes.", "titulo_pt": "Cientistas demitidos após morte de menina em primeiro tentativa mundial de edição genética no cérebro", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 263702, "titulo": "Record polar vortex breakdown raises cold weather risk", "url": "https://www.ft.com/content/576640c4-8d35-4504-b1a5-f01c0ca1f5bc?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-14T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O colapso precoce do sistema de vento que prende o ar ártico aumenta o risco de condições climáticas frias. Este é o último evento extremo atmosférico registrado.", "titulo_pt": "Colapso prematuro do vórtice polar aumenta risco de frio intenso", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 263791, "titulo": "The role of social relationships in scaling agricultural innovations: A dimension that remains underreported in research", "url": "https://phys.org/news/2026-11-role-social-relationships-scaling-agricultural.html", "fonte_id": "phys_org", "data_pub": "2026-11-14T02:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa publicada na Frontiers in Sustainable Food Systems demonstra que, embora as parcerias e a colaboração institucional sejam comuns em pesquisas agrícolas voltadas para o clima, sua relação com o processo de disseminação de inovações é raramente documentada. Os resultados indicam a necessidade de melhor compreender o papel das relações sociais para fortalecer o design, monitoramento e avaliação dos processos de disseminação.", "titulo_pt": "O papel das relações sociais na disseminação de inovações agrícolas: um aspecto subdestacado na pesquisa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 263792, "titulo": "Heavier-than-expected electron behavior may explain slower electrical flow in alpha-gallium oxide", "url": "https://phys.org/news/2026-11-heavier-electron-behavior-slower-electrical.html", "fonte_id": "phys_org", "data_pub": "2026-11-14T01:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O comportamento do elétron mais pesado do que o esperado pode explicar a corrente elétrica mais lenta em óxido de galio alfa. Materiais semicondutores que suportam altos níveis de tensão, transportam eletricidade eficientemente e dissipam calor eficientemente poderiam tornar os dispositivos de eletrônica de potência mais eficientes e confiáveis.", "titulo_pt": "Comportamento eletrônico mais pesado do que o esperado pode explicar a corrente elétrica mais lenta em óxido de galio alfa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 263810, "titulo": "FAA grounds all U.S. flights days after expanding its AI air traffic system", "url": "https://www.scientificamerican.com/article/faa-grounds-all-u-s-flights-days-after-expanding-its-ai-air-traffic-system/", "fonte_id": "scientific_american", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As paradas nacionais de voos deste tipo são extremamente raras. O governo dos Estados Unidos suspendeu todos os voos no país alguns dias após expandir seu sistema de controle de tráfego aéreo baseado em inteligência artificial.", "titulo_pt": "FAA suspende todos os voos nacionais dias após expandir seu sistema de controle de tráfego aéreo de IA", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 263793, "titulo": "Fiji petrel eludes 10-day search as communities aim to protect bird's habitat", "url": "https://phys.org/news/2026-11-fiji-petrel-eludes-day-communities.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T23:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas não conseguiram localizar uma das espécies de aves mais raras do planeta durante uma expedição de 10 dias nas águas próximas à ilha de Gau, Fiji. O petrele de Fiji, uma das espécies mais difícil de ser vista no mundo, é considerado criticamente em perigo de extinção, com menos de 50 indivíduos estimados em todo o planeta.", "titulo_pt": "Petrele de fiji evita busca de 10 dias enquanto comunidades buscam proteger seu habitat", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 263794, "titulo": "Unstable plasma heats itself with waves it generates, experiments reveal", "url": "https://phys.org/news/2026-11-unstable-plasma-generates-reveal.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T23:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Experiências mostraram que plasma imestável pode se aquecer por ondas que ele mesmo gera. A fusão nuclear é esperada como uma fonte de energia sustentável, sem emissão de dióxido de carbono durante a geração de eletricidade.", "titulo_pt": "Plasma instável se aquece com ondas que ele gera, revelam experimentos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 263829, "titulo": "SpaceX launches Starship on ambitious 22-hour Flight 15 test, but aborts booster 'chopsticks' catch (video)", "url": "https://www.space.com/space-exploration/launches-spacecraft/spacex-starship-flight-15-chopsticks-double-catch-super-heavy-ship", "fonte_id": "space_com", "data_pub": "2026-11-13T23:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX lançou o Starship durante sua 15ª teste novelesco, atingindo a órbita, mas cancelou a tentativa de capturar o grande foguete durante o retorno ao local de lançamento.", "titulo_pt": "Spacex realiza 15ª viagem de teste do Starship, mas cancela tentativa de capturar o foguete", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 263795, "titulo": "Same farms, different answers: When nitrogen pollution estimates don't add up", "url": "https://phys.org/news/2026-11-farms-nitrogen-pollution-dont.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T23:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Califórnia Central baseia-se em cinco conjuntos de dados para estimar o excesso de nitrogênio resultante de fertilizantes sintéticos e resíduos de suínos e aves. No entanto, a maioria dos Estados Unidos usa apenas um ou dois conjuntos de dados: a pesquisa agrícola e o censo do Departamento de Agricultura dos Estados Unidos.", "titulo_pt": "Mesmas fazendas, respostas diferentes: quando estimativas de poluição por nitrogênio não batem", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 263796, "titulo": "Hidden 'master switch' allows bacteria to breach the body's defenses", "url": "https://phys.org/news/2026-11-hidden-master-bacteria-breach-body.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T22:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Penn Dental Medicine descobririram uma mecanismo molecular desconhecido que permite que bactérias comprometam rapidamente as barreiras de defesa do corpo. Este achado pode revolucionar como os cientistas abordam uma ampla gama de doenças graves.", "titulo_pt": "Mecanismo oculto 'botão mestre' permite que bactérias invadam as defesas do corpo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 263789, "titulo": "STAT+: Enforcement of stringent Medicaid work requirements delayed for six months", "url": "https://www.statnews.com/2026/11/13/medicaid-work-requirements-implementation-delayed-six-months/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-13T22:21:00 de sua discografia e homenagem a Rosalía", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 263466, "titulo": "Crítica de discos: Kidd Voodoo y el Macha le cantan a la melancolía, Elyanna al mundo y Los Blue Splendor a la historia", "url": "https://www.latercera.com/culto/noticia/critica-de-discos-kidd-voodoo-y-el-macha-le-cantan-a-la-melancolia-elyanna-al-mundo-y-los-blue-splendor-a-la-historia/", "fonte_id": "la_tercera", "data_pub": "2026-11-14T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em novidades discográficas recentes, Los Blue Splendor reeditam um vinil importante de seu álbum, enquanto Kidd Voodoo e Macha e el Bloque Depresivo unem suas abordagens evocativas, criando um efeito interessante. Elyanna também lança seu trabalho.", "titulo_pt": "Crítica de álbuns: kidd Voodoo e Macha e el bloque depresivo cantam a melancolia, Elyanna ao mundo e Los Blue Splendor à história", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 263444, "titulo": "El Papa nos dejó una pregunta y una certeza", "url": "https://www.lanacion.com.ar/opinion/el-papa-nos-dejo-una-pregunta-y-una-certeza-nid14112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-14T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Papa deixou uma pergunta e uma certeza. O texto original não fornece detalhes adicionais sobre o que são exatamente essas pergunta e essa certeza.", "titulo_pt": "O Papa nos deixou uma pergunta e uma certeza", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 263446, "titulo": "Hasta siempre, León", "url": "https://www.lanacion.com.ar/conversaciones-de-domingo/hasta-siempre-leon-nid14112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-14T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto parece ser o início de um artigo ou nota sobre a morte de León, mas não fornece detalhes adicionais. Sem informações adicionais, não é possível r function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;

  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });

      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
