primeiro mensagem interstelar da humanidade.", "titulo_pt": "16 De novembro de 1974: o observatório Arecibo em Puerto Rico transmite a primeira mensagem interstelar da humanidade", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 268586, "titulo": "Super El Niño could leave South Africa short of grazing. Timing of livestock fodder crops is crucial", "url": "https://phys.org/news/2026-11-super-el-nio-south-africa.html", "fonte_id": "phys_org", "data_pub": "2026-11-16T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "South Africa está prestes a enfrentar um verão difícil para os agricultores devido ao Super El Niño. O fenômeno já está estabelecido e deve se intensificar ao longo de 2026, trazendo severas consequências para a produção de forragem para gado.", "titulo_pt": "Super El Niño pode deixar a áfrica do sul com déficit de pasto para o gado", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 268642, "titulo": "Relive Starship’s historic Flight 15 with our best photos from launch and ‘Mechazilla’ tower catch", "url": "https://www.space.com/space-exploration/launches-spacecraft/relive-starships-historic-flight-15-with-our-best-photos-from-launch-and-mechazilla-tower-catch", "fonte_id": "space_com", "data_pub": "2026-11-16T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foram publicadas as melhores fotos da decolagem histórica do Starship durante a Flight 15 e do momento marcante em que a 'Mechazilla' capturou a torre de lançamento.", "titulo_pt": "Reviva a histórica decolagem do Starship Flight 15 com nossas melhores fotos", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 268587, "titulo": "Wet climate may have helped corn reach Mexican highlands and crossbreed with wild grass", "url": "https://phys.org/news/2026-11-climate-corn-mexican-highlands-crossbreed.html", "fonte_id": "phys_org", "data_pub": "2026-11-16T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A evidência mais antiga de milho domesticado remonta a mais de 9.000 anos e foi encontrada nas baixadas do Vale do Rio Balsas, no sul da México. Durante esse período, caçadores-coletores nômade começaram a selecionar, coletar e plantar sementes de versões desejáveis de uma espécie de grama anual conhecida atualmente como teosinte.", "titulo_pt": "Clima úmido pode ter ajudado o milho a chegar às altitudes mexicanas e cruzar com uma espécie selvagem", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 268588, "titulo": "Catching AI's mistakes is a mental burden—and a drag on productivity", "url": "https://phys.org/news/2026-11-ai-mental-burden-productivity.html", "fonte_id": "phys_org", "data_pub": "2026-11-16T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitas pessoas notaram erros em respostas fornecidas por assistentes de inteligência artificial, o que requer tempo adicional para verificar a precisão e a ausência de viés. Um executivo relatou que agora inclui tempo extra em seu fluxo de trabalho para revisar cuidadosamente as informações fornecidas por ferramentas de AI.", "titulo_pt": "Capturar erros da AI representa um encargo mental e diminui a produtividade", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 268589, "titulo": "Chiral electronics: Researchers discover a disruptive interlayer in a promising material system", "url": "https://phys.org/news/2026-11-chiral-electronics-disruptive-interlayer-material.html", "fonte_id": "phys_org", "data_pub": "2026-11-16T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Martin Luther University Halle-Wittenberg e do Max Planck Institute for Microstructure Physics, em colaboração com o Centro de Eletrônica Cirrística, descobriram uma camada intermediária que explica por que é difícil medir algumas propriedades dos antiferromagnéticos, materiais considerados importantes para eletrônicos avançados.", "titulo_pt": "Eletrônico cirrístico: pesquisadores descobrem uma camada disruptiva em um sistema de material promissor", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 268609, "titulo": "STAT+: FDA approves new breast cancer drug, providing new option for some patients, boost for Roche", "url": "https://www.statnews.com/2026/11/16/fda-approves-new-roche-breast-cancer-drug/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-16T20:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA aprovou um novo medicamento para o câncer de mama da Roche, abrindo caminho para o lançamento de um remédio que a empresa espera se tornar seu produto mais vendido de todos os tempos.", "titulo_pt": "FDA aprova novo medicamento contra câncer de mama da Roche", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 268079, "titulo": "SpaceX divulga novas imagens de pouso inédito do Starship", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/spacex-divulga-novas-imagens-de-pouso-inedito-do-starship.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-16T20:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A SpaceX divulgou novas imagens do pouso inédito do Starship, que retornou à plataforma em Starbase após um voo de mais de 22 horas e 14 voltas terrestres no sábado (14).", "titulo_pt": "Spacex divulga novas imagens de pouso inédito do Starship", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 268590, "titulo": "Two transcription factors reproduce the beneficial side of a 'Jekyll and Hyde' viral protein", "url": "https://phys.org/news/2026-11-transcription-factors-beneficial-side-jekyll.html", "fonte_id": "phys_org", "data_pub": "2026-11-16T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os cientistas do Hiroshima University identificaram dois fatores de transcrição, Spi-B e IRF1, que reproduzem os efeitos antitumores do proteinato LMP1, um proteinato do vírus Epstein-Barr. A expressão desses dois fatores juntos torna as células tumorais mais visíveis ao sistema imunológico e melhor estimula a ativação de células T CD8+ sem a necessidade do proteinato viral.", "titulo_pt": "Dois fatores de transcrição reproduzem os benefícios de um proteinato viral 'Jekyll e Hyde'", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 268591, "titulo": "Annual water‑quality reports don't tell the full story of what you're drinking", "url": "https://phys.org/news/2026-11-annual-waterquality-dont-full-story.html", "fonte_id": "phys_org", "data_pub": "2026-11-16T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A água é vital para a vida, o que justifica o estudo dos componentes presentes nela. Os relatórios anuais de qualidade da água não contêm todas as informações sobre o que estamos bebendo.", "titulo_pt": "Relatórios anuais de qualidade da água não contêm a história completa do que você está bebendo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 268592, "titulo": "Root and mycelium pathways shape soil carbon dynamics in hyper-arid regions", "url": "https://phys.org/news/2026-11-root-mycelium-pathways-soil-carbon.html", "fonte_id": "phys_org", "data_pub": "2026-11-16T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores liderados por professores Zeng Fanjiang e Gao Yanju, do Instituto de Ecologia e Geografia do Xinjiang da Academia Chinesa de Ciências, descobriram os papéis contrastantes e complementares das raízes de plantas e micelios de micorrizas na dinâmica do carbono orgânico do solo durante a aforemento em regiões hiper-áridas. O estudo foi publicado na New Phytologist em 4 de novembro.", "titulo_pt": "Rotas de raízes e micelio moldam a dinâmica do carbono orgânico do solo em regiões hiper-áridas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 268616, "titulo": "NASA Receives 16th Consecutive ‘Clean’ Financial Audit Opinion", "url": "https://www.nasa.gov/news-release/nasa-receives-16th-consecutive-clean-financial-audit-opinion/", "fonte_id": "nasa_news", "data_pub": "2026-11-16T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA recebeu por 16 anos consecutivos uma opinião de auditoria 'limpa' em suas demonstrações financeiras do exercício fiscal de 2026. Este é o melhor possível, confirmando que as demonstrações financeiras da NASA conformam-se com os Princípios Gerais de Contabilidade Aceitos para Agências Federais e apresentam corretamente a posição financeira da agência.", "titulo_pt": "NASA recebe 16º exame financeiro consecutivo sem reservas", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 268593, "titulo": "Combined pollutants from wildfire smoke exacerbate health risks across US", "url": "https://phys.org/news/2026-11-combined-pollutants-wildfire-exacerbate-health.html", "fonte_id": "phys_org", "data_pub": "2026-11-16T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois poluentes aerossolares estão se combinando com mais frequência nos Estados Unidos contíguos à medida que os incêndios florestais se tornam maiores, aumentando os riscos à saúde, de acordo com uma equipe de pesquisa da Faculdade de Ciências da Terra e Minerais da Universidade Estatal Penn State.", "titulo_pt": "Poluentes combinados de fumaça de incêndio florestal agravam riscos à saúde nos EUA", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 268643, "titulo": "Elon Musk says SpaceX’s Starship, already the largest rocket on Earth, will get even bigger with next-gen V4 model", "url": "https://www.space.com/space-exploration/launches-spacecraft/elon-musk-says-spacexs-starship-already-the-largest-rocket-on-earth-will-get-even-bigger-with-next-gen-v4-model", "fonte_id": "space_com", "data_pub": "2026-11-16T20:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apenas um dia após SpaceX rec ata_pub": "2026-11-16T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um suspeito de 27 anos se passou por companheira da vítima, uma mulher de 31 anos, em uma conversa no WhatsApp. Após descobrir uma possível relação extraconjugal, o suspeito marcou um encontro com a vítima e a matou.", "titulo_pt": "Homem se passa por companheira no WhatsApp e mata suposto amante dela em MG", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 268142, "titulo": "O que se sabe sobre a primeira morte por mpox confirmada no Brasil", "url": "https://veja.abril.com.br/saude/o-que-se-sabe-sobre-a-primeira-morte-por-mpox-confirmada-no-brasil/", "fonte_id": "veja", "data_pub": "2026-11-16T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil registrou sua primeira morte por mpox e há mais de mil casos confirmados. O Ministério da Saúde adquiriu 25 mil doses de imunizantes para grupos prioritários.", "titulo_pt": "O que se sabe sobre a primeira morte por mpox confirmada no Brasil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 268513, "titulo": "Photos: California residents gather to watch massive El Nino-fuelled waves", "url": "https://www.aljazeera.com/gallery/2026/11/16/photos-california-residents-gather-to-watch-massive-el-nino-fuelled-waves?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-16T20:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A National Weather Service alertou que ondas de mais de 10 metros podem afetar partes da costa da Califórnia nos Estados Unidos. Os residentes da Califórnia estão reunidos para assistir às ondas massivas alimentadas pelo El Niño.", "titulo_pt": "Fotos: residentes da califórnia se reúnem para assistir às ondas gigantes alimentadas pelo El niño", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 268287, "titulo": "As 'cidades perdidas' da Amazônia que ficaram ocultas por séculos", "url": "https://www.bbc.com/portuguese/watch/c9e85x7ly1x6o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-16T20:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tecnologia Lidar revelou novas descobertas arqueológicas que mostram como sociedades antigas construíram assentamentos, redes de conexão e obras de engenharia na Amazônia. Essas 'cidades perdidas' ficaram ocultas por séculos.", "titulo_pt": "As 'cidades perdidas' da Amazônia que ficaram ocultas por séculos", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 268249, "titulo": "Data centers dos EUA emitem tanto quanto a Dinamarca, diz relatório", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/data-centers-dos-eua-emitem-tanto-quanto-a-dinamarca-diz-relatorio/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-16T20:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Harvard Business School mostrou que os grandes centros de dados nos Estados Unidos emitiram 25,7 milhões de toneladas de gás carbônico em um ano. Essa quantidade de emissões é comparável às emissões anuais da Dinamarca.", "titulo_pt": "Estudo revela que data centers dos EUA emitem tanto quanto a Dinamarca", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 268150, "titulo": "Sob alerta de ondas gigantes, Califórnia fecha píeres e praias famosas", "url": "https://veja.abril.com.br/mundo/sob-alerta-de-ondas-gigantes-california-fecha-pieres-e-praias-famosas/", "fonte_id": "veja", "data_pub": "2026-11-16T20:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ondas atingiram até 15 metros de altura no sábado, 14 de janeiro. O fenômeno super El Niño tem contribuído para a intensidade das águas na costa da Califórnia, levando a autoridades a fechar píeres e praias famosas como medida de precaução.", "titulo_pt": "Sob alerta de ondas gigantes, Califórnia fecha píeres e praias famosas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 267398, "titulo": "Instalaron una “llave de paso” para impedir que la basura llegue al Río de la Plata", "url": "https://www.lanacion.com.ar/sociedad/instalaron-una-llave-de-paso-para-impedir-que-la-basura-llegue-al-rio-de-la-plata-nid16112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-16T17:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um sistema chamado 'llave de paso' foi instalado no Puente La Noria para interceptar até 80% dos resíduos flutuantes antes que eles cheguem aos 15 quilômetros finais do Riachuelo, que dão acesso ao Río de la Plata.", "titulo_pt": "Instalaram uma 'chave de passagem' para impedir que a lixo chegue ao Río de la Plata", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 267417, "titulo": "Se aproxima un ciclón que aumentará la frecuencia de lluvias y tormentas, con picos de más de 180 milímetros: las zonas afectadas", "url": "https://www.lanacion.com.ar/sociedad/se-aproxima-un-ciclon-que-aumentara-la-frecuencia-de-lluvias-y-tormentas-con-picos-de-mas-de-180-nid16112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-16T17:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As precipitações se repetirão entre este lunes e o viernes em gran parte do país, com picos de acumulados superiores a 180 milímetros no noreste. Buenos Aires também terá rajadas intensas de vento.", "titulo_pt": "Se aproxima um ciclone que aumentará a frequência de chuvas e tempestades, com picos de mais de 180 milímetros: as zonas afetadas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 267847, "titulo": "Hong Kong embarks on green shipping collaboration with Greek port", "url": "https://www.scmp.com/news/hong-kong/hong-kong-economy/article/3374617/hong-kong-embarks-green-shipping-collaboration-greek-port", "fonte_id": "scmp", "data_pub": "2026-11-16T11:52:00Z", "idioma": "en", "provav orces-in-afghanistan_6782074_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-16T13:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os três juízes encerraram uma investigação aberta em 2020 sobre crimes como tortura, estupro e violência sexual cometidos por forças americanas no Afeganistão. Este encerramento representa uma importante vitória para os Estados Unidos, que haviam feito a conclusão do caso uma das condições para não serem sujeitos a sanções pela Corte até abril de 2027.", "titulo_pt": "ICC fecha caso sobre crimes cometidos por forças americanas no afeganistão", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 266568, "titulo": "El debate que toma fuerza en un condado latino de Florida: dejar al ICE fuera de cualquier acuerdo para detener inmigrantes", "url": "https://www.lanacion.com.ar/estados-unidos/florida/el-debate-que-toma-fuerza-en-un-condado-latino-de-florida-dejar-al-ice-fuera-de-cualquier-acuerdo-nid15112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-16T09:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um debate está ganhando força em um condado latino de Flórida sobre a exclusão do ICE (Serviço de Alfândega e Proteção de Fronteiras) de acordos para a detenção de imigrantes. A polícia local não possui agentes capacitados sob o acordo de 2025 e Doral aguarda a opinião do fiscal geral do estado.", "titulo_pt": "Debate cresce em condado latino de flórida: deixar o ICE fora de acordos de detenção de imigrantes", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 266591, "titulo": "⁠Informe de DD.HH. de la UDP advierte ausencia de “cifra clara ni verificable” en debate sobre niños y jóvenes que delinquen", "url": "https://www.latercera.com/nacional/noticia/informe-de-ddhh-de-la-udp-advierte-ausencia-de-cifra-clara-ni-verificable-en-debate-sobre-ninos-y-jovenes-que-delinquen/", "fonte_id": "la_tercera", "data_pub": "2026-11-16T09:29:00Z", " A demissão de Jensen Huang como CEO da Nvidia, devido a um escândalo de infidelidade, gerou uma série de reações e petições para sua readmissão. Uma petição com 180.000 assinaturas, apoiada por figuras influentes como Elon Musk, pressionou o conselho de administração a reconsiderar sua decisão. No entanto, o conselho decidiu não reconduzir Huang, apesar de declarações favoráveis de Donald Trump, que expressou interesse em vê-lo retornar à empresa. O movimento open-source e a crescente pressão de executivos de tecnologia e acionistas indicam que a questão do retorno de Huang continua a ser um tema de debate. O escândalo levanta questões sobre a governança corporativa e a importância de líderes de empresas tecnológicas. Além disso, a questão política, com Trump apoiando o retorno de Huang, sugere que a decisão pode ter implicações além da empresa, afetando a relação entre o governo dos EUA e a empresa. Os desdobramentos econômicos, humanitários e científicos ainda são incertos, mas a situação demonstra a importância de líderes de empresas tecnológicas em um cenário global complexo.", "data_edicao": "2026-11-16", "artigos": [{"id": 268365, "titulo": "Directorio de Nvidia no contempla el regreso de Jensen Huang como CEO", "url": "https://www.latercera.com/pulso/noticia/directorio-de-nvidia-no-contempla-el-regreso-de-jensen-huang-como-ceo/", "fonte_id": "la_tercera", "data_pub": "2026-11-16T21:07:00Z", "topico": "tecnologia", "idioma": "es", "texto_resumo": "A lista de diretores da Nvidia não inclui Jensen Huang, o CEO fundador, apesar de uma petição com 180.000 assinaturas e declarações de Trump sobre a possibilidade de Huang retornar ao cargo. A atenção está voltada para investigar o comportamento do fundador da empresa.", "titulo_pt": "Diretório da Nvidia não contempla retorno de Jensen Huang como CEO", "texto_pt": "A lista de diretores da Nvidia não inclui Jensen Huang, o CEO fundador, apesar de uma petição com 180.000 assinaturas e declarações de Trump sobre a possi let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);

  const arts = D.resumo_do_dia[topico] || [];

       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);

    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}

  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>

    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));

  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {

  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
