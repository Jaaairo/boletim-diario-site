<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>
const D = {"gerado_em": "03/11/2026 07:25", "stats": {"noticias_novas": 735, "resumos_gerados": 242}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Brasil enfrenta diversos desafios em diferentes frentes. Nesta terça-feira, o Supremo Tribunal Federal (STF) analisará seis ações, incluindo uma audiência pública sobre a proibição de apostas, onde o ministro Luiz Fux deve promover debates. A Proposta de Emenda à Constituição (PEC) da Segurança Pública, que visa ampliar a integração entre os órgãos responsáveis pelo combate ao crime organizado, pode ser votada no Senado nesta terça-feira. Além disso, o governo federal busca apoio para garantir a aprovação desta PEC, que não inclui a maioridade penal. Marina Silva irá à COP31 na Turquia, mas pode se encontrar com o presidente Lula. No Rio de Janeiro, Douglas Ruas está montando seu governo, tentando minimizar a influência de aliados, em especial do senador Flávio Bolsonaro. A expectativa é que Lula assegure sua disposição para a pacificação do país durante as negociações e pronunciamentos da semana. O economista José Sergio Gabrielli, coordenador do programa de governo de Lula, considera a situação fiscal brasileira menos dramática do que sugerem os defensores do ajuste, mas afirma que medidas para reduzir o déficit ainda são necessárias.", "mundo": "Zelenskyy fará uma visita inesperada a Berlim para conversar com Merz, em um cenário de tensões geopolíticas na Europa. O Reino Unido e a União Europeia chegaram a um acordo para eliminar as verificações aduaneiras em importações e exportações de alimentos e produtos animais, beneficiando os exportadores britânicos. O presidente sul-coreano Lee Jae Myung e o presidente turco Erdogan concordaram em fortalecer a cooperação em plantas nucleares e na indústria de defesa. A Coreia do Sul e o Japão concordaram em cooperar sobre os restos mortais afetados por uma mina submarina, com trabalhadores da Península Coreana tendo sido vítimas de inundações em 1942. As ações sul-coreanas caíram mais de 3% na segunda-feira devido a preocupações crescentes relacionadas à inteligência artificial. O presidente dos Estados Unidos viajará para Shenzhen em duas semanas para participar da cúpula APEC, com Estados Unidos, Rússia e China discutindo uma possibilidade de reunião entre Trump, Putin e Xi. O Japão considera quase dobrar os gastos com defesa nos próximos cinco anos, enquanto a presidente do ICC, Tomoko Akane, alerta que sanções impostas pelos Estados Unidos ameaçam a justiça internacional e o princípio da lei. A Coreia do Sul criticou os explosivos da Coreia do Norte e defendeu os disparos de advertência na fronteira, em uma situação de tensões entre as duas nações. A ONU divulgou uma carta da Coreia do Sul sobre esses eventos. Everton Ribeiro, um dos principais jogadores do Brasil, foi convocado para a seleção nacional para os próximos jogos. No entanto, ele decidiu se dedicar integralmente ao Flamengo, recusando a convocação. Este ato de lealdade ao clube gerou debate entre torcedores e fãs do jogador. A decisão de Everton Ribeiro de priorizar o Flamengo sobre a seleção nacional tem gerado discussões entre torcedores e fãs. Alguns apoiam sua decisão, argumentando que o jogador deve se concentrar em ajudar seu clube, enquanto outros criticam, acreditando que jogadores devem estar disponíveis para representar o país. A situação também levanta questionamentos sobre a relação entre clubes e seleções nacionais, destacando a importância de um equilíbrio entre os interesses dos clubes e a necessidade de jogadores na equipe nacional.\n\nA geopolítica global continua agitada com diversos incidentes e decisões importantes em diferentes regiões. Nos Estados Unidos, ataques militares contra a ilha de Qeshm, localizada no Irã, ocorreram no dia anterior às eleições de meio mandato, conforme relatado pela BBC Brasil e pelo Financial Times. O governo americano minimizou os riscos de guerra e manteve uma postura defensiva, com o secretário de Estado, Antony Blinken, esperando por uma solução negociada com Teerã. O presidente Donald Trump classificou o conflito com o Irã como 'uma guerra suave' horas antes da abertura das urnas, conforme informou a La Tercera. Por outro lado, o Irã manteve a postura de negociação, com Trump afirmando que um acordo com o país 'poderia acontecer', apesar das tensões persistentes. Em paralelo, a Ucrânia enfrenta intensos ataques aéreos russos, com o exército local sofrendo perdas históricas e o país resistindo a avanços territoriais, conforme relatado pelo Japan Times. O conflito também resultou em um ataque aéreo que matou pelo menos 26 pessoas em um centro de distribuição de ajuda em Zaporizhzhia, na Ucrânia, segundo o The Guardian. Além disso, a Coreia do Norte realizou um teste de míssil capaz de destruir áreas de até seis hectares, intensificando a tensão com os Estados Unidos e a Coreia do Sul, conforme informou a Euronews.", "economia": "A economia global enfrenta diversos desafios, com destaque para a inflação alimentar na Índia, devido a uma monção fraca, que elevou a inflação de alimentos no varejo para 7,74% em setembro. No Brasil, a primeira parcela do 13º salário será paga até 30 de novembro, beneficiando milhões de trabalhadores. O Banco Central (BC) está avaliando a decisão sobre os juros em um momento de mudanças nas expectativas do mercado, devido ao aumento do dólar e ao prêmio de risco associado ao Brasil. Além disso, a Apple registrou crescimento sólido no terceiro trimestre, com vendas fortes de iPhones e Macs, mas foi afetada por vendas abaixo das expectativas na China, em seu primeiro balanço sob o comando de Tim Cook. A Aramco registrou um aumento nos lucros devido ao fortalecimento das margens de refino durante o conflito com o Irã, enquanto a Coreia do Norte negou qualquer ligação à hack do Binance, embora pesquisadores tenham rastreado bilhões de dólares em criptomoedas roubadas através de várias redes. Na Coreia do Sul, o Grupo Hyundai subiu para o terceiro lugar nas vendas globais de automóveis, enquanto a BYD chinesa entrou no top cinco pela primeira vez, superando a Aliança Renault-Nissan, que caiu do top cinco. A Nvidia instruiu provedores de computação em nuvem a reduzir a exposição de seus clientes a mercados chineses, enquanto a China enfrenta a persistência da capacidade de produção excessiva na indústria de energia solar e na indústria de chips de memória. No mercado de criptoativos, a Binance sofreu um roubo histórico, perdendo mais de 6 bilhões de dólares em cerca de 20 minutos, reforçando o temor sobre a falta de segurança no ecossistema de criptoativos.", "tecnologia": "A Coreia do Sul planeja aumentar suas despesas em inteligência artificial e chips em 50% no próximo ano, em um esforço para manter sua competitividade global. Este anúncio surge em um momento em que a demanda por tecnologias relacionadas à IA está impulsionando a expansão das fábricas. A LG Energy Solution, por exemplo, registrou um aumento de 25,7% no lucro operacional trimestral devido à forte demanda por sistemas de armazenamento de energia. Em um desenvolvimento relacionado, a LG Uplus, empresa sul-coreana de telecomunicações, afirmou que a Coreia do Sul e o Japão podem encontrar sinergias em inteligência artificial de voz antes do desenvolvimento de 6G. Por outro lado, a Oracle planeja arrecadar US$20 bilhões através da venda de ações e emissão de títulos para financiar o desenvolvimento de sua iniciativa de inteligência artificial, refletindo a crescente preocupação dos investidores com o endividamento das grandes empresas tecnológicas. Além disso, a Apple está testando novas funcionalidades de Inteligência de Áudio no Apple Watch, que podem ajudar os usuários a lembrar do que foi dito em conversas ou a anotar detalhes. A onda de investimentos em IA continua, com startups como a Apolarion recebendo financiamento para avançar com sua tecnologia de tratamento de sementes baseada em plasma sem químicos.", "ciencia": "Um estudo recente, publicado no Journal of Archaeological Science, revelou que pessoas que viveram na Idade da Pedra no sul da Espanha praticavam canibalismo, com evidências encontradas em ossos em cavernas. Em outro desenvolvimento científico, a China realizou seu primeiro acoplamento espacial em 2011, um marco em seu programa espacial. Além disso, pesquisadores desenvolveram um novo material semiconductor com propriedades promissoras para aplicações em tecnologia avançada. Estudos sobre o clima e o câncer também merecem destaque: pesquisas mostram que áreas tropicais estão sofrendo mudanças significativas devido ao aquecimento global. Um medicamento anticancerígeno chinês, chamado iza-bren, dobrou a sobrevivência dos pacientes com câncer de pulmão avançado em um estudo clínico de fase 3. Finalmente, a China expandiu seu programa de doutorado prático para incluir estudantes de medicina clínica, permitindo-lhes obter o grau sem uma tese, com mais graduações desse tipo previstas para o futuro.", "cultura": "Em 2026, a palavra 'mogging', que significa superar ou superar alguém ou algo, foi escolhida como palavra do ano pela Collins, superando entradas relacionadas à IA e à crise climática. Steven Wilson lançou cinco álbuns de diversos gêneros musicais desde 2021. A série 'Tall Tales and Murder', uma comédia criminal irlandesa, estreou com Aidan Gillen no elenco. O festival gastronômico da Folha oferece uma variedade de pratos de diferentes culturas, incluindo franceses, asiáticos, mexicanos e árabes, bem como opções típicas brasileiras. A série 'The Gilded Age', ambientada na alta sociedade, recebeu Emmys e está em sua quarta temporada, apesar de ser considerada ruim. A próxima produção do James Bond, que substituiu Sean Connery por George Lazenby em 1969, é elogiada por cineastas como Christopher Nolan e Steven Soderbergh.", "sociedade": "Em 2022, um homem foi preso após abrir fogo contra um carro e atirar na cabeça de uma criança na Baixada Fluminense, no Rio de Janeiro, levantando discussões sobre segurança e responsabilidade civil. Em outro incidente, um engenheiro ambiental foi morto durante uma manifestação política em Santos, quando quatro pessoas o espancaram. A inadimplência atingiu 84 milhões de pessoas no país pela primeira vez, conforme dados da Serasa. A Coreia do Sul selecionou 43 regiões para uma nova iniciativa de reforma educacional com o objetivo de melhorar as pequenas escolas, reduzir disparidades educacionais e fortalecer a cooperação entre escolas, universidades e indústrias locais. Nathalia Gadelha Filgueiras, uma brasileira de 20 anos com 1.300 horas de voo, era copilota do avião que caiu na Flórida no domingo, resultando em nove mortes, incluindo ela. Martin Carnoy, professor da Universidade de Stanford, afirmou que a educação pode auxiliar, mas não corrige as desigualdades raciais significativas.", "meio_ambiente": "O superaquecimento global acima de 1,5°C, discutido no documento 'O superaquecimento: o aquecimento global acima de 1,5°C', continua sendo um tema de preocupação. Segundo o relatório da ONU e do IPCC, o derretimento das calotas polares está se acelerando, com a perda de gelo ocorrendo seis vezes mais rapidamente do que na década de 1990, mesmo que as temperaturas globais voltem a diminuir. O fenômeno natural 'Super El Niño' está intensificando, atingindo níveis inéditos e disparando eventos climáticos extremos, como o estado de emergência declarado no Chile. Além disso, a ONU alerta que um aquecimento global acima de 1,5°C aumentará os riscos de inundações, danos econômicos e ecológicos, além da escassez de água. A aviação é um dos principais responsáveis pelas emissões de CO2, sendo um dos meios de transporte mais prejudiciais ao clima, mas alterações nas rotas de voo e o uso de combustíveis sustentáveis podem significativamente reduzir esses impactos ambientais.", "direitos_humanos": "A Coreia do Sul realizará pela terceira vez consecutiva uma cerimônia de memorial separada para vítimas de trabalho forçado no mineiro de Sado, reforçando a importância de reconhecer e lembrar de violações passadas de direitos humanos. Em um evento separado, trabalhadores da indústria de vestuário em Bangladesh realizaram manifestações para pedir aumentos salariais mais significativos, afirmando que os salários actuais são insuficientes para atender às suas necessidades básicas. Além disso, uma mulher de 72 anos está sendo julgada em França por acusações de tortura fatais à sua filha de 4 anos nos anos 1980, reabrindo um caso frio após uma correspondência de DNA reabrir o caso. A Coreia do Sul também realizará uma cerimônia de memorial separada para vítimas de trabalho forçado no mineiro de Sado pela terceira vez consecutiva, mostrando a continuidade de esforços para reconhecer e lembrar de violações passadas de direitos humanos."}, "resumo_do_dia": {"politica_nacional": [{"id": 242039, "titulo": "OPINIÃO. Coragem. Porque o Brasil não é “isso aí”", "url": "https://braziljournal.com/opiniao-coragem-porque-o-brasil-nao-e-isso-ai", "fonte_id": "brazil_journal", "data_pub": "2026-11-03T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O autor concorda com a ideia de que o Brasil sempre enfrentou situações difíceis, mas discorda da atitude de resignação em relação ao resultado das eleições. Ele critica aqueles que se acomodam com a situação atual do país.", "titulo_pt": "Coragem. Porque o Brasil não é 'isso aí'", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 241926, "titulo": "Mercado Bitcoin bloqueia US$ 11 milhões após ataque hacker", "url": "https://www.poder360.com.br/poder-tech/mercado-bitcoin-bloqueia-us-11-milhoes-apos-ataque-hacker/", "fonte_id": "poder360", "data_pub": "2026-11-03T09:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A corretora Mercado Bitcoin bloqueou US$ 11 milhões após um ataque hacker. O valor total dos ativos envolvidos neste momento é estimado em US$ 38 milhões.", "titulo_pt": "Mercado Bitcoin bloqueia US$ 11 milhões após ataque hacker", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 241927, "titulo": "Anvisa certifica fábrica chinesa para produzir canetas emagrecedoras", "url": "https://www.poder360.com.br/poder-saude/anvisa-certifica-fabrica-chinesa-para-produzir-canetas-emagrecedoras/", "fonte_id": "poder360", "data_pub": "2026-11-03T09:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa Sinopep-Allsino recebeu a certificação da Anvisa para produzir insumos relacionados a canetas emagrecedoras. A certificação permite a fabricação de insumos para semaglutida e tirzepatida.", "titulo_pt": "Anvisa certifica fábrica brasileira para produzir insumos de canetas emagrecedoras", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 241928, "titulo": "Helicópteros colidem perto do Monte Everest e deixam um morto", "url": "https://www.poder360.com.br/poder-internacional/helicopteros-colidem-perto-do-monte-everest-e-deixam-um-morto/", "fonte_id": "poder360", "data_pub": "2026-11-03T09:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Helicópteros colidiram perto do Monte Everest nesta terça-feira, deixando uma pessoa morta e outra ferida. De acordo com autoridades nepalesas, o acidente ocorreu na região próxima ao monte.", "titulo_pt": "Helicópteros colidem perto do Monte Everest e deixam um morto", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 241929, "titulo": "Plenário do STF: saiba quais ações estão na pauta desta 3ª feira", "url": "https://www.poder360.com.br/poder-justica/plenario-do-stf-saiba-quais-acoes-estao-na-pauta-desta-3a-feira-2/", "fonte_id": "poder360", "data_pub": "2026-11-03T09:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O plenário do Supremo Tribunal Federal (STF) analisará seis ações nesta terça-feira. Além disso, Luiz Fux realizará uma audiência pública sobre a proibição das bets.", "titulo_pt": "Plenário do STF: saiba quais ações estão na pauta desta terça-feira", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 241930, "titulo": "Saiba qual é a agenda da semana", "url": "https://www.poder360.com.br/poder-economia/saiba-qual-e-a-agenda-da-semana/", "fonte_id": "poder360", "data_pub": "2026-11-03T09:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nesta terça-feira (3 de novembro), o ministro do STF Luiz Fux promove uma audiência sobre o fim das bets.", "titulo_pt": "Saiba qual é a agenda da semana", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 241931, "titulo": "STF faz audiência pública sobre bets nesta 3ª feira", "url": "https://www.poder360.com.br/poder-justica/stf-faz-audiencia-publica-sobre-bets-nesta-3a-feira/", "fonte_id": "poder360", "data_pub": "2026-11-03T09:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Audiência pública sobre bets será realizada na 2ª Turma do Supremo Tribunal Federal (STF) nesta terça-feira às 10h. Entidades envolvidas em ações sobre o mercado de apostas serão ouvidas.", "titulo_pt": "STF realiza audiência pública sobre bets nesta terça-feira", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 241885, "titulo": "Marina Silva irá à COP31 em missão da Câmara, mas pode integrar comitiva de Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/marina-silva-ira-a-cop31-em-missao-da-camara-mas-pode-integrar-comitiva-de-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-03T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marina Silva irá à COP31 na Turquia, onde pode se encontrar com o presidente Luiz Inácio Lula da Silva. Ela irá como parte de uma missão da Câmara.", "titulo_pt": "Marina Silva vai à COP31 em missão da Câmara, mas pode integrar comitiva de Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 241934, "titulo": "Negociações por base consistente e pronunciamento devem marcar semana de Lula", "url": "https://veja.abril.com.br/politica/negociacoes-por-base-consistente-e-pronunciamento-devem-marcar-semana-de-lula/", "fonte_id": "veja", "data_pub": "2026-11-03T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A expectativa é que Lula assegure sua disposição para a pacificação do país durante as negociações e pronunciamentos da semana. Seu compromisso com a pacificação já foi demonstrado durante a campanha.", "titulo_pt": "Negociações e pronunciamentos devem marcar semana de Lula com foco na pacificação do país", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 241935, "titulo": "PEC da Segurança Pública pode ser votada nesta terça-feira pelo Senado", "url": "https://veja.abril.com.br/politica/pec-da-seguranca-publica-pode-ser-votada-nesta-terca-feira-pelo-senado/", "fonte_id": "veja", "data_pub": "2026-11-03T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Proposta de Emenda à Constituição (PEC) da Segurança Pública pode ser votada nesta terça-feira no Senado. A proposta visa ampliar a integração entre os órgãos responsáveis pelo combate ao crime organizado.", "titulo_pt": "PEC da Segurança Pública pode ser votada nesta terça-feira pelo Senado", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 241979, "titulo": "Planalto entra em campo e quer maioridade penal fora da PEC da Segurança", "url": "https://www.metropoles.com/colunas/milena-teixeira/planalto-entra-em-campo-e-quer-maioridade-penal-de-fora-da-pec-da-seguranca", "fonte_id": "metropoles", "data_pub": "2026-11-03T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal está buscando apoio para garantir a aprovação da Proposta de Emenda Constitucional (PEC) da Segurança Pública, que não inclui a maioridade penal, ainda nesta semana. José Guimarães, supostamente um líder do governo, já conversou com lideranças partidárias para garantir votos.", "titulo_pt": "Planalto entra em campo e quer maioridade penal fora da PEC da Segurança", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 241980, "titulo": "PF apura voo que pode ter levado esposa e filhas de Flávio até a fronteira", "url": "https://www.metropoles.com/colunas/igor-gadelha/pf-apura-voo-que-pode-ter-levado-esposa-e-filhas-de-flavio-ate-a-fronteira", "fonte_id": "metropoles", "data_pub": "2026-11-03T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal está investigando um voo que pode ter transportado a esposa e as filhas de Flávio até Cascavel, Paraná, na manhã de terça-feira, 27 de outubro.", "titulo_pt": "PF investiga voo que pode ter levado esposa e filhas de Flávio até cascavel", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 242005, "titulo": "Quem é Talarico, candidato que pode “roubar” Texas dos republicanos?", "url": "https://www.cnnbrasil.com.br/internacional/quem-e-talarico-candidato-que-pode-roubar-texas-dos-republicanos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-03T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado estadual Talarico está concorrendo a uma vaga no Senado em um estado historicamente republicano para as eleições de 2026, mas det :00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente sul-coreano Lee Jae Myung e o presidente turco Erdogan concordaram em fortalecer a cooperação em plantas nucleares e na indústria de defesa.", "titulo_pt": "Lee e Erdogan concordam em fortalecer cooperação em plantas nucleares e indústria de defesa", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 242303, "titulo": "Cyclone Murasu makes landfall on India’s eastern coast", "url": "https://www.aljazeera.com/news/2026/11/3/cyclone-murasu-makes-landfall-on-indias-eastern-coast?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-03T09:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um forte ciclone chamado Murasu tocou terra na costa leste da Índia, derrubando árvores e cortando o fornecimento de energia elétrica. Este evento ocorreu apenas alguns dias após outro ciclone atingir a mesma região.", "titulo_pt": "Ciclone Murasu toca terra na costa leste da Índia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 242035, "titulo": "EUA lançam ataque contra ilha no Irã na véspera de eleições", "url": "https://www.bbc.com/portuguese/articles/cwnv0n61q72vo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-03T09:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Autoridades americanas descreveram os ataques à ilha de Qeshm, no Irã, como limitados e defensivos. Os ataques ocorreram na véspera de eleições nos Estados Unidos, segundo a CBS, parceira da BBC nos EUA.", "titulo_pt": "EUA lançam ataques contra ilha no Irã na véspera de eleições", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 242140, "titulo": "UK and EU agree deal to remove Brexit checks on food and animal products", "url": "https://www.theguardian.com/politics/2026/nov/03/deal-finalised-remove-brexit-checks-food-animal-products", "fonte_id": "guardian_world", "data_pub": "2026-11-03T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Reino Unido e a União Europeia chegaram a um acordo para eliminar as verificação aduaneiras em importações e exportações de alimentos e produtos animais, como salsichas, queijos e flores. O acordo beneficiará os exportadores britânicos de alimentos, que tiveram um declínio de um terço em suas vendas para a Europa desde 2019, e permitirá que pequenos varejistas no Reino Unido, como delicatês, voltem a comprar lotes menores de queijos e vinhos.", "titulo_pt": "Reino unido e ue chegam a acordo para eliminar verificação aduaneira em alimentos e produtos animais", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 242304, "titulo": "Sudan’s displaced return to new challenges in war-battered Khartoum", "url": "https://www.aljazeera.com/features/2026/11/3/sudans-displaced-return-to-new-challenges-in-war-battered-khartoum?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-03T09:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A capital Khartoum foi uma das primeiras e mais afetadas áreas pela guerra entre as Forças Armadas do Sudão (SAF) e as Forças de Segurança Popular (RSF).", "titulo_pt": "Sudão: deslocados retornam a novos desafios na guerra devastada Khartoum", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 242307, "titulo": "Candidates in Kansas urge supporters to mobilise on voting day", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/3/candidates-in-kansas-urge-supporters-to-mobilise-on-voting-day?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-03T09:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Candidatos em Kansas estão incentivando seus apoiadores a se mobilizarem no dia das eleições.", "titulo_pt": "Candidatos em Kansas pedem para apoiantes se mobilizarem no dia das eleições", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, "en", "provavel_duplicata_de": null, "texto_pt": "A Índia enfrenta inflação alimentar prolongada devido a uma monção fraca que ameaça as colheitas de inverno, o que pode levar a menores rendimentos de cultivo e ainda mais inflação alimentar. Atualmente, a inflação de alimentos no varejo está em 7,74% no mês de setembro.", "titulo_pt": "Índia enfrenta inflação alimentar prolongada devido a monção fraca", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 242137, "titulo": "RBA interest rates: Bullock says ‘pain now’ will prevent worse later as Reserve Bank hikes rates for fifth time", "url": "https://www.theguardian.com/australia-news/2026/nov/03/rba-interest-rates-decision-cash-rate-november-reserve-bank-australia", "fonte_id": "guardian_world", "data_pub": "2026-11-03T07:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Reserve Bank of Australia aumentou a taxaSelic para 4,85%, o nível mais alto desde 2008, em uma tentativa de combater a inflação persistente. O governador Michele Bullock afirmou que 'algum desconforto agora evitará piores consequências no futuro'.", "titulo_pt": "Taxa selic: bullock diz que 'dor agora' evitará piores consequências no futuro após a RBA elevar a taxa para 4,85%", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 242367, "titulo": "Oil prices steady at $106 after sharp declines", "url": "https://www.ft.com/content/d0ab9542-8542-4357-a534-ddbdd1a9678d?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-03T07:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os preços do petróleo estabilizaram em torno de US$106 após quedas significativas, com os traders aguardando desenvolvimentos na região do Oriente Médio.", "titulo_pt": "Preços do petróleo se estabilizam em us$106 após quedas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 242449, "titulo": "POSCO Future M says Hyundai Motor to consider investment in .com.br/economia/money/macroeconomia/bc-abre-decisao-sobre-juros-em-meio-a-mudanca-das-expectativas-do-mercado/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-03T07:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Banco Central (BC) está avaliando a decisão sobre os juros em um momento em que as expectativas do mercado mudaram, devido à alta do dólar e ao aumento do prêmio de risco associado ao Brasil, consequência do segundo turno das eleições que confirmou o quarto mandato de Lula.", "titulo_pt": "BC decide sobre juros em meio a mudanças nas expectativas do mercado", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 241891, "titulo": "Primeira parcela do 13º é paga até dia 30; veja datas e quem recebe", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/primeira-parcela-do-13o-e-paga-ate-dia-30-veja-datas-e-quem-recebe.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-03T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A primeira parcela do 13º salário será paga até 30 de novembro a trabalhadores sob CLT e servidores públicos. A data deste ano incide em uma segunda-feira.", "titulo_pt": "Primeira parcela do 13º é paga até 30 de novembro; confira datas e beneficiários", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 242294, "titulo": "North Korea denies links to Binance hack as researchers trace stolen billions", "url": "https://www.cnbc.com/2026/11/03/north-korea-binance-elliptic-chainalysis.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-03T06:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Norte negou qualquer ligação à hack do Binance, enquanto pesquisadores de blockchain rastrearam bilhões de dólares em criptomoedas roubadas através de várias redes.", "titulo_pt": "Coreia do norte nega ligação com hack do Binance enquanto pesquisadores rastreiam bilhões em criptomoedras", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 242347, "titulo": "Gilgeous-Alexander leads Thunder past Cavaliers", "url": "https://www.japantimes.co.jp/sports/2026/11/03/basketball/nba/nba-roundup-nov-2/", "fonte_id": "japan_times", "data_pub": "2026-11-03T06:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gilgeous-Alexander liderou o Oklahoma City Thunder a uma vitória sobre o Cleveland Cavaliers. O Oklahoma City havia passado por dificuldades recentemente devido a lesões e derrotas consecutivas por 20 pontos.", "titulo_pt": "Gilgeous-alexander lidera Thunder na vitória sobre Cavaliers", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 241953, "titulo": "Copom: mercado muda apostas e passa a prever manutenção da Selic na 1ª reunião após eleições", "url": "https://exame.com/economia/copom-mercado-muda-apostas-e-passa-a-prever-manutencao-da-selic-apos-eleicoes/", "fonte_id": "exame", "data_pub": "2026-11-03T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Contratos da B3 indicam que a maioria dos investidores espera que a taxa Selic permaneça estável na primeira reunião do Copom após as eleições. Itaú e Warren projetam manutenção da taxa em 13,75%, enquanto a Inter prevê um corte de 0,25 ponto percentual.", "titulo_pt": "Mercado altera expectativas e aposta em manutenção da Selic na primeira reunião do copom após as eleições", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 242425, "titulo": "Hanwha brings Korean defense, manufacturing ETFs to Abu Dhabi", "url": "https://www.koreaherald.com/article/10924242", "fonte_id": "korea_herald", "data_pub": "2026-11-03T05:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Hanwha Asset Management listou seus dois fundos de índice negociados em bolsa nos Estados Unidos, que acompanham os setores de defesa e manufatura da Coreia do Sul, na Bolsa de Valores de Abu Dhabi, nos Emirados Árabes Unidos. O ETF Plus Korea Defense Industry Index e o ETF Plus Korea Manufacturing Core Alliance Index começaram a negociar na ADX na segunda-feira.", "titulo_pt": "Hanwha traz ETFs de defesa e manufatura coreanos para Abu Dhabi", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 242430, "titulo": "Labor dispute halts Hyundai Motor's Genesis production for second day", "url": "https://www.koreaherald.com/article/10924213", "fonte_id": "korea_herald", "data_pub": "2026-11-03T05:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A produção do veículo Genesis, da Hyundai Motor, na fábrica de Ulsan, sul da Coreia do Sul, permaneceu suspensa por mais um dia, totalizando dois dias consecutivos. A paralisação ocorre devido a um conflito de trabalho relacionado às exigências de pessoal para novos modelos.", "titulo_pt": "Conflito de trabalho suspende produção do Genesis na Hyundai Motor por segundo dia", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 242433, "titulo": "Hyundai Motor Group takes third, BYD breaks into global top five in Q3 sales", "url": "https://www.koreaherald.com/article/10924193", "fonte_id": "korea_herald", "data_pub": "2026-11-03T05:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas globais de automóveis tiveram uma reorganização após sete anos, com marcas chinesas expandindo sua presença internacional. O Grupo Hyundai subiu para o terceiro lugar, enquanto a BYD chinesa entrou no top cinco pela primeira vez. O Grupo Toyota manteve o primeiro lugar com 2,74 milhões de veículos vendidos no terceiro trimestre, seguido pelo Grupo Volkswagen com 1,89 milhões e pelo Grupo Hyundai com 1,76 milhões. A BYD vendeu 1,32 milhão de veículos, ultrapassando a Aliança Renault-Nissan, que caiu do top cinco.", "titulo_pt": "Hyundai Motor Group assume terceiro lugar, BYD entra no top cinco global em vendas de outono", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 242369, "titulo": "Nvidia orders data centre clients to reduce China exposure", "url": "https://www.ft.com/content/1902df70-1380-4588-bad5-171352b575f2?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-03T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia instruiu provedores de computação em nuvem a reduzirem a exposição de seus clientes a mercados chineses. A maior fabricante de chips do mundo exige que a maioria dos clientes dessas empresas não seja de origem chinesa.", "titulo_pt": "Nvidia ordena a clientes de centros de dados reduzirem exposição à China", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 242232, "titulo": "Elon Musk's next target: A major shake-up of America's wireless market", "url": "https://www.axios.com/2026/11/03/elon-musk-spacex-boost-mobile-wireless-market", "fonte_id": "axios", "data_pub": "2026-11-03T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Elon Musk está planejando revolucionar o mercado de wireless dos Estados Unidos, potencialmente introduzindo uma ameaça competitiva significativa após anos de estagnação em uma indústria dominada por três grandes empresas. Musk possui os recursos necessários, incluindo espectro de frequência e rede de satélites, para tentar algo diferente, embora enfrente desafios consideráveis.", "titulo_pt": "Elon Musk alvo próximo: uma forte reorganização do mercado de wireless dos EUA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 242541, "titulo": "Venture Kick backs Apolarion with €164K to advance plasma-based seed treatment", "url": "https://tech.eu/2026/11/03/venture-kick-backs-apolarion-with-eur164k-to-advance-plasma-based-seed-treatment/", "fonte_id": "tech_eu", "data_pub": "2026-11-03T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup suíça Apolarion, uma spin-off da EPFL, recebeu €164 mil do Venture Kick para avançar com sua tecnologia de tratamento de sementes baseada em plasma sem químicos. Fundada por Jesus Poley e Luke Simo, a empresa busca desenvolver soluções sustentáveis para o tratamento de sementes.", "titulo_pt": "Venture Kick investe €164 mil no Apolarion para avançar em tratamento de sementes sem químicos", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 242542, "titulo": "Scottish startup 1nhaler secures £2.2M to replace bulky plastic inhalers with cardboard", "url": "https://tech.eu/2026/11/03/scottish-startup-1nhaler-secures-ps22m-to-replace-bulky-plastic-inhalers-with-cardboard/", "fonte_id": "tech_eu", "data_pub": "2026-11-03T09:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup escocesa 1nhaler recebeu £2,2 milhões adicionais para desenvolver sua inovadora inhaler feita de papelão, visando a primeira aprovação regulatória. O financiamento foi liderado pela Archangels.", "titulo_pt": "Startup escocesa 1nhaler garante £2,2M para inhaler de papelão", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 242391, "titulo": "‘At some point it’s going to be too much’: global financiers grapple with AI risks", "url": "https://www.scmp.com/business/banking-finance/article/3373108/some-point-its-going-be-too-much-global-financiers-grapple-ai-risks", "fonte_id": "scmp", "data_pub": "2026-11-03T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Global asset managers alertaram durante uma conferência em Hong Kong sobre o risco de que a expansão da inteligência artificial possa superar a capacidade das mercados de dívida, redes elétricas e produtividade corporativa. A investimento em infraestrutura de IA pode chegar a US$10 trilhões nos próximos cinco anos, aproximando-se do tamanho do mercado de títulos dos EUA de US$12 trilhões.", "titulo_pt": "Em algum momento, isso vai ser demais: gestores globais de ativos se debatem com riscos da IA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 242478, "titulo": "onsemi's AI data center revenue surges 175% as 3Q26 earnings outpace sales growth", "url": "https://www.digitimes.com/news/a20261103VL219/onsemi-data-center-demand-growth-revenue-sales.html", "fonte_id": "digitimes", "data_pub": "2026-11-03T08:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "onsemi apresentou resultados do terceiro trimestre de 2026 superiores às expectativas, impulsionados pela demanda acelerada de soluções de gerenciamento de energia em centros de dados de inteligência artificial e em aplicações industriais. A empresa melhorou a lucratividade através de reestruturações operacionais e a adoção de produtos de maior valor.", "titulo_pt": "Receita de centros de dados de IA da onsemi cresce 175% no 3º trimestre de 2026, superando as vendas", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 242419, "titulo": "Seoul shares dip over 3% amid escalating AI woes", "url": "https://www.koreaherald.com/article/10924490", "fonte_id": "korea_herald", "data_pub": "2026-11-03T08:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações sul-coreanas caíram mais de 3% na segunda-feira, impulsionadas por vendas massivas em tecnologia devido a crescentes problemas relacionados ao alto investimento em inteligência artificial. O índice da Bolsa de Seul, KOSPI, fechou em 5.648,79 pontos, uma queda de 210,29 pontos ou 3,59%.", "titulo_pt": "Seul perde mais de 3% em meio a crescentes problemas com investimentos em IA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 242479, "titulo": "Motorola taps Taboola to bring trusted-media AI to smartphones", "url": "https://www.digitimes.com/news/a20261103PD228/motorola-advertising-smartphone-2026-gemini.html", "fonte_id": "digitimes", "data_pub": "2026-11-03T08:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de publicidade de performanc  "fonte_id": "tech_eu", "data_pub": "2026-11-03T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup austríaca Tumbleweed levantou €6,9 milhões em uma rodada de semente, que é a maior da história do setor espacial na Áustria, apenas quatro meses após o lançamento do primeiro satélite comercial do país. A PactVC liderou essa rodada.", "titulo_pt": "Tumbleweed arrecada €6,9 milhões em rodada de semente para trazer pesquisas microgravidade à massa", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 242545, "titulo": "Portuguese AI startup Granter bags €1.6M to expand across Europe", "url": "https://tech.eu/2026/11/03/portuguese-ai-startup-granter-bags-eur16m-to-expand-across-europe/", "fonte_id": "tech_eu", "data_pub": "2026-11-03T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup portuguesa Granter levantou €1,6 milhão para expandir sua plataforma de inteligência artificial que facilita o acesso aos programas de financiamento europeus. O financiamento foi liderado por 3XP Global através de sua plataforma.", "titulo_pt": "Startup portuguesa Granter recebe €1,6 milhão para expansão na Europa", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 242480, "titulo": "Memory price surge hits smartphones, cutting 2026 mobile SoC shipments nearly 20%", "url": "https://www.digitimes.com/news/a20261103PD229/soc-shipments-infrastructure-2026-mobile.html", "fonte_id": "digitimes", "data_pub": "2026-11-03T07:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O aumento dos preços da memória, impulsionado pelo boom da infraestrutura de inteligência artificial, está afetando as vendas de smartphones e notebooks, reduzindo as projeções de embarque de SoC móveis para 2026 em cerca de 20%. Com preços de memória previstos para continuar subindo até 2027, observadores do setor esperam que as vendas no mercado final permaneçam fracas.", "titulo_pt": "Aumento dos preços de memória impacta smartphones, cortando embarques de SoC móveis em 20%", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 242451, "titulo": "LG Uplus CTO says S. Korea, Japan could find synergies in voice AI ahead of 6G", "url": "https://en.yna.co.kr/view/AEN20261103009900320", "fonte_id": "yonhap_news", "data_pub": "2026-11-03T07:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe de tecnologia da LG Uplus, uma empresa sul-coreana de telecomunicações, afirmou que Coreia do Sul e Japão podem encontrar sinergias em inteligência artificial de voz antes do desenvolvimento de 6G. A declaração foi feita em Seul, em 3 de novembro.", "titulo_pt": "CTO da LG Uplus afirma que Coreia do sul e Japão podem encontrar sinergias em AI de voz antes de 6G", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 242481, "titulo": "Panasonic Industry to invest JPY92 billion in AI-related circuit board materials and capacitors", "url": "https://www.digitimes.com/news/a20261103PD224/panasonic-materials-investment-2026-subsidiary.html", "fonte_id": "digitimes", "data_pub": "2026-11-03T07:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Panasonic Industry, uma subsidiária de componentes eletrônicos do grupo Panasonic, planeja investir aproximadamente 92 bilhões de ienes (cerca de 582,8 milhões de dólares) em seus negócios relacionados à IA para atender à crescente demanda impulsionada pela IA gerativa. O investimento acelerará a expansão da capacidade de produção e o desenvolvimento de pesquisa e desenvolvimento para materiais de placas de circuito avançados, capacitores especializados e materiais de semicondutores next-generation.", "titulo_pt": "Panasonic Industry investirá 92 bilhões de ienes em materiais de circuitos e capacitores relacionados à IA", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 242468, "titulo": "Apple Watch’s AI features for rewinding and recapping conversations begin beta testing", "url": "https://techcrunch.com/2026/11/02/apple-watchs-ai-features-for-rewinding-and-recapping-conversations-begin-beta-testing/", "fonte_id": "techcrunch", "data_pub": "2026-11-03T07:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple está testando novas funcionalidades de Inteligência de Áudio no Apple Watch, que podem ajudar os usuários a lembrar do que foi dito em conversas ou a anotar detalhes. Essas funcionalidades estão em fase beta.", "titulo_pt": "Funcionalidades de inteligência de áudio do apple Watch para regravar e resumir conversas entram em teste beta", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 242452, "titulo": "(LEAD) KAI Q3 net plunges 51.3 pct despite strong sales growth", "url": "https://en.yna.co.kr/view/AEN20261103010000320", "fonte_id": "yonhap_news", "data_pub": "2026-11-03T07:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A KAI, indústria aeroespacial sul-coreana, registrou uma queda de 51,3% nos lucros líquidos no terceiro trimestre de 2022, apesar do crescimento nas vendas.", "titulo_pt": "Lucros líquidos da KAI caem 51,3% no terceiro trimestre, apesar de vendas em alta", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 242570, "titulo": "Vibrating mattress helps clear Alzheimer’s protein from the brain", "url": "https://www.newscientist.com/article/2597081-vibrating-mattress-helps-clear-alzheimers-protein-from-the-brain/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-03T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pessoas que se deitaram por 40 minutos em uma cama vibratória e tomaram duas pílulas que liberam nitrogênio óxido no corpo tiveram um aumento na remoção de uma proteína relacionada à doença de Alzheimer através do sistema de eliminação do lixo do cérebro.", "titulo_pt": "Cama vibratória ajuda a remover proteína relacionada à Alzheimer do cérebro", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 242514, "titulo": "Opinion: What the 2024 electoral map reveals about America’s mortality divide", "url": "https://www.statnews.com/2026/11/03/electoral-map-reveals-red-state-blue-state-mortality-gap/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-03T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os principais fatores de mortalidade se apresentam de maneira diferente conforme a geografia política, de acordo com os especialistas.", "titulo_pt": "Opinião: o que o mapa eleitoral de 2024 revela sobre a divisão de mortalidade na américa", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 242515, "titulo": "Opinion: How meditation helped me become a better doctor overnight", "url": "https://www.statnews.com/2026/11/03/traumatic-eye-injuries-ophthalmologist-meditation-psychology/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-03T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um médico escreve que a prática da meditação e do autoquestionamento interno pode apoiar o trabalho externo de cuidar de pacientes.", "titulo_pt": "Opinião: como a meditação me ajudou a ser um médico melhor de forma imediata", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 242516, "titulo": "‘Three-parent IVF’ was supposed to prevent mitochondrial disease. Studies are raising doubts", "url": "https://www.statnews.com/2026/11/03/three-parent-ivf-safety-ethics-questions-mitochondrial-replacement-technology/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-03T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores e éticos estão reconsiderando os riscos e benefícios de uma tecnologia projetada para prevenir bebês de herdar doenças mitocondriais raras. Estudos estão levantando dúvidas sobre a eficácia e segurança do método.", "titulo_pt": "Tecnologia de 'três pais' IVF está sendo reconsiderada por causa de novos estudos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 242517, "titulo": "Monarch butterflies get tiny trackers to help scientists follow their mysterious migration", "url": "https://phys.org/news/2026-11-monarch-butterflies-tiny-trackers-scientists.html", "fonte_id": "phys_org", "data_pub": "2026-11-03T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas estão colocando rastreadores microscópicos em monarquias para localizar os pontos de parada importantes durante suas migrações anuais pelo continente norte-americano. Isso visa identificar locais essenciais antes que possam desaparecer.", "titulo_pt": "Cientistas colocam rastreadores em borboletas monarquias para traçar suas migrações", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 241884, "titulo": "Ossos em cavernas na Espanha mostram prática de canibalismo na Idade da Pedra", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/ossos-em-cavernas-na-espanha-mostram-pratica-de-canibalismo-na-idade-da-pedra.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-03T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pessoas que viviam em cavernas no sul da Espanha durante a Idade da Pedra consumiram carne humana, de acordo com um estudo publicado no Journal of Archaeological Science no mês passado.", "titulo_pt": "Ossos em cavernas na Espanha indicam prática de canibalismo na Idade da Pedra", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 242571, "titulo": "Boiling frog syndrome is often called a myth – but is it?", "url": "https://www.newscientist.com/article/2596833-boiling-frog-syndrome-is-often-called-a-myth-but-is-it/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-03T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Existe uma metáfora popular que afirma que rãs podem se aquecer lentamente até serem cozidas se não perceberem o aumento gradual da temperatura. Embora seja considerada um mito na ciência, um colunista chamado James Woodford encontrou evidências contrárias em seu próprio quintal.", "titulo_pt": "Síndrome da rã aquecida é frequentemente chamada de mito - mas será que não é?", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 242338, "titulo": "Japan’s newest female astronaut wants to speak Japanese on the moon", "url": "https://www.japantimes.co.jp/news/2026/11/03/japan/science-health/jaxa-yoneda-astronaut/", "fonte_id": "japan_times", "data_pub": "2026-11-03T08:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ayu Yoneda, a mais jovem astronauta da Agência Espacial Japonesa, está pronta para sua primeira missão. Ela planeja falar japonês na lua.", "titulo_pt": "Nova astronauta japonesa mais jovem quer falar japonês na lua", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 242396, "titulo": "China’s historic first space docking in 2011 – SCMP archive", "url": "https://www.scmp.com/news/china/science/article/3373086/chinas-historic-first-space-docking-2011-scmp-archive", "fonte_id": "scmp", "data_pub": "2026-11-03T08:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 4 de novembro de 2011, a China realizou seu primeiro acoplamento espacial histórico, marcando um passo importante para o desenvolvimento de sua estação espacial. Segundo a spokeswoman Wu Ping, mais dois acoplamentos serão realizados no ano seguinte, com a construção da estação espacial programada para começar em 2013.", "titulo_pt": "China realiza primeiro acoplamento espacial histórico em 2011", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 242399, "titulo": "Chinese drug iza-bren doubles lung cancer survival window in phase 3 trial", "url": "https://www.scmp.com/news/china/science/article/3373061/chinese-drug-iza-bren-doubles-lung-cancer-survival-window-phase-3-trial", "fonte_id": "scmp", "data_pub": "2026-11-03T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um medicamento anticancerígeno desenvolvido pela Sichuan Biokin Pharmaceutical, chamado iza-bren, mostrou um benefício significativo em comparação com a quimioterapia baseada em platina em um estudo clínico de fase 3 envolvendo 432 pacientes com câncer de pulmão avançado em 73 hospitais chineses. O estudo foi apresentado em uma sessão oral tardia na Conferência da Sociedade Europeia de Oncologia Médica em Madri.", "titulo_pt": "Medicamento chinês iza-bren duplica janela de sobrevivência no câncer de pulmão em estudo de fase 3", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 242554, "titulo": "APOD: 2026 November 3 – Comet PanSTARRs and Rainbow Meteor", "url": "https://science.nasa.gov/image-article/apod-2026-november-3-comet-panstarrs-and-rainbow-meteor/", "fonte_id": "nasa_news", "data_pub": "2026-11-03T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia do APOD em 3 de novembro de 2026 mostra o cometa PanSTARRs e um meteoro multicolorido. A imagem destaca a interação entre o cometa e o meteoro no céu noturno.", "titulo_pt": "APOD: 3 de novembro de 2026 – cometa PanSTARRs e meteoro de raios", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 242555, "titulo": "The Pacific’s Busy Storm Season", "url": "https://science.nasa.gov/earth/earth-observatory/the-pacifics-busy-storm-season/", "fonte_id": "nasa_news", "data_pub": "2026-11-03T05:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Super Tufão In-fa desenvolveu um olho incomumente grande, e os restos do Tufão Champi se transformaram em uma tempestade extratropical que atingiu a Alasca.", "titulo_pt": "Temporada de tempestades ativa no pacífico", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 242519, "titulo": "How political disagreement with our neighbors relates to whether we bother casting a ballot", "url": "https://phys.org/news/2026-11-political-disagreement-neighbors-bother-ballot.html", "fonte_id": "phys_org", "data_pub": "2026-11-03T03:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No pleito federal de 2025, a taxa de votação canadense atingiu o nível mais alto desde 1993. As explicações para taxas de votação altas ou baixas geralmente se concentram na campanha eleitoral nacional, incluindo a proximidade do pleito e o que estava em jogo.", "titulo_pt": "Como a discordância política com vizinhos se relaciona com a participação nas eleições", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 242520, "titulo": "Study dives into lesser-known climate impacts of global reforestation", "url": "https://phys.org/news/2026-11-lesser-climate-impacts-global-reforestation.html", "fonte_id": "phys_org", "data_pub": "2026-11-03T02:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade Simon Fraser estão explorando os efeitos climáticos menos conhecidos das iniciativas de reflorestamento global além da remoção de CO₂ em um novo estudo.", "titulo_pt": "Estudo explora impactos climáticos menos conhecidos do reflorestamento global", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 242521, "titulo": "Ceres' water ice can mask massive surface salt deposits", "url": "https://phys.org/news/2026-11-ceres-ice-mask-massive-surface.html", "fonte_id": "phys_org", "data_pub": "2026-11-03T02:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A superfície do planeta anão Ceres pode conter grandes depósitos de sal sob uma camada de gelo de água. Ceres é considerada uma das objetos planetários menos apreciados do sistema solar, apesar de ser o maior objeto do cinturão principal e compor cerca de 25% a 30% da sua massa total.", "titulo_pt": "Gelo de água pode ocultar vastos depósitos de sal na superfície de ceres", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 242522, "titulo": "Climate change is making the tropics hotter", "url": "https://phys.org/news/2026-11-climate-tropics-hotter.html", "fonte_id": "phys_org", "data_pub": "2026-11-03T02:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo descobriu que áreas tropicais, frequentemente consideradas resistentes aos efeitos do aquecimento global, estão experimentando mudanças significativas na precipitação e eventos extremos de temperatura. O artigo 'Mudanças climáticas nas florestas tropicais do Caribe: tendências a longo prazo em La Selva (Costa Rica) e El Verde (Puerto Rico)' foi publicado em PLOS Climate.", "titulo_pt": "Clima está alterando áreas tropicais do caribe", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 242600, "titulo": "What Fly Fishing Taught Me About Writing Fiction", "url": "https://lithub.com/what-fly-fishing-taught-me-about-writing-fiction/", "fonte_id": "lithub", "data_pub": "2026-11-03T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto descreve a versão romântica do pesca-trotro que é frequentemente retratada no cinema. O autor não critica essa visão, reconhecendo que há um motivo para esse tipo de romantização.", "titulo_pt": "O que pesca-trotro Me ensinou sobre escrita de ficção", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 242601, "titulo": "How J.R.R. Tolkien’s Strong Catholic Faith Influenced His Writing", "url": "https://lithub.com/how-j-r-r-tolkiens-strong-catholic-faith-influenced-his-writing/", "fonte_id": "lithub", "data_pub": "2026-11-03T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto explora como a fé católica forte de J.R.R. Tolkien influenciou sua escrita. A comparação sugere que a fé era tão integrada à obra de Tolkien que é difícil separá-la de sua visão do mundo.", "titulo_pt": "Como a fé católica de J.R.R. Tolkien influenciou sua escrita", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 242602, "titulo": "“Mirror,” a Poem by Jana Prikryl", "url": "https://lithub.com/mirror-a-poem-by-jana-prikryl/", "fonte_id": "lithub", "data_pub": "2026-11-03T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A poeta Jana Prikryl descreve um sonho onde sua mão esquerda foi removida, mas ainda está conectada ao corpo, e a mente cria uma imagem rearranjada do corpo.", "titulo_pt": "Mirror", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 242603, "titulo": "On the Film NAZA and the Ethics of Documentary Art", "url": "https://lithub.com/on-the-film-naza-and-the-ethics-of-documentary-art/", "fonte_id": "lithub", "data_pub": "2026-11-03T09:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O filme NAZA terminou com um quadro escuro que provocou choros no público, mas ninguém saiu do cinema durante a sessão lotada.", "titulo_pt": "Sobre o filme NAZA e a ética do documentário artístico", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 242562, "titulo": "‘Mogging’ crowned Collins word of the year", "url": "https://www.theguardian.com/uk-news/2026/nov/03/mogging-crowned-collins-word-of-the-year", "fonte_id": "guardian_culture", "data_pub": "2026-11-03T09:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O termo 'mogging', que significa superar ou superar alguém ou algo, foi escolhido como palavra do ano pela Collins em 2026. O termo foi escolhido acima de entradas relacionadas à IA e à crise climática.", "titulo_pt": "'Mogging' coroa palavra do ano da Collins", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 242604, "titulo": "Mary Beth Keane on Writing a Novel of the Irish Diaspora", "url": "https://lithub.com/mary-beth-keane-on-writing-a-novel-of-the-irish-diaspora/", "fonte_id": "lithub", "data_pub": "2026-11-03T09:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mary Beth Keane escreveu seu quinto romance, Whale Harbor, inspirado na imigração irlandesa. A autora tem linhagem familiar que inclui uma bisavó paterna que imigrou do Condado de Cork para Galveston no século XIX.", "titulo_pt": "Mary Beth Keane sobre a escrita de um romance sobre a diáspora irlandesa", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 242557, "titulo": "The 2026 John Lewis Christmas advert is here – and it’s Kristin Scott Thomas v Pickles the evil AI overlord puppy!", "url": "https://www.theguardian.com/tv-and-radio/2026/nov/03/john-lewis-christmas-advert-2026-kristin-scott-thomas-pickles-ai-dog", "fonte_id": "guardian_culture", "data_pub": "2026-11-03T09:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este ano, o anúncio de Natal da John Lewis apresenta um cenário onde chatbots dominam e os humanos são suprimidos. Embora não cause a mesma sensação de expectativa que antes, sua liberação ainda é considerada um evento importante.", "titulo_pt": "Anúncio de natal da John Lewis de 2026: Kristin Scott Thomas x Pickles, o vilão AI", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 242086, "titulo": "Antonio Machado, escritor: “De la muerte, decía Epicuro, es algo que no debemos temer”", "url": "https://www.lanacion.com.ar/lifestyle/antonio-machado-escritor-de-la-muerte-decia-epicuro-es-algo-que-no-debemos-temer-nid02112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-03T09:06:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O escritor espanhol Antonio Machado, em uma obra publicada há quase um século, retomou uma ideia de Epicuro e questionou a eficácia da lógica para aliviar o temor da morte.", "titulo_pt": "Antonio Machado, escritor: ‘de morte, dizia Epicuro, é a na indomável", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 242564, "titulo": "Honouring the departed: All Souls’ Day observed in India and Bangladesh – in pictures", "url": "https://www.theguardian.com/society/gallery/2026/nov/03/honouring-the-departed-all-souls-day-observed-in-india-and-bangladesh-in-pictures", "fonte_id": "guardian_culture", "data_pub": "2026-11-03T08:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Devotos se reúnem em Dhaka, Bangladesh, e em várias partes da Índia para comemorar o Dia das Almas, dedicado à memória e honra dos falecidos. A ocasião une membros da comunidade cristã para rezar pelos entes queridos falecidos e refletir sobre a vida, a morte e a memória através da fé e tradição.", "titulo_pt": "Homenageando os falecidos: dia das almas comemorado na Índia e Bangladesh - em imagens", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 241878, "titulo": "Norm MacDonald subverteu o stand-up com sua indiferença", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/norm-macdonald-subverteu-o-stand-up-com-sua-indiferenca.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-03T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A História de Norm Macdonald, recentemente adicionado à Netflix, vai além de ser apenas a biografia de um dos comediantes mais singulares da TV americana. Macdonald subverteu o stand-up, apresentando-se indiferente perante a plateia.", "titulo_pt": "Norm MacDonald inverteu o stand-up com sua indiferença", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 241879, "titulo": "Novo álbum de Steven Wilson é uma espécie de filme para os ouvidos", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/novo-album-de-steven-wilson-e-uma-especie-de-filme-para-os-
