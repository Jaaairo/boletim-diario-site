_duplicata_de": null, "texto_pt": "O gap salarial entre homens e mulheres em instituições públicas sul-coreanas caiu abaixo de 20% pela primeira vez em 2022, segundo dados do Ministério da Igualdade de Gênero. No entanto, a disparidade salarial entre empresas privadas permaneceu significativamente maior, com uma diferença de 29,3%.", "titulo_pt": "Fechamento do gap salarial em instituições públicas sul-coreanas cai abaixo de 20% pela primeira vez", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 149877, "titulo": "Cidade mineira comprou R$ 1,8 milhão em livros didáticos de Augusto Cury", "url": "https://www.metropoles.com/colunas/ramiro-brites/cidade-mineira-livros-augusto-cury", "fonte_id": "metropoles", "data_pub": "2026-09-07T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2015, a cidade de Lagoa Santa, localizada na Grande Belo Horizonte, adquiriu 10,5 mil livros didáticos do escritor e psiquiatra Augusto Cury. O valor total da compra foi de R$ 1,8 milhão.", "titulo_pt": "Cidade mineira comprou R$ 1,8 milhão em livros didáticos de Augusto Cury", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 150471, "titulo": "Seoul schools to ramp up language support as classrooms diversify", "url": "https://www.koreaherald.com/article/10865353", "fonte_id": "korea_herald", "data_pub": "2026-09-07T07:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A prefeitura de Seul planeja abrir uma segunda centro de suporte à educação multicultural e expandir as escolas preparatórias para o coreano, devido ao aumento do número de estudantes com origem migratória que atingiu mais de 22.000. Essas medidas fazem parte do plano de políticas do segundo mandato do Superintendente de Educação Jung Geun-sik, anunciado pela comissão que implementa suas promessas de campanha.", "titulo_pt": "Seul ampliará suporte linguístico com aumento da diversidade racial nas escolas", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 149887, "titulo": "“Sou um escravo”: coronel réu por matar esposa PM relata rotina na prisão", "url": "https://www.metropoles.com/colunas/alfredo-henrique/sou-um-escravo-coronel-reu-por-matar-esposa-pm-relata-rotina-na-prisao", "fonte_id": "metropoles", "data_pub": "2026-09-07T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Geraldo Neto, réu por matar a esposa, PM, relata que realiza tarefas menores na prisão, como lavar banheiros e buscar refeições. Ele afirma que oficiais são minoritários no presídio Romão Gomes.", "titulo_pt": "Sou um escravo: réu por matar PM relata rotina na prisão", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 149813, "titulo": "Bolsa Família do mês começa a ser pago em 17 de setembro; veja calendário", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/bolsa-familia-do-mes-comeca-a-ser-pago-em-17-de-setembro-veja-calendario.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-07T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O calendário de pagamentos do Bolsa Família para o mês de setembro começa no dia 17 para os beneficiários com NIS terminando em 1. As liberações se estendem ao longo do mês, seguindo a ordem dos dígitos finais do NIS.", "titulo_pt": "Bolsa Família do mês começa a ser pago em 17 de setembro; veja calendário", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 149816, "titulo": "Idosas resgatadas em casa de Belo Horizonte trabalharam sem salário por décadas, diz promotoria", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/idosas-resgatadas-em-casa-de-belo-horizonte-trabalharam-sem-salario-por-decadas-diz-promotoria.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-07T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Duas idosas, com 90 e 65 anos, foram resgatadas em condições semelhantes ao trabalho escravo doméstico em Belo Horizonte. O Ministério Público do Trabalho em Minas Gerais confirmou o caso.", "titulo_pt": "Idosas resgatadas em casa de Belo Horizonte trabalharam sem salário por décadas, diz promotoria", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 150110, "titulo": "Cifra negra de homicidios: fundación denuncia que en tres años han muerto 276 niños por causas sin determinar", "url": "https://www.latercera.com/nacional/noticia/cifra-negra-de-homicidios-fundacion-denuncia-que-en-tres-anos-han-muerto-276-ninos-por-causas-sin-determinar/", "fonte_id": "la_tercera", "data_pub": "2026-09-07T07:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Fundação Amparo e Justícia tem investigado casos de mortes de crianças sem causa determinada e apresentará, em parceria com o governo, seis propostas para melhorar as falhas do sistema. O grupo intersectorial que resultou desse trabalho será apresentado nesta terça-feira.", "titulo_pt": "Cifra negra de mortes: fundação denuncia que 276 crianças morreram sem causa determinada em três anos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 150020, "titulo": "Es de Pinamar y con 18 años creó un puente para una Argentina mejor: “Muchos jóvenes sienten que la escuela no les habla”", "url": "https://www.lanacion.com.ar/lifestyle/tiene-18-descubrio-los-juegos-de-poder-y-creo-una-plataforma-para-una-argentina-mejor-jovenes-nid09022026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-07T04:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma jovem de Pinamar criou um projeto para melhorar a Argentina, focando na educação. O texto destaca que muitos jovens sentem que a escola não atende suas necessidades, especialmente em situações de fome, precariedade e incerteza.", "titulo_pt": "De Pinamar, jovem de 18 anos cria projeto para uma Argentina melhor: 'muitos jovens acreditam que a escola não os auxilia'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 149956, "titulo": "Como a China tenta cortar a poluição antes que ela chegue ao ar", "url": "https://veja.abril.com.br/coluna/giro-pelo-oriente/como-a-china-tenta-cortar-a-poluicao-antes-que-ela-chegue-ao-ar/", "fonte_id": "veja", "data_pub": "2026-09-07T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A China está investindo em energia renovável, redes elétricas inteligentes, veículos de nova energia e mudanças na indústria com o objetivo de reduzir as emissões em suas cidades.", "titulo_pt": "Como a China tenta cortar a poluição antes que ela chegue às cidades", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 150240, "titulo": "Clowns take over the streets of Brazil’s historic Mariana", "url": "http://www.euronews.com/video/2026/09/07/clowns-take-over-the-streets-of-brazils-historic-mariana", "fonte_id": "euronews", "data_pub": "2026-09-07T09:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Acerca de 100 palhaços e fãs de circo se reuniram no centro histórico da cidade de Mariana, no Brasil, para participar de um encontro internacional que celebra circo, música e cor.", "titulo_pt": "Palhaços tomam conta do centro histórico de Mariana, no Brasil", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 149928, "titulo": "Enchente relâmpago no Nepal e na China soma quase 1.400 mortos", "url": "https://www.cnnbrasil.com.br/internacional/numero-de-mortos-em-enchentes-no-nepal-sobe/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-07T09:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A enchente relâmpago que atingiu a fronteira entre Nepal e China deixou quase 1.400 mortos. O número total de desaparecidos é superior a 5 mil pessoas, e 13 mil foram resgatadas.", "titulo_pt": "Enchente relâmpago no Nepal e na China soma quase 1.400 mortos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 150381, "titulo": "Nepal’s US$2.5 billion flood bill puts UN climate fund to its biggest test yet", "url": "https://www.scmp.com/week-asia/health-environment/article/3366581/nepals-us25-billion-flood-bill-puts-un-climate-fund-its-biggest-test-yet?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-07T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nepal solicitou auxílio financeiro após as catástrofes causadas por inundações que resultaram em centenas de mortes e prejuízos econômicos bilionários. O país pediu ao Fundo da ONU para responder a perdas e danos que agilize, atue diretamente e efetivamente em meio à pior desastre natural em décadas.", "titulo_pt": "Nepal busca ajuda financeira de US$ 2,5 bilhões após inundações após desastre climático", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 150385, "titulo": "Malaysia lifts haze emergency in Sarawak, but warns pollution risks remain", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3366615/malaysia-lifts-haze-emergency-sarawak-warns-pollution-risks-remain?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-07T07:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Malásia encerrou a emergência devido à neblina em Sarawak, no estado de Borneu, mas advertiu que os níveis muito ruins de poluição do ar permanecem devido a incêndios florestais na Indonésia. A poluição foi tão crítica em Serian que levou a encerramento de escolas em algumas partes do estado.", "titulo_pt": "Malásia encerra emergência de neblina em Sarawak, mas alerta sobre riscos de poluição", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 150245, "titulo": "Nepal holds a day of mourning and rescue efforts continue after flash floods kill 1,300", "url": "http://www.euronews.com/2026/09/07/nepal-holds-a-day-of-mourning-and-rescue-efforts-continue-after-flash-floods-kill-1300", "fonte_id": "euronews", "data_pub": "2026-09-07T06:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nepal está em estado de luto e as operações de resgate continuam após cheias que resultaram na morte de 1.300 pessoas. As buscas se concentraram em 12 projetos hidrelétricos, onde cerca de 900 trabalhadores estão desaparecidos e aproximadamente 500 estariam presos em diversos túneis.", "titulo_pt": "Nepal realiza dia de luto e operações de resgate continuam após cheias que deixam 1.300 mortos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 149902, "titulo": "Manaus, coração da maior reserva de água do mundo, corre risco de secar até 2040", "url": "https://exame.com/esg/manaus-coracao-da-maior-reserva-de-agua-do-mundo-pode-enfrentar-escassez-ate-2040/", "fonte_id": "exame", "data_pub": "2026-09-07T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo do Trata Brasil indica que o uso descontrolado de poços subterrâneos e as mudanças climáticas podem colocar em risco o abastecimento de água da capital do Amazonas, Manaus, até 2040.", "titulo_pt": "Manaus, centro de maior reserva de água do mundo, corre risco de secar até 2040", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 150173, "titulo": "Schools Close Across Sarawak Due to Toxic Haze From Indonesian Wildfires", "url": "https://thediplomat.com/2026/09/schools-close-across-sarawak-due-to-toxic-haze-from-indonesian-wildfires/", "fonte_id": "the_diplomat", "data_pub": "2026-09-07T04:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Escolas foram fechadas em toda a Sarawak devido a uma névoa tóxica causada por incêndios florestais na Indonésia. Os incêndios têm durado semanas em grandes áreas da Sumatra e Kalimantan, agravados por uma estação seca extremamente seca.", "titulo_pt": "Escolas fechadas em Sarawak devido a névoa tóxica de incêndios florestais na indonésia", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 149328, "titulo": "Indonesia cancels flights at airports as volcano erupts", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/07/2003863804", "fonte_id": "taipei_times", "data_pub": "2026-09-07T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades indonésias cancelaram voos nos aeroportos devido a uma erupção vulcânica. Não há detalhes adicionais sobre a gravidade da erupção ou os efeitos imediatos nos voos.", "titulo_pt": "Indonésia cancela voos nos aeroportos devido a erupção vulcânica", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 148906, "titulo": "MPF investiga a plataforma eBay por comércio ilegal a garimpeiros na Amazônia", "url": "https://veja.abril.com.br/brasil/mpf-investiga-a-plataforma-ebay-por-comercio-ilegal-a-garimpeiros-na-amazonia/", "fonte_id": "veja", "data_pub": "2026-09-06T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público Federal (MPF) está investigando a plataforma eBay por suspeita de comércio ilegal a garimpeiros na Amazônia. O MPF argumenta que as plataformas digitais têm o dever de vigiar e controlar suas atividades para evitar a venda de produtos ilícitos ou perigosos.", "titulo_pt": "MPF investiga ebay por comércio ilegal a garimpeiros na Amazônia", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 149272, "titulo": "Dead fish fill vanishing river as drought grips Indonesia", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/6/dead-fish-fill-vanishing-river-as-drought-grips-indonesia?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-06T15:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma longa seca está causando a morte de milhões de peixes no Rio Silugonggo, em Java Central, Indonésia.", "titulo_pt": "Peixes morrem em rio desaparecendo devido à seca prolongada na indonésia", "veiculo": "Al Jazeera Eng agédia reforça a necessidade de melhorias em sistemas de segurança aeroportuária, especialmente para cargas. O acidente também tem implicações científicas, com a necessidade de estudos para entender melhor os impactos de acidentes de avião de carga no ambiente local e na segurança pública.", "data_edicao": "2026-09-07", "artigos": [{"id": 150242, "titulo": "Heavy smoke and flames after Amazon cargo plane overruns runway in Miami", "url": "http://www.euronews.com/video/2026/09/07/heavy-smoke-and-flames-after-amazon-cargo-plane-overruns-runway-in-miami", "fonte_id": "euronews", "data_pub": "2026-09-07T08:59:00Z", "topico": "meio_ambiente", "idioma": "en", "texto_resumo": "Um avião de carga da Amazon perdeu o controle no runway do Aeroporto Internacional de Miami, colidiu com veículos e pegou fogo. Cinco pessoas morreram e outras cinco ficaram feridas. A FAA e o NTSB estão investigando o incidente.", "titulo_pt": "Incêndio e colisão envolvem avião de carga da Amazon no runway de Miami", "texto_pt": "Um avião de carga da Amazon perdeu o controle no runway do Aeroporto Internacional de Miami, colidiu com veículos e pegou fogo. Cinco pessoas morreram e outras cinco ficaram feridas. A FAA e o NTSB estão investigando o incidente.", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 150198, "titulo": "Five killed as Amazon cargo plane crashes at Miami airport", "url": "https://www.bbc.co.uk/news/videos/c4grd9mg3rvo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-07T05:37:00Z", "topico": "politica_internacional", "idioma": "en", "texto_resumo": "Um avião de carga da Amazon desviou do pista ao tentar pousar no aeroporto de Miami, resultando em cinco mortes.", "titulo_pt": "Cinco mortos em acidente de avião de carga da Amazon no aeroporto de Miami", "texto_pt": "Um avião de carga da Amazon desviou do pista ao tentar pousar no aeroporto de Miami, resultando em cinco mortes.", "veiculo": "BBC World News", "pais": "Reino Unido", "classe":            return `<div class="item" data-flag-url="${esc(n.url)}">

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
