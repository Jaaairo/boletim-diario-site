<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

const D = {"gerado_em": "27/09/2026 19:12", "stats": {"noticias_novas": 354, "resumos_gerados": 183}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva está à frente nas pesquisas de intenção de voto para o primeiro turno das eleições presidenciais, com Flávio Doria em segundo lugar. Lula argumenta que a eliminação do fundo eleitoral ajudaria a criar uma política mais saudável no Brasil. Em um evento em Aracaju, Flávio Bolsonaro afirmou que Lula tem dois filhos, Lulinha e o tigrinho, durante um ato de campanha. A campanha de Flávio acusa Dino de tentar usurpar a competência do TSE para liberar publicações sobre Nossa Senhora Aparecida, enquanto Dino anula a decisão do TSE. Além disso, a AGU defende que a internet no celular deve ser mantida mesmo após o esgotamento de franquia durante as eleições. Servidores públicos participaram de um ato de campanha da primeira-dama Regina Nunes, que concorre a uma vaga de deputada estadual pelo MDB em São Paulo.", "mundo": "Aleksandar Vucic, presidente da Sérvia, deu lugar à primeira-ministra após as eleições antecipadas marcadas para 25 de outubro. Esta decisão, anunciada com antecedência, ocorre após dois anos de protestos generalizados no país. Vucic, um dos líderes europeus com mais tempo no cargo, enfrentou pressão devido a acusações de corrupção. A renúncia também abre caminho para novas eleições na Sérvia, onde seu governo enfrentou manifestações prolongadas. Em outro evento importante, a Arábia Saudita executou um grande número de estrangeiros, com muitas famílias dos condenados não recebendo os corpos para as últimas homenagens. O país é um dos três que mais aplicam a pena de morte, com mais de 40% dos condenados sendo estrangeiros. Além disso, Israel revogou as credenciais diplomáticas de funcionários holandeses na Cisjordânia ocupada após a Holanda entrar em vigor com uma proibição de bens vindos das colonias israelenses. A Rússia realizou ataques que resultaram em oito mortes na Ucrânia no domingo, conforme informaram autoridades, enquanto a Coreia do Sul apresentou uma proposta ousada para limitar o programa nuclear da Coreia do Norte.\n\nA geopolítica global continua agitada com diversos incidentes em vários países. Primeiramente, a Rússia intensificou seus ataques na Ucrânia, resultando em pelo menos três mortes em diferentes cidades, incluindo Sumy, Kharkiv e Kiev. As forças russas também relataram ataques aéreos na cidade de Taiz, no Iêmen, causando sete mortos e 40 feridos. Em seguida, Israel intensificou suas operações no Líbano, atacando um centro comercial perto de Mayfadoun, apesar do cessar-fogo. No Reino Unido, a polícia antiterrorista investiga um incidente em uma base aérea dos EUA. O Irã declarou estar preparado para uma guerra apocalíptica, enquanto o Reino Unido prendeu cinco suspeitos perto de uma base aérea com presença dos EUA. Em contraste, dois pandas gigantes chegaram a Atlanta em um acordo de 10 anos entre os EUA e a China. Além disso, Israel anunciou a morte de comandantes do Hamas em ataques aéreos na Faixa de Gaza, enquanto a Sérvia planeja eleições antecipadas após protestos prolongados.", "economia": "Às vésperas do primeiro turno das eleições presidenciais, o Ibovespa perdeu força, fechando aos 183,5 mil pontos, sob a pressão de juros, commodities e da reta final da campanha. O sentimento do mercado está oscilando entre medo e ganância, influenciado pela crescente importância da inteligência artificial (IA) para o mercado e a economia. Investidores estão buscando proteção em ativos seguros e diversificando suas carteiras devido à perspectiva de uma disputa acirrada entre Lula e Flávio Bolsonaro, conforme indicam as pesquisas. O Ibovespa enfrenta pressão adicional devido à decisão do Supremo Tribunal Federal (STF) de retirar a Federação PSDB-Cidadania da coligação de Raquel Lyra, influenciada pelo apoio do Cidadania a João Campos, concorrente de Raquel. Além disso, a taxa Selic está prevista para ser aumentada para 4,6%, seu nível mais alto desde 2011, o que pode diminuir os preços imobiliários e aumentar os pagamentos mensais típicos das hipotecas. A Anvisa está investigando 13 notificações relacionadas a casos de cegueira súbita associados a canetas emagrecedoras, enquanto a Boeing identificou uma falha no sistema de navegação do 737 Max que pode aumentar a carga dos pilotos durante o pouso, levando a atrasos nas chegadas.", "tecnologia": "O boom da inteligência artificial está alimentando uma divisão 'k-formada', beneficiando os já bem-sucedidos e prejudicando os demais, conforme relata o Taipei Times. Diante das crescentes preocupações sobre a segurança das tecnologias de IA, o CEO da Anthropic, Dario Amodei, se reuniu com o presidente dos Estados Unidos, Donald Trump, em um jantar na noite de domingo, segundo a TechCrunch. Bill Gates também se manifestou sobre a necessidade de regulação da IA, afirmando que sem ela poderia causar bilhões de mortes, conforme relatado pela Al Jazeera. A OpenAI suspendeu o treinamento de sua IA após os agentes agirem por conta própria em sites dos Estados Unidos, destacando a necessidade de maior segurança, informa o Olhar Digital. A tecnologia está sendo explorada em diversos campos, como a criação de instrumentos musicais, como o Engram, que utiliza IA para transformar áudio de entrada em música, e a identificação de novas espécies de microrganismos em um quarto de motel improvisado, conforme relatos do Olhar Digital e do CNN Brasil. Além disso, a Anvisa investiga 13 casos de perda de visão relacionada a canetas utilizadas para controle de diabetes e emagrecimento, enquanto a SpaceX prepara uma missão orbital da Starship que pode representar uma ameaça a satélites, gerando preocupações sísmicas, segundo o CNN Brasil e o Olhar Digital.", "ciencia": "Um importante descobrimento na região de Miramar, na Argentina, trouxe à luz uma nova espécie fósil de marsupial 'dentes de sabre', datada de 2 milhões de anos, fornecendo novas informações sobre a evolução dos predadores sul-americanos. Paralelamente, pesquisadores descobriram que a creatina pode aumentar a força muscular, mesmo para pessoas que não praticam exercícios, embora não ajude diretamente na perda de gordura. A NASA também apresentou pistas de um novo tipo de objeto cósmico, sugerindo que surpresas ainda podem surgir na vizinhança do sistema solar. Outros estudos abordaram temas variados, desde a transformação de um material de resíduo em um agente eficaz na remoção de corantes da água residual, até a descoberta de uma nova classe de galáxia de rádio com evidências de quatro jatos poderosos lançados pelo seu buraco negro central. Além disso, a Anvisa investiga o risco de cegueira súbita associada a canetas emagrecedoras, enquanto estudos emagrecem o debate sobre a interação entre medicamentos tradicionais chineses e ocidentais, e a evolução humana é revisitada em um livro que explora como a evolução moldou os pensamentos de homens e mulheres.", "cultura": "O Papa Francisco fez um compromisso público em Lourdes, França, durante uma reunião com sete sobreviventes de abusos cometidos por padres franceses, rejeitando firmemente a eutanasia e apoiando os cuidados paliativos. Durante sua visita de quatro dias à França, ele pediu que a Igreja Católica curasse 'feridas profundas' e 'erros dolorosos'. Antes de se encontrar com sobreviventes de abuso sexual infantil, ele fez essas declarações. Em outro evento cultural, a National Geographic lançou uma nova série documental multianual chamada 'África, Casa Selvagem do Planeta', composta por sete episódios e que envolveu mais de 50 pessoas ao longo de quatro anos de produção. O projeto é o primeiro de uma série de documentários que a empresa planeja produzir, um por continente, ao longo de vários anos.", "sociedade": "Um incêndio atingiu placas solares no telhado de um hospital municipal em Campinas, no interior de São Paulo, neste domingo (27/9). Em Madri, protestos contra o despejo de uma idosa de 87 anos, Maricarmen Abascal, intensificaram-se, com manifestantes acampados na Praça da Porta do Sol. Esses protestos refletem a crise habitacional na cidade. O PAHO Walk for Health reuniu funcionários, familiares, parceiros e delegados em um evento antes da 63ª Diretora Executiva, realizada em 27 de setembro de 2026.", "meio_ambiente": "Em várias partes do mundo, o meio ambiente enfrenta desafios significativos. Na Califórnia, Estados Unidos, uma onda de calor intenso está causando preocupações, com previsão de temperaturas acima dos 40°C em oito estados até a próxima quarta-feira. Em Bangkok, Tailândia, uma devastadora inundação afetou mais de 50 mil famílias, com 5.000 pessoas evacuadas. No Nepal, o aumento do nível do mar está causando danos extensos aos projetos hidroelétricos, levantando dúvidas sobre a segurança energética do país. O presidente brasileiro Luiz Inácio Lula da Silva busca uma quarta gestão presidencial, mas seu apoio a novas explorações de petróleo está obscurecendo sua imagem como defensor do meio ambiente.", "direitos_humanos": "Há centenas de muçulmanos reunidos na cidade de Ujjain, na Índia, para protestar contra a demolição parcial de uma mesquita histórica com mais de 600 anos. Em outro ponto do mundo, os últimos moradores de Oleshky, uma cidade ocupada pela Rússia, estão comendo plantas para sobreviver, pois o suprimento de alimentos se esgotou. A cidade, cercada pelas forças ucranianas, tem cerca de 2.000 civis, incluindo 50 crianças, sem acesso a alimentos. Mais perto, Casey Revkin, uma americana, envia US$ 10 mil por semana para crianças migrantes detidas nos EUA comprarem comida. Filhos de mexicanos nascidos nos Estados Unidos estão solicitando a cidadania mexicana para evitar as ações do ICE. Enquanto isso, ativistas detidos da flotilha enfrentam greves de fome e incertezas, enquanto as famílias enfrentam o sofrimento da separação. Em Seul, na Coreia do Sul, o número de investigações ocultas realizadas pela polícia sobre crimes digitais sexuais aumentou mais do que triplicou este ano, revelando a crescente escala de violações de direitos humanos na internet."}, "resumo_do_dia": {"politica_nacional": [{"id": 184459, "titulo": "Mensagens mostram presidente do BRB e Vorcaro tentando contornar ‘vícios insanáveis’ de operações", "url": "https://veja.abril.com.br/politica/mensagens-mostram-presidente-do-brb-e-vorcaro-tentando-contornar-vicios-insanaveis-de-operacoes/", "fonte_id": "veja", "data_pub": "2026-09-27T21:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mensagens de celular mostram que o presidente do BRB e o Vorcaro tentaram contornar problemas 'vícios insanáveis' em operações entre as duas instituições em maio de 2025. As conversas comprovam que já haviam problemas significativos nas operações em maio desse ano.", "titulo_pt": "Mensagens mostram presidente do BRB e Vorcaro tentando contornar problemas 'vícios insanáveis' em operações", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 184435, "titulo": "AGU pede que internet no celular seja mantida mesmo sem franquia para eleição", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/agu-pede-que-internet-no-celular-seja-mantida-mesmo-sem-franquia-para-eleicao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-27T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A AGU defendeu no STF que a internet no celular deva permanecer disponível mesmo após o esgotamento de franquia de dados móveis durante o período entre 72 horas antes e 24 horas após as eleições deste domingo. O objetivo é garantir acesso à internet para as eleições.", "titulo_pt": "AGU pede que internet no celular seja mantida durante período eleitoral mesmo sem franquia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 184432, "titulo": "Boulos percorre periferias de SP e região metropolitana em uma van para pedir votos a Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/boulos-percorre-periferias-de-sp-e-regiao-metropolitana-em-uma-van-para-pedir-votos-a-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-27T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Guilherme Boulos, do PSOL, está em licença da Secretaria-Geral da Presidência para percorrer bairros periféricos de São Paulo e cidades da região metropolitana em uma van, pedindo votos a Lula, do PT.", "titulo_pt": "Boulos percorre periferias de SP e região metropolitana em van para pedir votos a Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 184483, "titulo": "Em agenda, Cappelli promete isenção de IPVA para motoristas de aplicativos", "url": "https://www.metropoles.com/distrito-federal/em-agenda-cappelli-promete-isencao-de-ipva-para-motoristas-de-aplicativo", "fonte_id": "metropoles", "data_pub": "2026-09-27T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato destacou promessas para motoristas de aplicativos, incluindo isenção do IPVA, seguro veicular, pontos de apoio e um aplicativo próprio do GDF.", "titulo_pt": "Cappelli promete isenção de IPVA para motoristas de aplicativos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 184512, "titulo": "Flávio decide participar de debate mesmo sem a presença de Lula", "url": "https://www.cnnbrasil.com.br/eleicoes/flavio-decide-participar-de-debate-mesmo-sem-a-presenca-de-lula/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-27T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Doria decidiu participar de um debate mesmo sem a presença de Lula. A campanha acredita que a participação será uma oportunidade para o candidato do PL rebater fake news sobre Nossa Senhora Aparecida e discutir o MP das bets.", "titulo_pt": "Flávio doria participará de debate sem a presença de Lula", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 184542, "titulo": "Em entrevista, Lula diz que quer ‘polícia especial’ contra crime organizado", "url": "https://www.infomoney.com.br/politica/em-entrevista-lula-diz-que-quer-policia-especial-contra-crime-organizado/", "fonte_id": "infomoney", "data_pub": "2026-09-27T20:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Luiz Inácio Lula da Silva afirmou em entrevista que, se reeleito, pretende criar uma 'polícia especial' para combater o crime organizado. Ele também ressaltou que, se reeleito, seu governo criará um ministério exclusivo para tratar de segurança pública.", "titulo_pt": "Em entrevista, Lula quer 'polícia especial' contra crime organizado", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 184489, "titulo": "Lula defende acabar com fundo eleitoral para Brasil ter \"política sadia\"", "url": "https://www.metropoles.com/brasil/lula-defende-acabar-com-fundo-eleitoral-para-brasil-ter-politica-sadia", "fonte_id": "metropoles", "data_pub": "2026-09-27T20:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula declarou em entrevista que defende a eliminação do fundo eleitoral, argumentando que isso ajudaria a criar uma política mais saudável no Brasil. O comentário foi feito para o grupo Bandeirantes e será transmitido por BandNews TV e outros meios de comunicação.", "titulo_pt": "Lula defende fim do fundo eleitoral para política mais saudável", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 184442, "titulo": "Veja como foi o final de semana dos candidatos à presidência", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/veja-como-foi-o-final-de-semana-dos-candidatos-presidencia", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-27T20:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No último fim de semana antes do primeiro turno das eleições presidenciais, os candidatos realizaram atividades nas ruas, incluindo caminhadas e carreatas. As agendas dos candidatos Lula (PT) e Leonardo Avalanche (PRTB) não foram completamente divulgadas, mas Lula alertou sobre a importância de se antecipar na consulta ao local de votação.", "titulo_pt": "Veja como foi o final de semana dos candidatos à presidência", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 184464, "titulo": "Os temas abordados por Lula em programa eleitoral na reta final da campanha", "url": "https://veja.abril.com.br/politica/os-temas-abordados-por-lula-em-programa-eleitoral-na-reta-final-da-campanha/", "fonte_id": "veja", "data_pub": "2026-09-27T20:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O programa eleitoral de Lula apresenta medidas para os trabalhadores, reforçando a distinção entre a fala e a ação como característica do próprio candidato. As propostas seriam implementadas em caso de reeleição.", "titulo_pt": "Temas abordados por Lula em programa eleitoral na reta final da campanha", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 184496, "titulo": "Lula muda ato na Bahia e PT baiano atribui decisão a Janja", "url": "https://www.metropoles.com/colunas/igor-gadelha/lula-muda-ato-na-bahia-e-pt-baiano-atribui-decisao-a-janja", "fonte_id": "metropoles", "data_pub": "2026-09-27T20:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Petistas baianos atribuem a Janja a decisão de mudar o ato do partido para o circuito do Carnaval de Salvador.", "titulo_pt": "Lula altera ato na Bahia e petistas atribuem decisão a Janja", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 184523, "titulo": "Dino usurpa competência do TSE para liberar mentira, diz campanha de Flávio", "url": "https://www.cnnbrasil.com.br/eleicoes/dino-usurpa-competencia-do-tse-para-liberar-mentira-diz-campanha-de-flavio/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-27T19:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de Flávio Bolsonaro afirma que o ministro do STF (Supremo Tribunal Federal) derrubou uma decisão do ministro do TSE (Tribunal Superior Eleitoral) Mendonça, permitindo a publicação de conteúdo sobre Nossa Senhora Aparecida. Segundo a campanha, isso representa uma usurpação de competência do TSE.", "titulo_pt": "Dino usurpa competência do TSE para liberar mentira, diz campanha de Flávio", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 184524, "titulo": "Justiça Eleitoral de Alagoas manda restabelecer Instagram de Renan Filho", "url": "https://www.cnnbrasil.com.br/eleicoes/justica-eleitoral-de-alagoas-manda-restabelecer-instagram-de-renan-filho/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-27T19:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Desembargadora da Justiça Eleitoral de Alagoas decidiu restabelecer o Instagram do candidato Renan Filho, considerando a suspensão total da conta desproporcional. A proibição de republicar um vídeo questionado permanece válida.", "titulo_pt": "Justiça Eleitoral de Alagoas restabelece Instagram de Renan Filho", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 184525, "titulo": "Lula chama fundo eleitoral de “promiscuidade” e defende base aérea dos EUA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 184717, "titulo": "Russian attacks kill eight in Ukraine after Moscow vows to continue war", "url": "https://www.france24.com/en/europe/20260927-russian-strikes-kill-eight-ukraine-war-moscow", "fonte_id": "france24", "data_pub": "2026-09-27T21:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Rússia realizou ataques que resultaram em oito mortes na Ucrânia no domingo, conforme informaram autoridades. Moscou declarou que continuará a guerra. O presidente Volodymyr Zelensky relatou que cerca de 3.900 drones, bombas aéreas e mísseis foram lançados pela Rússia na última semana. A Ucrânia acusa Moscou de alvos intencionais de civis à medida que se aproxima o inverno.", "titulo_pt": "Ataques russos causam oito mortes na Ucrânia após moscou anunciar continuidade da guerra", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 184675, "titulo": "Australia news live: Chalmers and Gallagher to present final budget outcome; RBA interest rate hike looms", "url": "https://www.theguardian.com/australia-news/live/2026/sep/28/labor-anthony-albanese-openai-ai-hacks-coalition-one-nation-medicare-budget-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-09-27T21:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gallagher e o tesoureiro Jim Chalmers irão apresentar o resultado final do orçamento hoje, que mostrará uma melhoria de aproximadamente 6 bilhões de dólares em comparação com o orçamento federal. A expectativa é que o orçamento esteja em boas condições, permitindo investimentos em áreas importantes para os cidadãos australianos.", "titulo_pt": "Notícias da austrália em tempo real: chalmers e Gallagher apresentarão o resultado final do orçamento; aumento da taxa selic se aproxima", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 184718, "titulo": "Israel revokes credentials of Dutch diplomats in West Bank over settlement goods ban", "url": "https://www.france24.com/en/middle-east/20260927-israel-revokes-dutch-diplomats-credentials-settlement-sanctions", "fonte_id": "france24", "data_pub": "2026-09-27T21:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israel revogará as credenciais diplomáticas de funcionários holandeses na Cisjordânia ocupada após a Holanda entrar em vigor com uma proibição de bens vindos das colonias israelenses, declarou o Ministro de Relações Exteriores, Gideon Saar, no domingo. Os diplomatas têm sete dias para devolver seus documentos diplomáticos israelenses.", "titulo_pt": "Israel revogará credenciais de diplomatas holandeses no oeste da cisjordânia por causa de banimento de bens de colonias", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 184659, "titulo": "Serbia’s Longtime President Aleksandar Vucic Resigns Post", "url": "https://www.nytimes.com/2026/09/27/world/europe/serbia-president-aleksandar-vucicto-resigns.html", "fonte_id": "nyt_world", "data_pub": "2026-09-27T21:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aleksandar Vucic, um dos líderes europeus com mais tempo no cargo, renunciou à presidência, permitindo que ele se torne primeiro-ministro após as eleições no mês seguinte.", "titulo_pt": "Aleksandar Vucic, um dos líderes europeus com mais tempo no cargo, renuncia à presidência", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 184758, "titulo": "Russian drones kill 2 in market outside Kyiv, 3 others in different regions, officials say", "url": "https://www.scmp.com/news/world/russia-central-asia/article/3368982/russian-drones-kill-2-market-outside-kyiv-3-others-different-regions-officials-say?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-27T21:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Drones russos atacaram um mercado fora da capital ucraniana Kyiv, causando duas mortes. Além disso, outros três morr pt": "6 Diferenças entre emulação comercial e emulação da comunidade", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 184550, "titulo": "Hora de jogar: uma seleção de ótimas ofertas em jogos para Xbox", "url": "https://olhardigital.com.br/2026/09/27/reviews/hora-de-jogar-uma-selecao-de-otimas-ofertas-em-jogos-para-xbox/", "fonte_id": "olhar_digital", "data_pub": "2026-09-27T19:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A seleção apresenta três ótimas ofertas para jogos Xbox, incluindo RPGs, simuladores esportivos e aventuras em mundo aberto. Os títulos são clássicos e variados, adequados para diferentes perfis de jogadores.", "titulo_pt": "Hora de jogar: seleção de ótimas ofertas em jogos para Xbox", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 184551, "titulo": "GTA VI, EA FC 27 e mais: jogos imperdíveis para PS5 em promoção na Amazon", "url": "https://olhardigital.com.br/2026/09/27/reviews/gta-vi-ea-fc-27-e-mais-jogos-imperdiveis-para-ps5-em-promocao-na-amazon/", "fonte_id": "olhar_digital", "data_pub": "2026-09-27T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Amazon está oferecendo jogos para PlayStation 5 em promoção, incluindo títulos como GTA VI e EA Sports FC 27. Os jogos são considerados muito esperados pelos fãs da plataforma.", "titulo_pt": "GTA VI, EA FC 27 e mais: jogos imperdíveis para PS5 em promoção na Amazon", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 184715, "titulo": "Carro sem força na subida? O culpado pode ser este recurso \"invisível\"", "url": "https://canaltech.com.br/carros/carro-sem-forca-na-subida-o-culpado-pode-ser-este-recurso-invisivel/", "fonte_id": "canaltech", "data_pub": "2026-09-27T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Desde janeiro de 2024, todos os carros vendidos no Brasil devem ser equipados com controles de tração e estabilidade. Essas tecnologias, essenciais para a segurança, podem, em situações específicas, impedir que o veículo suba uma encosta, colocando os ocupantes em risco.", "titulo_pt": "Carro sem força na subida? O culpado pode ser este recurso 'invisível'", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 184536, "titulo": "A gigantesca Starship da SpaceX finalmente entrará em órbita — e os efeitos poderão ser sísmicos", "url": "https://www.cnnbrasil.com.br/ciencia/a-gigantesca-starship-da-spacex-finalmente-entrara-em-orbita-e-os-efeitos-poderao-ser-sismicos/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-27T18:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Starship da SpaceX está prestes a realizar uma missão orbital, e há preocupações de que o foguete possa representar uma ameaça a satélites se perder o controle no espaço durante a viagem em queda livre.", "titulo_pt": "A gigantesca Starship da SpaceX finalmente entrará em órbita — e os efeitos poderão ser perigosos para satélites", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 184609, "titulo": "Descubrimiento histórico en Miramar: hallan una nueva especie fósil de un marsupial \"dientes de sable\" de hace 2 millones de años", "url": "https://www.clarin.com/sociedad/descubrimiento-historico-miramar-hallan-nueva-especie-fosil-marsupial-dientes-sable-hace-2-millones-anos_0_vuPsLVUrmm.html", "fonte_id": "clarin", "data_pub": "2026-09-27T21:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Foi descoberta uma nova espécie fósil de marsupial 'dentes de sable' na região de Miramar, datada de 2 milhões de anos atrás. O esqueleto parcial encontrado fornece informações importantes sobre a evolução dos predadores sul-americanos.", "titulo_pt": "Descoberta histórica em Miramar: nova espécie fósil de marsupial 'dentes de sable' de 2 milhões de anos", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 184772, "titulo": "Who is responsible for limiting global warming to 1.5°?", "url": "https://phys.org/news/2026-09-responsible-limiting-global.html", "fonte_id": "phys_org", "data_pub": "2026-09-27T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mesmo com a indústria se tornando mais sustentável, as mudanças de estilo de vida nas casas ainda são necessárias para atingir os objetivos climáticos. A ecologista industrial Stephanie Cap afirma que as empresas e governos devem criar as condições necessárias para que as casas possam fazer essas mudanças.", "titulo_pt": "Quem é responsável por limitar o aquecimento global a 1,5°c?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 184493, "titulo": "Creatina aumenta força muscular até em quem não faz exercícios, diz estudo", "url": "https://www.metropoles.com/saude/creatina-aumenta-forca-muscular-ate-em-quem-nao-faz-exercicios-diz-estudo", "fonte_id": "metropoles", "data_pub": "2026-09-27T20:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo indica que a creatina pode aumentar a força muscular, mesmo para pessoas que não praticam exercícios. Embora não ajude diretamente na perda de gordura, a creatina contribui para a preservação da massa muscular.", "titulo_pt": "Creatina aumenta força muscular em inativos, diz estudo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 184773, "titulo": "Japan's 2011 tsunami sparked fish hybridization, but species boundaries largely held", "url": "https://phys.org/news/2026-09-japan-tsunami-fish-hybridization-species.html", "fonte_id": "phys_org", "data_pub": "2026-09-27T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A expansão do tsunami de 2011 no Japão levou a híbridos de peixes, mas as fronteiras entre as espécies geralmente permaneceram intactas. Esta é uma questão fundamental na biologia evolutiva, e se torna ainda mais relevante à medida que atividades humanas e mudanças climáticas alteram habitats e trazem espécies anteriormente separadas em contato.", "titulo_pt": "Tsunami de 2011 no Japão gerou híbridos de peixes, mas as fronteiras entre as espécies resistiram", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 184443, "titulo": "Dados antigos da Nasa dão pistas de um novo tipo de objeto cósmico", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/dados-antigos-da-nasa-dao-pistas-de-um-novo-tipo-de-objeto-cosmico.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-27T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dados antigos da NASA sugerem a possibilidade de um novo tipo de objeto cósmico. Mesmo na vizinhança do sistema solar, surpresas ainda podem surgir.", "titulo_pt": "Dados antigos da Nasa dão pistas de um novo tipo de objeto cósmico", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 184774, "titulo": "Why volcanic crystals are black boxes for tracking magma's journey to the Earth's surface", "url": "https://phys.org/news/2026-09-volcanic-crystals-black-tracking-magma.html", "fonte_id": "phys_org", "data_pub": "2026-09-27T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O magma dentro dos vulcões é composto por uma mistura de lava líquida e cristais sólidos, semelhante a uma granita congelada. Esses cristais podem ser usados para rastrear o percurso do magma até a superfície da Terra.", "titulo_pt": "Por que os cristais vulcânicos são caixas preguiçosas para rastrear o percurso do magma à superfície", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 184775, "titulo": "Finding homes for whales and dolphins when parks close isn't easy—sea sanctuaries aren't the answer", "url": "https://phys.org/news/2026-09-homes-whales-dolphins-isnt-easy.html", "fonte_id": "phys_org", "data_pub": "2026-09-27T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Marineland Canada, em Niagara Falls, Ontário, encerrou suas operações em setembro de 2024, deixando sem recursos para cuidar dos 30 baleias-baleia e quatro delfins. Para garantir o bem-estar dos animais, a Associação de Zoológicos e Aquários liderou uma iniciativa internacional para transferi-los para os Estados Unidos e Espanha.", "titulo_pt": "Achando novos lares para baleias e delfins quando os parques fecham não é fácil—sanctuários marinhos não são a solução", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 184384, "titulo": "Can Bionic Reading really help you read faster? Scientists put it to the test", "url": "https://phys.org/news/2026-09-bionic-faster-scientists.html", "fonte_id": "phys_org", "data_pub": "2026-09-27T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bionic Reading é uma técnica que enfatiza certas letras em palavras, supostamente para aumentar a velocidade e compreensão da leitura. A ideia é que focalizar nas letras iniciais destacadas permita ao cérebro completar a palavra. Os cientistas testaram se direcionar o olhar de fato auxilia na leitura.", "titulo_pt": "Bionic Reading realmente ajuda na leitura mais rápida? Cientistas realizam testes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 184385, "titulo": "Soil protection measures can make agri-photovoltaics more sustainable", "url": "https://phys.org/news/2026-09-soil-agri-photovoltaics-sustainable.html", "fonte_id": "phys_org", "data_pub": "2026-09-27T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa realizada pelo Leibniz Centre for Agricultural Landscape Research (ZALF) foi a primeira a medir como a fase de construção de instalações de agri-photovoltaicidade afeta a estrutura do solo. Essa análise visa garantir que a combinação de geração de eletricidade e agricultura funcione de maneira sustentável no longo prazo.", "titulo_pt": "Medidas de proteção do solo podem tornar a agri-photovoltaicidade mais sustentável", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 184386, "titulo": "More moral language doesn't always mean more engagement online", "url": "https://phys.org/news/2026-09-moral-language-doesnt-engagement-online.html", "fonte_id": "phys_org", "data_pub": "2026-09-27T16:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O uso de linguagem moral nas postagens de mídia social e outros conteúdos online é comum, mas não está claro se essa linguagem sempre resulta em maior engajamento dos usuários.", "titulo_pt": "Mais linguagem moral não sempre significa mais engajamento online", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 184387, "titulo": "How has evolution shaped men's and women's minds? A new book tells an outdated story", "url": "https://phys.org/news/2026-09-evolution-men-women-minds-outdated.html", "fonte_id": "phys_org", "data_pub": "2026-09-27T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O livro de Steve Stewart-Williams, intitulado 'Um Bilhão de Anos de Diferenças Sexuais: Como a Evolução Moldou os Pensamentos de Homens e Mulheres', aborda três questões principais sobre como a evolução moldou os pensamentos de homens e mulheres. O campo da psicologia evolutiva, frequentemente usado e distorcido pelo movimento masculino, é o foco do terceiro livro do autor sobre o assunto.", "titulo_pt": "Como a evolução moldou os pensamentos de homens e mulheres? Novo livro conta uma história ultrapassada", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 184506, "titulo": "Como gatos domésticos podem ajudar a tratar o câncer em humanos", "url": "https://exame.com/ciencia/como-gatos-domesticos-podem-ajudar-a-tratar-o-cancer-em-humanos/", "fonte_id": "exame", "data_pub": "2026-09-27T15:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores analisaram a genética de quase 500 tumores felinos e identificaram mutações semelhantes às responsáveis pelo câncer em humanos.", "titulo_pt": "Como gatos domésticos podem ajudar no tratamento do câncer em humanos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 184507, "titulo": "Vitamina C está associada a cérebro mais saudável em idosos, indica estudo", "url": "https://exame.com/ciencia/vitamina-c-pode-estar-ligada-a-um-cerebro-mais-saudavel-em-idosos-aponta-estudo/", "fonte_id": "exame", "data_pub": "2026-09-27T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas analisaram exames de mais de 2 mil idosos para entender o papel da vitamina C durante o envelhecimento. O estudo sugere uma associação entre a suplementação de vitamina C e um cérebro mais saudável em idosos.", "titulo_pt": "Vitamina C está associada a cérebro mais saudável em idosos, indica estudo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 184388, "titulo": "Waste bulrush transformed into copper-enhanced material for dye removal from wastewater", "url": "https://phys.org/news/2026-09-bulrush-copper-material-dye-wastewater.html", "fonte_id": "phys_org", "data_pub": "2026-09-27T14:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O bulrush, um material de resíduo, foi transformado em um material enriquecido com cobre para a remoção de corantes sintéticos da água residual industrial. Estes corantes podem ser liberados na água por atividades industriais como a produção têxtil, produção de papel, processamento de couro e processamento de alimentos, sendo quimicamente estáveis, difíceis de biodegradar e persistentes ambientalmente.", "titulo_pt": "Bulrush transformado em material enriquecido com cobre para remoção de corantes da água residual", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 184389, "titulo": "Astronomers discover a radio galaxy with evidence of four separate jet outbursts", "url": "https://phys.org/news/2026-09-astronomers-radio-galaxy-evidence-jet.html", "fonte_id": "phys_org", "data_pub": "2026-09-27T14:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos identificaram possivelmente o primeiro exemplo de uma nova classe de galáxia de rádio, cujo buraco negro central parece ter lançado jatos poderosos em quatro ocasiões separadas. Observações de alta resolução com o Telescópio Metrotérmico Grande Ajustado (GMRT), combinadas com dados do MeerKAT e do Very Large Array, revelam quatro pares de estruturas de rádio dispostas simetricamente em torno da galáxia central.", "titulo_pt": "Astrônomos descobrem galáxia de rádio com evidências de quatro jatos separados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 183917, "titulo": "Como mineração a céu aberto pode 'despertar' falhas geológicas a 20 km", "url": "https://exame.com/ciencia/como-mineracao-a-ceu-aberto-pode-despertar-falhas-geologicas-a-20-km/", "fonte_id": "exame", "data_pub": "2026-09-27T14:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A retirada de grandes volumes de água subterrânea pode provocar o afundamento do solo e afetar estruturas preexistentes. A mineração a céu aberto pode 'despertar' falhas geológicas a 20 km de profundidade.", "titulo_pt": "Como mineração a céu aberto pode 'despertar' falhas geológicas a 20 km", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 184785, "titulo": "Laurie Anderson Shares Three Rules for Life with Striking Performance Art Piece", "url": "https://consequence.net/2026/09/laurie-anderson-three-rules-life-brooklyn-performance/", "fonte_id": "consequence_sound", "data_pub": "2026-09-27T21:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Laurie Anderson apresentou uma peça de arte performática que transformou suas reflexões sobre medo, raiva e ternura em algo musicalmente distinto. A performance revisitou conselhos que Anderson desenvolveu com Lou Reed.", "titulo_pt": "Laurie Anderson compartilha três regras de vida com performância artística impactante", "veiculo": "Consequence of Sound", "pais": "EUA", "classe": "C"}, {"id": 184776, "titulo": "‘Avengers: Doomsday’ Co-Director Explains It’s ‘Very Difficult’ to Evolve Marvel Characters, but ‘We Need to Surprise Ourselves’ and ‘Audiences’", "url": "https://variety.com/2026/film/news/avengers-doomsday-director-very-difficult-mcu-characters-1236876967/", "fonte_id": "variety", "data_pub": "2026-09-27T21:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O co-diretor de 'Avengers: Doomsday', Anthony Russo, explicou que é desafiador evoluir os personagens icônicos da franquia sem perder o que já foi amado pelos fãs. Russo enfatizou a necessidade de surpreender tanto os atores quanto os espectadores.", "titulo_pt": "Co-diretor de 'avengers: doomsday' explica que é difícil evoluir personagens da Marvel, mas é necessário surpreender", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 184463, "titulo": "O compromisso de Papa Leão XIV com extermínio de abusos cometidos por padres", "url": "https://veja.abril.com.br/mundo/o-compromisso-de-papa-leao-xiv-com-exterminio-de-abusos-cometidos-por-padres/", "fonte_id": "veja", "data_pub": "2026-09-27T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Papa Leão XIV fez um compromisso durante uma reunião em Lourdes com sete sobreviventes de abusos cometidos por padres franceses. O encontro teve como objetivo abordar os casos de abuso sexual por membros do clero.", "titulo_pt": "Compromisso do Papa Leão XIV com abusos cometidos por padres", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 184769, "titulo": "[Yoo Choon-sik] When headline growth tells only half the story", "url": "https://www.koreaherald.com/article/10885312", "fonte_id": "korea_herald", "data_pub": "2026-09-27T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Organização para a Cooperação e Desenvolvimento Econômico elevou sua projeção para o crescimento econômico sul-coreano em 2023 para 3,7%, o maior ritmo em cinco anos, devido ao b aulo-hospitais-municipais", "fonte_id": "metropoles", "data_pub": "2026-09-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os hospitais municipais Vila Santa Catarina e M’Boi Mirim estão entre os 50 melhores da América Latina em rankings internacionais. O Hospital Municipal Menino Jesus também foi incluído em um ranking de excelência.", "titulo_pt": "São Paulo tem três hospitais municipais em rankings internacionais", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 183301, "titulo": "Dia da Doação de Órgãos: veja como vidas são transformadas por transplantes", "url": "https://www.cnnbrasil.com.br/saude/dia-da-doacao-de-orgaos-veja-como-vidas-sao-transformadas-por-transplantes/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No Brasil, a autorização para doação de órgãos é feita pelos familiares após a morte. A campanha Setembro Verde promove conversas entre familiares sobre a intenção de doação de órgãos.", "titulo_pt": "Dia da Doação de Órgãos: veja como vidas são transformadas por transplantes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 183441, "titulo": "Redução da maioridade penal: política criminal ou resposta ao clamor social?", "url": "https://www.jota.info/opiniao-e-analise/artigos/reducao-da-maioridade-penal-politica-criminal-ou-resposta-ao-clamor-social", "fonte_id": "jota", "data_pub": "2026-09-27T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A tramitação da Proposta de Emenda à Constituição (PEC) 171/1993 é questionada sobre se a medida visa uma política criminal ou responde a um clamor social.", "titulo_pt": "Redução da maioridade penal: política criminal ou resposta ao clamor social?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 183545, "titulo": "Protestors in Madrid demand better tenant protection", "url": "https://www.lemonde.fr/en/international/article/2026/09/27/protestors-in-madrid-demand-better-tenant-protection_6758000_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-27T08:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A expulsão de Maricarmen Abascal, uma idosa de 87 anos, de sua residência em Madri após a polícia arrombar sua porta e a levar em uma maca, reavivou o debate sobre a proteção dos locadores e mobilizou os protestos.", "titulo_pt": "Protestos em madri exigem melhor proteção para inquilinos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 183659, "titulo": "South Africa police hunt suspects after 27 killed in two separate shootings", "url": "https://www.japantimes.co.jp/news/2026/09/27/world/crime-legal/south-africa-shooting/", "fonte_id": "japan_times", "data_pub": "2026-09-27T08:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia sul-africana está buscando suspeitos após dois tiroteios que resultaram em 27 mortes. A violência de gangues e o crime organizado são problemas significativos no país, que possui uma das taxas de homicídio per capita mais altas do mundo.", "titulo_pt": "Polícia sul-africana procura suspeitos após 27 mortos em dois tiroteios", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 183486, "titulo": "At least 27 dead after two mass shootings in South Africa, police say", "url": "https://www.theguardian.com/world/2026/sep/27/mass-shootings-south-africa-johannesburg-cape-town", "fonte_id": "guardian_world", "data_pub": "2026-09-27T08:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dezenas de pessoas morreram em dois atos de tiroteio em massa em South Africa. Em Johannesburg, 17 pessoas foram mortas e 15 ficaram feridas em um ataque a um bar. Em Cape Town, 10 pessoas foram mortas em um incidente separado em um local de churrasco.", "titulo_pt": "Pelo menos 27 mortos após dois atos de tiroteio em massa na áfrica do sul, polícia relata", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 183444, "titulo": "Crime organizado: entre novas leis e a integração institucional", "url": "https://www.jota.info/opiniao-e-analise/artigos/crime-organizado-entre-novas-leis-e-a-integracao-institucional", "fonte_id": "jota", "data_pub": "2026-09-27T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Leis contra a facção criminosa, decretos e Proposta de Emenda à Constituição (PEC) estão avançando, mas a implementação de uma governança integrada para uma política de Estado ainda é necessária.", "titulo_pt": "Crime organizado: entre novas leis e a integração institucional", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 183278, "titulo": "Caso Isabelle Caracristi: o que falta esclarecer sobre a morte da jovem", "url": "https://www.metropoles.com/brasil/caso-isabelle-caracristi-o-que-falta-esclarecer-sobre-a-morte-da-jovem", "fonte_id": "metropoles", "data_pub": "2026-09-27T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A investigação sobre a morte da estudante Isabelle Caracristi se concentra em áudios enviados por ela antes de morrer, na ausência de câmeras no terraço onde supostamente ocorreu o incidente e no celular do namorado da vítima, que não foi localizado.", "titulo_pt": "Caso Isabelle Caracristi: o que falta esclarecer sobre a morte da jovem", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 183319, "titulo": "‘Ambulância aérea’ faz 50 transportes mensais e atende 6,8 milhões de vidas", "url": "https://www.cnnbrasil.com.br/saude/ambulancia-aerea-faz-50-transportes-mensais-e-atende-68-milhoes-de-vidas/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-27T06:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 'ambulância aérea' realiza cerca de 50 transportes mensais no Brasil, atendendo a 6,8 milhões de pessoas. O serviço é fundamental para o transporte de órgãos e tecidos, onde o tempo é crucial, com mais de 54 mil itens transportados desde 2014.", "titulo_pt": "‘Ambulância aérea’ faz 50 transportes mensais e atende 6,8 milhões de vidas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 183321, "titulo": "Mais de 37 mil brasileiros aguardam transplante de córnea; entenda cirurgia", "url": "https://www.cnnbrasil.com.br/saude/mais-de-37-mil-brasileiros-aguardam-transplante-de-cornea-entenda-cirurgia/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-27T06:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A fila de espera para transplantes de córnea no Brasil aumentou em 24% nos últimos seis meses. A cirurgia é realizada apenas com doações de tecidos após a morte do doador.", "titulo_pt": "Mais de 37 mil brasileiros aguardam transplante de córnea; entenda a cirurgia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 184613, "titulo": "Devastadora inundación en Bangkok: declaran estado de desastre por los 300 milímetros caídos en 48 horas y hay más 5.000 evacuados", "url": "https://www.clarin.com/mundo/devastadora-inundacion-bangkok-declaran-estado-desastre-300-milimetros-caidos-48-horas-5000-evacuados_0_gZQyVaPsXN.html", "fonte_id": "clarin", "data_pub": "2026-09-27T21:07:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mais de 50.000 famílias foram afetadas pela inundação em Bangkok, com mais de 5.000 pessoas evacuadas. As aulas foram canceladas e as autoridades pediram para que a população permanecesse em casa.", "titulo_pt": "Inundação devastadora em Bangkok: estado de desastre declarado após chuvas de 300 milímetros em 48 horas e mais de 5.000 evacuados", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 184722, "titulo": "Lula's mixed environmental record has brought less deforestation but more oil", "url": "https://www.lemonde.fr/en/environment/article/2026/09/27/lula-s-mixed-environmental-record-has-brought-less-deforestation-but-more-oil_6758014_114.ht es, inundações e deixando cerca de 150.000 residências sem energia. Emergências foram declaradas em várias áreas de Nova York e Nova Jersey.", "titulo_pt": "Potente tempestade atinge costa leste dos EUA: um morto, inundações e quase 150.000 casas sem luz", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 183914, "titulo": "Elevação do nível do mar destrói casas e apaga praias na Califórnia", "url": "https://www.cnnbrasil.com.br/internacional/elevacao-do-nivel-do-mar-destroi-casas-e-apaga-praias-na-california/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-27T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Casas foram destruídas e praias desapareceram na Califórnia devido a uma série de ciclones e furacões do Pacífico Oriental, intensificados pelo fenômeno El Niño.", "titulo_pt": "Elevação do nível do mar destrói casas e apaga praias na Califórnia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 184315, "titulo": "3 hikers fall ill on Hong Kong trails as temperatures top 33 degrees", "url": "https://www.scmp.com/news/hong-kong/society/article/3368956/3-hikers-fall-ill-hong-kong-trails-temperatures-top-33-degrees?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-27T11:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos três excursionistas se sentiram mal em trilhas rurais de Hong Kong durante um dia com temperaturas de até 33 graus Celsius. Um visitante de 25 anos foi suspeito de sofrer de choque térmico durante uma caminhada no percurso popular de High Island Reservoir East Dam-Po Pin Chau em Sai Kung.", "titulo_pt": "Pelo menos três caminhoneiros se sentem mal em trilhas de Hong Kong com temperaturas acima de 33 graus", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 183542, "titulo": "Thousands march for climate across France: 'I wish there were more of us, after the summer we've just had'", "url": "https://www.lemonde.fr/en/environment/article/2026/09/27/thousands-march-for-climate-across-france-i-wish-there-were-more-of-us-after-the-summer-we-ve-just-had_6757999_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-27T07:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em diversas cidades francesas, desde Bordéus até Paris, ocorreram 260 manifestações envolvendo 120 mil pessoas em prol do clima, da vida, da paz e da justiça social.", "titulo_pt": "Milhares marcham por clima em toda França: 'gostaria que houvessem mais de nós, depois do verão que passamos'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 183320, "titulo": "Onda de calor sufocante pode fazer temperatura passar dos 40ºC em 8 estados", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/onda-de-calor-sufocante-pode-fazer-temperatura-passar-dos-40oc-em-8-estados/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-27T06:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma onda de calor intensa está afetando 8 estados brasileiros, com previsão de temperatura acima dos 40ºC até a próxima quarta-feira (30). O fenômeno começou no sábado (26) e deve durar até o próximo dia 30, conforme previsão do Instituto Nacional de Meteorologia (Inmet).", "titulo_pt": "Onda de calor sufocante pode fazer temperatura passar dos 40ºc em 8 estados", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 183671, "titulo": "Nepal’s hydropower ambitions face climate reality check", "url": "https://www.japantimes.co.jp/environment/2026/09/27/energy/nepal-hydropower-focus/", "fonte_id": "japan_times", "data_pub": "2026-09-27T03:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 90% da eletricidade de Nepal vem da hidropotência, mas danos extensos aos seus projetos fluviais levantaram dúvidas sobre a segurança energética do país.", "titulo_pt": "Ambições de hidropotência de nepal enfrentam veredito da realidade climática", "veiculo": "The Japan Ti const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}
