<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

const D = {"gerado_em": "26/11/2026 19:19", "stats": {"noticias_novas": 524, "resumos_gerados": 232}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva enfrenta desafios em sua gestão. O setor de carne busca intervenção direta para retomar as exportações para a União Europeia, que foram suspensas por causa do uso excessivo de antibióticos. Além disso, Lula tem pressionado para resolver o problema do Banco de Brasília (BRB), com a Caixa Econômica Federal avaliando a possibilidade de adquirir o banco. No âmbito político, o governo e o Partido dos Trabalhadores (PT) discutem o financiamento para a posse de Lula, marcada para 5 de janeiro. No cenário econômico, o Supremo Tribunal Federal decidiu que estados e municípios devem aprovar leis próprias para aplicar o piso nacional do magistério público. O Conselho de Ministros de Orçamento aprovou o Orçamento de 2027, com um corte de R$ 2,09 bilhões para emendas parlamentares.", "mundo": "Os líderes europeus tiveram dificuldades para chegar a um acordo sobre o orçamento da União Europeia durante sua reunião, que foi encerrada mais cedo do que o previsto. Eles pretendem tentar novamente em dezembro. Em outro desenvolvimento, Pablo Hernández de Cos, ex-diretor do Banco de Espanha, foi escolhido como próximo presidente do Banco Central Europeu (BCE), sucedendo Christine Lagarde. Além disso, o número de imigrantes no Reino Unido caiu para o nível mais baixo desde 1997, fora a pandemia, e o Partido Trabalhista atribui parte desse declínio às suas políticas. Por fim, o ator francês Gérard Depardieu será julgado por acusações de estupro e assédio sexual, que datam de 2018, após o Tribunal de Apelações de Paris confirmar a decisão.\n\nA Lituânia ameaça revogar o status diplomático de representação de Taiwan para melhorar suas relações com a China, um desenvolvimento significativo na geopolítica regional. No Oriente Médio, Israel atacou um campamento de treinamento do Hezbolá no Líbano, enquanto palestinos relataram a destruição de suas casas no Território Ocidental da Cisjordânia por forças israelenses. O presidente dos EUA, Donald Trump, pressionou o presidente russo, Vladimir Putin, a reduzir a 'agressão militar' na Europa, em meio a tensões com a Ucrânia. No Irã, o país negou ter responsabilidade por um ataque aéreo em Kuwait que resultou na morte de dois cidadãos italianos. Em outro incidente, o ministro das Relações Exteriores do Irã negou a responsabilidade, enquanto a Arábia Saudita informou que operações em sua refinaria de Jazan foram interrompidas após um ataque. Na Europa, a OTAN deslocou um avião AWACS para a Polônia em resposta a acusações de lançamento de mísseis balísticos russos, enquanto a Finlândia reiterou a importância de envolver a Ucrânia em decisões sobre a segurança europeia.", "economia": "O Ibovespa registrou a maior alta desde o primeiro turno das eleições, com o dólar cotado a R$ 5,74, marcando um momento positivo para o mercado acionário. Apesar disso, a Usiminas projeta resultados menores no quarto trimestre devido à pressão cambial e à baixa rentabilidade nas vendas de minério de ferro. Por outro lado, o governo brasileiro prorrogou por mais 30 dias o subsídio de R$ 2,12 ao diesel para controlar a alta dos preços internacionais do petróleo. Além disso, a Latam Brasil recebeu R$ 2,7 bilhões de crédito do BNDES para enfrentar o aumento do preço do querosene de aviação, consequência da guerra no Irã. A reforma tributária também está em pauta, com um relatório do Instituto Fiscal do Estado sugerindo que a alíquota da CBS poderia ser reduzida para 7% sem exceções, o que seria um grande alívio para as empresas.", "tecnologia": "A SpaceX obteve autorização dos Estados Unidos para implantar um data center no espaço com 1 milhão de satélites, o que levanta preocupações sobre os impactos ambientais e de segurança. A empresa de Elon Musk planeja iniciar a operação desses data centers a partir de 2033, alimentados por energia solar. Em outro contexto, a inteligência artificial (IA) tem sido debatida em vários campos, desde sua aplicação na medicina até a possibilidade de diagnósticos automatizados, conforme afirmou Christian González, chefe do serviço de urgência da Clínica Santa María. A IA também está sendo discutida em relação às finanças pessoais, com a ferramenta Claude Personal Finance lendo contas via Plaid, mas bancos americanos já impedem agentes autônomos em pagamentos. Além disso, a empresa chinesa Z.AI está atrasada no lançamento de seu próximo modelo de inteligência artificial devido a restrições de acesso à capacidade computacional no exterior, enquanto a empresa americana Anthropic realizou sua oferta inicial de ações no mesmo dia em que Grand Theft Auto VI se tornou um dos lançamentos de entretenimento mais bem-sucedidos de todos os tempos.", "ciencia": "Um importante avanço na astrofísica foi realizado com a descoberta do quasar mais distante conhecido, formado cerca de 630 milhões de anos após o Big Bang, estabelecendo um novo recorde. Além disso, a NASA anunciou a busca por astronautas para viver na Lua, com salários de US$ 164 mil ao ano, visando a construção de uma base no polo sul lunar. Em um estudo notável, cientistas da St. Jude Children's Research Hospital descobriram os mecanismos de transporte de aminoácidos em uma proteína associada a uma doença rara, oferecendo insights valiosos para futuros avanços na engenharia genômica. Também foram realizados estudos significativos em biologia molecular, como a criação de vírus sintéticos por inteligência artificial e a identificação de padrões de comportamento em grupos sociais ao longo do tempo. Estes avanços abrangem desde a exploração espacial até a compreensão da genética humana, demonstrando a amplidão e profundidade da pesquisa científica contemporânea.", "cultura": "A prefeitura de São Paulo lançou um edital para buscar patrocínios para 780 blocos de carnaval que desfilam na capital em 2027, com um orçamento mínimo de R$ 36 milhões. Esta notícia ressalta a importância do carnaval para a cultura local e a necessidade de financiamento para a realização deste evento. Paralelamente, a exposição Terra Viva Biomas Brasileiros foi inaugurada no Parque Bondinho Pão de Açúcar, oferecendo uma experiência imersiva sobre a Amazônia. Esta é a primeira exposição desse tipo no local, aproveitando a popularidade do cartão-postal do Rio de Janeiro para promover a cultura ambiental. Além disso, uma exposição de obras de Pierre-Auguste Renoir abriu no Centro Cultural TCU em Brasília, com 11 pinturas do artista e uma sala imersiva, destacando a importância da arte na cultura brasileira.", "sociedade": "As autoridades brasileiras estão investigando instalações de cuidados de longo prazo por suspeitas de abuso, em um contexto de preocupações com a qualidade de vida dos idosos e pessoas com deficiência. Em Salvador, postos de saúde foram fechados 12 vezes devido à violência, o que afetou a prestação de serviços essenciais. O Ministério Público Federal abriu um inquérito civil para verificar a regulamentação do transporte aéreo de animais de apoio emocional, com o objetivo de garantir a segurança e bem-estar desses animais durante viagens aéreas. Além disso, um levantamento do Inep mostra que negros, pardos e indígenas representam mais da metade das matrículas nas universidades federais, refletindo uma tendência de maior diversidade no ensino superior.", "meio_ambiente": "O Brasil enfrenta diversos desafios ambientais, com destaque para a seca na Amazônia, que levou o governo a considerar um auxílio emergencial para cerca de 400 mil pescadores afetados. Paralelamente, o país dobrou a área de restauração florestal, alcançando 262 mil hectares, em um novo programa apoiado pela fundação de Jeff Bezos. No exterior, a Espanha enfrenta a ameaça de um desastre ambiental após um navio-tanque com 7 mil toneladas de diesel virar perto da ilha de Ibiza, enquanto a Austrália enfrenta um verão com um risco acentuado de incêndios florestais e ondas de calor. Esses eventos refletem a complexidade dos desafios ambientais globais e locais, com impactos imediatos e prolongados em comunidades e ecossistemas.", "direitos_humanos": "Um ano após o grande incêndio em Hong Kong que deixou 168 mortos e cerca de 4.600 desalojados, sobreviventes estão pressionando por justiça, diante da repressão das autoridades. Em outro caso, Israel aprovou medidas especiais de interrogatório no sistema de prisioneiros palestinos, o que pode levar a erros judiciais irreversíveis. O tribunal chileno decidiu analisar um recurso para que marinheiros acusados de violação em Rapa Nui sejam encarcerados em uma prisão comum, ao invés de uma militar. Além disso, a senadora Campillai apresentou uma denúncia judicial contra ex-comandantes da Carabineros, acusando-os de ter conhecimento de violações aos direitos humanos durante os protestos sociais e de não terem agido para impedir essas violações. O Reino Unido supostamente enviou um refugiado sri lankês condenado por estupro para Eswatini, onde ele se suicidou, como parte de um acordo secreto, de acordo com uma investigação da BBC. A nova lei de pena de morte em Israel entrou em vigor, enquanto a ONU questiona a decisão do UNRWA de demitir funcionários sem evidências comprovadas, levantando questões sobre a credibilidade das alegações israelenses. Além disso, o Vietnã é acusado de sequestrar ativistas pró-democracia do Camboja, com a ONU pedindo explicações sobre esses casos. Em um caso pessoal, Stéphanie e Jonathan foram feridos por fragmentos de granada de eletrocutação em protestos em outubro, com as lesões continuando a afetá-los. Finalmente, Nepal iniciou o processo legal de declarar mortos milhares de pessoas ainda desaparecidas três meses após as inundações catastróficas de verão."}, "resumo_do_dia": {"politica_nacional": [{"id": 289730, "titulo": "Sem Lula na mesa, há temor de que Brasil continue impedido de exportar carne de frango à UE", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/sem-lula-na-mesa-ha-temor-de-que-brasil-continue-impedido-de-exportar-carne-de-frango-a-ue.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-26T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O setor de carne busca intervenção direta do presidente Luiz Inácio Lula da Silva nas negociações para a retomada das exportações de frango para a União Europeia, que estão paralisadas desde setembro. A suspensão ocorreu após a UE retirar o Brasil de sua lista de países que atendem às regras sobre o uso de antibióticos na produção pecuária.", "titulo_pt": "Sem Lula envolvido, há temor de que Brasil continue impedido de exportar carne de frango para a UE", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 289924, "titulo": "Fachin autoriza ex-presidente do BRB a pôr próteses dentárias na Papudinha", "url": "https://www.metropoles.com/colunas/manoela-alcantara/fachin-autoriza-ex-presidente-do-brb-a-por-proteses-dentarias-na-papudinha", "fonte_id": "metropoles", "data_pub": "2026-11-26T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Paulo Henrique Costa, ex-presidente do Banco do Brasil, que está preso desde abril, solicitou a autorização para realizar tratamento odontológico, incluindo a colocação de próteses dentárias, em uma unidade de saúde. A solicitação foi aprovada por Fachin.", "titulo_pt": "Fachin autoriza ex-presidente do banco do Brasil a receber tratamento odontológico", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 289754, "titulo": "Iphan determina tombamento definitivo da antiga sede do DOI-Codi no Rio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/iphan-determina-tombamento-definitivo-da-antiga-sede-do-doi-codi-no-rio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-26T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Iphan determinou o tombamento definitivo da antiga sede do DOI-Codi no Rio de Janeiro, local que atualmente abriga uma unidade do Exército. A decisão foi tomada nesta quinta-feira (26).", "titulo_pt": "Iphan determina tombamento definitivo da antiga sede do DOI-Codi no Rio", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 289755, "titulo": "Colocar o povo para dentro do governo exige mais do que discurso", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/transparencia-publica/2026/11/colocar-o-povo-para-dentro-do-governo-exige-mais-do-que-discurso.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-26T21:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente reeleito anunciou que pretende aumentar a participação do povo nas decisões governamentais. Apesar da criação de infraestrutura para participação social, os resultados até agora são limitados.", "titulo_pt": "Colocar o povo para dentro do governo exige mais do que discurso", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 289756, "titulo": "PF indicia prefeito de Palmas em caso de suspeita de vazamentos de decisões do STJ", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/pf-indicia-prefeito-de-palmas-em-caso-de-suspeita-de-vazamentos-de-decisoes-do-stj.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-26T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal indiciou o prefeito de Palmas, Eduardo Siqueira Campos, e outras três pessoas por suspeita de obstrução a investigações relacionadas a vazamentos de decisões do STJ. O inquérito foi concluído pela PF.", "titulo_pt": "PF indiciou prefeito de Palmas em caso de suspeita de vazamentos de decisões do STJ", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 289849, "titulo": "Ainda na UTI, Bolsonaro sai do quarto para fisioterapia, diz equipe médica", "url": "https://www.cnnbrasil.com.br/politica/ainda-na-uti-bolsonaro-sai-do-quarto-para-fisioterapia-diz-equipe-medica/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-26T21:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Jair Bolsonaro permanece na Unidade de Terapia Intensiva (UTI) sem previsão de alta. A equipe médica informou que ele saiu do quarto para sessões de fisioterapia. Michelle Bolsonaro, sua esposa, relatou que ele está mais animado nas redes sociais.", "titulo_pt": "Ainda na UTI, Bolsonaro faz fisioterapia, diz equipe médica", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 289714, "titulo": "STF decide que aplicação piso nacional de professores depende de lei aprovada em estados e municípios", "url": "https://g1.globo.com/politica/noticia/2026/11/26/stf-decide-que-aplicacao-piso-nacional-de-professores-depende-de-lei-aprovada-em-estados-e-municipios.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-26T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal decidiu que estados e municípios devem aprovar leis próprias para aplicar o piso nacional do magistério público. O efeito automático do piso foi considerado inconstitucional.", "titulo_pt": "STF decide que aplicação do piso nacional de professores depende de lei aprovada em estados e municípios", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 289735, "titulo": "Liquidante do Master diz a STF não se opor a desbloqueio de R$ 316 milhões ao BRB", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/liquidante-do-master-diz-a-stf-nao-se-opor-a-desbloqueio-de-r-316-milhoes-ao-brb.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-26T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa responsável pela liquidação do Banco Master não se opôs ao repasse de R$ 316 milhões ao BRB, do total de recursos retidos na investigação de fraude financeira envolvendo Daniel Vorcaro.", "titulo_pt": "Liquidante do Master não se opõe ao desbloqueio de R$ 316 milhões para o BRB", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 289857, "titulo": "PT e governo discutem quem vai pagar posse de Lula", "url": "https://www.cnnbrasil.com.br/politica/pt-e-governo-discutem-quem-vai-pagar-a-posse-de-lula/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-26T20:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo e o PT estão discutindo a questão do financiamento para a posse de Lula, marcada para 5 de janeiro. O evento promete atrações internacionais, mas o financiamento ainda é incerto.", "titulo_pt": "PT e governo debatem financiamento para posse de Lula", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 289859, "titulo": "Guilherme Boulos trabalha em contraponto ao pacote de ajuste fiscal", "url": "https://www.cnnbrasil.com.br/politica/guilherme-boulos-trabalha-em-contraponto-ao-pacote-de-ajuste-fiscal/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-26T20:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro-chefe da Secretaria-Geral da Presidência, Guilherme Boulos, propõe alternativas ao ajuste fiscal defendido pelo mercado, incluindo corte de emendas, gastos tributários e supersalários.", "titulo_pt": "Guilherme Boulos sugere alternativas ao ajuste fiscal em contraponto ao mercado", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 289762, "titulo": "Lula e Cleitinho debatem negociação de dívida de Minas Gerais", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/lula-e-cleitinho-debatem-negociacao-de-divida-de-minas-gerais", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-26T20:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva e o governador eleito de Minas Gerais, Cleitinho, se reuniram no Palácio da Alvorada para discutir formas de negociar a dívida de aproximadamente R$ 180 bilhões do estado com a União, dentro do Programa de Pleno Pagamento da Dívida dos Estados (Propag). Durante o encontro, o ministro da Fazenda, Dario Durigan, também participou.", "titulo_pt": "Lula e Cleitinho discutem negociação da dívida de Minas Gerais", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 289863, "titulo": "Lula muda postura e passa a cobrar solução para o BRB", "url": "https://www.cnnbrasil.com.br/politica/lula-muda-postura-e-passa-a-cobrar-solucao-para-o-brb/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-26T20:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula alterou sua postura e passou a pressionar pela resolução do problema do Banco do Brasil de Brasília (BRB). A Caixa Econômica Federal está avaliando a possibilidade de adquirir o banco.", "titulo_pt": "Lula altera postura e pressiona por solução para o BRB", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 289745, "titulo": "Governo descarta nova ligação de Lula a Trump sobre tarifas e aguarda setor privado", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/governo-descarta-nova-ligacao-de-lula-a-trump-sobre-tarifas-e-aguarda-setor-privado.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-26T19:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo brasileiro está consultando o setor privado sobre as últimas tarifas impostas pelos Estados Unidos. As novas tarifas incluem taxas sobre o açúcar e aeronaves prontas, anunciadas na última quarta-feira (25).", "titulo_pt": "Governo brasileiro consulta setor privado sobre novas tarifas dos EUA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 289717, "titulo": "Durigan diz que discutirá novas medidas fiscais com Lula: 'Mostrar claramente o caminho para 2027'", "url": "https://g1.globo.com/economia/noticia/2026/11/26/durigan-diz-que-discutira-novas-medidas-fiscais-com-lula-mostrar-claramente-o-caminho-para-2027.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-26T19:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Fazenda, Dario Durigan, afirmou que o governo discutirá novas medidas para controlar despesas públicas e melhorar a situação fiscal, com foco em 2027. Durante um evento, Durigan indicou que haverá uma reunião com o presidente Lula para definir ações que promovam maior previsibilidade nas finanças do país.", "titulo_pt": "Durigan discutirá novas medidas fiscais com Lula: 'mostrar claramente o caminho para 2027'", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 289757, "titulo": "André do Prado pressiona bancada do PL a apoiar novato para presidir a Alesp", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/andre-do-prado-pressiona-bancada-do-pl-a-apoiar-novato-para-presidir-a-alesp.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-26T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Deputados do PL na Alesp afirmam estar sendo pressionados pelo presidente da Casa, André do Prado, a apoiar o novato Rogério Franco para a presidência a partir de 2027. O atual presidente, André do Prado, foi eleito senador em outubro.", "titulo_pt": "André do Prado pressiona bancada do PL a apoiar novato para presidir a Alesp", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 289758, "titulo": "Tarcísio anuncia mais 3 secretários, define 85% da equipe e mantém maioria dos nomes do 1º mandato", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/tarcisio-anuncia-mais-3-secretarios-define-85-da-equipe-e-mantem-maioria-dos-nomes-do-1o-mandato.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-26T18:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Tarcísio de Freitas (Republicanos) anunciou mais três secretários para seu segundo mandato, que começa em 5 de janeiro. A equipe atual já tem 85% definida, mantendo a maioria dos nomes do primeiro mandato.", "titulo_pt": "Tarcísio anuncia mais 3 secretários e define 85% da equipe para segundo mandato", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 289530, "titulo": "Lithuania threatens to revoke Taiwan office status to fix China ties", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/27/2003868491", "fonte_id": "taipei_times", "data_pub": "2026-11-27T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Lituânia ameaça revogar o status da representação da Taiwan para corrigir as relações com a China. A medida visa melhorar as relações diplomáticas com o país asiático.", "titulo_pt": "Lituânia ameaça revogar status da representação da Taiwan para melhorar relações com a China", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 290179, "titulo": "Sex, drugs, Israeli tech and Trump rivalries: Five explosive claims from Kushner-UAE book", "url": "https://www.middleeasteye.net/news/sex-drugs-israeli-tech-and-trump-rivalries-five-explosive-claims-kushner-uae-book", "fonte_id": "middle_east_eye", "data_pub": "2026-11-26T21:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O livro 'Princesas e Ladinos' do jornalista Matthew Cole faz cinco acusações explosivas, incluindo que o líder dos Emirados Árabes Unidos teria chantageado seu irmão por atividades homossexuais e teria supervisionado tratamentos médicos que causaram danos neurológicos.", "titulo_pt": "Sexo, drogas, tecnologia israelense e rivalidades de Trump: cinco acusações explosivas do livro Kushner-UAE", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 289954, "titulo": "Debate electoral 29-N a cuatro, en directo | Sánchez cambia de estrategia en el segundo debate y pasa al ataque: “A otro perro con ese hueso”", "url": "https://elpais.com/espana/elecciones-generales/2026-11-26/debate-electoral-29-n-a-cuatro-entre-sanchez-feijoo-abascal-y-colau-en-directo.html", "fonte_id": "elpais_america", "data_pub": "2026-11-26T21:57:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "No segundo debate eleitoral, Sánchez adotou uma estratégia mais agressiva, criticando os cortes propostos por Vox. Colau defendeu políticas mais agressivas em relação à habitação, enquanto Vox culpou a imigração por problemas. Feijóo pediu reduções de impostos e a construção de mais moradias.", "titulo_pt": "Debate eleitoral de 29-N em quatro partes, em direto | Sánchez muda de estratégia e passa ao ataque", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 290071, "titulo": "Israel anuncia ataques contra una instalación de cohetes de Hezbolá en el sur de Líbano", "url": "https://www.latercera.com/mundo/noticia/israel-anuncia-ataques-contra-una-instalacion-de-cohetes-de-hezbola-en-el-sur-de-libano/", "fonte_id": "la_tercera", "data_pub": "2026-11-26T21:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Israel realizou ataques contra um campamento de treinamento da Fuerza Radwan do Hezbolá na região de Ain al-Tinah, no sul do Líbano. A informação foi confirmada pela porta-voz militar israelense, a tenente coronel Ella Waweya.", "titulo_pt": "Israel anuncia ataques contra campamento de treinamento do Hezbolá no sul do Líbano", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 290023, "titulo": "Darío Sztajnszrajber explica por qué la filosofía cuestiona la idea de que todo tiene que ser útil", "url": "https://www.lanacion.com.ar/sociedad/dario-sztajnszrajber-explica-por-que-la-filosofia-cuestiona-la-idea-de-que-todo-tiene-que-ser-util-nid25112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-26T21:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Darío Sztajnszrajber, filósofo, explicou à LA NACION que a filosofia não precisa ser útil para ser valiosa. Ele argumentou que o pensamento crítico oferecido pela filosofia ajuda a escapar da lógica da rentabilidade constante.", "titulo_pt": "Darío Sztajnszrajber explica por que a filosofia cuestiona a ideia de que tudo precisa ser útil", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 290180, "titulo": "Settlers smash foundations of Palestinian family's homes in West Bank", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/settlers-smash-foundations-palestinian-familys-homes-west-bank", "fonte_id": "middle_east_eye", "data_pub": "2026-11-26T21:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israelis sequestraram as fundações de duas casas de uma família palestiniana no Ocupoado Território da Cisjordânia. Segundo a família, os ocupantes destruíram as casas após impedirem a família de retornar às propriedades em desacordo com uma ordem judicial israelense.", "titulo_pt": "Ocupantes destróem fundações de casas de família palestiniana no ocupoado território da cisjordânia", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 290136, "titulo": "At odds over the EU budget, European leaders cut summit short - DW has more", "url": "https://www.dw.com/en/at-odds-over-the-eu-budget-european-leaders-cut-summit-short-dw-has-more/live-80056415?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-26T21:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os líderes europeus não conseguiram chegar a um acordo sobre o orçamento da União Europeia durante sua reunião, que foi encerrada mais cedo do que o previsto. Eles pretendem tentar um acordo sobre a financiamento da UE em dezembro.", "titulo_pt": "Divergências sobre o orçamento da ue fazem líderes cortarem reunião e agendam novo encontro para dezembro", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 289751, "titulo": "Em Dia de Ação de Graças, Trump agradece a assassinos e estupradores que deportou", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/11/em-dia-de-acao-de-gracas-trump-agradece-a-assassinos-e-estupradores-que-deportou.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-11-26T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em uma longa e confusa mensagem publicada em Dia de Ação de Graças, o presidente Donald Trump agradeceu a imigrantes ilegais, incluindo assassinos e estupradores, por terem entrado no país e cometido crimes contra cidadãos americanos.", "titulo_pt": "Em Dia de Ação de Graças, Trump agradece a assassinos e estupradores que deportou", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 289752, "titulo": "Imprensa publica novas mensagens antissemitas atribuídas a líder da ultradireita na França", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/11/imprensa-publica-novas-mensagens-antissemitas-atribuidas-a-lider-da-ultradireita-na-franca.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-11-26T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dois meses após a primeira revelação, novas mensagens antissemitas atribuídas a Jordan Bardella, líder do partido francês Reunião Nacional, foram publicadas pelo jornal Le Monde e pelo site Mediapart. Bardella, de 31 anos, é um dos principais candidatos da ultradireita para a eleição presidencial de 2027.", "titulo_pt": "Imprensa divulga novas mensagens antissemitas atribuídas a líder da ultradireita na França", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 290066, "titulo": "U.K. Releases Files on Peter Mandelson, Ambassador Tied to Jeffrey Epstein", "url": "https://www.nytimes.com/2026/11/26/world/europe/peter-mandelson-epstein-uk.html", "fonte_id": "nyt_world", "data_pub": "2026-11-26T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Arquivos divulgados na quinta-feira iluminaram o rápido processo de nomeação de Peter Mandelson e sua continuação de associação com a Global Counsel, um grupo de lobby.", "titulo_pt": "Reino unido revela arquivos sobre Peter Mandelson, ex-consul honorary ligado a Jeffrey Epstein", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 290125, "titulo": "Spain's De Cos chosen as next ECB president", "url": "https://www.france24.com/en/spain-s-de-cos-chosen-as-next-ecb-president", "fonte_id": "france24", "data_pub": "2026-11-26T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os líderes europeus escolheram o ex-diretor do Banco de Espanha, Pablo Hernández de Cos, como próximo presidente do Banco Central Europeu (BCE). Ele substituirá Christine Lagarde em um momento em que o BCE enfrenta pressão para combater a inflação alta, os juros elevados e a dívida governamental.", "titulo_pt": "Espanha's De Cos escolhido como próximo presidente do bce", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 290068, "titulo": "Doug Ford Says He’d Use a Gun to Protect His Family", "url": "https://www.nytimes.com/2026/11/26/world/canada/doug-ford-gun-home-invasion-toronto.html", "fonte_id": "nyt_world", "data_pub": "2026-11-26T21:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O premier de Ontario, Doug Ford, declarou que usaria uma arma de fogo para se defender em caso de invasão domiciliar. Recentemente, há preocupação em Toronto devido a invasões em residências.", "titulo_pt": "Doug Ford diz que usaria uma arma para se defender em caso de invasão", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 290126, "titulo": "Nigeria faces rising election violence in run up to vote", "url": "https://www.france24.com/en/nigeria-faces-rising-election-violence-in-run-up-to-vote", "fonte_id": "france24", "data_pub": "2026-11-26T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há preocupações de que violência eleitoral possa dissuadir os eleitores de participar da eleição presidencial do Nígeria em janeiro. Além disso, o condutor de um carro suspeito de causar um caminhão-pipa de combustível a capotar em uma importante rodovia no Egito foi detido. No Sierra Leoa, o número de mortes maternas caiu dramaticamente desde que o país foi considerado o lugar mais perigoso do mundo para dar à luz.", "titulo_pt": "Nigéria enfrenta crescente violência eleitoral antes das eleições", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 290127, "titulo": "Iranian monarchists disrupt Paris event, highlighting bitter diaspora divide", "url": "https://www.france24.com/en/france/20261126-iranian-monarchists-disrupt-paris-event-highlighting-bitter-diaspora-divide", "fonte_id": "france24", "data_pub": "2026-11-26T21:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um evento em Paris sobre direitos das m t": "A SpaceX recebeu autorização dos EUA para criar um data center no espaço com 1 milhão de satélites. Organizações científicas pedem cautela, alertando para possíveis problemas catastróficos com a implementação desse projeto.", "titulo_pt": "Spacex recebe autorização para data center no espaço com 1 milhão de satélites", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 290197, "titulo": "Roller-coaster fortnight for tech raises urgent questions about AI", "url": "https://www.scmp.com/opinion/world-opinion/article/3375777/roller-coaster-fortnight-tech-raises-urgent-questions-about-ai", "fonte_id": "scmp", "data_pub": "2026-11-26T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Houve uma semana tumultuada no mundo da tecnologia, com Jensen Huang retornando à Nvidia, a empresa onde trabalhou anteriormente, após ter deixado a presidência, o cargo de CEO e a banca de diretores em novembro devido a relatos de relacionamentos extraconjugais, incluindo com a empresária Alice Huang. As autoridades dos EUA suspeitam que ela trabalhou para inteligência estrangeira chinesa, uma acusação negada por Pequim.", "titulo_pt": "Semana de altos e baixos no mundo da tecnologia levanta perguntas urgentes sobre IA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 290039, "titulo": "Luz verde a Starmind, la constelación de un millón de centros de datos orbitales para inteligencia artificial de SpaceX", "url": "https://www.lanacion.com.ar/tecnologia/luz-verde-a-starmind-la-constelacion-de-un-millon-de-centros-de-datos-orbitales-para-inteligencia-nid26112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-26T21:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos autorizaram a SpaceX, empresa de Elon Musk, a implantar uma constelação orbital de data centers a partir de 2033. Estes data centers serão alimentados por energia solar e comporão uma constelação de um milhão de centros de dados orbitais para inteligência artificial.", "titulo_pt": "Luz verde para Starmind, a constelação orbital de um milhão de data centers para inteligência artificial da SpaceX", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 290080, "titulo": "¿Cuán confiable es preguntar sobre nuestra salud a la inteligencia artificial?", "url": "https://www.latercera.com/branded/noticia/cuan-confiable-es-preguntar-sobre-nuestra-salud-a-la-inteligencia-artificial/", "fonte_id": "la_tercera", "data_pub": "2026-11-26T20:55:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O chefe do serviço de urgências de Clínica Santa María, Christian González, afirma que a inteligência artificial pode ser útil para informar e prevenir, mas não para diagnosticar ou medicar. O principal risco, segundo ele, é que o paciente fique tranquilizado e procure atendimento tarde demais.", "titulo_pt": "Quão confiável é consultar nossa saúde com inteligência artificial?", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 290203, "titulo": "[Robert J. Fouser] AI and the translator’s Judgment", "url": "https://www.koreaherald.com/article/10950862", "fonte_id": "korea_herald", "data_pub": "2026-11-26T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor reflete sobre caminhadas no outono e se lembra da Feira Internacional do Livro de Seul, ocorrida no verão. Um destaque foi a exibição da coleção 'Série de Literatura Mundial' da editora Minumsa, que atingiu 504 volumes em 2026.", "titulo_pt": "IA e a julgamento do tradutor", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 290205, "titulo": "Is Alice Huang a spy or not?", "url": "https://techcrunch.com/2026/11/26/is-alice-huang-a-spy-or-not/", "fonte_id": "techcrunch", "data_pub": "2026-11-26T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A principal acusação não comprovada no escândalo Nvidia é que Alice Huang, ex-executiva da Megaspeed com quem o CEO da Nvidia, Jensen Huang, teve um affair extraconjugal, seria uma espiã chinesa.", "titulo_pt": "Alice Huang é espia ou não?", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 290206, "titulo": "X finally gets parental controls after 20 years", "url": "https://techcrunch.com/2026/11/26/x-finally-gets-parental-controls-after-20-years/", "fonte_id": "techcrunch", "data_pub": "2026-11-26T19:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A rede social X, liderada por Elon Musk, implementou finalmente controles parentais para adolescentes, permitindo que os pais e tutores gerenciem o conteúdo que os jovens veem na plataforma.", "titulo_pt": "X por fim adiciona controles parentais após 20 anos", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 290202, "titulo": "Ford unveils the GT41 as it hopes to win Le Mans again", "url": "https://arstechnica.com/cars/2026/11/ford-unveils-the-gt41-as-it-hopes-to-win-le-mans-again/", "fonte_id": "ars_technica", "data_pub": "2026-11-26T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Ford apresentou o GT41 e planeja participar da World Endurance Championship em 2027 com este protótipo.", "titulo_pt": "Ford apresenta o GT41 e se prepara para a world endurance championship em 2027", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 289897, "titulo": "Guia de prompts: como pedir à IA resultados melhores no trabalho, segundo Google e Anthropic", "url": "https://exame.com/inteligencia-artificial/guia-de-prompts-como-pedir-a-ia-resultados-melhores-no-trabalho-segundo-google-e-anthropic/", "fonte_id": "exame", "data_pub": "2026-11-26T17:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Manuais de Google e Anthropic indicam elementos comuns para obter resultados mais precisos da IA, e a revisão humana continua sendo crucial no processo.", "titulo_pt": "Guia de prompts: como pedir à IA resultados melhores no trabalho, segundo Google e Anthropic", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 289900, "titulo": "O currículo ficou mais bonito com a IA. E os recrutadores passaram a confiar menos nele", "url": "https://exame.com/carreira/o-curriculo-ficou-mais-bonito-com-a-ia-e-os-recrutadores-passaram-a-confiar-menos-nele/", "fonte_id": "exame", "data_pub": "2026-11-26T17:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nos Estados Unidos, apenas 22% dos candidatos confessam listar habilidades que não possuem. O artigo destaca como provar competências que não estão explicitamente mencionadas no currículo.", "titulo_pt": "O currículo ficou mais bonito com a IA. E os recrutadores passaram a confiar menos nele", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 289455, "titulo": "Andrew Bailey says unreleased AI models have raised encryption concerns", "url": "https://www.ft.com/content/450920b9-82b8-4a66-960b-5740aa7f94ae?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-26T17:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Andrew Bailey expressou preocupações sobre modelos de inteligência artificial não divulgados que levantaram questões sobre a criptografia. Avanços matemáticos têm alimentado temores de que os dados nos sistemas financeiros estejam em risco.", "titulo_pt": "Andrew Bailey menciona preocupações com modelos de IA não divulgados e avanços matemáticos na criptografia", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 289591, "titulo": "Android app developers will soon have to share their address publicly", "url": "https://www.theverge.com/tech/1043228/android-play-store-google-developer-address-eu", "fonte_id": "the_verge", "data_pub": "2026-11-26T17:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desenvolvedores de aplicativos para Android estão preocupados com sua privacidade após a Google anunciar que a partir do próximo ano, muitos deles terão que compartilhar seu número de telefone e endereço publicamente. A mudança na política visa atender às regulamentações europeias do Digital Services Act.", "titulo_pt": "Desenvolvedores de apps para android terão que compartilhar endereço e número de telefone publicamente", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 289011, "titulo": "Musk promete 2 ações da SpaceX para cada criança dos EUA em ofensiva por apoio à IA", "url": "https://www.infomoney.com.br/mercados/musk-promete-2-acoes-da-spacex-para-cada-crianca-dos-eua-em-ofensiva-por-apoio-a-ia/", "fonte_id": "infomoney", "data_pub": "2026-11-26T17:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Musk oferece duas ações da SpaceX para cada criança dos EUA em uma campanha para apoiar a IA. O objetivo é conquistar apoio público para seus negócios de satélites e IA durante um período de intenso escrutínio público e político sobre a tecnologia.", "titulo_pt": "Musk promete duas ações da SpaceX para cada criança dos EUA em campanha por apoio à IA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 289027, "titulo": "Artistas estão desistindo do Instagram por medo de que IA roube suas obras", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/artistas-estao-desistindo-do-instagram-por-medo-de-que-ia-roube-suas-obras/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-26T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Artistas estão deixando o Instagram devido a preocupações com a possibilidade de inteligência artificial (IA) utilizar suas obras. Mudanças nos termos de serviço das plataformas da Meta estão gerando exclusão de perfis e protestos entre criadores independentes.", "titulo_pt": "Artistas estão desistindo do Instagram por medo de IA roubar suas obras", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 289587, "titulo": "A month with the iPhone Duo has changed how I use my phone", "url": "https://techcrunch.com/2026/11/26/a-month-with-the-iphone-duo-has-changed-how-i-use-my-phone/", "fonte_id": "techcrunch", "data_pub": "2026-11-26T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O uso de um iPhone dobrável durante um mês mudou as rotinas diárias do usuário, incluindo a leitura de livros e a quebra de hábitos de rolagem inconsciente.", "titulo_pt": "Um mês com o iphone dobrável alterou minhas rotinas diárias", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 289912, "titulo": "Claude Personal Finance: o que a chegada da IA às finanças pessoais significa para bancos", "url": "https://exame.com/carreira/claude-personal-finance-o-que-a-chegada-da-ia-as-financas-pessoais-significa-para-bancos/", "fonte_id": "exame", "data_pub": "2026-11-26T16:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A chegada da inteligência artificial (IA) às finanças pessoais, como a ferramenta Claude Personal Finance, que lê contas via Plaid, representa mudanças. No entanto, bancos americanos já impedem agentes autônomos em pagamentos.", "titulo_pt": "Claude Personal Finance: o que a chegada da IA às finanças pessoais significa para bancos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 290212, "titulo": "DESTINY model tracks molecular chemistry on uneven, ice-covered grains in interstellar space", "url": "https://phys.org/news/2026-11-destiny-tracks-molecular-chemistry-uneven.html", "fonte_id": "phys_org", "data_pub": "2026-11-26T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrofísicos da Universidade de Liège desenvolveram um modelo chamado DESTINY que utiliza cadeias de Markov com estados absorventes para rastrear a química molecular em superfícies irregulares cobertas de gelo. Este método matemático nunca havia sido usado anteriormente na astroquímica e foi publicado no jornal Astronomy & Astrophysics.", "titulo_pt": "Modelo DESTINY rastreia química molecular em superfícies irregulares cobertas de gelo no espaço interestelar", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 289753, "titulo": "Cientistas encontram dezenas de espécies potencialmente novas em montanhas da amazônia", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/cientistas-encontram-dezenas-de-especies-potencialmente-novas-em-montanhas-da-amazonia.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-26T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas coletaram milhares de espécimes, incluindo sapos, cobras, lagartos, roedores e plantas, em uma expedição pela serra do Aracá, na Amazônia. Algumas dessas espécimes podem ser novas para a ciência.", "titulo_pt": "Cientistas descobrem dezenas de espécies potencialmente novas nas montanhas da amazônia", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 290213, "titulo": "JWST studies a tiny, metal-poor galaxy with just a fraction of the sun's oxygen abundance", "url": "https://phys.org/news/2026-11-jwst-tiny-metal-poor-galaxy.html", "fonte_id": "phys_org", "data_pub": "2026-11-26T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos usaram o Telescópio Espacial James Webb para estudar uma das galáxias mais pobres em metais conhecidas, LAP2, que era como estávamos 12,2 bilhões de anos atrás. Esta galáxia pequena tem uma massa estelar similar a de uma enorme nuvem de estrelas.", "titulo_pt": "JWST estuda uma galáxia pequena e pobre em metais com apenas uma fração da abundância de oxigênio do sol", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 290211, "titulo": "In a fertility advance, engineered molecular glue stabilizes chromosomes in aging eggs", "url": "https://www.statnews.com/2026/11/26/fertility-advance-engineered-protein-stabilizes-chromosomes-in-aging-eggs/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-26T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores criaram um sistema proteico que restabelece as conexões corretas entre os cromossomos em ovos maduros de mouse, o que abre perspectivas para melhorar os resultados da fertilização in vitro no futuro.", "titulo_pt": "Avanço na fertilidade: sistema proteico estabiliza cromossomos em ovos maduros", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 290214, "titulo": "Wave-like displays in animal groups may have evolved to deceive predators", "url": "https://phys.org/news/2026-11-displays-animal-groups-evolved-predators.html", "fonte_id": "phys_org", "data_pub": "2026-11-26T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Algumas das padrões mais impressionantes no comportamento coletivo surgem em situações de perigo. Quando um predador se aproxima, alguns grupos de animais podem se transformar em padrões que pulsam como ondas, sugerindo que essas formas poderiam ter evoluído como uma forma de engodo.", "titulo_pt": "Exibições ondulantes em grupos de animais podem ter evoluído para enganar predadores", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 290215, "titulo": "Runaway pulsar escapes the remnant of its own supernova", "url": "https://phys.org/news/2026-11-runaway-pulsar-remnant-supernova.html", "fonte_id": "phys_org", "data_pub": "2026-11-26T18:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time de astrônomos descobriu um pulsar raro que escapou da nuvem de detritos deixada pela supernova em que formou. Este achado, liderado por Rohit Dokara, anteriormente do Instituto Max Planck de Astronomia de Raios Cósmicos, é um dos poucos casos conhecidos semelhantes.", "titulo_pt": "Pulsar em fuga escapa do restante de sua própria supernova", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 289941, "titulo": "O que está por trás das \"árvores\" de Marte?", "url": "https://www.dw.com/pt-br/o-que-está-por-trás-das-árvores-de-marte/a-80063892?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-26T18:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Imagens que parecem mostrar 'árvores' em Marte não indicam a presença de vida, mas são resultado de ilusões causadas pelo gelo seco e pelo deslocamento de areia na superfície do planeta vermelho.", "titulo_pt": "O que está por trás das 'árvores' em Marte?", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 289654, "titulo": "The ‘bare-knuckled’ future of life in space with Tim Marshall", "url": "https://spacenews.com/the-bare-knuckled-future-of-life-in-space-with-tim-marshall/", "fonte_id": "spacenews", "data_pub": "2026-11-26T17:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mike Gruss conversou com o jornalista e autor best-seller Tim Marshall sobre como a guerra na Ucrânia serviu como um despertar para a Europa e os Estados Unidos sobre o futuro da vida espacial.", "titulo_pt": "O 'luta-suja' futuro da vida no espaço com Tim Marshall", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 289085, "titulo": "Suplemento de ácido hialurônico pode reduzir marcadores de inflamação", "url": "https://www.metropoles.com/saude/suplemento-de-acido-hialuronico-pode-reduzir-marcadores-de-inflamacao", "fonte_id": "metropoles", "data_pub": "2026-11-26T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ensaio com 150 adultos saudáveis mostrou uma redução nos marcadores de inflamação após 12 semanas de suplementação diária com 120 mg de ácido hialurônico.", "titulo_pt": "Suplemento de ácido hialurônico pode diminuir marcadores de inflamação", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 289600, "titulo": "5G interference can alter high-impact weather forecasts", "url": "https://phys.org/news/2026-11-5g-high-impact-weather.html", "fonte_id": "phys_org", "data_pub": "2026-11-26T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo de pesquisadores dos estados norte-americanos de Nova Jersey e Maryland expressou preocupação sobre a possibilidade de interferências de redes 5G futuras afetarem as medições meteorológicas por satélite e potencialmente alterarem as previsões climáticas.", "titulo_pt": "Interferência de 5g pode alterar previsões meteorológicas de alto impacto", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 289903, "titulo": "Creatina para idosos funciona? O que a ciência diz sobre músculos e cérebro depois dos 50", "url": "https://exame.com/ciencia/creatina-para-idosos-funciona-o-que-a-ciencia-diz-sobre-musculos-e-cerebro-depois-dos-50/", "fonte_id": "exame", "data_pub": "2026-11-26T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A creatina ajuda idosos a ganhar força e músculo com treino, mas sua eficácia no cérebro ainda não foi comprovada scientificamente. O artigo discute mitos e oferece orientações sobre como escolher produtos de creatina.", "titulo_pt": "Creatina para idosos: ajuda os músculos, mas o que sobre o cérebro?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 289904, "titulo": "Ser duro consigo mesmo depois de errar parece motivar. Em Berkeley, a gentileza funcionou melhor", "url": "https://exame.com/carreira/ser-duro-consigo-mesmo-depois-de-errar-parece-motivar-em-berkeley-a-gentileza-funcionou-melhor/", "fonte_id": "exame", "data_pub": "2026-11-26T17:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Depois de uma prova difícil, os alunos que ouviram uma mensagem de autocompaixão estudaram mais para a próxima. Em Berkeley, uma abordagem gentil parecia ser mais eficaz em motivar os estudantes.", "titulo_pt": "Ser gentil consigo mesmo após errar parece ser mais motivador. Em Berkeley, a autocompaixão não funcionou melhor", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 289905, "titulo" 0084, "titulo": "Hay regalos que no se pueden envolver: una escapada entre viñedos en MontGras", "url": "https://www.latercera.com/publirreportajes/noticia/hay-regalos-que-no-se-pueden-envolver-una-escapada-entre-vinedos-en-montgras/", "fonte_id": "la_tercera", "data_pub": "2026-11-26T20:42:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Apenas a 2 horas de Santiago, no coração do Vale de Colchagua, a Viña MontGras oferece experiências únicas nesta Navidade, como criar um próprio vinho e compartilhar refeições entre viñedos, proporcionando momentos de união e memórias especiais.", "titulo_pt": "Há presentes que não podem ser embrulhados: uma escapada entre videiras em MontGras", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 290087, "titulo": "El VPH también es cosa de hombres", "url": "https://www.latercera.com/branded/noticia/el-vph-tambien-es-cosa-de-hombres/", "fonte_id": "la_tercera", "data_pub": "2026-11-26T20:19:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O vírus do papiloma humano também afeta homens. Estudos mostram que homens podem desenvolver lesões causadas pelo VPH e que essas lesões podem levar a complicações graves, incluindo câncer de cuello uterino em parceiras sexuais. A vacinação e o acompanhamento são recomendados tanto para mulheres quanto para homens.", "titulo_pt": "O VPH também é uma questão de homens", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 290089, "titulo": "Trump ataca a los inmigrantes y a sus rivales políticos en su mensaje por el Día de Acción de Gracias", "url": "https://www.latercera.com/mundo/noticia/trump-ataca-a-los-inmigrantes-y-a-sus-rivales-politicos-en-su-mensaje-por-el-dia-de-accion-de-gracias/", "fonte_id": "la_tercera", "data_pub": "2026-11-26T20:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, criticou imigrantes ilegais e rivais políticos em seu discurso pelo Dia de Ação de
