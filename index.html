<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 18/11/2026 07:30 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>

</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "18/11/2026 07:30", "stats": {"noticias_novas": 824, "resumos_gerados": 245}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva está em discussões para formar seu governo, incluindo a definição de ministros-chave como os da Fazenda e da Casa Civil. As negociações envolvem lideranças políticas como Rui Costa, Camilo Santana e Rafael Fonteles. A campanha de Lula conseguiu conectar Flávio Bolsonaro à 'dor do eleitor' durante o primeiro turno, conforme informado pela Metrópole. O STF instalou uma escultura de Oxóssi no Salão Nobre da corte, simbolizando justiça em religiões de matriz africana. A votação do projeto de ajuste fiscal do governo foi adiada no Senado, enquanto a Aneel formou maioria para recomendar o encerramento antecipado da concessão da Enel em São Paulo. O ministro Moretti e o deputado Lindbergh Farias se reconciliaram após atritos sobre o ajuste fiscal, posando juntos para fotos.", "mundo": "O encontro inédito entre os líderes dos Estados Unidos, Donald Trump, da China, Xi Jinping, e da Rússia, Vladimir Putin, durante a cúpula do APEC em Shenzhen, China, é o evento central desta edição. O encontro visa discutir questões econômicas e geopolíticas na região, com expectativas divergentes. Xi Jinping, em um discurso proeminente, enfatizou a importância da China como uma potência global crucial, reduzindo a chance de debates sobre questões controversas. Além disso, o presidente chinês expressou apoio às tentativas de reiniciar o diálogo entre Coreia do Norte e Estados Unidos. Na Coreia do Sul, o presidente Lee Jae Myung pediu aos membros do APEC para trabalharem juntos para assegurar uma suprimento estável de minerais críticos e energia. A Deutsche Bank vazou acidentalmente dados fiscais de Trump, enquanto o presidente dos Estados Unidos minimizou uma série de falhas tecnológicas recentes. Na Rússia, o presidente Putin criticou a União Europeia, afirmando que está perdendo indústria e caindo atrás da concorrência, antes de se reunir com Trump e Xi. Em Israel, a polícia e o serviço de inteligência são acusados de servir os interesses de Benjamin Netanyahu em desafios de resultados eleitorais, enquanto a Coreia do Sul e os Estados Unidos discutem operações conjuntas em todos os domínios militares.\n\nA geopolítica global está em um momento crítico, com vários eventos importantes ocorrendo simultaneamente. Na China, durante a cúpula APEC em Shenzhen, o presidente chinês Xi Jinping defendeu o comércio livre. Em contrapartida, os líderes dos Estados Unidos, Donald Trump, e da Rússia, Vladimir Putin, criticaram o 'protecionismo' ocidental e as sanções. O Irã e o Kuwait também se envolveram em tensões, com o Irã alegando ataques de drones no Kuwait, enquanto o Kuwait condenou os ataques. Além disso, a África enfrenta mudanças na política americana, com Trump excluindo Sudão do Sul e Ruanda do AGOA, o que afeta a economia regional. Em outro front, o conflito no Iêmen continua, com a coalizão liderada por Arábia Saudita dizendo ter interceptado um míssil hutí e destruído 60 alvos militares. A hegemonia dos EUA também está sendo questionada, com o ex-economista-chefe do FMI, Maurice Obstfeld, afirmando que a China é influente demais para ser isolada, indicando uma nova fase de fragmentação econômica.", "economia": "A economia brasileira enfrenta diversos desafios, como o aumento do custo Brasil, estimado em R$ 3,5 trilhões por ano, equivalente a 27,5% do PIB projetado para 2025, de acordo com um estudo do grupo MBC (Movimento Brasil Competitivo). Este custo inclui insegurança e juros altos, com a demora na Justiça sendo considerada um dos principais problemas. A situação econômica também foi afetada pela aprovação de uma medida provisória que libera até R$ 13,5 bilhões em crédito para empresas afetadas pelo tarifaço de 25% imposto pelo governo dos Estados Unidos, liderado por Donald Trump, sobre produtos brasileiros. No mercado de ações, as ações sul-coreanas subiram 2% na sessão de terça-feira, após os resultados financeiros favoráveis da Nvidia. No entanto, a saída do CEO Jensen Huang da empresa desencadeou uma crise de liderança, levando a um aumento de 100% nas vendas no terceiro trimestre. Além disso, o Banco Central anunciou leilões de venda de dólares com compromisso de recompra no valor total de até US$ 1 bilhão para a quarta-feira (18), enquanto a inadimplência no agronegócio aumentou devido à expansão do crédito rural, queda dos preços das commodities e elevação dos juros.", "tecnologia": "O evento mais significativo dos artigos é a realização do IPO (Oferta Pública Inicial) da Anthropic, que arrecadou mais de 64 bilhões de dólares, estabelecendo um novo recorde. A empresa, que recebeu investimentos de gigantes tecnológicos como a Alphabet e a Nvidia, está prestes a concluir a maior oferta inicial de ações da história, com uma colocação privada adicional de 26 bilhões de dólares. Em contraste, a Microsoft lançou novos modelos de inteligência artificial para programação e cibersegurança, competindo com concorrentes como a Anthropic e o OpenAI. Outros temas relevantes incluem a construção de uma nova fábrica de produção pela Lotte Biologics em Incheon, as preocupações do Banco Central Europeu sobre uma possível bolha de crédito em tecnologia, e a rejeição do protecionismo por parte da China durante a cúpula Apec em Shenzhen. Além disso, a Nvidia formou uma comissão de controle de exportação em resposta às novas regulamentações sobre a exportação de tecnologia avançada, enquanto a Microsoft e outras grandes empresas enfrentam interrupções tecnológicas que estão levantando questões sobre a segurança e a confiabilidade dos sistemas digitais.", "ciencia": "Um estudo recente, publicado na revista Sustainable Development, analisou a relação entre o clima e a desigualdade de renda em 23 economias emergentes. O estudo descobriu que maior pressão climática está positivamente associada à desigualdade de renda, medida por três indicadores: o coeficiente Gini, a razão Palma e o índice Theil. O período de análise foi de 2002 a 2022, e o estudo sugere que a renda per capita e a qualidade institucional estavam negativamente associadas à desigualdade, enquanto o desemprego estava positivamente associado. Em outro desenvolvimento, a NASA lançou um desafio educacional chamado 'Power to Explore Student Challenge', convidando estudantes dos EUA do ensino fundamental ao ensino médio a aprenderem sobre sistemas de energia nuclear espacial e a descreverem como esses sistemas poderiam ser usados em explorações lunares. Além disso, a NASA realizou o Space Apps Challenge anual, com um número recorde de 181.835 participantes inscritos em 593 eventos em todo o mundo, convidando os participantes a utilizarem os dados abertos da NASA para abordarem um dos 14 desafios focados em exploração espacial ou ciência da Terra. Por fim, a NASA compartilhou um novo álbum de sons que transforma dados de estrelas jovens em áudio, coletando imagens de estrelas em formação em todo a galáxia e transformando essas informações em sons, proporcionando uma experiência única para os pesquisadores e o público em geral.", "cultura": "O evento mais importante dos artigos é a escolha de Robert Pattinson como o próximo James Bond, anunciada pelo fundador da Amazon, Jeff Bezos. Pattinson será o ator mais jovem a interpretar o icônico papel de James Bond em um novo filme da franquia. Além disso, a escolha gerou entusiasmo entre os fãs do ator, que já havia interpretado um personagem eccentrico no filme 'Crepúsculo'. O novo filme de James Bond será produzido pela Amazon, que pagou mais de 1 bilhão de dólares pelo direito de criar conteúdo para a franquia de filmes de Bond. A escolha de Pattinson foi influenciada por Bezos, que afirmou estar fortemente envolvido na decisão. O festival gastronômico da Folha reuniu 21 restaurantes e bares paulistanos, permitindo que os participantes experimentassem diferentes pratos em um único evento. O festival também incluiu shows musicais e debates sobre gastronomia, com a programação realizada nos dias 7, 8, 14 e 15 de novembro.", "sociedade": "Uma delegada foi denunciada por emprestar uma pistola usada no assassinato de um gari em Minas Gerais, sendo acusada de fornecer a arma repetidamente a um suspeito. Em outro caso, um homem foi preso após tentar assassinar um companheiro de trisal com facadas na cabeça e nas costas, alegando medo de ser morto primeiro. Na França, novos protestos mobilizaram milhares de pessoas, principalmente jovens, em busca de melhores condições de vida. Além disso, a Prefeitura do Rio de Janeiro ampliou o público elegível para vacinação contra o mpox, e o projeto que torna hediondo o crime de maus-tratos a cães e gatos foi aprovado na Câmara. A concorrência pelo tempo dos adolescentes é um tema relevante, com variações na organização do tempo entre estudantes do 9º ano da rede pública, revelando desigualdades que os indicadores não sempre capturam.", "meio_ambiente": "A COP31, que debate justiça climática e financiamento, está em sua reta final e enfrenta impasses financeiros. Paralelamente, o Brasil enfrenta condições climáticas adversas, com temporais, rajadas de vento e queda de granizo, além de altas temperaturas. Na ilha do arquipélago Aride, tartarugas gigantes foram reintroduzidas após 180 anos, levando a uma recuperação rápida do ecossistema. Em meio a esses eventos, o preço do tomate aumentou significativamente em várias capitais brasileiras devido às condições climáticas adversas. Além disso, o El Niño afeta o Distrito Federal, com a previsão de temperaturas acima da média, favorecendo a proliferação de doenças como dengue, chikungunya e zika.", "direitos_humanos": "O caso mais significativo abordado nos artigos refere-se ao julgamento do Tribunal Internacional de Justiça (TJ Internacional), que pode decidir sobre o retorno dos refugiados rohingya, que vivem no exílio há quase uma década. A decisão do TJ Internacional será crucial para determinar se os refugiados rohingya poderão retornar à sua terra natal, Myanmar. No entanto, a incerteza persiste sobre o impacto real dessa decisão. Paralelamente, a situação humanitária no Iêmen continua alarmante, com pelo menos 64 crianças mortas ou feridas devido à intensificação dos conflitos, o que também interrompeu o acesso a serviços essenciais. Em outro desenvolvimento, o Peru se tornou o primeiro país a conceder direitos legais às abelhas sem ferrão, protegendo-as contra desmatamento, pesticidas e mudanças climáticas, destacando a importância de proteger não apenas os direitos humanos, mas também os direitos de outros seres vivos."}, "resumo_do_dia": {"politica_nacional": [{"id": 271423, "titulo": "Pode o senador revelar seu voto para presidente da Casa?", "url": "https://www.jota.info/opiniao-e-analise/colunas/defensor-legis/pode-o-senador-revelar-seu-voto-para-presidente-da-casa", "fonte_id": "jota", "data_pub": "2026-11-18T09:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O sigilo do voto parlamentar garante a independência dos senadores na tomada de decisão sobre seus votos. Isso significa que os senadores não podem revelar publicamente como votaram.", "titulo_pt": "Senador pode revelar seu voto para presidente da Casa?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 271359, "titulo": "Lula discute formação do governo com Rui Costa, Camilo Santana e Rafael Fonteles", "url": "https://www.infomoney.com.br/politica/lula-discute-formacao-do-governo-com-rui-costa-camilo-santana-e-rafael-fonteles/", "fonte_id": "infomoney", "data_pub": "2026-11-18T09:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula está discutindo a formação do governo com Rui Costa, Camilo Santana e Rafael Fonteles. A maior expectativa está nas definições dos futuros ministros da Fazenda e da Casa Civil.", "titulo_pt": "Lula discute formação do governo com Rui Costa, Camilo Santana e Rafael Fonteles", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 271220, "titulo": "Petistas reagem a Erika Hilton e jogam decisão sobre Prefeitura de SP em 2028 para Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/petistas-reagem-a-erika-hilton-e-jogam-decisao-sobre-prefeitura-de-sp-em-2028-para-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-18T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A possibilidade de Erika Hilton (PSOL) se filiar ao PT e se candidatar à Prefeitura de São Paulo em 2028 antecipou o debate interno sobre a eleição municipal futura. Petistas reagiram a essa possibilidade, indicando que Lula pode ser o nome para a disputa em 2028.", "titulo_pt": "Petistas reagem a Erika Hilton e jogam decisão sobre Prefeitura de SP em 2028 para Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 271323, "titulo": "Os \"aprendizados\" da campanha de Lula no primeiro e no segundo turno", "url": "https://www.metropoles.com/colunas/vinicius-passarelli/os-aprendizados-da-campanha-de-lula-no-primeiro-e-no-segundo-turno", "fonte_id": "metropoles", "data_pub": "2026-11-18T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesq s, que tem novo diretor-presidente", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/edir-macedo-aporta-r-17-bi-no-digimais-que-tem-novo-diretor-presidente.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T02:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O bispo Edir Macedo, proprietário da Igreja Universal, investiu R$ 1,714 bilhão no Digimais no mês passado. Este investimento foi mencionado no balanço do primeiro semestre do banco.", "titulo_pt": "Edir Macedo investe R$ 1,7 bi no Digimais, com novo diretor-presidente", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 271431, "titulo": "UNE faz ato esvaziado contra ajuste fiscal na Avenida Faria Lima", "url": "https://www.jota.info/legislativo/une-faz-ato-esvaziado-contra-ajuste-fiscal-na-avenida-faria-lima", "fonte_id": "jota", "data_pub": "2026-11-18T02:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Houve uma manifestação contra o ajuste fiscal na Avenida Faria Lima, mas ela foi considerada esvaziada. O deputado federal André Janones criticou a manifestação nesta semana.", "titulo_pt": "UNE realiza ato vazio contra ajuste fiscal na Avenida Faria Lima", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 271222, "titulo": "Lula gasta R$ 133 mi na eleição e Flávio, R$ 115 mi; marketing, redes sociais e viagens lideram despesas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/lula-gasta-r-133-mi-na-eleicao-e-flavio-r-115-mi-marketing-redes-sociais-e-viagens-lideram-despesas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-18T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de Lula gastou R$ 133 milhões, enquanto a de Flávio Bolsonaro gastou R$ 115 milhões, de acordo com o balanço final do TSE. Ambos os candidatos investiram majoritariamente em marketing político, impulsionamento de conteúdo nas redes sociais e transporte ou deslocamento.", "titulo_pt": "Lula gasta R$ 133 mi na eleição e Flávio, R$ 115 mi; marketing, redes sociais e viagens lideram despesas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 271223, "titulo": "O cônsul, o cardeal e a tigrada", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/eliogaspari/2026/11/o-consul-o-cardeal-e-a-tigrada.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-18T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em outubro de 1976, o surto terrorista no Araguaia havia sido contido e a última guerrilheira capturada e executada. O general Ednardo d'Ávila Melo foi demitido e substituído por Dilermando Gomes Monteiro, que tentava combater as atividades do DOI e seus membros, que estavam colocando bombas em bancas de jornal.", "titulo_pt": "O cônsul, o cardeal e a tigrada", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 271224, "titulo": "Símbolo africano no STF é sinalização de Fachin contra racismo no Judiciário, diz fundador de instituto", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/simbolo-africano-no-stf-e-sinalizacao-de-fachin-contra-racismo-no-judiciario-diz-fundador-de-instituto.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-18T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O advogado Hédio Silva Júnior, fundador do Idafro, considera que a instalação de um símbolo africano da Justiça no STF representa um passo importante para o combate ao racismo e o respeito ao multiculturalismo no Judiciário.", "titulo_pt": "Símbolo africano no STF é sinalização de Fachin contra racismo no Judiciário, diz advogado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 271225, "titulo": "Moraes é alvo de pressão e indica a parlamentares que vai liberar ação que reduz pena de Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/moraes-e-alvo-de-pressao-e-indica-a-parlamentares-que-vai-liberar-acao-que-reduz-pena-de-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-18T01:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes, do STF, informou a parlamentares que vai liberar a ação que pode reduzir a pena do ex-presidente Jair Bolsonaro e outros condenados pela trama golpista e ataques de 8 de janeiro de 2023.", "titulo_pt": "Moraes indica que vai liberar ação para reduzir pena de Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 271263, "titulo": "Moretti e Lindbergh fazem as pazes após atritos por causa de ajuste fiscal e posam juntos para foto", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/moretti-e-lindbergh-fazem-as-pazes-apos-atritos-por-causa-de-ajuste-fiscal-e-posam-juntos-para-foto.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T00:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Planejamento e Orçamento, Bruno Moretti, e o deputado federal Lindbergh Farias (PT-RJ) se reconciliaram após atritos sobre o ajuste fiscal e posaram juntos para fotos durante uma reunião do partido que confirmou o apoio dos petistas à proposta do governo Lula.", "titulo_pt": "Moretti e Lindbergh fazem as pazes e posam juntos após atritos sobre ajuste fiscal", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 271844, "titulo": "Deutsche Bank vazou acidentalmente dados fiscais de Trump, diz “FT”", "url": "https://www.poder360.com.br/poder-internacional/deutsche-bank-vazou-acidentalmente-dados-fiscais-de-trump-diz-ft/", "fonte_id": "poder360", "data_pub": "2026-11-18T09:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "De acordo com o jornal britânico, a Deutsche Bank vazou dados fiscais de Trump de forma acidental. O banco também realizou movimentações financeiras suspeitas no valor de US$ 582 milhões relacionadas a Jeffrey Epstein.", "titulo_pt": "Deutsche Bank vazou dados fiscais de Trump e movimentou us$ 582 milhões em pagamentos suspeitos", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 271891, "titulo": "Seoul secures MFN treatment for films, games in China under FTA deal", "url": "https://en.yna.co.kr/view/AEN20261118009700320", "fonte_id": "yonhap_news", "data_pub": "2026-11-18T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Seul e Pequim chegaram a um acordo substancial sobre a Tarifa Preferencial Mais Favorável (MFN) para filmes e jogos sob um acordo de livre-comércio. O acordo garante tratamento preferencial para o conteúdo cultural sul-coreano no mercado chinês.", "titulo_pt": "Seul conquista tratamento MFN para filmes e jogos na China por meio de acordo de livre-comércio", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 271561, "titulo": "Apec summit live: Xi welcomes Trump on China visit as Putin claims Europe in ‘humiliating decline’ in speech", "url": "https://www.theguardian.com/world/live/2026/nov/18/apec-summit-live-updates-xi-putin-trump-world-leaders-gather-in-china", "fonte_id": "guardian_world", "data_pub": "2026-11-18T09:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Apec (Acordo de Parceria Trans-Pacífico) está sendo realizado em Shenzhen, China, com uma reunião esperada entre Xi Jinping, Donald Trump e Vladimir Putin. O evento visa discutir questões econômicas e geopolíticas na região.", "titulo_pt": "Xi acolhe Trump na visita à China enquanto Putin afirma declínio humilhante da Europa", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 271892, "titulo": "Lee calls on APEC members to work together to ensure stable supply of critical minerals, energy", "url": "https://en.yna.co.kr/view/AEN20261118009600315", "fonte_id": "yonhap_news", "data_pub": "2026-11-18T09:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente sul-coreano Lee Jae Myung pediu aos membros do APEC para trabalharem juntos para assegurar uma suprimento estável de minerais críticos e energia. Essa declaração foi feita em Shenzen, China, em 18 de novembro.", "titulo_pt": "Lee pede cooperação para garantir suprimento estável de minerais críticos e energia aos membros do APEC", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 271728, "titulo": "Piecemeal wars: A new kind of world war is already under way", "url": "https://www.aljazeera.com/opinions/2026/11/18/piecemeal-wars-a-new-kind-of-world-war-is-already-under-way?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-18T09:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Conflitos regionais cada vez mais se conectam devido aos interesses de potências rivais.", "titulo_pt": "Guerras em fragmentos: um novo tipo de guerra mundial já está em curso", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 271729, "titulo": "As Trump arrives in China, low expectations for breakthroughs in rivalry", "url": "https://www.aljazeera.com/economy/2026/11/18/as-trump-arrives-in-china-low-expectations-for-breakthroughs-in-rivalry?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-18T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Analistas esperam poucos resultados concretos das conversas entre os líderes nos intervalos do APEC.", "titulo_pt": "Ao chegar na China, baixas expectativas para avanços na rivalidade", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 271709, "titulo": "Thirty years after Rabin's assassination, Israel is again flirting with political violence", "url": "https://www.middleeasteye.net/opinion/thirty-years-after-rabins-assassination-israel-again-flirting-political-violence", "fonte_id": "middle_east_eye", "data_pub": "2026-11-18T09:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trinta anos após o assassinato de Rabin, Israel está novamente enfrentando um aumento de discurso de ódio e racismo, especialmente após as eleições que deram aos árabes o equilíbrio de poder. Isso ocorre enquanto Benjamin Netanyahu, então líder da oposição israelense, fazia um discurso no Knesset em setembro de 1993, dois anos antes do assassinato de Yitzhak Rabin.", "titulo_pt": "Trinta anos após o assassinato de Rabin, Israel está novamente em contato com violência política", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 271422, "titulo": "Ucrânia, tarifas e Irã devem pautar encontro inédito entre Trump, Xi e Putin", "url": "https://www.dw.com/pt-br/ucrânia-tarifas-e-irã-devem-pautar-encontro-inédito-entre-trump-xi-e-putin/a-79975529?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-18T09:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os líderes dos Estados Unidos, Donald Trump, da China, Xi Jinping, e da Rússia, Vladimir Putin, se encontram pela primeira vez durante a cúpula da APEC. O encontro ocorre com expectativas divergentes, e Trump chega ao encontro enfraquecido após as eleições nos Estados Unidos.", "titulo_pt": "Ucrânia, tarifas e Irã devem pautar encontro inédito entre Trump, Xi e Putin", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 271732, "titulo": "India-UK ties outride Modi’s ‘decolonisation’ rhetoric", "url": "https://www.aljazeera.com/news/2026/11/18/india-uk-ties-outride-modis-decolonisation-rhetoric?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-18T09:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A visita do Príncipe William enfatiza o crescente parceria entre Nova Deli e Londres, apesar de sua história colonial. O título traduzido seria: Relações entre Índia e Reino Unido vão além do 'decolonização' de Modi.", "titulo_pt": "Relações entre Índia e reino unido vão além do 'decolonização' de Modi", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 271673, "titulo": "Trump lands in China for historic meeting with Xi, Putin", "url": "https://www.cnbc.com/2026/11/18/trump-xi-putin-china-apec.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-18T09:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, chegou a Shenzhen para uma reunião trilateral histórica com o líder chinês Xi Jinping e o presidente russo Vladimir Putin.", "titulo_pt": "Trump chega a China para reunião histórica com Xi e Putin", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 271591, "titulo": "America’s Hidden AI Advantage", "url": "https://www.foreignaffairs.com/united-states/americas-hidden-ai-advantage", "fonte_id": "foreign_affairs", "data_pub": "2026-11-18T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos, e não a China, dominam a difusão da inteligência artificial.", "titulo_pt": "A vantagem oculta dos EUA na IA", "veiculo": "Foreign Affairs", "pais": "EUA", "classe": "A"}, {"id": 271592, "titulo": "The Model Middle Power", "url": "https://www.foreignaffairs.com/south-korea/model-middle-power", "fonte_id": "foreign_affairs", "data_pub": "2026-11-18T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "South Korea tem uma abordagem correta em geopolítica.", "titulo_pt": "O modelo de potência média", "veiculo": "Foreign Affairs", "pais": "EUA", "classe": "A"}, {"id": 271893, "titulo": "S. Korea launches 1st fact-finding mission to 1987 KAL bombing site in Myanmar after 39 yrs", "url": "https://en.yna.co.kr/view/AEN20261118009500315", "fonte_id": "yonhap_news", "data_pub": "2026-11-18T08:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo da Coreia do Sul enviou uma equipe para Myanmar para inspecionar o local do bombardeio da KAL em 1987 após 39 anos.", "titulo_pt": "Coreia do sul inicia 1ª missão de verificação no local do bombardeio da KAL em Myanmar após 39 anos", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 271823, "titulo": "Xi Jinping urges South Korea to cooperate with China on AI and supply chains", "url": "https://www.scmp.com/news/china/diplomacy/article/3374885/xi-jinping-urges-south-korea-cooperate-china-ai-and-supply-chains", "fonte_id": "scmp", "data_pub": "2026-11-18T08:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Xi Jinping, presidente da China, pediu à Coreia do Sul uma cooperação em cadeias de suprimento globais, coordenação de políticas econômicas e colaboração em tecnologias emergentes como inteligência artificial durante uma reunião em Shenzhen. A reunião durou 34 minutos e ocorreu durante a cúpula APEC em Shenzhen.", "titulo_pt": "Xi Jinping incentiva Coreia do sul a cooperar com China em AI e cadeias de suprimento", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 271568, "titulo": "David Lammy urges Andy Burnham to fight next election on rejoining EU", "url": "https://www.theguardian.com/politics/2026/nov/18/david-lammy-andy-burnham-campaign-rejoining-eu-election-brexit", "fonte_id": "guardian_world", "data_pub": "2026-11-18T08:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "David Lammy pediu a Andy Burnham que prometa reentrar na União Europeia na próxima eleição. Lammy acredita que o discurso do primeiro-ministro em conferência abriu uma oportunidade nesse tema.", "titulo_pt": "David Lammy incentiva Andy Burnham a lutar pela próxima eleição com a promessa de reentrar na ue", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 271675, "titulo": "Putin says EU is losing industry, falling behind competition, ahead of meeting with Trump and Xi", "url": "https://www.cnbc.com/2026/11/18/putin-apec-eu-trump-xi-meeting.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-18T08:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Putin afirmou que a União Europeia está perdendo indústria e caindo atrás da concorrência, antes de se reunir com Trump e Xi. O presidente russo enfatizou a resiliência econômica do país, mesmo com sanções dos EUA, e destacou oportunidades para membros da APEC em território russo.", "titulo_pt": "Putin diz que EUA está perdendo indústria e caindo atrás da concorrência antes de reuniões com Trump e Xi", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 271360, "titulo": "Presidente do conselho da Nvidia descarta possibilidade de recontratar Huang", "url": "https://www.infomoney.com.br/business/presidente-do-conselho-da-nvidia-descarta-possibilidade-de-recontratar-huang/", "fonte_id": "infomoney", "data_pub": "2026-11-18T09:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do conselho da Nvidia negou a possibilidade de recontratar Huang. Essa declaração veio em resposta a movimentos que buscavam trazer Huang de volta à empresa.", "titulo_pt": "Presidente do conselho da Nvidia descarta recontratação de Huang", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 271424, "titulo": "Todo processo tem uma história: a cessão de precatórios e o direito de receber em vida", "url": "https://www.jota.info/opiniao-e-analise/artigos/todo-processo-tem-uma-historia-a-cessao-de-precatorios-e-o-direito-de-receber-em-vida", "fonte_id": "jota", "data_pub": "2026-11-18T09:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A regulamentação dos precatórios deve equilibrar o acesso à justiça com a segurança jurídica, garantindo que as da IA do Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/anthropic-estreia-no-mercado-de-acoes-saiba-como-investir-no-gigante-da-ia-do-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa de inteligência artificial Anthropic, responsável pelo Claude, estreia no mercado de ações brasileiro a partir desta quinta-feira (19), simultaneamente à sua estreia na Nasdaq. Investidores brasileiros poderão participar desta oferta através da Bolsa brasileira.", "titulo_pt": "Anthropic estreia no mercado de ações; saiba como investir no gigante da IA do Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 271250, "titulo": "Com fim da 6x1, empresas da Bolsa preveem custos maiores, aceleram testes e apostam em automação", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/com-fim-da-6x1-empresas-da-bolsa-preveem-custos-maiores-aceleram-testes-e-apostam-em-automacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas listadas no Ibovespa estão avaliando os custos adicionais decorrentes do fim da escala 6x1, que foi aprovada pelo Congresso Nacional em outubro. Elas estão acelerando os testes e investindo em automação para se adaptar à nova situação.", "titulo_pt": "Fim da 6x1 leva empresas do ibovespa a calcular custos e acelerar testes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 271639, "titulo": "'Inside Deutsche Bank': How the banking giant bent rules to fund arms dealers", "url": "https://www.lemonde.fr/en/les-decodeurs/article/2026/11/18/inside-deutsche-bank-how-the-banking-giant-bent-rules-to-fund-arms-dealers_6783130_8.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-18T06:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Documentos internos do maior banco alemão, Deutsche Bank, revelam que a instituição usou manobras jurídicas para financiar empresas de defesa, desobedecendo suas próprias regras de controle de risco. As transações incluíram armas vendidas para países envolvidos em conflitos, como Gaza, Qatar e Yemen.", "titulo_pt": "Dentro do Deutsche Bank: como o gigante bancário flexibilizou regras para financiar revendedores de armas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 271701, "titulo": "Deutsche Bank hired a Qatari royal. Why?", "url": "https://www.ft.com/content/9edd3730-3a15-4e1a-b33a-629aff00e847?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-18T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Documentos vazados mostram como negócios envolvendo uma dinastia real confundiram as tradicionais fronteiras entre investidor, cliente e contraparte. A Deutsche Bank contratou um membro da família real do Qatar.", "titulo_pt": "Deutsche Bank contratou um membro da família real do qatar: por que isso aconteceu?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 271427, "titulo": "Culpa do trabalhador não apaga a estabilidade do acidentado", "url": "https://www.jota.info/opiniao-e-analise/artigos/culpa-do-trabalhador-nao-apaga-a-estabilidade-do-acidentado", "fonte_id": "jota", "data_pub": "2026-11-18T05:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A estabilidade acidentária serve para proteger o trabalhador que ainda está em recuperação após um acidente de trabalho. Não é um prêmio nem uma punição.", "titulo_pt": "Culpa do trabalhador não anula a estabilidade do acidentado", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 271339, "titulo": "De laboratório de pesquisa a empresa de até US$ 1,4 trilhão: como a dona do Claude chegou ao IPO", "url": "https://exame.com/inteligencia-artificial/anthropic-historia-ipo-dona-do-claude/", "fonte_id": "exame", "data_pub": "2026-11-18T05:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic, fundada por ex-integrantes da OpenAI, gerou uma receita trimestral de US$ 17 bilhões e planeja estrear na Nasdaq em 19 de setembro. A empresa, dona do Claude, está avaliada em US$ 17 bilhões e prevê um IPO.", "titulo_pt": "De laboratório de pesquisa a empresa de US$ 17 bilhões: como a dona do Claude chegou ao IPO", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 271253, "titulo": "A renda parou, a tarifa não", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/mauricio-portugal-ribeiro/2026/11/a-renda-parou-a-tarifa-nao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T04:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2013, Anitta lançou 'Show das Poderosas', marcando o auge da ascensão da classe C. Em 2025, a CG 160 da Honda é a motocicleta mais vendida no Brasil, refletindo a realidade da classe trabalhadora que roda doze horas por dia. O livro 'Brasil da maioria: 25 anos de classe C', de Renato Meirelles, descreve a situação de 107 milhões de brasileiros com renda per capita entre R$ 610 e R$ 2.150 por mês, sem apoio do Estado e poupança.", "titulo_pt": "A renda parou, a tarifa não", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 271566, "titulo": "Australian wages grow at fastest pace since 2023 – but prices are climbing even more quickly", "url": "https://www.theguardian.com/australia-news/2026/nov/18/wages-grow-at-fastest-pace-since-2023-but-prices-are-climbing-even-more-quickly", "fonte_id": "guardian_world", "data_pub": "2026-11-18T04:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os salários na Austrália aumentaram em seu ritmo mais rápido desde outubro de 2023, impulsionados pelo aumento recente dos salários mínimos para milhões de trabalhadores com salários mais baixos. No entanto, esse aumento não foi suficiente para acompanhar o aumento ainda mais rápido dos preços.", "titulo_pt": "Salários australianos crescem no ritmo mais rápido desde 2023, mas os preços estão subindo ainda mais rápido", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 271429, "titulo": "Como a AIR lida com dados e incertezas? Indicadores e resultados de ANP, ANPD e ANS", "url": "https://www.jota.info/opiniao-e-analise/artigos/como-a-air-lida-com-dados-e-incertezas-indicadores-e-resultados-de-anp-anpd-e-ans", "fonte_id": "jota", "data_pub": "2026-11-18T03:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A AIR define como as análises de impacto lidam com dados disponíveis, lacunas declaradas e testes de estabilidade. Indicadores e resultados da ANP, ANPD e ANS são utilizados para estabelecer as afirmações dessas análises.", "titulo_pt": "Como a AIR trata de dados e incertezas? Indicadores e resultados da ANP, ANPD e ANS", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 271820, "titulo": "Xi touts China AI amid Shenzhen’s tech showcase", "url": "https://www.scmp.com/plus/news/china/diplomacy/article/3374891/xi-touts-china-ai-amid-shenzhens-tech-showcase", "fonte_id": "scmp", "data_pub": "2026-11-18T09:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente chinês Xi Jinping enfatizou a cooperação em tecnologia durante a cúpula Apec em Shenzhen, rejeitando o protecionismo. Ele destacou o compromisso da China com a verdadeira multilateralismo, um dia após os Estados Unidos intensificarem as restrições à exportação de chips avançados para a China.", "titulo_pt": "Xi destaca AI e cooperação tecnológica em evento de Shenzhen", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 271700, "titulo": "AI borrowing binge has ‘historic parallels’ with subprime bubble, says ECB", "url": "https://www.ft.com/content/d16475ce-efce-4dc1-b5a3-2f7c79e9dea9?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-18T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Banco Central da Europa expressou preocupações sobre uma possível bolha semelhante à bolha subprime, comparando o empréstimo excessivo por parte de grandes provedores de tecnologia com a situação anterior. Há temores de que essas empresas estejam acumulando compromissos trilionários fora do balanço através de contratos com outras empresas de tecnologia.", "titulo_pt": "Empréstimos excessivos de grandes provedores de tecnologia têm paralelos históricos com bolha subprime, diz o bce", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 271425, "titulo": "Moderação algorítmica ideal ou como se equilibrar na corda bamba", "url": "https://www.jota.info/opiniao-e-analise/colunas/ia-regulacao-democracia/moderacao-algoritmica-ideal-ou-como-se-equilibrar-na-corda-bamba", "fonte_id": "jota", "data_pub": "2026-11-18T08:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A regulamentação brasileira castiga falhas na remoção de conteúdo, mas a proteção contra possíveis excessos na moderação algorítmica ainda depende dos tribunais.", "titulo_pt": "Moderação algorítmica ideal ou como se equilibrar na corda bamba", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 271699, "titulo": "SoftBank regrets ‘mistake’ of not backing Anthropic, says Son", "url": "https://www.ft.com/content/08086201-6359-47ec-8854-70462ad5a4c0?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-18T07:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O grupo japonês SoftBank expressou arrependimento por não ter investido em sua rival Anthropic, segundo Son, seu executivo-chefe. SoftBank já havia começado a investir em seu concorrente OpenAI.", "titulo_pt": "Softbank se arrepende de não ter investido em Anthropic, diz Son", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 271898, "titulo": "(LEAD) Lotte Biologics completes construction of production plant in Incheon, eyes global expansion", "url": "https://en.yna.co.kr/view/AEN20261118006351320", "fonte_id": "yonhap_news", "data_pub": "2026-11-18T07:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Lotte Biologics concluiu a construção de sua fábrica de produção em Incheon, com planos para expansão global.", "titulo_pt": "Lotte Biologics completa construção de fábrica em Incheon, com olhos para expansão global", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 271874, "titulo": "If AI can find the answers, what’s left for us to figure out?", "url": "https://www.koreaherald.com/article/10941633", "fonte_id": "korea_herald", "data_pub": "2026-11-18T07:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Seul, uma década atrás, o campeão de Go Lee Se-dol perdeu quatro de cinco jogos para o AlphaGo. O artista Trevor Paglen questiona o que acontece com a satisfação de resolver problemas por conta própria quando a inteligência artificial pode fazê-lo mais rapidamente.", "titulo_pt": "Se a IA pode encontrar as respostas, o que nos resta descobrir?", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 271381, "titulo": "Microsoft revela modelos de IA para programação e cibersegurança", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/microsoft-revela-modelos-de-ia-para-programacao-e-ciberseguranca/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-18T07:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Microsoft lançou novos modelos de inteligência artificial para programação e cibersegurança. Grandes tecnológicas estão competindo para se destacar frente a concorrentes como Anthropic e OpenAI.", "titulo_pt": "Microsoft revela modelos de IA para programação e cibersegurança", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 271880, "titulo": "Last-minute crackdown on AI cheating tests ruling bloc", "url": "https://www.koreaherald.com/article/10941496", "fonte_id": "korea_herald", "data_pub": "2026-11-18T06:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O bloco do governo na Coreia do Sul realizou uma reunião de última hora no Parlamento na quarta-feira, antes do exame vestibular marcado para o dia seguinte. As medidas propostas visam combater a utilização de inteligência artificial para fraudar o exame, após uma recente ocorrência que levantou dúvidas sobre a capacidade do governo de garantir a equidade na prova nacional.", "titulo_pt": "Última hora: bloco governista reúne para combater fraude com IA no vestibular", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 271686, "titulo": "JPMorgan is working on AI agent transactions that don’t involve humans", "url": "https://www.cnbc.com/2026/11/18/jpmorgan-hyundai-card-ai-agents-payments.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-18T06:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "JPMorgan e Hyundai Card estão explorando o uso de agentes de inteligência artificial em transações financeiras. O objetivo é expandir a utilização desses agentes em operações financeiras sem a intervenção humana.", "titulo_pt": "Jpmorgan desenvolve agentes de IA para transações financeiras sem intervenção humana", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 271794, "titulo": "Programming errors behind false October quake warning", "url": "https://www.japantimes.co.jp/news/2026/11/18/japan/jma-alert-programming-errors/", "fonte_id": "japan_times", "data_pub": "2026-11-18T05:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A agência miscalculou o foco do terremoto que ocorreu perto da Península de Kamchatka em 16 de outubro, estimando sua magnitude em 9,9. O erro foi causado por um erro de programação.", "titulo_pt": "Erros de programação por trás da falso alerta de terremoto de outubro", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 271908, "titulo": "Over a Third of Gen Z-ers Rely on AI for Friendship", "url": "https://www.wired.com/story/over-a-third-of-gen-z-rely-on-ai-for-friendship/", "fonte_id": "wired", "data_pub": "2026-11-18T05:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório da Gallup revela que mais de um terço dos jovens de geração Z dependem da AI para amizades. Esses jovens têm maiores chances de sentir solidão em comparação com aqueles que não usam AI para interações sociais.", "titulo_pt": "Maior de um terço da geração z relia na AI para amizades", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 271698, "titulo": "Low-profile VCs set for $100bn windfall from Anthropic IPO", "url": "https://www.ft.com/content/a3430f0d-0080-4970-8eec-2c14c8438b3d?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-18T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores menos conhecidos estão prestes a obter retornos significativos de bilhões de dólares com a oferta inicial de ações da Anthropic, uma empresa de inteligência artificial. A empresa planeja preços para suas ações na próxima semana.", "titulo_pt": "Investidores em segundo plano devem receber ganhos de 100 bilhões de dólares na IPO da Anthropic", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 271707, "titulo": "AI asked ‘better questions’ than KPMG accountants in pilot audit", "url": "https://www.ft.com/content/5168b3e9-75d0-4be0-9ccd-d327d6b16c05?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-18T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A KPMG, uma das grandes firmas de contabilidade, utilizou agências de inteligência artificial para revisar as declarações financeiras de uma empresa do FTSE 250, mas intervenção humana foi necessária. O AI gerou perguntas mais relevantes durante o teste piloto de auditoria.", "titulo_pt": "IA fez perguntas melhores do que contadores da KPMG em auditoria piloto", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 271798, "titulo": "Rakuten Securities account information compromised in major data breach", "url": "https://www.japantimes.co.jp/business/2026/11/18/companies/rakuten-securities-unauthorized-access/", "fonte_id": "japan_times", "data_pub": "2026-11-18T04:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grande vazamento de dados ocorreu na Rakuten Securities, possivelmente exposto informações pessoais e bancárias de 4,47 milhões de contas. No entanto, as senhas necessárias para realizar operações de negociação foram consideradas seguras pela empresa.", "titulo_pt": "Informações de contas da rakuten Securities comprometidas em vazamento de dados significativo", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 271801, "titulo": "Japan to make it easier to identify licensed small boat operators after fatal case", "url": "https://www.japantimes.co.jp/news/2026/11/18/japan/small-ships-registration-henoko-accident/", "fonte_id": "japan_times", "data_pub": "2026-11-18T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Japão planeja facilitar a identificação de operadores de embarcações de pequeno porte licenciados após um acidente fatal envolvendo um operador não habilitado em março, perto de Henoko, na prefectura de Okinawa.", "titulo_pt": "Japão vai simplificar identificação de operadores de embarcações menores após acidente fatal", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 271807, "titulo": "Spies and silicon chips: Alice Huang’s tangled corporate web", "url": "https://www.japantimes.co.jp/business/2026/11/18/tech/spies-chips-alice-huang/", "fonte_id": "japan_times", "data_pub": "2026-11-18T02:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alice Huang, supostamente espía chinesa ligada ao co-fundador da Nvidia, está conectada a várias empresas fantoccino, casas de investimento e grandes empresas tecnológicas chinesas.", "titulo_pt": "Espionagem e chips de silício: a malha empresarial complexa de alice Huang", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 271913, "titulo": "Sudden heat spikes harm honey bees more than sustained heat, study finds", "url": "https://phys.org/news/2026-11-sudden-spikes-honey-bees-sustained.html", "fonte_id": "phys_org", "data_pub": "2026-11-18T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos mostram que picos de calor repentinos podem ser mais prejudiciais para abelhas do que calor prolongado. Ao longo de uma ocorrência de calor, as abelhas adaptam-se e as altas temperaturas tornam-se menos destrutivas.", "titulo_pt": "Picos de calor repentinos afetam mais as abelhas do que calor prolongado, estudo mostra", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 271365, "titulo": "Estrela Flamejante está prestes a explodir a 3.000 anos-luz da Terra e erupção será visível a olho nu — mas cientistas não sabem quando vai acontecer", "url": "https://www.cnnbrasil.com.br/curiosidades/estrela-flamejante-esta-prestes-a-explodir-a-3-000-anos-luz-da-terra-e-erupcao-sera-visivel-a-olho-nu-mas-cientistas-nao-sabem-quando-vai-acontecer/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-18T09:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O sistema estelar T Coronae Borealis está prestes a entrar em erupção aproximadamente a cada 80 anos, podendo ser visível a olho nu durante alguns dias, mas o exato momento ainda é incerto.", "titulo_pt": "Estrela Flamejante está prestes a explodir a 3.000 anos-luz da Terra e erupção será visível a olho nu, mas cientistas não sabem quando vai acontecer", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 271499, "titulo": "Cómo la vitamina C podría ayudar a prevenir el cáncer, según una nueva investigación", "url": "https://www.latercera.com/tendencias/noticia/como-la-vitamina-c-podria-ayudar-a-prevenir-el-cancer-segun-una-nueva-investigacion/", "fonte_id": "la_tercera", "data_pub": "2026-11-18T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os autores da pesquisa afirmam que seus achados servirão de base para novos estudos e o desenvolvimento de intervenções clínicas mais precisas. Eles notaram resultados promissores associados tanto a alimentos ricos em vitamina C quanto a suplementos.", "titulo_pt": "Como a vitamina C poderia ajudar a prevenir o câncer, de acordo com uma nova pesquisa", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 271232, "titulo": "Expansão do agronegócio ameaça geóglifos milenares no sul do Amazonas", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/expansao-do-agronegocio-ameaca-geoglifos-milenares-no-sul-do-amazonas.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-18T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A expansão do agronegócio no sul do Amazonas ameaça geóglifos milenares, segundo uma fiscalização do Iphan que identificou indícios de danos em Boca do Acre e Lábrea.", "titulo_pt": "Ameaça à preservação de geóglifos no sul do Amazonas", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 271470, "titulo": "José Luis Castro, experto de la OMS: “Más del 70% de las personas con EPOC carece de un diagnóstico”", "url": "https://www.lanacion.com.ar/sociedad/jose-luis-castro-experto-de-la-oms-mas-del-70-de-las-personas-con-epoc-carecen-de-un-diagnostico-nid18112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-18T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "José Luis Castro, especialista da OMS, afirma que mais de 70% das pessoas com EPOC não foram diagnosticadas. Ele desmascara mitos e preconceitos sobre a doença pulmonar obstructiva crônica.", "titulo_pt": "José Luis Castro, especialista da OMS: \"mais de 70% das pessoas com EPOC não têm diagnóstico\"", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 271914, "titulo": "Eagles preying on human-sized baboons upend existing evolutionary defense theory", "url": "https://phys.org/news/2026-11-eagles-preying-human-sized-baboons.html", "fonte_id": "phys_org", "data_pub": "2026-11-18T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de St Andrews descobriram que abobalhas do tamanho de homininos (antepassados humanos) são caçados por águias, mudando a forma como os cientistas podem pensar sobre interações predador-presa durante a evolução humana.", "titulo_pt": "Aguia caçando abobalhas humanizadas desafia teoria evolutiva existente sobre defesas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 271915, "titulo": "Climate change can worsen income inequality", "url": "https://phys.org/news/2026-11-climate-worsen-income-inequality.html", "fonte_id": "phys_org", "data_pub": "2026-11-18T08:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo publicado na Sustainable Development analisou a relação entre o clima e a desigualdade de renda em 23 economias emergentes entre 2002 e 2022, encontrando que maior pressão climática está positivamente associada à desigualdade de renda, medida por três indicadores (o coeficiente Gini, a razão Palma e o índice Theil). A renda per capita e a qualidade institucional estavam negativamente associadas à desigualdade, enquanto o desemprego estava positivamente associado.", "titulo_pt": "Clima pode agravar a desigualdade de renda", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 271826, "titulo": "China can become biotech powerhouse with more basic research, JPMorgan says", "url": "https://www.scmp.com/business/china-business/article/3374854/china-still-has-catching-do-become-biotech-powerhouse-jpmorgan-says", "fonte_id": "scmp", "data_pub": "2026-11-18T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Atrasos na pesquisa básica e riscos geopolíticos potenciais podem dificultar a China em se tornar uma potência em biotecnologia, apesar do forte desenvolvimento internacional do setor. De acordo com a JPMorgan, a China ainda precisa melhorar sua pesquisa fundamental, especialmente em biológicos e medicamentos.", "titulo_pt": "China pode se tornar potência em biotecnologia com mais pesquisa básica, diz JPMorgan", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 271829, "titulo": "Chinese spaceplanes’ global reach, a study on erectile dysfunction: 7 science highlights", "url": "https://www.scmp.com/news/china/science/article/3374870/chinese-spaceplanes-global-reach-study-erectile-dysfunction-7-science-highlights", "fonte_id": "scmp", "data_pub": "2026-11-18T07:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo sugere que 40 espaçonaves chinesas poderiam atingir qualquer alvo na Terra em minutos. Uma foto recentemente liberada em um relatório de inteligência dos EUA oferece uma visão rara de uma suposta espaçonave secreta chinesa Shenlong em órbita, com suas portas de compartimento de carga abertas. O título foi cortado e não fornece informações suficientes para tradução ou resumo.", "titulo_pt": "40 Espaçonaves chinesas poderiam atingir qualquer alvo na terra em minutos: estudo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 271793, "titulo": "Scientists warn of growing health threats of chemicals found everywhere", "url": "https://www.japantimes.co.jp/news/2026/11/18/world/science-health/scientists-health-threats-chemicals/", "fonte_id": "japan_times", "data_pub": "2026-11-18T06:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório sobre químicos perturbadores do sistema endócrino estima que os custos à saúde e ao meio ambiente da exposição a esses químicos ultrapassam 1 trilhão de dólares anualmente.", "titulo_pt": "Cientistas alertam sobre crescentes ameaças à saúde devido a químicos presentes em todo lugar", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 271839, "titulo": "Yicura BioMed eyes IPO as CEO says Hong Kong biotech scene needs more patient capital", "url": "https://www.scmp.com/business/companies/article/3374843/yicura-biomed-eyes-ipo-ceo-says-hong-kong-biotech-scene-needs-more-patient-capital", "fonte_id": "scmp", "data_pub": "2026-11-18T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Yicura BioMed, uma start-up de biotecnologia sediada no Parque Científico de Hong Kong, está se preparando para uma oferta inicial de ações (IPO) na cidade. O CEO da empresa, Xian Jin, afirma que Hong Kong precisa de mais capital paciente e talentos capazes de comercializar a pesquisa e desenvolvimento para sustentar seu ecossistema de biotecnologia.", "titulo_pt": "Yicura BioMed planeja IPO e defende necessidade de capital paciente e talento em Hong Kong", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 271967, "titulo": "APOD: 2026 November 18 – An M-class Solar Flare", "url": "https://science.nasa.gov/image-article/apod-2026-november-18-an-m-class-solar-flare/", "fonte_id": "nasa_news", "data_pub": "2026-11-18T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 18 de novembro de 2026, ocorreu uma erupção solar de classe M. A imagem do APOD retrata esse evento astronômico.", "titulo_pt": "APOD: 18 de novembro de 2026 – uma erupção Solar de classe m", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 271968, "titulo": "Sierra Snow Season Spins Up", "url": "https://science.nasa.gov/earth/earth-observatory/sierra-snow-season-spins-up/", "fonte_id": "nasa_news", "data_pub": "2026-11-18T05:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em novembro de 2026, uma tempestade de neve generalizada cobriu as montanhas da Califórnia com neve no início da temporada.", "titulo_pt": "Tempo de neve prematura nas montanhas da califórnia", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 271916, "titulo": "Houston leads large metros in child poverty, disconnected youth", "url": "https://phys.org/news/2026-11-houston-large-metros-child-poverty.html", "fonte_id": "phys_org", "data_pub": "2026-11-18T04:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Houston é uma das maiores economias do país, mas muitas de suas crianças enfrentam grandes obstáculos no caminho para a estabilidade financeira.", "titulo_pt": "Houston lidera grandes metrópoles em pobreza infantil e jovens desligados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 271917, "titulo": "Photon fluctuations offer new way to probe electron dynamics in crystals", "url": "https://phys.org/news/2026-11-photon-fluctuations-probe-electron-dynamics.html", "fonte_id": "phys_org", "data_pub": "2026-11-18T03:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A luz intensa pode fazer um cristal emitir novas cores com frequências muitas vezes superiores à do feixe original. Essa técnica, chamada de geração de harmonicas de alta ordem, permite investigar a movimentação rápida dos elétrons em sólidos. Além da análise da luminosidade e do espectro da luz emitida, as flutuações entre os pulsos individuais da luz também podem revelar como a emissão é produzida.", "titulo_pt": "Variações de fótons oferecem nova maneira de explorar os movimentos dos elétrons em cristais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 271918, "titulo": "New model reveals how water moves through tile-drained farm fields", "url": "https://phys.org/news/2026-11-reveals-tile-farm-fields.html", "fonte_id": "phys_org", "data_pub": "2026-11-18T03:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O novo modelo revela como a drenagem por canaletas altera o movimento da água em campos agrícolas, afetando o acúmulo de água na superfície, as dinâmicas do nível da água, o crescimento das culturas, a transportação de nutrientes e a qualidade da água. No entanto, campos com sistemas de drenagem semelhantes podem responder de maneira diferente dependendo do tipo de solo, topografia e design das canaletas.", "titulo_pt": "Novo modelo explica como a água se move em campos agrícolas drenados por canaletas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 271815, "titulo": "BigBang sets Hong Kong record with over 150,000 fans at 4 sold-out concerts", "url": "https://www.scmp.com/news/hong-kong/society/article/3374904/bigbang-sets-hong-kong-record-over-150000-fans-4-sold-out-concerts", "fonte_id": "scmp", "data_pub": "2026-11-18T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O grupo de K-pop BigBang realizou quatro concertos esgotados no Estádio Kai Tak, Hong Kong, atraindo mais de 150.000 fãs e estabelecendo um recorde de attendance para uma série de concertos de um grupo coreano na cidade. Os shows representaram o maior número de apresentações de um artista coreano no Kai Tak Sports Park desde o seu lançamento.", "titulo_pt": "Bigbang estabelece recorde em Hong Kong com mais de 150.000 fãs em quatro concertos esgotados", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 271867, "titulo": "Lee, Xi broaden cultural ties as FTA deal opens service markets", "url": "https://www.koreaherald.com/article/10941762", "fonte_id": "korea_herald", "data_pub": "2026-11-18T09:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os líderes da Coreia do Sul e da China aco
