:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 25.000 pessoas em 42 cidades do Rio Grande do Sul foram afetadas por temporais. Tupanciretã registrou cinco mortes e teve estado de calamidade pública declarado.", "titulo_pt": "Temporais afetam mais de 25.000 pessoas em 42 cidades do Rio Grande do Sul", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 281134, "titulo": "Gerente do tráfico ligado ao CV é preso curtindo férias em pousada no RJ", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/gerente-do-trafico-ligado-ao-cv-e-preso-curtindo-ferias-em-pousada-no-rj", "fonte_id": "metropoles", "data_pub": "2026-11-22T20:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um gerente associado ao tráfico do CV foi preso em Paraty, no Rio de Janeiro, durante as férias. Contra ele havia um mandado de prisão preventiva.", "titulo_pt": "Gerente do tráfico ligado ao CV é preso curtindo férias em pousada no RJ", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 281159, "titulo": "Polícia investiga morte de torcedor do Palmeiras após briga em hotel de SP", "url": "https://www.cnnbrasil.com.br/nacional/policia-investiga-morte-de-torcedor-do-palmeiras-apos-briga-em-hotel-de-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-22T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma morte foi registrada após uma briga em um hotel em São Paulo, envolvendo um torcedor do Palmeiras. A polícia investiga o caso, que ocorreu após uma partida contra o Flamengo, e aponta que o segurança do estabelecimento empurrou o torcedor durante uma discussão, levando a uma queda com ferimentos fatais na cabeça.", "titulo_pt": "Polícia investiga morte de torcedor do Palmeiras após briga em hotel de SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 281160, "titulo": "Policial militar é preso após atirar e ameaçar vigilantes em SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/policial-militar-e-preso-apos-atirar-e-ameacar-vigilantes-em-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-22T19:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um policial militar foi preso após atirar e ameaçar vigilantes em uma área do Parque Municipal Fazenda da Juta, localizada no bairro de Sapopemba, Zona Leste de São Paulo.", "titulo_pt": "Policial militar é preso após atirar e ameaçar vigilantes em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 281269, "titulo": "Tras críticas a ministra Chomali, Minsal revisará orientaciones sobre hormonización en menores de 18 años", "url": "https://www.latercera.com/nacional/noticia/tras-criticas-a-ministra-chomali-minsal-revisara-orientaciones-sobre-hormonizacion-en-menores-de-18-anos/", "fonte_id": "la_tercera", "data_pub": "2026-11-22T19:50:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A ministra do Minsal anunciou que o ministério revisará as orientações sobre hormonização em menores de 18 anos após críticas e rejeição de uma indicação do Executivo no Senado. O anúncio foi feito em meio a advertências de um partido político sobre uma possível acusação constitucional contra a ministra.", "titulo_pt": "Após críticas, Minsal revisará orientações sobre hormonização em menores de 18 anos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 281272, "titulo": "Con personal por aire y tierra: intensifican búsqueda de joven desaparecido en Paihuano", "url": "https://www.latercera.com/nacional/noticia/con-personal-por-aire-y-tierra-intensifican-busqueda-de-joven-desaparecido-en-paihuano/", "fonte_id": "la_tercera", "data_pub": "2026-11-22T19:32:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O município intensificou a busca por um jovem desaparecido em Paihuano, com a colaboração de bombeiros da Região de O'Higgins. A busca é urgente devido à condição de saúde do jovem, que requer atendimento médico.", "titulo_pt": "Com pessoal por ar e terra: intensificam busca por jovem desaparecido em Paihuano", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 281200, "titulo": "Após tempestade que matou 5 em Tupanciretã, governo reconhece calamidade pública", "url": "https://veja.abril.com.br/brasil/apos-tempestade-que-matou-5-em-tupancireta-governo-reconhece-calamidade-publica/", "fonte_id": "veja", "data_pub": "2026-11-22T18:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um vendaval em Tupanciretã, no Rio Grande do Sul, resultou em 5 mortes, 265 feridos e afetou 20.090 pessoas. O governo reconheceu uma calamidade pública e o foco inicial será em assistência humanitária.", "titulo_pt": "Após vendaval que matou 5 em Tupanciretã, governo reconhece calamidade pública", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 281174, "titulo": "São Paulo entra em alerta para alagamentos; Defesa Civil emite aviso de risco severo", "url": "https://exame.com/brasil/sao-paulo-entra-em-alerta-para-alagamentos-defesa-civil-emite-aviso-de-risco-severo/", "fonte_id": "exame", "data_pub": "2026-11-22T18:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Defesa Civil de São Paulo emitiu um aviso de risco severo para alagamentos devido a chuvas na capital e Região Metropolitana. A previsão é de que haja raios, rajadas de vento e queda de granizo.", "titulo_pt": "São Paulo em alerta para alagamentos; Defesa Civil emite aviso de risco severo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 280581, "titulo": "Quero morar para sempre neste sábado, Flamengo", "url": "https://www.metropoles.com/colunas/matheus-leitao/quero-morar-para-sempre-neste-sabado-flamengo", "fonte_id": "metropoles", "data_pub": "2026-11-22T17:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Flamengo venceu o Palmeiras no décimo campeonato brasileiro conquistado pelo clube, com uma bela jogada envolvendo Arrasca, Bruno Henrique e Samuel Lino.", "titulo_pt": "Quero morar para sempre neste sábado, Flamengo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 280531, "titulo": "Michelle atualiza estado de saúde de Bolsonaro, internado há dois dias", "url": "https://veja.abril.com.br/brasil/michelle-atualiza-estado-de-saude-de-bolsonaro-internado-ha-dois-dias/", "fonte_id": "veja", "data_pub": "2026-11-22T17:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Michelle Bolsonaro atualizou o estado de saúde do marido, Jair Bolsonaro, que está internado há dois dias. Ela pediu orações para evitar um procedimento mais invasivo.", "titulo_pt": "Michelle atualiza estado de saúde de Bolsonaro, internado há dois dias", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 280583, "titulo": "Homem mata outro com facão após briga motivada por ciúme no Entorno do DF", "url": "https://www.metropoles.com/distrito-federal/na-mira/homem-mata-outro-com-facao-apos-briga-motivada-por-ciume-no-entorno-do-df", "fonte_id": "metropoles", "data_pub": "2026-11-22T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem foi morto com um facão após uma briga motivada por ciúmes em um beco no Entorno do Distrito Federal. O suspeito confessou o crime e foi preso pela Polícia Militar.", "titulo_pt": "Homem é morto com facão após briga motivada por ciúmes no Entorno do DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 280532, "titulo": "O que diz novo boletim médico sobre a saúde de Bolsonaro", "url": "https://veja.abril.com.br/brasil/o-que-diz-novo-boletim-medico-sobre-a-saude-de-bolsonaro/", "fonte_id": "veja", "data_pub": "2026-11-22T17:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Jair Bolsonaro foi internado no Hospital DF Star, em Brasília, na última sexta-feira, devido a dores abdominais.", "titulo_pt": "Novo boletim médico sobre a saúde de Bolsonaro", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 280691, "titulo": "Fiéis são hospitalizados após vazamento de gás em igreja na Alemanha", "url": "https://www.dw.com/pt-br/fiéis-são-hospitalizados-após-vazamento-de-gás-em-igreja-na-alemanha/a-80014673?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-22T17:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 50 fiéis foram hospitalizados após um vazamento de monóxido de carbono durante uma missa no sul da Alemanha. O dispositivo de segurança do aquecimento teria falhado.", "titulo_pt": "Fieis são hospitalizados após vazamento de gás em igreja na Alemanha", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 281128, "titulo": "Aedes com bactéria Wolbachia reduz em 68,5% infecções por dengue em BH", "url": "https://www.metropoles.com/saude/aedes-com-bacteria-wolbachia-reduz-em-685-infeccoes-por-dengue-em-bh", "fonte_id": "metropoles", "data_pub": "2026-11-22T20:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo em Belo Horizonte demonstrou que o uso do mosquito Aedes com bactéria Wolbachia resultou em uma redução de 68,5% nas infecções por dengue. Além disso, a queda foi ainda mais significativa, com 73,3% de infecções por chikungunya em áreas onde o mosquito foi soltado.", "titulo_pt": "Aedes com bactéria Wolbachia reduz em 68,5% infecções por dengue em BH", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 281158, "titulo": "Temporais causam danos a lavouras de soja e a armazéns em Tupanciretã", "url": "https://www.cnnbrasil.com.br/agro/temporais-causam-danos-a-lavouras-de-soja-e-a-armazens-em-tupancireta/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-22T20:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Temporais causaram danos a lavouras de soja e armazéns em Tupanciretã. Os prejuíços são incalculáveis, mas não devem afetar a safra de soja gaúcha para 2026/2027.", "titulo_pt": "Temporais causam danos a lavouras de soja e armazéns em Tupanciretã", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 281382, "titulo": "Why has the COP31 climate summit failed to reach agreement?", "url": "https://www.aljazeera.com/video/inside-story/2026/11/22/why-has-the-cop31-climate-summit-failed-to-reach-agreement?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-22T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O COP31, o 31º summit sobre clima, não chegou a um acordo. As energias fósseis estão no centro de uma divisão profunda.", "titulo_pt": "Por que o COP31 sobre clima falhou em chegar a um acordo?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 280576, "titulo": "ONU lamenta ausência de acordo na COP31 após impasse sobre combustíveis", "url": "https://www.metropoles.com/mundo/onu-lamenta-ausencia-de-acordo-na-cop31-apos-impasse-sobre-combustiveis", "fonte_id": "metropoles", "data_pub": "2026-11-22T17:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Conferência das Nações Unidas terminou sem um acordo político após mais de duas semanas de negociações, com a União Europeia rejeitando o texto final.", "titulo_pt": "ONU lamenta ausência de acordo na COP31 após impasse sobre combustíveis", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 280794, "titulo": "Cop31 climate talks break down as key deal rejected", "url": "https://www.theguardian.com/environment/2026/nov/22/cop31-climate-talks-set-to-end-in-deep-division-as-key-deal-rejected", "fonte_id": "guardian_world", "data_pub": "2026-11-22T16:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na Conferência das Nações Unidas sobre Mudanças Climáticas (Cop31) em Turquia, a União Europeia, o Reino Unido e aliados do mundo em desenvolvimento rejeitaram um acordo principal que não mencionava os combustíveis fósseis e foi considerado insuficiente para responder à ciência climática.", "titulo_pt": "Negociações sobre clima da cop31 se desmoronam após acordo principal ser rejeitado", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 280798, "titulo": "The World’s Biggest Climate Conference Just Fell Apart", "url": "https://www.theatlantic.com/science/2026/11/cop31/689530/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-11-22T15:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Delegados da conferência anual das Nações Unidas sobre clima não conseguiram chegar a um acordo pela primeira vez em quase 20 anos.", "titulo_pt": "A maior conferência mundial sobre clima acaba de colapsar", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 280694, "titulo": "Veto de sauditas e russos deixa COP31 sem declaração final pela 1ª vez desde 2009", "url": "https://www.dw.com/pt-br/veto-de-sauditas-e-russos-deixa-cop31-sem-declaração-final-pela-1ª-vez-desde-2009/a-80014428?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-22T15:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A COP31, ou Conferência das Nações Unidas sobre Mudanças Climáticas, não produziu uma declaração final pela primeira vez desde 2009, devido a um veto de países produtores de petróleo, incluindo sauditas e russos. A UE e outros países se recusaram a aprovar um texto que não mencionava os combustíveis fósseis.", "titulo_pt": "Veto de sauditas e russos impede declaração final na COP31 pela primeira vez desde 2009", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 280904, "titulo": "Dozens drown as boat capsizes in Nigeria en route to funeral", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/22/dozens-drown-as-boat-capsizes-in-nigeria-en-route-to-funeral?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-22T15:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 24 pessoas morreram após uma embarcação que transportava pessoas para um enterro se virar na Nigéria.", "titulo_pt": "Várias pessoas morrem em naufrágio de barco levando fiéis a um enterro na nigéria", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 280793, "titulo": "Australia urged to wean off imported fossil fuels amid global supply shocks", "url": "https://www.theguardian.com/australia-news/2026/nov/23/australia-urged-to-wean-off-imported-fossil-fuels-amid-global-supply-shocks", "fonte_id": "guardian_world", "data_pub": "2026-11-22T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório do Grattan Institute sugere que o governo da Austrália deve reduzir sua dependência de combustíveis fósseis importados ao limitar subsídios de diesel para grandes empresas, construir refinarias limpas e direcionar subsídios de veículos elétricos para pessoas com menor renda. Essas ações poderiam economizar milhares de dólares em combustível para os australianos anualmente.", "titulo_pt": "Austrália encorajada a se desligar dos combustíveis fósseis importados diante de choques de suprimento global", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 280559, "titulo": "Ciclone se aproxima do RS após temporal que deixou mortos; SC e PR estão em alerta", "url": "https://exame.com/brasil/ciclone-se-aproxima-do-rs-apos-temporal-que-deixou-mortos-sc-e-pr-estao-em-alerta/", "fonte_id": "exame", "data_pub": "2026-11-22T13:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ciclone se aproxima do Rio Grande do Sul após um temporal que deixou mortos em Santa Catarina e Paraná. O fenômeno deve intensificar as chuvas neste domingo com risco de granizo e ventos acima de 80 km/h, enquanto Tupanciretã ainda registra os danos causados pela tempestade de sexta-feira.", "titulo_pt": "Ciclone se aproxima do RS após temporal com mortes; SC e PR em alerta", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 280564, "titulo": "Álcool adulterado na Índia deixa 16 mortos e quase 600 hospitalizados", "url": "https://exame.com/mundo/alcool-adulterado-na-india-deixa-16-mortos-e-quase-600-hospitalizados/", "fonte_id": "exame", "data_pub": "2026-11-22T12:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Autoridades indianas investigam a origem de bebida adulterada que causou 16 mortes e deixou cerca de 600 pessoas hospitalizadas no nordeste do país. Seis pessoas foram presas por suspeita de envolvimento no fornecimento do produto.", "titulo_pt": "Álcool adulterado na Índia deixa 16 mortos e quase 600 hospitalizados", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 280144, "titulo": "\"Tenemos derecho al agua\": agricultores y trabajadores de rancho se pronuncian sobre los preocupantes niveles del río Colorado", "url": "https://www.clarin.com/estados-unidos/derecho-agua-agricultores-trabajadores-rancho-pronuncian-preocupantes-niveles-rio-colorado_0_PNz4DFMglx.html", "fonte_id": "clarin", "data_pub": "2026-11-22T09:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A falta de neve está deixando sem água uma das maiores regiões agrícolas dos Estados Unidos. Alguns produtores já tiveram que abandonar cultivos e vender gado.", "titulo_pt": "Temos direito à água: agricultores e trabalhadores de rancho se pronunciam sobre os preocupantes níveis do rio Colorado", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 280302, "titulo": "New COP31 draft deal tabled as countries scramble to salvage climate talks", "url": "https://www.euronews.com/2026/11/22/new-cop31-draft-deal-tabled-as-countries-scramble-to-salvage-climate-talks", "fonte_id": "euronews", "data_pub": "2026-11-22T07:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo projeto de acordo foi apresentado, mas ele não mencionou os combustíveis fósseis, que se tornaram um ponto de conflito nas negociações.", "titulo_pt": "Novo projeto de acordo apresentado, mas ignora combustíveis fósseis", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 280368, "titulo": "Fossil fuels still missing from latest COP31 draft deal", "url": "https://www.japantimes.co.jp/environment/2026/11/22/climate-change/cop31-climate-talks/", "fonte_id": "japan_times", "data_pub": "2026-11-22T05:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O último projeto de acordo do COP31 mantém os objetivos globais de eletrificação, mas deixa as tensões relacionadas aos combustíveis fósseis sem resolução.", "titulo_pt": "Combustíveis fósseis ainda ausentes no último projeto de acordo do COP31", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 280375, "titulo": "Nagano farmers are running out of altitude as warming hits key celery crop", "url": "https://www.japantimes.co.jp/environment/2026/11/22/climate-change/celery-harvest-climate-change/", "fonte_id": "japan_times", "data_pub": "2026-11-22T03:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os agricultores no Nagano estão enfrentando dificuldades devido ao aumento da temperatura, pois estão se esgotando de altitudes disponíveis para plantar azevinho, que requer condições mais frescas.", "titulo_pt": "Agricultores do nagano estão se esgotando de altitude devido ao aquecimento global afetando a cultura de azevinho", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 279503, "titulo": "Temperatures could drop to 11°C in low areas: CWA", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/22/2003868168", "fonte_id": "taipei_times", "data_pub": "2026-11-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A previsão indica que as temperaturas podem baixar para 11°C em áreas baixas. Essa informação foi fornecida pelo CWA (Centro Weather Administration).", "titulo_pt": "Temperaturas podem cair para 11°C em baixas áreas: CWA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 281193, "titulo": "Diretor da OMS pede paz em província do Congo afetada por ebola", "url": "https://veja.abril.com.br/mundo/diretor-da-oms-pede-paz-em-provincia-do-congo-afetada-por-ebola/", "fonte_id": "veja", "data_pub": "2026-11-22T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O diretor da OMS pediu paz para a província do Congo afetada pelo surto de ebola. Ao menos 5.678 pessoas morreram em um surto que registrou 11.613 casos confirmados, sendo o pior surto de ebola no país até hoje.", "titulo_pt": "Diretor da OMS pede paz para região do Congo afetada pelo ebola", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 281199, "titulo": "Israel abre investigação sobre incêndios atribuídos a colonos na Cisjordânia", "url": "https://veja.abril.com.br/mundo/israel-abre-investigacao-sobre-incendios-atribuidos-a-colonos-na-cisjordania/", "fonte_id": "veja", "data_pub": "2026-11-22T19:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Israel iniciou uma investigação sobre incêndios atribuídos a colonos na Cisjordânia. Gadi Eisenkot, um rival de Benjamin Netanyahu e responsável por formar um novo governo após as eleições, denunciou esses atos.", "titulo_pt": "Israel abre investigação sobre incêndios atribuídos a colonos na Cisjordânia", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 280580, "titulo": "Mexicanos são violentamente arrastados pelo ICE durante embarque nos EUA", "url": "https://www.metropoles.com/mundo/mexicanos-sao-violentemente-arrastados-pelo-ice-durante-embarque-nos-eua", "fonte_id": "metropoles", "data_pub": "2026-11-22T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ICE (Immigration and Customs Enforcement) abordou violentamente mexicanos durante o embarque em um voo com destino a Los Angeles. O governador de Washington criticou a operação e pediu o fim da agência.", "titulo_pt": "Mexicanos são violentamente arrastados pela ICE durante embarque nos EUA", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 280941, "titulo": "French activists demand tear gas suspension after reported changes to menstrual cycles", "url": "https://www.scmp.com/news/world/europe/article/3375397/french-activists-demand-tear-gas-suspension-after-reported-changes-menstrual-cycles", "fonte_id": "scmp", "data_pub": "2026-11-22T17:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ativistas e legisladores franceses estão pedindo que autoridades suspendam o uso de gás lacrimogêneo durante protestos após relatos de alterações nos ciclos menstruais e outros problemas de saúde reprodutiva. No entanto, cientistas ainda não confirmaram uma ligação médica entre o gás lacrimogênico e esses efeitos.", "titulo_pt": "Ativistas franceses pedem suspensão do uso de gás lacrimogênico após relatos de alterações nos ciclos menstruais", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 281187, "titulo": "Polícia de imigração dos EUA prende pesquisadora chinesa de Princeton em aeroporto", "url": "https://exame.com/mundo/policia-de-imigracao-dos-eua-prende-pesquisadora-chinesa-de-princeton-em-aeroporto/", "fonte_id": "exame", "data_pub": "2026-11-22T15:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eva Yi Xie, uma pesquisadora de 24 anos da Princeton University, foi detida pela Polícia de Imigração dos EUA no aeroporto de Washington enquanto tentava embarcar. A defesa contesta a prisão, e as operações do ICE causaram atrasos no aeroporto de Seattle.", "titulo_pt": "Polícia de imigração dos EUA detém pesquisadora chinesa de Princeton no aeroporto", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 280920, "titulo": "Children in besieged Gaza struggle to find life-saving insulin for diabetes", "url": "https://www.aljazeera.com/features/2026/11/22/children-in-besieged-gaza-struggle-to-find-life-saving-insulin-for-diabetes?traffi            return `<div class="item" data-flag-url="${esc(n.url)}">

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

function filtrarSecao(topico) {

}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
