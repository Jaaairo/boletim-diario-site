<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

</div>

<script>
const D = {"gerado_em": "24/11/2026 07:38", "stats": {"noticias_novas": 808, "resumos_gerados": 252}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A posse do presidente Lula será transmitida ao vivo pela EBC em telões na Esplanada dos Ministérios, além de contar com apresentações de artistas locais. No âmbito político, o estrategista Alan Bueno afirma que a juventude do PT busca maior engajamento com o partido, com destaque para candidatos mais jovens nas eleições. O projeto de ajuste fiscal de até R$ 56 bilhões, elaborado pelo ministro Bruno Moretti, foi aprovado pela Câmara dos Deputados com ampla base de apoio e segue para sanção presidencial. O governo Lula também planeja formar um bloco com um partido de oposição na Assembleia Legislativa de São Paulo para garantir a proporcionalidade das bancadas. Além disso, o futuro Ministério da Longevidade pode ser criado para atender à população idosa, conforme discutido no Palácio do Planalto.", "mundo": "Um policial francês que disparou e matou Nahel Merzouk, um adolescente de 17 anos, durante uma parada de trânsito em junho de 2023, será julgado por assassinato após uma decisão do Tribunal de Apelações de Versailles. O caso gerou intensas manifestações nas periferias de Paris. Em outro evento, um policial francês que disparou e matou Nahel Merzouk, um adolescente de 17 anos, durante uma parada de trânsito em junho de 2023, será julgado por assassinato após uma decisão do Tribunal de Apelações de Versailles. O caso gerou intensas manifestações nas periferias de Paris. O governo da Malásia anunciou que enviará milhares de migrantes e refugiados de volta para Myanmar, apesar de reconhecer que muitos deles foram vítimas de atrocidades cometidas pelo governo militar de Naypyidaw. Esta decisão foi tomada dias após o Tribunal Internacional de Justiça condenar Myanmar por genocídio contra o minoritário rohingya. Em outro desenvolvimento, a ex-chefe de governo do Bangladesh, Sheikh Hasina, busca retornar ao país, onde enfrenta uma sentença de morte. As Nações Unidas relataram que até 1.400 pessoas foram mortas durante os distúrbios que a levaram do poder.\n\nA Rússia planeja construir ferries de trens para o exclave de Kaliningrado, um projeto que visa contornar as restrições de trânsito impostas pela Lituânia e Polônia após a invasão de 2022. De acordo com a Rússia, os ferries serão operados entre Baltiysk e Ust-Luga a partir de 2030 e custarão aproximadamente 50 bilhões de rublos. O projeto, que será construído na Crimeia ocupada, reflete a persistência russa em manter a conectividade com o exclave. Paralelamente, a China prorrogou por dois meses a suspensão de algumas restrições de exportação de itens de uso dual para os Estados Unidos, mantendo uma flexibilização temporária das restrições sobre minérios críticos e outros materiais. Em outro desenvolvimento, a Rússia planeja lançar um satélite equipado com uma arma nuclear ainda neste ano, conforme relatos da imprensa alemã. Moscou nega essas informações. Estes eventos refletem os contornos da geopolítica global, com tensões persistindo entre grandes potências e suas alianças, bem como as estratégias de cada país para manter sua influência e segurança.", "economia": "Em outubro, o dólar atingiu um novo recorde de R$ 6,00, subindo 19% em um mês devido a pressões internas e externas sobre o real, conforme informou a CNN Brasil. O governo Lula recebeu conselhos da área econômica para indicar nomes para a diretoria do Banco Central que não causem conflito com o mercado financeiro. Por outro lado, a Petrobras anunciou investimentos de US$ 122 bilhões nos próximos cinco anos, com foco na exploração e produção de petróleo, informou o jornal Exame. Na economia, a FecomercioSP relatou que o volume de inadimplência de empresas e famílias atingiu R$ 371,1 bilhões no terceiro trimestre de 2026, um aumento de 26,7% em comparação com o mesmo período do ano anterior. Além disso, a Samsung planeja aumentar cinco vezes a capacidade de produção de sua nona geração de memória NAND flash em sua segunda fábrica em Xi'an, China, até novembro de 2027, para atender à demanda por SSDs empresariais, segundo informações de fontes da indústria.", "tecnologia": "A volta inesperada de Jensen Huang como CEO da Nvidia teve um impacto significativo no mercado tecnológico, com as ações de empresas sul-coreanas e japonesas subindo fortemente nas bolsas. Esta mudança aliviou as preocupações sobre as parcerias de memória de alta banda (HBM) entre a Nvidia e as empresas sul-coreanas Samsung e SK hynix, além de fortalecer a sustentabilidade do boom de memória baseada em AI na Coreia. No entanto, a decisão de Huang também gerou divisões no setor chinês de tecnologia, onde algumas empresas esperavam uma oportunidade para reduzir a dependência da Nvidia, enquanto outras se beneficiaram com a renovação da confiança. Paralelamente, a Agência Brasileira de Inteligência (Abin) está planejando fortalecer a criptografia dos sistemas digitais do Brasil até 2029, em resposta às ameaças quânticas, enquanto a Coreia do Norte parece ter lançado seu primeiro assistente virtual de inteligência artificial (IA), chamado Fonte de Sabedoria, embora com limitações em responder a perguntas 'incultas'.", "ciencia": "Um estudo, financiado pelo Banco Mundial, mostrou que um estabelecimento rural em Córdoba, Argentina, reduziu as emissões de metano em 31,8% através do manejo nutricional dos animais, utilizando suplementos naturais de bioativos vegetais. No Alasca, uma pequena rede de hospitais está utilizando ferramentas de inteligência artificial para triagem de pacientes com AVC, acelerando a direcionamento ao cuidado adequado. Além disso, a descoberta da quasar mais distante conhecida, feita por astrônomos liderados pelo Instituto Max Planck de Astronomia, está redefinindo os cenários de formação de buracos negros. Em um estudo genético, quatro variantes raras do DNA foram identificadas como associadas à esquizofrenia, contribuindo para o entendimento e desenvolvimento de tratamentos futuros. A pesquisa também revelou que anúncios online personalizados são úteis para os consumidores, apesar de eles estarem cientes de que estão sendo alvo estratégico de publicidade.", "cultura": "O Museu de Londres inaugurou uma nova exposição no mercado de Smithfield, um projeto arquitetônico que revitaliza uma parte importante da herança histórica da cidade. Os escritórios de arquitetos Stanton Williams, Asif Khan e Julian Harrap Architects concluíram a transformação de um mercado vitoriano em um espaço cultural, abrigando agora o mercado de Smithfield. Em outro desenvolvimento cultural, o escritor Craig Thompson expressou preocupação com a transformação de suas graphic novels em franquias de Hollywood, afirmando que seus quadrinhos foram criados para outros fins. O livro 'De Senhores a Servos', de Alexandra Prokopenko, oferece uma análise contundente sobre a transformação das elites russas em bajuladores servis, focando na invasão da Ucrânia por Putin. Além disso, a Apple TV anunciou a renovação da quinta temporada de 'Ted Lasso', enquanto o Brics planeja lançar um serviço de streaming próprio, o Sommos Brics, que incluirá conteúdo de países emergentes. Estes eventos refletem a diversidade e a complexidade do panorama cultural atual, abrangendo desde arquitetura e literatura até televisão e streaming internacional.", "sociedade": "Em São Paulo, 10 mortes ocorreram devido às chuvas em um mês, mostrando a gravidade das condições meteorológicas na cidade. O prefeito de Nova York, Zohran Mamdani, informou que mais de três milhões de imigrantes consideram a cidade sua morada, expandindo os serviços municipais para atender essa população. Um relatório da UNICEF revela que quase 60% de mulheres e adolescentes na Ituri, afetada pela Ebola, relataram um aumento na violência e no abuso, evidenciando uma crise paralela agravada. Além disso, o Brasil enfrenta um cenário de segurança pública mais complexo devido ao persistente problema do crime organizado nas prisões, conforme afirma o especialista Robert Muggah.", "meio_ambiente": "A COP31, uma conferência climática, não chegou a um acordo-chave após 17 anos, marcando o primeiro fracasso de 17 anos em alcançar um acordo. A conferência, co-presidida pela Turquia e pela Austrália, falhou devido a um impasse sobre combustíveis fósseis e apoio a países afetados pela crise climática. No entanto, houve avanços na proteção dos oceanos, com novos investimentos e medidas para a proteção de recifes de coral, lideradas pelo Brasil. O evento também destacou a necessidade de reduzir as emissões globais em 6% anualmente, conforme destacado pelo cientista sueco Johan Rockström. Além disso, a Tailândia planeja proibir exportações de químicos para combater a poluição, enquanto a Indonésia continua a busca por trabalhadores sob escombros após um incêndio devastador em uma fábrica de doces. Em outros países, como o Equador, inundações causadas por fortes chuvas atingiram as Ilhas Galápagos, forçando moradores a deixar suas casas.", "direitos_humanos": "A justiça iraniana aplicou 74 chicotadas a uma cantora iraniana, Parastoo Ahmadi, e a quatro membros de sua equipe de produção, por se apresentarem sem véu durante um concerto online em dezembro de 2024. A cantora e os outros envolvidos também foram proibidos de exercer atividades artísticas por dois anos e de sair do país. Essa decisão do tribunal iraniano reforça as restrições impostas pelo regime sobre a liberdade de expressão e a liberdade de religião ou crença, levantando preocupações sobre a violação de direitos humanos. Além disso, a Universidade de Hong Kong decidiu adiar um curso sobre direitos humanos na China, após o coordenador do curso anunciar sua saída, o que pode indicar restrições crescentes à liberdade acadêmica e à discussão sobre direitos humanos na região. Esses eventos refletem a situação complexa e preocupante dos direitos humanos em diversos países, com violações notáveis em regiões como a Ásia e a América do Norte."}, "resumo_do_dia": {"politica_nacional": [{"id": 283255, "titulo": "Política está se tornando um 'Game of 'Thrones' dos influenciadores, diz estrategista digital", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/politica-esta-se-tornando-um-game-of-thrones-dos-influenciadores-diz-estrategista-digital.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-24T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estrategista digital Alan Bueno afirma que os candidatos influenciadores, que se destacaram nas eleições, estão assumindo o papel tradicionalmente ocupado pelos dirigentes partidários. Segundo ele, a política está se transformando em um 'Game of Thrones' dos influenciadores.", "titulo_pt": "Política se transforma em 'Game of Thrones' dos influenciadores, diz estrategista digital", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 283361, "titulo": "Posse de Lula terá transmissão ao vivo da EBC em telões na Esplanada", "url": "https://www.metropoles.com/colunas/milena-teixeira/posse-de-lula-tera-transmissao-ao-vivo-da-ebc-em-teloes-na-esplanada", "fonte_id": "metropoles", "data_pub": "2026-11-24T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A posse de Lula contará com transmissão ao vivo por meio da EBC em telões instalados na Esplanada dos Ministérios. Haverá também shows dos artistas Igor Kannário e BaianaSystem.", "titulo_pt": "Posse de Lula terá transmissão ao vivo e shows em brasília", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 283256, "titulo": "Juventude quer canal maior com governo e sucessor de Lula será o PT, diz secretária do partido", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/juventude-quer-canal-maior-com-governo-e-sucessor-de-lula-sera-o-pt-diz-secretaria-do-partido.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-24T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A juventude petista tem pressionado pelo fortalecimento do partido, com destaque para candidatos mais jovens nas eleições deste ano. A secretária nacional de Juventude do PT, Julia Köpf, afirma que o desempenho desses candidatos enviou um recado de que a sociedade deseja renovação política.", "titulo_pt": "Jovens do PT querem maior participação e renovação no partido, diz secretária", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 283257, "titulo": "Dificuldade de fazer valer leis contra racismo persiste 200 anos após tratado 'para inglês ver', dizem historiadores", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/dificuldade-de-fazer-valer-leis-contra-racismo-persiste-200-anos-apos-tratado-para-ingles-ver-dizem-historiadores.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-24T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No século 19, o Brasil concordou com o Reino Unido em acabar com o tráfico de africanos escravizados, condição para a independência do país, mas o tráfico continuou ilegalmente por mais de duas décadas. Dizem historiadores que a dificuldade em fazer valer leis contra racismo persiste 200 anos após esse tratado.", "titulo_pt": "Dificuldade em fazer valer leis contra racismo persiste 200 anos após tratado, dizem historiadores", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 283410, "titulo": "Governo contorna resistências e aprova PLP do ajuste fiscal com amplo apoio", "url": "https://www.cnnbrasil.com.br/politica/governo-contorna-resistencias-e-aprova-plp-do-ajuste-fiscal-com-amplo-apoio/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-24T06:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A proposta do ajuste fiscal, apresentada pela equipe econômica, foi aprovada com facilidade pela Câmara dos Deputados na noite de segunda-feira (23). No Senado, o governo precisou negociar para garantir o apoio necessário e evitar que o texto fosse alterado significativamente.", "titulo_pt": "Governo aprova PLP do ajuste fiscal com ampla adesão na câmara e negociações no senado", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 283411, "titulo": "Motta defende centrão na Esplanada e vê grupo como essencial para Lula 4", "url": "https://www.cnnbrasil.com.br/politica/motta-defende-centrao-na-esplanada-e-ve-grupo-como-essencial-para-lula-4/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-24T06:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente da Câmara, Arthur Lira, defende o centrão como grupo essencial para a governabilidade do governo Lula. Ele acredita que Lula deve negociar a ocupação desses partidos em ministérios desde o início do novo mandato.", "titulo_pt": "Motta defende centrão na Esplanada e vê grupo como essencial para Lula 4", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 283332, "titulo": "Após Câmara aprovar ajuste fiscal de Lula, Hugo Motta defende novas medidas ainda em 2026", "url": "https://g1.globo.com/politica/noticia/2026/11/24/apos-camara-aprovar-ajuste-de-lula-hugo-motta-defende-novas-medidas-fiscais-ainda-em-2026.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-24T03:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Hugo Motta, presidente da Câmara dos Deputados, defendeu a adoção de novas medidas econômicas em 2026 após a aprovação do pacote de ajuste fiscal pelo governo Lula. Motta espera que o governo tome mais medidas para a economia ainda neste ano.", "titulo_pt": "Hugo Motta defende novas medidas econômicas ainda em 2026 após aprovação do ajuste fiscal", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 283333, "titulo": "Entenda projeto de ajuste fiscal de até R$ 56 bilhões para governo Lula aprovado pela Câmara", "url": "https://g1.globo.com/politica/ao-vivo/ajuste-fiscal-camara-deputados.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-24T03:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de ajuste fiscal de até R$ 56 bilhões aprovado pela Câmara prevê economias nas contas do governo federal em 2027. O texto estabelece limites de gastos e corte linear de 10% em diversos benefícios governamentais.", "titulo_pt": "Entenda projeto de ajuste fiscal de até R$ 56 bilhões para governo Lula aprovado pela Câmara", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 283334, "titulo": "Ajuste fiscal de Lula teve Moretti como criador e principal articulador; ministro enfrentou resistência de ala governista", "url": "https://g1.globo.com/politica/noticia/2026/11/24/ajuste-fiscal-de-lula-teve-moretti-como-criador-e-principal-articulador-ministro-enfrentou-resistencia-de-ala-governista.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-24T03:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Planejamento e Orçamento, Bruno Moretti, foi o principal responsável pela criação e articulação do pacote de ajuste fiscal do governo Lula, que foi aprovado na Câmara dos Deputados. Moretti trabalhou para reduzir as resistências ao projeto, especialmente entre parlamentares de esquerda do PT, PSOL e PCdoB.", "titulo_pt": "Moretti foi o principal criador e articulador do ajuste fiscal de Lula", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 283258, "titulo": "Centrão adere ao ajuste fiscal de Lula com expectativa por ministérios e emendas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/centrao-adere-ao-ajuste-fiscal-de-lula-com-expectativa-por-ministerios-e-emendas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-24T03:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os partidos do Centrão apoiaram o ajuste fiscal proposto pelo governo Lula 4, esperando por ministérios e emendas. As medidas incluem cortes de incentivos fiscais, redução de repasses para os estados e contenção no crescimento das despesas governamentais.", "titulo_pt": "Centrão apoia ajuste fiscal de Lula com esperança de ministérios e emendas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 283335, "titulo": "Cidadania, de passado comunista, vive racha e adia votação sobre fusão com o PP, partido com origens ligadas à ditadura", "url": "https://g1.globo.com/politica/noticia/2026/11/24/cidadania-fusao-pp.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-24T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O partido Cidadania está dividido sobre a possibilidade de se fundir com o PP, que tem origens ligadas à ditadura militar. A fusão poderia extinguir o Cidadania e afetar a composição das bancadas no Congresso e a distribuição do Fundo Partidário.", "titulo_pt": "Cidadania, com passado comunista, vive racha e adia votação sobre fusão com o PP, partido com origens ligadas à ditadura", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 283272, "titulo": "Trabuco, do Bradesco, cobra integração energética e vê custo de capital como entrave", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/trabuco-do-bradesco-cobra-integracao-energetica-e-ve-custo-de-capital-como-entrave.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T02:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Luiz Carlos Trabuco, presidente do conselho de administração do Bradesco, assumiu a presidência do MBC (Movimento Brasil Competitivo) sucedendo Jorge Gerdau Johannpeter. O Bradesco, por meio de Trabuco, enfatizou a importância da integração energética e identificou o custo de capital como um obstáculo.", "titulo_pt": "Trabuco, do Bradesco, assume mbc e destaca integração energética e custo de capital", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 283259, "titulo": "PT organiza seminário com André Lara Resende para discutir política econômica de Lula 4", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/11/pt-organiza-seminario-com-andre-lara-resende-para-discutir-politica-economica-de-lula-4.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-24T02:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os deputados do PT devem realizar um seminário em Brasília com o economista André Lara Resende para discutir a política econômica do próximo mandato de Lula.", "titulo_pt": "PT organiza seminário com André Lara Resende para discutir política econômica de Lula 4", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 283260, "titulo": "Não sou identitária, sou uma pessoa universal, diz 1ª senadora do PT eleita em MG", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/nao-sou-identitaria-sou-uma-pessoa-universal-diz-1a-senadora-do-pt-eleita-em-mg.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-24T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marília Campos, a primeira senadora do PT eleita em Minas Gerais, afirma não ser identitária e rejeita o discurso de polarização entre o partido e o bolsonarismo.", "titulo_pt": "Não sou identitária, sou uma pessoa universal, diz primeira senadora do PT eleita em MG", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 283261, "titulo": "Cotado para 2030, Tarcísio concentra poder em auxiliares fiéis e faz concessões à direita", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/cotado-para-2030-tarcisio-concentra-poder-em-auxiliares-fieis-e-faz-concessoes-a-direita.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-24T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador Tarcísio de Freitas (Republicanos) está prestes a anunciar os últimos nomes de seu secretariado, mas optou por manter a equipe que o levou à reeleição em primeiro turno, em vez de fazer mudanças significativas. Ele está concentrando poder em auxiliares fiéis e fazendo concessões à direita.", "titulo_pt": "Cotado para 2030, Tarcísio mantém equipe e concentra poder em aliados", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 283262, "titulo": "Desfalque no STF supera 400 dias, é o mais longo na redemocratização e deixa 64 julgamentos suspensos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/desfalque-no-stf-supera-400-dias-e-o-mais-longo-na-redemocratizacao-e-deixa-64-julgamentos-suspensos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-24T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Desde a redemocratização do Brasil, a cadeira no STF de Luís Roberto Barroso está vazia há mais de 400 dias, o que é o período mais longo desde a redemocratização. Este desfalque judicial está impedindo a realização de 64 julgamentos.", "titulo_pt": irectors fought back when their film was stolen — and won an International Emmy Award", "url": "https://www.dw.com/en/how-two-directors-fought-back-when-their-film-was-stolen-and-won-an-international-emmy-award/a-76103455?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-24T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois estudantes de cinema alemães enfrentaram um americano que ganhou prêmios em festivais com sua animação. Seu documentário 'O Dotado Sr. F', sobre sua luta contra o plágio, agora está no centro das atenções.", "titulo_pt": "Como dois diretores se defenderam quando seu filme foi roubado — e ganharam um Emmy internacional", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 283722, "titulo": "Istanbul 'lion hunt' ends with no big cat found after all", "url": "https://www.dw.com/en/istanbul-lion-hunt-ends-with-no-big-cat-found-after-all/a-80020913?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-24T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma operação de busca extensa em florestas de Istambul, autoridades turcas declararam que o animal perdido não era um leão nem qualquer outro grande felino.", "titulo_pt": "Busca por leão solto em istambul termina sem encontrar nenhum grande felino", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 283817, "titulo": "Descalzi, c'è intenzione di prorogare cap su carburanti fino a fine anno", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/24/descalzi-ce-intenzione-di-prorogare-cap-su-carburanti-fino-a-fine-anno_cb2d5c45-2289-4766-8d1b-3e466cc90f7a.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-24T09:34:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Há intenção de prorrogar o aumento nos preços dos combustíveis até o final do ano. O responsável mencionou que, até hoje, devem ocorrer novidades sobre o assunto.", "titulo_pt": "Descalzi, há intenção de prorrogar aumento nos preços dos combustíveis até o final do ano", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 283891, "titulo": "(LEAD) Final talks between Seoul Metro labor, management in deadlock ahead of planned strike", "url": "https://en.yna.co.kr/view/AEN20261124006151315", "fonte_id": "yonhap_news", "data_pub": "2026-11-24T09:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Negociações finais entre os trabalhadores e a administração da Seoul Metro estão em impasse, com uma greve planejada ameaçando ocorrer.", "titulo_pt": "Finais negociações entre trabalhadores e administração da Seoul Metro em impasse antes de greve planejada", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 283635, "titulo": "Especial | Así fue la captura del Chapo Isidro en Guasave", "url": "https://elpais.com/mexico/2026-11-24/especial-asi-fue-la-captura-del-chapo-isidro-en-guasave.html", "fonte_id": "elpais_america", "data_pub": "2026-11-24T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A operação Centella mobilizou 361 elementos e 14 aeronaves. Fausto Isidro Meza, conhecido como Chapo Isidro, foi detido em Guasave em 20 de novembro às 19h50 e posteriormente levado para a Cidade do México.", "titulo_pt": "Assim foi a captura do Chapo Isidro em Guasave", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 283638, "titulo": "“TrumpCare”: la apuesta de Abdul El-Sayed que apela a la vanidad del presidente para que firme un Medicare para todos", "url": "https://elpais.com/us/2026-11-24/trumpcare-la-apuesta-de-abdul-el-sayed-que-apela-a-la-vanidad-del-presidente-para-que-firme-un-medicare-para-todos.html", "fonte_id": "elpais_america", "data_pub": "2026-11-24T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O senador eleito pelo Michigan, Abdul El-Sayed, afirmou que o nome do programa não é importante, mas que o objetivo primordial é garantir o acesso à saúde para todos os americanos. El-Sayed está apelando para a vanidade do presidente para que ele assine uma proposta de Medicare para todos.", "titulo_pt": "Trumpcare: a aposta de Abdul El-Sayed que apela à vanidade do presidente para um Medicare para todos", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 283761, "titulo": "Russia to build Kaliningrad exclave rail ferries, citing transport 'blockade'", "url": "https://www.euronews.com/2026/11/24/russia-to-build-kaliningrad-exclave-rail-ferries-citing-transport-blockade", "fonte_id": "euronews", "data_pub": "2026-11-24T09:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Rússia planeja construir ferries de trens para o exclave de Kaliningrado, que serão operados entre Baltiysk e Ust-Luga a partir de 2030 e custarão aproximadamente 50 bilhões de rúblas. Estes ferries serão construídos na Crimeia ocupada. A maioria do frete para Kaliningrado já foi transferida para rotas marítimas devido às restrições de transito impostas pela Lituânia e Polônia após a invasão de 2022.", "titulo_pt": "Rússia vai construir ferries de trens para kaliningrado, citando 'bloqueio' de transporte", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 283495, "titulo": "A mensagem de Trump que ajudou a reverter a crise e levou Jensen Huang de volta ao comando da Nvidia", "url": "https://www.bbc.com/portuguese/articles/cr1ew6x7gqe9o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-24T09:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang, CEO da Nvidia, desempenhou um papel crucial na transformação da empresa em uma peça-chave para a inteligência artificial, ajudando a reverter uma crise e fortalecer a posição dos EUA nesse setor.", "titulo_pt": "Mensagem de Trump que ajudou a reverter crise e trouxe Huang de volta à Nvidia", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 283763, "titulo": "Trump says he spoke to Nvidia board before Jensen Huang's return as CEO", "url": "https://www.euronews.com/2026/11/24/trump-says-he-spoke-to-nvidia-board-before-jensen-huangs-return-as-ceo", "fonte_id": "euronews", "data_pub": "2026-11-24T09:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, afirmou que conversou diretamente com o conselho de administração da Nvidia antes do retorno de Jensen Huang como CEO. Trump disse que achou o conselho 'muito, muito razoável'.", "titulo_pt": "Trump afirma ter conversado com conselho da Nvidia antes de Huang voltar como CEO", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 283715, "titulo": "Le Pen spokesperson's reported condoning of 1990s antisemitic booklet an 'error,' says Bardella", "url": "https://www.lemonde.fr/en/politics/article/2026/11/24/le-pen-spokesperson-s-reported-condoning-of-1990s-antisemitic-booklet-an-error-says-bardella_6787685_5.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-24T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jordan Bardella, presidente do Rassemblement National, uma extrema-direita, declarou que não irá tomar sanções contra a parlamentar Laure Lavalette, em relação a supostas declarações que a apoiariam em relação a um antissemita panfleto dos anos 90.", "titulo_pt": "Declarações de apoiar panfleto antissemita dos anos 90 não resultarão em sanções para parlamentar, diz Bardella", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 283855, "titulo": "China approves 2-month suspension extension for select US export restrictions", "url": "https://www.scmp.com/economy/global-economy/article/3375609/china-approves-2-month-extension-select-us-export-restrictions", "fonte_id": "scmp", "data_pub": "2026-11-24T09:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China prorrogou por dois meses a suspensão de algumas rest
