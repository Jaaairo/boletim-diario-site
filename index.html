</div>

<script>
const D = {"gerado_em": "30/07/2026 15:58", "stats": {"noticias_novas": 936, "resumos_gerados": 250}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Tribunal de Contas da União (TCU) encontrou irregularidades em 82% das emendas do Pix que foram auditadas, totalizando R$ 198,11 milhões. Para as eleições de 2026, Flávio Bolsonaro deve enfrentar Lula em dois debates. O PT está concentrado nas vitórias de seus aliados no Ceará, Bahia e Rio para compensar uma possível derrota do candidato petista no primeiro turno na eleição do estado de São Paulo. A arrecadação federal atingiu um novo recorde em junho com R$ 264,4 bilhões, impulsionada pelo aumento dos preços do petróleo e da economia brasileira.", "mundo": "O conflito entre Estados Unidos e Irã continua a se expandir, com ataques mútuos e ameaças de retaliação. Após a Arábia Saudita admitir sua participação direta na guerra, um ataque com drones no Egito ameaça alargar o escopo do conflito. A Arábia Saudita também convidou várias nações para auxiliar nas operações no Mar Vermelho diante dos ataques hutí no Iêmen. Em outro front, a crise migratória se agrava em Ceuta, Espanha, com centenas de pessoas nadando de Marrocos para o enclave. O Brasil apresentou uma queixa contra o tarifaço na OMC, conforme exposto no Euro Radar, newsletter da Folha sobre a Europa, destacando a paralisia do tribunal. Além disso, a Arábia Saudita enfrenta a decisão de continuar retaliando ou reduzir as tensões com os vizinhos em meio ao conflito com o Irã.\n\nOs Estados Unidos e o Irã continuam a intensificar suas tensões geopolíticas, com relatos de lançamentos recíprocos de mísseis. Em um ataque aéreo recente na Ucrânia, nove pessoas foram mortas, incluindo três crianças, levando o presidente Volodymyr Zelensky a criticar a inação dos aliados internacionais e enfatizar a necessidade de sistemas de defesa aérea. O Irã também foi acusado por funcionários norte-americanos de ser responsável por um cibercrime que afetou mais de 30 sistemas de água em Minnesota, Estados Unidos. Paralelamente, o conflito entre Rússia e Ucrânia continua a intensificar-se, com ataques recentes russos a empresas americanas na Ucrânia e no território polonês causando preocupações sobre um possível escalada da guerra.", "economia": "A economia global enfrenta diversos desafios e oportunidades. A arrecadação federal brasileira registrou um recorde histórico no primeiro semestre, com R$ 1,58 trilhão, refletindo uma expansão do PIB e a tributação mais intensa durante o governo Lula. No entanto, os juros das famílias permanecem elevados, atingindo 64% ao ano em junho, com aumento de 1,2 ponto percentual em comparação com maio, refletindo inadimplência e comprometimento da renda. Em outro desenvolvimento econômico, a Ambev registrou um lucro trimestral de R$ 3,5 bilhões, uma alta de 25% em relação ao período anterior, impulsionado por uma receita líquida que cresceu 6%. No exterior, os Estados Unidos apresentaram um crescimento do PIB de 1,5% no segundo trimestre, acima das expectativas, com a inflação desacelerando para 3,7% em junho. Ainda assim, o aumento do déficit comercial e a possibilidade de novos ataques no Oriente Médio podem impactar os preços globais dos bens. Além disso, a União Europeia lançou uma iniciativa para investir US$ 22 bilhões na construção de gigafábricas de inteligência artificial com o objetivo de aumentar sua competitividade tecnológica.", "tecnologia": "A OpenAI reduziu os preços de dois de seus modelos de inteligência artificial, GPT-5.6, diante da crescente sensibilidade das empresas aos custos. A empresa Zoox, que opera sob a Amazon, agora oferece um serviço de táxi robótico pago em Las Vegas. Além disso, o modelo de IA Gemini Robotics atualizado da Google DeepMind foi atualizado para controlar todo o corpo de um robô humanoide, incluindo movimentos dos pés até os dedos, expandindo significativamente seu controle físico. No campo da IA física, a inteligência artificial está sendo integrada à realidade prática, como no desenvolvimento do primeiro carro com Apple Maps integrado e condução sem o uso das mãos. Além disso, existem plataformas que auxiliam na criação, organização e otimização de prompts para diferentes modelos de IA. No entanto, os riscos associados à concordância excessiva da IA com usuários e a vulnerabilidade dos grandes modelos de linguagem a ataques são preocupações significativas que merecem atenção.", "ciencia": "Uma pesquisa publicada no site da phys.org indica que a precipitação em certas áreas dos Estados Unidos vem cada vez mais de fontes distantes, sugerindo uma mudança climática significativa. Em um desenvolvimento histórico, pesquisadores da Trinity College Dublin recuperaram e analisaram os primeiros genomas do vírus varioloso identificados na América, fornecendo evidência direta de que a doença foi introduzida através da colonização europeia, conforme relatado no New Scientist. A próxima grande telescope espacial da NASA, o Roman Space Telescope, está programada para ser lançada no final de agosto, com seu cronograma avançado em nove meses, como informado pelo SpaceXnews.", "cultura": "A morte do autor japonês Keigo Higashino resultou em um aumento nas vendas de seus livros em Taiwan, com títulos como os seus se destacando nas listas de best-sellers locais. Em outro destaque cultural, a Cinemateca realiza a 5ª Mostra SAC até o dia 9 de agosto, exibindo filmes de diretores como Stronheim, Henri Colpi e David Neves. A artista Simone Forti, que revolucionou a dança contemporânea, faleceu aos 91 anos em Los Angeles após uma longa luta contra a doença de Parkinson. Além disso, o Masp promove uma edição especial de dez anos do projeto Música no Vão com shows gratuitos nos segundos sábados de agosto a novembro. Outras notícias incluem a confirmação da atriz Duda Santos para interpretar Daiane dos Santos em um filme sobre a ginasta, e a realização de uma exposição sobre os irmãos Davies na The Kinks em Londres, avaliando as 40 melhores músicas da banda.", "sociedade": "O Rio de Janeiro registrou danos e mortes após um forte vendaval que atingiu a cidade, com 264 ocorrências registradas pelo Corpo de Bombeiros, incluindo 25 quedas de árvores. Até o momento, cerca de 600 mil pessoas no estado ainda não têm energia elétrica. Em São Paulo, os policiais militares Renato Torquatto e Robson Noguchi estão na fase de debates do julgamento por terem sido acusados da morte de um jovem durante uma operação policial; eles são processados pelo crime de homicídio qualificado. Na área social, a Fundação Mediterránea revelou que 34 monotributistas são necessários para financiar uma aposentadoria média, ilustrando as desigualdades no sistema de aposentadorias. Além disso, a justiça determinou que o INSS atenda entregadores do iFood que sofram acidentes durante o horário de trabalho, fortalecendo medidas de proteção previdenciária para esses profissionais.", "meio_ambiente": "Condições climáticas extremas e incêndios florestais afetam várias regiões da Europa, incluindo a França, Espanha, Grécia e Turquia. Em Gironde, na França, um incêndio ameaçava casas residenciais, mas foi controlado com o apoio de bombeiros e moradores locais, bem como aviões de combate a fogo. No entanto, no Mediterrâneo, incêndios florestais continuam a queimar em Castellón e Zamora, na Espanha, enquanto em Creta, na Grécia, dois bombeiros morreram em um incêndio que se espalhou rapidamente devido ao vento forte. Em todo o Mediterrâneo, equipes de bombeiros estão lutando contra as chamas, com milhares de pessoas evacuadas e aviões auxiliando nos esforços de combate aos incêndios. Além disso, uma seca sem precedentes atinge o centro da França, com apenas três dos 35 riachos monitorados pelo Serviço Francês de Biodiversidade ainda fluindo. Em contraste, a Europa não está tendo seu ano mais calmo em termos de incêndios florestais, como sugerido por gráficos compartilhados nas redes sociais. O relatório do Carbon Brief refuta essa afirmação, indicando que este é um ano normal para incêndios na região.", "direitos_humanos": "Um relatório sobre direitos humanos descreveu um incidente fatal envolvendo um homem palestino. Além disso, a Agência das Nações Unidas para as Migrações relatou um aumento significativo no tráfico humano através de redes sociais para centros de golpes em Ásia, com casos que incluem abuso sexual. Em outro caso, um relatório indicou que uma jovem que matou seu pai policial agiu em legítima defesa, conforme investigado."}, "resumo_do_dia": {"politica_nacional": [{"id": 81821, "titulo": "TCU vê irregularidade em 82% das emendas Pix que foram auditadas", "url": "https://www.metropoles.com/brasil/tcu-ve-irregularidade-em-82-das-emendas-pix-que-foram-auditadas", "fonte_id": "metropoles", "data_pub": "2026-07-30T17:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal de Contas da União (TCU) identificou irregularidades em 82% das emendas do Pix que foram examinadas.", "titulo_pt": "TCU encontra irregularidades em 82% das emendas Pix auditadas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 81830, "titulo": "Flávio e Lula devem se enfrentar em dois debates na TV", "url": "https://www.metropoles.com/colunas/milena-teixeira/flavio-e-lula-devem-se-enfrentar-em-dois-debates-de-tv-veja-quais", "fonte_id": "metropoles", "data_pub": "2026-07-30T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula deve participar de dois debates na TV, provavelmente contra Flávio Dino. A campanha de Lula também planeja sua participação em podcasts de diferentes áreas, mas ele não deve aparecer nos debates da Bandeirantes e do SBT.", "titulo_pt": "Flávio e Lula devem se enfrentar em dois debates na TV", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 81616, "titulo": "PT aposta em vitórias em Ceará, Bahia e Rio para compensar possível derrota no primeiro turno em SP", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/pt-aposta-em-vitorias-em-ceara-bahia-e-rio-para-compensar-possivel-derrota-no-primeiro-turno-em-sp.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-30T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PT está focado nas vitórias de seus aliados no Ceará, Bahia e Rio para compensar uma possível derrota de Lula já no primeiro turno na eleição do estado de São Paulo. A estratégia visa manter a chance de vitória geral da sigla.", "titulo_pt": "PT aposta em vitórias nos estados para compensar derrota provável em SP", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 81673, "titulo": "Contas do governo têm déficit de R$ 48,2 bilhões em junho", "url": "https://g1.globo.com/economia/noticia/2026/07/30/contas-do-governo-tem-deficit-de-r-482-bilhoes-em-junho.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-30T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As contas do governo registraram um déficit primário de R$ 48,2 bilhões em junho. Este resultado foi pior que o mesmo período do ano anterior e representa o pior desempenho para junho desde 2017.", "titulo_pt": "Contas do governo têm déficit de R$ 48,2 bilhões em junho", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 81833, "titulo": "Flávio Bolsonaro não quer ir a debates sem Lula, só com Renan e Caiado", "url": "https://www.metropoles.com/colunas/andreza-matais/flavio-bolsonaro-nao-quer-ir-a-debates-sem-lula-so-com-renan-e-caiado", "fonte_id": "metropoles", "data_pub": "2026-07-30T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de Flávio Bolsonaro não considera vantajoso participar de debates apenas com Renan Santos (Missão) e Caiado (PSD). Flávio Bolsonaro prefere comparecer a debates em que Lula esteja presente.", "titulo_pt": "Flávio Bolsonaro rejeita debates sem Lula, preferindo somente com Renan e Caiado", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 81674, "titulo": "Os 'Bolsonaros de IA' que fazem campanha até contra Flávio nas redes sociais nesta eleição", "url": "https://g1.globo.com/tecnologia/noticia/2026/07/30/os-bolsonaros-de-ia-que-fazem-campanha-ate-contra-flavio-nas-redes-sociais-nesta-eleicao.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-30T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Vídeos de inteligência artificial (IA) simulando Jair Bolsonaro estão circulando nas redes sociais dos apoiadores do ex-presidente, dando a impressão de que ele está ativamente envolvido na campanha para as eleições de 2026. Essas publicações incluem mensagens apelativas e até mesmo vídeos com supostos choros.", "titulo_pt": "Os 'Bolsonaros de IA' que fazem campanha nas redes sociais nesta eleição", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 81761, "titulo": "Campanha de Marina Helena fala em “contato informais” para vice de Flávio", "url": "https://www.cnnbrasil.com.br/eleicoes/campanha-de-marina-helena-fala-em-contato-informais-para-vice-de-flavio/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T17:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marina Helena, candidata à deputada federal, afirma que não houve convite formal para ser vice de Flávio e destaca o foco na disputa pela vaga na Câmara.", "titulo_pt": "Campanha de Marina Helena nega convite formal para vice de Flávio", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 81647, "titulo": "Lei destina parte do dinheiro de bets para fundo da Polícia Federal", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-07/lei-destina-parte-do-dinheiro-de-bets-para-fundo-da-policia-federal", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-07-30T16:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A lei sancionada destina 3% dos recursos provenientes das apostas de quota fixa, conhecidas como bets, ao Fundo para Aparelhamento e Operacionalização das Atividades-fim da Polícia Federal (Funapol). O texto foi originado de uma Medida Provisória aprovada pelo Senado em 8 de novembro de 2026.", "titulo_pt": "Lei direciona parte dos lucros de bets para fundo da Polícia Federal", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 81617, "titulo": "Questões externas escondem vazio do debate eleitoral interno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/dora-kramer/2026/07/questoes-externas-escondem-vazio-do-debate-eleitoral-interno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-30T16:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A política externa e as relações internacionais do Brasil não são temas frequentemente discutidos durante as campanhas eleitorais. No entanto, isso pode estar mudando.", "titulo_pt": "Questões externas começam a emergir no debate eleitoral interno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 81618, "titulo": "Lula sanciona MP que repassa parte de arrecadação com bets para Polícia Federal", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/07/lula-sanciona-mp-que-repassa-parte-de-arrecadacao-com-bets-para-policia-federal.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-30T16:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva sancionou uma medida provisória que destina parte dos valores arrecadados com impostos de bets para a Polícia Federal. O projeto foi aprovado pelo Senado em julho deste ano.", "titulo_pt": "Lula sanciona MP que repassa parte dos valores de bets para Polícia Federal", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 81675, "titulo": "STJ nega pedido da defesa de Buzzi e mantém data de julgamento por assédio e importunação sexual", "url": "https://g1.globo.com/politica/noticia/2026/07/30/stj-nega-pedido-da-defesa-de-buzzi-para-adiar-julgamento-por-assedio-e-importunacao-sexual.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-30T16:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Superior Tribunal de Justiça (STJ) negou um pedido para adiar o julgamento do processo disciplinar contra o ministro Marco Buzzi, que responde por importunação e assédio sexual. A sessão está marcada para a próxima quinta-feira (6).", "titulo_pt": "STJ mantém data de julgamento do processo contra Buzzi", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 81652, "titulo": "Rússia estende veto à exportação de diesel, afetando o Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/russia-estende-veto-a-exportacao-de-diesel-afetando-o-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-30T16:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo da Rússia estendeu o veto à exportação de óleo diesel e gasolina até 31 de janeiro de 2027. A proibição, que iniciou em 8 de julho, foi prorrogada para permitir a venda interna do diesel a partir de setembro deste ano.", "titulo_pt": "Rússia prorroga veto à exportação de diesel e gasolina até 2027", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 81653, "titulo": "Dona de 'Fortnite' acusa Apple de fazer lobby para que governo Trump prejudique o Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/07/dona-de-fortnite-acusa-apple-de-fazer-lobby-para-que-governo-trump-prejudique-o-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-30T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tim Sweeney, CEO da Epic Games, acusa a Apple de usar lobistas para prejudicar as relações entre Brasil e Estados Unidos. A acusação se segue após o Cade ter obrigado a Apple a abrir o sistema operacional do iPhone para lojas virtuais externas.", "titulo_pt": "Dono de 'Fortnite' acusa Apple de lobby contra Brasil nos EUA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 81676, "titulo": "Ministro diz que agentes econômicos devem ser tratados como um caminhão de japoneses: 'São todos iguais'", "url": "https://g1.globo.com/politica/noticia/2026/07/30/ministro-diz-que-agentes-economicos-devem-ser-tratados-como-um-caminhao-de-japoneses-sao-todos-iguais.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-30T15:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro de Minas e Energia, Alexandre Silveira, fez uma declaração preconceituosa durante um evento sobre novas regras para a venda de gás natural da União, comparando agentes econômicos a um 'caminhão de japonês' e defendendo tratamento igualitário.", "titulo_pt": "Ministro compara agentes econômicos a caminhão de japoneses em declaração preconceituosa", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 81677, "titulo": "Caixa inicia nesta quinta depósito de R$ 13 bilhões do lucro do FGTS a 138 milhões de trabalhadores", "url": "https://g1.globo.com/economia/noticia/2026/07/30/caixa-deposita-r-13-bilhoes-do-lucro-do-fgts-a-138-milhoes-de-trabalhadores-nesta-sexta.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-30T15:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Caixa Econômica Federal começou a depositar nesta quinta-feira (30) R$ 13,04 bilhões do lucro do FGTS de 2025 em contas de 138,2 milhões de trabalhadores. Os depósitos podem ser consultados no aplicativo do FGTS ou pelo Internet Banking da Caixa.", "titulo_pt": "Caixa inicia nesta quinta depósito de R$ 13 bilhões do lucro do FGTS a 138 milhões de trabalhadores", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 81841, "titulo": "Entre recuos e restrições, governo Lula muda rotina com o defeso eleitoral", "url": "https://www.jota.info/eleicoes/eleicoes-2026/entre-recuos-e-restricoes-governo-lula-muda-rotina-com-o-defeso-eleitoral", "fonte_id": "jota", "data_pub": "2026-07-30T15:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula fez várias alterações, incluindo a retirada de marca e slogan da gestão em peças oficiais, além de transferir falas do presidente para seu canal pessoal. Essas mudanças ocorreram durante o período de defeso eleitoral.", "titulo_pt": "Entre recuos e restrições, governo Lula modifica rotina com o defeso eleitoral", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 82317, "titulo": "US and Iran trade missile barrages as war drags on", "url": "https://www.taipeitimes.com/News/front/archives/2026/07/31/2003861687", "fonte_id": "taipei_times", "data_pub": "2026-07-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos e Irã trocaram lançamentos de mísseis, com a guerra prolongada se estendendo.", "titulo_pt": "EUA e Irã trocam lançamentos de mísseis enquanto guerra persiste", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 81798, "titulo": "Anti-trade? América Latina ganha apelo como “opção” ao tema IA – e Brasil se destaca", "url": "https://www.infomoney.com.br/mercados/anti-trade-america-latina-ganha-apelo-como-opcao-ao-tema-ia-e-brasil-se-destaca/", "fonte_id": "infomoney", "data_pub": "2026-07-30T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O JPMorgan identifica potencial de retorno de cerca de 30% para uma carteira recomendada na América Latina, com destaque para as ações brasileiras. O Brasil se destaca entre os emergentes em relação ao tema IA.", "titulo_pt": "Anti-trade? América Latina ganha apelo como ‘opção’ ao tema IA – e Brasil se destaca", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 81930, "titulo": "Iran War Live Updates: Drone Attack in Egypt Threatens to Expand Fighting", "url": "https://www.nytimes.com/live/2026/07/30/world/iran-war-strikes-trump", "fonte_id": "nyt_world", "data_pub": "2026-07-30T17:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Estados Unidos e Irã trocaram ataques durante a noite, após a Arábia Saudita admitir pela primeira vez sua participação direta na guerra. Um ataque com drones na Egito ameaça expandir o conflito.", "titulo_pt": "Atualizações da guerra: troca de ataques entre EUA e Irã", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 81934, "titulo": "Saudi Arabia Aims to Deter Red Sea Attacks With New Coalition", "url": "https://www.nytimes.com/2026/07/30/world/middleeast/saudi-arabia-red-sea-houthis.html", "fonte_id": "nyt_world", "data_pub": "2026-07-30T17:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Diante de ataques do movimento hutí no Iêmen, a Arábia Saudita convidou várias nações para auxiliar na proteção do tráfego marítimo no Mar Vermelho.", "titulo_pt": "Arábia saudita pretende detter ataques no mar vermelho com nova coalizão", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 82138, "titulo": "Danube's record low levels force shutdown of Hungary's only nuclear plant", "url": "https://www.bbc.co.uk/news/articles/cn0nqv05g0do?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-07-30T17:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os níveis históricamente baixos do rio Danúbio levaram ao encerramento temporário da única usina nuclear deHungria. Romênia, Bulgária e Sérvia também enfrentam os efeitos prolongados de uma série de ondas de calor e baixa precipitação.", "titulo_pt": "Níveis históricos baixos do danúbio interrompem usina nuclear na hungria", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 82003, "titulo": "Última hora de la entrada de inmigrantes a Ceuta, en directo | El Gobierno moviliza al Ejército para hacer frente a la crisis en Ceuta", "url": "https://elpais.com/espana/2026-07-30/ultima-hora-de-la-entrada-de-inmigrantes-a-ceuta-en-directo.html", "fonte_id": "elpais_america", "data_pub": "2026-07-30T17:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Bruxelas monitoriza de perto a situação e oferece apoio da Frontex à Espanha. Uma coluna de cinco quilômetros formada por milhares de pessoas aguarda na Marrocos para cruzar a fronteira. O presidente de Ceuta pediu ao governo que declare emergência nacional e assuma o comando único.", "titulo_pt": "Últimas notícias sobre a entrada de imigrantes em Ceuta, em tempo real | governo mobiliza exército para enfrentar a crise", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 81910, "titulo": "Ataque aéreo russo deixa nove mortos na Ucrânia, incluindo três crianças", "url": "https://veja.abril.com.br/mundo/ataque-aereo-russo-deixa-nove-mortos-na-ucrania-incluindo-tres-criancas/", "fonte_id": "veja", "data_pub": "2026-07-30T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ataque aéreo russo causou nove mortes na Ucrânia, incluindo três crianças. O presidente Volodymyr Zelensky criticou omissão de aliados internacionais e enfatizou a necessidade de sistemas de defesa aérea.", "titulo_pt": "Ataque aéreo russo deixa nove mortos na Ucrânia, incluindo três crianças", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 82053, "titulo": "EE.UU. vincula a Irán a ciberataque contra más de 30 sistemas de agua en Minnesota", "url": "https://www.latercera.com/mundo/noticia/eeuu-vincula-a-iran-a-ciberataque-contra-mas-de-30-sistemas-de-agua-en-minnesota/", "fonte_id": "la_tercera", "data_pub": "2026-07-30T17:49:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Funcionários estaduais informaram que as técnicas de cibercriminosos e a falta de pedido de resgate levaram os analistas a suspeitar que o ataque contra mais de 30 sistemas de água em Minnesota foi realizado por piratas informáticos iranianos.", "titulo_pt": "EUA atribuem ataque cibernético a mais de 30 sistemas d'água no Minnesota a Irã", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 82004, "titulo": "Centenares de inmigrantes llegan a nado a Ceuta, en imágenes", "url": "https://elpais.com/espana/2026-07-30/centenares-de-inmigrantes-llegan-a-nado-a-ceuta-en-imagenes.html", "fonte_id": "elpais_america", "data_pub": "2026-07-30T17:49:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Centenas de pessoas, principalmente jovens marroquinos e homens, entraram a nado na madrugada desta quinta-feira no território de Ceuta. Nos últimos dias, aproximadamente 1.500 pessoas nadaram ao redor do espigão que separa as fronteiras entre Marrocos e Espanha.", "titulo_pt": "Centenas de imigrantes chegam a nado a Ceuta, em imagens", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 82280, "titulo": "Delmastro, ho inoltrato io le chat alla procura non avendo nulla da nascondere", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/30/delmastro-ho-inoltrato-io-le-chat-alla-procura-non-avendo-nulla-da-nascondere_f6049e36-82c5-4f66-b63d-ba8a4d8beff3.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-30T17:48:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O político Delmastro afirmou ter enviado mensagens de chat para a procuradoria, sem ter o que esconder. Ele espera agora que certos elementos da política pare Guy de aceitar as evidências.", "titulo_pt": "Delmastro enviou mensagens à procura e espera que parte da política aceite", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 82033, "titulo": "The Trump administration wants $10 million more to cover its July Fourth celebrations", "url": "https://www.npr.org/2026/07/30/nx-s1-5913172/freedom-250-july-fourth-10-million", "fonte_id": "npr_news", "data_pub": "2026-07-30T17:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Trump solicitou mais $10 milhões para cobrir as celebrações do Dia de Independência. O Congresso já alocou $150 milhões para os eventos em comemoração ao 250º aniversário.", "titulo_pt": "Governo Trump pede mais $10 milhões para festivais e shows de fogos de artifício no dia de independência", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 82034, "titulo": "Are you choosing to stay single? We want to hear from you", "url": "https://www.npr.org/2026/07/30/g-s1-136079/single-adult-solo-choice", "fonte_id": "npr_news", "data_pub": "2026-07-30T17:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitos adultos estão optando por permanecer solteiros e abraçando a solteirice como símbolo de autonomia. A solteirice está sendo aceita em vários aspectos da vida, incluindo viver sozinho, viajar sozinho e comer sozinho.", "titulo_pt": "Você escolheu ficar solteiro? Queremos ouvir de você", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 82281, "titulo": "Fontana chiede parere a Giunta regolamento, congelato accesso a chat Delmastro", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/30/fontana-chiede-parere-a-giunta-regolamento-congelato-accesso-a-chat-delmastro_16675736-adeb-4f5d-b0dc-f1e5c07acae2.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-30T17:47:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A reunião será realizada na próxima segunda-feira. O tema a ser discutido envolve pedidos de opinião à Giunta sobre o regulamento que congelou o acesso do Delmastro ao chat.", "titulo_pt": "Fontana pede parecer à Giunta sobre regulamento que congela acesso do Delmastro", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 82015, "titulo": "Zaidi’s Militia Dilemma", "url": "https://foreignpolicy.com/2026/07/30/iraq-iran-militias-zaidi-trump-isis-oil/", "fonte_id": "foreign_policy", "data_pub": "2026-07-30T17:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O novo primeiro-ministro do Irak enfrenta um desafio familiar ao lidar com grupos apoiados pelo Irã.", "titulo_pt": "Desafio familiar para o novo primeiro-ministro do irak", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 81630, "titulo": "Queixa do Brasil contra o tarifaço na OMC expõe paralisia do tribunal", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/07/queixa-do-brasil-contra-o-tarifaco-na-omc-expoe-paralisia-do-tribunal.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-07-30T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil apresentou uma queixa contra o aumento das tarifas na Organização Mundial do Comércio (OMC), exposto no Euro Radar, newsletter da Folha sobre a Europa. O evento destaca a paralisia do tribunal da OMC.", "titulo_pt": "Queixa do Brasil sobre tarifaço na OMC ilustra paralisia do tribunal", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 82282, "titulo": "Durov, 'per Mosca sono terrorista perché ho rifiutato le richieste di censura'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/30/durov-per-mosca-sono-terrorista-perche-ho-rifiutato-le-richieste-di-censura_016f9998-ab87-4464-8521-ab95ba735eee.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-30T17:44:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Pavel Durov, fundador do Telegram, respondeu às acusações da Rússia de ser considerado um terrorista por ter rejeitado as solicitações de censura. Ele afirma que está sendo tratado como terrorista pela Rússia devido à sua recusa em censurar o conteúdo.", "titulo_pt": "Durov, 'para a Rússia sou terrorista porque rejeitei as solicitações de censura'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 82322, "titulo": "Inheritance law changes to stop tax dodging", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/07/31/2003861696", "fonte_id": "taipei_times", "data_pub": "2026-07-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As leis de herança foram alteradas para prevenir a evasão fiscal. A mudança visa garantir que os herdeiros não possam usar estratégias fiscais inadequadas para reduzir seus impostos.", "titulo_pt": "Alterações nas leis de herança para combater a evasão fiscal", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 81648, "titulo": "Onda global de roubo de cobre atinge telecomunicações e ferrovias", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/onda-global-de-roubo-de-cobre-atinge-telecomunicacoes-e-ferrovias.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-30T17:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A polícia chilena identificou este ano o maior caso de roubo de cobre da história do país, onde criminosos venderam quase US$ 1 bilhão em cobre roubado ao longo de cinco anos, incluindo cabos de telecomunicações desviados por técnicos durante a substituição de linhas antigas por fibra óptica.", "titulo_pt": "Onda global de roubo de cobre atinge telecomunicações e ferrovias", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 81698, "titulo": "Vendaval ainda causa danos a moradores do Rio de Janeiro", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-07/vendaval-ainda-causa-danos-moradores-do-rio-de-janeiro", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-07-30T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vendaval causou interrupções no fornecimento de energia para cerca de 320 mil clientes da Light na capital do Rio de Janeiro. A companhia registrou um pico de cerca de 1,1 milhão de clientes sem serviço durante o evento mais crítico.", "titulo_pt": "Vendaval causa interrupções no fornecimento de energia em partes do Rio", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 81649, "titulo": "União Europeia lança uma iniciativa para garantir US$ 22 bilhões para 'gigafábricas' de IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/uniao-europeia-lanca-uma-iniciativa-para-garantir-us-22-bilhoes-para-gigafabricas-de-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-30T17:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A União Europeia lançou uma busca por investimentos privados no valor de cerca de 22 bilhões de dólares para construir 'gigafábricas' de inteligência artificial e aumentar sua competitividade. O investimento se somará a fundos estatais.", "titulo_pt": "União Europeia lança iniciativa para atrair US$ 22 bilhões para 'gigafábricas' de IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 81759, "titulo": "Mastercard lucra US$ 4,39 bilhões no 2º tri e ações sobem em Wall Street", "url": "https://www.cnnbrasil.com.br/economia/negocios/mastercard-lucra-mais-que-expectativas-e-acoes-sobem-em-wall-street/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-30T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Mastercard registrou lucro ajustado por ação de US$ 5,04 no segundo trimestre, superando as expectativas dos analistas. As ações da empresa subiram em Wall Street.", "titulo_pt": "Mastercard lucra US$ 4,39 bilhões no 2º tri e ações sobem em Wall Street", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 81806, "titulo": "Iene dispara e reacende especulação de nova intervenção do Japão no câmbio", "url": "https://www.infomoney.com.br/mercados/iene-dispara-e-reacende-especulacao-de-nova-intervencao-do-japao-no-cambio/", "fonte_id": "infomoney", "data_pub": "2026-07-30T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O iene registrou a maior alta intradiária desde dezembro de 2023, levantando especulações sobre uma possível intervenção cambial do Banco do Japão (BOJ) na próxima decisão de juros.", "titulo_pt": "Iene dispara e reacende especulação de nova intervenção do Japão no câmbio", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 82237, "titulo": "Japan’s yen jumps 3% as speculation over intervention swirls", "url": "https://www.ft.com/content/8455ec94-0182-46a6-b5dd-2bb5b0a75a6c?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-30T16:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O iene japonês está registrando uma das maiores movimentações recentes, com um aumento de 3%, diante da crescente pressão para intervenção para frear sua queda.", "titulo_pt": "Iene japonês salta 3% ante pressões de intervenção", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 82234, "titulo": "Warsh’s stripped-back Fed communication ‘already backfiring’, say investors", "url": "https://www.ft.com/content/57aac838-baee-406d-b4ac-c0ffda351aee?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-30T16:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores alertam que a comunicação simplificada do Fed sobre taxas de juros está minando sua influência no mercado dos títulos do Tesouro americano. Eles afirmam que a falta de diretrizes sobre as taxas já está causando um efeito negativo.", "titulo_pt": "Comunicação enxuta do Fed já se mostrando negativa, dizem investidores", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 81651, "titulo": "Aumento de capital do Bradesco divide analistas entre oportunidade e proteção", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/aumento-de-capital-do-bradesco-divide-analistas-entre-oportunidade-e-protecao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-30T16:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Bradesco anunciou um aumento de capital nesta quarta-feira (29), gerando dúvidas entre analistas sobre se trata de uma oportunidade ou de uma necessidade de fortalecer o caixa diante do aumento da inadimplência e dos juros em alta.", "titulo_pt": "Aumento de capital do Bradesco divide opiniões entre oportunidade e proteção", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 81840, "titulo": "Carf mantém parte de autuação de R$ 6,1 bi contra Marfrig por lucros no exterior", "url": "https://www.jota.info/tributos/carf-mantem-parte-de-autuacao-de-r-61-bi-contra-marfrig-por-lucros-no-exterior", "fonte_id": "jota", "data_pub": "2026-07-30T16:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Atribuição de lucros no exterior continua parcialmente autuada pela Marfrig, no valor de R$ 6,1 bilhões. O processo examina a tributação dos resultados das controladas internacionais da empresa.", "titulo_pt": "Carf mantém parte de autuação de R$ 6,1 bi contra Marfrig por lucros no exterior", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 82243, "titulo": "US GDP growth dips as inflation and trade deficits pressure economy", "url": "https://www.aljazeera.com/economy/2026/7/30/us-gdp-growth-dips-as-inflation-and-trade-deficits-pressure-economy?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-30T15:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O crescimento do PIB dos Estados Unidos decelerou para 1,5% no segundo trimestre, após um aumento de 2,1% no primeiro trimestre. A inflação e os déficits comerciais estão pressionando a economia americana.", "titulo_pt": "Crescimento do pib dos EUA diminui na segunda metade do ano", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 81699, "titulo": "Arrecadação federal cresce 7,7% em junho e soma R$ 264,4 bilhões", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-07/arrecadacao-federal-cresce-77-em-junho-e-soma-r-2644-bilhoes", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-07-30T15:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A arrecadação federal alcançou R$ 264,4 bilhões em junho de 2025, representando um crescimento real de 7,7% em comparação com o mesmo mês do ano anterior. No acumulado do primeiro semestre, as receitas somaram cerca de R$ 1,587 trilhão, avanço real de 6,6% na comparação com os seis primeiros meses de 2024.", "titulo_pt": "Arrecadação federal cresce 7,7% em junho e soma R$ 264,4 bilhões", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 81654, "titulo": "Juro médio cobrado das famílias sobe a 64% em junho, maior patamar em quase 10 anos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/juro-medio-cobrado-das-familias-sobe-a-64-em-junho-maior-patamar-em-quase-10-anos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-30T15:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em junho, a taxa média de juros cobrada das famílias no crédito livre atingiu 64% ao ano, um aumento em relação aos 62,8% do mês anterior. Essa é a maior taxa desde agosto de 2017.", "titulo_pt": "Juro médio cobrado das famílias no crédito livre sobe para 64% em junho", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 81655, "titulo": "Arrecadação federal cresce 7,7% e fecha 1º semestre com recorde histórico, diz Receita", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/arrecadacao-federal-cresce-77-e-fecha-1o-semestre-com-recorde-historico-diz-receita.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-30T15:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A arrecadação do governo federal aumentou realimentado 7,72% em junho em comparação com o mesmo mês do ano anterior, totalizando R$ 264,44 bilhões. Este foi o maior volume mensal já registrado e contribuiu para um resultado recorde no primeiro semestre.", "titulo_pt": "Arrecadação federal cresce 7,7% e fecha 1º semestre com recorde histórico", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 81656, "titulo": "Brasil pedirá aos EUA redução de alíquotas e mais exceções ao tarifaço, diz ministro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/brasil-pedira-aos-eua-reducao-de-aliquotas-e-mais-excecoes-ao-tarifaco-diz-ministro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-30T15:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil solicitará à administração dos Estados Unidos a redução das alíquotas e a ampliação da lista de exceções ao tarifaço de 37,5% imposto pela Casa Branca. Isso foi declarado pelo ministro Márcio Elias Rosa durante uma entrevista nesta quinta-feira (30).", "titulo_pt": "Brasil pedirá redução de alíquotas e mais exceções ao tarifaço aos EUA, diz ministro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 81658, "titulo": "Ações de tecnologia na China caminham para pior mês em mais de dez anos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/07/01/6533-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466671", "fonte_id": "folha_mercado", "data_pub": "2026-07-30T15:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações de empresas chinesas de tecnologia caíram nesta quinta-feira após uma liquidação global no setor, levando o mercado continental para seu pior desempenho mensal em mais de dez anos.", "titulo_pt": "Ações de tecnologia na China registram pior mês em mais de dez anos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 82374, "titulo": "Nvidia’s Open Source Alliance Snubs OpenAI and Anthropic", "url": "https://www.wired.com/story/nvidias-open-source-alliance-snubs-openai-and-anthropic/", "fonte_id": "wired", "data_pub": "2026-07-30T17:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O programa Uncanny Valley desta semana aborda o debate entre software de código aberto e fechado no campo da IA, os principais atores na política de AI do governo dos EUA, e como impedir que as logs das chatbots apareçam nos resultados de buscas.", "titulo_pt": "Aliança aberta da nvidia ignora OpenAI e Anthropic", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 82187, "titulo": "OpenAI cuts prices for two of its GPT-5.6 AI models as companies grow sensitive to costs", "url": "https://www.cnbc.com/2026/07/30/open-ai-price-cut-gpt.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-30T17:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OpenAI reduziu os preços de dois dos seus modelos de inteligência artificial GPT-5.6 diante da crescente sensibilidade das empresas aos custos.", "titulo_pt": "Openai reduz preços de dois modelos de AI GPT-5.6 diante da sensibilidade crescente às despesas", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 82346, "titulo": "Google DeepMind’s new AI model can control a robot’s entire body", "url": "https://www.theverge.com/tech/973276/google-deepmind-gemini-robotics-2-whole-body", "fonte_id": "the_verge", "data_pub": "2026-07-30T17:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O modelo de IA Gemini Robotics da Google DeepMind foi atualizado para controlar o corpo inteiro de um robô humanoide, incluindo movimentos dos pés até os dedos. Anteriormente, a versão anterior do modelo se concentrava apenas no controle do torso superior do robô humanoide.", "titulo_pt": "Novo modelo de IA da google DeepMind pode controlar todo o corpo de um robô humanoide", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 82232, "titulo": "Are investors really getting cold feet about the AI boom?", "url": "https://www.ft.com/content/00d91e68-9508-42bd-b1e3-124bf7dd390b?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-30T17:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Não há evidências claras de que os investidores tenham mudado significativamente sua opinião sobre a relação subjacente ao boom da IA no mercado acionário.", "titulo_pt": "Investidores realmente estão perdendo entusiasmo com o boom da IA?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 82339, "titulo": "Montana’s plan to become an experimental medical hub just pushed forward", "url": "https://www.technologyreview.com/2026/07/30/1140942/montana-experimental-medical-hub-pushed-forward-right-to-try/", "fonte_id": "mit_tech_review", "data_pub": "2026-07-30T17:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A partir desta semana no Montana, qualquer empresa de biotecnologia com um medicamento experimental tem uma rota clara para comercializá-lo. As empresas podem pagar $12,500 para se submeterem a um novo painel de revisão para aprovação, e uma vez que o tratamento seja aprovado, pode ser vendido aos consumidores.", "titulo_pt": "Plano do montana para se tornar um hub experimental médico avança", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 82347, "titulo": "ABC demands FCC drop its ‘punitive’ early license renewal of its stations", "url": "https://www.theverge.com/policy/973289/abc-fcc-early-license-renewal-opposition", "fonte_id": "the_verge", "data_pub": "2026-07-30T17:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ABC apresentou sua oposição formal à tentativa da Federal Communications Commission (FCC) de exigir uma renovação antecipada das licenças de suas estações de rádio e televisão, alegando que essa medida visa silenciar os broadcasters em todo o país. A empresa acusa a agência reguladora de querer aplicar sanções.", "titulo_pt": "ABC opõe-se à tentativa da FCC de realizar uma renovação antecipada de suas licenças", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 82376, "titulo": "For the First Time, Zoox Can Charge People for Rides in Its Steering-Wheel-Free Robotaxis", "url": "https://www.wired.com/story/zoox-becomes-the-first-steering-wheel-free-robotaxi-to-charge-for-rides-in-the-us/", "fonte_id": "wired", "data_pub": "2026-07-30T17:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Zoox, que opera sob a Amazon, está autorizada a oferecer um serviço de táxi robótico pago em Las Vegas. Isso ocorre após uma exceção temporária às normas federais de segurança.", "titulo_pt": "Pela primeira vez, Zoox pode cobrar passageiros por viagens em seus táxis robóticos sem volante", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 82377, "titulo": "Chrome Needs Twice-a-Week Patching Thanks to AI Bug Hunting", "url": "https://www.wired.com/story/chrome-needs-twice-a-week-patching-thanks-to-ai-bug-hunting-for-now/", "fonte_id": "wired", "data_pub": "2026-07-30T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em junho, duas atualizações do Chrome corrigiram mais bugs do que as 23 atualizações anteriores. Agora, graças à ajuda de inteligência artificial na detecção de vulnerabilidades, a Google está acelerando o cronograma de correções de segurança.", "titulo_pt": "Chrome passa a precisar de atualizações semanais devido ao uso de IA", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 82378, "titulo": "The New Friend AI Pendant Can Now Talk Back to You", "url": "https://www.wired.com/story/the-friend-2-necklace-can-talk-back-to-you-now/", "fonte_id": "wired", "data_pub": "2026-07-30T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Avi Schiffmann lançou uma nova versão de seu assistente de IA com personalidade. Este novo modelo é mais caro e não permite que o usuário personalize a personalidade do assistente.", "titulo_pt": "Novo amigo AI pendent agora pode responder", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 82231, "titulo": "Citadel buys Situational Awareness equity holdings after steep AI losses", "url": "https://www.ft.com/content/5fb44089-ecdf-4b48-bc14-1e8b4682b142?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-30T15:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Citadel adquiriu as participações de Situacional Awareness após perdas significativas relacionadas à IA. Durante a noite, os executivos da empresa realizaram reuniões urgentes com investidores.", "titulo_pt": "Citadel compra participações de situacional Awareness após perdas pesadas em AI", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 82379, "titulo": "Gemini Robotics 2 Brings Google's AI Into the Physical World", "url": "https://www.wired.com/story/google-gemini-can-control-humanoid-robots/", "fonte_id": "wired", "data_pub": "2026-07-30T15:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O modelo mais recente da inteligência artificial do Google DeepMind avançou significativamente para a 'AGI física'. No entanto, colocar IA no mundo real apresenta riscos.", "titulo_pt": "Gemini Robotics 2 integra a inteligência artificial do Google no mundo físico", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 81774, "titulo": "Plataformas ajudam a criar, organizar e otimizar prompts para diferentes modelos de IA", "url": "https://exame.com/inteligencia-artificial/plataformas-ajudam-a-criar-organizar-e-otimizar-prompts-para-diferentes-modelos-de-ia/", "fonte_id": "exame", "data_pub": "2026-07-30T14:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Plataformas especializadas auxiliam na criação, organização e otimização de prompts para modelos de IA como ChatGPT, Gemini e Claude.", "titulo_pt": "Plataformas ajudam a criar, organizar e otimizar prompts para diferentes modelos de IA", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 82354, "titulo": "Zoox can now charge for rides in its steering-wheel-free robotaxis", "url": "https://www.theverge.com/transportation/973099/zoox-amazon-nhtsa-robotaxi-approval", "fonte_id": "the_verge", "data_pub": "2026-07-30T14:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Zoox, empresa adquirida pela Amazon, recebeu permissão do National Highway Traffic Safety Administration (NHTSA) para cobrar por viagens em seus veículos sem volante a partir de quinta-feira. A autorização permite o deslocamento anual de até 2.500 veículos nos próximos dois anos.", "titulo_pt": "Zoox pode agora cobrar por viagens em seus táxis robôs sem volante", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 81780, "titulo": "Inteligência artificial pode estar concordando com você mais do que deveria; entenda os riscos", "url": "https://exame.com/inteligencia-artificial/inteligencia-artificial-pode-estar-concordando-com-voce-mais-do-que-deveria-entenda-os-riscos/", "fonte_id": "exame", "data_pub": "2026-07-30T14:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O comportamento conhecido como bajulação pode influenciar decisões e reforçar convicções equivocadas durante conversas com chatbots. A inteligência artificial está potencialmente concordando excessivamente com os usuários.", "titulo_pt": "Inteligência artificial pode estar concordando com você mais do que deveria; entenda os riscos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 82195, "titulo": "New details in the OpenAI Hugging Face hack show how far agents will go: 'It's now remarkably easy'", "url": "https://www.cnbc.com/2026/07/30/open-ai-hugging-face-hack-latest.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-30T14:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Detalhes do vazamento da Hugging Face, causado por modelos não autorizados da OpenAI, mostram que os agentes usaram credenciais públicamente expostas em quatro contas de quatro serviços. O incidente demonstra a facilidade crescente na execução dessas ações maliciosas.", "titulo_pt": "Detalhes do vazamento Hugging Face revelam o quão longe os agentes irão: 'é agora surpreendentemente fácil'", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 82401, "titulo": "Detect Dark Matter’s Mark From Your Backyard", "url": "https://spectrum.ieee.org/dark-matter", "fonte_id": "ieee_spectrum", "data_pub": "2026-07-30T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "É possível detectar a presença de matéria escura usando um pequeno telescópio radioelétrico, como o Discovery Dish. A matéria escura é invisível e sua detecção se baseia nas observações das suas efetivas forças gravitacionais.", "titulo_pt": "Detecte a marca da matéria escura do seu jardim", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 82409, "titulo": "Rainfall across the US is increasingly coming from farther away", "url": "https://phys.org/news/2026-07-rainfall.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa indica que a precipitação em certas áreas dos Estados Unidos vem cada vez mais de fontes distantes. A água que forma a chuva pode ter viajado desde alguns quilômetros até milhares de quilômetros.", "titulo_pt": "Chuva nos EUA está vindo de lugares mais distantes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 82410, "titulo": "Ancient smallpox genomes reveal how European colonization brought the disease to the Americas", "url": "https://phys.org/news/2026-07-ancient-smallpox-genomes-reveal-european.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Trinity College Dublin recuperaram e analisaram os primeiros genomas do vírus varioloso identificados na América, fornecendo a evidência mais direta até o momento de que a doença foi introduzida através da colonização europeia.", "titulo_pt": "Genomas antigos de varíola revelam como a colonização europeia trouxe a doença para as américas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 82411, "titulo": "Before North and South America were connected, their mammals found a way to intermingle", "url": "https://phys.org/news/2026-07-north-south-america-mammals-intermingle.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Antes da formação do Istmo do Panamá, aproximadamente 2,8 milhões de anos atrás, as Américas do Norte e Sul eram continentes isolados com grupos animais únicos. No sul, encontravam-se marsupiais e sloth, enquanto no norte predominavam camélidos, cavalos, antílopes-pronghorn e gatos de dentes de sabre.", "titulo_pt": "Antes da conexão entre o norte e sul américa, seus mamíferos encontraram um jeito de se misturarem", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 82457, "titulo": "The genome of a long-extinct ancient human is hiding within us", "url": "https://www.newscientist.com/article/2582522-the-genome-of-a-long-extinct-ancient-human-is-hiding-within-us/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-07-30T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores descobriram fragmentos de DNA de um antigo humano extinto dentro da população atual e sugerem que a reconstrução desses fragmentos pode permitir a reconstituição do genoma desse ancestral perdido.", "titulo_pt": "O genoma de um ancestral antigo extinto está oculto em nós mesmos", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 82458, "titulo": "Smallpox DNA in ancient Inca mummies shows virus came from Europe", "url": "https://www.newscientist.com/article/2582442-smallpox-dna-in-ancient-inca-mummies-shows-virus-came-from-europe/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-07-30T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "DNA do vírus smallpox foi encontrado nos restos mortais de duas pessoas que viviam no Chile há mais de 400 anos, indicando que o vírus veio da Europa para as Américas.", "titulo_pt": "DNA do smallpox em mumíos antigos incaicos mostra que vírus veio da Europa", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 82447, "titulo": "Roman Space Telescope on track for late August launch", "url": "https://spacenews.com/roman-space-telescope-on-track-for-late-august-launch/", "fonte_id": "spacenews", "data_pub": "2026-07-30T17:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A próxima grande telescope espacial da NASA está programada para ser lançada no final de agosto, avançando seu cronograma em nove meses.", "titulo_pt": "Telescópio espacial roman no caminho para lançamento em agosto", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 82448, "titulo": "Jim Bridenstine on his new role at Quantum Space", "url": "https://spacenews.com/jim-bridenstine-on-his-new-role-at-quantum-space/", "fonte_id": "spacenews", "data_pub": "2026-07-30T17:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jim Bridenstine, ex-administrador da NASA e atual CEO da Quantum Space, discute a estratégia de proliferação em baixa órbita durante uma entrevista com David Ariosto.", "titulo_pt": "Jim Bridenstine sobre seu novo papel na Quantum Space", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 82412, "titulo": "Flexible working could help more women lead family businesses, researchers say", "url": "https://phys.org/news/2026-07-flexible-women-family-businesses.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo da Universidade de East London sugere que a inovação no ambiente de trabalho digital pode facilitar mais mulheres empreendedoras a se tornarem líderes de empresas familiares, ajudando a equilibrar melhor vida profissional e pessoal.", "titulo_pt": "Trabalho flexível poderia auxiliar mais mulheres a liderarem empresas familiares", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 82413, "titulo": "Light's hidden properties save quantum information from the chaos of bad weather", "url": "https://phys.org/news/2026-07-hidden-properties-quantum-chaos-bad.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores têm explorado o uso da 'rotação' do luz para transmitir dados, uma propriedade que descreve como a luz se espirala enquanto se move. Esta característica oferece um vasto alfabeto promissor para comunicações de alta capacidade.", "titulo_pt": "Propriedades ocultas da luz preservam informações quânticas diante das incertezas do tempo ruim", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 82345, "titulo": "NASA’s Curiosity rover found a ‘sea of polygons’ on Mars", "url": "https://www.theverge.com/science/973314/nasa-curiosity-rover-mars-polygons", "fonte_id": "the_verge", "data_pub": "2026-07-30T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A sonda Curiosity da NASA descobriu uma área com formas poligonais semelhantes a um mar de hexágonos em um vale chamado Valle Grande na superfície de Marte. Antes, essas formações eram observadas em pequenos grupos, mas agora foram encontrados em uma extensão maior.", "titulo_pt": "Curiosity da nasa encontra 'mar de polígonos' em marte", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 82414, "titulo": "Volcanic eruptions in Pacific Ring of Fire may have cooled Earth for centuries", "url": "https://phys.org/news/2026-07-volcanic-eruptions-pacific-cooled-earth.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante cerca de 12.000 anos, a Terra está na Era Holocena, um período mais quente que se seguiu a uma fase glacial. Neste período, ocorreram aproximadamente 22 fases abruptas de frio, cada uma durando até several centuries e resultando no avanço dos gelos.", "titulo_pt": "Eruptiones vulcânicas na circunferência do fogo do pacífico podem ter resfriado a terra por séculos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 82415, "titulo": "Advances in AI-designed base editors pave the way for next-generation gene therapy", "url": "https://phys.org/news/2026-07-advances-ai-base-editors-pave.html", "fonte_id": "phys_org", "data_pub": "2026-07-30T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo de pesquisadores liderado por professores da Sungkyunkwan University e da University of Ulsan College of Medicine desenvolveu um editor de bases aberto chamado OpenABE. Este avanço na edição de genes baseada em inteligência artificial pode abrir caminho para terapias genéticas gerações mais avançadas.", "titulo_pt": "Avanços em editores baseados em IA levam ao desenvolvimento do openabe", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 82445, "titulo": "NASA Assigns Astronaut Deniz Burnham to First Space Station Mission", "url": "https://www.nasa.gov/news-release/nasa-assigns-astronaut-deniz-burnham-to-first-space-station-mission/", "fonte_id": "nasa_news", "data_pub": "2026-07-30T16:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A astronauta Deniz Burnham da NASA será a primeira missão à Estação Espacial Internacional como engenheira de expedição 76. Ela viajará com cosmonautas Dmitri Petelin e Konstantin Borisov a bordo do foguete Soyuz MS-30, com lançamento previsto para março de 2027.", "titulo_pt": "NASA designa astronauta Deniz Burnham para primeira missão à estação espacial", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 82295, "titulo": "Top US science journals more likely to reject paper by Chinese authors: study", "url": "https://www.scmp.com/news/china/science/article/3362349/top-us-science-journals-more-likely-reject-paper-chinese-authors-study?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-30T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores baseados na China ou com sobrenome chinês tinham menores chances de ter seus artigos publicados nas revistas científicas mais prestigiadas do mundo, conforme mostrou um estudo. A taxa de aceitação para submissões de pesquisadores chineses foi de apenas 2,5%, em comparação com 8,3% para pesquisadores norte-americanos e canadenses.", "titulo_pt": "Estudos americanos mais propensos a rejeitar artigos de autores chineses: estudo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 82443, "titulo": "How one amino acid might help fight colon cancer and infections", "url": "https://www.sciencenews.org/article/amino-acid-argininine-colon-cancer-diet", "fonte_id": "science_news", "data_pub": "2026-07-30T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A arginina na dieta reduz a formação de tumores e a carga viral nos mouse ao aumentar proteínas importantes do sistema imunológico.", "titulo_pt": "Como uma única aminoácida poderia ajudar no combate ao câncer colorretal e infecções", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 82446, "titulo": "Starburst Galaxy Centaurus A", "url": "https://www.nasa.gov/image-article/starburst-galaxy-centaurus-a/", "fonte_id": "nasa_news", "data_pub": "2026-07-30T14:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do Telescópio Espacial James Webb da NASA, capturada pelo Instrumento de Infravermelho Médio (MIRI) no dia 6 de julho de 2026, revela a galáxia Centaurus A. Esta galáxia, a cerca de 11 milhões de anos-luz da Terra, é ativa e exibe estruturas escuras de poeira e atividade oculta.", "titulo_pt": "Galáxia Centaurus A em imagem do james webb", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 82332, "titulo": "Higashino’s death sends his novels soaring on Taiwan bestseller lists", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/07/31/2003861706", "fonte_id": "taipei_times", "data_pub": "2026-07-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas dos livros de Higashino aumentaram significativamente nas listas de best-sellers da Taiwan após sua morte.", "titulo_pt": "Morte de higashino faz seus livros subirem nas listas de best-sellers na Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 81954, "titulo": "Después de dos semanas, repuntaron las visitas y las ventas en la Feria del Libro Infantil y Juvenil, que sigue hasta el domingo", "url": "https://www.lanacion.com.ar/cultura/despues-de
