      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "15/09/2026 19:15", "stats": {"noticias_novas": 640, "resumos_gerados": 230}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "No Supremo Tribunal Federal (STF), uma sessão extraordinária analisava o relatório da Polícia Federal sobre o ministro Alexandre de Moraes e o ex-dono do Banco Master, Daniel Vorcaro. A sessão gerou tensões e debates. O presidente do STF, Luís Roberto Barroso, interrompeu a sessão após o ministro Flávio Dino pedir vista, alegando que o STF está em 'fase procrastinatória'. A crise no STF afeta as estratégias eleitorais de candidatos à presidência, como Luiz Inácio Lula da Silva e Flávio Bolsonaro, que buscam minimizar o impacto do conflito. A ministra Cármen Lúcia votou para julgar Moraes e Mendonça separadamente, com placar de 4 a 3, enquanto Gilmar Mendes defendeu Paulo Gonet em um confronto verbal com André Mendonça.", "mundo": "O Reino Unido reestabeleceu suas relações diplomáticas com a Venezuela, permitindo a devolução de 31 toneladas de ouro venezuelano. Israel realizou ataques com drones em Gaza, resultando em mortes e feridos, o que gerou pressão internacional sobre a continuidade dos ataques. O Reino Unido também está considerando se juntar a um banco de defesa liderado pelo Canadá, em meio a um conflito comercial com os Estados Unidos. O Canadá anunciou um plano para uma aliança única de segurança e economia com a União Europeia, em resposta a uma disputa comercial com os EUA. Um juiz bloqueou o plano de renomear o Kennedy Center com o nome de Donald Trump. Na Turquia, 31 ativistas LGBTQIA+ foram detidos em uma operação relacionada a uma campanha governamental, enquanto o empresário colombiano Alex Saab se declarou culpado de lavagem de dinheiro nos Estados Unidos. Em outro evento, um concerto de Céline Dion em Paris foi marcado pela emoção após anos de luta contra uma doença neurológica rara. O Irã gastou aproximadamente $246 milhões por dia em suas atividades militares nos primeiros cinco meses do ano. Por fim, uma selfie supostamente mostrando líderes do BRICS foi criada usando ferramentas de inteligência artificial, gerando críticas na Turquia e na Europa.\n\nOs Estados Unidos reconheceram pela primeira vez a presença de armas no espaço, o que gerou reações da China e da Rússia. O governo americano planeja direcionar $52 milhões em ajuda militar para países próximos a Donald Trump na América do Sul, um movimento que reflete a política externa do presidente. A Rússia realizou votações antecipadas em áreas ocupadas da Ucrânia, com a presença de forças militares, enquanto a OTAN downou um dron suspeito de ser russo sobre a Lituânia, levantando preocupações sobre o risco de um conflito mais amplo. Estes eventos refletem as tensões geopolíticas atuais, com as grandes potências buscando influência e segurança em diferentes regiões do mundo.", "economia": "O Copom deve reduzir os juros durante a reunião desta quarta-feira, mas a situação econômica futura ficou mais incerta, conforme indicou o Copom. O Ibovespa avançou 0,54% em um ambiente de cautela, com investidores monitorando decisões sobre juros, o preço do petróleo e a votação no STF. A decisão do Fed foi considerada um fator de cautela no mercado de criptomoedas, com o Bitcoin operando em baixa de 3,76% e o Ethereum recuando 5,06%. A Minera San Gerónimo adquiriu o projeto Casa de Piedra, que possui reservas estimadas em 36 milhões de toneladas, fortalecendo sua presença na Região de Coquimbo, Chile. No Brasil, a Apex Partners pediu recuperação judicial após uma crise envolvendo seu ex-presidente, enquanto a área técnica do TCU sugeriu que a corte emita um alerta ao governo sobre o risco de manter a previsão integral de arrecadação com a tributação de dividendos no Orçamento. A sanção de uma lei que elimina impostos federais sobre equipamentos de data center é vista como crucial para atrair investimentos no Brasil, estimando-se US$ 92 bilhões em cinco anos. A guerra do Irã e as tarifas de Donald Trump aumentaram os preços de entrada, enquanto o boom da IA reduziu a disponibilidade de alguns componentes, levando a uma nova onda de inflação nos custos da cadeia de suprimentos industriais nos Estados Unidos.", "tecnologia": "A construção de centrais de dados de inteligência artificial (IA) está em expansão, mas levanta preocupações em várias cidades, como Philadelphia, onde os moradores expressaram temores sobre a construção em áreas já afetadas por indústrias anteriores. No Estados Unidos, um projeto de lei sobre criptomoedas falhou, com divisões entre senadores sobre questões éticas relacionadas a Donald Trump. A TSMC, líder mundial em produção de chips, expressou cautela no uso de IA em pesquisas sensíveis. No cenário de IA, a preocupação com a possibilidade de um 'auto-aumento recursivo' das máquinas tem ganhado força, com especialistas defendendo a desaceleração do desenvolvimento da tecnologia. Em meio a essas discussões, empresas como OpenAI, Anthropic e Google DeepMind estão trabalhando na criação de um órgão de supervisão para monitorar os riscos associados à IA, enquanto Jensen Huang, CEO da Nvidia, afirma que a luta entre inovação e segurança na IA é uma escolha falsa. A indústria de semicondutores deve alcançar um faturamento próximo a 2,4 trilhões de dólares em 2031, com o poder de preços sendo o fator definidor para o desenvolvimento da IA, não a capacidade produtiva. Além disso, a crescente demanda por armazenamento de energia de baterias de veículos elétricos está aumentando devido à expansão de centrais de dados de IA gerativa, enquanto restrições de política e tarifas estão impulsionando a reutilização de capacidade de baterias de veículos elétricos ociosas.", "ciencia": "A NASA celebrou o International Observe the Moon Night, convidando a mídia e o público para observar a Lua em eventos espalhados pelo país, incluindo o U.S. Space & Rocket Center em Huntsville, Alabama. A missão Artemis III, que levou quatro astronautas de volta à órbita lunar após 50 anos, também foi destacada. Os astronautas Randy Bresnik, Andre Douglas, Luca Parmitano, Frank Rubio e Bob Hines visitaram o Vehicle Assembly Building do Kennedy Space Center para inspecionar o avanço na integração do fogueto propelente sólido. Em um desenvolvimento científico, a NASA's James Webb Space Telescope revelou uma panorâmica dinâmica de formação estelar, capturando uma vista estelar detalhada da região formadora de estrelas IC 348, descobrindo brown dwarfs com duas vezes a massa de Júpiter. Além disso, a descoberta de uma estrutura construída significativa em uma região montanhosa no norte-oeste do Marrocos, indicando a presença de comunidades na África ocidental durante o segundo milênio a.C., também foi noticiada, reescrevendo a história regional conhecida.", "cultura": "Funcionários de três importantes museus dos Estados Unidos, incluindo o Whitney Museum, o Brooklyn Museum e o American Folk Art Museum, votaram a favor de uma greve, conforme informou o Hyperallergic. A decisão foi tomada após negociações insatisfatórias com as administrações dos museus. Além disso, a exposição 'Mundo Pequeno' de Martin Parr, composta por 45 fotografias produzidas entre os anos 1980 e 1990, abre no dia 15 de outubro na Galeria de Fotos do Centro Cultural Fiesp, em São Paulo. A curadoria é de João Kulcsár. No âmbito da cultura pop, a série 'Neagley', protagonizada por Maria Sten, é uma continuação do universo de Reacher, focando em uma investigadora particular de Chicago e amiga do protagonista na Unidade de Investigações Especiais do Exército, conforme informado pela Folha Ilustrada.", "sociedade": "O Japão atingiu pela primeira vez a marca de 100.000 pessoas com 100 anos ou mais, refletindo uma tendência constante de envelhecimento e diminuição da população. Em contraste, mais de 17.000 crianças afetadas pela cheia no Nepal precisam de assistência psicológica e suporte psicossocial urgente. O Japão está intensificando as medidas contra o tráfico de pessoas, incluindo exploração laboral e sexual, diante do aumento no número de vítimas identificadas. Além disso, a região do Jardim Pantanal, em São Paulo, está alagada há quatro dias, levando a comunidade a se mobilizar para distribuir água e alimentos. A confiança na Polícia Federal é majoritária entre os brasileiros, com 70%, enquanto 42% confiam no Supremo Tribunal Federal.", "meio_ambiente": "O padrão climático El Niño atingiu um nível extremo, conforme informado pelos meteorologistas. Isso pode levar a mudanças climáticas intensas, incluindo chuvas abundantes e secas severas, além de calor extremo. Este fenômeno afeta diversos países, com destaque para o Brasil, onde o clima experimentou contrastes, com geada no Sul e calor no Norte. Em Singapura, a qualidade do ar atingiu níveis prejudiciais devido à fumaça proveniente de incêndios florestais na Indonésia. Na Indonésia, os fogos florestais ameaçam um importante centro de pesquisa de orangotangos em Bornéu. Incêndios florestais também atingiram a Albânia, onde as falhas no gerenciamento do estado foram agravadas pelo aquecimento global.", "direitos_humanos": "A terceira Guerra Mundial foi identificada como o maior risco global para os próximos dois anos, de acordo com um relatório da ONU. No entanto, a discussão sobre direitos humanos também permeia diversos outros países. Em França, o primeiro-ministro Gabriel Attal anunciou um plano multianual para combater a violência de gênero e sexual, com um investimento inicial de 1,5 bilhão de euros em 2027. Em Istambul, pelo menos 150 manifestantes pró-LGBTQ foram detidos pela polícia turca em 15 de setembro, durante uma demonstração contra a repressão nacional à comunidade LGBTQ. Na Ucrânia, crianças enfrentam o quinto ano de impedimento de seu direito à educação, enquanto um centro de detenção de imigrantes na Flórida não cumpria normas básicas de higiene, atendimento médico, alimentação e segurança. Além disso, um antigo operador de um parlor em Tóquio foi condenado a cinco anos de prisão por contratar uma garota tailandesa de 12 anos para trabalhar no estabelecimento e obrigá-la a prestar serviços sexuais. No território administrado pelo Paquistão em Caxemira, o serviço de dados móveis e broadband foi suspenso desde junho, quando protestos exigiam reformas eleitorais. Por fim, a organização de direitos humanos israelense B’Tselem afirmou que a violência de colonos israelenses visa eliminar a existência dos palestinos."}, "resumo_do_dia": {"politica_nacional": [{"id": 164248, "titulo": "Fachin suspende sessão no STF com ministros rachados e sem decidir sobre análise de casos Moraes e Mendonça", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/fachin-suspende-sessao-no-stf-com-ministros-rachados-e-sem-decidir-sobre-analise-de-casos-moraes-e-mendonca.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-15T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF, ministro Edson Fachin, interrompeu a sessão sobre o relatório da Polícia Federal que apontou o ministro Alexandre de Moraes como interlocutor do dono do Banco Master, Daniel Vorcaro, após pedido de vista do ministro Flávio Dino. Os ministros do STF estavam divididos e não chegaram a uma decisão sobre a análise dos casos Moraes e Mendonça.", "titulo_pt": "Fachin suspende sessão no STF com ministros rachados e sem decidir sobre análise de casos Moraes e Mendonça", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 164261, "titulo": "Caiado considera que STF está em \"fase procrastinatória\" e pede abertura de investigação contra Alexandre de Moraes", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/15/caiado-considera-que-stf-esta-em-fase-procrastinatoria-e-pede-abertura-de-investigacao-contra-alexandre-de-moraes.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-15T21:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ronaldo Caiado, candidato à Presidência, afirmou que o Supremo Tribunal Federal está em uma 'fase procrastinatória' e pediu a abertura de uma investigação contra o ministro Alexandre de Moraes.", "titulo_pt": "Caiado considera que STF está em 'fase procrastinatória' e pede investigação em contra Alexandre de Moraes", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 164234, "titulo": "Economistas reduzem previsão de déficit do governo em 2026 e 2027", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/economistas-reduzem-previsao-de-deficit-do-governo-em-2026-e-2027.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T21:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Economistas consultados pelo Ministério da Fazenda reduziram as projeções do déficit primário do governo central para 2026 e 2027, mas previram uma dívida pública maior nos dois anos. O relatório Prisma foi divulgado nesta terça-feira (15/09/2026).", "titulo_pt": "Economistas reduzem projeções de déficit do governo em 2026 e 2027", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 164260, "titulo": "Em carta aos candidatos, Fenaj pede valorização dos jornalistas", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/em-carta-aos-candidatos-fenaj-pede-valorizacao-dos-jornalistas", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-15T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Federação Nacional dos Jornalistas (Fenaj) enviou cartas abertas aos candidatos à presidência da República e ao Congresso Nacional, alertando sobre a precarização dos jornalistas e a necessidade de regulamentação das plataformas digitais.", "titulo_pt": "Fenaj envia cartas aos candidatos com pleitos dos jornalistas", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 164236, "titulo": "Defender o STF exige defender cada ministro? Veja vídeo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/econometria-facil/2026/09/defender-o-stf-exige-defender-cada-ministro-veja-video.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O julgamento sobre a possível investigação de Alexandre de Moraes levanta a questão de se defender o STF exige defender cada ministro individualmente. O debate aborda a relação entre a instituição e seus membros individuais durante esse processo judicial.", "titulo_pt": "Defender o STF exige defender cada ministro?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 164262, "titulo": "Relatório sobre Moraes: Cármen Lúcia diz estar em profunda consternação e tristeza e pede desculpas ao povo brasileiro", "url": "https://g1.globo.com/politica/noticia/2026/09/15/carmen-lucia-diz-estar-em-estado-de-profunda-consternacao-e-tristeza.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-15T21:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cármen Lúcia, ministra do Supremo Tribunal Federal, declarou estar em profunda consternação e tristeza durante a sessão plenária. Ela pediu desculpas ao povo brasileiro em relação à crise no STF.", "titulo_pt": "Cármen Lúcia se desculpa e expressa consternação e tristeza sobre crise no stf", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 164263, "titulo": "Relatório sobre Moraes: STF tem discussão sobre 'avocatória', nulidade e Fachin ter puxado caso para si", "url": "https://g1.globo.com/politica/noticia/2026/09/15/relatorio-sobre-moraes-stf-tem-discussao-sobre-rito-nulidade-e-fachin-ter-puxado-caso-para-si.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-15T21:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O plenário do Supremo Tribunal Federal discutiu o rito de julgamento, a nulidade do relatório sobre o ministro Alexandre de Moraes e a decisão do presidente do tribunal, ministro Edson Fachin, de puxar o caso para si. A discussão foi iniciada após o ministro Gilmar Mendes apresentar uma questão de ordem contestando procedimentos do presidente do STF.", "titulo_pt": "STF debate rito de julgamento, nulidade e Fachin puxa caso de Moraes para si", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 164249, "titulo": "TSE e Ministério da Justiça vão restringir bloqueios e abordagens da PRF nas eleições", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/tse-e-ministerio-da-justica-vao-restringir-bloqueios-e-abordagens-da-prf-nas-eleicoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-15T21:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TSE e o Ministério da Justiça e Segurança Pública vão assinar uma portaria que estabelece regras para a atuação da PRF durante as eleições de 2026, com restrições a bloqueios em rodovias e abordagens que possam dificultar o deslocamento de eleitores.", "titulo_pt": "TSE e Ministério da Justiça vão restringir bloqueios e abordagens da PRF nas eleições", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 164285, "titulo": "O balanço de senadores sobre a sessão do STF que analisa eventual investigação de Moraes", "url": "https://veja.abril.com.br/politica/o-balanco-de-senadores-sobre-a-sessao-do-stf-que-analisa-eventual-investigacao-de-moraes/", "fonte_id": "veja", "data_pub": "2026-09-15T21:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Senadores discutiram a sessão do STF que analisará a possibilidade de investigar o ministro do STF, André Mendonça. A reunião do colegiado foi interrompida para aguardar o resultado da votação no plenário da Corte.", "titulo_pt": "Senadores avaliam sessão do STF sobre possível investigação de Moraes", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 164250, "titulo": "No STF, Gonet nega amizade com Vorcaro e diz que só falou uma vez com ex-dono do Master", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/no-stf-gonet-nega-amizade-com-vorcaro-e-diz-que-so-falou-uma-vez-com-ex-dono-do-master.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-15T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O procurador-geral da República, Paulo Gonet, negou qualquer amizade ou conhecimento com o ex-dono do Banco Master, Daniel Vorcaro. Gonet afirmou que apenas conversou uma vez, de forma casual, com o ex-banqueiro.", "titulo_pt": "Gonet nega amizade com Vorcaro e diz ter falado apenas uma vez", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 164264, "titulo": "O que é pedido de vista, solicitado por Flávio Dino? Entenda a regra", "url": "https://g1.globo.com/politica/noticia/2026/09/15/o-que-e-pedido-de-vista.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-15T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Flávio Dino, do Supremo Tribunal Federal (STF), solicitou vista durante uma sessão extraordinária que discute um relatório da Polícia Federal sobre a relação entre o ministro Alexandre de Moraes e o fundador do Banco Master, Daniel Vorcaro. Dino argumentou que não há condições de deliberar sobre o caso.", "titulo_pt": "O que é pedido de vista, solicitado por Flávio Dino? Entenda a regra", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 164559, "titulo": "Dino pede vista em julgamento sobre investigação de Moraes; ministros antecipam votos e empatam", "url": "https://www.jota.info/stf/do-supremo/dino-pede-vista-em-julgamento-sobre-pedido-para-adiar-caso-moraes-ministros-continuam-votando", "fonte_id": "jota", "data_pub": "2026-09-15T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Fux pediu vista no julgamento sobre a investigação proposta por Moraes. Os ministros anteciparam seus votos, resultando em um empate no placar de 4 a 3 para adiar a análise e realizar um julgamento conjunto.", "titulo_pt": "Fux pede vista e ministros empatam no julgamento sobre investigação de Moraes", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 164265, "titulo": "Moraes diz que não 'houve monitoramento algum' do ministro Mendonça em relatório de inteligência", "url": "https://g1.globo.com/politica/noticia/2026/09/15/moraes-diz-que-nao-houve-monitoramento-algum-do-ministro-mendonca-em-relatorio-de-inteligencia.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-15T20:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes, do Supremo Tribunal Federal (STF), afirmou que os relatórios de inteligência sobre o ministro André Mendonça são oficiais e que não houve monitoramento do colega de Corte. Essa declaração foi feita durante uma sessão que discute a suposta relação entre Moraes e o ex-banqueiro Daniel Vorcaro.", "titulo_pt": "Moraes afirma que não houve monitoramento de relatórios sobre Mendonça", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 164266, "titulo": "Gonet nega ter relação de proximidade com Vorcaro: 'única ligação foi brevíssima e banal'", "url": "https://g1.globo.com/politica/noticia/2026/09/15/gonet-afirma-que-nao-teve-relacao-de-proximidade-com-vorcaro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-15T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Procurador-Geral da República, Paulo Gonet, negou ter um relacionamento próximo com o banqueiro Daniel Vorcaro. Segundo Gonet, a única interação entre eles foi breve e não significativa, ocorrida em abril de 2024 durante um encontro com outras autoridades.", "titulo_pt": "Gonet nega ter relação próxima com Vorcaro", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 164267, "titulo": "Gilmar sai em defesa de Gonet e bate boca com Mendonça: 'Desfaçatez'", "url": "https://g1.globo.com/politica/noticia/2026/09/15/gilmar-e-mendonca-batem-boca-no-stf.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-15T20:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Durante uma sessão do Supremo Tribunal Federal, Gilmar Mendes e André Mendonça tiveram um confronto verbal. Gilmar defendeu Paulo Gonet após críticas de Mendonça, chamando-o de desfaçatez e levianidade.", "titulo_pt": "Gilmar defende Gonet e discute com Mendonça no stf", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 164251, "titulo": "Moraes se defende, questiona Fachin e reclama de prazo diferente dado a Mendonça", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/moraes-se-defende-questiona-fachin-e-reclama-de-prazo-diferente-dado-a-mendonca.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-15T20:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alexandre de Moraes, ministro do STF, se defendeu em sessão inédita, questionou Edson Fachin e reclamou de prazos diferentes recebidos em comparação com André Mendonça.", "titulo_pt": "Moraes se defende, questiona Fachin e reclama de prazos diferentes", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 164772, "titulo": "(EDITORIAL from Korea Herald on Sept. 16)", "url": "https://en.yna.co.kr/view/AEN20260916000600320", "fonte_id": "yonhap_news", "data_pub": "2026-09-15T21:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial atingiu um estágio incômodo. O CEO da Anthropic, Dario Amodei, está envolvido nesta situação.", "titulo_pt": "EDITORIAL sobre a inteligência artificial", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 164515, "titulo": "Estados Unidos reconoce por primera vez que desplegó armas en el espacio y provoca la reacción de Rusia y China", "url": "https://www.lanacion.com.ar/estados-unidos/estados-unidos-reconoce-por-primera-vez-que-desplego-armas-en-el-espacio-y-provoca-la-reaccion-de-nid15092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-15T21:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O secretário da Força Aérea dos Estados Unidos confirmou que o país possui armas em órbita para se defender de ações hostis de adversários. A China advertiu sobre o risco de transformar o espaço em um campo de batalha.", "titulo_pt": "EUA reconhecem por primeira vez ter armas no espaço e causam preocupação da China", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 164396, "titulo": "Reino Unido retoma relações com Venezuela, que assim pode recuperar 31 toneladas de ouro", "url": "https://www.brasildefato.com.br/2026/09/15/reino-unido-retoma-relacoes-com-venezuela-que-assim-pode-recuperar-31-toneladas-de-ouro/", "fonte_id": "brasil_de_fato", "data_pub": "2026-09-15T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Reino Unido decidiu reestabelecer suas relações diplomáticas com a Venezuela, nomeando embaixadores e buscando fortalecer a cooperação bilateral. Esta medida pode permitir a recuperação de 31 toneladas de ouro venezuelano.", "titulo_pt": "Reino Unido retoma relações com Venezuela, possibilitando recuperação de 31 toneladas de ouro", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 164588, "titulo": "Israeli Strikes in Gaza Kill Teenager and Civil Defense Worker, Official Says", "url": "https://www.nytimes.com/2026/09/15/world/middleeast/gaza-strikes-israel.html", "fonte_id": "nyt_world", "data_pub": "2026-09-15T21:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois ataques de drone israelenses atingiram um bairro residencial em Gaza, de acordo com um funcionário da defesa civil. Israel enfrenta pressão internacional para limitar seus ataques.", "titulo_pt": "Ataques de drone de israel em Gaza matam adolescente e funcionário de defesa Civil, oficial diz", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 164640, "titulo": "Department of Investigation eyes NYPD disability pensions", "url": "https://www.politico.com/newsletters/new-york-playbook-pm/2026/09/15/department-of-investigation-eyes-nypd-disability-pensions-01078076", "fonte_id": "politico", "data_pub": "2026-09-15T21:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Divisão de Investigação está examinando os benefícios de incapacidade da Polícia de Nova York (NYPD).", "titulo_pt": "Divisão de investigação examina benefícios de incapacidade da NYPD", "veiculo": "Politico", "pais": "EUA", "classe": "A"}, {"id": 164638, "titulo": "Congress Might Be About to Hand Trump Sweeping Tariff Powers", "url": "https://www.theatlantic.com/international/2026/09/russia-sanctions-bill-trump/688641/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-15T21:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Congresso pode estar prestes a conceder poderes de tarifas abrangentes a Trump. O projeto de lei sobre sanções à Rússia não é o que parece ser.", "titulo_pt": "Congresso pode conceder poderes de tarifas amplos a Trump", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 164700, "titulo": "Hundreds protest in DR Congo against third presidential term", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/15/hundreds-protest-in-dr-congo-against-third-presidential-term?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-15T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Centenas de pessoas protestam na República Democrática do Congo contra a tentativa de um terceiro mandato presidencial.", "titulo_pt": "Centenas protestam na república democrática do Congo contra terceiro mandato presidencial", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 164669, "titulo": "France receives Lebanon's President Aoun in Paris, a sign it still aims to play a role in Lebanese affairs", "url": "https://www.lemonde.fr/en/international/article/2026/09/15/france-receives-lebanon-s-president-aoun-in-paris-a-sign-it-still-aims-to-play-a-role-in-lebanese-affairs_6757565_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-15T21:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Emmanuel Macron e Joseph Aoun se encontrarão em Paris durante um summit internacional que apoia as Forças Armadas Líbias. A reunião reflete a intenção de Paris de manter seu papel nas assuntos libaneses, especialmente diante das dificuldades do acordo de cessar-fogo entre Israel e Líbano sob a mediação dos Estados Unidos.", "titulo_pt": "França recebe o presidente do líbano Aoun em Paris, sinal de que deseja ainda desempenhar um papel nas assuntos libaneses", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 164587, "titulo": "The A.I. Doomsday Skeptics", "url": "https://www.nytimes.com/2026/09/15/world/ai-doomsday-skeptics-sydney-sweeney.html", "fonte_id": "nyt_world", "data_pub": "2026-09-15T21:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alguns especialistas afirmam que o foco nas cenas dystópicas está redirecionando o discurso público das ameaças atuais para futuros hipotéticos.", "titulo_pt": "Os céticos sobre o ai do apocalipse", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 164228, "titulo": "Turquia prende 31 ativistas que protestavam contra repressão à comunidade LGBTQIA+", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/turquia-prende-31-ativistas-que-protestavam-contra-repressao-a-comunidade-lgbtqia.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-15T21:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As autoridades turcas prenderam 31 ativistas LGBTQIA+ em uma operação relacionada a uma campanha governamental contra grupos da comunidade. Além disso, a polícia deteve 126 pessoas durante protestos em Ancara e Istambul contra as recentes operações policiais e prisões.", "titulo_pt": "Turquia prende 31 ativistas LGBTQIA+ em protestos contra repressão", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 164696, "titulo": "US to divert $52 million in military aid from Europe and Middle East to Trump-friendly nations in Americas", "url": "https://www.euronews.com/2026/09/15/us-to-divert-52-million-in-military-aid-from-europe-and-middle-east-to-trump-friendly-nati", "fonte_id": "euronews", "data_pub": "2026-09-15T21:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos planeja direcionar $52 milhões de ajuda militar que estava destinada a Europa e Oriente Médio para países mais próximos do presidente Trump na América. Isso ocorre após o secretário de Estado dos EUA, Marco Rubio, visitar a América do Sul e se encontrar com líderes conservadores de Peru, Colômbia e Equador, prometendo apoio adicional e cooperação.", "titulo_pt": "EUA direcionarão $52 milhões de ajuda militar de Europa e oriente médio para países próximos do trump na américa", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 164829, "titulo": "Turkey expands arrests after LGBTQ+ crackdown", "url": "https://www.washingtonpost.com/world/2026/09/15/turkey-expands-arrests-after-lgbtq-crackdown/", "fonte_id": "washington_post_world", "data_pub": "2026-09-15T21:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro da Justiça da Turquia, Akin Gurlek, expandiu as detenções na comunidade LGBTQ+, justificando que isso faz parte de uma iniciativa para proteger crianças e valores familiares.", "titulo_pt": "Turquia amplia detenções após repressão à comunidade LGBTQ+", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 164320, "titulo": "EUA implantaram armas no espaço: quais os riscos de um ataque e porque o tipo de armamento não é revelado", "url": "https://www.cnnbrasil.com.br/ciencia/eua-implantaram-armas-no-espaco-quais-os-riscos-de-um-ataque-e-porque-o-tipo-de-armamento-nao-e-revelado/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T21:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O secretário da força aérea, Troy Meink, fez uma declaração sobre a implantação de armas no espaço, indicando um sinal claro a possíveis ameaças espaciais. O tipo específico de armamento não foi revelado.", "titulo_pt": "EUA implantaram armas no espaço: quais os riscos de um ataque e porque o tipo de armamento não é revelado", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 164558, "titulo": "La entrevista que dio Patricio Guzmán a Mónica González en 2021 por la primera emisión de “La Batalla de Chile” en la TV abierta del país", "url": "https://www.ciperchile.cl/2026/09/15/la-entrevista-que-dio-patricio-guzman-a-monica-gonzalez-en-2021-por-la-primera-emision-de-la-batalla-de-chile-en-la-tv-abierta-del-pais/?utm_source=rss&utm_medium=rss&utm_campaign=la-entrevista-que-dio-patricio-guzman-a-monica-gonzalez-en-2021-por-la-primera-emision-de-la-batalla-de-chile-en-la-tv-abierta-del-pais", "fonte_id": "ciper_chile", "data_pub": "2026-09-15T20:57:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Patrício Guzmán concedeu uma entrevista a Mónica González em 2021 sobre a primeira transmissão pública de 'A Batalha de Chile' no país.", "titulo_pt": "Entrevista de patrício Guzmán a Mónica González em 2021 sobre a primeira transmissão pública de 'a batalha de Chile'", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 164457, "titulo": "Governo Trump afirma ter lançado arma ao espaço: o que se sabe sobre o armamento", "url": "https://www.bbc.com/portuguese/articles/cj62erkqy3yvo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-15T20:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos anunciaram o desenvolvimento de equipamentos de guerra modernos na órbita terrestre. O governo Trump afirmou ter lançado uma arma ao espaço.", "titulo_pt": "Governo Trump afirma ter lançado arma ao espaço: o que se sabe sobre o armamento", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 164574, "titulo": "Alex Saab, presunto testaferro de Maduro, se declara culpable de blanqueo tras un acuerdo con EE.UU.", "url": "https://www.latercera.com/mundo/noticia/alex-saab-presunto-testaferro-de-maduro-se-declara-culpable-de-blanqueo-tras-un-acuerdo-con-eeuu/", "fonte_id": "la_tercera", "data_pub": "2026-09-15T20:53:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O empresário colombiano Alex Saab, deportado para os Estados Unidos em maio, se declarou culpable de lavagem de dinheiro sob um acordo com o país. Ele enfrenta uma possível sentença de até 20 anos de prisão.", "titulo_pt": "Alex Saab, suposto testaferro de Maduro, se declara culpável de lavagem de dinheiro após acordo com EUA", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 164386, "titulo": "Número de consumidores inadimplentes sobe 3,74% no DF", "url": "https://www.metropoles.com/distrito-federal/numero-de-consumidores-inadimplentes-no-comercio-sobe-374-no-df", "fonte_id": "metropoles", "data_pub": "2026-09-15T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de consumidores inadimplentes no Distrito Federal aumentou em 3,74% em relação ao período anterior. O relatório também apresenta dados sobre dívidas em atraso e recuperação de crédito na região.", "titulo_pt": "Número de consumidores inadimplentes cresce 3,74% no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 164310, "titulo": "Bitcoin opera em baixa com com cautela por decisão do Fed", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/bitcoin-opera-em-baixa-com-com-cautela-por-decisao-do-fed/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Bitcoin operava em baixa de 3,76%, a US$ 76.124,73, enquanto o Ethereum recuava 5,06%, a US$ 2.408,62, de acordo com a plataforma Binance. A decisão do Fed estava sendo considerada como um fator de cautela no mercado de criptomoedas.", "titulo_pt": "Bitcoin opera em baixa com cautela devido à decisão do Fed", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 164235, "titulo": "Indústria veterinária afirma ter R$ 1 bilhão retido à espera de registros", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/industria-veterinaria-afirma-ter-r-1-bilhao-retido-a-espera-de-registros.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As empresas farmacêuticas veterinárias do Brasil têm investido R$ 1 bilhão em novos medicamentos, vacinas e antiparasitários que aguardam registro no Ministério da Agricultura e Pecuária. Esse montante foi apresentado durante o Dinvet, seminário sobre regulação e inovação no setor promovido pela Alanac.", "titulo_pt": "Indústria veterinária afirma ter R$ 1 bilhão retido à espera de registros", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 164315, "titulo": "Wall Street cai com petróleo em alta e Treasuries acima de 5%", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/wall-street-cai-com-petroleo-em-alta-e-treasuries-acima-de-5/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T21:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mercado de ações de Wall Street registrou perdas, com o S&P 500, o Nasdaq Composite e o Dow Jones Industrial Average caindo respectivamente 0,45%, 0,77% e 0,63%. O aumento do petróleo e os rendimentos superiores a 5% dos Tesouro contribuíram para a queda.", "titulo_pt": "Wall Street cai com petróleo em alta e rendimentos acima de 5%", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 164568, "titulo": "“Alta fertilidad geológica”: mediana minera chilena compra rico yacimiento a compañía canadiense", "url": "https://www.latercera.com/mineria/noticia/alta-fertilidad-geologica-mediana-minera-chilena-compra-rico-yacimiento-a-compania-canadiense/", "fonte_id": "la_tercera", "data_pub": "2026-09-15T21:10:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Minera San Gerónimo adquiriu o projeto Casa de Piedra, que possui reservas estimadas em 36 milhões de toneladas. Esta aquisição fortalece a presença da empresa na Região de Coquimbo, Chile.", "titulo_pt": "Alta fertilidade geológica: minera chilena compra rico yacimiento da companhia canadense", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 164533, "titulo": "Intiman a los peritos de Hotesur y Los Sauces a terminar el análisis de los fondos que recibieron las empresas de los Kirchner", "url": "https://www.lanacion.com.ar/politica/intiman-a-los-peritos-de-hotesur-y-los-sauces-a-terminar-el-analisis-de-los-fondos-que-recibieron-nid15092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-15T21:08:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os peritos de Hotesur e as empresas de Los Sauces foram informados para terminar o análise dos fundos recebidos pelas empresas dos Kirchner até o dia seguinte. O tribunal está considerando estabelecer uma data para o julgamento contra Cristina e seu filho Máximo.", "titulo_pt": "Intima peritos de Hotesur e empresas de Los Sauces a finalizar análise dos fundos recebidos pelas empresas dos Kirchner", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 164534, "titulo": "El dato que revela cómo el ICE encuentra inmigrantes en los aeropuertos con más de 1200 arrestos tras alertas de la TSA", "url": "https://www.lanacion.com.ar/estados-unidos/migraciones/el-dato-que-revela-como-el-ice-encuentra-inmigrantes-en-los-aeropuertos-con-mas-de-1200-arrestos-nid15092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-15T21:08:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ICE usa informações da TSA para realizar mais de 1.200 detenções de imigrantes em aeroportos, mas o aumento no número de detenções não resulta em um aumento proporcional nas deportações.", "titulo_pt": "O dado que explica como o ICE encontra imigrantes em aeroportos com mais de 1.200 detenções após alertas da TSA", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 164238, "titulo": "Copom deve cortar os juros nesta quarta, mas o próximo passo ficou mais difícil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/09/copom-deve-cortar-os-juros-nesta-quarta-mas-o-proximo-passo-ficou-mais-dificil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Copom deve cortar os juros durante a reunião que termina nesta quarta-feira, mas a situação econômica futura ficou mais incerta.", "titulo_pt": "Copom deve cortar juros nesta quarta, mas o próximo passo ficou mais difícil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 164239, "titulo": "Apex Partners pede recuperação judicial após suposta fraude de ex-presidente", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/09/apex-partners-pede-recuperacao-judicial-apos-suposta-fraude-de-ex-presidente.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T20:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Apex Partners solicitou recuperação judicial após uma crise envolvendo seu ex-presidente. A empresa busca reestruturar dívidas no valor de aproximadamente R$ 1 bilhão. O BTG Pactual não comentou sobre o caso.", "titulo_pt": "Apex Partners pede recuperação judicial após crise com ex-presidente", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 164425, "titulo": "Democratas do Senado dos EUA bloqueiam regulamentação de criptomoedas", "url": "https://www.infomoney.com.br/mundo/democratas-do-senado-dos-eua-bloqueiam-regulamentacao-de-criptomoedas/", "fonte_id": "infomoney", "data_pub": "2026-09-15T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A votação do 'Clarity Act' resultou em 49 votos a 50, o que bloqueou o avanço da regulamentação de criptomoedas no Senado dos EUA. Esta votação, ocorrida em ano eleitoral, afeta o mercado de criptomoedas de valor aproximado de 2,3 trilhões de dólares, que tem pressionado pela criação de regras uniformes.", "titulo_pt": "Democratas do Senado dos EUA bloqueiam regulamentação de criptomoedas", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 164576, "titulo": "Bolsas mundiales caen y el bono del Tesoro a 10 años toca su mayor nivel desde la crisis financiera, a la espera de la Fed", "url": "https://www.latercera.com/pulso/noticia/bolsas-mundiales-caen-y-el-bono-del-tesoro-a-10-anos-toca-su-mayor-nivel-desde-la-crisis-financiera-a-la-espera-de-la-fed/", "fonte_id": "la_tercera", "data_pub": "2026-09-15T20:45:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As bolsas globais caíram e o título do Tesouro americano a 10 anos atingiu seu nível mais alto desde a crise financeira. No Chile, o IPSA fechou com uma leve queda de 0,17% após uma recuperação no último minuto, enquanto o dólar registrou sua primeira baixa após quatro aumentos consecutivos.", "titulo_pt": "Bolsas globais caem e título do tesouro a 10 anos atinge maior nível desde a crise, com expectativa pela Fed", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 164288, "titulo": "Ibovespa avança 0,54% em clima de cautela antes de Superquarta", "url": "https://veja.abril.com.br/economia/ibovespa-avanca-054-em-clima-de-cautela-antes-de-superquarta/", "fonte_id": "veja", "data_pub": "2026-09-15T20:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibovespa avançou 0,54% em um ambiente de cautela, com os investidores monitorando decisões sobre juros, o preço do petróleo e a votação no STF. Mercados operam de olho nessas variáveis.", "titulo_pt": "Ibovespa avança 0,54% em clima de cautela antes de decisões importantes", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 164463, "titulo": "Minerais críticos: nova lei protege riquezas do Brasil na disputa entre EUA e China", "url": "https://www.cartacapital.com.br/artigo/minerais-criticos-nova-lei-protege-riquezas-do-brasil-na-disputa-entre-eua-e-china/", "fonte_id": "cartacapital", "data_pub": "2026-09-15T20:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A nova lei aprovada no Senado visa proteger os minerais críticos do Brasil, combatendo o neocolonialismo e incentivando o processamento local para promover a industrialização nacional.", "titulo_pt": "Minerais críticos: nova lei protege riquezas brasileiras na disputa entre EUA e China", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 164691, "titulo": "Senate cloture vote on Clarity Act fails, dealing regulatory blow to crypto industry", "url": "https://www.cnbc.com/2026/09/15/senate-cloture-vote-on-clarity-act-fails-dealing-regulatory-setback-to-crypto-industry.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-15T20:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Senado votou contra o Clarity Act, prejudicando as tentativas da indústria de criptomoedas de obter um quadro de mercado abrangente.", "titulo_pt": "Votação no senado impede avanço do Clarity Act, dando golpe na indústria de criptomoedas", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 164275, "titulo": "Bets reduzem consumo e atividade econômica, diz pesquisa da USP", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/bets-reduzem-consumo-e-atividade-economica-diz-pesquisa-da-usp", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-15T18:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Faculdade de Economia, Administração, Contabilidade e Atuária da Universidade de São Paulo (FEA/USP) indicou que as apostas, conhecidas como bets, diminuíram o consumo e o PIB em R$ 120 bilhões a R$ 141 bilhões em 2025, equivalente a 0,9% a 1,1% do PIB.", "titulo_pt": "Estudo da USP aponta que apostas reduziram consumo e atividade econômica em r$ 120 bilhões a r$ 141 bilhões em 2025", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 164244, "titulo": "Vorcaro disse que governadora do DF 'não ficou de fora' de negociação do BRB para compra do Master", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/09/vorcaro-disse-que-governadora-do-df-participou-de-negociacao-do-brb-para-compra-do-master.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T18:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-banqueiro Daniel Vorcaro afirmou que a governadora do Distrito Federal, Celina Leão (PP), participou da negociação do BRB para tentar comprar o Banco Master em 2025, conforme revelaram mensagens obtidas pela Folha.", "titulo_pt": "Vorcaro afirma que governadora do DF participou da negociação do BRB para compra do Master", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 163944, "titulo": "TSMC careful about use of AI in sensitive research", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/16/2003864323", "fonte_id": "taipei_times", "data_pub": "2026-09-16T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A TSMC está cautelosa no uso de inteligência artificial em pesquisas sensíveis.", "titulo_pt": "TSMC cautelosa no uso de AI em pesquisas sensíveis", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 164755, "titulo": "The AI data center boom is colliding with cities scarred by big industry", "url": "https://techcrunch.com/2026/09/15/the-ai-data-center-boom-is-colliding-with-cities-scarred-by-big-industry/", "fonte_id": "techcrunch", "data_pub": "2026-09-15T21:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há um aumento na construção de centrais de dados de IA, o que está levantando protestos em Philadelphia, onde os moradores sugeriram que a construção poderia ocorrer em um bairro já afetado por uma antiga refinaria de petróleo.", "titulo_pt": "A expansão dos centros de dados de IA está colidindo com cidades impactadas pela indústria", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 164233, "titulo": "Ganhadora do Nobel da Paz pede leis para limitar avanço da inteligência artificial", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/ganhadora-do-nobel-da-paz-pede-leis-para-limitar-avanco-da-inteligencia-artificial.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Maria Ressa, ganhadora do Prêmio Nobel da Paz, alertou para o perigo da inteligência artificial e afirmou que leis devem ser aprovadas para limitar seu avanço para preservar a autonomia humana.", "titulo_pt": "Ganhadora do Nobel da Paz cobra leis para limitar avanço da inteligência artificial", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 164728, "titulo": "Landmark US crypto bill fails as Senate splits over Trump ethics concerns", "url": "https://www.ft.com/content/8d0c90f0-b6f6-4b89-8839-d6c8c5c03c54?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-15T21:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei sobre criptomoedas nos Estados Unidos falhou, causando um grande revés para uma indústria que gastou grandes somas para influenciar a estrutura do mercado a seu favor. Os senadores se dividiram sobre preocupações éticas relacionadas a Trump.", "titulo_pt": "Pelo menos um projeto-chave de criptomoedas nos EUA é rejeitado, com senadores divididos sobre questões éticas de Trump", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 164598, "titulo": "Pocock says Labor easing copyright protections for AI datacentre investment would throw creatives ‘under the bus’", "url": "https://www.theguardian.com/australia-news/2026/sep/16/pocock-says-labor-easing-copyright-protections-for-ai-datacentre-investment-would-throw-creatives-under-the-bus", "fonte_id": "guardian_world", "data_pub": "2026-09-15T21:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Albanese está considerando conceder acesso automático ao trabalho de criativos a empresas de IA, enquanto busca um compromisso com gigantes tecnológicos americanos. Essa proposta foi revelada durante reuniões entre altos executivos da OpenAI e ministros do governo Labor.", "titulo_pt": "Pocock afirma que propostas de relaxar proteções de direitos autorais para investimentos em centrais de dados de IA prejudicariam criativos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 164237, "titulo": "OpenAI, Anthropic e Google DeepMind articulam órgão para supervisionar riscos da IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/openai-anthropic-e-google-deepmind-articulam-orgao-para-supervisionar-riscos-da-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "OpenAI, Anthropic e Google DeepMind estão trabalhando na criação de um órgão de supervisão para monitorar os riscos associados à inteligência artificial. Essa iniciativa ocorre em meio a crescentes pedidos por maior controle sobre a tecnologia.", "titulo_pt": "Openai, Anthropic e Google DeepMind articulam órgão para supervisionar riscos da IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 164726, "titulo": "Jensen Huang says battle over AI innovation and safety is ‘false choice’", "url": "https://www.ft.com/content/2e20c674-3386-46ad-b07f-5cd8a013f67e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-15T20:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang, CEO da Nvidia, afirma que a luta entre inovação e segurança na inteligência artificial é uma escolha falsa. Ele se distanciou das iniciativas de OpenAI, Anthropic e SpaceX para retardar a pesquisa nessa área.", "titulo_pt": "Jensen Huang diz que disputa entre inovação e segurança na IA é ‘escolha falsa’", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 164567, "titulo": "Money Talks | Regulación de la IA: ¿Salvar la humanidad o el negocio?", "url": "https://www.latercera.com/videos/noticia/money-talks-regulacion-de-la-ia-salvar-la-humanidad-o-el-negocio/", "fonte_id": "la_tercera", "data_pub": "2026-09-15T20:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Fernando Gómez, sócio-fundador da DVA Capital, discute a polêmica em torno dos perigos da inteligência artificial e afirma que a regulamentação solicitada pelas empresas beneficia mais as empresas do que a humanidade.", "titulo_pt": "Money Talks | regulação da IA: salvar a humanidade ou o negócio?", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 164330, "titulo": "“Podemos ter IAs soltas por aí fazendo coisas absurdas”, diz especialista", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/podemos-ter-ias-soltas-por-ai-fazendo-coisas-absurdas-diz-especialista/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T20:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O especialista Dario Amodei, CEO da Anthropic, defendeu a desaceleração no desenvolvimento da tecnologia. Ele alertou que inteligências artificiais soltas podem realizar ações absurdas.", "titulo_pt": "Podemos ter IAs soltas por aí fazendo coisas absurdas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 164756, "titulo": "Meta now lets AI agents handle the boring parts of WhatsApp Business setup", "url": "https://techcrunch.com/2026/09/15/meta-now-lets-ai-agents-handle-the-boring-parts-of-whatsapp-business-setup/", "fonte_id": "techcrunch", "data_pub": "2026-09-15T20:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A nova servidor WhatsApp Business MCP permite que desenvolvedores utilizem agências de codificação de IA, como Claude, Cursor, Codex e ChatGPT, para gerenciar a configuração, modelos de mensagens, testes e resolução de problemas.", "titulo_pt": "Meta agora permite que agências de IA gerenciem as partes maçantes da configuração do WhatsApp Business", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 164629, "titulo": "The people who fear AI are wasting time fighting each other", "url": "https://www.vox.com/future-perfect/502856/ai-safety-risk-garrison-lovely-obsolete", "fonte_id": "vox", "data_pub": "2026-09-15T20:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A preocupação com a inteligência artificial (IA) aumentou recentemente. Pesquisadores de IA vêm alertando sobre as capacidades de suas criações há anos, mas eventos recentes tornaram esses alertas mais concretos. Em abril, a Anthropic anunciou que a IA está acelerando o processo de criação de melhores sistemas de IA, levantando temores sobre um possível 'auto-aumento recursivo' das máquinas.", "titulo_pt": "As pessoas que temem a IA estão perdendo tempo se combatendo", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 164688, "titulo": "OpenAI, Google, Anthropic discussing collaboration on AI safety issues", "url": "https://www.cnbc.com/2026/09/15/open-ai-google-anthropic-safety.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-15T19:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há discussões em andamento entre OpenAI, Google e Anthropic sobre a colaboração em questões de segurança de inteligência artificial. Essas conversas começaram após a proposta de Demis Hassabis, da Google, para um 'Corpo de Padrões' liderado pelos EUA em julho.", "titulo_pt": "Openai, Google e Anthropic discutindo colaboração em questões de segurança de IA", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 164741, "titulo": "Sanders and Bannon call for AI limits, as public unease grows", "url": "https://www.scmp.com/news/world/united-states-canada/article/3367642/sanders-and-bannon-call-ai-limits-public-unease-grows?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-15T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O senador Bernie Sanders e Steve Bannon, um aliado próximo do ex-presidente dos EUA Donald Trump, chamaram para limitações no uso de sistemas de inteligência artificial em um evento em Washington. Ambos alertaram sobre as potenciais consequências catastróficas da tecnologia, unindo duas figuras políticas adversárias em torno desses temores.", "titulo_pt": "Sanders e Bannon defendem limitações para IA, unindo duas adversárias em torno dos perigos para humanos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 164757, "titulo": "The AI graveyard: a running list of projects and startups that didn’t make it", "url": "https://techcrunch.com/2026/09/15/the-ai-graveyard-a-running-list-of-projects-and-startups-that-didnt-make-it/", "fonte_id": "techcrunch", "data_pub": "2026-09-15T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este artigo lista projetos de inteligência artificial (IA) que falharam ou não atingiram as expectativas, incluindo o Siri da Apple, que foi adiado várias vezes, e o 'super app' do OpenAI, que teve um lançamento problemático.", "titulo_pt": "O cemitério da IA: uma lista de projetos e startups que não conseguiram avançar", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 164743, "titulo": "18-year-old dies of measles in PA from severe neurological complication", "url": "https://arstechnica.com/health/2026/09/measles-kills-18-year-old-in-pa-fourth-death-as-state-outbreak-nears-700-cases/", "fonte_id": "ars_technica", "data_pub": "2026-09-15T18:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um adolescente de 18 anos morreu devido a complicações neurológicas severas da morbillo, também conhecida como sarampo. O jovem desenvolveu encefalomielite disseminada aguda, uma complicação conhecida da doença.", "titulo_pt": "Adolescente de 18 anos morre de complicações neurológicas graves do sarampo", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 164744, "titulo": "SpaceX declares Starship ready for orbit, sets launch date next week", "url": "https://arstechnica.com/space/2026/09/spacex-sets-launch-date-for-first-starship-orbital-flight/", "fonte_id": "ars_technica", "data_pub": "2026-09-15T18:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX declarou que o Starship está pronto para uma órbita, e a data prevista para o lançamento é na próxima semana. Chegar à órbita seria um marco significativo.", "titulo_pt": "Spacex anuncia que Starship está pronto para órbita e define data para lançamento na próxima semana", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 164774, "titulo": "History is being rewritten at an archaeological site in Morocco. What the discovery of an ancient wall tells us", "url": "https://phys.org/news/2026-09-history-rewritten-archaeological-site-morocco.html", "fonte_id": "phys_org", "data_pub": "2026-09-15T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma região montanhosa no norte-oeste do Marrocos, pesquisas no local conhecido como Oued Beht estão revelando um período desconhecido da história regional. A descoberta de uma estrutura construída significativa indica que, durante o segundo milênio a.C., as comunidades na África ocidental estavam moldando seu ambiente e estabelecendo relações mais amplas com outras regiões do mundo Mediterrâneo.", "titulo_pt": "História está sendo reescrita em um sítio arqueológico no marrocos. O que a descoberta de uma antiga parede nos revela", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 164775, "titulo": "Tracking the path of new world screwworm", "url": "https://phys.org/news/2026-09-tracking-path-world-screwworm.html", "fonte_id": "phys_org", "data_pub": "2026-09-15T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novos casos de larvas de verme-tesoura da nova mundo foram registrados nos Estados Unidos, destacando a necessidade de monitorar seu caminho para prever futuras infestações. Pesquisadores do USDA estão utilizando modelos preditivos para uma abordagem proativa na gestão desse verme.", "titulo_pt": "Rastreando o caminho do novo verme-tesoura da nova mundo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 164776, "titulo": "Plans to artificially dim the sun have divided scientists—here's what they're actually arguing about", "url": "https://phys.org/news/2026-09-artificially-dim-sun-scientists-theyre.html", "fonte_id": "phys_org", "data_pub": "2026-09-15T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os planos para diminuir artificialmente a luminosidade do sol têm dividido a comunidade científica. O artigo refuta três teorias conspiratórias relacionadas a fenômenos meteorológicos e práticas governamentais.", "titulo_pt": "Planos para diminuir artificialmente a luminosidade do sol dividem cientistas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 164823, "titulo": "22 years of science! NASA's Roman Space Telescope doubles its lifetime with super-precise engine burn", "url": "https://www.space.com/astronomy/22-years-of-science-nasas-roman-space-telescope-doubles-its-lifetime-with-super-precise-engine-burn", "fonte_id": "space_com", "data_pub": "2026-09-15T21:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O telescópio espacial Nancy Grace Roman, inicialmente planejado para uma missão principal de cinco anos seguida por uma extensão de cinco anos, agora será operado por mais de duas décadas. A nave realizou uma queima de motor super-precisa que estendeu sua vida útil.", "titulo_pt": "22 Anos de ciência! Nave espacial Roman da nasa estende sua vida útil em mais de 10 anos", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 164777, "titulo": "What are best options for controlling GSL dust, and what would they cost?", "url": "https://phys.org/news/2026-09-options-gsl.html", "fonte_id": "phys_org", "data_pub": "2026-09-15T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório colaborativo da Universidade do Utah, coordenado pelo Wilkes Center for Climate Science & Policy, analisa os riscos crescentes da poeira proveniente do leito exposto do Grande Salgado de Utah e discute os custos e benefícios a longo prazo de estabilizar os níveis do lago.", "titulo_pt": "Quais são as melhores opções para controlar a poeira do grande salgado de utah, e qual seria o custo?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 164778, "titulo": "Webb reveals dynamic panorama of star formation, including smallest known brown dwarfs", "url": "https://phys.org/news/2026-09-webb-reveals-dynamic-panorama-star.html", "fonte_id": "phys_org", "data_pub": "2026-09-15T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem fornecida pelo Telescópio Espacial James Webb da região de formação estelar IC 348 é uma das mais amplas releases até agora. Os astrônomos usaram o Webb para buscar brown dwarfs, objetos menos massivos que as estrelas mais pequenas, descobrindo brown dwarfs com apenas duas vezes a massa de Júpiter.", "titulo_pt": "Webb revela panorama dinâmico de formação estelar, incluindo brown dwarfs mais pequenos conhecidos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 164779, "titulo": "Disordered atoms steer shared light pulses by matching motion and timing", "url": "https://phys.org/news/2026-09-disordered-atoms-pulses-motion.html", "fonte_id": "phys_org", "data_pub": "2026-09-15T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo de pesquisa da Instituto de Física Aplicada da TU Darmstadt demonstrou pela primeira vez que átomos desordenados e em constante movimento podem emitir luz coletivamente em uma direção preferencial, mesmo sem direção intrínseca, e que essa assimetria pode ser ajustada especificamente.", "titulo_pt": "Átomos desordenados orientam jatos de luz por meio da sincronização de movimento e tempo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 164780, "titulo": "Skipping showers is the latest trend. But is there any science to 'pheromone' maxxing?", "url": "https://phys.org/news/2026-09-showers-latest-trend-science-pheromone.html", "fonte_id": "phys_org", "data_pub": "2026-09-15T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nos ambientes online onde jovens homens compartilham dicas de autoaperfeiçoamento, a última tendência é focar no cheiro. A dica é reduzir o uso de desodorante e diminuir a frequência das duchas.", "titulo_pt": "Pular banhos é a nova tendência. Mas há ciência por trás do 'maximização' de feromônios?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 164781, "titulo": "Why most rivers don't respond to storms the same way twice", "url": "https://phys.org/news/2026-09-rivers-dont-storms.html", "fonte_id": "phys_org", "data_pub": "2026-09-15T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa publicada em Nature Water mostrou que a mesma quantidade de chuva caindo na mesma paisagem em diferentes momentos pode resultar em diferentes volumes de água nas rios. O estudo fornece uma visão global de como as áreas de drenagem respondem à precipitação, independentemente de onde os rios estão localizados ou quantas águas eles transportam.", "titulo_pt": "Por que a maioria dos rios não responde às tempestades da mesma forma duas vezes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 164782, "titulo": "How a pathogen turns flowers into leaves", "url": "https://phys.org/news/2026-09-pathogen.html", "fonte_id": "phys_org", "data_pub": "2026-09-15T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram como uma proteína bacteriana interfere no mecanismo que controla o desenvolvimento das flores nas plantas, transformando órgãos reprodutivos em estruturas semelhantes às folhas. Esses achados iluminam uma doença vegetal que pode se espalhar devido ao aquecimento global, expandindo o alcance de seus vetores de insetos para regiões mais setentrionais.", "titulo_pt": "Como um patógeno transforma flores em folhas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 164783, "titulo": "Smart nanoparticles deliver antibiotics directly to H. pylori", "url": "https://phys.org/news/2026-09-smart-nanoparticles-antibiotics-pylori.html", "fonte_id": "phys_org", "data_pub": "2026-09-15T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nanopartículas inteligentes são usadas para entregar antibióticos diretamente aos bactérias Helicobacter pylori, evitando que eles se escondam sob a camada protetora do muco do estômago e dentro do tecido das úlceras. Isso pode permitir doses menores de antibióticos, reduzindo o risco de efeitos colaterais e resistência antimicrobiana.", "titulo_pt": "Nanopartículas inteligentes entregam antibióticos diretamente para helicobacter pylori", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 164784, "titulo": "Adaptive crystal can selectively capture CO₂ and recognize similar molecules", "url": "https://phys.org/news/2026-09-crystal-capture-similar-molecules.html", "fonte_id": "phys_org", "data_pub": "2026-09-15T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cristais adaptativos podem se ajustar para reconhecer moléculas específicas, facilitando a separação química, que pode ser intensiva em energia quando as moléculas têm tamanhos e propriedades semelhantes.", "titulo_pt": "Cristal adaptativo pode selecionarivamente capturar CO₂ e reconhecer moléculas semelhantes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 164785, "titulo": "Magnets could help quantum computers talk to each other, says researcher", "url": "https://phys.org/news/2026-09-magnets-quantum.html", "fonte_id": "phys_org", "data_pub": "2026-09-15T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Xufeng Zhang, um professor da Northeastern University, está utilizando magnets para tornar computadores mais eficientes em termos de energia no nível quântico. Recentemente, ele publicou dois artigos sobre sistemas magnéticos de pequena escala que sua equipe desenvolveu e que podem ajudar a aumentar a eficiência energética dos computadores no futuro.", "titulo_pt": "Magnetos poderiam ajudar computadores quânticos a se comunicarem, diz pesquisador", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 164796, "titulo": "NASA Invites Media to International Observe the Moon Night", "url": "https://www.nasa.gov/news-release/nasa-invites-media-to-international-observe-the-moon-night/", "fonte_id": "nasa_news", "data_pub": "2026-09-15T18:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA convidará a mídia para comemorar a International Observe the Moon Night no U.S. Space & Rocket Center em Huntsville, Alabama, nos Estados Unidos, no sábado, 19 de setembro, das 15h30 às 20h. O evento celebra a Lua, a ciência por trás dela e sua conexão.", "titulo_pt": "NASA convida mídia para International Observe the Moon Night", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 164771, "titulo": "A fourth measles death is reported in Pennsylvania", "url": "https://www.statnews.com/2026/09/15/fourth-measles-death-pennsylvania-acute-disseminated-encephalomyelitis/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-15T18:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades de Pennsylvania relataram o quarto caso de morte associada à morbidade de sarampo em um mês, envolvendo um indivíduo de 18 anos que não foi vacinado.", "titulo_pt": "Quarto óbito associado ao sarampo é relatado em Pennsylvania", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 164274, "titulo": "Canibalismo celestial poderia explicar Vênus não ter lua, mostra estudo", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/canibalismo-celestial-poderia-explicar-venus-nao-ter-lua-mostra-estudo.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-15T18:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um astrofísico da Califórnia propôs uma nova teoria que sugere que o Vênus poderia ter perdido sua lua devido a um processo de canibalismo celestial, onde o planeta teria 'comido' ou absorvido a lua ao longo do tempo.", "titulo_pt": "Canibalismo celeste pode explicar por que Vênus não tem lua, sugere estudo", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 164800, "titulo": "Staff at Three Major Museums Vote to Strike", "url": "https://hyperallergic.com/staff-at-three-major-museums-vote-to-strike/", "fonte_id": "hyperallergic", "data_pub": "2026-09-15T21:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Funcionários do Whitney Museum, Brooklyn Museum e American Folk Art Museum votaram a favor de uma greve. Além disso, foi mencionada uma entrevista com Alfredo Jaar e um novo programa de empréstimo de materiais artísticos no Brooklyn Public Library.", "titulo_pt": "Funcionários de três grandes museus votam a favor de uma greve", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 164215, "titulo": "Globo confirma 20 nomes do elenco e divulga sinopse de 'Avenida Brasil 2'", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/televisao/2026/09/globo-confirma-20-nomes-do-elenco-e-divulga-sinopse-de-avenida-brasil-2.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-15T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Globo divulgou a sinopse e o elenco da novela 'Avenida Brasil 2', que estreará em janeiro de 2027 e se passará 14 anos após a novela original. O anúncio foi feito nesta terça-feira, 15 de setembro de 2026.", "titulo_pt": "Globo confirma 20 nomes
