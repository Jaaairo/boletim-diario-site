o de 14 anos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 281745, "titulo": "Violencia contra las mujeres: solo el 7% de las sobrevivientes denuncia ante la policía y la justicia sigue fallando", "url": "https://www.clarin.com/sociedad/violencia-mujeres-solo-7-sobrevivientes-denuncia-policia-justicia-sigue-fallando_0_4r9WC2uwty.html", "fonte_id": "clarin", "data_pub": "2026-11-23T17:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um relatório da ONU Mujeres indica que apenas 7% das sobreviventes de violência contra mulheres denunciam à polícia. Em Argentina, metade das mulheres adultas sofreu violência em relacionamentos de parceiros. Os dados sobre femicídios mostram que a maioria das vítimas não havia feito denúncias anteriores.", "titulo_pt": "Violência contra mulheres: apenas 7% das sobreviventes denunciam e a justiça continua falhando", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 281577, "titulo": "Quase metade (45,8%) dos domicílios de SP possuem cães e gatos, diz estudo", "url": "https://www.metropoles.com/sao-paulo/quase-metade-458-dos-domicilios-de-sp-possuem-caes-e-gatos-diz-estudo", "fonte_id": "metropoles", "data_pub": "2026-11-23T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo revela que quase metade (45,8%) dos domicílios em São Paulo possuem cães ou gatos. A capital paulista tem aproximadamente 13 gatos para cada 100 humanos, enquanto há cerca de 19 cães para cada 100 habitantes.", "titulo_pt": "Quase metade dos domicílios de SP possuem cães e gatos, diz estudo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 281586, "titulo": "Posto é condenado em MG após chefe citar \"masturbação mental\" a funcionária", "url": "https://www.metropoles.com/minas-gerais/posto-e-condenado-em-mg-apos-chefe-citar-masturbacao-mental-a-funcionaria", "fonte_id": "metropoles", "data_pub": "2026-11-23T17:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um posto de combustíveis foi condenado a pagar R$ 10 mil de indenização a uma funcionária após o chefe ter citado 'masturbação mental' durante uma discussão. A empresa tentou reduzir o valor, mas foi mantido em R$ 10 mil.", "titulo_pt": "Posto é condenado em MG após chefe citar 'masturbação mental' a funcionária", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 281808, "titulo": "Las brechas entre mujeres y hombres no se cierran solas", "url": "https://www.latercera.com/opinion/noticia/las-brechas-entre-mujeres-y-hombres-no-se-cierran-solas/", "fonte_id": "la_tercera", "data_pub": "2026-11-23T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A diferença de gênero entre homens e mulheres não se fecha sozinha. Este artigo discute a persistência das disparidades entre os sexos.", "titulo_pt": "As brechas entre homens e mulheres não se fecham sozinhas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 281663, "titulo": "Motorista é preso após acidente que deixou criança em estado grave no PR", "url": "https://www.cnnbrasil.com.br/nacional/sul/pr/motorista-e-preso-apos-acidente-que-deixou-crianca-em-estado-grave-no-pr/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-23T16:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um motorista foi preso após um acidente na BR-116 em Fazenda Rio Grande, Paraná, onde sua caminhonete atingiu a traseira de outro carro. O teste do bafômetro indicou que o motorista havia ingerido álcool, com concentração de 0,48 mg de álcool por litro de ar.", "titulo_pt": "Motorista é preso após acidente que deixou criança em estado grave no PR", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 281840, "titulo": "Fundação de Bezos aporta US$ 25 milhões em fundo indígena do Brasil", "url": "https://www.jota.info/tributos-e-empresas/mercado/fundacao-de-bezos-aporta-us-25-milhoes-em-fundo-indigena-do-brasil", "fonte_id": "jota", "data_pub": "2026-11-23T14:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Fundo Bezos, gerido pelo Funbio, atingiu 65% de sua meta de US$ 100 milhões e ainda precisa de US$ 15 milhões para poder começar a investir. O mecanismo Vítuke, administrado pelo Funbio, está próximo de alcançar a quantia necessária para iniciar suas operações.", "titulo_pt": "Fundo Bezos aporta US$ 25 milhões em fundo indígena do Brasil", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 281841, "titulo": "Falta de medicamento no SUS impõe desafios à qualidade de vida de crianças com PFIC, doença ultrarrara do fígado", "url": "https://www.jota.info/coberturas-especiais/falta-de-medicamento-no-sus-impoe-desafios-a-qualidade-de-vida-de-criancas-com-pfic-doenca-ultrarrara-do-figado", "fonte_id": "jota", "data_pub": "2026-11-23T14:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A falta de medicamento no Sistema Único de Saúde (SUS) impõe desafios à qualidade de vida de crianças com a doença rara colestase intra-hepática familiar progressiva (PFIC), que pode levar à necessidade de transplante ainda na infância.", "titulo_pt": "Falta de medicamento no SUS impõe desafios à qualidade de vida de crianças com PFIC, doença ultrarrara do fígado", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 281881, "titulo": "Domestic violence perpetrators are misusing smart car features to abuse, researchers warn", "url": "https://www.theguardian.com/society/2026/nov/23/smart-car-tracking-control-features-domestic-violence-warning-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-11-23T13:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores alertam que perseguidores de violência doméstica estão abusando das funcionalidades de rastreamento e monitoramento e do acesso digital ao carro para facilitar o abuso. Em 2022, um caso nos Estados Unidos mostrou que uma ex-esposa descobriu que seu ex-marido estava usando uma aplicação associada ao carro dela para rastrear sua localização, e a fabricante de carros supostamente recusou-se a encerrar o acesso digital da ex-esposa ao veículo.", "titulo_pt": "Perpetradores de violência doméstica estão abusando de funcionalidades de carros conectados para abusar, alertam pesquisadores", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 282115, "titulo": "Brazil: Colourful costumes and dancing take over Copacabana Pride", "url": "https://www.euronews.com/video/2026/11/23/brazil-colourful-costumes-and-dancing-take-over-copacabana-pride", "fonte_id": "euronews", "data_pub": "2026-11-23T08:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 22 de novembro de 2026, milhares de pessoas participaram da 31ª Parada do Orgulho de Copacabana no Rio de Janeiro, celebrando a diversidade LGBT+ e exigindo maior igualdade.", "titulo_pt": "Brasil: coloridos e dançantes tomam conta da parada do orgulho de Copacabana", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 282286, "titulo": "Taiwan to continue fossil fuel phase-out: minister", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/24/2003868289", "fonte_id": "taipei_times", "data_pub": "2026-11-24T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro taiwanês anunciou que o país continuará com o processo de redução do uso de combustíveis fósseis. A transição energética será mantida, conforme planejado.", "titulo_pt": "Taiwan continuará a descontinuar o uso de combustíveis fósseis, afirma ministro", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 281648, "titulo": "Temporais provocam perdas de até 95% nas lavouras de soja em Tupanciretã", "url": "https://www.cnnbrasil.com.br/agro/temporais-provocam-perdas-de-ate-95-nas-lavouras-de-soja-em-tupancireta/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-23T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Levantamento preliminar indica que cerca de 440 famílias foram atingidas e 35 mil hectares sofreram impactos após chuvas, granizo e vendaval no Rio Grande do Sul. As perdas nas lavouras de soja podem chegar a 95%.", "titulo_pt": "Temporais causam perdas de até 95% nas lavouras de soja em Tupanciretã", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 281752, "titulo": "El volcán Kilauea de Hawái entra en erupción con fuentes de lava de 200 metros de altura", "url": "https://www.clarin.com/estados-unidos/el-volcan-kilauea-de-hawai-entra-en-erupcion-con-fuentes-de-lava-de-200-metros-de-altura_0_d0xkMkFswT.html", "fonte_id": "clarin", "data_pub": "2026-11-23T17:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O vulcão Kilauea, na Ilha Grande de Hawái, entrou em erupção, lançando lava a 200 metros de altura e humo a 5.000 metros acima do nível do mar. A atividade está concentrada no cráter Halema'uma'u, no Parque Nacional de Volcanes, atraindo turistas e cientistas.", "titulo_pt": "Kilauea, no havaí, entra em erupção com fontes de lava de 200 metros", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 281879, "titulo": "Cop31 collapses: why did climate talks fall apart? - The Latest", "url": "https://www.theguardian.com/news/audio/2026/nov/23/cop31-collapses-why-did-climate-talks-fall-apart-the-latest", "fonte_id": "guardian_world", "data_pub": "2026-11-23T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A COP31, uma conferência climática, não chegou a um acordo-chave após 17 anos. As negociações, co-presididas por Turquia e Austrália, falharam devido a um impasse sobre combustíveis fósseis e apoio a países afetados pela crise climática.", "titulo_pt": "Cop31 se desintegra: por que as negociações climáticas falharam?", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 282162, "titulo": "Why did COP31 climate talks collapse without a deal?", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/23/why-did-cop31-climate-talks-collapse-without-a-deal?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-23T16:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O COP31, o mais longo encontro das Nações Unidas sobre clima na história, terminou sem um acordo final em Turquia, marcando o primeiro fracasso de 17 anos em alcançar um acordo.", "titulo_pt": "Por que as negociações climáticas COP31 colapsaram sem um acordo?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 282519, "titulo": "COP31: Key outcomes agreed at the UN climate talks in Antalya", "url": "https://www.carbonbrief.org/cop31-key-outcomes-agreed-at-the-un-climate-talks-in-antalya", "fonte_id": "carbon_brief", "data_pub": "2026-11-23T16:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As discussões climáticas da COP31 em Antalya, Turquia, não chegaram a um acordo sobre um 'pacto' que carecia de referências claras a…", "titulo_pt": "COP31: principais resultados das negociações climáticas da ONU em Antalya", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 282106, "titulo": "At least 24 people killed in Indonesia factory fire, police say", "url": "https://www.euronews.com/2026/11/23/at-least-24-people-killed-in-indonesia-factory-fire-police-say", "fonte_id": "euronews", "data_pub": "2026-11-23T14:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 24 pessoas morreram em um incêndio em uma fábrica de doces em Banten, Indonésia. Dezenas de funcionários ainda estão desaparecidos.", "titulo_pt": "Pelo menos 24 mortos em incêndio em fábrica de doces na indonésia, diz polícia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 281880, "titulo": "Plant-based lunches could cut Australia’s emissions by 15m tonnes, new research shows", "url": "https://www.theguardian.com/environment/2026/nov/23/plant-based-lunches-could-cut-australia-emissions-by-15m-tonnes-new-research-shows", "fonte_id": "guardian_world", "data_pub": "2026-11-23T13:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo realizado pela Bryant Research e pelo ProVeg indica que um mudanço nas refeições do meio-dia para opções vegetarianas no país poderia reduzir as emissões de gases de efeito estufa em 15,4 milhões de toneladas por ano, equivalente às emissões de todos os voos domésticos aterrados. Além disso, isso poderia economizar cerca de R$ 611 por família anualmente.", "titulo_pt": "Almoços vegetarianos poderiam reduzir emissões de 15 milhões de toneladas em Australia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 282139, "titulo": "‘Worst COP ever’: Climate talks collapse after draft deal fails to include fossil fuels", "url": "https://www.cnbc.com/2026/11/23/cop31-climate-summit-fossil-fuels.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-23T13:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Governos e ativistas rejeitaram o 'acordo de cobertura' proposto no COP31, a cúpula das Nações Unidas sobre o clima, que não incluía combustíveis fósseis. Os participantes consideraram que o encontro foi o 'pior COP de todos os tempos' devido à falha na inclusão de combustíveis fósfolos no acordo.", "titulo_pt": "Pior COP de todos os tempos: negociações climáticas colapsam após rejeição do acordo proposto", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 282093, "titulo": "'The faillure of COP31 will have a very positive signal: It means that the world is taking the risks seriously'", "url": "https://www.lemonde.fr/en/environment/article/2026/11/23/the-faillure-of-cop31-will-have-a-very-positive-signal-it-means-that-the-world-is-taking-the-risks-seriously_6787322_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-23T11:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O último summit das Nações Unidas sobre clima terminou sem um acordo final, e o mundo está prestes a ultrapassar o limite de aquecimento global de 1,5°C. O cientista sueco Johan Rockström destaca que a prioridade máxima é reduzir as emissões globais em 6% anualmente.", "titulo_pt": "O fracasso de COP31 enviará um sinal muito positivo: significa que o mundo está levando a sério os riscos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 282243, "titulo": "Cost burden keeps Fukushima’s hydrogen dream from taking off", "url": "https://www.japantimes.co.jp/news/2026/11/23/japan/society/fukushima-hydrogen-station-struggle/", "fonte_id": "japan_times", "data_pub": "2026-11-23T07:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma empresa privada enfrenta dificuldades para manter sua estação de hidrogênio em funcionamento, ilustrando os desafios para a adoção de hidrogênio como fonte de energia alternativa no futuro.", "titulo_pt": "Custo elevado mantém sonho de hidrogênio de Fukushima em cheque", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 282246, "titulo": "Thailand plans to ban exports of chemicals as it tackles pollution", "url": "https://www.japantimes.co.jp/news/2026/11/23/asia-pacific/thailand-ban-exports-chemicals-pollution/", "fonte_id": "japan_times", "data_pub": "2026-11-23T07:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Tailândia planeja proibir exportações de químicos enquanto enfrenta poluição. O país vai trabalhar com a China e Myanmar para combater os níveis elevados de arsênio em seus rios do norte.", "titulo_pt": "Tailândia planeja banir exportações de químicos para combater poluição", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 282328, "titulo": "Climate Change Redraws Montenegro’s Winemaking Map", "url": "https://balkaninsight.com/2026/11/23/climate-change-redraws-montenegros-winemaking-map/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-23T06:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os vinhedos montenegrinos estão se adaptando às mudanças climáticas, plantando variedades mais resistentes em terrenos mais elevados.", "titulo_pt": "Mudanças climáticas redefinem o mapa do vinho em Montenegro", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 281942, "titulo": "Despite COP31’s Disappointments, There Are Reasons to Be Optimistic About Climate Progress", "url": "https://thediplomat.com/2026/11/despite-cop31s-disappointments-there-are-reasons-to-be-optimistic-about-climate-progress/", "fonte_id": "the_diplomat", "data_pub": "2026-11-23T06:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Países estão estabelecendo metas ambiciosas para a descarbonização fora do processo oficial das Nações Unidas.", "titulo_pt": "Embora COP31 tenha decepcionado, há razões para ser otimista sobre o progresso climático", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 281750, "titulo": "El régimen iraní ejecutó la condena de 74 latigazos a la cantante que no usó el velo durante un concierto online", "url": "https://www.clarin.com/mundo/regimen-irani-ejecuto-condena-74-latigazos-cantante-uso-velo-concierto-online_0_BPRoBlliUB.html", "fonte_id": "clarin", "data_pub": "2026-11-23T17:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Parastoo Ahmadi, uma cantora iraniana, recebeu uma condenação de 74 chicotadas por não usar o véu durante um concerto online. Ela também foi proibida de sair do país e de exercer atividades artísticas. Quatro outros músicos receberam castigos semelhantes.", "titulo_pt": "Regime iraniano aplicou sentença de 74 chicotadas à cantora que não usou véu em show online", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 281887, "titulo": "Leaked data shows more than 1,000 Russian military suicides during Ukraine war", "url": "https://www.theguardian.com/world/2026/nov/23/leaked-data-shows-more-than-1000-russian-military-suicides-during-ukraine-war", "fonte_id": "guardian_world", "data_pub": "2026-11-23T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dados vazados de mais de 11 milhões de certidões de morte mostram que mais de 1.000 militares russos se suicidaram durante a guerra na Ucrânia. Um soldado chamado Alexei Bolgov, de 29 anos, se suicidou cinco semanas após dizer a sua esposa que a situação era horrível.", "titulo_pt": "Dados vazados mostram mais de 1.000 suicídios de militares russos durante a guerra na Ucrânia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 281888, "titulo": "Russia’s war dead: the hidden toll of the Ukraine conflict", "url": "https://www.theguardian.com/world/2026/nov/23/russia-war-dead-hidden-toll-ukraine-conflict", "fonte_id": "guardian_world", "data_pub": "2026-11-23T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório exclusivo fornece a visão mais detalhada até agora sobre as perdas russas no conflito ucraniano, que chegam a quase 500.000 soldados desde 2022. Mais de 1.000 militares russos se suicidaram durante a guerra na Ucrânia. Alexander Korepanov, um soldado de 52 anos, foi morto em Uspenovka, perto da cidade ucraniana de Pokrovsk, em 11 de maio de 2025, após 20 meses de conflito, junto com mais de 5.000 outros.", "titulo_pt": "Perdas russas na Ucrânia: análise detalhada mostra quase 500.000 mortos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 282306, "titulo": "University of Hong Kong puts on hold China human rights course as law dean steps down", "url": "https://www.scmp.com/news/hong-kong/society/article/3375510/university-hong-kong-suspends-china-human-rights-course-law-dean-steps-down", "fonte_id": "scmp", "data_pub": "2026-11-23T13:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Universidade de Hong Kong (HKU) vai adiar um curso sobre direitos humanos na China para alunos de mestrado e de direito em 2026-2027, após o coordenador Fu Hualing anunciar a sua saída como decano da escola de direito. Fu decidiu cancelar o curso para o semestre, mas planeja retomá-lo posteriormente.", "titulo_pt": "Universidade de Hong Kong adia curso de direitos humanos na China após decano se retirar", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 282307, "titulo": "Second Hong Kong man arrested for animal cruelty in the hanging of a stray dog", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3375509/second-hong-kong-man-arrested-animal-cruelty-hanging-stray-dog", "fonte_id": "scmp", "data_pub": "2026-11-23T13:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia de Hong Kong prendeu um segundo homem, de 67 anos, por suposto maus-tratos a animais após um cachorro de rua ser encontrado pendurado em uma árvore em Tai Po. O homem foi detido um dia após a prisão de outro suspeito de 54 anos por suposto crime semelhante.", "titulo_pt": "Segundo homem de Hong Kong preso por maus-tratos a animais em caso de cachorro pendurado em árvore", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 282286, "fonte_id": "taipei_times", "titulo": "Taiwan to continue fossil fuel phase-out: minister", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/24/2003868289", "data_pub": "2026-11-24T00:00:00Z", "topico": "meio_ambiente", "idioma": "en", "titulo_pt": "Taiwan continuará a descontinuar o uso de combustíveis fósseis, afirma ministro", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 281570, "fonte_id": "metropoles", "titulo": "TCU vê possível conluio em licitações de R$ 105 milhões do Banco do Brasil", "url": "https://www.metropoles.com/colunas/tacio-lorran/tcu-conluio-banco-do-brasil", "data_pub": "2026-11-23T17:59:00Z", function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

}

  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });

});

    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
