rchives/2026/09/01/2003863469", "fonte_id": "taipei_times", "data_pub": "2026-09-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia planeja investir 3,5 bilhões de dólares no MediaTek. Este investimento visa fortalecer a parceria entre as duas empresas no mercado de semicondutores e tecnologia móvel.", "titulo_pt": "Nvidia investirá 3,5 bilhões de dólares no MediaTek", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 135899, "titulo": "Smart blood tube prep tech easing nurses’ workload", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/01/2003863487", "fonte_id": "taipei_times", "data_pub": "2026-09-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova tecnologia de preparo de tubos de sangue inteligentes está facilitando a carga de trabalho das enfermeiras. Essa inovação visa simplificar os procedimentos de coleta de sangue, reduzindo a demanda de tempo e esforço das profissionais.", "titulo_pt": "Tecnologia inteligente de preparo de tubos de sangue alivia carga de trabalho das enfermeiras", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 135907, "titulo": "Integrated systems to lead AI boom: TSMC executive", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/01/2003863452", "fonte_id": "taipei_times", "data_pub": "2026-09-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um executivo da TSMC afirmou que sistemas integrados serão cruciais para impulsionar o boom da inteligência artificial. A empresa é líder mundial em fabricação de chips.", "titulo_pt": "Sistemas integrados serão chaves para o boom da IA: executivo da TSMC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 135945, "titulo": "This Teen Helped Native American Students Earn Ham Radio Licenses", "url": "https://spectrum.ieee.org/ham-radio-2677797793", "fonte_id": "ieee_spectrum", "data_pub": "2026-08-31T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ruchira Shree, uma estudante de segundo ano de um colégio em New Jersey, dedica seu verão a atividades extracurriculares, incluindo o apoio às atividades da IEEE Princeton Central Jersey Section. Ela se envolveu com a seção graças à influência de sua mãe, Shubha Bommalingaiahnapallya, vice-presidente da seção e engenheira sênior da Intel.", "titulo_pt": "Esta adolescente ajuda estudantes nativos americanos a obter licenças de radiotransmissão Ham", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 135820, "titulo": "Trump says data centre critics ‘want to end up backwards and poor’", "url": "https://www.ft.com/content/744c448c-858e-4398-85dc-a66cecd02abb?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-31T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, incentiva os eleitores a 'deixarem que os dados reinem', enquanto um aumento controverso na construção de centros de dados agita as campanhas para as eleições de meios de mandatos. Os críticos dos centros de dados são descritos por Trump como aqueles que 'querem acabar no passado e em situação precária'.", "titulo_pt": "Trump incentiva eleitores a 'deixarem que os dados reinem'", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 135423, "titulo": "IA melhora o processo de aprendizagem ou apenas entrega respostas prontas?", "url": "https://www.cnnbrasil.com.br/educacao/ia-melhora-o-processo-de-aprendizagem-ou-apenas-entrega-respostas-prontas/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-31T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma revisão de 28 estudos envolvendo 4.597 alunos mostrou que tutores de inteligência artificial podem melhorar o processo de aprendizado, mas os resultados dependem da maneira como a tecnologia é utilizada.", "titulo_pt": "IA melhora o processo de aprendizagem ou apenas entrega respostas prontas?", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 135424, "titulo": "Privacidade é barreira ao uso de plataformas digitais em escolas", "url": "https://www.cnnbrasil.com.br/educacao/privacidade-e-barreira-ao-uso-de-plataformas-digitais-em-escolas/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-31T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa do Cetic.br revelou que 39% das escolas públicas que não utilizam sistemas digitais de gestão citam a privacidade como barreira para o uso de plataformas online.", "titulo_pt": "Privacidade é barreira ao uso de plataformas digitais em escolas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 135440, "titulo": "IA eleva risco cibernético e preocupa estabilidade financeira, alerta órgão", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/ia-pode-acelerar-vulnerabilidades-ciberneticas-alerta-orgao-regulador/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-31T16:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial avançada aumenta os riscos cibernéticos e os desafios operacionais, o que pode preocupa a estabilidade financeira. O órgão alerta para a necessidade de correções mais rápidas.", "titulo_pt": "IA eleva risco cibernético e preocupa estabilidade financeira, alerta órgão", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 135469, "titulo": "Deep fake, versão 2.0.26", "url": "https://www.jota.info/opiniao-e-analise/artigos/deep-fake-versao-2-0-26", "fonte_id": "jota", "data_pub": "2026-08-31T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um vídeo de Jair Bolsonaro gerado por inteligência artificial foi usado na campanha de Flávio Bolsonaro para testar a existência de algum tipo de controle eleitoral.", "titulo_pt": "Vídeo de bolsonaro com IA na campanha de flávio testa var eleitoral", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 135692, "titulo": "Exclusive: Bessent calls for less regulation to help small banks", "url": "https://www.axios.com/2026/08/31/bessent-bank-regulation-g20", "fonte_id": "axios", "data_pub": "2026-08-31T15:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário do Tesouro dos EUA, Scott Bessent, argumentou a favor de uma regulamentação mais leve para os bancos pequenos durante uma reunião do G20. Ele defendeu que as regras post-crise têm pressionado as pequenas instituições bancárias, o que limita a oportunidade para todos os americanos, especialmente os que atuam na Main Street.", "titulo_pt": "Bessent defende redução da regulamentação para bancos pequenos", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 135924, "titulo": "Debian won’t ban AI code from its Linux distribution", "url": "https://www.theverge.com/tech/986789/linux-debian-generative-ai-policy", "fonte_id": "the_verge", "data_pub": "2026-08-31T15:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Debian decidiu permitir o uso de ferramentas de IA pelos desenvolvedores em suas contribuições para a distribuição Linux. A nova política reconhece que o uso responsável de IA pode melhorar a produtividade dos desenvolvedores.", "titulo_pt": "Debian permitirá o uso de ferramentas de IA em sua distribuição Linux", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 135934, "titulo": "George Santos Just Got Hit With Kalshi’s First-Ever Lifetime Ban", "url": "https://www.wired.com/story/george-santos-gets-a-lifetime-ban-from-kalshi/", "fonte_id": "wired", "data_pub": "2026-08-31T15:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "George Santos, ex-representante dos EUA, foi multado em mais de $71.000 e banido para a vida da plataforma Kalshi após ser acusado de tentar manipular o mercado de previsões.", "titulo_pt": "George Santos recebe primeira banimento de vida da Kalshi", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 135313, "titulo": "Cielo usa agente de inteligência artificial e derruba pela metade os chamados de TI internos", "url": "https://exame.com/inteligencia-artificial/cielo-usa-agente-de-inteligencia-artificial-e-derruba-pela-metade-os-chamados-de-ti-internos/", "fonte_id": "exame", "data_pub": "2026-08-31T14:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Cielo utilizou um agente de inteligência artificial criado com o Copilot Studio da Microsoft, que reduziu em 52,2% o número de chamados ao Service Desk e passou a atuar 24 horas por dia.", "titulo_pt": "Cielo utiliza agente de inteligência artificial e reduz pela metade os chamados de TI internos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 135318, "titulo": "OpenAI leva menos de 200 dias para transformar anúncios no ChatGPT em negócio de US$ 1 bilhão", "url": "https://exame.com/marketing/openai-leva-menos-de-200-dias-para-transformar-anuncios-no-chatgpt-em-negocio-de-us-1-bilhao/", "fonte_id": "exame", "data_pub": "2026-08-31T14:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OpenAI transformou o ChatGPT em uma empresa avaliada em 1 bilhão de dólares em menos de 200 dias, com a plataforma já alcançando dezenas de milhares de anunciantes em mais de 40 países.", "titulo_pt": "Openai transforma ChatGPT em negócio de 1 bilhão em menos de 200 dias", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 135320, "titulo": "Telefónica leva risco climático ao plano global de sustentabilidade após 97 mi de euros em danos", "url": "https://exame.com/esg/telefonica-leva-risco-climatico-ao-plano-global-de-sustentabilidade-apos-97-mi-de-euros-em-danos/", "fonte_id": "exame", "data_pub": "2026-08-31T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Telefónica, empresa responsável pela Vivo no Brasil, incluiu o risco climático em seu plano global de sustentabilidade após sofrer danos estimados em 97 milhões de euros. A diretora global de sustentabilidade da empresa destacou que o clima se tornou um impacto real nos ativos da companhia.", "titulo_pt": "Telefónica incorpora risco climático no plano de sustentabilidade após 97 milhões de euros em danos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 135948, "titulo": "Using AI to track bird migration", "url": "https://phys.org/news/2026-08-ai-track-bird-migration.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A chegada do primeiro cucu no início da primavera desperta a imaginação dos poetas, e embora a presença de uma única golfinha não indique o início da estação, as migrações anuais de espécies de aves entre continentes têm fascinado as pessoas por séculos. Hoje, no entanto, a tecnologia está fornecendo aos ornitólogos meios para rastrear esses incríveis percursos de maneira que seria inimaginável para os naturalistas das gerações anteriores.", "titulo_pt": "Usando IA para rastrear a migração de aves", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 135949, "titulo": "Smoky off-flavors in cocoa aren't caused solely by smoke", "url": "https://phys.org/news/2026-08-smoky-flavors-cocoa-solely.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cafés fermentados ocasionalmente apresentam sabores indesejáveis que podem comprometer a qualidade do chocolate e outros produtos à base de cacau. Pesquisadores do Instituto Leibniz para Sistemas Biológicos de Alimentos da Technische Universität München descobriram que uma fermentação excessiva dos grãos de cacau pode causar sabores smoky, leathery e cheesy, o que significa que esses sabores não necessariamente são devido a uma contaminação por fumaça.", "titulo_pt": "Sabores smoky em cacau não são necessariamente causados por contaminação por fumaça", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 135950, "titulo": "Malaysia's Sarawak eyes cloud seeding as haze worsens", "url": "https://phys.org/news/2026-08-malaysia-sarawak-eyes-cloud-seeding.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A estado de Sarawak, na Malásia, planeja operações de sowing de nuvens no início de setembro, devido à qualidade do ar prejudicada pela fumaça de incêndios na Indonésia.", "titulo_pt": "Sarawak planeja operações de sowing de nuvens devido à piora da neblina", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 135951, "titulo": "Plant hormones may offer a way to balance crop yield and disease resistance", "url": "https://phys.org/news/2026-08-hormones-crop-yield-disease-resistance.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os hormônios de esteroide nas plantas podem inibir as respostas imunes, liberando recursos para o crescimento. Estudos da TUM descobriram um mecanismo que equilibra a prioridade de crescimento com a resistência a doenças em plantas.", "titulo_pt": "Hormônios de esteroide podem equilibrar colheita e resistência a doenças em plantas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 135952, "titulo": "Communicating uncertainty in research is hard, so we worked on how best to do it—here's what you can watch out for", "url": "https://phys.org/news/2026-08-communicating-uncertainty-hard.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quatro pesquisadores dedicaram três dias a uma sessão com outras doze pessoas de diferentes áreas profissionais, incluindo cosmologistas, estudiosos de gerenciamento de emergências, geneticistas, hidrólogos, neuropsicólogos, especialistas em comunicação de riscos de saúde, neurocientistas cognitivos, diretores de teatro, jornalistas investigativos e meteorologistas, para discutir como melhor comunicar a incerteza em pesquisas.", "titulo_pt": "Comunicar incerteza em pesquisas é difícil, então trabalhamos em como fazer isso - veja o que preste atenção", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 135953, "titulo": "New storms threaten Grand Canyon flood search, 2 bodies recovered", "url": "https://phys.org/news/2026-08-storms-threaten-grand-canyon-bodies.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forecast storms in the Grand Canyon on Monday threatened the search for more than a dozen people missing after flash floods over the weekend. Two bodies have already been recovered.", "titulo_pt": "Novos temporais ameaçam busca por sobreviventes no Grand Canyon, dois corpos recuperados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 135954, "titulo": "An anomalous return of the Odden ice tongue suggests unusual Arctic conditions", "url": "https://phys.org/news/2026-08-anomalous-odden-ice-tongue-unusual.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dados de várias fontes, incluindo a NASA, indicam uma significativa diminuição da geleada arctica desde 1979. Flutuações temporárias de temperatura, ventos, convecção marinha e salinidade do mar em regiões específicas podem afetar a formação ou derretimento da geleada.", "titulo_pt": "Um incomum retorno do gelo da Odden sugere condições atípicas no ártico", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 135955, "titulo": "Dispelling six myths about back‑to‑school readiness", "url": "https://phys.org/news/2026-08-dispelling-myths-backtoschool-readiness.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em agosto, muitos pais canadenses iniciam a preparação dos filhos para o retorno às aulas no mês seguinte. Este período é frequentemente visto como uma extensão do fim de semana, especialmente no mês de agosto.", "titulo_pt": "Desmistificando seis mitos sobre a preparação para o retorno às aulas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 135956, "titulo": "Earlier volcano warnings could mean more false alarms—but they could also save lives", "url": "https://phys.org/news/2026-08-earlier-volcano-false-alarms.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O erupção súbita do vulcão Whakaari/White Island em dezembro de 2019 resultou na morte de 22 pessoas e deixou 25 feridas graves, sendo o pior desastre vulcânico da Nova Zelândia em décadas.", "titulo_pt": "Alertas antecipados de vulcão podem significar mais alarmes falsos, mas também podem salvar vidas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 135957, "titulo": "Manganese's emission lines shine a light on galactic evolution", "url": "https://phys.org/news/2026-08-manganese-emission-lines-galactic-evolution.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo recente identificou ondas de luz que podem ser úteis para rastrear a evolução química do universo. Usando modelos computacionais para simular como elétrons interagem com íons de manganeso, um grupo de astrônomos previu como condições ambientais diferentes poderiam produzir linhas de emissão de luz observáveis.", "titulo_pt": "Linhas de emissão do manganeso iluminam a evolução galáctica", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 135958, "titulo": "When a mountain falls: How ice and rock triggered Nepal's catastrophic flood", "url": "https://phys.org/news/2026-08-mountain-falls-ice-triggered-nepal.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 26 de agosto de 2026, uma avalanche de gelo e rochas desceu sobre o rio na Nepal, causando uma catástrofe que resultou em centenas de mortes e pessoas desaparecidas. Dias depois, uma nova lagoa se formou atrás dos escombros e posteriormente rompeu, liberando mais água pelo vale.", "titulo_pt": "Quando uma montanha cai: como gelo e rochas acionaram a inundações catastróficas na Nepal", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 135959, "titulo": "Solar orbiter detects ion sorting at the solar wind's magnetic boundary", "url": "https://phys.org/news/2026-08-solar-orbiter-ion-magnetic-boundary.html", "fonte_id": "phys_org", "data_pub": "2026-08-31T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa da Southwest Research Institute analisou dados do Solar Orbiter da ESA e forneceu a visão mais detalhada até agora da camada de corrente heliosférica (HCS), que é a superfície ondulante que marca a fronteira entre os hemisférios magnéticos norte e sul do sol.", "titulo_pt": "Solar orbiter detecta classificação de íons na borda magnética do vento solar", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 135973, "titulo": "STAT+: Can buying a drug patent application be seen as a bid to prolong a monopoly?", "url": "https://www.statnews.com/pharmalot/2026/08/31/pending-drug-patent-applications-amgen-carefirst/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-31T15:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um caso de patente de medicamento envolvendo a Amgen está sendo monitorado de perto, devido às possíveis implicações para acordos de patentes no setor farmacêutico.", "titulo_pt": "Comprar uma aplicação de patente de medicamento pode ser visto como uma tentativa de estender um monopólio?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 135974, "titulo": "STAT+: GLP-1 drugs are almost single-handedly forcing employers to reconsider workers’ health care", "url": "https://www.statnews.com/2026/08/31/health-care-inc-glp-1s-are-breaking-employers-and-340-battles/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-31T15:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ainda mais um sistema hospitalar está processando a CVS Health, enquanto cortes no Medicaid estão alterando o cenário. Estas notícias, juntamente com informações sobre medicamentos GLP-1, estão levando as empresas a reavaliar a saúde dos funcionários.", "titulo_pt": "Medicamentos GLP-1 estão forçando as empresas a reavaliarem a saúde dos funcionários", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 135987, "titulo": "To nap or not to nap? Science is still waking up to the question", "url": "https://www.sciencenews.org/article/nap-science-sleep-health", "fonte_id": "science_news", "data_pub": "2026-08-31T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitas pessoas têm dificuldade para dormir o suficiente à noite. Surpreendentemente, a ciência ainda não pode determinar se adicionar uma soneca para dividir o sono em duas fases é saudável.", "titulo_pt": "Para dormir ou não dormir? A ciência ainda está acordando para a questão", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 136015, "titulo": "Commercial Space Federation (CSF) Welcomes Two New Associate Members", "url": "https://spacenews.com/commercial-space-federation-csf-welcomes-two-new-associate-members-2/", "fonte_id": "spacenews", "data_pub": "2026-08-31T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Federação do Espaço Comercial (CSF) recebeu duas novas associadas: Outlier e Rendezvous Robotics, que trazem expertise em plataformas satelitares reutilizáveis e adaptação.", "titulo_pt": "Federação do espaço comercial (CSF) bem-vinda a dois novos associados", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 135900, "titulo": "Cultural association brings Taiwan to Poland", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/01/2003863488", "fonte_id": "taipei_times", "data_pub": "2026-09-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma associação cultural trouxe Taiwan para a Polônia, provavelmente através de uma exposição ou evento cultural.", "titulo_pt": "Associação cultural traz Taiwan para a polônia", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 135901, "titulo": "500 millionth Taipei YouBike renter to get NT$20,000 prize", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/01/2003863489", "fonte_id": "taipei_times", "data_pub": "2026-09-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O cinquenta milhõesimo locador de bicicletas partilhadas de Taipei recebeu um prêmio de 20.000 NT$ (Novos Dólares Taiwanese).", "titulo_pt": "50 Milhãoésimo locador de YouBike de Taipei ganhará prêmio de 20.000 NT$", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 136093, "titulo": "‘The Social Reckoning,’ ‘Cliff Booth,’ and ‘Artificial’ Had Reshoots. Why Is That a Disaster?", "url": "https://www.indiewire.com/features/commentary/social-reckoning-cliff-booth-artificial-reshoots-problems-david-fincher-1235213087/", "fonte_id": "indiewire", "data_pub": "2026-08-31T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três filmes de diretores renomados podem ter regravações, mas a razão disso é questionada. A temporada de premiações de seis meses pode ter afetado a percepção sobre a produção de filmes.", "titulo_pt": "‘A conta Social’, ‘Cliff Booth’ e ‘Artificial’ tiveram regravações. Será que é um desastre?", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 136067, "titulo": "Skaiwater Just Dropped a New Album", "url": "https://pitchfork.com/story/skaiwater-new-album-femme-fatale-listen/", "fonte_id": "pitchfork", "data_pub": "2026-08-31T17:09:00Z" s Art Market", "url": "https://www.artnews.com/art-news/market/jonathan-crockett-exit-interview-phillips-asia-chairman-1234796320/", "fonte_id": "artnews", "data_pub": "2026-08-31T16:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jonathan Crockett, que liderou as operações da Phillips na Ásia por mais de uma década, deixará a empresa esta semana.", "titulo_pt": "Jonathan Crockett, ex-diretor de operações asiáticas da Phillips, se despede", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 136044, "titulo": "Collectors Marc Andreessen and Ken Griffin Among Biggest Donors to Midterm Elections", "url": "https://www.artnews.com/art-news/news/marc-andreessen-ken-griffin-midterm-elections-donations-1234796310/", "fonte_id": "artnews", "data_pub": "2026-08-31T16:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Marc Andreessen e Ken Griffin são alguns dos principais doadores nas eleições de meia legislatura, tendo contribuído com cerca de 12% dos US$ 1,2 bilhão gastos neste ciclo eleitoral.", "titulo_pt": "Coletoriros Marc Andreessen e Ken Griffin entre os maiores doadores das eleições de meia legislatura", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 136045, "titulo": "Lavinia Fontana Altarpiece Acquired by National Museum in Stockholm", "url": "https://www.artnews.com/art-news/news/lavinia-fontana-altarpiece-national-museum-stockholm-1234796291/", "fonte_id": "artnews", "data_pub": "2026-08-31T16:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um painel de Lavinia Fontana, uma pintora italiana do século XVI, foi adquirido pelo Museu Nacional de Estocolmo. O painel foi criado durante o apogeu da carreira da artista e destaca-se pela maestria na utilização de cores e formas.", "titulo_pt": "Painel de lavinia Fontana adquirido pelo museu nacional de estocolmo", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 136035, "titulo": "Dolly Parton laid to rest in private Nashville funeral", "url": "https://www.theguardian.com/music/2026/aug/31/dolly-parton-funeral", "fonte_id": "guardian_culture", "data_pub": "2026-08-31T16:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dolly Parton, considerada a rainha da música country, foi sepultada em uma cerimônia privada em Nashville, ao lado do seu marido de 60 anos, Carl Thomas, após falecer aos 80 anos em 25 de agosto após uma breve batalha contra o câncer.", "titulo_pt": "Dolly Parton é sepultada em cerimônia privada em Nashville", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 136046, "titulo": "Alexa West Toes the Line Between Dance and Labor", "url": "https://www.artnews.com/art-in-america/columns/alexa-west-dance-labor-1234796295/", "fonte_id": "artnews", "data_pub": "2026-08-31T16:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alexa West realiza danças complexas que a tornaram uma das estrelas do cenário experimental de dança de Nova York.", "titulo_pt": "Alexa West caminha entre dança e trabalho", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 136069, "titulo": "Leadership Exodus at Phillips", "url": "https://www.artforum.com/news/leadership-exodus-at-phillips-auction-house-1234758420/", "fonte_id": "artforum", "data_pub": "2026-08-31T16:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A casa de leilões Phillips viu a saída de metade de sua equipe executiva e vários funcionários de alto nível desde o encerramento de suas vendas de maio, de acordo com a Artnews. Miety Heiden, chair de vendas privadas, e Jonathan Crockett, chair para a Ásia, estão programados para deixar a empresa em setembro.", "titulo_pt": "Exílio executivo na Phillips", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 136070, "titulo": "Met Cancels John Galliano Show Amid Firestorm over Past Antisemitic Statements", "url": "https://www.artforum.com/news/met-cancels-john-galliano-show-1234758403/", "fonte_id": "artforum", "data_pub": "2026-08-31T16:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Museu Metropolitano de Arte de Nova York cancelou uma exposição planejada no seu departamento de Instituto de Moda em homenagem ao designer de moda John Galliano. O cancelamento foi motivado por declarações antissemitas e anti-asiáticas passadas de Galliano.", "titulo_pt": "Met cancela exposição de John Galliano devido a declarações antissemitas", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}], "cultura__eventos": [], "sociedade": [{"id": 135897, "titulo": "Health ministry expands health subsidy categories", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/01/2003863485", "fonte_id": "taipei_times", "data_pub": "2026-09-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Saúde expandiu as categorias de subsídio de saúde, incluindo novos serviços e tratamentos no programa.", "titulo_pt": "Ministério da saúde expande categorias de subsídio de saúde", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 135268, "titulo": "Decisão do CNJ facilita inventários em cartórios para famílias sem liquidez financeira", "url": "https://veja.abril.com.br/brasil/decisao-do-cnj-facilita-inventarios-em-cartorios-para-familias-sem-liquidez-financeira/", "fonte_id": "veja", "data_pub": "2026-08-31T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A decisão do Conselho Nacional de Justiça facilita os processos de inventário em cartórios para famílias que não possuem liquidez financeira. O benefício visa auxiliar herdeiros que detêm imóveis, mas não dispõem de dinheiro em caixa. No entanto, a cobrança do imposto permanece intacta.", "titulo_pt": "Decisão do CNJ simplifica inventários para famílias sem recursos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 135601, "titulo": "Gobierno presenta agenda nacional para fortalecer el sistema de protección de la niñez", "url": "https://www.latercera.com/nacional/noticia/gobierno-presenta-agenda-nacional-para-fortalecer-el-sistema-de-proteccion-de-la-ninez/", "fonte_id": "la_tercera", "data_pub": "2026-08-31T17:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em setembro, será apresentado um projeto para fortalecer a segurança em residências ameaçadas por redes de exploração infantil, incluindo controles de acesso, vigilância, patrulhamento e proteção de vítimas e denunciantes.", "titulo_pt": "Governo apresenta agenda nacional para fortalecer o sistema de proteção da infância", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 135274, "titulo": "Controle a pressão para manter distância do Alzheimer, conclui maior estudo já feito sobre o tema", "url": "https://veja.abril.com.br/saude/controle-a-pressao-para-manter-distancia-do-alzheimer-diz-maior-estudo-ja-feito-sobre-o-tema/", "fonte_id": "veja", "data_pub": "2026-08-31T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo, considerado o maior já realizado sobre o tema, concluiu que o tratamento da hipertensão pode reduzir em 15% o risco de desenvolver demência. A pesquisa foi apresentada no Congresso Europeu de Cardiologia.", "titulo_pt": "Controle a pressão para manter distância do Alzheimer, conclui maior estudo já feito sobre o tema", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 135275, "titulo": "Planos de saúde chamam a polícia", "url": "https://veja.abril.com.br/economia/planos-de-saude-chamam-a-policia/", "fonte_id": "veja", "data_pub": "2026-08-31T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As principais operadoras de planos de saúde estão intensificando suas parcerias com as Polícias Civis com o objetivo de combater as fraudes que afetam o setor. Essa medida visa restringir as atividades fraudulentas que têm causado prejuízos significativos ao setor de planos de saúde.", "titulo_pt": "Planos de saúde intensificam parcerias com polícias civis", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 135414, "titulo": "A corrida contra o tempo para resgatar mais de 600 trabalhadores presos em túneis após avalanche no Nepal e no Tibete", "url": "https://www.bbc.com/portuguese/articles/cr503rrgg6mo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-31T16:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Equipes de resgate estão realizando explosões controladas nos túneis para localizar e resgatar mais de 600 trabalhadores presos nas usinas hidrelétricas do Nepal e do Tibete. As autoridades nepalesas informaram sobre a operação.", "titulo_pt": "Corrida contra o tempo para resgatar mais de 600 trabalhadores presos em túneis após avalanche no Nepal e no Tibete", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 135283, "titulo": "Eleições 2026: o que é empate técnico nas pesquisas eleitorais", "url": "https://veja.abril.com.br/politica/eleicoes-2026-o-que-e-empate-tecnico-nas-pesquisas-eleitorais/", "fonte_id": "veja", "data_pub": "2026-08-31T16:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empate técnico nas pesquisas eleitorais ocorre quando as margens de erro dos candidatos se sobrepõem, dificultando a identificação de um líder. Entenda como a margem de erro influencia na interpretação desses levantamentos.", "titulo_pt": "Eleições 2026: o que é empate técnico nas pesquisas eleitorais", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 135862, "titulo": "Central bar packed as Hongkongers aim to raise HK$50,000 for Nepal flood relief", "url": "https://www.scmp.com/news/hong-kong/society/article/3365888/central-bar-packed-hongkongers-aim-raise-hk50000-nepal-flood-relief?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-31T15:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um bar central de Hong Kong ficou lotado com cerca de cem clientes que se reuniram para arrecadar fundos para as vítimas das cheias e deslizamentos de terra devastadores em Nepal. O número de mortos em Nepal subiu para 919, com 4.247 pessoas ainda desaparecidas, de acordo com a CCTV.", "titulo_pt": "Bar central lotado em hong kong visa arrecadar HK$50.000 para auxiliar vítimas de desastres em Nepal", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 134618, "titulo": "Kalil e especialistas comentam como agir diante de uma crise de ansiedade", "url": "https://www.cnnbrasil.com.br/saude/kalil-e-especialistas-comentam-como-agir-diante-de-uma-crise-de-ansiedade/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-31T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Maria Alice Fontes enfatizou a importância da respiração e da separação entre as sensações e a razão durante uma crise de ansiedade. Ao participar do programa CNN Sinais Vitais, ela comentou sobre maneiras de lidar com a ansiedade.", "titulo_pt": "Kalil e especialistas comentam como agir diante de uma crise de ansiedade", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 135135, "titulo": "35% of young unmarried people in Japan have no wish to get wed", "url": "https://www.japantimes.co.jp/news/2026/08/31/japan/marriage-wish-survey/", "fonte_id": "japan_times", "data_pub": "2026-08-31T08:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa mostrou que 35% das pessoas jovens e solteiras no Japão não têm desejo de se casar. Eles preferem se concentrar em hobbies.", "titulo_pt": "35% Das jovens solteiras no Japão não têm desejo de se casar", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 135022, "titulo": "Police under fire after backtracking on hanging evidence in Jeju missing woman's death", "url": "https://www.koreaherald.com/article/10857778", "fonte_id": "korea_herald", "data_pub": "2026-08-31T08:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia foi criticada após reverter sua declaração sobre a causa da morte de Jang Mi-ran, uma mulher de 37 anos que desapareceu em Jeju. Inicialmente, a polícia sugeriu que a morte foi por enforcamento com base em evidências forenses, mas posteriormente afirmou que não podia determinar a causa exata da morte.", "titulo_pt": "Polícia sob fogo após reverter declarações sobre morte por enforcamento de mulher desaparecida em Jeju", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 134520, "titulo": "Restituição do IR cai na conta nesta segunda (31); veja quem recebe no quarto e último lote", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/restituicao-do-ir-cai-na-conta-nesta-segunda-31-veja-quem-recebe-no-quarto-e-ultimo-lote.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Receita Federal efetua o pagamento do quarto lote de restituição do Imposto de Renda 2026 nesta segunda-feira (31), totalizando R$ 1,2 bilhão para 521.935 contribuintes. Este é o último lote regular, mas novos pagamentos podem ser feitos com declarações da malha fina.", "titulo_pt": "Recebimento do quarto lote de restituição do IR 2026 cai na conta nesta segunda (31)", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 135037, "titulo": "Too young for a pension, too old for youth aid: Seoul eyes midlife savings plan", "url": "https://www.koreaherald.com/article/10857618", "fonte_id": "korea_herald", "data_pub": "2026-08-31T06:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Seul planeja criar contas de poupança a longo prazo para ajudar os residentes na meia-idade a superar um período potencialmente difícil entre o último salário e o primeiro pagamento de aposentadoria. Os participantes contribuiriam 80.000 wones mensais durante 10 anos, enquanto a cidade adicionaria 20.000 wones, com a estimativa de que o saldo pudesse chegar a 16,4 milhões de wones, incluindo os retornos de investimento.", "titulo_pt": "Seul planeja plano de poupança para adultos mais velhos", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 135015, "titulo": "Pakistani nurse to be honoured for saving newborn from deadly hospital fire", "url": "https://www.scmp.com/news/asia/south-asia/article/3365802/pakistani-nurse-be-honoured-saving-newborn-deadly-hospital-fire?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-31T04:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma enfermeira paquistanesa resgatou o único bebê sobrevivente de um incêndio em uma creche de neonatos de um hospital governamental em Islamabad, que resultou na morte de 14 outros bebês. Ela será honrada com uma das maiores condecorações civis do país.", "titulo_pt": "Enfermeira paquistanesa será homenageada por salvar bebê de incêndio em hospital", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 135783, "titulo": "Photos: Nearly 1,000 dead, thousands missing in Nepal–China border floods", "url": "https://www.aljazeera.com/gallery/2026/8/31/photos-nearly-1000-dead-thousands-missing-in-nepal-china-border?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-31T17:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 4.000 pessoas permanecem desaparecidas após inundações letais que atingiram Nepal e Tibet, deixando famílias em desespero.", "titulo_pt": "Imagens: quase 1.000 mortos, milhares desaparecidos nas inundações da fronteira entre Nepal e China", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 135298, "titulo": "China registra 16 mortos e 546 desaparecidos no desastre da fronteira com o Nepal", "url": "https://www.brasildefato.com.br/2026/08/31/china-registra-16-mortos-e-546-desaparecidos-no-desastre-da-fronteira-com-o-nepal/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-31T13:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No desastre de um deslizamento de lama na fronteira entre a China e o Nepal, 16 pessoas morreram e 546 desapareceram na região do posto fronteiriço de Gyirong, no Tibete, em 26 de agosto. As informações foram divulgadas pelo governo regional chinês.", "titulo_pt": "China registra 16 mortos e 546 desaparecidos no desastre da fronteira com o Nepal", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 134890, "titulo": "Flash flood hits Grand Canyon’s Phantom Ranch, more than 20 people missing", "url": "http://www.euronews.com/video/2026/08/31/flash-flood-hits-grand-canyons-phantom-ranch-more-than-20-people-missing", "fonte_id": "euronews", "data_pub": "2026-08-31T09:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma cheia repentina atingiu a Fenda do Grande Cañão perto da Ranch de Fantasma, lançando detritos no Rio Colorado, destruindo pontes de madeira e deixando mais de 20 pessoas desaparecidas ou não localizadas.", "titulo_pt": "Cheia repentina atinge fenda do grande cañão, mais de 20 pessoas desaparecidas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 134622, "titulo": "China alerta que lago formado após deslizamento pode subir com chuva", "url": "https://www.cnnbrasil.com.br/internacional/china-alerta-que-lago-formado-apos-deslizamento-pode-subir-com-chuva/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-31T08:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A China alertou que o nível do lago formado após o deslizamento pode aumentar com a chuva. A temperatura pode cair para até 8°C, com uma grande diferença entre o dia e a noite, e o clima pode ficar úmido e frio.", "titulo_pt": "China avisa que nível do lago pode subir com chuva após deslizamento", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 134872, "titulo": "Yosemite, Big Bend, Utah: Trump unleashes wave of attacks on US national parks", "url": "https://www.lemonde.fr/en/environment/article/2026/08/31/yosemite-big-bend-utah-trump-unleashes-wave-of-attacks-on-us-national-parks_6757005_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-31T08:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos está considerando transferir uma pequena parte do Parque Nacional Yosemite para um desenvolvedor privado. Este plano de expandir a área protegida tem gerado forte reação pública.", "titulo_pt": "Yosemite, Big Bend, Utah: trump lança onda de ataques aos parques nacionais dos EUA", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 135007, "titulo": "Malaysia’s air quality turns hazardous as Indonesian wildfires burn", "url": "https://www.scmp.com/week-asia/health-environment/article/3365818/malaysias-air-quality-turns-hazardous-indonesian-wildfires-burn?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-31T07:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A qualidade do ar na região de Sarawak, na Malásia, atingiu níveis perigosos devido às chamas de incêndios florestais na Indonésia. A cidade de Serian registrou um índice de poluição do ar (API) de 476, enquanto Kuching, Samarahan e Sri Aman registraram leituras acima de 300 no início da manhã.", "titulo_pt": "Qualidade do ar na malásia piora com incêndios florestais na indonésia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 134892, "titulo": "Nepal flood death toll passes 900 as search for survivors continues", "url": "http://www.euronews.com/video/2026/08/31/nepal-flood-death-toll-passes-900-as-search-for-survivors-continues", "fonte_id": "euronews", "data_pub": "2026-08-31T06:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Resgatadores em Nepal e Tibet continuaram buscando sobreviventes no domingo após cheias flash ao longo da fronteira que mataram centenas e deixaram milhares desaparecidos, com ajuda aérea sendo enviada para distritos isolados.", "titulo_pt": "Número de mortos por cheias no nepal e tibet alcança mais de 900", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 134894, "titulo": "'They wrote little letters': How kids in Portugal are making money off their neighbours' plastic waste", "url": "http://www.euronews.com/2026/08/31/i-dont-mind-begging-volta-offers-an-opportunity-to-many", "fonte_id": "euronews", "data_pub": "2026-08-31T06:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um programa de depósito de garrafas foi implementado pela primeira vez na Europa do Sul, ajudando o meio ambiente e financiando viagens incluídas nas listas de desejos de crianças portuguesas.", "titulo_pt": "Eles escreveram pequenas letras: como crianças em Portugal estão ganhando dinheiro com o lixo plástico dos vizinhos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 134950, "titulo": "Global coral reef coverage risks irreversible decline, new report warns", "url": "https://www.aljazeera.com/news/2026/8/31/global-coral-reef-coverage-risks-irreversible-decline-new-report-warns?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-31T05:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cobertura global de corais está em risco de um declínio irreversível, conforme alerta um relatório recente. Os corais representam apenas 1% da cobertura marinha, mas abrigam cerca de 25% da vida marinha.", "titulo_pt": "Cobertura global de corais em risco de declínio irreversível, alerta relatório", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 134897, "titulo": "Authorities in Nepal carry out temporary burials of unidentified flood victims causing public outrage", "url": "http://www.euronews.com/2026/08/31/authorities-in-nepal-carry-out-temporary-burials-of-unidentified-flood-victims-causing-pub", "fonte_id": "euronews", "data_pub": "2026-08-31T04:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades no Nepal realizaram sepultamentos temporários de centenas de vítimas fatais das inundações, causando indignação pública, que acusa as autoridades de não seguir os ritos hindus de sepultamento e de mal administrar a situação.", "titulo_pt": "Autoridades na Nepal realizam sepultamentos temporários de vítimas de inundações, causando indignação", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 134873, "titulo": "'No regulation exists:' Suez Canal becomes gateway for invasive species in the Mediterranean", "url": "https://www.lemonde.fr/en/summer-reads/article/2026/08/31/no-regulation-exists-suez-canal-becomes-gateway-for-invasive-species-in-the-mediterranean_6757001_183.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-31T03:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suez Canal, um canal histórico, se tornou um caminho para espécies invasoras no Mediterrâneo. A proliferação dessas espécies, nomeadas 'Lessepsian', está aumentando devido a sobrepeixe, poluição, construção costeira e mudanças climáticas.", "titulo_pt": "Nenhuma regulamentação existe:", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 135257, "titulo": "Israel fecha acordo de US$ 3,5 bi para defesa aérea da Grécia", "url": "https://www.poder360.com.br/poder-internacional/israel-fecha-acordo-de-us-35-bi-para-defesa-aerea-da-grecia/", "fonte_id": "poder360", "data_pub": "2026-08-31T17:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Israel e a Grécia fecharam um acordo no valor de 3,5 bilhões de dólares para a defesa aérea do país europeu. O sistema de defesa cobrirá mísseis, aeronaves e drones e faz parte do programa de modernização militar grego.", "titulo_pt": "Israel fecha acordo de 3,5 bi para defesa aérea da Grécia", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 135500, "titulo": "Corte de Talca sanciona a conservador Najle por emitir certificados que permitieron vender inmuebles embargados", "url": "https://www.ciperchile.cl/2026/08/31/corte-de-talca-sanciona-a-conservador-najle-por-emitir-certificados-que-permitieron-vender-inmuebles-embargados/?utm_source=rss&utm_medium=rss&utm_campaign=corte-de-talca-sanciona-a-conservador-najle-por-emitir-certificados-que-permitieron-vender-inmuebles-embargados", "fonte_id": "ciper_chile", "data_pub": "2026-08-31T17:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Corte de Talca sancionou o conservador Najle por emitir certificados que permitiram a venda de imóveis embargados. O caso foi publicado inicialmente pelo CIPER Chile.", "titulo_pt": "Corte de Talca sanciona conservador Najle por emitir certificados que permitiram vender imóveis embargados", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 135501, "titulo": "Imágenes históricas inéditas: las fotos del ataque a La Moneda tomadas por la cámara de uno de los aviones Hawker Hunter", "url": "https://www.ciperchile.cl/2026/08/31/imagenes-historicas-ineditas-las-fotos-del-ataque-a-la-moneda-tomadas-por-la-camara-de-uno-de-los-aviones-hawker-hunter/?utm_source=rss&utm_medium=rss&utm_campaign=imagenes-historicas-ineditas-las-fotos-del-ataque-a-la-moneda-tomadas-por-la-camara-de-uno-de-los-aviones-hawker-hunter", "fonte_id": "ciper_chile", "data_pub": "2026-08-31T15:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Foram publicadas imagens históricas inéditas do ataque a La Moneda, capturadas pela câmera de um dos aviões Hawker Hunter.", "titulo_pt": "Imagens históricas inéditas: as fotos do ataque a La Moneda tomadas por uma câmera de um avião Hawker Hunter", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 135871, "titulo": "Freed Hongkonger sent back to jail as storm delays deportation from Philippines", "url": "https://www.scmp.com/news/hong-kong/article/3365869/freed-hongkonger-sent-back-jail-storm-delays-deportation-philippines?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-31T12:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem de Hong Kong foi levado de volta para uma prisão filipina, conforme criticado por sua equipe legal como 'detenção ilegal', após o atraso na deportação devido a uma tempestade que interrompeu seu processo após sua libertação. As autoridades prisionais conduziram Tang Lung-wai ao Bureau of Immigration na sexta-feira, mas devido à suspensão das atividades governamentais devido a um tufão passando, ele foi devolvido à prisão máxima New Bilibid.", "titulo_pt": "Homem de hong kong liberado e depois enviado de volta à prisão na filipinas, devido a tempestade", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 135882, "titulo": "Countries must consider reparations for slave trade, UN committee says", "url": "https://www.scmp.com/news/world/article/3365856/countries-must-consider-reparations-slave-trade-un-committee-says?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-31T10:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um comitê da ONU afirmou que os países estão legalmente obrigados a considerar indenizações pelo comércio transatlântico de escravos e a adotar outras medidas para abordar a persistente discriminação racial. Essa obrigação surge do Convenio de 1965 sobre discriminação racial, não do que existia na época do comércio de escravos.", "titulo_pt": "Comitê da ONU diz que países devem considerar indenizações pelo tráfico de escravos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 134891, "titulo": "UN racial discrimination committee presents legal case for broad slavery reparations", "url": "http://www.euronews.com/2026/08/31/un-racial-discrimination-committee-presents-legal-case-for function toggleDrill(id) {

}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

    </div>` : ""}
  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
