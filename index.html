provavel_duplicata_de": null, "texto_pt": "Seul, 8 de outubro (Yonhap) -- A Coreia do Sul realizou com sucesso o lançamento do seu primeiro veiculo de vôo hipercósmico.", "titulo_pt": "Coreia do sul realiza teste com primeiro veiculo de vôo hipercósmico, com presença de Lee", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 202694, "titulo": "Lee observes S. Korea's first hypersonic glide vehicle test", "url": "https://www.koreaherald.com/article/10897437", "fonte_id": "korea_herald", "data_pub": "2026-10-08T09:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul realizou seu primeiro teste de lançamento de um veículo de vôo hipersônico desenvolvido internamente, avançando em direção à obtenção de uma nova capacidade de ataque de alta velocidade projetada para evitar defesas de mísseis convencionais. O presidente Lee Jae Myung observou o teste, uma atípica aparição pública por um presidente em relação ao desenvolvimento de um novo sistema de ataque.", "titulo_pt": "Lee assiste ao primeiro teste de míssil hipersônico da Coreia do sul", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 202419, "titulo": "OpenAI's math breakthrough points beyond math", "url": "https://www.axios.com/2026/10/08/openai-math-proofs-ai-model", "fonte_id": "axios", "data_pub": "2026-10-08T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI apresentou recentemente 722 novos trabalhos matemáticos gerados por um modelo de inteligência artificial poderoso, indicando que avanços significativos na IA podem se estender a campos completamente novos. Este feito sugere que a IA está prestes a conquistar áreas como a matemática, além de já ter dominado a programação de computadores.", "titulo_pt": "Pela matemática: avanço da IA de openai", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 202420, "titulo": "Data centers face a sweeping new power regime", "url": "https://www.axios.com/2026/10/08/data-centers-power-regime", "fonte_id": "axios", "data_pub": "2026-10-08T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Congressistas estão considerando obrigar centrais de dados a assumir novos custos e restrições, ao mesmo tempo em que aceleram a infraestrutura de energia necessária para apoiar o boom de inteligência artificial. Esta proposta faz parte de uma legislação mais ampla do Senado para acelerar a concessão de permissões de energia, mas as medidas específicas para centrais de dados são significativas e ultrapassam as abordagens voluntárias até agora adotadas pelo governo federal.", "titulo_pt": "Lei propõe novo regime de energia para centrais de dados", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 202645, "titulo": "A Scientist Working on the ‘IceCube’ Neutrino Detector Explains the Nobel Prize–Winning Technology", "url": "https://www.wired.com/story/a-scientist-working-on-the-icecube-neutrino-detector-explains-the-nobel-prize-winning-technology/", "fonte_id": "wired", "data_pub": "2026-10-08T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Detectar um neutrino é comparado a procurar uma agulha em um palheiro, explica Juan Carlos Díaz Vélez, cientista que trabalha no detector de neutrinos 'IceCube'. O detector está localizado sob o gelo antártico e busca partículas cósmicas.", "titulo_pt": "Cientista que trabalha no 'IceCube' explica a tecnologia premiada pelo Nobel", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 202582, "titulo": "Japan and cybersecurity: What’s behind recent attacks and what’s being done?", "url": "https://www.japantimes.co.jp/business/2026/10/08/tech/focus-japan-data-leak/", "fonte_id": "japan_times", "data_pub": "2026-10-08T09:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Com a inteligência artificial removendo obstáculos para hackers potenciais, especialistas alertam que as ameaças de segurança cibernética estão se tornando mais sofisticadas e amplas.", "titulo_pt": "Japão e cibersegurança: o que está por trás dos recentes ataques e o que está sendo feito?", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 202224, "titulo": "IA: los usos que nadie quiere", "url": "https://www.lanacion.com.ar/sociedad/ia-los-usos-que-nadie-quiere-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A assistente principal da UNESCO sobre cidadania digital sugere que a inteligência artificial está sendo utilizada de maneiras que ninguém deseja.", "titulo_pt": "IA: os usos que ninguém quer", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 202632, "titulo": "AI breakthroughs in robotics won’t change your life any time soon", "url": "https://www.technologyreview.com/2026/10/08/1145923/ai-breakthroughs-in-robotics-wont-change-your-life-any-time-soon/", "fonte_id": "mit_tech_review", "data_pub": "2026-10-08T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um robô humanoide, branco com cabeça e torso pretos, tem aparecido em feeds de vídeo. Talvez você tenha visto ele dançar ou executar outras ações.", "titulo_pt": "Avanços em robótica com IA não vão mudar sua vida no curto prazo", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 202646, "titulo": "The Man Behind a West Bank Telegram Channel Trying to Keep Palestinian Drivers Safe", "url": "https://www.wired.com/story/the-man-behind-a-west-bank-telegram-channel-trying-to-keep-palestinian-drivers-safe/", "fonte_id": "wired", "data_pub": "2026-10-08T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anas Hattab criou um grupo no Telegram para auxiliar a navegação em Jerusalém Ocidental, uma área sem aplicativos de mapeamento precisos. Agora, quase 350.000 palestinos dependem dele para se orientar no Território Ocidental ocupado.", "titulo_pt": "O homem por trás de um canal do Telegram no vale do cisjordânia que ajuda motoristas palestinos", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 202469, "titulo": "Elon Musk blames Indian 'oligarchs' for stalling Starlink launch", "url": "https://www.cnbc.com/2026/10/08/elon-musk-starlink-spacex-jio-airtel-india.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-08T08:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Elon Musk acusa oligarcas indianos de estar impedindo o lançamento do Starlink no país para proteger seu monopólio sobre os consumidores.", "titulo_pt": "Musk culpa oligarcas indianos pelo atraso no lançamento do Starlink", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 202678, "titulo": "(LEAD) Defense chief discusses shipbuilding cooperation with U.S. senator", "url": "https://en.yna.co.kr/view/AEN20261008004951315", "fonte_id": "yonhap_news", "data_pub": "2026-10-08T08:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministro da Defesa da Coreia do Sul, Kang Shin-chul, se reuniu com um senador dos Estados Unidos em 8 de outubro. A discussão focou em cooperação na construção de navios.", "titulo_pt": "Ministro de defesa sul-coreano se reúne com senador americano para discutir cooperação na construção de navios", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 202584, "titulo": "Nomura and Daiwa CEOs flag risk that AI may spoil stock market rally", "url": "https://www.japantimes.co.jp/business/2026/10/08/markets/japan-nomura-daiwa-raise-ai-risk/", "fonte_id": "japan_times", "data_pub": "2026-10-08T08:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os presidentes das duas maiores empresas de corretagem de títulos do Japão alertaram para o risco de que a inteligência artificial possa interromper a recuperação do mercado acionário. Eles também projetam que o índice Nikkei atinja 80.000 pontos neste ano ou no próximo.", "titulo_pt": "CEOs das duas maiores empresas de corretagem do Japão alertam sobre risco de AI interromper recuperação do mercado acionário", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 202633, "titulo": "Building a safer path to autonomous industrial AI", "url": "https://www.technologyreview.com/2026/10/08/1144020/building-a-safer-path-to-autonomous-industrial-ai/", "fonte_id": "mit_tech_review", "data_pub": "2026-10-08T08:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial industrial está entrando em uma nova fase, permitindo a automação de tarefas mais complexas em ambientes industriais graças a avanços em modelos de base, IA física e IA agente. Diferentemente da IA que opera apenas no mundo digital, a IA industrial pode interagir diretamente com sistemas físicos.", "titulo_pt": "Construindo um caminho mais seguro para a IA autônoma industrial", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 202250, "titulo": "Científicos encuentran un compuesto natural que ayuda a sanar el intestino", "url": "https://www.latercera.com/tendencias/noticia/cientificos-encuentran-un-compuesto-natural-que-ayuda-a-sanar-el-intestino/", "fonte_id": "la_tercera", "data_pub": "2026-10-08T09:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo identificou a urolitina A, um composto produzido pela microbiota intestinal, como potencial tratamento para proteger a mucosa e tratar a Enterite Inflamatória Crônica (EIC). Os alimentos que ajudam na geração desta substância foram identificados.", "titulo_pt": "Cientistas descobrem composto natural que pode ajudar na cura do intestino", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 202043, "titulo": "Cientistas mapeiam possível segredo da longevidade de Jonathan, tartaruga de 194 anos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/cientistas-mapeiam-possivel-segredo-da-longevidade-de-jonathan-tartaruga-de-194-anos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-08T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas identificaram marcadores genéticos associados ao envelhecimento em Jonathan, uma tartaruga de 194 anos, mas notaram que áreas importantes de seu DNA mantêm uma baixa 'desordem', semelhante a de indivíduos jovens. Isso pode explicar parte da sua longevidade.", "titulo_pt": "Cientistas descobrem possíveis segredos da longevidade de Jonathan, tartaruga de 194 anos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 202719, "titulo": "STAT+: Dozens of Democrats vie for slots on key House health committees", "url": "https://www.statnews.com/2026/10/08/midterm-election-democrats-vie-for-roles-house-health-care-committees/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-08T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitos democratas concorrem para ocupar vagas em importantes comitês de saúde da Câmara dos Representantes após as eleições de meados de mandato. Esses comitês poderão ter muitos novos membros após o pleito.", "titulo_pt": "Muitos democratas disputam vagas em comitês de saúde-chave da câmara", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 202720, "titulo": "Opinion: How CMS plans to fix a major flaw in the 340B drug discount program", "url": "https://www.statnews.com/2026/10/08/340b-drug-discount-program-cms-reform-proposal/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-08T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um líder do HHS escreveu que um pequeno desconto bem-intencionado para hospitais de segurança de redes se transformou em uma significativa subvenção institucional com consequências imprevistas e caras.", "titulo_pt": "Opinião: como o CMS planeja corrigir uma falha importante no programa de descontos de medicamentos 340B", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 202721, "titulo": "Opinion: England and other nations are on the path toward eliminating hepatitis C. Why not the U.S.?", "url": "https://www.statnews.com/2026/10/08/us-hepatitis-c-cure-medication-cost-elimination/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-08T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A eliminação do vírus da hepatite C é possível, de acordo com especialistas, se os Estados Unidos investirem seriamente nessa causa.", "titulo_pt": "Opinião: inglaterra e outros países estão no caminho para eliminar a hepatite C. Por que os estados unidos não fazem o mesmo?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 202722, "titulo": "STAT+: Why this startup is taking its AI to predict breast cancer risk directly to patients", "url": "https://www.statnews.com/2026/10/08/why-clairity-took-breast-cancer-risk-prediction-ai-directly-to-patients/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-08T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma startup está lançando sua tecnologia de previsão de risco de câncer de mama por inteligência artificial diretamente aos pacientes, sem esperar pela adoção por parte de médicos e seguradoras.", "titulo_pt": "Por que essa startup está levando sua IA para prever o risco de câncer de mama diretamente aos pacientes", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 202723, "titulo": "Breast cancer can behave differently in older women. This physician is making more tailored treatments a reality", "url": "https://www.statnews.com/2026/10/08/breast-cancer-research-older-women-neil-carleton-stat-wunderkind/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-08T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há evidências crescentes de que mulheres mais velhas com câncer de mama podem se beneficiar de tratamentos mais personalizados. O médico Neil Carleton está trabalhando para implementar esse tipo de abordagem.", "titulo_pt": "Câncer de mama em mulheres mais velhas pode beneficiar de tratamentos mais personalizados, afirma médico", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 202724, "titulo": "A mother-daughter quest to find fellow members of an ultra-rare genetic community", "url": "https://www.statnews.com/2026/10/08/rare-disease-nicolaides-baraitser-syndrome-history-ncbrs-researchers/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-08T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mãe e sua filha buscam membros de uma comunidade genética extremamente rara. O pediatra genetista advertiu para não pesquisar online, o que elas descobriram que seria impossível de resistir por cinco anos.", "titulo_pt": "Uma busca materno-filial por membros de uma comunidade genética ultra-rara", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 202618, "titulo": "Chinese team says its all-in-one mini artificial pancreas offers next-gen diabetes care", "url": "https://www.scmp.com/news/china/science/article/3370145/chinese-team-says-its-all-one-mini-artificial-pancreas-offers-next-gen-diabetes-care?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-08T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas chineses desenvolveram um dispositivo portátil que combina um sensor de glicose e uma bomba de insulina microscópica, pretendendo criar um pâncreas artificial miniaturizado autônomo, embora ainda em fase experimental com ratos. Diferentemente dos sistemas comerciais atuais, que exigem que os pacientes usem duas patches separados, o novo protótipo une ambas as funções em um único dispositivo do tamanho de uma moeda.", "titulo_pt": "Equipe chinesa desenvolve dispositivo miniatura para diabetes", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 202044, "titulo": "Ciência de ponta precisa se unir à sabedoria ancestral, diz Marcelo Gleiser na CasaFolha", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/ciencia-de-ponta-precisa-se-unir-a-sabedoria-ancestral-diz-marcelo-gleiser-na-casafolha.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-08T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O astrônomo Marcelo Gleiser identifica um 'paradoxo existencial' na relação materialista da humanidade com a Terra. Ele acredita que a ciência de ponta precisa se unir à sabedoria ancestral.", "titulo_pt": "Ciência de ponta precisa se unir à sabedoria ancestral, diz Marcelo Gleiser", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 202045, "titulo": "Cientistas em Viena e Pequim criam os primeiros relógios nucleares do mundo", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/cientistas-em-viena-e-pequim-criam-os-primeiros-relogios-nucleares-do-mundo.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-08T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dois grupos de cientistas, um em Viena e outro em Pequim, criaram os primeiros relógios nucleares do mundo. Esses dispositivos representam um avanço na medição do tempo e podem ter aplicações práticas e potencial para investigações em física fundamental.", "titulo_pt": "Cientistas de Viena e Pequim criam os primeiros relógios nucleares do mundo", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 202593, "titulo": "Nobel winner Kenso Soai says he understood the significance of his research", "url": "https://www.japantimes.co.jp/news/2026/10/08/japan/science-health/kenso-soai-research-significance/", "fonte_id": "japan_times", "data_pub": "2026-10-08T05:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O cientista japonês Kenso Soai afirmou que, embora possa soar arrogante, ele acreditava que não receberia reclamações se vencesse o prêmio.", "titulo_pt": "Ganhador do nobel Kenso Soai diz que entendeu a importância de sua pesquisa", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 202756, "titulo": "APOD: 2026 October 8 – The Saturn System Smörgåsbord", "url": "https://science.nasa.gov/image-article/apod-2026-october-8-the-saturn-system-smorgasbord/", "fonte_id": "nasa_news", "data_pub": "2026-10-08T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia do APOD em 8 de outubro de 2026 mostra o sistema de Saturno, exibindo uma variedade de elementos astronômicos. A imagem destaca diferentes aspectos do planeta e seus anéis e satélites.", "titulo_pt": "APOD: 8 de outubro de 2026 – banquete de saturno", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 202757, "titulo": "Fighting Drought in Texas Cotton Country", "url": "https://science.nasa.gov/earth/earth-observatory/fighting-drought-in-texas-cotton-country/", "fonte_id": "nasa_news", "data_pub": "2026-10-08T04:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os cientistas da NASA conversaram com agricultores no Texas High Plains sobre a seca e o agravamento da aquifera.", "titulo_pt": "Lutando contra a seca na região de cultivo de algodão do Texas", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 200889, "titulo": "Impacto da IA na matemática ainda gera mais perguntas que respostas, segundo especialistas", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/impacto-da-ia-na-matematica-ainda-gera-mais-perguntas-que-respostas-segundo-especialistas.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-07T22:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O impacto da inteligência artificial na matemática ainda gera mais perguntas do que respostas, de acordo com especialistas. Apesar do avanço das ferramentas de IA, há preocupações sobre o treinamento de futuros pesquisadores e a possibilidade de aumentar as desigualdades no campo da matemática.", "titulo_pt": "Impacto da IA na matemática ainda gera mais perguntas que respostas, segundo especialistas", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 200890, "titulo": "Vinho em cuba, talidomida e nanomateriais mostram importância do Nobel de Química de 2026", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/vinho-em-cuba-talidomida-e-nanomateriais-mostram-importancia-do-nobel-de-quimica-de-2026.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-07T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Nobel de Química de 2026 foi inspirado por uma cuba de vinho. Uma substância gerada durante o processo de produção de vinho levou a descobertas que resultaram no prêmio, mais de 170 anos depois.", "titulo_pt": "Vinho em cuba, talidomida e nanomateriais mostram importância do Nobel de Química de 2026", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 202761, "titulo": "Metal Twill chair by Gibson Karlo for Design By Them", "url": "https://www.dezeen.com/2026/10/08/metal-twill-chair-gibson-karlo-design-by-them-dezeen-showroom/", "fonte_id": "dezeen", "data_pub": "2026-10-08T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A estúdio australiano Gibson Karlo criou uma versão metálica do seu assento Twill para a marca de móveis Design By Them, mantendo o aspecto plástico maleável do produto original. Os designers Sarah Gibson e Nicholas Karlovasitis se inspiraram na aparência nostálgica de uma caixa recém-aberta de plástico maleável ao desenvolver a versão de madeira do assento.", "titulo_pt": "Cadeira Twill em metal da Gibson Karlo para Design By Them", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 202780, "titulo": "On Hannah Arendt and Mary McCarthy’s Decades-Long Friendship", "url": "https://lithub.com/on-hannah-arendt-and-mary-mccarthys-decades-long-friendship/", "fonte_id": "lithub", "data_pub": "2026-10-08T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A correspondência publicada de Hannah Arendt sugere que sua rede de amigos era composta principalmente por homens, incluindo Martin Heidegger, Karl Jaspers e Heinrich Blücher. Este texto discute a longa amizade entre Hannah Arendt e Mary McCarthy.", "titulo_pt": "Sobre a decênios-longa amizade entre Hannah Arendt e Mary McCarthy", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 202781, "titulo": "It Begins On the Page: How Relationships Between Readers and Writers Are Made", "url": "https://lithub.com/it-begins-on-the-page-how-relationships-between-readers-and-writers-are-made/", "fonte_id": "lithub", "data_pub": "2026-10-08T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O livro discute a relação entre leitores e autores, argumentando que a literatura não é geralmente percebida como uma conversa entre os envolvidos. Os profissionais de publicação frequentemente visam atrair os leitores para vender seus livros, oferecendo uma experiência cultural agradável ou enriquecedora.", "titulo_pt": "Inicia-se na página: como relações entre leitores e autores são estabelecidas", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 202782, "titulo": "Am I the Asshole For Ordering a Book at My Local Indie and Just… Not Picking It Up?", "url": "https://lithub.com/am-i-the-asshole-for-ordering-a-book-at-my-local-indie-and-just-not-picking-it-up/", "fonte_id": "lithub", "data_pub": "2026-10-08T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Am I the Literary Asshole? é uma coluna bimestral que oferece conselhos sobre situações relacionadas a livros, especialmente aquelas que podem ser consideradas antiéticas ou questionáveis. A coluna aborda situações em que os leitores podem se sentir incômodos ou culpados, como quando pedem um livro em uma livraria independente e não o levantam.", "titulo_pt": "Sou o Asshole por pedir um livro na minha livraria independente e não pega-lo?", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 202783, "titulo": "How an Army Librarian Brought the Joy of Reading to the Front Lines", "url": "https://lithub.com/how-an-army-librarian-brought-the-joy-of-reading-to-the-front-lines/", "fonte_id": "lithub", "data_pub": "2026-10-08T09:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em setembro de 1942, o bibliotecário militar Ray Trautman chegou à Austrália durante uma viagem global para avaliar as necessidades de leitura dos militares locais. Sua missão era identificar os principais requisitos de material literário para os soldados.", "titulo_pt": "Como um bibliotecário militar trouxe a alegria da leitura para as linhas de frente", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 202029, "titulo": "Daniel Vorcaro negocia entrevista exclusiva sobre o caso Master com Globo e Record", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/10/daniel-vorcaro-negocia-entrevista-exclusiva-sobre-o-caso-master-com-globo-e-record.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-08T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Daniel Vorcaro, preso desde março no 19º Batalhão da Polícia Militar do Distrito Federal, está negociando uma entrevista exclusiva sobre o caso do Banco Master com as emissoras Globo e Record.", "titulo_pt": "Daniel Vorcaro negocia entrevista exclusiva sobre o caso Master com Globo e Record", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 202226, "titulo": "Librería top", "url": "https://www.lanacion.com.ar/opinion/libreria-top-nid08102026-2/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A livraria é destacada como uma das melhores no mercado, com uma ampla variedade de livros e um excelente serviço ao cliente.", "titulo_pt": "Livraria líder", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 202227, "titulo": "Los Pericos: del encuentro casual que dio origen al grupo a la situación molesta que lograron superar", "url": "https://www.lanacion.com.ar/espectaculos/musica/los-pericos-del-encuentro-casual-que-dio-origen-al-grupo-a-la-situacion-molesta-que-lograron-superar-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Juanchi Baleirón e Ariel 'Topo' Raiman revisitam momentos da rica história do grupo que completará 40 anos em 22 de outubro. Eles se apresentarão no Gran Rex nessa data.", "titulo_pt": "Os Pericos: do encontro casual que originou o grupo à situação incômoda que superaram", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 202252, "titulo": "De Elvira Hernández a Charly García: las novedades de la Primavera del Libro 2026 en la Estación Mapocho", "url": "https://www.latercera.com/culto/noticia/de-elvira-hernandez-a-charly-garcia-las-novedades-de-la-primavera-del-libro-2026-en-la-estacion-mapocho/", "fonte_id": "la_tercera", "data_pub": "2026-10-08T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O principal encontro de edição independente chilena comemora 15 anos de existência de 9 a 11 de outubro. Editores e editoras apresentam novidades e lançamentos que marcarão o segundo semestre.", "titulo_pt": "De Elvira Hernández a Charly García: as novidades da Primavera do livro pan Times", "pais": "Japão", "classe": "A"}, {"id": 202030, "titulo": "Memorável, 'Control Resonant' reforça caráter inventivo da Remedy", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/memoravel-control-resonant-reforca-carater-inventivo-da-remedy.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-08T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O jogo 'Control Resonant', desenvolvido pela Remedy, mantém o estilo inovador da empresa, conhecida por seus visuais marcantes e tramas sombrias. Este título reforça a posição da Remedy entre os grandes nomes do setor de jogos.", "titulo_pt": "Memorável, 'Control Resonant' reforça o caráter inventivo da Remedy", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 202031, "titulo": "Sem cenas gravadas, Globo levará atores para vender 'Avenida Brasil 2' ao mercado publicitário", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/10/sem-cenas-gravadas-globo-levara-atores-para-vender-avenida-brasil-2-ao-mercado-publicitario.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-08T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A segunda temporada de 'Avenida Brasil' será a principal atração do Upfront 2027, evento da Globo para vender suas atrações ao mercado publicitário, que ocorrerá em São Paulo na próxima quarta-feira (14).", "titulo_pt": "Globo levará atores de 'Avenida Brasil 2' para vender a série ao mercado publicitário", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 202767, "titulo": "‘The weirdos were taking over!’ Tate Britain relives the 1990s – in pictures", "url": "https://www.theguardian.com/artanddesign/gallery/2026/oct/08/tate-britain-the-90s-art-fashion-in-pictures-edward-enniful", "fonte_id": "guardian_culture", "data_pub": "2026-10-08T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova exposição, curada por Edward Enniful, revisitando o fascinante decênio dos anos 1990, quando arte, música e moda se misturaram de forma intensa. A Tate Britain está exibindo esses elementos em retrospecto.", "titulo_pt": "‘Os estranhos estavam tomando conta!’ Tate Britain relembra os anos 1990 – em imagens", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 202768, "titulo": "TV tonight: has Richard E Grant blown it in The Celebrity Traitors?", "url": "https://www.theguardian.com/tv-and-radio/2026/oct/08/tv-tonight-has-richard-e-grant-blown-it-in-the-celebrity-traitors", "fonte_id": "guardian_culture", "data_pub": "2026-10-08T05:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O jogo está em andamento, e será revelado o primeiro celebridade a ser banida. Richard E Grant pode ser o traidor, mas o que é mais interessante é que não se sabe qual será a próxima surpresa.", "titulo_pt": "TV desta noite: Richard E Grant pode ter se traído em The Celebrity Traitors?", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 202091, "titulo": "\"Faculdade do PCC\": célula espionava polícia e ditava sentenças em Brasília", "url": "https://www.metropoles.com/distrito-federal/na-mira/faculdade-do-pcc-celula-espionava-policia-e-ditava-sentencas-em-brasilia", "fonte_id": "metropoles", "data_pub": "2026-10-08T09:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A operação Jubilados cumpriu 48 mandados judiciais em Brasília, Goiás e São Paulo, atingindo alvos estratégicos e interrompendo o avanço de células do PCC. A operação revelou que uma faculdade estava sendo usada como célula do PCC para espionar a polícia e ditar sentenças em Brasília.", "titulo_pt": "Faculdade do PCC: célula espionava polícia e ditava sentenças em Brasília", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 202611, "titulo": "Hong Kong child abuse case prompts calls to watch for signs of psychological harm", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3370183/hong-kong-child-abuse-case-prompts-calls-watch-signs-psychological-harm?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-08T09:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos em assistência social de Hong Kong alertaram que o abuso psicológico é difícil de detectar. Organizações de assistência social chamam atenção para sinais sutis de abuso emocional e verbal, como mudanças sociais e ansiedade, em meio a indignação sobre um vídeo viral mostrando uma menina carregando sacolas de cerveja enquanto seu padrasto a chamava de 'inútil'.", "titulo_pt": "Caso de abuso infantil em hong Kong gera chamado para prestar atenção em sinais de danos psicológicos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 202228, "titulo": "Basta de zoológicos", "url": "https://www.lanacion.com.ar/cultura/basta-de-zoologicos-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo critica a existência de zoológicos, argumentando que eles não são necessários e podem ser substituídos por alternativas mais éticas. O título traduzido para o português brasileiro é 'Basta de zoológicos'.", "titulo_pt": "Basta de zoológicos", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 202242, "titulo": "Caminho para sistema de saúde sustentável passa por acesso, ciência e novas parcerias", "url": "https://www.jota.info/opiniao-e-analise/artigos/caminho-para-sistema-de-saude-sustentavel-passa-por-acesso-ciencia-e-novas-parcerias", "fonte_id": "jota", "data_pub": "2026-10-08T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Investir em prevenção e estabelecer acordos de compartilhamento de risco podem contribuir para tornar o sistema de saúde mais eficiente. O caminho para um sistema de saúde sustentável passa por melhor acesso, avanços científicos e novas parcerias.", "titulo_pt": "Caminho para sistema de saúde sustentável passa por acesso, ciência e novas parcerias", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 202485, "titulo": "‘Adios Maricarmen’: Hundreds protest in Madrid after pensioner’s death", "url": "https://www.euronews.com/video/2026/10/08/adios-maricarmen-hundreds-protest-in-madrid-after-pensioners-death", "fonte_id": "euronews", "data_pub": "2026-10-08T06:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Centenas de pessoas se manifestaram perto do parlamento de Espanha em Madri para homenagear a pensionista Maricarmen Abascal, que foi despejada, e exigirem ações sobre a crise imobiliária do país.", "titulo_pt": "Adeus Maricarmen: centenas protestam em madri após morte da pensionista", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 202359, "titulo": "Thursday briefing: Why young people are taking to the streets across France", "url": "https://www.theguardian.com/world/2026/oct/08/thursday-briefing-why-young-people-are-taking-to-the-streets-across-france", "fonte_id": "guardian_world", "data_pub": "2026-10-08T05:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um movimento liderado por jovens está protestando contra edifícios escolares em ruínas e escassez de professores, além de chamar a atenção para desigualdades educacionais mais amplas. Em Paris, milhares de jovens e adultos estão nas ruas em protesto, com mais greves programadas.", "titulo_pt": "Boletim de hoje: por que jovens estão ocupando as ruas na França", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 202602, "titulo": "Spanish woman whose eviction sparked mass housing protests dies weeks later", "url": "https://www.japantimes.co.jp/news/2026/10/08/world/society/spanish-woman-eviction-protests-dead/", "fonte_id": "japan_times", "data_pub": "2026-10-08T03:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Maricarmen Abascal, de 87 anos, faleceu após ser expulsa de sua residência há mais de 70 anos, o que gerou protestos de moradores em massa. Ela estava internada em um hospital por causa de ansiedade severa e exaustão.", "titulo_pt": "Mulher espanhola cuja expulsão acendeu protestos de moradores morre após semanas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 202442, "titulo": "French high school protests: 'Young people are not fooled by the discrimination and contempt that society directs at them'", "url": "https://www.lemonde.fr/en/campus/article/2026/10/08/french-high-school-protests-young-people-are-not-fooled-by-the-discrimination-and-contempt-that-society-directs-at-them_6758374_11.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-08T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A socióloga e psiquiatra infantil Laelia Benoit analisa o discurso sobre as manifestações de estudantes de escolas secundárias francesas através do conceito de 'childism', que se refere aos preconceitos contra menores baseados em sua idade.", "titulo_pt": "Jovens não são enganados pela discriminação e desprezo que a sociedade direciona a eles, analisa socióloga", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 201701, "titulo": "Groups urge ministry to expand menstrual leave", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/08/2003865602", "fonte_id": "taipei_times", "data_pub": "2026-10-08T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grupos estão pedindo ao ministério que amplie o período de licença menstrual. Atualmente, não está claro quais são as reivindicações específicas dos grupos envolvidos.", "titulo_pt": "Grupos pressionam ministério para ampliar licença menstrual", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 201124, "titulo": "Homem invade casa, agride idoso é preso pela PCGO no Entorno do DF", "url": "https://www.metropoles.com/distrito-federal/homem-invade-casa-agride-idoso-e-preso-pela-pcgo-no-entorno-do-df", "fonte_id": "metropoles", "data_pub": "2026-10-07T23:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem invadiu uma casa, agrediu uma vítima de 75 anos, danificou o carro dela e desobedeceu ordens policiais. O suspeito já tem antecedentes por roubo e homicídio e foi preso pela PCGO no Entorno do DF.", "titulo_pt": "Homem invade casa, agride idoso e é preso pela PCGO no Entorno do DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 201026, "titulo": "Morre idosa que virou símbolo da crise habitacional na Espanha", "url": "https://www.poder360.com.br/poder-internacional/morre-idosa-que-virou-simbolo-da-crise-habitacional-na-espanha/", "fonte_id": "poder360", "data_pub": "2026-10-07T22:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Maricarmen Abascal, uma idosa que se tornou símbolo da crise habitacional na Espanha, faleceu após ser despejada. Ela estava internada desde o ocorrido, mas a causa exata da morte não foi divulgada.", "titulo_pt": "Morre idosa símbolo da crise habitacional na Espanha", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 201144, "titulo": "Morre idosa que foi despejada e se tornou símbolo dos protestos na Espanha", "url": "https://www.cnnbrasil.com.br/internacional/morre-idosa-que-foi-despejada-e-se-tornou-simbolo-dos-protestos-na-espanha/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-07T22:52:00Z", "idioma": "pt", "provavel_duplicata_de": 201020, "texto_pt": "Maricarmen Abascal, uma idosa de 87 anos, faleceu após ser despejada de sua residência há sete décadas em Madri, Espanha. A ação gerou protestos contra a crise habitacional na cidade.", "titulo_pt": "Morre idosa despejada e se torna símbolo dos protestos na Espanha", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 201127, "titulo": "Policiais são presos acusados de fazer acordo milionário com membro do PCC", "url": "https://www.metropoles.com/sao-paulo/policiais-sao-presos-acusados-de-fazer-acordo-milionario-com-membro-do-pcc", "fonte_id": "metropoles", "data_pub": "2026-10-07T22:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Policiais foram presos acusados de terem aceitado um acordo de R$ 1 milhão para interromper um inquérito que revelaria mais nomes do PCC.", "titulo_pt": "Policiais são presos acusados de fazer acordo milionário com membro do PCC", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 201273, "titulo": "“Es insólito haber llegado a este punto”: los rectores universitarios convocaron desde el Cabildo a la Quinta Marcha Federal", "url": "https://www.lanacion.com.ar/sociedad/es-insolito-haber-llegado-a-este-punto-los-rectores-universitarios-convocaron-desde-el-cabildo-a-la-nid07102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-07T22:46:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Rectores universitários convocaram para a Quinta Marcha Federal a partir do Cabildo. Isso ocorre 24 horas antes do julgamento que declarou inconstitucional o decreto de Milei que suspendeu a aplicação da lei de financiamento universitário.", "titulo_pt": "É insólito chegar a este ponto: rectores convocam para a Quinta Marcha Federal", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 201275, "titulo": "Murió Maricarmen, la anciana inquilina desalojada en Madrid: los datos de un problema que crece cada vez más en la Argentina", "url": "https://www.lanacion.com.ar/propiedades/casas-y-departamentos/murio-maricarmen-la-anciana-inquilina-desalojada-en-madrid-como-su-caso-refleja-un-problema-que-nid07102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-07T22:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Maricarmen, uma inquilina de 87 anos desalojada em Madrid por não conseguir pagar o aluguel integral, reflete uma situação crescente entre os aposentados na Argentina. O caso mostra como o problema de desalojamento de idosos por questões financeiras é uma realidade no país.", "titulo_pt": "Morreu Maricarmen, a idosa inquilina desalojada em Madrid: os detalhes de um problema que aumenta cada vez mais no Brasil", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 201261, "titulo": "Gobierno recorta $34 mil millones en siete programas de ayuda a infancia vulnerable, niños en proceso de adopción y recién nacidos", "url": "https://www.ciperchile.cl/2026/10/07/gobierno-recorta-34-mil-millones-en-siete-programas-de-ayuda-a-infancia-vulnerable-ninos-en-proceso-de-adopcion-y-recien-nacidos/?utm_source=rss&utm_medium=rss&utm_campaign=gobierno-recorta-34-mil-millones-en-siete-programas-de-ayuda-a-infancia-vulnerable-ninos-en-proceso-de-adopcion-y-recien-nacidos", "fonte_id": "ciper_chile", "data_pub": "2026-10-07T22:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo cortou R$ 34 milhões em sete programas que auxiliam crianças vulneráveis, crianças em processo de adoção e recém-nascidos. Este corte foi anunciado recentemente.", "titulo_pt": "Governo corta r$ 34 milhões em sete programas de assistência a crianças vulneráveis, em processo de adoção e recém-nascidas", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 202479, "titulo": "Dry wells and shrinking water holes as drought grips Sri Lanka", "url": "https://www.euronews.com/video/2026/10/08/dry-wells-and-shrinking-water-holes-as-drought-grips-sri-lanka", "fonte_id": "euronews", "data_pub": "2026-10-08T09:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O prolongado período de seca no centro da Sri Lanka está deixando poços secos, prejudicando os meios de subsistência dos agricultores e empurrando a vida selvagem a se aglomerar em poças d'água cada vez menores.", "titulo_pt": "Poços secos e poças d'água encolhendo à medida que a seca atinge o centro da Sri Lanka", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 202099, "titulo": "Crianças sofrerão impacto \"desproporcional\" do El Niño, alerta Unicef", "url": "https://www.metropoles.com/saude/criancas-sofrerao-impacto-desproporcional-do-el-nino-alerta-unicef", "fonte_id": "metropoles", "data_pub": "2026-10-08T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Unicef alerta que as crianças serão impactadas de forma 'desproporcional' pelo El Niño, devido à sua vulnerabilidade em face das mudanças climáticas urgentes.", "titulo_pt": "Crianças sofrerão impacto 'desproporcional' do El Niño, alerta Unicef", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 202129, "titulo": "Dia das Crianças 2026 deve movimentar R$ 9,27 bi no comércio brasileiro", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/dia-das-criancas-2026-deve-movimentar-r-927-bi-no-comercio-brasileiro/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T08:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As vendas do varejo durante o Dia das Crianças 2026 devem atingir R$ 9,27 bilhões, sendo as maiores desde 2014. Brinquedos são os itens mais procurados, enquanto o vestuário perdeu destaque nas intenções de compra.", "titulo_pt": "Dia das Crianças 2026 deve movimentar R$ 9,27 bi no comércio brasileiro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 202101, "titulo": "Clima: Sul, Sudeste e Centro-Oeste enfrentam chuvas; interior tem calorão", "url": "https://www.metropoles.com/brasil/clima-sul-sudeste-e-centro-oeste-enfrentam-chuvas-interior-tem-calorao", "fonte_id": "metropoles", "data_pub": "2026-10-08T08:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sistemas frontais e corredores de umidade estão causando chuvas expressivas no Sul, Sudeste e Centro-Oeste. O interior dessas regiões, por outro lado, está enfrentando um calor intenso.", "titulo_pt": "Clima: sul, Sudeste e Centro-Oeste enfrentam chuvas; interior tem calorão", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 202526, "titulo": "‘Nature can recover’: Inside the race to rescue world’s crisis-hit wildlife", "url": "https://www.aljazeera.com/features/2026/10/8/nature-can-recover-inside-the-race-to-rescue-worlds-crisis-hit-wildlife?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-08T08:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Conservação de vida selvagem está tendo sucesso em meio à queda de 73% na população de animais selvagens, trazendo esperança para o mundo natural em crise.", "titulo_pt": "Ainda há esperança: a corrida para resgatar a vida selvagem em crise", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 202597, "titulo": "Populations of wild species fell by an average of 73% from 1970 to 2022, WWF says", "url": "https://www.japantimes.co.jp/environment/2026/10/08/wildlife/wildlife-population-fall-survey/", "fonte_id": "japan_times", "data_pub": "2026-10-08T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De 1970 a 2022, as populações de espécies silvestres diminuíram em média 73%. O relatório Living Planet 2026 estima que, ao longo de 52 anos, as populações globais caíram em torno de 2,5% por ano.", "titulo_pt": "População de espécies silvestres caiu em média 73% entre 1970 e 2022, diz WWF", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 202571, "titulo": "Real men don’t do climate change", "url": "https://www.ft.com/content/61118fd6-b5d2-4ce1-9a78-4535a0ef3ead?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-08T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos sobre as diferenças de gênero na percepção do aquecimento global indicam que campanhas e comunicações sobre o tema podem precisar ser reconsideradas.", "titulo_pt": "Homens reais não fazem mudanças climáticas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 202268, "titulo": "Rusia descarta “riesgo epidémico” por supuesto caso de peste neumónica en Siberia", "url": "https://www.latercera.com/mundo/noticia/rusia-descarta-riesgo-epidemico-por-supuesto-caso-de-peste-neumonica-en-siberia/", "fonte_id": "la_tercera", "data_pub": "2026-10-08T00:42:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A agência federal rusa de saúde, Rospotrebnadzor, informou que mais de 90% das pessoas que tiveram contato com a mulher que faleceu em Siberia não apresentaram sinais de doença infecciosa. Não há risco epidêmico de peste neumônica, segundo a agência.", "titulo_pt": "Rússia descarta 'risco epidêmico' por suposto caso de peste neumônica em sibéria", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 202245, "titulo": "Apenas 2% dos investimentos climáticos vão para a saúde, diz presidente do Hospital Israelita Albert Einstein", "url": "https://www.jota.info/coberturas-especiais/jota-global/apenas-2-dos-investimentos-climaticos-vao-para-a-saude-diz-presidente-do-hospital-israelita-albert-einstein", "fonte_id": "jota", "data_pub": "2026-10-07T23:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Hospital Israelita Albert Einstein, Sidney Klajner, discutiu os impactos das mudanças climáticas na saúde e a necessidade de mais dados durante um painel no JOTA Global em Nova York. Apenas 2% dos investimentos climáticos são direcionados para a saúde.", "titulo_pt": "Apenas 2% dos investimentos climáticos são destinados à saúde, afirma presidente do Hospital Israelita Albert Einstein", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 201319, "titulo": "¿Cuántas reservas de emergencia de petróleo les quedan a los países de la AIE?", "url": "https://www.latercera.com/pulso/noticia/cuantas-reservas-de-emergencia-de-petroleo-les-quedan-a-los-paises-de-la-aie/", "fonte_id": "la_tercera", "data_pub": "2026-10-07T22:57:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os governos do organismo respaldaram a conclusão rápida da entrega de reservas de petróleo comprometida em março devido à crise do Estreito de Ormuz, priorizando o diésel.", "titulo_pt": "Quantas reservas de emergência de petróleo os países da AIE ainda têm?", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 201010, "titulo": "Maior colônia de pinguins do mundo perde posto após declínio populacional", "url": "https://veja.abril.com.br/mundo/maior-colonia-de-pinguins-do-mundo-perde-posto-apos-declinio-populacional/", "fonte_id": "veja", "data_pub": "2026-10-07T22:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores observaram uma diminuição significativa da população de pinguins-de-barbicha nas Ilhas Sandwich do Sul, com uma perda de mais de meio milhão desses animais. Como resultado, essa colônia perdeu o título de maior colônia mundial de pinguins.", "titulo_pt": "Maior colônia de pinguins do mundo perde posto após declínio populacional", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 201572, "titulo": "Southern right whales return to South Africa, drawing crowds to the coast", "url": "https://www.euronews.com/video/2026/10/07/southern-right-whales-return-to-south-africa-drawing-crowds-to-the-coast", "fonte_id": "euronews", "data_pub": "2026-10-07T19:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Baleias-jubarte retornaram à África do Sul, atraíndo multidões aos penhascos e ao festival de baleias em Hermanus, enquanto as mães amamentam seus recém-nascidos na Baía Walker.", "titulo_pt": "Baleias-jubarte retornam à áfrica do sul, atraindo multidões e festival", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 201573, "titulo": "Unexpected beach guest: Elephant seal draws crowds in Rio", "url": "https://www.euronews.com/video/2026/10/07/unexpected-beach-guest-elephant-seal-draws-crowds-in-rio", "fonte_id": "euronews", "data_pub": "2026-10-07T18:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um foca-dos-sul surpreendeu banhistas na praia de Copacabana no Rio de Janeiro, atraindo multidões, fotos e buzz nas redes sociais. Autoridades estabeleceram barreiras para proteger o animal.", "titulo_pt": "Surpreso na praia: foca-dos-sul atrai multidões no Rio de janeiro", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 201309, "titulo": "‘Catastrophic wildfire loop’ after colonisation left parts of Australia more at risk from bushfires, study finds", "url": "https://www.theguardian.com/environment/2026/oct/08/colonisation-wildfire-loop-australia-climate-bushfires", "fonte_id": "guardian_world", "data_pub": "2026-10-07T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo descobriu que a mudança de floresta aberta para floresta densa após 1788 aumentou o risco de incêndios mais intensos, coincidindo com a perda das práticas de queima cultural. Essa transformação do uso do solo causada pela colonização criou um 'loop de incêndios catastróficos' que tornou a Austrália sudeste mais propensa a incêndios florestais alimentados pelo clima.", "titulo_pt": "Ciclo de incêndios catastróficos após a colonização aumentou o risco de grandes focos de fogo na austrália sudeste", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 201681, "titulo": "Singapore’s air pollution worst in world as haze shuts Malaysia schools", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3370091/singapores-air-pollution-worst-world-haze-shuts-malaysia-schools?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-07T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A poluição do ar em Singapura atingiu o nível mais alto do mundo dev const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
