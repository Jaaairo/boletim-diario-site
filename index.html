<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>
const D = {"gerado_em": "26/07/2026 15:53", "stats": {"noticias_novas": 484, "resumos_gerados": 211}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A eleição presidencial no Brasil está tomando novas direções com a candidatura do governador de Goiás, Ronaldo Caiado (PSD), que lançou Gilberto Kassab como vice. Caiado, que busca reeleição após liderar o PSD por quase meio século, criticou diretamente Luiz Inácio Lula da Silva e seu vice Flávio Dino em seu discurso de lançamento. O PDT se sentiu humilhado ao ser preterido nas suplências para o Senado em São Paulo e ameaça lançar candidatos próprios como forma de resposta. Em um movimento que reflete a polarização política, Caiado também chamou Flávio Dino de 'kinder ovo' durante a convenção do PSD. Além disso, o Ministério Público Federal abriu um inquérito para investigar possíveis irregularidades em uma emenda parlamentar no Acre, coordenada pelo deputado Zezinho Barbary (PP), enquanto parlamentares do PT acionaram a Procuradoria-Geral da República por conta de uma participação estrangeira e pela presença de inteligência artificial simulando Jair Bolsonaro em um evento político realizado pelo senador Flávio Bolsonaro.", "mundo": "Em Berlim, uma série de eventos violentos marcou o Festival do Orgulho LGBTQ+ na Alemanha. Uma furgonete atingiu os participantes da marcha, resultando em uma morte e 29 feridos. O suspeito foi morto durante uma operação policial que classificou o incidente como um ataque terrorista islâmico. Paralelamente, áreas centrais da Espanha enfrentam severos incêndios florestais, com mais de 90 mil pessoas sendo evacuadas ou confinadas em Madrid, Ávila e Toledo. O conflito entre Brasil e Argentina intensificou-se quando o governo brasileiro convocou seu embaixador na Argentina após Javier Milei fazer insultos contra o presidente Lula. Além disso, Donald Trump publicou um artigo no Washington Post criticando a política tarifária dos Estados Unidos contra o Brasil, afirmando que as práticas seriam prejudiciais à economia norte-americana e que a postura ideológica do governo americano visa interferir na política brasileira.\n\nOs conflitos geopolíticos continuam em várias partes do mundo. Na Ucrânia, ataques aéreos russos causaram mortes civis e intensificaram o conflito, com Kiev sendo atingida por mísseis. O Irã suspendeu seus ataques após os Estados Unidos terem parado de bombardear, enquanto negocia com Omã para estabelecer novas regras no Estreito de Ormuz. Israel intensificou suas operações em Gaza, matando dois oficiais do Hamas e causando incêndios em mesquitas palestinas. Na África do Norte, incêndios florestais maiores ocorrem devido ao calor extremo, enquanto o conflito no Darfur avança com ações raciais. No Mar do Sul da China, um navio afundou deixando 17 desaparecidos, enquanto as Filipinas, Japão e Estados Unidos realizaram exercícios militares conjuntos. A tensão persiste entre Washington e Teerã, com os Estados Unidos pausando os ataques aéreos contra o Irã, mas mantendo o bloqueio naval na região do Estreito de Ormuz.", "economia": "A Qualcomm planeja aumentar os preços de seus produtos em duas dígitos, impactando diretamente o setor tecnológico. O Banco de Brasília (BRB) assumiu um empréstimo concedido pelo Banco Master para a empresa 3D Minerals, que possui as garantias oferecidas por ações da maior área de exploração de minerais críticos do Brasil, refletindo o interesse do setor financeiro na indústria mineral. A Samsung fechou um contrato de mais de US$ 20 bilhões para fornecer chips à Broadcom, aumentando sua participação no mercado de infraestrutura de inteligência artificial. Além disso, a China ampliou seu investimento em projetos verdes no âmbito da Iniciativa Cinturão e Rota (BRI), atingindo um recorde de US$ 20,1 bilhões no primeiro semestre de 2026, enquanto a guerra dos Estados Unidos contra o Irã aumenta a demanda por energias renováveis mais baratas. O setor industrial da bolsa de valores está beneficiando-se do boom na infraestrutura de IA, com sua razão P/E próxima dos níveis tecnológicos e flúidos de investidores fortes.", "tecnologia": "A tecnologia está avançando em várias direções importantes. A empresa OpenAI, liderada por Sam Altman, viajará para Washington esta semana para apresentar seu modelo de inteligência artificial (IA) mais avançado ao governo americano, buscando uma aprovação rápida após um suposto ataque cibernético inédito. Em contraste, a crise de hardware tem levantado questões sobre custos e benefícios na montagem de PCs, com a memória RAM aumentando mais do que cinco vezes nos últimos anos. Além disso, uma inovação promissora é a tecnologia de fechaduras digitais sem bateria, oferecendo segurança adicional mesmo em situações de baixa energia. Outros temas abordados incluem a redução dos custos de factoring por meio da IA, a possibilidade de um iPad mini resistente à água da Apple e a disponibilidade de caixas de som Bluetooth promocionais na Amazon, entre outros produtos tecnológicos em promoção.", "ciencia": "Um estudo da American Heart Association confirmou os benefícios do café para a saúde humana, gerando surpresa no divulgador. O relatório discute a quantidade segura de consumo, os possíveis benefícios e como o método de preparo influencia os resultados. Além disso, pesquisadores desenvolveram um aspirador de DNA que pode coletar traços genéticos de animais do ar, revelando quais espécies habitam uma área e permitindo mapear a biodiversidade local na Dinamarca. Na pesquisa científica, cientistas utilizaram CRISPR para tornar as células do câncer de próstata mais visíveis e suscetíveis ao sistema imunológico, melhorando dramaticamente o efeito da imunoterapia em experimentos com camundongos. Este tratamento experimental poderia oferecer esperança para outros tipos de tumores difíceis de tratar.", "cultura": "A semana global foi repleta de diversos eventos. A última vencedora do Miss Universo e as candidatas para 2026 foram apresentadas, com o concurso marcado para Puerto Rico, um evento que promete atrair muita atenção internacional. Em outro destaque, a inclusão do Monte Olympus na lista do Patrimônio Mundial da Unesco foi celebrada na Grécia após uma espera de 12 anos, reforçando seu status como local mitológico importante. No mundo dos negócios e entretenimento, o lançamento do podcast 'Drive Thru Magic', com Daniel J. Kim e Danielle Kennedy, marcou um passo significativo para a produção de conteúdo gay de ficção. A turnê da cantora Kacey Musgraves teve algumas apresentações removidas devido à alta demanda, enquanto a banda Roxette cancelou sua turnê de 40 anos na América do Norte, impactando os planos dos fãs. No âmbito artístico, o Cença Pizza Bar em Curitiba transformou um edifício histórico em uma casa vibrante para socialização e descobertas, destacando a importância da revitalização urbana. Além disso, a Sinfônica de Londres apresentou um concerto sob a regência de John Wilson, com destaque para a Sinfonia Romana de Respighi, que recebeu excelentes críticas.", "sociedade": "A governadora Kathy Hochul, de Nova York, anunciou que o estado serviu 396 milhões de refeições escolares gratuitas e economizou cerca de 450 milhões de dólares mensais em custos para as famílias, beneficiando aproximadamente 2,7 milhões de alunos. Um incidente envolvendo um desabamento em uma obra de condomínio de luxo no Morumbi foi registrado como homicídio culposo e lesão corporal culposa, com a investigação em andamento para esclarecer as circunstâncias do acidente que resultou na morte de um trabalhador. Em São Paulo, o último suspeito envolvido no assalto que levou à tentativa de homicídio de um tenente do Exército foi preso, encerrando a investigação deste caso.", "meio_ambiente": "Incêndios florestais na França e Espanha obrigaram a evacuação de mais de 325 mil pessoas, com as chamas se alastrando rapidamente devido ao solo e vegetação secos, além de uma onda de calor intensa. As autoridades francesas e espanholas estão lutando para controlar os focos de fogo, que em parte são causados por sucessivas ondas de calor. Milhares de bombeiros, principalmente voluntários, estão combatendo um grande incêndio perto da cidade vitivinícola de Bordeaux. Em outro desenvolvimento, o desmatamento na Amazônia diminuiu: entre janeiro e junho, 588 áreas protegidas mantiveram sua integridade, enquanto apenas uma terra indígena e sete unidades de conservação perderam mais de 1 km² de floresta no período. O 'super' El Niño está previsto para causar danos combinados entre US$10 bilhões e US$20 bilhões em países afetados, possivelmente levando a uma massiva migração de áreas duramente impactadas. Meteorologistas alertam que o padrão climático El Niño, frequentemente associado a secas severas, inundações e tempestades na África, pode se tornar um dos mais intensos já observados se as tendências de aquecimento do Oceano Pacífico continuarem.", "direitos_humanos": "Um ataque ocorrido durante a Berlin Pride na Alemanha é suspeito de ser um ato de terrorismo islâmico, conforme indicam as investigações. A polícia local está buscando os suspeitos após o incidente que deixou uma morte e vários feridos. Em outro desenvolvimento, no Irã, uma escola em Minab registrou a morte de 120 crianças em um ataque quase cinco meses atrás, levantando questões sobre direitos humanos. No Chile, um artigo debate a responsabilidade penal para adolescentes, abordando a relação entre juventude, violência e o problema que isso representa. Finalmente, Donald Trump criticou LeBron James, sugerindo que ele 'talvez seja racista', em uma troca de palavras com o jogador de basquete americano."}, "resumo_do_dia": {"politica_nacional": [{"id": 73578, "titulo": "A nova armadilha institucional", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/marcus-melo/2026/07/a-nova-armadilha-institucional.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-26T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A eleição presidencial atual é singular, com o presidente da República, de 80 anos, buscando a reeleição após liderar um partido por quase meio século. Esta dependência em relação a uma única liderança é excepcional nas democracias atuais.", "titulo_pt": "Nova armadilha institucional", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 73579, "titulo": "PDT se diz humilhado após ser preterido em suplências ao Senado de SP e ameaça lançar candidatos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/pdt-se-diz-humilhado-apos-ser-preterido-em-suplencias-ao-senado-de-sp-e-ameaca-lancar-candidatos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-26T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PDT se sente humilhado após ser preterido nas suplências ao Senado de São Paulo pela coligação do PT comandada por Fernando Haddad. O partido ameaça lançar seus próprios candidatos em resposta a essa situação.", "titulo_pt": "PDT se diz humilhado e ameaça lançar candidatos após ser preterido em suplências ao Senado de SP", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 73593, "titulo": "PSD lança Caiado à Presidência e mira rejeição de Lula e Flávio", "url": "https://www.poder360.com.br/poder-eleicoes-2026/psd-lanca-caiado-a-presidencia-e-mira-rejeicao-de-lula-e-flavio/", "fonte_id": "poder360", "data_pub": "2026-07-26T17:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-governador de Goiás, Ronaldo Caiado, lançou sua candidatura à Presidência do Brasil com o apoio de João Paulo Kassab. A campanha almeja desviar a rejeição que o presidente Luiz Inácio Lula da Silva e seu vice Flávio Dino enfrentam.", "titulo_pt": "PSD lança Caiado à Presidência visando rejeição de Lula e Flávio", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 73594, "titulo": "Assista a íntegra do 1º discurso de Caiado à imprensa como candidato", "url": "https://www.poder360.com.br/poder-eleicoes-2026/assista-a-integra-do-1o-discurso-de-caiado-a-imprensa-como-candidato/", "fonte_id": "poder360", "data_pub": "2026-07-26T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-governador do PSD fez seu primeiro discurso como candidato, criticando Lula e Flávio Bolsonaro, defendendo uma 'mão pesada' na segurança pública e apresentando suas prioridades.", "titulo_pt": "Assista ao 1º discurso de Caiado à imprensa como candidato", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 73609, "titulo": "Caiado chama Lula de \"agiota\", evita nome de Flávio, mas dá indiretas", "url": "https://www.metropoles.com/sao-paulo/caiado-chama-lula-de-agiota-evita-nome-de-flavio-mas-da-indiretas", "fonte_id": "metropoles", "data_pub": "2026-07-26T17:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-governador de Goiás, Ronaldo Caiado, lançou sua candidatura neste domingo. Durante a campanha, ele evitou mencionar diretamente o nome do ex-presidente Lula, mas fez críticas indiretas ao chamá-lo de 'agiota'.", "titulo_pt": "Caiado chama Lula de 'agiota', evita nome de Flávio, mas dá indiretas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 73595, "titulo": "Estrategista da XP diz estar otimista com a Bolsa em 2027", "url": "https://www.poder360.com.br/poder-economia/estrategista-da-xp-diz-estar-otimista-com-a-bolsa-em-2027/", "fonte_id": "poder360", "data_pub": "2026-07-26T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Raphael Figueiredo, estrategista da XP, expressou esperança de que a redução dos juros e o investimento de capital estrangeiro mantenham a Bolsa em alta no ano 2027.", "titulo_pt": "Estrategista da XP é otimista com a Bolsa em 2027", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 73612, "titulo": "Kalil sobre adversários: \"Não gostam de mim por não gostar de coisa errada\"", "url": "https://www.metropoles.com/minas-gerais/kalil-sobre-adversarios-nao-gostam-de-mim-por-nao-gostar-de-coisa-errada", "fonte_id": "metropoles", "data_pub": "2026-07-26T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Kalil oficializou sua candidatura pelo PDT em uma convenção realizada na Assembleia de Minas. O político comentou sobre seus adversários, afirmando que eles não o gostam porque ele se opõe a coisas erradas.", "titulo_pt": "Kalil sobre adversários: 'não gostam de mim por não gostar de coisa errada'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 73713, "titulo": "Parlamentares do PT acionam PGR por Milei e IA de Bolsonaro em evento de Flávio", "url": "https://www.infomoney.com.br/politica/parlamentares-do-pt-acionam-pgr-por-milei-e-ia-de-bolsonaro-em-evento-de-flavio/", "fonte_id": "infomoney", "data_pub": "2026-07-26T17:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Parlamentares do Partido dos Trabalhadores (PT) acionaram a Procuradoria-Geral da República (PGR) por conta de uma participação estrangeira em um evento político e por causa de uma inteligência artificial que simulou o ex-presidente Jair Bolsonaro. O evento foi realizado pelo senador Flávio Bolsonaro.", "titulo_pt": "Parlamentares do PT acionam PGR por Milei e IA de Bolsonaro em evento de Flávio", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 73640, "titulo": "PT pede que PGR apure Bolsonaro em IA e presença de Milei ao lado de Flávio", "url": "https://veja.abril.com.br/politica/pt-pede-que-pgr-apure-bolsonaro-em-ia-e-presenca-de-milei-ao-lado-de-flavio/", "fonte_id": "veja", "data_pub": "2026-07-26T17:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PT solicitou ao Procurador-Geral da República que investigue Bolsonaro e a presença de Milei na convenção do PSL. O Ministério Público será responsável por avaliar se houve crimes eleitorais durante o evento.", "titulo_pt": "PT pede investigação de Bolsonaro e Milei no psl", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 73641, "titulo": "MPF abre inquérito para investigar irregularidades em emenda parlamentar no Acre", "url": "https://veja.abril.com.br/brasil/mpf-abre-inquerito-para-investigar-irregularidades-em-emenda-parlamentar-no-acre/", "fonte_id": "veja", "data_pub": "2026-07-26T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público Federal (MPF) abriu um inquérito para investigar possíveis irregularidades em uma emenda parlamentar destinada ao Acre, especificamente relacionadas a uma obra em Porto Walter, coordenada pelo deputado Zezinho Barbary, do PP.", "titulo_pt": "MPF abre inquérito sobre irregularidades em emenda parlamentar no Acre", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 73596, "titulo": "Juros altos reduzem consumo, diz fundador da Smart Fit", "url": "https://www.poder360.com.br/poder-economia/juros-altos-reduzem-consumo-diz-fundador-da-smart-fit/", "fonte_id": "poder360", "data_pub": "2026-07-26T16:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O fundador da Smart Fit, Edgard Corona, afirmou que manter um caixa robusto e dívidas de longo prazo permitem lidar com a situação atual de juros altos. Ele destaca a importância dessas estratégias financeiras para enfrentar o cenário econômico.", "titulo_pt": "Fundador da Smart Fit afirma que juros altos reduzem consumo", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 73577, "titulo": "PSD oficializa candidatura de Caiado à presidência da República", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-07/psd-oficializa-candidatura-de-caiado-presidencia-da-republica", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-07-26T16:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido Social Democrático (PSD) oficializou a candidatura de Ronaldo Caiado, ex-governador de Goiás, à presidência da República. A chapa inclui o líder da legenda, Gilberto Kassab, como candidato a vice-presidente.", "titulo_pt": "PSD oficializa candidatura de Caiado à presidência", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 73737, "titulo": "Quem são os pré-candidatos ao governo do Rio de Janeiro (RJ) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-pre-candidatos-ao-governo-do-rio-de-janeiro-rj-nas-eleicoes-2026-julho", "fonte_id": "jota", "data_pub": "2026-07-26T16:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nove nomes estão atualmente em disputa para as eleições ao governo do Rio de Janeiro em 2026. O Palácio Guanabara será o palco da disputa entre esses possíveis candidatos.", "titulo_pt": "Quem são os pré-candidatos ao governo do Rio de Janeiro nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 73618, "titulo": "Zambelli rebate deputado italiano e garante que não fugiu da Justiça", "url": "https://www.metropoles.com/mundo/zambelli-rebate-deputado-italiano-e-garante-que-nao-fugiu-da-justica", "fonte_id": "metropoles", "data_pub": "2026-07-26T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ex-deputada federa  "Itália", "classe": "A"}, {"id": 73711, "titulo": "Irã segue EUA e suspende ataques enquanto negocia com Omã novas regras para Ormuz", "url": "https://www.infomoney.com.br/mundo/ira-segue-eua-e-suspende-ataques-enquanto-negocia-com-oma-novas-regras-para-ormuz/", "fonte_id": "infomoney", "data_pub": "2026-07-26T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Irã suspendeu seus ataques após os Estados Unidos terem parado de atacar desde o final da sexta-feira, sem explicações. O país está negociando com Omã para estabelecer novas regras no Estreito de Ormuz.", "titulo_pt": "Irã segue EUA e suspende ataques enquanto negocia com Omã novas regras para Ormuz", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 73608, "titulo": "UP oficializa candidatura de Samara Martins à Presidência da República", "url": "https://www.metropoles.com/brasil/up-oficializa-candidatura-de-samara-martins-a-presidencia-da-republica", "fonte_id": "metropoles", "data_pub": "2026-07-26T17:34:00Z", "idioma": "pt", "provavel_duplicata_de": 73577, "texto_pt": "Samara Martins, ativista dos movimentos negro e feminino, oficializou sua candidatura à Presidência da República. Ela deve ser a única mulher concorrendo ao cargo neste ano.", "titulo_pt": "UP oficializa candidatura de Samara Martins à Presidência", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 73954, "titulo": "Berlin Pride ramming: Suspect shot dead in police operation", "url": "https://www.dw.com/en/berlin-pride-ramming-suspect-shot-dead-in-police-operation/live-78117180?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-07-26T17:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um suspeito foi morto durante uma operação policial após um incidente ser classificado como ataque terrorista islâmico. Durante o incidente, uma pessoa morreu e várias outras ficaram feridas.", "titulo_pt": "Suspeito morto em operação policial após incidente classificado como ataque terrorista islâmico", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 73749, "titulo": "Como a Escócia foi de 'capital de assassinatos' da Europa a um dos lugares mais seguros do mundo", "url": "https://www.bbc.com/portuguese/articles/cyv0d28je13o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-07-26T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No início dos anos 2000, a Escócia era considerada uma das capitais de assassinatos da Europa, com um índice de agressão três vezes maior que nos Estados Unidos. Através do tratamento da violência como problema de saúde pública, o país reduziu significativamente esses índices e hoje é considerado um dos lugares mais seguros do mundo.", "titulo_pt": "Como a Escócia foi de 'capital de assassinatos' da Europa a um dos lugares mais seguros do mundo", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 73960, "titulo": "Media, 'polizia tedesca fa irruzione, l'attentatore è morto'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/26/media-polizia-tedesca-fa-irruzione-lattentatore-e-morto_7dd2cf2d-70d8-4db3-8282-21a300b975a3.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-26T17:20:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A polícia alemã realizou uma operação de irrompência e o suspeito morreu. Os agentes foram atacados e responderam com fogo.", "titulo_pt": "Polícia alemã realiza irrupção, suspeito morto", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 73971, "titulo": "2 dead in Ukraine from Russian attacks; 4 killed in Russian-held area hit by Ukraine", "url": "https://www.scmp.com/news/world/europe/article/3361916/2-dead-ukraine-russian-attacks-4-killed-russian-held-area-hit-ukraine?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-26T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Missiles russos atingiram Ki ge as chemical 'keystones' that steer life's communities", "url": "https://phys.org/news/2026-07-molecules-emerge-chemical-keystones-life.html", "fonte_id": "phys_org", "data_pub": "2026-07-26T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa de Dr. Erika C. Freeman, publicada na Trends in Ecology & Evolution, sugere que uma pequena quantidade de moléculas raras pode moldar comunidades biológicas inteiras, desempenhando um papel crucial apesar da escassez. Essas moléculas são chamadas por ecologistas de 'moléculas keystone'.", "titulo_pt": "Moléculas trace emergem como 'chaves' químicas que direcionam as comunidades vivas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 74019, "titulo": "A quantum heat engine that simultaneously provides work and refrigeration", "url": "https://phys.org/news/2026-07-quantum-simultaneously-refrigeration.html", "fonte_id": "phys_org", "data_pub": "2026-07-26T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um motor quântico de calor opera simultaneamente como um motor que produz trabalho e como um refrigerador. As leis da termodinâmica estabelecem que o calor naturalmente flui de sistemas mais quentes para sistemas mais frios até atingir um estado de equilíbrio térmico.", "titulo_pt": "Um motor quântico de calor que fornece trabalho e refrigeração ao mesmo tempo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 73720, "titulo": "Astronautas dos EUA e Rússia retornam da Estação Espacial Internacional após oito meses no espaço", "url": "https://olhardigital.com.br/2026/07/26/ciencia-e-espaco/astronautas-dos-eua-e-russia-retornam-da-estacao-espacial-internacional-apos-oito-meses-no-espaco/", "fonte_id": "olhar_digital", "data_pub": "2026-07-26T15:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Três astronautas, entre eles americanos e russos, retornaram à Terra com segurança após passarem oito meses na Estação Espacial Internacional a /redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/07/autores-investigam-raizes-africanas-ao-analisar-traumas-paternos-na-flip.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-07-26T15:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dois autores, Ernesto Mané e Ève Guerra, participaram de uma mesa na Festa Literária Internacional de Paraty (Flip) para discutir como a literatura os ajudou a explorar suas raízes africanas e lidar com traumas familiares. Eles compartilharam sua jornada de se apropriarem das histórias perdidas relacionadas ao pai.", "titulo_pt": "Autores investigam raízes africanas ao analisar traumas paternos na Flip", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 74042, "titulo": "‘Rick and Morty’ Spinoff ‘President Curtis’ Plays It Safe, but Keeps the Sci-Fi Franchise Cruising: TV Review", "url": "https://variety.com/2026/tv/reviews/president-curtis-review-rick-and-morty-spinoff-1236817266/", "fonte_id": "variety", "data_pub": "2026-07-26T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A série spinoff 'President Curtis' segue rapidamente o sucesso de 'Rick and Morty', mantendo a franquia de ficção científica em movimento com episódios curtos. O passagem de bastão entre os personagens é eficiente, mas limitada ao formato breveto do show original.", "titulo_pt": "‘Presidente Curtis’ segue o sucesso rápido da ‘rick and Morty’, mantendo a franquia em movimento", "veiculo": "Variety", "pais": "EUA", "classe": "C"}], "cultura__eventos": [], "sociedade": [{"id": 73740, "titulo": "Kathy Hochul lo oficializó: Nueva York sirvió 396 millones de comidas escolares gratuitas y miles de familias ahorraron hasta 3.000 dólares al año", "url": "https://www.clarin.com/estados-unidos/kathy-hochul-oficializo-nueva-york-sirvio-396-millones-comidas-escolares-gratuitas-miles-familias-ahorraron-3000-dolares-ano_0_MCu8fKWg38.html", "fonte_id": "clarin", "data_pub": "2026-07-26T17:39:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A governadora Kathy Hochul anunciou que Nova York serviu 396 milhões de refeições escolares gratuitas e economizou famílias cerca de 450 milhões de dólares mensais. Cerca de 2,7 milhões de alunos receberam desayuno e almuerzo em 2.500 escolas do estado.", "titulo_pt": "Kathy Hochul oficializou: nova York serviu 396 milhões de refeições escolares gratuitas e economizou famílias até 3.000 dólares ao ano", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 73611, "titulo": "Desabamento em obra que matou trabalhador é investigado como homicídio", "url": "https://www.metropoles.com/sao-paulo/desabamento-obra-soldador-homicidio", "fonte_id": "metropoles", "data_pub": "2026-07-26T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um desabamento em uma obra de condomínio de luxo no Morumbi foi registrado como um caso de homicídio culposo e lesão corporal culposa. A investigação está sendo conduzida para esclarecer as circunstâncias do acidente que resultou na morte de um trabalhador.", "titulo_pt": "Desabamento em obra de condomínio de luxo no morumbi é investigado como homicídio", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 73844, "titulo": "Carmona acusa que el gobierno “no estuvo a la altura” ante el sistema frontal y pide fortalecer el rol de los municipios", "url": "https://www.latercera.com/politica/noticia/carmona-acusa-que-el-gobierno-no-estuvo-a-la-altura-ante-el-sistema-frontal-y-pide-fortalecer-el-rol-de-los-municipios/", "fonte_id": "la_tercera", "data_pub": "2026-07-26T17:15:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente do Partido Comunista acusa o governo de não ter respondido adequadamente à passagem do sistema frontal. Ele também critica o projeto de Reconstrução Nacional, considerando-o uma 'outra catástrofe' política.", "titulo_pt": "Carmona acusa governo e crit  em Arica, deixando quatro pessoas feridas. Uma das vítimas está em situação crítica e o Equipo ECOH está investigando se os dois incidentes estão ligados.", "titulo_pt": "Fiscalia investiga dois ataques a balas que deixaram quatro feridos no litoral de Arica", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 73750, "titulo": "Como Itália foi de modelo de alimentação saudável a explosão de obesidade", "url": "https://www.bbc.com/portuguese/articles/cj9devgpj94o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-07-26T14:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A dieta mediterrânea era considerada um modelo de vida saudável, mas crianças italianas são algumas das que apresentam maior índice de sobrepeso na Europa, conforme relatório da OMS.", "titulo_pt": "Como a Itália passou de modelo alimentar saudável para ter altos índices de obesidade entre as crianças", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 73152, "titulo": "La evidencia genética fue la clave para identificar a un abusador serial que comenzó a atacar en 2010", "url": "https://www.lanacion.com.ar/seguridad/la-evidencia-genetica-fue-la-clave-para-identificar-a-un-abusador-serial-que-comenzo-a-atacar-en-nid26072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-26T10:41:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Oral Criminal de Quilmes condenou Sebastián Figueroa, um marplatense de 40 anos, a 30 anos de prisão por ser considerado responsável pelo abuso serial que começou em 2010. A evidência genética foi crucial para identificá-lo como o agressor.", "titulo_pt": "Evidências genéticas levaram à condenação de estuprador serial", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 73236, "titulo": "Luis Cordero: “La trayectoria del gremialismo permite entender mejor el gobierno de Kast que la importación de patrones extranjeros”", "url": "https://www.latercera.com/politica/noticia/luis-cordero-la-trayectoria-del-gremialismo-permite-entender-mejor-el-gobierno-de-kast-que-la-importacion-de-patrones-extranjeros/", "fonte_id": "la_tercera", "data_pub": "2026-07-26T10:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Luis Cordero, exministro de Segurança chileno, discorda da comparação entre o governo de Kast e figuras como Trump ou Milei. Ele sugere que as claves para entender o atual governo são locais e não importam de países estrangeiros.", "titulo_pt": "Luis Cordero: 'a trajetória do gremialismo permite entender melhor o governo de Kast que a importação de padrões extranjeros'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 73049, "titulo": "Inscrições para cursos gratuitos da Faetec EAD terminam neste domingo (26)", "url": "https://www.cnnbrasil.com.br/educacao/inscricoes-para-cursos-gratuitos-da-faetec-ead-terminam-neste-domingo-26/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-26T09:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Fundação de Apoio à Escola Técnica do Rio oferece 15 mil vagas para cursos gratuitos pela internet. As inscrições terminam neste domingo (26).", "titulo_pt": "Inscrições para cursos gratuitos da Faetec EAD terminam neste domingo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 73523, "titulo": "Man convicted of abetting suicide in wife's death", "url": "https://www.koreaherald.com/article/10820438", "fonte_id": "korea_herald", "data_pub": "2026-07-26T05:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem de meia-idade na Coreia do Sul foi condenado a uma pena suspensa de 18 meses por auxiliar no suicídio da esposa, que faleceu. O casal havia feito um pacto de morte após sofrerem perdas financeiras em um golpe de phishing voz em agosto de 2025.", "titulo_pt": "Homem condenado por auxiliar no suicídio da esposa", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 73473, "titulo": "Hong Kong expands after-school care but some families say they still lack access", "url": "https://www.scmp.com/news/hong-kong/education/article/3361859/hong-kong-expands-after-school-care-some-families-say-they-still-lack-access?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-26T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O esquema de cuidados após as aulas em Hong Kong expandiu-se rapidamente este ano, com alguns operadores dizendo que têm capacidade suficiente para atender à demanda. No entanto, limitações de mão-de-obra em alguns centros impediram que todas as famílias elegíveis acessassem o programa.", "titulo_pt": "Hong Kong amplia serviços de cuidados após as aulas, mas falta acesso para algumas famílias", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 72932, "titulo": "Longevidade muda dinâmica das famílias, e avós assumem mais cuidados e gastos com netos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/longevidade-muda-dinamica-das-familias-e-avos-assumem-mais-cuidados-e-gastos-com-netos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-26T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A longevidade está mudando a dinâmica familiar, com avós assumindo mais responsabilidades e gastos com os netos. Izede Zago, aos 77 anos, cuida do neto Theo, que leva as refeições para o trabalho.", "titulo_pt": "Longevidade altera dinâmica das famílias, com avós assumindo mais cuidados e gastos com netos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 72934, "titulo": "Conta de lixo enfrenta resistência em municípios, e vereadores derrubam taxa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/conta-de-lixo-enfrenta-resistencia-em-municipios-e-vereadores-derrubam-taxa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-26T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Municípios brasileiros têm aprovado leis para derrubar a cobrança da taxa do lixo, também conhecida como conta de lixo. Essas medidas enfrentam resistência e já foram adotadas por vereadores em diversos locais.", "titulo_pt": "Leis contra taxa do lixo são aprovadas em municípios", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 73991, "titulo": "Typhoon Noul weakens as it lashes southern China", "url": "https://www.taipeitimes.com/News/front/archives/2026/07/27/2003861439", "fonte_id": "taipei_times", "data_pub": "2026-07-27T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O furacão Noul enfraqueceu enquanto atingia o sul da China com fortes ventos e chuvas intensas.", "titulo_pt": "Typhoon Noul enfraquece ao castigar sul da China", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 73896, "titulo": "France fires: 'What burns is not just forests, but a way of inhabiting the land that is no longer possible'", "url": "https://www.lemonde.fr/en/opinion/article/2026/07/26/france-fires-what-burns-is-not-just-forests-but-a-way-of-inhabiting-the-land-that-is-no-longer-possible_6755855_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-26T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Philósofos e políticos franceses argumentam que a preparação para os incêndios florestais atuais não se limita à adaptação técnica, mas pode se tornar um ato democrático. Essa perspectiva sugere que o enfrentamento dos incêndios é mais do que uma questão de segurança, envolvendo também questões sociais e políticas.", "titulo_pt": "Incêndios florestais na França: 'o que arde não são apenas as florestas, mas um modo de habitar a terra que já não é possível'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 73669, "titulo": "Frio pode aumentar em até 30% o risco de infarto, alerta cardiologista", "url": "https://www.cnnbrasil.com.br/saude/frio-pode-aumentar-em-ate-30-o-risco-de-infarto-alerta-cardiologista/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-26T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Baixas temperaturas podem aumentar em até 30% o risco de infarto, conforme alerta dado por um cardiologista. As baixas temperaturas causam vasoconstrição e elevam a pressão arterial, levando a eventos cardiovasculares graves, especialmente em pessoas com fatores de risco.", "titulo_pt": "Frio pode aumentar em até 30% o risco de infarto, alerta cardiologista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 73624, "titulo": "Incêndios na França e Espanha obrigam 325 mil pessoas a deixarem suas casas", "url": "https://www.brasildefato.com.br/2026/07/26/incendios-na-franca-e-espanha-obrigam-325-mil-pessoas-a-deixarem-suas-casas/", "fonte_id": "brasil_de_fato", "data_pub": "2026-07-26T15:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Incêndios florestais no sul da França e na Espanha, próximos a regiões turísticas, obrigaram 325 mil pessoas a deixarem suas casas. O fogo se alastrou rapidamente devido ao solo e vegetação secos, além de uma onda de calor intensa.", "titulo_pt": "Incêndios na França e Espanha forçam 325 mil pessoas a deixarem suas casas", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 73934, "titulo": "More than 360,000 evacuated as wildfires rage in France and Spain", "url": "https://www.aljazeera.com/news/2026/7/26/more-than-360000-evacuated-as-wildfires-rage-in-france-and-spain?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-26T14:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 360 mil pessoas foram evacuadas devido às chamas que estão avançando na França e Espanha. As autoridades francesas e espanholas estão lutando para controlar os incêndios, que em parte são causados por ondas sucessivas de calor.", "titulo_pt": "Mais de 360 mil evacuados com incêndios florestais queimando França e Espanha", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 74014, "titulo": "Wildfires in France drive 250,000 people from their homes and creep toward wine city of Bordeaux", "url": "https://www.koreaherald.com/article/10820623", "fonte_id": "korea_herald", "data_pub": "2026-07-26T12:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio florestal no sul da França forçou a evacuação de 55.000 pessoas durante a noite, elevando o número total de deslocados em uma única região para 220.000. As chamas se aproximam da cidade vitivinícola de Bordéus. Em Espanha, também houve evacuações por causa do fogo na costa leste.", "titulo_pt": "Incêndios no sul da França desalojam 250 mil pessoas e ameaçam região vinícola de Bordeaux", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 73952, "titulo": "‘Violent’ wildfires rage close to French and Spanish cities", "url": "https://www.ft.com/content/e5bf56e2-9ad1-4778-a25b-9fbe7a3f9eb8?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-26T11:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 335 mil pessoas foram evacuadas devido a piores incêndios florestais. Os focos de fogo estão próximos às cidades francesas e espanholas.", "titulo_pt": "Incêndios violentos atingem áreas próximas a cidades francesas e espanholas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 73313, "titulo": "Thousands of firefighters are battling the monster blaze near Bordeaux. Their commanders are dealing with a huge coordination challenge", "url": "https://www.lemonde.fr/en/environment/article/2026/07/26/thousands-of-firefighters-are-battling-the-monster-blaze-near-bordeaux-from-all-sides-their-commanders-deal-with-a-huge-coordination-challenge_6755850_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-26T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de bombeiros, principalmente voluntários, estão lutando contra um grande incêndio perto de Bordeaux. Eles trabalham em condições árduas sem muita chance de descanso.", "titulo_pt": "Milhares de bombeiros combatem fogo gigante perto de Bordeaux", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 72991, "titulo": "Clima: domingo tem ar frio no Sul e Sudeste e seca em partes do país", "url": "https://www.metropoles.com/brasil/clima-domingo-tem-ar-frio-no-sul-e-sudeste-e-seca-em-partes-do-pais", "fonte_id": "metropoles", "data_pub": "2026-07-26T10:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O domingo apresenta ar frio no Sul e Sudeste do Brasil, além de seca em algumas regiões. A semana inicia com temperaturas mais baixas e variação de nuvens.", "titulo_pt": "Clima: domingo tem ar frio no Sul e Sudeste e seca em partes do país", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 73384, "titulo": "Photos: Wildfires in France drive 250,000 people from their homes", "url": "https://www.aljazeera.com/gallery/2026/7/26/photos-wildfires-in-france-drive-250000-people-from-their-homes?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-26T10:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos florestais na França obrigaram mais de 250 mil pessoas a deixarem suas casas. Na cidade de Bordeaux, 55 mil pessoas foram evacuadas durante a noite.", "titulo_pt": "Imagens: incêndios em França fazem 250 mil pessoas deixarem as casas", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 73457, "titulo": "‘Super’ El Nino: Africa facing mass migration, US$20 billion in damages", "url": "https://www.scmp.com/news/world/africa/article/3361891/super-el-nino-africa-facing-mass-migration-us20-billion-damages?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-26T09:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um 'super' El Niño está previsto para causar danos combinados entre US$10 bilhões e US$20 bilhões em países afetados da África, possivelmente levando a uma massiva migração de áreas duramente impactadas. Meteorologistas alertam que o padrão climático El Niño, frequentemente associado a severos secos, inundações e tempestades na África, pode se tornar um dos mais intensos já observados se as tendências de aquecimento do Oceano Pacífico continuarem.", "titulo_pt": "Super El niño: áfrica enfrentará grandes danos e possível onda de migração", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 73065, "titulo": "Desmatamento cai na Amazônia e 588 áreas protegidas ficam intactas no semestre", "url": "https://exame.com/esg/desmatamento-cai-na-amazonia-e-588-areas-protegidas-ficam-intactas-no-semestre/", "fonte_id": "exame", "data_pub": "2026-07-26T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O desmatamento na Amazônia diminuiu, com 588 áreas protegidas mantendo sua integridade entre janeiro e junho. Apenas uma terra indígena e sete unidades de conservação perderam mais de 1 km² de floresta no período.", "titulo_pt": "Desmatamento diminui na Amazônia e 588 áreas protegidas permanecem intactas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 73436, "titulo": "Strong winds and rain lash China after Typhoon Noul makes landfall", "url": "https://www.japantimes.co.jp/news/2026/07/26/asia-pacific/china-typhoon-noul/", "fonte_id": "japan_times", "data_pub": "2026-07-26T06:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças meteorológicas severas atingiram China após o Furacão Noul tocar terra. Autoridades evacuaram mais de 340 mil pessoas e suspenderam serviços de trabalho e ferrovia.", "titulo_pt": "Fortes ventos e chuva castigam China após furacão Noul fazer landfall", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 73350, "titulo": "Chickenpox sweeps Gaza camps as thousands of cases emerge in two weeks", "url": "http://www.euronews.com/2026/07/26/chickenpox-sweeps-gaza-camps-as-thousands-of-cases-emerge-in-two-weeks", "fonte_id": "euronews", "data_pub": "2026-07-26T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A varicela tem se propagado nas tendas do Gaza, com milhares de casos surgindo em duas semanas. Os médicos acreditam que o tamanho real da epidemia é maior, devido ao overcrowding e à falta de isolamento adequado, além do fato de muitos crianças nascidas durante o conflito não terem completado suas vacinas.", "titulo_pt": "Varicela atinge campos de Gaza com milhares de casos em duas semanas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 73246, "titulo": "Más de 340.000 personas evacuadas y decenas de vuelos cancelados tras la llegada del tifón Noul a China", "url": "https://www.latercera.com/mundo/noticia/mas-de-340000-personas-evacuadas-y-decenas-de-vuelos-cancelados-tras-la-llegada-del-tifon-noul-a-china/", "fonte_id": "la_tercera", "data_pub": "2026-07-26T04:58:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mais de 340.000 pessoas foram evacuadas e vários voos cancelados após o tifão Noul chegar à China. As autoridades locais declararam estado de alerta máximo e suspenderam as aulas, o trabalho, as atividades comerciais e o transporte público na província de Guangdong.", "titulo_pt": "Mais de 340.000 pessoas evacuadas e decenas de voos cancelados após chegada do tifão Noul à China", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 73247, "titulo": "Extienden alerta ambiental para este domingo en la Región Metropolitana por persistencia de malas condiciones de ventilación", "url": "https://www.latercera.com/nacional/noticia/extienden-alerta-ambiental-para-este-domingo-en-la-region-metropolitana-por-p function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
